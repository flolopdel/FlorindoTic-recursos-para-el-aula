# Construye el sitio en _site/ (solo lo publicable), lo valida y lo despliega en GitHub Pages.
# En las Pull Requests solo construye y valida; despliega únicamente desde main.

name: Build and deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'prompts/**'
      - 'private_content/**'
      - '**.md'
      - 'abrir-portal.cmd'
  pull_request:          # en PRs solo se construye y se valida, no se despliega
  workflow_dispatch:     # botón "Run workflow" para redesplegar a mano

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write   # para comentar la revisión automática en las PR

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # historial completo: la revisión de la PR compara con main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configurar Pages (obtiene la URL pública)
        id: pages
        uses: actions/configure-pages@v5

      - name: Construir sitio en _site/ (solo contenido publicable)
        run: >
          node scripts/build-site.mjs
          --out=_site
          --base-url=${{ steps.pages.outputs.base_url }}
          --strict

      - name: Resumen del build
        run: |
          {
            echo "### Build del Aula TIC"
            echo ""
            echo "- Páginas: $(jq .pages _site/version.json)"
            echo "- Tamaño publicado: $(du -sh _site | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar que no se publica nada privado
        run: |
          for p in private_content prompts scripts abrir-portal.cmd; do
            if [ -e "_site/$p" ]; then echo "::error::$p no debería publicarse"; exit 1; fi
          done

      - name: Revisar la PR (páginas cambiadas y estructura de las SdA)
        id: revision
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: >
          node scripts/revisar-pr.mjs
          --base=origin/${{ github.base_ref }}
          --base-url=${{ steps.pages.outputs.base_url }}
          --out=revision.md

      - name: Comentar la revisión en la PR
        if: github.event_name == 'pull_request' && always() && hashFiles('revision.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('revision.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previo = comments.find((c) => c.body.includes('<!-- revision-florindotic -->'));
            if (previo) await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fallar si la revisión encontró errores
        if: github.event_name == 'pull_request' && steps.revision.outcome == 'failure'
        run: |
          echo "::error::La revisión de la PR encontró errores (mira el comentario de la PR)."
          exit 1

      - name: Subir artefacto para Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
