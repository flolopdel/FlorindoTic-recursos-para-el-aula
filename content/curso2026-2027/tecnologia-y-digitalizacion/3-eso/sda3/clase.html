  }

:root[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2e; --ink:#e5e9f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#23304a;
  --brand:#2dd4bf; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
@media(max-width:760px){.top{overflow-x:auto}.top .ttl{display:none}.top .tb{flex:0 0 auto}select.tb{max-width:60vw}}
.top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.top .ttl small{font-weight:500;color:var(--muted);margin-left:8px}
.tb{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.tb:hover{border-color:var(--brand);color:var(--brand)}
.tb[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
select.tb{max-width:42vw}
/* ---------- índice */
.home{max-width:1180px;margin:0 auto;padding:28px 16px 48px}
.hero{background:linear-gradient(135deg,#134e4a,#1e3a8a);color:#fff;border-radius:18px;padding:28px 24px}
.hero h1{margin:6px 0;font-size:clamp(26px,4vw,40px);line-height:1.1}
.hero p{margin:6px 0;opacity:.92;font-size:18px}
.hero .k{font-size:13px;opacity:.8;letter-spacing:.04em;text-transform:uppercase}
.help{margin:14px 0 0;font-size:14px;opacity:.85}
.kbd{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:0 6px;font-size:12px;margin:0 2px}
.cards{display:grid;gap:14px;margin-top:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sc{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);border-top:6px solid var(--fc,var(--brand))}
.sc:hover{border-color:var(--fc,var(--brand));transform:translateY(-1px)}
.sc .n{font-size:13px;font-weight:700;color:var(--fc,var(--brand));text-transform:uppercase;letter-spacing:.04em}
.sc h3{margin:6px 0;font-size:18px;line-height:1.25}
.sc p{margin:0;color:var(--ink2);font-size:14px}
.sc .c{margin-top:10px;font-size:13px;color:var(--muted)}
/* ---------- modo proyección */
.stage{position:relative;height:calc(100vh - 57px);display:flex;align-items:center;justify-content:center;padding:12px}
.fs .stage{height:100vh;padding:0}
.fs .top{display:none}
.slide{position:relative;width:min(100%, calc((100vh - 81px) * 16 / 9));aspect-ratio:16/9;background:var(--slide);border-radius:14px;box-shadow:0 10px 40px rgba(15,23,42,.18);overflow:hidden;
  font-size:min(2.05vw, 3.6vh);container-type:inline-size}
.fs .slide{width:min(100vw, calc(100vh * 16 / 9));border-radius:0;box-shadow:none}
@supports (font-size:1cqw){ .slide{font-size:2.05cqw} }
.slide .in{position:absolute;inset:0;padding:3.2em 3.6em 3em;display:flex;flex-direction:column;overflow:auto}
.slide .bar{position:absolute;left:0;right:0;bottom:0;height:.35em;background:var(--line)}
.slide .bar i{display:block;height:100%;background:var(--fc,var(--brand))}
.slide .pg{position:absolute;right:1.4em;bottom:.9em;font-size:.62em;color:var(--muted)}
.slide .tag{position:absolute;left:5.8em;top:2.1em;font-size:.62em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fc,var(--brand))}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(15,23,42,.08);color:var(--ink2);font-size:24px;opacity:.4}
.nav:hover{opacity:1}.nav.l{left:4px}.nav.r{right:4px}
.fs .nav{display:none}
.notes{position:fixed;left:16px;right:16px;bottom:16px;z-index:9;background:var(--warm-bg);border:1px solid var(--warm);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:15px;max-height:30vh;overflow:auto;display:none}
.notes.on{display:block}
.notes b{color:var(--warm)}
/* ---------- modo estudio */
.study{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.study .slide{width:100%;aspect-ratio:auto;font-size:18px;margin:0 0 16px;box-shadow:none;border:1px solid var(--line);container-type:normal}
@media(max-width:640px){.study .slide{font-size:16px}}
.study .slide .in{position:static;padding:2.4em 1.4em 1.4em;overflow:visible}
.study .slide .bar,.study .slide .pg{display:none}
.study .slide .tag{left:2.3em;top:1.6em}
.study h2.sh{margin:28px 0 12px;font-size:22px}
/* ---------- piezas de diapositiva */
.s-h{margin:0 0 .5em;font-size:1.75em;line-height:1.15;font-weight:800}
.s-lead{font-size:1.1em;color:var(--ink2);margin:0 0 .7em}
.ico{font-size:2.4em;line-height:1;margin-bottom:.2em}
ul.pts{margin:.2em 0;padding-left:1.1em}ul.pts li{margin:.35em 0}
.cover{justify-content:center;background:linear-gradient(135deg,var(--fc,var(--brand)),#1e3a8a);color:#fff}
.cover .s-h{font-size:2.6em}.cover .s-lead{color:rgba(255,255,255,.9)}
.cover .q{margin-top:1em;font-size:1.25em;font-weight:700;background:rgba(255,255,255,.14);border-radius:.5em;padding:.6em .8em}
.cover .tag{color:rgba(255,255,255,.85)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2em;align-items:start}
@media(max-width:640px){.study .two{grid-template-columns:1fr}}
.box{background:var(--bg);border-radius:.6em;padding:.8em 1em}
.box.hl{background:var(--brand-soft)}
.box.ac{background:var(--accent-soft)}
.box.wa{background:var(--warm-bg)}
.box .lb{font-size:.62em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.3em}
.ask{margin-top:auto;padding-top:.7em;font-size:1.1em;font-weight:700;color:var(--accent)}
ol.steps{list-style:none;margin:.3em 0;padding:0;counter-reset:st;display:grid;gap:.45em}
ol.steps li{counter-increment:st;display:flex;gap:.7em;align-items:flex-start;background:var(--bg);border-radius:.5em;padding:.45em .7em}
ol.steps li::before{content:counter(st);flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;background:var(--fc,var(--brand));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85em}
ol.steps li.hid{visibility:hidden}
.cols{display:grid;gap:1em;grid-template-columns:repeat(var(--n,2),1fr)}
@media(max-width:640px){.study .cols{grid-template-columns:1fr}}
.col{border:2px solid var(--line);border-radius:.6em;padding:.7em .9em}
.col h4{margin:0 0 .3em;font-size:1.1em;color:var(--fc,var(--brand))}
.grid-i{display:grid;gap:.7em;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
@media (max-width:700px){.grid-i{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gi{background:var(--bg);border-radius:.6em;padding:.7em;text-align:center}
.gi .e{font-size:1.8em}.gi>b{display:block;margin:.2em 0}.gi>span{display:block;font-size:.85em;line-height:1.35;color:var(--ink2)}.gi>span b{color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5em;margin:.6em 0}
.fn{padding:.55em .9em;border-radius:.5em;background:var(--brand-soft);border:2px solid var(--brand);font-weight:600;text-align:center;max-width:12em}
.fn.inicio,.fn.fin{border-radius:2em;background:var(--accent-soft);border-color:var(--accent)}
.fn.decision{background:var(--warm-bg);border-color:var(--warm);transform:skew(-8deg)}
.fn.decision>span{display:inline-block;transform:skew(8deg)}
.arr{font-size:1.3em;color:var(--muted)}
.svgw{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.svgw svg{max-width:100%;max-height:100%;height:auto}
pre.code{margin:.3em 0;background:var(--code-bg);color:var(--code-ink);border-radius:.6em;padding:.8em 1em;font:0.82em/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;white-space:pre}
.big{font-size:4.2em;font-weight:900;line-height:1;color:var(--fc,var(--brand))}
.src{font-size:.6em;color:var(--muted);margin-top:.6em}
.opts{display:grid;gap:.5em;margin:.4em 0}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:.5em;padding:.5em .8em;font-size:1em}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.expl{display:none;margin-top:.4em}.expl.on{display:block}
.chip{display:inline-block;border-radius:2em;padding:.15em .7em;font-size:.7em;font-weight:700;background:var(--warm-bg);color:var(--warm);border:1px solid var(--warm);margin-right:.4em}
.timer{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--fc,var(--brand));color:var(--fc,var(--brand));background:transparent;border-radius:2em;padding:.2em .8em;font-weight:800;font-size:.9em}
.timer.end{background:var(--ko);border-color:var(--ko);color:#fff}
.vid{position:relative;flex:1;min-height:6em;border-radius:.6em;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .play{border:0;background:#dc2626;color:#fff;border-radius:.6em;padding:.6em 1.2em;font-size:1em;font-weight:800}
.study .vid{aspect-ratio:16/9;flex:none}
.reveal{border:1px dashed var(--muted);background:transparent;color:var(--muted);border-radius:.4em;padding:.2em .7em;font-size:.7em;margin-top:.4em}
.empty{max-width:700px;margin:60px auto;text-align:center;color:var(--muted)}
@media print{.top,.nav,.notes{display:none}.study .slide{break-inside:avoid}}
</style>

ulo": "Pistas si os atascáis", "progresivo": true, "pasos": ["Mira las **unidades**: ¿hace falta escribir «mm»?", "¿Alguna medida aparece **dos veces**?", "¿Hay cotas **dentro** de la pieza que podrían ir fuera?", "¿Alguna línea de cota **pega** a la pieza?"]}, {"tipo": "ejemplo", "icono": "🕵️", "titulo": "Un error resuelto", "situacion": "La cota «150 mm» lleva la unidad escrita y la línea de cota está pegada a la pieza.", "explicacion": "Dos errores: en piezas las cotas van en **mm sin unidad**, y la línea de cota se separa **8-10 mm** del contorno."}, {"tipo": "practica", "titulo": "Corrección individual", "tiempo": 8, "enunciado": "Redibuja la pieza **bien acotada** a mano alzada en el recuadro final de la ficha A4."}, {"tipo": "cierre", "puntos": ["Acotar bien es **comunicar sin dudas**.", "Revisar un plano ajeno entrena el ojo para el propio.", "Pronto acotaremos **nuestra aula**."], "siguiente": "Acotamos piezas y la planta de una habitación.", "pregunta": "¿Cuál fue el error más difícil de encontrar?"}]}, {"n": 9, "fase": "Desarrollo", "titulo": "Acotamos piezas y la planta de una habitación", "reto": "Aplicar las reglas de acotación en las vistas de una pieza y en la planta de una habitación a escala.", "pregunta": "¿En qué se parece acotar una pieza y acotar una habitación?", "diapositivas": [{"tipo": "comparar", "titulo": "Pieza y edificio: dos costumbres", "columnas": [{"titulo": "Pieza", "icono": "⚙️", "puntos": ["Cotas en **mm**", "No se escribe la unidad", "Escala 1:1, 2:1…"]}, {"titulo": "Habitación / aula", "icono": "🏫", "puntos": ["Cotas en **cm** (o m)", "Unidad indicada en el **cajetín**", "Escala 1:50 o 1:100"]}]}, {"tipo": "practica", "titulo": "Acotar las vistas de una pieza", "tiempo": 18, "enunciado": "Parte 2 de la ficha A5: acota alzado y planta de la pieza 5 **sin repetir** ninguna medida.", "pasos": ["Medidas generales en la vista que mejor las muestra.", "Detalles (huecos) donde se ven de verdad, no ocultos.", "Revisa: ¿cada medida está const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x == null || x === '' ? [] : [x]);
// **negrita** dentro de los textos
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const FC = {'Inicio':'var(--f-ini)','Desarrollo':'var(--f-des)','Cierre':'var(--f-cie)'};
// Admite nombres de fase compuestos («Bloque 1 · Inicio»)
const fcol = f => FC[f] || FC[Object.keys(FC).find(k => String(f || '').includes(k))] || 'var(--brand)';

function ytId(v){
  const m = String(v||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/) || String(v||'').match(/^([\w-]{11})$/);
  return m ? m[1] : null;
}
// En vistas previas protegidas (iframe sandbox, about:srcdoc) el navegador bloquea replaceState: se ignora.
function setHash(h){ try { history.replaceState(null, '', h); } catch(e){} }
function fmtT(s){ s = Math.max(0, s|0); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

const TAG = {idea:'Idea clave', ejemplo:'Ejemplo cotidiano', pasos:'Paso a paso', comparar:'Comparamos', flujo:'Diagrama de flujo',
  infografia:'Infografía', codigo:'Programa', dato:'Dato', practica:'¡Manos a la obra!', quiz:'Comprueba', video:'Vídeo', cierre:'Cierre'};

function slidesOf(s){ return [{tipo:'portada', pregunta: s.pregunta}].concat(arr(s.diapositivas)); }
function renderSlide(s, d, k, total){
  const f = R[d.tipo] || R.idea;
  const tag = d.tipo !== 'portada' ? `<div class="tag">${esc(TAG[d.tipo]||'')}</div>` : '';
  return `<section class="slide" style="--fc:${fcol(s.fase)}" data-k="${k}">${f(d, s, k)}${tag}
    <div class="bar"><i style="width:${(k+1)/total*100}%"></i></div><div class="pg">${k+1} / ${total}</div></section>`;
}

function home(){
  st.s = null; document.body.classList.remove('fs');
  $('#ttl').innerHTML = esc(D.meta.titulo || 'Sesiones');
  $('#sel').value = ''; $('#notes').classList.remove('on');
  $('#app').innerHTML = `<div class="home"><div class="hero"><div class="k">${esc([D.meta.curso_texto, D.materias].filter(Boolean).join(' · '))}</div>
    <h1>${esc(D.meta.titulo||'')}</h1>${D.meta.subtitulo ? `<p>${esc(D.meta.subtitulo)}</p>` : ''}
    ${D.reto ? `<p><b>Reto:</b> ${esc(D.reto)}</p>` : ''}
    <p class="help">Elige una sesión. Proyectar: <span class="kbd">←</span><span class="kbd">→</span> pasar · <span class="kbd">F</span> pantalla completa · <span class="kbd">N</span> notas del docente · <span class="kbd">E</span> modo estudio · <span class="kbd">Esc</span> volver aquí.</p></div>
    <div class="cards">${SES.map(s=>`<button class="sc" data-s="${s.n}" style="--fc:${fcol(s.fase)}"><div class="n">Sesión ${s.n} · ${esc(s.fase||'')}</div><h3>${esc(s.titulo)}</h3><p>${esc(s.reto||'')}</p><div class="c">${arr(s.diapositivas).length + 1} diapositivas</div></button>`).join('')}</div></div>`;
  setHash('#');
  wire();
}
function show(n, i){
  const s = SES.find(x => x.n == n); if (!s) return home();
  const sl = slidesOf(s);
  st.s = s; st.i = Math.max(0, Math.min(i|0, sl.length - 1));
  $('#ttl').innerHTML = `Sesión ${s.n}. ${esc(s.titulo)}<small>${esc(D.meta.titulo||'')}</small>`;
  $('#sel').value = String(s.n);
  $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar';
  if (st.mode === 'proy') {
    $('#app').innerHTML = `<div class="stage"><button class="nav l" id="pv" aria-label="Anterior">‹</button>${renderSlide(s, sl[st.i], st.i, sl.length)}<button class="nav r" id="nx" aria-label="Siguiente">›</button></div>`;
    $('#pv').onclick = prev; $('#nx').onclick = next;
  } else {
    $('#app').innerHTML = `<div class="study">${sl.map((d,k)=>renderSlide(s, d, k, sl.length)).join('')}
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:20px">${SES.find(x=>x.n==s.n-1) ? `<button class="tb" data-s="${s.n-1}">← Sesión ${s.n-1}</button>` : '<span></span>'}${SES.find(x=>x.n==s.n+1) ? `<button class="tb" data-s="${s.n+1}">Sesión ${s.n+1} →</button>` : ''}</div></div>`;
    window.scrollTo(0, 0);
  }
  const nt = st.mode === 'proy' ? sl[st.i].nota : null;
  $('#notes').innerHTML = nt ? `<b>Notas para el docente:</b> ${md(nt)}` : '<b>Notas:</b> sin notas en esta diapositiva.';
  $('#notes').classList.toggle('on', st.notes && st.mode === 'proy');
  setHash(`#s${s.n}-${st.i + 1}`);
  wire();
  fit();
}
function next(){
  if (!st.s) return; const sl = slidesOf(st.s), d = sl[st.i];
  if (d.tipo === 'pasos' && d.progresivo) { const key = st.s.n+'-'+st.i, v = st.revealed[key] ?? 1;
    if (v < arr(d.pasos).length) { st.revealed[key] = v + 1; return show(st.s.n, st.i); } }
  if (st.i < sl.length - 1) show(st.s.n, st.i + 1);
  else { const nx = SES.find(x => x.n == st.s.n + 1); if (nx) show(nx.n, 0); }
}
function prev(){ if (!st.s) return; if (st.i > 0) show(st.s.n, st.i - 1); else { const p = SES.find(x => x.n == st.s.n - 1); if (p) show(p.n, slidesOf(p).length - 1); } }

// Si el contenido no cabe en la diapositiva proyectada, reduce la letra (hasta un 62 %)
function fit(){
  const sl = document.querySelector('.stage .slide'); if (!sl) return;
  const inn = sl.querySelector('.in'); sl.style.fontSize = '';
  const base = parseFloat(getComputedStyle(sl).fontSize); let f = base;
  while (inn.scrollHeight > inn.clientHeight + 1 && f > base * 0.62) { f *= 0.96; sl.style.fontSize = f + 'px'; }
}
let fitT; addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fit, 80); });
let timers = {};
function wire(){
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => show(+b.dataset.s, 0));
  document.querySelectorAll('.opts').forEach(q => q.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    const ok = +q.dataset.ok; q.querySelectorAll('.opt').forEach(x => x.classList.remove('ok','ko'));
    o.classList.add(+o.dataset.j === ok ? 'ok' : 'ko'); q.querySelectorAll('.opt')[ok]?.classList.add('ok');
    document.getElementById('ex-' + q.dataset.q)?.classList.add('on');
  }));
  document.querySelectorAll('.reveal').forEach(b => b.onclick = () => { st.revealed[b.dataset.rev] = (st.revealed[b.dataset.rev] ?? 1) + 1; show(st.s.n, st.i); });
  document.querySelectorAll('.vid').forEach(v => { const b = v.querySelector('.play'); if (b) b.onclick = () => {
    const p = new URLSearchParams({autoplay: '1', rel: '0'}); if (+v.dataset.ini) p.set('start', v.dataset.ini); if (+v.dataset.fin) p.set('end', v.dataset.fin);
    v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?${p}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe>`; }; });
  document.querySelectorAll('.timer').forEach(b => {
    const k = b.dataset.k, paint = () => { const t = timers[k]; if (!t) return; const left = Math.round((t.end - Date.now())/1000);
      b.textContent = left > 0 ? '⏱ ' + fmtT(left) : '⏰ ¡Tiempo!'; b.classList.toggle('end', left <= 0); };
    if (timers[k]) paint();
    b.onclick = () => { if (timers[k]) { clearInterval(timers[k].iv); delete timers[k]; b.textContent = '⏱ ' + (b.dataset.timer/60) + ' min'; b.classList.remove('end'); return; }
      timers[k] = { end: Date.now() + b.dataset.timer * 1000 }; timers[k].iv = setInterval(() => { if (!document.body.contains(b)) return; paint(); }, 500); paint(); };
  });
}

// --------------------------------------------------- controles
$('#sel').innerHTML = `<option value="">Ir a la sesión…</option>` + SES.map(s => `<option value="${s.n}">S${s.n}. ${esc(s.titulo)}</option>`).join('');
$('#sel').onchange = e => e.target.value ? show(+e.target.value, 0) : home();
$('#b-home').onclick = home;
$('#b-mode').onclick = () => { st.mode = st.mode === 'proy' ? 'est' : 'proy'; st.s ? show(st.s.n, st.i) : null; $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar'; };
$('#b-notes').onclick = () => { st.notes = !st.notes; $('#b-notes').setAttribute('aria-pressed', st.notes); $('#notes').classList.toggle('on', st.notes && st.mode === 'proy' && !!st.s); };
$('#b-fs').onclick = toggleFs;
$('#b-theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('clase-theme', r.dataset.theme); } catch(e){} };
try { const t = localStorage.getItem('clase-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
function toggleFs(){
  if (!st.s) return;
  if (st.mode !== 'proy') { st.mode = 'proy'; show(st.s.n, st.i); }
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.().catch(()=>{}); document.body.classList.add('fs'); }
  else { document.exitFullscreen?.(); document.body.classList.remove('fs'); }
}
document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('fs', !!document.fullscreenElement); setTimeout(fit, 120); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (st.s && st.mode === 'proy' && ['ArrowRight','ArrowDown','PageDown',' '].includes(k)) { e.preventDefault(); next(); }
  else if (st.s && st.mode === 'proy' && ['ArrowLeft','ArrowUp','PageUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home' && st.s && st.mode === 'proy') show(st.s.n, 0);
  else if (k === 'End' && st.s && st.mode === 'proy') show(st.s.n, slidesOf(st.s).length - 1);
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'n' || k === 'N') $('#b-notes').click();
  else if ((k === 'e' || k === 'E') && st.s) $('#b-mode').click();
  else if (k === 'Escape' && !document.fullscreenElement) home();
});
// enlace directo: #s3-2 (sesión 3, diapositiva 2)
let m = null; try { m = location.hash.match(/^#s(\d+)(?:-(\d+))?/); } catch(e){}
if (!SES.length) $('#app').innerHTML = '<div class="empty">Esta situación de aprendizaje todavía no tiene diapositivas de clase.</div>';
else if (m) show(+m[1], (+m[2] || 1) - 1); else home();
</script>
