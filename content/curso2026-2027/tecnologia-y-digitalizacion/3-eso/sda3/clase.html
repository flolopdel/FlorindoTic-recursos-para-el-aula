;stroke:var(--warm);stroke-width:2\"/><text x=\"375\" y=\"191\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:18px;font-weight:700;font-family:system-ui,sans-serif\">PLANTA<\/text><line x1=\"260\" y1=\"32\" x2=\"300\" y2=\"32\" style=\"stroke:var(--ink);stroke-dasharray:4 4\"/><line x1=\"260\" y1=\"103\" x2=\"300\" y2=\"103\" style=\"stroke:var(--ink);stroke-dasharray:4 4\"/><line x1=\"312\" y1=\"115\" x2=\"312\" y2=\"145\" style=\"stroke:var(--ink);stroke-dasharray:4 4\"/><line x1=\"438\" y1=\"115\" x2=\"438\" y2=\"145\" style=\"stroke:var(--ink);stroke-dasharray:4 4\"/><text x=\"470\" y=\"60\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">Misma altura<\/text><text x=\"470\" y=\"190\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">Mismo ancho<\/text><text x=\"470\" y=\"80\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">que el alzado<\/text><text x=\"470\" y=\"210\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">que el alzado<\/text><text x=\"30\" y=\"175\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">➚ La flecha de<\/text><text x=\"30\" y=\"195\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">la lámina marca<\/text><text x=\"30\" y=\"215\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">el ALZADO<\/text><\/svg>", "texto": "Sistema europeo: cada vista se dibuja **al lado contrario** del que se mira. El perfil que se ve desde la derecha va a la **izquierda** del alzado.", "nota": "Las láminas de Picuino usan el perfil visto desde la derecha (colocado a la izquierda del alzado). Insiste en la alineación: alzado y perfil comparten altura; alzado y planta comparten anchura.", "teoria": [{"ancla": "#l4", "texto": "pasos para dibujar las vistas"}]}, {"tipo": "practica", "titulo": "Primeras vistas guiadas", "tiempo": 15, "enunciado": "En la lámina **Perspectivas 01** dibuja las tres vistas de las **piezas 1 y 2**, a la vez que el ejemplo de la pizarra. Lo que falte, en casa.", "pasos": ["La **flecha** marca el alzado: dibújalo en su cuadrícula.", "Planta: lo que ves desde arriba, debajo del alzado.", "Perfil: lo que ves de lado, a la izquierda del alzado.", "🥇 Reto: **Perspectivas 02** y, después, las láminas **del revés** (de las vistas a la perspectiva)."], "material": ["Láminas impresas", "Lápiz HB y goma", "Bloque físico"], "nota": "Cada lámina es de una página: imprime vistas-01.pdf y vistas-02.pdf para todo el grupo y unas pocas copias de vistas-01-delreves.pdf y vistas-02-delreves.pdf para quien termina antes. Láminas de Picuino, CC BY-SA 4.0.", "enlace": ["vistas-01.pdf", "vistas-02.pdf"], "teoria": [{"ancla": "#l3", "texto": "generador de vistas"}]}, {"tipo": "cierre", "puntos": ["Un objeto 3D se describe con **tres vistas**.", "Alzado, planta y perfil van **alineados**.", "La planta es la vista que usan los planos de aulas y casas."], "siguiente": "Corregimos las láminas y practicamos vistas en EducacionPlastica.net.", "pregunta": "¿Qué vista dibujarías de una mesa para saber cuánto ocupa en el suelo?"}]}, {"n": 2, "fase": "Inicio", "titulo": "Vistas normalizadas: práctica interactiva en EducacionPlastica.net", "reto": "Desarrollar la visión espacial obteniendo el alzado, la planta y el perfil de al menos 10 piezas en EducacionPlastica.net y entregarlas en un PDF.", "pregunta": "¿Eres capaz de ver una pieza desde tres sitios sin girarla?", "diapositivas": [{"tipo": "ejemplo", "icono": "🧱", "titulo": "Aristas que no se ven", "situacion": "Una pieza de Lego con un hueco por detrás: de frente **no ves** el hueco, pero existe.", "explicacion": "Las aristas ocultas se dibujan con **línea discontinua**. Así quien lee el plano sabe que ahí hay algo. Lo verás en la lámina **Perspectivas 02**."}, {"tipo": "practica", "titulo": "Corregimos las láminas", "tiempo": 7, "enunciado": "Corrige tu lámina **en otro color** con la solución de la pantalla. Recuerda: lo que no se ve se dibuja en **línea discontinua**.", "pasos": ["¿Hay **3 vistas** en cada pieza?", "¿Planta **debajo** del alzado y perfil a su **izquierda**?", "¿Aristas ocultas en **discontinua**?"], "nota": "Resuelve en la pizarra o proyecta tu solución de Perspectivas 01 y 02 (las láminas son de una sola página, sin solución).", "enlace": ["vistas-01.pdf", "vistas-02.pdf"]}, {"tipo": "practica", "titulo": "Vistas en EducacionPlastica.net", "tiempo": 30, "enunciado": "**Objetivo:** desarrollar la visión espacial obteniendo el alzado, la planta y el perfil de figuras 3D. Completa bien **al menos 10 piezas** y comprueba la solución antes de pasar a la siguiente.", "pasos": ["🥉 **Nivel elemental:** piezas 4, 6, 8, 11 y 14.", "🥈 **Nivel medio:** piezas 1, 2, 3 y 6.", "🥇 **Nivel alto:** pieza 1.", "📸 Al resolver cada pieza, haz una **captura** donde se vean la pieza 3D y sus tres vistas resueltas."], "agrupamiento": "Individual", "material": ["Ordenador", "Herramienta de recortes (Win + Mayús + S)"], "enlace": "https://www.educacionplastica.net/vistas.html", "teoria": [{"ancla": "#l3", "texto": "generador de vistas"}]}, {"tipo": "pasos", "titulo": "📄 Formato de entrega (PDF)", "pasos": ["**Crea un documento** nuevo en Google Docs.", "**Pega las 10 capturas** en orden, con un título cada una: «Pieza 1», «Pieza 2»…", "**Exporta a PDF:** Archivo > Descargar > Documento PDF (.pdf).", "**Entrega:** sube el PDF a la Tarea 3.1 de Moodle."]}, {"tipo": "infografia", "titulo": "⚖️ Criterios de evaluación", "elementos": [{"icono": "🔟", "titulo": "Número de piezas", "texto": "Mínimo **10** piezas completas."}, {"icono": "🎯", "titulo": "Vistas correctas", "texto": "Correspondencia entre **colores y posiciones**."}, {"icono": "🧹", "titulo": "Presentación", "texto": "PDF **limpio y ordenado**, con títulos."}, {"icono": "⏰", "titulo": "Plazo", "texto": "Entrega **dentro del plazo**."}]}, {"tipo": "quiz", "pregunta": "Una pieza en L se ve desde arriba. ¿Qué forma tiene su planta si el escalón está a la derecha?", "opciones": ["Un rectángulo entero con una línea que marca el escalón", "Una L", "Un cuadrado"], "correcta": 0, "explicacion": "Desde arriba se ven **las dos alturas** a la vez: el contorno es un rectángulo y el escalón aparece como una **línea** en medio."}, {"tipo": "practica", "titulo": "Montar el PDF y entregar", "tiempo": 13, "entrega": "Tarea 3.1 · Vistas en EducacionPlastica.net (PDF)", "enunciado": "Monta tu documento con las capturas, descárgalo en **PDF** y súbelo. Si no te da tiempo, termínalo en casa dentro del plazo."}, {"tipo": "cierre", "puntos": ["Las vistas se **alinean** entre sí.", "Lo oculto va en **discontinua**.", "Pronto dibujaremos la **planta de nuestra aula**."], "siguiente": "¿Cómo cabe un aula de 8 metros en un folio? Las escalas.", "pregunta": "¿Qué pieza te costó más y por qué?"}]}, {"n": 3, "fase": "Desarrollo", "titulo": "El error del arquitecto: qué es una escala y sus tipos", "reto": "Entender la escala como una proporción sin unidades, distinguir escalas naturales, de reducción y de ampliación y dibujar una figura a escala en cuadrícula.", "pregunta": "¿Cómo cabe un aula de 8 metros en un folio?", "diapositivas": [{"tipo": "video", "titulo": "El error del arquitecto", "busqueda": "errores de escala en construcción ingeniería fallos de medida", "texto": "Mira el caso con una pregunta en la cabeza.", "preguntas": ["¿Qué medida falló?", "¿Qué habría pasado con un plano bien hecho?"], "nota": "Elige un vídeo de 2-3 minutos; si no encuentras uno adecuado, cuenta un caso con una foto."}, {"tipo": "ejemplo", "icono": "🗺️", "titulo": "Google Maps ya usa escalas", "situacion": "Abajo del mapa aparece una barrita que dice **«100 m»**. En tu pantalla mide 2 cm.", "explicacion": "Eso es una escala: **2 cm del mapa = 100 m reales**. Los planos hacen lo mismo con números: 1:50 significa que **1 cm del dibujo son 50 cm reales**."}, {"tipo": "comparar", "titulo": "Tres tipos de escala", "columnas": [{"titulo": "Natural 1:1", "icono": "🟰", "puntos": ["El dibujo **mide lo mismo** que la realidad", "Piezas pequeñas"]}, {"titulo": "Reducción 1:2", "icono": "🔽", "puntos": ["1 unidad del dibujo = **2** reales", "El dibujo es **la mitad**", "Planos, mapas (1:50, 1:100)"]}, {"titulo": "Ampliación 2:1", "icono": "🔼", "puntos": ["**2** unidades del dibujo = 1 real", "El dibujo es **el doble**", "Piezas diminutas (5:1, 10:1)"]}], "teoria": [{"ancla": "#s6", "texto": "tipos de escala"}], "texto": "La escala es una **proporción**: no tiene unidades. Sirve igual para centímetros, metros… ¡o cuadritos!"}, {"tipo": "infografia", "titulo": "La misma figura a tres escalas", "svg": "<svg viewBox=\"0 0 640 260\" role=\"img\" aria-label=\"La misma figura en cuadrícula: a escala natural 1:1 ocupa 4 cuadros de lado, a 1:2 ocupa 2 cuadros (la mitad) y a 2:1 ocupa 8 cuadros (el doble)\"><g style=\"stroke:var(--line);stroke-width:1\"><line x1=\"10\" y1=\"60\" x2=\"10\" y2=\"180\"/><line x1=\"30\" y1=\"60\" x2=\"30\" y2=\"180\"/><line x1=\"50\" y1=\"60\" x2=\"50\" y2=\"180\"/><line x1=\"70\" y1=\"60\" x2=\"70\" y2=\"180\"/><line x1=\"90\" y1=\"60\" x2=\"90\" y2=\"180\"/><line x1=\"110\" y1=\"60\" x2=\"110\" y2=\"180\"/><line x1=\"130\" y1=\"60\" x2=\"130\" y2=\"180\"/><line x1=\"10\" y1=\"60\" x2=\"130\" y2=\"60\"/><line x1=\"10\" y1=\"80\" x2=\"130\" y2=\"80\"/><line x1=\"10\" y1=\"100\" x2=\"130\" y2=\"100\"/><line x1=\"10\" y1=\"120\" x2=\"130\" y2=\"120\"/><line x1=\"10\" y1=\"140\" x2=\"130\" y2=\"140\"/><line x1=\"10\" y1=\"160\" x2=\"130\" y2=\"160\"/><line x1=\"10\" y1=\"180\" x2=\"130\" y2=\"180\"/><\/g><polygon points=\"30,80 70,80 70,120 110,120 110,160 30,160\" style=\"fill:var(--brand-soft);stroke:var(--bran 2=\"80\"/><line x1=\"360\" y1=\"100\" x2=\"560\" y2=\"100\"/><line x1=\"360\" y1=\"120\" x2=\"560\" y2=\"120\"/><line x1=\"360\" y1=\"140\" x2=\"560\" y2=\"140\"/><line x1=\"360\" y1=\"160\" x2=\"560\" y2=\"160\"/><line x1=\"360\" y1=\"180\" x2=\"560\" y2=\"180\"/><line x1=\"360\" y1=\"200\" x2=\"560\" y2=\"200\"/><line x1=\"360\" y1=\"220\" x2=\"560\" y2=\"220\"/><line x1=\"360\" y1=\"240\" x2=\"560\" y2=\"240\"/><\/g><polygon points=\"380,70 460,70 460,150 540,150 540,230 380,230\" style=\"fill:var(--accent-soft);stroke:var(--accent);stroke-width:3\"/><text x=\"460\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:18px;font-weight:700;font-family:system-ui,sans-serif\">Ampliación 2:1<\/text><text x=\"460\" y=\"46\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px;font-family:system-ui,sans-serif\">el doble: 8 cuadros<\/text><\/svg>", "texto": "En la cuadrícula no hace falta medir: **cuenta cuadros**. A 1:2 cada lado ocupa la **mitad** de cuadros; a 2:1, el **doble**.", "pregunta": "Si la figura tuviera 6 cuadros de lado, ¿cuántos ocuparía a 1:3?", "nota": "Es la actividad 2 de la ficha. Respuesta a la pregunta: 2 cuadros.", "teoria": [{"ancla": "#l9", "texto": "calculadora de escalas"}]}, {"tipo": "practica", "titulo": "Actividades 1 y 2 de la ficha", "tiempo": 25, "enunciado": "En tu **ficha de escalas**: clasifica las escalas (actividad 1) y dibuja la figura a **1:2** y a **2:1** en la cuadrícula (actividad 2).", "pasos": ["Actividad 1: el **primer** número es el dibujo y el **segundo**, la realidad.", "¿Dibujo más pequeño? **Reducción**. ¿Más grande? **Ampliación**. ¿Igual? **Natural**.", "Actividad 2a (1:2): cada lado con la **mitad** de cuadros.", "Actividad 2b (2:1): cada lado con el **doble** de cuadros."], "material": ["Ficha de escalas impresa", "Lápiz y regla"], "teoria": [{"ancla": "#l10", "texto": "problemas de escalas"}], "agrupamiento": "Individual", "nota": "Soluciones de la actividad 1: reducción 1:50000, 1:250, 1:3 y 1:50; natural 1:1; ampliación 5:1 y 100:1."}, {"tipo": "infografia", "titulo": "¿Son copias a escala?", "svg": "<svg viewBox=\"0 0 640 200\" role=\"img\" aria-label=\"Tres rectángulos en cuadrícula: A de 2 por 3 cuadros, B de 4 por 6 y C de 4 por 5\"><line x1=\"40\" y1=\"70\" x2=\"40\" y2=\"130\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"60\" y1=\"70\" x2=\"60\" y2=\"130\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"80\" y1=\"70\" x2=\"80\" y2=\"130\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"40\" y1=\"70\" x2=\"80\" y2=\"70\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"40\" y1=\"90\" x2=\"80\" y2=\"90\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"40\" y1=\"110\" x2=\"80\" y2=\"110\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"40\" y1=\"130\" x2=\"80\" y2=\"130\" style=\"stroke:var(--line);stroke-width:1\"/><rect x=\"40\" y=\"70\" width=\"40\" height=\"60\" style=\"fill:none;stroke:var(--brand);stroke-width:3\"/><text x=\"60\" y=\"50\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px;font-weight:700;font-family:system-ui,sans-serif\">A · 2 × 3<\/text><line x1=\"190\" y1=\"30\" x2=\"190\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"210\" y1=\"30\" x2=\"210\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"230\" y1=\"30\" x2=\"230\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"250\" y1=\"30\" x2=\"250\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"270\" y1=\"30\" x2=\"270\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"190\" y1=\"30\" x2=\"270\" y2=\"30\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"190\" y1=\"50\" x2=\"270\" y2=\"50\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"190\" y1=\"70\" x2=\"270\" y2=\"70\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"190\" y1=\"90\" x2=\"270\" y2=\"90\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"190\" y1=\"110\" x2=\"270\" y2=\"110\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"190\" y1=\"130\" x2=\"270\" y2=\"130\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"190\" y1=\"150\" x2=\"270\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><rect x=\"190\" y=\"30\" width=\"80\" height=\"120\" style=\"fill:none;stroke:var(--accent);stroke-width:3\"/><text x=\"230\" y=\"22\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px;font-weight:700;font-family:system-ui,sans-serif\">B · 4 × 6<\/text><line x1=\"400\" y1=\"50\" x2=\"400\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"420\" y1=\"50\" x2=\"420\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"440\" y1=\"50\" x2=\"440\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"460\" y1=\"50\" x2=\"460\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"480\" y1=\"50\" x2=\"480\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"400\" y1=\"50\" x2=\"480\" y2=\"50\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"400\" y1=\"70\" x2=\"480\" y2=\"70\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"400\" y1=\"90\" x2=\"480\" y2=\"90\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"400\" y1=\"110\" x2=\"480\" y2=\"110\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"400\" y1=\"130\" x2=\"480\" y2=\"130\" style=\"stroke:var(--line);stroke-width:1\"/><line x1=\"400\" y1=\"150\" x2=\"480\" y2=\"150\" style=\"stroke:var(--line);stroke-width:1\"/><rect x=\"400\" y=\"50\" width=\"80\" height=\"100\" style=\"fill:none;stroke:var(--warm);stroke-width:3\"/><text x=\"440\" y=\"40\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px;font-weight:700;font-family:system-ui,sans-serif\">C · 4 × 5<\/text><\/svg>", "texto": "Una figura es copia a escala de otra si **todos** sus lados se multiplican (o dividen) por **el mismo número**.", "pregunta": "¿B es copia a escala de A? ¿Y C? Justifícalo con una operación.", "nota": "Tipo de ejercicio que cae en la prueba escrita. B sí (2·2 = 4 y 3·2 = 6: escala 2:1); C no (2·2 = 4 pero 3·2 = 6 ≠ 5)."}, {"tipo": "quiz", "pregunta": "Un plano está a escala 1:250. ¿Qué tipo de escala es y qué significa?", "opciones": ["Ampliación: el dibujo es 250 veces mayor", "Reducción: 1 unidad del dibujo son 250 en la realidad", "Natural: dibujo y realidad miden igual"], "correcta": 1, "explicacion": "El **1 va delante**: el dibujo es más pequeño. Cada unidad del dibujo (1 cm, 1 cuadro…) son **250** en la realidad."}, {"tipo": "cierre", "puntos": ["Escala = **dibujo : realidad**.", "Mismas unidades antes de calcular.", "1:50 → divide entre 50."], "siguiente": "Del dibujo a la realidad (y al revés): actividades 3 a 6.", "pregunta": "Escribe una duda que te quede sobre escalas."}]}, {"n": 4, "fase": "Desarrollo", "titulo": "Del dibujo a la realidad (y al revés)", "reto": "Calcular medidas reales a partir de un dibujo a escala, y medidas del dibujo a partir de las reales, razonando si se reduce o se amplía y cuántas veces.", "pregunta": "¿Cabe tu cama en ese dormitorio? El plano lo sabe.", "diapositivas": [{"tipo": "quiz", "pregunta": "Una puerta mide 90 cm. ¿Cuánto mide en un plano a escala 1:50?", "opciones": ["4,5 cm", "1,8 cm", "45 cm"], "correcta": 1, "explicacion": "90 ÷ 50 = **1,8 cm**. En reducción siempre se **divide**."}, {"tipo": "ejemplo", "icono": "🗽", "titulo": "El llavero de Nueva York", "situacion": "La Estatua de la Libertad mide **93 m**, pero su réplica en un llavero cabe en tu mano.", "explicacion": "La réplica es una **reducción a 1:750**: es 750 veces más pequeña. Para saber cuánto mide, **divido** la medida real entre 750 (es la actividad 4)."}, {"tipo": "pasos", "titulo": "Ejemplo 1: la mesa a 1:20", "progresivo": true, "texto": "La mesa dibujada mide **3 cm** de ancho y **4 cm** de alto. ¿Cuánto mide de verdad?", "pasos": ["¿Amplía o reduce? **Reduce**: 1 del dibujo son 20 reales.", "¿Cuántas veces? **20 veces** más pequeña.", "Del dibujo a la realidad → **multiplico**: 3 cm · 20 = **60 cm**.", "4 cm · 20 = **80 cm**. La mesa mide 60 × 80 cm."]}, {"tipo": "practica", "titulo": "Actividades 3 a 6 de la ficha", "tiempo": 30, "agrupamiento": "Individual", "enunciado": "En cada actividad responde **las tres preguntas** y haz la operación **con unidades**.", "pasos": ["3 · El tetrabrick a **1:5**: medidas reales de a, b y c.", "4 · La réplica de la Estatua de la Libertad a **1:750** (93 m = 9300 cm).", "5 · Tu habitación de 5 m en un plano a **1:20**.", "6 · La pieza a **10:1** que mide 50 cm en el dibujo."], "material": ["Ficha de escalas impresa", "Calculadora"], "teoria": [{"ancla": "#l10", "texto": "problemas de escalas"}], "nota": "Soluciones: 3) reducción, 5 veces: a = 24 cm, b = 11,5 cm, c = 7,5 cm · 4) reducción, 750 veces: 9300 : 750 = 12,4 cm · 5) reducción, 20 veces: 500 : 20 = 25 cm · 6) ampliación, 10 veces: 50 : 10 = 5 cm."}, {"tipo": "dato", "valor": "1:50", "texto": "Es la escala más usada para dibujar **un aula o una vivienda en un A4**: un aula de 8 m ocupa 16 cm.", "pregunta": "¿Y a 1:100? ¿Se leería bien?"}, {"tipo": "infografia", "titulo": "¿Multiplico o divido?", "elementos": [{"icono": "🔽", "titulo": "Reducción · dibujo → realidad", "texto": "**Multiplico** (la mesa: 3 · 20 = 60 cm)"}, {"icono": "🔽", "titulo": "Reducción · realidad → dibujo", "texto": "**Divido** (la habitación: 500 : 20 = 25 cm)"}, {"icono": "🔼", "titulo": "Ampliación · dibujo → realidad", "texto": "**Divido** (la pieza: 50 : 10 = 5 cm)"}, {"icono": "🔼", "titulo": "Ampliación · realidad → dibujo", "texto": "**Multiplico** (un tornillo de 8 mm a 5:1 = 40 mm)"}], "pregunta": "¿Por qué en la ampliación se hace al revés?"}, {"tipo": "practica", "titulo": "Reto: el dron de rescate", "tiempo": 5, "agrupamiento": "Individual", "enunciado": "Un dron lleva un botiquín a una cortijada aislada. En el mapa, a escala **1:20 000**, la distancia es de **6,5 cm**. ¿Cuántos **metros** recorre?", "pasos": ["a) ¿Reducción o ampliación?", "b) ¿Cuántas veces?", "c) Operación y resultado **en metros**."], "nota": "Tipo de ejercicio que cae en la prueba escrita. Solución: reducción, 20 000 veces; 6,5 · 20 000 = 130 000 cm = 1300 m."}, {"tipo": "quiz", "pregunta": "Una pieza mide 40 mm en un plano a escala 4:1. ¿Cuánto mide en la realidad?", "opciones": ["160 mm", "10 mm", "44 mm"], "correcta": 1, "explicacion": "Es **ampliación** (4:1): el dibujo es 4 veces mayor, así que para la realidad **divido**: 40 : 4 = **10 mm**."}, {"tipo": "cierre", "puntos": ["Tres preguntas: ¿amplía o reduce?, ¿cuántas veces?, ¿multiplico o divido?", "Siempre con **unidades** en el resultado.", "En un plano de reducción, de la realidad al dibujo se **divide**."], "siguiente": "¿Y si no sé la escala? Aprendemos a calcularla (actividades 7 a 9).", "pregunta": "Escribe con tus palabras cuándo se multiplica y cuándo se divide."}]}, {"n": 5, "fase": "Desarrollo", "titulo": "Calcular la escala de un dibujo", "reto": "Calcular la escala de un dibujo o un plano poniendo las dos medidas en la misma unidad y simplificando, y dibujar un objeto a esa escala.", "pregunta": "¿Por qué a veces el dibujo es más grande que la realidad?", "diapositivas": [{"tipo": "ejemplo", "icono": "🗺️", "titulo": "Dos pueblos en un mapa", "situacion": "En un mapa, dos pueblos están a **8 cm**. En la realidad están a **40 km**. ¿A qué escala está el mapa?", "explicacion": "Para calcular la escala hay que comparar **dibujo : realidad** en la **misma unidad** y simplificar. Es el ejemplo 2 de tu ficha.", "teoria": [{"ancla": "#s6", "texto": "escalas de ampliación"}]}, {"tipo": "codigo", "titulo": "Calcular la escala en dos pasos", "codigo": "Paso 1 · misma unidad\n  8 cm : 40 km\n  8 cm : 4 000 000 cm\n\nPaso 2 · simplificar (÷ 8)\n  8 : 4 000 000  →  1 : 500 000", "explicacion": ["40 km = 40 000 m = **4 000 000 cm**.", "En reducción se divide entre el número del dibujo para que quede **1 delante**.", "En ampliación se divide entre el número de la realidad para que quede **1 detrás** (40 : 20 → 2:1)."], "pregunta": "Un engranaje de 20 cm se dibuja con 4 cm de diámetro. ¿A qué escala?", "nota": "Ojo: en el ejemplo 2 de la ficha aparece 8 : 400 000 = 1:50 000, pero 40 km son 4 000 000 cm, así que la escala correcta es 1:500 000. Conviene corregirlo en la ficha antes de imprimirla. Respuesta a la pregunta: 4 : 20 = 1:5 (actividad 7)."}, {"tipo": "practica", "titulo": "Actividades 7 a 9 de la ficha", "tiempo": 22, "enunciado": "Calcula la escala con los **dos pasos** y, en la actividad 9, dibuja la cama a esa escala.", "material": ["Ficha de escalas impresa", "Regla milimetrada", "Calculadora"], "teoria": [{"ancla": "#l10", "texto": "problemas de escalas"}], "agrupamiento": "Individual", "pasos": ["7 · El engranaje: 4 cm en el dibujo, 20 cm en la realidad.", "8 · El plano del instituto: mide con la regla el lado de las pistas (44,20 m = 4420 cm… ¡revisa la unidad!).", "9 · La habitación: mide la pared de 3,50 m y calcula la escala.", "9 · Dibuja la cama de 150 × 200 cm a esa escala."], "nota": "Soluciones: 7) 4 : 20 = 1:5. 8) Depende de la impresión: si el lado mide 8,84 cm, 8,84 : 4420 cm ≈ 1:500 (44,20 m = 4420 cm; la ficha indica 44 200 cm, que también conviene revisar). 9) Escala = medida de la pared en el dibujo : 350 cm; la cama se dibuja dividiendo 150 y 200 entre el denominador. Imprime la ficha al 100 % para que las medidas con regla sean fiables."}, {"tipo": "practica", "titulo": "Comprueba tus escalas (F2)", "tiempo": 12, "enunciado": "Responde el **formulario F2**. Al enviarlo verás las soluciones: apunta en tu ficha los que fallaste.", "agrupamiento": "Individual", "enlace": "https://forms.gle/SXDUpPBiopeRQd696"}, {"tipo": "quiz", "pregunta": "En una noticia, la foto de una hormiga mide 6 cm, pero la hormiga real mide 1,5 cm. ¿A qué escala está la foto?", "opciones": ["1:4", "4:1", "6:1,5"], "correcta": 1, "explicacion": "Dibujo : realidad = 6 : 1,5. Simplifico dividiendo entre 1,5 → **4:1**, una escala de **ampliación** (1 detrás). «6:1,5» no está normalizada."}, {"tipo": "cierre", "puntos": ["Reducción: **divide**. Ampliación: **multiplica**.", "La cota es siempre la medida **real**.", "La escala se elige para que **quepa y se lea**."], "siguiente": "Prueba escrita de escalas y vistas (Tarea 3.3) y entrega de la ficha (Tarea 3.2).", "pregunta": "Verde, amarillo o rojo: ¿cómo llegas a la prueba?"}]}, {"n": 6, "fase": "Desarrollo", "titulo": "Prueba escrita: escalas y vistas", "reto": "Demostrar de forma individual que se interpretan y calculan escalas, se dibuja a escala y se obtienen las vistas de una pieza.", "pregunta": "¿Estás listo o lista para demostrar lo que sabes de escalas?", "diapositivas": [{"tipo": "quiz", "pregunta": "En un plano a 1:50 una pared mide 12 cm. ¿Cuánto mide en realidad?", "opciones": ["6 m", "60 cm", "2,4 m"], "correcta": 0, "explicacion": "12 × 50 = 600 cm = **6 m**."}, {"tipo": "ejemplo", "icono": "📐", "titulo": "El error más común", "situacion": "Una alumna calcula 3 m a 1:50 y escribe **0,06 cm**.", "explicacion": "Dividió metros entre 50 y luego puso cm. Primero **3 m = 300 cm**, después 300 ÷ 50 = **6 cm**.", "teoria": [{"ancla": "#l9", "texto": "calculadora de escalas"}]}, {"tipo": "practica", "titulo": "Prueba escrita: escalas y vistas", "tiempo": 40, "agrupamiento": "Individual", "entrega": "Tarea 3.3 · Prueba escrita de escalas y vistas", "enunciado": "Lee cada ejercicio entero antes de empezar. **Justifica** todos los resultados con operaciones o texto: si no, no cuentan.", "pasos": ["Escalas: ¿reducción o ampliación?, ¿cuántas veces?, operación **con unidades**.", "Calcular la escala: **misma unidad** y **simplificar**.", "Vistas: el **alzado** es el de la flecha; planta debajo y perfil a la izquierda.", "No olvides las **líneas discontinuas** de las aristas ocultas."], "material": ["Regla", "Calculadora", "Lápiz y goma"], "nota": "Reparte los modelos A y B al     const body = d.svg ? `<div class="svgw">${d.svg}</div>`
      : `<div class="grid-i" style="--cols:${Math.min(arr(d.elementos).length, arr(d.elementos).length === 4 ? 4 : 3) || 1}">${arr(d.elementos).map(e=>`<div class="gi"><div class="e">${esc(e.icono||'')}</div><b>${md(e.titulo)}</b><span>${md(e.texto)}</span></div>`).join('')}</div>`;
    return `<div class="in"><h2 class="s-h">${md(d.titulo)}</h2>${d.texto ? `<p class="s-lead">${md(d.texto)}</p>` : ''}${body}
      ${d.pregunta ? `<div class="ask">❓ ${md(d.pregunta)}</div>` : ''}</div>`;
  },
  codigo(d){
    return `<div class="in"><h2 class="s-h">${md(d.titulo)}</h2><div class="two" style="grid-template-columns:${d.explicacion?'1.2fr 1fr':'1fr'}">
      <pre class="code">${esc(d.codigo)}</pre>${d.explicacion ? `<div class="box hl"><div class="lb">Qué hace</div>${arr(d.explicacion).map(x=>`<p style="margin:.2em 0">${md(x)}</p>`).join('')}</div>` : ''}</div>
      ${d.pregunta ? `<div class="ask">❓ ${md(d.pregunta)}</div>` : ''}</div>`;
  },
  dato(d){
    return `<div class="in" style="justify-content:center;text-align:center"><div class="big">${esc(d.valor)}</div>
      <p class="s-lead" style="margin-top:.5em;font-size:1.3em">${md(d.texto)}</p>${d.fuente ? `<div class="src">Fuente: ${esc(d.fuente)}</div>` : ''}
      ${d.pregunta ? `<div class="ask" style="margin-top:1em">❓ ${md(d.pregunta)}</div>` : ''}</div>`;
  },
  practica(d, s, k){
    const min = +d.tiempo || 0;
    return `<div class="in"><h2 class="s-h">🛠 ${md(d.titulo)}</h2>
      <div>${d.entrega ? `<span class="chip">📤 ${esc(d.entrega)}</span>` : ''}${d.agrupamiento ? `<span class="chip">👥 ${esc(d.agrupamiento)}</span>` : ''}
      ${min ? `<button class="timer" data-timer="${min*60}" data-k="${s.n}-${k}">⏱ ${min} min</button>` : ''}</div>
      <p class="s-lead" style="margin-top:.5em">${md(d.enunciado)}</p>
      ${arr(d.enlace).map(u => `<a class="box wa" style="display:block;text-decoration:none;color:inherit;margin:.6em 0" href="${esc(u)}" target="_blank" rel="noopener">🔗 <b>${esc(String(u).replace(/^https?:\/\//,''))}</b></a>`).join('')}
      ${arr(d.pasos).length ? `<ol class="steps">${arr(d.pasos).map(p=>`<li><span>${md(p)}</span></li>`).join('')}</ol>` : ''}
      ${d.material ? `<div class="src">Material: ${esc(arr(d.material).join(', '))}</div>` : ''}</div>`;
  },
  quiz(d, s, k){
    return `<div class="in"><h2 class="s-h">🧠 ${md(d.pregunta)}</h2>
      <div class="opts" data-q="${s.n}-${k}" data-ok="${+d.correcta||0}">${arr(d.opciones).map((o,j)=>`<button class="opt" data-j="${j}">${String.fromCharCode(65+j)}. ${md(o)}</button>`).join('')}</div>
      <div class="expl box hl" id="ex-${s.n}-${k}">${md(d.explicacion||'')}</div></div>`;
  },
  video(d){
    const id = ytId(d.youtube), ini = +d.inicio || 0;
    const url = id ? `https://www.youtube.com/watch?v=${id}${ini?'&t='+ini+'s':''}` : (d.busqueda ? 'https://www.youtube.com/results?search_query='+encodeURIComponent(d.busqueda) : '');
    const box = id ? `<div class="vid" data-yt="${id}" data-ini="${ini}" data-fin="${+d.fin||0}"><button class="play">▶ Reproducir aquí</button></div>`
      : `<a class="box wa" style="display:block;text-decoration:none;color:inherit" href="${esc(url)}" target="_blank" rel="noopener">🔎 Buscar en YouTube: <b>${esc(d.busqueda||'')}</b><div class="src">El docente elige el vídeo antes de clase.</div></a>`;
    return `<div class="in"><h2 class="s-h">🎬 ${md(d.titulo)}</h2>${d.texto ? `<p class="s-lead">${md(d.texto)}</p>` : ''}
      <div class="two" style="grid-template-columns:${arr(d.preguntas).length?'1.5fr 1fr':'1fr'};flex:1;min-height:0">${box}
      ${arr(d.preguntas).length ? `<div class="box ac"><div class="lb">Mientras lo ves</div><ul class="pts">${arr(d.preguntas).map(p=>`<li>${md(p)}</li>`).join('')}</ul></div>` : ''}</div>
      ${url && id ? `<div class="src"><a href="${esc(url)}" target="_blank" rel="noopener">Abrir en YouTube ↗</a>${d.duracion ? ' · '+esc(d.duracion) : ''}${ini ? ' · desde '+fmtT(ini) : ''}</div>` : ''}</div>`;
  },
  cierre(d){
    return `<div class="in"><h2 class="s-h">✅ ${md(d.titulo || 'Hoy hemos aprendido')}</h2>
      <ul class="pts">${arr(d.puntos).map(p=>`<li>${md(p)}</li>`).join('')}</ul>
      ${d.siguiente ? `<div class="box ac" style="margin-top:.6em"><div class="lb">Próxima sesión</div>${md(d.siguiente)}</div>` : ''}
      ${d.pregunta ? `<div class="ask">🚪 Pregunta de salida: ${md(d.pregunta)}</div>` : ''}</div>`;
  },
};
const TAG = {idea:'Idea clave', ejemplo:'Ejemplo cotidiano', pasos:'Paso a paso', comparar:'Comparamos', flujo:'Diagrama de flujo',
  infografia:'Infografía', codigo:'Programa', dato:'Dato', practica:'¡Manos a la obra!', quiz:'Comprueba', video:'Vídeo', cierre:'Cierre'};

function slidesOf(s){ return [{tipo:'portada', pregunta: s.pregunta}].concat(arr(s.diapositivas)); }
function renderSlide(s, d, k, total){
  const f = R[d.tipo] || R.idea;
  const tag = d.tipo !== 'portada' ? `<div class="tag">${esc(TAG[d.tipo]||'')}</div>` : '';
  // Enlaces a apartados o láminas de teoria.html, al final del contenido de la diapositiva
  const teo = arr(d.teoria).length ? `<div class="teo">${arr(d.teoria).map(t=>`<a href="teoria.html${esc(t.ancla)}" target="_blank" rel="noopener">📘 Teoría · ${md(t.texto)} ↗</a>`).join('')}</div>` : '';
  return `<section class="slide" style="--fc:${fcol(s.fase)}" data-k="${k}">${f(d, s, k).replace(/<\/div>\s*$/, teo + '</div>')}${tag}
    <div class="bar"><i style="width:${(k+1)/total*100}%"></i></div><div class="pg">${k+1} / ${total}</div></section>`;
}

// --------------------------------------------------- vistas
function home(){
  st.s = null; document.body.classList.remove('fs');
  $('#ttl').innerHTML = esc(D.meta.titulo || 'Sesiones');
  $('#sel').value = ''; $('#notes').classList.remove('on');
  $('#app').innerHTML = `<div class="home"><div class="hero"><div class="k">${esc([D.meta.curso_texto, D.materias].filter(Boolean).join(' · '))}</div>
    <h1>${esc(D.meta.titulo||'')}</h1>${D.meta.subtitulo ? `<p>${esc(D.meta.subtitulo)}</p>` : ''}
    ${D.reto ? `<p><b>Reto:</b> ${esc(D.reto)}</p>` : ''}
    <p class="help">Elige una sesión. Proyectar: <span class="kbd">←</span><span class="kbd">→</span> pasar · <span class="kbd">F</span> pantalla completa · <span class="kbd">N</span> notas del docente · <span class="kbd">E</span> modo estudio · <span class="kbd">Esc</span> volver aquí.</p></div>
    <div class="cards">${SES.map(s=>`<button class="sc" data-s="${s.n}" style="--fc:${fcol(s.fase)}"><div class="n">Sesión ${s.n} · ${esc(s.fase||'')}</div><h3>${esc(s.titulo)}</h3><p>${esc(s.reto||'')}</p><div class="c">${arr(s.diapositivas).length + 1} diapositivas</div></button>`).join('')}</div></div>`;
  setHash('#');
  wire();
}
function show(n, i){
  const s = SES.find(x => x.n == n); if (!s) return home();
  const sl = slidesOf(s);
  st.s = s; st.i = Math.max(0, Math.min(i|0, sl.length - 1));
  $('#ttl').innerHTML = `Sesión ${s.n}. ${esc(s.titulo)}<small>${esc(D.meta.titulo||'')}</small>`;
  $('#sel').value = String(s.n);
  $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar';
  if (st.mode === 'proy') {
    $('#app').innerHTML = `<div class="stage"><button class="nav l" id="pv" aria-label="Anterior">‹</button>${renderSlide(s, sl[st.i], st.i, sl.length)}<button class="nav r" id="nx" aria-label="Siguiente">›</button></div>`;
    $('#pv').onclick = prev; $('#nx').onclick = next;
  } else {
    $('#app').innerHTML = `<div class="study">${sl.map((d,k)=>renderSlide(s, d, k, sl.length)).join('')}
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:20px">${SES.find(x=>x.n==s.n-1) ? `<button class="tb" data-s="${s.n-1}">← Sesión ${s.n-1}</button>` : '<span></span>'}${SES.find(x=>x.n==s.n+1) ? `<button class="tb" data-s="${s.n+1}">Sesión ${s.n+1} →</button>` : ''}</div></div>`;
    window.scrollTo(0, 0);
  }
  const nt = st.mode === 'proy' ? sl[st.i].nota : null;
  $('#notes').innerHTML = nt ? `<b>Notas para el docente:</b> ${md(nt)}` : '<b>Notas:</b> sin notas en esta diapositiva.';
  $('#notes').classList.toggle('on', st.notes && st.mode === 'proy');
  setHash(`#s${s.n}-${st.i + 1}`);
  wire();
  fit();
}
function next(){
  if (!st.s) return; const sl = slidesOf(st.s), d = sl[st.i];
  if (d.tipo === 'pasos' && d.progresivo) { const key = st.s.n+'-'+st.i, v = st.revealed[key] ?? 1;
    if (v < arr(d.pasos).length) { st.revealed[key] = v + 1; return show(st.s.n, st.i); } }
  if (st.i < sl.length - 1) show(st.s.n, st.i + 1);
  else { const nx = SES.find(x => x.n == st.s.n + 1); if (nx) show(nx.n, 0); }
}
function prev(){ if (!st.s) return; if (st.i > 0) show(st.s.n, st.i - 1); else { const p = SES.find(x => x.n == st.s.n - 1); if (p) show(p.n, slidesOf(p).length - 1); } }

// Si el contenido no cabe en la diapositiva proyectada, reduce la letra (hasta un 62 %)
function fit(){
  const sl = document.querySelector('.stage .slide'); if (!sl) return;
  const inn = sl.querySelector('.in'); sl.style.fontSize = '';
  const base = parseFloat(getComputedStyle(sl).fontSize); let f = base;
  while (inn.scrollHeight > inn.clientHeight + 1 && f > base * 0.62) { f *= 0.96; sl.style.fontSize = f + 'px'; }
}
let fitT; addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fit, 80); });
let timers = {};
function wire(){
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => show(+b.dataset.s, 0));
  document.querySelectorAll('.opts').forEach(q => q.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    const ok = +q.dataset.ok; q.querySelectorAll('.opt').forEach(x => x.classList.remove('ok','ko'));
    o.classList.add(+o.dataset.j === ok ? 'ok' : 'ko'); q.querySelectorAll('.opt')[ok]?.classList.add('ok');
    document.getElementById('ex-' + q.dataset.q)?.classList.add('on');
  }));
  document.querySelectorAll('.reveal').forEach(b => b.onclick = () => { st.revealed[b.dataset.rev] = (st.revealed[b.dataset.rev] ?? 1) + 1; show(st.s.n, st.i); });
  document.querySelectorAll('.vid').forEach(v => { const b = v.querySelector('.play'); if (b) b.onclick = () => {
    const p = new URLSearchParams({autoplay: '1', rel: '0'}); if (+v.dataset.ini) p.set('start', v.dataset.ini); if (+v.dataset.fin) p.set('end', v.dataset.fin);
    v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?${p}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe>`; }; });
  document.querySelectorAll('.timer').forEach(b => {
    const k = b.dataset.k, paint = () => { const t = timers[k]; if (!t) return; const left = Math.round((t.end - Date.now())/1000);
      b.textContent = left > 0 ? '⏱ ' + fmtT(left) : '⏰ ¡Tiempo!'; b.classList.toggle('end', left <= 0); };
    if (timers[k]) paint();
    b.onclick = () => { if (timers[k]) { clearInterval(timers[k].iv); delete timers[k]; b.textContent = '⏱ ' + (b.dataset.timer/60) + ' min'; b.classList.remove('end'); return; }
      timers[k] = { end: Date.now() + b.dataset.timer * 1000 }; timers[k].iv = setInterval(() => { if (!document.body.contains(b)) return; paint(); }, 500); paint(); };
  });
}

// --------------------------------------------------- controles
$('#sel').innerHTML = `<option value="">Ir a la sesión…</option>` + SES.map(s => `<option value="${s.n}">S${s.n}. ${esc(s.titulo)}</option>`).join('');
$('#sel').onchange = e => e.target.value ? show(+e.target.value, 0) : home();
$('#b-home').onclick = home;
$('#b-mode').onclick = () => { st.mode = st.mode === 'proy' ? 'est' : 'proy'; st.s ? show(st.s.n, st.i) : null; $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar'; };
$('#b-notes').onclick = () => { st.notes = !st.notes; $('#b-notes').setAttribute('aria-pressed', st.notes); $('#notes').classList.toggle('on', st.notes && st.mode === 'proy' && !!st.s); };
$('#b-fs').onclick = toggleFs;
$('#b-theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('clase-theme', r.dataset.theme); } catch(e){} };
try { const t = localStorage.getItem('clase-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
function toggleFs(){
  if (!st.s) return;
  if (st.mode !== 'proy') { st.mode = 'proy'; show(st.s.n, st.i); }
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.().catch(()=>{}); document.body.classList.add('fs'); }
  else { document.exitFullscreen?.(); document.body.classList.remove('fs'); }
}
document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('fs', !!document.fullscreenElement); setTimeout(fit, 120); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (st.s && st.mode === 'proy' && ['ArrowRight','ArrowDown','PageDown',' '].includes(k)) { e.preventDefault(); next(); }
  else if (st.s && st.mode === 'proy' && ['ArrowLeft','ArrowUp','PageUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home' && st.s && st.mode === 'proy') show(st.s.n, 0);
  else if (k === 'End' && st.s && st.mode === 'proy') show(st.s.n, slidesOf(st.s).length - 1);
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'n' || k === 'N') $('#b-notes').click();
  else if ((k === 'e' || k === 'E') && st.s) $('#b-mode').click();
  else if (k === 'Escape' && !document.fullscreenElement) home();
});
// enlace directo: #s3-2 (sesión 3, diapositiva 2)
let m = null; try { m = location.hash.match(/^#s(\d+)(?:-(\d+))?/); } catch(e){}
if (!SES.length) $('#app').innerHTML = '<div class="empty">Esta situación de aprendizaje todavía no tiene diapositivas de clase.</div>';
else if (m) show(+m[1], (+m[2] || 1) - 1); else home();
</script>
