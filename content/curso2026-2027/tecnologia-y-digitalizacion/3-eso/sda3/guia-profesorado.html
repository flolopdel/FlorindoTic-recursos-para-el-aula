escripcion": "Equipos heterogéneos con roles estables (medidor/a principal, diseñador/a CAD, gestor/a de documentación y portavoz) y responsabilidad individual en el plano."}, {"nombre": "Instrucción directa con práctica guiada", "descripcion": "En la fundamentación técnica, explicaciones cortas con ejemplo resuelto en la pantalla y práctica inmediata con fichas graduadas."}, {"nombre": "Gamificación", "descripcion": "Blooket de inicio, retos «El error del arquitecto» y «Detective de errores», Kahoot de acotación, paseo virtual en 3D y dinámica «Pitch de startup»."}, {"nombre": "Coevaluación y autoevaluación", "descripcion": "Testeo cruzado de diseños, coevaluación del Elevator Pitch y diana de autoevaluación con Google Forms."}], "recursos": ["Aula de informática (un ordenador por estudiante)", "Material de dibujo: escuadra, cartabón, regla, lápices H y HB", "Láminas de vistas impresas (Picuino) y EducacionPlastica.net", "Cintas métricas y flexómetros", "Bloques y piezas físicas para vistas", "Blooket y Kahoot", "Floorplanner (cuenta gratuita)", "Canva para Educación", "Google Workspace del centro (Drive, Docs, Forms)", "Moodle Centros"], "fases": [{"nombre": "Inicio", "sesiones": "1-2", "finalidad": "Presentación del reto, diagnóstico y vistas normalizadas"}, {"nombre": "Desarrollo", "sesiones": "3-15", "finalidad": "Escalas, acotación, medición y plano del aula, investigación y diseño en Floorplanner"}, {"nombre": "Cierre", "sesiones": "16-17", "finalidad": "Cartel en Canva, Elevator Pitch, coevaluación y autoevaluación"}], "sesiones": [{"n": 1, "fase": "Inicio", "titulo": "Gancho: ¿es cómoda nuestra clase? Del objeto a sus vistas", "reto": "Conocer el reto de la SdA y descubrir que un objeto 3D se describe con tres vistas: alzado, planta y perfil.", "actividades": [{"nombre": "Gancho del reto", "min": 8, "desc": "El docente proyecta dos fotos: un aula tradicional en filas y un Aula del Futuro con zonas (puede usar las del INTEF). Pregunta: «¿En cuál aprenderíais mejor? ¿Por qué?». Lluvia de ideas en voz alta de 3 cosas que cambiaríais de vuestra clase (luz, sillas, enchufes, ruido). Se presenta el encargo del equipo directivo y el producto final, y se avisa de que primero hay que aprender el «idioma» de los planos."}, {"nombre": "Diagnóstico: formulario y Blooket", "min": 14, "desc": "Cada estudiante responde el formulario de diagnóstico (Formulario F1, 5 minutos): reconocer una planta, leer una escala sencilla, identificar una cota y qué programas conoce; sirve para formar equipos heterogéneos en la sesión 10. Después, el docente lanza el Blooket de inicio (9 minutos) desde su ordenador y el alumnado se une con el código de la partida: activa ideas previas y muestra qué sabe ya el grupo. Enlace F1: https://forms.gle/KMgAVCf63Whz4mpq8. Blooket: https://dashboard.blooket.com/set/61e44d86ee48bed1b8349631."}, {"nombre": "Simulador 3D: caras ocultas", "min": 10, "desc": "En la pantalla grande el docente usa el interactivo de vistas de EducacionPlastica.net (u otro visor) y gira un bloque en L: ¿qué ves de frente (alzado), desde arriba (planta) y de lado (perfil)? Se colocan como en las láminas de clase (sistema europeo): la planta debajo del alzado y el perfil al lado contrario del que se mira, de modo que el que se ve desde la derecha se dibuja a la izquierda del alzado. Se reparten bloques físicos para que cada pareja los gire en la mesa."}, {"nombre": "Primeras vistas guiadas", "min": 15, "desc": "El docente reparte impresas las láminas de Picuino «Perspectivas 01» (vistas-01.pdf, piezas sin aristas ocultas) y «Perspectivas 02» (vistas-02.pdf, con aristas ocultas); se imprime solo la primera página de cada archivo. En la de Perspectivas 01 el alumnado dibuja sobre la cuadrícula el alzado, la planta y el perfil de las piezas 1 y 2 copiando el ejemplo resuelto en la pizarra paso a paso (la flecha marca el alzado). El resto de Perspectivas 01 se termina en casa; Perspectivas 02 es el reto para quien acaba antes y se completa también en casa. Se corrigen al inicio de la sesión 2 y se guardan para el dossier técnico."}, {"nombre": "Salida", "min": 3, "desc": "Pregunta de salida oral: «¿Qué vista dibujarías de una mesa para saber cuánto ocupa en el suelo?» (la planta)."}], "criterios": [], "saberes": ["TYD.3.A.1", "TYD.3.B.1"], "metodologia": ["ABP", "Gamificación (Blooket de inicio)", "Instrucción directa con práctica guiada"], "evidencias": ["Formulario de diagnóstico F1", "Resultados del Blooket de inicio (diagnóstico)", "Piezas 1 y 2 de la lámina «Perspectivas 01» (diagnóstica)"], "recursos": ["Proyector", "Blooket", "Bloques físicos", "Láminas de vistas impresas"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Reto cercano (su propia aula); objeto 3D real y simulador para quien no visualiza en el espacio; ejemplo resuelto proyectado mientras se dibuja."}, "ejercicios": ["Responde el formulario de diagnóstico y el Blooket de inicio.", "Dibuja el alzado, la planta y el perfil de las piezas 1 y 2 de la lámina «Perspectivas 01»."], "clase": {"pregunta": "¿Es cómoda nuestra clase? ¿Cómo la organizaría un equipo profesional de diseño?", "diapositivas": [{"tipo": "comparar", "titulo": "¿Dónde aprenderías mejor?", "columnas": [{"titulo": "Aula tradicional", "icono": "🪑", "puntos": ["Filas mirando a la pizarra", "Mobiliario fijo", "Una sola forma de trabajar"]}, {"titulo": "Aula del Futuro", "icono": "🚀", "puntos": ["**Zonas** para presentar, investigar, crear…", "Mobiliario móvil", "Tecnología al servicio del trabajo"]}], "pregunta": "Di 3 cosas que cambiarías de tu clase.", "nota": "Recoge las ideas en la pizarra y guárdalas en una foto: se retoman en la sesión 12 al definir necesidades."}, {"tipo": "idea", "icono": "🎯", "titulo": "Vuestro encargo", "texto": "El equipo directivo quiere transformar un aula del instituto.", "puntos": ["Medir y dibujar el aula **a escala**", "Diseñarla en 3D con **Floorplanner**", "Cartel en **Canva**", "**Elevator Pitch** de 2 minutos"]}, {"tipo": "practica", "titulo": "Diagnóstico: ¿qué sé ya?", "tiempo": 5, "enunciado": "Responde el formulario F1 con sinceridad: no cuenta para nota, sirve para formar equipos equilibrados.", "agrupamiento": "Individual", "enlace": "https://forms.gle/KMgAVCf63Whz4mpq8"}, {"tipo": "practica", "titulo": "Blooket de inicio", "tiempo": 9, "enunciado": "Entra en **blooket.com/play** con el código que aparece en la pantalla y responde. Tampoco cuenta para nota: es para ver qué sabemos.", "agrupamiento": "Individual", "enlace": "https://dashboard.blooket.com/set/61e44d86ee48bed1b8349631", "nota": "Lanza la partida desde tu panel de Blooket (modo clásico o Gold Quest) y proyecta el código."}, {"tipo": "ejemplo", "icono": "📦", "titulo": "Una caja vista desde tres sitios", "situacion": "Si miras una caja de cereales **de frente**, solo ves un rectángulo. **Desde arriba**, otro distinto. **De lado**, uno estrecho.", "explicacion": "Ninguna vista sola describe la caja, pero **las tres juntas** sí: alzado (de frente), planta (desde arriba) y perfil (de lado)."}, {"tipo": "infografia", "titulo": "Dónde va cada vista en la lámina", "svg": "<svg viewBox=\"0 0 640 240\" role=\"img\" aria-label=\"Colocación de las vistas como en las láminas de clase: perfil a la izquierda del alzado, planta debajo del alzado\"><rect x=\"136\" y=\"20\" width=\"124\" height=\"95\" rx=\"6\" style=\"fill:var(--accent-soft);stroke:var(--accent);stroke-width:2\"/><text x=\"198\" y=\"62\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:17px;font-weight:700;font-family:system-ui,sans-serif\">PERFIL<\/text><text x=\"198\" y=\"84\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:12px;font-weight:400;font-family:system-ui,sans-serif\">(desde la derecha)<\/text><rect x=\"300\" y=\"20\" width=\"150\" height=\"95\" rx=\"6\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:2\"/><text x=\"375\" y=\"72\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:18px;font-weight:700;font-family:system-ui,sans-serif\">ALZADO<\/text><rect x=\"300\" y=\"145\" width=\"150\" height=\"80\" rx=\"6\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:2\"/><text x=\"375\" y=\"191\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:18px;font-weight:700;font-family:system-ui,sans-serif\">PLANTA<\/text><line x1=\"260\" y1=\"32\" x2=\"300\" y2=\"32\" style=\"stroke:var(--ink);stroke-dasharray:4 4\"/><line x1=\"260\" y1=\"103\" x2=\"300\" y2=\"103\" style=\"stroke:var(--ink);stroke-dasharray:4 4\"/><line x1=\"312\" y1=\"115\" x2=\"312\" y2=\"145\" style=\"stroke:var(--ink);stroke-dasharray:4 4\"/><line x1=\"438\" y1=\"115\" x2=\"438\" y2=\"145\" style=\"stroke:var(--ink);stroke-dasharray:4 4\"/><text x=\"470\" y=\"60\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">Misma altura<\/text><text x=\"470\" y=\"190\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">Mismo ancho<\/text><text x=\"470\" y=\"80\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">que el alzado<\/text><text x=\"470\" y=\"210\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">que el alzado<\/text><text x=\"30\" y=\"175\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">➚ La flecha de<\/text><text x=\"30\" y=\"195\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">la lámina marca<\/text><text x=\"30\" y=\"215\" text-anchor=\"start\" style=\"fill:var(--ink);font-size:14px;font-weight:700;font-family:system-ui,sans-serif\">el ALZADO<\/text><\/svg>", "texto": "Sistema europeo: cada vista se dibuja **al lado contrario** del que se mira. El perfil que se ve desde la derecha va a la **izquierda** del alzado.", "nota": "Las láminas de Picuino usan el perfil visto desde la derecha (colocado a la izquierda del alzado). Insiste en la alineación: alzado y perfil comparten altura; alzado y planta comparten anchura."}, {"tipo": "practica", "titulo": "Primeras vistas guiadas", "tiempo": 15, "enunciado": "En la lámina **Perspectivas 01** dibuja las tres vistas de las **piezas 1 y 2**, a la vez que el ejemplo de la pizarra. Lo que falte, en casa.", "pasos": ["La **flecha** marca el alzado: dibújalo en su cuadrícula.", "Planta: lo que ves desde arriba, debajo del alzado.", "Perfil: lo que ves de lado, a la izquierda del alzado.", "🥇 Reto: lámina **Perspectivas 02**, con aristas ocultas."], "material": ["Láminas impresas Perspectivas 01 y 02", "Lápiz HB y goma", "Bloque físico de la pieza"], "nota": "Imprime solo la primera página de vistas-01.pdf y vistas-02.pdf (la segunda trae las vistas resueltas: guárdala para corregir en la sesión 2). Láminas de Picuino, CC BY-SA 4.0.", "enlace": ["vistas-01.pdf", "vistas-02.pdf"]}, {"tipo": "cierre", "puntos": ["Un objeto 3D se describe con **tres vistas**.", "Alzado, planta y perfil van **alineados**.", "La planta es la vista que usan los planos de aulas y casas."], "siguiente": "Corregimos las láminas y practicamos vistas en EducacionPlastica.net.", "pregunta": "¿Qué vista dibujarías de una mesa para saber cuánto ocupa en el suelo?"}]}}, {"n": 2, "fase": "Inicio", "titulo": "Vistas normalizadas: práctica interactiva en EducacionPlastica.net", "reto": "Desarrollar la visión espacial obteniendo el alzado, la planta y el perfil de al menos 10 piezas en EducacionPlastica.net y entregarlas en un PDF.", "actividades": [{"nombre": "Corrección de las láminas", "min": 7, "desc": "El docente proyecta la segunda página de vistas-01.pdf y vistas-02.pdf (las vistas resueltas) y cada estudiante corrige su lámina en otro color. Se repasan las aristas ocultas en línea discontinua de Perspectivas 02. Las láminas corregidas se guardan para el dossier técnico."}, {"nombre": "Práctica en EducacionPlastica.net", "min": 30, "desc": "Cada estudiante entra en EducacionPlastica.net · Vistas (https://www.educacionplastica.net/vistas.html) y completa correctamente las tres vistas principales (alzado, planta y perfil) de al menos 10 piezas, comprobando que la solución es correcta antes de pasar a la siguiente: nivel elemental, piezas 4, 6, 8, 11 y 14; nivel medio, piezas 1, 2, 3 y 6; nivel alto, pieza 1. Al resolver cada pieza hace una captura de pantalla donde se vean claramente la pieza tridimensional y sus tres vistas resueltas."}, {"nombre": "Montar el PDF y entregar", "min": 13, "desc": "Cada estudiante abre un documento nuevo en Google Docs, pega las 10 capturas en orden con un título cada una («Pieza 1», «Pieza 2»…), lo descarga con Archivo > Descargar > Documento PDF (.pdf) y sube el PDF a la Tarea 3.1. Quien no termine lo completa en casa dentro del plazo."}], "criterios": ["TYD.3.1.2"], "saberes": ["TYD.3.A.2", "TYD.3.B.1"], "metodologia": ["Práctica guiada", "Retos por niveles", "Aprendizaje con recursos interactivos"], "evidencias": ["Láminas de vistas corregidas (van al dossier técnico)", "PDF con 10 piezas de EducacionPlastica.net (Tarea 3.1, nota de 1 a 10)"], "recursos": ["Ordenadores", "EducacionPlastica.net · Vistas", "Google Docs", "Láminas de vistas"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Piezas por niveles (elemental, medio y alto); el interactivo corrige al momento; piezas físicas en la mesa del docente para quien necesite girarlas; pasos del PDF proyectados y plazo para terminar en casa."}, "moodle": [{"recurso": "Tarea", "nombre": "3.1 · Vistas en EducacionPlastica.net (PDF)", "uso": "Calificar de 1 a 10 la obtención del alzado, la planta y el perfil de al menos 10 piezas tridimensionales (nota directa que se traslada a Séneca).", "correccion": "directa", "criterio": "TYD.3.1.2", "cotejo": ["Completa el número mínimo de piezas (10)", "Identifica correctamente las vistas (correspondencia entre colores y posiciones)", "Presenta un PDF limpio y ordenado, con un título en cada captura", "Entrega dentro del plazo establecido"], "config": ["Entrega individual: un único archivo", "Tipos de archivo aceptados: solo .pdf", "Calificación: puntuación máxima 10 (nota directa de 1 a 10)", "Prórroga individual para quien la necesite"], "calificable": true, "codigo": "3.1"}], "ejercicios": ["Obtén en EducacionPlastica.net el alzado, la planta y el perfil de al menos 10 piezas de los niveles elemental, medio y alto.", "Reúne las capturas en un documento de Google Docs, descárgalo en PDF y entrégalo."], "clase": {"pregunta": "¿Eres capaz de ver una pieza desde tres sitios sin girarla?", "diapositivas": [{"tipo": "ejemplo", "icono": "🧱", "titulo": "Aristas que no se ven", "situacion": "Una pieza de Lego con un hueco por detrás: de frente **no ves** el hueco, pero existe.", "explicacion": "Las aristas ocultas se dibujan con **línea discontinua**. Así quien lee el plano sabe que ahí hay algo. Lo verás en la lámina **Perspectivas 02**."}, {"tipo": "practica", "titulo": "Corregimos las láminas", "tiempo": 7, "enunciado": "Corrige tu lámina **en otro color** con la solución de la pantalla. Recuerda: lo que no se ve se dibuja en **línea discontinua**.", "pasos": ["¿Hay **3 vistas** en cada pieza?", "¿Planta **debajo** del alzado y perfil a su **izquierda**?", "¿Aristas ocultas en **discontinua**?"], "nota": "Proyecta la segunda página de vistas-01.pdf y de vistas-02.pdf (las vistas resueltas).", "enlace": ["vistas-01.pdf", "vistas-02.pdf"]}, {"tipo": "practica", "titulo": "Vistas en EducacionPlastica.net", "tiempo": 30, "enunciado": "**Objetivo:** desarrollar la visión espacial obteniendo el alzado, la planta y el perfil de figuras 3D. Completa bien **al menos 10 piezas** y comprueba la solución antes de pasar a la siguiente.", "pasos": ["🥉 **Nivel elemental:** piezas 4, 6, 8, 11 y 14.", "🥈 **Nivel medio:** piezas 1, 2, 3 y 6.", "🥇 **Nivel alto:** pieza 1.", "📸 Al resolver cada pieza, haz una **captura** donde se vean la pieza 3D y sus tres vistas resueltas."], "agrupamiento": "Individual", "material": ["Ordenador", "Herramienta de recortes (Win + Mayús + S)"], "enlace": "https://www.educacionplastica.net/vistas.html"}, {"tipo": "pasos", "titulo": "📄 Formato de entrega (PDF)", "pasos": ["**Crea un documento** nuevo en Google Docs.", "**Pega las 10 capturas** en orden, con un título cada una: «Pieza 1», «Pieza 2»…", "**Exporta a PDF:** Archivo > Descargar > Documento PDF (.pdf).", "**Entrega:** sube el PDF a la Tarea 3.1 de Moodle."]}, {"tipo": "infografia", "titulo": "⚖️ Criterios de evaluación", "elementos": [{"icono": "🔟", "titulo": "Número de piezas", "texto": "Mínimo **10** piezas completas."}, {"icono": "🎯", "titulo": "Vistas correctas", "texto": "Correspondencia entre **colores y posiciones**."}, {"icono": "🧹", "titulo": "Presentación", "texto": "PDF **limpio y ordenado**, con títulos."}, {"icono": "⏰", "titulo": "Plazo", "texto": "Entrega **dentro del plazo**."}]}, {"tipo": "quiz", "pregunta": "Una pieza en L se ve desde arriba. ¿Qué forma tiene su planta si el escalón está a la derecha?", "opciones": ["Un rectángulo entero con una línea que marca el escalón", "Una L", "Un cuadrado"], "correcta": 0, "explicacion": "Desde arriba se ven **las dos alturas** a la vez: el contorno es un rectángulo y el escalón aparece como una **línea** en medio."}, {"tipo": "practica", "titulo": "Montar el PDF y entregar", "tiempo": 13, "entrega": "Tarea 3.1 · Vistas en EducacionPlastica.net (PDF)", "enunciado": "Monta tu documento con las capturas, descárgalo en **PDF** y súbelo. Si no te da tiempo, termínalo en casa dentro del plazo."}, {"tipo": "cierre", "puntos": ["Las vistas se **alinean** entre sí.", "Lo oculto va en **discontinua**.", "Pronto dibujaremos la **planta de nuestra aula**."], "siguiente": "¿Cómo cabe un aula de 8 metros en un folio? Las escalas.", "pregunta": "¿Qué pieza te costó más y por qué?"}]}}, {"n": 3, "fase": "Desarrollo", "titulo": "El error del arquitecto: qué es una escala", "reto": "Entender qué significa una escala y distinguir escalas de reducción, ampliación y natural.", "actividades": [{"nombre": "Gancho: el error del arquitecto", "min": 10, "desc": "Se proyecta un vídeo corto o una noticia sobre un error de escala o de medida en una obra (puentes que no encajan, un submarino que no cabía en el puerto, muebles que no pasan por la puerta). Pregunta: «¿Qué pasó? ¿Cómo se podía haber evitado?»."}, {"nombre": "Qué es una escala", "min": 12, "desc": "Explicación con ejemplos cotidianos: el mapa de Google Maps, una maqueta de coche 1:43 y la foto de un insecto ampliada. Escala = medida en el dibujo : medida real (en las mismas unidades). Reducción (1:50, 1:100), natural (1:1) y ampliación (2:1, 5:1)."}, {"nombre": "Ejercicios graduados (bloque 1)", "min": 23, "desc": "Fichas de escalas (Plantilla en el anexo A2), bloque 1: clasificar escalas, pasar de dibujo a realidad con 1:10, 1:50 y 1:100 y medir con la regla una mesa dibujada a 1:20. Se permite calculadora."}, {"nombre": "Corrección en voz alta", "min": 5, "desc": "Se corrigen tres ejercicios en la pizarra; cada estudiante marca sus aciertos y anota una duda."}], "criterios": [], "saberes": ["TYD.3.A.2", "TYD.3.B.1"], "metodologia": ["Gamificación (reto «El error del arquitecto»)", "Instrucción directa con práctica guiada"], "evidencias": ["Bloque 1 de la ficha de escalas A2"], "recursos": ["Vídeo o noticia", "Ficha A2", "Calculadora"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Gancho con casos reales; ejemplo resuelto paso a paso; calculadora de escalas y regla escalada como apoyo visual."}, "ejercicios": ["Clasifica las escalas 1:50, 2:1, 1:1, 1:100 y 5:1 en reducción, natural o ampliación.", "Calcula la medida real de segmentos dibujados a escala 1:10, 1:50 y 1:100."], "clase": {"pregunta": "¿Cómo cabe un aula de 8 metros en un folio?", "diapositivas": [{"tipo": "video", "titulo": "El error del arquitecto", "busqueda": "errores de escala en construcción ingeniería fallos de medida", "texto": "Mira el caso con una pregunta en la cabeza.", "preguntas": ["¿Qué medida falló?", "¿Qué habría pasado con un plano bien hecho?"], "nota": "Elige un vídeo de 2-3 minutos; si no encuentras uno adecuado, cuenta un caso con una foto."}, {"tipo": "ejemplo", "icono": "🗺️", "titulo": "Google Maps ya usa escalas", "situacion": "Abajo del mapa aparece una barrita que dice **«100 m»**. En tu pantalla mide 2 cm.", "explicacion": "Eso es una escala: **2 cm del mapa = 100 m reales**. Los planos hacen lo mismo con números: 1:50 significa que **1 cm del dibujo son 50 cm reales**."}, {"tipo": "comparar", "titulo": "Tres tipos de escala", "columnas": [{"titulo": "Reducción", "icono": "🏠", "puntos": ["1:50 · 1:100", "Edificios, aulas, mapas", "El dibujo es **más pequeño**"]}, {"titulo": "Natural", "icono": "📏", "puntos": ["1:1", "Piezas pequeñas", "El dibujo es **igual**"]}, {"titulo": "Ampliación", "icono": "🔍", "puntos": ["2:1 · 5:1", "Tornillos, chips", "El dibujo es **más grande**"]}]}, {"tipo": "codigo", "titulo": "La cuenta que siempre funciona", "codigo": "DIBUJO = REAL ÷ 50          (escala 1:50)\nREAL   = DIBUJO × 50\n\nEjemplo: pared de 7,20 m\n7,20 m = 720 cm\n720 ÷ 50 = 14,4 cm en el plano", "explicacion": ["Pasa **todo a cm** antes de calcular.", "Reducción: **divides** para dibujar.", "Ampliación: **multiplicas** para dibujar."], "pregunta": "¿Cuánto medirá en el plano una puerta de 90 cm a 1:50?"}, {"tipo": "practica", "titulo": "Ejercicios graduados (bloque 1)", "tiempo": 23, "enunciado": "Haz el **bloque 1** de la ficha A2. Puedes usar la calculadora.", "pasos": ["Clasifica las escalas.", "Calcula medidas reales.", "Mide la mesa dibujada a 1:20."], "material": ["Ficha A2", "Regla", "Calculadora"], "enlace": "https://docs.google.com/document/d/1daj5nA65ikk66_3omxaIeZPX1sy4XRmLCtSmDfmpSVI/copy"}, {"tipo": "cierre", "puntos": ["Escala = **dibujo : realidad**.", "Mismas unidades antes de calcular.", "1:50 → divide entre 50."], "siguiente": "Planos de un piso: calculamos en las dos direcciones.", "pregunta": "Escribe una duda que te quede sobre escalas."}]}}, {"n": 4, "fase": "Desarrollo", "titulo": "Escalas de reducción: el plano de un piso", "reto": "Calcular medidas reales y medidas de dibujo en el plano de una vivienda a 1:50 y 1:100.", "actividades": [{"nombre": "Activación", "min": 6, "desc": "Tres preguntas rápidas en la pizarra (una puerta de 90 cm a 1:50, una cama de 2 m a 1:100, una línea de 6 cm a 1:50). Se responde en mini pizarras o en un papel y se levanta a la vez."}, {"nombre": "Ejemplo resuelto", "min": 10, "desc": "El docente proyecta el plano de un piso de 70 m² a 1:100 y resuelve en voz alta: medir el salón con la regla, pasarlo a metros y calcular su superficie aproximada. Pregunta trampa: «¿Cuánto mediría el salón dibujado a 1:50?» (el doble)."}, {"nombre": "Ejercicios graduados (bloque 2)", "min": 28, "desc": "Bloque 2 de la ficha de escalas (Plantilla en el anexo A2): tabla para completar con el plano del piso (dormitorio, cocina, baño y pasillo) y dos situaciones-problema: «¿Cabe un sofá de 2,40 m en esta pared?» y «¿Qué escala elijo para que un aula de 8 × 7 m quepa en un A4 con margen?». Cada estudiante trabaja de forma individual en su ficha."}, {"nombre": "Puesta en común", "min": 6, "desc": "Dos estudiantes explican su elección de escala para el A4; se concluye que 1:50 cabe y deja ver detalles y 1:100 queda muy pequeño."}], "criterios": ["TYD.3.1.2"], "saberes": ["TYD.3.A.1", "TYD.3.B.1"], "metodologia": ["Instrucción directa con práctica guiada", "Trabajo individual"], "evidencias": ["Bloque 2 de la ficha A2"], "recursos": ["Plano de un piso proyectado", "Ficha A2", "Regla y calculadora"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Plano impreso además de proyectado; tabla con la primera fila resuelta; calculadora de escalas online para comprobar."}, "ejercicios": ["Mide en el plano del piso las estancias y calcula sus medidas reales.", "Decide qué escala usarías para dibujar un aula de 8 × 7 m en un A4 y justifícalo."], "clase": {"pregunta": "¿Cabe tu cama en ese dormitorio? El plano lo sabe.", "diapositivas": [{"tipo": "quiz", "pregunta": "Una puerta mide 90 cm. ¿Cuánto mide en un plano a escala 1:50?", "opciones": ["4,5 cm", "1,8 cm", "45 cm"], "correcta": 1, "explicacion": "90 ÷ 50 = **1,8 cm**. En reducción siempre se **divide**."}, {"tipo": "ejemplo", "icono": "🛋️", "titulo": "¿Cabe el sofá?", "situacion": "Vas a comprar un sofá de **2,40 m** y en el plano del piso a 1:50 la pared del salón mide **5,2 cm**.", "explicacion": "5,2 × 50 = 260 cm = **2,60 m**. Sí cabe, con 20 cm de margen. Así deciden los diseñadores **antes** de comprar."}, {"tipo": "practica", "titulo": "Ejercicios graduados (bloque 2)", "tiempo": 28, "enunciado": "De forma **individual**, completa el **bloque 2** de la ficha A2 con el plano del piso.", "pasos": ["Mide cada estancia con la regla.", "Calcula sus medidas reales.", "Resuelve las dos situaciones-problema."], "agrupamiento": "Individual", "enlace": "https://docs.google.com/document/d/1daj5nA65ikk66_3omxaIeZPX1sy4XRmLCtSmDfmpSVI/copy"}, {"tipo": "dato", "valor": "1:50", "texto": "Es la escala más usada para dibujar **un aula o una vivienda en un A4**: un aula de 8 m ocupa 16 cm.", "pregunta": "¿Y a 1:100? ¿Se leería bien?"}, {"tipo": "cierre", "puntos": ["Medir en el plano → **multiplicar** para saber la realidad.", "Elegir escala = que **quepa** y se **lea bien**.", "Nuestra aula irá a **1:50**."], "siguiente": "Escalas de ampliación y comprobación con un formulario.", "pregunta": "¿Qué escala usarías para dibujar tu habitación en un A4?"}]}}, {"n": 5, "fase": "Desarrollo", "titulo": "Escalas de ampliación y elegir la escala adecuada", "reto": "Trabajar con escalas de ampliación y comprobar si se domina el cálculo antes de la prueba.", "actividades": [{"nombre": "Gancho: lo muy pequeño", "min": 6, emplo", "icono": "🔩", "titulo": "El tornillo de las gafas", "situacion": "Un tornillo de gafas mide **2 mm**. Si lo dibujas a 1:1 no se ve nada.", "explicacion": "Se dibuja **ampliado**, por ejemplo a 5:1: cada milímetro real son 5 mm en el papel. El dibujo mide 10 mm."}, {"tipo": "codigo", "titulo": "Ampliación: la cuenta", "codigo": "Escala 5:1\nDIBUJO = REAL × 5\nREAL   = DIBUJO ÷ 5\n\nTornillo de 8 mm → 8 × 5 = 40 mm en el dibujo", "explicacion": ["En ampliación **multiplicas** para dibujar.", "La **cota** siempre dice la medida **real**: 8, no 40."]}, {"tipo": "practica", "titulo": "Ejercicios graduados (bloque 3)", "tiempo": 20, "enunciado": "Haz el **bloque 3** de la ficha A2: ampliaciones y «elige la escala».", "material": ["Ficha A2", "Calculadora"], "enlace": "https://docs.google.com/document/d/1daj5nA65ikk66_3omxaIeZPX1sy4XRmLCtSmDfmpSVI/copy"}, {"tipo": "practica", "titulo": "Comprueba tus escalas (F2)", "tiempo": 12, "enunciado": "Responde el **formulario F2**. Al enviarlo verás las soluciones: apunta en tu ficha los que fallaste.", "agrupamiento": "Individual", "enlace": "https://forms.gle/SXDUpPBiopeRQd696"}, {"tipo": "cierre", "puntos": ["Reducción: **divide**. Ampliación: **multiplica**.", "La cota es siempre la medida **real**.", "La escala se elige para que **quepa y se lea**."], "siguiente": "Prueba de escalas y entrega de las fichas de escalas (Tarea 3.2).", "pregunta": "Verde, amarillo o rojo: ¿cómo llegas a la prueba?"}]}}, {"n": 6, "fase": "Desarrollo", "titulo": "Prueba de ejecución: escalas", "reto": "Demostrar de forma individual que se calculan e interpretan escalas sin errores graves.", "actividades": [{"nombre": "Repaso dirigido", "min": 8, "desc": "El docente repasa los dos ejercicios que más fallaron en la autocomprobación de la sesión 5 y resuelve una duda de cada tipo (reducción, ampliación y elección de escala)."}, {"nombre": "Prueba procedimental", "min": 35, "desc": "Prueba individual en papel (Plantilla en el anexo A3): medir y rores: normas 5-8 y Kahoot de acotación", "reto": "Analizar ejemplos mal acotados, descubrir qué norma incumplen y por qué, y comprobar lo aprendido con un Kahoot.", "actividades": [{"nombre": "Repaso exprés", "min": 4, "desc": "El docente vuelve a proyectar los cuatro ejemplos mal acotados de la sesión 7 y la clase dice en voz alta qué norma incumple cada uno."}, {"nombre": "¿Bien o mal? Normas 5 a 8", "min": 16, "desc": "Misma dinámica que en la sesión 7 con cuatro parejas de ejemplos: (5) las líneas de cota no se cruzan; (6) las cotas en serie van alineadas; (7) en paralelo, las cotas grandes más alejadas que las pequeñas; (8) en medidas pequeñas, flechas por fuera o puntos. Por parejas dicen qué falla y por qué; el docente lo explica y cada estudiante anota la norma en el cuaderno."}, {"nombre": "El caso del plano sospechoso", "min": 15, "desc": "Equipos provisionales de 3 (agencias de detectives). Se proyecta una pieza escalonada con 8 errores de acotación. Cada equipo anota en el cuaderno dónde está cada error, qué norma incumple y cómo se corrige. Después, por turnos, cada equipo dice un error; el docente lo marca y da un punto de detective por cada error bien justificado. Al final se proyecta la pieza bien acotada."}, {"nombre": "Kahoot de acotación", "min": 15, "desc": "Kahoot sobre las normas de acotación en modo individual (cada estudiante con su dispositivo), proyectado desde la cuenta del docente: el alumnado se une en kahoot.it con el PIN y escribe su nombre real para poder identificarlo en el informe. El docente revisa al final las preguntas con más fallos y, después, pasa la nota de cada estudiante a la Tarea 3.3 (calificación directa a partir del porcentaje de aciertos del informe). Enlace: https://create.kahoot.it/my-library/kahoots/favorites."}], "criterios": ["TYD.3.1.2"], "saberes": ["TYD.3.A.2", "TYD.3.B.1"], "metodologia": ["Gamificación (reto «Detective de errores» y Kahoot)", "Aprendizaje cooperativo"], "evidencias": ["Informe del detective rores de forma o mal colocadas.", "5 ptos: Dibuja las tres vistas de las piezas básicas; hay fallos de alineación o de aristas ocultas.", "7 ptos: Vistas correctas y alineadas en casi todas las piezas; algún fallo en la pieza con hueco o plano inclinado.", "10 ptos: Las tres vistas de todas las piezas de las láminas son correctas, están alineadas y las aristas ocultas van en discontinua."]}, {"linea": "Cálculo y elección de escalas (prueba)", "criterio": "TYD.3.1.2", "niveles": ["1 pto: No resuelve la prueba o confunde reducción y ampliación en todos los ejercicios.", "3 ptos: Resuelve algunos cálculos sencillos; falla la mayoría por las unidades.", "5 ptos: Calcula bien con 1:50 y 1:100, pero falla la ampliación o la elección de escala.", "7 ptos: Resuelve casi todo con unidades; un error aislado de cálculo o de justificación.", "10 ptos: Resuelve toda la prueba sin errores, con unidades, y justifica la escala elegida."]}, {"linea": "Acotación según la norma", "criterio": "TYD.3.4.1", "niveles": ["1 pto: No acota o las cotas no se entienden.", "3 ptos: Pone cifras, pero sin líneas auxiliares ni de cota correctas.", "5 ptos: Usa los elementos de la cota, pero repite medidas o las coloca pegadas o dentro de la figura.", "7 ptos: Acota de forma clara y casi completa; incumple una o dos reglas.", "10 ptos: Acota todas las medidas necesarias una sola vez, con separaciones, flechas y cifras según la norma."]}, {"linea": "Croquis y plano del aula a 1:50", "criterio": "TYD.3.4.1", "niveles": ["1 pto: No hay plano o no se reconoce el aula.", "3 ptos: El plano no está a escala o le faltan puertas, ventanas y cajetín.", "5 ptos: Plano a escala con errores de proporción de más de 1 cm en el papel o elementos sin acotar.", "7 ptos: Plano a escala correcto, con puertas, ventanas y cajetín; algún detalle de trazado mejorable.", "10 ptos: Croquis completo y plano a 1:50 preciso, limpio, con muros, puertas, ventanas, cotas en cm y cajetín."]}, {"linea": "Dossier digital organizado" B33z-ZJDf-He5kAOOlhkpUBpBQ8/copy"}, {"tipo": "infografia", "titulo": "Protocolo de nombres del dossier", "elementos": [{"icono": "📁", "titulo": "Carpeta", "texto": "SdA3_Apellido_Nombre"}, {"icono": "🖼️", "titulo": "Archivos", "texto": "01_Vistas · 02_Escalas · 03_Acotacion · 04_Croquis · 05_Plano"}, {"icono": "📄", "titulo": "PDF final", "texto": "SdA3_Dossier_Apellido.pdf"}], "nota": "Recuerda: todo se guarda solo en el Drive del centro y sin caras ni datos personales en las fotos."}, {"tipo": "practica", "titulo": "Dossier digital y entrega", "tiempo": 14, "entrega": "Tarea 3.5 · Dossier técnico gráfico", "enunciado": "Fotografía tus trabajos, nómbralos según el protocolo, únelos en un **PDF** y súbelo.", "pasos": ["Fotos rectas y nítidas.", "Renombra en Drive.", "Une en un PDF (Documentos de Google → Descargar en PDF).", "Sube a Moodle."]}, {"tipo": "cierre", "puntos": ["Ya tenemos el **aula real** en un plano.", "El dossier está **ordenado y a salvo**.", "Ahora toca **soñar** el aula nueva."], "siguiente": "Investigamos qué es un Aula del Futuro.", "pregunta": "¿Qué escala usaríais para dibujar el instituto entero?"}]}}, {"n": 12, "fase": "Desarrollo", "titulo": "Investigamos: qué es un Aula del Futuro y qué necesita la nuestra", "reto": "Buscar información fiable sobre Aulas del Futuro, ergonomía e iluminación y definir las necesidades de nuestra aula.", "actividades": [{"nombre": "Las zonas del Aula del Futuro", "min": 8, "desc": "El docente presenta el modelo Future Classroom Lab (European Schoolnet), que en España impulsa el INTEF: zonas Presentar, Investigar, Crear, Interactuar, Desarrollar e Intercambiar. Cada equipo trabajará como mínimo las cinco del encargo (Presentar, Investigar, Crear, Interactuar, Desarrollar)."}, {"nombre": "Búsqueda crítica", "min": 20, "desc": "Con la ficha de investigación (Plantilla en el anexo A8) cada miembro busca sobre un tema: zonas y mobiliario del Aula del Futuro, ergonomía de mesas y sillas, iluminación y ventilación, eficiencia energética de los equipos. Para cada fuente anota autor, fecha, si es fiable (organismo oficial, universidad, fabricante, blog) y una idea útil. Se evitan foros y anuncios."}, {"nombre": "Empatizar y definir", "min": 14, "desc": "El equipo repasa las ideas de la sesión 1 y entrevista a 2 compañeros/as de otro equipo (¿qué te molesta del aula?, ¿qué necesitas para concentrarte?). Con todo, redacta tres necesidades en formato «¿Cómo podríamos…?» en la ficha A8."}, {"nombre": "Foro de referentes", "min": 8, "desc": "Cada equipo publica en el foro de Moodle un espacio real que le inspire (una imagen con licencia libre o un enlace) con su fuente y una frase sobre qué copiaría. Comenta la publicación de otro equipo."}], "criterios": ["TYD.3.1.1"], "saberes": ["TYD.3.A.1", "TYD.3.A.2", "TYD.3.A.5"], "metodologia": ["Design Thinking (empatizar y definir)", "Aprendizaje cooperativo"], "evidencias": ["Ficha de investigación A8 con fuentes y necesidades", "Publicación en el foro de referentes"], "recursos": ["Ordenadores", "Ficha A8", "Foro de Moodle"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Lista de 4-5 webs fiables de partida para quien lo necesite; cada miembro investiga un tema distinto (responsabilidad individual); ampliación para altas capacidades: comparar dos fuentes que se contradicen."}, "moodle": [{"recurso": "Foro", "nombre": "S12 · Referentes: aulas que nos inspiran", "uso": "Compartir espacios educativos reales que inspiran la propuesta, citando la fuente y la licencia de la imagen.", "config": ["Tipo: debate sencillo", "Modo de grupo: sin grupos (visible para toda la clase)", "Sin calificar"]}], "ejercicios": ["Busca y valora la fiabilidad de dos fuentes sobre tu tema (zonas, ergonomía, iluminación o eficiencia energética).", "Redacta tres necesidades del aula en formato «¿Cómo podríamos…?».", "Publica en el foro un espacio que os inspire con su fuente."], "clase": {"pregunta": "¿Qué necesita de verdad un aula para que se aprenda mejor?", "diapositivas": [{"tipo": "infografia", "titulo": "Las zonas del Aula del Futuro", "elementos": [{"icono": "🎤", "titulo": "Presentar", "texto": "Exponer y recibir opiniones."}, {"icono": "🔬", "titulo": "Investigar", "texto": "Buscar, experimentar, analizar."}, {"icono": "🎬", "titulo": "Crear", "texto": "Producir vídeos, podcasts, prototipos."}, {"icono": "🖐️", "titulo": "Interactuar", "texto": "Pantalla interactiva y participación."}, {"icono": "📚", "titulo": "Desarrollar", "texto": "Trabajo individual y tranquilo."}, {"icono": "🤝", "titulo": "Intercambiar", "texto": "Colaborar en equipo (opcional)."}], "nota": "Modelo Future Classroom Lab de European Schoolnet, difundido por el INTEF. El encargo exige las cinco primeras."}, {"tipo": "video", "titulo": "Un Aula del Futuro por dentro", "busqueda": "Aula del Futuro INTEF zonas de aprendizaje", "preguntas": ["¿Qué zona os ha llamado más la atención?", "¿Qué mobiliario se mueve?"], "nota": "Elige un vídeo corto (menos de 4 minutos) de un centro español."}, {"tipo": "comparar", "titulo": "¿Me fío de esta fuente?", "columnas": [{"titulo": "Sí, con cuidado", "icono": "✅", "puntos": ["Organismos oficiales (INTEF, Junta, IDAE)", "Universidades", "Autor y fecha visibles"]}, {"titulo": "Mejor no", "icono": "⚠️", "puntos": ["Anuncios de una sola marca", "Foros sin autor", "Sin fecha ni fuentes"]}]}, {"tipo": "practica", "titulo": "Búsqueda crítica", "tiempo": 20, "enunciado": "Cada miembro investiga **un tema** y anota en la ficha A8 dos fuentes con su fiabilidad y una idea útil.", "pasos": ["Zonas y mobiliario.", "Ergonomía de mesas y sillas.", "Luz natural y ventilación.", "Eficiencia energética."], "agrupamiento": "Equipos de consultoría", "enlace": "https://docs.google.com/document/d/14rz0am7wnKk6mgSBdc0SXZ_QhIfUOPWaqMoTWpNBR7g/copy"}, {"tipo": "ejemplo", "icono": "💡", "titulo": "De una molestia a una necesidad", "situacion": "«Por la tarde el sol da en la pantalla y no se ve nada.»", "explicacion": "Se convierte en: **¿Cómo podríamos** aprovechar la luz natural sin reflejos en las pantallas? Así se define un problema de diseño."}, {"tipo": "practica", "titulo": "Empatizar, definir y compartir", "tiempo": 22, "enunciado": "Entrevistad a 2 personas de otro equipo, escribid **3 necesidades** «¿Cómo podríamos…?» y publicad un referente en el foro.", "pasos": ["Entrevista: ¿qué te molesta? ¿qué necesitas?", "Tres «¿Cómo podríamos…?».", "Foro: imagen o enlace + fuente + qué copiaríais."]}, {"tipo": "cierre", "puntos": ["Un buen diseño empieza por **las personas**.", "Fuentes fiables = decisiones defendibles.", "Ya sabemos **qué** necesita el aula."], "siguiente": "Dibujamos el aula actual en Floorplanner.", "pregunta": "¿Cuál es la necesidad más importante de vuestra aula?"}]}}, {"n": 13, "fase": "Desarrollo", "titulo": "Floorplanner I: el aula actual en 2D y 3D", "reto": "Crear la cuenta en Floorplanner y recrear el aula actual a escala real con las medidas del plano.", "actividades": [{"nombre": "Demostración guiada", "min": 10, "desc": "El docente proyecta Floorplanner: crear proyecto, dibujar paredes introduciendo la longitud exacta, añadir puertas y ventanas desde la biblioteca, cambiar a vista 3D. Se insiste en usar las medidas del plano en cm."}, {"nombre": "Cuentas y proyecto", "min": 5, "desc": "El diseñador/a CAD de cada equipo crea el proyecto «SdA3_EquipoN_AulaActual» con la cuenta gratuita (cuenta educativa del centro o la que indique el docente) y lo comparte con el resto del equipo."}, {"nombre": "Recrear el aula actual", "min": 28, "desc": "Por parejas dentro del equipo y alternándose al teclado cada 7 minutos: paredes con las medidas del plano, puertas, ventanas, pilares y pizarra. El medidor/a principal dicta las medidas del croquis y comprueba que la vista 2D coincide con el plano (±10 cm)."}, {"nombre": "Entrega", "min": 7, "desc": "Captura de la vista 2D con medidas y del 3D, más el enlace al proyecto, a la Tarea 3.3."}], "criterios": ["TYD.3.4.1"], "saberes": ["TYD.3.B.2"], "metodologia": ["Instrucción directa con práctica guiada", "Aprendizaje cooperativo"], "evidencias": ["Aula actual en Floorplanner (Tarea 3.6, Apto / No apto)"], "recursos": ["Ordenadores", "Floorplanner", "Plano y croquis"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Vídeo tutorial subtitulado en Moodle; chuleta de 6 pasos impresa; turnos de 7 minutos al teclado con cronómetro visible (TDAH); papel de mentor/a técnico para altas capacidades."}, "moodle": [{"recurso": "Tarea", "nombre": "3.6 · El aula actual en Floorplanner", "uso": "Verificar que cada equipo traslada correctamente las medidas del plano al programa CAD.", "correccion": "apto", "criterio": "TYD.3.4.1", "cotejo": ["Se entrega el enlace al proyecto de Floorplanner con permiso de lectura", "La captura 2D muestra las medidas de las paredes y coinciden con el plano (±10 cm)", "Puertas, ventanas y pizarra están en su posición", "El proyecto se llama «SdA3_EquipoN_AulaActual»"], "config": ["Entrega por grupos: Sí", "Texto en línea (enlace) y archivos .png o .jpg", "Calificación: escala Apto / No apto"], "calificable": true, "codigo": "3.6"}], "ejercicios": ["Crea en Floorplanner el proyecto del aula actual con las medidas del plano.", "Añade puertas, ventanas, pilares y pizarra en su posición y comprueba la vista 3D."], "clase": {"pregunta": "¿Se parece el aula del ordenador a la de verdad?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎮", "titulo": "Como un videojuego de construir", "situacion": "En juegos de construir casas colocas paredes y muebles **a ojo**.", "explicacion": "Un programa **CAD** hace lo mismo pero con **medidas exactas**: escribes «720 cm» y la pared mide eso. Por eso los arquitectos lo usan."}, {"tipo": "pasos", "titulo": "Floorplanner en 6 pasos", "progresivo": true, "pasos": ["Nuevo proyecto: **SdA3_EquipoN_AulaActual**.", "Herramienta **Paredes**: clic y escribe la longitud en cm.", "Biblioteca: **puertas y ventanas** sobre la pared.", "Ajusta su posición con las cotas.", "Añade pilares y pizarra.", "Cambia a **3D** para comprobar."]}, {"tipo": "video", "titulo": "Tutorial de Floorplanner", "busqueda": "Floorplanner tutorial español dibujar paredes puertas ventanas", "texto": "Por si alguien necesita verlo otra vez en casa (también en Moodle).", "nota": "Busca un tutorial en español de menos de 10 minutos y enlázalo también en Moodle."}, {"tipo": "practica", "titulo": "Recrear el aula actual", "tiempo": 28, "enunciado": "Por parejas, **cambiad de persona al teclado cada 7 minutos**. El medidor/a dicta y comprueba.", "pasos": ["Paredes con las medidas del plano.", "Puertas y ventanas.", "Pilares y pizarra.", "Comprobación: ¿coincide con el plano?"], "agrupamiento": "Equipos (por parejas al teclado)"}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 7, "entrega": "Tarea 3.6 · El aula actual en Floorplanner", "enunciado": "Subid la **captura 2D con medidas**, la **captura 3D** y el **enlace** al proyecto."}, {"tipo": "cierre", "puntos": ["CAD = dibujo con **medidas exactas**.", "El plano a mano nos ha servido de **guía**.", "Ahora sí: a **transformar** el aula."], "siguiente": "Diseñamos las zonas del Aula del Futuro.", "pregunta": "¿Qué diferencia notas entre dibujar a mano y en el ordenador?"}]}}, {"n": 14, "fase": "Desarrollo", "titulo": "Floorplanner II: idear y zonificar el Aula del Futuro", "reto": "Idear la nueva distribución del aula por zonas y colocar el mobiliario en Floorplanner.", "actividades": [{"nombre": "Lluvia de ideas", "min": 8, "desc": "Cada miembro dibuja en 3 minutos un boceto rápido de la nueva aula sobre una copia pequeña del plano; el equipo elige o mezcla las mejores ideas (técnica «crazy 8» simplificada)."}, {"nombre": "Plan de zonas", "min": 12, "desc": "Con el plan de zonas (Plantilla en el anexo A9) el equipo decide para cada zona su función, su lugar en el aula (cerca de la ventana, junto a la pizarra…), el mobiliario y la tecnología. Cada equipo elige además una especialización: rincón de podcast o streaming, rincón de impresión 3D o zona tranquila de ideación."}, {"nombre": "Duplicar y zonificar", "min": 25, "desc": "El diseñador/a CAD duplica el proyecto como «SdA3_EquipoN_AulaFuturo». Se colocan suelos de colores distintos o etiquetas para cada zona y el mobiliario de la biblioteca: mesas móviles, sillas regulables, pantalla interactiva, sofá o pufs, estanterías. Turnos de teclado cada 7 minutos."}, {"nombre": "Revisión de pasillos", "min": 5, "desc": "Comprobación con la regla de Floorplanner: pasillos de al menos 90 cm para una silla de ruedas y salida despejada hacia la puerta."}], "criterios": ["TYD.3.2.1"], "saberes": ["TYD.3.A.5", "TYD.3.B.2"], "metodologia": ["Design Thinking (idear y prototipar)", "Aprendizaje cooperativo"], "evidencias": ["Plan de zonas A9", "Proyecto «AulaFuturo» con zonas y mobiliario"], "recursos": ["Floorplanner", "Plan de zonas A9", "Copias del plano"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Libertad para elegir la especialización tecnológica; boceto en papel o directamente en pantalla; ampliación para altas capacidades: calcular la ocupación por persona (m²/estudiante) y comparar con la del aula actual."}, "ejercicios": ["Haz un boceto rápido de la nueva distribución del aula.", "Completa el plan de zonas con función, lugar, mobiliario y tecnología.", "Coloca las zonas y el mobiliario en Floorplanner respetando pasillos de 90 cm."], "clase": {"pregunta": "¿Dónde pondríais cada zona y por qué?", "diapositivas": [{"tipo": "practica", "titulo": "Lluvia de ideas con bocetos", "tiempo": 8, "enunciado": "Cada persona dibuja **en 3 minutos** su aula ideal sobre el plano pequeño. Luego elegís o mezcláis.", "pasos": ["3 minutos de boceto en silencio.", "1 minuto por persona para explicarlo.", "Elegid o mezclad."]}, {"tipo": "ejemplo", "icono": "🪟", "titulo": "Cada zona en su sitio", "situacion": "La zona de **Desarrollar** (lectura, trabajo individual) necesita silencio y buena luz.", "explicacion": "Mejor **junto a las ventanas** y lejos de la puerta. La zona de **Presentar** va donde todos vean la pantalla sin reflejos."}, {"tipo": "practica", "titulo": "Plan de zonas", "tiempo": 12, "enunciado": "Completad la **ficha A9**: función, lugar, mobiliario y tecnología de cada zona, y elegid vuestra especialización.", "pasos": ["🎙️ Rincón de podcast o streaming", "🖨️ Rincón de impresión 3D", "🧘 Zona tranquila de ideación"], "enlace": "https://docs.google.com/document/d/1ntjhoEI7W_4uTrQAP7OqgcldE6Ef-3BkwQGDjtdi0U8/copy"}, {"tipo": "practica", "titulo": "Duplicar y zonificar", "tiempo": 25, "enunciado": "Duplicad el proyecto como **SdA3_EquipoN_AulaFuturo** y colocad zonas y muebles.", "pasos": ["Un color de suelo o etiqueta por zona.", "Mesas móviles y sillas regulables.", "Pantalla interactiva y estanterías.", "Turnos de teclado cada 7 min."]}, {"tipo": "dato", "valor": "90 cm", "texto": "Ancho mínimo de paso para que una **silla de ruedas** circule con comodidad entre muebles.", "pregunta": "¿Cumple vuestro diseño este paso en todo el aula?", "nota": "Puedes relacionarlo con el Código Técnico de la Edificación (accesibilidad) sin entrar en detalle normativo."}, {"tipo": "cierre", "puntos": ["Cada zona tiene una **función** y un **lugar** lógico.", "Diseñar es **para todas las personas**.", "Lo próximo: tecnología, ergonomía y sostenibilidad."], "siguiente": "Afinamos el diseño y lo testeamos con otro equipo.", "pregunta": "¿Qué zona os ha costado más colocar?"}]}}, {"n": 15, "fase": "Desarrollo", "titulo": "Floorplanner III: tecnología, ergonomía, sostenibilidad y testeo", "reto": "Mejorar el diseño con criterios de ergonomía, accesibilidad y eficiencia energética, y testearlo con otro equipo.", "actividades": [{"nombre": "Criterios de calidad", "min": 7, "desc": "Explicación breve con ejemplos: altura de mesa y silla regulables, pantalla a la altura de los ojos, luz natural lateral (no de frente ni de espaldas a la pantalla), v 🪑", "titulo": "Ergonomía", "texto": "Mesas y sillas **regulables**; pantalla a la altura de los ojos."}, {"icono": "☀️", "titulo": "Luz natural", "texto": "Ventanas **a un lado** de las pantallas, no delante ni detrás."}, {"icono": "🌬️", "titulo": "Ventilación", "texto": "Ventanas y puerta despejadas para **ventilación cruzada**."}, {"icono": "⚡", "titulo": "Energía", "texto": "**LED**, equipos eficientes y regletas con apagado."}]}, {"tipo": "ejemplo", "icono": "📱", "titulo": "El reflejo en el móvil", "situacion": "Si usas el móvil de espaldas a una ventana soleada, **no ves la pantalla**.", "explicacion": "Con las pantallas del aula pasa igual: la luz debe llegar **de lado**. Así se aprovecha la luz natural y se gasta menos en lámparas."}, {"tipo": "practica", "titulo": "Mejorar el diseño", "tiempo": 20, "enunciado": "Revisad la propuesta con la **checklist** y la ficha A9, añadid la tecnología de vuestra especialización y preparad el **render 3D**.", "pasos": ["Reorientad puestos respecto a las ventanas.", "Añadid la tecnología.", "Escribid las decisiones de energía.", "Generad el render o captura 3D."], "enlace": "https://docs.google.com/document/d/1ntjhoEI7W_4uTrQAP7OqgcldE6Ef-3BkwQGDjtdi0U8/copy"}, {"tipo": "practica", "titulo": "Paseo virtual y testeo", "tiempo": 15, "enunciado": "Abrid el proyecto de otro equipo, haced el **paseo 3D** y respondedle el **formulario F3**.", "pasos": ["Recorred todas las zonas.", "¿Se puede circular en silla de ruedas?", "¿Qué funciona? ¿Qué cambiaríais?"], "agrupamiento": "Equipos", "enlace": "https://forms.gle/oKBAH9yTzodFCmE28"}, {"tipo": "practica", "titulo": "Incorporar mejoras", "tiempo": 8, "enunciado": "Leed el testeo que os han hecho y elegid **una mejora** para aplicar. Anotadla en la ficha A9."}, {"tipo": "cierre", "puntos": ["Un diseño se **prueba** antes de construirse.", "La crítica de otros equipos **mejora** la propuesta.", "Toca **contarlo** al mundo."], "siguiente": "Cartel en Canva y preparación del Elevator Pitch.", "pregunta": "¿Qué mejora vais a incorporar gracias al testeo?"}]}}, {"n": 16, "fase": "Cierre", "titulo": "Cartel en Canva y guion del Elevator Pitch", "reto": "Diseñar el cartel promocional con el render 3D, cerrar el dossier digital con licencia y preparar el pitch.", "actividades": [{"nombre": "Qué hace bueno a un cartel", "min": 5, "desc": "Se comparan dos carteles proyectados (uno saturado de texto y otro con imagen grande, titular y tres datos). Normas: titular corto, render grande, una frase por zona, fuentes y licencia al pie."}, {"nombre": "Cartel en Canva", "min": 25, "desc": "Cada equipo diseña en Canva para Educación un cartel o infografía con el render 3D de Floorplanner, el nombre de la propuesta, las zonas con una frase, las decisiones de ergonomía y sostenibilidad y las fuentes consultadas. Se usan imágenes propias o con licencia libre y se indica la licencia del cartel (Creative Commons BY-NC-SA). Reparto: diseñador/a CAD (render y maquetación), gestor/a de documentación (fuentes y licencia), portavoz y medidor/a (textos)."}, {"nombre": "Guion del pitch", "min": 12, "desc": "Con el guion del Elevator Pitch (Plantilla en el anexo A10) el equipo reparte los 2 minutos: gancho, problema, solución por zonas, sostenibilidad y cierre con la petición al equipo directivo. Se ensaya una vez con cronómetro."}, {"nombre": "Entrega y almacenamiento seguro", "min": 8, "desc": "El gestor/a de documentación guarda en la carpeta del equipo en Drive el cartel en PDF y PNG, el enlace del proyecto y el guion, con los nombres del protocolo, y entrega en la Tarea 3.7 el enlace del proyecto de Floorplanner y el cartel en PDF."}], "criterios": ["TYD.3.1.1", "TYD.3.2.1", "TYD.3.4.1"], "saberes": ["TYD.3.B.3", "TYD.3.D.2", "TYD.3.D.3"], "metodologia": ["ABP", "Aprendizaje cooperativo"], "evidencias": ["Cartel en Canva con render y justificación", "Guion del pitch A10", "Entrega de la Tarea 3.7"], "recursos": ["Canva para Educación", "Render 3D", "Guion A10"], "dua":  necesidades no se apoyan en la investigación o las fuentes son poco fiables.", "7 ptos: Explica necesidades y zonas apoyándose en fuentes fiables; falta la licencia o algún crédito.", "10 ptos: Cartel claro y atractivo que justifica las necesidades con fuentes fiables contrastadas, incluye el render, los créditos y la licencia."]}, {"linea": "Elevator Pitch: contenido y argumentación", "criterio": "TYD.3.4.1", "peso": 16.7, "niveles": ["1 pto: No se presenta o no explica la propuesta.", "3 ptos: Describe el aula sin decir por qué es mejor.", "5 ptos: Explica la propuesta con algún argumento; supera mucho el tiempo o falta el cierre.", "7 ptos: Argumenta la propuesta con vocabulario técnico (escala, zonas, ergonomía) y respeta casi el tiempo.", "10 ptos: Pitch convincente en 2 minutos: gancho, problema, solución por zonas, sostenibilidad y cierre, con vocabulario técnico preciso. Quien graba su parte (medida DUA) se valora con los mismos descriptores."]}, {"linea": "Comunicación y participación del equipo", "criterio": "TYD.3.4.1", "peso": 16.7, "niveles": ["1 pto: Habla una sola persona o lee sin mirar al público.", "3 ptos: Participan varios, pero leen todo y se oyen mal.", "5 ptos: Participa todo el equipo; voz y apoyo visual mejorables.", "7 ptos: Participa todo el equipo con voz clara y apoyándose en el cartel o el 3D.", "10 ptos: Todo el equipo participa con seguridad, mira al público, usa el cartel o el paseo 3D y responde bien a una pregunta."]}], "config": ["Entrega por grupos: Sí", "Enlace del proyecto (texto en línea) y cartel en PDF", "Método de calificación: Rúbrica; niveles 1-3-5-7-10 en las líneas de producto y 0,75-2,25-3,75-5,25-7,5 en las del pitch", "La nota se completa en la sesión 17 tras el pitch"], "criterios_rubrica": ["TYD.3.2.1", "TYD.3.1.1", "TYD.3.4.1"], "calificable": true, "codigo": "3.7"}], "ejercicios": ["Diseña en Canva el cartel de la propuesta con el render, las zonas, la justificación y las fuentes.", "Prepara el guion del Elevato  3.7 · Propuesta Aula del Futuro: diseño, cartel y Elevator Pitch", "enunciado": "Guardad en Drive cartel (PDF y PNG), enlace del proyecto y guion con el **protocolo de nombres**, y subid a Moodle el **enlace** y el **cartel en PDF**."}, {"tipo": "cierre", "puntos": ["Un buen cartel se entiende **en 5 segundos**.", "El pitch tiene **estructura** y tiempo.", "Licencia y fuentes = **respeto** al trabajo ajeno."], "siguiente": "¡Pitch de startup ante la clase!", "pregunta": "¿Qué frase de vuestro pitch creéis que convencerá más?"}]}}, {"n": 17, "fase": "Cierre", "titulo": "Pitch de startup: presentamos el Aula del Futuro", "reto": "Defender la propuesta en un Elevator Pitch de 2 minutos, coevaluar a otros equipos y reflexionar sobre lo aprendido.", "actividades": [{"nombre": "Preparación", "min": 4, "desc": "Se recuerdan las normas: 2 minutos por equipo con cronómetro visible, una pregunta del «equipo directivo» (el docente u otro equipo) y coevaluación mientras se escucha."}, {"nombre": "Elevator Pitch", "min": 30, "desc": "Los 7 equipos presentan su propuesta con el cartel y el paseo 3D proyectados (2 minutos + 1 pregunta + cambio). El resto valora cada pitch en el formulario de coevaluación (Formulario F4). El docente completa en la rúbrica de la Tarea 3.7 las líneas de puesta en público. Si algún estudiante ha grabado su parte, se reproduce dentro del turno de su equipo. Enlace F4: https://forms.gle/meSWF8Jzy1VvZEnK8."}, {"nombre": "Votación y cierre del encargo", "min": 4, "desc": "Se muestran en pantalla los resultados de la coevaluación: propuesta más innovadora, más sostenible y más accesible. El docente se compromete a enviar los carteles al equipo directivo (sin fotos del alumnado)."}, {"nombre": "Diana de autoevaluación", "min": 10, "desc": "Cada estudiante completa la diana de autoevaluación (Formulario F5) sobre vistas, escalas, acotación, CAD, investigación y trabajo en equipo, y escribe una mejora para la próxima SdA. Enlace F5: https://forms.gle/oAwknj94G6HrLKjG8."}, {"nombre": "Salida", "min": 2, "desc": "Respuesta a la pregunta guía en una frase, en voz alta, por equipos."}], "criterios": ["TYD.3.4.1"], "saberes": ["TYD.3.A.5", "TYD.3.B.3"], "metodologia": ["Gamificación (dinámica «Pitch de startup»)", "Coevaluación y autoevaluación"], "evidencias": ["Observación directa del Elevator Pitch (rúbrica de la Tarea 3.7)", "Coevaluación F4", "Diana de autoevaluación F5"], "recursos": ["Proyector", "Cronómetro visible", "Formularios F4 y F5"], "dua": {"principios": ["Acción y Expresión", "Compromiso"], "medidas": "Exposición en directo o grabada; orden de salida anticipado; cronómetro visible; coevaluación con criterios cerrados y comentario breve."}, "ejercicios": ["Presenta con tu equipo el Elevator Pitch del Aula del Futuro en 2 minutos.", "Coevalúa los pitches de los otros equipos.", "Completa la diana de autoevaluación."], "clase": {"pregunta": "¿Qué propuesta convencerá al equipo directivo?", "diapositivas": [{"tipo": "idea", "icono": "🚀", "titulo": "Pitch de startup", "puntos": ["**2 minutos** por equipo", "Cartel y paseo 3D en pantalla", "**1 pregunta** del equipo directivo", "Coevaluación mientras escuchas (F4)"]}, {"tipo": "practica", "titulo": "Elevator Pitch", "tiempo": 30, "enunciado": "Cada equipo presenta en **2 minutos**. Mientras, el resto valora cada pitch en el **formulario F4**.", "pasos": ["Orden de salida en la pizarra.", "Cronómetro visible.", "Una pregunta por equipo."], "entrega": "Tarea 3.7 · Propuesta Aula del Futuro: diseño, cartel y Elevator Pitch", "nota": "Aquí completas las dos líneas de puesta en público de la rúbrica de la Tarea 3.7 (peso 16,7 % cada una).", "enlace": ["https://docs.google.com/document/d/1FDw_oDH7TFbxuIa3MH4scwB6p-AJCO7b6hQ2O0bDXqU/copy", "https://forms.gle/meSWF8Jzy1VvZEnK8"]}, {"tipo": "ejemplo", "icono": "🏆", "titulo": "Lo que hace ganar un pitch", "situacion": "En los concursos de startups, quien gana no es quien más habla, sino quien **resuelve un problema claro** s de teclado de 7 minutos y cronómetro visible."]}, "diversidad": [{"perfil": "Estudiante con TEA y altas capacidades", "medidas": "Agenda de cada sesión anticipada en Moodle y aviso previo de los cambios de espacio (medición en el aula); rol estable y bien definido (diseñador/a CAD o gestor/a de documentación); instrucciones por escrito además de orales; posibilidad de grabar su parte del pitch. Enriquecimiento: pieza reto de vistas, cálculo de m² por estudiante y comparación de fuentes contradictorias, y papel de mentor/a técnico en Floorplanner si lo desea."}, {"perfil": "Alumnado con TDAH (2)", "medidas": "Tareas fragmentadas con tiempo visible (temporizador de la web de clase), rol activo de medidor/a principal en la sesión 10, turnos cortos al teclado, ubicación cerca del docente y de la pantalla, lista de pasos de cada práctica y tiempo extra o prueba de escalas en dos partes."}, {"perfil": "Alumnado con más dificultades de aprendizaje (2)", "medidas": "Fichas con el primer ejercicio resuelto y piezas de nivel elemental en EducacionPlastica.net, papel milimetrado, calculadora de escalas, enunciados leídos en voz alta, apoyo de un compañero o compañera de equipo y prórroga en las Tareas de Moodle."}, {"perfil": "Alumnado con poca experiencia en dibujo técnico y CAD (todo el grupo)", "medidas": "Progresión de lo físico (piezas, cinta métrica) a lo gráfico y lo digital; demostraciones guiadas antes de cada herramienta; tutorial de Floorplanner en Moodle; revisión entre iguales antes de entregar."}], "roles": [{"rol": "Medidor/a principal", "funcion": "Maneja los instrumentos de medida, dicta las medidas y comprueba que las del plano y Floorplanner coinciden con la realidad."}, {"rol": "Diseñador/a CAD", "funcion": "Crea y comparte los proyectos de Floorplanner, coordina los turnos al teclado y genera el render 3D."}, {"rol": "Gestor/a de documentación", "funcion": "Anota los datos en la sesión de medición, organiza la carpeta del equipo en Drive con el protocolo de nombres, cuida las fuentes, los créditos y la licencia y hace las entregas."}, {"rol": "Portavoz", "funcion": "Coordina el reparto y los tiempos del Elevator Pitch y es la voz del equipo ante el docente. En los equipos de 3, el medidor/a asume también este rol."}], "evaluacion": {"instrumentos": {"TYD.3.1.1": ["Rúbrica de la Tarea 3.7 (línea del cartel)", "Ficha de investigación A8 y foro de referentes", "Observación directa"], "TYD.3.1.2": ["Tareas 3.1, 3.2, 3.3 (Kahoot) y 3.4 (test general), con nota directa de 1 a 10", "Rúbrica de la Tarea 3.5 (vistas y escalas)", "Prueba de ejecución de escalas (A3) y caso del detective"], "TYD.3.2.1": ["Rúbrica de la Tarea 3.7 (diseño en Floorplanner)", "Plan de zonas A9", "Testeo entre equipos (F3)"], "TYD.3.4.1": ["Rúbrica de la Tarea 3.5 (acotación, croquis y plano)", "Tarea 3.6 (Apto / No apto)", "Rúbrica de la Tarea 3.7 (Elevator Pitch)", "Observación directa de la medición y del pitch"], "TYD.3.6.3": ["Rúbrica de la Tarea 3.5 (dossier digital)", "Lista de cotejo de la carpeta de Drive"]}, "cotejo": [{"criterio": "TYD.3.1.1", "indicadores": ["Busca información sobre zonas, ergonomía, iluminación o eficiencia en fuentes fiables.", "Valora la fiabilidad de cada fuente (autor, fecha, tipo de web).", "Define las necesidades del aula a partir de la investigación y de las entrevistas.", "Justifica en el cartel las decisiones con las fuentes consultadas."]}, {"criterio": "TYD.3.1.2", "indicadores": ["Representa alzado, planta y perfil de piezas sencillas alineados según el sistema europeo.", "Calcula medidas reales y de dibujo con escalas de reducción y ampliación.", "Elige y justifica la escala adecuada para un objeto o espacio.", "Detecta en un plano los errores de acotación y explica la regla que incumplen."]}, {"criterio": "TYD.3.2.1", "indicadores": ["Organiza el aula en las cinco zonas de aprendizaje con un lugar lógico para cada una.", "Aplica criterios de ergonomía y accesibilidad (mobiliario regulable, pasillos de 90 cm).", "Aplica criterios de sostenibilidad (luz natural, ventilación, eficiencia energética).", "Incorpora mejoras a partir del testeo con otro equipo."]}, {"criterio": "TYD.3.4.1", "indicadores": ["Dibuja el croquis a mano alzada con todas las medidas.", "Dibuja el plano del aula a escala 1:50 acotado según la norma y con cajetín.", "Traslada correctamente las medidas al programa CAD.", "Comunica la propuesta en un Elevator Pitch con vocabulario técnico adecuado."]}, {"criterio": "TYD.3.6.3", "indicadores": ["Guarda los archivos en el Drive del centro con el protocolo de nombres.", "Une el dossier en un PDF legible y ordenado.", "Indica la licencia y los créditos de los materiales.", "Entrega en plazo."]}], "agentes": {"Heteroevaluación": "Tareas 3.1 a 3.4 (nota directa de 1 a 10: entregas, Kahoot y test general), Tarea 3.6 (Apto / No apto), rúbricas de las Tareas 3.5 y 3.7 y observación directa de la medición y del Elevator Pitch.", "Coevaluación": "Caso del detective por equipos, testeo del diseño entre equipos (F3) y coevaluación del Elevator Pitch (F4).", "Autoevaluación": "Corrección de las láminas de vistas con la solución, listas de comprobación de las fichas y diana de autoevaluación final (F5)."}}, "moodle": {"estructura": "Una sección «SdA 3 · Un Aula del Futuro» en el curso de Tecnología y Digitalización de 3.º ESO con el área de texto del reto, la página «Cómo se evalúa», las cuatro Tareas (3.1 a 3.7) y el foro de referentes, en el orden de las sesiones.", "secciones": [{"nombre": "SdA 3 · Un Aula del Futuro", "elementos": ["Área de texto y medios con el reto, la pregunta guía y los enlaces a la web de clase", "Página «Cómo se evalúa» con las listas de verificación y las rúbricas", "URL a la práctica de vistas de EducacionPlastica.net y al tutorial de Floorplanner", "Tareas 3.1 a 3.7", "Foro «Referentes: aulas que nos inspiran»"]}], "calificaciones": "Cinco categorías, una por criterio (TYD.3.1.1, TYD.3.1.2, TYD.3.2.1, TYD.3.4.1 y TYD.3.6.3). Las Tareas 3.1, 3.2, 3.3 y 3.4 se califican con nota directa de 1 a 10 (puntuación máxima 10): en la 3.1 y la 3.2 tras corregir la entrega, y en la 3.3 (Kahoot) y la 3.4 (test de Google Forms) introduciendo a mano la nota del informe o del formulario. La Tarea 3.6 usa la escala «No apto, Apto». Las Tareas 3.5 y 3.7 se califican con rúbrica sobre 10; como cada rúbrica evalúa varios criterios, la nota de cada criterio (media de sus líneas, ponderada en la 3.7) se anota como ítem manual en su categoría. La observación del pitch se recoge en la rúbrica de la 3.7.", "configuracion": ["Escala personalizada «No apto, Apto».", "Grupos: un grupo por equipo de consultoría y agrupamiento «SdA3-Aula del Futuro» para las Tareas 3.6 y 3.7 (entrega por grupos).", "Rúbricas de las Tareas 3.5 y 3.7 guardadas como plantilla.", "Prórrogas individuales para el alumnado con NEAE.", "Finalización de actividad activada para que el alumnado vea su progreso."], "area_texto": {"bloques": [{"nombre": "Bloque 1 · Fundamentación técnica", "descripcion": "Vistas, escalas y acotación · Notas: vistas (3.1), escalas (3.2), Kahoot de acotación (3.3) y test general (3.4) · Producto: **dossier técnico gráfico** (Tarea 3.5)", "sesiones": "1-9"}, {"nombre": "Bloque 2 · Medimos y dibujamos nuestra aula", "descripcion": "Croquis y plano a 1:50 · Entrega del dossier en la sesión 11", "sesiones": "10-11"}, {"nombre": "Bloque 3 · Diseñamos el Aula del Futuro", "descripcion": "Investigación y Floorplanner 2D/3D", "sesiones": "12-15"}, {"nombre": "Bloque 4 · Lo contamos", "descripcion": "Cartel en Canva y **Elevator Pitch** en la sesión 17", "sesiones": "16-17"}], "eventos": [{"sesion": 6, "texto": "Prueba de escalas (va al dossier técnico)", "tipo": "Se evalúa en clase"}, {"sesion": 17, "texto": "Elevator Pitch ante la clase (completa la nota de la Tarea 3.7)", "tipo": "Se evalúa en clase"}], "url_clase": "https://florindotic.es/content/curso2026-2027/tecnologia-y-digitalizacion/3-eso/sda3/clase.html", "nota_evaluacion": "Las Tareas **3.1 a 3.4** tienen una **nota de 1 a 10** (el Kahoot y el test se hacen en clase y el profesor pone la nota en Moodle). Las Tareas con **rúbrica** (3.5 y 3.7) se puntúan de 1 a 10 en cada línea; la 3.7 cuenta un **66 %** por el trabajo entregado y un **33 %** por el Elevator Pitch. Tienes las rúbricas completas en la página **«Cómo se evalúa»** de esta sección."}}, "seneca": {"justificacion": "El alumnado de 3.º ESO actúa como equipo de consultoría para transformar un aula del IES Villa de Mijas en un Aula del Futuro. Aprende a representar objetos y espacios con vistas, escalas y acotación normalizada, mide y dibuja su aula a escala, la modela en un programa CAD con criterios de ergonomía, accesibilidad y sostenibilidad, organiza su documentación digital de forma segura y defiende la propuesta en un Elevator Pitch.", "actividades": [{"titulo": "Vistas normalizadas en EducacionPlastica.net", "tipo": "Estructuración", "abreviatura": "EST1", "tarea": "3.1", "sesiones": [1, 2], "trazabilidad": "Realización de actividades.", "criterios": ["TYD.3.1.2"]}, {"titulo": "Fichas de escalas", "tipo": "Estructuración", "abreviatura": "EST2", "tarea": "3.2", "sesiones": [3, 4, 5, 6], "trazabilidad": "Realización de actividades.", "criterios": ["TYD.3.1.2"]}, {"titulo": "Normas de acotación: ejemplos bien y mal acotados y Kahoot", "tipo": "Estructuración", "abreviatura": "EST3", "tarea": "3.3", "sesiones": [7, 8], "trazabilidad": "Cuestionario con preguntas de comprensión", "criterios": ["TYD.3.1.2"]}, {"titulo": "Test general de vistas, escalas y acotación", "tipo": "Estructuración", "abreviatura": "EST4", "tarea": "3.4", "sesiones": [9], "trazabilidad": "Prueba escrita", "criterios": ["TYD.3.1.2"]}, {"titulo": "Dossier técnico gráfico del aula", "tipo": "Estructuración", "abreviatura": "EST5", "tarea": "3.5", "sesiones": [10, 11], "trazabilidad": "RÚBRICA", "criterios": ["TYD.3.1.2", "TYD.3.4.1", "TYD.3.6.3"]}, {"titulo": "Propuesta Aula del Futuro: diseño CAD, cartel y Elevator Pitch", "tipo": "Conclusión", "abreviatura": "CON1", "tarea": "3.7", "sesiones": [12, 13, 14, 15, 16, 17], "trazabilidad": "RÚBRICA", "criterios": ["TYD.3.2.1", "TYD.3.1.1", "TYD.3.4.1"]}]}, "notas_rigor": ["Se respeta la concreción curricular de la SdA de referencia (criterios TYD.3.1.1, 3.1.2, 3.2.1, 3.4.1 y 3.6.3). Se añade el saber TYD.3.D.3 (almacenamiento seguro y organización de la información), vinculado oficialmente a TYD.3.6.3, porque el dossier digital y el protocolo de nombres lo movilizan.", "La norma de acotación es la UNE-EN ISO 129-1; la UNE-EN ISO 128 (citada en la SdA de referencia) regula los tipos de línea. Se mencionan las dos.", "El modelo Future Classroom Lab (European Schoolnet, difundido por el INTEF) define seis zonas; el encargo exige las cinco de la SdA de referencia y deja Intercambiar como opcional.", "En Séneca se registran las Tareas con nota: las de calificación directa (3.1 a 3.4, criterio TYD.3.1.2) y las de rúbrica (3.5 y 3.7); entre todas evalúan los cinco criterios. La Tarea 3.6 (Apto / No apto) no pasa a Séneca.", "Las sesiones 1, 3 y 7 no llevan criterio calificable: son de diagnóstico o de explicación con práctica guiada.", "Las láminas impresas de las sesiones 1 y 2 son de Picuino (picuino.com, CC BY-SA 4.0) y usan el sistema europeo con el perfil visto desde la derecha, dibujado a la izquierda del alzado. Por eso se enseña la regla general (cada vista al lado contrario del que se mira) en lugar de fijar el perfil izquierdo.", "Los ejemplos bien y mal acotados de las sesiones 7 a 9 se han redibujado como SVG a partir de la tabla «Normas básicas de acotación» que aportó el docente, siguiendo la UNE-EN ISO 129-1.", "Las Tareas 3.3 y 3.4 no tienen entrega en Moodle: recogen la nota del Kahoot y del test de Google Forms, que el docente introduce a mano. Para identificar a cada estudiante, el Kahoot se juega en modo individual con nombre real y el formulario recoge el correo del centro."], "anexos": {"plantillas": [{"id": "A2", "titulo": "Fichas de escalas", "sesiones": [3, 4, 5], "agrupamiento": "Individual", "herramienta": "Papel o Google Docs (una copia por estudiante)", "entrega": "la Tarea 3.2 (sesión 6), en PDF o en fotos", "docente": "El bloque 2 necesita el plano de un piso de unos 70 m² a escala 1:100 (impreso o proyectado). Soluciones del bloque 1: 1:50 reducción, 2:1 ampliación, 1:1 natural, 1:100 reducción, 5:1 ampliación; 3 cm a 1:10 = 30 cm; 4 cm a 1:50 = 2 m; 7,5 cm a 1:100 = 7,5 m.", "instrucciones": "Escala = **medida en el dibujo : medida real**. Pasa siempre a las **mismas unidades** (cm) antes de calcular. En reducción, para dibujar **divides**; en ampliación, **multiplicas**.", "bloques": [{"titulo": "Bloque 1 · ¿Qué es una escala? (sesión 3)", "texto": "1. Clasifica cada escala en reducción, natural o ampliación.", "tabla": {"columnas": ["Escala", "Tipo", "¿Para qué la usarías?"], "filas": [["1:50"], ["2:1"], ["1:1"], ["1:100"], ["5:1"]], "anchos": [3, 5, 9], "alto": 0.75}}, {"texto": "2. Calcula la medida real. Ejemplo resuelto: 6 cm a 1:20 → 6 × 20 = 120 cm = **1,2 m**.", "tabla": {"columnas": ["Medida en el dibujo", "Escala", "Operación", "Medida real"], "filas": [["3 cm", "1:10"], ["4 cm", "1:50"], ["7,5 cm", "1:100"], ["12 cm", "1:50"]], "anchos": [4, 3, 5.5, 4.5], "alto": 0.75}}, {"texto": "3. Mide con la regla la mesa dibujada a 1:20 en la pizarra o en la ficha del departamento y calcula su largo y ancho reales.", "campos": ["Largo en el dibujo y real", "Ancho en el dibujo y real"], "alto": 1}, {"titulo": "Bloque 2 · El plano de un piso (sesión 4)", "texto": "4. Mide en el plano del piso (escala 1:100) y completa la tabla.", "tabla": {"columnas": ["Estancia", "Largo dibujo", "Ancho dibujo", "Largo real", "Ancho real", "Superficie (m²)"], "filas": [["Salón"], ["Dormitorio"], ["Cocina"], ["Baño"], ["Pasillo"]], "anchos": [3, 2.6, 2.6, 2.6, 2.6, 3.6], "alto": 0.75}}, {"texto": "5. En el plano a 1:50 de otro salón, la pared mide 5,2 cm. ¿Cabe un sofá de 2,40 m? Explica la cuenta.", "lineas": 1}, {"texto": "6. Un aula mide 8 × 7 m. ¿Qué escala eliges, 1:50 o 1:100, para dibujarla en un A4 (21 × 29,7 cm) dejando margen? Calcula cuánto mediría con las dos y justifica.", "lineas": 2}, {"titulo": "Bloque 3 · Ampliación y elegir escala (sesión 5)", "texto": "7. Ejemplo resuelto: un tornillo de 8 mm a escala 5:1 mide 8 × 5 = **40 mm** en el dibujo. Completa:", "tabla": {"columnas": ["Medida real", "Escala", "Operación", "Medida en el dibujo"], "filas": [["8 mm", "5:1", "8 × 5", "40 mm"], ["12 mm", "2:1"], ["4 mm", "10:1"], ["", "2:1", "", "30 mm"]], "anchos": [4, 3, 5.5, 4.5], "alto": 0.75}}, {"texto": "8. Elige la escala más adecuada para dibujar cada objeto en un A4 y justifícalo.", "tabla": {"columnas": ["Objeto", "Medidas reales aprox.", "Escala elegida", "¿Por qué?"], "filas": [["Móvil", "15 × 7 cm"], ["Campo de fútbol", "100 × 64 m"], ["Aula", "8 × 7 m"], ["Moneda de 1 €", "23 mm"]], "anchos": [3.2, 3.8, 3, 7], "alto": 0.75}}, {"titulo": "Antes de entregar (sesión 6)", "casillas": ["He completado los tres bloques (sesiones 3, 4 y 5).", "En cada cálculo escribo la operación y la unidad.", "He razonado las dos situaciones-problema: el sofá y el aula en un A4.", "He justificado la escala elegida para cada objeto.", "Mi archivo (PDF o fotos) se lee bien y está completo."]}], "enlace": "https://docs.google.com/document/d/1daj5nA65ikk66_3omxaIeZPX1sy4XRmLCtSmDfmpSVI/copy"}, {"id": "A3", "titulo": "Prueba de ejecución: escalas", "sesiones": [6], "agrupamiento": "Individual", "herramienta": "Papel (imprimir; no compartir antes de la prueba)", "entrega": "el dossier técnico (Tarea 3.5), una vez corregida", "docente": "Prueba individual de 35 minutos con regla y calculadora. Imprime en la página siguiente o al dorso un plano sencillo de una habitación a 1:50 (por ejemplo, 4,20 × 3,60 m con una puerta de 80 cm). Soluciones parte 2: 10 cm; 2,25 m; 16 mm; 1:20. Parte 3: la mesa de 1,60 × 0,80 m mide 3,2 × 1,6 cm y la puerta 1,6 cm. Esta plantilla no se sube a Drive ni se enlaza en la web de clase.", "instrucciones": "Trabaja de forma **individual**. Escribe todas las operaciones y **las unidades**. Puedes usar regla y calculadora.", "bloques": [{"titulo": "Parte 1 · Mide y calcula (3 puntos)", "texto": "Mide en el plano de la habitación (escala 1:50) y calcula las medidas reales.", "tabla": {"columnas": ["Elemento", "Medida en el plano", "Operación", "Medida real"], "filas": [["Largo de la habitación"], ["Ancho de la habitación"], ["Ancho de la puerta"]], "anchos": [4.5, 3.8, 4.7, 4], "alto": 0.75}}, {"titulo": "Parte 2 · Completa la tabla (3 puntos)", "tabla": {"columnas": ["Medida real", "Escala", "Medida en el dibujo"], "filas": [["5 m", "1:50", ""], ["", "1:50", "4,5 cm"], ["8 mm", "2:1", ""], ["1,20 m", "", "6 cm"]], "anchos": [5.5, 5, 6.5], "alto": 0.75}}, {"titulo": "Parte 3 · Dibuja a escala 1:50 (2 puntos)", "texto": "Dibuja en el recuadro una mesa de 1,60 × 0,80 m y, al lado, el hueco de una puerta de 80 cm. Escribe debajo las medidas en el dibujo.", "lineas": 3}, {"titulo": "Parte 4 · Elige la escala (2 puntos)", "texto": "Tienes que dibujar en un A4 el patio del instituto, que mide 40 × 25 m. ¿Usarías 1:50, 1:100 o 1:200? Calcula y justifica.", "lineas": 2}]}, {"id": "A6", "titulo": "Hoja de toma de datos y croquis del aula", "sesiones": [10], "agrupamiento": "Equipo", "herramienta": "Papel sobre soporte rígido (una por equipo; después se fotografía)", "entrega": "el dossier técnico (Tarea 3.5), como foto", "docente": "Asigna a cada equipo una zona de partida (pared de ventanas, pared de la puerta, pizarra, pared del fondo) y haz que dos equipos midan la misma pared para comparar. Recuerda las normas de seguridad antes de repartir las cintas.", "instrucciones": "Medimos **en centímetros**, pegados al suelo y en línea recta. Cada medida se comprueba **dos veces**.", "bloques": [{"titulo": "Contrato de equipo", "campos": ["Nombre del equipo de consultoría", "Medidor/a principal", "Anotador/a de datos (después: gestor/a de documentación)", "Dibujante de croquis (después: diseñador/a CAD)", "Portavoz"], "alto": 0.9}, {"casillas": ["Nos comprometemos a escuchar todas las ideas, cumplir nuestro rol y ayudarnos.", "Cumplimos las normas: la cinta no se suelta de golpe y nadie se sube a sillas ni mesas."]}, {"titulo": "Tabla de medidas (en cm)", "tabla": {"columnas": ["Elemento", "Medida 1", "Medida 2 (comprobación)", "Posición (distancia a una esquina)"], "filas": [["Largo del aula"], ["Ancho del aula"], ["Puerta 1: ancho"], ["Puerta 2: ancho (si hay)"], ["Ventana 1: ancho / altura del alféizar"], ["Ventana 2"], ["Ventana 3"], ["Pilares"], ["Pizarra / pantalla"], ["Radiadores y enchufes"]], "anchos": [5.2, 2.8, 3.6, 5.4], "alto": 0.85}}, {"titulo": "Croquis a mano alzada", "texto": "Planta del aula sin regla y sin escala, pero proporcionada. Añade todas las cotas de la tabla.", "lineas": 21}], "enlace": "https://docs.google.com/document/d/1t-Q4FQ5l4Q2OQfPuGi72B5JMkmDJKrfSBWfCXPo3-Mo/copy"}, {"id": "A7", "titulo": "Guía del plano del aula a escala 1:50", "sesiones": [11], "agrupamiento": "Individual", "herramienta": "Papel (consulta mientras dibujas el plano en A4)", "entrega": "la Tarea 3.5", "docente": "Ten papel milimetrado para quien lo pida. Si un aula mide más de 13,5 m de largo, el plano no cabe a 1:50 en A4 horizontal con margen: en ese caso usa A3 o escala 1:100.", "instrucciones": "Cada persona dibuja **su propio plano** con las medidas de su equipo. Usa lápiz **H** para trazar y **HB** para repasar.", "bloques": [{"titulo": "1 · Pasa las medidas a 1:50", "tabla": {"columnas": ["Elemento", "Medida real (cm)", "÷ 50", "Medida en el plano (cm)"], "filas": [["Largo del aula"], ["Ancho del aula"], ["Puerta"], ["Ventanas"], ["Pizarra"], ["Pilares"]], "anchos": [5, 4, 2.5, 5.5], "alto": 0.55}}, {"titulo": "2 · Dibuja", "lista": ["Márgenes de 1 cm y cajetín abajo a la derecha.", "Muros exteriores con dos líneas (grosor real del muro, unos 30 cm → 0,6 cm).", "Huecos de puertas con el giro (un cuarto de círculo) y ventanas con tres líneas finas.", "Pilares y pizarra.", "Repasa con HB y borra las líneas de construcción."]}, {"titulo": "3 · Acota en cm", "texto": "Acota el largo y el ancho interiores, la posición y el ancho de cada puerta y ventana. Recuerda: la cifra es la medida **real** (720, no 14,4)."}, {"titulo": "4 · Cajetín", "tabla": {"columnas": ["Nombre", "Título", "Escala", "Unidad", "Fecha", "Equipo"], "filas": 1, "anchos": [3.5, 3.5, 2, 2, 2.5, 3.5], "alto": 0.7}}, {"titulo": "5 · Dossier digital (protocolo de nombres)", "lista": ["Carpeta de Drive: **SdA3_Apellido_Nombre**.", "Archivos: **01_Vistas**, **02_Escalas**, **03_Acotacion**, **04_Croquis**, **05_Plano** (foto o escaneo).", "PDF final: **SdA3_Dossier_Apellido.pdf** (une las imágenes en un Documento de Google y descárgalo en PDF).", "Sin caras ni datos personales en las fotos."]}, {"titulo": "Antes de entregar", "casillas": ["El plano está a 1:50 y las medidas coinciden con la tabla.", "Hay muros, puertas con su giro, ventanas y pizarra.", "Todas las cotas están en cm, una sola vez, y el cajetín indica escala y unidad.", "Mi PDF tiene las cinco partes en orden y los archivos siguen el protocolo de nombres."]}], "enlace": "https://docs.google.com/document/d/14y7i72THSWiDjtFLB33z-ZJDf-He5kAOOlhkpUBpBQ8/copy"}, {"id": "A8", "titulo": "Ficha de investigación y necesidades", "sesiones": [12], "agrupamiento": "Equipo", "herramienta": "Google Docs (una copia por equipo)", "entrega": "la carpeta del equipo en Drive (evidencia para la Tarea 3.7)", "docente": "Webs de partida fiables para quien lo necesite: la web de Aula del Futuro del INTEF, Future Classroom Lab de European Schoolnet, el Instituto Nacional de Seguridad y Salud en el Trabajo (ergonomía) y el IDAE (eficiencia energética).", "instrucciones": "Cada miembro investiga **un tema** y aporta **dos fuentes**. Después, todo el equipo define las necesidades del aula.", "bloques": [{"
