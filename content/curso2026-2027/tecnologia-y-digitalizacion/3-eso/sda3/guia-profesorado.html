turales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": ["TYD.3.4"]}}, "idx": {"criterios": ["TYD.3.1.1", "TYD.3.1.2", "TYD.3.2.1", "TYD.3.4.1", "TYD.3.6.3"], "competencias": ["TYD.3.1", "TYD.3.2", "TYD.3.4", "TYD.3.6"], "saberes": ["TYD.3.A.1", "TYD.3.A.2", "TYD.3.A.5", "TYD.3.B.1", "TYD.3.B.2", "TYD.3.B.3", "TYD.3.D.2", "TYD.3.D.3"], "descriptores": ["CCEC3", "CCEC4", "CCL1", "CCL3", "CD1", "CD2", "CD3", "CD4", "CD5", "CE1", "CE3", "CP2", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM2", "STEM3", "STEM4"], "sesionesPorCriterio": {"TYD.3.1.2": [2, 4, 5, 6, 8, 11], "TYD.3.4.1": [9, 10, 11, 13, 16, 17], "TYD.3.6.3": [11], "TYD.3.1.1": [12, 15, 16], "TYD.3.2.1": [14, 15, 16]}, "porMateria": [{"codigo": "TYD", "criterios": ["TYD.3.1.1", "TYD.3.1.2", "TYD.3.2.1", "TYD.3.4.1", "TYD.3.6.3"], "competencias": ["TYD.3.1", "TYD.3.2", "TYD.3.4", "TYD.3.6"], "saberes": ["TYD.3.A.1", "TYD.3.A.2", "TYD.3.A.5", "TYD.3.B.1", "TYD.3.B.2", "TYD.3.B.3", "TYD.3.D.2", "TYD.3.D.3"], "descriptores": ["CCEC3", "CCEC4", "CCL1", "CCL3", "CD1", "CD2", "CD3", "CD4", "CD5", "CE1", "CE3", "CP2", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM2", "STEM3", "STEM4"]}], "materiasTxt": "Tecnología y Digitalización"}, "seneca": {"titulo": "SdA 3: Un Aula del Futuro", "temporalizacion": "17 sesiones", "justificacion": "El alumnado de 3.º ESO actúa como equipo de consultoría para transformar un aula del IES Villa de Mijas en un Aula del Futuro. Aprende a representar objetos y espacios con vistas, escalas y acotación normalizada, mide y dibuja su aula a escala, la modela en un programa CAD con criterios de ergonomía, accesibilidad y sostenibilidad, organiza su documentación digital de forma segura y defiende la propuesta en un Elevator Pitch.", "producto_final": "Por equipo: (1) dossier técnico gráfico con el croquis a mano alzada y el plano del aula a escala 1:50 acotado según la norma (el plano es individual); (2) propuesta del Aula del Futuro modelada en 2D y 3D en Floorplanner, organizada por zonas de aprendizaje; (3) cartel promocional e infografía en Canva con el render 3D y la justificación de las zonas, y (4) Elevator Pitch de 2 minutos ante la clase como si fuera el equipo directivo.", "concrecion": [{"materia": "Tecnología y Digitalización", "texto": "COMPETENCIAS ESPECÍFICAS\nTYD.3.1.Buscar y seleccionar la información adecuada proveniente de diversas fuentes, de manera crítica y segura, aplicando procesos de investigación, métodos de análisis de productos y experimentando con herramientas de simulación, para definir problemas tecnológicos e iniciar procesos de creación de soluciones a partir de la información obtenida.\nTYD.3.2.Abordar problemas tecnológicos con autonomía y actitud creativa, aplicando conocimientos interdisciplinares y trabajando de forma cooperativa y colaborativa, para diseñar y planificar soluciones a un problema o necesidad de forma eficaz, innovadora y sostenible.\nTYD.3.4.Describir, representar e intercambiar ideas o soluciones a problemas tecnológicos o digitales, utilizando medios de representación, simbología y vocabulario adecuados, así como los instrumentos y recursos disponibles, valorando la utilidad de las herramientas digitales para comunicar y difundir información y propuestas.\nTYD.3.6.Comprender los fundamentos del funcionamiento de los dispositivos y aplicaciones habituales de su entorno digital de aprendizaje, analizando sus componentes y funciones y ajustándolos a sus necesidades para hacer un uso más eficiente y seguro de los mismos y para detectar y resolver problemas técnicos sencillos.\n\nCRITERIOS DE EVALUACIÓN\nTYD.3.1.1.Definir problemas o necesidades planteadas, buscando y contrastando información procedente de diferentes fuentes de manera crítica y segura, evaluando su fiabilidad y pertinencia.\nTYD.3.1.2.Comprender y examinar productos tecnológicos de uso habitual a través del análisis de objetos y sistemas, empleando el método científico y utilizando herramientas de simulación en la construcción de conocimiento.\nTYD.3.2.1.Idear y diseñar soluciones eficaces, innovadoras y sostenibles a problemas definidos, aplicando conceptos, técnicas y procedimientos interdisciplinares, así como criterios de sostenibilidad, con actitud emprendedora, perseverante y creativa.\nTYD.3.4.1.Representar y comunicar el proceso de creación de un producto, desde su diseño hasta su difusión, elaborando documentación técnica y gráfica con la ayuda o no de herramientas digitales, empleando los formatos y el vocabulario técnico adecuados, de manera colaborativa, tanto presencialmente como en remoto.\nTYD.3.6.3.Organizar la información de manera estructurada, aplicando técnicas de almacenamiento seguro.\n\nSABERES BÁSICOS\nTYD.3.A.1.Estrategias, técnicas y marcos de resolución de problemas sencillos en diferentes contextos y sus fases.\nTYD.3.A.2.Estrategias de búsqueda crítica de información durante la investigación y definición de problemas sencillos planteados.\nTYD.3.A.5.Emprendimiento, resiliencia, perseverancia y creatividad para abordar problemas sencillos desde una perspectiva interdisciplinar.\nTYD.3.B.1.Técnicas de representación gráfica: acotación y escalas. Boceto y croquis. Proyección cilíndrica ortogonal para la representación de objetos: vistas normalizadas de una pieza.\nTYD.3.B.2.Aplicaciones CAD en dos y tres dimensiones para la representación de esquemas, circuitos, planos y objetos básicos.\nTYD.3.B.3.Herramientas digitales para la elaboración, publicación y difusión de documentación técnica e información multimedia relativa a proyectos sencillos.\nTYD.3.D.2.Herramientas de edición y creación de contenidos: instalación, configuración y uso responsable. Propiedad intelectual.\nTYD.3.D.3.Técnicas de tratamiento, organización y almacenamiento seguro de la información. Copias de seguridad.\n\nDESCRIPTORES OPERATIVOS\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCCL1. Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCP2. A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.\nSTEM4. Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos."}], "actividades": [{"titulo": "Dossier técnico gráfico del aula", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "1", "tarea": "3.2 · Dossier técnico gráfico", "descripcion": "Sesión 1 (50 min): Gancho: ¿es cómoda nuestra clase? Del objeto a sus vistas\nReto: Conocer el reto de la SdA y descubrir que un objeto 3D se describe con tres vistas: alzado, planta y perfil.\n- Gancho del reto (10 min). El docente proyecta dos fotos: un aula tradicional en filas y un Aula del Futuro con zonas (puede usar las del INTEF). Pregunta: «¿En cuál aprenderíais mejor? ¿Por qué?». Lluvia de ideas en voz alta de 3 cosas que cambiaríais de vuestra clase (luz, sillas, enchufes, ruido). Se presenta el encargo del equipo directivo y el producto final, y se avisa de que primero hay que aprender el «idioma» de los planos.\n- Diagnóstico (8 min). Cada estudiante responde el formulario de diagnóstico (Formulario F1): reconocer una planta, leer una escala sencilla, identificar una cota y qué programas conoce. Sirve para formar equipos heterogéneos en la sesión 10.\n- Simulador 3D: caras ocultas (12 min). En la pantalla grande el docente usa un interactivo 3D de vistas (EducacionPlastica.net u otro visor) y gira un bloque en L: ¿qué ves de frente (alzado), desde arriba (planta) y desde la izquierda (perfil)? Se colocan en el sistema europeo: planta debajo del alzado y perfil izquierdo a la derecha del alzado. Se reparten bloques físicos para que cada pareja los gire en la mesa.\n- Primeras vistas guiadas (17 min). Con la lámina de vistas (Plantilla en el anexo A1) y su rejilla, el alumnado dibuja las tres vistas de las piezas 1 y 2 copiando el ejemplo resuelto en la pizarra paso a paso: primero el alzado, después la planta alineada debajo y por último el perfil. El docente revisa en la mesa la alineación.\n- Salida (3 min). Pregunta de salida oral: «¿Qué vista dibujarías de una mesa para saber cuánto ocupa en el suelo?» (la planta).\n- Evidencia: Formulario de diagnóstico F1\n- Evidencia: Piezas 1 y 2 de la lámina A1 (diagnóstica)\n\nSesión 2 (50 min): Vistas normalizadas: la lámina completa\nReto: Dibujar alzado, planta y perfil de seis piezas a partir de su perspectiva isométrica y entregarlas.\n- Repaso con el simulador (7 min). Quiz rápido en la pantalla: se muestra una pieza en el simulador 3D y tres planos posibles; la clase vota cuál es su planta. El docente gira la pieza para comprobarlo y recuerda las aristas ocultas (línea discontinua).\n- Lámina por niveles (33 min). El alumnado completa la lámina de vistas (Plantilla en el anexo A1): piezas 3 y 4 (nivel básico, solo escalones), 5 (nivel medio, con un hueco) y 6 (reto, con un plano inclinado). Quien termina antes ayuda como «revisor/a» con la lista de comprobación. Las piezas físicas están en la mesa del docente para quien las necesite.\n- Comprobación por parejas (5 min). Cada estudiante intercambia la lámina con su compañero/a y comprueba con la lista: tres vistas por pieza, alineadas y con las aristas ocultas en discontinua.\n- Entrega (5 min). Se hace una foto nítida de la lámina con la cámara del ordenador o el escáner del aula y se sube a la Tarea 3.1.\n- Moodle Centros: Tarea «3.1 · Lámina de vistas normalizadas» (corrección Apto / No apto). Comprobar que cada estudiante representa las tres vistas de una pieza alineadas según el sistema europeo.\n- Evidencia: Lámina de vistas (Tarea 3.1, Apto / No apto)\n\nSesión 3 (50 min): El error del arquitecto: qué es una escala\nReto: Entender qué significa una escala y distinguir escalas de reducción, ampliación y natural.\n- Gancho: el error del arquitecto (10 min). Se proyecta un vídeo corto o una noticia sobre un error de escala o de medida en una obra (puentes que no encajan, un submarino que no cabía en el puerto, muebles que no pasan por la puerta). Pregunta: «¿Qué pasó? ¿Cómo se podía haber evitado?».\n- Qué es una escala (12 min). Explicación con ejemplos cotidianos: el mapa de Google Maps, una maqueta de coche 1:43 y la foto de un insecto ampliada. Escala = medida en el dibujo : medida real (en las mismas unidades). Reducción (1:50, 1:100), natural (1:1) y ampliación (2:1, 5:1).\n- Ejercicios graduados (bloque 1) (23 min). Fichas de escalas (Plantilla en el anexo A2), bloque 1: clasificar escalas, pasar de dibujo a realidad con 1:10, 1:50 y 1:100 y medir con la regla una mesa dibujada a 1:20. Se permite calculadora.\n- Corrección en voz alta (5 min). Se corrigen tres ejercicios en la pizarra; cada estudiante marca sus aciertos y anota una duda.\n- Evidencia: Bloque 1 de la ficha de escalas A2\n\nSesión 4 (50 min): Escalas de reducción: el plano de un piso\nReto: Calcular medidas reales y medidas de dibujo en el plano de una vivienda a 1:50 y 1:100.\n- Activación (6 min). Tres preguntas rápidas en la pizarra (una puerta de 90 cm a 1:50, una cama de 2 m a 1:100, una línea de 6 cm a 1:50). Se responde en mini pizarras o en un papel y se levanta a la vez.\n- Ejemplo resuelto (10 min). El docente proyecta el plano de un piso de 70 m² a 1:100 y resuelve en voz alta: medir el salón con la regla, pasarlo a metros y calcular su superficie aproximada. Pregunta trampa: «¿Cuánto mediría el salón dibujado a 1:50?» (el doble).\n- Ejercicios graduados (bloque 2) (28 min). Bloque 2 de la ficha de escalas (Plantilla en el anexo A2): tabla para completar con el plano del piso (dormitorio, cocina, baño y pasillo) y dos situaciones-problema: «¿Cabe un sofá de 2,40 m en esta pared?» y «¿Qué escala elijo para que un aula de 8 × 7 m quepa en un A4 con margen?». Por parejas, cada estudiante rellena su ficha.\n- Puesta en común (6 min). Dos parejas explican la elección de escala para el A4; se concluye que 1:50 cabe y deja ver detalles y 1:100 queda muy pequeño.\n- Evidencia: Bloque 2 de la ficha A2\n\nSesión 5 (50 min): Escalas de ampliación y elegir la escala adecuada\nReto: Trabajar con escalas de ampliación y comprobar si se domina el cálculo antes de la prueba.\n- Gancho: lo muy pequeño (6 min). Se proyecta la foto de un tornillo de gafas o de un chip dibujado a 5:1. Pregunta: «¿Por qué aquí el dibujo es más grande que la realidad?».\n- Ampliación paso a paso (9 min). Ejemplo resuelto: un tornillo de 8 mm a 5:1 mide 40 mm en el dibujo; una pieza dibujada de 30 mm a 2:1 mide 15 mm reales. Se introduce la regla de oro: la cifra de la cota siempre es la medida real.\n- Ejercicios graduados (bloque 3) (20 min). Bloque 3 de la ficha de escalas (Plantilla en el anexo A2): ampliaciones y tabla «elige la escala» (un móvil, un campo de fútbol, un aula, una moneda) con justificación.\n- Formulario de autocomprobación (12 min). Cada estudiante responde el formulario «Comprueba tus escalas» (Formulario F2), con 8 cálculos. Al enviar ve las soluciones y el docente revisa en el resumen qué ejercicios fallan más para repasarlos al inicio de la sesión 6.\n- Salida (3 min). Semáforo: cada estudiante levanta una tarjeta verde, amarilla o roja según lo seguro que se siente para la prueba.\n- Evidencia: Bloque 3 de la ficha A2\n- Evidencia: Respuestas al formulario F2 (formativo)\n\nSesión 6 (50 min): Prueba de ejecución: escalas\nReto: Demostrar de forma individual que se calculan e interpretan escalas sin errores graves.\n- Repaso dirigido (10 min). El docente repasa los dos ejercicios que más fallaron en la autocomprobación de la sesión 5 y resuelve una duda de cada tipo (reducción, ampliación y elección de escala).\n- Prueba procedimental (35 min). Prueba individual en papel (Plantilla en el anexo A3): medir y calcular sobre un plano a 1:50, completar una tabla de escalas, dibujar a 1:50 un rectángulo de una mesa y una puerta, y elegir y justificar una escala. Se permite calculadora y regla.\n- Autocorrección del ejercicio clave (5 min). Al recoger las pruebas se proyecta la solución del ejercicio del plano para que cada estudiante sepa cómo le ha ido.\n- Evidencia: Prueba de escalas A3 (forma parte del dossier técnico, Tarea 3.2)\n\nSesión 7 (50 min): Acotación: el lenguaje de las medidas\nReto: Conocer los elementos de una cota y las reglas fundamentales de la acotación normalizada.\n- Gancho: el mueble de montar (7 min). Se proyecta un plano de montaje de un mueble con cotas y otro sin cotas. «¿Con cuál montarías la estantería?». Se presenta la acotación como el idioma común de quien diseña y quien fabrica.\n- Elementos de una cota (12 min). Con la infografía proyectada: línea de cota, líneas auxiliares, flechas (extremos) y cifra de cota. Se presentan «Las 10 reglas de oro de la acotación» (UNE-EN ISO 129-1), que quedan expuestas en el aula como infografía.\n- Copia guiada (25 min). En la ficha de acotación (Plantilla en el anexo A5), parte 1, el alumnado acota a la vez que el docente una pieza rectangular con un agujero: medidas generales primero, después la posición y el diámetro del agujero. El docente comprueba separaciones y flechas mesa por mesa.\n- Salida (6 min). Quiz proyectado de tres preguntas sobre las reglas («¿La cifra indica la medida del dibujo o la real?»).\n- Evidencia: Parte 1 de la ficha de acotación A5\n\nSesión 8 (50 min): Detective de errores: un plano mal acotado\nReto: Analizar un plano técnico, encontrar las infracciones de la norma de acotación y corregirlas.\n- Presentación del caso (5 min). El docente proyecta el plano «sospechoso» de una pieza (y lo reparte impreso): tiene 8 errores escondidos. Los equipos provisionales de 3 son agencias de detectives con 25 minutos.\n- Investigación por equipos (25 min). Con la ficha del detective (Plantilla en el anexo A4) y la infografía de las 10 reglas, cada equipo localiza los errores, indica qué regla incumplen y cómo se corrigen. Cada miembro registra en su ficha.\n- Resolución del caso (12 min). Cada equipo dice un error por turnos hasta completar los 8; el docente los marca en el plano proyectado. Gana un punto de detective cada error bien justificado.\n- Corrección individual (8 min). Cada estudiante redibuja a mano alzada, en el recuadro de la ficha, la pieza bien acotada.\n- Evidencia: Ficha del detective A4 con errores, reglas y correcciones\n\nSesión 9 (50 min): Acotamos piezas y la planta de una habitación\nReto: Aplicar las reglas de acotación en las vistas de una pieza y en la planta de una habitación a escala.\n- Recordatorio exprés (5 min). El docente muestra durante 30 segundos la infografía de las 10 reglas, la oculta y la clase dice en voz alta todas las que recuerda.\n- Acotar las vistas de una pieza (18 min). Ficha de acotación (Plantilla en el anexo A5), parte 2: acotar el alzado y la planta de la pieza 5 de la lámina de vistas, repartiendo las cotas entre las vistas sin repetir ninguna.\n- Planta de una habitación a 1:50 (22 min). Parte 3 de la ficha A5: la planta de un dormitorio de 3,20 × 2,80 m con una puerta de 80 cm y una ventana de 1,20 m ya dibujada a 1:50. El alumnado la acota en centímetros (como en los planos de edificios) e indica la escala y la unidad en el cajetín. Ensayo directo del plano del aula.\n- Autoevaluación con la lista (5 min). Cada estudiante revisa su ficha con la lista de comprobación de la ficha A5 y la guarda en su carpeta: irá al dossier técnico.\n- Evidencia: Ficha de acotación A5 (va al dossier técnico, Tarea 3.2)\n\nSesión 10 (50 min): Lanzamiento del desafío: medimos nuestra aula\nReto: Formar los equipos de consultoría, medir el aula real y dibujar su croquis acotado a mano alzada.\n- Lanzamiento del desafío (6 min). El docente lee el encargo del equipo directivo y presenta los equipos (6 de 4 y 1 de 3), formados con el diagnóstico F1 para que sean heterogéneos. Se reparten los roles: medidor/a principal, anotador/a de datos y dibujante de croquis en esta sesión (después: diseñador/a CAD, gestor/a de documentación y portavoz).\n- Contrato y normas de medición (6 min). Cada equipo firma el contrato de equipo de la hoja de toma de datos (Plantilla en el anexo A6). Normas: la cinta no se suelta de golpe, nadie se sube a sillas ni mesas, se mide a la altura del suelo y se anota en centímetros.\n- Medición en el aula (25 min). Cada equipo mide su zona asignada y después el contorno completo: largo y ancho del aula, puertas (ancho y posición), ventanas (ancho, altura del alféizar y posición), pilares, radiadores, enchufes y pizarra. Se anota todo en la tabla de la hoja A6. Dos equipos miden la misma pared para comparar y detectar errores.\n- Croquis a mano alzada (10 min). El dibujante de croquis traza en la hoja A6 la planta del aula a mano alzada, proporcionada pero sin escala, y entre todo el equipo se añaden las cotas medidas.\n- Comprobación cruzada (3 min). Los equipos que midieron la misma pared comparan su dato; si difieren más de 5 cm, se vuelve a medir al inicio de la sesión 11.\n- Evidencia: Hoja de toma de datos y croquis A6 con contrato de equipo\n- Evidencia: Observación directa del proceso de medición\n\nSesión 11 (50 min): El plano del aula a escala y el dossier técnico\nReto: Dibujar a 1:50 el plano acotado del aula, organizar el dossier técnico digital y entregarlo.\n- Planos profesionales (4 min). Se proyecta el plano de un centro educativo real con zonas y cajetín para fijarse en cómo se dibujan muros, puertas y ventanas.\n- Plano a escala acotado (30 min). Cada estudiante, con los datos de su equipo, dibuja en A4 con escuadra, cartabón y lápices H y HB la planta del aula a 1:50 (muros con dos líneas, puertas con su giro, ventanas), la acota en cm y completa el cajetín. Sigue la guía del plano (Plantilla en el anexo A7). Quien lo necesita usa papel milimetrado.\n- Dossier digital (14 min). Cada estudiante fotografía o escanea su lámina de vistas, la prueba de escalas corregida, la ficha de acotación A5, el croquis del equipo y su plano, los guarda en su carpeta de Drive «SdA3ApellidoNombre» con los nombres del protocolo (01Vistas, 02Escalas, 03Acotacion, 04Croquis, 05Plano), los une en un PDF y lo sube a la Tarea 3.2.\n- Salida (2 min). Pregunta: «Si hubiera que dibujar el instituto entero, ¿qué escala usaríais?».\n- Moodle Centros: Tarea «3.2 · Dossier técnico gráfico» (evaluada con rúbrica 1-3-5-7-10). Recoger en un PDF las evidencias de representación gráfica: vistas, escalas, acotación, croquis y plano del aula a escala, organizadas según el protocolo de nombres.\n- Evidencia: Plano del aula a 1:50 acotado\n- Evidencia: Dossier técnico gráfico en PDF (Tarea 3.2, rúbrica)", "temporalizacion": "11 sesiónes", "recursos": "Proyector, Bloques físicos, Lámina A1, Simulador 3D, Piezas físicas, Vídeo o noticia, Ficha A2, Calculadora, Plano de un piso proyectado, Regla y calculadora, Formulario F2, Prueba A3, Infografía de las 10 reglas, Ficha A5, Escuadra y cartabón, Plano con errores, Ficha A4, Cintas métricas y flexómetros, Hoja A6, Soportes rígidos, Material de dibujo, Papel A4 y milimetrado, Google Drive", "descriptores": "CCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCCL1. Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCP2. A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM4. Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nTYD.3.1.2.Comprender y examinar productos tecnológicos de uso habitual a través del análisis de objetos y sistemas, empleando el método científico y utilizando herramientas de simulación en la construcción de conocimiento.\nTYD.3.4.1.Representar y comunicar el proceso de creación de un producto, desde su diseño hasta su difusión, elaborando documentación técnica y gráfica con la ayuda o no de herramientas digitales, empleando los formatos y el vocabulario técnico adecuados, de manera colaborativa, tanto presencialmente como en remoto.\nTYD.3.6.3.Organizar la información de manera estructurada, aplicando técnicas de almacenamiento seguro.", "ejercicios": "Responde el formulario de diagnóstico sobre dibujo técnico.\nDibuja el alzado, la planta y el perfil de las piezas 1 y 2 de la lámina.\nDibuja el alzado, la planta y el perfil de las piezas 3 a 6 de la lámina.\nRevisa la lámina de un compañero o compañera con la lista de comprobación.\nClasifica las escalas 1:50, 2:1, 1:1, 1:100 y 5:1 en reducción, natural o ampliación.\nCalcula la medida real de segmentos dibujados a escala 1:10, 1:50 y 1:100.\nMide en el plano del piso las estancias y calcula sus medidas reales.\nDecide qué escala usarías para dibujar un aula de 8 × 7 m en un A4 y justifícalo.\nCalcula medidas de dibujo y reales con escalas 2:1 y 5:1.\nElige y justifica la escala adecuada para dibujar un móvil, un campo de fútbol, un aula y una moneda.\nResponde el formulario «Comprueba tus escalas».\nResuelve la prueba de escalas: medición sobre un plano, tabla de escalas, dibujo a escala y elección justificada de escala.\nIdentifica en un plano la línea de cota, las líneas auxiliares, las flechas y la cifra de cota.\nAcota una pieza rectangular con un agujero siguiendo las reglas.\nEncuentra los 8 errores de acotación del plano, indica qué regla incumple cada uno y cómo se corrige.\nRedibuja la pieza correctamente acotada.\nAcota el alzado y la planta de una pieza sin repetir cotas.\nAcota en centímetros la planta de un dormitorio dibujado a escala 1:50 e indica la escala y la unidad.\nMide el aula y anota en la tabla largo, ancho, puertas, ventanas, pilares, enchufes y pizarra.\nDibuja el croquis a mano alzada de la planta del aula con las cotas medidas.\nDibuja a escala 1:50 la planta del aula, acotada en centímetros y con cajetín.\nOrganiza tus archivos en Drive con el protocolo de nombres y entrega el dossier técnico en un PDF.", "metodologias": "ABP, Instrucción directa con práctica guiada, Práctica guiada, Retos por niveles, Revisión entre iguales, Gamificación const $ = s => document.querySelector(s);

const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }

function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;

    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;

    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }

  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

/* ---------- cabecera ---------- */
const M = S.meta;
$('#h-kicker').textContent = `LOMLOE · Andalucía · ${IDX.materiasTxt} · ${M.curso_texto || ''}`;
$('#h-title').textContent = M.titulo; $('#h-sub').textContent = M.subtitulo || '';
$('#h-meta').innerHTML = [ `${S.sesiones.length} sesiones de ${M.duracion_sesion||50} min`, M.agrupamiento, M.temporalizacion, M.anio_academico ].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');

/* ---------- pestañas ---------- */
const TABS = [['vision','1. Visión general'],['seq','2. Secuenciación'],['map','3. Mapeo curricular'],['moodle','4. Moodle Centros'],['dua','5. DUA y diversidad'],['eval','6. Evaluación'],['seneca','7. Para Séneca']];
$('#tabs').innerHTML = TABS.map(([id,t],i)=>`<button role="tab" data-tab="${id}" aria-selected="${i===0}">${t}</button>`).join('');
$('#main').innerHTML = TABS.map(([id],i)=>`<section class="panel ${i===0?'on':''}" id="p-${id}" role="tabpanel"></section>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+b.dataset.tab)); try{localStorage.setItem('sda-tab',b.dataset.tab)}catch(_){} };
try{ const t = localStorage.getItem('sda-tab'); if(t){ const b = document.querySelector(`#tabs button[data-tab="${t}"]`); b && b.click(); } }catch(_){}
function openAll(){ document.querySelectorAll('details.ses').forEach(d=>d.open=true); }

/* ---------- 1. visión ---------- */
(function(){
  const V = S.vision || {};
  const rec = S.recursos || {};
  $('#p-vision').innerHTML = `<div class="grid g3"><div class="grid">
    <div class="card"><h2>Descripción y contexto</h2><p>${esc(V.descripcion)}</p><p>${esc(V.contexto)}</p></div>
    <div class="card"><h2>Justificación curricular</h2><p>${esc(V.justificacion)}</p>
      <div class="lab">Competencias específicas</div>${chips(IDX.competencias)}
      <div class="lab">Criterios de evaluación</div>${chips(IDX.criterios)}
      <div class="lab">Saberes básicos</div>${chips(IDX.saberes)}
      <div class="lab">Descriptores del Perfil de salida</div>${chips(IDX.descriptores)}</div>
    <div class="card reto"><h2>El reto</h2><p><i>${esc(V.reto)}</i></p><div class="lab">Pregunta guía</div><p class="q">${esc(V.pregunta_guia)}</p></div>
    <div class="card"><h2>Producto final</h2><p>${esc(V.producto_final)}</p></div>
  </div><div class="grid" style="align-content:start">
    <div class="card"><h2>Metodologías</h2>${arr(S.metodologias).map(m=>`<p><b>${esc(m.nombre)}</b>${m.descripcion?': '+esc(m.descripcion):''}</p>`).join('')}</div>
    <div class="card"><h2>Recursos</h2>${Array.isArray(rec)?ul(rec):Object.entries(rec).map(([k,v])=>`<div class="lab">${esc(k)}</div>${ul(v)}`).join('')}</div>
  </div></div>`;
})();

/* ---------- 2. secuenciación ---------- */
(function(){
  const COLORS = ['#0f766e','#1d4ed8','#7c3aed','#b45309','#be123c'];
  const fases = arr(S.fases);
  const total = S.sesiones.length;
  const fcol = {}; fases.forEach((f,i)=>fcol[f.nombre]=COLORS[i%COLORS.length]);
  const count = f => S.sesiones.filter(s=>s.fase===f.nombre).length;
  let h = `<div class="card"><h2>Distribución temporal</h2><div class="timeline">${fases.map(f=>`<div style="flex:${count(f)};background:${fcol[f.nombre]}">${esc(f.nombre)} · ${count(f)} ses.</div>`).join('')}</div>
    <div class="grid g2" style="margin-top:12px">${fases.map(f=>`<div><b style="color:${fcol[f.nombre]}">${esc(f.nombre)}</b> (sesiones ${esc(f.sesiones||'')}) — ${esc(f.finalidad||'')} · ${Math.round(count(f)/total*100)} %</div>`).join('')}</div></div>`;
  const duaSet = [...new Set(S.sesiones.flatMap(s=>arr(s.dua && s.dua.principios)))];
  h += `<div class="filters" id="ff"><span class="legend">Fase:</span><button class="on" data-f="*">Todas</button>${fases.map(f=>`<button data-f="${esc(f.nombre)}">${esc(f.nombre)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">DUA:</span>${duaSet.map(d=>`<button data-d="${esc(d)}">${esc(d)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">Moodle:</span><button data-m="1">Con actividad Moodle</button>
    <button data-open="1" style="margin-left:auto">Desplegar todas</button></div><div id="slist"></div>`;
  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){
    const list = S.sesiones.filter(s => (state.f==='*'||s.fase===state.f) && (!state.d || arr(s.dua&&s.dua.principios).includes(state.d)) && (!state.m || arr(s.moodle).length));
    $('#slist').innerHTML = list.map(s => `<details class="ses" data-n="${s.n}"><summary><div class="num" style="background:${fcol[s.fase]}22;color:${fcol[s.fase]}">${s.n}</div>
      <div><div class="stitle">Sesión ${s.n} · ${esc(s.titulo)} <span class="badge">${esc(s.fase)}</span>${arr(s.moodle).length?'<span class="badge" style="background:var(--moodle-bg);color:var(--moodle)">Moodle</span>':''}</div><div class="sreto">${esc(s.reto)}</div></div></summary>
      <div class="sbody"><div>${arr(s.actividades).map(a=>`<div class="act"><b>${esc(a.nombre)}</b><span class="min">${a.min?esc(a.min)+' min':''}</span><p>${esc(a.desc)}</p></div>`).join('')}
        ${arr(s.moodle).length?`<div class="moodle"><div class="mh">Integración con Moodle Centros</div>${arr(s.moodle).map(m=>`<div class="mitem"><div class="mt">${esc(m.recurso)} · «${esc(m.nombre)}»${corrBadge(m)}${m.criterio?' '+chip(m.criterio):''}</div><p>${esc(m.uso)}</p>${m.correccion==='apto'?`<div class="lab">Se verifica</div>${ul(m.cotejo)}`:''}${m.correccion==='rubrica'?`<p class="note">Se evalúa con la rúbrica de la pestaña «6. Evaluación».</p>`:''}${arr(m.config).length?`<div class="lab">Configuración</div>`+ul(m.config):''}</div>`).join('')}</div>`:''}
      </div><div class="side">
        <div class="lab">Criterios</div>${arr(s.criterios).length?chips(s.criterios):'<span class="note">Evaluación diagnóstica (no calificable)</span>'}
        <div class="lab">Saberes</div>${chips(s.saberes)}
        ${arr(s.metodologia).length?`<div class="lab">Metodología</div><p>${arr(s.metodologia).map(esc).join(' · ')}</p>`:''}
        ${arr(s.evidencias).length?`<div class="lab">Evidencias</div>${ul(s.evidencias)}`:''}
        ${arr(s.recursos).length?`<div class="lab">Recursos</div><p>${arr(s.recursos).map(esc).join(' · ')}</p>`:''}
        ${s.dua?`<div class="lab">DUA (${arr(s.dua.principios).map(esc).join(', ')})</div><p>${esc(s.dua.medidas)}</p>`:''}
      </div></div></details>`).join('') || '<p class="note">Ninguna sesión coincide con el filtro.</p>';
  }
  $('#ff').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.open){ openAll(); return; }
    if(b.dataset.f){ state.f=b.dataset.f; $('#ff').querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); }
    if(b.dataset.d){ state.d = state.d===b.dataset.d?null:b.dataset.d; $('#ff').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===state.d)); }
    if(b.dataset.m){ state.m=!state.m; b.classList.toggle('on',state.m); }
    render(); };
  render();
})();

/* ---------- 3. mapeo ---------- */
(function(){
  const used = new Set(IDX.saberes);
  const inst = (S.evaluacion && S.evaluacion.instrumentos) || {};
  let h = `<div class="card"><h2>Matriz curricular</h2><p class="legend">Los saberes tachados están vinculados oficialmente al criterio pero no se movilizan en esta situación de aprendizaje.</p><div class="scroll"><table class="tbl"><thead><tr><th>Competencia</th><th>Criterio</th><th>Saberes</th><th>Descriptores</th><th>Sesiones</th><th>Instrumentos</th></tr></thead><tbody>`;
  IDX.criterios.forEach(c => { const it = CUR[c]; const ce = CUR[it.competencia];
    h += `<tr><td>${chip(it.competencia)}<div class="note">${esc(ce.texto)}</div></td><td>${chip(c)}<div class="note">${esc(it.texto)}</div></td>
      <td>${arr(it.saberes).map(s=>chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}</td><td>${chips(ce.descriptores)}</td>
      <td>${(IDX.sesionesPorCriterio[c]||[]).map(n=>'S'+n).join(', ')}</td><td>${ul(inst[c])}</td></tr>`; });
  h += `</tbody></table></div></div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Criterios trabajados por sesión</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${S.sesiones.map(s=>`<th>S${s.n}</th>`).join('')}</tr></thead><tbody>`;
  IDX.criterios.forEach(c => { h += `<tr><td>${chip(c)}</td>${S.sesiones.map(s=>`<td class="tick">${arr(s.criterios).includes(c)?'✔':''}</td>`).join('')}</tr>`; });
  h += `</tbody></table></div></div>`;
  if(arr(S.notas_rigor).length) h += `<div class="card" style="margin-top:16px"><h2>Notas de rigor curricular</h2>${ul(S.notas_rigor)}</div>`;
  $('#p-map').innerHTML = h;
})();

/* ---------- 4. moodle ---------- */
(function(){
  const Mo = S.moodle || {};
  const all = S.sesiones.flatMap(s => arr(s.moodle).map(m => ({...m, n:s.n})));
  let h = `<div class="grid g2"><div class="card"><h2>Estructura del curso</h2>${Mo.estructura?`<p>${esc(Mo.estructura)}</p>`:''}${arr(Mo.secciones).map(sec=>`<div class="lab">${esc(sec.nombre)}</div>${ul(sec.elementos)}`).join('')}</div>
    <div class="card"><h2>Libro de calificaciones</h2>${Mo.calificaciones?`<p>${esc(Mo.calificaciones)}</p>`:''}
      <table class="tbl"><thead><tr><th>Criterio</th><th>Elementos calificables en Moodle</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${all.filter(m=>m.calificable && m.criterio===c).map(m=>`S${m.n} · ${esc(m.recurso)} «${esc(m.nombre)}»`).join('<br>') || '<span class="note">Se califica fuera de Moodle (observación, exposición…)</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(Mo.configuracion).length) h += `<div class="card" style="margin-top:16px"><h2>Configuración general recomendada</h2>${ul(Mo.configuracion)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Todas las actividades de Moodle</h2><div class="scroll"><table class="tbl"><thead><tr><th>Sesión</th><th>Recurso</th><th>Nombre</th><th>Corrección</th><th>Para qué</th><th>Configuración clave</th></tr></thead><tbody>${all.map(m=>`<tr><td>S${m.n}</td><td>${esc(m.recurso)}</td><td>${esc(m.nombre)}${m.criterio?' '+chip(m.criterio):''}</td><td>${corrBadge(m)||'—'}</td><td>${esc(m.uso)}</td><td>${ul(m.config)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#p-moodle').innerHTML = h;
})();

/* ---------- 5. DUA ---------- */
(function(){
  const D = S.dua || {};
  let h = `<div class="grid g2">${Object.entries(D).map(([k,v])=>`<div class="card"><h2>${esc(k)}</h2>${ul(v)}</div>`).join('')}</div>`;
  if(arr(S.diversidad).length) h += `<div class="card" style="margin-top:16px"><h2>Atención a la diversidad</h2><table class="tbl"><thead><tr><th>Perfil</th><th>Medidas concretas</th></tr></thead><tbody>${S.diversidad.map(d=>`<tr><td><b>${esc(d.perfil)}</b></td><td>${esc(d.medidas)}</td></tr>`).join('')}</tbody></table></div>`;
  if(arr(S.roles).length) h += `<div class="card" style="margin-top:16px"><h2>Roles del equipo</h2><table class="tbl"><tbody>${S.roles.map(r=>`<tr><td><b>${esc(r.rol)}</b></td><td>${esc(r.funcion)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#p-dua').innerHTML = h;
})();

/* ---------- 6. evaluación ---------- */
(function(){
  const E = S.evaluacion || {};
  let st = {}; try{ st = JSON.parse(localStorage.getItem('sda-cotejo-'+M.titulo)||'{}'); }catch(_){}
  let h = `<div class="card"><h2>Lista de cotejo interactiva</h2><p class="note">Marca los indicadores logrados; el progreso se calcula por criterio y se guarda en este navegador.</p>
    <div class="grid g2">${arr(E.cotejo).map((g,gi)=>`<div class="side"><span class="pct" data-p="${gi}"></span>${chip(g.criterio)}<div class="bar"><div data-b="${gi}"></div></div><ul class="cot" style="padding:0">${arr(g.indicadores).map((t,i)=>`<li><label><input type="checkbox" data-k="${gi}-${i}" ${st[gi+'-'+i]?'checked':''}> <span>${esc(t)}</span></label></li>`).join('')}</ul></div>`).join('')}</div>
    <button class="copy" id="cot-reset" style="margin-top:10px">Borrar marcas</button></div>`;
  const TR = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='rubrica').map(m=>({...m,n:x.n})));
  const TA = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='apto').map(m=>({...m,n:x.n})));
  const PTS = [1,3,5,7,10];
  if(TR.length) h += `<div class="card" style="margin-top:16px"><h2>Rúbricas de las tareas finales</h2><p class="note">Cada línea se puntúa con 1, 3, 5, 7 o 10 puntos y la nota es la media (ponderada cuando la línea indica su peso). Pulsa una casilla para calcular la nota de un estudiante (no se guarda).</p>${TR.map((m,ti)=>`<h3>${tname(m)} ${chips([...new Set(arr(m.rubrica).map(l=>l.criterio||m.criterio))])} <span class="pct" data-rn="${ti}"></span></h3><div class="scroll"><table class="tbl rub" data-t="${ti}"><thead><tr><th>Línea</th>${PTS.map(p=>`<th>${p} pto</th>`).join('')}</tr></thead><tbody>${arr(m.rubrica).map((l,li)=>`<tr><td><b>${esc(l.linea)}</b>${l.criterio?`<br><small>${esc(l.criterio)}</small>`:''}${l.peso?`<br><small>peso ${String(l.peso).replace('.',',')} %</small>`:''}</td>${arr(l.niveles).map((x,k)=>`<td class="rc" data-l="${li}" data-w="${l.peso||1}" data-c="${esc(l.criterio||m.criterio||'')}" data-p="${PTS[k]}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
  if(TA.length) h += `<div class="card" style="margin-top:16px"><h2>Tareas de verificación (Apto / No apto)</h2><p class="note">Es Apto si se cumplen todos los elementos.</p><div class="grid g2">${TA.map(m=>`<div class="side"><b>${tname(m)}</b> ${chip(m.criterio)}${ul(m.cotejo)}</div>`).join('')}</div></div>`;
  if(arr(E.rubrica).length){ const niv = E.niveles || ['Insuficiente (1-4)','Suficiente / Bien (5-6)','Notable (7-8)','Sobresaliente (9-10)'];
    h += `<div class="card" style="margin-top:16px"><h2>Rúbrica</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${niv.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${E.rubrica.map(r=>`<tr><td>${chip(r.criterio)}</td>${arr(r.niveles).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; }
  if(E.agentes) h += `<div class="card" style="margin-top:16px"><h2>Agentes e instrumentos</h2>${Object.entries(E.agentes).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;
  $('#p-eval').innerHTML = h;
  const sel = {};
  $('#p-eval').addEventListener('click', e => { const c = e.target.closest('td.rc'); if(!c) return; const t = c.closest('table').dataset.t;
    c.parentElement.querySelectorAll('td.rc').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    sel[t] = sel[t]||{}; sel[t][c.dataset.l] = [+c.dataset.p, +c.dataset.w]; const v = Object.values(sel[t]); const nl = c.closest('tbody').rows.length;
    const wt = [...c.closest('tbody').rows].reduce((a,r)=>a+(+r.querySelector('td.rc').dataset.w),0);
    document.querySelector(`[data-rn="${t}"]`).textContent = `Nota: ${(v.reduce((a,[p,w])=>a+p*w,0)/wt).toFixed(1)}` + (()=>{ const rs=[...c.closest('tbody').rows].map(r=>r.querySelector('td.rc').dataset); const cs=[...new Set(rs.map(d=>d.c))]; if(cs.length<2) return ''; return ' · ' + cs.map(k=>{ const ws=rs.filter(d=>d.c===k).reduce((a,d)=>a+(+d.w),0); const pt=Object.entries(sel[t]).filter(([i])=>rs[i].c===k).reduce((a,[,x])=>a+x[0]*x[1],0); return k+': '+(pt/ws).toFixed(1); }).join(' · '); })() + (v.length<nl?` (faltan ${nl-v.length} líneas)`:''); });
  function upd(){ arr(E.cotejo).forEach((g,gi)=>{ const n = arr(g.indicadores).length; const k = arr(g.indicadores).filter((_,i)=>st[gi+'-'+i]).length; const p = n?Math.round(k/n*100):0;
    document.querySelector(`[data-b="${gi}"]`).style.width = p+'%'; document.querySelector(`[data-p="${gi}"]`).textContent = p+' %'; }); }
  function save(){ try{ localStorage.setItem('sda-cotejo-'+M.titulo, JSON.stringify(st)); }catch(_){} }
  $('#p-eval').addEventListener('change', e => { const k = e.target.dataset.k; if(k){ st[k]=e.target.checked; save(); upd(); } });
  $('#cot-reset').onclick = () => { st = {}; save(); document.querySelectorAll('#p-eval input[type=checkbox]').forEach(x=>x.checked=false); upd(); };
  upd();
})();

/* ---------- 7. Séneca ---------- */
(function(){
  const SE = DATA.seneca;
  const box = (t, txt) => `<div class="copybox"><div class="ch"><span>${esc(t)}</span><button class="copy">Copiar</button></div><pre>${esc(txt)}</pre></div>`;
  let h = `<div class="card"><h2>Textos listos para pegar en Séneca</h2><p class="note">Séneca guarda texto plano: estos bloques no llevan formato Markdown. Copia cada campo en su casilla del formulario de la situación de aprendizaje.</p>
    ${box('Título', SE.titulo)}${box('Temporalización', SE.temporalizacion)}${box('Justificación', SE.justificacion)}${box('Producto final', SE.producto_final)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Concreción curricular</h2><p class="note">En Séneca se marcan en las listas; aquí tienes la selección para comprobarla.</p>${SE.concrecion.map(m=>box(m.materia, m.texto)).join('')}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Actividades (formulario «Detalle de la actividad»)</h2><p class="note">Los campos siguen el orden del formulario de Séneca. Solo hay una actividad por cada Tarea de Moodle evaluada con rúbrica. En «Vinculación criterios de evaluación» elige la única trazabilidad indicada y pasa esos criterios a «seleccionados» (es obligatorio).</p>${SE.actividades.map(a=>`<h3>${esc(a.orden)}. ${esc(a.titulo)} <span class="badge">${esc(a.tipo)}</span> <span class="badge">${esc(a.abreviatura)}</span> <span class="badge">Tarea ${esc(a.tarea)}</span></h3>${box('Título de la actividad', a.titulo)}${box('Tipo de actividad', a.tipo)}${box('Abreviatura', a.abreviatura)}${box('Orden de la presentación', a.orden)}${box('Descripción', a.descripcion)}${box('Temporalización', a.temporalizacion)}${box('Recursos', a.recursos)}${box('Descriptores operativos', a.descriptores)}${box('Vinculación criterios de evaluación', a.vinculacion)}${box('Ejercicios', a.ejercicios)}${box('Metodologías', a.metodologias)}`).join('')}</div>`;
  $('#p-seneca').innerHTML = h;
})();
</script>
