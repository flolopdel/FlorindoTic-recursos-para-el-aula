const DATA = {"sa": {"meta": {"titulo": "SdA 3: Un Aula del Futuro", "numero": 3, "subtitulo": "«Consultoría Aula del Futuro»: rediseñamos un aula del IES Villa de Mijas con planos, CAD y un Elevator Pitch", "curso_texto": "3.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Individual en la fundamentación técnica; equipos cooperativos heterogéneos de 3-4 personas (6 de 4 y 1 de 3) con roles estables en el proyecto", "temporalizacion": "Primer trimestre (orientativo: 17 sesiones, unas 6 semanas a 3 sesiones semanales)"}, "materias": [{"codigo": "TYD", "criterios": ["TYD.3.1.1", "TYD.3.1.2", "TYD.3.2.1", "TYD.3.4.1", "TYD.3.6.3"], "saberes": ["TYD.3.A.1", "TYD.3.A.2", "TYD.3.A.5", "TYD.3.B.1", "TYD.3.B.2", "TYD.3.B.3", "TYD.3.D.2", "TYD.3.D.3"]}], "vision": {"descripcion": "El alumnado se convierte en un equipo de consultoría arquitectónica y tecnológica que transforma un aula tradicional del instituto en un «Aula del Futuro»: un espacio flexible, organizado por zonas de aprendizaje y equipado con tecnologías emergentes, que cumple criterios de ergonomía, accesibilidad, eficiencia energética y sostenibilidad. Para lograrlo aprende primero el lenguaje del dibujo técnico (vistas, escalas y acotación), mide su propia aula, la dibuja a escala, la modela en un programa CAD web y defiende su propuesta ante el equipo directivo.", "contexto": "IES Villa de Mijas (Málaga), grupo de 3.º ESO de 27 estudiantes con poca experiencia previa en dibujo técnico y CAD. El grupo trabaja en el aula de informática, con un ordenador por estudiante, y dispone de Google Workspace del centro (@g.educaand.es) y Moodle Centros. Hay un alumno o alumna con TEA y altas capacidades, dos con TDAH y dos con más dificultades de aprendizaje. El aula que se mide es la del propio grupo (o la que indique el centro), de modo que el reto parte de un espacio que el alumnado vive cada día.", "justificacion": "La SdA moviliza los saberes de representación gráfica (vistas, escalas, croquis, acotación) y de aplicaciones CAD del bloque B de Tecnología y Digitalización de 3.º ESO dentro de un proceso de resolución de problemas (bloque A) con documentación digital organizada y difundida (bloque D). El producto final responde a una necesidad real del centro, conecta con el modelo de Aula del Futuro que impulsan el INTEF y la Consejería y con los ODS 4 (educación de calidad), 7 (energía asequible y no contaminante) y 11 (ciudades y comunidades sostenibles), y desarrolla la competencia STEM, la digital, la emprendedora y la comunicación oral.", "reto": "«Somos el equipo de consultoría Aula del Futuro del IES Villa de Mijas. El equipo directivo nos ha encargado medir y dibujar un aula del instituto y proponer cómo transformarla en un espacio flexible por zonas, cómodo, accesible y sostenible. Tenemos que entregar los planos, el modelo 3D y un cartel, y defender la propuesta en un Elevator Pitch de 2 minutos.»", "pregunta_guia": "¿Cómo convertimos nuestra aula en un espacio donde se aprenda mejor, que sea cómodo para todas las personas y que gaste menos energía?", "producto_final": "Por equipo: (1) dossier técnico gráfico con el croquis a mano alzada y el plano del aula a escala 1:50 acotado según la norma (el plano es individual); (2) propuesta del Aula del Futuro modelada en 2D y 3D en Floorplanner, organizada por zonas de aprendizaje; (3) cartel promocional e infografía en Canva con el render 3D y la justificación de las zonas, y (4) Elevator Pitch de 2 minutos ante la clase como si fuera el equipo directivo."}, "metodologias": [{"nombre": "Aprendizaje Basado en Proyectos (ABP)", "descripcion": "Todo gira en torno a un encargo real del centro con un producto final que se presenta y se difunde."}, {"nombre": "Design Thinking", "descripcion": "Empatizar con el aula actual (medir y preguntar a compañeros), definir necesidades, idear las zonas, prototipar en Floorplanner y testear la propuesta con otro equipo."}, {"nombre": "Aprendizaje cooperativo", "descripcion": "Equipos heterogéneos con roles estables (medidor/a principal, diseñador/a CAD, gestor/a de documentación y portavoz) y responsabilidad individual en el plano."}, {"nombre": "Instrucción directa con práctica guiada", "descripcion": "En la fundamentación técnica, explicaciones cortas con ejemplo resuelto en la pantalla y práctica inmediata con fichas graduadas."}, {"nombre": "Gamificación", "descripcion": "Retos «El error del arquitecto» y «Detective de errores», paseo virtual en 3D y dinámica «Pitch de startup»."}, {"nombre": "Coevaluación y autoevaluación", "descripcion": "Testeo cruzado de diseños, coevaluación del Elevator Pitch y diana de autoevaluación con Google Forms."}], "recursos": ["Aula de informática (un ordenador por estudiante)", "Material de dibujo: escuadra, cartabón, regla, lápices H y HB", "Cintas métricas y flexómetros", "Bloques y piezas físicas para vistas", "Floorplanner (cuenta gratuita)", "Canva para Educación", "Google Workspace del centro (Drive, Docs, Forms)", "Moodle Centros"], "fases": [{"nombre": "Inicio", "sesiones": "1-2", "finalidad": "Presentación del reto, diagnóstico y vistas normalizadas"}, {"nombre": "Desarrollo", "sesiones": "3-15", "finalidad": "Escalas, acotación, medición y plano del aula, investigación y diseño en Floorplanner"}, {"nombre": "Cierre", "sesiones": "16-17", "finalidad": "Cartel en Canva, Elevator Pitch, coevaluación y autoevaluación"}], "sesiones": [{"n": 1, "fase": "Inicio", "titulo": "Gancho: ¿es cómoda nuestra clase? Del objeto a sus vistas", "reto": "Conocer el reto de la SdA y descubrir que un objeto 3D se describe con tres vistas: alzado, planta y perfil.", "actividades": [{"nombre": "Gancho del reto", "min": 10, "desc": "El docente proyecta dos fotos: un aula tradicional en filas y un Aula del Futuro con zonas (puede usar las del INTEF). Pregunta: «¿En cuál aprenderíais mejor? ¿Por qué?». Lluvia de ideas en voz alta de 3 cosas que cambiaríais de vuestra clase (luz, sillas, enchufes, ruido). Se presenta el encargo del equipo directivo y el producto final, y se avisa de que primero hay que aprender el «idioma» de los planos."}, {"nombre": "Diagnóstico", "min": 8, "desc": "Cada estudiante responde el formulario de diagnóstico (Formulario F1): reconocer una planta, leer una escala sencilla, identificar una cota y qué programas conoce. Sirve para formar equipos heterogéneos en la sesión 10."}, {"nombre": "Simulador 3D: caras ocultas", "min": 12, "desc": "En la pantalla grande el docente usa un interactivo 3D de vistas (EducacionPlastica.net u otro visor) y gira un bloque en L: ¿qué ves de frente (alzado), desde arriba (planta) y desde la izquierda (perfil)? Se colocan en el sistema europeo: planta debajo del alzado y perfil izquierdo a la derecha del alzado. Se reparten bloques físicos para que cada pareja los gire en la mesa."}, {"nombre": "Primeras vistas guiadas", "min": 17, "desc": "Con la lámina de vistas (Plantilla en el anexo A1) y su rejilla, el alumnado dibuja las tres vistas de las piezas 1 y 2 copiando el ejemplo resuelto en la pizarra paso a paso: primero el alzado, después la planta alineada debajo y por último el perfil. El docente revisa en la mesa la alineación."}, {"nombre": "Salida", "min": 3, "desc": "Pregunta de salida oral: «¿Qué vista dibujarías de una mesa para saber cuánto ocupa en el suelo?» (la planta)."}], "criterios": [], "saberes": ["TYD.3.A.1", "TYD.3.B.1"], "metodologia": ["ABP", "Instrucción directa con práctica guiada"], "evidencias": ["Formulario de diagnóstico F1", "Piezas 1 y 2 de la lámina A1 (diagnóstica)"], "recursos": ["Proyector", "Bloques físicos", "Lámina A1"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Reto cercano (su propia aula); objeto 3D real y simulador para quien no visualiza en el espacio; ejemplo resuelto proyectado mientras se dibuja."}, "ejercicios": ["Responde el formulario de diagnóstico sobre dibujo técnico.", "Dibuja el alzado, la planta y el perfil de las piezas 1 y 2 de la lámina."], "clase": {"pregunta": "¿Es cómoda nuestra clase? ¿Cómo la organizaría un equipo profesional de diseño?", "diapositivas": [{"tipo": "comparar", "titulo": "¿Dónde aprenderías mejor?", "columnas": [{"titulo": "Aula tradicional", "icono": "🪑", "puntos": ["Filas mirando a la pizarra", "Mobiliario fijo", "Una sola forma de trabajar"]}, {"titulo": "Aula del Futuro", "icono": "🚀", "puntos": ["**Zonas** para presentar, investigar, crear…", "Mobiliario móvil", "Tecnología al servicio del trabajo"]}], "pregunta": "Di 3 cosas que cambiarías de tu clase.", "nota": "Recoge las ideas en la pizarra y guárdalas en una foto: se retoman en la sesión 12 al definir necesidades."}, {"tipo": "idea", "icono": "🎯", "titulo": "Vuestro encargo", "texto": "El equipo directivo quiere transformar un aula del instituto.", "puntos": ["Medir y dibujar el aula **a escala**", "Diseñarla en 3D con **Floorplanner**", "Cartel en **Canva**", "**Elevator Pitch** de 2 minutos"]}, {"tipo": "practica", "titulo": "Diagnóstico: ¿qué sé ya?", "tiempo": 8, "enunciado": "Responde el formulario F1 con sinceridad: no cuenta para nota, sirve para formar equipos equilibrados.", "agrupamiento": "Individual"}, {"tipo": "ejemplo", "icono": "📦", "titulo": "Una caja vista desde tres sitios", "situacion": "Si miras una caja de cereales **de frente**, solo ves un rectángulo. **Desde arriba**, otro distinto. **De lado**, uno estrecho.", "explicacion": "Ninguna vista sola describe la caja, pero **las tres juntas** sí: alzado (de frente), planta (desde arriba) y perfil (desde la izquierda)."}, {"tipo": "infografia", "titulo": "Dónde va cada vista (sistema europeo)", "svg": "<svg viewBox=\"0 0 640 240\" role=\"img\" aria-label=\"Colocación de las vistas: alzado arriba a la izquierda, perfil a su derecha y planta debajo del alzado\"><rect x=\"120\" y=\"20\" width=\"160\" height=\"90\" rx=\"6\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:2\"/><text x=\"200\" y=\"72\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:18px;font-weight:700\">ALZADO<\/text><rect x=\"320\" y=\"20\" width=\"90\" height=\"90\" rx=\"6\" style=\"fill:var(--accent-soft);stroke:var(--accent);stroke-width:2\"/><text x=\"365\" y=\"60\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px;font-weight:700\">PERFIL<\/text><text x=\"365\" y=\"82\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:13px\">izquierdo<\/text><rect x=\"120\" y=\"140\" width=\"160\" height=\"80\" rx=\"6\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:2\"/><text x=\"200\" y=\"186\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:18px;font-weight:700\">PLANTA<\/text><line x1=\"280\" y1=\"40\" x2=\"320\" y2=\"40\" style=\"stroke:var(--ink);stroke-dasharray:4 4\"/><line x1=\"140\" y1=\"110\" x2=\"140\" y2=\"140\" style=\"stroke:var(--ink);stroke-dasharray:4 4\"/><text x=\"440\" y=\"60\" style=\"fill:var(--ink);font-size:14px\">Misma altura que el alzado<\/text><text x=\"300\" y=\"190\" style=\"fill:var(--ink);font-size:14px\">Mismo ancho que el alzado<\/text><\/svg>", "nota": "Insiste en la alineación: el alzado y el perfil comparten altura; el alzado y la planta comparten anchura."}, {"tipo": "practica", "titulo": "Primeras vistas guiadas", "tiempo": 17, "enunciado": "En la lámina A1 dibuja las tres vistas de las **piezas 1 y 2**, a la vez que el ejemplo de la pizarra.", "pasos": ["Alzado: lo que ves desde la flecha.", "Planta: debajo, con el mismo ancho.", "Perfil: a la derecha, con la misma altura."], "material": ["Lámina A1 con rejilla", "Lápiz HB y goma", "Bloque físico de la pieza"], "enlace": "https://docs.google.com/document/d/1f_zPKtPMIxjAbhacbF6DvRJkgx5DA6El0BxXmBoltQE/copy"}, {"tipo": "cierre", "puntos": ["Un objeto 3D se describe con **tres vistas**.", "Alzado, planta y perfil van **alineados**.", "La planta es la vista que usan los planos de aulas y casas."], "siguiente": "Terminamos la lámina de vistas y la entregamos en Moodle.", "pregunta": "¿Qué vista dibujarías de una mesa para saber cuánto ocupa en el suelo?"}]}}, {"n": 2, "fase": "Inicio", "titulo": "Vistas normalizadas: la lámina completa", "reto": "Dibujar alzado, planta y perfil de seis piezas a partir de su perspectiva isométrica y entregarlas.", "actividades": [{"nombre": "Repaso con el simulador", "min": 7, "desc": "Quiz rápido en la pantalla: se muestra una pieza en el simulador 3D y tres planos posibles; la clase vota cuál es su planta. El docente gira la pieza para comprobarlo y recuerda las aristas ocultas (línea discontinua)."}, {"nombre": "Lámina por niveles", "min": 33, "desc": "El alumnado completa la lámina de vistas (Plantilla en el anexo A1): piezas 3 y 4 (nivel básico, solo escalones), 5 (nivel medio, con un hueco) y 6 (reto, con un plano inclinado). Quien termina antes ayuda como «revisor/a» con la lista de comprobación. Las piezas físicas están en la mesa del docente para quien las necesite."}, {"nombre": "Comprobación por parejas", "min": 5, "desc": "Cada estudiante intercambia la lámina con su compañero/a y comprueba con la lista: tres vistas por pieza, alineadas y con las aristas ocultas en discontinua."}, {"nombre": "Entrega", "min": 5, "desc": "Se hace una foto nítida de la lámina con la cámara del ordenador o el escáner del aula y se sube a la Tarea 3.1."}], "criterios": ["TYD.3.1.2"], "saberes": ["TYD.3.A.2", "TYD.3.B.1"], "metodologia": ["Práctica guiada", "Retos por niveles", "Revisión entre iguales"], "evidencias": ["Lámina de vistas (Tarea 3.1, Apto / No apto)"], "recursos": ["Simulador 3D", "Lámina A1", "Piezas físicas"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Retos graduados; piezas físicas y lámina con rejilla isométrica; plantilla semicompletada (alzado ya dibujado) para quien lo necesite."}, "moodle": [{"recurso": "Tarea", "nombre": "3.1 · Lámina de vistas normalizadas", "uso": "Comprobar que cada estudiante representa las tres vistas de una pieza alineadas según el sistema europeo.", "correccion": "apto", "criterio": "TYD.3.1.2", "cotejo": ["Se entrega una foto o escaneo legible de la lámina completa", "Las piezas 1 a 5 tienen alzado, planta y perfil", "Las vistas están alineadas (planta debajo del alzado y perfil a su derecha)", "Las aristas ocultas, si las hay, van en línea discontinua"], "config": ["Entrega individual: archivo .jpg, .png o .pdf", "Calificación: escala Apto / No apto", "Prórroga individual para quien la necesite"], "calificable": true, "codigo": "3.1"}], "ejercicios": ["Dibuja el alzado, la planta y el perfil de las piezas 3 a 6 de la lámina.", "Revisa la lámina de un compañero o compañera con la lista de comprobación."], "clase": {"pregunta": "¿Puedes adivinar la planta de una pieza sin verla desde arriba?", "diapositivas": [{"tipo": "quiz", "pregunta": "Una pieza en L se ve desde arriba. ¿Qué forma tiene su planta si el escalón está a la derecha?", "opciones": ["Un rectángulo entero con una línea que marca el escalón", "Una L", "Un cuadrado"], "correcta": 0, "explicacion": "Desde arriba se ven **las dos alturas** a la vez: el contorno es un rectángulo y el escalón aparece como una **línea** en medio."}, {"tipo": "ejemplo", "icono": "🧱", "titulo": "Aristas que no se ven", "situacion": "Una pieza de Lego con un hueco por detrás: de frente **no ves** el hueco, pero existe.", "explicacion": "Las aristas ocultas se dibujan con **línea discontinua**. Así quien lee el plano sabe que ahí hay algo."}, {"tipo": "practica", "titulo": "Lámina por niveles", "tiempo": 33, "enunciado": "Completa la lámina A1. Empieza por tu nivel y sube cuando termines.", "pasos": ["🥉 Piezas 3 y 4: escalones.", "🥈 Pieza 5: con un hueco (aristas ocultas).", "🥇 Pieza 6: con un plano inclinado."], "material": ["Lámina A1", "Piezas físicas en la mesa del docente"], "enlace": "https://docs.google.com/document/d/1f_zPKtPMIxjAbhacbF6DvRJkgx5DA6El0BxXmBoltQE/copy"}, {"tipo": "pasos", "titulo": "Comprobación por parejas", "progresivo": true, "pasos": ["¿Hay **3 vistas** en cada pieza?", "¿La planta está **debajo** del alzado con el mismo ancho?", "¿El perfil está **a la derecha** con la misma altura?", "¿Las aristas ocultas son **discontinuas**?"]}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 5, "entrega": "Tarea 3.1 · Lámina de vistas normalizadas", "enunciado": "Foto **nítida y recta** de la lámina completa (sin sombras). Súbela a Moodle."}, {"tipo": "cierre", "puntos": ["Las vistas se **alinean** entre sí.", "Lo oculto va en **discontinua**.", "Pronto dibujaremos la **planta de nuestra aula**."], "siguiente": "¿Cómo cabe un aula de 8 metros en un folio? Las escalas.", "pregunta": "¿Qué pieza te costó más y por qué?"}]}}, {"n": 3, "fase": "Desarrollo", "titulo": "El error del arquitecto: qué es una escala", "reto": "Entender qué significa una escala y distinguir escalas de reducción, ampliación y natural.", "actividades": [{"nombre": "Gancho: el error del arquitecto", "min": 10, "desc": "Se proyecta un vídeo corto o una noticia sobre un error de escala o de medida en una obra (puentes que no encajan, un submarino que no cabía en el puerto, muebles que no pasan por la puerta). Pregunta: «¿Qué pasó? ¿Cómo se podía haber evitado?»."}, {"nombre": "Qué es una escala", "min": 12, "desc": "Explicación con ejemplos cotidianos: el mapa de Google Maps, una maqueta de coche 1:43 y la foto de un insecto ampliada. Escala = medida en el dibujo : medida real (en las mismas unidades). Reducción (1:50, 1:100), natural (1:1) y ampliación (2:1, 5:1)."}, {"nombre": "Ejercicios graduados (bloque 1)", "min": 23, "desc": "Fichas de escalas (Plantilla en el anexo A2), bloque 1: clasificar escalas, pasar de dibujo a realidad con 1:10, 1:50 y 1:100 y medir con la regla una mesa dibujada a 1:20. Se permite calculadora."}, {"nombre": "Corrección en voz alta", "min": 5, "desc": "Se corrigen tres ejercicios en la pizarra; cada estudiante marca sus aciertos y anota una duda."}], "criterios": [], "saberes": ["TYD.3.A.2", "TYD.3.B.1"], "metodologia": ["Gamificación (reto «El error del arquitecto»)", "Instrucción directa con práctica guiada"], "evidencias": ["Bloque 1 de la ficha de escalas A2"], "recursos": ["Vídeo o noticia", "Ficha A2", "Calculadora"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Gancho con casos reales; ejemplo resuelto paso a paso; calculadora de escalas y regla escalada como apoyo visual."}, "ejercicios": ["Clasifica las escalas 1:50, 2:1, 1:1, 1:100 y 5:1 en reducción, natural o ampliación.", "Calcula la medida real de segmentos dibujados a escala 1:10, 1:50 y 1:100."], "clase": {"pregunta": "¿Cómo cabe un aula de 8 metros en un folio?", "diapositivas": [{"tipo": "video", "titulo": "El error del arquitecto", "busqueda": "errores de escala en construcción ingeniería fallos de medida", "texto": "Mira el caso con una pregunta en la cabeza.", "preguntas": ["¿Qué medida falló?", "¿Qué habría pasado con un plano bien hecho?"], "nota": "Elige un vídeo de 2-3 minutos; si no encuentras uno adecuado, cuenta un caso con una foto."}, {"tipo": "ejemplo", "icono": "🗺️", "titulo": "Google Maps ya usa escalas", "situacion": "Abajo del mapa aparece una barrita que dice **«100 m»**. En tu pantalla mide 2 cm.", "explicacion": "Eso es una escala: **2 cm del mapa = 100 m reales**. Los planos hacen lo mismo con números: 1:50 significa que **1 cm del dibujo son 50 cm reales**."}, {"tipo": "comparar", "titulo": "Tres tipos de escala", "columnas": [{"titulo": "Reducción", "icono": "🏠", "puntos": ["1:50 · 1:100", "Edificios, aulas, mapas", "El dibujo es **más pequeño**"]}, {"titulo": "Natural", "icono": "📏", "puntos": ["1:1", "Piezas pequeñas", "El dibujo es **igual**"]}, {"titulo": "Ampliación", "icono": "🔍", "puntos": ["2:1 · 5:1", "Tornillos, chips", "El dibujo es **más grande**"]}]}, {"tipo": "codigo", "titulo": "La cuenta que siempre funciona", "codigo": "DIBUJO = REAL ÷ 50          (escala 1:50)\nREAL   = DIBUJO × 50\n\nEjemplo: pared de 7,20 m\n7,20 m = 720 cm\n720 ÷ 50 = 14,4 cm en el plano", "explicacion": ["Pasa **todo a cm** antes de calcular.", "Reducción: **divides** para dibujar.", "Ampliación: **multiplicas** para dibujar."], "pregunta": "¿Cuánto medirá en el plano una puerta de 90 cm a 1:50?"}, {"tipo": "practica", "titulo": "Ejercicios graduados (bloque 1)", "tiempo": 23, "enunciado": "Haz el **bloque 1** de la ficha A2. Puedes usar la calculadora.", "pasos": ["Clasifica las escalas.", "Calcula medidas reales.", "Mide la mesa dibujada a 1:20."], "material": ["Ficha A2", "Regla", "Calculadora"], "enlace": "https://docs.google.com/document/d/1daj5nA65ikk66_3omxaIeZPX1sy4XRmLCtSmDfmpSVI/copy"}, {"tipo": "cierre", "puntos": ["Escala = **dibujo : realidad**.", "Mismas unidades antes de calcular.", "1:50 → divide entre 50."], "siguiente": "Planos de un piso: calculamos en las dos direcciones.", "pregunta": "Escribe una duda que te quede sobre escalas."}]}}, {"n": 4, "fase": "Desarrollo", "titulo": "Escalas de reducción: el plano de un piso", "reto": "Calcular medidas reales y medidas de dibujo en el plano de una vivienda a 1:50 y 1:100.", "actividades": [{"nombre": "Activación", "min": 6, "desc": "Tres preguntas rápidas en la pizarra (una puerta de 90 cm a 1:50, una cama de 2 m a 1:100, una línea de 6 cm a 1:50). Se responde en mini pizarras o en un papel y se levanta a la vez."}, {"nombre": "Ejemplo resuelto", "min": 10, "desc": "El docente proyecta el plano de un piso de 70 m² a 1:100 y resuelve en voz alta: medir el salón con la regla, pasarlo a metros y calcular su superficie aproximada. Pregunta trampa: «¿Cuánto mediría el salón dibujado a 1:50?» (el doble)."}, {"nombre": "Ejercicios graduados (bloque 2)", "min": 28, "desc": "Bloque 2 de la ficha de escalas (Plantilla en el anexo A2): tabla para completar con el plano del piso (dormitorio, cocina, baño y pasillo) y dos situaciones-problema: «¿Cabe un sofá de 2,40 m en esta pared?» y «¿Qué escala elijo para que un aula de 8 × 7 m quepa en un A4 con margen?». Por parejas, cada estudiante rellena su ficha."}, {"nombre": "Puesta en común", "min": 6, "desc": "Dos parejas explican la elección de escala para el A4; se concluye que 1:50 cabe y deja ver detalles y 1:100 queda muy pequeño."}], "criterios": ["TYD.3.1.2"], "saberes": ["TYD.3.A.1", "TYD.3.B.1"], "metodologia": ["Instrucción directa con práctica guiada", "Trabajo por parejas"], "evidencias": ["Bloque 2 de la ficha A2"], "recursos": ["Plano de un piso proyectado", "Ficha A2", "Regla y calculadora"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Plano impreso además de proyectado; tabla con la primera fila resuelta; calculadora de escalas online para comprobar."}, "ejercicios": ["Mide en el plano del piso las estancias y calcula sus medidas reales.", "Decide qué escala usarías para dibujar un aula de 8 × 7 m en un A4 y justifícalo."], "clase": {"pregunta": "¿Cabe tu cama en ese dormitorio? El plano lo sabe.", "diapositivas": [{"tipo": "quiz", "pregunta": "Una puerta mide 90 cm. ¿Cuánto mide en un plano a escala 1:50?", "opciones": ["4,5 cm", "1,8 cm", "45 cm"], "correcta": 1, "explicacion": "90 ÷ 50 = **1,8 cm**. En reducción siempre se **divide**."}, {"tipo": "ejemplo", "icono": "🛋️", "titulo": "¿Cabe el sofá?", "situacion": "Vas a comprar un sofá de **2,40 m** y en el plano del piso a 1:50 la pared del salón mide **5,2 cm**.", "explicacion": "5,2 × 50 = 260 cm = **2,60 m**. Sí cabe, con 20 cm de margen. Así deciden los diseñadores **antes** de comprar."}, {"tipo": "practica", "titulo": "Ejercicios graduados (bloque 2)", "tiempo": 28, "enunciado": "Por parejas, completa el **bloque 2** de la ficha A2 con el plano del piso.", "pasos": ["Mide cada estancia con la regla.", "Calcula sus medidas reales.", "Resuelve las dos situaciones-problema."], "agrupamiento": "Parejas", "enlace": "https://docs.google.com/document/d/1daj5nA65ikk66_3omxaIeZPX1sy4XRmLCtSmDfmpSVI/copy"}, {"tipo": "dato", "valor": "1:50", "texto": "Es la escala más usada para dibujar **un aula o una vivienda en un A4**: un aula de 8 m ocupa 16 cm.", "pregunta": "¿Y a 1:100? ¿Se leería bien?"}, {"tipo": "cierre", "puntos": ["Medir en el plano → **multiplicar** para saber la realidad.", "Elegir escala = que **quepa** y se **lea bien**.", "Nuestra aula irá a **1:50**."], "siguiente": "Escalas de ampliación y comprobación con un formulario.", "pregunta": "¿Qué escala usarías para dibujar tu habitación en un A4?"}]}}, {"n": 5, "fase": "Desarrollo", "titulo": "Escalas de ampliación y elegir la escala adecuada", "reto": "Trabajar con escalas de ampliación y comprobar si se domina el cálculo antes de la prueba.", "actividades": [{"nombre": "Gancho: lo muy pequeño", "min": 6, "desc": "Se proyecta la foto de un tornillo de gafas o de un chip dibujado a 5:1. Pregunta: «¿Por qué aquí el dibujo es más grande que la realidad?»."}, {"nombre": "Ampliación paso a paso", "min": 9, "desc": "Ejemplo resuelto: un tornillo de 8 mm a 5:1 mide 40 mm en el dibujo; una pieza dibujada de 30 mm a 2:1 mide 15 mm reales. Se introduce la regla de oro: la cifra de la cota siempre es la medida real."}, {"nombre": "Ejercicios graduados (bloque 3)", "min": 20, "desc": "Bloque 3 de la ficha de escalas (Plantilla en el anexo A2): ampliaciones y tabla «elige la escala» (un móvil, un campo de fútbol, un aula, una moneda) con justificación."}, {"nombre": "Formulario de autocomprobación", "min": 12, "desc": "Cada estudiante responde el formulario «Comprueba tus escalas» (Formulario F2), con 8 cálculos. Al enviar ve las soluciones y el docente revisa en el resumen qué ejercicios fallan más para repasarlos al inicio de la sesión 6."}, {"nombre": "Salida", "min": 3, "desc": "Semáforo: cada estudiante levanta una tarjeta verde, amarilla o roja según lo seguro que se siente para la prueba."}], "criterios": ["TYD.3.1.2"], "saberes": ["TYD.3.A.2", "TYD.3.B.1"], "metodologia": ["Instrucción directa con práctica guiada", "Evaluación formativa"], "evidencias": ["Bloque 3 de la ficha A2", "Respuestas al formulario F2 (formativo)"], "recursos": ["Ficha A2", "Formulario F2", "Calculadora"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Objetos reales pequeños (tornillo, moneda); autocomprobación sin nota con soluciones al enviar; semáforo para pedir ayuda sin exponerse."}, "ejercicios": ["Calcula medidas de dibujo y reales con escalas 2:1 y 5:1.", "Elige y justifica la escala adecuada para dibujar un móvil, un campo de fútbol, un aula y una moneda.", "Responde el formulario «Comprueba tus escalas»."], "clase": {"pregunta": "¿Por qué a veces el dibujo es más grande que la realidad?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔩", "titulo": "El tornillo de las gafas", "situacion": "Un tornillo de gafas mide **2 mm**. Si lo dibujas a 1:1 no se ve nada.", "explicacion": "Se dibuja **ampliado**, por ejemplo a 5:1: cada milímetro real son 5 mm en el papel. El dibujo mide 10 mm."}, {"tipo": "codigo", "titulo": "Ampliación: la cuenta", "codigo": "Escala 5:1\nDIBUJO = REAL × 5\nREAL   = DIBUJO ÷ 5\n\nTornillo de 8 mm → 8 × 5 = 40 mm en el dibujo", "explicacion": ["En ampliación **multiplicas** para dibujar.", "La **cota** siempre dice la medida **real**: 8, no 40."]}, {"tipo": "practica", "titulo": "Ejercicios graduados (bloque 3)", "tiempo": 20, "enunciado": "Haz el **bloque 3** de la ficha A2: ampliaciones y «elige la escala».", "material": ["Ficha A2", "Calculadora"], "enlace": "https://docs.google.com/document/d/1daj5nA65ikk66_3omxaIeZPX1sy4XRmLCtSmDfmpSVI/copy"}, {"tipo": "practica", "titulo": "Comprueba tus escalas (F2)", "tiempo": 12, "enunciado": "Responde el **formulario F2**. Al enviarlo verás las soluciones: apunta en tu ficha los que fallaste.", "agrupamiento": "Individual"}, {"tipo": "cierre", "puntos": ["Reducción: **divide**. Ampliación: **multiplica**.", "La cota es siempre la medida **real**.", "La escala se elige para que **quepa y se lea**."], "siguiente": "Prueba de escalas.", "pregunta": "Verde, amarillo o rojo: ¿cómo llegas a la prueba?"}]}}, {"n": 6, "fase": "Desarrollo", "titulo": "Prueba de ejecución: escalas", "reto": "Demostrar de forma individual que se calculan e interpretan escalas sin errores graves.", "actividades": [{"nombre": "Repaso dirigido", "min": 10, "desc": "El docente repasa los dos ejercicios que más fallaron en la autocomprobación de la sesión 5 y resuelve una duda de cada tipo (reducción, ampliación y elección de escala)."}, {"nombre": "Prueba procedimental", "min": 35, "desc": "Prueba individual en papel (Plantilla en el anexo A3): medir y calcular sobre un plano a 1:50, completar una tabla de escalas, dibujar a 1:50 un rectángulo de una mesa y una puerta, y elegir y justificar una escala. Se permite calculadora y regla."}, {"nombre": "Autocorrección del ejercicio clave", "min": 5, "desc": "Al recoger las pruebas se proyecta la solución del ejercicio del plano para que cada estudiante sepa cómo le ha ido."}], "criterios": ["TYD.3.1.2"], "saberes": ["TYD.3.B.1"], "metodologia": ["Evaluación de ejecución"], "evidencias": ["Prueba de escalas A3 (forma parte del dossier técnico, Tarea 3.2)"], "recursos": ["Prueba A3", "Regla y calculadora"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Enunciados cortos con un ejemplo; tiempo extra o prueba en dos partes para quien lo necesite; lectura en voz alta de los enunciados."}, "ejercicios": ["Resuelve la prueba de escalas: medición sobre un plano, tabla de escalas, dibujo a escala y elección justificada de escala."], "clase": {"pregunta": "¿Estás listo o lista para demostrar lo que sabes de escalas?", "diapositivas": [{"tipo": "quiz", "pregunta": "En un plano a 1:50 una pared mide 12 cm. ¿Cuánto mide en realidad?", "opciones": ["6 m", "60 cm", "2,4 m"], "correcta": 0, "explicacion": "12 × 50 = 600 cm = **6 m**."}, {"tipo": "ejemplo", "icono": "📐", "titulo": "El error más común", "situacion": "Una alumna calcula 3 m a 1:50 y escribe **0,06 cm**.", "explicacion": "Dividió metros entre 50 y luego puso cm. Primero **3 m = 300 cm**, después 300 ÷ 50 = **6 cm**."}, {"tipo": "practica", "titulo": "Prueba de escalas", "tiempo": 35, "enunciado": "Trabaja **en silencio y de forma individual**. Lee cada enunciado, haz las cuentas en el papel y escribe las unidades.", "material": ["Prueba A3", "Regla", "Calculadora"], "nota": "Recuerda las medidas de tiempo extra o prueba en dos partes acordadas para el alumnado con TDAH o con más dificultades."}, {"tipo": "cierre", "puntos": ["Pasa a **cm** antes de calcular.", "Escribe siempre la **unidad**.", "La prueba va al **dossier técnico**."], "siguiente": "Acotación: cómo se escriben las medidas en un plano.", "pregunta": "¿Qué ejercicio te ha resultado más fácil?"}]}}, {"n": 7, "fase": "Desarrollo", "titulo": "Acotación: el lenguaje de las medidas", "reto": "Conocer los elementos de una cota y las reglas fundamentales de la acotación normalizada.", "actividades": [{"nombre": "Gancho: el mueble de montar", "min": 7, "desc": "Se proyecta un plano de montaje de un mueble con cotas y otro sin cotas. «¿Con cuál montarías la estantería?». Se presenta la acotación como el idioma común de quien diseña y quien fabrica."}, {"nombre": "Elementos de una cota", "min": 12, "desc": "Con la infografía proyectada: línea de cota, líneas auxiliares, flechas (extremos) y cifra de cota. Se presentan «Las 10 reglas de oro de la acotación» (UNE-EN ISO 129-1), que quedan expuestas en el aula como infografía."}, {"nombre": "Copia guiada", "min": 25, "desc": "En la ficha de acotación (Plantilla en el anexo A5), parte 1, el alumnado acota a la vez que el docente una pieza rectangular con un agujero: medidas generales primero, después la posición y el diámetro del agujero. El docente comprueba separaciones y flechas mesa por mesa."}, {"nombre": "Salida", "min": 6, "desc": "Quiz proyectado de tres preguntas sobre las reglas («¿La cifra indica la medida del dibujo o la real?»)."}], "criterios": [], "saberes": ["TYD.3.B.1"], "metodologia": ["Instrucción directa con práctica guiada"], "evidencias": ["Parte 1 de la ficha de acotación A5"], "recursos": ["Infografía de las 10 reglas", "Ficha A5", "Escuadra y cartabón"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Infografía de las 10 reglas expuesta y en Moodle; glosario visual (cota, línea auxiliar, flecha); pieza ya trazada para quien tiene dificultades de motricidad fina."}, "ejercicios": ["Identifica en un plano la línea de cota, las líneas auxiliares, las flechas y la cifra de cota.", "Acota una pieza rectangular con un agujero siguiendo las reglas."], "clase": {"pregunta": "¿Montarías un mueble con un plano sin números?", "diapositivas": [{"tipo": "ejemplo", "icono": "🪛", "titulo": "Las instrucciones del mueble", "situacion": "Las instrucciones de una estantería dicen dónde va cada tornillo **a 32 mm del borde**.", "explicacion": "Esos números colocados con líneas y flechas son **cotas**. Si están mal puestas, el mueble no encaja."}, {"tipo": "infografia", "titulo": "Las partes de una cota", "svg": "<svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Rectángulo acotado con su línea de cota, líneas auxiliares, flechas y cifra 60\"><rect x=\"170\" y=\"110\" width=\"300\" height=\"90\" style=\"fill:var(--brand-soft);stroke:var(--ink);stroke-width:3\"/><line x1=\"170\" y1=\"104\" x2=\"170\" y2=\"52\" style=\"stroke:var(--accent);stroke-width:1.5\"/><line x1=\"470\" y1=\"104\" x2=\"470\" y2=\"52\" style=\"stroke:var(--accent);stroke-width:1.5\"/><line x1=\"170\" y1=\"60\" x2=\"470\" y2=\"60\" style=\"stroke:var(--warm);stroke-width:1.5\"/><polygon points=\"170,60 184,55 184,65\" style=\"fill:var(--warm)\"/><polygon points=\"470,60 456,55 456,65\" style=\"fill:var(--warm)\"/><text x=\"320\" y=\"52\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:20px;font-weight:700\">60<\/text><text x=\"20\" y=\"40\" style=\"fill:var(--accent);font-size:15px\">Línea auxiliar<\/text><text x=\"490\" y=\"40\" style=\"fill:var(--warm);font-size:15px\">Línea de cota<\/text><text x=\"490\" y=\"90\" style=\"fill:var(--warm);font-size:15px\">Flecha<\/text><text x=\"20\" y=\"160\" style=\"fill:var(--ink);font-size:15px\">Cifra = medida<\/text><text x=\"20\" y=\"180\" style=\"fill:var(--ink);font-size:15px;font-weight:700\">REAL (mm)<\/text><\/svg>"}, {"tipo": "idea", "icono": "⭐", "titulo": "Las 5 reglas que más se olvidan", "puntos": ["La cifra es la medida **real**, no la del dibujo.", "Cada medida se acota **una sola vez**.", "No se acota sobre **aristas ocultas**.", "La cifra va **encima** de la línea de cota y se lee desde abajo o desde la derecha."], "nota": "Las 10 reglas completas están en la infografía del aula y en la ficha A5."}, {"tipo": "practica", "titulo": "Copia guiada: acotamos juntos", "tiempo": 25, "enunciado": "En la **parte 1 de la ficha A5**, acota la pieza a la vez que en la pizarra.", "pasos": ["Medidas generales: largo y alto.", "Posición del agujero desde dos bordes.", "Diámetro con el símbolo **Ø**.", "Revisa separaciones de 8-10 mm."], "material": ["Ficha A5", "Escuadra y cartabón", "Lápiz H"], "enlace": "https://docs.google.com/document/d/16Z7593mq7vrI3VCfgXNaTjGE6WlYBDh2XTGOh2mQZ7A/copy"}, {"tipo": "quiz", "pregunta": "Un plano está a escala 1:2 y una arista mide 30 mm en el papel. ¿Qué cifra escribes en la cota?", "opciones": ["30", "60", "15"], "correcta": 1, "explicacion": "La cota siempre indica la medida **real**: 30 × 2 = **60 mm**."}, {"tipo": "cierre", "puntos": ["Una cota = línea de cota + auxiliares + flechas + cifra.", "La cifra es la medida **real**.", "Pocas cotas, pero **todas las necesarias**."], "siguiente": "Detective de errores: un plano lleno de fallos.", "pregunta": "¿Qué regla te parece más fácil de olvidar?"}]}}, {"n": 8, "fase": "Desarrollo", "titulo": "Detective de errores: un plano mal acotado", "reto": "Analizar un plano técnico, encontrar las infracciones de la norma de acotación y corregirlas.", "actividades": [{"nombre": "Presentación del caso", "min": 5, "desc": "El docente proyecta el plano «sospechoso» de una pieza (y lo reparte impreso): tiene 8 errores escondidos. Los equipos provisionales de 3 son agencias de detectives con 25 minutos."}, {"nombre": "Investigación por equipos", "min": 25, "desc": "Con la ficha del detective (Plantilla en el anexo A4) y la infografía de las 10 reglas, cada equipo localiza los errores, indica qué regla incumplen y cómo se corrigen. Cada miembro registra en su ficha."}, {"nombre": "Resolución del caso", "min": 12, "desc": "Cada equipo dice un error por turnos hasta completar los 8; el docente los marca en el plano proyectado. Gana un punto de detective cada error bien justificado."}, {"nombre": "Corrección individual", "min": 8, "desc": "Cada estudiante redibuja a mano alzada, en el recuadro de la ficha, la pieza bien acotada."}], "criterios": ["TYD.3.1.2"], "saberes": ["TYD.3.A.2", "TYD.3.B.1"], "metodologia": ["Gamificación (reto «Detective de errores»)", "Aprendizaje cooperativo"], "evidencias": ["Ficha del detective A4 con errores, reglas y correcciones"], "recursos": ["Plano con errores", "Ficha A4", "Infografía de las 10 reglas"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Formato de juego por equipos; plano ampliado en A3 para quien lo necesite; pista numerada por zonas del plano para quien se bloquea."}, "ejercicios": ["Encuentra los 8 errores de acotación del plano, indica qué regla incumple cada uno y cómo se corrige.", "Redibuja la pieza correctamente acotada."], "clase": {"pregunta": "¿Eres capaz de encontrar 8 errores en un plano?", "diapositivas": [{"tipo": "infografia", "titulo": "El plano sospechoso", "svg": "<svg viewBox=\"0 0 640 250\" role=\"img\" aria-label=\"Pieza en L con cotas mal colocadas para encontrar errores\"><path d=\"M160 210 L160 70 L300 70 L300 140 L460 140 L460 210 Z\" style=\"fill:var(--brand-soft);stroke:var(--ink);stroke-width:3\"/><line x1=\"160\" y1=\"230\" x2=\"460\" y2=\"230\" style=\"stroke:var(--warm);stroke-width:1.5\"/><text x=\"300\" y=\"246\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px\">150 mm<\/text><line x1=\"160\" y1=\"105\" x2=\"300\" y2=\"105\" style=\"stroke:var(--warm);stroke-width:1.5\"/><text x=\"230\" y=\"100\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px\">70<\/text><line x1=\"140\" y1=\"70\" x2=\"140\" y2=\"210\" style=\"stroke:var(--warm);stroke-width:1.5\"/><text x=\"120\" y=\"145\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px\">70<\/text><line x1=\"480\" y1=\"140\" x2=\"480\" y2=\"210\" style=\"stroke:var(--warm);stroke-width:1.5\"/><text x=\"500\" y=\"180\" style=\"fill:var(--ink);font-size:16px\">35<\/text><line x1=\"300\" y1=\"55\" x2=\"460\" y2=\"55\" style=\"stroke:var(--warm);stroke-width:1.5\"/><text x=\"380\" y=\"48\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px\">80<\/text><text x=\"560\" y=\"30\" style=\"fill:var(--accent);font-size:28px\">🔎<\/text><\/svg>", "nota": "El SVG es un apoyo visual: el plano completo con los 8 errores va impreso (se describe en la ficha A4 para el docente)."}, {"tipo": "practica", "titulo": "Investigación por equipos", "tiempo": 25, "enunciado": "Sois una agencia de detectives. Encontrad los **8 errores** y anotadlos en la ficha A4.", "pasos": ["Marca el error en el plano impreso con un número.", "Escribe qué **regla** incumple.", "Explica cómo se **corrige**."], "agrupamiento": "Equipos de 3", "material": ["Plano impreso", "Ficha A4", "Infografía de las 10 reglas"], "enlace": "https://docs.google.com/document/d/1tSn_X9dmCY5muEI6yFYrIManrfqG76rXRvFpMbCDwNw/copy"}, {"tipo": "pasos", "titulo": "Pistas si os atascáis", "progresivo": true, "pasos": ["Mira las **unidades**: ¿hace falta escribir «mm»?", "¿Alguna medida aparece **dos veces**?", "¿Hay cotas **dentro** de la pieza que podrían ir fuera?", "¿Alguna línea de cota **pega** a la pieza?"]}, {"tipo": "ejemplo", "icono": "🕵️", "titulo": "Un error resuelto", "situacion": "La cota «150 mm» lleva la unidad escrita y la línea de cota está pegada a la pieza.", "explicacion": "Dos errores: en piezas las cotas van en **mm sin unidad**, y la línea de cota se separa **8-10 mm** del contorno."}, {"tipo": "practica", "titulo": "Corrección individual", "tiempo": 8, "enunciado": "Redibuja la pieza **bien acotada** a mano alzada en el recuadro final de la ficha A4."}, {"tipo": "cierre", "puntos": ["Acotar bien es **comunicar sin dudas**.", "Revisar un plano ajeno entrena el ojo para el propio.", "Pronto acotaremos **nuestra aula**."], "siguiente": "Acotamos piezas y la planta de una habitación.", "pregunta": "¿Cuál fue el error más difícil de encontrar?"}]}}, {"n": 9, "fase": "Desarrollo", "titulo": "Acotamos piezas y la planta de una habitación", "reto": "Aplicar las reglas de acotación en las vistas de una pieza y en la planta de una habitación a escala.", "actividades": [{"nombre": "Recordatorio exprés", "min": 5, "desc": "El docente muestra durante 30 segundos la infografía de las 10 reglas, la oculta y la clase dice en voz alta todas las que recuerda."}, {"nombre": "Acotar las vistas de una pieza", "min": 18, "desc": "Ficha de acotación (Plantilla en el anexo A5), parte 2: acotar el alzado y la planta de la pieza 5 de la lámina de vistas, repartiendo las cotas entre las vistas sin repetir ninguna."}, {"nombre": "Planta de una habitación a 1:50", "min": 22, "desc": "Parte 3 de la ficha A5: la planta de un dormitorio de 3,20 × 2,80 m con una puerta de 80 cm y una ventana de 1,20 m ya dibujada a 1:50. El alumnado la acota en centímetros (como en los planos de edificios) e indica la escala y la unidad en el cajetín. Ensayo directo del plano del aula."}, {"nombre": "Autoevaluación con la lista", "min": 5, "desc": "Cada estudiante revisa su ficha con la lista de comprobación de la ficha A5 y la guarda en su carpeta: irá al dossier técnico."}], "criterios": ["TYD.3.4.1"], "saberes": ["TYD.3.B.1"], "metodologia": ["Práctica guiada", "Autoevaluación"], "evidencias": ["Ficha de acotación A5 (va al dossier técnico, Tarea 3.2)"], "recursos": ["Ficha A5", "Escuadra y cartabón", "Infografía de las 10 reglas"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Papel milimetrado opcional; planta de la habitación ya trazada; lista de comprobación en primera persona."}, "ejercicios": ["Acota el alzado y la planta de una pieza sin repetir cotas.", "Acota en centímetros la planta de un dormitorio dibujado a escala 1:50 e indica la escala y la unidad."], "clase": {"pregunta": "¿En qué se parece acotar una pieza y acotar una habitación?", "diapositivas": [{"tipo": "comparar", "titulo": "Pieza y edificio: dos costumbres", "columnas": [{"titulo": "Pieza", "icono": "⚙️", "puntos": ["Cotas en **mm**", "No se escribe la unidad", "Escala 1:1, 2:1…"]}, {"titulo": "Habitación / aula", "icono": "🏫", "puntos": ["Cotas en **cm** (o m)", "Unidad indicada en el **cajetín**", "Escala 1:50 o 1:100"]}]}, {"tipo": "practica", "titulo": "Acotar las vistas de una pieza", "tiempo": 18, "enunciado": "Parte 2 de la ficha A5: acota alzado y planta de la pieza 5 **sin repetir** ninguna medida.", "pasos": ["Medidas generales en la vista que mejor las muestra.", "Detalles (huecos) donde se ven de verdad, no ocultos.", "Revisa: ¿cada medida está **una vez**?"], "enlace": "https://docs.google.com/document/d/16Z7593mq7vrI3VCfgXNaTjGE6WlYBDh2XTGOh2mQZ7A/copy"}, {"tipo": "ejemplo", "icono": "🛏️", "titulo": "Tu dormitorio en un folio", "situacion": "Un dormitorio de **3,20 × 2,80 m** a 1:50 ocupa 6,4 × 5,6 cm en el papel.", "explicacion": "Pero en las cotas escribes **320** y **280**: lo que mide de verdad. La puerta (80) y la ventana (120) también se acotan."}, {"tipo": "practica", "titulo": "Planta de una habitación a 1:50", "tiempo": 22, "enunciado": "Parte 3 de la ficha A5: acota la habitación en cm y completa el cajetín (escala, unidad, nombre).", "material": ["Ficha A5", "Escuadra y cartabón", "Lápiz H para líneas finas"]}, {"tipo": "cierre", "puntos": ["En edificios: **cm** y unidad en el cajetín.", "Puertas y ventanas también se **acotan**.", "Ya podemos medir y dibujar el aula."], "siguiente": "¡Lanzamos el desafío! Medimos nuestra aula por equipos.", "pregunta": "¿Qué te llevarías para medir el aula de verdad?"}]}}, {"n": 10, "fase": "Desarrollo", "titulo": "Lanzamiento del desafío: medimos nuestra aula", "reto": "Formar los equipos de consultoría, medir el aula real y dibujar su croquis acotado a mano alzada.", "actividades": [{"nombre": "Lanzamiento del desafío", "min": 6, "desc": "El docente lee el encargo del equipo directivo y presenta los equipos (6 de 4 y 1 de 3), formados con el diagnóstico F1 para que sean heterogéneos. Se reparten los roles: medidor/a principal, anotador/a de datos y dibujante de croquis en esta sesión (después: diseñador/a CAD, gestor/a de documentación y portavoz)."}, {"nombre": "Contrato y normas de medición", "min": 6, "desc": "Cada equipo firma el contrato de equipo de la hoja de toma de datos (Plantilla en el anexo A6). Normas: la cinta no se suelta de golpe, nadie se sube a sillas ni mesas, se mide a la altura del suelo y se anota en centímetros."}, {"nombre": "Medición en el aula", "min": 25, "desc": "Cada equipo mide su zona asignada y después el contorno completo: largo y ancho del aula, puertas (ancho y posición), ventanas (ancho, altura del alféizar y posición), pilares, radiadores, enchufes y pizarra. Se anota todo en la tabla de la hoja A6. Dos equipos miden la misma pared para comparar y detectar errores."}, {"nombre": "Croquis a mano alzada", "min": 10, "desc": "El dibujante de croquis traza en la hoja A6 la planta del aula a mano alzada, proporcionada pero sin escala, y entre todo el equipo se añaden las cotas medidas."}, {"nombre": "Comprobación cruzada", "min": 3, "desc": "Los equipos que midieron la misma pared comparan su dato; si difieren más de 5 cm, se vuelve a medir al inicio de la sesión 11."}], "criterios": ["TYD.3.4.1"], "saberes": ["TYD.3.A.1", "TYD.3.B.1"], "metodologia": ["ABP", "Aprendizaje cooperativo", "Design Thinking (empatizar)"], "evidencias": ["Hoja de toma de datos y croquis A6 con contrato de equipo", "Observación directa del proceso de medición"], "recursos": ["Cintas métricas y flexómetros", "Hoja A6", "Soportes rígidos"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Roles claros y estables con tarjeta de funciones; tarea física y en movimiento (TDAH); anticipación de la sesión y de los cambios de espacio (TEA)."}, "ejercicios": ["Mide el aula y anota en la tabla largo, ancho, puertas, ventanas, pilares, enchufes y pizarra.", "Dibuja el croquis a mano alzada de la planta del aula con las cotas medidas."], "clase": {"pregunta": "¿Cuánto mide realmente nuestra aula?", "diapositivas": [{"tipo": "idea", "icono": "📣", "titulo": "Encargo oficial", "texto": "«El equipo directivo del IES Villa de Mijas solicita a los equipos de consultoría una propuesta para transformar un aula en un **Aula del Futuro**.»", "puntos": ["Plano a escala del aula actual", "Modelo 3D de la propuesta", "Cartel + Elevator Pitch"]}, {"tipo": "infografia", "titulo": "Roles de hoy", "elementos": [{"icono": "📏", "titulo": "Medidor/a principal", "texto": "Maneja la cinta y dicta las medidas."}, {"icono": "📝", "titulo": "Anotador/a de datos", "texto": "Escribe cada medida en la tabla, en **cm**."}, {"icono": "✏️", "titulo": "Dibujante de croquis", "texto": "Traza la planta a mano alzada."}, {"icono": "🔁", "titulo": "Todo el equipo", "texto": "Comprueba dos veces cada medida."}]}, {"tipo": "ejemplo", "icono": "🛏️", "titulo": "El armario que no cabía", "situacion": "Una familia compra un armario de **2,10 m** «a ojo» y, al montarlo, choca con el techo inclinado del dormitorio.", "explicacion": "Medir antes evita disgustos. Por eso los profesionales miden **dos veces** y anotan **todo**: puertas, ventanas, pilares y enchufes."}, {"tipo": "pasos", "titulo": "Normas de seguridad y medición", "pasos": ["La cinta **no se suelta de golpe**: se recoge despacio.", "Nadie se sube a **sillas ni mesas**.", "Mide **pegado al suelo** y en línea recta.", "Anota **en cm** y repite si dudas."]}, {"tipo": "practica", "titulo": "Medición en el aula", "tiempo": 25, "enunciado": "Medid vuestra zona y después el contorno. Anotad todo en la **tabla de la hoja A6**.", "pasos": ["Largo y ancho del aula.", "Puertas y ventanas: ancho y posición.", "Pilares, radiadores, enchufes y pizarra."], "agrupamiento": "Equipos de consultoría", "material": ["Cinta métrica", "Hoja A6", "Soporte rígido"], "enlace": "https://docs.google.com/document/d/1GFfxEbIyaDcBYhMNzwkqy3ZZj6ltYVPXaS7FHK4IA8M/copy"}, {"tipo": "practica", "titulo": "Croquis a mano alzada", "tiempo": 10, "enunciado": "Dibujad la planta del aula **sin regla y sin escala**, pero proporcionada, y añadid las cotas.", "pasos": ["Contorno.", "Puertas y ventanas.", "Cotas medidas."]}, {"tipo": "cierre", "puntos": ["Un croquis es rápido pero **lleva todas las medidas**.", "Medir dos veces evita errores.", "Con estos datos haremos el **plano a 1:50**."], "siguiente": "Plano del aula a escala, acotado y entregado.", "pregunta": "¿Qué medida os dio más guerra y por qué?"}]}}, {"n": 11, "fase": "Desarrollo", "titulo": "El plano del aula a escala y el dossier técnico", "reto": "Dibujar a 1:50 el plano acotado del aula, organizar el dossier técnico digital y entregarlo.", "actividades": [{"nombre": "Planos profesionales", "min": 4, "desc": "Se proyecta el plano de un centro educativo real con zonas y cajetín para fijarse en cómo se dibujan muros, puertas y ventanas."}, {"nombre": "Plano a escala acotado", "min": 30, "desc": "Cada estudiante, con los datos de su equipo, dibuja en A4 con escuadra, cartabón y lápices H y HB la planta del aula a 1:50 (muros con dos líneas, puertas con su giro, ventanas), la acota en cm y completa el cajetín. Sigue la guía del plano (Plantilla en el anexo A7). Quien lo necesita usa papel milimetrado."}, {"nombre": "Dossier digital", "min": 14, "desc": "Cada estudiante fotografía o escanea su lámina de vistas, la prueba de escalas corregida, la ficha de acotación A5, el croquis del equipo y su plano, los guarda en su carpeta de Drive «SdA3_Apellido_Nombre» con los nombres del protocolo (01_Vistas, 02_Escalas, 03_Acotacion, 04_Croquis, 05_Plano), los une en un PDF y lo sube a la Tarea 3.2."}, {"nombre": "Salida", "min": 2, "desc": "Pregunta: «Si hubiera que dibujar el instituto entero, ¿qué escala usaríais?»."}], "criterios": ["TYD.3.1.2", "TYD.3.4.1", "TYD.3.6.3"], "saberes": ["TYD.3.B.1", "TYD.3.B.3", "TYD.3.D.3"], "metodologia": ["ABP", "Trabajo individual dentro del equipo"], "evidencias": ["Plano del aula a 1:50 acotado", "Dossier técnico gráfico en PDF (Tarea 3.2, rúbrica)"], "recursos": ["Material de dibujo", "Papel A4 y milimetrado", "Google Drive"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Papel milimetrado y plantilla del cajetín; guía paso a paso del plano; quien necesite más tiempo termina el plano en casa y lo entrega con prórroga."}, "moodle": [{"recurso": "Tarea", "nombre": "3.2 · Dossier técnico gráfico", "uso": "Recoger en un PDF las evidencias de representación gráfica: vistas, escalas, acotación, croquis y plano del aula a escala, organizadas según el protocolo de nombres.", "correccion": "rubrica", "criterio": "TYD.3.1.2", "rubrica": [{"linea": "Vistas normalizadas de las piezas", "criterio": "TYD.3.1.2", "niveles": ["1 pto: Faltan la mayoría de las vistas o no corresponden a las piezas.", "3 ptos: Dibuja algunas vistas, pero con errores de forma o mal colocadas.", "5 ptos: Dibuja las tres vistas de las piezas básicas; hay fallos de alineación o de aristas ocultas.", "7 ptos: Vistas correctas y alineadas en casi todas las piezas; algún fallo en la pieza con hueco o plano inclinado.", "10 ptos: Las tres vistas de todas las piezas son correctas, están alineadas y las aristas ocultas van en discontinua."]}, {"linea": "Cálculo y elección de escalas (prueba)", "criterio": "TYD.3.1.2", "niveles": ["1 pto: No resuelve la prueba o confunde reducción y ampliación en todos los ejercicios.", "3 ptos: Resuelve algunos cálculos sencillos; falla la mayoría por las unidades.", "5 ptos: Calcula bien con 1:50 y 1:100, pero falla la ampliación o la elección de escala.", "7 ptos: Resuelve casi todo con unidades; un error aislado de cálculo o de justificación.", "10 ptos: Resuelve toda la prueba sin errores, con unidades, y justifica la escala elegida."]}, {"linea": "Acotación según la norma", "criterio": "TYD.3.4.1", "niveles": ["1 pto: No acota o las cotas no se entienden.", "3 ptos: Pone cifras, pero sin líneas auxiliares ni de cota correctas.", "5 ptos: Usa los elementos de la cota, pero repite medidas o las coloca pegadas o dentro de la figura.", "7 ptos: Acota de forma clara y casi completa; incumple una o dos reglas.", "10 ptos: Acota todas las medidas necesarias una sola vez, con separaciones, flechas y cifras según la norma."]}, {"linea": "Croquis y plano del aula a 1:50", "criterio": "TYD.3.4.1", "niveles": ["1 pto: No hay plano o no se reconoce el aula.", "3 ptos: El plano no está a escala o le faltan puertas, ventanas y cajetín.", "5 ptos: Plano a escala con errores de proporción de más de 1 cm en el papel o elementos sin acotar.", "7 ptos: Plano a escala correcto, con puertas, ventanas y cajetín; algún detalle de trazado mejorable.", "10 ptos: Croquis completo y plano a 1:50 preciso, limpio, con muros, puertas, ventanas, cotas en cm y cajetín."]}, {"linea": "Dossier digital organizado", "criterio": "TYD.3.6.3", "niveles": ["1 pto: No entrega el dossier o entrega archivos ilegibles.", "3 ptos: Entrega fotos sueltas sin nombre ni orden.", "5 ptos: Entrega un PDF legible, pero falta alguna parte o no sigue los nombres del protocolo.", "7 ptos: PDF completo y ordenado; carpeta de Drive con casi todos los nombres correctos.", "10 ptos: PDF completo, legible y ordenado, y carpeta de Drive con todos los archivos nombrados según el protocolo, entregado en plazo."]}], "config": ["Entrega individual: un PDF", "Método de calificación: Rúbrica (1-3-5-7-10 por línea)", "Prórroga para el alumnado que la necesite"], "criterios_rubrica": ["TYD.3.1.2", "TYD.3.4.1", "TYD.3.6.3"], "calificable": true, "codigo": "3.2"}], "ejercicios": ["Dibuja a escala 1:50 la planta del aula, acotada en centímetros y con cajetín.", "Organiza tus archivos en Drive con el protocolo de nombres y entrega el dossier técnico en un PDF."], "clase": {"pregunta": "¿Cómo pasa nuestra aula de la cinta métrica al papel?", "diapositivas": [{"tipo": "ejemplo", "icono": "🏫", "titulo": "Así dibujan las arquitectas", "situacion": "En el plano de un instituto, los **muros** son dos líneas gruesas y las **puertas** dibujan un cuarto de círculo.", "explicacion": "Son **símbolos**: cualquiera que lea el plano sabe hacia dónde abre la puerta y dónde está la ventana."}, {"tipo": "pasos", "titulo": "El plano en 6 pasos", "progresivo": true, "pasos": ["Pasa las medidas a **1:50** (÷ 50).", "Muros exteriores con **lápiz H** y línea suave.", "Huecos de puertas y ventanas.", "Repasa muros con **HB**.", "Acota en **cm**.", "Cajetín: nombre, título, escala, fecha."]}, {"tipo": "practica", "titulo": "Plano a escala acotado", "tiempo": 30, "enunciado": "Dibuja tu plano a 1:50 siguiendo la **guía A7**. Cada persona hace el suyo con los datos del equipo.", "material": ["A4 o papel milimetrado", "Escuadra, cartabón, regla", "Lápices H y HB", "Guía A7"], "enlace": "https://docs.google.com/document/d/11mqTu6YSFg8pt43xK9O_yWT-yQgYwUA794DWo0TVIQU/copy"}, {"tipo": "infografia", "titulo": "Protocolo de nombres del dossier", "elementos": [{"icono": "📁", "titulo": "Carpeta", "texto": "SdA3_Apellido_Nombre"}, {"icono": "🖼️", "titulo": "Archivos", "texto": "01_Vistas · 02_Escalas · 03_Acotacion · 04_Croquis · 05_Plano"}, {"icono": "📄", "titulo": "PDF final", "texto": "SdA3_Dossier_Apellido.pdf"}], "nota": "Recuerda: todo se guarda solo en el Drive del centro y sin caras ni datos personales en las fotos."}, {"tipo": "practica", "titulo": "Dossier digital y entrega", "tiempo": 14, "entrega": "Tarea 3.2 · Dossier técnico gráfico", "enunciado": "Fotografía tus trabajos, nómbralos según el protocolo, únelos en un **PDF** y súbelo.", "pasos": ["Fotos rectas y nítidas.", "Renombra en Drive.", "Une en un PDF (Documentos de Google → Descargar en PDF).", "Sube a Moodle."]}, {"tipo": "cierre", "puntos": ["Ya tenemos el **aula real** en un plano.", "El dossier está **ordenado y a salvo**.", "Ahora toca **soñar** el aula nueva."], "siguiente": "Investigamos qué es un Aula del Futuro.", "pregunta": "¿Qué escala usaríais para dibujar el instituto entero?"}]}}, {"n": 12, "fase": "Desarrollo", "titulo": "Investigamos: qué es un Aula del Futuro y qué necesita la nuestra", "reto": "Buscar información fiable sobre Aulas del Futuro, ergonomía e iluminación y definir las necesidades de nuestra aula.", "actividades": [{"nombre": "Las zonas del Aula del Futuro", "min": 8, "desc": "El docente presenta el modelo Future Classroom Lab (European Schoolnet), que en España impulsa el INTEF: zonas Presentar, Investigar, Crear, Interactuar, Desarrollar e Intercambiar. Cada equipo trabajará como mínimo las cinco del encargo (Presentar, Investigar, Crear, Interactuar, Desarrollar)."}, {"nombre": "Búsqueda crítica", "min": 20, "desc": "Con la ficha de investigación (Plantilla en el anexo A8) cada miembro busca sobre un tema: zonas y mobiliario del Aula del Futuro, ergonomía de mesas y sillas, iluminación y ventilación, eficiencia energética de los equipos. Para cada fuente anota autor, fecha, si es fiable (organismo oficial, universidad, fabricante, blog) y una idea útil. Se evitan foros y anuncios."}, {"nombre": "Empatizar y definir", "min": 14, "desc": "El equipo repasa las ideas de la sesión 1 y entrevista a 2 compañeros/as de otro equipo (¿qué te molesta del aula?, ¿qué necesitas para concentrarte?). Con todo, redacta tres necesidades en formato «¿Cómo podríamos…?» en la ficha A8."}, {"nombre": "
