evio para construir o fabricar soluciones tecnológicas y sostenibles que den respuesta a necesidades en diferentes contextos.", "descriptores": ["STEM2", "STEM3", "STEM5", "CD5", "CPSAA1", "CE3", "CCEC3"]}, "TYD.3.4": {"tipo": "ce", "texto": "Describir, representar e intercambiar ideas o soluciones a problemas tecnológicos o digitales, utilizando medios de representación, simbología y vocabulario adecuados, así como los instrumentos y recursos disponibles, valorando la utilidad de las herramientas digitales para comunicar y difundir información y propuestas.", "descriptores": ["CCL1", "STEM4", "CD3", "CCEC3", "CCEC4"]}, "TYD.3.5": {"tipo": "ce", "texto": "Desarrollar algoritmos y aplicaciones informáticas en distintos entornos, aplicando los principios del pensamiento computacional e incorporando las tecnologías emergentes, para crear soluciones a problemas concretos, automatizar procesos y aplicarlos en sistemas de control o en robótica.", "descriptores": ["CP2", "STEM1", "STEM3", "CD5", "CPSAA5", "CE3"]}, "TYD.3.6": {"tipo": "ce", "texto": "Comprender los fundamentos del funcionamiento de los dispositivos y aplicaciones habituales de su entorno digital de aprendizaje, analizando sus componentes y funciones y ajustándolos a sus necesidades para hacer un uso más eficiente y seguro de los mismos y para detectar y resolver problemas técnicos sencillos.", "descriptores": ["CP2", "CD2", "CD4", "CD5", "CPSAA4", "CPSAA5"]}, "TYD.3.7": {"tipo": "ce", "texto": "Hacer un uso responsable y ético de la tecnología, mostrando interés por un desarrollo sostenible, identificando sus repercusiones y valorando la contribución de las tecnologías emergentes para identificar las aportaciones y el impacto del desarrollo tecnológico en la sociedad y en el entorno, contextualizando sus aplicaciones en nuestra comunidad.", "descriptores": ["STEM2", "STEM5", "CD4", "CC4"]}, "TYD.3.1.1": {"tipo": "cr", "texto": "Definir problemas o necesidades planteadas, buscando y contrastando información procedente de diferentes fuentes de manera crítica y segura, evaluando su fiabilidad y pertinencia.", "competencia": "TYD.3.1", "saberes": ["TYD.3.A.1", "TYD.3.A.2", "TYD.3.A.5", "TYD.3.C.3"]}, "TYD.3.1.2": {"tipo": "cr", "texto": "Comprender y examinar productos tecnológicos de uso habitual a través del análisis de objetos y sistemas, empleando el método científico y utilizando herramientas de simulación en la construcción de conocimiento.", "competencia": "TYD.3.1", "saberes": ["TYD.3.A.2", "TYD.3.A.3"]}, "TYD.3.1.3": {"tipo": "cr", "texto": "Adoptar medidas preventivas para la protección de los dispositivos, los datos y la salud personal, identificando problemas y riesgos relacionados con el uso de la tecnología y analizándolos de manera ética y crítica.", "competencia": "TYD.3.1", "saberes": ["TYD.3.A.4", "TYD.3.E.2"]}, "TYD.3.2.1": {"tipo": "cr", "texto": "Idear y diseñar soluciones eficaces, innovadoras y sostenibles a problemas definidos, aplicando conceptos, técnicas y procedimientos interdisciplinares, así como criterios de sostenibilidad, con actitud emprendedora, perseverante y creativa.", "competencia": "TYD.3.2", "saberes": ["TYD.3.A.1", "TYD.3.A.5", "TYD.3.B.1", "TYD.3.B.2", "TYD.3.B.3"]}, "TYD.3.2.2": {"tipo": "cr", "texto": "Seleccionar, planificar y organizar los materiales y herramientas, así como las tareas necesarias para la construcción de una solución a un problema planteado, trabajando individualmente o en grupo de manera cooperativa y colaborativa.", "competencia": "TYD.3.2", "saberes": ["TYD.3.A.4"]}, "TYD.3.3.1": {"tipo": "cr", "texto": "Fabricar objetos o modelos mediante la manipulación y conformación de materiales, empleando herramientas y máquinas adecuadas, aplicando los fundamentos de estructuras, mecanismos, electricidad y electrónica y respetando las normas de seguridad y salud correspondientes.", "competencia": "TYD.3.3", "saberes": ["TYD.3.A.3", "TYD.3.A.4"]}, "TYD.3.4.1": {"tipo": "cr", "texto": "Representar y comunicar el proceso de creación de un producto, desde su diseño hasta su difusión, elaborando documentación técnica y gráfica con la ayuda o no de herramientas digitales, empleando los formatos y el vocabulario técnico adecuados, de manera colaborativa, tanto presencialmente como en remoto.", "competencia": "TYD.3.4", "saberes": ["TYD.3.B.1", "TYD.3.B.2", "TYD.3.B.3", "TYD.3.D.2"]}, "TYD.3.5.1": {"tipo": "cr", "texto": "Describir, interpretar y diseñar soluciones a problemas informáticos a través de algoritmos y diagramas de flujo, aplicando los elementos y técnicas de programación de manera creativa.", "competencia": "TYD.3.5", "saberes": ["TYD.3.C.1", "TYD.3.C.2", "TYD.3.C.3"]}, "TYD.3.5.2": {"tipo": "cr", "texto": "Programar aplicaciones sencillas para distintos dispositivos como por ejemplo ordenadores y dispositivos móviles, empleando los elementos de programación de manera apropiada y aplicando herramientas de edición, así como módulos de inteligencia artificial que añadan funcionalidades a la solución.", "competencia": "TYD.3.5", "saberes": ["TYD.3.C.1", "TYD.3.C.2", "TYD.3.C.3"]}, "TYD.3.5.3": {"tipo": "cr", "texto": "Automatizar procesos, máquinas y objetos de manera autónoma, con conexión a internet, mediante el análisis, construcción y programación de robots y sistemas de control.", "competencia": "TYD.3.5", "saberes": ["TYD.3.C.2", "TYD.3.C.3"]}, "TYD.3.6.1": {"tipo": "cr", "texto": "Hacer un uso eficiente y seguro de los dispositivos digitales de uso cotidiano en la resolución de problemas sencillos, analizando los componentes y los sistemas de comunicación, conociendo los riesgos y adoptando medidas de seguridad para la protección de datos y equipos.", "competencia": "TYD.3.6", "saberes": ["TYD.3.D.1", "TYD.3.D.3", "TYD.3.D.4"]}, "TYD.3.6.2": {"tipo": "cr", "texto": "Crear contenidos, elaborar materiales y difundirlos en distintas plataformas, configurando correctamente las herramientas digitales habituales del entorno de aprendizaje, ajustándolas a sus necesidades y respetando los derechos de autor y la etiqueta digital.", "competencia": "TYD.3.6", "saberes": ["TYD.3.D.2", "TYD.3.D.4"]}, "TYD.3.6.3": {"tipo": "cr", "texto": "Organizar la información de manera estructurada, aplicando técnicas de almacenamiento seguro.", "competencia": "TYD.3.6", "saberes": ["TYD.3.D.2", "TYD.3.D.3", "TYD.3.D.4"]}, "TYD.3.7.1": {"tipo": "cr", "texto": "Reconocer la influencia de la actividad tecnológica en la sociedad y en la sostenibilidad ambiental, a lo largo de su historia, identificando sus aportaciones y repercusiones y valorando su importancia para el desarrollo sostenible, contextualizando sus aplicaciones en nuestra comunidad.", "competencia": "TYD.3.7", "saberes": ["TYD.3.E.1", "TYD.3.E.2"]}, "TYD.3.7.2": {"tipo": "cr", "texto": "Identificar las aportaciones básicas de las tecnologías emergentes al bienestar, a la igualdad social y a la disminución del impacto ambiental del entorno más cercano, en especial de Andalucía, haciendo un uso responsable y ético de las mismas.", "competencia": "TYD.3.7", "saberes": ["TYD.3.E.1", "TYD.3.E.2"]}, "TYD.3.A": {"tipo": "sb", "texto": "Proceso de resolución de problemas.", "hijos": ["TYD.3.A.1", "TYD.3.A.2", "TYD.3.A.3", "TYD.3.A.4", "TYD.3.A.5"], "criterios": []}, "TYD.3.B": {"tipo": "sb", "texto": "Comunicación y difusión de ideas.", "hijos": ["TYD.3.B.1", "TYD.3.B.2", "TYD.3.B.3"], "criterios": []}, "TYD.3.C": {"tipo": "sb", "texto": "Pensamiento computacional, programación y robótica.", "hijos": ["TYD.3.C.1", "TYD.3.C.2", "TYD.3.C.3"], "criterios": []}, "TYD.3.D": {"tipo": "sb", "texto": "Digitalización del entorno personal de aprendizaje.", "hijos": ["TYD.3.D.1", "TYD.3.D.2", "TYD.3.D.3", "TYD.3.D.4"], "criterios": []}, "TYD.3.E": {"tipo": "sb", "texto": "Tecnología sostenible.", "hijos": ["TYD.3.E.1", "TYD.3.E.2"], "criterios": []}, "TYD.3.A.1": {"tipo": "sb", "texto": "Estrategias, técnicas y marcos de resolución de problemas sencillos en diferentes contextos y sus fases.", "hijos": [], "criterios": ["TYD.3.1.1", "TYD.3.2.1"]}, "TYD.3.A.2": {"tipo": "sb", "texto": "Estrategias de búsqueda crítica de información durante la investigación y definición de problemas sencillos planteados.", "hijos": [], "criterios": ["TYD.3.1.1", "TYD.3.1.2"]}, "TYD.3.A.3": {"tipo": "sb", "texto": "Electricidad y electrónica básica para el montaje de esquemas y circuitos físicos o simulados. Interpretación, cálculo, diseño y aplicación en proyectos sencillos. Elementos de un circuito eléctrico básico. Magnitudes fundamentales eléctricas: concepto y unidades de medida. Simbología normalizada de circuitos. Interpretación.", "hijos": [], "criterios": ["TYD.3.1.2"]}, "TYD.3.A.4": {"tipo": "sb", "texto": "Herramientas y técnicas elementales de manipulación y mecanizado de materiales en la construcción de objetos y prototipos básicos. Introducción a la fabricación digital. Respeto de las normas de seguridad e higiene.", "hijos": [], "criterios": []}, "TYD.3.A.5": {"tipo": "sb", "texto": "Emprendimiento, resiliencia, perseverancia y creatividad para abordar problemas sencillos desde una perspectiva interdisciplinar.", "hijos": [], "criterios": ["TYD.3.1.1", "TYD.3.2.1"]}, "TYD.3.B.1": {"tipo": "sb", "texto": "Técnicas de representación gráfica: acotación y escalas. Boceto y croquis. Proyección cilíndrica ortogonal para la representación de objetos: vistas normalizadas de una pieza.", "hijos": [], "criterios": ["TYD.3.2.1", "TYD.3.4.1"]}, "TYD.3.B.2": {"tipo": "sb", "texto": "Aplicaciones CAD en dos y tres dimensiones para la representación de esquemas, circuitos, planos y objetos básicos.", "hijos": [], "criterios": ["TYD.3.2.1", "TYD.3.4.1"]}, "TYD.3.B.3": {"tipo": "sb", "texto": "Herramientas digitales para la elaboración, publicación y difusión de documentación técnica e información multimedia relativa a proyectos sencillos.", "hijos": [], "criterios": ["TYD.3.2.1", "TYD.3.4.1"]}, "TYD.3.C.1": {"tipo": "sb", "texto": "Aplicaciones informáticas sencillas para ordenador y dispositivos móviles e introducción a la inteligencia artificial.", "hijos": [], "criterios": []}, "TYD.3.C.2": {"tipo": "sb", "texto": "Fundamentos de la robótica: montaje y control programado de robots simples de manera física o por medio de simuladores.", "hijos": [], "criterios": []}, "TYD.3.C.3": {"tipo": "sb", "texto": "Autoconfianza e iniciativa: el error, la reevaluación y la depuración de errores como parte del proceso de aprendizaje.", "hijos": [], "criterios": ["TYD.3.1.1"]}, "TYD.3.D.1": {"tipo": "sb", "texto": "Sistemas de comunicación digital de uso común. Transmisión de datos. Tecnologías inalámbricas para la comunicación.", "hijos": [], "criterios": []}, "TYD.3.D.2": {"tipo": "sb", "texto": "Herramientas de edición y creación de contenidos: instalación, configuración y uso responsable. Propiedad intelectual.", "hijos": [], "criterios": ["TYD.3.4.1", "TYD.3.6.3"]}, "TYD.3.D.3": {"tipo": "sb", "texto": "Técnicas de tratamiento, organización y almacenamiento seguro de la información. Copias de seguridad.", "hijos": [], "criterios": ["TYD.3.6.3"]}, "TYD.3.D.4": {"tipo": "sb", "texto": "Seguridad en la red: riesgos, amenazas y ataques. Medidas de protección de datos y de información. Bienestar digital: prácticas seguras y riesgos (ciberacoso, sextorsión, vulneración de la propia imagen y de la intimidad, acceso a contenidos inadecuados, adicciones, etc.).", "hijos": [], "criterios": ["TYD.3.6.3"]}, "TYD.3.E.1": {"tipo": "sb", "texto": "Desarrollo tecnológico: creatividad, innovación, investigación, obsolescencia e impacto social y ambiental. Ética y aplicaciones de las tecnologías emergentes. La tecnología en Andalucía.", "hijos": [], "criterios": []}, "TYD.3.E.2": {"tipo": "sb", "texto": "Tecnología sostenible. Valoración crítica de la contribución a la consecución de los Objetivos de Desarrollo Sostenible.", "hijos": [], "criterios": []}, "CCL1": {"tipo": "de", "texto": "Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.", "competencias": ["TYD.3.2", "TYD.3.4"]}, "CCL2": {"tipo": "de", "texto": "Comprende, interpreta y valora con actitud crítica textos orales, escritos, signados o multimodales de los ámbitos personal, social, educativo y profesional para participar en diferentes contextos de manera activa e informada y para construir conocimiento.", "competencias": []}, "CCL3": {"tipo": "de", "texto": "Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": ["TYD.3.1"]}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": ["TYD.3.6"]}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": ["TYD.3.2"]}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": ["TYD.3.1"]}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": ["TYD.3.2"]}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": ["TYD.3.4"]}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": []}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["TYD.3.1"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": ["TYD.3.6"]}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["TYD.3.2", "TYD.3.4"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["TYD.3.1", "TYD.3.6"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": ["TYD.3.6"]}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": []}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": []}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": ["TYD.3.2"]}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": ["TYD.3.1", "TYD.3.6"]}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["TYD.3.2", "TYD.3.6"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": []}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": []}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": []}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": []}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": ["TYD.3.1", "TYD.3.2"]}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["TYD.3.2"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": ["TYD.3.4"]}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": ["TYD.3.4"]}}, "idx": {"criterios": ["TYD.3.1.1", "TYD.3.1.2", "TYD.3.2.1", "TYD.3.4.1", "TYD.3.6.3"], "competencias": ["TYD.3.1", "TYD.3.2", "TYD.3.4", "TYD.3.6"], "saberes": ["TYD.3.A.1", "TYD.3.A.2", "TYD.3.A.5", "TYD.3.B.1", "TYD.3.B.2", "TYD.3.B.3", "TYD.3.D.2", "TYD.3.D.3"], "descriptores": ["CCEC3", "CCEC4", "CCL1", "CCL3", "CD1", "CD2", "CD3", "CD4", "CD5", "CE1", "CE3", "CP2", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM2", "STEM3", "STEM4"], "sesionesPorCriterio": {"TYD.3.1.2": [2, 4, 5, 6, 8, 11], "TYD.3.4.1": [9, 10, 11, 13, 16, 17], "TYD.3.6.3": [11], "TYD.3.1.1": [12, 15, 16], "TYD.3.2.1": [14, 15, 16]}, "porMateria": [{"codigo": "TYD", "criterios": ["TYD.3.1.1", "TYD.3.1.2", "TYD.3.2.1", "TYD.3.4.1", "TYD.3.6.3"], "competencias": ["TYD.3.1", "TYD.3.2", "TYD.3.4", "TYD.3.6"], "saberes": ["TYD.3.A.1", "TYD.3.A.2", "TYD.3.A.5", "TYD.3.B.1", "TYD.3.B.2", "TYD.3.B.3", "TYD.3.D.2", "TYD.3.D.3"], "descriptores": ["CCEC3", "CCEC4", "CCL1", "CCL3", "CD1", "CD2", "CD3", "CD4", "CD5", "CE1", "CE3", "CP2", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM2", "STEM3", "STEM4"]}], "materiasTxt": "Tecnología y Digitalización"}, "seneca": {"titulo": "SdA 3: Un Aula del Futuro", "temporalizacion": "17 sesiones", "justificacion": "El alumnado de 3.º ESO actúa como equipo de consultoría para transformar un aula del IES Villa de Mijas en un Aula del Futuro. Aprende a representar objetos y espacios con vistas, escalas y acotación normalizada, mide y dibuja su aula a escala, la modela en un programa CAD con criterios de ergonomía, accesibilidad y sostenibilidad, organiza su documentación digital de forma segura y defiende la propuesta en un Elevator Pitch.", "producto_final": "Por equipo: (1) dossier técnico gráfico con el croquis a mano alzada y el plano del aula a escala 1:50 acotado según la norma (el plano es individual); (2) propuesta del Aula del Futuro modelada en 2D y 3D en Floorplanner, organizada por zonas de aprendizaje; (3) cartel promocional e infografía en Canva con el render 3D y la justificación de las zonas, y (4) Elevator Pitch de 2 minutos ante la clase como si fuera el equipo directivo.", "concrecion": [{"materia": "Tecnología y Digitalización", "texto": "COMPETENCIAS ESPECÍFICAS\nTYD.3.1.Buscar y seleccionar la información adecuada proveniente de diversas fuentes, de manera crítica y segura, aplicando procesos de investigación, métodos de análisis de productos y experimentando con herramientas de simulación, para definir problemas tecnológicos e iniciar procesos de creación de soluciones a partir de la información obtenida.\nTYD.3.2.Abordar problemas tecnológicos con autonomía y actitud creativa, aplicando conocimientos interdisciplinares y trabajando de forma cooperativa y colaborativa, para diseñar y planificar soluciones a un problema o necesidad de forma eficaz, innovadora y sostenible.\nTYD.3.4.Describir, representar e intercambiar ideas o soluciones a problemas tecnológicos o digitales, utilizando medios de representación, simbología y vocabulario adecuados, así como los instrumentos y recursos disponibles, valorando la utilidad de las herramientas digitales para comunicar y difundir información y propuestas.\nTYD.3.6.Comprender los fundamentos del funcionamiento de los dispositivos y aplicaciones habituales de su entorno digital de aprendizaje, analizando sus componentes y funciones y ajustándolos a sus necesidades para hacer un uso más eficiente y seguro de los mismos y para detectar y resolver problemas técnicos sencillos.\n\nCRITERIOS DE EVALUACIÓN\nTYD.3.1.1.Definir problemas o necesidades planteadas, buscando y contrastando información procedente de diferentes fuentes de manera crítica y segura, evaluando su fiabilidad y pertinencia.\nTYD.3.1.2.Comprender y examinar productos tecnológicos de uso habitual a través del análisis de objetos y sistemas, empleando el método científico y utilizando herramientas de simulación en la construcción de conocimiento.\nTYD.3.2.1.Idear y diseñar soluciones eficaces, innovadoras y sostenibles a problemas definidos, aplicando conceptos, técnicas y procedimientos interdisciplinares, así como criterios de sostenibilidad, con actitud emprendedora, perseverante y creativa.\nTYD.3.4.1.Representar y comunicar el proceso de creación de un producto, desde su diseño hasta su difusión, elaborando documentación técnica y gráfica con la ayuda o no de herramientas digitales, empleando los formatos y el vocabulario técnico adecuados, de manera colaborativa, tanto presencialmente como en remoto.\nTYD.3.6.3.Organizar la información de manera estructurada, aplicando técnicas de almacenamiento seguro.\n\nSABERES BÁSICOS\nTYD.3.A.1.Estrategias, técnicas y marcos de resolución de problemas sencillos en diferentes contextos y sus fases.\nTYD.3.A.2.Estrategias de búsqueda crítica de información durante la investigación y definición de problemas sencillos planteados.\nTYD.3.A.5.Emprendimiento, resiliencia, perseverancia y creatividad para abordar problemas sencillos desde una perspectiva interdisciplinar.\nTYD.3.B.1.Técnicas de representación gráfica: acotación y escalas. Boceto y croquis. Proyección cilíndrica ortogonal para la representación de objetos: vistas normalizadas de una pieza.\nTYD.3.B.2.Aplicaciones CAD en dos y tres dimensiones para la representación de esquemas, circuitos, planos y objetos básicos.\nTYD.3.B.3.Herramientas digitales para la elaboración, publicación y difusión de documentación técnica e información multimedia relativa a proyectos sencillos.\nTYD.3.D.2.Herramientas de edición y creación de contenidos: instalación, configuración y uso responsable. Propiedad intelectual.\nTYD.3.D.3.Técnicas de tratamiento, organización y almacenamiento seguro de la información. Copias de seguridad.\n\nDESCRIPTORES OPERATIVOS\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCCL1. Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCP2. A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.\nSTEM4. Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos."}], "actividades": [{"titulo": "Vistas normalizadas en EducacionPlastica.net", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "1", "tarea": "3.1 · Vistas en EducacionPlastica.net (PDF)", "descripcion": "Sesión 1 (50 min): Gancho: ¿es cómoda nuestra clase? Del objeto a sus vistas\nReto: Conocer el reto de la SdA y descubrir que un objeto 3D se describe con tres vistas: alzado, planta y perfil.\n- Gancho del reto (8 min). El docente proyecta dos fotos: un aula tradicional en filas y un Aula del Futuro con zonas (puede usar las del INTEF). Pregunta: «¿En cuál aprenderíais mejor? ¿Por qué?». Lluvia de ideas en voz alta de 3 cosas que cambiaríais de vuestra clase (luz, sillas, enchufes, ruido). Se presenta el encargo del equipo directivo y el producto final, y se avisa de que primero hay que aprender el «idioma» de los planos.\n- Diagnóstico: formulario y Blooket (14 min). Cada estudiante responde el formulario de diagnóstico (Formulario F1, 5 minutos): reconocer una planta, leer una escala sencilla, identificar una cota y qué programas conoce; sirve para formar equipos heterogéneos en la sesión 10. Después, el docente lanza el Blooket de inicio (9 minutos) desde su ordenador y el alumnado se une con el código de la partida: activa ideas previas y muestra qué sabe ya el grupo. Enlace F1: https://forms.gle/KMgAVCf63Whz4mpq8. Blooket: https://dashboard.blooket.com/set/61e44d86ee48bed1b8349631.\n- Simulador 3D: caras ocultas (10 min). En la pantalla grande el docente usa el interactivo de vistas de EducacionPlastica.net (u otro visor) y gira un bloque en L: ¿qué ves de frente (alzado), desde arriba (planta) y de lado (perfil)? Se colocan como en las láminas de clase (sistema europeo): la planta debajo del alzado y el perfil al lado contrario del que se mira, de modo que el que se ve desde la derecha se dibuja a la izquierda del alzado. Se reparten bloques físicos para que cada pareja los gire en la mesa.\n- Primeras vistas guiadas (15 min). El docente reparte impresas las láminas de Picuino «Perspectivas 01» (vistas-01.pdf, piezas sin aristas ocultas) y «Perspectivas 02» (vistas-02.pdf, con aristas ocultas); se imprime solo la primera página de cada archivo. En la de Perspectivas 01 el alumnado dibuja sobre la cuadrícula el alzado, la planta y el perfil de las piezas 1 y 2 copiando el ejemplo resuelto en la pizarra paso a paso (la flecha marca el alzado). El resto de Perspectivas 01 se termina en casa; Perspectivas 02 es el reto para quien acaba antes y se completa también en casa. Se corrigen al inicio de la sesión 2 y se guardan para el dossier técnico.\n- Salida (3 min). Pregunta de salida oral: «¿Qué vista dibujarías de una mesa para saber cuánto ocupa en el suelo?» (la planta).\n- Evidencia: Formulario de diagnóstico F1\n- Evidencia: Resultados del Blooket de inicio (diagnóstico)\n- Evidencia: Piezas 1 y 2 de la lámina «Perspectivas 01» (diagnóstica)\n\nSesión 2 (50 min): Vistas normalizadas: práctica interactiva en EducacionPlastica.net\nReto: Desarrollar la visión espacial obteniendo el alzado, la planta y el perfil de al menos 10 piezas en EducacionPlastica.net y entregarlas en un PDF.\n- Corrección de las láminas (7 min). El docente proyecta la segunda página de vistas-01.pdf y vistas-02.pdf (las vistas resueltas) y cada estudiante corrige su lámina en otro color. Se repasan las aristas ocultas en línea discontinua de Perspectivas 02. Las láminas corregidas se guardan para el dossier técnico.\n- Práctica en EducacionPlastica.net (30 min). Cada estudiante entra en EducacionPlastica.net · Vistas (https://www.educacionplastica.net/vistas.html) y completa correctamente las tres vistas principales (alzado, planta y perfil) de al menos 10 piezas, comprobando que la solución es correcta antes de pasar a la siguiente: nivel elemental, piezas 4, 6, 8, 11 y 14; nivel medio, piezas 1, 2, 3 y 6; nivel alto, pieza 1. Al resolver cada pieza hace una captura de pantalla donde se vean claramente la pieza tridimensional y sus tres vistas resueltas.\n- Montar el PDF y entregar (13 min). Cada estudiante abre un documento nuevo en Google Docs, pega las 10 capturas en orden con un título cada una («Pieza 1», «Pieza 2»…), lo descarga con Archivo > Descargar > Documento PDF (.pdf) y sube el PDF a la Tarea 3.1. Quien no termine lo completa en casa dentro del plazo.\n- Moodle Centros: Tarea «3.1 · Vistas en EducacionPlastica.net (PDF)» (calificación directa de 1 a 10). Calificar de 1 a 10 la obtención del alzado, la planta y el perfil de al menos 10 piezas tridimensionales (nota directa que se traslada a Séneca).\n- Evidencia: Láminas de vistas corregidas (van al dossier técnico)\n- Evidencia: PDF con 10 piezas de EducacionPlastica.net (Tarea 3.1, nota de 1 a 10)", "temporalizacion": "2 sesiónes", "recursos": "Proyector, Blooket, Bloques físicos, Láminas de vistas impresas, Ordenadores, EducacionPlastica.net · Vistas, Google Docs, Láminas de vistas", "descriptores": "CCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "trazabilidad": "Realización de actividades.", "vinculacion": "Trazabilidad: Realización de actividades.\nTYD.3.1.2.Comprender y examinar productos tecnológicos de uso habitual a través del análisis de objetos y sistemas, empleando el método científico y utilizando herramientas de simulación en la construcción de conocimiento.", "ejercicios": "Responde el formulario de diagnóstico y el Blooket de inicio.\nDibuja el alzado, la planta y el perfil de las piezas 1 y 2 de la lámina «Perspectivas 01».\nObtén en EducacionPlastica.net el alzado, la planta y el perfil de al menos 10 piezas de los niveles elemental, medio y alto.\nReúne las capturas en un documento de Google Docs, descárgalo en PDF y entrégalo.", "metodologias": "ABP, Gamificación (Blooket de inicio), Instrucción directa con práctica guiada, Práctica guiada, Retos por niveles, Aprendizaje con recursos interactivos", "sesiones": [1, 2]}, {"titulo": "Fichas de escalas", "tipo": "Estructuración", "abreviatura": "EST2", "orden": "2", "tarea": "3.2 · Fichas de escalas", "descripcion": "Sesión 3 (50 min): El error del arquitecto: qué es una escala\nReto: Entender qué significa una escala y distinguir escalas de reducción, ampliación y natural.\n- Gancho: el error del arquitecto (10 min). Se proyecta un vídeo corto o una noticia sobre un error de escala o de medida en una obra (puentes que no encajan, un submarino que no cabía en el puerto, muebles que no pasan por la puerta). Pregunta: «¿Qué pasó? ¿Cómo se podía haber evitado?».\n- Qué es una escala (12 min). Explicación con ejemplos cotidianos: el mapa de Google Maps, una maqueta de coche 1:43 y la foto de un insecto ampliada. Escala = medida en el dibujo : medida real (en las mismas unidades). Reducción (1:50, 1:100), natural (1:1) y ampliación (2:1, 5:1).\n- Ejercicios graduados (bloque 1) (23 min). Fichas de escalas (Plantilla en el anexo A2), bloque 1: clasificar escalas, pasar de dibujo a realidad con 1:10, 1:50 y 1:100 y medir con la regla una mesa dibujada a 1:20. Se permite calculadora.\n- Corrección en voz alta (5 min). Se corrigen tres ejercicios en la pizarra; cada estudiante marca sus aciertos y anota una duda.\n- Evidencia: Bloque 1 de la ficha de escalas A2\n\nSesión 4 (50 min): Escalas de reducción: el plano de un piso\nReto: Calcular medidas reales y medidas de dibujo en el plano de una vivienda a 1:50 y 1:100.\n- Activación (6 min). Tres preguntas rápidas en la pizarra (una puerta de 90 cm a 1:50, una cama de 2 m a 1:100, una línea de 6 cm a 1:50). Se responde en mini pizarras o en un papel y se levanta a la vez.\n- Ejemplo resuelto (10 min). El docente proyecta el plano de un piso de 70 m² a 1:100 y resuelve en voz alta: medir el salón con la regla, pasarlo a metros y calcular su superficie aproximada. Pregunta trampa: «¿Cuánto mediría el salón dibujado a 1:50?» (el doble).\n- Ejercicios graduados (bloque 2) (28 min). Bloque 2 de la ficha de escalas (Plantilla en el anexo A2): tabla para completar con el plano del piso (dormitorio, cocina, baño y pasillo) y dos situaciones-problema: «¿Cabe un sofá de 2,40 m en esta pared?» y «¿Qué escala elijo para que un aula de 8 × 7 m quepa en un A4 con margen?». Cada estudiante trabaja de forma individual en su ficha.\n- Puesta en común (6 min). Dos estudiantes explican su elección de escala para el A4; se concluye que 1:50 cabe y deja ver detalles y 1:100 queda muy pequeño.\n- Evidencia: Bloque 2 de la ficha A2\n\nSesión 5 (50 min): Escalas de ampliación y elegir la escala adecuada\nReto: Trabajar con escalas de ampliación y comprobar si se domina el cálculo antes de la prueba.\n- Gancho: lo muy pequeño (6 min). Se proyecta la foto de un tornillo de gafas o de un chip dibujado a 5:1. Pregunta: «¿Por qué aquí el dibujo es más grande que la realidad?».\n- Ampliación paso a paso (9 min). Ejemplo resuelto: un tornillo de 8 mm a 5:1 mide 40 mm en el dibujo; una pieza dibujada de 30 mm a 2:1 mide 15 mm reales. Se introduce la regla de oro: la cifra de la cota siempre es la medida real.\n- Ejercicios graduados (bloque 3) (20 min). Bloque 3 de la ficha de escalas (Plantilla en el anexo A2): ampliaciones y tabla «elige la escala» (un móvil, un campo de fútbol, un aula, una moneda) con justificación.\n- Formulario de autocomprobación (12 min). Cada estudiante responde el formulario «Comprueba tus escalas» (Formulario F2), con 8 cálculos. Al enviar ve las soluciones y el docente revisa en el resumen qué ejercicios fallan más para repasarlos al inicio de la sesión 6. Enlace F2: https://forms.gle/SXDUpPBiopeRQd696.\n- Salida (3 min). Semáforo: cada estudiante levanta una tarjeta verde, amarilla o roja según lo seguro que se siente para la prueba.\n- Evidencia: Bloque 3 de la ficha A2\n- Evidencia: Respuestas al formulario F2 (formativo)\n\nSesión 6 (50 min): Prueba de ejecución: escalas\nReto: Demostrar de forma individual que se calculan e interpretan escalas sin errores graves.\n- Repaso dirigido (8 min). El docente repasa los dos ejercicios que más fallaron en la autocomprobación de la sesión 5 y resuelve una duda de cada tipo (reducción, ampliación y elección de escala).\n- Prueba procedimental (35 min). Prueba individual en papel (Plantilla en el anexo A3): medir y calcular sobre un plano a 1:50, completar una tabla de escalas, dibujar a 1:50 un rectángulo de una mesa y una puerta, y elegir y justificar una escala. Se permite calculadora y regla.\n- Autocorrección y entrega de las fichas (7 min). Al recoger las pruebas se proyecta la solución del ejercicio del plano para que cada estudiante sepa cómo le ha ido. Después, cada estudiante sube a la Tarea 3.2 la ficha de escalas A2 completa (bloques 1, 2 y 3 de las sesiones 3 a 5), en PDF o en fotos nítidas. (Plantilla en el anexo A2.)\n- Moodle Centros: Tarea «3.2 · Fichas de escalas» (calificación directa de 1 a 10). Calificar de 1 a 10 las fichas de escalas de las sesiones 3 a 5 (cálculos, situaciones-problema y elección de escala); la nota se traslada a Séneca.\n- Evidencia: Prueba de escalas A3 (forma parte del dossier técnico, Tarea 3.5)\n- Evidencia: Fichas de escalas A2 (Tarea 3.2, nota de 1 a 10)", "temporalizacion": "4 sesiónes", "recursos": "Vídeo o noticia, Ficha A2, Calculadora, Plano de un piso proyectado, Regla y calculadora, Formulario F2, Prueba A3", "descriptores": "CCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "trazabilidad": "Realización de actividades.", "vinculacion": "Trazabilidad: Realización de actividades.\nTYD.3.1.2.Comprender y examinar productos tecnológicos de uso habitual a través del análisis de objetos y sistemas, empleando el método científico y utilizando herramientas de simulación en la construcción de conocimiento.", "ejercicios": "Clasifica las escalas 1:50, 2:1, 1:1, 1:100 y 5:1 en reducción, natural o ampliación.\nCalcula la medida real de segmentos dibujados a escala 1:10, 1:50 y 1:100.\nMide en el plano del piso las estancias y calcula sus medidas reales.\nDecide qué escala usarías para dibujar un aula de 8 × 7 m en un A4 y justifícalo.\nCalcula medidas de dibujo y reales con escalas 2:1 y 5:1.\nElige y justifica la escala adecuada para dibujar un móvil, un campo de fútbol, un aula y una moneda.\nResponde el formulario «Comprueba tus escalas».\nResuelve la prueba de escalas: medición sobre un plano, tabla de escalas, dibujo a escala y elección justificada de escala.\nEntrega las fichas de escalas completas.", "metodologias": "Gamificación (reto «El error del arquitecto»), Instrucción directa con práctica guiada, Trabajo individual, Evaluación formativa, Evaluación de ejecución", "sesiones": [3, 4, 5, 6]}, {"titulo": "Normas de acotación: ejemplos bien y mal acotados y Kahoot", "tipo": "Estructuración", "abreviatura": "EST3", "orden": "3", "tarea": "3.3 · Acotación: Kahoot de las normas", "descripcion": "Sesión 7 (50 min): Acotación: el lenguaje de las medidas (normas 1-4)\nReto: Conocer los elementos de una cota y descubrir las primeras normas de acotación comparando ejemplos bien y mal acotados.\n- Gancho: el mueble de montar (6 min). Se proyecta un plano de montaje de un mueble con cotas y otro sin cotas. «¿Con cuál montarías la estantería?». Se presenta la acotación como el idioma común de quien diseña y quien fabrica.\n- Elementos de una cota (8 min). Con la infografía proyectada: línea de cota, líneas auxiliares, flechas (extremos) y cifra de cota. Se presenta la norma UNE-EN ISO 129-1, que fija cómo se acota.\n- ¿Bien o mal? Normas 1 a 4 (20 min). El docente proyecta, una a una, cuatro parejas de ejemplos bien y mal acotados: (1) todas las cotas necesarias, sin repetir ni faltar; (2) líneas de cota paralelas y auxiliares perpendiculares; (3) cifra encima de la línea, centrada y paralela; (4) cotas fuera de la figura, a unos 8 mm. Para cada una, por parejas, el alumnado tiene 1 minuto para decir qué falla en el ejemplo mal acotado y por qué es un problema; después el docente lo explica y la clase formula la norma con sus palabras. Cada estudiante la copia en el cuaderno con un boceto rápido del ejemplo bien acotado.\n- Copia guiada en el cuaderno (13 min). En el cuaderno, el alumnado acota a la vez que el docente una pieza rectangular de 80 × 50 mm con un agujero de Ø20 centrado a 25 mm del borde izquierdo: medidas generales primero, después la posición y el diámetro del agujero. El docente comprueba separaciones y flechas mesa por mesa. La página del cuaderno irá al dossier técnico (03Acotacion).\n- Salida (3 min). Quiz proyectado: «Un plano está a escala 1:2 y una arista mide 30 mm en el papel. ¿Qué cifra escribes?» (60: la cota es la medida real).\n- Evidencia: Normas 1-4 y pieza acotada en el cuaderno\n\nSesión 8 (50 min): Detective de errores: normas 5-8 y Kahoot de acotación\nReto: Analizar ejemplos mal acotados, descubrir qué norma incumplen y por qué, y comprobar lo aprendido con un Kahoot.\n- Repaso exprés (4 min). El docente vuelve a proyectar los cuatro ejemplos mal acotados de la sesión 7 y la clase dice en voz alta qué norma incumple cada uno.\n- ¿Bien o mal? Normas 5 a 8 (16 min). Misma dinámica que en la sesión 7 con cuatro parejas de ejemplos: (5) las líneas de cota no se cruzan; (6) las cotas en serie van alineadas; (7) en paralelo, las cotas grandes más alejadas que las pequeñas; (8) en medidas pequeñas, flechas por fuera o puntos. Por parejas dicen qué falla y por qué; el docente lo explica y cada estudiante anota la norma en el cuaderno.\n- El caso del plano sospechoso (15 min). Equipos provisionales de 3 (agencias de detectives). Se proyecta una pieza escalonada con 8 errores de acotación. Cada equipo anota en el cuaderno dónde está cada error, qué norma incumple y cómo se corrige. Después, por turnos, cada equipo dice un error; el docente lo marca y da un punto de detective por cada error bien justificado. Al final se proyecta la pieza bien acotada.\n- Kahoot de acotación (15 min). Kahoot sobre las normas de acotación en modo individual (cada estudiante con su dispositivo), proyectado desde la cuenta del docente: el alumnado se une en kahoot.it con el PIN y escribe su nombre real para poder identificarlo en el informe. El docente revisa al final las preguntas con más fallos y, después, pasa la nota de cada estudiante a la Tarea 3.3 (calificación directa a partir del porcentaje de aciertos del informe). Enlace: https://create.kahoot.it/my-library/kahoots/favorites.\n- Moodle Centros: Tarea «3.3 · Acotación: Kahoot de las normas» (calificación directa de 1 a 10). Recoger la nota del Kahoot de acotación. No hay entrega: el docente introduce manualmente la nota de 1 a 10 de cada estudiante a partir del informe del Kahoot; la nota se traslada a Séneca.\n- Evidencia: Informe del detective en el cuaderno (error, norma y corrección)\n- Evidencia: Informe del Kahoot de acotación (Tarea 3.3, nota de 1 a 10)", "temporalizacion": "2 sesiónes", "recursos": "Proyector, Cuaderno, Escuadra y cartabón, Kahoot", "descriptores": "CCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "trazabilidad": "Cuestionario con preguntas de comprensión", "vinculacion": "Trazabilidad: Cuestionario con preguntas de comprensión\nTYD.3.1.2.Comprender y examinar productos tecnológicos de uso habitual a través del análisis de objetos y sistemas, empleando el método científico y utilizando herramientas de simulación en la construcción de conocimiento.", "ejercicios": "Explica qué norma incumple cada ejemplo mal acotado (normas 1 a 4) y por qué es un problema.\nAcota en el cuaderno una pieza rectangular con un agujero aplicando las normas.\nExplica qué norma incumple cada ejemplo mal acotado (normas 5 a 8).\nEncuentra los 8 errores del plano sospechoso, indica qué norma incumple cada uno y cómo se corrige.\nResponde el Kahoot de acotación.", "metodologias": "Instrucción directa con práctica guiada, Análisis de ejemplos y contraejemplos, Gamificación (reto «Detective de errores» y Kahoot), Aprendizaje cooperativo", "sesiones": [7, 8]}, {"titulo": "Test general de vistas, escalas y acotación", "tipo": "Estructuración", "abreviatura": "EST4", "orden": "4", "tarea": "3.4 · Test general de vistas, escalas y acotación", "descripcion": "Sesión 9 (50 min): Normas 9-11, corrección de ejemplos y test de acotación\nReto: Completar las normas de acotación (arcos, diámetros y unidades), corregir ejemplos mal acotados y demostrar lo aprendido en un test.\n- Recordatorio exprés (5 min). El docente muestra durante 30 segundos el resumen de las 8 normas vistas, lo oculta y la clase dice en voz alta todas las que recuerda.\n- ¿Bien o mal? Normas 9 a 11 (12 min). Misma dinámica con tres parejas de ejemplos: (9) los arcos se acotan con R desde el centro; (10) los diámetros llevan Ø y no coinciden con los ejes; (11) todas las cotas en la misma unidad, en piezas mm sin escribirla. Se comparan después las costumbres de piezas (mm) y edificios (cm, unidad en el cajetín), que se usarán en el plano del aula.\n- Corregimos en el cuaderno (15 min). Cada estudiante elige tres ejemplos mal acotados de las sesiones 7, 8 y 9 (uno de cada sesión), los redibuja a mano alzada bien acotados en el cuaderno y escribe debajo la norma que incumplían. Quien termina antes ayuda como revisor/a.\n- Test general: vistas, escalas y acotación (15 min). Cada estudiante responde de forma individual el test general en Google Forms, con preguntas sobre las tres tareas anteriores (vistas, escalas y acotación). El formulario recoge el correo del centro. El docente pasa después la nota de cada estudiante a la Tarea 3.4 (calificación directa de 1 a 10 según la puntuación del formulario). Enlace: https://forms.gle/f1M8yHmAvTDnrwP56.\n- Foto para el dossier (3 min). Cada estudiante fotografía las páginas de acotación del cuaderno (sesiones 7 a 9): irán al dossier técnico como 03Acotacion.\n- Moodle Centros: Tarea «3.4 · Test general de vistas, escalas y acotación» (calificación directa de 1 a 10). Recoger la nota del test general en Google Forms sobre las Tareas 3.1, 3.2 y 3.3. No hay entrega: el docente introduce manualmente la nota de 1 a 10 según los resultados del formulario; la nota se traslada a Séneca.\n- Evidencia: Ejemplos corregidos en el cuaderno (van al dossier técnico, Tarea 3.5)\n- Evidencia: Test general en Google Forms (Tarea 3.4, nota de 1 a 10)", "temporalizacion": "1 sesión", "recursos": "Proyector, Cuaderno, Google Forms", "descriptores": "CCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "trazabilidad": "Prueba escrita", "vinculacion": "Trazabilidad: Prueba escrita\nTYD.3.1.2.Comprender y examinar productos tecnológicos de uso habitual a través del análisis de objetos y sistemas, empleando el método científico y utilizando herramientas de simulación en la construcción de conocimiento.", "ejercicios": "Explica qué norma incumple cada ejemplo mal acotado (normas 9 a 11).\nRedibuja bien acotados en el cuaderno tres ejemplos mal acotados e indica la norma.\nResponde el test general sobre vistas, escalas y acotación.", "metodologias": "Análisis de ejemplos y contraejemplos, Prueba escrita (test)", "sesiones": [9]}, {"titulo": "Dossier técnico gráfico del aula", "tipo": "Estructuración", "abreviatura": "EST5", "orden": "5", "tarea": "3.5 · Dossier técnico gráfico", "descripcion": "Sesión 10 (50 min): Lanzamiento del desafío: medimos nuestra aula\nReto: Formar los equipos de consultoría, medir el aula real y dibujar su croquis acotado a mano alzada.\n- Lanzamiento del desafío (6 min). El docente lee el encargo del equipo directivo y presenta los equipos (6 de 4 y 1 de 3), formados con el diagnóstico F1 para que sean heterogéneos. Se reparten los roles: medidor/a principal, anotador/a de datos y dibujante de croquis en esta sesión (después: diseñador/a CAD, gestor/a de documentación y portavoz).\n- Contrato y normas de medición (6 min). Cada equipo firma el contrato de equipo de la hoja de toma de datos (Plantilla en el anexo A6). Normas: la cinta no se suelta de golpe, nadie se sube a sillas ni mesas, se mide a la altura del suelo y se anota en centímetros.\n- Medición en el aula (25 min). Cada equipo mide su zona asignada y después el contorno completo: largo y ancho del aula, puertas (ancho y posición), ventanas (ancho, altura del alféizar y posición), pilares, radiadores, enchufes y pizarra. Se anota todo en la tabla de la hoja A6. Dos equipos miden la misma pared para comparar y detectar errores.\n- Croquis a mano alzada (10 min). El dibujante de croquis traza en la hoja A6 la planta del aula a mano alzada, proporcionada pero sin escala, y entre todo el equipo se añaden las cotas medidas.\n- Comprobación cruzada (3 min). Los equipos que midieron la misma pared comparan su dato; si difieren más de 5 cm, se vuelve a medir al inicio de la sesión 11.\n- Evidencia: Hoja de toma de datos y croquis A6 con contrato de equipo\n- Evidencia: Observación directa del proceso de medición\n\nSesión 11 (50 min): El plano del aula a escala y el dossier técnico\nReto: Dibujar a 1:50 el plano acotado del aula, organizar el dossier técnico digital y entregarlo.\n- Planos profesionales (4 min). Se proyecta el plano de un centro educativo real con zonas y cajetín para fijarse en cómo se dibujan muros, puertas y ventanas.\n- Plano a escala acotado (30 min). Cada estudiante, con los datos de su equipo, dibuja en A4 con escuadra, cartabón y lápices H y HB la planta del aula a 1:50 (muros con dos líneas, puertas con su giro, ventanas), la acota en cm y completa el cajetín. Sigue la guía del plano (Plantilla en el anexo A7). Quien lo necesita usa papel milimetrado.\n- Dossier digital (14 min). Cada estudiante fotografía o escanea sus láminas de vistas corregidas, la prueba de escalas corregida, las páginas de acotación del cuaderno (sesiones 7 a 9), el croquis del equipo y su plano, los guarda en su carpeta de Drive «SdA3ApellidoNombre» con los nombres del protocolo (01Vistas, 02Escalas, 03Acotacion, 04Croquis, 05Plano), los une en un PDF y lo sube a la Tarea 3.3.\n- Salida (2 min). Pregunta: «Si hubiera que dibujar el instituto entero, ¿qué escala usaríais?».\n- Moodle Centros: Tarea «3.5 · Dossier técnico gráfico» (evaluada con rúbrica 1-3-5-7-10). Recoger en un PDF las evidencias de representación gráfica: láminas de vistas, prueba de escalas, acotación en el cuaderno, croquis y plano del aula a escala, organizadas según el protocolo de nombres.\n- Evidencia: Plano del aula a 1:50 acotado\n- Evidencia: Dossier técnico gráfico en PDF (Tarea 3.5, rúbrica)", "temporalizacion": "2 sesiónes", "recursos": "Cintas métricas y flexómetros, Hoja A6, Soportes rígidos, Material de dibujo, Papel A4 y milimetrado, Google Drive", "descriptores": "CCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCCL1. Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCP2. A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM4. Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nTYD.3.1.2.Comprender y examinar productos tecnológicos de uso habitual a través del análisis de objetos y sistemas, empleando el método científico y utilizando herramientas de simulación en la construcción de conocimiento.\nTYD.3.4.1.Representar y comunicar el proceso de creación de un producto, desde su diseño hasta su difusión, elaborando documentación técnica y gráfica con la ayuda o no de herramientas digitales, empleando los formatos y el vocabulario técnico adecuados, de manera colaborativa, tanto presencialmente como en remoto.\nTYD.3.6.3.Organizar la información de manera estructurada, aplicando técnicas de almacenamiento seguro.", "ejercicios": "Mide el aula y anota en la tabla largo, ancho, puertas, ventanas, pilares, enchufes y pizarra.\nDibuja el croquis a mano alzada de la planta del aula con las cotas medidas.\nDibuja a escala 1:50 la planta del aula, acotada en centímetros y con cajetín.\nOrganiza tus archivos en Drive con el protocolo de nombres y entrega el dossier técnico en un PDF.", "metodologias": "ABP, Aprendizaje cooperativo, Design Thinking (empatizar), Trabajo individual dentro del equipo", "sesiones": [10, 11]}, {"titulo": "Propuesta Aula del Futuro: diseño CAD, cartel y Elevator Pitch", "tipo": "Conclusión", "abreviatura": "CON1", "orden": "6", "tarea": "3.7 · Propuesta Aula del Futuro: diseño, cartel y Elevator Pitch", "descripcion": "Sesión 12 (50 min): Investigamos: qué es un Aula del Futuro y qué necesita la nuestra\nReto: Buscar información fiable sobre Aulas del Futuro, ergonomía e iluminación y definir las necesidades de nuestra aula.\n- Las zonas del Aula del Futuro (8 min). El docente presenta el modelo Future Classroom Lab (European Schoolnet), que en España impulsa el INTEF: zonas Presentar, Investigar, Crear, Interactuar, Desarrollar e Intercambiar. Cada equipo trabajará como mínimo las cinco del encargo (Presentar, Investigar, Crear, Interactuar, Desarrollar).\n- Búsqueda crítica (20 min). Con la ficha de investigación (Plantilla en el anexo A8) cada miembro busca sobre un tema: zonas y mobiliario del Aula del Futuro, ergonomía de mesas y sillas, iluminación y ventilación, eficiencia energética de los equipos. Para cada fuente anota autor, fecha, si es fiable (organismo oficial, universidad, fabricante, blog) y una idea útil. Se evitan foros y anuncios.\n- Empatizar y definir (14 min). El equipo repasa las ideas de la sesión 1 y entrevista a 2 compañeros/as de otro equipo (¿qué te molesta del aula?, ¿qué necesitas para concentrarte?). Con todo, redacta tres necesidades en formato «¿Cómo podríamos…?» en la ficha A8.\n- Foro de referentes (8 min). Cada equipo publica en el foro de Moodle un espacio real que le inspire (una imagen con licencia libre o un enlace) con su fuente y una frase sobre qué copiaría. Comenta la publicación de otro equipo.\n- Moodle Centros: Foro «S12 · Referentes: aulas que nos inspiran». Compartir espacios educativos reales que inspiran la propuesta, citando la fuente y la licencia de la imagen.\n- Evidencia: Ficha de investigación A8 con fuentes y necesidades\n- Evidencia: Publicación en el foro de referentes\n\nSesión 13 (50 min): Floorplanner I: el aula actual en 2D y 3D\nReto: Crear la cuenta en Floorplanner y recrear el aula actual a escala real con las medidas del plano.\n- Demostración guiada (10 min). El docente proyecta Floorplanner: crear proyecto, dibujar paredes introduciendo la longitud exacta, añadir puertas y ventanas desde la biblioteca, cambiar a vista 3D. Se insiste en usar las medidas del plano en cm.\n- Cuentas y proyecto (5 min). El diseñador/a CAD de cada equipo crea el proyecto «SdA3EquipoNAulaActual» con la cuenta gratuita (cuenta educativa del centro o la que indique el docente) y lo comparte con el resto del equipo.\n- Recrear el aula actual (28 min). Por parejas dentro del equipo y alternándose al teclado cada 7 minutos: paredes con las medidas del plano, puertas, ventanas, pilares y pizarra. El medidor/a principal dicta las medidas del croquis y comprueba que la vista 2D coincide con el plano (±10 cm).\n- Entrega (7 min). Captura de la vista 2D con medidas y del 3D, más el enlace al proyecto, a la Tarea 3.3.\n- Moodle Centros: Tarea «3.6 · El aula actual en Floorplanner» (corrección Apto / No apto). Verificar que cada equipo traslada correctamente las medidas del plano al programa CAD.\n- Evidencia: Aula actual en Floorplanner (Tarea 3.6, Apto / No apto)\n\nSesión 14 (50 min): Floorplanner II: idear y zonificar el Aula del Futuro\nReto: Idear la nueva distribución del aula por zonas y colocar el mobiliario en Floorplanner.\n- Lluvia de ideas (8 min). Cada miembro dibuja en 3 minutos un boceto rápido de la nueva aula sobre una copia pequeña del plano; el equipo elige o mezcla las mejores ideas (técnica «crazy 8» simplificada).\n- Plan de zonas (12 min). Con el plan de zonas (Plantilla en el anexo A9) el equipo decide para cada zona su función, su lugar en el aula (cerca de la ventana, junto a la pizarra…), el mobiliario y la tecnología. Cada equipo elige además una especialización: rincón de podcast o streaming, rincón de impresión 3D o zona tranquila de ideación.\n- Duplicar y zonificar (25 min). El diseñador/a CAD duplica el proyecto como «SdA3EquipoNAulaFuturo». Se colocan suelos de colores distintos o etiquetas para cada zona y el mobiliario de la biblioteca: mesas móviles, sillas regulables, pantalla interactiva, sofá o pufs, estanterías. Turnos de teclado cada 7 minutos.\n- Revisión de pasillos (5 min). Comprobación con la regla de Floorplanner: pasillos de al menos 90 cm para una silla de ruedas y salida despejada hacia la puerta.\n- Evidencia: Plan de zonas A9\n- Evidencia: Proyecto «AulaFuturo» con zonas y mobiliario\n\nSesión 15 (50 min): Floorplanner III: tecnología, ergonomía, sostenibilidad y testeo\nReto: Mejorar el diseño con criterios de ergonomía, accesibilidad y eficiencia energética, y testearlo con otro equipo.\n- Criterios de calidad (7 min). Explicación breve con ejemplos: altura de mesa y silla regulables, pantalla a la altura de los ojos, luz natural lateral (no de frente ni de espaldas a la pantalla), ventilación cruzada, iluminación LED y equipos con etiqueta energética eficiente y apagado automático.\n- Mejorar el diseño (20 min). Cada equipo revisa su propuesta en Floorplanner con la parte de sostenibilidad y ergonomía del plan de zonas (Plantilla en el anexo A9): reorienta puestos respecto a las ventanas, añade la tecnología de su especialización, anota en el proyecto las decisiones de eficiencia energética y prepara el render 3D.\n- Paseo virtual y testeo (15 min). Los equipos se intercambian el enlace del proyecto y hacen el recorrido 3D (paseo virtual) por la propuesta de otro equipo. Responden el formulario de testeo (Formulario F3): qué funciona, qué cambiarían y si es accesible. Enlace F3: https://forms.gle/oKBAH9yTzodFCmE28.\n- Incorporar mejoras (8 min). Cada equipo lee el testeo recibido (el docente lo proyecta del resumen o lo comparte) y decide qué mejora incorporar; la anota en el plan de zonas.\n- Evidencia: Proy
