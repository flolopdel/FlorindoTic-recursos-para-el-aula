ecto «AulaFuturo» mejorado con render 3D\n- Evidencia: Testeo de otro equipo (formulario F3)\n\nSesión 16 (50 min): Cartel en Canva y guion del Elevator Pitch\nReto: Diseñar el cartel promocional con el render 3D, cerrar el dossier digital con licencia y preparar el pitch.\n- Qué hace bueno a un cartel (5 min). Se comparan dos carteles proyectados (uno saturado de texto y otro con imagen grande, titular y tres datos). Normas: titular corto, render grande, una frase por zona, fuentes y licencia al pie.\n- Cartel en Canva (25 min). Cada equipo diseña en Canva para Educación un cartel o infografía con el render 3D de Floorplanner, el nombre de la propuesta, las zonas con una frase, las decisiones de ergonomía y sostenibilidad y las fuentes consultadas. Se usan imágenes propias o con licencia libre y se indica la licencia del cartel (Creative Commons BY-NC-SA). Reparto: diseñador/a CAD (render y maquetación), gestor/a de documentación (fuentes y licencia), portavoz y medidor/a (textos).\n- Guion del pitch (12 min). Con el guion del Elevator Pitch (Plantilla en el anexo A10) el equipo reparte los 2 minutos: gancho, problema, solución por zonas, sostenibilidad y cierre con la petición al equipo directivo. Se ensaya una vez con cronómetro.\n- Entrega y almacenamiento seguro (8 min). El gestor/a de documentación guarda en la carpeta del equipo en Drive el cartel en PDF y PNG, el enlace del proyecto y el guion, con los nombres del protocolo, y entrega en la Tarea 3.7 el enlace del proyecto de Floorplanner y el cartel en PDF.\n- Moodle Centros: Tarea «3.7 · Propuesta Aula del Futuro: diseño, cartel y Elevator Pitch» (evaluada con rúbrica 1-3-5-7-10). Evaluar el producto final del equipo. Se entrega en esta sesión (proyecto de Floorplanner y cartel) y la nota se completa en la sesión 17 con el Elevator Pitch.\n- Evidencia: Cartel en Canva con render y justificación\n- Evidencia: Guion del pitch A10\n- Evidencia: Entrega de la Tarea 3.7\n\nSesión 17 (50 min): Pitch de startup: presentamos el Aula del Futuro\nReto: Defender la propuesta en un Elevator Pitch de 2 minutos, coevaluar a otros equipos y reflexionar sobre lo aprendido.\n- Preparación (4 min). Se recuerdan las normas: 2 minutos por equipo con cronómetro visible, una pregunta del «equipo directivo» (el docente u otro equipo) y coevaluación mientras se escucha.\n- Elevator Pitch (30 min). Los 7 equipos presentan su propuesta con el cartel y el paseo 3D proyectados (2 minutos + 1 pregunta + cambio). El resto valora cada pitch en el formulario de coevaluación (Formulario F4). El docente completa en la rúbrica de la Tarea 3.7 las líneas de puesta en público. Si algún estudiante ha grabado su parte, se reproduce dentro del turno de su equipo. Enlace F4: https://forms.gle/meSWF8Jzy1VvZEnK8.\n- Votación y cierre del encargo (4 min). Se muestran en pantalla los resultados de la coevaluación: propuesta más innovadora, más sostenible y más accesible. El docente se compromete a enviar los carteles al equipo directivo (sin fotos del alumnado).\n- Diana de autoevaluación (10 min). Cada estudiante completa la diana de autoevaluación (Formulario F5) sobre vistas, escalas, acotación, CAD, investigación y trabajo en equipo, y escribe una mejora para la próxima SdA. Enlace F5: https://forms.gle/oAwknj94G6HrLKjG8.\n- Salida (2 min). Respuesta a la pregunta guía en una frase, en voz alta, por equipos.\n- Evidencia: Observación directa del Elevator Pitch (rúbrica de la Tarea 3.7)\n- Evidencia: Coevaluación F4\n- Evidencia: Diana de autoevaluación F5", "temporalizacion": "6 sesiónes", "recursos": "Ordenadores, Ficha A8, Foro de Moodle, Floorplanner, Plano y croquis, Plan de zonas A9, Copias del plano, Formulario F3, Canva para Educación, Render 3D, Guion A10, Proyector, Cronómetro visible, Formularios F4 y F5", "descriptores": "CCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCCL1. Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.\nSTEM4. Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nTYD.3.2.1.Idear y diseñar soluciones eficaces, innovadoras y sostenibles a problemas definidos, aplicando conceptos, técnicas y procedimientos interdisciplinares, así como criterios de sostenibilidad, con actitud emprendedora, perseverante y creativa.\nTYD.3.1.1.Definir problemas o necesidades planteadas, buscando y contrastando información procedente de diferentes fuentes de manera crítica y segura, evaluando su fiabilidad y pertinencia.\nTYD.3.4.1.Representar y comunicar el proceso de creación de un producto, desde su diseño hasta su difusión, elaborando documentación técnica y gráfica con la ayuda o no de herramientas digitales, empleando los formatos y el vocabulario técnico adecuados, de manera colaborativa, tanto presencialmente como en remoto.", "ejercicios": "Busca y valora la fiabilidad de dos fuentes sobre tu tema (zonas, ergonomía, iluminación o eficiencia energética).\nRedacta tres necesidades del aula en formato «¿Cómo podríamos…?».\nPublica en el foro un espacio que os inspire con su fuente.\nCrea en Floorplanner el proyecto del aula actual con las medidas del plano.\nAñade puertas, ventanas, pilares y pizarra en su posición y comprueba la vista 3D.\nHaz un boceto rápido de la nueva distribución del aula.\nCompleta el plan de zonas con función, lugar, mobiliario y tecnología.\nColoca las zonas y el mobiliario en Floorplanner respetando pasillos de 90 cm.\nMejora el diseño del Aula del Futuro aplicando criterios de ergonomía, luz natural, ventilación y eficiencia energética.\nRecorre en 3D la propuesta de otro equipo y respóndele el formulario de testeo.\nDiseña en Canva el cartel de la propuesta con el render, las zonas, la justificación y las fuentes.\nPrepara el guion del Elevator Pitch repartiendo los 2 minutos.\nGuarda los archivos del equipo en Drive con el protocolo de nombres y la licencia Creative Commons.\nPresenta con tu equipo el Elevator Pitch del Aula del Futuro en 2 minutos.\nCoevalúa los pitches de los otros equipos.\nCompleta la diana de autoevaluación.", "metodologias": "Design Thinking (empatizar y definir), Aprendizaje cooperativo, Instrucción directa con práctica guiada, Design Thinking (idear y prototipar), Design Thinking (prototipar y testear), Coevaluación, ABP, Gamificación (dinámica «Pitch de startup»), Coevaluación y autoevaluación", "sesiones": [12, 13, 14, 15, 16, 17]}]}};
const S = DATA.sa, CUR = DATA.cur, IDX = DATA.idx;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':(m.correccion==='directa'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Nota directa 1-10</span>':'')); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){

      </div><div class="side">
        <div class="lab">Criterios</div>${arr(s.criterios).length?chips(s.criterios):'<span class="note">Evaluación diagnóstica (no calificable)</span>'}
        <div class="lab">Saberes</div>${chips(s.saberes)}
        ${arr(s.metodologia).length?`<div class="lab">Metodología</div><p>${arr(s.metodologia).map(esc).join(' · ')}</p>`:''}
        ${arr(s.evidencias).length?`<div class="lab">Evidencias</div>${ul(s.evidencias)}`:''}
        ${arr(s.recursos).length?`<div class="lab">Recursos</div><p>${arr(s.recursos).map(esc).join(' · ')}</p>`:''}
        ${s.dua?`<div class="lab">DUA (${arr(s.dua.principios).map(esc).join(', ')})</div><p>${esc(s.dua.medidas)}</p>`:''}
      </div></div></details>`).join('') || '<p class="note">Ninguna sesión coincide con el filtro.</p>';
  }
  $('#ff').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.open){ openAll(); return; }
    if(b.dataset.f){ state.f=b.dataset.f; $('#ff').querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); }
    if(b.dataset.d){ state.d = state.d===b.dataset.d?null:b.dataset.d; $('#ff').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===state.d)); }
    if(b.dataset.m){ state.m=!state.m; b.classList.toggle('on',state.m); }
    render(); };
  render();
})();

/* ---------- 3. mapeo ---------- */
(function(){
  const used = new Set(IDX.saberes);
  const inst = (S.evaluacion && S.evaluacion.instrumentos) || {};
  let h = `<div class="card"><h2>Matriz curricular</h2><p class="legend">Los saberes tachados están vinculados oficialmente al criterio pero no se movilizan en esta situación de aprendizaje.</p><div class="scroll"><table class="tbl"><thead><tr><th>Competencia</th><th>Criterio</th><th>Saberes</th><th>Descriptores</th><th>Sesiones</th><th>Instrumentos</th></tr></thead><tbody>`;
  IDX.criterios.forEach(c => { const it = CUR[c]; const ce = CUR[it.competencia];
    h += `<tr><td>${chip(it.competencia)}<div class="note">${esc(ce.texto)}</div></td><td>${chip(c)}<div class="note">${esc(it.texto)}</div></td>
      <td>${arr(it.saberes).map(s=>chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}</td><td>${chips(ce.descriptores)}</td>
      <td>${(IDX.sesionesPorCriterio[c]||[]).map(n=>'S'+n).join(', ')}</td><td>${ul(inst[c])}</td></tr>`; });
  h += `</tbody></table></div></div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Criterios trabajados por sesión</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${S.sesiones.map(s=>`<th>S${s.n}</th>`).join('')}</tr></thead><tbody>`;
  IDX.criterios.forEach(c => { h += `<tr><td>${chip(c)}</td>${S.sesiones.map(s=>`<td class="tick">${arr(s.criterios).includes(c)?'✔':''}</td>`).join('')}</tr>`; });
  h += `</tbody></table></div></div>`;
  if(arr(S.notas_rigor).length) h += `<div class="card" style="margin-top:16px"><h2>Notas de rigor curricular</h2>${ul(S.notas_rigor)}</div>`;
  $('#p-map').innerHTML = h;
})();

/* ---------- 4. moodle ---------- */
(function(){
  const Mo = S.moodle || {};
  const all = S.sesiones.flatMap(s => arr(s.moodle).map(m => ({...m, n:s.n})));
  let h = `<div class="grid g2"><div class="card"><h2>Estructura del curso</h2>${Mo.estructura?`<p>${esc(Mo.estructura)}</p>`:''}${arr(Mo.secciones).map(sec=>`<div class="lab">${esc(sec.nombre)}</div>${ul(sec.elementos)}`).join('')}</div>
    <div class="card"><h2>Libro de calificaciones</h2>${Mo.calificaciones?`<p>${esc(Mo.calificaciones)}</p>`:''}
      <table class="tbl"><thead><tr><th>Criterio</th><th>Elementos calificables en Moodle</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${all.filter(m=>m.calificable && m.criterio===c).map(m=>`S${m.n} · ${esc(m.recurso)} «${esc(m.nombre)}»`).join('<br>') || '<span class="note">Se califica fuera de Moodle (observación, exposición…)</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(Mo.configuracion).length) h += `<div class="card" style="margin-top:16px"><h2>Configuración general recomendada</h2>${ul(Mo.configuracion)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Todas las actividades de Moodle</h2><div class="scroll"><table class="tbl"><thead><tr><th>Sesión</th><th>Recurso</th><th>Nombre</th><th>Corrección</th><th>Para qué</th><th>Configuración clave</th></tr></thead><tbody>${all.map(m=>`<tr><td>S${m.n}</td><td>${esc(m.recurso)}</td><td>${esc(m.nombre)}${m.criterio?' '+chip(m.criterio):''}</td><td>${corrBadge(m)||'—'}</td><td>${esc(m.uso)}</td><td>${ul(m.config)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#p-moodle').innerHTML = h;
})();

/* ---------- 5. DUA ---------- */
(function(){
  const D = S.dua || {};
  let h = `<div class="grid g2">${Object.entries(D).map(([k,v])=>`<div class="card"><h2>${esc(k)}</h2>${ul(v)}</div>`).join('')}</div>`;
  if(arr(S.diversidad).length) h += `<div class="card" style="margin-top:16px"><h2>Atención a la diversidad</h2><table class="tbl"><thead><tr><th>Perfil</th><th>Medidas concretas</th></tr></thead><tbody>${S.diversidad.map(d=>`<tr><td><b>${esc(d.perfil)}</b></td><td>${esc(d.medidas)}</td></tr>`).join('')}</tbody></table></div>`;
  if(arr(S.roles).length) h += `<div class="card" style="margin-top:16px"><h2>Roles del equipo</h2><table class="tbl"><tbody>${S.roles.map(r=>`<tr><td><b>${esc(r.rol)}</b></td><td>${esc(r.funcion)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#p-dua').innerHTML = h;
})();

/* ---------- 6. evaluación ---------- */
(function(){
  const E = S.evaluacion || {};
  let st = {}; try{ st = JSON.parse(localStorage.getItem('sda-cotejo-'+M.titulo)||'{}'); }catch(_){}
  let h = `<div class="card"><h2>Lista de cotejo interactiva</h2><p class="note">Marca los indicadores logrados; el progreso se calcula por criterio y se guarda en este navegador.</p>
    <div class="grid g2">${arr(E.cotejo).map((g,gi)=>`<div class="side"><span class="pct" data-p="${gi}"></span>${chip(g.criterio)}<div class="bar"><div data-b="${gi}"></div></div><ul class="cot" style="padding:0">${arr(g.indicadores).map((t,i)=>`<li><label><input type="checkbox" data-k="${gi}-${i}" ${st[gi+'-'+i]?'checked':''}> <span>${esc(t)}</span></label></li>`).join('')}</ul></div>`).join('')}</div>
    <button class="copy" id="cot-reset" style="margin-top:10px">Borrar marcas</button></div>`;
  const TR = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='rubrica').map(m=>({...m,n:x.n})));
  const TA = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='apto').map(m=>({...m,n:x.n})));
  const PTS = [1,3,5,7,10];
  if(TR.length) h += `<div class="card" style="margin-top:16px"><h2>Rúbricas de las tareas finales</h2><p class="note">Cada línea se puntúa con 1, 3, 5, 7 o 10 puntos y la nota es la media (ponderada cuando la línea indica su peso). Pulsa una casilla para calcular la nota de un estudiante (no se guarda).</p>${TR.map((m,ti)=>`<h3>${tname(m)} ${chips([...new Set(arr(m.rubrica).map(l=>l.criterio||m.criterio))])} <span class="pct" data-rn="${ti}"></span></h3><div class="scroll"><table class="tbl rub" data-t="${ti}"><thead><tr><th>Línea</th>${PTS.map(p=>`<th>${p} pto</th>`).join('')}</tr></thead><tbody>${arr(m.rubrica).map((l,li)=>`<tr><td><b>${esc(l.linea)}</b>${l.criterio?`<br><small>${esc(l.criterio)}</small>`:''}${l.peso?`<br><small>peso ${String(l.peso).replace('.',',')} %</small>`:''}</td>${arr(l.niveles).map((x,k)=>`<td class="rc" data-l="${li}" data-w="${l.peso||1}" data-c="${esc(l.criterio||m.criterio||'')}" data-p="${PTS[k]}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
  const TD = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='directa').map(m=>({...m,n:x.n})));
  if(TD.length) h += `<div class="card" style="margin-top:16px"><h2>Tareas con calificación directa (1-10)</h2><p class="note">El docente pone la nota de 1 a 10 a partir de lo que se valora; la nota pasa a Séneca.</p><div class="grid g2">${TD.map(m=>`<div class="side"><b>${tname(m)}</b> ${chip(m.criterio)}${ul(m.cotejo)}</div>`).join('')}</div></div>`;
  if(TA.length) h += `<div class="card" style="margin-top:16px"><h2>Tareas de verificación (Apto / No apto)</h2><p class="note">Es Apto si se cumplen todos los elementos.</p><div class="grid g2">${TA.map(m=>`<div class="side"><b>${tname(m)}</b> ${chip(m.criterio)}${ul(m.cotejo)}</div>`).join('')}</div></div>`;
  if(arr(E.rubrica).length){ const niv = E.niveles || ['Insuficiente (1-4)','Suficiente / Bien (5-6)','Notable (7-8)','Sobresaliente (9-10)'];
    h += `<div class="card" style="margin-top:16px"><h2>Rúbrica</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${niv.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${E.rubrica.map(r=>`<tr><td>${chip(r.criterio)}</td>${arr(r.niveles).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; }
  if(E.agentes) h += `<div class="card" style="margin-top:16px"><h2>Agentes e instrumentos</h2>${Object.entries(E.agentes).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;
  $('#p-eval').innerHTML = h;
  const sel = {};
  $('#p-eval').addEventListener('click', e => { const c = e.target.closest('td.rc'); if(!c) return; const t = c.closest('table').dataset.t;
    c.parentElement.querySelectorAll('td.rc').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    sel[t] = sel[t]||{}; sel[t][c.dataset.l] = [+c.dataset.p, +c.dataset.w]; const v = Object.values(sel[t]); const nl = c.closest('tbody').rows.length;
    const wt = [...c.closest('tbody').rows].reduce((a,r)=>a+(+r.querySelector('td.rc').dataset.w),0);
    document.querySelector(`[data-rn="${t}"]`).textContent = `Nota: ${(v.reduce((a,[p,w])=>a+p*w,0)/wt).toFixed(1)}` + (()=>{ const rs=[...c.closest('tbody').rows].map(r=>r.querySelector('td.rc').dataset); const cs=[...new Set(rs.map(d=>d.c))]; if(cs.length<2) return ''; return ' · ' + cs.map(k=>{ const ws=rs.filter(d=>d.c===k).reduce((a,d)=>a+(+d.w),0); const pt=Object.entries(sel[t]).filter(([i])=>rs[i].c===k).reduce((a,[,x])=>a+x[0]*x[1],0); return k+': '+(pt/ws).toFixed(1); }).join(' · '); })() + (v.length<nl?` (faltan ${nl-v.length} líneas)`:''); });
  function upd(){ arr(E.cotejo).forEach((g,gi)=>{ const n = arr(g.indicadores).length; const k = arr(g.indicadores).filter((_,i)=>st[gi+'-'+i]).length; const p = n?Math.round(k/n*100):0;
    document.querySelector(`[data-b="${gi}"]`).style.width = p+'%'; document.querySelector(`[data-p="${gi}"]`).textContent = p+' %'; }); }
  function save(){ try{ localStorage.setItem('sda-cotejo-'+M.titulo, JSON.stringify(st)); }catch(_){} }
  $('#p-eval').addEventListener('change', e => { const k = e.target.dataset.k; if(k){ st[k]=e.target.checked; save(); upd(); } });
  $('#cot-reset').onclick = () => { st = {}; save(); document.querySelectorAll('#p-eval input[type=checkbox]').forEach(x=>x.checked=false); upd(); };
  upd();
})();

/* ---------- 7. Séneca ---------- */
(function(){
  const SE = DATA.seneca;
  const box = (t, txt) => `<div class="copybox"><div class="ch"><span>${esc(t)}</span><button class="copy">Copiar</button></div><pre>${esc(txt)}</pre></div>`;
  let h = `<div class="card"><h2>Textos listos para pegar en Séneca</h2><p class="note">Séneca guarda texto plano: estos bloques no llevan formato Markdown. Copia cada campo en su casilla del formulario de la situación de aprendizaje.</p>
    ${box('Título', SE.titulo)}${box('Temporalización', SE.temporalizacion)}${box('Justificación', SE.justificacion)}${box('Producto final', SE.producto_final)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Concreción curricular</h2><p class="note">En Séneca se marcan en las listas; aquí tienes la selección para comprobarla.</p>${SE.concrecion.map(m=>box(m.materia, m.texto)).join('')}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Actividades (formulario «Detalle de la actividad»)</h2><p class="note">Los campos siguen el orden del formulario de Séneca. Solo hay una actividad por cada Tarea de Moodle evaluada con rúbrica. En «Vinculación criterios de evaluación» elige la única trazabilidad indicada y pasa esos criterios a «seleccionados» (es obligatorio).</p>${SE.actividades.map(a=>`<h3>${esc(a.orden)}. ${esc(a.titulo)} <span class="badge">${esc(a.tipo)}</span> <span class="badge">${esc(a.abreviatura)}</span> <span class="badge">Tarea ${esc(a.tarea)}</span></h3>${box('Título de la actividad', a.titulo)}${box('Tipo de actividad', a.tipo)}${box('Abreviatura', a.abreviatura)}${box('Orden de la presentación', a.orden)}${box('Descripción', a.descripcion)}${box('Temporalización', a.temporalizacion)}${box('Recursos', a.recursos)}${box('Descriptores operativos', a.descriptores)}${box('Vinculación criterios de evaluación', a.vinculacion)}${box('Ejercicios', a.ejercicios)}${box('Metodologías', a.metodologias)}`).join('')}</div>`;
  $('#p-seneca').innerHTML = h;
})();
</script>
</body>
</html>
