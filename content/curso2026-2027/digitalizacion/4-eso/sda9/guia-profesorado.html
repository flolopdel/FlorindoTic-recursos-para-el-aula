<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 9: IA, Big Data, e-Administración y Comercio Electrónico", "numero": 9, "subtitulo": "«Ciudadanía digital 360»: una web interactiva hecha con IA para no perderse en la red ni en los trámites", "curso_texto": "4.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Trabajo individual en casi todas las tareas; parejas (piloto y copiloto) solo en el producto final", "temporalizacion": "Tercer trimestre (orientativo: 3 semanas a 3 sesiones semanales)", "carpeta_drive": "1Zx9QhKqg9UWvAtWOMw3hh1T4mWib-4Aa"}, "materias": [{"codigo": "DIG", "criterios": ["DIG.4.2.3", "DIG.4.4.2", "DIG.4.4.3", "DIG.4.4.4"], "saberes": ["DIG.4.D.2", "DIG.4.D.3", "DIG.4.D.4", "DIG.4.D.5"]}], "vision": {"descripcion": "El alumnado descubre qué hay detrás de las apps que usa a diario (Big Data e inteligencia artificial generativa), aprende a conversar con un modelo de lenguaje con sentido crítico, detecta sesgos y brechas, y aprende a hacer trámites con la Administración y compras en línea de forma segura. Con todo ello crea, con ayuda de NotebookLM y de Gemini Canvas, una web HTML interactiva que explica estos temas a otros jóvenes.", "contexto": "Grupo adaptado de 4.º ESO de 22 estudiantes, en su mayoría repetidores o con dificultades de aprendizaje, muy activos en TikTok e Instagram. Aula de informática con un ordenador por estudiante, Google Workspace del centro (@g.educaand.es) con Gemini y NotebookLM, Genially, Canva para Educación y Moodle Centros. En muchas familias los trámites en línea los hace el propio alumnado o nadie, lo que da al tema una utilidad inmediata.", "justificacion": "La ciudadanía digital activa y crítica requiere comprender las tecnologías emergentes (Big Data e inteligencia artificial generativa) y dominar las gestiones administrativas y comerciales en línea, siendo conscientes de las brechas sociales y de los sesgos algorítmicos. El alumnado ya usa la IA y las compras en línea, pero rara vez sabe cómo funcionan, qué riesgos tienen o cómo se identifica ante la Administración. Esta SdA convierte ese uso cotidiano en uso crítico y responsable, y lo concreta en un producto útil para otras personas.", "reto": "«El departamento de Orientación nos ha pedido una web sencilla e interactiva para el alumnado que deja la ESO: cómo funciona la IA que usamos cada día, qué sesgos tiene, cómo se hacen los trámites con la Administración y cómo comprar en internet sin sustos. La vamos a crear nosotros, usando la IA con cabeza.»", "pregunta_guia": "¿Cómo podemos usar la IA para crear una guía útil sobre la vida digital adulta sin creernos todo lo que nos dice?", "producto_final": "Una página web HTML interactiva e independiente (un solo archivo), creada por parejas a partir del análisis de varias fuentes con NotebookLM y generada y personalizada con Gemini Canvas. Incluye una explicación de Big Data e IA con sus sesgos, una guía de e-Administración y comercio electrónico seguro, un pequeño test interactivo y una declaración de cómo se ha usado la IA en el proceso."}, "metodologias": [{"nombre": "Aprendizaje basado en retos", "descripcion": "Encargo real del departamento de Orientación: una web para el alumnado que termina la ESO."}, {"nombre": "Aprendizaje por descubrimiento guiado", "descripcion": "Antes de explicar, el alumnado prueba la IA, analiza una tienda o una factura y saca conclusiones con preguntas guiadas."}, {"nombre": "Instrucción explícita con modelado", "descripcion": "El docente muestra en pantalla cada herramienta (Gemini, NotebookLM, Gemini Canvas) antes de que el alumnado la use, con pasos cortos."}, {"nombre": "Trabajo en parejas con roles", "descripcion": "Solo en el producto final: piloto (teclado y prompts) y copiloto (verificación de datos y lista de comprobación), que rotan cada 15 minutos."}, {"nombre": "Evaluación formativa", "descripcion": "Quiz rápidos, lista de comprobación antes de entregar y prueba cruzada entre parejas antes de la entrega final."}], "recursos": ["Aula de informática (un ordenador por estudiante)", "Proyector", "Google Workspace del centro", "Gemini y Gemini Canvas (cuenta del centro)", "NotebookLM (cuenta del centro)", "Moodle Centros", "Webs oficiales: clave.gob.es, sede FNMT, ClicSalud+", "Web de clase de la SdA"], "fases": [{"nombre": "Bloque 1 · Big Data e IA", "sesiones": "1-3", "finalidad": "Motivación, diagnóstico y análisis crítico de la IA generativa: datos, prompts, sesgos, brecha y soberanía tecnológica"}, {"nombre": "Bloque 2 · Trámites y compras", "sesiones": "4-6", "finalidad": "Identificación digital ante la Administración, compras y pagos seguros, factura digital y criptomonedas; guía HTML individual"}, {"nombre": "Bloque 3 · Síntesis HTML", "sesiones": "7-9", "finalidad": "Análisis de fuentes con NotebookLM, creación del producto final en parejas y evaluación ética del proceso"}], "sesiones": [{"n": 1, "fase": "Bloque 1 · Big Data e IA", "titulo": "¿Cuántos datos dejas en una hora de TikTok?", "reto": "Descubrir que cada gesto en una app es un dato y entender las 5 V del Big Data con ejemplos propios.", "actividades": [{"nombre": "Gancho: el algoritmo te conoce", "min": 10, "desc": "El docente proyecta la diapositiva «Tu «Para ti» no es casualidad» y pregunta: «¿Por qué a ti te salen vídeos de motos y a tu compañera de maquillaje?». Lluvia de ideas en la pizarra: ¿qué sabe TikTok de ti sin que se lo digas? (cuánto miras un vídeo, si lo repites, la hora, la ubicación aproximada…). Se presenta el reto de la SdA y el producto final."}, {"nombre": "Encuesta inicial F1", "min": 8, "desc": "Cada estudiante responde el formulario anónimo F1 (uso de IA, compras en línea y trámites que ha hecho alguna vez). El docente proyecta después los resultados agregados para comentar dos o tres datos llamativos de la clase."}, {"nombre": "Las 5 V del Big Data", "min": 15, "desc": "Explicación breve con la infografía de las 5 V (Volumen, Velocidad, Variedad, Veracidad y Valor), cada una con un ejemplo cotidiano: Spotify Wrapped (volumen y valor), el tráfico en Google Maps (velocidad), las fotos, mensajes y compras de una misma cuenta (variedad), los bots y las reseñas falsas (veracidad). Quiz rápido de 2 preguntas en la web de clase."}, {"nombre": "Mi rastro de datos en una hora", "min": 12, "desc": "Individual, en el cuaderno: cada estudiante elige una app que use a diario y anota 5 datos que genera en una hora de uso, cuál de las 5 V representa cada uno y para qué cree que la empresa lo usa. Dos voluntarios lo comparten."}, {"nombre": "Cierre", "min": 5, "desc": "Pregunta de salida oral: «¿Qué dato tuyo te ha sorprendido más que se guarde?». El docente anticipa la siguiente sesión: hablar con una IA que se ha entrenado con muchísimos de esos datos."}], "criterios": [], "saberes": ["DIG.4.D.5"], "metodologia": ["Aprendizaje por descubrimiento guiado", "Evaluación formativa"], "evidencias": ["Encuesta inicial F1 (diagnóstica)", "Tabla «Mi rastro de datos» en el cuaderno"], "recursos": ["Proyector", "Formulario F1", "Cuaderno"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Ejemplos de apps elegidas por el propio alumnado; las 5 V con icono, palabra clave y ejemplo; la tabla del cuaderno tiene las columnas ya dibujadas en la diapositiva."}, "ejercicios": ["Responde la encuesta inicial sobre IA, compras y trámites en línea.", "Elige una app que uses a diario y anota 5 datos que genera en una hora, la V del Big Data a la que corresponde cada uno y para qué crees que se usa."], "clase": {"pregunta": "¿Qué sabe de ti una app que usas cada día sin que se lo hayas contado?", "diapositivas": [{"tipo": "ejemplo", "icono": "📱", "titulo": "Tu «Para ti» no es casualidad", "situacion": "Ves dos vídeos de motos hasta el final y al día siguiente tu «Para ti» está **lleno de motos**.", "explicacion": "La app guarda cada gesto: cuánto tiempo miras, si repites, si das like o pasas rápido. Con millones de personas haciendo lo mismo, un algoritmo **predice** qué te va a enganchar.", "pregunta": "¿Qué sabe TikTok de ti sin que se lo hayas dicho?", "nota": "Apunta las respuestas en la pizarra: las usaréis en la actividad final de la sesión."}, {"tipo": "practica", "titulo": "Encuesta inicial", "tiempo": 8, "enunciado": "Responde el formulario **F1**. Es **anónimo**: contesta con sinceridad. Luego veremos los resultados de la clase.", "nota": "Proyecta el resumen de respuestas de Google Forms y comenta dos datos."}, {"tipo": "infografia", "titulo": "Las 5 V del Big Data", "elementos": [{"icono": "📦", "titulo": "Volumen", "texto": "Muchísimos datos: todo tu año de canciones en Spotify Wrapped."}, {"icono": "⚡", "titulo": "Velocidad", "texto": "Llegan y se procesan al momento: el atasco en Google Maps."}, {"icono": "🧩", "titulo": "Variedad", "texto": "Fotos, mensajes, ubicaciones, compras… de la misma cuenta."}, {"icono": "🔍", "titulo": "Veracidad", "texto": "¿Son fiables? Bots, cuentas falsas y reseñas compradas."}, {"icono": "💰", "titulo": "Valor", "texto": "Para qué sirven: anuncios, recomendaciones, decisiones."}], "nota": "Pide un ejemplo propio de cada V antes de pasar a la siguiente diapositiva."}, {"tipo": "quiz", "pregunta": "Instagram detecta en segundos que un vídeo se está haciendo viral y lo enseña a más gente. ¿Qué V del Big Data es la más importante aquí?", "opciones": ["Variedad", "Velocidad", "Veracidad"], "correcta": 1, "explicacion": "Es la **velocidad**: los datos se procesan casi en tiempo real para decidir qué mostrar."}, {"tipo": "practica", "titulo": "Mi rastro de datos en una hora", "tiempo": 12, "enunciado": "Elige **una app** que uses cada día. En el cuaderno, haz una tabla con 3 columnas: **dato que genero · V del Big Data · para qué lo usa la empresa**. Escribe 5 filas.", "pasos": ["Ejemplo: «Cuánto tiempo miro cada vídeo · Volumen · Saber qué me engancha».", "Piensa en lo que haces: buscar, pausar, dar like, compartir, comprar.", "Marca con ⭐ el dato que menos te gusta que guarden."], "agrupamiento": "Individual", "ayudas": [{"tipo": "pista", "titulo": "Si no se te ocurren datos", "puntos": ["La hora a la que te conectas.", "Desde dónde te conectas.", "A quién sigues y a quién escribes.", "Qué buscas y qué compras."]}]}, {"tipo": "video", "titulo": "Big Data explicado en pocos minutos", "busqueda": "qué es el big data explicado para jóvenes", "texto": "Opcional si sobra tiempo o para repasar en casa.", "preguntas": ["¿Qué ejemplo del vídeo se parece más a tu app?", "¿Qué V del Big Data aparece más?"]}]}}, {"n": 2, "fase": "Bloque 1 · Big Data e IA", "titulo": "Hablar con la IA: prompts que funcionan y respuestas que mienten", "reto": "Escribir prompts completos para un modelo de lenguaje y comprobar sus respuestas con fuentes fiables.", "actividades": [{"nombre": "¿Cómo «piensa» un chatbot?", "min": 10, "desc": "El docente compara el autocompletado del teclado del móvil con un modelo de lenguaje: los dos predicen la siguiente palabra, pero el chatbot se ha entrenado con una cantidad enorme de textos (Big Data). Se muestran en pantalla Gemini, ChatGPT y Claude y se explica por qué en clase usamos Gemini con la cuenta del centro (protección de datos y edad mínima de cada servicio)."}, {"nombre": "Taller de prompts RCTF", "min": 20, "desc": "Cada estudiante entra en Gemini con su cuenta @g.educaand.es y prueba el mismo encargo dos veces: un prompt pobre («hazme un horario de estudio») y uno completo con la fórmula RCTF (Rol, Contexto, Tarea, Formato): «Actúa como orientador/a. Soy estudiante de 4.º ESO con exámenes de Inglés y Mates la semana que viene y entreno los martes y jueves. Hazme un horario de estudio de 5 días. Ponlo en una tabla». Anota en la parte 1 de la plantilla A1 los dos prompts y qué mejoró."}, {"nombre": "Caza la alucinación", "min": 15, "desc": "Cada estudiante pregunta a Gemini tres datos comprobables (p. ej. cuántos habitantes tiene su municipio, quién escribió «Platero y yo» y cuándo se aprobó la Constitución española) y los contrasta con una fuente oficial (INE, web del ayuntamiento, BOE). Anota en A1 si la respuesta era correcta, dudosa o falsa."}, {"nombre": "Cierre", "min": 5, "desc": "Puesta en común: ¿cuántas alucinaciones ha encontrado la clase? Regla de la SdA: «la IA propone, yo compruebo»."}], "criterios": ["DIG.4.4.3"], "saberes": ["DIG.4.D.2", "DIG.4.D.5"], "metodologia": ["Instrucción explícita con modelado", "Aprendizaje por descubrimiento guiado"], "evidencias": ["Parte 1 de la plantilla A1: prompts comparados y datos comprobados"], "recursos": ["Gemini (cuenta del centro)", "Plantilla A1", "Proyector"], "dua": {"principios": ["Representación", "Acción y Expresión", "Andamiaje"], "medidas": "La fórmula RCTF se queda proyectada como chuleta; quien lo necesite parte de un prompt completo ya escrito y solo cambia el contexto; se puede dictar el prompt por voz."}, "ejercicios": ["Escribe un prompt pobre y otro con la fórmula RCTF para el mismo encargo y explica qué mejoró en la respuesta.", "Pregunta tres datos comprobables a la IA y compáralos con una fuente oficial."], "clase": {"pregunta": "Si la IA suena tan segura, ¿cómo sabes si te está diciendo la verdad?", "diapositivas": [{"tipo": "ejemplo", "icono": "⌨️", "titulo": "El autocompletado de tu móvil", "situacion": "Escribes «nos vemos en» y el teclado te sugiere **«el insti»** o **«la plaza»**.", "explicacion": "Predice la palabra más probable a partir de lo que tú sueles escribir. Un chatbot hace lo mismo a lo grande: ha «leído» **muchísimos textos** y predice la respuesta palabra a palabra. No consulta la verdad: **calcula lo más probable**.", "pregunta": "¿Por qué entonces puede inventarse cosas?"}, {"tipo": "comparar", "titulo": "Prompt pobre vs. prompt RCTF", "columnas": [{"icono": "😴", "titulo": "Pobre", "puntos": ["«Hazme un horario de estudio»", "Respuesta genérica", "No sabe nada de ti"]}, {"icono": "🎯", "titulo": "RCTF", "puntos": ["**R**ol: actúa como orientador/a", "**C**ontexto: 4.º ESO, exámenes, entreno martes y jueves", "**T**area: horario de 5 días", "**F**ormato: en una tabla"]}], "nota": "Deja esta diapositiva proyectada durante el taller como chuleta."}, {"tipo": "practica", "titulo": "Taller de prompts", "tiempo": 20, "enunciado": "En **Gemini** (cuenta del centro), prueba el mismo encargo con un prompt pobre y con uno **RCTF**. Copia los dos prompts en la **parte 1 de la plantilla A1** y escribe qué mejoró.", "pasos": ["Abre gemini.google.com con tu cuenta @g.educaand.es.", "Escribe el prompt pobre y mira la respuesta.", "Abre un chat nuevo y escribe el prompt RCTF.", "Compara y apúntalo en A1."], "agrupamiento": "Individual", "entrega": "Tarea 9.1 · Laboratorio de IA (se entrega en la sesión 3)", "ayudas": [{"tipo": "pista", "titulo": "Otros encargos si no quieres el horario", "puntos": ["Una rutina de entrenamiento para principiantes.", "Ideas para un vídeo de TikTok sobre tu pueblo.", "Un menú de cena barato para 4 personas."]}], "enlace": "https://docs.google.com/document/d/1kpg1C2adE804Hu-MMWKiKE41CLFPcNcX5oL223yDv70/copy"}, {"tipo": "practica", "titulo": "Caza la alucinación", "tiempo": 15, "enunciado": "Pregunta a Gemini **3 datos comprobables** y busca la respuesta en una **fuente oficial**. Marca en A1: ✅ correcta · ⚠️ dudosa · ❌ falsa.", "pasos": ["Habitantes de tu municipio → INE o web del ayuntamiento.", "Autor de «Platero y yo» y año de publicación → biblioteca o enciclopedia.", "Fecha de aprobación de la Constitución española → BOE."], "agrupamiento": "Individual"}, {"tipo": "quiz", "pregunta": "La IA te da una cifra con mucha seguridad y sin fuente. ¿Qué haces?", "opciones": ["La copio: si lo dice tan segura, será verdad", "La compruebo en una fuente oficial antes de usarla", "Le pregunto otra vez y, si repite lo mismo, es cierta"], "correcta": 1, "explicacion": "Repetirse no la hace verdadera. **La IA propone, yo compruebo**: siempre con una fuente fiable."}]}}, {"n": 3, "fase": "Bloque 1 · Big Data e IA", "titulo": "Sesgos, brecha digital y soberanía tecnológica", "reto": "Detectar sesgos en las respuestas de la IA y explicar quién se queda fuera de la digitalización y por qué importa dónde están los datos.", "actividades": [{"nombre": "Gancho: dibuja a una persona que…", "min": 8, "desc": "El docente pide a Gemini en pantalla descripciones o imágenes de «una persona que es ingeniera», «una persona que cuida a niños» y «una persona que dirige una empresa». La clase observa qué se repite (género, edad, aspecto) y se introduce el concepto de sesgo algorítmico: la IA repite los estereotipos de los datos con los que aprendió."}, {"nombre": "Laboratorio de sesgos", "min": 17, "desc": "Cada estudiante hace en Gemini dos pruebas guiadas y las anota en la parte 2 de A1: (1) sesgo de estereotipo: pide 5 nombres para personajes que sean «enfermero/a», «piloto», «limpiador/a» y observa el género y el origen; (2) sesgo ideológico o de encuadre: pregunta «¿Es bueno que los jóvenes usen redes sociales?» y luego «¿Por qué las redes sociales son peligrosas para los jóvenes?» y compara cómo cambia la respuesta según cómo se pregunta."}, {"nombre": "Brecha digital y soberanía tecnológica", "min": 12, "desc": "Caso de la abuela que no puede pedir cita médica porque todo es por app (ClicSalud+). En parejas de mesa, 3 minutos: ¿quién se queda fuera y por qué (edad, dinero, zona rural, discapacidad, idioma)? Después, el docente explica la soberanía tecnológica con una pregunta: ¿dónde se guardan tus fotos, tus mensajes y lo que le preguntas a la IA? Se menciona que España y la UE impulsan modelos de IA propios (p. ej. ALIA) y leyes como el Reglamento europeo de IA."}, {"nombre": "Completar y entregar A1", "min": 13, "desc": "Cada estudiante termina la parte 3 de A1 (conclusiones: un sesgo detectado, un colectivo afectado por la brecha y una medida para reducirla) y la entrega en la Tarea 9.1. El docente revisa con la lista de comprobación mientras circula por el aula."}], "criterios": ["DIG.4.4.3", "DIG.4.4.4"], "saberes": ["DIG.4.D.2", "DIG.4.D.5"], "metodologia": ["Aprendizaje por descubrimiento guiado", "Evaluación formativa"], "evidencias": ["Plantilla A1 completa (Tarea 9.1)"], "recursos": ["Gemini (cuenta del centro)", "Plantilla A1", "Moodle Centros"], "dua": {"principios": ["Compromiso", "Acción y Expresión", "Andamiaje"], "medidas": "Las pruebas de sesgo tienen los prompts ya escritos para copiar y pegar; las conclusiones se pueden escribir con frases de inicio («He visto que la IA…», «Se quedan fuera…»); quien termine antes prueba otro sesgo libre."}, "ejercicios": ["Haz dos pruebas de sesgo con la IA (estereotipo y encuadre) y describe qué has observado.", "Explica qué colectivo se queda fuera de la digitalización en un trámite cotidiano y propone una medida para reducir esa brecha."], "moodle": [{"recurso": "Tarea", "nombre": "9.1 · Laboratorio de IA: prompts, alucinaciones y sesgos", "uso": "Comprobar que cada estudiante ha probado la IA de forma crítica (prompts, comprobación de datos y sesgos) antes de usarla para crear contenidos en el resto de la SdA.", "correccion": "apto", "criterio": "DIG.4.4.3", "cotejo": ["Se entrega la plantilla A1 en PDF o como enlace al documento", "La parte 1 tiene un prompt pobre y uno RCTF con lo que mejoró", "Hay 3 datos comprobados con su fuente oficial y su valoración", "La parte 2 describe al menos un sesgo observado en las respuestas", "Las conclusiones nombran un colectivo afectado por la brecha digital y una medida"], "config": ["Tipo de entrega: archivo (PDF) o texto en línea con el enlace", "Calificación: escala Apto / No apto", "Entrega individual"], "calificable": true, "codigo": "9.1"}], "clase": {"pregunta": "¿Puede una máquina tener prejuicios?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎨", "titulo": "«Dibuja a una persona que dirige una empresa»", "situacion": "Pedimos a la IA personas con distintos trabajos y casi siempre salen **los mismos perfiles** para los mismos puestos.", "explicacion": "La IA aprende de textos e imágenes de internet. Si en esos datos hay estereotipos, **los repite y los amplifica**. Eso es un **sesgo algorítmico**.", "pregunta": "¿Qué consecuencias tendría si una IA así filtrara currículums?", "nota": "Haz la prueba en directo con Gemini; si las respuestas salen equilibradas, coméntalo también: las empresas corrigen algunos sesgos, pero no todos."}, {"tipo": "practica", "titulo": "Laboratorio de sesgos", "tiempo": 17, "enunciado": "Haz las **dos pruebas** en Gemini y anota lo que observas en la **parte 2 de A1**.", "pasos": ["Prueba 1 · Estereotipo: «Dame 5 nombres para personajes de una serie que trabajan de enfermero/a, piloto y limpiador/a». ¿Qué género y origen tienen?", "Prueba 2 · Encuadre: pregunta «¿Es bueno que los jóvenes usen redes sociales?».", "En un chat nuevo: «¿Por qué las redes sociales son peligrosas para los jóvenes?».", "Compara: ¿cambia la respuesta según cómo preguntas?"], "agrupamiento": "Individual", "ayudas": [{"tipo": "pista", "titulo": "Qué mirar en la prueba 2", "puntos": ["¿Da los dos lados o solo uno?", "¿Usa palabras positivas o negativas?", "¿Te da la razón con lo que ya insinuabas en la pregunta?"]}], "enlace": "https://docs.google.com/document/d/1kpg1C2adE804Hu-MMWKiKE41CLFPcNcX5oL223yDv70/copy"}, {"tipo": "comparar", "titulo": "Brecha digital: ¿quién se queda fuera?", "columnas": [{"icono": "👵", "titulo": "La abuela y su cita médica", "puntos": ["Todo es por app (ClicSalud+)", "No tiene smartphone o no sabe usarlo", "Depende de que alguien le ayude"]}, {"icono": "🌍", "titulo": "Otros colectivos", "puntos": ["Zonas rurales sin buena conexión", "Familias sin ordenador", "Personas con discapacidad o que no dominan el idioma"]}], "pregunta": "¿Has hecho tú algún trámite por alguien de tu familia?"}, {"tipo": "idea", "icono": "🏛️", "titulo": "Soberanía tecnológica", "texto": "¿Dónde se guardan tus fotos, tus mensajes y lo que le preguntas a la IA?", "puntos": ["Casi siempre en **servidores de grandes empresas** de fuera de Europa.", "Quien controla los datos y la IA tiene **poder**.", "La UE crea leyes (Reglamento de IA) y España impulsa modelos propios como **ALIA**."]}, {"tipo": "practica", "titulo": "Termina y entrega A1", "tiempo": 13, "enunciado": "Completa la **parte 3 de A1** (conclusiones) y repasa el «Antes de entregar». Sube el PDF o el enlace a Moodle.", "entrega": "Tarea 9.1 · Laboratorio de IA: prompts, alucinaciones y sesgos", "agrupamiento": "Individual", "ayudas": [{"tipo": "emociones", "titulo": "Si te has atascado", "texto": "No pasa nada si una prueba no ha salido como esperabas: también es un resultado. Escribe lo que has visto, aunque sea poco. Es **Apto** si están todas las partes."}]}, {"tipo": "video", "titulo": "Sesgos en la inteligencia artificial", "busqueda": "sesgo algorítmico inteligencia artificial ejemplos explicado", "texto": "Para repasar en casa o si sobra tiempo.", "preguntas": ["¿Qué ejemplo de sesgo te parece más grave?", "¿Quién debería corregirlo: la empresa, el Gobierno o quien usa la IA?"]}]}}, {"n": 4, "fase": "Bloque 2 · Trámites y compras", "titulo": "Tu identidad digital ante la Administración", "reto": "Saber qué sistemas de identificación existen (DNIe, certificado digital, Cl@ve) y qué trámites reales se pueden hacer con cada uno, reconociendo las webs oficiales.", "actividades": [{"nombre": "Gancho: ¿quién ha hecho un trámite?", "min": 7, "desc": "El docente recuerda los resultados de la encuesta F1 sobre trámites. Pregunta: ¿cómo demuestras quién eres en internet si nadie te ve la cara? Comparación con enseñar el DNI en la ventanilla."}, {"nombre": "Tres llaves para la Administración", "min": 13, "desc": "Explicación con la comparativa de los tres sistemas: DNI electrónico (chip y PIN, con lector o con el móvil por NFC), certificado digital de la FNMT (archivo instalado en el navegador; para persona física) y Cl@ve (app en el móvil que confirma el acceso; su versión anterior se llamaba Cl@ve PIN y se está unificando en Cl@ve Móvil). Se muestran las webs oficiales sin iniciar sesión: clave.gob.es, la sede de la FNMT y el punto de acceso general."}, {"nombre": "Escape room de trámites", "min": 22, "desc": "Individual. Seis tarjetas proyectadas con trámites reales: pedir cita en el centro de salud (ClicSalud+), solicitar la beca del Ministerio, consultar la vida laboral, pedir cita en la DGT para el examen, presentar la declaración de la renta y matricularse en un ciclo formativo. Para cada una el alumnado anota en el cuaderno: quién lo gestiona, qué identificación necesita y cómo reconoce que la web es oficial (dominio gob.es o juntadeandalucia.es, candado no basta). Corrección conjunta con la diapositiva de soluciones."}, {"nombre": "Cierre y quiz", "min": 8, "desc": "Quiz de una pregunta sobre webs falsas y pregunta de salida: ¿qué trámite podrías hacer tú ya o dentro de poco? Recordatorio: nunca se comparten el PIN, la contraseña ni el código de Cl@ve con nadie."}], "criterios": ["DIG.4.4.2"], "saberes": ["DIG.4.D.3"], "metodologia": ["Instrucción explícita con modelado", "Aprendizaje por descubrimiento guiado"], "evidencias": ["Tabla de trámites del escape room en el cuaderno"], "recursos": ["Proyector", "Webs oficiales de la Administración", "Cuaderno"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Cada sistema de identificación con icono, color y una frase; la tabla del escape room tiene las columnas dibujadas en la diapositiva y la solución plegable para comprobar."}, "ejercicios": ["Explica en qué se diferencian el DNI electrónico, el certificado digital y Cl@ve.", "Para seis trámites reales, indica qué organismo los gestiona, qué identificación hace falta y cómo reconoces que la web es oficial."], "clase": {"pregunta": "¿Cómo demuestras quién eres en internet si nadie te ve la cara?", "diapositivas": [{"tipo": "ejemplo", "icono": "🪪", "titulo": "De la ventanilla al móvil", "situacion": "Antes, para pedir un papel, hacías cola y **enseñabas el DNI** a una persona.", "explicacion": "Ahora la Administración es **e-Administración**: el trámite se hace en una web (sede electrónica) y tu identidad se comprueba con una **llave digital**.", "pregunta": "¿Qué trámite has visto hacer en casa por internet?"}, {"tipo": "comparar", "titulo": "Tres llaves digitales", "columnas": [{"icono": "💳", "titulo": "DNI electrónico", "puntos": ["Chip del DNI + PIN", "Lector o móvil con NFC", "Te lo dan con el DNI"]}, {"icono": "📄", "titulo": "Certificado digital FNMT", "puntos": ["Archivo instalado en el navegador", "Se pide en la sede de la FNMT", "Muy usado en Hacienda"]}, {"icono": "📲", "titulo": "Cl@ve", "puntos": ["App en el móvil que confirma el acceso", "Antes «Cl@ve PIN»; ahora se unifica en **Cl@ve Móvil**", "Registro una sola vez"]}], "nota": "Muestra clave.gob.es y la sede de la FNMT en pantalla, sin iniciar sesión."}, {"tipo": "practica", "titulo": "Escape room de trámites", "tiempo": 22, "enunciado": "Para cada trámite anota en el cuaderno: **quién lo gestiona · qué llave digital necesitas · cómo sabes que la web es oficial**.", "pasos": ["1. Pedir cita en el centro de salud (ClicSalud+).", "2. Solicitar la beca del Ministerio para estudiar.", "3. Consultar tu vida laboral.", "4. Pedir cita en la DGT para el examen de conducir.", "5. Presentar la declaración de la renta.", "6. Matricularte en un ciclo formativo en Andalucía."], "agrupamiento": "Individual", "ayudas": [{"tipo": "pista", "titulo": "Solución para comprobar", "puntos": ["1. Servicio Andaluz de Salud · basta con tus datos o Cl@ve · juntadeandalucia.es / app oficial.", "2. Ministerio de Educación · Cl@ve, certificado o DNIe · educacion.gob.es.", "3. Seguridad Social · Cl@ve, certificado o DNIe · seg-social.es.", "4. DGT · Cl@ve, certificado o DNIe · dgt.es.", "5. Agencia Tributaria · Cl@ve, certificado, DNIe o referencia · agenciatributaria.gob.es.", "6. Junta de Andalucía · Cl@ve, certificado o iANDE/clave iANDE · juntadeandalucia.es."]}]}, {"tipo": "quiz", "pregunta": "Te llega un SMS: «Su Cl@ve caducará hoy, renuévela aquí: clave-gob-renovar.com». ¿Qué haces?", "opciones": ["Entro rápido para no perder el acceso", "No entro: no es un dominio oficial gob.es y la Administración no pide eso por SMS", "Entro pero solo pongo mi DNI, no la contraseña"], "correcta": 1, "explicacion": "Es **phishing**. Las webs oficiales terminan en **.gob.es** o **juntadeandalucia.es**, y el candado del navegador **no** garantiza que una web sea oficial."}, {"tipo": "idea", "icono": "🔐", "titulo": "Reglas de oro", "puntos": ["**Nunca** compartas tu PIN, contraseña o código de Cl@ve.", "Escribe tú la dirección oficial; no entres desde enlaces de SMS o correos.", "Cierra la sesión al terminar, sobre todo en ordenadores compartidos."]}]}}, {"n": 5, "fase": "Bloque 2 · Trámites y compras", "titulo": "Comprar en línea sin sustos: pagos, facturas y criptomonedas", "reto": "Distinguir una tienda fiable de una sospechosa, elegir un método de pago seguro, leer una factura digital y explicar qué es una criptomoneda y sus riesgos.", "actividades": [{"nombre": "Gancho: ¿chollo o estafa?", "min": 7, "desc": "Se proyecta un anuncio inventado de Instagram: zapatillas de marca a 19,99 € en «zapas-outlet-oficial.shop», con cuenta atrás y solo pago por transferencia. Votación a mano alzada: ¿comprarías? ¿por qué?"}, {"nombre": "Detective de tiendas", "min": 15, "desc": "Individual. Tres fichas de tiendas inventadas en la diapositiva (A, B y C) con sus datos: aviso legal y NIF, formas de pago, opiniones, precio, política de devoluciones y dominio. El alumnado decide en el cuaderno cuál es fiable, cuál dudosa y cuál estafa, con dos razones cada una. Corrección con la lista de señales de alarma."}, {"nombre": "Formas de pago y factura digital", "min": 15, "desc": "Explicación breve de las formas de pago (tarjeta con verificación en el móvil, tarjeta virtual o prepago, Bizum, PayPal y contra reembolso) y de cuáles evitar en tiendas desconocidas (transferencia, criptomonedas). Lectura guiada de una factura digital inventada: emisor y NIF, número de factura, fecha, base imponible, IVA del 21 % y total; el alumnado comprueba el cálculo con la calculadora. Se recuerda el derecho de desistimiento de 14 días en compras en línea dentro de la UE."}, {"nombre": "Criptomonedas sin humo", "min": 10, "desc": "Qué es una criptomoneda (dinero digital registrado en una cadena de bloques, sin banco central), por qué su valor sube y baja tanto y por qué muchas estafas en redes usan criptomonedas («influencer» que promete multiplicar tu dinero). Quiz rápido."}, {"nombre": "Cierre", "min": 3, "desc": "Cada estudiante apunta en el cuaderno las 3 señales de alarma que más le han servido: las usará en su guía HTML de la próxima sesión."}], "criterios": ["DIG.4.4.2"], "saberes": ["DIG.4.D.4"], "metodologia": ["Aprendizaje por descubrimiento guiado", "Instrucción explícita con modelado"], "evidencias": ["Análisis de las tres tiendas en el cuaderno", "Comprobación de la factura"], "recursos": ["Proyector", "Calculadora", "Cuaderno"], "dua": {"principios": ["Compromiso", "Representación", "Andamiaje"], "medidas": "Casos cercanos (zapatillas, videojuegos, entradas de conciertos); la factura con cada parte señalada por colores; lista de señales de alarma como chuleta plegable."}, "ejercicios": ["Analiza tres tiendas en línea e indica cuál es fiable, cuál dudosa y cuál una estafa, con dos razones.", "Comprueba en una factura digital la base imponible, el IVA y el total.", "Explica qué es una criptomoneda y por qué se usa en muchas estafas."], "clase": {"pregunta": "¿Cómo sabes si una tienda de internet es de verdad antes de pagar?", "diapositivas": [{"tipo": "ejemplo", "icono": "👟", "titulo": "¿Chollo o estafa?", "situacion": "Anuncio en Instagram: zapatillas de marca a **19,99 €** en «zapas-outlet-oficial.shop», con cuenta atrás y **solo pago por transferencia**.", "explicacion": "Precio imposible, prisa y un pago que **no se puede reclamar**: tres señales clásicas de tienda falsa.", "pregunta": "¿Las comprarías? ¿Por qué?"}, {"tipo": "practica", "titulo": "Detective de tiendas", "tiempo": 15, "enunciado": "Decide en tu cuaderno qué tienda es **fiable**, cuál **dudosa** y cuál **estafa**, con **dos razones** para cada una.", "pasos": ["Tienda A · gamezone-es.com: aviso legal con NIF y dirección en Sevilla · tarjeta, Bizum y PayPal · devoluciones 14 días · precios normales.", "Tienda B · superdescuentos24.net: sin aviso legal · solo transferencia · móvil a mitad de precio · opiniones todas de 5 ⭐ del mismo día.", "Tienda C · tienda de ropa nueva en Instagram: aviso legal incompleto · pago con tarjeta · pocas opiniones · devoluciones «a consultar»."], "agrupamiento": "Individual", "ayudas": [{"tipo": "pista", "titulo": "Señales de alarma", "puntos": ["Sin aviso legal, NIF ni dirección.", "Solo transferencia, criptomonedas o tarjetas regalo.", "Precio demasiado bueno y cuenta atrás.", "Opiniones falsas o copiadas; dominio raro."]}, {"tipo": "pista", "titulo": "Solución para comprobar", "texto": "A es fiable; B es estafa; C es dudosa: mejor buscar opiniones fuera de la tienda y pagar con un método que se pueda reclamar."}]}, {"tipo": "comparar", "titulo": "¿Cómo pago?", "columnas": [{"icono": "✅", "titulo": "Más seguro", "puntos": ["Tarjeta con confirmación en el móvil", "Tarjeta virtual o prepago", "PayPal o Bizum en tiendas conocidas"]}, {"icono": "⛔", "titulo": "Evitar en tiendas desconocidas", "puntos": ["Transferencia bancaria", "Criptomonedas", "Tarjetas regalo o recargas"]}], "texto": "Clave: elegir un pago que **se pueda reclamar** si algo sale mal."}, {"tipo": "practica", "titulo": "Lee la factura", "tiempo": 10, "enunciado": "Factura n.º 2027-0153 de **Zapas Sur, S. L.** (NIF B00000000, ficticio). Base imponible: **49,59 €** · IVA 21 % · Total: **60,00 €**. Comprueba con la calculadora que el IVA y el total son correctos y señala quién emite y quién recibe la factura.", "pasos": ["IVA = base × 0,21.", "Total = base + IVA.", "¿Qué datos de la factura te sirven para reclamar o devolver?"], "agrupamiento": "Individual", "ayudas": [{"tipo": "pista", "titulo": "Solución", "texto": "IVA = 49,59 × 0,21 = 10,41 €; total = 49,59 + 10,41 = 60,00 €. Para reclamar sirven el número de factura, la fecha y los datos del emisor."}]}, {"tipo": "quiz", "pregunta": "Un «influencer» de TikTok promete duplicar tu dinero en una semana si compras su criptomoneda. ¿Qué es lo más probable?", "opciones": ["Una inversión segura porque tiene muchos seguidores", "Una estafa: nadie puede garantizar beneficios y el pago no se puede recuperar", "Un regalo del banco"], "correcta": 1, "explicacion": "Las criptomonedas cambian mucho de valor y **las transferencias no se pueden deshacer**. Prometer ganancias seguras es la señal típica de estafa."}, {"tipo": "idea", "icono": "🪙", "titulo": "Criptomonedas en 3 ideas", "puntos": ["Dinero **digital** que se registra en una **cadena de bloques** (blockchain).", "Sin banco central: su valor **sube y baja** muchísimo.", "Si pagas o te estafan, **no hay a quién reclamar**."]}]}}, {"n": 6, "fase": "Bloque 2 · Trámites y compras", "titulo": "Mi guía HTML de trámites y compras seguras", "reto": "Crear con Gemini Canvas una guía web interactiva y personalizada sobre e-Administración y comercio electrónico seguro, comprobando que todo lo que dice es correcto.", "actividades": [{"nombre": "Modelado: de prompt a web", "min": 8, "desc": "El docente muestra en pantalla cómo activar Canvas en Gemini y escribir un prompt RCTF para generar una página HTML: «Actúa como diseñador/a web. Para alumnado de 4.º ESO, crea una página HTML de un solo archivo con dos secciones: cómo identificarse ante la Administración (DNIe, certificado digital, Cl@ve) y cómo comprar en internet de forma segura (señales de alarma, formas de pago, factura). Usa botones desplegables y colores claros». Enseña a ver la vista previa, pedir cambios y descargar o compartir el resultado."}, {"nombre": "Creación de la guía", "min": 27, "desc": "Individual. Cada estudiante escribe su propio prompt RCTF (con la chuleta proyectada) usando lo trabajado en las sesiones 4 y 5, genera la página y la mejora con al menos dos peticiones de cambio: añadir un ejemplo propio (un trámite de su familia o una compra suya) y un desplegable con las 3 señales de alarma que apuntó en la sesión 5. Comprueba cada dato con la lista de verificación de la diapositiva y corrige lo que esté mal."}, {"nombre": "Revisión y entrega", "min": 12, "desc": "Cada estudiante repasa la lista de verificación, copia en un documento el prompt inicial y los cambios que pidió, y entrega en la Tarea 9.2 el archivo .html (o el enlace de Gemini compartido) y el documento con los prompts."}, {"nombre": "Cierre", "min": 3, "desc": "Pregunta de salida: ¿qué error de la IA has tenido que corregir en tu guía?"}], "criterios": ["DIG.4.4.2", "DIG.4.2.3"], "saberes": ["DIG.4.D.3", "DIG.4.D.4"], "metodologia": ["Instrucción explícita con modelado", "Aprendizaje basado en retos"], "evidencias": ["Guía HTML individual y documento con los prompts (Tarea 9.2)"], "recursos": ["Gemini Canvas (cuenta del centro)", "Moodle Centros", "Proyector"], "dua": {"principios": ["Acción y Expresión", "Andamiaje", "Compromiso"], "medidas": "Prompt base para completar con huecos para quien lo necesite; libertad de estilo visual (colores, emojis, tema); quien termine antes añade un mini test de 3 preguntas a su guía."}, "ejercicios": ["Escribe un prompt RCTF para generar una guía web sobre trámites con la Administración y compras seguras.", "Mejora la página con al menos dos cambios propios y comprueba que todos los datos son correctos.", "Entrega la guía HTML y los prompts que has usado."], "moodle": [{"recurso": "Tarea", "nombre": "9.2 · Mi guía HTML de trámites y compras seguras", "uso": "Evaluar con rúbrica lo aprendido en el bloque 2 (identificación digital, compras y pagos seguros, factura) y la capacidad de crear y reelaborar un contenido digital con IA generativa de forma crítica.", "correccion": "rubrica", "criterio": "DIG.4.4.2", "rubrica": [{"linea": "Identificación digital y trámites", "criterio": "DIG.4.4.2", "niveles": ["1 pto: No explica los sistemas de identificación o lo que dice es incorrecto.", "3 ptos: Nombra algún sistema (DNIe, certificado o Cl@ve) pero sin explicar para qué sirve o con errores.", "5 ptos: Explica los tres sistemas de forma básica, sin ejemplos de trámites.", "7 ptos: Explica los tres sistemas correctamente con al menos un trámite real.", "10 ptos: Explica los tres sistemas con trámites reales, cómo reconocer una web oficial y una regla de seguridad (no compartir el PIN o el código)."]}, {"linea": "Compras y pagos seguros", "criterio": "DIG.4.4.2", "niveles": ["1 pto: No aparecen consejos de compra segura o son incorrectos.", "3 ptos: Da uno o dos consejos generales («ten cuidado») sin concretar.", "5 ptos: Incluye señales de alarma o formas de pago, pero no ambas.", "7 ptos: Incluye al menos 3 señales de alarma y distingue pagos más seguros y pagos a evitar.", "10 ptos: Además explica el derecho de devolución de 14 días o cómo reclamar, con un ejemplo cercano."]}, {"linea": "Factura, criptomonedas y brecha", "criterio": "DIG.4.4.2", "niveles": ["1 pto: No trata la factura, las criptomonedas ni la brecha digital.", "3 ptos: Menciona uno de los tres temas sin explicarlo.", "5 ptos: Explica uno de los tres temas correctamente.", "7 ptos: Explica dos de los tres temas correctamente.", "10 ptos: Explica los tres: partes de una factura, riesgos de las criptomonedas y a quién deja fuera la digitalización de los trámites."]}, {"linea": "Prompt y personalización de la página", "criterio": "DIG.4.2.3", "niveles": ["1 pto: No entrega la página o es la primera respuesta de la IA sin prompt propio.", "3 ptos: Prompt sin estructura RCTF y ningún cambio propio.", "5 ptos: Prompt RCTF incompleto o un solo cambio propio.", "7 ptos: Prompt RCTF completo y dos cambios propios (ejemplo personal y desplegable de señales de alarma).", "10 ptos: Prompt RCTF completo, más de dos cambios que mejoran claramente la página y la página funciona sin errores al abrirla."]}, {"linea": "Verificación de lo que dice la IA", "criterio": "DIG.4.2.3", "niveles": ["1 pto: La página contiene errores graves (datos falsos o peligrosos) sin corregir.", "3 ptos: Hay varios errores sin corregir y no indica fuentes.", "5 ptos: Hay algún error menor y no indica de dónde salen los datos.", "7 ptos: No hay errores y menciona al menos una fuente oficial.", "10 ptos: No hay errores, enlaza fuentes oficiales y explica en el documento de prompts qué error de la IA corrigió."]}], "config": ["Tipo de entrega: archivo (.html y PDF de prompts) o texto en línea con el enlace de Gemini", "Método de calificación: Rúbrica (1-3-5-7-10 por línea)", "Entrega individual", "Rúbrica guardada como plantilla"], "criterios_rubrica": ["DIG.4.4.2", "DIG.4.2.3"], "calificable": true, "codigo": "9.2"}], "clase": {"pregunta": "¿Puede la IA hacerte una web… sin que tú dejes de ser quien manda?", "diapositivas": [{"tipo": "pasos", "titulo": "De prompt a web con Gemini Canvas", "progresivo": true, "pasos": ["Abre Gemini con tu cuenta del centro y elige **Canvas** en las herramientas.", "Escribe tu prompt **RCTF** pidiendo una página HTML de un solo archivo.", "Mira la **vista previa** y pide cambios con frases cortas («añade…», «cambia el color…»).", "Descarga el archivo **.html** o comparte el enlace.", "Copia tus prompts en un documento: también se entregan."], "nota": "Hazlo en directo con el prompt de ejemplo de la ficha."}, {"tipo": "codigo", "titulo": "Prompt base (complétalo)", "codigo": "Actúa como diseñador/a web.\nPara: alumnado de 4.º ESO que pronto hará trámites y compras.\nCrea una página HTML de un solo archivo con:\n1. Cómo identificarse ante la Administración (DNIe, certificado, Cl@ve)\n2. Cómo comprar en internet de forma segura\n   (señales de alarma, formas de pago, factura)\n3. Un ejemplo mío: ____________\nUsa botones desplegables, colores ______ y letra grande.", "explicacion": ["**Rol** y **contexto**: las dos primeras líneas.", "**Tarea**: las secciones numeradas.", "**Formato**: la última línea. Rellena los huecos con lo tuyo."]}, {"tipo": "practica", "titulo": "Crea tu guía", "tiempo": 27, "enunciado": "Genera tu guía con Gemini Canvas y haz **al menos 2 cambios propios**: un **ejemplo tuyo** (trámite o compra) y un **desplegable** con tus 3 señales de alarma de la sesión 5.", "pasos": ["Escribe tu prompt RCTF.", "Genera la página y revisa la vista previa.", "Pide los dos cambios.", "Comprueba cada dato con la lista de verificación."], "agrupamiento": "Individual", "ayudas": [{"tipo": "pista", "titulo": "Lista de verificación", "puntos": ["¿Las webs oficiales que salen terminan en .gob.es o juntadeandalucia.es?", "¿Dice que nunca se comparte el PIN o el código?", "¿El IVA general es el 21 %? ¿La devolución es de 14 días?", "¿Ningún consejo recomienda pagar por transferencia a una tienda desconocida?"]}, {"tipo": "saber_mas", "titulo": "Si terminas antes", "texto": "Pide a Gemini que añada un **mini test de 3 preguntas** con corrección al pulsar."}]}, {"tipo": "ejemplo", "icono": "🧑‍🍳", "titulo": "La IA es tu pinche, tú eres el chef", "situacion": "En una cocina, el pinche corta y prepara, pero **el chef prueba** cada plato antes de que salga.", "explicacion": "Gemini genera la página en segundos, pero puede equivocarse con un dato o un enlace. **Tú pruebas** cada sección y firmas el resultado.", "pregunta": "¿Qué error de la IA has tenido que corregir?"}, {"tipo": "practica", "titulo": "Revisa y entrega", "tiempo": 12, "enunciado": "Repasa la lista de verificación y entrega en Moodle: el archivo **.html** (o el enlace compartido de Gemini) y un documento con **tu prompt inicial y los cambios** que pediste.", "entrega": "Tarea 9.2 · Mi guía HTML de trámites y compras seguras", "agrupamiento": "Individual"}]}}, {"n": 7, "fase": "Bloque 3 · Síntesis HTML", "titulo": "NotebookLM: de muchas fuentes a ideas claras", "reto": "Usar NotebookLM para analizar varias fuentes fiables, extraer ideas clave con citas y planificar en pareja la web final.", "actividades": [{"nombre": "Presentación del producto final y parejas", "min": 7, "desc": "El docente recuerda el reto y enseña la rúbrica de la Tarea 9.3. Se forman las parejas (afinidad y equilibrio, decididas por el docente) y se explican los roles de piloto (teclado y prompts) y copiloto (verificación y lista de comprobación), que rotan cada 15 minutos."}, {"nombre": "Modelado con NotebookLM", "min": 8, "desc": "El docente crea en directo un cuaderno de NotebookLM, sube dos fuentes y muestra cómo preguntar con citas («¿Qué es un sesgo algorítmico según estas fuentes?»), cómo ver de qué fuente sale cada frase y cómo generar un resumen o mapa mental."}, {"nombre": "Análisis de fuentes en pareja", "min": 25, "desc": "Cada pareja crea su cuaderno en NotebookLM y sube 3-5 fuentes: las proporcionadas por el docente en Moodle (Carta de Derechos Digitales del Gobierno de España, guía de compras seguras de la Oficina de Seguridad del Internauta de INCIBE, un resumen oficial del Reglamento europeo de IA y la web de clase de esta SdA) y sus dos guías HTML de la Tarea 9.2. Hacen al menos 5 preguntas con citas y anotan en un Google Doc compartido 6-8 ideas clave, cada una con su fuente."}, {"nombre": "Plan de la web", "min": 10, "desc": "En el mismo documento, la pareja hace el esquema de su web: título, las 4 secciones obligatorias (Big Data e IA; sesgos y brecha; e-Administración; compras seguras), qué elemento interactivo tendrá cada una (desplegable, test, verdadero o falso, botón «¿bulo o verdad?») y colores. El docente revisa los planes en su recorrido por el aula."}], "criterios": ["DIG.4.2.3", "DIG.4.4.3"], "saberes": ["DIG.4.D.2", "DIG.4.D.5"], "metodologia": ["Trabajo en parejas con roles", "Instrucción explícita con modelado"], "evidencias": ["Cuaderno de NotebookLM con fuentes", "Google Doc con ideas clave citadas y plan de la web"], "recursos": ["NotebookLM (cuenta del centro)", "Fuentes en Moodle", "Google Docs"], "dua": {"principios": ["Representación", "Acción y Expresión", "Andamiaje"], "medidas": "NotebookLM permite escuchar un resumen en audio de las fuentes; preguntas modelo proyectadas para copiar; esquema de la web con huecos en la diapositiva."}, "ejercicios": ["Crea un cuaderno en NotebookLM con al menos tres fuentes fiables y hazle cinco preguntas con citas.", "Anota seis ideas clave con su fuente y haz el esquema de vuestra web final."], "clase": {"pregunta": "¿Cómo sacas lo importante de diez páginas sin leerlas al tuntún… ni creerte todo?", "diapositivas": [{"tipo": "ejemplo", "icono": "📚", "titulo": "El compañero que se lo ha leído todo", "situacion": "Antes de un examen, le preguntas a quien **se ha leído los apuntes** y te contesta señalando la página exacta.", "explicacion": "**NotebookLM** hace eso con **tus fuentes**: solo responde con lo que hay en los documentos que subes y te dice **de dónde sale** cada frase. Menos invención que un chatbot general, pero hay que comprobarlo igual.", "pregunta": "¿Por qué es mejor que te diga la página?"}, {"tipo": "comparar", "titulo": "Piloto y copiloto", "columnas": [{"icono": "🧑‍✈️", "titulo": "Piloto", "puntos": ["Lleva el teclado", "Escribe las preguntas y prompts", "Propone ideas"]}, {"icono": "🧭", "titulo": "Copiloto", "puntos": ["Comprueba cada idea en la cita", "Apunta en el Google Doc", "Vigila la lista de comprobación"]}], "texto": "Cambiáis de rol **cada 15 minutos**."}, {"tipo": "practica", "titulo": "Analizamos las fuentes", "tiempo": 25, "enunciado": "Cread vuestro cuaderno en **NotebookLM**, subid **3-5 fuentes** y haced **al menos 5 preguntas**. Anotad en un Google Doc compartido **6-8 ideas clave** con su fuente.", "pasos": ["notebooklm.google.com con la cuenta del centro → «Nuevo cuaderno».", "Subid las fuentes de Moodle y vuestras dos guías de la Tarea 9.2.", "Preguntad: «¿Qué es la brecha digital según estas fuentes?», «¿Qué derechos digitales tengo?», «¿Qué riesgos tiene la IA según el Reglamento europeo?»…", "Pulsad en las citas para comprobar cada respuesta."], "agrupamiento": "Parejas", "ayudas": [{"tipo": "pista", "titulo": "Más preguntas modelo", "puntos": ["«Resume en 5 puntos lo más importante para un/a joven».", "«¿Qué señales de alarma de una tienda falsa aparecen?».", "«¿En qué no están de acuerdo las fuentes?»."]}]}, {"tipo": "practica", "titulo": "Plan de la web", "tiempo": 10, "enunciado": "En el mismo Google Doc, haced el **esquema** de vuestra web: título, las **4 secciones** y el **elemento interactivo** de cada una.", "pasos": ["Big Data e IA → p. ej. desplegables con las 5 V.", "Sesgos y brecha → p. ej. «¿verdadero o bulo?».", "e-Administración → p. ej. botones con las tres llaves digitales.", "Compras seguras → p. ej. test de 5 preguntas."], "agrupamiento": "Parejas"}]}}, {"n": 8, "fase": "Bloque 3 · Síntesis HTML", "titulo": "Creamos la web interactiva con Gemini Canvas", "reto": "Generar y personalizar en pareja la web HTML interactiva a partir de las ideas clave de NotebookLM, cuidando la accesibilidad y la veracidad.", "actividades": [{"nombre": "Requisitos y accesibilidad", "min": 7, "desc": "El docente proyecta la lista de requisitos de la web (4 secciones, un elemento interactivo por sección, un test de 5 preguntas, fuentes al pie y sección «Cómo hemos usado la IA») y tres reglas de accesibilidad: buen contraste, letra grande y texto alternativo en las imágenes. Recuerda que una web también gasta energía y que cada petición a la IA consume recursos en centros de datos: mejor pocos prompts bien pensados."}, {"nombre": "Generación en Gemini Canvas", "min": 20, "desc": "En pareja, con roles: el piloto escribe un prompt RCTF largo que incluye las ideas clave del Google Doc (copiadas de NotebookLM) y el plan de la web; Gemini Canvas genera el archivo. El copiloto comprueba sección por sección con la lista de requisitos."}, {"nombre": "Personalización y corrección", "min": 18, "desc": "Cambio de roles. La pareja pide mejoras concretas (colores del tema elegido, ejemplos de TikTok o Instagram, un botón «¿bulo o verdad?»), corrige los datos erróneos comparando con las citas de NotebookLM y revisa la accesibilidad. Descargan una versión provisional del .html."}, {"nombre": "Cierre", "min": 5, "desc": "Cada pareja escribe en su Google Doc qué ha hecho la IA, qué han hecho ellos y qué errores han corregido: será la base de la sección ética de la próxima sesión."}], "criterios": ["DIG.4.2.3", "DIG.4.4.4"], "saberes": ["DIG.4.D.3", "DIG.4.D.4", "DIG.4.D.5"], "metodologia": ["Trabajo en parejas con roles", "Aprendizaje basado en retos"], "evidencias": ["Versión provisional del .html", "Registro de uso de la IA en el Google Doc"], "recursos": ["Gemini Canvas (cuenta del centro)", "Google Docs", "Proyector"], "dua": {"principios": ["Acción y Expresión", "Compromiso", "Andamiaje"], "medidas": "Lista de requisitos con casillas; roles que rotan para que ambas personas escriban y verifiquen; si una pareja se bloquea, el docente le da un prompt de arranque con su plan ya incorporado."}, "ejercicios": ["Genera con Gemini Canvas la web interactiva a partir de vuestras ideas clave y vuestro plan.", "Personaliza la web y comprueba que es accesible y que todos los datos coinciden con las fuentes."], "clase": {"pregunta": "¿Qué hace que una web sea útil para todo el mundo y no solo bonita?", "diapositivas": [{"tipo": "infografia", "titulo": "Requisitos de vuestra web", "elementos": [{"icono": "🧠", "titulo": "4 secciones", "texto": "Big Data e IA · Sesgos y brecha · e-Administración · Compras seguras."}, {"icono": "🖱️", "titulo": "Interactiva", "texto": "Un elemento por sección y un test final de 5 preguntas."}, {"icono": "📎", "titulo": "Fuentes", "texto": "Al pie, las fuentes que usasteis en NotebookLM."}, {"icono": "🤖", "titulo": "Cómo usamos la IA", "texto": "Sección final: qué hizo la IA, qué hicimos nosotros."}]}, {"tipo": "ejemplo", "icono": "👓", "titulo": "Una web para tu abuelo también", "situacion": "Tu abuelo abre una web con letra gris clarita sobre fondo blanco y **no ve nada**.", "explicacion": "La **accesibilidad** hace que todo el mundo pueda usar una web: **buen contraste**, **letra grande**, **texto alternativo** en las imágenes y botones claros. Es también parte de reducir la brecha digital.", "pregunta": "¿Qué cambiarías en tu web para que la use alguien con poca vista?"}, {"tipo": "practica", "titulo": "Generamos la web", "tiempo": 20, "enunciado": "**Piloto**: escribe un prompt RCTF largo con vuestras **ideas clave** y vuestro **plan**. **Copiloto**: revisa la web sección por sección con los requisitos.", "pasos": ["Pega las ideas clave del Google Doc en el prompt.", "Pide «una página HTML de un solo archivo, interactiva, con…».", "Revisa la vista previa con la infografía de requisitos."], "agrupamiento": "Parejas", "ayudas": [{"tipo": "pista", "titulo": "Arranque del prompt", "texto": "«Actúa como diseñador/a web educativo/a. Para jóvenes de 16 años, crea una página HTML interactiva de un solo archivo con estas 4 secciones y estas ideas clave (no añadas datos que no estén aquí): … Incluye un test final de 5 preguntas con corrección al pulsar, fuentes al pie y buen contraste.»"}]}, {"tipo": "practica", "titulo": "Personalizamos y corregimos", "tiempo": 18, "enunciado": "**Cambiad de rol.** Pedid mejoras concretas, corregid los datos que no coincidan con NotebookLM y revisad la accesibilidad. Descargad una **versión provisional** del .html.", "pasos": ["Ejemplos de TikTok o Instagram en cada sección.", "Un botón «¿bulo o verdad?».", "Contraste y tamaño de letra.", "Cada dato comprobado con su cita."], "agrupamiento": "Parejas"}, {"tipo": "dato", "valor": "💧⚡", "texto": "Cada petición a una IA generativa se procesa en **centros de datos** que consumen electricidad y agua para refrigerarse. Usarla con prompts bien pensados también es digitalización **sostenible**.", "pregunta": "¿Cuántos prompts habéis necesitado? ¿Podríais haberlo hecho con menos?"}]}}, {"n": 9, "fase": "Bloque 3 · Síntesis HTML", "titulo": "Prueba cruzada, ética del proceso y entrega final", "reto": "Mejorar la web con la opinión de otra pareja, escribir la sección «Cómo hemos usado la IA» y entregar el producto final.", "actividades": [{"nombre": "Prueba cruzada entre parejas", "min": 12, "desc": "Cada pareja abre la web provisional de otra pareja (rotación indicada por el docente), hace su test y la revisa con 4 preguntas proyectadas: ¿se entiende?, ¿funcionan los botones?, ¿hay algún dato dudoso?, ¿se lee bien? Deja dos comentarios por escrito (uno positivo y una mejora)."}, {"nombre": "Mejoras finales", "min": 10, "desc": "Cada pareja aplica las mejoras recibidas en Gemini Canvas y vuelve a comprobar los datos cambiados."}, {"nombre": "Sección «Cómo hemos usado la IA»", "min": 15, "desc": "Con el registro del Google Doc, cada pareja escribe y añade a su web una sección breve con: herramientas usadas (NotebookLM y Gemini Canvas), qué hizo la IA y qué hicieron ellos, errores o sesgos detectados y cómo los corrigieron, y una reflexión sobre consumo de recursos y accesibilidad. Entregan el .html final en la Tarea 9.3 (un miembro por pareja)."}, {"nombre": "Autoevaluación F2 y cierre", "min": 13, "desc": "Cada estudiante responde el formulario F2 de autoevaluación (con su correo del centro) y la clase responde a la pregunta guía de la SdA. El docente proyecta dos o tres webs con permiso de sus autores."}], "criterios": ["DIG.4.2.3", "DIG.4.4.3", "DIG.4.4.4"], "saberes": ["DIG.4.D.5"], "metodologia": ["Trabajo en parejas con roles", "Evaluación formativa"], "evidencias": ["Web HTML final con la sección ética (Tarea 9.3)", "Comentarios de la prueba cruzada", "Autoevaluación F2"], "recursos": ["Gemini Canvas (cuenta del centro)", "Moodle Centros", "Formulario F2"], "dua": {"principios": ["Compromiso", "Acción y Expresión", "Andamiaje"], "medidas": "Frases de inicio para la sección ética; la prueba cruzada usa siempre las mismas 4 preguntas; la autoevaluación tiene opciones cerradas y una sola pregunta abierta opcional."}, "ejercicios": ["Revisa la web de otra pareja y deja un comentario positivo y una propuesta de mejora.", "Escribe la sección «Cómo hemos usado la IA» con lo que hizo la IA, lo que hicisteis vosotros y los errores o sesgos que corregisteis.", "Entrega la web final y completa tu autoevaluación."], "moodle": [{"recurso": "Tarea", "nombre": "9.3 · Producto final: web «Ciudadanía digital 360»", "uso": "Evaluar con rúbrica el producto final de la SdA: la web HTML interactiva creada en pareja con NotebookLM y Gemini Canvas y su sección ética sobre el uso de la IA.", "correccion": "rubrica", "criterio": "DIG.4.2.3", "rubrica": [{"linea": "Big Data, IA y sesgos con mirada crítica", "criterio": "DIG.4.4.3", "niveles": ["1 pto: No hay sección sobre IA o lo que dice es incorrecto.", "3 ptos: Define Big Data o IA con frases copiadas, sin mencionar sesgos.", "5 ptos: Explica Big Data e IA con sus palabras y nombra los sesgos sin ejemplos.", "7 ptos: Explica Big Data, IA y al menos un sesgo con un ejemplo, y advierte de que la IA puede inventar datos.", "10 ptos: Además distingue sesgo de estereotipo y de encuadre (ideológico) con ejemplos de sus pruebas y propone cómo detectarlos."]}, {"linea": "Sección «Cómo hemos usado la IA»", "criterio": "DIG.4.4.4", "niveles": ["1 pto: No hay sección sobre el uso de la IA.", "3 ptos: Solo nombra las herramientas usadas.", "5 ptos: Explica qué hizo la IA y qué hicieron ellos, sin errores corregidos.", "7 ptos: Explica el reparto de trabajo y al menos un error o sesgo corregido.", "10 ptos: Además reflexiona sobre el consumo de recursos de la IA o la soberanía de los datos y propone un uso más responsable."]}, {"linea": "Accesibilidad y brecha digital", "criterio": "DIG.4.4.4", "niveles": ["1 pto: La web es difícil de leer y no menciona la brecha digital.", "3 ptos: Tiene problemas claros de contraste o tamaño y menciona la brecha de pasada.", "5 ptos: Se lee bien, pero no trata la brecha o la trata sin ejemplos.", "7 ptos: Buen contraste y letra legible, y explica la brecha digital con un colectivo afectado.", "10 ptos: Cumple las tres reglas de accesibilidad (contraste, letra, texto alternativo) y propone medidas para reducir la brecha."]}, {"linea": "Web interactiva y personalizada", "criterio": "DIG.4.2.3", "niveles": ["1 pto: No entrega la web o no se abre.", "3 ptos: Se abre, pero falta más de una sección o no tiene elementos interactivos.", "5 ptos: Tiene las 4 secciones y algún elemento interactivo; es casi igual que la primera respuesta de la IA.", "7 ptos: Tiene las 4 secciones, un elemento interactivo por sección y el test funciona.", "10 ptos: Además está claramente personalizada (ejemplos propios, diseño elegido) y aplica las mejoras de la prueba cruzada."]}, {"linea": "Trabajo con fuentes en NotebookLM", "criterio": "DIG.4.2.3", "niveles": ["1 pto: No usa fuentes ni NotebookLM.", "3 ptos: Usa una sola fuente o no las cita en la web.", "5 ptos: Usa 3 fuentes, pero hay datos en la web que no coinciden con ellas.", "7 ptos: Usa 3-5 fuentes fiables, las cita al pie y los datos coinciden.", "10 ptos: Además las ideas clave del Google Doc tienen su cita y la web reelabora las fuentes con sus palabras, sin copiar."]}], "config": ["Entrega por grupos: Sí (agrupamiento «SdA9 · Parejas»)", "Tipo de entrega: archivo .html", "Método de calificación: Rúbrica (1-3-5-7-10 por línea)", "Rúbrica guardada como plantilla"], "criterios_rubrica": ["DIG.4.4.3", "DIG.4.4.4", "DIG.4.2.3"], "calificable": true, "codigo": "9.3"}], "clase": {"pregunta": "¿Cómo podemos usar la IA para crear algo útil sin creernos todo lo que nos dice?", "diapositivas": [{"tipo": "practica", "titulo": "Prueba cruzada", "tiempo": 12, "enunciado": "Abrid la web de la pareja que os toque, haced su test y dejad **2 comentarios** por escrito: uno **positivo** y una **mejora**.", "pasos": ["¿Se entiende?", "¿Funcionan los botones y el test?", "¿Hay algún dato dudoso?", "¿Se lee bien (contraste, tamaño)?"], "agrupamiento": "Parejas"}, {"tipo": "practica", "titulo": "Mejoras finales", "tiempo": 10, "enunciado": "Aplicad en Gemini Canvas las mejoras recibidas y **volved a comprobar** los datos que cambien.", "agrupamiento": "Parejas"}, {"tipo": "ejemplo", "icono": "🏷️", "titulo": "La etiqueta de los alimentos", "situacion": "En el súper, la etiqueta te dice **qué lleva** cada producto para que decidas si lo compras.", "explicacion": "Vuestra sección **«Cómo hemos usado la IA»** es la etiqueta de la web: qué hizo la IA, qué hicisteis vosotros y qué errores corregisteis. Es **honestidad** con quien la lee.", "pregunta": "¿Os fiaríais más de una web que lo explica?"}, {"tipo": "practica", "titulo": "Cómo hemos usado la IA y entrega", "tiempo": 15, "enunciado": "Añadid a vuestra web la sección **«Cómo hemos usado la IA»** y entregad el **.html final** en Moodle (lo sube un miembro de la pareja).", "pasos": ["Herramientas: NotebookLM y Gemini Canvas.", "La IA hizo… / Nosotros hicimos…", "Errores o sesgos que corregimos: …", "Consumo de recursos y accesibilidad: …"], "entrega": "Tarea 9.3 · Producto final: web «Ciudadanía digital 360»", "agrupamiento": "Parejas", "ayudas": [{"tipo": "repaso", "titulo": "Antes de entregar", "puntos": ["4 secciones con un elemento interactivo cada una.", "Test de 5 preguntas que funciona.", "Fuentes al pie.", "Sección «Cómo hemos usado la IA».", "Buen contraste y letra grande."]}]}, {"tipo": "practica", "titulo": "Autoevaluación", "tiempo": 8, "enunciado": "Responde el formulario **F2** con tu correo del centro: ¿qué has aprendido y cómo ha funcionado tu pareja?", "agrupamiento": "Individual"}, {"tipo": "cierre", "titulo": "Lo que nos llevamos", "puntos": ["La IA **predice**, no sabe: **yo compruebo**.", "Los datos y la IA tienen **sesgos** y dejan a gente **fuera**.", "Trámites con * aciones y sesgos", "sesiones": [2, 3], "agrupamiento": "Individual", "herramienta": "Google Docs (una copia por estudiante)", "entrega": "la Tarea 9.1 (PDF o enlace)", "docente": "Se rellena en las sesiones 2 (parte 1) y 3 (partes 2 y 3) con Gemini y la cuenta del centro. Es Apto si están las tres partes completas, aunque los resultados sean breves.", "instrucciones": "Usa **Gemini** con tu cuenta del centro. Copia tus prompts tal cual y escribe con tus palabras lo que observas. Regla de oro: **la IA propone, yo compruebo**.", "bloques": [{"titulo": "Parte 1 · Taller de prompts (sesión 2)", "texto": "Mismo encargo, dos prompts. Fórmula RCTF: **R**ol · **C**ontexto · **T**area · **F**ormato.", "tabla": {"columnas": ["", "Prompt que escribí", "¿Cómo fue la respuesta?"], "filas": [["Prompt pobre"], ["Prompt RCTF"]], "anchos": [3, 8, 6], "alto": 2.2}}, {"campos": ["¿Qué mejoró con el prompt RCTF?"], "alto": 1.6}, {"titulo": "Caza la alucinación (sesión 2)", "tabla": {"columnas": ["Pregunta a la IA", "Respuesta de la IA", "Fuente oficial que consulté", "✅ / ⚠️ / ❌"], "filas": [["1. Habitantes de mi municipio"], ["2. Autor y año de «Platero y yo»"], ["3. Fecha de aprobación de la Constitución"]], "anchos": [5, 5, 5, 2], "alto": 1.5}}, {"titulo": "Parte 2 · Laboratorio de sesgos (sesión 3)", "tabla": {"columnas": ["Prueba", "Lo que pedí", "Lo que observé"], "filas": [["Estereotipo", "5 nombres de personajes: enfermero/a, piloto, limpiador/a"], ["Encuadre 1", "¿Es bueno que los jóvenes usen redes sociales?"], ["Encuadre 2", "¿Por qué las redes sociales son peligrosas para los jóvenes?"]], "anchos": [3, 7, 7], "alto": 1.8}}, {"titulo": "Parte 3 · Conclusiones (sesión 3)", "campos": ["Un sesgo que he detectado en la IA", "Un colectivo que se queda fuera de la digitalización y por qué", "Una medida para reducir esa brecha"], "alto": 1.5}, {"titulo": "Antes de entregar", "casillas": ["He escrito un prompt pobre y uno RCTF y lo que mejoró.", "He comprobado 3 datos con su fuente
