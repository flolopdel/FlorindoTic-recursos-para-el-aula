<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 4: Arquitectura, Sistemas Operativos y Elección Consciente", "numero": 4, "subtitulo": "«Compra con cabeza»: recomendamos un ordenador, un smartphone o un smartwatch que dure", "curso_texto": "4.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Entregas individuales; parejas de apoyo (máximo 2) para investigar y revisar", "temporalizacion": "Segundo trimestre (orientativo: 3 semanas, 9 sesiones de 50 minutos)", "carpeta_drive": "1Fj3ObPKP6KwIT2Xels6gqUhapCfb0wV4"}, "materias": [{"codigo": "DIG", "criterios": ["DIG.4.1.2", "DIG.4.1.3", "DIG.4.4.4"], "saberes": ["DIG.4.A.1", "DIG.4.A.2", "DIG.4.D.5"]}], "vision": {"descripcion": "El alumnado abre un ordenador, aprende a leer una ficha técnica, descubre qué hace el sistema operativo y pone a punto un equipo lento. Con eso, y con lo que aprende sobre obsolescencia programada y ciclo de vida, elabora un estudio de mercado: compara tres dispositivos para un cliente con un presupuesto cerrado y le recomienda uno de forma razonada.", "contexto": "Grupo adaptado de 4.º ESO (22 estudiantes), con mayoría de alumnado repetidor o con dificultades de aprendizaje y muy activo en TikTok e Instagram. Aula de informática con un ordenador por estudiante, Google Workspace del centro, Genially y Canva para Educación. Las tareas son cortas, con plantilla y modelo resuelto, y casi todas se entregan de forma individual.", "justificacion": "Cambiamos de móvil cada dos o tres años y muchas veces por motivos que se podrían haber evitado: una batería gastada, el almacenamiento lleno o un sistema operativo sin actualizar. Para evitar la obsolescencia programada y tomar decisiones de compra sostenibles, el alumnado debe comprender la arquitectura interna de los equipos digitales, la función del software de sistema y la gestión de los recursos de hardware. Es un saber útil fuera del aula: cada estudiante sale sabiendo qué mirar antes de comprar y cómo alargar la vida de lo que ya tiene.", "reto": "«Somos el equipo de “Compra con cabeza”, la sección de consejos tecnológicos del instituto. Familias y compañeros nos piden que les digamos qué ordenador, smartphone o smartwatch comprar con su presupuesto, sin tirar el dinero ni el planeta. Vamos a hacerles un estudio de mercado serio y una recomendación que se pueda defender.»", "pregunta_guia": "¿Cómo elegimos un dispositivo que haga lo que necesitamos, quepa en el presupuesto y dure el máximo tiempo posible?", "producto_final": "Informe comparativo y estudio de mercado en formato digital (Google Docs, con resumen visual opcional en Canva o Genially) con la recomendación fundamentada de un ordenador, smartphone o smartwatch para un cliente con un presupuesto acotado y unas especificaciones técnicas concretas, que analiza además el ciclo de vida del producto."}, "metodologias": [{"nombre": "Aprendizaje basado en retos", "descripcion": "Todo gira en torno a un encargo real: recomendar un dispositivo a un cliente con un presupuesto. Cada sesión aporta una pieza del informe."}, {"nombre": "Aprendizaje manipulativo y por descubrimiento", "descripcion": "Se abren ordenadores viejos, se mide el consumo de RAM y CPU con el administrador de tareas y se configura el sistema operativo en el equipo propio."}, {"nombre": "Estudio de casos", "descripcion": "Casos cortos y cercanos (el portátil lento de Álex, el móvil que se queda sin actualizaciones) para diagnosticar y decidir."}, {"nombre": "Modelado y andamiaje", "descripcion": "Antes de cada entrega se proyecta un ejemplo resuelto; las plantillas traen comienzos de frase y listas de comprobación."}, {"nombre": "Trabajo en parejas de apoyo", "descripcion": "Se investiga y se revisa en pareja, pero cada estudiante entrega su propio trabajo."}], "recursos": ["Aula de informática", "Ordenadores viejos para desmontar", "Administrador de tareas / Monitor del sistema", "Google Docs y Google Forms del centro", "Canva para Educación y Genially", "Webs de fabricantes y tiendas", "Moodle Centros", "Web de clase de la SdA"], "fases": [{"nombre": "Bloque 1 · Fundamentos físicos y lógicos", "sesiones": "1-3", "finalidad": "Gancho y diagnóstico (sesión 1); arquitectura Von Neumann con la analogía del cuerpo humano y lectura de fichas técnicas"}, {"nombre": "Bloque 2 · Sistemas operativos", "sesiones": "4-5", "finalidad": "Funciones del sistema operativo, instalación conceptual, comparación de SO de escritorio y móviles, configuración de usuarios y gestión del almacenamiento"}, {"nombre": "Bloque 3 · Estudio de mercado y sostenibilidad", "sesiones": "6-9", "finalidad": "Reto financiero: elegir componentes (procesador, RAM, GPU, batería) para un presupuesto fijo, con criterios de reparabilidad y sostenibilidad; difusión y cierre"}], "sesiones": [{"n": 1, "fase": "Bloque 1 · Fundamentos físicos y lógicos", "titulo": "¿Por qué mi móvil «muere» a los dos años?", "reto": "Contar cómo usamos y cambiamos nuestros dispositivos y conocer el encargo de «Compra con cabeza».", "actividades": [{"nombre": "¿Móvil nuevo o batería nueva?", "min": 10, "desc": "El docente proyecta dos opciones para un móvil de dos años que ya no aguanta el día: comprar uno nuevo por 249 € o cambiar la batería por unos 60 €. Votación a mano alzada y tres o cuatro «storytimes» del alumnado: «mi móvil se murió cuando…». Se apuntan en la pizarra las causas que salen (batería, caída, memoria llena, ya no se actualiza, quería uno mejor)."}, {"nombre": "Encuesta: mis dispositivos", "min": 10, "desc": "Cada estudiante responde la encuesta anónima F1 desde su ordenador: cuántos dispositivos tiene, cuántos años tiene su móvil, por qué cambió el último y qué mira al comprar."}, {"nombre": "Resultados en directo", "min": 8, "desc": "El docente proyecta el resumen de respuestas de Google Forms y lo comenta con el grupo: ¿cuántos cambiaron el móvil sin que estuviera roto? Se cierra con el dato del Global E-waste Monitor 2024: en 2022 se generaron 62 millones de toneladas de residuos electrónicos y solo se documentó la recogida y reciclaje del 22,3 %."}, {"nombre": "Presentación del reto", "min": 12, "desc": "El docente presenta el encargo de «Compra con cabeza», enseña un informe modelo ya terminado (de un cliente ficticio que no se usará), las tres Tareas de Moodle (4.1, 4.2 y 4.3), las rúbricas y el calendario. Se forman parejas de apoyo (máximo 2) para investigar; cada persona entrega lo suyo."}, {"nombre": "Lo que sé y lo que quiero saber", "min": 10, "desc": "En el cuaderno, cada estudiante escribe tres palabras técnicas que ya conoce (p. ej. RAM, gigas, Android) y una duda que le gustaría resolver antes de comprar su próximo dispositivo. Se recogen algunas dudas en voz alta y se guardan para la sesión 9."}], "criterios": [], "saberes": ["DIG.4.D.5"], "metodologia": ["Aprendizaje basado en retos", "Rutina de pensamiento"], "evidencias": ["Encuesta F1 (diagnóstica)", "Lo que sé y lo que quiero saber (cuaderno)"], "recursos": ["Proyector", "Google Forms"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Arranque desde sus propias experiencias; encuesta con opciones cerradas y pocas preguntas abiertas; informe modelo para ver desde el principio cómo es el producto final."}, "ejercicios": ["Responde la encuesta anónima sobre tus dispositivos.", "Escribe tres palabras técnicas que conozcas y una duda que te gustaría resolver antes de comprar un dispositivo."], "clase": {"pregunta": "¿Por qué cambiamos de móvil cuando todavía funciona?", "diapositivas": [{"tipo": "ejemplo", "icono": "📱", "titulo": "¿Móvil nuevo o batería nueva?", "situacion": "Tu móvil tiene **2 años** y ya no aguanta el día. Opción A: uno nuevo por **249 €**. Opción B: cambiar la batería por unos **60 €**.", "explicacion": "Muchas veces no falla el móvil entero: falla **una pieza** (la batería) o el **software** (memoria llena, sin actualizaciones). Saber qué hay dentro te ahorra dinero.", "pregunta": "¿Qué harías tú? ¿Y por qué?", "nota": "Votación a mano alzada. Pide 3-4 «storytimes» y apunta las causas en la pizarra: batería, caída, memoria llena, sin actualizaciones, capricho."}, {"tipo": "practica", "titulo": "Encuesta F1: mis dispositivos", "tiempo": 10, "agrupamiento": "Individual", "enunciado": "Responde la **encuesta anónima F1**. No hay respuestas buenas ni malas: queremos saber cómo usamos la tecnología en esta clase.", "pasos": ["Abre la encuesta con el botón.", "Contesta con sinceridad: es anónima.", "Pulsa «Enviar» y espera a ver los resultados."], "enlace": "https://forms.gle/XncaqS4XMdakZ28y7"}, {"tipo": "dato", "valor": "62 millones de toneladas", "texto": "de residuos electrónicos en el mundo en 2022. Solo el **22,3 %** se recogió y recicló de forma documentada.", "fuente": "Global E-waste Monitor 2024 (UNITAR / UIT)", "pregunta": "¿Dónde acabó tu último móvil?", "nota": "Antes, proyecta el resumen de respuestas de F1 y comenta: ¿cuántos cambiaron el móvil sin que estuviera roto?"}, {"tipo": "idea", "icono": "🛒", "titulo": "El reto: «Compra con cabeza»", "texto": "Somos la sección de consejos tecnológicos del instituto. Un cliente nos da su **presupuesto** y lo que necesita, y le recomendamos **un dispositivo que dure**.", "puntos": ["Tarea 4.1 · Radiografía del ordenador del aula (sesión 3)", "Tarea 4.2 · Diagnóstico y puesta a punto (sesión 5)", "Tarea 4.3 · Estudio de mercado y recomendación (sesión 8)", "Trabajáis en pareja, **entregáis cada uno lo vuestro**"], "nota": "Enseña el informe modelo de un cliente ficticio. Recuerda que las rúbricas están en Moodle desde hoy."}, {"tipo": "practica", "titulo": "Lo que sé y lo que quiero saber", "tiempo": 10, "agrupamiento": "Individual", "enunciado": "En tu cuaderno escribe **3 palabras técnicas** que ya conozcas y **1 duda** que te gustaría resolver antes de comprar tu próximo dispositivo.", "pasos": ["Ejemplos de palabras: RAM, gigas, Android, batería, procesador…", "Ejemplo de duda: «¿Merece la pena un móvil reacondicionado?»", "Guarda la página: la usaremos en la última sesión."]}]}}, {"n": 2, "fase": "Bloque 1 · Fundamentos físicos y lógicos", "titulo": "Arquitectura Von Neumann: el ordenador es como un cuerpo", "reto": "Identificar las piezas principales de un ordenador, saber qué hace cada una y encontrarlas en un móvil y un smartwatch.", "actividades": [{"nombre": "Unboxing al revés", "min": 8, "desc": "El docente abre delante del grupo un ordenador viejo (desenchufado) y pregunta qué creen que es cada pieza. Normas de seguridad: siempre desenchufado, no abrir la fuente de alimentación, tocar una parte metálica antes de coger piezas y sujetar las tarjetas por los bordes."}, {"nombre": "El cuerpo del ordenador", "min": 10, "desc": "El docente explica la arquitectura Von Neumann (entrada → CPU ↔ memoria → salida, con los datos y los programas en la misma memoria) con la analogía del cuerpo humano: la CPU es el cerebro, la RAM es la memoria a corto plazo (rápida, pero se olvida al apagar), el disco (SSD o HDD) es la memoria a largo plazo, los periféricos son los sentidos (entrada: teclado, cámara, micrófono, sensores; salida: pantalla, altavoz), la placa base es el sistema nervioso que lo conecta todo y la fuente o la batería es la energía que da la comida."}, {"nombre": "Estaciones de componentes", "min": 17, "desc": "Por parejas, el alumnado rota por cuatro mesas con piezas reales: 1) módulos de RAM, 2) un disco HDD y un SSD, 3) procesador con disipador y ventilador, y una tarjeta gráfica (GPU) si hay, 4) placa base y fuente. En cada mesa escribe en el cuaderno: nombre de la pieza, a qué parte del cuerpo se parece, para qué sirve y si el móvil tiene algo parecido. Si no hay piezas suficientes, una mesa usa fotos ampliadas."}, {"nombre": "Ordenador, móvil y reloj", "min": 8, "desc": "Comparación guiada: en el móvil y en el smartwatch casi todo va en un solo chip (SoC: CPU, gráfica y módem juntos), la RAM y el almacenamiento van soldados y la batería suele ir pegada. Conclusión: un sobremesa se puede ampliar y reparar por piezas; un móvil o un reloj, mucho menos."}, {"nombre": "Comprobación rápida", "min": 7, "desc": "Quiz de cuatro preguntas en la web de clase; el alumnado responde levantando la mano o con tarjetas A, B y C, y se corrige al momento."}], "criterios": ["DIG.4.1.3"], "saberes": ["DIG.4.A.1"], "metodologia": ["Aprendizaje manipulativo", "Trabajo en parejas"], "evidencias": ["Tabla pieza-función-equivalente en el móvil (cuaderno)", "Respuestas al quiz"], "recursos": ["Ordenadores viejos", "Piezas sueltas", "Proyector"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Analogía del cuerpo humano con iconos; piezas reales para tocar; la tabla del cuaderno puede completarse con dibujos o fotos (sin personas)."}, "ejercicios": ["Relaciona la CPU, la RAM, el disco y los periféricos con el cerebro, la memoria a corto plazo, la memoria a largo plazo y los sentidos, y explica para qué sirve cada pieza.", "Indica qué piezas del ordenador están dentro del SoC de un móvil.", "Explica por qué es más fácil reparar un sobremesa que un smartwatch."], "clase": {"pregunta": "Si tu ordenador fuera un cuerpo, ¿qué pieza sería el cerebro?", "diapositivas": [{"tipo": "pasos", "titulo": "Antes de tocar nada: seguridad", "pasos": ["El equipo, **siempre desenchufado**.", "La fuente de alimentación **no se abre**.", "Toca una parte metálica antes de coger piezas (electricidad estática).", "Coge las tarjetas **por los bordes**."], "progresivo": true, "nota": "Abre el ordenador viejo delante del grupo y pregunta qué creen que es cada pieza antes de nombrarla."}, {"tipo": "infografia", "titulo": "El cuerpo del ordenador (arquitectura Von Neumann)", "elementos": [{"icono": "🧠", "titulo": "CPU = cerebro", "texto": "Piensa y calcula. Más núcleos = más tareas a la vez."}, {"icono": "💭", "titulo": "RAM = memoria a corto plazo", "texto": "Lo que usas ahora. Rápida, pero se borra al apagar."}, {"icono": "📚", "titulo": "Disco SSD/HDD = memoria a largo plazo", "texto": "Fotos, apps y sistema. No se borra."}, {"icono": "👀", "titulo": "Periféricos = sentidos", "texto": "Entrada: teclado, cámara, micro. Salida: pantalla, altavoz."}, {"icono": "🕸️", "titulo": "Placa base = sistema nervioso", "texto": "Conecta todas las piezas."}, {"icono": "🔋", "titulo": "Fuente / batería = energía", "texto": "Como la comida para el cuerpo."}], "nota": "Von Neumann: los datos y los programas viven en la misma memoria y la CPU los va leyendo. Pregunta: ¿qué pasa cuando estudias para un examen? (del corto al largo plazo = guardar el archivo)."}, {"tipo": "practica", "titulo": "Estaciones de componentes", "tiempo": 17, "agrupamiento": "Parejas", "enunciado": "Pasad por las **4 mesas** (unos 4 minutos en cada una). En el cuaderno, para cada pieza: **nombre · para qué sirve · ¿la tiene el móvil?**", "pasos": ["Mesa 1: módulos de RAM.", "Mesa 2: disco HDD y SSD (¿qué diferencias ves?).", "Mesa 3: procesador, disipador y ventilador.", "Mesa 4: placa base y fuente."], "material": ["Piezas reales o fotos ampliadas", "Cuaderno"]}, {"tipo": "comparar", "titulo": "Ordenador, móvil y reloj", "columnas": [{"titulo": "Sobremesa", "icono": "🖥️", "puntos": ["Piezas separadas, también la **GPU**", "Se amplía la RAM y el disco", "Se repara por piezas"]}, {"titulo": "Móvil", "icono": "📱", "puntos": ["Casi todo en **un chip (SoC)**", "RAM y memoria soldadas", "Batería normalmente pegada"]}, {"titulo": "Smartwatch", "icono": "⌚", "puntos": ["SoC diminuto", "Nada ampliable", "Reparar es muy difícil"]}], "pregunta": "¿Cuál de los tres durará más años si lo cuidas? ¿Por qué?"}, {"tipo": "quiz", "pregunta": "Abres 20 pestañas y el ordenador va lento aunque el disco está casi vacío. ¿Qué pieza se ha quedado corta?", "opciones": ["El almacenamiento (SSD)", "La RAM", "La fuente de alimentación"], "correcta": 1, "explicacion": "Lo que tienes abierto ahora vive en la **RAM** (la memoria a corto plazo). Si se llena, el ordenador va lento aunque el disco (la memoria a largo plazo) esté vacío."}, {"tipo": "ejemplo", "icono": "📵", "titulo": "«Almacenamiento lleno»", "situacion": "Tu móvil de **64 GB** está lleno de fotos y vídeos y no tiene ranura para tarjeta. En un sobremesa pondrías otro disco; en el móvil, **no puedes**.", "explicacion": "La memoria del móvil va **soldada** junto al **SoC** (*System on a Chip*: CPU, gráfica y más en un solo chip). Por eso, al comprar, hay que acertar con la capacidad desde el principio.", "pregunta": "¿Cuántos GB crees que necesitas tú? ¿Por qué?"}]}}, {"n": 3, "fase": "Bloque 1 · Fundamentos físicos y lógicos", "titulo": "Leer una ficha técnica sin que te la cuelen", "reto": "Entender los números de una ficha técnica y obtener las especificaciones reales del ordenador del aula.", "actividades": [{"nombre": "La ficha trampa", "min": 8, "desc": "El docente proyecta dos anuncios ficticios de portátiles a 399 €: el A presume de «¡1 TB!» pero tiene 4 GB de RAM, disco duro mecánico y procesador básico; el B tiene 512 GB SSD, 8 GB de RAM y un procesador de gama media. El alumnado vota cuál compraría y descubre por qué el A es una trampa."}, {"nombre": "Los números que importan", "min": 12, "desc": "Explicación breve con tarjetas: GHz y núcleos (CPU), GB de RAM, gráfica (GPU integrada o dedicada), GB/TB y tipo de almacenamiento (SSD frente a HDD), pulgadas y resolución, batería en mAh (móvil) o Wh (portátil), y sistema operativo con su versión. Se proyecta una tabla orientativa de mínimos recomendados para estudiar, para jugar y para editar vídeo."}, {"nombre": "Radiografía del ordenador del aula", "min": 22, "desc": "Cada estudiante busca en su ordenador del aula: procesador y núcleos, RAM, almacenamiento (tipo y capacidad), sistema operativo y versión. En Windows: Configuración > Sistema > Información y Administrador de tareas > Rendimiento; en Linux: Configuración > Acerca de y Monitor del sistema. Hace dos capturas (especificaciones y gráfica de rendimiento) y las entrega con los cinco datos en la Tarea 4.1."}, {"nombre": "¿Sirve para…?", "min": 8, "desc": "Puesta en común: con los datos del ordenador del aula, ¿sirve para estudiar?, ¿para editar un vídeo de TikTok en 4K?, ¿para jugar a Fortnite? Cada respuesta se justifica con un número de la ficha."}], "criterios": ["DIG.4.1.3"], "saberes": ["DIG.4.A.1"], "metodologia": ["Estudio de casos", "Modelado y andamiaje"], "evidencias": ["Tarea 4.1 · Radiografía del ordenador del aula"], "recursos": ["Ordenadores del aula", "Proyector", "Moodle Centros"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Ruta de clics con capturas para Windows y para Linux; tabla de mínimos como apoyo visual; quien termine antes ayuda a su pareja o compara su equipo con el del docente."}, "ejercicios": ["Explica por qué el portátil con «1 TB» y 4 GB de RAM es una mala compra.", "Anota el procesador, los núcleos, la RAM, el almacenamiento y el sistema operativo de tu ordenador del aula.", "Decide si el ordenador del aula sirve para editar vídeo y justifícalo con un dato."], "moodle": [{"recurso": "Tarea", "nombre": "4.1 · Radiografía del ordenador del aula", "uso": "Comprobar que cada estudiante sabe localizar y anotar las especificaciones reales de un equipo antes de empezar el diagnóstico.", "correccion": "apto", "criterio": "DIG.4.1.3", "cotejo": ["Aparecen los cinco datos: procesador, núcleos, RAM, almacenamiento (tipo y capacidad) y sistema operativo con su versión.", "Hay una captura de la pantalla de especificaciones del sistema.", "Hay una captura de la gráfica de rendimiento (CPU o memoria).", "Responde con un dato si el equipo sirve para editar vídeo."], "config": ["Tipo de entrega: texto en línea y archivos (.png, .jpg, .pdf)", "Calificación: escala Apto / No apto", "Entrega individual"], "calificable": true, "codigo": "4.1"}], "clase": {"pregunta": "Dos portátiles cuestan lo mismo. ¿Cuál es la trampa?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎣", "titulo": "La ficha trampa: dos portátiles a 399 €", "situacion": "**Portátil A «¡1 TB!»**: 4 GB de RAM, disco HDD de 1 TB, procesador básico de 2 núcleos. **Portátil B**: 8 GB de RAM, SSD de 512 GB, procesador de gama media de 6 núcleos.", "explicacion": "El A presume del **tamaño** del disco, pero con 4 GB de RAM y un **HDD** lento irá lento desde el primer día. El B es más rápido y durará más.", "pregunta": "¿Cuál comprarías? ¿Qué número te ha engañado?", "nota": "Vota primero sin explicar. El A llama la atención con el tamaño del disco, pero con 4 GB de RAM y HDD irá lento desde el primer día."}, {"tipo": "infografia", "titulo": "Los números que importan", "elementos": [{"icono": "🧠", "titulo": "CPU: GHz y núcleos", "texto": "Velocidad y cuántas tareas a la vez."}, {"icono": "🍽️", "titulo": "RAM (GB)", "texto": "Cuánto puede tener abierto a la vez."}, {"icono": "💾", "titulo": "Almacenamiento", "texto": "GB o TB. **SSD** mucho más rápido que HDD."}, {"icono": "🔋", "titulo": "Pantalla y batería", "texto": "Pulgadas y resolución · mAh (móvil) o Wh (portátil)."}, {"icono": "🎮", "titulo": "GPU (gráfica)", "texto": "Integrada o dedicada. Clave para jugar y editar vídeo."}, {"icono": "⚙️", "titulo": "Sistema operativo", "texto": "Cuál y **hasta cuándo** se actualiza."}], "nota": "Mínimos orientativos para estudiar: 8 GB de RAM y SSD de 256 GB. Para editar vídeo o jugar: 16 GB de RAM, SSD de 512 GB y gráfica dedicada o integrada potente."}, {"tipo": "pasos", "titulo": "¿Dónde miro las especificaciones?", "pasos": ["**Windows**: Configuración > Sistema > Información (procesador, RAM, versión).", "**Windows**: Ctrl + Mayús + Esc > Rendimiento (núcleos, disco SSD o HDD, **GPU**).", "**Linux**: Configuración > Acerca de (procesador, memoria, disco, versión).", "**Linux**: Monitor del sistema > Recursos (gráficas de CPU y memoria)."]}, {"tipo": "practica", "titulo": "Radiografía del ordenador del aula", "tiempo": 22, "agrupamiento": "Individual", "enunciado": "Busca los **5 datos** de tu ordenador y haz **2 capturas**. Entrégalo en Moodle.", "pasos": ["Procesador y número de núcleos.", "RAM (GB).", "Almacenamiento: SSD o HDD y capacidad.", "Sistema operativo y versión.", "Captura 1: especificaciones. Captura 2: gráfica de rendimiento.", "Escribe una frase: ¿sirve para editar vídeo? Justifícalo con un dato."], "entrega": "Tarea 4.1 · Radiografía del ordenador del aula"}, {"tipo": "quiz", "pregunta": "Para editar vídeos de TikTok sin esperar, ¿qué dos datos miras primero?", "opciones": ["Pulgadas y color de la carcasa", "RAM y tipo de almacenamiento (SSD)", "Número de puertos USB y peso"], "correcta": 1, "explicacion": "Editar vídeo necesita mucha **RAM** para tener el proyecto abierto y un **SSD** rápido para leer los clips."}]}}, {"n": 4, "fase": "Bloque 2 · Sistemas operativos", "titulo": "El sistema operativo: funciones, instalación y comparación", "reto": "Comprobar cómo el sistema operativo reparte la CPU y la RAM y conocer los pasos para instalar y mantener uno.", "actividades": [{"nombre": "El árbitro del partido", "min": 7, "desc": "El docente compara el sistema operativo con un árbitro o un jefe de obra: decide qué programa usa la CPU en cada momento, reparte la RAM, organiza los archivos, controla los dispositivos (impresora, cámara, wifi), gestiona usuarios y permisos y protege el equipo. Sin sistema operativo, el hardware no sabe qué hacer."}, {"nombre": "Prueba de estrés", "min": 13, "desc": "Cada estudiante abre el Administrador de tareas (o Monitor del sistema) y anota en el cuaderno el uso de CPU y RAM con 1 pestaña, con 5 pestañas y con 15 pestañas y un vídeo. Después cierra desde el administrador el proceso que más memoria consume y observa cómo baja. Conclusión: el sistema operativo gestiona los recursos y nosotros podemos ayudarle."}, {"nombre": "Escritorio frente a móvil", "min": 8, "desc": "Por parejas, el alumnado completa en el cuaderno una tabla comparativa de sistemas operativos de escritorio (Windows, Linux, macOS) y móviles (Android, iOS): dispositivos, libre o privativo, cómo se instalan programas (tienda o instalador), gestión de usuarios y permisos, y cuántos años reciben actualizaciones. Ejemplo real: Windows 10 dejó de tener soporte gratuito el 14 de octubre de 2025 y muchos equipos que funcionaban bien no podían pasar a Windows 11; una alternativa es instalar un Linux ligero. Se citan también los SO de relojes (Wear OS, watchOS)."}, {"nombre": "¿Cómo se instala un sistema operativo?", "min": 14, "desc": "Se ve un fragmento de vídeo de la instalación de Ubuntu (o una demostración del docente en una máquina virtual) y, por parejas, se ordenan en el cuaderno los pasos de la instalación: copia de seguridad, crear un USB de arranque, arrancar desde el USB (menú de arranque o UEFI), elegir idioma y teclado, elegir el disco o partición, crear el usuario y la contraseña, instalar actualizaciones y controladores."}, {"nombre": "Comprobación rápida", "min": 8, "desc": "Quiz en la web de clase sobre funciones del sistema operativo e instalación; se corrige al momento y se aclaran dudas."}], "criterios": ["DIG.4.1.2"], "saberes": ["DIG.4.A.2"], "metodologia": ["Aprendizaje por descubrimiento", "Modelado y andamiaje"], "evidencias": ["Tabla de la prueba de estrés (cuaderno)", "Pasos de instalación ordenados (cuaderno)"], "recursos": ["Ordenadores del aula", "Vídeo de instalación", "Proyector"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Tabla de la prueba de estrés ya dibujada en pantalla; vídeo con subtítulos; los pasos de instalación se pueden ordenar con tarjetas recortadas en lugar de escribir."}, "ejercicios": ["Anota el uso de CPU y RAM con 1, 5 y 15 pestañas abiertas y explica qué ha pasado.", "Escribe cuatro funciones del sistema operativo.", "Ordena los pasos para instalar un sistema operativo."], "clase": {"pregunta": "¿Quién decide qué programa usa el procesador en cada momento?", "diapositivas": [{"tipo": "ejemplo", "icono": "🧑‍⚖️", "titulo": "El árbitro del partido", "situacion": "En un partido hay 22 jugadores y un balón. Sin **árbitro**, todos lo quieren a la vez.", "explicacion": "En tu ordenador hay decenas de programas y una CPU. El **sistema operativo** es el árbitro: reparte la CPU y la RAM, guarda los archivos, controla los dispositivos y los usuarios.", "pregunta": "¿Qué pasaría si dos programas escribieran a la vez en la misma parte de la RAM?"}, {"tipo": "practica", "titulo": "Prueba de estrés", "tiempo": 13, "agrupamiento": "Individual", "enunciado": "Abre el **Administrador de tareas** (Ctrl + Mayús + Esc) o el **Monitor del sistema** y anota en tu cuaderno el uso de **CPU** y **RAM**.", "pasos": ["Con 1 pestaña del navegador.", "Con 5 pestañas.", "Con 15 pestañas y un vídeo en reproducción.", "Cierra el proceso que más memoria gasta. ¿Cuánto baja?"], "material": ["Tabla: Pestañas · CPU % · RAM %"]}, {"tipo": "comparar", "titulo": "Escritorio frente a móvil", "columnas": [{"titulo": "Escritorio", "icono": "🖥️", "puntos": ["**Windows** y **macOS** (privativos)", "**Linux** (libre, revive equipos viejos)", "Programas: instalador o tienda", "Varios usuarios con permisos"]}, {"titulo": "Móvil", "icono": "📱", "puntos": ["**Android** (base libre) e **iOS** (privativo)", "Apps solo desde la tienda (casi siempre)", "Un usuario y permisos por app", "Actualizaciones según el fabricante"]}], "texto": "Relojes: Wear OS y watchOS.", "pregunta": "¿Cuántos años de actualizaciones tiene tu móvil? ¿Y tu ordenador?", "nota": "Que copien la tabla en el cuaderno y añadan una fila: «años de actualizaciones». Ejemplo real: Windows 10 sin soporte gratuito desde el 14 de octubre de 2025."}, {"tipo": "video", "titulo": "Así se instala un sistema operativo", "busqueda": "instalar Ubuntu paso a paso español", "texto": "Mira el fragmento y apunta los pasos que veas.", "preguntas": ["¿Desde dónde arranca el ordenador para instalar?", "¿En qué momento se crea el usuario?", "¿Por qué hay que hacer antes una copia de seguridad?"], "nota": "Si hay una máquina virtual preparada (VirtualBox), haz tú la demostración en lugar del vídeo."}, {"tipo": "practica", "titulo": "Ordena la instalación", "tiempo": 8, "agrupamiento": "Parejas", "enunciado": "Copiad en el cuaderno estos pasos **en el orden correcto**.", "pasos": ["Elegir el disco o la partición.", "Hacer una copia de seguridad.", "Crear el usuario y la contraseña.", "Arrancar desde el USB.", "Instalar actualizaciones y controladores.", "Crear un USB de arranque.", "Elegir idioma y teclado."], "ayudas": [{"tipo": "pista", "titulo": "Solución para comprobar", "texto": "Copia de seguridad → USB de arranque → arrancar desde el USB → idioma y teclado → disco o partición → usuario y contraseña → actualizaciones y controladores."}]}, {"tipo": "quiz", "pregunta": "¿Qué NO hace el sistema operativo?", "opciones": ["Repartir la RAM entre programas", "Fabricar el procesador", "Gestionar usuarios y permisos"], "correcta": 1, "explicacion": "El sistema operativo es **software**: gestiona el hardware, pero no lo fabrica."}]}}, {"n": 5, "fase": "Bloque 2 · Sistemas operativos", "titulo": "Taller de puesta a punto", "reto": "Diagnosticar por qué un equipo va lento y aplicar configuraciones del sistema operativo que alarguen su vida.", "actividades": [{"nombre": "El portátil de Álex", "min": 8, "desc": "El docente presenta el caso: un portátil de 4 años que tarda 3 minutos en arrancar, la batería dura una hora, el disco está al 95 %, arrancan 30 programas al encender y lleva un año sin actualizarse. Álex quiere tirarlo y comprar otro. ¿Hay que cambiarlo o se puede salvar?"}, {"nombre": "Diagnóstico guiado", "min": 12, "desc": "Individualmente, en la parte 1 de la plantilla A1, el alumnado relaciona cada síntoma con la pieza o el software responsable y con el dato que lo demuestra (p. ej. «disco al 95 % → almacenamiento lleno → captura de Almacenamiento»). Se corrige el primero entre todos como modelo."}, {"nombre": "Configuración real", "min": 20, "desc": "En su ordenador del aula (con su usuario) y, si quiere, en su móvil, cada estudiante revisa y configura: actualizaciones pendientes, programas de inicio, almacenamiento (Sensor de almacenamiento o liberar espacio), plan de energía o batería, tipo de cuenta de usuario (estándar o administrador) y una opción de accesibilidad. Hace una captura de cada ajuste, sin datos personales, en la parte 2 de A1. Si un ajuste está bloqueado por el centro, lo explica con la captura del aviso."}, {"nombre": "Plan de mantenimiento y entrega", "min": 10, "desc": "En la parte 3 de A1 escribe cinco hábitos de mantenimiento (actualizar, copia de seguridad, limpiar inicio y almacenamiento, cuidar la batería, contraseña y cuenta estándar) y decide para el portátil de Álex: reparar, mejorar o cambiar, justificándolo. Revisa la lista «Antes de entregar» y sube el PDF a la Tarea 4.2."}], "criterios": ["DIG.4.1.2", "DIG.4.1.3"], "saberes": ["DIG.4.A.1", "DIG.4.A.2"], "metodologia": ["Estudio de casos", "Aprendizaje manipulativo"], "evidencias": ["Tarea 4.2 · Diagnóstico y puesta a punto (plantilla A1)"], "recursos": ["Ordenadores del aula", "Plantilla A1", "Moodle Centros"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Plantilla con el primer síntoma resuelto y comienzos de frase; quien no tenga móvil hace todo en el ordenador del aula; prórroga de la entrega hasta el inicio de la sesión 6 para quien la necesite."}, "ejercicios": ["Relaciona cada síntoma del portátil de Álex con la pieza o el software responsable.", "Configura en tu equipo las actualizaciones, los programas de inicio, el almacenamiento y la energía, y haz una captura de cada ajuste.", "Escribe cinco hábitos de mantenimiento y decide si el portátil de Álex se repara, se mejora o se cambia."], "moodle": [{"recurso": "Tarea", "nombre": "4.2 · Diagnóstico y puesta a punto de un equipo", "uso": "Primera Tarea evaluable: el alumnado demuestra que identifica componentes y causas de un problema técnico y que configura y mantiene el sistema operativo de forma sostenible. Se entrega la plantilla A1 en PDF.", "correccion": "rubrica", "criterio": "DIG.4.1.3", "rubrica": [{"linea": "Componentes y su función", "criterio": "DIG.4.1.3", "niveles": ["1 pto: No nombra piezas o las confunde (p. ej. llama «memoria» a todo).", "3 ptos: Nombra algunas piezas, pero no explica qué hace cada una.", "5 ptos: Nombra CPU, RAM y almacenamiento y explica su función con algún error.", "7 ptos: Explica correctamente la función de las piezas implicadas en el caso.", "10 ptos: Explica la función de cada pieza implicada y cómo afecta al rendimiento del equipo, con vocabulario técnico correcto."]}, {"linea": "Diagnóstico con datos", "criterio": "DIG.4.1.3", "niveles": ["1 pto: No relaciona síntomas con causas.", "3 ptos: Relaciona uno o dos síntomas con su causa, sin datos que lo demuestren.", "5 ptos: Relaciona la mayoría de síntomas con su causa; aporta algún dato.", "7 ptos: Relaciona todos los síntomas con su causa y aporta un dato o captura en casi todos.", "10 ptos: Relaciona todos los síntomas con su causa, cada uno con su dato o captura, y señala cuál es el problema principal."]}, {"linea": "Configuración del sistema operativo", "criterio": "DIG.4.1.2", "niveles": ["1 pto: No hay capturas de configuración.", "3 ptos: Una o dos capturas sin explicar qué se ha cambiado.", "5 ptos: Tres o cuatro ajustes con captura y explicación breve.", "7 ptos: Todos los ajustes pedidos con captura y explicación de para qué sirven.", "10 ptos: Todos los ajustes con captura, explicación y el efecto que tiene cada uno en el rendimiento, la seguridad o la batería."]}, {"linea": "Plan de mantenimiento y decisión sostenible", "criterio": "DIG.4.1.2", "niveles": ["1 pto: No hay plan ni decisión.", "3 ptos: Menos de tres hábitos o decisión sin justificar.", "5 ptos: Cinco hábitos genéricos y una decisión con una razón.", "7 ptos: Cinco hábitos concretos y una decisión justificada con el diagnóstico.", "10 ptos: Cinco hábitos concretos con su frecuencia y una decisión (reparar, mejorar o cambiar) justificada con el diagnóstico, el coste y el impacto ambiental."]}], "config": ["Tipo de entrega: archivo PDF", "Método de calificación: Rúbrica (1-3-5-7-10)", "Entrega individual", "Prórroga hasta el inicio de la sesión 6 para quien la necesite"], "criterios_rubrica": ["DIG.4.1.3", "DIG.4.1.2"], "calificable": true, "codigo": "4.2"}], "clase": {"pregunta": "¿Hay que tirar el portátil de Álex o se puede salvar?", "diapositivas": [{"tipo": "ejemplo", "icono": "💻", "titulo": "El portátil de Álex", "situacion": "Tiene 4 años. Tarda **3 minutos** en arrancar, la batería dura **1 hora**, el disco está al **95 %**, se abren **30 programas** al encender y lleva **un año** sin actualizarse.", "explicacion": "Álex quiere comprar otro. Pero casi todos esos síntomas tienen **arreglo**: limpiar, configurar o cambiar una pieza.", "pregunta": "¿Cuál de los síntomas crees que es el más grave?"}, {"tipo": "practica", "titulo": "Diagnóstico guiado (A1, parte 1)", "tiempo": 12, "agrupamiento": "Individual", "enunciado": "Abre la **plantilla A1** y relaciona cada síntoma con su **causa** y con el **dato** que lo demuestra.", "pasos": ["Ejemplo resuelto: disco al 95 % → almacenamiento lleno → captura de Almacenamiento.", "Arranque lento → ¿?", "Batería de 1 hora → ¿?", "30 programas al inicio → ¿?", "Sin actualizar → ¿?"], "enlace": "https://docs.google.com/document/d/1Vlw27f0AlxFBfyxJzyCTlZTxivt5xPi_UXERDZ3wwCk/copy"}, {"tipo": "pasos", "titulo": "Los 6 ajustes de la puesta a punto", "pasos": ["**Actualizaciones**: ¿hay pendientes?", "**Programas de inicio**: desactiva los que no necesitas.", "**Almacenamiento**: Sensor de almacenamiento o liberar espacio.", "**Energía / batería**: modo equilibrado o ahorro.", "**Cuenta de usuario**: ¿estándar o administrador?", "**Accesibilidad**: activa una opción útil (tamaño de texto, modo oscuro, lupa…)."], "texto": "Windows: Configuración. Linux: Configuración y Aplicaciones al inicio."}, {"tipo": "practica", "titulo": "Configuración real (A1, parte 2)", "tiempo": 20, "agrupamiento": "Individual", "enunciado": "Revisa los **6 ajustes** en tu ordenador del aula (y, si quieres, en tu móvil). Pega una **captura** de cada uno en A1 y explica qué has visto o cambiado.", "pasos": ["Sin datos personales en las capturas (ni nombres, ni correos, ni fotos).", "Si un ajuste está bloqueado por el centro, haz captura del aviso y explícalo."]}, {"tipo": "practica", "titulo": "Plan de mantenimiento y entrega", "tiempo": 10, "agrupamiento": "Individual", "enunciado": "En la **parte 3 de A1** escribe 5 hábitos de mantenimiento y decide: ¿el portátil de Álex se **repara**, se **mejora** o se **cambia**? Justifícalo.", "pasos": ["Usa el comienzo: «Yo le recomiendo a Álex… porque…».", "Revisa la lista «Antes de entregar».", "Descarga A1 en PDF y súbelo a Moodle."], "entrega": "Tarea 4.2 · Diagnóstico y puesta a punto de un equipo"}]}}, {"n": 6, "fase": "Bloque 3 · Estudio de mercado y sostenibilidad", "titulo": "Obsolescencia programada y ciclo de vida", "reto": "Distinguir los tipos de obsolescencia, recorrer el ciclo de vida de un móvil y elegir nuestros criterios de compra sostenible.", "actividades": [{"nombre": "¿Programada o percibida?", "min": 8, "desc": "Tres casos cortos para clasificar: un ordenador que funciona pero se queda sin actualizaciones de seguridad (obsolescencia de software), un móvil con la batería pegada que no se puede cambiar fácilmente (obsolescencia técnica o por diseño) y un modelo nuevo cada año con cambios mínimos que nos hace sentir que el nuestro está «viejo» (obsolescencia percibida). El alumnado vota y justifica."}, {"nombre": "El viaje de un móvil", "min": 12, "desc": "Con la infografía del ciclo de vida: extracción de materias primas (litio, cobalto, coltán), fabricación, transporte, uso (energía, actualizaciones, reparaciones) y fin de vida (reutilizar, reparar, reacondicionar, reciclar en un punto limpio). El alumnado señala en qué fase está el mayor impacto y en cuáles puede influir como consumidor."}, {"nombre": "El dato", "min": 5, "desc": "Se recupera el dato de la sesión 1 (62 millones de toneladas de residuos electrónicos en 2022, 22,3 % reciclado de forma documentada) y se compara con lo que hizo la clase con su último móvil según la encuesta F1."}, {"nombre": "La etiqueta que lo cuenta", "min": 10, "desc": "El docente presenta la etiqueta energética de la UE para móviles y tabletas, obligatoria desde el 20 de junio de 2025: clase de eficiencia (A-G), autonomía de la batería, ciclos de carga hasta el 80 % de capacidad, resistencia a caídas (A-E), reparabilidad (A-E) y protección IP. Por parejas, leen una etiqueta de ejemplo y responden tres preguntas."}, {"nombre": "Mis 5 criterios verdes", "min": 15, "desc": "Individualmente, cada estudiante escribe en el cuaderno los cinco criterios de sostenibilidad que usará en su estudio de mercado (p. ej. reparabilidad, años de actualizaciones, batería reemplazable, opción reacondicionada, qué hacer con el aparato viejo) y explica cada uno en una frase. Los usará en la plantilla A2."}], "criterios": ["DIG.4.4.4"], "saberes": ["DIG.4.D.5"], "metodologia": ["Estudio de casos", "Aprendizaje cooperativo"], "evidencias": ["Clasificación de los tres casos", "Mis 5 criterios verdes (cuaderno)"], "recursos": ["Proyector", "Etiqueta energética de ejemplo"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Infografía del ciclo de vida con iconos; casos de su día a día; banco de criterios verdes en pantalla para quien se bloquee."}, "ejercicios": ["Clasifica tres casos como obsolescencia de software, técnica o percibida.", "Explica las fases del ciclo de vida de un móvil y en cuáles puedes influir.", "Lee una etiqueta energética de un móvil e interpreta la reparabilidad y la batería.", "Escribe tus cinco criterios de compra sostenible."], "clase": {"pregunta": "¿Tu móvil está viejo o te han convencido de que lo está?", "diapositivas": [{"tipo": "practica", "titulo": "¿Programada o percibida?", "tiempo": 8, "agrupamiento": "Toda la clase", "enunciado": "Hay tres tipos de obsolescencia: **de software** (deja de actualizarse), **técnica o de diseño** (una pieza falla y no se puede cambiar) y **percibida** (funciona, pero «parece viejo»). Vota cada caso y justifícalo.", "pasos": ["Caso 1: un ordenador que va bien, pero ya no recibe actualizaciones de seguridad.", "Caso 2: un móvil con la batería pegada que cuesta mucho cambiar.", "Caso 3: sale un modelo nuevo con un color nuevo y casi nada más, y el tuyo te parece viejo."], "ayudas": [{"tipo": "pista", "titulo": "Solución para comprobar", "texto": "Caso 1: de software (p. ej. Windows 10, sin soporte gratuito desde octubre de 2025). Caso 2: técnica o de diseño. Caso 3: percibida."}]}, {"tipo": "infografia", "titulo": "El viaje de un móvil", "svg": "<svg viewBox=\"0 0 640 220\" role=\"img\" aria-label=\"Ciclo de vida de un móvil: materias primas, fabricación, transporte, uso y fin de vida, con flecha de vuelta por reparar, reacondicionar y reciclar\"><rect x=\"10\" y=\"60\" width=\"110\" height=\"60\" rx=\"10\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><text x=\"65\" y=\"86\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">⛏️ Materias<\/text><text x=\"65\" y=\"106\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">primas<\/text><rect x=\"135\" y=\"60\" width=\"110\" height=\"60\" rx=\"10\" style=\"fill:var(--brand-soft);stroke:var(--brand)\"/><text x=\"190\" y=\"96\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">🏭 Fabricación<\/text><rect x=\"260\" y=\"60\" width=\"110\" height=\"60\" rx=\"10\" style=\"fill:var(--brand-soft);stroke:var(--brand)\"/><text x=\"315\" y=\"96\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">🚢 Transporte<\/text><rect x=\"385\" y=\"60\" width=\"110\" height=\"60\" rx=\"10\" style=\"fill:var(--accent-soft);stroke:var(--accent)\"/><text x=\"440\" y=\"96\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">📱 Uso (tú)<\/text><rect x=\"510\" y=\"60\" width=\"120\" height=\"60\" rx=\"10\" style=\"fill:var(--accent-soft);stroke:var(--accent)\"/><text x=\"570\" y=\"86\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">♻️ Fin de vida<\/text><text x=\"570\" y=\"106\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">(tú decides)<\/text><path d=\"M120 90 H135 M245 90 H260 M370 90 H385 M495 90 H510\" style=\"stroke:var(--ink);fill:none\" stroke-width=\"2\"/><path d=\"M570 120 C570 190 190 190 190 120\" style=\"stroke:var(--ok);fill:none\" stroke-width=\"3\" stroke-dasharray=\"6 5\"/><text x=\"380\" y=\"200\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ok)\">reparar · reacondicionar · reciclar materiales<\/text><text x=\"320\" y=\"35\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">Puedes influir en las fases verdes<\/text><\/svg>", "nota": "Pregunta en qué fase está el mayor impacto (extracción y fabricación) y por qué alargar el uso es la mejor forma de reducirlo."}, {"tipo": "ejemplo", "icono": "🗄️", "titulo": "El cajón de los móviles viejos", "situacion": "En muchas casas hay un cajón con dos o tres móviles viejos «por si acaso». En nuestra encuesta F1, ¿cuántos dijeron «está en un cajón»?", "explicacion": "En el mundo, solo el **22,3 %** de los residuos electrónicos de 2022 se recogió y recicló de forma documentada (Global E-waste Monitor 2024). Un móvil en un cajón **no se reutiliza ni se recicla**.", "pregunta": "¿Qué podrías hacer hoy con el móvil viejo de tu cajón?"}, {"tipo": "infografia", "titulo": "La etiqueta de los móviles (UE, desde junio de 2025)", "elementos": [{"icono": "⚡", "titulo": "Eficiencia A-G", "texto": "Cuánta energía gasta."}, {"icono": "🔋", "titulo": "Batería", "texto": "Horas por carga y **ciclos** hasta el 80 %."}, {"icono": "📉", "titulo": "Caídas A-E", "texto": "Cuánto aguanta los golpes."}, {"icono": "🔧", "titulo": "Reparabilidad A-E", "texto": "Piezas, herramientas, **actualizaciones**."}, {"icono": "💧", "titulo": "IP", "texto": "Protección contra polvo y agua."}], "nota": "Proyecta una etiqueta real de un móvil (de una tienda o de la base de datos EPREL de la UE) para la práctica siguiente."}, {"tipo": "practica", "titulo": "Lee la etiqueta", "tiempo": 6, "agrupamiento": "Parejas", "enunciado": "Mirad la **etiqueta del móvil** que está en pantalla y responded en el cuaderno.", "pasos": ["¿Qué clase de **reparabilidad** tiene?", "¿Cuántos **ciclos** aguanta la batería hasta el 80 %?", "¿Lo recomendaríais a alguien que quiere que le dure muchos años? ¿Por qué?"]}, {"tipo": "practica", "titulo": "Mis 5 criterios verdes", "tiempo": 15, "agrupamiento": "Individual", "enunciado": "Escribe en tu cuaderno **5 criterios de sostenibilidad** que usarás en tu estudio de mercado y explica cada uno en una frase.", "pasos": ["Ideas: reparabilidad, años de actualizaciones, batería reemplazable, reacondicionado, eficiencia, qué hago con el viejo.", "Ejemplo: «Años de actualizaciones: si recibe más años, lo podré usar más tiempo con seguridad».", "Los copiarás en la plantilla A2."]}]}}, {"n": 7, "fase": "Bloque 3 · Estudio de mercado y sostenibilidad", "titulo": "Estudio de mercado I: el encargo", "reto": "Elegir un cliente, traducir sus necesidades a especificaciones técnicas y encontrar tres candidatos dentro de su presupuesto.", "actividades": [{"nombre": "Elige tu cliente", "min": 7, "desc": "El docente proyecta seis tarjetas de cliente con necesidades y presupuesto: Lucía (portátil para Bachillerato y editar vídeos de TikTok, 650 €), Manuel (72 años, smartphone sencillo para videollamadas y con mucha batería, 200 €), Sara (PC o portátil para jugar a Fortnite y Minecraft, 800 €), Hugo (smartwatch con GPS para correr y montar en bici, 150 €), la familia Ruiz (sobremesa para deberes y gestiones, 450 €) y Nora (smartphone con buena cámara para empezar en Instagram, 350 €). Cada estudiante elige uno; las parejas pueden compartir cliente, pero cada estudiante entrega su informe."}, {"nombre": "De necesidades a especificaciones", "min": 10, "desc": "Planteamiento del reto financiero: con un presupuesto fijo hay que repartir el dinero entre procesador, RAM, gráfica (GPU), almacenamiento y batería según lo que necesita el cliente. Ejemplo resuelto con un cliente que no está en la lista: «quiere ver series y hacer trabajos en Google Docs» → 8 GB de RAM, SSD de 256 GB, GPU integrada, batería de al menos 8 horas, sistema operativo con actualizaciones al menos hasta 2031; no merece la pena pagar una GPU dedicada. Después cada estudiante completa la parte 1 de A2 con las especificaciones mínimas de su cliente."}, {"nombre": "Búsqueda de tres candidatos", "min": 23, "desc": "Con su pareja de apoyo, cada estudiante busca tres modelos dentro del presupuesto en webs de fabricantes y tiendas (al menos uno reacondicionado o de la generación anterior) y completa la tabla comparativa de la parte 2 de A2: precio, procesador, RAM, gráfica (GPU), almacenamiento, pantalla, batería, coste por año de uso, sistema operativo y años de actualizaciones, reparabilidad y enlace. Se recuerda comprobar los datos en la web del fabricante."}, {"nombre": "Control de calidad", "min": 10, "desc": "La pareja intercambia la tabla y revisa cuatro cosas: los tres modelos caben en el presupuesto, no hay casillas vacías, cada dato tiene enlace y al menos uno es reacondicionado o anterior. Se corrige lo que falte."}], "criterios": ["DIG.4.1.3"], "saberes": ["DIG.4.A.1", "DIG.4.A.2"], "metodologia": ["Aprendizaje basado en retos", "Trabajo en parejas"], "evidencias": ["Plantilla A2, partes 1 y 2 (tabla comparativa)"], "recursos": ["Ordenadores del aula", "Plantilla A2", "Webs de fabricantes y tiendas"], "dua": {"principios": ["Compromiso", "Andamiaje"], "medidas": "Elección de cliente según sus intereses; ejemplo resuelto proyectado; lista de webs fiables; quien vaya más lento puede comparar solo dos modelos y añadir el tercero en la sesión 8."}, "ejercicios": ["Elige un cliente y escribe las especificaciones mínimas que necesita.", "Busca tres modelos dentro del presupuesto (uno reacondicionado o anterior) y completa la tabla comparativa.", "Revisa la tabla de tu pareja con la lista de control."], "clase": {"pregunta": "Si tu cliente tiene 200 €, ¿qué es lo primero que miras?", "diapositivas": [{"tipo": "infografia", "titulo": "Elige tu cliente", "elementos": [{"icono": "🎬", "titulo": "Lucía · 650 €", "texto": "Portátil para Bachillerato y editar vídeos de TikTok."}, {"icono": "👴", "titulo": "Manuel · 200 €", "texto": "72 años. Smartphone fácil, videollamadas y mucha batería."}, {"icono": "🎮", "titulo": "Sara · 800 €", "texto": "PC o portátil para Fortnite y Minecraft."}, {"icono": "🏃", "titulo": "Hugo · 150 €", "texto": "Smartwatch con GPS para correr y bici."}, {"icono": "🏠", "titulo": "Familia Ruiz · 450 €", "texto": "Sobremesa para deberes y gestiones."}, {"icono": "📸", "titulo": "Nora · 350 €", "texto": "Smartphone con buena cámara para Instagram."}], "nota": "Cada estudiante elige uno. Las parejas pueden compartir cliente, pero cada estudiante entrega su propio informe."}, {"tipo": "ejemplo", "icono": "📝", "titulo": "De necesidades a especificaciones", "situacion": "Cliente de ejemplo: «Quiero **ver series** y hacer **trabajos en Google Docs**».", "explicacion": "Traducción: **8 GB de RAM**, **SSD de 256 GB**, **GPU integrada** (no hace falta pagar una dedicada), batería de **8 h** y un SO con **actualizaciones al menos hasta 2031**.", "pregunta": "¿En qué componente gastarías más si quisiera jugar a Fortnite?"}, {"tipo": "practica", "titulo": "Búsqueda de tres candidatos (A2, partes 1 y 2)", "tiempo": 23, "agrupamiento": "Parejas de apoyo · entrega individual", "enunciado": "Escribe las especificaciones mínimas de tu cliente y busca **3 modelos** dentro de su presupuesto. Completa la **tabla comparativa** de la **plantilla A2**.", "pasos": ["Al menos **uno reacondicionado** o de la generación anterior.", "Precio, procesador, RAM, **GPU**, almacenamiento, pantalla, batería.", "Sistema operativo y **hasta cuándo** se actualiza.", "**Coste por año** = precio ÷ años de actualizaciones que le quedan.", "Reparabilidad (etiqueta UE si es móvil o tableta).", "Pega el **enlace** de donde sacas cada dato."], "material": ["Webs de fabricantes", "Tiendas online", "Base de datos EPREL de la UE"], "enlace": "https://docs.google.com/document/d/1ZS3lfFCUj9MvAfDTV0e5Z49fowioSZ7AqV4VYyyRhkg/copy"}, {"tipo": "practica", "titulo": "Control de calidad", "tiempo": 10, "agrupamiento": "Parejas", "enunciado": "Intercambia la tabla con tu pareja y revisa **4 cosas**. Corrige lo que falte.", "pasos": ["☐ Los tres modelos caben en el presupuesto.", "☐ No hay casillas vacías.", "☐ Cada dato tiene su enlace.", "☐ Hay al menos un reacondicionado o modelo anterior."], "enlace": "https://docs.google.com/document/d/1ZS3lfFCUj9MvAfDTV0e5Z49fowioSZ7AqV4VYyyRhkg/copy"}, {"tipo": "quiz", "pregunta": "Manuel tiene 200 € y quiere un móvil fácil con mucha batería. ¿Qué dato es MENOS importante para él?", "opciones": ["La capacidad de la batería (mAh)", "Que tenga cuatro cámaras traseras", "Los años de actualizaciones"], "correcta": 1, "explicacion": "Para Manuel importan la **batería**, la facilidad de uso y que se **actualice** muchos años. Cuatro cámaras encarecen el móvil y no las necesita."}]}}, {"n": 8, "fase": "Bloque 3 · Estudio de mercado y sostenibilidad", "titulo": "Estudio de mercado II: la recomendación", "reto": "Analizar el ciclo de vida del dispositivo elegido y escribir una recomendación fundamentada para el cliente.", "actividades": [{"nombre": "Una recomendación que convence", "min": 7, "desc": "El docente proyecta una recomendación modelo con la estructura «Te recomiendo X porque… (dos datos técnicos). Aunque… (un punto débil). Además, durará porque… (actualizaciones, reparabilidad, batería). Con tu dispositivo viejo puedes…». Se señala qué la hace convincente: datos, comparación y honestidad."}, {"nombre": "Ciclo de vida del elegido", "min": 15, "desc": "En la parte 3 de A2, cada estudiante analiza el modelo que va a recomendar con sus cinco criterios verdes: años de actualizaciones del sistema operativo, reparabilidad (etiqueta UE, web del fabricante o puntuaciones de reparabilidad), batería reemplazable o ciclos, si es reacondicionado, y qué hacer con el dispositivo viejo del cliente (vender, donar, reacondicionar o llevar a un punto limpio)."}, {"nombre": "Mi recomendación", "min": 18, "desc": "En la parte 4 de A2, cada estudiante escribe la recomendación para su cliente siguiendo el modelo e incluye una frase sobre accesibilidad (si el dispositivo es fácil de usar para esa persona). Quien quiera añade un resumen visual de una diapositiva tipo publicación de Instagram, hecho en Canva o Genially, y pega su enlace en A2."}, {"nombre": "Revisión y entrega", "min": 10, "desc": "Cada estudiante repasa la lista «Antes de entregar» de A2, su pareja le lee la recomendación en voz alta para ver si se entiende, descarga el documento en PDF y lo sube a la Tarea 4.3."}], "criterios": ["DIG.4.1.2", "DIG.4.1.3", "DIG.4.4.4"], "saberes": ["DIG.4.A.1", "DIG.4.A.2", "DIG.4.D.5"], "metodologia": ["Modelado y andamiaje", "Aprendizaje basado en retos"], "evidencias": ["Tarea 4.3 · Estudio de mercado y recomendación (plantilla A2)"], "recursos": ["Ordenadores del aula", "Plantilla A2", "Canva o Genially", "Moodle Centros"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Comienzos de frase en la plantilla; resumen visual opcional en Canva o Genially; la recomendación puede grabarse en audio (máx. 1 minuto) y enlazarse si a alguien le cuesta mucho escribir."}, "ejercicios": ["Analiza el ciclo de vida del dispositivo que vas a recomendar con tus cinco criterios verdes.", "Escribe la recomendación para tu cliente con dos datos técnicos, un punto débil y por qué durará.", "Revisa tu informe con la lista «Antes de entregar» y entrégalo en PDF."], "moodle": [{"recurso": "Tarea", "nombre": "4.3 · Estudio de mercado y recomendación", "uso": "Producto final de la SdA: informe comparativo y estudio de mercado con la recomendación fundamentada y el análisis del ciclo de vida. Se entrega la plantilla A2 en PDF (con el enlace al resumen visual si lo hay).", "correccion": "rubrica", "criterio": "DIG.4.4.4", "rubrica": [{"linea": "Tabla comparativa de especificaciones", "criterio": "DIG.4.1.3", "niveles": ["1 pto: No hay tabla o tiene un solo modelo.", "3 ptos: Dos o tres modelos con muchas casillas vacías o datos sin fuente.", "5 ptos: Tres modelos con la mayoría de datos, alguno sin enlace o con errores de unidades.", "7 ptos: Tres modelos completos, con enlaces y unidades correctas.", "10 ptos: Tres modelos completos, con enlaces a fuentes fiables, unidades correctas y uno reacondicionado o de la generación anterior."]}, {"linea": "Ajuste al presupuesto y elección de componentes", "criterio": "DIG.4.1.3", "niveles": ["1 pto: No relaciona el dispositivo con las necesidades del cliente.", "3 ptos: Las especificaciones mínimas no corresponden a lo que necesita el cliente o se pasa del presupuesto.", "5 ptos: Especificaciones mínimas razonables; el recomendado cumple casi todas y cabe en el presupuesto.", "7 ptos: El recomendado cumple todas las especificaciones mínimas y el presupuesto, y explica qué componentes prioriza.", "10 ptos: Cumple todo, justifica con datos qué componentes (procesador, RAM, GPU, batería) prioriza para ese cliente y por qué supera a los otros dos candidatos, incluido el coste por año de uso."]}, {"linea": "Sistema operativo y soporte de actualizaciones", "criterio": "DIG.4.1.2", "niveles": ["1 pto: No menciona el sistema operativo.", "3 ptos: Nombra el sistema operativo sin hablar de actualizaciones.", "5 ptos: Indica el sistema operativo y si se actualiza, sin fecha ni fuente.", "7 ptos: Indica el sistema operativo y hasta cuándo recibe actualizaciones, con fuente.", "10 ptos: Indica el sistema operativo, hasta cuándo se actualiza (con fuente) y dos ajustes que le aconseja al cliente para mantenerlo."]}, {"linea": "Análisis del ciclo de vida y sostenibilidad", "criterio": "DIG.4.4.4", "niveles": ["1 pto: No analiza la sostenibilidad.", "3 ptos: Menciona la sostenibilidad de forma general («es bueno para el planeta»).", "5 ptos: Analiza dos o tres criterios verdes con algún dato.", "7 ptos: Analiza sus cinco criterios verdes con datos (reparabilidad, actualizaciones, batería…).", "10 ptos: Analiza los cinco criterios con datos, incluye qué hacer con el dispositivo viejo y relaciona su elección con el impacto ambiental del ciclo de vida."]}, {"linea": "Recomendación fundamentada y accesibilidad", "criterio": "DIG.4.4.4", "niveles": ["1 pto: No hay recomendación.", "3 ptos: Recomienda un modelo sin razones o con razones que no son técnicas («es bonito»).", "5 ptos: Recomienda con una o dos razones técnicas, sin puntos débiles ni accesibilidad.", "7 ptos: Sigue la estructura: dos datos técnicos, un punto débil y por qué durará.", "10 ptos: Sigue la estructura con claridad, valora la accesibilidad para ese cliente y deja claro por qué su elección es responsable."]}], "config": ["Tipo de entrega: archivo PDF y texto en línea (enlace opcional a Canva o Genially)", "Método de calificación: Rúbrica (1-3-5-7-10)", "Entrega individual"], "criterios_rubrica": ["DIG.4.1.3", "DIG.4.1.2", "DIG.4.4.4"], "calificable": true, "codigo": "4.3"}], "clase": {"pregunta": "¿Qué hace que una recomendación te convenza?", "diapositivas": [{"tipo": "ejemplo", "icono": "💬", "titulo": "Una recomendación que convence", "situacion": "«Te recomiendo el **modelo X reacondicionado (420 €)** porque tiene **16 GB de RAM** y **SSD de 512 GB**, suficiente para editar vídeo. **Aunque** pesa 1,8 kg, **durará** porque recibe actualizaciones hasta 2031 y la batería se puede cambiar. Tu portátil viejo puedes **donarlo** o llevarlo al punto limpio.»", "explicacion": "Convence porque da **datos**, compara, reconoce un **punto débil** y piensa en el **futuro**.", "pregunta": "¿Qué frase quitarías y cuál añadirías?"}, {"tipo": "practica", "titulo": "Ciclo de vida del elegido (A2, parte 3)", "tiempo": 15, "agrupamiento": "Individual", "enunciado": "Analiza el modelo que vas a recomendar con tus **5 criterios verdes** de la sesión 6.", "pasos": ["¿Hasta cuándo se actualiza el sistema operativo?", "¿Qué reparabilidad tiene? ¿Se cambia la batería?", "¿Es reacondicionado o de la generación anterior?", "¿Qué hace el cliente con su dispositivo viejo?"], "enlace": "https://docs.google.com/document/d/1ZS3lfFCUj9MvAfDTV0e5Z49fowioSZ7AqV4VYyyRhkg/copy"}, {"tipo": "practica", "titulo": "Mi recomendación (A2, parte 4)", "tiempo": 18, "agrupamiento": "Individual", "enunciado": "Escribe la recomendación para tu cliente siguiendo el modelo y añade una frase sobre **accesibilidad**.", "pasos": ["Te recomiendo… porque… (2 datos técnicos).", "Aunque… (1 punto débil).", "Durará porque… (actualizaciones, reparación, batería).", "Es fácil de usar para ti porque…", "Opcional: resumen visual tipo post de Instagram en Canva o Genially (pega el enlace en A2)."], "enlace": "https://docs.google.com/document/d/1ZS3lfFCUj9MvAfDTV0e5Z49fowioSZ7AqV4VYyyRhkg/copy"}, {"tipo": "practica", "titulo": "Revisión y entrega", "tiempo": 10, "agrupamiento": "Parejas de apoyo · entrega individual", "enunciado": "Tu pareja te lee la recomendación en voz alta: ¿se entiende? Repasa la lista **«Antes de entregar»**, descarga A2 en **PDF** y súbelo.", "entrega": "Tarea 4.3 · Estudio de mercado y recomendación"}]}}, {"n": 9, "fase": "Bloque 3 · Estudio de mercado y sostenibilidad", "titulo": "Feria «Compra con cabeza»", "reto": "Compartir las recomendaciones, valorar las de otros compañeros y comprometernos con un uso más sostenible de nuestros dispositivos.", "actividades": [{"nombre": "Paseo por la galería", "min": 20, "desc": "Cada estudiante deja abierto en su pantalla el resumen visual o la recomendación de su informe. El alumnado pasea por el aula y visita al menos tres recomendaciones de clientes distintos; en cada una deja un pósit con «Me convence porque…» y «Yo cambiaría…». Las parejas no pueden visitarse entre sí."}, {"nombre": "Premio «Compra con cabeza»", "min": 5, "desc": "Cada estudiante vota a mano alzada la recomendación más convincente por cliente. El docente destaca en voz alta qué dato o argumento hizo ganar a cada una (sin nota: es un reconocimiento)."}, {"nombre": "Autoevaluación", "min": 12, "desc": "Cada estudiante responde el formulario F2 de autoevaluación: cómo valora su informe en cada línea de la rúbrica, qué le costó más y qué ha aprendido sobre su propio móvil u ordenador."}, {"nombre": "Mi compromiso", "min": 13, "desc": "En el cuaderno, cada estudiante vuelve a la página de la sesión 1: responde la duda que escribió y redacta un compromiso concreto para su próximo dispositivo o para alargar la vida del que tiene (p. ej. «Activaré las actualizaciones automáticas y cambiaré la batería en lugar del móvil»). Se leen algunos voluntariamente."}], "criterios": [], "saberes": ["DIG.4.D.5"], "metodologia": ["Paseo por la galería", "Metacognición"], "evidencias": ["Pósits de valoración", "Autoevaluación F2", "Mi compromiso (cuaderno)"], "recursos": ["Ordenadores del aula", "Pósits", "Google Forms"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Comienzos de frase en los pósits; autoevaluación con escalas e iconos; el compromiso puede ser un dibujo o una frase corta."}, "ejercicios": ["Visita tres recomendaciones y deja en cada una un comentario «Me convence porque…» y «Yo cambiaría…».", "Responde la autoevaluación del estudio de mercado.", "Responde tu duda de la sesión 1 y escribe un compromiso concreto para tu próximo dispositivo."], "clase": {"pregunta": "¿Qué harás distinto la próxima vez que compres un dispositivo?", "diapositivas": [{"tipo": "practica", "titulo": "Paseo por la galería", "tiempo": 20, "agrupamiento": "Individual", "enunciado": "Deja tu recomendación abierta en la pantalla. Visita **3 recomendaciones de clientes distintos** y deja un pósit en cada una.", "pasos": ["«Me convence porque…»", "«Yo cambiaría…»", "No visites a tu pareja de apoyo.", "Comentarios con respeto: valoramos el trabajo, no a la persona."], "material": ["Pósits"]}, {"tipo": "ejemplo", "icono": "🏆", "titulo": "Premio «Compra con cabeza»", "situacion": "En YouTube y TikTok, ¿de qué reviews te fías más: de las que dicen «¡es el mejor!» o de las que dan **datos** y cuentan los **fallos**?", "explicacion": "Así votamos hoy la recomendación **más convincente** de cada cliente: la que da datos, reconoce un punto débil y piensa en **cuánto durará**.", "pregunta": "¿Qué dato te ha convencido más de todo lo que has visto?", "nota": "Votación a mano alzada. Es un reconocimiento, no cuenta en la nota."}, {"tipo": "practica", "titulo": "Autoevaluación (F2)", "tiempo": 12, "agrupamiento": "Individual", "enunciado": "Responde el formulario **F2**: valora tu informe con las líneas de la rúbrica y cuéntanos qué has aprendido.", "pasos": ["Sé sincero/a: sirve para mejorar.", "Mira tu informe mientras respondes."], "enlace": "https://forms.gle/EeqPnQY5kWMkPbmv6"}, {"tipo": "practica", "titulo": "Mi compromiso", "tiempo": 13, "agrupamiento": "Individual", "enunciado": "Vuelve a la página de la **sesión 1**: responde la duda que escribiste y escribe **un compromiso concreto**.", "pasos": ["Ejemplo: «Activaré las actualizaciones automáticas y cambiaré la batería en lugar del móvil».", "Puede ser una frase o un dibujo.", "Si quieres, léelo en voz alta."]}, {"tipo": "cierre", "titulo": "Lo que nos llevamos", "puntos": ["Dentro de cada dispositivo: CPU, RAM, almacenamiento y SO.", "Una ficha técnica se lee con datos, no con anuncios.", "Configurar y mantener alarga la vida del equipo.", "Comprar con cabeza: necesidades, presupuesto y ciclo de vida."], "pregunta": "¿Qué consejo le darías a alguien que va a comprar su primer móvil?"}]}}], "dua": {"Compromiso": ["Reto conectado con sus dispositivos y con perfiles de cliente cercanos (TikTok, Instagram, videojuegos, deporte, abuelos).", "Elección del cliente y del tipo de dispositivo según sus intereses.", "Logros cortos y visibles en cada sesión; premio «Compra con cabeza» como reconocimiento sin nota."], "Representación": ["Analogías (cuerpo humano, árbitro) e infografías con iconos en la web de clase.", "Piezas reales para tocar y gráficas del administrador de tareas en directo.", "Vídeo con subtítulos y modo estudio de la web de clase para repasar en el móvil."], "Acción y Expresión": ["Plantillas con huecos, tablas y comienzos de frase.", "Resumen visual opcional en Canva o Genially; recomendación en audio si escribir es una barrera.", "Capturas como evidencia en lugar de textos largos."], "Andamiaje": ["Modelo resuelto antes de cada entrega (síntoma resuelto en A1, recomendación modelo en A2).", "Lista «Antes de entregar» en primera persona en cada plantilla.", "Pareja de apoyo para investigar y revisar; prórrogas en Moodle para quien lo necesite."]}, "diversidad": [{"perfil": "Alumnado repetidor o con baja motivación", "medidas": "Tareas cortas con un resultado visible en la misma sesión; elección de cliente; feedback rápido en Moodle (Apto en 4.1 para empezar con un éxito); reconocimiento público de avances."}, {"perfil": "Alumnado con dificultades de comprensión lectora", "medidas": "Enunciados de una o dos frases con la palabra clave en negrita; lectura en voz alta por parte de la pareja; glosario visual de la sesión 3 siempre visible; lector inmersivo en Google Docs."}, {"perfil": "Alumnado con dificultades de atención", "medidas": "Actividades de 7-20 minutos con temporizador en pantalla; tareas manipulativas (estaciones, prueba de estrés); ubicación cerca del docente; checklist para marcar lo hecho."}, {"perfil": "Alumnado con poca competencia digital", "medidas": "Ruta de clics con capturas para Windows y Linux; pareja de apoyo con más soltura; tutorial del docente en pantalla durante la configuración."}, {"perfil": "Alumnado sin móvil propio o que no quiere usarlo", "medidas": "Todas las prácticas se pueden hacer con el ordenador del aula; nunca se pide mostrar datos o capturas del móvil personal."}, {"perfil": "Alumnado que termina antes", "medidas": "Ampliación: comparar un cuarto modelo, calcular el coste por año de uso de cada candidato o proponer una distribución de Linux para un equipo antiguo del centro."}], "roles": [{"rol": "Técnico/a", "funcion": "Maneja el ordenador durante la búsqueda o la configuración y hace las capturas."}, {"rol": "Analista", "funcion": "Lee la ficha o las instrucciones, comprueba que los datos tienen fuente y anota. Los roles se intercambian en cada actividad; cada estudiante entrega su propio trabajo."}], "evaluacion": {"instrumentos": {"DIG.4.1.2": ["Rúbrica de la Tarea 4.2 (configuración y mantenimiento)", "Rúbrica de la Tarea 4.3 (sistema operativo y actualizaciones)", "Observación directa en la prueba de estrés (sesión 4)"], "DIG.4.1.3": ["Tarea 4.1 (Apto / No apto)", "Rúbrica de la Tarea 4.2 (componentes y diagnóstico)", "Rúbrica de la Tarea 4.3 (tabla comparativa y ajuste al cliente)"], "DIG.4.4.4": ["Rúbrica de la Tarea 4.3 (ciclo de vida y recomendación)", "Observación de la clasificación de casos y de los criterios verdes (sesión 6)"]}, "cotejo": [{"criterio": "DIG.4.1.2", "indicadores": ["Explica las funciones del sistema operativo (gestión de procesos, memoria, archivos, dispositivos y usuarios).", "Ordena correctamente los pasos de la instalación de un sistema operativo.", "Configura actualizaciones, programas de inicio, almacenamiento y energía en un equipo real.", "Propone hábitos de mantenimiento concretos y sostenibles.", "Tiene en cuenta los años de actualizaciones del sistema operativo al elegir un dispositivo."]}, {"criterio": "DIG.4.1.3", "indicadores": ["Identifica los componentes de un ordenador y de un móvil y explica su función.", "Interpreta correctamente los datos de una ficha técnica (núcleos, GB de RAM, tipo de almacenamiento…).", "Relaciona los síntomas de un equipo lento con su causa usando datos del sistema.", "Decide de forma razonada si un equipo se repara, se mejora o se sustituye.", "Selecciona el dispositivo que cumple las necesidades técnicas y el presupuesto del cliente."]}, {"criterio": "DIG.4.4.4", "indicadores": ["Distingue la obsolescencia de software, la técnica y la percibida.", "Describe las fases del ciclo de vida de un dispositivo y en cuáles puede influir.", "Interpreta la etiqueta energética y de reparabilidad de un móvil.", "Usa criterios de sostenibilidad y accesibilidad para justificar su recomendación.", "Propone un destino responsable para el dispositivo viejo."]}], "agentes": {"Heteroevaluación": "El docente califica las Tareas 4.2 y 4.3 con sus rúbricas (que se trasladan a Séneca) y la 4.1 como Apto / No apto; observa la prueba de estrés y la sesión 6.", "Coevaluación": "Control de calidad de la tabla comparativa entre parejas (sesión 7) y pósits del paseo por la galería (sesión 9), sin nota.", "Autoevaluación": "Formulario F2 con las líneas de la rúbrica de la Tarea 4.3 y reflexión final (sesión 9)."}}, "moodle": {"estructura": "Una sección «SdA 4 · Compra con cabeza» en el curso de Digitalización de 4.º ESO con el área de texto de presentación, las tres Tareas (4.1, 4.2 y 4.3) y el enlace a la web de clase.", "secciones": [{"nombre": "SdA 4 · Compra con cabeza", "elementos": ["Área de texto y medios con el reto, la pregunta guía, las sesiones y el calendario de entregas", "Página «Cómo se evalúa» con la lista de la Tarea 4.1 y las rúbricas de 4.2 y 4.3", "Tarea 4.1 · Radiografía del ordenador del aula", "Tarea 4.2 · Diagnóstico y puesta a punto de un equipo", "Tarea 4.3 · Estudio de mercado y recomendación"]}], "calificaciones": "Tres categorías, una por criterio (DIG.4.1.2, DIG.4.1.3 y DIG.4.4.4). La Tarea 4.1 usa la escala «No apto, Apto» en DIG.4.1.3. La Tarea 4.2 va en DIG.4.1.3 y la 4.3 en DIG.4.4.4; la nota de cada criterio se calcula con la media de sus líneas de rúbrica en la guía del profesorado y se traslada a Séneca.", "configuracion": ["Escala personalizada «No apto, Apto».", "Rúbricas de 4.2 y 4.3 guardadas como plantilla, con niveles de 1, 3, 5, 7 y 10 puntos.", "Entregas individuales; prórrogas individuales para el alumnado que lo necesite.", "Finalización de actividad activada para que el alumnado vea su progreso."], "area_texto": {"url_clase": "https://florindotic.es/content/curso2026-2027/digitalizacion/4-eso/sda4/clase.html", "bloques": [{"nombre": "Bloque 1 · Fundamentos físicos y lógicos", "descripcion": "Arquitectura Von Neumann y fichas técnicas · Tarea 4.1 en la sesión 3", "sesiones": "1-3"}, {"nombre": "Bloque 2 · Sistemas operativos", "descripcion": "Sistemas operativos y puesta a punto · Tarea 4.2 en la sesión 5", "sesiones": "4-5"}, {"nombre": "Bloque 3 · Estudio de mercado y sostenibilidad", "descripcion": "Reto financiero, sostenibilidad y recomendación · Tarea 4.3 en la sesión 8", "sesiones": "6-9"}]}}, "seneca": {"justificacion": "Para evitar la obsolescencia programada y tomar decisiones de compra sostenibles, el alumnado debe comprender la arquitectura interna de los equipos digitales, la función del software de sistema y la gestión de recursos de hardware. Lo aplica diagnosticando y poniendo a punto un equipo real y elaborando un estudio de mercado con la recomendación fundamentada de un dispositivo para un cliente con un presupuesto acotado, analizando su ciclo de vida.", "actividades": [{"titulo": "Diagnosticamos y ponemos a punto un equipo", "tipo": "Estructuración", "abreviatura": "EST1", "tarea": "4.2", "sesiones": [2, 3, 4, 5], "trazabilidad": "RÚBRICA", "criterios": ["DIG.4.1.2", "DIG.4.1.3"]}, {"titulo": "Estudio de mercado: Compra con cabeza", "tipo": "Conclusión", "abreviatura": "CON1", "tarea": "4.3", "sesiones": [6, 7, 8, 9], "trazabilidad": "RÚBRICA", "criterios": ["DIG.4.1.2", "DIG.4.1.3", "DIG.4.4.4"]}]}, "notas_rigor": ["Los descriptores del Perfil de Salida se derivan de las competencias específicas DIG.4.1 y DIG.4.4 (como en Séneca), por lo que aparecen más de los cinco priorizados por el docente (STEM1, STEM2, CD4, CD5 y CE1). Se pueden dejar seleccionados solo esos cinco en Séneca si el departamento lo prefiere.", "DIG.4.1.2 habla de «instalar» sistemas operativos. En el aula los equipos tienen permisos restringidos, así que la instalación se trabaja con el orden de los pasos y un vídeo o una demostración en máquina virtual; la configuración y el mantenimiento se hacen en equipos reales.", "Saber DIG.4.A.1 vinculado a DIG.4.1.3; DIG.4.A.2 a DIG.4.1.2; DIG.4.D.5 a DIG.4.4.4: todos los saberes movilizados están vinculados oficialmente a los criterios elegidos.", "Datos verificados: Global E-waste Monitor 2024 (62 Mt en 2022; 22,3 % recogido y reciclado de forma documentada) y etiqueta energética de la UE para móviles y tabletas, aplicable desde el 20 de junio de 2025.", "La secuencia sigue los tres bloques previstos por el docente (1-3, 4-5, 6-9). La sesión 1 se mantiene como gancho y diagnóstico dentro del bloque 1, y la sostenibilidad se trabaja al inicio del bloque 3 (sesión 6) para que los criterios verdes se apliquen en el estudio de mercado."], "anexos": {"plantillas": [{"id": "A1", "titulo": "Parte de taller: diagnóstico y puesta a punto", "sesiones": [5], "agrupamiento": "Individual", "herramienta": "Google Docs (una copia por estudiante)", "entrega": "la Tarea 4.2 (PDF)", "docente": "Resuelve en voz alta el primer síntoma como modelo. Si el centro bloquea algún ajuste, vale la captura del aviso con su explicación.", "instrucciones": "Eres técnico/a de **Compra con cabeza**. Álex quiere tirar su portátil. Antes, vamos a **diagnosticarlo** y a poner a punto un equipo real. Escribe frases cortas y usa capturas **sin datos personales**.", "bloques": [{"titulo": "El caso de Álex", "texto": "Portátil de 4 años. Tarda 3 minutos en arrancar, la batería dura 1 hora, el disco está al 95 %, se abren 30 programas al encender y lleva un año sin actualizarse."}, {"titulo": "Parte 1 · Diagnóstico", "tabla": {"columnas": ["Síntoma", "Pieza o software responsable", "Dato o prueba que lo demuestra"], "filas": [["Disco al 95 %", "Almacenamiento lleno (SSD/HDD)", "Captura de Almacenamiento con el espacio libre"], ["Tarda 3 minutos en arrancar"], ["La batería dura 1 hora"], ["30 programas al encender"], ["Un año sin actualizarse"]], "anchos": [5, 6, 7], "alto": 1.4}}, {"campos": ["¿Cuál es el problema principal y por qué?"], "alto": 2}, {"titulo": "Parte 2 · Configuración de mi equipo", "texto": "Pega una captura de cada ajuste y explica qué has visto o cambiado y para qué sirve.", "tabla": {"columnas": ["Ajuste", "Captura", "Qué he visto o cambiado y para qué sirve"], "filas": [["Actualizaciones"], ["Programas de inicio"], ["Almacenamiento"], ["Energía o batería"], ["Cuenta de usuario (estándar o administrador)"], ["Accesibilidad"]], "anchos": [4, 7, 7], "alto": 2.2}}, {"titulo": "Parte 3 · Plan de mantenimiento", "tabla": {"columnas": ["Hábito", "Cada cuánto", "Para qué sirve"], "filas": [["1."], ["2."], ["3."], ["4."], ["5."]], "anchos": [7, 3, 8], "alto": 1.2}}, {"titulo": "Mi decisión para Álex", "casillas": ["Reparar", "Mejorar (cambiar una pieza)", "Cambiar de equipo"], "texto": "Yo le recomiendo a Álex… porque… (usa tu diagnóstico, el coste y el impacto en el planeta)."}, {"lineas": 4}, {"titulo": "Antes de entregar", "casillas": ["He relacionado los cinco síntomas con su causa y su dato.", "He pegado una captura de cada uno de los seis ajustes y he explicado para qué sirve.", "Mis capturas no muestran datos personales.", "He escrito cinco hábitos con su frecuencia.", "He justificado mi decisión para Álex.", "He descargado el documento en PDF para subirlo a la Tarea 4.2."]}], "enlace": "https://docs.google.com/document/d/1Vlw27f0AlxFB
