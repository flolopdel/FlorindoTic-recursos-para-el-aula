<html lang="es">
<head>

<title>SdA 4: Arquitectura, Sistemas Operativos y Elección Consciente</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0;
  --brand:#0f766e; --brand2:#115e59; --brand-soft:#ccfbf1; --accent:#7c3aed; --accent-soft:#ede9fe;
  --warn-bg:#fffbeb; --warn-line:#fcd34d; --warn-ink:#78350f;
  --ce:#1d4ed8; --ce-bg:#dbeafe; --cr:#7c2d12; --cr-bg:#ffedd5; --sb:#166534; --sb-bg:#dcfce7; --de:#6b21a8; --de-bg:#f3e8ff;
  --moodle:#c2410c; --moodle-bg:#fff7ed; --head1:#134e4a; --head2:#1e3a8a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#111a2e; --ink:#e2e8f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#1e293b;
    --brand:#2dd4bf; --brand2:#5eead4; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
    --warn-bg:#2a1f05; --warn-line:#a16207; --warn-ink:#fde68a;
    --ce:#93c5fd; --ce-bg:#1e3a8a; --cr:#fdba74; --cr-bg:#7c2d12; --sb:#86efac; --sb-bg:#14532d; --de:#d8b4fe; --de-bg:#581c87;
    --moodle:#fdba74; --moodle-bg:#2a1608; --head1:#042f2e; --head2:#172554;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2e; --ink:#e2e8f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#1e293b;
  --brand:#2dd4bf; --brand2:#5eead4; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
  --warn-bg:#2a1f05; --warn-line:#a16207; --warn-ink:#fde68a;
  --ce:#93c5fd; --ce-bg:#1e3a8a; --cr:#fdba74; --cr-bg:#7c2d12; --sb:#86efac; --sb-bg:#14532d; --de:#d8b4fe; --de-bg:#581c87;
  --moodle:#fdba74; --moodle-bg:#2a1608; --head1:#042f2e; --head2:#172554;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;padding:28px 0 36px}
header .kicker{font-size:13px;opacity:.85;letter-spacing:.02em}
header h1{margin:8px 0 4px;font-size:clamp(24px,4vw,36px);line-height:1.15}
header .sub{margin:0;opacity:.9;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.meta span{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-size:13px}
.hbtns{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
.btn:hover{background:rgba(255,255,255,.26)}
.notice{margin-top:-18px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:12px 16px;font-size:14px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:16px 0 4px}
nav.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
main{padding:12px 0 48px}
.panel{display:none}.panel.on{display:block}
.grid{display:grid;gap:16px}
@media(min-width:900px){.g3{grid-template-columns:2fr 1fr}.g2{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h2{margin:0 0 10px;font-size:19px}
.card h3{margin:14px 0 6px;font-size:15px}
.card p{margin:6px 0;color:var(--ink2)}
.reto{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;border:0}
.reto p{color:#fff}.reto .q{font-size:19px;font-weight:700}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:10px}
.reto .lab{color:rgba(255,255,255,.8)}
ul.clean{margin:6px 0;padding-left:18px;color:var(--ink2)}ul.clean li{margin:3px 0}
.chip{display:inline-flex;align-items:center;border:0;border-radius:6px;padding:2px 8px;margin:2px 3px 2px 0;font:600 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
.chip:hover{filter:brightness(.95);text-decoration:underline}
.chip.ce{background:var(--ce-bg);color:var(--ce)}.chip.cr{background:var(--cr-bg);color:var(--cr)}
.chip.sb{background:var(--sb-bg);color:var(--sb)}.chip.de{background:var(--de-bg);color:var(--de)}
.chip.off{opacity:.55;text-decoration:line-through}
.legend{font-size:13px;color:var(--muted)}
.timeline{display:flex;height:40px;border-radius:10px;overflow:hidden;margin-top:8px}
.timeline div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;padding:0 6px;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
details.ses{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
details.ses>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
details.ses>summary::-webkit-details-marker{display:none}
.num{flex:none;width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand2);display:flex;align-items:center;justify-content:center;font-weight:800}
.stitle{font-weight:700}.sreto{color:var(--muted);font-size:14px}
.sbody{padding:0 18px 18px;display:grid;gap:16px}
@media(min-width:900px){.sbody{grid-template-columns:3fr 2fr}}
.act{border-left:3px solid var(--brand);padding:4px 0 4px 12px;margin:10px 0}
.act b{color:var(--ink)}.act .min{font-size:12px;color:var(--muted);margin-left:6px}
.act p{margin:2px 0;color:var(--ink2)}
.side{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14px}
.side .lab:first-child{margin-top:0}
.moodle{background:var(--moodle-bg);border:1px solid var(--line);border-left:4px solid var(--moodle);border-radius:10px;padding:10px 14px;margin-top:12px}
.moodle .mh{color:var(--moodle);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.mitem{margin:8px 0}.mitem .mt{font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.scroll{overflow-x:auto}
.tick{text-align:center;color:var(--brand);font-weight:800}
.cot li{list-style:none;margin:6px 0}.cot label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--brand);width:0;transition:width .2s}
.pct{float:right;font-size:12px;font-weight:700;color:var(--brand)}
.copybox{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.copybox .ch{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:6px 12px;font-size:13px;font-weight:700}
.copybox pre{margin:0;padding:10px 12px;white-space:pre-wrap;font:13px/1.5 system-ui,sans-serif;color:var(--ink2)}
.copy{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.note{font-size:13px;color:var(--muted)}
td.rc{cursor:pointer;font-size:13px}td.rc:hover{background:var(--bg)}td.rc.on{background:var(--brand-soft);outline:2px solid var(--brand)}
.rub th{text-align:center}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
#modal .box{background:var(--card);color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#modal .mhd{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
#modal .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--brand)}
#modal h3{margin:2px 0 0;font-size:18px}
#modal .mbd{padding:16px 18px;color:var(--ink2)}
#modal .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
/* anexos (plantillas y formularios) */
.anx{margin-top:16px}
.anx .am{font-size:13px;color:var(--muted);font-style:italic;margin:2px 0 10px}
.anx .doc{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
.anx table.w{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:14px}
.anx table.w th,.anx table.w td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.anx table.w thead th{background:var(--brand-soft);color:var(--ink)}
.anx table.w tbody th{background:var(--bg);width:34%}
.anx .ln{border:1px solid var(--line);border-radius:6px;margin:6px 0 12px;background:repeating-linear-gradient(transparent 0 calc(1.9em - 1px),var(--line) calc(1.9em - 1px) 1.9em)}
.anx h4{margin:14px 0 4px;font-size:15px}
.anx .ck{margin:3px 0}
#gloss{display:none}
#gloss dl{margin:0}#gloss dt{font-weight:700;margin-top:8px}#gloss dd{margin:2px 0 0 0}
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    --bg:#fff; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#cbd5e1;
    --brand:#0f766e; --brand-soft:#ccfbf1; --accent:#7c3aed; --accent-soft:#ede9fe;
    --warn-bg:#fffbeb; --warn-line:#fcd34d; --warn-ink:#78350f;
    --ce:#1d4ed8; --ce-bg:#dbeafe; --cr:#7c2d12; --cr-bg:#ffedd5; --sb:#166534; --sb-bg:#dcfce7; --de:#6b21a8; --de-bg:#f3e8ff;
    --moodle:#c2410c; --moodle-bg:#fff7ed; --head1:#134e4a; --head2:#1e3a8a;
  }
  @page{size:A4;margin:14mm 12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:12px}
  nav.tabs,.hbtns,.filters,.copy,#modal,.notice,#cot-reset{display:none!important}
  header{padding:14px 0 16px}
  .panel{display:block!important;break-before:page}.panel:first-of-type{break-before:auto}
  details.ses>.sbody{display:grid!important}
  .card,tr,.copybox,.anx table.w{break-inside:avoid}
  .copybox pre{white-space:pre-wrap}
  .scroll{overflow:visible!important}
  .anx-p{break-before:page}
  #gloss{display:block;break-before:page}
}
</style>
</head>
