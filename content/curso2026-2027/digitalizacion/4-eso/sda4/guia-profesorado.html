sticas en función de sus necesidades personales, de forma sostenible.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.2"]}, "DIG.4.1.3": {"tipo": "cr", "texto": "Identificar y resolver problemas técnicos sencillos, analizando componentes y funciones de los dispositivos digitales, evaluando las soluciones de manera crítica y reformulando el procedimiento, en caso necesario, fomentando un consumo y reposición de los sistemas digitales y/o tecnológicos de manera sostenible y responsable.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1"]}, "DIG.4.2.1": {"tipo": "cr", "texto": "Gestionar el aprendizaje en el ámbito digital, configurando el entorno personal de aprendizaje mediante la integración de recursos digitales de manera autónoma.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.D.1"]}, "DIG.4.2.2": {"tipo": "cr", "texto": "Buscar, seleccionar y archivar información en función de sus necesidades haciendo uso de las herramientas del entorno personal de aprendizaje con sentido crítico y siguiendo normas básicas de seguridad en la red.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.C.2", "DIG.4.C.3"]}, "DIG.4.2.3": {"tipo": "cr", "texto": "Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.D.1"]}, "DIG.4.2.4": {"tipo": "cr", "texto": "Interactuar en espacios virtuales de comunicación y plataformas de aprendizaje colaborativo, compartiendo y publicando información y datos, adaptándose a diferentes audiencias con una actitud participativa y respetuosa.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.3", "DIG.4.D.5", "DIG.4.D.6"]}, "DIG.4.3.1": {"tipo": "cr", "texto": "Proteger los datos personales y la huella digital generada en internet, configurando las condiciones de privacidad de las redes sociales y espacios virtuales de trabajo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.2"]}, "DIG.4.3.2": {"tipo": "cr", "texto": "Configurar y actualizar contraseñas, sistemas operativos y antivirus de forma periódica en los distintos dispositivos digitales de uso habitual.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.1"]}, "DIG.4.3.3": {"tipo": "cr", "texto": "Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.3"]}, "DIG.4.4.1": {"tipo": "cr", "texto": "Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.5"]}, "DIG.4.4.2": {"tipo": "cr", "texto": "Reconocer las aportaciones de las tecnologías digitales en las gestiones administrativas, y el comercio electrónico, siendo consciente de la brecha social de acceso, uso y aprovechamiento de dichas tecnologías para diversos colectivos.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.4"]}, "DIG.4.4.3": {"tipo": "cr", "texto": "Valorar la importancia de la oportunidad, facilidad y libertad de expresión que suponen los medios digitales conectados, analizando de forma crítica los mensajes que se reciben y transmiten teniendo en cuenta su objetividad, ideología, intencionalidad, sesgos y caducidad.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.6"]}, "DIG.4.4.4": {"tipo": "cr", "texto": "Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.5"]}, "DIG.4.A": {"tipo": "sb", "texto": "Dispositivos digitales, sistemas operativos y de comunicación.", "hijos": ["DIG.4.A.1", "DIG.4.A.2", "DIG.4.A.3", "DIG.4.A.4"], "criterios": []}, "DIG.4.A.1": {"tipo": "sb", "texto": "Arquitectura de ordenadores: elementos, montaje, configuración y resolución de problemas.", "hijos": [], "criterios": ["DIG.4.1.3"]}, "DIG.4.A.2": {"tipo": "sb", "texto": "Sistemas operativos: instalación y configuración de usuario.", "hijos": [], "criterios": ["DIG.4.1.2"]}, "DIG.4.A.3": {"tipo": "sb", "texto": "Sistemas de comunicación e internet: dispositivos de red y funcionamiento. Procedimiento de configuración de una red doméstica y conexión de dispositivos.", "hijos": [], "criterios": []}, "DIG.4.A.4": {"tipo": "sb", "texto": "Dispositivos conectados (IoT + Wearables): configuración y conexión de dispositivos.", "hijos": [], "criterios": []}, "DIG.4.B": {"tipo": "sb", "texto": "Digitalización del entorno personal de aprendizaje.", "hijos": ["DIG.4.B.1", "DIG.4.B.2", "DIG.4.B.3", "DIG.4.B.4"], "criterios": []}, "DIG.4.B.1": {"tipo": "sb", "texto": "Búsqueda, administración, gestión, selección y archivo de información.", "hijos": [], "criterios": []}, "DIG.4.B.2": {"tipo": "sb", "texto": "Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.", "hijos": [], "criterios": []}, "DIG.4.B.3": {"tipo": "sb", "texto": "Comunicación y colaboración en red.", "hijos": [], "criterios": []}, "DIG.4.B.4": {"tipo": "sb", "texto": "Publicación y difusión responsable en redes.", "hijos": [], "criterios": []}, "DIG.4.C": {"tipo": "sb", "texto": "Seguridad y bienestar digital.", "hijos": ["DIG.4.C.1", "DIG.4.C.2", "DIG.4.C.3"], "criterios": []}, "DIG.4.C.1": {"tipo": "sb", "texto": "Seguridad de dispositivos: medidas preventivas y correctivas para hacer frente a riesgos, amenazas y ataques a dispositivos.", "hijos": [], "criterios": []}, "DIG.4.C.2": {"tipo": "sb", "texto": "Seguridad y protección de datos: identidad, reputación digital, privacidad y huella digital. Medidas preventivas en la configuración de redes sociales y la gestión de identidades virtuales.", "hijos": [], "criterios": []}, "DIG.4.C.3": {"tipo": "sb", "texto": "Seguridad en la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).", "hijos": [], "criterios": []}, "DIG.4.D": {"tipo": "sb", "texto": "Ciudadanía digital crítica.", "hijos": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.3", "DIG.4.D.4", "DIG.4.D.5", "DIG.4.D.6"], "criterios": []}, "DIG.4.D.1": {"tipo": "sb", "texto": "Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.", "hijos": [], "criterios": []}, "DIG.4.D.2": {"tipo": "sb", "texto": "Educación mediática: periodismo digital, blogosfera, estrategias comunicativas y uso crítico de la red. Herramientas para detectar noticias falsas y fraudes.", "hijos": [], "criterios": []}, "DIG.4.D.3": {"tipo": "sb", "texto": "Gestiones administrativas: servicios públicos en línea, registros digitales y certificados oficiales.", "hijos": [], "criterios": []}, "DIG.4.D.4": {"tipo": "sb", "texto": "Comercio electrónico: facturas digitales, formas de pago y criptomonedas.", "hijos": [], "criterios": []}, "DIG.4.D.5": {"tipo": "sb", "texto": "Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.", "hijos": [], "criterios": ["DIG.4.4.4"]}, "DIG.4.D.6": {"tipo": "sb", "texto": "Activismo en línea: plataformas de iniciativa ciudadana y cibervoluntariado y comunidades de hardware y software libres.", "hijos": [], "criterios": []}, "CCL1": {"tipo": "de", "texto": "Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.", "competencias": []}, "CCL2": {"tipo": "de", "texto": "Comprende, interpreta y valora con actitud crítica textos orales, escritos, signados o multimodales de los ámbitos personal, social, educativo y profesional para participar en diferentes contextos de manera activa e informada y para construir conocimiento.", "competencias": []}, "CCL3": {"tipo": "de", "texto": "Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": []}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": ["DIG.4.1"]}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": ["DIG.4.1"]}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma cr conclusiones relevantes.", "competencias": []}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["DIG.4.1"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": ["DIG.4.4"]}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": ["DIG.4.4"]}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": ["DIG.4.4"]}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": ["DIG.4.4"]}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": ["DIG.4.4"]}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["DIG.4.1"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": []}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": []}}, "idx": {"criterios": ["DIG.4.1.2", "DIG.4.1.3", "DIG.4.4.4"], "competencias": ["DIG.4.1", "DIG.4.4"], "saberes": ["DIG.4.A.1", "DIG.4.A.2", "DIG.4.D.5"], "descriptores": ["CC1", "CC2", "CC3", "CC4", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "CPSAA5", "STEM1", "STEM2"], "sesionesPorCriterio": {"DIG.4.1.3": [2, 3, 5, 7, 8], "DIG.4.1.2": [4, 5, 8], "DIG.4.4.4": [6, 8]}, "porMateria": [{"codigo": "DIG", "criterios": ["DIG.4.1.2", "DIG.4.1.3", "DIG.4.4.4"], "competencias": ["DIG.4.1", "DIG.4.4"], "saberes": ["DIG.4.A.1", "DIG.4.A.2", "DIG.4.D.5"], "descriptores": ["CC1", "CC2", "CC3", "CC4", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "CPSAA5", "STEM1", "STEM2"]}], "materiasTxt": "Digitalización", "mapaAlumnado": {"DIG.4.1.2": [], "DIG.4.1.3": [], "DIG.4.4.4": []}, "multinivel": []}, "seneca": {"titulo": "SdA 4: Arquitectura, Sistemas Operativos y Elección Consciente", "temporalizacion": "9 sesiones", "justificacion": "Para evitar la obsolescencia programada y tomar decisiones de compra sostenibles, el alumnado debe comprender la arquitectura interna de los equipos digitales, la función del software de sistema y la gestión de recursos de hardware. Lo aplica diagnosticando y poniendo a punto un equipo real y elaborando un estudio de mercado con la recomendación fundamentada de un dispositivo para un cliente con un presupuesto acotado, analizando su ciclo de vida.", "producto_final": "Informe comparativo y estudio de mercado en formato digital (Google Docs, con resumen visual opcional en Canva o Genially) con la recomendación fundamentada de un ordenador, smartphone o smartwatch para un cliente con un presupuesto acotado y unas especificaciones técnicas concretas, que analiza además el ciclo de vida del producto.", "concrecion": [{"materia": "Digitalización", "texto": "COMPETENCIAS ESPECÍFICAS\nDIG.4.1.Identificar y resolver problemas técnicos sencillos, conectar y configurar dispositivos a redes domésticas, aplicando los conocimientos de hardware y sistemas operativos, para gestionar de forma sostenible las herramientas e instalaciones informáticas y de comunicación de uso cotidiano.\nDIG.4.4.Ejercer una ciudadanía digital crítica, conociendo las posibles acciones que realizar en la red, e identificando sus repercusiones, para hacer un uso activo, responsable y ético de la tecnología.\n\nCRITERIOS DE EVALUACIÓN\nDIG.4.1.2.Instalar y mantener sistemas operativos, configurando sus características en función de sus necesidades personales, de forma sostenible.\nDIG.4.1.3.Identificar y resolver problemas técnicos sencillos, analizando componentes y funciones de los dispositivos digitales, evaluando las soluciones de manera crítica y reformulando el procedimiento, en caso necesario, fomentando un consumo y reposición de los sistemas digitales y/o tecnológicos de manera sostenible y responsable.\nDIG.4.4.4.Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.\n\nSABERES BÁSICOS\nDIG.4.A.1.Arquitectura de ordenadores: elementos, montaje, configuración y resolución de problemas.\nDIG.4.A.2.Sistemas operativos: instalación y configuración de usuario.\nDIG.4.D.5.Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.\n\nDESCRIPTORES OPERATIVOS\nCC1. Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia."}], "actividades": [{"titulo": "Diagnosticamos y ponemos a punto un equipo", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "1", "tarea": "4.2 · Diagnóstico y puesta a punto de un equipo", "descripcion": "Sesión 2 (50 min): Arquitectura Von Neumann: el ordenador es como un cuerpo\nReto: Identificar las piezas principales de un ordenador, saber qué hace cada una y encontrarlas en un móvil y un smartwatch.\n- Unboxing al revés (8 min). El docente abre delante del grupo un ordenador viejo (desenchufado) y pregunta qué creen que es cada pieza. Normas de seguridad: siempre desenchufado, no abrir la fuente de alimentación, tocar una parte metálica antes de coger piezas y sujetar las tarjetas por los bordes.\n- El cuerpo del ordenador (10 min). El docente explica la arquitectura Von Neumann (entrada → CPU ↔ memoria → salida, con los datos y los programas en la misma memoria) con la analogía del cuerpo humano: la CPU es el cerebro, la RAM es la memoria a corto plazo (rápida, pero se olvida al apagar), el disco (SSD o HDD) es la memoria a largo plazo, los periféricos son los sentidos (entrada: teclado, cámara, micrófono, sensores; salida: pantalla, altavoz), la placa base es el sistema nervioso que lo conecta todo y la fuente o la batería es la energía que da la comida.\n- Estaciones de componentes (17 min). Por parejas, el alumnado rota por cuatro mesas con piezas reales: 1) módulos de RAM, 2) un disco HDD y un SSD, 3) procesador con disipador y ventilador, y una tarjeta gráfica (GPU) si hay, 4) placa base y fuente. En cada mesa escribe en el cuaderno: nombre de la pieza, a qué parte del cuerpo se parece, para qué sirve y si el móvil tiene algo parecido. Si no hay piezas suficientes, una mesa usa fotos ampliadas.\n- Ordenador, móvil y reloj (8 min). Comparación guiada: en el móvil y en el smartwatch casi todo va en un solo chip (SoC: CPU, gráfica y módem juntos), la RAM y el almacenamiento van soldados y la batería suele ir pegada. Conclusión: un sobremesa se puede ampliar y reparar por piezas; un móvil o un reloj, mucho menos.\n- Comprobación rápida (7 min). Quiz de cuatro preguntas en la web de clase; el alumnado responde levantando la mano o con tarjetas A, B y C, y se corrige al momento.\n- Evidencia: Tabla pieza-función-equivalente en el móvil (cuaderno)\n- Evidencia: Respuestas al quiz\n\nSesión 3 (50 min): Leer una ficha técnica sin que te la cuelen\nReto: Entender los números de una ficha técnica y obtener las especificaciones reales del ordenador del aula.\n- La ficha trampa (8 min). El docente proyecta dos anuncios ficticios de portátiles a 399 €: el A presume de «¡1 TB!» pero tiene 4 GB de RAM, disco duro mecánico y procesador básico; el B tiene 512 GB SSD, 8 GB de RAM y un procesador de gama media. El alumnado vota cuál compraría y descubre por qué el A es una trampa.\n- Los números que importan (12 min). Explicación breve con tarjetas: GHz y núcleos (CPU), GB de RAM, gráfica (GPU integrada o dedicada), GB/TB y tipo de almacenamiento (SSD frente a HDD), pulgadas y resolución, batería en mAh (móvil) o Wh (portátil), y sistema operativo con su versión. Se proyecta una tabla orientativa de mínimos recomendados para estudiar, para jugar y para editar vídeo.\n- Radiografía del ordenador del aula (22 min). Cada estudiante busca en su ordenador del aula: procesador y núcleos, RAM, almacenamiento (tipo y capacidad), sistema operativo y versión. En Windows: Configuración > Sistema > Información y Administrador de tareas > Rendimiento; en Linux: Configuración > Acerca de y Monitor del sistema. Hace dos capturas (especificaciones y gráfica de rendimiento) y las entrega con los cinco datos en la Tarea 4.1.\n- ¿Sirve para…? (8 min). Puesta en común: con los datos del ordenador del aula, ¿sirve para estudiar?, ¿para editar un vídeo de TikTok en 4K?, ¿para jugar a Fortnite? Cada respuesta se justifica con un número de la ficha.\n- Moodle Centros: Tarea «4.1 · Radiografía del ordenador del aula» (corrección Apto / No apto). Comprobar que cada estudiante sabe localizar y anotar las especificaciones reales de un equipo antes de empezar el diagnóstico.\n- Evidencia: Tarea 4.1 · Radiografía del ordenador del aula\n\nSesión 4 (50 min): El sistema operativo: funciones, instalación y comparación\nReto: Comprobar cómo el sistema operativo reparte la CPU y la RAM y conocer los pasos para instalar y mantener uno.\n- El árbitro del partido (7 min). El docente compara el sistema operativo con un árbitro o un jefe de obra: decide qué programa usa la CPU en cada momento, reparte la RAM, organiza los archivos, controla los dispositivos (impresora, cámara, wifi), gestiona usuarios y permisos y protege el equipo. Sin sistema operativo, el hardware no sabe qué hacer.\n- Prueba de estrés (13 min). Cada estudiante abre el Administrador de tareas (o Monitor del sistema) y anota en el cuaderno el uso de CPU y RAM con 1 pestaña, con 5 pestañas y con 15 pestañas y un vídeo. Después cierra desde el administrador el proceso que más memoria consume y observa cómo baja. Conclusión: el sistema operativo gestiona los recursos y nosotros podemos ayudarle.\n- Escritorio frente a móvil (8 min). Por parejas, el alumnado completa en el cuaderno una tabla comparativa de sistemas operativos de escritorio (Windows, Linux, macOS) y móviles (Android, iOS): dispositivos, libre o privativo, cómo se instalan programas (tienda o instalador), gestión de usuarios y permisos, y cuántos años reciben actualizaciones. Ejemplo real: Windows 10 dejó de tener soporte gratuito el 14 de octubre de 2025 y muchos equipos que funcionaban bien no podían pasar a Windows 11; una alternativa es instalar un Linux ligero. Se citan también los SO de relojes (Wear OS, watchOS).\n- ¿Cómo se instala un sistema operativo? (14 min). Se ve un fragmento de vídeo de la instalación de Ubuntu (o una demostración del docente en una máquina virtual) y, por parejas, se ordenan en el cuaderno los pasos de la instalación: copia de seguridad, crear un USB de arranque, arrancar desde el USB (menú de arranque o UEFI), elegir idioma y teclado, elegir el disco o partición, crear el usuario y la contraseña, instalar actualizaciones y controladores.\n- Comprobación rápida (8 min). Quiz en la web de clase sobre funciones del sistema operativo e instalación; se corrige al momento y se aclaran dudas.\n- Evidencia: Tabla de la prueba de estrés (cuaderno)\n- Evidencia: Pasos de instalación ordenados (cuaderno)\n\nSesión 5 (50 min): Taller de puesta a punto\nReto: Diagnosticar por qué un equipo va lento y aplicar configuraciones del sistema operativo que alarguen su vida.\n- El portátil de Álex (8 min). El docente presenta el caso: un portátil de 4 años que tarda 3 minutos en arrancar, la batería dura una hora, el disco está al 95 %, arrancan 30 programas al encender y lleva un año sin actualizarse. Álex quiere tirarlo y comprar otro. ¿Hay que cambiarlo o se puede salvar?\n- Diagnóstico guiado (12 min). Individualmente, en la parte 1 de la plantilla A1, el alumnado relaciona cada síntoma con la pieza o el software responsable y con el dato que lo demuestra (p. ej. «disco al 95 % → almacenamiento lleno → captura de Almacenamiento»). Se corrige el primero entre todos como modelo.\n- Configuración real (20 min). En su ordenador del aula (con su usuario) y, si quiere, en su móvil, cada estudiante revisa y configura: actualizaciones pendientes, programas de inicio, almacenamiento (Sensor de almacenamiento o liberar espacio), plan de energía o batería, tipo de cuenta de usuario (estándar o administrador) y una opción de accesibilidad. Hace una captura de cada ajuste, sin datos personales, en la parte 2 de A1. Si un ajuste está bloqueado por el centro, lo explica con la captura del aviso.\n- Plan de mantenimiento y entrega (10 min). En la parte 3 de A1 escribe cinco hábitos de mantenimiento (actualizar, copia de seguridad, limpiar inicio y almacenamiento, cuidar la batería, contraseña y cuenta estándar) y decide para el portátil de Álex: reparar, mejorar o cambiar, justificándolo. Revisa la lista «Antes de entregar» y sube el PDF a la Tarea 4.2.\n- Moodle Centros: Tarea «4.2 · Diagnóstico y puesta a punto de un equipo» (evaluada con rúbrica 1-3-5-7-10). Primera Tarea evaluable: el alumnado demuestra que identifica componentes y causas de un problema técnico y que configura y mantiene el sistema operativo de forma sostenible. Se entrega la plantilla A1 en PDF.\n- Evidencia: Tarea 4.2 · Diagnóstico y puesta a punto (plantilla A1)", "temporalizacion": "4 sesiónes", "recursos": "Ordenadores viejos, Piezas sueltas, Proyector, Ordenadores del aula, Moodle Centros, Vídeo de instalación, Plantilla A1", "descriptores": "CD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nDIG.4.1.2.Instalar y mantener sistemas operativos, configurando sus características en función de sus necesidades personales, de forma sostenible.\nDIG.4.1.3.Identificar y resolver problemas técnicos sencillos, analizando componentes y funciones de los dispositivos digitales, evaluando las soluciones de manera crítica y reformulando el procedimiento, en caso necesario, fomentando un consumo y reposición de los sistemas digitales y/o tecnológicos de manera sostenible y responsable.", "ejercicios": "Relaciona la CPU, la RAM, el disco y los periféricos con el cerebro, la memoria a corto plazo, la memoria a largo plazo y los sentidos, y explica para qué sirve cada pieza.\nIndica qué piezas del ordenador están dentro del SoC de un móvil.\nExplica por qué es más fácil reparar un sobremesa que un smartwatch.\nExplica por qué el portátil con «1 TB» y 4 GB de RAM es una mala compra.\nAnota el procesador, los núcleos, la RAM, el almacenamiento y el sistema operativo de tu ordenador del aula.\nDecide si el ordenador del aula sirve para editar vídeo y justifícalo con un dato.\nAnota el uso de CPU y RAM con 1, 5 y 15 pestañas abiertas y explica qué ha pasado.\nEscribe cuatro funciones del sistema operativo.\nOrdena los pasos para instalar un sistema operativo.\nRelaciona cada síntoma del portátil de Álex con la pieza o el software responsable.\nConfigura en tu equipo las actualizaciones, los programas de inicio, el almacenamiento y la energía, y haz una captura de cada ajuste.\nEscribe cinco hábitos de mantenimiento y decide si el portátil de Álex se repara, se mejora o se cambia.", "metodologias": "Aprendizaje manipulativo, Trabajo en parejas, Estudio de casos, Modelado y andamiaje, Aprendizaje por descubrimiento", "sesiones": [2, 3, 4, 5]}, {"titulo": "Estudio de mercado: Compra con cabeza", "tipo": "Conclusión", "abreviatura": "CON1", "orden": "2", "tarea": "4.3 · Estudio de mercado y recomendación", "descripcion": "Sesión 6 (50 min): Obsolescencia programada y ciclo de vida\nReto: Distinguir los tipos de obsolescencia, recorrer el ciclo de vida de un móvil y elegir nuestros criterios de compra sostenible.\n- ¿Programada o percibida? (8 min). Tres casos cortos para clasificar: un ordenador que funciona pero se queda sin actualizaciones de seguridad (obsolescencia de software), un móvil con la batería pegada que no se puede cambiar fácilmente (obsolescencia técnica o por diseño) y un modelo nuevo cada año con cambios mínimos que nos hace sentir que el nuestro está «viejo» (obsolescencia percibida). El alumnado vota y justifica.\n- El viaje de un móvil (12 min). Con la infografía del ciclo de vida: extracción de materias primas (litio, cobalto, coltán), fabricación, transporte, uso (energía, actualizaciones, reparaciones) y fin de vida (reutilizar, reparar, reacondicionar, reciclar en un punto limpio). El alumnado señala en qué fase está el mayor impacto y en cuáles puede influir como consumidor.\n- El dato (5 min). Se recupera el dato de la sesión 1 (62 millones de toneladas de residuos electrónicos en 2022, 22,3 % reciclado de forma documentada) y se compara con lo que hizo la clase con su último móvil según la encuesta F1.\n- La etiqueta que lo cuenta (10 min). El docente presenta la etiqueta energética de la UE para móviles y tabletas, obligatoria desde el 20 de junio de 2025: clase de eficiencia (A-G), autonomía de la batería, ciclos de carga hasta el 80 % de capacidad, resistencia a caídas (A-E), reparabilidad (A-E) y protección IP. Por parejas, leen una etiqueta de ejemplo y responden tres preguntas.\n- Mis 5 criterios verdes (15 min). Individualmente, cada estudiante escribe en el cuaderno los cinco criterios de sostenibilidad que usará en su estudio de mercado (p. ej. reparabilidad, años de actualizaciones, batería reemplazable, opción reacondicionada, qué hacer con el aparato viejo) y explica cada uno en una frase. Los usará en la plantilla A2.\n- Evidencia: Clasificación de los tres casos\n- Evidencia: Mis 5 criterios verdes (cuaderno)\n\nSesión 7 (50 min): Estudio de mercado I: el encargo\nReto: Elegir un cliente, traducir sus necesidades a especificaciones técnicas y encontrar tres candidatos dentro de su presupuesto.\n- Elige tu cliente (7 min). El docente proyecta seis tarjetas de cliente con necesidades y presupuesto: Lucía (portátil para Bachillerato y editar vídeos de TikTok, 650 €), Manuel (72 años, smartphone sencillo para videollamadas y con mucha batería, 200 €), Sara (PC o portátil para jugar a Fortnite y Minecraft, 800 €), Hugo (smartwatch con GPS para correr y montar en bici, 150 €), la familia Ruiz (sobremesa para deberes y gestiones, 450 €) y Nora (smartphone con buena cámara para empezar en Instagram, 350 €). Cada estudiante elige uno; las parejas pueden compartir cliente, pero cada estudiante entrega su informe.\n- De necesidades a especificaciones (10 min). Planteamiento del reto financiero: con un presupuesto fijo hay que repartir el dinero entre procesador, RAM, gráfica (GPU), almacenamiento y batería según lo que necesita el cliente. Ejemplo resuelto con un cliente que no está en la lista: «quiere ver series y hacer trabajos en Google Docs» → 8 GB de RAM, SSD de 256 GB, GPU integrada, batería de al menos 8 horas, sistema operativo con actualizaciones al menos hasta 2031; no merece la pena pagar una GPU dedicada. Después cada estudiante completa la parte 1 de A2 con las especificaciones mínimas de su cliente.\n- Búsqueda de tres candidatos (23 min). Con su pareja de apoyo, cada estudiante busca tres modelos dentro del presupuesto en webs de fabricantes y tiendas (al menos uno reacondicionado o de la generación anterior) y completa la tabla comparativa de la parte 2 de A2: precio, procesador, RAM, gráfica (GPU), almacenamiento, pantalla, batería, coste por año de uso, sistema operativo y años de actualizaciones, reparabilidad y enlace. Se recuerda comprobar los datos en la web del fabricante.\n- Control de calidad (10 min). La pareja intercambia la tabla y revisa cuatro cosas: los tres modelos caben en el presupuesto, no hay casillas vacías, cada dato tiene enlace y al menos uno es reacondicionado o anterior. Se corrige lo que falte.\n- Evidencia: Plantilla A2, partes 1 y 2 (tabla comparativa)\n\nSesión 8 (50 min): Estudio de mercado II: la recomendación\nReto: Analizar el ciclo de vida del dispositivo elegido y escribir una recomendación fundamentada para el cliente.\n- Una recomendación que convence (7 min). El docente proyecta una recomendación modelo con la estructura «Te recomiendo X porque… (dos datos técnicos). Aunque… (un punto débil). Además, durará porque… (actualizaciones, reparabilidad, batería). Con tu dispositivo viejo puedes…». Se señala qué la hace convincente: datos, comparación y honestidad.\n- Ciclo de vida del elegido (15 min). En la parte 3 de A2, cada estudiante analiza el modelo que va a recomendar con sus cinco criterios verdes: años de actualizaciones del sistema operativo, reparabilidad (etiqueta UE, web del fabricante o puntuaciones de reparabilidad), batería reemplazable o ciclos, si es reacondicionado, y qué hacer con el dispositivo viejo del cliente (vender, donar, reacondicionar o llevar a un punto limpio).\n- Mi recomendación (18 min). En la parte 4 de A2, cada estudiante escribe la recomendación para su cliente siguiendo el modelo e incluye una frase sobre accesibilidad (si el dispositivo es fácil de usar para esa persona). Quien quiera añade un resumen visual de una diapositiva tipo publicación de Instagram, hecho en Canva o Genially, y pega su enlace en A2.\n- Revisión y entrega (10 min). Cada estudiante repasa la lista «Antes de entregar» de A2, su pareja le lee la recomendación en voz alta para ver si se entiende, descarga el documento en PDF y lo sube a la Tarea 4.3.\n- Moodle Centros: Tarea «4.3 · Estudio de mercado y recomendación» (evaluada con rúbrica 1-3-5-7-10). Producto final de la SdA: informe comparativo y estudio de mercado con la recomendación fundamentada y el análisis del ciclo de vida. Se entrega la plantilla A2 en PDF (con el enlace al resumen visual si lo hay).\n- Evidencia: Tarea 4.3 · Estudio de mercado y recomendación (plantilla A2)\n\nSesión 9 (50 min): Feria «Compra con cabeza»\nReto: Compartir las recomendaciones, valorar las de otros compañeros y comprometernos con un uso más sostenible de nuestros dispositivos.\n- Paseo por la galería (20 min). Cada estudiante deja abierto en su pantalla el resumen visual o la recomendación de su informe. El alumnado pasea por el aula y visita al menos tres recomendaciones de clientes distintos; en cada una deja un pósit con «Me convence porque…» y «Yo cambiaría…». Las parejas no pueden visitarse entre sí.\n- Premio «Compra con cabeza» (5 min). Cada estudiante vota a mano alzada la recomendación más convincente por cliente. El docente destaca en voz alta qué dato o argumento hizo ganar a cada una (sin nota: es un reconocimiento).\n- Autoevaluación (12 min). Cada estudiante responde el formulario F2 de autoevaluación: cómo valora su informe en cada línea de la rúbrica, qué le costó más y qué ha aprendido sobre su propio móvil u ordenador.\n- Mi compromiso (13 min). En el cuaderno, cada estudiante vuelve a la página de la function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':''); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

/* ---------- cabecera ---------- */
const M = S.meta;
$('#h-kicker').textContent = `LOMLOE · Andalucía · ${IDX.materiasTxt} · ${M.curso_texto || ''}`;
$('#h-title').textContent = M.titulo; $('#h-sub').textContent = M.subtitulo || '';
$('#h-meta').innerHTML = [ `${S.sesiones.length} sesiones de ${M.duracion_sesion||50} min`, M.agrupamiento, M.temporalizacion, M.anio_academico ].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');

/* ---------- pestañas ---------- */
const TABS = [['vision','1. Visión general'],['seq','2. Secuenciación'],['map','3. Mapeo curricular'],['moodle','4. Moodle Centros'],['dua','5. DUA y diversidad'],['eval','6. Evaluación'],['seneca','7. Para Séneca']];
const HAY_ANX = !!(S.anexos && ((S.anexos.plantillas||[]).length || (S.anexos.formularios||[]).length));
if (HAY_ANX) TABS.push(['anx', (TABS.length+1)+'. Anexos']);
if (S.creditos) TABS.push(['cred', (TABS.length+1)+'. Créditos']);
$('#tabs').innerHTML = TABS.map(([id,t],i)=>`<button role="tab" data-tab="${id}" aria-selected="${i===0}">${t}</button>`).join('');
$('#main').innerHTML = TABS.map(([id],i)=>`<section class="panel ${i===0?'on':''}" id="p-${id}" role="tabpanel"></section>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+b.dataset.tab)); try{localStorage.setItem('sda-tab',b.dataset.tab)}catch(_){} };
try{ const t = localStorage.getItem('sda-tab'); if(t){ const b = document.querySelector(`#tabs button[data-tab="${t}"]`); b && b.click(); } }catch(_){}
function openAll(){ document.querySelectorAll('details.ses').forEach(d=>d.open=true); }

      <div class="lab">Criterios de evaluación</div>${chips(IDX.criterios)}

    <div class="card reto"><h2>El reto</h2><p><i>${esc(V.reto)}</i></p><div class="lab">Pregunta guía</div><p class="q">${esc(V.pregunta_guia)}</p></div>

    <div class="card"><h2>Recursos</h2>${Array.isArray(rec)?ul(rec):Object.entries(rec).map(([k,v])=>`<div class="lab">${esc(k)}</div>${ul(v)}`).join('')}</div>

/* ---------- 2. secuenciación ---------- */
(function(){
  const COLORS = ['#2563eb','#0891b2','#0f766e','#7c3aed','#b45309','#be123c'];
  const fases = arr(S.fases);
  const total = S.sesiones.length;
  const fcol = {}; fases.forEach((f,i)=>fcol[f.nombre]=COLORS[i%COLORS.length]);
  const count = f => S.sesiones.filter(s=>s.fase===f.nombre).length;
  let h = `<div class="card"><h2>Distribución temporal</h2><div class="timeline">${fases.map(f=>`<div style="flex:${count(f)};background:${fcol[f.nombre]}">${esc(f.nombre)} · ${count(f)} ses.</div>`).join('')}</div>
    <div class="grid g2" style="margin-top:12px">${fases.map(f=>`<div><b style="color:${fcol[f.nombre]}">${esc(f.nombre)}</b> (sesiones ${esc(f.sesiones||'')}) — ${esc(f.finalidad||'')} · ${Math.round(count(f)/total*100)} %</div>`).join('')}</div></div>`;
  const duaSet = [...new Set(S.sesiones.flatMap(s=>arr(s.dua && s.dua.principios)))];
  h += `<div class="filters" id="ff"><span class="legend">Fase:</span><button class="on" data-f="*">Todas</button>${fases.map(f=>`<button data-f="${esc(f.nombre)}">${esc(f.nombre)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">DUA:</span>${duaSet.map(d=>`<button data-d="${esc(d)}">${esc(d)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">Moodle:</span><button data-m="1">Con actividad Moodle</button>
    <button data-open="1" style="margin-left:auto">Desplegar todas</button></div><div id="slist"></div>`;
  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){
    const list = S.sesiones.filter(s => (state.f==='*'||s.fase===state.f) && (!state.d || arr(s.dua&&s.dua.principios).includes(state.d)) && (!state.m || arr(s.moodle).length));
    $('#slist').innerHTML = list.map(s => `<details class="ses" data-n="${s.n}"><summary><div class="num" style="background:${fcol[s.fase]}22;color:${fcol[s.fase]}">${s.n}</div>
      <div><div class="stitle">Sesión ${s.n} · ${esc(s.titulo)} <span class="badge">${esc(s.fase)}</span>${arr(s.moodle).length?'<span class="badge" style="background:var(--moodle-bg);color:var(--moodle)">Moodle</span>':''}</div><div class="sreto">${esc(s.reto)}</div></div></summary>
      <div class="sbody"><div>${arr(s.actividades).map(a=>`<div class="act"><b>${esc(a.nombre)}</b><span class="min">${a.min?esc(a.min)+' min':''}</span><p>${esc(a.desc)}</p></div>`).join('')}
        ${arr(s.moodle).length?`<div class="moodle"><div class="mh">Integración con Moodle Centros</div>${arr(s.moodle).map(m=>`<div class="mitem"><div class="mt">${esc(m.recurso)} · «${esc(m.nombre)}»${corrBadge(m)}${m.criterio?' '+chip(m.criterio):''}</div><p>${esc(m.uso)}</p>${m.correccion==='apto'?`<div class="lab">Se verifica</div>${ul(m.cotejo)}`:''}${m.correccion==='rubrica'?`<p class="note">Se evalúa con la rúbrica de la pestaña «6. Evaluación».</p>`:''}${arr(m.config).length?`<div class="lab">Configuración</div>`+ul(m.config):''}</div>`).join('')}</div>`:''}
      </div><div class="side">
        <div class="lab">Criterios</div>${arr(s.criterios).length?chips(s.criterios):'<span class="note">Evaluación diagnóstica (no calificable)</span>'}
        <div class="lab">Saberes</div>${chips(s.saberes)}
        ${arr(s.metodologia).length?`<div class="lab">Metodología</div><p>${arr(s.metodologia).map(esc).join(' · ')}</p>`:''}
        ${arr(s.evidencias).length?`<div class="lab">Evidencias</div>${ul(s.evidencias)}`:''}
        ${arr(s.recursos).length?`<div class="lab">Recursos</div><p>${arr(s.recursos).map(esc).join(' · ')}</p>`:''}
        ${s.dua?`<div class="lab">DUA (${arr(s.dua.principios).map(esc).join(', ')})</div><p>${esc(s.dua.medidas)}</p>`:''}
      </div></div></details>`).join('') || '<p class="note">Ninguna sesión coincide con el filtro.</p>';
  }
  $('#ff').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.open){ openAll(); return; }
    if(b.dataset.f){ state.f=b.dataset.f; $('#ff').querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); }
    if(b.dataset.d){ state.d = state.d===b.dataset.d?null:b.dataset.d; $('#ff').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===state.d)); }
    if(b.dataset.m){ state.m=!state.m; b.classList.toggle('on',state.m); }
    render(); };
  render();
})();

/* ---------- 3. mapeo ---------- */
(function(){
  const used = new Set(IDX.saberes);
  const inst = (S.evaluacion && S.evaluacion.instrumentos) || {};
  let h = `<div class="card"><h2>Matriz curricular</h2><p class="legend">Los saberes tachados están vinculados oficialmente al criterio pero no se movilizan en esta situación de aprendizaje.</p><div class="scroll"><table class="tbl"><thead><tr><th>Competencia</th><th>Criterio</th><th>Saberes</th><th>Descriptores</th><th>Sesiones</th><th>Instrumentos</th></tr></thead><tbody>`;
  IDX.criterios.forEach(c => { const it = CUR[c]; const ce = CUR[it.competencia];
    h += `<tr><td>${chip(it.competencia)}<div class="note">${esc(ce.texto)}</div></td><td>${chip(c)}<div class="note">${esc(it.texto)}</div></td>
      <td>${arr(it.saberes).map(s=>chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}</td><td>${chips(ce.descriptores)}</td>
      <td>${(IDX.sesionesPorCriterio[c]||[]).map(n=>'S'+n).join(', ')}</td><td>${ul(inst[c])}</td></tr>`; });
  h += `</tbody></table></div></div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Criterios trabajados por sesión</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${S.sesiones.map(s=>`<th>S${s.n}</th>`).join('')}</tr></thead><tbody>`;
  IDX.criterios.forEach(c => { h += `<tr><td>${chip(c)}</td>${S.sesiones.map(s=>`<td class="tick">${arr(s.criterios).includes(c)?'✔':''}</td>`).join('')}</tr>`; });
  h += `</tbody></table></div></div>`;
  const MA = IDX.mapaAlumnado || {};
  if(Object.values(MA).some(v=>v.length)) h += `<div class="card" style="margin-top:16px"><h2>Dónde se evidencia cada criterio en la guía del alumnado</h2><p class="note">Apartados y actividades de la guía del alumnado que dejan evidencia de cada criterio.</p><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th><th>Apartado y actividad</th><th>Sesiones</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${arr(MA[c]).map(x=>`<div><b>${esc(x.apartado)}</b> → ${esc(x.actividad)}</div>`).join('') || '<span class="note">—</span>'}</td><td>${[...new Set(arr(MA[c]).flatMap(x=>x.sesiones))].sort((a,b)=>a-b).map(n=>'S'+n).join(', ')}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(S.notas_rigor).length) h += `<div class="card" style="margin-top:16px"><h2>Notas de rigor curricular</h2>${ul(S.notas_rigor)}</div>`;
  $('#p-map').innerHTML = h;
})();

/* ---------- 4. moodle ---------- */
(function(){
  const Mo = S.moodle || {};
  // Criterios de una Tarea: el principal y los de cada línea de su rúbrica (así llegan todos a Séneca)
  const critsDe = m => [...new Set([m.criterio, ...arr(m.rubrica).map(l=>l.criterio)].filter(Boolean))];
  const all = S.sesiones.flatMap(s => arr(s.moodle).map(m => ({...m, n:s.n})));
  let h = `<div class="grid g2"><div class="card"><h2>Estructura del curso</h2>${Mo.estructura?`<p>${esc(Mo.estructura)}</p>`:''}${arr(Mo.secciones).map(sec=>`<div class="lab">${esc(sec.nombre)}</div>${ul(sec.elementos)}`).join('')}</div>
    <div class="card"><h2>Libro de calificaciones</h2>${Mo.calificaciones?`<p>${esc(Mo.calificaciones)}</p>`:''}<p class="note">Una Tarea con rúbrica aparece en todos los criterios que evalúan sus líneas; la nota de cada criterio la calcula la pestaña «Evaluación» y es la que se pasa a Séneca.</p>
      <table class="tbl"><thead><tr><th>Criterio</th><th>Elementos calificables en Moodle</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${all.filter(m=>m.calificable && critsDe(m).includes(c)).map(m=>{ const ls = arr(m.rubrica).filter(l=>l.criterio===c).map(l=>l.linea);
        return `S${m.n} · ${esc(m.recurso)} «${esc(m.nombre)}»${ls.length && critsDe(m).length>1 ? `<div class="note">Líneas de la rúbrica: ${ls.map(esc).join(' · ')}</div>` : ''}`; }).join('<br>') || '<span class="note">Se califica fuera de Moodle (observación, exposición…)</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(Mo.configuracion).length) h += `<div class="card" style="margin-top:16px"><h2>Configuración general recomendada</h2>${ul(Mo.configuracion)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Todas las actividades de Moodle</h2><div class="scroll"><table class="tbl"><thead><tr><th>Sesión</th><th>Recurso</th><th>Nombre</th><th>Corrección</th><th>Para qué</th><th>Configuración clave</th></tr></thead><tbody>${all.map(m=>`<tr><td>S${m.n}</td><td>${esc(m.recurso)}</td><td>${esc(m.nombre)} ${chips(critsDe(m))}</td><td>${corrBadge(m)||'—'}</td><td>${esc(m.uso)}</td><td>${ul(m.config)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#p-moodle').innerHTML = h;
})();

/* ---------- 5. DUA ---------- */

/* ---------- 6. evaluación ---------- */
(function(){
  const E = S.evaluacion || {};
  let st = {}; try{ st = JSON.parse(localStorage.getItem('sda-cotejo-'+M.titulo)||'{}'); }catch(_){}
  let h = `<div class="card"><h2>Lista de cotejo interactiva</h2><p class="note">Marca los indicadores logrados; el progreso se calcula por criterio y se guarda en este navegador.</p>
    <div class="grid g2">${arr(E.cotejo).map((g,gi)=>`<div class="side"><span class="pct" data-p="${gi}"></span>${chip(g.criterio)}<div class="bar"><div data-b="${gi}"></div></div><ul class="cot" style="padding:0">${arr(g.indicadores).map((t,i)=>`<li><label><input type="checkbox" data-k="${gi}-${i}" ${st[gi+'-'+i]?'checked':''}> <span>${esc(t)}</span></label></li>`).join('')}</ul></div>`).join('')}</div>
    <button class="copy" id="cot-reset" style="margin-top:10px">Borrar marcas</button></div>`;
  const TR = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='rubrica').map(m=>({...m,n:x.n})));
  const TA = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='apto').map(m=>({...m,n:x.n})));
  const PTS = [1,3,5,7,10];
  if(TR.length) h += `<div class="card" style="margin-top:16px"><h2>Rúbricas de las tareas finales</h2><p class="note">Cada línea se puntúa con 1, 3, 5, 7 o 10 puntos y la nota es la media (ponderada cuando la línea indica su peso). Pulsa una casilla para calcular la nota de un estudiante (no se guarda).</p>${TR.map((m,ti)=>`<h3>${tname(m)} ${chips([...new Set(arr(m.rubrica).map(l=>l.criterio||m.criterio))])} <span class="pct" data-rn="${ti}"></span></h3><div class="scroll"><table class="tbl rub" data-t="${ti}"><thead><tr><th>Línea</th>${PTS.map(p=>`<th>${p} pto</th>`).join('')}</tr></thead><tbody>${arr(m.rubrica).map((l,li)=>`<tr><td><b>${esc(l.linea)}</b>${l.criterio?`<br><small>${esc(l.criterio)}</small>`:''}${l.peso?`<br><small>peso ${String(l.peso).replace('.',',')} %</small>`:''}</td>${arr(l.niveles).map((x,k)=>`<td class="rc" data-l="${li}" data-w="${l.peso||1}" data-c="${esc(l.criterio||m.criterio||'')}" data-p="${PTS[k]}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
  if(TA.length) h += `<div class="card" style="margin-top:16px"><h2>Tareas de verificación (Apto / No apto)</h2><p class="note">Es Apto si se cumplen todos los elementos.</p><div class="grid g2">${TA.map(m=>`<div class="side"><b>${tname(m)}</b> ${chip(m.criterio)}${ul(m.cotejo)}</div>`).join('')}</div></div>`;
  if(arr(E.rubrica).length){ const niv = E.niveles || ['Insuficiente (1-4)','Suficiente / Bien (5-6)','Notable (7-8)','Sobresaliente (9-10)'];
    h += `<div class="card" style="margin-top:16px"><h2>Rúbrica</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${niv.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${E.rubrica.map(r=>`<tr><td>${chip(r.criterio)}</td>${arr(r.niveles).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; }
  if(E.agentes) h += `<div class="card" style="margin-top:16px"><h2>Agentes e instrumentos</h2>${Object.entries(E.agentes).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;
  $('#p-eval').innerHTML = h;
  const sel = {};
  $('#p-eval').addEventListener('click', e => { const c = e.target.closest('td.rc'); if(!c) return; const t = c.closest('table').dataset.t;
    c.parentElement.querySelectorAll('td.rc').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    sel[t] = sel[t]||{}; sel[t][c.dataset.l] = [+c.dataset.p, +c.dataset.w]; const v = Object.values(sel[t]); const nl = c.closest('tbody').rows.length;
    const wt = [...c.closest('tbody').rows].reduce((a,r)=>a+(+r.querySelector('td.rc').dataset.w),0);
    document.querySelector(`[data-rn="${t}"]`).textContent = `Nota: ${(v.reduce((a,[p,w])=>a+p*w,0)/wt).toFixed(1)}` + (()=>{ const rs=[...c.closest('tbody').rows].map(r=>r.querySelector('td.rc').dataset); const cs=[...new Set(rs.map(d=>d.c))]; if(cs.length<2) return ''; return ' · ' + cs.map(k=>{ const ws=rs.filter(d=>d.c===k).reduce((a,d)=>a+(+d.w),0); const pt=Object.entries(sel[t]).filter(([i])=>rs[i].c===k).reduce((a,[,x])=>a+x[0]*x[1],0); return k+': '+(pt/ws).toFixed(1); }).join(' · '); })() + (v.length<nl?` (faltan ${nl-v.length} líneas)`:''); });
  function upd(){ arr(E.cotejo).forEach((g,gi)=>{ const n = arr(g.indicadores).length; const k = arr(g.indicadores).filter((_,i)=>st[gi+'-'+i]).length; const p = n?Math.round(k/n*100):0;
    document.querySelector(`[data-b="${gi}"]`).style.width = p+'%'; document.querySelector(`[data-p="${gi}"]`).textContent = p+' %'; }); }
  function save(){ try{ localStorage.setItem('sda-cotejo-'+M.titulo, JSON.stringify(st)); }catch(_){} }
  $('#p-eval').addEventListener('change', e => { const k = e.target.dataset.k; if(k){ st[k]=e.target.checked; save(); upd(); } });
  $('#cot-reset').onclick = () => { st = {}; save(); document.querySelectorAll('#p-eval input[type=checkbox]').forEach(x=>x.checked=false); upd(); };
  upd();
})();

/* ---------- 8. Créditos ---------- */
(function(){
  const C = S.creditos; if(!C) return;
  const o = C.original || {}, A = C.adaptacion || {}, L = C.licencia || {};
  const lic = L.url ? `<a href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.nombre)}</a>` : esc(L.nombre||'');
  let h = `<div class="grid g3"><div class="grid" style="align-content:start">`;
  if(o.titulo) h += `<div class="card"><h2>Recurso original</h2><p>Esta situación de aprendizaje es una adaptación de <b>«${esc(o.titulo)}»</b>${o.organizacion?' ('+esc(o.organizacion)+')':''}.</p>
    <table class="tbl"><tbody>${arr(o.personas).map(x=>`<tr><th style="width:38%">${esc(x.funcion)}</th><td>${esc(x.nombres)}</td></tr>`).join('')}${o.version?`<tr><th>Versión original</th><td>${esc(o.version)}</td></tr>`:''}${o.fuente?`<tr><th>Fuente</th><td>${/^https?:/.test(o.fuente)?`<a href="${esc(o.fuente)}" target="_blank" rel="noopener">${esc(o.fuente)}</a>`:esc(o.fuente)}</td></tr>`:''}</tbody></table></div>`;
  if(arr(C.recursos).length) h += `<div class="card"><h2>Recursos de terceros</h2><div class="scroll"><table class="tbl"><thead><tr><th>Recurso</th><th>Autoría</th><th>Licencia</th></tr></thead><tbody>${C.recursos.map(r=>`<tr><td>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.elemento)}</a>`:esc(r.elemento)}</td><td>${esc(r.autoria)}</td><td>${esc(r.licencia)}</td></tr>`).join('')}</tbody></table></div></div>`;
  h += `</div><div class="grid" style="align-content:start"><div class="card reto"><h2>Licencia</h2><p class="q">${L.url?`<a style="color:#fff" href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.nombre)}</a>`:esc(L.nombre||'')}</p>${L.nota?`<p>${esc(L.nota)}</p>`:''}</div>`;
  if(A.autoria||A.cambios) h += `<div class="card"><h2>Adaptación</h2>${A.autoria?`<p><b>${esc(A.autoria)}</b>${A.fecha?' · '+esc(A.fecha):''}</p>`:''}${A.cambios?`<p>${esc(A.cambios)}</p>`:''}</div>`;
  if(o.cita) h += `<div class="card"><h2>Cómo citarla</h2><div class="copybox"><div class="ch"><span>Cita</span><button class="copy">Copiar</button></div><pre>${esc(o.cita)}</pre></div></div>`;
  h += `</div></div>`;
  $('#p-cred').innerHTML = h;
  const f = document.createElement('footer'); f.className = 'wrap note'; f.style.padding = '0 16px 32px';
  f.innerHTML = `${o.titulo?`Adaptación de «${esc(o.titulo)}»${o.organizacion?' · '+esc(o.organizacion):''} · `:''}Licencia ${lic}`;
  document.body.appendChild(f);
})();

/* ---------- 7. Séneca ---------- */
(function(){
  const SE = DATA.seneca;
  const box = (t, txt) => `<div class="copybox"><div class="ch"><span>${esc(t)}</span><button class="copy">Copiar</button></div><pre>${esc(txt)}</pre></div>`;
  let h = `<div class="card"><h2>Textos listos para pegar en Séneca</h2><p class="note">Séneca guarda texto plano: estos bloques no llevan formato Markdown. Copia cada campo en su casilla del formulario de la situación de aprendizaje.</p>
    ${box('Título', SE.titulo)}${box('Temporalización', SE.temporalizacion)}${box('Justificación', SE.justificacion)}${box('Producto final', SE.producto_final)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Concreción curricular</h2><p class="note">En Séneca se marcan en las listas; aquí tienes la selección para comprobarla.</p>${SE.concrecion.map(m=>box(m.materia, m.texto)).join('')}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Actividades (formulario «Detalle de la actividad»)</h2><p class="note">Los campos siguen el orden del formulario de Séneca. Solo hay una actividad por cada Tarea de Moodle evaluada con rúbrica. En «Vinculación criterios de evaluación» elige la única trazabilidad indicada y pasa esos criterios a «seleccionados» (es obligatorio).</p>${SE.actividades.map(a=>`<h3>${esc(a.orden)}. ${esc(a.titulo)} <span class="badge">${esc(a.tipo)}</span> <span class="badge">${esc(a.abreviatura)}</span> <span class="badge">Tarea ${esc(a.tarea)}</span></h3>${box('Título de la actividad', a.titulo)}${box('Tipo de actividad', a.tipo)}${box('Abreviatura', a.abreviatura)}${box('Orden de la presentación', a.orden)}${box('Descripción', a.descripcion)}${box('Temporalización', a.temporalizacion)}${box('Recursos', a.recursos)}${box('Descriptores operativos', a.descriptores)}${box('Vinculación criterios de evaluación', a.vinculacion)}${box('Ejercicios', a.ejercicios)}${box('Metodologías', a.metodologias)}`).join('')}</div>`;
  $('#p-seneca').innerHTML = h;
})();

/* ---------- Anexos: plantillas y formularios ---------- */
(function(){
  if (!HAY_ANX) return;
  const A = S.anexos, P = arr(A.plantillas), F = arr(A.formularios);
  const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const ses = ns => { ns = arr(ns).slice().sort((a,b)=>a-b); if(!ns.length) return '';
    return (ns.length>1 && ns[ns.length-1]-ns[0]===ns.length-1) ? `Sesiones ${ns[0]}-${ns[ns.length-1]}` : (ns.length===1?'Sesión ':'Sesiones ')+ns.join(', '); };
  const TT = {opcion:'Una opción', casillas:'Varias opciones', desplegable:'Desplegable', escala:'Escala', texto:'Respuesta corta', parrafo:'Respuesta larga', cuadricula:'Cuadrícula', info:'Texto informativo'};
  let h = `<div class="card"><h2>Anexos para el alumnado</h2><p class="note">Solo las plantillas que se entregan en una Tarea y los formularios de Google. En el PDF cada plantilla empieza en su página, lista para imprimir o copiar en Google Docs. Los formularios se crean con <b>Codigo.gs</b>.</p>
    <p>${P.map(p=>`<span class="badge" style="margin-right:6px">${esc(p.id)} · ${esc(p.titulo)}</span>`).join('')}${F.map(f=>`<span class="badge" style="margin-right:6px">${esc(f.id)} · ${esc(f.titulo)}</span>`).join('')}</p></div>`;
  P.forEach(p => {
    let cab = p.cabecera;
    if (cab == null){ const ag = String(p.agrupamiento||'').toLowerCase();
      cab = ag.startsWith('individual') ? ['Nombre y apellidos','Grupo','Fecha'] : (ag.includes('pareja') ? ['Pareja','Fecha'] : ['Equipo','Integrantes','Fecha']); }
    const meta = [ses(p.sesiones), p.agrupamiento, p.herramienta, p.entrega ? 'Se entrega en '+p.entrega : ''].filter(Boolean).join(' · ');
    let b = `<div class="card anx anx-p"><h2>${esc(p.id)} · ${esc(p.titulo)}</h2><div class="am">${esc(meta)}</div>`;
    if (p.docente) b += `<div class="doc"><b>Para el docente:</b> ${md(p.docente)}</div>`;
    if (arr(cab).length) b += `<table class="w"><tbody><tr>${cab.map(c=>`<th style="width:auto;height:2.2em">${esc(c)}:</th>`).join('')}</tr></tbody></table>`;
    if (p.instrucciones) b += `<p>${md(p.instrucciones)}</p>`;
    arr(p.bloques).forEach(k => {
      if (k.titulo) b += `<h4>${esc(k.titulo)}</h4>`;
      if (k.texto) b += `<p>${md(k.texto)}</p>`;
      if (k.lista) b += `<ul>${arr(k.lista).map(x=>`<li>${md(x)}</li>`).join('')}</ul>`;
      if (k.casillas) b += arr(k.casillas).map(x=>`<div class="ck">☐ ${md(x)}</div>`).join('');
      if (k.campos) b += `<table class="w"><tbody>${arr(k.campos).map(c=>`<tr style="height:${(k.alto||1.3)*1.5}em"><th>${md(c)}</th><td></td></tr>`).join('')}</tbody></table>`;
      if (k.tabla){ const cols = arr(k.tabla.columnas); let fil = k.tabla.filas ?? 3;
        fil = typeof fil === 'number' ? Array.from({length:fil}, ()=>[]) : fil.map(arr);
        b += `<table class="w"><thead><tr>${cols.map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${fil.map(r=>`<tr style="height:${(k.tabla.alto||1.4)*1.5}em">${cols.map((_,i)=>`<td>${md(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
      if (k.lineas) b += `<div class="ln" style="height:${1.9*(k.lineas|0)}em"></div>`;
      if (k.nota) b += `<div class="am">${md(k.nota)}</div>`;
    });
    h += b + `</div>`;
  });
  F.forEach((f,fi) => {
    const meta = [ses(f.sesiones), f.anonimo ? 'Anónimo (no recoge el correo)' : 'Recoge el correo del centro', f.repetible ? 'Se puede responder varias veces' : ''].filter(Boolean).join(' · ');
    let n = 0, ob = false;
    const rows = arr(f.preguntas).map(q => {
      if (q.tipo === 'seccion') return `<tr><th colspan="4" style="background:var(--bg)">Sección: ${md(q.titulo)}${q.ayuda?' — '+md(q.ayuda):''}</th></tr>`;
      if (q.tipo !== 'info') n++;
      const o = q.obligatoria === undefined ? !!f.obligatorias : !!q.obligatoria; ob = ob || o;
      const et = arr(q.etiquetas);
      const op = q.tipo==='escala' ? `${q.min ?? 1}${et[0]?' ('+esc(et[0])+')':''} … ${q.max ?? 5}${et[1]?' ('+esc(et[1])+')':''}`
        : q.tipo==='cuadricula' ? `Filas: ${arr(q.filas).map(esc).join('; ')}. Columnas: ${arr(q.columnas).map(esc).join(' / ')}`
        : arr(q.opciones).map(esc).join(' / ') + (q.otra ? ' / Otra' : '');
      return `<tr><td>${q.tipo!=='info'?n:''}</td><td>${md(q.titulo)}${q.ayuda?` <span class="note">(${md(q.ayuda)})</span>`:''}${o?' *':''}</td><td>${TT[q.tipo]||esc(q.tipo)}</td><td>${op}</td></tr>`;
    }).join('');
    h += `<div class="card anx ${fi===0?'anx-p':''}"><h2>${esc(f.id)} · ${esc(f.titulo)}</h2><div class="am">${esc(meta)}</div>
      ${f.enlace?`<p>Ya creado: <a href="${esc(f.enlace)}" target="_blank" rel="noopener">${esc(f.enlace)}</a></p>`:''}${f.descripcion?`<p>${md(f.descripcion)}</p>`:''}
      <table class="w"><thead><tr><th>Nº</th><th>Pregunta</th><th>Respuesta</th><th>Opciones</th></tr></thead><tbody>${rows}</tbody></table>
      ${f.confirmacion?`<div class="am">Mensaje final: ${md(f.confirmacion)}</div>`:''}${ob?'<div class="am">* Respuesta obligatoria.</div>':''}</div>`;
  });
  $('#p-anx').innerHTML = h;
})();

/* ---------- Exportar PDF: todo desplegado + glosario con el texto oficial ---------- */
function prepararImpresion(){
  openAll();
  const ORD = {ce:0, cr:1, sb:2, de:3};
  const codes = [...new Set([...document.querySelectorAll('main .chip[data-code]')].map(c=>c.dataset.code))].filter(c=>CUR[c])
    .sort((a,b)=> (ORD[CUR[a].tipo]-ORD[CUR[b].tipo]) || a.localeCompare(b, 'es', {numeric:true}));
  $('#gloss').innerHTML = `<h2>Glosario: texto oficial de los códigos</h2><p class="note">Orden de 30 de mayo de 2023 (Andalucía). En la web, estos textos aparecen al pulsar cada código.</p>
    <dl>${codes.map(c=>`<dt>${esc(c)} · ${esc(KIND[CUR[c].tipo]||'')}</dt><dd>${esc(CUR[c].texto)}</dd>`).join('')}</dl>`;
}
addEventListener('beforeprint', prepararImpresion);   // también con Ctrl+P
function exportarPDF(){
  prepararImpresion();
  const t = document.title; document.title = (M.titulo || 'SdA').replace(/[\\/:*?"<>|]/g, '');
  setTimeout(() => { window.print(); document.title = t; }, 50);
}
</script>
</body>
