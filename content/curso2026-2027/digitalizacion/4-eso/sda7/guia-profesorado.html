*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}

main{padding:12px 0 48px}
.panel{display:none}.panel.on{display:block}
.grid{display:grid;gap:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h2{margin:0 0 10px;font-size:19px}
.card h3{margin:14px 0 6px;font-size:15px}

.reto{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;border:0}

.reto .lab{color:rgba(255,255,255,.8)}
ul.clean{margin:6px 0;padding-left:18px;color:var(--ink2)}ul.clean li{margin:3px 0}

.chip:hover{filter:brightness(.95);text-decoration:underline}
.chip.ce{background:var(--ce-bg);color:var(--ce)}.chip.cr{background:var(--cr-bg);color:var(--cr)}
.chip.sb{background:var(--sb-bg);color:var(--sb)}.chip.de{background:var(--de-bg);color:var(--de)}

.legend{font-size:13px;color:var(--muted)}
.timeline{display:flex;height:40px;border-radius:10px;overflow:hidden;margin-top:8px}

.stitle{font-weight:700}.sreto{color:var(--muted);font-size:14px}

.act{border-left:3px solid var(--brand);padding:4px 0 4px 12px;margin:10px 0}
.act b{color:var(--ink)}.act .min{font-size:12px;color:var(--muted);margin-left:6px}
.act p{margin:2px 0;color:var(--ink2)}
.side{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14px}

.moodle{background:var(--moodle-bg);border:1px solid var(--line);border-left:4px solid var(--moodle);border-radius:10px;padding:10px 14px;margin-top:12px}

.mitem{margin:8px 0}.mitem .mt{font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.scroll{overflow-x:auto}
.tick{text-align:center;color:var(--brand);font-weight:800}
.cot li{list-style:none;margin:6px 0}.cot label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--brand);width:0;transition:width .2s}

.copybox{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}

.copy{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}

#modal h3{margin:2px 0 0;font-size:18px}

#modal .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}

.anx{margin-top:16px}
.anx .am{font-size:13px;color:var(--muted);font-style:italic;margin:2px 0 10px}

.anx table.w th,.anx table.w td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.anx table.w thead th{background:var(--brand-soft);color:var(--ink)}
.anx table.w tbody th{background:var(--bg);width:34%}
.anx .ln{border:1px solid var(--line);border-radius:6px;margin:6px 0 12px;background:repeating-linear-gradient(transparent 0 calc(1.9em - 1px),var(--line) calc(1.9em - 1px) 1.9em)}
.anx h4{margin:14px 0 4px;font-size:15px}
.anx .ck{margin:3px 0}
#gloss{display:none}
#gloss dl{margin:0}#gloss dt{font-weight:700;margin-top:8px}#gloss dd{margin:2px 0 0 0}
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    --bg:#fff; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#cbd5e1;
    --brand:#0f766e; --brand-soft:#ccfbf1; --accent:#7c3aed; --accent-soft:#ede9fe;

    --moodle:#c2410c; --moodle-bg:#fff7ed; --head1:#134e4a; --head2:#1e3a8a;

  body{background:#fff;font-size:12px}

<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 7: Programación, Pensamiento Computacional e IoT", "numero": 7, "subtitulo": "«Arcade Day»: diseñamos un videojuego retro de 3 niveles y lo controlamos como un objeto conectado", "curso_texto": "4.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Individual en las Tareas 7.1, 7.2 y 7.3; parejas (como máximo tríos) en el proyecto final de las sesiones 13-15", "temporalizacion": "Tercer trimestre (orientativo: 5 semanas a 3 sesiones semanales)", "carpeta_drive": "1WkbV-13TlPcfV-A4-0as-nkCnz7VVeBz"}, "materias": [{"codigo": "DIG", "criterios": ["DIG.4.1.1", "DIG.4.1.3", "DIG.4.2.3", "DIG.4.4.1"], "saberes": ["DIG.4.A.4", "DIG.4.B.2"]}], "vision": {"descripcion": "El alumnado programa en MakeCode Arcade un videojuego retro de hasta tres niveles, con personajes propios, un mapa de azulejos más grande que la pantalla y enemigos que se mueven al azar. Después da el salto del bloque al código (JavaScript o Python), aprende a usar un asistente de IA para depurar con sentido crítico y conecta su juego con el mundo de los objetos inteligentes programando un mando por inclinación con la micro:bit.", "contexto": "Grupo adaptado de 4.º ESO de 22 estudiantes, con mayoría de alumnado repetidor o con dificultades de aprendizaje y muy activo en TikTok e Instagram. Aula de informática con un ordenador por estudiante, Google Workspace del centro, Genially y Canva para Educación. El centro dispone de placas micro:bit GO. Las entregas son individuales salvo el proyecto final, en parejas o tríos.", "justificacion": "La programación estructurada y el pensamiento computacional desarrollan el razonamiento lógico y la capacidad de resolver problemas. Un videojuego es un producto cercano y motivador para este alumnado, que da sentido a los bucles, eventos, variables, colisiones y números aleatorios. Comparar bloques con código de texto, depurar con ayuda de la IA verificando lo que propone y conectar el juego con un dispositivo IoT (un mando por inclinación) une la teoría con la tecnología que usan a diario.", "reto": "«Somos un pequeño estudio indie y el instituto nos encarga juegos retro para su Arcade Day: cada persona crea su juego de 3 niveles y, en pareja o trío, lo mejoramos con código y un mando conectado para que lo pruebe el resto de la clase.»", "pregunta_guia": "¿Cómo se programa un videojuego que engancha y cómo puede un objeto conectado convertirse en su mando?", "producto_final": "Videojuego retro de hasta 3 niveles en MakeCode Arcade, con personajes propios, mapa de azulejos ampliado (más grande que la pantalla), enemigos con movimiento aleatorio, puntuación y vidas, probado y mejorado con las opiniones de otras personas; versión final en pareja o trío con una mejora programada en JavaScript o Python y un módulo opcional de simulación IoT (mando por inclinación con micro:bit) o de interacción con IA, presentado en el Arcade Day de la clase."}, "metodologias": [{"nombre": "Aprendizaje basado en proyectos (ABP)", "descripcion": "Todo gira alrededor del videojuego del Arcade Day: cada sesión añade una mecánica al juego de cada estudiante."}, {"nombre": "Aprendizaje basado en juegos y gamificación", "descripcion": "Retos por niveles (básico, medio y pro) en cada práctica, marcador de mecánicas conseguidas y feria final de juegos."}, {"nombre": "Instrucción guiada y modelado", "descripcion": "Tutoriales paso a paso de MakeCode y demostraciones proyectadas del docente antes de cada práctica individual."}, {"nombre": "Ciclo de diseño iterativo", "descripcion": "Diseñar, programar, probar, recibir opiniones (playtesting) y mejorar el juego en varias vueltas."}, {"nombre": "Aprendizaje cooperativo", "descripcion": "Programación en pareja (conductor/a y navegante) en el proyecto final y pruebas cruzadas de los juegos."}], "recursos": ["Aula de informática (un ordenador por estudiante)", "MakeCode Arcade", "MakeCode para micro:bit", "Placas micro:bit GO del centro", "Asistente .gle/W2Lz8dhpVJz1sKgW9"}, {"tipo": "infografia", "titulo": "Las 4 piezas de un videojuego", "elementos": [{"icono": "👾", "titulo": "Sprite", "texto": "Cada personaje u objeto que se mueve: tú, los enemigos, las monedas."}, {"icono": "🔁", "titulo": "Bucle de juego", "texto": "Lo que se repite **siempre**, muchas veces por segundo."}, {"icono": "💥", "titulo": "Evento", "texto": "«Cuando pase X, haz Y»: al pulsar A, al chocar con un enemigo…"}, {"icono": "🔢", "titulo": "Variable", "texto": "Un dato que cambia: puntos, vidas, nivel."}]}, {"tipo": "practica", "titulo": "Jugar y diseccionar", "tiempo": 20, "enunciado": "Abre **arcade.makecode.com**, juega 5 minutos a un ejemplo y pulsa **Editar**. Busca en los bloques cada pieza y anótala.", "pasos": ["Sprite del jugador: ¿qué bloque lo crea?", "Bucle: ¿qué bloque se repite siempre?", "Evento: ¿qué pasa al chocar?", "Variable: ¿dónde se suman los puntos?"], "material": ["Cuaderno", "Ordenador"]}, {"tipo": "idea", "icono": "🏆", "titulo": "El reto: Arcade Day", "puntos": ["Cada persona crea **su juego de 3 niveles** (Tarea 7.2).", "En pareja o trío lo mejoráis con **código** y un **mando conectado** (Tarea 7.4).", "Última sesión: **feria de juegos** para toda la clase."], "nota": "Enseñar la rúbrica de la Tarea 7.2 con un juego de ejemplo."}]}}, {"n": 2, "fase": "Bloque 1 · Iniciación con MakeCode Arcade", "titulo": "Mi personaje cobra vida: sprites y controles", "reto": "Dibujar el personaje en pixel art y moverlo con los controles por la pantalla.", "actividades": [{"nombre": "Repaso de la encuesta", "min": 5, "desc": "El docente proyecta dos o tres resultados de F1 (cuántas personas han programado antes, qué tipo de juego prefieren) y anuncia que hoy cada estudiante crea su propio personaje."}, {"nombre": "Pixel art en 16×16", "min": 12, "desc": "Demostración de 3 minutos del editor de imágenes de MakeCode (lápiz, relleno, cuadrícula de 16×16). Cada estudiante dibuja su protagonista; quien se bloquee elige uno de la galería y le cambia los colores."}, {"nombre": "Tutorial guiado de movimiento", "min": 23, "desc": "Cada estudiante sigue un tutorial de iniciación de la página principal de MakeCode Arcade (p. ej. «Chase the Pizza») o los pasos de la diapositiva: crear el sprite de tipo Player, «mover sprite con botones», «poner sprite en la pantalla» (stay in screen) y elegir un fondo. El docente pasa por los puestos y resuelve dudas."}, {"nombre": "Reto extra y guardado", "min": 10, "desc": "Nivel medio: cambiar la velocidad del movimiento. Nivel pro: añadir una animación al moverse. Todos guardan el proyecto con el nombre de su juego y comprueban que aparece en «Mis proyectos»."}], "criterios": ["DIG.4.2.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Instrucción guiada y modelado", "Aprendizaje basado en juegos y gamificación"], "evidencias": ["Proyecto guardado con el sprite que se mueve"], "recursos": ["MakeCode Arcade", "Proyector"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Tutorial integrado paso a paso con pistas; sprites de la galería para quien no quiera dibujar; retos medio y pro para quien avanza rápido."}, "ejercicios": ["Dibuja tu personaje en pixel art de 16×16.", "Programa tu sprite para que se mueva con los controles sin salirse de la pantalla."], "clase": {"pregunta": "¿Cómo pasa un dibujo de 16×16 cuadritos a ser un personaje que obedece a tus dedos?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎨", "titulo": "Los emojis también son píxeles", "situacion": "Si haces zoom a un emoji o a un juego retro, ves **cuadraditos de colores**.", "explicacion": "Eso es el **pixel art**. En MakeCode cada personaje es una imagen de 16×16 píxeles: **256 cuadritos**, ni uno más."}, {"tipo": "practica", "titulo": "Dibuja tu protagonista", "tiempo": 12, "enunciado": "Abre el editor de imágenes y dibuja tu personaje en la cuadrícula de 16×16.", "pasos": ["Silueta con un color oscuro.", "Rellena con 2-3 colores.", "¿Bloqueo? Coge uno de la **Galería** y cámb acion": "Cuando un vídeo no carga, no tiras el móvil: miras el wifi, cierras la app, pruebas otro vídeo…", "explicacion": "Eso es **depurar**: probar, observar, **cambiar una sola cosa** y volver a probar. Con el código se hace igual."}, {"tipo": "flujo", "titulo": "Método caza-bugs", "nodos": [{"texto": "Pruebo el juego", "tipo": "inicio"}, {"texto": "¿Hace lo que espero?", "tipo": "decision"}, {"texto": "Busco el bloque responsable", "tipo": "proceso"}, {"texto": "Cambio UNA cosa y vuelvo a probar", "tipo": "proceso"}, {"texto": "Funciona: lo anoto", "tipo": "fin"}]}, {"tipo": "practica", "titulo": "Caza de bugs", "tiempo": 10, "enunciado": "Este juego tiene **3 errores**. ¿Cuáles son y cómo los compruebas?", "pasos": ["El jugador no se mueve.", "La puntuación no sube.", "El enemigo no aparece."], "ayudas": [{"tipo": "pista", "titulo": "Solución para comprobar", "texto": "1) Falta «mover con botones». 2) El evento tiene los tipos al revés (Food-Player en vez de Player-Food o tipo equivocado). 3) El sprite del enemigo no tiene imagen."}]}, {"tipo": "practica", "titulo": "Completa tu minijuego", "tiempo": 25, "enunciado": "Comprueba la lista de la Tarea 7.1 en tu juego.", "pasos": ["✅ El jugador se mueve y no sale de la pantalla.", "✅ La comida suma puntos y cambia de sitio.", "✅ El enemigo quita vidas.", "✅ Se ven puntos y vidas.", "🔴 Pro: comida especial de 3 puntos."]}, {"tipo": "pasos", "titulo": "Compartir y entregar", "pasos": ["Pulsa **Compartir** (arriba a la izquierda).", "Pon el nombre del juego (sin tu nombre completo) y pulsa **Compartir proyecto**.", "Copia el enlace.", "Haz una captura de tus bloques.", "Entrega enlace + captura en Moodle."], "progresivo": true}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 10, "entrega": "Tarea 7.1 · Mi primer minijuego en MakeCode Arcade", "enunciado": "Sube el enlace de tu juego y la captura de tus bloques. Después, juega un minuto al de al lado y dile algo que funcione bien."}]}}, {"n": 5, "fase": "Bloque 2 · Diseño de características avanzadas", "titulo": "Un mundo más grande que la pantalla: mapas de azulejos", "reto": "Crear el primer nivel con un mapa de azulejos ampliado y una cámara que sigue al personaje.", "actividades": [{"nombre": "¿Cómo cabe un mundo en una pantalla?", "min": 7, "desc": "El docente proyecta un juego de plataformas o de exploración y pregunta cómo es posible que el mundo sea más grande que la pantalla. Se introduce la idea de azulejo (tile) de 16×16 píxeles y de cámara que sigue al jugador. Se presenta el juego del alumnado como un proyecto nuevo de 3 niveles, que puede partir del minijuego de la Tarea 7.1."}, {"nombre": "Dibujar el mapa del nivel 1", "min": 28, "desc": "Cada estudiante usa el bloque «establecer mapa de azulejos», cambia el tamaño a 32×32 casillas (mínimo 32×16) y dibuja con azulejos de suelo y de muro el nivel 1: un camino con al menos dos zonas y una meta al final. Marca como muro los azulejos que no se pueden atravesar."}, {"nombre": "La cámara sigue al jugador", "min": 10, "desc": "Cada estudiante coloca al jugador en un azulejo de inicio («colocar en azulejo»), añade «cámara sigue a sprite» y prueba a recorrer todo el mapa. Comprueba si el personaje atraviesa algún muro y lo corrige."}, {"nombre": "Guardar y anotar", "min": 5, "desc": "Guardado del proyecto y anotación en el cuaderno del tamaño del mapa y del tema del nivel 1."}], "criterios": ["DIG.4.2.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Aprendizaje basado en proyectos (ABP)", "Instrucción guiada y modelado"], "evidencias": ["Nivel 1 con mapa ampliado y cámara"], "recursos": ["MakeCode Arcade", "Proyector"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Boceto del mapa en papel cuadriculado como paso previo para quien lo necesite; azulejos de la galería para no tener que dibujarlos."}, "ejercicios": ["Diseña el mapa del nivel 1 con al menos 32×16 casillas, muros y una meta.", "Haz que la cámara siga al jugador por todo el mapa."], "clase": {"pregunta": "Si la pantalla mide 160×120 píxeles, ¿cómo puede un mundo ser diez veces más grande?", "diapositivas": [{"tipo": "ejemplo", "icono": "🗺️", "titulo": "Google Maps en tu móvil", "situacion": "El mapa del mundo no cabe en la pantalla del móvil, pero **mueves la vista** y ves la parte que te interesa.", "explicacion": "En un juego pasa igual: el mapa está hecho de **azulejos** de 16×16 y la **cámara** enseña solo un trozo, el que rodea al jugador."}, {"tipo": "dato", "valor": "10 × 7,5", "texto": "Son los azulejos de 16 px que caben en la pantalla de MakeCode Arcade (160×120). Un mapa de 32×32 es unas **13 pantallas** de mundo."}, {"tipo": "practica", "titulo": "Dibuja el nivel 1", "tiempo": 28, "enunciado": "Crea el mapa del nivel 1: **32×32 casillas** (mínimo 32×16).", "pasos": ["Bloque «establecer mapa de azulejos» y cambia el tamaño.", "Suelo y muros (marca los muros con la herramienta de muro).", "Un azulejo de inicio y uno de meta.", "Al menos dos zonas distintas."]}, {"tipo": "codigo", "titulo": "Colocar al jugador y la cámara", "codigo": "al iniciar:\n    establecer mapa de azulejos a nivel1\n    colocar jugador en un azulejo aleatorio de tipo INICIO\n    cámara sigue a sprite jugador", "explicacion": ["El azulejo de **inicio** marca dónde empiezas.", "La **cámara** se mueve contigo por el mapa."]}, {"tipo": "practica", "titulo": "Recorre tu mundo", "tiempo": 10, "enunciado": "Añade la cámara y recorre **todo** el mapa. ¿Atraviesas algún muro? Corrígelo y guarda."}]}}, {"n": 6, "fase": "Bloque 2 · Diseño de características avanzadas", "titulo": "Lava, monedas y metas: colisiones con el mapa", "reto": "Programar qué pasa al pisar cada tipo de azulejo y repartir objetos por el mapa.", "actividades": [{"nombre": "Dos tipos de choque", "min": 8, "desc": "El docente explica con la infografía la diferencia entre chocar con otro sprite (evento de superposición de sprites) y pisar un azulejo (evento «al superponerse con azulejo»). Ejemplo: la lava quita una vida, la meta pasa de nivel."}, {"nombre": "Azulejos con efecto", "min": 22, "desc": "Cada estudiante añade a su nivel 1 al menos dos azulejos especiales (p. ej. lava o pinchos que quitan una vida y devuelven al inicio, y una meta que muestra «¡Nivel superado!»). Reparte monedas por el mapa con «en cada azulejo de tipo… colocar sprite» y las programa para sumar puntos."}, {"nombre": "Depuración por parejas", "min": 15, "desc": "Por parejas, cada estudiante juega al nivel del otro durante 4 minutos y apunta los fallos que encuentra (atraviesa un muro, la lava no hace nada, aparecen monedas dentro de los muros). Después cada uno corrige su juego con el método caza-bugs."}, {"nombre": "Salida", "min": 5, "desc": "En el cuaderno: un error encontrado hoy, su causa y cómo se corrigió."}], "criterios": ["DIG.4.2.3", "DIG.4.1.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Ciclo de diseño iterativo", "Aprendizaje cooperativo"], "evidencias": ["Nivel 1 con azulejos especiales y monedas", "Registro de errores en el cuaderno"], "recursos": ["MakeCode Arcade", "Cuaderno"], "dua": {"principios": ["Andamiaje", "Compromiso"], "medidas": "Bloques de los eventos de azulejo en la diapositiva; parejas de nivel similar para la depuración; reto pro de azulejo trampolín o teletransporte."}, "ejercicios": ["Programa dos azulejos especiales (uno que quite vida y una meta).", "Reparte monedas por el mapa y prueba el nivel de otra persona anotando sus errores."], "clase": {"pregunta": "¿Cómo sabe el juego que estás pisando lava?", "diapositivas": [{"tipo": "comparar", "titulo": "Dos tipos de choque", "columnas": [{"titulo": "Sprite con sprite", "icono": "👾", "puntos": ["Jugador toca enemigo o moneda", "Evento «al superponerse sprite»", "Ejemplo: quitar vida"]}, {"titulo": "Sprite con azulejo", "icono": "🧱", "puntos": ["Jugador pisa un azulejo", "Evento «al superponerse con azulejo»", "Ejemplo: lava, meta"]}]}, {"tipo": "ejemplo", "icono": "🛗", "titulo": "La puerta automática del súper", "situacion": "Al pisar la zona de delante, **la puerta se abre** sola.", "explicacion": "El suelo «avisa» de que estás ahí. En tu juego, cada azulejo especial avisa al pisarlo: la **lava** quita vida y la **meta** te pasa de nivel."}, {"tipo": "codigo", "titulo": "Lava y meta", "codigo": "al superponerse jugador con azulejo LAVA:\n    cambiar vida en -1\n    colocar jugador en azulejo INICIO\n\nal superponerse jugador con azulejo META:\n    mostrar texto «¡Nivel superado!»", "explicacion": ["Volver al **inicio** evita perder todas las vidas de golpe."]}, {"tipo": "practica", "titulo": "Azulejos con efecto", "tiempo": 22, "enunciado": "Añade a tu nivel 1 dos azulejos especiales y monedas repartidas.", "pasos": ["🟢 Lava o pinchos que quitan vida.", "🟢 Meta con mensaje.", "🟡 Monedas en todos los azulejos de un tipo (bloque «en cada azulejo»).", "🔴 Pro: trampolín o teletransporte."]}, {"tipo": "practica", "titulo": "Depuración por parejas", "tiempo": 15, "enunciado": "Juega 4 minutos al nivel de tu pareja y apunta los fallos. Después corrige el tuyo.", "pasos": ["¿Se atraviesa algún muro?", "¿Cada azulejo especial hace lo que debe?", "¿Hay monedas dentro de los muros?"], "agrupamiento": "Parejas"}]}}, {"n": 7, "fase": "Bloque 2 · Diseño de características avanzadas", "titulo": "Enemigos impredecibles: el azar en los videojuegos", "reto": "Hacer aparecer enemigos cada cierto tiempo en lugares y direcciones al azar.", "actividades": [{"nombre": "¿Por qué el azar engancha?", "min": 7, "desc": "Conversación guiada: los sobres de cartas o los cofres de un juego engancharían menos si siempre tocara lo mismo. El docente explica «elegir al azar» y que un juego sin azar se aprende de memoria. Se avisa también de cómo algunos juegos usan el azar para que gastemos dinero (cajas de botín)."}, {"nombre": "Aparecen enemigos", "min": 20, "desc": "Cada estudiante programa «en cada intervalo de 2000 ms»: crear un enemigo, colocarlo en un azulejo aleatorio de tipo suelo y darle una velocidad vx y vy elegida al azar entre -50 y 50. Activa «rebotar en los muros» para que no se queden atascados."}, {"nombre": "Ajustar la dificultad", "min": 15, "desc": "Cada estudiante prueba tres configuraciones (intervalo de 3000, 2000 y 1000 ms) y anota en el cuaderno cuál es justa para el nivel 1. Reto pro: que algunos enemigos persigan al jugador y otros se muevan al azar, o que desaparezcan a los 10 segundos (vida útil del sprite)."}, {"nombre": "Quiz y guardado", "min": 8, "desc": "Quiz sobre números aleatorios y guardado del proyecto."}], "criterios": ["DIG.4.2.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Aprendizaje basado en proyectos (ABP)", "Ciclo de diseño iterativo"], "evidencias": ["Nivel 1 con enemigos aleatorios", "Tabla de pruebas de dificultad en el cuaderno"], "recursos": ["MakeCode Arcade", "Cuaderno"], "dua": {"principios": ["Compromiso", "Andamiaje"], "medidas": "Fragmento de código de enemigos para copiar y modificar a quien lo necesite; la tabla de pruebas tiene las tres filas ya preparadas en la diapositiva."}, "ejercicios": ["Programa enemigos que aparecen cada cierto tiempo en un lugar aleatorio y se mueven en una dirección al azar.", "Prueba tres intervalos de aparición y justifica cuál deja el nivel más equilibrado."], "clase": {"pregunta": "¿Por qué un juego en el que todo es predecible acaba aburriendo?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎁", "titulo": "Abrir un sobre de cartas", "situacion": "Si cada sobre trajera siempre las mismas cartas, nadie lo abriría con ilusión.", "explicacion": "El **azar** hace que cada partida sea distinta. Ojo: algunos juegos lo usan para que **gastes dinero** en cajas de botín. Tú lo usarás para que tu juego no se aprenda de memoria."}, {"tipo": "codigo", "titulo": "Una lluvia de enemigos", "codigo": "en cada intervalo de 2000 ms:\n    enemigo = crear sprite de tipo Enemy\n    colocar enemigo en azulejo aleatorio de tipo SUELO\n    poner vx de enemigo = elegir al azar de -50 a 50\n    poner vy de enemigo = elegir al azar de -50 a 50\n    rebotar en los muros: activado", "explicacion": ["**Cada 2 segundos** aparece un enemigo nuevo.", "**vx** y **vy** son la velocidad en horizontal y vertical: al azar, cada uno va en una dirección."], "pregunta": "¿Qué hace un enemigo con vx = 0 y vy = 0?"}, {"tipo": "practica", "titulo": "Aparecen enemigos", "tiempo": 20, "enunciado": "Programa la lluvia de enemigos en tu nivel 1.", "pasos": ["Intervalo de 2000 ms.", "Azulejo aleatorio de suelo.", "vx y vy al azar entre -50 y 50.", "Rebotar en los muros."]}, {"tipo": "practica", "titulo": "Ajusta la dificultad", "tiempo": 15, "enunciado": "Prueba tres intervalos y apunta qué pasa. ¿Cuál es justo para el nivel 1?", "pasos": ["3000 ms: ¿demasiado fácil?", "2000 ms: …", "1000 ms: …", "🔴 Pro: unos enemigos te persiguen y otros van al azar."]}, {"tipo": "quiz", "pregunta": "«elegir al azar de -50 a 50» para vx. ¿Qué puede pasar?", "opciones": ["El enemigo siempre va a la derecha", "El enemigo puede ir a la izquierda, a la derecha o casi quieto", "Da error porque no se admiten negativos"], "correcta": 1, "explicacion": "Los valores **negativos** mueven a la izquierda (o hacia arriba en vy), los positivos a la derecha (o hacia abajo) y cerca de 0 casi no se mueve."}]}}, {"n": 8, "fase": "Bloque 2 · Diseño de características avanzadas", "titulo": "Tres niveles: variables y funciones", "reto": "Pasar del nivel 1 al 2 y al 3 al llegar a la meta, con una sola función que carga cada nivel.", "actividades": [{"nombre": "¿Cómo cambia de nivel un juego?", "min": 8, "desc": "El docente plantea: si al llegar a la meta tuviéramos que copiar todos los bloques para cada nivel, el programa sería enorme. Introduce la variable «nivel» y una función «cargar nivel» que elige el mapa según el valor de la variable, con el diagrama de flujo proyectado."}, {"nombre": "Dibujar los niveles 2 y 3", "min": 17, "desc": "Cada estudiante duplica el mapa del nivel 1 y crea los niveles 2 y 3 con más muros, más lava o un camino más largo, de forma que la dificultad suba poco a poco."}, {"nombre": "La función cargar nivel", "min": 20, "desc": "Cada estudiante crea la variable nivel (empieza en 1), la función «cargar nivel» con «si nivel = 1… si no, si nivel = 2… si no…» que pone el mapa correspondiente y coloca al jugador en el inicio, y cambia el evento de la meta: nivel + 1 y llamar a la función; si nivel supera 3, «fin del juego» con victoria."}, {"nombre": "Prueba completa", "min": 5, "desc": "Cada estudiante juega los tres niveles seguidos y anota si algún nivel es imposible o demasiado fácil."}], "criterios": ["DIG.4.2.3", "DIG.4.1.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Aprendizaje basado en proyectos (ABP)", "Instrucción guiada y modelado"], "evidencias": ["Juego con tres niveles encadenados"], "recursos": ["MakeCode Arcade", "Proyector"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Diagrama de flujo de la función proyectado durante toda la práctica; versión mínima admitida con 2 niveles para quien vaya muy atrasado, completando el tercero en la sesión 9."}, "ejercicios": ["Crea los niveles 2 y 3 con dificultad creciente.", "Programa una variable nivel y una función que cargue el mapa correcto al llegar a la meta."], "clase": {"pregunta": "¿Cómo pasa un juego de un nivel al siguiente sin repetir todos los bloques?", "diapositivas": [{"tipo": "ejemplo", "icono": "🏢", "titulo": "El botón del ascensor", "situacion": "En el ascensor no hay un ascensor distinto por planta: pulsas un número y **el mismo ascensor** te lleva.", "explicacion": "La variable **nivel** es el número que pulsas y la función **cargar nivel** es el ascensor: un solo trozo de código que sirve para los tres niveles."}, {"tipo": "flujo", "titulo": "Llegar a la meta", "nodos": [{"texto": "El jugador pisa la META", "tipo": "inicio"}, {"texto": "nivel = nivel + 1", "tipo": "proceso"}, {"texto": "¿nivel > 3?", "tipo": "decision"}, {"texto": "Sí: ¡Has ganado! · No: cargar nivel", "tipo": "fin"}]}, {"tipo": "practica", "titulo": "Dibuja los niveles 2 y 3", "tiempo": 17, "enunciado": "Duplica el mapa del nivel 1 y haz dos niveles **cada vez más difíciles**.", "pasos": ["Más muros o un camino más largo.", "Más lava o pinchos.", "Cada nivel con INICIO y META."]}, {"tipo": "codigo", "titulo": "La función cargar nivel", "codigo": "función cargar_nivel:\n    si nivel = 1: mapa = nivel1\n    si no, si nivel = 2: mapa = nivel2\n    si no: mapa = nivel3\n    colocar jugador en azulejo INICIO\n\nal superponerse jugador con azulejo META:\n    cambiar nivel en 1\n    si nivel > 3: fin del juego (victoria)\n    si no: llamar cargar_nivel", "explicacion": ["La **función** se escribe una vez y se usa muchas.", "Pon «nivel = 1» y «llamar cargar_nivel» **al iniciar**."]}, {"tipo": "practica", "titulo": "Programa los 3 niveles", "tiempo": 20, "enunciado": "Crea la variable nivel y la función. Después juega los tres niveles seguidos.", "pasos": ["Variable nivel = 1 al iniciar.", "Función cargar_nivel.", "Evento de la META.", "Prueba: ¿algún nivel es imposible?"]}]}}, {"n": 9, "fase": "Bloque 2 · Diseño de características avanzadas", "titulo": "Playtesting: otras personas prueban mi juego", "reto": "Conseguir opiniones de otras personas sobre el juego y corregir los fallos que encuentren.", "actividades": [{"nombre": "Así trabajan los estudios de videojuegos", "min": 5, "desc": "El docente explica qué es una prueba de juego (playtesting): los estudios dejan jugar a personas de fuera y observan sin ayudar. Normas: se juega en silencio, se apunta, se critica el juego y no a la persona."}, {"nombre": "Ronda de pruebas", "min": 22, "desc": "Rotación: cada estudiante prueba dos juegos de otras personas (8 minutos cada uno) y rellena el formulario F2 para cada uno (qué funciona, qué falla, dificultad de cada nivel, una propuesta de mejora). El autor o la autora observa sin intervenir."}, {"nombre": "Leer opiniones y corregir", "min": 20, "desc": "El docente comparte con cada estudiante las respuestas de F2 de su juego (o se leen en voz alta por parejas). Cada estudiante elige los dos fallos más importantes, los corrige y anota en el cuaderno: fallo, causa y solución."}, {"nombre": "Salida", "min": 3, "desc": "Cada estudiante escribe qué cambio ha hecho gracias a las opiniones de otra persona."}], "criterios": ["DIG.4.1.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Ciclo de diseño iterativo", "Aprendizaje cooperativo"], "evidencias": ["Respuestas de playtesting (F2)", "Registro fallo-causa-solución en el cuaderno"], "recursos": ["MakeCode Arcade", "Formulario F2"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Formulario corto con escalas y caritas; quien tenga dificultad para escribir puede dictar al móvil; ejemplo de crítica respetuosa proyectado."}, "ejercicios": ["Prueba dos juegos de otras personas y responde el formulario de playtesting.", "Corrige los dos fallos más importantes de tu juego y anota la causa y la solución."], "clase": {"pregunta": "¿Por qué tu juego te parece perfecto hasta que lo juega otra persona?", "diapositivas": [{"tipo": "ejemplo", "icono": "👀", "titulo": "La demo antes del lanzamiento", "situacion": "Antes de lanzar un juego, los estudios lo **dejan probar** a personas de fuera y miran dónde se atascan.", "explicacion": "Quien ha programado el juego sabe por dónde ir; otra persona descubre los fallos que tú **ya no ves**."}, {"tipo": "idea", "icono": "🤝", "titulo": "Normas del playtesting", "puntos": ["Se juega **en silencio**: el autor o la autora no ayuda.", "Se critica **el juego**, no a la persona.", "Cada crítica con una **propuesta de mejora**."]}, {"tipo": "practica", "titulo": "Ronda de pruebas (F2)", "tiempo": 22, "enunciado": "Prueba **dos juegos** (8 min cada uno) y rellena el formulario F2 para cada uno.", "pasos": ["Abre el enlace del juego.", "Juega los 3 niveles (o hasta donde llegues).", "Responde F2: lo que funciona, lo que falla y una mejora."], "enlace": "https://forms.gle/cvWS1MECi1KLZqbU6"}, {"tipo": "practica", "titulo": "Leer opiniones y corregir", "tiempo": 20, "enunciado": "Lee lo que han dicho de tu juego, elige **los dos fallos más importantes** y corrígelos.", "pasos": ["Fallo 1 → causa → solución.", "Fallo 2 → causa → solución.", "Apúntalo en el cuaderno: lo usarás en la Tarea 7.2."]}, {"tipo": "quiz", "pregunta": "Alguien dice: «El nivel 2 es imposible». ¿Qué haces primero?", "opciones": ["Ignorarlo: a mí me sale", "Mirar dónde se atasca y probar a bajar la dificultad", "Borrar el nivel 2"], "correcta": 1, "explicacion": "Primero **observas** el problema y luego cambias **una cosa** (menos enemigos, más tiempo entre apariciones) y vuelves a probar."}]}}, {"n": 10, "fase": "Bloque 2 · Diseño de características avanzadas", "titulo": "Pulido final y entrega de mi videojuego", "reto": "Añadir pantalla de inicio e instrucciones, comprobar el juego con la rúbrica y entregarlo.", "actividades": [{"nombre": "Lo que separa un 7 de un 10", "min": 5, "desc": "El docente proyecta la rúbrica de la Tarea 7.2 y muestra un ejemplo de pantalla de inicio con el título y los controles («pantalla de bienvenida» o splash)."}, {"nombre": "Pantalla de inicio y pulido", "min": 20, "desc": "Cada estudiante añade una pantalla de inicio con el título y las instrucciones, revisa los textos (sin faltas, sin nombres reales completos) y elige una música o efecto de sonido. Quien vaya atrasado se centra en que funcionen los tres niveles."}, {"nombre": "Autocomprobación con la rúbrica", "min": 12, "desc": "Cada estudiante juega su juego de principio a fin con la rúbrica al lado y marca en qué nivel cree que está en cada línea; corrige lo que le baje la nota y anota en el cuaderno dos errores que haya resuelto en el proyecto."}, {"nombre": "Entrega", "min": 13, "desc": "Cada estudiante comparte el proyecto y entrega en la Tarea 7.2 el enlace, tres capturas (un nivel, los bloques de los enemigos y los de la función de uda a la IA y **compruébalo** en tu juego.", "pasos": ["Escribe tu petición.", "Resume la respuesta.", "¿Funcionó? ¿Qué cambiaste tú?", "¿Qué no te creíste o era incorrecto?"], "enlace": "https://docs.google.com/document/d/1rG70OIBaXkF6Xz_u-wqohkqxV-g_lZMofV6aLVbnXoU/copy"}, {"tipo": "idea", "icono": "🔓", "titulo": "Software libre y licencias", "puntos": ["MakeCode es **software libre**: su código es público y lo mejora una comunidad.", "Cada recurso tiene una **licencia** que dice cómo puedes usarlo.", "Si usas IA, música o dibujos ajenos, **lo citas**."]}, {"tipo": "practica", "titulo": "Créditos y entrega", "tiempo": 8, "entrega": "Tarea 7.3 · Bitácora: del bloque al código con IA", "enunciado": "Completa en A1 el apartado de créditos (IA y recursos usados), descarga la plantilla como PDF y entrégala."}, {"tipo": "quiz", "pregunta": "La IA te da un código que usa un bloque que no encuentras en MakeCode. ¿Qué haces?", "opciones": ["Lo copio igual, la IA sabe más", "Lo pruebo, veo que falla y le pido otra solución o busco el bloque real", "Dejo el juego como estaba y no lo cuento"], "correcta": 1, "explicacion": "Las IA a veces **inventan** funciones. Probar, comprobar y anotarlo en la bitácora es justo lo que se valora."}]}}, {"n": 13, "fase": "Bloque 3 · Del bloque al código e IoT", "titulo": "Objetos conectados: un mando por inclinación con micro:bit", "reto": "Programar una micro:bit como mando que detecta la inclinación y la envía por radio a otra placa, como un wearable o un objeto IoT.", "actividades": [{"nombre": "¿Qué es el Internet de las cosas?", "min": 8, "desc": "El docente parte de objetos que conocen: la pulsera o el reloj que cuenta pasos, el mando de una consola que detecta movimiento, el enchufe que se enciende desde el móvil. Con la infografía explica el esquema sensor → dato → conexión → acción y forma las parejas o tríos del proyecto final."}, {"nombre": "El acelerómetro", "min": 12, "desc": "Cada pareja abre MakeCode para micro:bit y programa .4.A.4"], "metodologia": ["Aprendizaje cooperativo", "Aprendizaje basado en proyectos (ABP)"], "evidencias": ["Versión final del juego", "Ficha del juego y créditos (A2)"], "recursos": ["MakeCode Arcade", "MakeCode para micro:bit", "Placas micro:bit GO del centro", "Plantilla A2"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Elección del módulo según los intereses del equipo; banco de mejoras con tres niveles de dificultad; la demo se puede apoyar en una diapositiva de Canva o Genially."}, "ejercicios": ["Programa en JavaScript o Python al menos una mejora en el juego del equipo.", "Desarrolla el módulo IoT (mando micro:bit) o el de IA y documéntalo en la ficha del juego.", "Completa los créditos y la licencia de vuestro juego."], "clase": {"pregunta": "¿Cómo trabaja un estudio indie de dos o tres personas para sacar un juego a tiempo?", "diapositivas": [{"tipo": "ejemplo", "icono": "🧑‍💻", "titulo": "Programar en pareja", "situacion": "Muchos juegos indie que triunfan los hacen **dos o tres personas**.", "explicacion": "Una técnica muy usada: **conductor/a** escribe y **navegante** revisa, busca errores y piensa el siguiente paso. A mitad de tiempo, **cambiáis**."}, {"tipo": "practica", "titulo": "Plan del equipo (A2)", "tiempo": 5, "enunciado": "Repartid roles y apuntad el plan en la ficha A2.", "pasos": ["Juego base.", "Mejora en código de texto.", "Módulo: IoT (mando micro:bit) o IA."], "agrupamiento": "Parejas o tríos", "enlace": "https://docs.google.com/document/d/1xzO3Y56uLCQf5Z4eFmeEYgV2slis4dwI1BaB9eMOIyo/copy"}, {"tipo": "codigo", "titulo": "Idea de mejora: enemigos más rápidos en cada nivel", "codigo": "def aparecer_enemigo():\n    enemigo = sprites.create(img_enemigo, SpriteKind.enemy)\n    tiles.place_on_random_tile(enemigo, assets.tile(\"suelo\"))\n    enemigo.vx = randint(-1, 1) * nivel * 20\n    enemigo.vy = randint(-1, 1) * nivel * 20\n    enemigo.set_bounce_on_wall(True)\n\ngame.on_update_interval(2000, aparecer_enemigo)" idado del material."}, {"nombre": "Autoevaluación y cierre", "min": 10, "desc": "Cada estudiante responde el formulario F3 de autoevaluación (con su correo del centro). El docente cierra con la pregunta guía y recoge en la pizarra qué se llevan de la programación para otros ámbitos (resolver problemas, pedir ayuda, trabajar en equipo)."}], "criterios": ["DIG.4.2.3", "DIG.4.1.1", "DIG.4.1.3", "DIG.4.4.1"], "saberes": ["DIG.4.B.2", "DIG.4.A.4"], "metodologia": ["Aprendizaje basado en juegos y gamificación", "Aprendizaje cooperativo"], "evidencias": ["Presentación del juego (Tarea 7.4, líneas de presentación)", "Playtesting F2", "Autoevaluación F3"], "recursos": ["Proyector", "Formularios F2 y F3", "Placas micro:bit GO del centro"], "dua": {"principios": ["Acción y Expresión", "Compromiso"], "medidas": "La presentación puede apoyarse en una diapositiva de Canva o Genially o en un vídeo grabado de la pantalla (sin rostros); cada persona del equipo elige qué parte cuenta."}, "ejercicios": ["Presenta en 2 minutos vuestro juego, una mejora con su código y un problema que resolvisteis.", "Juega a los juegos de otros equipos y responde el formulario de playtesting.", "Responde la autoevaluación final de la SdA."], "moodle": [{"recurso": "Tarea", "nombre": "7.4 · Arcade Day: versión final del videojuego", "uso": "Tarea evaluable del proyecto final en pareja o trío: el producto se entrega antes de la sesión 15 y la nota se completa con la presentación en el Arcade Day.", "correccion": "rubrica", "criterio": "DIG.4.2.3", "rubrica": [{"linea": "Mejora programada en JavaScript o Python", "criterio": "DIG.4.2.3", "peso": 22.2, "niveles": ["No hay mejora programada en código de texto.", "Hay un cambio de un valor en el texto, sin nueva funcionalidad.", "Una mejora sencilla escrita en texto que funciona a medias.", "Una mejora nueva escrita en JavaScript o Python que funciona en el juego.", "Mejora que usa variables o funciones (p. ej. depende del nivel), funciona y el código está o  el reto, la pregunta guía, las sesiones y el calendario de entregas", "Página «Cómo se evalúa» con las listas de verificación de 7.1 y 7.3 y las rúbricas de 7.2 y 7.4", "URL a MakeCode Arcade y a MakeCode para micro:bit (ventana nueva)", "Tarea 7.1 (sesión 4)", "Tarea 7.2 (sesión 10)", "Tarea 7.3 (sesión 12)", "Tarea 7.4 (sesiones 14-15)"]}], "calificaciones": "Cuatro categorías, una por criterio (DIG.4.1.1, DIG.4.1.3, DIG.4.2.3 y DIG.4.4.1). Las Tareas 7.1 y 7.3 usan la escala «No apto, Apto»; las Tareas 7.2 y 7.4 se califican con rúbrica sobre 10 y van a la categoría de su criterio principal (DIG.4.2.3). La guía del profesorado calcula la nota de cada criterio a partir de las líneas de las rúbricas, que es la que se traslada a Séneca.", "configuracion": ["Escala personalizada «No apto, Apto».", "Grupos: uno por pareja o trío y agrupamiento «SdA7 · Estudios» solo para la Tarea 7.4.", "Rúbricas de 7.2 y 7.4 guardadas como plantilla.", "Finalización de actividad activada y fechas visibles en el calendario.", "Prórrogas individuales en las Tareas para alumnado con NEAE o ausencias justificadas."], "area_texto": {"bloques": [{"nombre": "Bloque 1 · Iniciación con MakeCode Arcade", "descripcion": "Sprites, bucle de juego, eventos, puntos y vidas · Entrega: Tarea 7.1", "sesiones": "1-4"}, {"nombre": "Bloque 2 · Diseño de características avanzadas", "descripcion": "Mapa ampliado, colisiones, enemigos al azar y 3 niveles · Entrega: Tarea 7.2", "sesiones": "5-10"}, {"nombre": "Bloque 3 · Del bloque al código e IoT", "descripcion": "JavaScript/Python, IA para depurar, mando micro:bit y Arcade Day · Entregas: Tareas 7.3 y 7.4", "sesiones": "11-15"}], "eventos": [{"sesion": 9, "texto": "Playtesting: otras personas prueban tu juego", "tipo": "Coevaluación en clase"}, {"sesion": 15, "texto": "Arcade Day: presentación de 2 minutos por equipo", "tipo": "Se evalúa en clase"}], "nota_evaluacion": "Las Tareas **7.1** y **7.3** se corrigen como Apto / No apto con una lista de comproba 2.3": {"tipo": "cr", "texto": "Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.D.1"]}, "DIG.4.2.4": {"tipo": "cr", "texto": "Interactuar en espacios virtuales de comunicación y plataformas de aprendizaje colaborativo, compartiendo y publicando información y datos, adaptándose a diferentes audiencias con una actitud participativa y respetuosa.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.3", "DIG.4.D.5", "DIG.4.D.6"]}, "DIG.4.3.1": {"tipo": "cr", "texto": "Proteger los datos personales y la huella digital generada en internet, configurando las condiciones de privacidad de las redes sociales y espacios virtuales de trabajo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.2"]}, "DIG.4.3.2": {"tipo": "cr", "texto": "Configurar y actualizar contraseñas, sistemas operativos y antivirus de forma periódica en los distintos dispositivos digitales de uso habitual.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.1"]}, "DIG.4.3.3": {"tipo": "cr", "texto": "Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.3"]}, "DIG.4.4.1": {"tipo": "cr", "texto": "Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.5"]}, "DIG.4.4.2": {"tipo": "cr", "texto": "Reconocer .4.B.2", "DIG.4.B.3", "DIG.4.B.4"], "criterios": []}, "DIG.4.B.1": {"tipo": "sb", "texto": "Búsqueda, administración, gestión, selección y archivo de información.", "hijos": [], "criterios": []}, "DIG.4.B.2": {"tipo": "sb", "texto": "Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.B.3": {"tipo": "sb", "texto": "Comunicación y colaboración en red.", "hijos": [], "criterios": []}, "DIG.4.B.4": {"tipo": "sb", "texto": "Publicación y difusión responsable en redes.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.C": {"tipo": "sb", "texto": "Seguridad y bienestar digital.", "hijos": ["DIG.4.C.1", "DIG.4.C.2", "DIG.4.C.3"], "criterios": []}, "DIG.4.C.1": {"tipo": "sb", "texto": "Seguridad de dispositivos: medidas preventivas y correctivas para hacer frente a riesgos, amenazas y ataques a dispositivos.", "hijos": [], "criterios": []}, "DIG.4.C.2": {"tipo": "sb", "texto": "Seguridad y protección de datos: identidad, reputación digital, privacidad y huella digital. Medidas preventivas en la configuración de redes sociales y la gestión de identidades virtuales.", "hijos": [], "criterios": []}, "DIG.4.C.3": {"tipo": "sb", "texto": "Seguridad en la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).", "hijos": [], "criterios": []}, "DIG.4.D": {"tipo": "sb", "texto": "Ciudadanía digital crítica.", "hijos": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.3", "DIG.4.D.4", "DIG.4.D.5", "DIG.4.D.6"], "criterios": []}, "DIG.4.D.1": {"tipo": "sb", "texto": "Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.D.2": {"tip
