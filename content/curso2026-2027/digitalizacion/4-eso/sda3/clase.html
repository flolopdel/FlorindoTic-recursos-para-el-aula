oria, textos, datos con fuente y créditos.", "🎨 **Diseñador/a-coordinador/a**: viñetas, carrusel, hitos y entrega.", "🔁 A mitad de cada sesión, **cambiad el teclado**.", "¿Trabajas solo/a? Haces los dos roles. ¿Trío? La tercera persona verifica datos.", "Elegid nombre y acordad vuestras normas en el contrato."], "enlace": "https://docs.google.com/document/d/1yBuyrvok4rhcMLExjrNgnZH9oBBXjepxnOLZPloM1Wg/copy"}, {"tipo": "cierre", "puntos": ["Las pantallas y las redes tienen efectos en el cuerpo, en la mente y en cómo nos tratamos.", "Dos bloques: el cómic de salud digital y el debate sobre la IA.", "Las entregas están repartidas: la primera, en la sesión 3."], "siguiente": "Analizamos nuestro cuerpo digital: posturas, ojos y sueño.", "pregunta": "¿Qué te interesa más: el cuerpo, la mente o las redes?"}]}, {"n": 2, "fase": "Bloque 1 · Inicio", "titulo": "Cuerpo digital: ergonomía y enfermedades digitales", "reto": "Reconocer los riesgos físicos del uso de pantallas y corregir la postura en el propio puesto de trabajo.", "pregunta": "¿Cuánto pesa tu cabeza cuando miras el móvil?", "diapositivas": [{"tipo": "ejemplo", "icono": "🛋️", "titulo": "El sofá a las 11 de la noche", "situacion": "Tumbado/a en el sofá, el móvil en el pecho, la cabeza doblada hacia abajo. **Dos horas** sin moverte.", "explicacion": "Con la cabeza recta, el cuello sostiene unos **5 kg**; inclinada 60°, soporta unos **27 kg**: como cuatro mochilas del instituto. Por eso al día siguiente duelen el cuello y la espalda.", "pregunta": "¿Os suena esta postura?", "nota": "Haz antes el «¡congelados!»: que observen su propia postura en el aula sin señalar a nadie. Datos aproximados del estudio de Hansraj (2014) sobre la carga en la columna cervical."}, {"tipo": "infografia", "titulo": "Enfermedades digitales: síntoma y prevención", "elementos": [{"icono": "🦒", "titulo": "Cuello de texto", "texto": "Dolor de cuello y hombros. **Sube el móvil** a la altura de los ojos."}, {"icono": "👀", "titulo": "Vista cansada", "texto": "Ojos secos, picor, visión borrosa. **Regla 20-20-20**."}, {"icono": "👍", "titulo": "Pulgar y muñeca", "texto": "Dolor al escribir. **Muñeca recta** y pausas."}, {"icono": "🪑", "titulo": "Sedentarismo", "texto": "Cansancio, espalda. **Levántate** cada hora."}, {"icono": "🌙", "titulo": "Sueño", "texto": "Te cuesta dormirte. **Pantalla fuera** una hora antes."}], "guia": "1.2"}, {"tipo": "infografia", "titulo": "Lista de auditoría: tu puesto en 8 puntos", "svg": "<svg viewBox=\"0 0 700 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Postura correcta ante el ordenador: persona sentada con la pantalla a la altura de los ojos, a un brazo de distancia, espalda apoyada, pies en el suelo, codos a 90 grados y muñecas rectas\"><line x1=\"20\" y1=\"280\" x2=\"450\" y2=\"280\" style=\"stroke:var(--ink)\" stroke-width=\"2\"/><line x1=\"139\" y1=\"105\" x2=\"139\" y2=\"215\" style=\"stroke:var(--accent)\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"139\" y1=\"208\" x2=\"232\" y2=\"208\" style=\"stroke:var(--accent)\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"180\" y1=\"208\" x2=\"180\" y2=\"278\" style=\"stroke:var(--accent)\" stroke-width=\"4\"/><line x1=\"240\" y1=\"174\" x2=\"425\" y2=\"174\" style=\"stroke:var(--warm)\" stroke-width=\"7\" stroke-linecap=\"round\"/><line x1=\"412\" y1=\"174\" x2=\"412\" y2=\"278\" style=\"stroke:var(--warm)\" stroke-width=\"4\"/><rect x=\"400\" y=\"70\" width=\"12\" height=\"80\" rx=\"3\" style=\"fill:var(--brand-soft);stroke:var(--brand)\" stroke-width=\"2\"/><line x1=\"406\" y1=\"150\" x2=\"406\" y2=\"174\" style=\"stroke:var(--brand)\" stroke-width=\"4\"/><circle cx=\"168\" cy=\"80\" r=\"18\" style=\"fill:var(--card);stroke:var(--ink)\" stroke-width=\"3\"/><g style=\"stroke:var(--ink)\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"><line x1=\"150\" y1=\"98\" x2=\"146\" y2=\"196\"/><line x1=\"144\" y1=\"196\" x2=\"230\" y2=\"196\"/><line x1=\"230\" y1=\"196\" x2=\"230\" odos a 90°<\/text><text x=\"470\" y=\"190\">6 · Muñecas rectas<\/text><text x=\"470\" y=\"220\">7 · Luz sin reflejos<\/text><text x=\"470\" y=\"250\">8 · Pausa cada 20 minutos<\/text><\/g><\/svg>", "nota": "Esta lámina es la lista de auditoría y el modelo para el dibujo: déjala proyectada durante la práctica. Con la cabeza recta, el cuello soporta unos 5 kg; inclinada 60°, unos 27 kg."}, {"tipo": "practica", "titulo": "Auditoría ergonómica de tu puesto", "tiempo": 18, "agrupamiento": "Parejas", "enunciado": "Revisad el puesto de cada uno con los **8 puntos de la lámina**: un punto por cada cosa que se cumple. Ajustad silla y pantalla y **volved a puntuar**.", "pasos": ["Puntuación inicial: … / 8 (en el cuaderno).", "Ajustad altura de la silla, distancia y ángulo de la pantalla.", "Puntuación final: … / 8.", "Dibujad en el cuaderno un **monigote de palitos** con la postura del sofá con el móvil y, al lado, otro con la postura corregida."], "ayudas": [{"tipo": "pista", "titulo": "Cómo dibujar el monigote", "puntos": ["Círculo para la cabeza y una línea para la espalda.", "Sofá: espalda curvada, cabeza inclinada hacia el móvil, móvil en el pecho.", "Corregido: espalda apoyada, móvil a la altura de los ojos, codos apoyados en un cojín.", "Marca con una flecha roja dónde se carga el cuello."]}]}, {"tipo": "pasos", "titulo": "Pausa activa (2 minutos)", "progresivo": true, "pasos": ["Cuello: mira a un lado, al otro, arriba y abajo, despacio.", "Hombros: súbelos hacia las orejas y déjalos caer 5 veces.", "Muñecas: estira los dedos hacia atrás con la otra mano 10 segundos.", "**20-20-20**: mira por la ventana algo lejano durante 20 segundos."]}, {"tipo": "quiz", "pregunta": "Llevas 20 minutos mirando la pantalla. ¿Qué dice la regla 20-20-20?", "opciones": ["Apagar la pantalla 20 minutos", "Mirar 20 segundos algo a unos 6 metros", "Bajar el brillo al 20 %"], "correcta": 1, "explicacion": "Cada **20 minutos**, mirar **20 segundos** algo a unos **20 pies** (unos 6 metros). Los ojos relajan el enfoque."}, {"tipo": "practica", "titulo": "Mi radiografía digital · Parte 1: Cuerpo", "tiempo": 10, "agrupamiento": "Individual", "enunciado": "Abre tu copia de la **plantilla A1** y escribe **dos riesgos físicos** que reconoces en ti, con su causa, y **tres cambios** que puedes hacer.", "pasos": ["Riesgo 1 y su causa.", "Riesgo 2 y su causa.", "Tres cambios concretos: qué, cuándo y cómo."], "entrega": "Tarea 3.1 · Mi radiografía digital (se entrega la próxima sesión)", "enlace": "https://docs.google.com/document/d/1RvdHx_LDf6YEOHOihBMxfLL_A1EG2BQ1DwHbeosAWLM/copy"}, {"tipo": "cierre", "puntos": ["Inclinar la cabeza multiplica el peso que soporta el cuello.", "Los ojos necesitan pausas: regla 20-20-20.", "Un buen puesto se ajusta: altura, distancia, muñecas y luz."], "siguiente": "De la espalda a la cabeza: tecnoestrés, nomofobia y apps que enganchan.", "pregunta": "¿Qué cambio de postura vas a probar esta tarde?"}]}, {"n": 3, "fase": "Bloque 1 · Inicio", "titulo": "Mente y redes: dependencia, diseño que engancha y cuando la red hace daño", "reto": "Identificar los riesgos para la salud mental del uso de pantallas, reconocer los trucos de diseño persuasivo y las situaciones de riesgo en las redes (privacidad, suplantación, ciberacoso y cibercontrol), y elaborar un plan personal de hábitos y de ayuda.", "pregunta": "¿Usas tú el móvil o el móvil te usa a ti?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔔", "titulo": "Sales de casa… sin móvil", "situacion": "Llegas a la parada del autobús y te tocas el bolsillo: **no está**. El corazón se acelera y piensas en todo lo que te vas a perder.", "explicacion": "Ese malestar tiene nombre: **nomofobia** (*no mobile phone phobia*). No es una enfermedad oficial, pero indica **dependencia** del móvil.", "pregunta": "¿Tú qué sentirías: 😌, 😬 o 😱?"}, {"tipo": "idea", "icono": "🧠", "titulo": "Cinco palabras para entender tu mente digital", "puntos": ["**Tecnoestrés** y **FOMO**: agobio por notificaciones y miedo a perderte algo.", "**Nomofobia**: miedo a estar sin móvil.", "**Phubbing**: ignorar a quien tienes delante por mirar el móvil.", "**Adicción**: dejas de dormir, quedar o estudiar por la pantalla."], "nota": "La adicción se trabaja con el apartado 13 del REA «¿Controlas las redes?». Señales de alarma: enfado si no se puede usar, mentir sobre el tiempo de uso, abandonar otras actividades.", "guia": "1.3"}, {"tipo": "practica", "titulo": "Test anónimo de nomofobia", "tiempo": 7, "agrupamiento": "Individual", "enunciado": "Responde las **10 afirmaciones** del test. Es **anónimo** y no es un diagnóstico: sirve para pensar en tus hábitos.", "pasos": ["Abre el enlace del test.", "Marca de 1 (nada de acuerdo) a 7 (totalmente de acuerdo).", "Lee tu resultado orientativo y guárdalo para ti."], "nota": "Adaptado de la escala NMP-Q (Yildirim y Correia, 2015). No pidas a nadie que comparta su puntuación.", "enlace": "https://forms.gle/QJ8EuqAkaqKT1HtCA"}, {"tipo": "practica", "titulo": "Caza de trucos en FlashTok", "tiempo": 9, "agrupamiento": "Parejas", "enunciado": "Analizad la app inventada **FlashTok**: **5 trucos** que enganchan y un **contra-truco** para cada uno.", "pasos": ["♾️ Scroll infinito · 🔴 Punto rojo.", "🔥 Rachas · ▶️ Vídeo que empieza solo.", "🎰 Recompensa variable: como una tragaperras.", "Contra-trucos: avisos fuera, límites, escala de grises…"], "material": ["App FlashTok"], "enlace": ["https://florindotic.es/content/curso2026-2027/digitalizacion/4-eso/sda3/flashtok.html", "https://docs.google.com/document/d/1hrvTsZl2IdJby1hRowASwSGXNRVnwIdm-3pTW4O_WRc/copy"], "ayudas": [{"tipo": "pista", "titulo": "El contra-truco que mejor funciona", "texto": "Desactivar las notificaciones que no sean de personas: si **no llega el aviso**, el cerebro no espera la recompensa."}]}, {"tipo": "practica", "titulo": "Cuando la red hace daño", "tiempo": 8, "agrupamiento": "Toda la clase", "enunciado": "Cuatro casos inventados. ¿Qué riesgo es cada uno y **qué harías tú**?", "pasos": ["📸 Suben al grupo una foto tuya **sin preguntarte**.", "🎭 Un perfil con **tu nombre y tus fotos** pide dinero.", "😢 Memes en un grupo para **reírse de un compañero**.", "🔒 Tu pareja exige tu **contraseña y ubicación**."], "guia": "1.4", "nota": "Casos adaptados del REA «¿Controlas las redes? No dejes que te controlen». Trátalos con calma y sin pedir experiencias personales delante de la clase. Recuerda las vías de ayuda.", "ayudas": [{"tipo": "pista", "titulo": "Solución para comprobar", "puntos": ["1 · **Privacidad e imagen**: pide que la borre; compartir fotos de otras personas necesita su permiso.", "2 · **Suplantación de identidad**: avisa a tus contactos, denuncia el perfil en la red social y guarda capturas.", "3 · **Ciberacoso**: no reenvíes (también es participar), apoya a la víctima y cuéntalo a un adulto.", "4 · **Cibercontrol**: no es amor, es control. Habla con alguien de confianza; el **017** y **ANAR (900 20 20 10)** ayudan."]}, {"tipo": "emociones", "titulo": "Si alguno de estos casos te toca de cerca", "texto": "No estás solo/a ni es culpa tuya. Puedes hablar con tu tutor/a, con Orientación o llamar a la **Fundación ANAR (900 20 20 10)**, gratis y a cualquier hora."}]}, {"tipo": "practica", "titulo": "Mi radiografía digital · Parte 2 y entrega", "tiempo": 13, "agrupamiento": "Individual", "enunciado": "Completa la parte **Mente y redes** de la **plantilla A1**: dos riesgos que reconoces, tu **plan de tres hábitos** y **a quién pedir ayuda**.", "pasos": ["Dos riesgos psicológicos o de las redes.", "Tres hábitos: qué, cuándo y cómo.", "Una vía de ayuda: familia, tutoría, Orientación, 017 o ANAR.", "Descarga en PDF y entrega."], "entrega": "Tarea 3.1 · Mi radiografía digital", "enlace": "https://docs.google.com/document/d/1RvdHx_LDf6YEOHOihBMxfLL_A1EG2BQ1DwHbeosAWLM/copy"}, {"tipo": "cierre", "puntos": ["Muchas apps están diseñadas para que no las sueltes: conocer los trucos ayuda a desactivarlos.", "En las redes también hay riesgos para la privacidad, la identidad y la convivencia.", "Si algo en la red te hace daño, pide ayuda: no estás solo/a."], "siguiente": "Del dato a la viñeta: elegimos tema y empezamos el cómic.", "pregunta": "¿Qué contra-truco vas a probar esta semana?"}]}, {"n": 4, "fase": "Bloque 1 · Desarrollo", "titulo": "Del dato a la viñeta: tema, guion del cómic e imágenes con licencia", "reto": "Elegir el tema de salud digital o de riesgos en redes del cómic, investigarlo con la guía del alumnado, planificar la historia en un guion gráfico con elementos interactivos y empezar a montarlo respetando las licencias.", "pregunta": "¿Cómo se convierte un dato de salud en una historia que se recuerda?", "diapositivas": [{"tipo": "ejemplo", "icono": "📖", "titulo": "Lo que recuerdas de un TikTok", "situacion": "De un vídeo de 30 segundos no recuerdas la cifra exacta: recuerdas **a la persona**, **lo que le pasó** y **cómo terminó**.", "explicacion": "Las historias funcionan porque tienen **personaje, conflicto y final**. Un cómic las cuenta con **viñetas**, **bocadillos**, **cartelas** y **planos**; en el nuestro, el dato aparece en el **giro** de la historia.", "pregunta": "¿Qué vídeo informativo recuerdas y por qué?", "nota": "Proyecta dos páginas de cómic divulgativo y que señalen viñeta, bocadillo, cartela, onomatopeya y plano."}, {"tipo": "practica", "titulo": "Elegid tema e investigad", "tiempo": 10, "agrupamiento": "Parejas", "enunciado": "Cada pareja, **un tema** (máximo dos parejas por tema). Leed su ficha en la guía y anotad el **dato clave**, su **fuente** y **qué hacer**.", "pasos": ["🦴 1 · Cuello, postura y vista · 2 · Sueño y pantallas", "🧠 3 · Nomofobia, adicción y diseño que engancha", "📲 4 · Ciberacoso · 5 · Privacidad y fotos · 6 · Suplantación · 7 · Cibercontrol", "El diseñador/a-coordinador/a comunica el tema al docente."], "guia": ["1.2", "1.3", "1.4"]}, {"tipo": "practica", "titulo": "Guion gráfico de 6 viñetas", "tiempo": 18, "agrupamiento": "Parejas", "enunciado": "Planificad la historia viñeta a viñeta y marcad **dos elementos interactivos**.", "pasos": ["1 · Protagonista inventado/a y situación.", "2-3 · Conflicto: aparece el problema.", "4 · Giro: el dato real con su fuente.", "5 · Solución: un hábito sano o cómo reaccionar.", "6 · Llamada a la acción. Marcad **dos interacciones**."], "material": ["Plantilla de guion gráfico"], "enlace": "https://docs.google.com/document/d/1lRlzeGkBpvg2Se434h_mOsxUzdBOZ3GcmovHhNBCcj8/copy"}, {"tipo": "pasos", "titulo": "Cómo citar una imagen: fórmula TAFL", "progresivo": true, "pasos": ["**T**ítulo de la imagen.", "**A**utor/a.", "**F**uente (enlace).", "**L**icencia: CC BY, CC BY-SA, CC0…", "Ejemplo: «Chica con móvil» · Ana Ruiz · Openverse · CC BY 2.0"]}, {"tipo": "quiz", "pregunta": "¿Qué imagen PUEDES usar en tu cómic?", "opciones": ["Un personaje de dibujos famoso descargado de Google", "Una foto de tu compañera en clase", "Una ilustración CC BY de Openverse citada con TAFL"], "correcta": 2, "explicacion": "La licencia **CC BY** permite usarla si **citas a su autor/a**. Los personajes famosos tienen copyright y las fotos de compañeros/as necesitan permiso."}, {"tipo": "practica", "titulo": "Primera viñeta en Genially", "tiempo": 9, "agrupamiento": "Parejas", "enunciado": "Mirad la demostración, cread vuestro Genially, **compartidlo con tu pareja** y montad la **viñeta 1**.", "pasos": ["Crear → plantilla de cómic o lienzo en blanco.", "Fondo, personaje y bocadillo.", "Compartir → Colaborar con tu pareja.", "Primera imagen en la hoja de créditos."], "nota": "Graba la demostración y súbela a Moodle para quien falte o necesite repetirla."}, {"tipo": "cierre", "puntos": ["Un dato se recuerda si va dentro de una historia.", "Protagonista, conflicto, giro, solución y llamada a la acción.", "Toda imagen ajena lleva su crédito."], "siguiente": "Producción del cómic y versión para redes: entrega de la Tarea 3.2.", "pregunta": "¿Cuál es el dato que va en el giro de vuestra historia?"}]}, {"n": 5, "fase": "Bloque 1 · Desarrollo", "titulo": "Producción del cómic y versión para redes", "reto": "Terminar el cómic interactivo en Genially, preparar su versión accesible para redes y entregarlo.", "pregunta": "¿Tu publicación la puede disfrutar todo el mundo?", "diapositivas": [{"tipo": "idea", "icono": "📲", "titulo": "Hoy entregamos: publicación responsable y netiqueta", "puntos": ["Carrusel vertical **1080 × 1350 px**, 4 imágenes, con licencia **CC BY-SA**.", "**Texto alternativo**, contraste y letra grande.", "Sin datos personales ni etiquetas a otras personas.", "**Netiqueta**: nada de mayúsculas-grito, rumores ni contenido ajeno sin permiso."], "guia": "1.5"}, {"tipo": "practica", "titulo": "Producción por roles", "tiempo": 28, "agrupamiento": "Parejas", "enunciado": "Montad las **viñetas 2-6**, al menos **dos interacciones** y la **página de créditos**.", "pasos": ["🎨 Diseñador/a-coordinador/a: fondos, personajes e hitos.", "✍️ Guionista-verificador/a: bocadillos, cartelas, ventanas con dato y fuente, y créditos.", "Minuto 15 → viñetas 2-4; minuto 28 → todo lo demás.", "A mitad de la actividad, **cambiad el teclado**."], "material": ["Genially", "Guion gráfico", "Hoja de créditos"], "ayudas": [{"tipo": "pista", "titulo": "Ventana emergente: así no, así sí", "puntos": ["❌ Párrafo de 8 líneas, sin fuente y con letra pequeña.", "✅ Un dato en una o dos frases, fuente con enlace, letra grande y contraste."]}]}, {"tipo": "ejemplo", "icono": "🦻", "titulo": "Una publicación que no todos pueden ver", "situacion": "Un carrusel precioso… con letra fina, gris sobre blanco y sin descripción. Una persona con baja visión usa el lector de pantalla y solo oye: «**imagen**».", "explicacion": "El **texto alternativo** describe la imagen para quien no la ve, y el **contraste** y la **letra grande** ayudan a todas las personas.", "pregunta": "¿Cómo describirías vuestra portada en una frase?"}, {"tipo": "practica", "titulo": "Versión para redes en Canva", "tiempo": 12, "agrupamiento": "Parejas", "enunciado": "Elegid **4 viñetas** y montad el **carrusel** con portada y texto de la publicación.", "pasos": ["Abrid la plantilla de carrusel 1080 × 1350.", "Pegad las capturas de las viñetas.", "Portada con gancho.", "Texto de la publicación + texto alternativo de cada imagen."], "material": ["Plantilla de carrusel en Canva"]}, {"tipo": "quiz", "pregunta": "¿Cuál es un buen texto alternativo para una viñeta?", "opciones": ["«Imagen1.png»", "«Chica en la cama mirando el móvil a las 2 de la madrugada; el reloj marca la hora en rojo»", "«Viñeta bonita»"], "correcta": 1, "explicacion": "Describe **quién, qué y dónde** en una frase, para que quien no ve la imagen entienda la escena."}, {"tipo": "practica", "titulo": "Comprobación y entrega", "tiempo": 5, "agrupamiento": "Parejas", "enunciado": "Revisad con la lista y el diseñador/a-coordinador/a **entrega**.", "pasos": ["Historia completa.", "Dato con fuente.", "Interacciones que funcionan.", "Carrusel accesible.", "Créditos completos."], "entrega": "Tarea 3.2 · Cómic digital interactivo y versión para redes", "nota": "Recuerda: la entrega es el 66 % de la nota; el 33 % restante es la presentación oral de la sesión 6."}, {"tipo": "cierre", "puntos": ["Publicar es una responsabilidad: datos, personas, licencias y netiqueta.", "La accesibilidad mejora la publicación para todos.", "Nuestro cómic está listo para el estreno."], "siguiente": "¡Estreno! Galería y presentación de los cómics.", "pregunta": "¿Qué viñeta os ha quedado mejor y por qué?"}]}, {"n": 6, "fase": "Bloque 1 · Cierre", "titulo": "Estreno: galería y presentación de los cómics", "reto": "Presentar el cómic a la clase, explicar su mensaje de salud, dar y recibir retroalimentación y cerrar el bloque 1 con un compromiso personal.", "pregunta": "¿Qué cómic te ha hecho cambiar un hábito?", "diapositivas": [{"tipo": "practica", "titulo": "Montamos la galería", "tiempo": 4, "agrupamiento": "Parejas", "enunciado": "Abrid el cómic en **pantalla completa** y colocad la tarjeta de la estación.", "pasos": ["Nombre de la pareja.", "Tema del cómic (salud o redes)."]}, {"tipo": "ejemplo", "icono": "⭐", "titulo": "Dos estrellas y un deseo", "situacion": "Un amigo te enseña su primer vídeo editado y te pregunta qué te parece.", "explicacion": "Si solo dices «está guay», no le ayudas. Si dices **dos cosas concretas que funcionan** y **una mejora concreta**, le ayudas de verdad.", "pregunta": "¿Cómo dirías una mejora sin que suene a crítica?"}, {"tipo": "practica", "titulo": "Paseo de galería", "tiempo": 18, "agrupamiento": "Individual (un miembro de la pareja se queda en su estación y a mitad se cambian)", "enunciado": "Visita **al menos seis cómics** (unos 2 minutos cada uno), prueba sus interacciones y deja tus **⭐⭐ + 🙏** en el formulario.", "pasos": ["Lee la historia completa.", "Pulsa todas las interacciones.", "Escribe dos estrellas y un deseo.", "Cambia de estación cuando suene el cronómetro."], "material": ["Formulario de galería"], "enlace": "https://forms.gle/mY6ZWC8vV3njvxro7"}, {"tipo": "practica", "titulo": "Presentación del cómic", "tiempo": 20, "enunciado": "Cada pareja presenta en **minuto y medio**.", "pasos": ["¿Qué problema de salud o de las redes contamos y qué lo causa?", "¿Cuál es el dato clave y de dónde sale?", "¿Qué hábito o respuesta proponemos?", "Voz clara, mirar al público y los dos miembros implicados."], "nota": "Califica aquí las líneas 4 y 5 de la rúbrica de la Tarea 3.2 (riesgo y prevención · DIG.4.3.3; comunicación y pareja · DIG.4.2.3). Control de tiempo visible."}, {"tipo": "quiz", "pregunta": "En la presentación os preguntan por un dato del cómic y no recordáis la fuente. ¿Qué hacéis?", "opciones": ["Inventar una fuente que suene bien", "Mostrar la ventana del cómic o la página de créditos donde está", "Decir que da igual de dónde salga"], "correcta": 1, "explicacion": "Para eso están la **ventana con la fuente** y los **créditos**: el rigor se puede enseñar."}, {"tipo": "practica", "titulo": "Cierre del bloque 1", "tiempo": 8, "agrupamiento": "Individual", "enunciado": "Completamos la pizarra del primer día y escribimos **un compromiso**.", "pasos": ["¿Qué añadimos a Cuerpo, Mente y Redes?", "Mi compromiso: un hábito para las próximas semanas.", "Votamos los cómics que propondremos al centro."], "enlace": "https://forms.gle/14yGNMkaZ4iKNifu5"}, {"tipo": "cierre", "puntos": ["Hemos convertido datos de salud y riesgos de las redes en historias.", "La retroalimentación concreta ayuda a mejorar.", "Cada persona se lleva un compromiso de hábito."], "siguiente": "Bloque 2: ¿deberían los menores usar la IA generativa?", "pregunta": "¿Qué cómic (que no sea el tuyo) te ha hecho pensar más?"}]}, {"n": 7, "fase": "Bloque 2 · Inicio", "titulo": "¿Qué es la IA? El dilema de la IA generativa en menores", "reto": "Descubrir qué es la inteligencia artificial, cómo aprende una máquina y qué hace la IA generativa, conocer las normas sobre su uso por menores y mapear sus beneficios y riesgos desde varios puntos de vista.", "pregunta": "¿Prohibir, permitir o enseñar a usar?", "diapositivas": [{"tipo": "video", "titulo": "¿Persona o máquina?", "busqueda": "Google Duplex demostración llamada peluquería 2018 subtitulado español", "texto": "Un asistente de voz llama a una **peluquería** para pedir cita. Míralo con atención.", "duracion": "1:30", "preguntas": ["¿Te ha parecido una conversación real?", "¿Has distinguido a la persona de la máquina?", "¿Superaría el **test de Turing** (1950)?"], "nota": "Es el gancho del REA «Hola, ¿necesitas ayuda?» («¿Necesitas un corte de pelo?»). Busca la demostración de Google I/O 2018 con subtítulos y proyecta solo la llamada.", "ayudas": [{"tipo": "saber_mas", "titulo": "El test de Turing", "texto": "En 1950 Alan Turing propuso una prueba: una persona conversa por escrito con otra persona y con una máquina. Si no sabe distinguir cuál es la máquina, la máquina «supera» el test."}]}, {"tipo": "practica", "titulo": "Tres escenas: ¿bueno, malo o depende?", "tiempo": 6, "enunciado": "Votad cada escena con la mano: **bueno**, **malo** o **depende**.", "pasos": ["**Lucía, 15**: el chatbot le explica ecuaciones paso a paso y por fin las entiende.", "**Marcos, 14**: la IA le hace la redacción y la entrega tal cual.", "**Sara, 16**: cada noche habla con un chatbot «amigo» que siempre le da la razón."], "nota": "Escenas ficticias. Compara con la votación de la sesión 1. Pide razones, no solo votos."}, {"tipo": "ejemplo", "icono": "🐶", "titulo": "Enseñar a una máquina qué es un perro", "situacion": "Le enseñas a alguien que nunca ha visto un perro **cientos de fotos** de perros. Después le enseñas un perro que no había visto y dice: «¡un perro!».", "explicacion": "Así aprende una IA: los **datos** alimentan un **algoritmo** que crea un **modelo** capaz de **generalizar**. Si nunca vio un **puli** (un perro con rastas), se equivoca hasta que lo **reentrenas**. La IA generativa usa modelos así para **crear** textos e imágenes: predice lo más probable y a veces **se inventa** cosas.", "pregunta": "¿Qué pasa si todos los datos de entrenamiento son de un solo tipo de perro?", "nota": "Ejemplo de la lectura «Datos, algoritmos y aprendizaje» del REA «Hola, ¿necesitas ayuda?». Historia en 30 segundos: Turing (1950), Dartmouth (1956), ELIZA (1966), AlphaGo (2016). La pregunta conecta con los sesgos de la sesión 9.", "guia": "2.1"}, {"tipo": "practica", "titulo": "Equipos del bloque 2", "tiempo": 5, "enunciado": "Cuatro **equipos de debate** (4 personas) y dos **equipos de mesa** (3 personas: moderación, cronometraje y jurado).", "pasos": ["Escuchad vuestro equipo.", "Elegid nombre.", "Los roles se reparten en la sesión 10."]}, {"tipo": "practica", "titulo": "Mapa del dilema", "tiempo": 16, "agrupamiento": "Equipos", "enunciado": "En cada dimensión, escribid **un beneficio**, **un riesgo** y **quién gana o pierde**.", "pasos": ["📘 Aprender · ♿ Accesibilidad e inclusión.", "🎨 Creatividad y autoría · 🔒 Privacidad y datos.", "💛 Salud emocional y relaciones · 🌍 Planeta.", "Elegid la dimensión que os parece más importante."], "material": ["Mapa del dilema (Google Docs)"], "enlace": "https://docs.google.com/document/d/1lNfWS3J8vk45S6EmQH6JyLTgNebrbt8GcbynJkSPe6U/copy", "ayudas": [{"tipo": "pista", "titulo": "Ejemplo resuelto: accesibilidad", "texto": "Beneficio: un compañero con **dislexia** usa la IA para que le lea y le resuma el tema. Riesgo: que deje de practicar la lectura. Gana: quien tiene dificultades. Pierde: nadie, si se usa como apoyo y no como sustituto."}]}, {"tipo": "idea", "icono": "🎤", "titulo": "La moción del debate (sesión 12)", "texto": "«El uso de la IA generativa debería prohibirse a menores de 16 años»", "puntos": ["ChatGPT: no es para **menores de 13**; de 13 a 17, con **consentimiento** familiar.", "Ley en tramitación: edad para consentir datos de **14 a 16**; **deepfakes sexuales**, delito.", "2025: una plataforma de chatbots de compañía **cerró sus chats a menores de 18**.", "Preparáis **las dos posturas**: la vuestra se **sortea** el día del debate."], "nota": "La ley orgánica de protección de menores en entornos digitales se tramitaba en el Congreso en 2026; comprueba su estado antes de la sesión por si ya se ha aprobado."}, {"tipo": "cierre", "puntos": ["Una IA aprende de datos: si los datos fallan, la IA falla.", "La IA generativa predice y crea, pero puede inventar.", "El mismo uso puede ayudar o perjudicar: es un dilema."], "siguiente": "¿Real o generado? Cazabulos y deepfakes.", "pregunta": "Si tuvieras que decidir hoy, ¿prohibirías la IA generativa a menores de 16? ¿Por qué?"}]}, {"n": 8, "fase": "Bloque 2 · Desarrollo", "titulo": "¿Real o generado? Cazabulos y deepfakes", "reto": "Detectar bulos e imágenes generadas con IA, saber cómo actuar ante un deepfake y compartir lo verificado con respeto y citando fuentes.", "pregunta": "¿Lo compartirías sin comprobarlo?", "diapositivas": [{"tipo": "practica", "titulo": "¿Real, IA o bulo? Votad", "tiempo": 8, "enunciado": "Seis casos. Votad con la mano: **real**, **generado con IA** o **bulo**.", "pasos": ["La foto del Papa con un abrigo de plumas blanco.", "Un audio de un famoso pidiendo dinero para invertir.", "«La IA ya piensa y siente como una persona.»", "Una cita de un científico que da un chatbot.", "«Una consulta a la IA gasta lo mismo que una búsqueda.»", "Una foto de un centro de datos."], "nota": "Soluciones (al final de la sesión): generada con IA (2023); estafa con voz clonada; bulo; cita inventada (alucinación); con matices (depende del modelo y la tarea; las imágenes y vídeos gastan mucho más); real."}, {"tipo": "flujo", "titulo": "Kit del verificador/a ante la IA", "nodos": [{"texto": "Para: no lo compartas todavía", "tipo": "inicio"}, {"texto": "Señales: manos, textos, sombras, voz", "tipo": "proceso"}, {"texto": "Búsqueda inversa: Google Lens", "tipo": "proceso"}, {"texto": "¿Lo confirma Maldita, Newtral o EFE Verifica?", "tipo": "decision"}, {"texto": "Veredicto con fuentes", "tipo": "fin"}]}, {"tipo": "ejemplo", "icono": "🎧", "titulo": "La nota de voz de tu prima", "situacion": "Te llega un audio con la **voz de tu prima**: «Estoy en un lío, hazme un Bizum de 50 € a este número».", "explicacion": "Con unos segundos de audio, la IA puede **clonar una voz**. Señal de alarma: **urgencia + dinero + número nuevo**. Llama tú a tu prima a su número de siempre.", "pregunta": "¿Qué pregunta le harías que solo ella sabría contestar?"}, {"tipo": "idea", "icono": "🛑", "titulo": "Deepfakes de personas reales", "puntos": ["Crear o difundir un deepfake **daña a la víctima**, aunque sea «en broma».", "Si es sexual, **es delito**: en Almendralejo (2023), 15 menores fueron condenados.", "Si te pasa: **no lo compartas**, guarda pruebas y cuéntalo a un adulto.", "Pide la retirada en el **Canal prioritario de la AEPD** y llama al **017** o a **ANAR**."], "nota": "Trátalo con calma y sin detalles. Recuerda que el Departamento de Orientación y la tutoría también son vías de ayuda.", "guia": "2.2"}, {"tipo": "practica", "titulo": "Investigad vuestra tarjeta", "tiempo": 20, "agrupamiento": "Parejas", "enunciado": "Aplicad el kit a vuestro caso y rellenad la **ficha de verificación**.", "pasos": ["Leed vuestra tarjeta (número del 1 al 12).", "Aplicad el kit y buscad al menos dos fuentes fiables.", "Veredicto: verdad, bulo, generado con IA o con matices.", "Rellenad la ficha Cazabulos."], "material": ["Tarjeta del caso", "Ficha Cazabulos"], "enlace": "https://docs.google.com/document/d/1jeXDpaN8lcfnVErPO6R0htap7RH6iq8dUs2EMDemLJo/copy", "ayudas": [{"tipo": "pista", "titulo": "Dónde verificar", "puntos": ["Búsqueda inversa de imágenes: Google Lens.", "Verificadores: Maldita.es, Newtral, EFE Verifica.", "Fuentes oficiales: organismos públicos, universidades, medios con autoría y fecha."]}], "guia": "2.2", "nota": "Tarjetas para imprimir y soluciones en el documento «SdA 3 · Tarjetas Cazabulos (sesión 8)» de la carpeta de Drive. Las tarjetas 1, 6, 7, 8, 9 y 10 son las del gancho."}, {"tipo": "practica", "titulo": "Publicad en el foro Cazabulos", "tiempo": 12, "agrupamiento": "Parejas", "enunciado": "Publicad vuestra verificación con la plantilla y **responded a otra pareja** con respeto.", "pasos": ["Titular corto y veredicto.", "Dos fuentes enlazadas.", "Cómo lo hemos comprobado.", "Sin imágenes de personas reales.", "Una respuesta a otra pareja."], "entrega": "Foro S8 · Cazabulos: bulos y deepfakes de la IA"}, {"tipo": "cierre", "puntos": ["La IA puede crear imágenes, voces y citas falsas muy creíbles.", "Verificar lleva dos minutos; un bulo dura años.", "Un deepfake de una persona real hace daño y puede ser delito."], "siguiente": "¿Quién paga la IA? Sesgos, autoría, privacidad y huella.", "pregunta": "¿Qué argumento para el debate te llevas de hoy?"}]}, {"n": 9, "fase": "Bloque 2 · Desarrollo", "titulo": "¿Quién paga la IA? Sesgos, autoría, privacidad y huella", "reto": "Analizar casos reales de impacto ético y ecosocial de la IA generativa y redactar un código personal para usarla de forma ética.", "pregunta": "Si la IA parece gratis, ¿quién paga la factura?", "diapositivas": [{"tipo": "dato", "valor": "945 TWh", "texto": "Electricidad que podrían consumir los centros de datos del mundo en **2030**: más del **doble** que en 2024 (415 TWh), sobre todo por la **IA**.", "fuente": "Agencia Internacional de la Energía, «Energy and AI» (2025)", "pregunta": "¿Es un argumento a favor o en contra de la moción?"}, {"tipo": "ejemplo", "icono": "🤖", "titulo": "Una pregunta a la IA", "situacion": "Preguntas a un chatbot qué ponerte para una fiesta. Parece gratis y sin coste.", "explicacion": "Según Google, una consulta de texto mediana a Gemini gasta **0,24 Wh** y **0,26 ml de agua** (unas cinco gotas). Poco… pero hay **miles de millones** al día, y **una imagen o un vídeo** gastan mucho más.", "pregunta": "¿Cuántas imágenes con IA has generado este mes?", "nota": "Fuente: Google Cloud, agosto de 2025; datos de la propia empresa, no verificados de forma independiente. Conviene decirlo: también es educación mediática."}, {"tipo": "infografia", "titulo": "Cuatro facturas de la IA", "elementos": [{"icono": "⚖️", "titulo": "Sesgos", "texto": "Aprende de datos con **prejuicios** y los repite."}, {"icono": "©️", "titulo": "Autoría", "texto": "Imita a artistas **sin permiso** ni pago."}, {"icono": "🔒", "titulo": "Privacidad", "texto": "Tus textos y fotos pueden **entrenar** modelos."}, {"icono": "🌍", "titulo": "Planeta", "texto": "**Electricidad, agua** y minerales de los centros de datos."}]}, {"tipo": "practica", "titulo": "Tribunal de casos", "tiempo": 20, "agrupamiento": "Equipos", "enunciado": "Analizad vuestro caso con las **cuatro preguntas** y preparad **un minuto** de exposición.", "pasos": ["¿Quién gana?", "¿Quién pierde?", "¿Qué derecho está en juego?", "¿Qué proponemos?", "El portavoz lo cuenta en 1 minuto."], "material": ["Tarjeta del caso (1-12)", "Ficha del tribunal"], "enlace": "https://docs.google.com/document/d/1Q9gvNAL_mZhGF75Uqzv9qRA4k-5FtTVMybbc2KaIL7o/copy", "guia": "2.3", "nota": "Ficha y 12 tarjetas en «SdA 3 · Tribunal de casos (sesión 9)». Reparte casos de temas distintos; el caso 8 trátalo con calma y sin detalles."}, {"tipo": "quiz", "pregunta": "Una IA de selección de personal descarta más currículos de mujeres porque aprendió de contrataciones antiguas. ¿Qué problema es?", "opciones": ["Un fallo de conexión", "Un sesgo algorítmico", "Un virus informático"], "correcta": 1, "explicacion": "El algoritmo **copia el pasado**: si antes se contrataba sobre todo a hombres, aprende ese **sesgo**."}, {"tipo": "practica", "titulo": "Mi código ético de la IA", "tiempo": 18, "agrupamiento": "Individual", "enunciado": "Escribe en la **plantilla A2** **cinco normas** para usar la IA generativa y responde al **dilema del meme**.", "pasos": ["«Usaré la IA para… / No la usaré para…»", "Privacidad: datos y fotos de otras personas.", "Autoría: cuándo indico que he usado IA.", "Comprobar lo que dice · Consumo responsable.", "Dilema: un meme con la cara de un profesor generada con IA. ¿Qué haces?"], "entrega": "Tarea 3.3 · Mi código ético de la IA", "enlace": "https://docs.google.com/document/d/1OSJJkSRPd23JtIi8M8W8GtN3QvewR7hFYS41kcEsg_k/copy"}, {"tipo": "cierre", "puntos": ["La IA tiene costes que no se ven: sesgos, autoría, privacidad y planeta.", "Usarla bien depende de normas claras, también las tuyas.", "Los casos de hoy son argumentos para el debate."], "siguiente": "Los roles del debate y cómo se construye un buen argumento.", "pregunta": "¿Qué norma de tu código te va a costar más cumplir?"}]}, {"n": 10, "fase": "Bloque 2 · Desarrollo", "titulo": "Conoce el debate: roles, evidencias y argumentos", "reto": "Conocer cómo funciona un debate académico (orden de intervenciones y función de cada rol), asumir un rol y empezar la guía del debate buscando argumentos con evidencias para las dos posturas.", "pregunta": "¿Qué convierte una opinión en un argumento?", "diapositivas": [{"tipo": "comparar", "titulo": "Debate malo, debate bueno", "columnas": [{"titulo": "Debate malo", "icono": "😤", "puntos": ["«¡Eso es una tontería!»", "Interrumpir y gritar", "Opiniones sin pruebas", "Solo importa ganar"]}, {"titulo": "Debate bueno", "icono": "🤝", "puntos": ["Una idea por turno", "Un porqué y una prueba", "Rebatir la idea, no a la persona", "Acercar posturas"]}], "pregunta": "¿Qué diferencia veis entre los dos fragmentos?", "nota": "Idea de la «Guía para el debate académico en el aula» (REA/DUA Andalucía): el debate se enfoca de forma positiva, no competitiva."}, {"tipo": "flujo", "titulo": "Orden de intervenciones (cada ronda)", "nodos": [{"texto": "Introductores/as: a favor → en contra (1,5 min)", "tipo": "inicio"}, {"texto": "Refutadores/as 1: a favor → en contra (2 min)", "tipo": "proceso"}, {"texto": "Refutadores/as 2: a favor → en contra (2 min)", "tipo": "proceso"}, {"texto": "Conclusores/as: a favor → en contra (1,5 min)", "tipo": "proceso"}, {"texto": "Jurado: fichas, veredicto y acuerdos", "tipo": "fin"}], "nota": "El equipo se comunica solo por escrito mientras habla el otro. Para preguntar, se levanta la mano; el refutador/a puede aceptar o no la pregunta. Ronda 1: A contra B; ronda 2: C contra D. Las posturas se sortean en la sesión 12.", "guia": "2.4"}, {"tipo": "infografia", "titulo": "Qué hace cada rol", "elementos": [{"icono": "🎬", "titulo": "Introductor/a", "texto": "**Exordio**, equipo, problema, términos, **tesis** y argumentos."}, {"icono": "🥊", "titulo": "Refutador/a 1", "texto": "Cita, **crítica** al otro equipo y **dos argumentos** propios."}, {"icono": "🛡️", "titulo": "Refutador/a 2", "texto": "**Crítica extensa** y el **último argumento**."}, {"icono": "🏁", "titulo": "Conclusor/a", "texto": "Gracias, error del otro, por qué ganamos y **moraleja**."}], "ayudas": [{"tipo": "repaso", "titulo": "Lectura facilitada", "puntos": ["El **introductor/a** empieza: cuenta algo interesante, presenta al equipo, explica el problema y la idea del equipo.", "Los **refutadores/as** explican las ideas del equipo, dicen lo que no está bien en las del otro y responden preguntas.", "El **conclusor/a** termina: da las gracias, recuerda las ideas y dice una frase importante sobre el tema."]}]}, {"tipo": "practica", "titulo": "Reparto de roles", "tiempo": 4, "agrupamiento": "Equipos", "enunciado": "Repartid los roles. En los equipos de debate, cada persona prepara su rol **para las dos posturas**.", "pasos": ["Equipos de debate: introductor/a, refutador/a 1, refutador/a 2, conclusor/a.", "Mesa: **moderador/a** (turnos y respeto), **cronometrador/a** (tarjetas) y **relator/a-jurado** (ficha y veredicto).", "Anotadlo en la ficha de roles."], "enlace": "https://docs.google.com/document/d/1_FqRvv2HCCdonCqdoLjd5HbIwWUGFwDx8FxnAPWDhxk/copy", "nota": "Con 19 estudiantes: equipos A-D de 4 y una mesa de 3 que dirige las dos rondas. Ejemplo resuelto en «SdA 3 · Ejemplo resuelto: clase de 19, reparto de roles y guía del debate (docente)».", "ayudas": [{"tipo": "pista", "titulo": "Ejemplo de reparto (equipo A)", "puntos": ["Introductor/a: Lucía, lee con soltura y abre con un exordio.", "Refutador/a 1: Hugo, reacciona rápido y acepta preguntas.", "Refutador/a 2: Aitana, critica a fondo y expone el último argumento.", "Conclusor/a: Mario, escucha y resume bien."]}]}, {"tipo": "ejemplo", "icono": "🏠", "titulo": "Negociar la hora de llegar a casa", "situacion": "Quieres volver a las 12 del cumpleaños. Si dices «¡Porque sí, todos van!», la respuesta es **no**.", "explicacion": "Si dices «Volveré a las 12 (**afirmación**) porque nos trae en coche la madre de Lucía (**razonamiento**), aquí tienes su teléfono (**evidencia**)», tienes muchas más opciones. Eso es un **argumento ARE**.", "pregunta": "¿Qué evidencia convencería más a tu familia?"}, {"tipo": "practica", "titulo": "De opinión a argumento", "tiempo": 11, "agrupamiento": "Parejas", "enunciado": "Convertid **dos opiniones sueltas** en argumentos **ARE** y decid qué **tipo de evidencia** usáis.", "pasos": ["Opinión 1: «La IA es mala para estudiar».", "Opinión 2: «Prohibirla no sirve de nada».", "Tipos de evidencia: 👩‍🔬 autoridad · 💡 ejemplo · 📰 hecho · 📊 dato (el más sólido).", "Buscad la evidencia en una fuente fiable y contrastada."], "ayudas": [{"tipo": "pista", "titulo": "Dos argumentos resueltos", "puntos": ["A favor: «Los menores necesitan protección (A) porque la IA puede crear deepfakes que causan un daño enorme (R); en Almendralejo, 2023, se condenó a 15 menores (E, hecho)».", "En contra: «Prohibir no enseña a usarla (A) porque la usarán igualmente sin guía (R); OpenAI la permite desde los 13 años con consentimiento familiar (E, dato)»."]}]}, {"tipo": "practica", "titulo": "Guía del debate (I)", "tiempo": 20, "agrupamiento": "Equipos", "enunciado": "Completad en la **plantilla A3** las **partes 1 y 2**: búsqueda de argumentos y tesis o línea argumental.", "pasos": ["**Parte 1**: 3 argumentos a favor y 3 en contra, cada uno con **evidencia y fuente**.", "**Parte 2**: la **tesis** de cada postura en una frase.", "Para cada argumento, sus **posibles refutaciones**.", "Mesa: normas del moderador/a y tres preguntas para el público."], "guia": "2.4", "enlace": "https://docs.google.com/document/d/1Rt-wze5V__jLNuh4FZ9hEiHZ6bbUGfkZ4zSBHQZKuq4/copy"}, {"tipo": "cierre", "titulo": "Hoy dejamos hecho", "puntos": ["Reparto de roles", "Argumentos ARE por parejas", "Guía del debate (partes 1 y 2)"], "siguiente": "Redactamos los discursos y ensayamos"}]}, {"n": 11, "fase": "Bloque 2 · Desarrollo", "titulo": "Redactamos los discursos y ensayamos", "reto": "Redactar el guion de cada rol (introducción, refutaciones y conclusión abierta) con conectores y marcadores del discurso, ensayar los turnos con el cronómetro, autoevaluarse y entregar la guía del debate.", "pregunta": "¿Estás preparado/a para defender cualquiera de las dos posturas?", "diapositivas": [{"tipo": "comparar", "titulo": "Control de evidencias", "columnas": [{"titulo": "No vale", "icono": "❌", "puntos": ["Dato sin fuente", "Vídeo viral sin autor", "«Lo he leído por ahí»"]}, {"titulo": "Vale", "icono": "✅", "puntos": ["Organismo oficial o medio fiable", "Fecha del dato", "Enlace que se puede abrir"]}], "pregunta": "¿Todos vuestros argumentos tienen evidencia y fuente?"}, {"tipo": "practica", "titulo": "Guía del debate (II)", "tiempo": 22, "agrupamiento": "Equipos", "enunciado": "Completad en la **plantilla A3** las **partes 3, 4 y 5**.", "pasos": ["**Parte 3**: discurso del introductor/a: exordio, equipo, statu quo, términos, tesis, argumentos y conclusión.", "**Parte 4**: refutadores/as (cita, crítica, preguntas) y conclusor/a con **redacción abierta**.", "**Parte 5**: propuesta de uso responsable de la IA por menores.", "Mesa: guion de moderación con normas y turnos."], "guia": "2.4", "ayudas": [{"tipo": "pista", "titulo": "Conectores y marcadores para vuestro discurso", "puntos": ["Empezar y ordenar: **en primer lugar**, a continuación, por una parte… por otra parte.", "Oponerse y explicar causas: **sin embargo**, no obstante, aunque; por eso, ya que, en consecuencia.", "Terminar: **en resumen**, para finalizar, como conclusión.", "Opinar y matizar: **en mi opinión**, de hecho, evidentemente, es probable que, quizás."]}], "enlace": "https://docs.google.com/document/d/1Rt-wze5V__jLNuh4FZ9hEiHZ6bbUGfkZ4zSBHQZKuq4/copy", "nota": "Modelo de corrección: «SdA 3 · Ejemplo resuelto: clase de 19, reparto de roles y guía del debate (docente)» en la carpeta de Drive."}, {"tipo": "ejemplo", "icono": "🗣️", "titulo": "Rebatir sin atacar", "situacion": "El otro equipo dice: «La IA no contamina nada». Te dan ganas de contestar: «¡Eso es una tontería!».", "explicacion": "Mejor: «**Entiendo** que una consulta de texto gasta poco; **sin embargo**, según la AIE los centros de datos podrían duplicar su consumo en 2030». Se rebate **la idea con un dato**, no a la persona.", "pregunta": "¿Qué otra frase sirve para empezar una refutación respetuosa?"}, {"tipo": "quiz", "pregunta": "Según la guía del debate, ¿qué hace el conclusor/a?", "opciones": ["Presenta al equipo y la tesis por primera vez", "Agradece, señala el principal error del otro equipo, repasa por qué vuestros argumentos siguen en pie y cierra con una moraleja que enlaza con el exordio", "Lee otra vez la introducción palabra por palabra"], "correcta": 1, "explicacion": "La conclusión **cierra**: su redacción es **abierta** para incluir lo que ha pasado en el debate, y termina con una frase que recuerda la tesis y enlaza con el inicio."}, {"tipo": "practica", "titulo": "Ensayo por roles", "tiempo": 14, "agrupamiento": "Parejas de equipos", "enunciado": "Ensayad en el **orden del debate** con cronómetro.", "pasos": ["Introductor/a del equipo 1 (1,5 min) → introductor/a del equipo 2 (1,5 min).", "Refutador/a 1 del equipo 1 (2 min) → refutador/a 1 del equipo 2 (2 min), con una pregunta a mano alzada.", "Mesa: presentación, tarjetas de tiempo y ficha del jurado.", "Cada observador/a deja una sugerencia."], "material": ["Tarjetas de tiempo", "Ficha del jurado"], "enlace": "https://docs.google.com/document/d/1QZoYzrR4OlxA1GRS_TiY6gr9yvthv14-G6E9BXx-PEQ/copy"}, {"tipo": "practica", "titulo": "Nos autoevaluamos, ajustes y entrega", "tiempo": 10, "agrupamiento": "Individual y equipos", "enunciado": "Autoevalúa tu ensayo con el formulario **F6** y, en equipo, entregad el **enlace de la guía** con permiso de lectura.", "pasos": ["Marca lo que has hecho bien y escribe **una propuesta de mejora**.", "Aplicad la sugerencia más importante del ensayo.", "El coordinador/a entrega la guía."], "entrega": "Tarea 3.4 · Guía del debate: IA generativa y menores", "nota": "Recuerda: el documento entregado es el 66 % de la nota; el 33 % restante es el debate en escena de la sesión 12. El formulario F6 sigue la plantilla «Nos autoevaluamos» del REA de debate.", "ayudas": [{"tipo": "emociones", "titulo": "Si te pone nervioso/a hablar en público", "texto": "Es normal. Habla despacio, mira a una persona amiga del público y apóyate en tu guion: puedes leerlo. **Conoce tus puntos fuertes y trabaja para mejorar el resto.**"}], "guia": "2.4"}, {"tipo": "cierre", "puntos": ["Un buen discurso tiene inicio que atrae, tesis clara, argumentos con evidencia y un final que enlaza con el inicio.", "Los conectores ordenan las ideas y los marcadores muestran lo que piensas.", "Preparar las dos posturas ayuda a entender a quien piensa distinto."], "siguiente": "¡El gran debate!", "pregunta": "¿Qué frase de tu guion te sale mejor?"}]}, {"n": 12, "fase": "Bloque 2 · Cierre", "titulo": "El gran debate y cierre de la SdA", "reto": "Defender con argumentos, evidencias y respeto la postura que toque en el sorteo, ejercer bien el rol asignado siguiendo los principios de un buen debate y reflexionar sobre lo aprendido en toda la SdA.", "pregunta": "¿Debería prohibirse la IA generativa a menores de 16 años?", "diapositivas": [{"tipo": "practica", "titulo": "Sorteo y principios del buen debate", "tiempo": 5, "enunciado": "Sorteamos **emparejamientos** y **posturas**. El moderador/a lee los **principios** para un buen debate.", "pasos": ["👂 Escucha con atención · 🔎 Explica tus argumentos con pruebas.", "↩️ Responde al equipo contrario · 🎯 Céntrate en el tema.", "🗣️ Sé claro/a y habla con calma · 🤥 No mientas ni interrumpas.", "🤝 Juega limpio: respeta a la moderación y al jurado, y felicita a quien gane."], "material": ["Bolsa de sorteo", "Fichas del jurado"], "enlace": "https://docs.google.com/document/d/1QZoYzrR4OlxA1GRS_TiY6gr9yvthv14-G6E9BXx-PEQ/copy", "guia": "2.5", "nota": "Principios adaptados de Van Eemeren y Grootendorst en la «Guía para el debate académico en el aula». Moción: «El uso de la IA generativa debería prohibirse a menores de 16 años»."}, {"tipo": "ejemplo", "icono": "⚽", "titulo": "El árbitro no elige equipo", "situacion": "En un partido, el árbitro puede ser del Betis o del Sevilla, pero **pita lo que pasa en el campo**.", "explicacion": "El jurado i   const C = D.creditos; if (!C) return '';
  const o = C.original || {}, L = C.licencia || {};
  const lic = L.url ? `<a href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.nombre)}</a>` : esc(L.nombre || '');
  return `<div class="foot">${o.titulo ? `Adaptación de «${esc(o.titulo)}»${o.organizacion ? ' · ' + esc(o.organizacion) : ''}${arr(o.personas).length ? ' · ' + esc(arr(o.personas).map(x => x.nombres).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3).join(', ')) : ''}. ` : ''}${C.adaptacion && C.adaptacion.autoria ? 'Adaptación: ' + esc(C.adaptacion.autoria) + '. ' : ''}Licencia ${lic}.${D.url_alumnado ? ` Créditos completos en la <a href="${esc(D.url_alumnado)}#creditos">guía del alumnado</a>.` : ''}</div>`;
}
function home(){
  st.s = null; document.body.classList.remove('fs');
  $('#ttl').innerHTML = esc(D.meta.titulo || 'Sesiones');
  $('#sel').value = ''; $('#notes').classList.remove('on');
  $('#app').innerHTML = `<div class="home"><div class="hero"><div class="k">${esc([D.meta.curso_texto, D.materias].filter(Boolean).join(' · '))}</div>
    <h1>${esc(D.meta.titulo||'')}</h1>${D.meta.subtitulo ? `<p>${esc(D.meta.subtitulo)}</p>` : ''}
    ${D.reto ? `<p><b>Reto:</b> ${esc(D.reto)}</p>` : ''}
    ${D.url_alumnado ? `<a class="gal" href="${esc(D.url_alumnado)}">📘 Guía del alumnado: apartados, actividades y ayudas</a>` : ''}
    <p class="help">Elige una sesión. Proyectar: <span class="kbd">←</span><span class="kbd">→</span> pasar · <span class="kbd">F</span> pantalla completa · <span class="kbd">N</span> notas del docente · <span class="kbd">E</span> modo estudio · <span class="kbd">Esc</span> volver aquí.</p></div>
    <div class="cards">${SES.map(s=>`<button class="sc" data-s="${s.n}" style="--fc:${fcol(s.fase)}"><div class="n">Sesión ${s.n} · ${esc(s.fase||'')}</div><h3>${esc(s.titulo)}</h3><p>${esc(s.reto||'')}</p><div class="c">${arr(s.diapositivas).length + 1} diapositivas</div></button>`).join('')}</div>${creditosHtml()}</div>`;
  setHash('#');
  wire();
}
function show(n, i){
  const s = SES.find(x => x.n == n); if (!s) return home();
  const sl = slidesOf(s);
  st.s = s; st.i = Math.max(0, Math.min(i|0, sl.length - 1));
  $('#ttl').innerHTML = `Sesión ${s.n}. ${esc(s.titulo)}<small>${esc(D.meta.titulo||'')}</small>`;
  $('#sel').value = String(s.n);
  $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar';
  if (st.mode === 'proy') {
    $('#app').innerHTML = `<div class="stage"><button class="nav l" id="pv" aria-label="Anterior">‹</button>${renderSlide(s, sl[st.i], st.i, sl.length)}<button class="nav r" id="nx" aria-label="Siguiente">›</button></div>`;
    $('#pv').onclick = prev; $('#nx').onclick = next;
  } else {
    $('#app').innerHTML = `<div class="study">${sl.map((d,k)=>renderSlide(s, d, k, sl.length)).join('')}
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:20px">${SES.find(x=>x.n==s.n-1) ? `<button class="tb" data-s="${s.n-1}">← Sesión ${s.n-1}</button>` : '<span></span>'}${SES.find(x=>x.n==s.n+1) ? `<button class="tb" data-s="${s.n+1}">Sesión ${s.n+1} →</button>` : ''}</div></div>`;
    window.scrollTo(0, 0);
  }
  const nt = st.mode === 'proy' ? sl[st.i].nota : null;
  $('#notes').innerHTML = nt ? `<b>Notas para el docente:</b> ${md(nt)}` : '<b>Notas:</b> sin notas en esta diapositiva.';
  $('#notes').classList.toggle('on', st.notes && st.mode === 'proy');
  setHash(`#s${s.n}-${st.i + 1}`);
  wire();
  fit();
}
function next(){
  if (!st.s) return; const sl = slidesOf(st.s), d = sl[st.i];
  if (d.tipo === 'pasos' && d.progresivo) { const key = st.s.n+'-'+st.i, v = st.revealed[key] ?? 1;
    if (v < arr(d.pasos).length) { st.revealed[key] = v + 1; return show(st.s.n, st.i); } }
  if (st.i < sl.length - 1) show(st.s.n, st.i + 1);
  else { const nx = SES.find(x => x.n == st.s.n + 1); if (nx) show(nx.n, 0); }
}
function prev(){ if (!st.s) return; if (st.i > 0) show(st.s.n, st.i - 1); else { const p = SES.find(x => x.n == st.s.n - 1); if (p) show(p.n, slidesOf(p).length - 1); } }

// Si el contenido no cabe en la diapositiva proyectada, reduce la letra (hasta un 62 %)
function fit(){
  const sl = document.querySelector('.stage .slide'); if (!sl) return;
  const inn = sl.querySelector('.in'); sl.style.fontSize = '';
  const base = parseFloat(getComputedStyle(sl).fontSize); let f = base;
  while (inn.scrollHeight > inn.clientHeight + 1 && f > base * 0.62) { f *= 0.96; sl.style.fontSize = f + 'px'; }
}
let fitT; addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fit, 80); });
let timers = {};
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('ay')) fit(); }, true);
function wire(){
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => show(+b.dataset.s, 0));
  document.querySelectorAll('.opts').forEach(q => q.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    const ok = +q.dataset.ok; q.querySelectorAll('.opt').forEach(x => x.classList.remove('ok','ko'));
    o.classList.add(+o.dataset.j === ok ? 'ok' : 'ko'); q.querySelectorAll('.opt')[ok]?.classList.add('ok');
    document.getElementById('ex-' + q.dataset.q)?.classList.add('on');
  }));
  document.querySelectorAll('.reveal').forEach(b => b.onclick = () => { st.revealed[b.dataset.rev] = (st.revealed[b.dataset.rev] ?? 1) + 1; show(st.s.n, st.i); });
  document.querySelectorAll('.vid').forEach(v => { const b = v.querySelector('.play'); if (b) b.onclick = () => {
    const p = new URLSearchParams({autoplay: '1', rel: '0'}); if (+v.dataset.ini) p.set('start', v.dataset.ini); if (+v.dataset.fin) p.set('end', v.dataset.fin);
    v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?${p}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe>`; }; });
  document.querySelectorAll('.timer').forEach(b => {
    const k = b.dataset.k, paint = () => { const t = timers[k]; if (!t) return; const left = Math.round((t.end - Date.now())/1000);
      b.textContent = left > 0 ? '⏱ ' + fmtT(left) : '⏰ ¡Tiempo!'; b.classList.toggle('end', left <= 0); };
    if (timers[k]) paint();
    b.onclick = () => { if (timers[k]) { clearInterval(timers[k].iv); delete timers[k]; b.textContent = '⏱ ' + (b.dataset.timer/60) + ' min'; b.classList.remove('end'); return; }
      timers[k] = { end: Date.now() + b.dataset.timer * 1000 }; timers[k].iv = setInterval(() => { if (!document.body.contains(b)) return; paint(); }, 500); paint(); };
  });
}

// --------------------------------------------------- controles
$('#sel').innerHTML = `<option value="">Ir a la sesión…</option>` + SES.map(s => `<option value="${s.n}">S${s.n}. ${esc(s.titulo)}</option>`).join('');
$('#sel').onchange = e => e.target.value ? show(+e.target.value, 0) : home();
$('#b-home').onclick = home;
$('#b-mode').onclick = () => { st.mode = st.mode === 'proy' ? 'est' : 'proy'; st.s ? show(st.s.n, st.i) : null; $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar'; };
$('#b-notes').onclick = () => { st.notes = !st.notes; $('#b-notes').setAttribute('aria-pressed', st.notes); $('#notes').classList.toggle('on', st.notes && st.mode === 'proy' && !!st.s); };
$('#b-fs').onclick = toggleFs;
$('#b-theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('clase-theme', r.dataset.theme); } catch(e){} };
try { const t = localStorage.getItem('clase-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
function toggleFs(){
  if (!st.s) return;
  if (st.mode !== 'proy') { st.mode = 'proy'; show(st.s.n, st.i); }
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.().catch(()=>{}); document.body.classList.add('fs'); }
  else { document.exitFullscreen?.(); document.body.classList.remove('fs'); }
}
document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('fs', !!document.fullscreenElement); setTimeout(fit, 120); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (st.s && st.mode === 'proy' && ['ArrowRight','ArrowDown','PageDown',' '].includes(k)) { e.preventDefault(); next(); }
  else if (st.s && st.mode === 'proy' && ['ArrowLeft','ArrowUp','PageUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home' && st.s && st.mode === 'proy') show(st.s.n, 0);
  else if (k === 'End' && st.s && st.mode === 'proy') show(st.s.n, slidesOf(st.s).length - 1);
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'n' || k === 'N') $('#b-notes').click();
  else if ((k === 'e' || k === 'E') && st.s) $('#b-mode').click();
  else if (k === 'Escape' && !document.fullscreenElement) home();
});
// Enlaces directos también con la página ya abierta (#s3-2 en la barra de direcciones o en un enlace)
addEventListener('hashchange', () => { let h = null; try { h = location.hash.match(/^#s(\d+)(?:-(\d+))?/); } catch(e){} if (h) show(+h[1], (+h[2] || 1) - 1); });
// enlace directo: #s3-2 (sesión 3, diapositiva 2)
let m = null; try { m = location.hash.match(/^#s(\d+)(?:-(\d+))?/); } catch(e){}
if (!SES.length) $('#app').innerHTML = '<div class="empty">Esta situación de aprendizaje todavía no tiene diapositivas de clase.</div>';
else if (m) show(+m[1], (+m[2] || 1) - 1); else home();
</script>
</body>
