<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clase · SdA 3: Ética, Salud Digital y Sostenibilidad Ecosocial</title>
<style>
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#dbe3ec;
  --brand:#0f766e; --brand-soft:#ccfbf1; --accent:#7c3aed; --accent-soft:#ede9fe;
  --ok:#15803d; --ok-bg:#dcfce7; --ko:#b91c1c; --ko-bg:#fee2e2; --warm:#c2410c; --warm-bg:#fff7ed;
  --code-bg:#0f172a; --code-ink:#e2e8f0; --slide:#ffffff; --f-ini:#2563eb; --f-des:#0f766e; --f-cie:#9333ea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#111a2e; --ink:#e5e9f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#23304a;
    --brand:#2dd4bf; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
    --ok:#4ade80; --ok-bg:#14532d; --ko:#f87171; --ko-bg:#450a0a; --warm:#fdba74; --warm-bg:#2a1608;
    --code-bg:#020617; --code-ink:#e2e8f0; --slide:#111a2e; --f-ini:#60a5fa; --f-des:#2dd4bf; --f-cie:#c084fc;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2e; --ink:#e5e9f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#23304a;
  --brand:#2dd4bf; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
  --ok:#4ade80; --ok-bg:#14532d; --ko:#f87171; --ko-bg:#450a0a; --warm:#fdba74; --warm-bg:#2a1608;
  --code-bg:#020617; --code-ink:#e2e8f0; --slide:#111a2e; --f-ini:#60a5fa; --f-des:#2dd4bf; --f-cie:#c084fc;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
@media(max-width:760px){.top{overflow-x:auto}.top .ttl{display:none}.top .tb{flex:0 0 auto}select.tb{max-width:60vw}}
.top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.top .ttl small{font-weight:500;color:var(--muted);margin-left:8px}
.tb{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.tb:hover{border-color:var(--brand);color:var(--brand)}
.tb[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
select.tb{max-width:42vw}
/* ---------- índice */
.home{max-width:1180px;margin:0 auto;padding:28px 16px 48px}
.hero{background:linear-gradient(135deg,#134e4a,#1e3a8a);color:#fff;border-radius:18px;padding:28px 24px}
.hero h1{margin:6px 0;font-size:clamp(26px,4vw,40px);line-height:1.1}
.hero p{margin:6px 0;opacity:.92;font-size:18px}
.hero .k{font-size:13px;opacity:.8;letter-spacing:.04em;text-transform:uppercase}
.help{margin:14px 0 0;font-size:14px;opacity:.85}
.kbd{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:0 6px;font-size:12px;margin:0 2px}
.cards{display:grid;gap:14px;margin-top:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sc{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);border-top:6px solid var(--fc,var(--brand))}
.sc:hover{border-color:var(--fc,var(--brand));transform:translateY(-1px)}
.sc .n{font-size:13px;font-weight:700;color:var(--fc,var(--brand));text-transform:uppercase;letter-spacing:.04em}
.sc h3{margin:6px 0;font-size:18px;line-height:1.25}
.sc p{margin:0;color:var(--ink2);font-size:14px}
.sc .c{margin-top:10px;font-size:13px;color:var(--muted)}
/* ---------- modo proyección */
.stage{position:relative;height:calc(100vh - 57px);display:flex;align-items:center;justify-content:center;padding:12px}
.fs .stage{height:100vh;padding:0}
.fs .top{display:none}
.slide{position:relative;width:min(100%, calc((100vh - 81px) * 16 / 9));aspect-ratio:16/9;background:var(--slide);border-radius:14px;box-shadow:0 10px 40px rgba(15,23,42,.18);overflow:hidden;
  font-size:min(2.05vw, 3.6vh);container-type:inline-size}
.fs .slide{width:min(100vw, calc(100vh * 16 / 9));border-radius:0;box-shadow:none}
@supports (font-size:1cqw){ .slide{font-size:2.05cqw} }
.slide .in{position:absolute;inset:0;padding:3.2em 3.6em 3em;display:flex;flex-direction:column;overflow:auto}
.slide .bar{position:absolute;left:0;right:0;bottom:0;height:.35em;background:var(--line)}
.slide .bar i{display:block;height:100%;background:var(--fc,var(--brand))}
.slide .pg{position:absolute;right:1.4em;bottom:.9em;font-size:.62em;color:var(--muted)}
.slide .tag{position:absolute;left:5.8em;top:2.1em;font-size:.62em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fc,var(--brand))}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(15,23,42,.08);color:var(--ink2);font-size:24px;opacity:.4}
.nav:hover{opacity:1}.nav.l{left:4px}.nav.r{right:4px}
.fs .nav{display:none}
.notes{position:fixed;left:16px;right:16px;bottom:16px;z-index:9;background:var(--warm-bg);border:1px solid var(--warm);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:15px;max-height:30vh;overflow:auto;display:none}
.notes.on{display:block}
.notes b{color:var(--warm)}
/* ---------- modo estudio */
.study{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.study .slide{width:100%;aspect-ratio:auto;font-size:18px;margin:0 0 16px;box-shadow:none;border:1px solid var(--line);container-type:normal}
@media(max-width:640px){.study .slide{font-size:16px}}
.study .slide .in{position:static;padding:2.4em 1.4em 1.4em;overflow:visible}
.study .slide .bar,.study .slide .pg{display:none}
.study .slide .tag{left:2.3em;top:1.6em}
.study h2.sh{margin:28px 0 12px;font-size:22px}
/* ---------- piezas de diapositiva */
.s-h{margin:0 0 .5em;font-size:1.75em;line-height:1.15;font-weight:800}
.s-lead{font-size:1.1em;color:var(--ink2);margin:0 0 .7em}
.ico{font-size:2.4em;line-height:1;margin-bottom:.2em}
ul.pts{margin:.2em 0;padding-left:1.1em}ul.pts li{margin:.35em 0}
.cover{justify-content:center;background:linear-gradient(135deg,var(--fc,var(--brand)),#1e3a8a);color:#fff}
.cover .s-h{font-size:2.6em}.cover .s-lead{color:rgba(255,255,255,.9)}
.cover .q{margin-top:1em;font-size:1.25em;font-weight:700;background:rgba(255,255,255,.14);border-radius:.5em;padding:.6em .8em}
.cover .tag{color:rgba(255,255,255,.85)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2em;align-items:start}
@media(max-width:640px){.study .two{grid-template-columns:1fr}}
.box{background:var(--bg);border-radius:.6em;padding:.8em 1em}
.box.hl{background:var(--brand-soft)}
.box.ac{background:var(--accent-soft)}
.box.wa{background:var(--warm-bg)}
.box .lb{font-size:.62em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.3em}
.ask{margin-top:auto;padding-top:.7em;font-size:1.1em;font-weight:700;color:var(--accent)}
ol.steps{list-style:none;margin:.3em 0;padding:0;counter-reset:st;display:grid;gap:.45em}
ol.steps li{counter-increment:st;display:flex;gap:.7em;align-items:flex-start;background:var(--bg);border-radius:.5em;padding:.45em .7em}
ol.steps li::before{content:counter(st);flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;background:var(--fc,var(--brand));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85em}
ol.steps li.hid{visibility:hidden}
.cols{display:grid;gap:1em;grid-template-columns:repeat(var(--n,2),1fr)}
@media(max-width:640px){.study .cols{grid-template-columns:1fr}}
.col{border:2px solid var(--line);border-radius:.6em;padding:.7em .9em}
.col h4{margin:0 0 .3em;font-size:1.1em;color:var(--fc,var(--brand))}
.grid-i{display:grid;gap:.8em;grid-template-columns:repeat(auto-fit,minmax(9em,1fr))}
.gi{background:var(--bg);border-radius:.6em;padding:.7em;text-align:center}
.gi .e{font-size:2em}.gi b{display:block;margin:.2em 0}.gi span{font-size:.85em;color:var(--ink2)}
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5em;margin:.6em 0}
.fn{padding:.55em .9em;border-radius:.5em;background:var(--brand-soft);border:2px solid var(--brand);font-weight:600;text-align:center;max-width:12em}
.fn.inicio,.fn.fin{border-radius:2em;background:var(--accent-soft);border-color:var(--accent)}
.fn.decision{background:var(--warm-bg);border-color:var(--warm);transform:skew(-8deg)}
.fn.decision>span{display:inline-block;transform:skew(8deg)}
.arr{font-size:1.3em;color:var(--muted)}
.svgw{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.svgw svg{max-width:100%;max-height:100%;height:auto}
pre.code{margin:.3em 0;background:var(--code-bg);color:var(--code-ink);border-radius:.6em;padding:.8em 1em;font:0.82em/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;white-space:pre}
.big{font-size:4.2em;font-weight:900;line-height:1;color:var(--fc,var(--brand))}
.src{font-size:.6em;color:var(--muted);margin-top:.6em}
.opts{display:grid;gap:.5em;margin:.4em 0}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:.5em;padding:.5em .8em;font-size:1em}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.expl{display:none;margin-top:.4em}.expl.on{display:block}
.chip{display:inline-block;border-radius:2em;padding:.15em .7em;font-size:.7em;font-weight:700;background:var(--warm-bg);color:var(--warm);border:1px solid var(--warm);margin-right:.4em}
.timer{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--fc,var(--brand));color:var(--fc,var(--brand));background:transparent;border-radius:2em;padding:.2em .8em;font-weight:800;font-size:.9em}
.timer.end{background:var(--ko);border-color:var(--ko);color:#fff}
.vid{position:relative;flex:1;min-height:6em;border-radius:.6em;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .play{border:0;background:#dc2626;color:#fff;border-radius:.6em;padding:.6em 1.2em;font-size:1em;font-weight:800}
.study .vid{aspect-ratio:16/9;flex:none}
.reveal{border:1px dashed var(--muted);background:transparent;color:var(--muted);border-radius:.4em;padding:.2em .7em;font-size:.7em;margin-top:.4em}
.empty{max-width:700px;margin:60px auto;text-align:center;color:var(--muted)}
@media print{.top,.nav,.notes{display:none}.study .slide{break-inside:avoid}}
</style>
</head>

rogresivo": true, "pasos": ["**Coordinador/a-portavoz**: organiza el tiempo y habla por el equipo.", "**Guionista**: escribe la historia y los textos.", "**Diseñador/a visual**: monta viñetas y personajes.", "**Verificador/a de datos**: comprueba cada dato y su fuente.", "Elegid nombre y firmad el contrato de equipo."]}, {"tipo": "cierre", "puntos": ["Las pantallas tienen efectos en el cuerpo y en la mente.", "Dos bloques: el cómic de salud digital y el debate sobre la IA.", "Las entregas están repartidas: la primera, en la sesión 3."], "siguiente": "Analizamos nuestro cuerpo digital: posturas, ojos y sueño.", "pregunta": "¿Qué parte te interesa más: el cuerpo o la mente?"}]}, {"n": 2, "fase": "Bloque 1 · Inicio", "titulo": "Cuerpo digital: ergonomía y enfermedades digitales", "reto": "Reconocer los riesgos físicos del uso de pantallas y corregir la postura en el propio puesto de trabajo.", "pregunta": "¿Cuánto pesa tu cabeza cuando miras el móvil?", "diapositivas": [{"tipo": "ejemplo", "icono": "🛋️", "titulo": "El sofá a las 11 de la noche", "situacion": "Tumbado/a en el sofá, el móvil en el pecho, la cabeza doblada hacia abajo. **Dos horas** sin moverte.", "explicacion": "Al inclinar la cabeza, los músculos del cuello tienen que sujetar **mucho más peso**. Por eso al día siguiente duele el cuello o la espalda.", "pregunta": "¿Os suena esta postura?", "nota": "Haz antes el «¡congelados!»: que observen su propia postura en el aula sin señalar a nadie."}, {"tipo": "infografia", "titulo": "El peso que soporta tu cuello", "svg": "<svg viewBox=\"0 -12 640 252\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Peso que soporta el cuello según la inclinación de la cabeza: 0 grados 5 kg, 15 grados 12 kg, 30 grados 18 kg, 45 grados 22 kg, 60 grados 27 kg\"><line x1=\"40\" y1=\"200\" x2=\"620\" y2=\"200\" style=\"stroke:var(--ink)\" stroke-width=\"2\"/><rect x=\"60\" y=\"163\" width=\"80\" height=\"37\" rx=\"4\" style=\"fill:var(--brand-soft);stroke:var(--brand)\"/><rect x=\"170\" y=\"111\" width=\"80\" height=\"89\" rx=\"4\" style=\"fill:var(--brand-soft);stroke:var(--brand)\"/><rect x=\"280\" y=\"67\" width=\"80\" height=\"133\" rx=\"4\" style=\"fill:var(--accent-soft);stroke:var(--accent)\"/><rect x=\"390\" y=\"37\" width=\"80\" height=\"163\" rx=\"4\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><rect x=\"500\" y=\"0\" width=\"80\" height=\"200\" rx=\"4\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><text x=\"100\" y=\"155\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\" style=\"fill:var(--ink)\">5 kg<\/text><text x=\"210\" y=\"103\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\" style=\"fill:var(--ink)\">12 kg<\/text><text x=\"320\" y=\"59\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\" style=\"fill:var(--ink)\">18 kg<\/text><text x=\"430\" y=\"29\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\" style=\"fill:var(--ink)\">22 kg<\/text><text x=\"540\" y=\"30\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\" style=\"fill:var(--ink)\">27 kg<\/text><text x=\"100\" y=\"225\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">0° recto<\/text><text x=\"210\" y=\"225\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">15°<\/text><text x=\"320\" y=\"225\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">30°<\/text><text x=\"430\" y=\"225\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">45°<\/text><text x=\"540\" y=\"225\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">60° móvil<\/text><\/svg>", "nota": "Datos aproximados del estudio de Hansraj (2014) sobre la carga en la columna cervical. Pregunta: ¿cuántas mochilas del instituto son 27 kg?"}, {"tipo": "infografia", "titulo": "Enfermedades digitales: síntoma y prevención", "elementos": [{"icono": "🦒", "titulo": "Cuello de texto", "texto": "Dolor de cuello y hombros. **Sube el móvil** a la altura de los ojos."}, {"icono": "👀", "titulo": "Vista cansada", "texto": "Ojos secos, picor, visión borrosa. **Regla 20-20-20**."}, {"icono": "👍", "titulo": "Pulgar y muñeca", "texto": "Dolor al escribir. **Muñeca recta** y pausas."}, {"icono": "🪑", "titulo": "Sedentarismo", "texto": "Cansancio, espalda. **Levántate** cada hora."}, {"icono": "🌙", "titulo": "Sueño", "texto": "Te cuesta dormirte. **Pantalla fuera** una hora antes."}]}, {"tipo": "practica", "titulo": "Auditoría ergonómica de tu puesto", "tiempo": 18, "agrupamiento": "Parejas", "enunciado": "Revisad el puesto de cada uno con la **lista de 8 puntos**. Puntuad, ajustad silla y pantalla y **volved a puntuar**.", "pasos": ["Pantalla a la altura de los ojos y a 50-70 cm.", "Espalda apoyada y pies en el suelo.", "Codos a 90° y muñecas rectas.", "Luz sin reflejos en la pantalla.", "Dibujad la postura del sofá y corregidla."], "material": ["Lista de auditoría ergonómica", "Monigote para dibujar"]}, {"tipo": "pasos", "titulo": "Pausa activa (2 minutos)", "progresivo": true, "pasos": ["Cuello: mira a un lado, al otro, arriba y abajo, despacio.", "Hombros: súbelos hacia las orejas y déjalos caer 5 veces.", "Muñecas: estira los dedos hacia atrás con la otra mano 10 segundos.", "**20-20-20**: mira por la ventana algo lejano durante 20 segundos."]}, {"tipo": "quiz", "pregunta": "Llevas 20 minutos mirando la pantalla. ¿Qué dice la regla 20-20-20?", "opciones": ["Apagar la pantalla 20 minutos", "Mirar 20 segundos algo a unos 6 metros", "Bajar el brillo al 20 %"], "correcta": 1, "explicacion": "Cada **20 minutos**, mirar **20 segundos** algo a unos **20 pies** (unos 6 metros). Los ojos relajan el enfoque."}, {"tipo": "practica", "titulo": "Mi radiografía digital · Parte 1: Cuerpo", "tiempo": 10, "agrupamiento": "Individual", "enunciado": "Abre la plantilla y escribe **dos riesgos físicos** que reconoces en ti, con su causa, y **tres cambios** que puedes hacer.", "pasos": ["Riesgo 1 y su causa.", "Riesgo 2 y su causa.", "Tres cambios concretos: qué, cuándo y cómo."], "entrega": "Tarea 3.1 · Mi radiografía digital (se entrega la próxima sesión)"}, {"tipo": "cierre", "puntos": ["Inclinar la cabeza multiplica el peso que soporta el cuello.", "Los ojos necesitan pausas: regla 20-20-20.", "Un buen puesto se ajusta: altura, distancia, muñecas y luz."], "siguiente": "De la espalda a la cabeza: tecnoestrés, nomofobia y apps que enganchan.", "pregunta": "¿Qué cambio de postura vas a probar esta tarde?"}]}, {"n": 3, "fase": "Bloque 1 · Inicio", "titulo": "Mente digital: tecnoestrés, nomofobia y diseño que engancha", "reto": "Identificar los riesgos para la salud mental del uso de pantallas, reconocer los trucos de diseño persuasivo y elaborar un plan personal de hábitos saludables.", "pregunta": "¿Usas tú el móvil o el móvil te usa a ti?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔔", "titulo": "Sales de casa… sin móvil", "situacion": "Llegas a la parada del autobús y te tocas el bolsillo: **no está**. El corazón se acelera y piensas en todo lo que te vas a perder.", "explicacion": "Ese malestar tiene nombre: **nomofobia** (*no mobile phone phobia*). No es una enfermedad oficial, pero indica **dependencia** del móvil.", "pregunta": "¿Tú qué sentirías: 😌, 😬 o 😱?"}, {"tipo": "idea", "icono": "🧠", "titulo": "Cuatro palabras para entender tu mente digital", "puntos": ["**Tecnoestrés**: agobio por notificaciones y tareas digitales sin fin.", "**Nomofobia**: miedo a estar sin móvil.", "**FOMO**: miedo a perderte algo que pasa en redes.", "**Phubbing**: ignorar a quien tienes delante por mirar el móvil."]}, {"tipo": "practica", "titulo": "Test anónimo de nomofobia", "tiempo": 8, "agrupamiento": "Individual", "enunciado": "Responde las **10 afirmaciones** del test. Es **anónimo** y no es un diagnóstico: sirve para pensar en tus hábitos.", "pasos": ["Abre el enlace de Moodle.", "Marca de 1 (nada de acuerdo) a 7 (totalmente de acuerdo).", "Lee tu resultado orientativo y guárdalo para ti."], "nota": "Adaptado de la escala NMP-Q (Yildirim y Correia, 2015). No pidas a nadie que comparta su puntuación."}, {"tipo": "infografia", "titulo": "Trucos de diseño que enganchan", "elementos": [{"icono": "♾️", "titulo": "Scroll infinito", "texto": "Nunca llegas al final, así que **no hay punto de parada**."}, {"icono": "🔴", "titulo": "Punto rojo", "texto": "La notificación pide **atención urgente**."}, {"icono": "🔥", "titulo": "Rachas", "texto": "Si no entras hoy, **pierdes** lo conseguido."}, {"icono": "🎰", "titulo": "Recompensa variable", "texto": "A veces hay algo genial, a veces no: **como una tragaperras**."}]}, {"tipo": "practica", "titulo": "Caza de trucos en FlashTok", "tiempo": 10, "agrupamiento": "Parejas", "enunciado": "Analizad las capturas de la app inventada **FlashTok**. Encontrad **5 trucos** y proponed un **contra-truco** para cada uno.", "pasos": ["Rodead cada truco en la ficha.", "Escribid su nombre.", "Proponed el contra-truco: notificaciones, límites de uso, escala de grises, móvil fuera del dormitorio…"], "material": ["Ficha FlashTok"]}, {"tipo": "quiz", "pregunta": "¿Qué contra-truco funciona mejor contra la recompensa variable de las notificaciones?", "opciones": ["Poner el móvil en silencio pero mirarlo cada poco", "Desactivar las notificaciones que no sean de personas", "Subir el brillo de la pantalla"], "correcta": 1, "explicacion": "Si **no llega el aviso**, el cerebro no espera la recompensa. Deja solo los mensajes de personas reales."}, {"tipo": "practica", "titulo": "Mi radiografía digital · Parte 2 y entrega", "tiempo": 15, "agrupamiento": "Individual", "enunciado": "Completa la parte **Mente**: dos riesgos que reconoces, tu **plan de tres hábitos** y **a quién pedir ayuda**.", "pasos": ["Dos riesgos psicológicos.", "Tres hábitos: qué, cuándo y cómo.", "Una vía de ayuda: familia, tutoría, Orientación, 017 o ANAR.", "Descarga en PDF y entrega."], "entrega": "Tarea 3.1 · Mi radiografía digital"}, {"tipo": "cierre", "puntos": ["Muchas apps están diseñadas para que no las sueltes.", "Conocer los trucos ayuda a desactivarlos.", "Si algo en la red te hace daño, pide ayuda: no estás solo/a."], "siguiente": "Del dato a la viñeta: empezamos el cómic de salud digital.", "pregunta": "¿Qué contra-truco vas a probar esta semana?"}]}, {"n": 4, "fase": "Bloque 1 · Desarrollo", "titulo": "Del dato a la viñeta: guion del cómic e imágenes con licencia", "reto": "Elegir el tema de salud digital del cómic, planificar la historia en un guion gráfico con elementos interactivos y empezar a montarlo respetando las licencias.", "pregunta": "¿Cómo se convierte un dato de salud en una historia que se recuerda?", "diapositivas": [{"tipo": "ejemplo", "icono": "📖", "titulo": "Lo que recuerdas de un TikTok", "situacion": "De un vídeo de 30 segundos no recuerdas la cifra exacta: recuerdas **a la persona**, **lo que le pasó** y **cómo terminó**.", "explicacion": "Las historias funcionan porque tienen **personaje, conflicto y final**. En el cómic, el dato de salud aparece en el **giro** de la historia.", "pregunta": "¿Qué vídeo informativo recuerdas y por qué?"}, {"tipo": "infografia", "titulo": "Anatomía de un cómic", "elementos": [{"icono": "🔲", "titulo": "Viñeta", "texto": "Cada recuadro: **un momento**."}, {"icono": "💬", "titulo": "Bocadillo", "texto": "Diálogo (redondo) o pensamiento (nube)."}, {"icono": "📝", "titulo": "Cartela", "texto": "Voz del narrador: «Dos horas después…»."}, {"icono": "💥", "titulo": "Onomatopeya", "texto": "¡BZZZ! ¡DING!: el sonido dibujado."}, {"icono": "🎥", "titulo": "Plano", "texto": "General, medio o **primer plano** para la emoción."}]}, {"tipo": "practica", "titulo": "Elegid tema (sin repetir)", "tiempo": 4, "agrupamiento": "Equipos", "enunciado": "Cada equipo, **un tema distinto** de salud digital.", "pasos": ["Cuello de texto y postura · Vista cansada · Sueño y pantallas · Sedentarismo.", "Nomofobia · Tecnoestrés y notificaciones · Diseño que engancha.", "El coordinador/a lo comunica al docente."]}, {"tipo": "flujo", "titulo": "La estructura de nuestro cómic (6 viñetas)", "nodos": [{"texto": "1 · Protagonista y situación", "tipo": "inicio"}, {"texto": "2-3 · Conflicto: aparece el problema", "tipo": "proceso"}, {"texto": "4 · Giro: el dato real (con fuente)", "tipo": "decision"}, {"texto": "5 · Solución: un hábito sano", "tipo": "proceso"}, {"texto": "6 · Llamada a la acción", "tipo": "fin"}]}, {"tipo": "practica", "titulo": "Guion gráfico de 6 viñetas", "tiempo": 20, "agrupamiento": "Equipos", "enunciado": "Planificad la historia viñeta a viñeta y marcad **dos elementos interactivos**.", "pasos": ["Protagonista inventado/a: nombre, edad, qué le gusta.", "Situación y conflicto (viñetas 1-3).", "Giro con un dato real y su fuente (viñeta 4).", "Solución y llamada a la acción (viñetas 5-6).", "Marcad: ventana con dato, pregunta o botón «¿Qué harías tú?»."], "material": ["Plantilla de guion gráfico"]}, {"tipo": "pasos", "titulo": "Cómo citar una imagen: fórmula TAFL", "progresivo": true, "pasos": ["**T**ítulo de la imagen.", "**A**utor/a.", "**F**uente (enlace).", "**L**icencia: CC BY, CC BY-SA, CC0…", "Ejemplo: «Chica con móvil» · Ana Ruiz · Openverse · CC BY 2.0"]}, {"tipo": "quiz", "pregunta": "¿Qué imagen PUEDES usar en tu cómic?", "opciones": ["Un personaje de dibujos famoso descargado de Google", "Una foto de tu compañera en clase", "Una ilustración CC BY de Openverse citada con TAFL"], "correcta": 2, "explicacion": "La licencia **CC BY** permite usarla si **citas a su autor/a**. Los personajes famosos tienen copyright y las fotos de compañeros/as necesitan permiso."}, {"tipo": "practica", "titulo": "Primera viñeta en Genially", "tiempo": 10, "agrupamiento": "Equipos", "enunciado": "Mirad la demostración, cread vuestro Genially, **compartidlo con el equipo** y montad la **viñeta 1**.", "pasos": ["Crear → plantilla de cómic o lienzo en blanco.", "Fondo, personaje y bocadillo.", "Compartir → Colaborar con el equipo.", "Primera imagen en la hoja de créditos."], "nota": "Graba la demostración y súbela a Moodle para quien falte o necesite repetirla."}, {"tipo": "cierre", "puntos": ["Un dato se recuerda si va dentro de una historia.", "Protagonista, conflicto, giro, solución y llamada a la acción.", "Toda imagen ajena lleva su crédito."], "siguiente": "Producción del cómic y versión para redes: entrega de la Tarea 3.2.", "pregunta": "¿Cuál es el dato que va en el giro de vuestra historia?"}]}, {"n": 5, "fase": "Bloque 1 · Desarrollo", "titulo": "Producción del cómic y versión para redes", "reto": "Terminar el cómic interactivo en Genially, preparar su versión accesible para redes y entregarlo.", "pregunta": "¿Tu publicación la puede disfrutar todo el mundo?", "diapositivas": [{"tipo": "idea", "icono": "📲", "titulo": "Hoy entregamos: tres normas", "puntos": ["Carrusel vertical **1080 × 1350 px**, 4 imágenes.", "**Texto alternativo**, contraste y letra grande.", "Sin datos personales ni etiquetas a otras personas.", "Licencia **CC BY-SA** con el nombre del equipo."]}, {"tipo": "practica", "titulo": "Producción por roles", "tiempo": 28, "agrupamiento": "Equipos", "enunciado": "Montad las **viñetas 2-6**, al menos **dos interacciones** y la **página de créditos**.", "pasos": ["Diseñador/a: fondos y personajes.", "Guionista: bocadillos y cartelas.", "Verificador/a: ventanas con dato y fuente + créditos.", "Coordinador/a: minuto 15 → viñetas 2-4; minuto 28 → todo lo demás.", "A mitad de la actividad, **rotad el teclado**."], "material": ["Genially", "Guion gráfico", "Hoja de créditos"]}, {"tipo": "comparar", "titulo": "Ventana emergente: así no, así sí", "columnas": [{"titulo": "Así no", "icono": "❌", "puntos": ["Párrafo de 8 líneas", "Sin fuente", "Letra pequeña"]}, {"titulo": "Así sí", "icono": "✅", "puntos": ["Un dato en una o dos frases", "Fuente con enlace", "Letra grande y contraste"]}]}, {"tipo": "ejemplo", "icono": "🦻", "titulo": "Una publicación que no todos pueden ver", "situacion": "Un carrusel precioso… con letra fina, gris sobre blanco y sin descripción. Una persona con baja visión usa el lector de pantalla y solo oye: «**imagen**».", "explicacion": "El **texto alternativo** describe la imagen para quien no la ve, y el **contraste** y la **letra grande** ayudan a todas las personas.", "pregunta": "¿Cómo describirías vuestra portada en una frase?"}, {"tipo": "practica", "titulo": "Versión para redes en Canva", "tiempo": 12, "agrupamiento": "Equipos", "enunciado": "Elegid **4 viñetas** y montad el **carrusel** con portada y texto de la publicación.", "pasos": ["Abrid la plantilla de carrusel 1080 × 1350.", "Pegad las capturas de las viñetas.", "Portada con gancho.", "Texto de la publicación + texto alternativo de cada imagen."], "material": ["Plantilla de carrusel en Canva"]}, {"tipo": "quiz", "pregunta": "¿Cuál es un buen texto alternativo para una viñeta?", "opciones": ["«Imagen1.png»", "«Chica en la cama mirando el móvil a las 2 de la madrugada; el reloj marca la hora en rojo»", "«Viñeta bonita»"], "correcta": 1, "explicacion": "Describe **quién, qué y dónde** en una frase, para que quien no ve la imagen entienda la escena."}, {"tipo": "practica", "titulo": "Comprobación y entrega", "tiempo": 5, "agrupamiento": "Equipos", "enunciado": "Revisad con la lista y el coordinador/a **entrega**.", "pasos": ["Historia completa.", "Dato con fuente.", "Interacciones que funcionan.", "Carrusel accesible.", "Créditos completos."], "entrega": "Tarea 3.2 · Cómic digital interactivo y versión para redes", "nota": "Recuerda: la entrega es el 66 % de la nota; el 33 % restante es la presentación oral de la sesión 6."}, {"tipo": "cierre", "puntos": ["Publicar es una responsabilidad: datos, personas y licencias.", "La accesibilidad mejora la publicación para todos.", "Nuestro cómic está listo para el estreno."], "siguiente": "¡Estreno! Galería y presentación de los cómics.", "pregunta": "¿Qué viñeta os ha quedado mejor y por qué?"}]}, {"n": 6, "fase": "Bloque 1 · Cierre", "titulo": "Estreno: galería y presentación de los cómics", "reto": "Presentar el cómic a la clase, explicar su mensaje de salud, dar y recibir retroalimentación y cerrar el bloque 1 con un compromiso personal.", "pregunta": "¿Qué cómic te ha hecho cambiar un hábito?", "diapositivas": [{"tipo": "practica", "titulo": "Montamos la galería", "tiempo": 4, "agrupamiento": "Equipos", "enunciado": "Abrid el cómic en **pantalla completa** y colocad la tarjeta de la estación.", "pasos": ["Nombre del equipo.", "Tema de salud del cómic."]}, {"tipo": "ejemplo", "icono": "⭐", "titulo": "Dos estrellas y un deseo", "situacion": "Un amigo te enseña su primer vídeo editado y te pregunta qué te parece.", "explicacion": "Si solo dices «está guay», no le ayudas. Si dices **dos cosas concretas que funcionan** y **una mejora concreta**, le ayudas de verdad.", "pregunta": "¿Cómo dirías una mejora sin que suene a crítica?"}, {"tipo": "practica", "titulo": "Paseo de galería", "tiempo": 18, "agrupamiento": "Individual (un miembro del equipo se queda en su estación)", "enunciado": "Visita cada estación unos **2 minutos y medio**, prueba las interacciones y deja tus **⭐⭐ + 🙏** en el formulario.", "pasos": ["Lee la historia completa.", "Pulsa todas las interacciones.", "Escribe dos estrellas y un deseo.", "Cambia de estación cuando suene el cronómetro."], "material": ["Formulario de galería"]}, {"tipo": "practica", "titulo": "Presentación del cómic", "tiempo": 20, "enunciado": "Cada equipo presenta en **2 minutos**.", "pasos": ["¿Qué problema de salud contamos y qué lo causa?", "¿Cuál es el dato clave y de dónde sale?", "¿Qué hábito proponemos?", "Cuenta en la nota: voz clara, mirar al público y todo el equipo implicado."], "nota": "Califica aquí las líneas 4 y 5 de la rúbrica de la Tarea 3.2 (presentación oral: contenido; comunicación y equipo). Control de tiempo visible."}, {"tipo": "quiz", "pregunta": "En la presentación os preguntan por un dato del cómic y no recordáis la fuente. ¿Qué hacéis?", "opciones": ["Inventar una fuente que suene bien", "Mostrar la ventana del cómic o la página de créditos donde está", "Decir que da igual de dónde salga"], "correcta": 1, "explicacion": "Para eso están la **ventana con la fuente** y los **créditos**: el rigor se puede enseñar."}, {"tipo": "practica", "titulo": "Cierre del bloque 1", "tiempo": 8, "agrupamiento": "Individual", "enunciado": "Completamos la pizarra del primer día y escribimos **un compromiso**.", "pasos": ["¿Qué añadimos a Cuerpo y a Mente?", "Mi compromiso: un hábito para las próximas semanas.", "Votamos los cómics que propondremos al centro."]}, {"tipo": "cierre", "puntos": ["Hemos convertido datos de salud en historias.", "La retroalimentación concreta ayuda a mejorar.", "Cada persona se lleva un compromiso de hábito."], "siguiente": "Bloque 2: ¿deberían los menores usar la IA generativa?", "pregunta": "¿Qué cómic (que no sea el tuyo) te ha hecho pensar más?"}]}, {"n": 7, "fase": "Bloque 2 · Inicio", "titulo": "El dilema: ¿IA generativa para menores?", "reto": "Entender qué es la IA generativa, conocer las normas sobre su uso por menores y mapear sus beneficios y riesgos desde varios puntos de vista.", "pregunta": "¿Prohibir, permitir o enseñar a usar?", "diapositivas": [{"tipo": "practica", "titulo": "Tres escenas: ¿bueno, malo o depende?", "tiempo": 8, "enunciado": "Votad cada escena con la mano: **bueno**, **malo** o **depende**.", "pasos": ["**Lucía, 15**: el chatbot le explica ecuaciones paso a paso y por fin las entiende.", "**Marcos, 14**: la IA le hace la redacción y la entrega tal cual.", "**Sara, 16**: cada noche habla con un chatbot «amigo» que siempre le da la razón."], "nota": "Escenas ficticias. Compara con la votación de la sesión 1. Pide razones, no solo votos."}, {"tipo": "idea", "icono": "🤖", "titulo": "¿Qué es la IA generativa?", "puntos": ["**Crea** textos, imágenes, voces y vídeos.", "Aprende de **enormes cantidades de datos** (también tuyos).", "**Predice** lo más probable: no «sabe» ni «siente».", "Puede **inventar** datos con total seguridad: alucinaciones."]}, {"tipo": "infografia", "titulo": "Lo que dicen normas y hechos recientes", "elementos": [{"icono": "🔞", "titulo": "ChatGPT", "texto": "No es para **menores de 13**; de 13 a 17, con **consentimiento** de madre, padre o tutor."}, {"icono": "⚖️", "titulo": "Ley en tramitación", "texto": "España: edad para consentir datos de **14 a 16**; **deepfakes sexuales**, delito."}, {"icono": "💬", "titulo": "Chatbots de compañía", "texto": "En 2025 una plataforma **cerró las conversaciones abiertas a menores de 18** tras demandas."}], "nota": "La ley orgánica de protección de menores en entornos digitales se tramitaba en el Congreso en 2026; comprueba su estado antes de la sesión por si ya se ha aprobado."}, {"tipo": "practica", "titulo": "Equipos del bloque 2", "tiempo": 7, "enunciado": "Cuatro **equipos de debate** (4 personas) y dos **equipos de mesa** (3 personas: moderación, cronometraje y jurado).", "pasos": ["Escuchad vuestro equipo.", "Elegid nombre.", "Los roles se reparten en la sesión 10."]}, {"tipo": "ejemplo", "icono": "📚", "titulo": "El mismo chatbot, dos usos", "situacion": "Un compañero con **dislexia** usa la IA para que le lea y le resuma el tema. Otra compañera la usa para que le haga el examen de recuperación online.", "explicacion": "La herramienta es la misma. Cambian la **finalidad**, el **esfuerzo** y quién sale **ganando o perdiendo**. Por eso es un **dilema**, no una pregunta de sí o no.", "pregunta": "¿Dónde pondrías el límite?"}, {"tipo": "practica", "titulo": "Mapa del dilema", "tiempo": 18, "agrupamiento": "Equipos", "enunciado": "En cada dimensión, escribid **un beneficio**, **un riesgo** y **quién gana o pierde**.", "pasos": ["📘 Aprender · ♿ Accesibilidad e inclusión.", "🎨 Creatividad y autoría · 🔒 Privacidad y datos.", "💛 Salud emocional y relaciones · 🌍 Planeta.", "Elegid la dimensión que os parece más importante."], "material": ["Plantilla «Mapa del dilema»"]}, {"tipo": "quiz", "pregunta": "Un chatbot te da una fecha histórica con mucha seguridad. ¿Qué haces?", "opciones": ["Me la creo: las máquinas no se equivocan", "La compruebo en otra fuente fiable", "La cambio por otra que me suene mejor"], "correcta": 1, "explicacion": "La IA puede **alucinar**: inventa con la misma seguridad con la que acierta. **Comprobar** es parte de usarla bien."}, {"tipo": "idea", "icono": "🎤", "titulo": "La moción del debate (sesión 12)", "texto": "«El uso de la IA generativa **debería prohibirse** a menores de 16 años.»", "puntos": ["Prepararemos **las dos posturas**.", "La postura de cada equipo se **sortea** el día del debate.", "Todo argumento, **con dato y fuente**."]}, {"tipo": "cierre", "puntos": ["La IA generativa predice, no sabe: puede inventar.", "Las normas ya ponen límites de edad y castigan los deepfakes sexuales.", "El mismo uso puede ayudar o perjudicar: es un dilema."], "siguiente": "¿Real o generado? Cazamos bulos y deepfakes.", "pregunta": "Si tuvieras que decidir hoy, ¿prohibirías la IA generativa a menores de 16? ¿Por qué?"}]}, {"n": 8, "fase": "Bloque 2 · Desarrollo", "titulo": "¿Real o generado? Cazabulos y deepfakes", "reto": "Detectar bulos e imágenes generadas con IA, saber cómo actuar ante un deepfake y compartir lo verificado con respeto y citando fuentes.", "pregunta": "¿Lo compartirías sin comprobarlo?", "diapositivas": [{"tipo": "practica", "titulo": "¿Real, IA o bulo? Votad", "tiempo": 8, "enunciado": "Seis casos. Votad con la mano: **real**, **generado con IA** o **bulo**.", "pasos": ["La foto del Papa con un abrigo de plumas blanco.", "Un audio de un famoso pidiendo dinero para invertir.", "«La IA ya piensa y siente como una persona.»", "Una cita de un científico que da un chatbot.", "«Una consulta a la IA gasta lo mismo que una búsqueda.»", "Una foto de un centro de datos."], "nota": "Soluciones (al final de la sesión): generada con IA (2023); estafa con voz clonada; bulo; cita inventada (alucinación); con matices (depende del modelo y la tarea; las imágenes y vídeos gastan mucho más); real."}, {"tipo": "flujo", "titulo": "Kit del verificador/a ante la IA", "nodos": [{"texto": "Para: no lo compartas todavía", "tipo": "inicio"}, {"texto": "Señales: manos, textos, sombras, voz", "tipo": "proceso"}, {"texto": "Búsqueda inversa: Google Lens", "tipo": "proceso"}, {"texto": "¿Lo confirma Maldita, Newtral o EFE Verifica?", "tipo": "decision"}, {"texto": "Veredicto con fuentes", "tipo": "fin"}]}, {"tipo": "ejemplo", "icono": "🎧", "titulo": "La nota de voz de tu prima", "situacion": "Te llega un audio con la **voz de tu prima**: «Estoy en un lío, hazme un Bizum de 50 € a este número».", "explicacion": "Con unos segundos de audio, la IA puede **clonar una voz**. Señal de alarma: **urgencia + dinero + número nuevo**. Llama tú a tu prima a su número de siempre.", "pregunta": "¿Qué pregunta le harías que solo ella sabría contestar?"}, {"tipo": "idea", "icono": "🛑", "titulo": "Deepfakes de personas reales", "puntos": ["Crear o difundir un deepfake **daña a la víctima**, aunque sea «en broma».", "Si es sexual, **es delito**: en Almendralejo (2023), 15 menores fueron condenados.", "Si te pasa: **no lo compartas**, guarda pruebas y cuéntalo a un adulto.", "Pide la retirada en el **Canal prioritario de la AEPD** y llama al **017** o a **ANAR**."], "nota": "Trátalo con calma y sin detalles. Recuerda que el Departamento de Orientación y la tutoría también son vías de ayuda."}, {"tipo": "practica", "titulo": "Investigad vuestra tarjeta", "tiempo": 20, "agrupamiento": "Parejas", "enunciado": "Aplicad el kit a vuestro caso y rellenad la **ficha de verificación**.", "pasos": ["Copiad la afirmación o describid la imagen.", "Buscad al menos dos fuentes fiables.", "Veredicto: verdad, bulo, generado con IA o con matices.", "Escribid cómo lo habéis comprobado."], "material": ["Tarjeta del caso", "Ficha de verificación"]}, {"tipo": "quiz", "pregunta": "Ves una foto viral de un incendio en tu ciudad. Los coches tienen cinco ruedas y los carteles no se leen. ¿Qué es lo más probable?", "opciones": ["Que sea real y esté mal enfocada", "Que esté generada con IA", "Que sea una foto antigua"], "correcta": 1, "explicacion": "Objetos imposibles y **textos deformados** son señales típicas de imágenes generadas. Confírmalo con **búsqueda inversa** y medios fiables."}, {"tipo": "practica", "titulo": "Publicad en el foro Cazabulos", "tiempo": 12, "agrupamiento": "Parejas", "enunciado": "Publicad vuestra verificación con la plantilla y **responded a otra pareja** con respeto.", "pasos": ["Titular corto y veredicto.", "Dos fuentes enlazadas.", "Cómo lo hemos comprobado.", "Sin imágenes de personas reales.", "Una respuesta a otra pareja."], "entrega": "Foro S8 · Cazabulos: bulos y deepfakes de la IA"}, {"tipo": "cierre", "puntos": ["La IA puede crear imágenes, voces y citas falsas muy creíbles.", "Verificar lleva dos minutos; un bulo dura años.", "Un deepfake de una persona real hace daño y puede ser delito."], "siguiente": "¿Quién paga la IA? Sesgos, autoría, privacidad y huella.", "pregunta": "¿Qué argumento para el debate te llevas de hoy?"}]}, {"n": 9, "fase": "Bloque 2 · Desarrollo", "titulo": "¿Quién paga la IA? Sesgos, autoría, privacidad y huella", "reto": "Analizar casos reales de impacto ético y ecosocial de la IA generativa y redactar un código personal para usarla de forma ética.", "pregunta": "Si la IA parece gratis, ¿quién paga la factura?", "diapositivas": [{"tipo": "dato", "valor": "945 TWh", "texto": "Electricidad que podrían consumir los centros de datos del mundo en **2030**: más del **doble** que en 2024 (415 TWh), sobre todo por la **IA**.", "fuente": "Agencia Internacional de la Energía, «Energy and AI» (2025)", "pregunta": "¿Es un argumento a favor o en contra de la moción?"}, {"tipo": "ejemplo", "icono": "🤖", "titulo": "Una pregunta a la IA", "situacion": "Preguntas a un chatbot qué ponerte para una fiesta. Parece gratis y sin coste.", "explicacion": "Según Google, una consulta de texto mediana a Gemini gasta **0,24 Wh** y **0,26 ml de agua** (unas cinco gotas). Poco… pero hay **miles de millones** al día, y **una imagen o un vídeo** gastan mucho más.", "pregunta": "¿Cuántas imágenes con IA has generado este mes?", "nota": "Fuente: Google Cloud, agosto de 2025; datos de la propia empresa, no verificados de forma independiente. Conviene decirlo: también es educación mediática."}, {"tipo": "infografia", "titulo": "Cuatro facturas de la IA", "elementos": [{"icono": "⚖️", "titulo": "Sesgos", "texto": "Aprende de datos con **prejuicios** y los repite."}, {"icono": "©️", "titulo": "Autoría", "texto": "Imita a artistas **sin permiso** ni pago."}, {"icono": "🔒", "titulo": "Privacidad", "texto": "Tus textos y fotos pueden **entrenar** modelos."}, {"icono": "🌍", "titulo": "Planeta", "texto": "**Electricidad, agua** y minerales de los centros de datos."}]}, {"tipo": "practica", "titulo": "Tribunal de casos", "tiempo": 20, "agrupamiento": "Equipos", "enunciado": "Analizad vuestro caso con las **cuatro preguntas** y preparad **un minuto** de exposición.", "pasos": ["¿Quién gana?", "¿Quién pierde?", "¿Qué derecho está en juego?", "¿Qué proponemos?", "El portavoz lo cuenta en 1 minuto."], "material": ["Tarjeta del caso", "Plantilla del tribunal"]}, {"tipo": "quiz", "pregunta": "Una IA de selección de personal descarta más currículos de mujeres porque aprendió de contrataciones antiguas. ¿Qué problema es?", "opciones": ["Un fallo de conexión", "Un sesgo algorítmico", "Un virus informático"], "correcta": 1, "explicacion": "El algoritmo **copia el pasado**: si antes se contrataba sobre todo a hombres, aprende ese **sesgo**."}, {"tipo": "practica", "titulo": "Mi código ético de la IA", "tiempo": 18, "agrupamiento": "Individual", "enunciado": "Escribe **cinco normas** para usar la IA generativa y responde al **dilema del meme**.", "pasos": ["«Usaré la IA para… / No la usaré para…»", "Privacidad: datos y fotos de otras personas.", "Autoría: cuándo indico que he usado IA.", "Comprobar lo que dice · Consumo responsable.", "Dilema: un meme con la cara de un profesor generada con IA. ¿Qué haces?"], "entrega": "Tarea 3.3 · Mi código ético de la IA"}, {"tipo": "cierre", "puntos": ["La IA tiene costes que no se ven: sesgos, autoría, privacidad y planeta.", "Usarla bien depende de normas claras, también las tuyas.", "Los casos de hoy son argumentos para el debate."], "siguiente": "Los roles del debate y cómo se construye un buen argumento.", "pregunta": "¿Qué norma de tu código te va a costar más cumplir?"}]}, {"n": 10, "fase": "Bloque 2 · Desarrollo", "titulo": "Los roles del debate y cómo se construye un argumento", "reto": "Conocer el formato y los roles del debate, asumir un rol y empezar la guía del debate con argumentos sólidos para las dos posturas.", "pregunta": "¿Qué convierte una opinión en un argumento?", "diapositivas": [{"tipo": "comparar", "titulo": "Debate malo, debate bueno", "columnas": [{"titulo": "Debate malo", "icono": "😤", "puntos": ["«¡Eso es una tontería!»", "Interrumpir y gritar", "Opiniones sin pruebas"]}, {"titulo": "Debate bueno", "icono": "🤝", "puntos": ["Una idea por turno", "Un porqué y una prueba", "Rebatir la idea, no a la persona"]}], "pregunta": "¿Qué diferencia veis entre los dos fragmentos?"}, {"tipo": "flujo", "titulo": "Formato de cada ronda (unos 13 minutos)", "nodos": [{"texto": "Introducción: 2 min por equipo", "tipo": "inicio"}, {"texto": "Refutación 1: 1,5 min por equipo", "tipo": "proceso"}, {"texto": "Refutación 2: 1,5 min por equipo", "tipo": "proceso"}, {"texto": "Conclusión: 1,5 min por equipo", "tipo": "proceso"}, {"texto": "Valoración del jurado", "tipo": "fin"}], "nota": "Ronda 1: A contra B. Ronda 2: C contra D. Las posturas y los emparejamientos se sortean al inicio de la sesión 12."}, {"tipo": "infografia", "titulo": "Roles de los equipos de debate", "elementos": [{"icono": "🎬", "titulo": "Introductor/a", "texto": "Abre: presenta la postura y **tres argumentos**."}, {"icono": "🥊", "titulo": "Refutador/a 1", "texto": "Rebate el **primer** argumento del otro equipo."}, {"icono": "🛡️", "titulo": "Refutador/a 2", "texto": "Rebate el resto y **defiende** los propios."}, {"icono": "🏁", "titulo": "Conclusor/a", "texto": "Resume y cierra. **Sin datos nuevos**."}]}, {"tipo": "infografia", "titulo": "Roles de los equipos de mesa", "elementos": [{"icono": "🎙️", "titulo": "Moderador/a", "texto": "Presenta, **da los turnos** y vela por el respeto."}, {"icono": "⏱️", "titulo": "Cronometrador/a", "texto": "Tarjetas de **30 segundos** y de **tiempo**."}, {"icono": "📋", "titulo": "Relator/a-jurado", "texto": "Anota los **mejores argumentos** y valora con la ficha."}], "nota": "Cada mesa dirige una ronda y es jurado en la otra. Los equipos de debate que no debaten en una ronda son público-jurado con ficha."}, {"tipo": "practica", "titulo": "Reparto de roles", "tiempo": 4, "agrupamiento": "Equipos", "enunciado": "Repartid los roles y escribidlos en la ficha. En los equipos de debate, cada persona prepara su rol **para las dos posturas**.", "pasos": ["Equipos de debate: introductor/a, refutador/a 1, refutador/a 2, conclusor/a.", "Equipos de mesa: moderador/a, cronometrador/a, relator/a-jurado."]}, {"tipo": "ejemplo", "icono": "🏠", "titulo": "Negociar la hora de llegar a casa", "situacion": "Quieres volver a las 12 del cumpleaños. Si dices «¡Porque sí, todos van!», la respuesta es **no**.", "explicacion": "Si dices «Volveré a las 12 (**afirmación**) porque nos trae en coche la madre de Lucía (**razonamiento**), aquí tienes su teléfono (**evidencia**)», tienes muchas más opciones. Eso es un **argumento**.", "pregunta": "¿Qué evidencia convencería más a tu familia?"}, {"tipo": "pasos", "titulo": "El argumento ARE", "progresivo": true, "pasos": ["**A**firmación: qué defiendo.", "**R**azonamiento: por qué.", "**E**videncia: un dato o un caso, **con su fuente**.", "A favor: «Hay que proteger a los menores (A) porque los deepfakes causan un daño enorme (R); en Almendralejo, 2023, }
function fmtT(s){ s = Math.max(0, s|0); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

const TAG = {idea:'Idea clave', ejemplo:'Ejemplo cotidiano', pasos:'Paso a paso', comparar:'Comparamos', flujo:'Diagrama de flujo',
  infografia:'Infografía', codigo:'Programa', dato:'Dato', practica:'¡Manos a la obra!', quiz:'Comprueba', video:'Vídeo', cierre:'Cierre'};

function slidesOf(s){ return [{tipo:'portada', pregunta: s.pregunta}].concat(arr(s.diapositivas)); }
function renderSlide(s, d, k, total){
  const f = R[d.tipo] || R.idea;
  const tag = d.tipo !== 'portada' ? `<div class="tag">${esc(TAG[d.tipo]||'')}</div>` : '';
  return `<section class="slide" style="--fc:${FC[s.fase]||'var(--brand)'}" data-k="${k}">${f(d, s, k)}${tag}
    <div class="bar"><i style="width:${(k+1)/total*100}%"></i></div><div class="pg">${k+1} / ${total}</div></section>`;
}

function show(n, i){
  const s = SES.find(x => x.n == n); if (!s) return home();
  const sl = slidesOf(s);
  st.s = s; st.i = Math.max(0, Math.min(i|0, sl.length - 1));
  $('#ttl').innerHTML = `Sesión ${s.n}. ${esc(s.titulo)}<small>${esc(D.meta.titulo||'')}</small>`;
  $('#sel').value = String(s.n);
  $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar';
  if (st.mode === 'proy') {
    $('#app').innerHTML = `<div class="stage"><button class="nav l" id="pv" aria-label="Anterior">‹</button>${renderSlide(s, sl[st.i], st.i, sl.length)}<button class="nav r" id="nx" aria-label="Siguiente">›</button></div>`;

  } else {
    $('#app').innerHTML = `<div class="study">${sl.map((d,k)=>renderSlide(s, d, k, sl.length)).join('')}

  if (!st.s) return; const sl = slidesOf(st.s), d = sl[st.i];
  if (d.tipo === 'pasos' && d.progresivo) { const key = st.s.n+'-'+st.i, v = st.revealed[key] ?? 1;
    if (v < arr(d.pasos).length) { st.revealed[key] = v + 1; return show(st.s.n, st.i); } }
  if (st.i < sl.length - 1) show(st.s.n, st.i + 1);
  else { const nx = SES.find(x => x.n == st.s.n + 1); if (nx) show(nx.n, 0); }
}
function prev(){ if (!st.s) return; if (st.i > 0) show(st.s.n, st.i - 1); else { const p = SES.find(x => x.n == st.s.n - 1); if (p) show(p.n, slidesOf(p).length - 1); } }

let timers = {};
function wire(){
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => show(+b.dataset.s, 0));
  document.querySelectorAll('.opts').forEach(q => q.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    const ok = +q.dataset.ok; q.querySelectorAll('.opt').forEach(x => x.classList.remove('ok','ko'));
    o.classList.add(+o.dataset.j === ok ? 'ok' : 'ko'); q.querySelectorAll('.opt')[ok]?.classList.add('ok');
    document.getElementById('ex-' + q.dataset.q)?.classList.add('on');
  }));
  document.querySelectorAll('.reveal').forEach(b => b.onclick = () => { st.revealed[b.dataset.rev] = (st.revealed[b.dataset.rev] ?? 1) + 1; show(st.s.n, st.i); });
  document.querySelectorAll('.vid').forEach(v => { const b = v.querySelector('.play'); if (b) b.onclick = () => {
    const p = new URLSearchParams({autoplay: '1', rel: '0'}); if (+v.dataset.ini) p.set('start', v.dataset.ini); if (+v.dataset.fin) p.set('end', v.dataset.fin);
    v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?${p}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe>`; }; });
  document.querySelectorAll('.timer').forEach(b => {
    const k = b.dataset.k, paint = () => { const t = timers[k]; if (!t) return; const left = Math.round((t.end - Date.now())/1000);
      b.textContent = left > 0 ? '⏱ ' + fmtT(left) : '⏰ ¡Tiempo!'; b.classList.toggle('end', left <= 0); };
    if (timers[k]) paint();
    b.onclick = () => { if (timers[k]) { clearInterval(timers[k].iv); delete timers[k]; b.textContent = '⏱ ' + (b.dataset.timer/60) + ' min'; b.classList.remove('end'); return; }
      timers[k] = { end: Date.now() + b.dataset.timer * 1000 }; timers[k].iv = setInterval(() => { if (!document.body.contains(b)) return; paint(); }, 500); paint(); };
  });
}

// --------------------------------------------------- controles
$('#sel').innerHTML = `<option value="">Ir a la sesión…</option>` + SES.map(s => `<option value="${s.n}">S${s.n}. ${esc(s.titulo)}</option>`).join('');
$('#sel').onchange = e => e.target.value ? show(+e.target.value, 0) : home();
$('#b-home').onclick = home;
$('#b-mode').onclick = () => { st.mode = st.mode === 'proy' ? 'est' : 'proy'; st.s ? show(st.s.n, st.i) : null; $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar'; };
$('#b-notes').onclick = () => { st.notes = !st.notes; $('#b-notes').setAttribute('aria-pressed', st.notes); $('#notes').classList.toggle('on', st.notes && st.mode === 'proy' && !!st.s); };
$('#b-fs').onclick = toggleFs;
$('#b-theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('clase-theme', r.dataset.theme); } catch(e){} };
try { const t = localStorage.getItem('clase-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
function toggleFs(){
  if (!st.s) return;
  if (st.mode !== 'proy') { st.mode = 'proy'; show(st.s.n, st.i); }
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.().catch(()=>{}); document.body.classList.add('fs'); }
  else { document.exitFullscreen?.(); document.body.classList.remove('fs'); }
}
document.addEventListener('fullscreenchange', () => document.body.classList.toggle('fs', !!document.fullscreenElement));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (st.s && st.mode === 'proy' && ['ArrowRight','ArrowDown','PageDown',' '].includes(k)) { e.preventDefault(); next(); }
  else if (st.s && st.mode === 'proy' && ['ArrowLeft','ArrowUp','PageUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home' && st.s && st.mode === 'proy') show(st.s.n, 0);
  else if (k === 'End' && st.s && st.mode === 'proy') show(st.s.n, slidesOf(st.s).length - 1);
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'n' || k === 'N') $('#b-notes').click();
  else if ((k === 'e' || k === 'E') && st.s) $('#b-mode').click();
  else if (k === 'Escape' && !document.fullscreenElement) home();
});
// enlace directo: #s3-2 (sesión 3, diapositiva 2)
const m = location.hash.match(/^#s(\d+)(?:-(\d+))?/);
if (!SES.length) $('#app').innerHTML = '<div class="empty">Esta situación de aprendizaje todavía no tiene diapositivas de clase.</div>';
else if (m) show(+m[1], (+m[2] || 1) - 1); else home();
</script>
