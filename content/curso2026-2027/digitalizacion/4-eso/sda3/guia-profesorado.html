ate (66 %) y debate en escena en la sesión 12 (33 %)", "Observación directa en el mapa del dilema y el tribunal de casos (sesiones 7 y 9)"]}, "cotejo": [{"criterio": "DIG.4.2.3", "indicadores": ["Planifica el cómic en un guion gráfico con estructura narrativa y elementos interactivos.", "Crea el cómic en Genially con viñetas, bocadillos, cartelas e interacciones que funcionan.", "Integra información de salud correcta con su fuente en la historia.", "Adapta el contenido a un formato para redes accesible.", "Cita todas las imágenes con su licencia e indica las generadas con IA."]}, {"criterio": "DIG.4.3.3", "indicadores": ["Identifica riesgos físicos del uso de pantallas (postura, vista, sueño, sedentarismo) y su causa.", "Identifica riesgos psicológicos (tecnoestrés, nomofobia, FOMO, diseño que engancha).", "Ajusta su puesto de trabajo y propone hábitos saludables concretos.", "Sabe cómo reaccionar y a quién acudir ante una situación de riesgo en la red.", "Explica en la presentación del cómic el problema de salud, su causa y su prevención."]}, {"criterio": "DIG.4.4.1", "indicadores": ["Verifica la información y las imágenes antes de compartirlas y cita las fuentes.", "Corrige o rebate con respeto, sin ataques personales.", "Respeta las licencias de uso, la autoría y la privacidad de otras personas.", "Conoce cómo actuar ante un deepfake y no crea ni difunde contenidos de personas reales.", "Concreta normas personales de uso ético de la IA generativa."]}, {"criterio": "DIG.4.4.4", "indicadores": ["Identifica beneficios de la IA generativa, incluida la accesibilidad.", "Identifica riesgos personales, sociales y ambientales (energía y agua) de la IA generativa.", "Analiza quién gana y quién pierde en un caso tecnológico real.", "Argumenta con datos y fuentes en el rol asignado del debate.", "Propone medidas de uso responsable y sostenible de la IA por menores."]}], "agentes": {"Heteroevaluación": "Tareas 3.1 y 3.3 (Apto / No apto), rúbricas de las Tareas 3.2 y 3.4 (que incluyen la presentación oral y el debate en escena), lista de cotejo del foro y observación directa individual.", "Coevaluación": "«Dos estrellas y un deseo» en la galería (sesión 6), sugerencias del ensayo (sesión 11) y fichas del jurado de alumnado (sesión 12).", "Autoevaluación": "Mi radiografía digital (sesiones 2-3), compromiso de hábito (sesión 6), código ético (sesión 9) y autoevaluación final con la lista de cotejo (sesión 12)."}}, "moodle": {"estructura": "Una sección «SdA 3 · Lo que tu pantalla no te cuenta» en el curso de Digitalización de 4.º ESO, dividida con dos encabezados (Bloque 1 · Salud digital y Bloque 2 · IA generativa y menores) y las cuatro Tareas y el foro en el orden de las sesiones.", "secciones": [{"nombre": "SdA 3 · Lo que tu pantalla no te cuenta", "elementos": ["Área de texto y medios con el reto, la pregunta guía, los dos productos y el calendario de entregas", "Página «Cómo se evalúa» con las listas de verificación y las rúbricas de las Tareas 3.2 y 3.4", "Archivo con la web de clase de la SdA (diapositivas para repasar)", "Encabezado «Bloque 1 · Salud digital»", "Tarea 3.1 · Mi radiografía digital", "Tarea 3.2 · Cómic digital interactivo y versión para redes", "Encabezado «Bloque 2 · IA generativa y menores»", "Foro S8 · Cazabulos: bulos y deepfakes de la IA", "Tarea 3.3 · Mi código ético de la IA", "Tarea 3.4 · Guía del debate: IA generativa y menores", "URL a las plantillas de Google (radiografía, guion gráfico, mapa del dilema, código ético, guía del debate)"]}], "calificaciones": "Cuatro categorías, una por criterio (DIG.4.2.3, DIG.4.3.3, DIG.4.4.1 y DIG.4.4.4). Las Tareas 3.1 y 3.3 usan la escala «No apto, Apto». Las Tareas 3.2 y 3.4 se califican con rúbrica sobre 10: tres líneas del producto digital (66 %) y dos de puesta en público (33 %), que se completan tras la presentación (sesión 6) y el debate (sesión 12). La observación individual con la lista de cotejo se añade como ítem manual en DIG.4.3.3 y DIG.4.4.1, y la lista de cotejo del foro en DIG.4.4.1.", "configuracion": ["Escala personalizada «No apto, Apto».", "Grupos: dos agrupamientos, «SdA3 Cómic» (siete equipos del bloque 1) y «SdA3 Debate» (seis equipos del bloque 2), para las entregas por grupos de las Tareas 3.2 y 3.4.", "Fechas de entrega escalonadas (sesiones 3, 5, 9 y 11) visibles en el calendario del curso.", "Finalización de actividad activada y prórrogas individuales para el alumnado que lo necesite.", "Rúbricas de las Tareas 3.2 y 3.4 guardadas como plantilla, con los puntos de las líneas de puesta en público reducidos (0,75-7,5) para que pesen un 33 %."], "area_texto": {"bloques": [{"nombre": "Bloque 1 · Salud digital", "descripcion": "Producto: cómic interactivo y su versión para redes · Presentación en la sesión 6", "sesiones": "1-6"}, {"nombre": "Bloque 2 · IA generativa y menores", "descripcion": "Producto: guía del debate · Debate con roles en la sesión 12", "sesiones": "7-12"}], "eventos": [{"sesion": 6, "texto": "Presentación del cómic ante la clase", "tipo": "Se evalúa en clase"}, {"sesion": 12, "texto": "El gran debate", "tipo": "Se evalúa en clase"}], "nota_evaluacion": "Las Tareas con **rúbrica** (cómic y guía del debate) cuentan un **66 %** por el trabajo entregado y un **33 %** por cómo lo presentáis en clase: la presentación del cómic y el debate. Tienes las rúbricas completas en la página **«Cómo se evalúa»** de esta sección.", "ayuda": "Si algo en internet te hace daño o te preocupa, cuéntaselo a tu familia, a tu tutor/a o al Departamento de Orientación. También puedes llamar al **017** (INCIBE) o a la **Fundación ANAR (900 20 20 10)**.", "url_clase": "https://florindotic.es/content/curso2026-2027/digitalizacion/4-eso/sda3/clase.html"}}, "seneca": {"justificacion": "El alumnado de 4.º ESO investiga en dos bloques los efectos del uso masivo de la tecnología. En el primero estudia las enfermedades físicas y mentales asociadas a las pantallas y las cuenta en un cómic interactivo con versión para redes que presenta a la clase. En el segundo analiza los beneficios y riesgos éticos y ecosociales de la IA generativa en menores, elabora una guía del debate y defiende su postura en un debate estructurado con roles.", "actividades": [{"titulo": "Cómic digital interactivo sobre salud digital y versión para redes", "tipo": "Conclusión", "abreviatura": "CON1", "tarea": "3.2", "sesiones": [1, 2, 3, 4, 5, 6], "trazabilidad": "RÚBRICA", "criterios": ["DIG.4.2.3"]}, {"titulo": "Guía del debate: IA generativa y menores", "tipo": "Conclusión", "abreviatura": "CON2", "tarea": "3.4", "sesiones": [7, 8, 9, 10, 11, 12], "trazabilidad": "RÚBRICA", "criterios": ["DIG.4.4.4"]}]}, "notas_rigor": ["Reorganización en dos bloques a petición del docente: bloque 1 (sesiones 1-6) sobre las enfermedades físicas y mentales del uso masivo de internet, con el cómic y su presentación; bloque 2 (sesiones 7-12) sobre el dilema de la IA generativa en menores, con la guía y el debate con roles. Se ha eliminado el encargo para el alumnado de 1.º y 2.º ESO y la vinculación con los programas de Hábitos de Vida Saludable y Aldea.", "Las dos tareas con rúbrica corresponden a «producto para redes» (Tarea 3.2, cómic con su carrusel, DIG.4.2.3) y «guía» (Tarea 3.4, guía del debate, DIG.4.4.4). Las entregas quedan escalonadas: sesiones 3, 5, 8 (foro), 9 y 11, más la presentación (sesión 6) y el debate (sesión 12).", "Rúbricas de las Tareas 3.2 y 3.4: cinco líneas cada una, tres del producto digital (22,2 % cada una, 66,7 %) y dos de puesta en público (16,7 % cada una, 33,3 %). La nota es la media ponderada. En Moodle el peso se consigue con los puntos de los niveles: 1-3-5-7-10 en las líneas del producto y 0,75-2,25-3,75-5,25-7,5 en las de puesta en público. Si se prefiere no tocar los puntos en Moodle, se puede anotar la nota ponderada a mano (la web de la SdA la calcula al pulsar las casillas).", "Ningún criterio de la SdA trata la expresión oral como tal: la presentación y el debate en escena se califican dentro de las rúbricas de DIG.4.2.3 y DIG.4.4.4 como forma de comunicar y defender el producto. Si se quiere evaluar la comunicación ante el público con un criterio propio, las opciones del currículo de Digitalización de 4.º son DIG.4.2.4 (para la presentación y difusión del cómic) y DIG.4.4.3 (para el debate); ver la respuesta del docente.", "DIG.4.3.3 y DIG.4.4.1 no tienen Tarea con rúbrica, por lo que no generan actividad propia en Séneca: se evalúan con las Tareas Apto / No apto 3.1 y 3.3, la lista de cotejo del foro y la observación directa de la presentación y del debate. Si se quiere registrar el debate en Séneca, puede añadirse una actividad con trazabilidad OBSERVACIÓN DIRECTA.", "El foro de bulos se apoya en DIG.4.D.1 (etiqueta digital y responsabilidad al difundir), DIG.4.D.5 y DIG.4.C.3 (deepfakes como situación de riesgo en la red). El saber específico de detección de noticias falsas, DIG.4.D.2, no está entre los seleccionados porque está vinculado al criterio DIG.4.4.3.", "La huella ambiental de la IA (DIG.4.D.5) ya no tiene sesión propia: se trabaja en la sesión 9 como uno de los argumentos del debate.", "Datos usados en el bloque 2, comprobados en octubre de 2026: ChatGPT no está destinado a menores de 13 años y de 13 a 17 requiere consentimiento de madre, padre o tutor (centro de ayuda de OpenAI); el proyecto de ley orgánica de protección de las personas menores de edad en los entornos digitales (aprobado por el Consejo de Ministros el 25 de marzo de 2025) eleva de 14 a 16 años la edad de consentimiento para el tratamiento de datos y tipifica los deepfakes sexuales, y seguía en tramitación en el Congreso en junio de 2026; caso de Almendralejo (2023): 15 menores condenados a un año de libertad vigilada; en octubre de 2025 Character.AI anunció el fin de las conversaciones abiertas para menores de 18 años, efectivo desde el 25 de noviembre de 2025. Conviene revisar el estado de la ley antes de impartir el bloque 2.", "Otras cifras: centros de datos 415 TWh en 2024 y unos 945 TWh en 2030 (AIE, «Energy and AI», 2025); consulta de texto mediana a Gemini 0,24 Wh y 0,26 ml de agua (Google Cloud, agosto de 2025, datos de la empresa no verificados de forma independiente); carga cervical según la inclinación de la cabeza (Hansraj, 2014).", "Protección de datos: encuesta y test de nomofobia anónimos; cómics sin fotos del alumnado ni datos personales; el foro no admite imágenes de personas reales; la posible difusión de los cómics la decide el equipo directivo por los canales oficiales del centro, no el alumnado en sus cuentas personales.", "La sesión 1 es diagnóstica y no se califica."]}, "cur": {"DIG.4.1": {"tipo": "ce", "texto": "Identificar y resolver problemas técnicos sencillos, conectar y configurar dispositivos a redes domésticas, aplicando los conocimientos de hardware y sistemas operativos, para gestionar de forma sostenible las herramientas e instalaciones informáticas y de comunicación de uso cotidiano.", "descriptores": ["STEM1", "STEM2", "CD4", "CD5", "CPSAA1", "CPSAA5", "CE3"]}, "DIG.4.2": {"tipo": "ce", "texto": "Configurar el entorno personal de aprendizaje, interactuando y aprovechando los recursos del ámbito digital, para optimizar y gestionar el aprendizaje permanente.", "descriptores": ["CD1", "CD2", "CD3", "CPSAA1", "CPSAA4", "CPSAA5", "CE3"]}, "DIG.4.3": {"tipo": "ce", "texto": "Desarrollar hábitos que fomenten el bienestar digital, aplicando medidas preventivas y correctivas, para proteger dispositivos, datos personales y la propia salud.", "descriptores": ["CCL3", "STEM5", "CD1", "CD4", "CPSAA2", "CPSAA5", "CC2", "CC3"]}, "DIG.4.4": {"tipo": "ce", "texto": "Ejercer una ciudadanía digital crítica, conociendo las posibles acciones que realizar en la red, e identificando sus repercusiones, para hacer un uso activo, responsable y ético de la tecnología.", "descriptores": ["CD3", "CD4", "CPSAA1", "CC1", "CC2", "CC3", "CC4", "CE1"]}, "DIG.4.1.1": {"tipo": "cr", "texto": "Conectar dispositivos y gestionar redes locales aplicando los conocimientos y procesos asociados a sistemas de comunicación alámbrica e inalámbrica con una actitud proactiva.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1", "DIG.4.A.4", "DIG.4.A.3"]}, "DIG.4.1.2": {"tipo": "cr", "texto": "Instalar y mantener sistemas operativos, configurando sus características en función de sus necesidades personales, de forma sostenible.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.2"]}, "DIG.4.1.3": {"tipo": "cr", "texto": "Identificar y resolver problemas técnicos sencillos, analizando componentes y funciones de los dispositivos digitales, evaluando las soluciones de manera crítica y reformulando el procedimiento, en caso necesario, fomentando un consumo y reposición de los sistemas digitales y/o tecnológicos de manera sostenible y responsable.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1"]}, "DIG.4.2.1": {"tipo": "cr", "texto": "Gestionar el aprendizaje en el ámbito digital, configurando el entorno personal de aprendizaje mediante la integración de recursos digitales de manera autónoma.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.D.1"]}, "DIG.4.2.2": {"tipo": "cr", "texto": "Buscar, seleccionar y archivar información en función de sus necesidades haciendo uso de las herramientas del entorno personal de aprendizaje con sentido crítico y siguiendo normas básicas de seguridad en la red.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.C.2", "DIG.4.C.3"]}, "DIG.4.2.3": {"tipo": "cr", "texto": "Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.D.1"]}, "DIG.4.2.4": {"tipo": "cr", "texto": "Interactuar en espacios virtuales de comunicación y plataformas de aprendizaje colaborativo, compartiendo y publicando información y datos, adaptándose a diferentes audiencias con una actitud participativa y respetuosa.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.3", "DIG.4.D.5", "DIG.4.D.6"]}, "DIG.4.3.1": {"tipo": "cr", "texto": "Proteger los datos personales y la huella digital generada en internet, configurando las condiciones de privacidad de las redes sociales y espacios virtuales de trabajo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.2"]}, "DIG.4.3.2": {"tipo": "cr", "texto": "Configurar y actualizar contraseñas, sistemas operativos y antivirus de forma periódica en los distintos dispositivos digitales de uso habitual.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.1"]}, "DIG.4.3.3": {"tipo": "cr", "texto": "Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.3"]}, "DIG.4.4.1": {"tipo": "cr", "texto": "Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.5"]}, "DIG.4.4.2": {"tipo": "cr", "texto": "Reconocer las aportaciones de las tecnologías digitales en las gestiones administrativas, y el comercio electrónico, siendo consciente de la brecha social de acceso, uso y aprovechamiento de dichas tecnologías para diversos colectivos.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.4"]}, "DIG.4.4.3": {"tipo": "cr", "texto": "Valorar la importancia de la oportunidad, facilidad y libertad de expresión que suponen los medios digitales conectados, analizando de forma crítica los mensajes que se reciben y transmiten teniendo en cuenta su objetividad, ideología, intencionalidad, sesgos y caducidad.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.6"]}, "DIG.4.4.4": {"tipo": "cr", "texto": "Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.5"]}, "DIG.4.A": {"tipo": "sb", "texto": "Dispositivos digitales, sistemas operativos y de comunicación.", "hijos": ["DIG.4.A.1", "DIG.4.A.2", "DIG.4.A.3", "DIG.4.A.4"], "criterios": []}, "DIG.4.A.1": {"tipo": "sb", "texto": "Arquitectura de ordenadores: elementos, montaje, configuración y resolución de problemas.", "hijos": [], "criterios": []}, "DIG.4.A.2": {"tipo": "sb", "texto": "Sistemas operativos: instalación y configuración de usuario.", "hijos": [], "criterios": []}, "DIG.4.A.3": {"tipo": "sb", "texto": "Sistemas de comunicación e internet: dispositivos de red y funcionamiento. Procedimiento de configuración de una red doméstica y conexión de dispositivos.", "hijos": [], "criterios": []}, "DIG.4.A.4": {"tipo": "sb", "texto": "Dispositivos conectados (IoT + Wearables): configuración y conexión de dispositivos.", "hijos": [], "criterios": []}, "DIG.4.B": {"tipo": "sb", "texto": "Digitalización del entorno personal de aprendizaje.", "hijos": ["DIG.4.B.1", "DIG.4.B.2", "DIG.4.B.3", "DIG.4.B.4"], "criterios": []}, "DIG.4.B.1": {"tipo": "sb", "texto": "Búsqueda, administración, gestión, selección y archivo de información.", "hijos": [], "criterios": []}, "DIG.4.B.2": {"tipo": "sb", "texto": "Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.B.3": {"tipo": "sb", "texto": "Comunicación y colaboración en red.", "hijos": [], "criterios": []}, "DIG.4.B.4": {"tipo": "sb", "texto": "Publicación y difusión responsable en redes.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.C": {"tipo": "sb", "texto": "Seguridad y bienestar digital.", "hijos": ["DIG.4.C.1", "DIG.4.C.2", "DIG.4.C.3"], "criterios": []}, "DIG.4.C.1": {"tipo": "sb", "texto": "Seguridad de dispositivos: medidas preventivas y correctivas para hacer frente a riesgos, amenazas y ataques a dispositivos.", "hijos": [], "criterios": []}, "DIG.4.C.2": {"tipo": "sb", "texto": "Seguridad y protección de datos: identidad, reputación digital, privacidad y huella digital. Medidas preventivas en la configuración de redes sociales y la gestión de identidades virtuales.", "hijos": [], "criterios": []}, "DIG.4.C.3": {"tipo": "sb", "texto": "Seguridad en la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).", "hijos": [], "criterios": ["DIG.4.3.3"]}, "DIG.4.D": {"tipo": "sb", "texto": "Ciudadanía digital crítica.", "hijos": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.3", "DIG.4.D.4", "DIG.4.D.5", "DIG.4.D.6"], "criterios": []}, "DIG.4.D.1": {"tipo": "sb", "texto": "Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.D.2": {"tipo": "sb", "texto": "Educación mediática: periodismo digital, blogosfera, estrategias comunicativas y uso crítico de la red. Herramientas para detectar noticias falsas y fraudes.", "hijos": [], "criterios": []}, "DIG.4.D.3": {"tipo": "sb", "texto": "Gestiones administrativas: servicios públicos en línea, registros digitales y certificados oficiales.", "hijos": [], "criterios": ["DIG.4.4.1"]}, "DIG.4.D.4": {"tipo": "sb", "texto": "Comercio electrónico: facturas digitales, formas de pago y criptomonedas.", "hijos": [], "criterios": []}, "DIG.4.D.5": {"tipo": "sb", "texto": "Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.", "hijos": [], "criterios": ["DIG.4.4.1", "DIG.4.4.4"]}, "DIG.4.D.6": {"tipo": "sb", "texto": "Activismo en línea: plataformas de iniciativa ciudadana y cibervoluntariado y comunidades de hardware y software libres.", "hijos": [], "criterios": []}, "CCL1": {"tipo": "de", "texto": "Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.", "competencias": []}, "CCL2": {"tipo": "de", "texto": "Comprende, interpreta y valora con actitud crítica textos orales, escritos, signados o multimodales de los ámbitos personal, social, educativo y profesional para participar en diferentes contextos de manera activa e informada y para construir conocimiento.", "competencias": []}, "CCL3": {"tipo": "de", "texto": "Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": ["DIG.4.3"]}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": []}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": []}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": []}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": ["DIG.4.3"]}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["DIG.4.2", "DIG.4.3"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": ["DIG.4.2"]}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["DIG.4.2", "DIG.4.4"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["DIG.4.3", "DIG.4.4"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": []}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": ["DIG.4.2", "DIG.4.4"]}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": ["DIG.4.3"]}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": []}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": ["DIG.4.2"]}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["DIG.4.2", "DIG.4.3"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": ["DIG.4.4"]}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": ["DIG.4.3", "DIG.4.4"]}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": ["DIG.4.3", "DIG.4.4"]}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": ["DIG.4.4"]}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": ["DIG.4.4"]}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["DIG.4.2"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": []}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": []}}, "idx": {"criterios": ["DIG.4.2.3", "DIG.4.3.3", "DIG.4.4.1", "DIG.4.4.4"], "competencias": ["DIG.4.2", "DIG.4.3", "DIG.4.4"], "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.C.3", "DIG.4.D.1", "DIG.4.D.5"], "descriptores": ["CC1", "CC2", "CC3", "CC4", "CCL3", "CD1", "CD2", "CD3", "CD4", "CE1", "CE3", "CPSAA1", "CPSAA2", "CPSAA4", "CPSAA5", "STEM5"], "sesionesPorCriterio": {"DIG.4.3.3": [2, 3, 5, 6], "DIG.4.2.3": [4, 5, 6], "DIG.4.4.1": [4, 8, 9, 12], "DIG.4.4.4": [7, 9, 10, 11, 12]}, "porMateria": [{"codigo": "DIG", "criterios": ["DIG.4.2.3", "DIG.4.3.3", "DIG.4.4.1", "DIG.4.4.4"], "competencias": ["DIG.4.2", "DIG.4.3", "DIG.4.4"], "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.C.3", "DIG.4.D.1", "DIG.4.D.5"], "descriptores": ["CC1", "CC2", "CC3", "CC4", "CCL3", "CD1", "CD2", "CD3", "CD4", "CE1", "CE3", "CPSAA1", "CPSAA2", "CPSAA4", "CPSAA5", "STEM5"]}], "materiasTxt": "Digitalización"}, "seneca": {"titulo": "SdA 3: Ética, Salud Digital y Sostenibilidad Ecosocial", "temporalizacion": "12 sesiones", "justificacion": "El alumnado de 4.º ESO investiga en dos bloques los efectos del uso masivo de la tecnología. En el primero estudia las enfermedades físicas y mentales asociadas a las pantallas y las cuenta en un cómic interactivo con versión para redes que presenta a la clase. En el segundo analiza los beneficios y riesgos éticos y ecosociales de la IA generativa en menores, elabora una guía del debate y defiende su postura en un debate estructurado con roles.", "producto_final": "Dos productos, uno por bloque. Bloque 1: cómic digital interactivo creado en Genially (6 viñetas con ventanas emergentes de datos y fuentes, al menos dos interacciones y página de créditos) sobre una enfermedad física o mental del uso masivo de internet, con una versión en carrusel para redes sociales, presentado ante la clase. Bloque 2: guía del debate (argumentos a favor y en contra con datos y fuentes, refutaciones previstas y guion de cada rol) y debate estructurado con roles sobre la moción «El uso de la IA generativa debería prohibirse a menores de 16 años».", "concrecion": [{"materia": "Digitalización", "texto": "COMPETENCIAS ESPECÍFICAS\nDIG.4.2.Configurar el entorno personal de aprendizaje, interactuando y aprovechando los recursos del ámbito digital, para optimizar y gestionar el aprendizaje permanente.\nDIG.4.3.Desarrollar hábitos que fomenten el bienestar digital, aplicando medidas preventivas y correctivas, para proteger dispositivos, datos personales y la propia salud.\nDIG.4.4.Ejercer una ciudadanía digital crítica, conociendo las posibles acciones que realizar en la red, e identificando sus repercusiones, para hacer un uso activo, responsable y ético de la tecnología.\n\nCRITERIOS DE EVALUACIÓN\nDIG.4.2.3.Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.\nDIG.4.3.3.Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.\nDIG.4.4.1.Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.\nDIG.4.4.4.Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.\n\nSABERES BÁSICOS\nDIG.4.B.2.Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.\nDIG.4.B.4.Publicación y difusión responsable en redes.\nDIG.4.C.3.Seguridad en la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).\nDIG.4.D.1.Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.\nDIG.4.D.5.Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.\n\nDESCRIPTORES OPERATIVOS\nCC1. Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA2. Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable."}], "actividades": [{"titulo": "Cómic digital interactivo sobre salud digital y versión para redes", "tipo": "Conclusión", "abreviatura": "CON1", "orden": "1", "tarea": "3.2 · Cómic digital interactivo y versión para redes", "descripcion": "Sesión 1 (50 min): Gancho: ¿cuánto te cuesta tu scroll?\nReto: Descubrir que el uso de pantallas tiene efectos en el cuerpo y en la mente, conocer los dos bloques de la SdA y formar los equipos del cómic.\n- La pantalla de Alex (10 min). El docente proyecta la pantalla «Tiempo de uso» de un adolescente ficticio, Alex: 6 h 42 min de pantalla, 147 desbloqueos, TikTok 3 h 10 min, Instagram 1 h 25 min, última notificación a las 2:13. Rutina «Veo, pienso, me pregunto» en voz alta. La clase rellena en la pizarra dos columnas: ¿qué le pasa a su cuerpo?, ¿y a su mente? Se dejan en la pizarra (o en una foto del docente) para volver a ellas en la sesión 6.\n- Encuesta anónima (8 min). Cada estudiante responde en el ordenador un Google Forms anónimo del centro (8 preguntas de opción): horas de pantalla al día (estimadas), si duerme con el móvil en la habitación, si le duelen cuello u ojos, si ha sentido ansiedad sin móvil, si usa IA generativa y para qué. Enlace: https://forms.gle/VdcEyGex3hpTHNjEA. El docente proyecta los gráficos de respuestas en directo.\n- Votación relámpago del bloque 2 (5 min). Avance del segundo bloque: «¿Debería poder usar la IA generativa sin límites un/a menor de 16 años?». Votación a mano alzada (sí / no / depende). El docente apunta el resultado para compararlo en las sesiones 7 y 12.\n- Presentación de la SdA (12 min). El docente presenta el reto, la pregunta guía y los dos bloques: bloque 1 (sesiones 1-6) con el cómic interactivo y su presentación, y bloque 2 (sesiones 7-12) con la guía del debate y el debate. Se proyecta el calendario de entregas para que se vea que están repartidas: Tarea 3.1 (sesión 3), Tarea 3.2 (sesión 5), presentación (sesión 6), foro Cazabulos (sesión 8), Tarea 3.3 (sesión 9), Tarea 3.4 (sesión 11) y debate (sesión 12). Se enseña un cómic de ejemplo en Genially hecho por el docente y cómo se evalúa.\n- Equipos del cómic y roles (15 min). Formación de siete equipos heterogéneos (seis de 3 y uno de 4) hecha por el docente. Reparto de roles: coordinador/a-portavoz, guionista, diseñador/a visual y verificador/a de datos (en los equipos de 3, coordinación y verificación van juntas). Cada equipo elige nombre y firma el contrato de equipo en una plantilla de Google Docs compartida.\n- Evidencia: Respuestas de la encuesta anónima (diagnóstica, no calificable)\n- Evidencia: Resultado de la votación inicial\n- Evidencia: Contrato de equipo\n\nSesión 2 (50 min): Cuerpo digital: ergonomía y enfermedades digitales\nReto: Reconocer los riesgos físicos del uso de pantallas y corregir la postura en el propio puesto de trabajo.\n- ¡Congelados! (5 min). Mientras el alumnado empieza a trabajar en el ordenador, el docente dice «¡congelados!». Sin moverse, cada estudiante observa la postura de su compañero/a: espalda, cuello, muñecas, distancia a la pantalla. Se comentan en voz alta tres posturas típicas (sin señalar a nadie ni hacer fotos).\n- Enfermedades digitales (12 min). Mini-explicación con infografía: cuello de texto (al inclinar la cabeza 60° el cuello soporta unos 27 kg), síndrome visual informático y regla 20-20-20 (cada 20 minutos, mirar 20 segundos algo a unos 6 metros), molestias en pulgar y muñeca (tendinitis, túnel carpiano), sedentarismo y efecto de las pantallas antes de dormir. Para cada una: síntoma, causa y prevención.\n- Auditoría ergonómica (18 min). Por parejas, con una lista de 8 puntos en papel o Google Docs, revisan el puesto del aula de cada uno: pantalla a la altura de los ojos, distancia de 50-70 cm, espalda apoyada, pies en el suelo, codos a 90°, muñecas rectas, luz sin reflejos y pausas. Puntúan de 0 a 8, ajustan silla y pantalla y vuelven a puntuar. Después dibujan en un monigote la postura típica con el móvil en el sofá y la corrigen.\n- Pausa activa (5 min). El docente guía dos minutos de estiramientos de cuello, hombros y muñecas y practica la regla 20-20-20 mirando por la ventana. Se propone repetirla en cada sesión.\n- Mi radiografía digital (parte 1) (10 min). Cada estudiante abre la plantilla «Mi radiografía digital» (Google Docs) y completa la parte «Cuerpo»: dos riesgos físicos que reconoce en sí mismo/a con su causa y tres cambios concretos que puede hacer. La terminará la próxima sesión y la entregará en la Tarea 3.1.\n- Evidencia: Lista de auditoría ergonómica antes y después\n- Evidencia: Parte «Cuerpo» de Mi radiografía digital\n\nSesión 3 (50 min): Mente digital: tecnoestrés, nomofobia y diseño que engancha\nReto: Identificar los riesgos para la salud mental del uso de pantallas, reconocer los trucos de diseño persuasivo y elaborar un plan personal de hábitos saludables.\n- ¿Y si te lo dejas en casa? (7 min). El docente proyecta una ráfaga de sonidos de notificaciones y pregunta: ¿qué sientes si sales de casa y te das cuenta de que no llevas el móvil? Cada estudiante elige un emoji en una votación rápida a mano alzada (😌 tranquilidad, 😬 nervios, 😱 pánico). Se introduce la palabra nomofobia.\n- Conceptos clave (10 min). Explicación breve con ejemplos cotidianos: tecnoestrés (sobrecarga de notificaciones y tareas digitales), nomofobia (miedo a estar sin móvil), FOMO (miedo a perderse algo), phubbing (ignorar a quien está contigo por mirar el móvil) y dependencia tecnológica. Diseño persuasivo: scroll infinito, reproducción automática, notificaciones, rachas y recompensa variable (como una tragaperras).\n- Test de nomofobia (8 min). Cada estudiante responde un test anónimo de 10 afirmaciones adaptado de la escala NMP-Q (Yildirim y Correia, 2015) en Google Forms, con una puntuación orientativa al final. Enlace: https://forms.gle/QJ8EuqAkaqKT1HtCA. No es un diagnóstico y nadie comparte su resultado; sirve para reflexionar.\n- Caza de trucos (10 min). Por parejas, analizan las capturas de una app ficticia, «FlashTok», en una ficha: identifican cinco trucos de diseño persuasivo (scroll infinito, punto rojo de notificación, racha de días, vídeo que empieza solo, «a 3 amigos les gusta esto») y proponen un contra-truco para cada uno (desactivar notificaciones, límites de uso en Bienestar digital o Tiempo de uso, modo escala de grises, móvil fuera del dormitorio).\n- Mi radiografía digital (parte 2) y entrega (15 min). Cada estudiante completa la parte «Mente» de la plantilla: dos riesgos psicológicos que reconoce, su plan de tres hábitos con cuándo y cómo, y a quién pedir ayuda si el uso se vuelve un problema o vive una situación de riesgo en la red (familia, tutoría, Departamento de Orientación, línea 017 de INCIBE, Fundación ANAR 900 20 20 10). Descarga el documento en PDF y lo entrega en la Tarea 3.1.\n- Moodle Centros: Tarea «3.1 · Mi radiografía digital» (corrección Apto / No apto). Comprobar que cada estudiante identifica riesgos físicos y psicológicos del uso de pantallas y concreta un plan de hábitos saludables y vías de ayuda.\n- Evidencia: Ficha «Caza de trucos»\n- Evidencia: Tarea 3.1 · Mi radiografía digital\n\nSesión 4 (50 min): Del dato a la viñeta: guion del cómic e imágenes con licencia\nReto: Elegir el tema de salud digital del cómic, planificar la historia en un guion gráfico con elementos interactivos y empezar a montarlo respetando las licencias.\n- Anatomía de un cómic (8 min). El docente proyecta dos páginas de cómic divulgativo (una propia y una con licencia CC de Openverse o Wikimedia Commons) y la clase identifica sus elementos: viñeta, bocadillo de diálogo y de pensamiento, cartela, onomatopeya y plano (general, medio, primer plano). Se enseña cómo Genially añade interactividad: botón que abre una ventana con un dato y su fuente, pregunta con opciones y botón «¿Qué harías tú?».\n- Elección de tema (4 min). Cada equipo elige un tema sin repetir: cuello de texto y postura, vista cansada, sueño y pantallas, sedentarismo, nomofobia, tecnoestrés y notificaciones, o diseño que engancha (scroll infinito, rachas). Se usa lo trabajado en las sesiones 2 y 3.\n- Guion gráfico (20 min). Con una plantilla de guion gráfico de 6 viñetas en Google Presentaciones, cada equipo planifica: protagonista adolescente inventado/a, situación de partida, conflicto (aparece el problema de salud), giro con un dato real y su fuente, solución con un hábito saludable y llamada a la acción final. Marcan dónde irán al menos dos elementos interactivos.\n- Imágenes con licencia (8 min). Taller exprés de licencias: buscar en Openverse con filtro de licencia, entender CC BY, CC BY-SA y CC0, y citar con la fórmula TAFL (título, autor/a, fuente y licencia). Normas del cómic: nada de personajes con copyright, ninguna foto de compañeros/as ni datos personales, y si se usa una imagen generada con IA se indica «imagen generada con IA» y la herramienta.\n- Primera viñeta en Genially (10 min). El docente monta en directo una viñeta (plantilla o lienzo en blanco, fondo, personaje, bocadillo y botón con ventana emergente) y enseña a compartir el Genially con el equipo para editar a la vez. Cada equipo crea su Genially, lo comparte y monta la viñeta 1. La demostración queda grabada en Moodle.\n- Evidencia: Guion gráfico del cómic\n- Evidencia: Hoja de créditos iniciada\n- Evidencia: Viñeta 1 en Genially\n\nSesión 5 (50 min): Producción del cómic y versión para redes\nReto: Terminar el cómic interactivo en Genially, preparar su versión accesible para redes y entregarlo.\n- Hitos y publicación responsable (5 min). El docente recuerda la lista de hitos y la rúbrica de la Tarea 3.2, y da tres normas de publicación responsable: formato de carrusel vertical (1080 × 1350 px), accesibilidad (texto alternativo, contraste, letra grande) y nada de datos personales ni etiquetas a otras personas.\n- Producción por roles (28 min). Los equipos montan las viñetas 2-6 de su guion gráfico. Diseñador/a visual monta fondos y personajes; guionista escribe bocadillos y cartelas; verificador/a de datos prepara las ventanas emergentes con el dato y su fuente y completa la página de créditos; coordinador/a controla los hitos (minuto 15: viñetas 2-4; minuto 28: viñetas 5-6, dos interacciones y créditos). Rotación de teclado a mitad de la actividad para que todo el equipo edite. El docente atiende primero a los equipos que lo pidieron.\n- Versión para redes (12 min). Cada equipo elige 4 viñetas clave, las coloca en la plantilla de carrusel de Canva para Educación ya dimensionada (1080 × 1350 px) a partir de capturas del Genially, añade una portada con gancho y escribe el texto de la publicación y el texto alternativo de cada imagen.\n- Comprobación y entrega (5 min). Con la lista de comprobación (historia completa, dato con fuente, interacciones que funcionan, carrusel accesible, créditos) el coordinador/a revisa y entrega en la Tarea 3.2 el enlace del Genially, las imágenes del carrusel y el texto de la publicación.\n- Moodle Centros: Tarea «3.2 · Cómic digital interactivo y versión para redes» (evaluada con rúbrica 1-3-5-7-10). Tarea final evaluable del bloque 1: cómic interactivo en Genially sobre una enfermedad física o mental del uso de internet, carrusel para redes y créditos (66 %), y presentación oral del cómic ante la clase en la sesión 6 (33 %). Se entrega en la sesión 5 y la calificación se completa tras la presentación.\n- Evidencia: Tarea 3.2 · Cómic interactivo y versión para redes\n\nSesión 6 (50 min): Estreno: galería y presentación de los cómics\nReto: Presentar el cómic a la clase, explicar su mensaje de salud, dar y recibir retroalimentación y cerrar el bloque 1 con un compromiso personal.\n- Montaje de la galería (4 min). Cada equipo abre su cómic en pantalla completa en dos ordenadores contiguos (estación) y coloca una tarjeta con el nombre del equipo y el tema de salud.\n- Paseo de galería (18 min). Rotación por estaciones con cronómetro proyectado (unos 2 minutos y medio por estación). En cada cómic, cada estudiante prueba las interacciones y deja en un Google Forms «dos estrellas y un deseo»: dos cosas que funcionan y una mejora. Un miembro de cada equipo se queda en su estación respondiendo dudas y se turnan.\n- Presentación del cómic (20 min). Cada equipo presenta su cómic en dos minutos con tres preguntas guía: ¿qué problema de salud contamos y qué lo causa?, ¿cuál es el dato clave y de dónde sale?, ¿qué hábito proponemos? Puede hablar el portavoz o repartirse las preguntas, y quien prefiera no hablar maneja el cómic proyectado. El docente califica las dos líneas de presentación oral de la rúbrica de la Tarea 3.2 (contenido; comunicación y equipo) y observa a cada estudiante con la lista de cotejo de DIG.4.3.3.\n- Cierre del bloque 1 (8 min). Se vuelve a la pizarra de la sesión 1 (Cuerpo y Mente) y se completa con lo aprendido. Cada estudiante escribe en el formulario un compromiso de hábito saludable para las próximas semanas. La clase elige los cómics que propondrá al equipo directivo para su posible difusión en los canales oficiales del centro.\n- Evidencia: Formulario «dos estrellas y un deseo»\n- Evidencia: Presentación oral (líneas 4 y 5 de la rúbrica de la Tarea 3.2)\n- Evidencia: Compromiso personal de hábito", "temporalizacion": "6 sesiónes", "recursos": "Proyector, Google Forms, Plantilla de contrato de equipo, Lista de auditoría ergonómica, Plantilla Mi radiografía digital, Ficha FlashTok, Plantilla de guion gráfico, Openverse, Genially para Educación, Canva para Educación, Hoja de créditos, Aula de informática, Cronómetro proyectado", "descriptores": "CD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nDIG.4.2.3.Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.", "ejercicios": "Observa la pantalla de Alex y escribe una consecuencia para su cuerpo y otra para su mente.\nResponde a la encuesta anónima sobre tus hábitos digitales.\nFirma con tu equipo el contrato de equipo y elige un rol.\nRevisa tu puesto del aula con la lista de auditoría ergonómica, ajústalo y vuelve a puntuarlo.\nDibuja la postura con el móvil en el sofá y corrígela.\nCompleta la parte «Cuerpo» de Mi radiografía digital.\nEncuentra en la app FlashTok cinco trucos de diseño que enganchan y propón un contra-truco para cada uno.\nCompleta la parte «Mente» de Mi radiografía digital con tu plan de tres hábitos y una vía de ayuda.\nEntrega Mi radiografía digital en la Tarea 3.1.\nIdentifica en un cómic de ejemplo una viñeta, un bocadillo, una cartela, una onomatopeya y un primer plano.\nPlanifica en el guion gráfico la historia de tu cómic con un dato real y dos elementos interactivos.\nBusca una imagen en Openverse y cítala con la fórmula TAFL.\nTermina las viñetas 2-6 del cómic con al menos dos interacciones y la página de créditos.\nPrepara un carrusel para redes de 4 imágenes verticales con portada y texto alternativo.\nEntrega el cómic, el carrusel y el texto de la publicación en la Tarea 3.2.\nPrueba los cómics de la galería y deja en cada uno dos estrellas y un deseo.\nPresenta vuestro cómic en dos minutos: problema de salud, dato clave con su fuente y hábito que proponéis.\nEscribe un compromiso de hábito digital saludable.", "metodologias": "Rutina de pensamiento, ABP, Aprendizaje cooperativo, Aprendizaje experiencial, Metacognición, Narrativa visual, Paseo de galería, Coevaluación, Exposición oral", "sesiones": [1, 2, 3, 4, 5, 6]}, {"titulo": "Guía del debate: IA generativa y menores", "tipo": "Conclusión", "abreviatura": "CON2", "orden": "2", "tarea": "3.4 · Guía del debate: IA generativa y menores", "descripcion": "Sesión 7 (50 min): El dilema: ¿IA generativa para menores?\nReto: Entender qué es la IA generativa, conocer las normas sobre su uso por menores y mapear sus beneficios y riesgos desde varios puntos de vista.\n- Tres escenas (8 min). El docente proyecta tres escenas ficticias: Lucía (15 años) pide a un chatbot que le explique ecuaciones paso a paso y por fin las entiende; Marcos (14) pide a la IA la redacción de Lengua y la entrega tal cual; Sara (16) habla cada noche con un chatbot «amigo» que siempre le da la razón. Para cada escena la clase vota: ¿uso bueno, malo o depende? Se compara con la votación de la sesión 1.\n- Qué es y qué dicen las normas (10 min). Explicación breve: la IA generativa crea textos, imágenes, voces y vídeos a partir de enormes cantidades de datos; predice lo más probable, no «sabe», y puede inventar datos (alucinaciones). Normas y hechos recientes: ChatGPT no está destinado a menores de 13 años y entre 13 y 17 pide consentimiento de madre, padre o tutor; en España está en tramitación una ley orgánica de protección de menores en entornos digitales que eleva a 16 años la edad para consentir el uso de datos personales y tipifica como delito los deepfakes sexuales; en 2025 una plataforma de chatbots de compañía cerró las conversaciones abiertas a menores de 18 años tras varias demandas por la seguridad de adolescentes.\n- Equipos del debate (7 min). Nuevos equipos para el bloque 2, formados por el docente: cuatro equipos de debate de 4 personas y dos equipos de mesa de 3 (moderación, cronometraje y jurado). El docente tiene en cuenta a quien le cuesta hablar en público para los equipos de mesa. Los roles concretos se reparten en la sesión 10.\n- Mapa del dilema (18 min). Cada equipo completa en Google Docs la plantilla «Mapa del dilema» con seis dimensiones: aprender, accesibilidad e inclusión (por ejemplo, alumnado con dificultades de lectura), creatividad y autoría, privacidad y datos, salud emocional y relaciones, y planeta (energía y agua). En cada una escriben un beneficio, un riesgo y quién gana o quién pierde. El docente observa con la lista de cotejo de DIG.4.4.4.\n- La moción (7 min). Puesta en común rápida de dos dimensiones y presentación de la moción del debate de la sesión 12: «El uso de la IA generativa debería prohibirse a menores de 16 años». Se explica que, como en las ligas de debate, se preparan las dos posturas y la que defiende cada equipo se sortea el día del debate.\n- Evidencia: Mapa del dilema\n- Evidencia: Votación comparada con la sesión 1\n\nSesión 8 (50 min): ¿Real o generado? Cazabulos y deepfakes\nReto: Detectar bulos e imágenes generadas con IA, saber cómo actuar ante un deepfake y compartir lo verificado con respeto y citando fuentes.\n- ¿Real o IA? (8 min). Se proyectan seis casos y la clase vota (real / generado con IA / bulo): la foto viral del Papa con un abrigo de plumas blanco (imagen generada con IA en 2023); un audio de un famoso pidiendo dinero por una inversión (estafa con voz clonada); el titular «La IA ya piensa y siente como una persona»; una cita inventada por un chatbot atribuida a un científico; «Una consulta a una IA gasta lo mismo que una búsqueda en Google»; y una foto real de un centro de datos. El docente no da la solución todavía.\n- Kit del verificador/a ante la IA (10 min). Cinco pasos: 1) Para y no lo compartas todavía; 2) Busca señales (manos y dedos raros, textos deformados, sombras imposibles, voz plana, falta de fuente); 3) Búsqueda inversa con Google Lens; 4) Consulta verificadores (Maldita.es, Newtral, EFE Verifica); 5) Comprueba en otra fuente lo que dice un chatbot. Etiqueta digital: no reenviar sin comprobar, citar la fuente y corregir sin humillar. Deepfakes de personas reales: crearlos o difundirlos daña a la víctima y, si son sexuales, es delito (caso de Almendralejo, 2023: 15 menores condenados a un año de libertad vigilada). Si te pasa: no lo compartas, guarda pruebas, cuéntalo a un adulto de confianza, pide la retirada en el Canal prioritario de la AEPD y llama al 017 o a la Fundación ANAR.\n- Investigación por parejas (20 min). Cada pareja recibe una tarjeta con un bulo, imagen dudosa o caso relacionado con la IA (los seis del gancho y otros, como «Borrar correos antiguos salva el planeta» o un supuesto vídeo de un político). Lo investigan con el kit y rellenan una ficha: afirmación, veredicto (verdad / bulo / generado con IA / con matices), dos fuentes fiables y cómo lo han comprobado.\n- Foro Cazabulos (12 min). Cada pareja publica su ficha en el foro de Moodle con un titular corto y las dos fuentes enlazadas, sin reproducir imágenes de personas reales, y responde a la publicación de otra pareja aportando algo nuevo o una pregunta, con respeto. El docente resuelve en voz alta los seis casos del gancho. Lo verificado servirá como evidencia en la guía del debate.\n- Moodle Centros: Foro «S8 · Cazabulos: bulos y deepfakes de la IA». Banco colectivo de bulos e imágenes generadas con IA verificados por la clase, que se reutiliza como evidencia en la guía del debate. Sirve de evidencia observable de etiqueta digital y uso ético de la información.\n- Evidencia: Ficha de verificación\n- Evidencia: Publicación y respuesta en el foro Cazabulos\n\nSesión 9 (50 min): ¿Quién paga la IA? Sesgos, autoría, privacidad y huella\nReto: Analizar casos reales de impacto ético y ecosocial de la IA generativa y redactar un código personal para usarla de forma ética.\n- Dato sorpresa (7 min). Se proyectan dos datos: en 2024 los centros de datos consumieron unos 415 TWh, alrededor del 1,5 % de la electricidad mundial, y en 2030 podrían llegar a unos 945 TWh, sobre todo por la IA (AIE, 2025); según Google, una consulta de texto mediana a Gemini gasta 0,24 Wh y 0,26 ml de agua, pero generar imágenes o vídeo gasta mucho más y hay miles de millones de consultas al día. Pregunta: ¿es un argumento a favor o en contra de la moción?\n- Tribunal de casos (20 min). Cada equipo recibe un caso: un filtro de belleza que aclara la piel (sesgo), imágenes generadas con el estilo de una ilustradora sin su permiso (autoría), una app que guarda tus conversaciones para entrenar su IA (privacidad), un gran centro de datos proyectado en una zona con poca agua (huella), un chatbot «amigo» que nunca lleva la contraria (salud emocional) o una herramienta de selección de personal que penalizaba currículos de mujeres (sesgo). Con la plantilla «¿Quién gana? ¿Quién pierde? ¿Qué derecho está en juego? ¿Qué proponemos?» lo analizan y el portavoz lo expone en un minuto. El docente observa con la lista de cotejo de DIG.4.4.4.\n- Mi código ético de la IA (18 min). Cada estudiante completa la plantilla «Mi código ético para usar la IA generativa»: cinco normas personales (para qué sí la usaré y para qué no; indicar cuándo un trabajo lleva ayuda de IA; no introducir datos personales ni fotos de otras personas; no crear nunca imágenes o audios de personas reales; comprobar lo que dice; evitar generar imágenes o vídeos sin necesidad por su consumo), y su respuesta a un dilema breve («Tu grupo quiere hacer un meme con la cara de un profesor generada con IA. ¿Qué haces?»). La entrega en la Tarea 3.3.\n- Cierre (5 min). Dos o tres estudiantes leen voluntariamente una norma de su código. Se recuerda que los casos de hoy y el foro Cazabulos son la materia prima de la guía del debate.\n- Moodle Centros: Tarea «3.3 · Mi código ético de la IA» (corrección Apto / No apto). Comprobar que cada estudiante concreta normas de uso ético de la IA generativa (privacidad, autoría, respeto a otras personas, comprobación de la información) y las aplica a un dilema.\n- Evidencia: Plantilla del tribunal de casos\n- Evidencia: Exposición del caso (observación)\n- Evidencia: Tarea 3.3 · Mi código ético de la IA\n\nSesión 10 (50 min): Los roles del debate y cómo se construye un argumento\nReto: Conocer el formato y los roles del debate, asumir un rol y empezar la guía del debate con argumentos sólidos para las dos posturas.\n- Debate malo, debate bueno (6 min). Se proyectan dos fragmentos escritos de un debate ficticio sobre los deberes: en el primero hay gritos, interrupciones y frases sin datos («eso es una tontería»); en el segundo cada turno tiene una idea, un porqué y una prueba, y se rebate la idea, no a la persona. La clase dice qué diferencias ve.\n- Formato y roles del debate (10 min). El docente explica el formato de la sesión 12, inspirado en las ligas de debate escolar: dos rondas (equipo A contra B y equipo C contra D) con introducción (2 min por equipo), refutación (dos turnos de 1,5 min por equipo) y conclusión (1,5 min por equipo). Roles de los equipos de debate: introductor/a (presenta la postura y los argumentos), refutador/a 1 y refutador/a 2 (rebaten los argumentos del otro equipo y responden a sus ataques) y conclusor/a (resume, recoge lo mejor y cierra sin datos nuevos). Roles de los equipos de mesa: moderador/a (presenta, da los turnos y vela por el respeto), cronometrador/a (muestra las tarjetas de 30 segundos y de tiempo) y relator/a-jurado (anota los mejores argumentos y valora con la ficha). Una mesa dirige una ronda y es jurado en la otra; los equipos de debate que no debaten en una ronda son público-jurado.\n- Reparto de roles (4 min). Cada equipo reparte sus roles en una ficha. En los equipos de debate, cada estudiante prepara su rol para las dos posturas. El docente revisa que el reparto tenga en cuenta las preferencias y necesidades de cada estudiante.\n- El argumento ARE (10 min). Estructura de un argumento: Afirmación (qué defiendo), Razonamiento (por qué) y Evidencia (dato o caso con su fuente). Ejemplo a favor de la moción: «Los menores necesitan protección (A) porque la IA puede crear deepfakes que causan un daño enorme (R); en Almendralejo, 2023, se condenó a 15 menores por crear imágenes falsas de compañeras (E)». Ejemplo en contra: «Prohibir no enseña a usarla (A), porque la usarán igualmente fuera del instituto sin ninguna guía (R); la propia OpenAI ya permite su uso desde los 13 años con consentimiento familiar (E)». Por parejas transforman dos opiniones sueltas en argumentos ARE.\n- Guía del debate (I) (20 min). Cada equipo abre la plantilla «Guía del debate» en Google Docs y completa las partes 1 y 2: tres argumentos ARE a favor de la moción y tres en contra, usando el mapa del dilema, el foro Cazabulos y el tribunal de casos. Los equipos de mesa preparan además las normas que leerá el moderador/a y tres preguntas para el público-jurado.\n- Evidencia: Ficha de reparto de roles\n- Evidencia: Argumentos ARE por parejas\n- Evidencia: Guía del debate (partes 1 y 2)\n\nSesión 11 (50 min): Guía del debate y ensayo por roles\nReto: Completar y entregar la guía del debate con refutaciones previstas y el guion de cada rol, y ensayar los turnos con el cronómetro.\n- Control de evidencias (5 min). Cada equipo revisa en dos minutos que sus seis argumentos tienen fuente enlazada. El docente proyecta dos errores frecuentes: dato sin fuente y dato de una fuente poco fiable (un vídeo viral sin autor).\n- Guía del debate (II) (22 min). Los equipos completan las partes 3, 4 y 5 de la guía: parte 3, refutaciones previstas (los dos argumentos más fuertes del otro bando y cómo responderlos); parte 4, guion de cada rol (introducción escrita para las dos posturas, frases de arranque para refutar y conclusión; en los equipos de mesa, guion de moderación con normas, presentación y turnos); parte 5, propuesta de uso responsable de la IA generativa por menores que el equipo defendería en cualquier caso (por ejemplo, uso con supervisión, alfabetización en IA o etiquetado de contenidos generados).\n- Ensayo por roles (15 min). Parejas de equipos ensayan con cronómetro: el introductor/a de un equipo hace su turno de 2 minutos y el refutador/a 1 del otro responde en 1,5 minutos; después cambian. Los equipos de mesa ensayan la presentación del debate, el cronometraje con tarjetas y la ficha del jurado con estos ensayos. const S = DATA.sa, CUR = DATA.cur, IDX = DATA.idx;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':''); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
