<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 3: Ética, Salud Digital y Sostenibilidad Ecosocial", "numero": 3, "subtitulo": "«Lo que tu pantalla no te cuenta»: un cómic interactivo sobre salud digital y un debate sobre la IA generativa en menores", "curso_texto": "4.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Bloque 1: siete equipos de cómic (seis de 3 y uno de 4) con roles. Bloque 2: cuatro equipos de debate de 4 y dos equipos de mesa de 3, con roles de debate. Tareas 3.1 y 3.3 individuales", "temporalizacion": "Primer trimestre (orientativo: 6 semanas a 2 sesiones semanales; bloque 1 en las sesiones 1-6 y bloque 2 en las sesiones 7-12)"}, "materias": [{"codigo": "DIG", "criterios": ["DIG.4.2.3", "DIG.4.3.3", "DIG.4.4.1", "DIG.4.4.4"], "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.C.3", "DIG.4.D.1", "DIG.4.D.5"]}], "vision": {"descripcion": "Usamos pantallas más horas de las que dormimos, pero casi nunca pensamos en lo que ese uso le hace al cuerpo y a la mente, ni en las preguntas éticas que abre la inteligencia artificial. La SdA se organiza en dos bloques con un producto cada uno. En el bloque 1 el alumnado investiga las enfermedades físicas y mentales asociadas al uso masivo de internet (posturas, vista cansada, sueño, tecnoestrés, nomofobia, diseño que engancha), las cuenta en un cómic digital interactivo con versión para redes y lo presenta a la clase. En el bloque 2 se enfrenta a un dilema real, el uso de la IA generativa por menores, analizando sus beneficios y riesgos (aprendizaje, accesibilidad, privacidad, deepfakes, salud emocional, sesgos, autoría y huella ambiental), prepara una guía del debate y lo defiende en un debate con roles.", "contexto": "Grupo de 4.º ESO de 22 estudiantes, con mayoría de alumnado repetidor o con dificultades de aprendizaje, muy activo en TikTok e Instagram y que ya usa herramientas de IA generativa. Se trabaja en el aula de informática con un ordenador por estudiante, cuentas de Google Workspace del centro (@g.educaand.es), Genially para Educación y Moodle Centros. Como el uso del móvil está restringido en el centro, los datos de uso personal se estiman o se consultan en casa, y en clase se trabaja con pantallas y casos simulados. Las entregas se reparten a lo largo de las doce sesiones para que el alumnado reciba retroalimentación pronto y no se acumule el trabajo al final.", "justificacion": "El uso masivo de la tecnología tiene consecuencias físicas (ergonomía, vista, sueño), psicológicas (tecnoestrés, nomofobia, diseño adictivo) y éticas y ecosociales, que hoy se concentran en la IA generativa: privacidad, deepfakes, sesgos, autoría, dependencia emocional y consumo de energía y agua de los centros de datos. La SdA moviliza los bloques de Seguridad y bienestar digital y Ciudadanía digital crítica de Digitalización de 4.º ESO, junto con la creación y la publicación responsable de contenidos. La narrativa visual convierte los datos de salud en mensajes cercanos a su generación, y el debate con roles entrena la argumentación con datos y fuentes y el respeto a otras posturas. Conecta con los ODS 3 (salud y bienestar), 12 (producción y consumo responsables) y 16 (paz, justicia e instituciones sólidas).", "reto": "«Somos creadoras y creadores de contenido responsable. En el bloque 1 contaremos en un cómic interactivo, pensado para redes, lo que la pantalla no dice sobre nuestra salud física y mental, y lo presentaremos a la clase. En el bloque 2 nos enfrentaremos a un dilema real: ¿deberían los menores usar la IA generativa? Investigaremos, prepararemos nuestra guía del debate y lo defenderemos en un debate con roles, como en una liga de debate.»", "pregunta_guia": "¿Qué precio pagan nuestro cuerpo y nuestra mente por cada hora de pantalla, y cómo podemos usar la tecnología, incluida la IA generativa, de forma sana, ética y sostenible?", "producto_final": "Dos productos, uno por bloque. Bloque 1: cómic digital interactivo creado en Genially (6 viñetas con ventanas emergentes de datos y fuentes, al menos dos interacciones y página de créditos) sobre una enfermedad física o mental del uso masivo de internet, con una versión en carrusel para redes sociales, presentado ante la clase. Bloque 2: guía del debate (argumentos a favor y en contra con datos y fuentes, refutaciones previstas y guion de cada rol) y debate estructurado con roles sobre la moción «El uso de la IA generativa debería prohibirse a menores de 16 años»."}, "metodologias": [{"nombre": "Aprendizaje Basado en Proyectos (ABP)", "descripcion": "Dos retos encadenados, cada uno con su producto final: el cómic interactivo (bloque 1) y la guía y el debate (bloque 2)."}, {"nombre": "Aprendizaje cooperativo", "descripcion": "Equipos de 3-4 con roles: de producción en el bloque 1 (coordinación, guion, diseño y verificación) y de debate en el bloque 2 (introducción, refutación, conclusión, moderación, cronometraje y jurado)."}, {"nombre": "Narrativa visual (visual thinking)", "descripcion": "El alumnado traduce datos de salud a viñetas, personajes y bocadillos, partiendo de un guion gráfico."}, {"nombre": "Debate estructurado con roles", "descripcion": "Formato inspirado en las ligas de debate escolar: se preparan las dos posturas y se sortea cuál defiende cada equipo; turnos tasados, mesa de moderación y jurado de alumnado."}, {"nombre": "Estudio de casos y rutinas de pensamiento", "descripcion": "«Veo, pienso, me pregunto», línea de valores, mapa del dilema y tribunal de casos reales para analizar dilemas éticos."}, {"nombre": "Gamificación ligera", "descripcion": "Votaciones de verdad o bulo, retos cronometrados y galería con «dos estrellas y un deseo»."}], "recursos": ["Aula de informática (un ordenador por estudiante)", "Proyector", "Moodle Centros", "Google Workspace del centro", "Genially para Educación", "Canva para Educación", "Openverse y bancos de imágenes con licencia CC", "Plantillas y fichas del docente"], "fases": [{"nombre": "Bloque 1 · Inicio", "sesiones": "1-3", "finalidad": "Motivación, diagnóstico y salud digital del cuerpo y la mente"}, {"nombre": "Bloque 1 · Desarrollo", "sesiones": "4-5", "finalidad": "Guion, producción y entrega del cómic interactivo"}, {"nombre": "Bloque 1 · Cierre", "sesiones": "6", "finalidad": "Galería y presentación de los cómics"}, {"nombre": "Bloque 2 · Inicio", "sesiones": "7", "finalidad": "El dilema de la IA generativa en menores"}, {"nombre": "Bloque 2 · Desarrollo", "sesiones": "8-11", "finalidad": "Bulos y deepfakes, ética y huella de la IA, roles del debate y guía del debate"}, {"nombre": "Bloque 2 · Cierre", "sesiones": "12", "finalidad": "Debate estructurado y reflexión final"}], "sesiones": [{"n": 1, "fase": "Bloque 1 · Inicio", "titulo": "Gancho: ¿cuánto te cuesta tu scroll?", "reto": "Descubrir que el uso de pantallas tiene efectos en el cuerpo y en la mente, conocer los dos bloques de la SdA y formar los equipos del cómic.", "actividades": [{"nombre": "La pantalla de Alex", "min": 10, "desc": "El docente proyecta la pantalla «Tiempo de uso» de un adolescente ficticio, Alex: 6 h 42 min de pantalla, 147 desbloqueos, TikTok 3 h 10 min, Instagram 1 h 25 min, última notificación a las 2:13. Rutina «Veo, pienso, me pregunto» en voz alta. La clase rellena en la pizarra dos columnas: ¿qué le pasa a su cuerpo?, ¿y a su mente? Se dejan en la pizarra (o en una foto del docente) para volver a ellas en la sesión 6."}, {"nombre": "Encuesta anónima", "min": 8, "desc": "Cada estudiante responde en el ordenador un Google Forms anónimo del centro (8 preguntas de opción): horas de pantalla al día (estimadas), si duerme con el móvil en la habitación, si le duelen cuello u ojos, si ha sentido ansiedad sin móvil, si usa IA generativa y para qué. Enlace: https://forms.gle/VdcEyGex3hpTHNjEA. El docente proyecta los gráficos de respuestas en directo."}, {"nombre": "Votación relámpago del bloque 2", "min": 5, "desc": "Avance del segundo bloque: «¿Debería poder usar la IA generativa sin límites un/a menor de 16 años?». Votación a mano alzada (sí / no / depende). El docente apunta el resultado para compararlo en las sesiones 7 y 12."}, {"nombre": "Presentación de la SdA", "min": 12, "desc": "El docente presenta el reto, la pregunta guía y los dos bloques: bloque 1 (sesiones 1-6) con el cómic interactivo y su presentación, y bloque 2 (sesiones 7-12) con la guía del debate y el debate. Se proyecta el calendario de entregas para que se vea que están repartidas: Tarea 3.1 (sesión 3), Tarea 3.2 (sesión 5), presentación (sesión 6), foro Cazabulos (sesión 8), Tarea 3.3 (sesión 9), Tarea 3.4 (sesión 11) y debate (sesión 12). Se enseña un cómic de ejemplo en Genially hecho por el docente y cómo se evalúa."}, {"nombre": "Equipos del cómic y roles", "min": 15, "desc": "Formación de siete equipos heterogéneos (seis de 3 y uno de 4) hecha por el docente. Reparto de roles: coordinador/a-portavoz, guionista, diseñador/a visual y verificador/a de datos (en los equipos de 3, coordinación y verificación van juntas). Cada equipo elige nombre y firma el contrato de equipo en una plantilla de Google Docs compartida."}], "criterios": [], "saberes": ["DIG.4.C.3"], "metodologia": ["Rutina de pensamiento", "ABP", "Aprendizaje cooperativo"], "evidencias": ["Respuestas de la encuesta anónima (diagnóstica, no calificable)", "Resultado de la votación inicial", "Contrato de equipo"], "recursos": ["Proyector", "Google Forms", "Plantilla de contrato de equipo"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Caso ficticio cercano (sin datos reales del alumnado); calendario de entregas visual; roles elegidos según intereses; encuesta con opciones cerradas y lectura en voz alta."}, "moodle": [], "ejercicios": ["Observa la pantalla de Alex y escribe una consecuencia para su cuerpo y otra para su mente.", "Responde a la encuesta anónima sobre tus hábitos digitales.", "Firma con tu equipo el contrato de equipo y elige un rol."], "clase": {"pregunta": "¿Qué pagas, sin saberlo, por cada hora de pantalla?", "diapositivas": [{"tipo": "ejemplo", "icono": "📱", "titulo": "La pantalla de Alex", "situacion": "Alex, 16 años: **6 h 42 min** de pantalla, **147 desbloqueos**, TikTok 3 h 10 min. Última notificación: **2:13 de la madrugada**.", "explicacion": "Detrás de esos números hay un **cuello** que se inclina, unos **ojos** que no descansan, un **sueño** que se acorta y una **mente** que no desconecta.", "pregunta": "¿Qué le pasa al cuerpo y a la mente de Alex?", "nota": "Rutina «Veo, pienso, me pregunto». Apunta en la pizarra dos columnas: Cuerpo y Mente, y guarda una foto para la sesión 6. Alex es ficticio: no pidas a nadie que enseñe su móvil."}, {"tipo": "comparar", "titulo": "Dos facturas que no llegan al buzón", "columnas": [{"titulo": "Cuerpo", "icono": "🦴", "puntos": ["Cuello y espalda", "Vista cansada", "Sueño", "Sedentarismo"]}, {"titulo": "Mente", "icono": "🧠", "puntos": ["Tecnoestrés", "Miedo a estar sin móvil", "Comparación constante", "Apps que enganchan"]}], "pregunta": "¿Cuál de estas cosas te ha pasado alguna vez?"}, {"tipo": "practica", "titulo": "Encuesta anónima", "enlace": "https://forms.gle/VdcEyGex3hpTHNjEA", "tiempo": 8, "agrupamiento": "Individual", "enunciado": "Responde con sinceridad a la encuesta del enlace. **Es anónima**: nadie sabrá qué has contestado.", "pasos": ["Abre el enlace de la encuesta.", "Responde las 8 preguntas.", "Mira los resultados de la clase en la pantalla."], "nota": "Proyecta el resumen de respuestas de Google Forms en directo."}, {"tipo": "quiz", "pregunta": "Avance del bloque 2: ¿debería poder usar la IA generativa sin límites un/a menor de 16 años?", "opciones": ["Sí, sin límites", "No, nunca", "Depende de para qué y cómo"], "correcta": 2, "explicacion": "No hay una respuesta cerrada: es un **dilema**. Guardamos el resultado de la votación y lo **compararemos en las sesiones 7 y 12**.", "nota": "Votación a mano alzada antes de pulsar. Apunta los votos de cada opción."}, {"tipo": "flujo", "titulo": "Nuestra SdA: dos bloques, entregas repartidas", "nodos": [{"texto": "S3 · Tarea 3.1 Mi radiografía digital", "tipo": "inicio"}, {"texto": "S5 · Tarea 3.2 Cómic + versión para redes", "tipo": "proceso"}, {"texto": "S6 · Presentación del cómic", "tipo": "proceso"}, {"texto": "S8 · Foro Cazabulos · S9 · Tarea 3.3", "tipo": "proceso"}, {"texto": "S11 · Tarea 3.4 Guía del debate", "tipo": "proceso"}, {"texto": "S12 · El gran debate", "tipo": "fin"}], "nota": "Insiste en que nada se acumula al final: cada bloque cierra con su producto."}, {"tipo": "practica", "titulo": "El reto", "tiempo": 12, "enunciado": "Somos **creadoras y creadores de contenido responsable**. Bloque 1: un **cómic interactivo** sobre salud digital. Bloque 2: una **guía del debate** y un **debate** sobre la IA generativa en menores.", "pasos": ["Leemos el reto y la pregunta guía.", "Vemos un cómic de ejemplo en Genially.", "Revisamos el calendario de entregas y cómo se evalúa."]}, {"tipo": "pasos", "titulo": "Formamos el equipo del cómic", "progresivo": true, "pasos": ["**Coordinador/a-portavoz**: organiza el tiempo y habla por el equipo.", "**Guionista**: escribe la historia y los textos.", "**Diseñador/a visual**: monta viñetas y personajes.", "**Verificador/a de datos**: comprueba cada dato y su fuente.", "Elegid nombre y firmad el contrato de equipo."]}, {"tipo": "cierre", "puntos": ["Las pantallas tienen efectos en el cuerpo y en la mente.", "Dos bloques: el cómic de salud digital y el debate sobre la IA.", "Las entregas están repartidas: la primera, en la sesión 3."], "siguiente": "Analizamos nuestro cuerpo digital: posturas, ojos y sueño.", "pregunta": "¿Qué parte te interesa más: el cuerpo o la mente?"}]}}, {"n": 2, "fase": "Bloque 1 · Inicio", "titulo": "Cuerpo digital: ergonomía y enfermedades digitales", "reto": "Reconocer los riesgos físicos del uso de pantallas y corregir la postura en el propio puesto de trabajo.", "actividades": [{"nombre": "¡Congelados!", "min": 5, "desc": "Mientras el alumnado empieza a trabajar en el ordenador, el docente dice «¡congelados!». Sin moverse, cada estudiante observa la postura de su compañero/a: espalda, cuello, muñecas, distancia a la pantalla. Se comentan en voz alta tres posturas típicas (sin señalar a nadie ni hacer fotos)."}, {"nombre": "Enfermedades digitales", "min": 12, "desc": "Mini-explicación con infografía: cuello de texto (al inclinar la cabeza 60° el cuello soporta unos 27 kg), síndrome visual informático y regla 20-20-20 (cada 20 minutos, mirar 20 segundos algo a unos 6 metros), molestias en pulgar y muñeca (tendinitis, túnel carpiano), sedentarismo y efecto de las pantallas antes de dormir. Para cada una: síntoma, causa y prevención."}, {"nombre": "Auditoría ergonómica", "min": 18, "desc": "Por parejas, con una lista de 8 puntos en papel o Google Docs, revisan el puesto del aula de cada uno: pantalla a la altura de los ojos, distancia de 50-70 cm, espalda apoyada, pies en el suelo, codos a 90°, muñecas rectas, luz sin reflejos y pausas. Puntúan de 0 a 8, ajustan silla y pantalla y vuelven a puntuar. Después dibujan en un monigote la postura típica con el móvil en el sofá y la corrigen."}, {"nombre": "Pausa activa", "min": 5, "desc": "El docente guía dos minutos de estiramientos de cuello, hombros y muñecas y practica la regla 20-20-20 mirando por la ventana. Se propone repetirla en cada sesión."}, {"nombre": "Mi radiografía digital (parte 1)", "min": 10, "desc": "Cada estudiante abre la plantilla «Mi radiografía digital» (Google Docs) y completa la parte «Cuerpo»: dos riesgos físicos que reconoce en sí mismo/a con su causa y tres cambios concretos que puede hacer. La terminará la próxima sesión y la entregará en la Tarea 3.1."}], "criterios": ["DIG.4.3.3"], "saberes": ["DIG.4.C.3"], "metodologia": ["Aprendizaje cooperativo", "Aprendizaje experiencial"], "evidencias": ["Lista de auditoría ergonómica antes y después", "Parte «Cuerpo» de Mi radiografía digital"], "recursos": ["Proyector", "Lista de auditoría ergonómica", "Plantilla Mi radiografía digital"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Infografía con iconos y poco texto; auditoría práctica en el propio puesto; respuestas de la plantilla con frases para completar; posibilidad de dibujar en lugar de escribir."}, "moodle": [], "ejercicios": ["Revisa tu puesto del aula con la lista de auditoría ergonómica, ajústalo y vuelve a puntuarlo.", "Dibuja la postura con el móvil en el sofá y corrígela.", "Completa la parte «Cuerpo» de Mi radiografía digital."], "clase": {"pregunta": "¿Cuánto pesa tu cabeza cuando miras el móvil?", "diapositivas": [{"tipo": "ejemplo", "icono": "🛋️", "titulo": "El sofá a las 11 de la noche", "situacion": "Tumbado/a en el sofá, el móvil en el pecho, la cabeza doblada hacia abajo. **Dos horas** sin moverte.", "explicacion": "Al inclinar la cabeza, los músculos del cuello tienen que sujetar **mucho más peso**. Por eso al día siguiente duele el cuello o la espalda.", "pregunta": "¿Os suena esta postura?", "nota": "Haz antes el «¡congelados!»: que observen su propia postura en el aula sin señalar a nadie."}, {"tipo": "infografia", "titulo": "El peso que soporta tu cuello", "svg": "<svg viewBox=\"0 -12 640 252\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Peso que soporta el cuello según la inclinación de la cabeza: 0 grados 5 kg, 15 grados 12 kg, 30 grados 18 kg, 45 grados 22 kg, 60 grados 27 kg\"><line x1=\"40\" y1=\"200\" x2=\"620\" y2=\"200\" style=\"stroke:var(--ink)\" stroke-width=\"2\"/><rect x=\"60\" y=\"163\" width=\"80\" height=\"37\" rx=\"4\" style=\"fill:var(--brand-soft);stroke:var(--brand)\"/><rect x=\"170\" y=\"111\" width=\"80\" height=\"89\" rx=\"4\" style=\"fill:var(--brand-soft);stroke:var(--brand)\"/><rect x=\"280\" y=\"67\" width=\"80\" height=\"133\" rx=\"4\" style=\"fill:var(--accent-soft);stroke:var(--accent)\"/><rect x=\"390\" y=\"37\" width=\"80\" height=\"163\" rx=\"4\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><rect x=\"500\" y=\"0\" width=\"80\" height=\"200\" rx=\"4\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><text x=\"100\" y=\"155\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\" style=\"fill:var(--ink)\">5 kg<\/text><text x=\"210\" y=\"103\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\" style=\"fill:var(--ink)\">12 kg<\/text><text x=\"320\" y=\"59\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\" style=\"fill:var(--ink)\">18 kg<\/text><text x=\"430\" y=\"29\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\" style=\"fill:var(--ink)\">22 kg<\/text><text x=\"540\" y=\"30\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\" style=\"fill:var(--ink)\">27 kg<\/text><text x=\"100\" y=\"225\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">0° recto<\/text><text x=\"210\" y=\"225\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">15°<\/text><text x=\"320\" y=\"225\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">30°<\/text><text x=\"430\" y=\"225\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">45°<\/text><text x=\"540\" y=\"225\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">60° móvil<\/text><\/svg>", "nota": "Datos aproximados del estudio de Hansraj (2014) sobre la carga en la columna cervical. Pregunta: ¿cuántas mochilas del instituto son 27 kg?"}, {"tipo": "infografia", "titulo": "Enfermedades digitales: síntoma y prevención", "elementos": [{"icono": "🦒", "titulo": "Cuello de texto", "texto": "Dolor de cuello y hombros. **Sube el móvil** a la altura de los ojos."}, {"icono": "👀", "titulo": "Vista cansada", "texto": "Ojos secos, picor, visión borrosa. **Regla 20-20-20**."}, {"icono": "👍", "titulo": "Pulgar y muñeca", "texto": "Dolor al escribir. **Muñeca recta** y pausas."}, {"icono": "🪑", "titulo": "Sedentarismo", "texto": "Cansancio, espalda. **Levántate** cada hora."}, {"icono": "🌙", "titulo": "Sueño", "texto": "Te cuesta dormirte. **Pantalla fuera** una hora antes."}]}, {"tipo": "practica", "titulo": "Auditoría ergonómica de tu puesto", "tiempo": 18, "agrupamiento": "Parejas", "enunciado": "Revisad el puesto de cada uno con la **lista de 8 puntos**. Puntuad, ajustad silla y pantalla y **volved a puntuar**.", "pasos": ["Pantalla a la altura de los ojos y a 50-70 cm.", "Espalda apoyada y pies en el suelo.", "Codos a 90° y muñecas rectas.", "Luz sin reflejos en la pantalla.", "Dibujad la postura del sofá y corregidla."], "material": ["Lista de auditoría ergonómica", "Monigote para dibujar"]}, {"tipo": "pasos", "titulo": "Pausa activa (2 minutos)", "progresivo": true, "pasos": ["Cuello: mira a un lado, al otro, arriba y abajo, despacio.", "Hombros: súbelos hacia las orejas y déjalos caer 5 veces.", "Muñecas: estira los dedos hacia atrás con la otra mano 10 segundos.", "**20-20-20**: mira por la ventana algo lejano durante 20 segundos."]}, {"tipo": "quiz", "pregunta": "Llevas 20 minutos mirando la pantalla. ¿Qué dice la regla 20-20-20?", "opciones": ["Apagar la pantalla 20 minutos", "Mirar 20 segundos algo a unos 6 metros", "Bajar el brillo al 20 %"], "correcta": 1, "explicacion": "Cada **20 minutos**, mirar **20 segundos** algo a unos **20 pies** (unos 6 metros). Los ojos relajan el enfoque."}, {"tipo": "practica", "titulo": "Mi radiografía digital · Parte 1: Cuerpo", "tiempo": 10, "agrupamiento": "Individual", "enunciado": "Abre la plantilla y escribe **dos riesgos físicos** que reconoces en ti, con su causa, y **tres cambios** que puedes hacer.", "pasos": ["Riesgo 1 y su causa.", "Riesgo 2 y su causa.", "Tres cambios concretos: qué, cuándo y cómo."], "entrega": "Tarea 3.1 · Mi radiografía digital (se entrega la próxima sesión)"}, {"tipo": "cierre", "puntos": ["Inclinar la cabeza multiplica el peso que soporta el cuello.", "Los ojos necesitan pausas: regla 20-20-20.", "Un buen puesto se ajusta: altura, distancia, muñecas y luz."], "siguiente": "De la espalda a la cabeza: tecnoestrés, nomofobia y apps que enganchan.", "pregunta": "¿Qué cambio de postura vas a probar esta tarde?"}]}}, {"n": 3, "fase": "Bloque 1 · Inicio", "titulo": "Mente digital: tecnoestrés, nomofobia y diseño que engancha", "reto": "Identificar los riesgos para la salud mental del uso de pantallas, reconocer los trucos de diseño persuasivo y elaborar un plan personal de hábitos saludables.", "actividades": [{"nombre": "¿Y si te lo dejas en casa?", "min": 7, "desc": "El docente proyecta una ráfaga de sonidos de notificaciones y pregunta: ¿qué sientes si sales de casa y te das cuenta de que no llevas el móvil? Cada estudiante elige un emoji en una votación rápida a mano alzada (😌 tranquilidad, 😬 nervios, 😱 pánico). Se introduce la palabra nomofobia."}, {"nombre": "Conceptos clave", "min": 10, "desc": "Explicación breve con ejemplos cotidianos: tecnoestrés (sobrecarga de notificaciones y tareas digitales), nomofobia (miedo a estar sin móvil), FOMO (miedo a perderse algo), phubbing (ignorar a quien está contigo por mirar el móvil) y dependencia tecnológica. Diseño persuasivo: scroll infinito, reproducción automática, notificaciones, rachas y recompensa variable (como una tragaperras)."}, {"nombre": "Test de nomofobia", "min": 8, "desc": "Cada estudiante responde un test anónimo de 10 afirmaciones adaptado de la escala NMP-Q (Yildirim y Correia, 2015) en Google Forms, con una puntuación orientativa al final. Enlace: https://forms.gle/QJ8EuqAkaqKT1HtCA. No es un diagnóstico y nadie comparte su resultado; sirve para reflexionar."}, {"nombre": "Caza de trucos", "min": 10, "desc": "Por parejas, analizan las capturas de una app ficticia, «FlashTok», en una ficha: identifican cinco trucos de diseño persuasivo (scroll infinito, punto rojo de notificación, racha de días, vídeo que empieza solo, «a 3 amigos les gusta esto») y proponen un contra-truco para cada uno (desactivar notificaciones, límites de uso en Bienestar digital o Tiempo de uso, modo escala de grises, móvil fuera del dormitorio)."}, {"nombre": "Mi radiografía digital (parte 2) y entrega", "min": 15, "desc": "Cada estudiante completa la parte «Mente» de la plantilla: dos riesgos psicológicos que reconoce, su plan de tres hábitos con cuándo y cómo, y a quién pedir ayuda si el uso se vuelve un problema o vive una situación de riesgo en la red (familia, tutoría, Departamento de Orientación, línea 017 de INCIBE, Fundación ANAR 900 20 20 10). Descarga el documento en PDF y lo entrega en la Tarea 3.1."}], "criterios": ["DIG.4.3.3"], "saberes": ["DIG.4.C.3"], "metodologia": ["Rutina de pensamiento", "Aprendizaje cooperativo", "Metacognición"], "evidencias": ["Ficha «Caza de trucos»", "Tarea 3.1 · Mi radiografía digital"], "recursos": ["Proyector", "Ficha FlashTok", "Google Forms"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Test anónimo y no compartido; app ficticia para no exponer cuentas reales; plantilla con frases para completar y ejemplos de hábitos; opción de responder por audio en la Tarea."}, "moodle": [{"recurso": "Tarea", "nombre": "3.1 · Mi radiografía digital", "uso": "Comprobar que cada estudiante identifica riesgos físicos y psicológicos del uso de pantallas y concreta un plan de hábitos saludables y vías de ayuda.", "correccion": "apto", "criterio": "DIG.4.3.3", "cotejo": ["Nombra al menos dos riesgos físicos con su causa", "Nombra al menos dos riesgos psicológicos (tecnoestrés, nomofobia, FOMO, dependencia…)", "Propone tres hábitos concretos indicando cuándo y cómo los aplicará", "Indica al menos una vía de ayuda (familia, tutoría, Orientación, 017, ANAR)", "No incluye datos personales ni capturas con nombres de usuario"], "config": ["Entrega individual: PDF o texto en línea (también audio)", "Calificación: escala Apto / No apto", "Visible solo para el docente"], "calificable": true, "codigo": "3.1"}], "ejercicios": ["Encuentra en la app FlashTok cinco trucos de diseño que enganchan y propón un contra-truco para cada uno.", "Completa la parte «Mente» de Mi radiografía digital con tu plan de tres hábitos y una vía de ayuda.", "Entrega Mi radiografía digital en la Tarea 3.1."], "clase": {"pregunta": "¿Usas tú el móvil o el móvil te usa a ti?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔔", "titulo": "Sales de casa… sin móvil", "situacion": "Llegas a la parada del autobús y te tocas el bolsillo: **no está**. El corazón se acelera y piensas en todo lo que te vas a perder.", "explicacion": "Ese malestar tiene nombre: **nomofobia** (*no mobile phone phobia*). No es una enfermedad oficial, pero indica **dependencia** del móvil.", "pregunta": "¿Tú qué sentirías: 😌, 😬 o 😱?"}, {"tipo": "idea", "icono": "🧠", "titulo": "Cuatro palabras para entender tu mente digital", "puntos": ["**Tecnoestrés**: agobio por notificaciones y tareas digitales sin fin.", "**Nomofobia**: miedo a estar sin móvil.", "**FOMO**: miedo a perderte algo que pasa en redes.", "**Phubbing**: ignorar a quien tienes delante por mirar el móvil."]}, {"tipo": "practica", "titulo": "Test anónimo de nomofobia", "enlace": "https://forms.gle/QJ8EuqAkaqKT1HtCA", "tiempo": 8, "agrupamiento": "Individual", "enunciado": "Responde las **10 afirmaciones** del test. Es **anónimo** y no es un diagnóstico: sirve para pensar en tus hábitos.", "pasos": ["Abre el enlace del test.", "Marca de 1 (nada de acuerdo) a 7 (totalmente de acuerdo).", "Lee tu resultado orientativo y guárdalo para ti."], "nota": "Adaptado de la escala NMP-Q (Yildirim y Correia, 2015). No pidas a nadie que comparta su puntuación."}, {"tipo": "infografia", "titulo": "Trucos de diseño que enganchan", "elementos": [{"icono": "♾️", "titulo": "Scroll infinito", "texto": "Nunca llegas al final, así que **no hay punto de parada**."}, {"icono": "🔴", "titulo": "Punto rojo", "texto": "La notificación pide **atención urgente**."}, {"icono": "🔥", "titulo": "Rachas", "texto": "Si no entras hoy, **pierdes** lo conseguido."}, {"icono": "🎰", "titulo": "Recompensa variable", "texto": "A veces hay algo genial, a veces no: **como una tragaperras**."}]}, {"tipo": "practica", "titulo": "Caza de trucos en FlashTok", "tiempo": 10, "agrupamiento": "Parejas", "enunciado": "Analizad las capturas de la app inventada **FlashTok**. Encontrad **5 trucos** y proponed un **contra-truco** para cada uno.", "pasos": ["Rodead cada truco en la ficha.", "Escribid su nombre.", "Proponed el contra-truco: notificaciones, límites de uso, escala de grises, móvil fuera del dormitorio…"], "material": ["Ficha FlashTok"]}, {"tipo": "quiz", "pregunta": "¿Qué contra-truco funciona mejor contra la recompensa variable de las notificaciones?", "opciones": ["Poner el móvil en silencio pero mirarlo cada poco", "Desactivar las notificaciones que no sean de personas", "Subir el brillo de la pantalla"], "correcta": 1, "explicacion": "Si **no llega el aviso**, el cerebro no espera la recompensa. Deja solo los mensajes de personas reales."}, {"tipo": "practica", "titulo": "Mi radiografía digital · Parte 2 y entrega", "tiempo": 15, "agrupamiento": "Individual", "enunciado": "Completa la parte **Mente**: dos riesgos que reconoces, tu **plan de tres hábitos** y **a quién pedir ayuda**.", "pasos": ["Dos riesgos psicológicos.", "Tres hábitos: qué, cuándo y cómo.", "Una vía de ayuda: familia, tutoría, Orientación, 017 o ANAR.", "Descarga en PDF y entrega."], "entrega": "Tarea 3.1 · Mi radiografía digital"}, {"tipo": "cierre", "puntos": ["Muchas apps están diseñadas para que no las sueltes.", "Conocer los trucos ayuda a desactivarlos.", "Si algo en la red te hace daño, pide ayuda: no estás solo/a."], "siguiente": "Del dato a la viñeta: empezamos el cómic de salud digital.", "pregunta": "¿Qué contra-truco vas a probar esta semana?"}]}}, {"n": 4, "fase": "Bloque 1 · Desarrollo", "titulo": "Del dato a la viñeta: guion del cómic e imágenes con licencia", "reto": "Elegir el tema de salud digital del cómic, planificar la historia en un guion gráfico con elementos interactivos y empezar a montarlo respetando las licencias.", "actividades": [{"nombre": "Anatomía de un cómic", "min": 8, "desc": "El docente proyecta dos páginas de cómic divulgativo (una propia y una con licencia CC de Openverse o Wikimedia Commons) y la clase identifica sus elementos: viñeta, bocadillo de diálogo y de pensamiento, cartela, onomatopeya y plano (general, medio, primer plano). Se enseña cómo Genially añade interactividad: botón que abre una ventana con un dato y su fuente, pregunta con opciones y botón «¿Qué harías tú?»."}, {"nombre": "Elección de tema", "min": 4, "desc": "Cada equipo elige un tema sin repetir: cuello de texto y postura, vista cansada, sueño y pantallas, sedentarismo, nomofobia, tecnoestrés y notificaciones, o diseño que engancha (scroll infinito, rachas). Se usa lo trabajado en las sesiones 2 y 3."}, {"nombre": "Guion gráfico", "min": 20, "desc": "Con una plantilla de guion gráfico de 6 viñetas en Google Presentaciones, cada equipo planifica: protagonista adolescente inventado/a, situación de partida, conflicto (aparece el problema de salud), giro con un dato real y su fuente, solución con un hábito saludable y llamada a la acción final. Marcan dónde irán al menos dos elementos interactivos."}, {"nombre": "Imágenes con licencia", "min": 8, "desc": "Taller exprés de licencias: buscar en Openverse con filtro de licencia, entender CC BY, CC BY-SA y CC0, y citar con la fórmula TAFL (título, autor/a, fuente y licencia). Normas del cómic: nada de personajes con copyright, ninguna foto de compañeros/as ni datos personales, y si se usa una imagen generada con IA se indica «imagen generada con IA» y la herramienta."}, {"nombre": "Primera viñeta en Genially", "min": 10, "desc": "El docente monta en directo una viñeta (plantilla o lienzo en blanco, fondo, personaje, bocadillo y botón con ventana emergente) y enseña a compartir el Genially con el equipo para editar a la vez. Cada equipo crea su Genially, lo comparte y monta la viñeta 1. La demostración queda grabada en Moodle."}], "criterios": ["DIG.4.2.3", "DIG.4.4.1"], "saberes": ["DIG.4.B.2", "DIG.4.D.1", "DIG.4.C.3"], "metodologia": ["Narrativa visual", "Aprendizaje cooperativo", "ABP"], "evidencias": ["Guion gráfico del cómic", "Hoja de créditos iniciada", "Viñeta 1 en Genially"], "recursos": ["Proyector", "Plantilla de guion gráfico", "Openverse", "Genially para Educación"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Ejemplos visuales de cada elemento del cómic; plantilla de guion con preguntas guía en cada viñeta; banco de datos verificados de las sesiones 2 y 3; fórmula TAFL con ejemplo resuelto; demostración grabada."}, "moodle": [], "ejercicios": ["Identifica en un cómic de ejemplo una viñeta, un bocadillo, una cartela, una onomatopeya y un primer plano.", "Planifica en el guion gráfico la historia de tu cómic con un dato real y dos elementos interactivos.", "Busca una imagen en Openverse y cítala con la fórmula TAFL."], "clase": {"pregunta": "¿Cómo se convierte un dato de salud en una historia que se recuerda?", "diapositivas": [{"tipo": "ejemplo", "icono": "📖", "titulo": "Lo que recuerdas de un TikTok", "situacion": "De un vídeo de 30 segundos no recuerdas la cifra exacta: recuerdas **a la persona**, **lo que le pasó** y **cómo terminó**.", "explicacion": "Las historias funcionan porque tienen **personaje, conflicto y final**. En el cómic, el dato de salud aparece en el **giro** de la historia.", "pregunta": "¿Qué vídeo informativo recuerdas y por qué?"}, {"tipo": "infografia", "titulo": "Anatomía de un cómic", "elementos": [{"icono": "🔲", "titulo": "Viñeta", "texto": "Cada recuadro: **un momento**."}, {"icono": "💬", "titulo": "Bocadillo", "texto": "Diálogo (redondo) o pensamiento (nube)."}, {"icono": "📝", "titulo": "Cartela", "texto": "Voz del narrador: «Dos horas después…»."}, {"icono": "💥", "titulo": "Onomatopeya", "texto": "¡BZZZ! ¡DING!: el sonido dibujado."}, {"icono": "🎥", "titulo": "Plano", "texto": "General, medio o **primer plano** para la emoción."}]}, {"tipo": "practica", "titulo": "Elegid tema (sin repetir)", "tiempo": 4, "agrupamiento": "Equipos", "enunciado": "Cada equipo, **un tema distinto** de salud digital.", "pasos": ["Cuello de texto y postura · Vista cansada · Sueño y pantallas · Sedentarismo.", "Nomofobia · Tecnoestrés y notificaciones · Diseño que engancha.", "El coordinador/a lo comunica al docente."]}, {"tipo": "flujo", "titulo": "La estructura de nuestro cómic (6 viñetas)", "nodos": [{"texto": "1 · Protagonista y situación", "tipo": "inicio"}, {"texto": "2-3 · Conflicto: aparece el problema", "tipo": "proceso"}, {"texto": "4 · Giro: el dato real (con fuente)", "tipo": "decision"}, {"texto": "5 · Solución: un hábito sano", "tipo": "proceso"}, {"texto": "6 · Llamada a la acción", "tipo": "fin"}]}, {"tipo": "practica", "titulo": "Guion gráfico de 6 viñetas", "tiempo": 20, "agrupamiento": "Equipos", "enunciado": "Planificad la historia viñeta a viñeta y marcad **dos elementos interactivos**.", "pasos": ["Protagonista inventado/a: nombre, edad, qué le gusta.", "Situación y conflicto (viñetas 1-3).", "Giro con un dato real y su fuente (viñeta 4).", "Solución y llamada a la acción (viñetas 5-6).", "Marcad: ventana con dato, pregunta o botón «¿Qué harías tú?»."], "material": ["Plantilla de guion gráfico"]}, {"tipo": "pasos", "titulo": "Cómo citar una imagen: fórmula TAFL", "progresivo": true, "pasos": ["**T**ítulo de la imagen.", "**A**utor/a.", "**F**uente (enlace).", "**L**icencia: CC BY, CC BY-SA, CC0…", "Ejemplo: «Chica con móvil» · Ana Ruiz · Openverse · CC BY 2.0"]}, {"tipo": "quiz", "pregunta": "¿Qué imagen PUEDES usar en tu cómic?", "opciones": ["Un personaje de dibujos famoso descargado de Google", "Una foto de tu compañera en clase", "Una ilustración CC BY de Openverse citada con TAFL"], "correcta": 2, "explicacion": "La licencia **CC BY** permite usarla si **citas a su autor/a**. Los personajes famosos tienen copyright y las fotos de compañeros/as necesitan permiso."}, {"tipo": "practica", "titulo": "Primera viñeta en Genially", "tiempo": 10, "agrupamiento": "Equipos", "enunciado": "Mirad la demostración, cread vuestro Genially, **compartidlo con el equipo** y montad la **viñeta 1**.", "pasos": ["Crear → plantilla de cómic o lienzo en blanco.", "Fondo, personaje y bocadillo.", "Compartir → Colaborar con el equipo.", "Primera imagen en la hoja de créditos."], "nota": "Graba la demostración y súbela a Moodle para quien falte o necesite repetirla."}, {"tipo": "cierre", "puntos": ["Un dato se recuerda si va dentro de una historia.", "Protagonista, conflicto, giro, solución y llamada a la acción.", "Toda imagen ajena lleva su crédito."], "siguiente": "Producción del cómic y versión para redes: entrega de la Tarea 3.2.", "pregunta": "¿Cuál es el dato que va en el giro de vuestra historia?"}]}}, {"n": 5, "fase": "Bloque 1 · Desarrollo", "titulo": "Producción del cómic y versión para redes", "reto": "Terminar el cómic interactivo en Genially, preparar su versión accesible para redes y entregarlo.", "actividades": [{"nombre": "Hitos y publicación responsable", "min": 5, "desc": "El docente recuerda la lista de hitos y la rúbrica de la Tarea 3.2, y da tres normas de publicación responsable: formato de carrusel vertical (1080 × 1350 px), accesibilidad (texto alternativo, contraste, letra grande) y nada de datos personales ni etiquetas a otras personas."}, {"nombre": "Producción por roles", "min": 28, "desc": "Los equipos montan las viñetas 2-6 de su guion gráfico. Diseñador/a visual monta fondos y personajes; guionista escribe bocadillos y cartelas; verificador/a de datos prepara las ventanas emergentes con el dato y su fuente y completa la página de créditos; coordinador/a controla los hitos (minuto 15: viñetas 2-4; minuto 28: viñetas 5-6, dos interacciones y créditos). Rotación de teclado a mitad de la actividad para que todo el equipo edite. El docente atiende primero a los equipos que lo pidieron."}, {"nombre": "Versión para redes", "min": 12, "desc": ens", "tipo": "proceso"}, {"texto": "¿Lo confirma Maldita, Newtral o EFE Verifica?", "tipo": "decision"}, {"texto": "Veredicto con fuentes", "tipo": "fin"}]}, {"tipo": "ejemplo", "icono": "🎧", "titulo": "La nota de voz de tu prima", "situacion": "Te llega un audio con la **voz de tu prima**: «Estoy en un lío, hazme un Bizum de 50 € a este número».", "explicacion": "Con unos segundos de audio, la IA puede **clonar una voz**. Señal de alarma: **urgencia + dinero + número nuevo**. Llama tú a tu prima a su número de siempre.", "pregunta": "¿Qué pregunta le harías que solo ella sabría contestar?"}, {"tipo": "idea", "icono": "🛑", "titulo": "Deepfakes de personas reales", "puntos": ["Crear o difundir un deepfake **daña a la víctima**, aunque sea «en broma».", "Si es sexual, **es delito**: en Almendralejo (2023), 15 menores fueron condenados.", "Si te pasa: **no lo compartas**, guarda pruebas y cuéntalo a un adulto.", "Pide la retirada en el **Canal prioritario de la AEPD** y llama al **017** o a **ANAR**."], "nota": "Trátalo con calma y sin detalles. Recuerda que el Departamento de Orientación y la tutoría también son vías de ayuda."}, {"tipo": "practica", "titulo": "Investigad vuestra tarjeta", "tiempo": 20, "agrupamiento": "Parejas", "enunciado": "Aplicad el kit a vuestro caso y rellenad la **ficha de verificación**.", "pasos": ["Copiad la afirmación o describid la imagen.", "Buscad al menos dos fuentes fiables.", "Veredicto: verdad, bulo, generado con IA o con matices.", "Escribid cómo lo habéis comprobado."], "material": ["Tarjeta del caso", "Ficha de verificación"]}, {"tipo": "quiz", "pregunta": "Ves una foto viral de un incendio en tu ciudad. Los coches tienen cinco ruedas y los carteles no se leen. ¿Qué es lo más probable?", "opciones": ["Que sea real y esté mal enfocada", "Que esté generada con IA", "Que sea una foto antigua"], "correcta": 1, "explicacion": "Objetos imposibles y **textos deformados** son señales típicas de imágenes generadas. Confírmalo con **búsqueda inversa** y medios fiables."}, {"tipo": "practica", "titulo": "Publicad en el foro Cazabulos", "tiempo": 12, "agrupamiento": "Parejas", "enunciado": "Publicad vuestra verificación con la plantilla y **responded a otra pareja** con respeto.", "pasos": ["Titular corto y veredicto.", "Dos fuentes enlazadas.", "Cómo lo hemos comprobado.", "Sin imágenes de personas reales.", "Una respuesta a otra pareja."], "entrega": "Foro S8 · Cazabulos: bulos y deepfakes de la IA"}, {"tipo": "cierre", "puntos": ["La IA puede crear imágenes, voces y citas falsas muy creíbles.", "Verificar lleva dos minutos; un bulo dura años.", "Un deepfake de una persona real hace daño y puede ser delito."], "siguiente": "¿Quién paga la IA? Sesgos, autoría, privacidad y huella.", "pregunta": "¿Qué argumento para el debate te llevas de hoy?"}]}}, {"n": 9, "fase": "Bloque 2 · Desarrollo", "titulo": "¿Quién paga la IA? Sesgos, autoría, privacidad y huella", "reto": "Analizar casos reales de impacto ético y ecosocial de la IA generativa y redactar un código personal para usarla de forma ética.", "actividades": [{"nombre": "Dato sorpresa", "min": 7, "desc": "Se proyectan dos datos: en 2024 los centros de datos consumieron unos 415 TWh, alrededor del 1,5 % de la electricidad mundial, y en 2030 podrían llegar a unos 945 TWh, sobre todo por la IA (AIE, 2025); según Google, una consulta de texto mediana a Gemini gasta 0,24 Wh y 0,26 ml de agua, pero generar imágenes o vídeo gasta mucho más y hay miles de millones de consultas al día. Pregunta: ¿es un argumento a favor o en contra de la moción?"}, {"nombre": "Tribunal de casos", "min": 20, "desc": "Cada equipo recibe un caso: un filtro de belleza que aclara la piel (sesgo), imágenes generadas con el estilo de una ilustradora sin su permiso (autoría), una app que guarda tus conversaciones para entrenar su IA (privacidad), un gran centro de datos proyectado en una zona con poca agua (huella), un chatbot «amigo» que nunca lleva la contraria (salud emocional) o una herramienta de selección de personal que penalizaba currículos de mujeres (sesgo). Con la plantilla «¿Quién gana? ¿Quién pierde? ¿Qué derecho está en juego? ¿Qué proponemos?» lo analizan y el portavoz lo expone en un minuto. El docente observa con la lista de cotejo de DIG.4.4.4."}, {"nombre": "Mi código ético de la IA", "min": 18, "desc": "Cada estudiante completa la plantilla «Mi código ético para usar la IA generativa»: cinco normas personales (para qué sí la usaré y para qué no; indicar cuándo un trabajo lleva ayuda de IA; no introducir datos personales ni fotos de otras personas; no crear nunca imágenes o audios de personas reales; comprobar lo que dice; evitar generar imágenes o vídeos sin necesidad por su consumo), y su respuesta a un dilema breve («Tu grupo quiere hacer un meme con la cara de un profesor generada con IA. ¿Qué haces?»). La entrega en la Tarea 3.3."}, {"nombre": "Cierre", "min": 5, "desc": "Dos o tres estudiantes leen voluntariamente una norma de su código. Se recuerda que los casos de hoy y el foro Cazabulos son la materia prima de la guía del debate."}], "criterios": ["DIG.4.4.1", "DIG.4.4.4"], "saberes": ["DIG.4.D.5", "DIG.4.D.1"], "metodologia": ["Estudio de casos", "Aprendizaje cooperativo", "Metacognición"], "evidencias": ["Plantilla del tribunal de casos", "Exposición del caso (observación)", "Tarea 3.3 · Mi código ético de la IA"], "recursos": ["Proyector", "Tarjetas de casos", "Plantilla «Mi código ético»"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Cifras traducidas a comparaciones cotidianas; casos cortos con imagen; plantilla del código con frases para completar («Usaré la IA para…», «Nunca…»); posibilidad de entregar el código en audio."}, "moodle": [{"recurso": "Tarea", "nombre": "3.3 · Mi código ético de la IA", "uso": "Comprobar que cada estudiante concreta normas de uso ético de la IA generativa (privacidad, autoría, respeto a otras personas, comprobación de la información) y las aplica a un dilema.", "correccion": "apto", "criterio": "DIG.4.4.1", "cotejo": ["Incluye cinco normas concretas y en primera persona", "Al menos una norma trata la privacidad (datos personales o imágenes de otras personas)", "Al menos una norma trata la autoría (indicar el uso de IA o respetar a creadores/as)", "Responde al dilema del meme con una decisión justificada y respetuosa", "No incluye datos personales"], "config": ["Entrega individual: PDF, texto en línea o audio", "Calificación: escala Apto / No apto"], "calificable": true, "codigo": "3.3"}], "ejercicios": ["Analiza con tu equipo el caso del tribunal: ¿quién gana?, ¿quién pierde?, ¿qué derecho está en juego?, ¿qué proponemos?", "Redacta tu código ético con cinco normas para usar la IA generativa.", "Responde al dilema del meme generado con IA y justifica tu decisión."], "clase": {"pregunta": "Si la IA parece gratis, ¿quién paga la factura?", "diapositivas": [{"tipo": "dato", "valor": "945 TWh", "texto": "Electricidad que podrían consumir los centros de datos del mundo en **2030**: más del **doble** que en 2024 (415 TWh), sobre todo por la **IA**.", "fuente": "Agencia Internacional de la Energía, «Energy and AI» (2025)", "pregunta": "¿Es un argumento a favor o en contra de la moción?"}, {"tipo": "ejemplo", "icono": "🤖", "titulo": "Una pregunta a la IA", "situacion": "Preguntas a un chatbot qué ponerte para una fiesta. Parece gratis y sin coste.", "explicacion": "Según Google, una consulta de texto mediana a Gemini gasta **0,24 Wh** y **0,26 ml de agua** (unas cinco gotas). Poco… pero hay **miles de millones** al día, y **una imagen o un vídeo** gastan mucho más.", "pregunta": "¿Cuántas imágenes con IA has generado este mes?", "nota": "Fuente: Google Cloud, agosto de 2025; datos de la propia empresa, no verificados de forma independiente. Conviene decirlo: también es educación mediática."}, {"tipo": "infografia", "titulo": "Cuatro facturas de la IA", "elementos": [{"icono": "⚖️", "titulo": "Sesgos", "texto": "Aprende de datos con **prejuicios** y los repite."}, {"icono": "©️", "titulo": "Autoría", "texto": "Imita a artistas **sin permiso** ni pago."}, {"icono": "🔒", "titulo": "Privacidad", "texto": "Tus textos y fotos pueden **entrenar** modelos."}, {"icono": "🌍", "titulo": "Planeta", "texto": "**Electricidad, agua** y minerales de los centros de datos."}]}, {"tipo": "practica", "titulo": "Tribunal de casos", "tiempo": 20, "agrupamiento": "Equipos", "enunciado": "Analizad vuestro caso con las **cuatro preguntas** y preparad **un minuto** de exposición.", "pasos": ["¿Quién gana?", "¿Quién pierde?", "¿Qué derecho está en juego?", "¿Qué proponemos?", "El portavoz lo cuenta en 1 minuto."], "material": ["Tarjeta del caso", "Plantilla del tribunal"]}, {"tipo": "quiz", "pregunta": "Una IA de selección de personal descarta más currículos de mujeres porque aprendió de contrataciones antiguas. ¿Qué problema es?", "opciones": ["Un fallo de conexión", "Un sesgo algorítmico", "Un virus informático"], "correcta": 1, "explicacion": "El algoritmo **copia el pasado**: si antes se contrataba sobre todo a hombres, aprende ese **sesgo**."}, {"tipo": "practica", "titulo": "Mi código ético de la IA", "tiempo": 18, "agrupamiento": "Individual", "enunciado": "Escribe **cinco normas** para usar la IA generativa y responde al **dilema del meme**.", "pasos": ["«Usaré la IA para… / No la usaré para…»", "Privacidad: datos y fotos de otras personas.", "Autoría: cuándo indico que he usado IA.", "Comprobar lo que dice · Consumo responsable.", "Dilema: un meme con la cara de un profesor generada con IA. ¿Qué haces?"], "entrega": "Tarea 3.3 · Mi código ético de la IA"}, {"tipo": "cierre", "puntos": ["La IA tiene costes que no se ven: sesgos, autoría, privacidad y planeta.", "Usarla bien depende de normas claras, también las tuyas.", "Los casos de hoy son argumentos para el debate."], "siguiente": "Los roles del debate y cómo se construye un buen argumento.", "pregunta": "¿Qué norma de tu código te va a costar más cumplir?"}]}}, {"n": 10, "fase": "Bloque 2 · Desarrollo", "titulo": "Los roles del debate y cómo se construye un argumento", "reto": "Conocer el formato y los roles del debate, asumir un rol y empezar la guía del debate con argumentos sólidos para las dos posturas.", "actividades": [{"nombre": "Debate malo, debate bueno", "min": 6, "desc": "Se proyectan dos fragmentos escritos de un debate ficticio sobre los deberes: en el primero hay gritos, interrupciones y frases sin datos («eso es una tontería»); en el segundo cada turno tiene una idea, un porqué y una prueba, y se rebate la idea, no a la persona. La clase dice qué diferencias ve."}, {"nombre": "Formato y roles del debate", "min": 10, "desc": "El docente explica el formato de la sesión 12, inspirado en las ligas de debate escolar: dos rondas (equipo A contra B y equipo C contra D) con introducción (2 min por equipo), refutación (dos turnos de 1,5 min por equipo) y conclusión (1,5 min por equipo). Roles de los equipos de debate: introductor/a (presenta la postura y los argumentos), refutador/a 1 y refutador/a 2 (rebaten los argumentos del otro equipo y responden a sus ataques) y conclusor/a (resume, recoge lo mejor y cierra sin datos nuevos). Roles de los equipos de mesa: moderador/a (presenta, da los turnos y vela por el respeto), cronometrador/a (muestra las tarjetas de 30 segundos y de tiempo) y relator/a-jurado (anota los mejores argumentos y valora con la ficha). Una mesa dirige una ronda y es jurado en la otra; los equipos de debate que no debaten en una ronda son público-jurado."}, {"nombre": "Reparto de roles", "min": 4, "desc": "Cada equipo reparte sus roles en una ficha. En los equipos de debate, cada estudiante prepara su rol para las dos posturas. El docente revisa que el reparto tenga en cuenta las preferencias y necesidades de cada estudiante."}, {"nombre": "El argumento ARE", "min": 10, "desc": "Estructura de un argumento: Afirmación (qué defiendo), Razonamiento (por qué) y Evidencia (dato o caso con su fuente). Ejemplo a favor de la moción: «Los menores necesitan protección (A) porque la IA puede crear deepfakes que causan un daño enorme (R); en Almendralejo, 2023, se condenó a 15 menores por crear imágenes falsas de compañeras (E)». Ejemplo en contra: «Prohibir no enseña a usarla (A), porque la usarán igualmente fuera del instituto sin ninguna guía (R); la propia OpenAI ya permite su uso desde los 13 años con consentimiento familiar (E)». Por parejas transforman dos opiniones sueltas en argumentos ARE."}, {"nombre": "Guía del debate (I)", "min": 20, "desc": "Cada equipo abre la plantilla «Guía del debate» en Google Docs y completa las partes 1 y 2: tres argumentos ARE a favor de la moción y tres en contra, usando el mapa del dilema, el foro Cazabulos y el tribunal de casos. Los equipos de mesa preparan además las normas que leerá el moderador/a y tres preguntas para el público-jurado."}], "criterios": ["DIG.4.4.4"], "saberes": ["DIG.4.D.5", "DIG.4.D.1"], "metodologia": ["Debate estructurado", "Aprendizaje cooperativo"], "evidencias": ["Ficha de reparto de roles", "Argumentos ARE por parejas", "Guía del debate (partes 1 y 2)"], "recursos": ["Proyector", "Plantilla «Guía del debate»", "Tarjetas de roles"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Tarjeta de cada rol con qué hace, cuánto habla y frases de arranque; ejemplo de argumento ARE resuelto para cada postura; plantilla de la guía con huecos; roles de mesa para quien tenga más ansiedad al hablar en público."}, "moodle": [], "ejercicios": ["Explica qué hace tu rol en el debate y cuánto tiempo tiene.", "Transforma dos opiniones sueltas en argumentos con afirmación, razonamiento y evidencia.", "Escribe con tu equipo tres argumentos a favor y tres en contra de la moción en la guía del debate."], "clase": {"pregunta": "¿Qué convierte una opinión en un argumento?", "diapositivas": [{"tipo": "comparar", "titulo": "Debate malo, debate bueno", "columnas": [{"titulo": "Debate malo", "icono": "😤", "puntos": ["«¡Eso es una tontería!»", "Interrumpir y gritar", "Opiniones sin pruebas"]}, {"titulo": "Debate bueno", "icono": "🤝", "puntos": ["Una idea por turno", "Un porqué y una prueba", "Rebatir la idea, no a la persona"]}], "pregunta": "¿Qué diferencia veis entre los dos fragmentos?"}, {"tipo": "flujo", "titulo": "Formato de cada ronda (unos 13 minutos)", "nodos": [{"texto": "Introducción: 2 min por equipo", "tipo": "inicio"}, {"texto": "Refutación 1: 1,5 min por equipo", "tipo": "proceso"}, {"texto": "Refutación 2: 1,5 min por equipo", "tipo": "proceso"}, {"texto": "Conclusión: 1,5 min por equipo", "tipo": "proceso"}, {"texto": "Valoración del jurado", "tipo": "fin"}], "nota": "Ronda 1: A contra B. Ronda 2: C contra D. Las posturas y los emparejamientos se sortean al inicio de la sesión 12."}, {"tipo": "infografia", "titulo": "Roles de los equipos de debate", "elementos": [{"icono": "🎬", "titulo": "Introductor/a", "texto": "Abre: presenta la postura y **tres argumentos**."}, {"icono": "🥊", "titulo": "Refutador/a 1", "texto": "Rebate el **primer** argumento del otro equipo."}, {"icono": "🛡️", "titulo": "Refutador/a 2", "texto": "Rebate el resto y **defiende** los propios."}, {"icono": "🏁", "titulo": "Conclusor/a", "texto": "Resume y cierra. **Sin datos nuevos**."}]}, {"tipo": "infografia", "titulo": "Roles de los equipos de mesa", "elementos": [{"icono": "🎙️", "titulo": "Moderador/a", "texto": "Presenta, **da los turnos** y vela por el respeto."}, {"icono": "⏱️", "titulo": "Cronometrador/a", "texto": "Tarjetas de **30 segundos** y de **tiempo**."}, {"icono": "📋", "titulo": "Relator/a-jurado", "texto": "Anota los **mejores argumentos** y valora con la ficha."}], "nota": "Cada mesa dirige una ronda y es jurado en la otra. Los equipos de debate que no debaten en una ronda son público-jurado con ficha."}, {"tipo": "practica", "titulo": "Reparto de roles", "tiempo": 4, "agrupamiento": "Equipos", "enunciado": "Repartid los roles y escribidlos en la ficha. En los equipos de debate, cada persona prepara su rol **para las dos posturas**.", "pasos": ["Equipos de debate: introductor/a, refutador/a 1, refutador/a 2, conclusor/a.", "Equipos de mesa: moderador/a, cronometrador/a, relator/a-jurado."]}, {"tipo": "ejemplo", "icono": "🏠", "titulo": "Negociar la hora de llegar a casa", "situacion": "Quieres volver a las 12 del cumpleaños. Si dices «¡Porque sí, todos van!», la respuesta es **no**.", "explicacion": "Si dices «Volveré a las 12 (**afirmación**) porque nos trae en coche la madre de Lucía (**razonamiento**), aquí tienes su teléfono (**evidencia**)», tienes muchas más opciones. Eso es un **argumento**.", "pregunta": "¿Qué evidencia convencería más a tu familia?"}, {"tipo": "pasos", "titulo": "El argumento ARE", "progresivo": true, "pasos": ["**A**firmación: qué defiendo.", "**R**azonamiento: por qué.", "**E**videncia: un dato o un caso, **con su fuente**.", "A favor: «Hay que proteger a los menores (A) porque los deepfakes causan un daño enorme (R); en Almendralejo, 2023, se condenó a 15 menores (E)».", "En contra: «Prohibir no enseña a usarla (A) porque la usarán igual sin guía (R); ChatGPT ya se permite desde los 13 con consentimiento familiar (E)»."]}, {"tipo": "practica", "titulo": "De opinión a argumento", "tiempo": 10, "agrupamiento": "Parejas", "enunciado": "Transformad estas dos opiniones en argumentos **ARE**.", "pasos": ["«La IA hace que no pensemos.»", "«La IA ayuda a quien le cuesta estudiar.»", "Buscad la evidencia en el foro Cazabulos o en el mapa del dilema."]}, {"tipo": "practica", "titulo": "Guía del debate (I)", "tiempo": 20, "agrupamiento": "Equipos", "enunciado": "Completad las **partes 1 y 2** de la guía: **tres argumentos ARE a favor** y **tres en contra**.", "pasos": ["Usad el mapa del dilema, el foro y el tribunal de casos.", "Cada argumento con su fuente.", "Equipos de mesa: además, normas del moderador/a y tres preguntas para el público."], "material": ["Plantilla «Guía del debate»"]}, {"tipo": "cierre", "puntos": ["Un argumento tiene afirmación, razonamiento y evidencia.", "Cada rol tiene una función y un tiempo.", "Preparamos las dos posturas: la nuestra se sortea."], "siguiente": "Terminamos y entregamos la guía del debate, y ensayamos.", "pregunta": "¿Cuál es el argumento más fuerte de la postura contraria a la tuya?"}]}}, {"n": 11, "fase": "Bloque 2 · Desarrollo", "titulo": "Guía del debate y ensayo por roles", "reto": "Completar y entregar la guía del debate con refutaciones previstas y el guion de cada rol, y ensayar los turnos con el cronómetro.", "actividades": [{"nombre": "Control de evidencias", "min": 5, "desc": "Cada equipo revisa en dos minutos que sus seis argumentos tienen fuente enlazada. El docente proyecta dos errores frecuentes: dato sin fuente y dato de una fuente poco fiable (un vídeo viral sin autor)."}, {"nombre": "Guía del debate (II)", "min": 22, "desc": "Los equipos completan las partes 3, 4 y 5 de la guía: parte 3, refutaciones previstas (los dos argumentos más fuertes del otro bando y cómo responderlos); parte 4, guion de cada rol (introducción escrita para las dos posturas, frases de arranque para refutar y conclusión; en los equipos de mesa, guion de moderación con normas, presentación y turnos); parte 5, propuesta de uso responsable de la IA generativa por menores que el equipo defendería en cualquier caso (por ejemplo, uso con supervisión, alfabetización en IA o etiquetado de contenidos generados)."}, {"nombre": "Ensayo por roles", "min": 15, "desc": "Parejas de equipos ensayan con cronómetro: el introductor/a de un equipo hace su turno de 2 minutos y el refutador/a 1 del otro responde en 1,5 minutos; después cambian. Los equipos de mesa ensayan la presentación del debate, el cronometraje con tarjetas y la ficha del jurado con estos ensayos. Cada observador/a deja una sugerencia."}, {"nombre": "Ajustes y entrega", "min": 8, "desc": "Los equipos aplican la sugerencia más importante y el coordinador/a del equipo (o el moderador/a en los de mesa) entrega el enlace de la guía, con permiso de lectura para el centro, en la Tarea 3.4."}], "criterios": ["DIG.4.4.4"], "saberes": ["DIG.4.D.5", "DIG.4.D.1"], "metodologia": ["Debate estructurado", "Aprendizaje cooperativo", "Coevaluación"], "evidencias": ["Tarea 3.4 · Guía del debate", "Sugerencias del ensayo"], "recursos": ["Plantilla «Guía del debate»", "Cronómetro proyectado", "Tarjetas de tiempo"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Frases de arranque para refutar («Entiendo vuestro argumento, pero…»); posibilidad de leer la introducción y la conclusión; ensayo en pequeño grupo antes del debate; prórroga en la Tarea para equipos con ausencias."}, "moodle": [{"recurso": "Tarea", "nombre": "3.4 · Guía del debate: IA generativa y menores", "uso": "Tarea final evaluable del bloque 2: guía del equipo con beneficios y riesgos, argumentos con datos y fuentes, refutaciones, guion de roles y propuesta de uso responsable (66 %), y desempeño del equipo en el debate en escena de la sesión 12 (33 %). Se entrega en la sesión 11 y la calificación se completa tras el debate. Las fichas del jurado de alumnado se tienen en cuenta, pero la nota la pone el docente y no depende de ganar.", "correccion": "rubrica", "criterio": "DIG.4.4.4", "rubrica": [{"linea": "Guía: beneficios y riesgos ecosociales", "peso": 22.2, "niveles": ["No identifica beneficios ni riesgos.", "Un beneficio o un riesgo genérico («es útil», «es peligrosa»).", "Dos beneficios y dos riesgos concretos (aprendizaje, privacidad, deepfakes…).", "Beneficios y riesgos en varias dimensiones, incluidas la accesibilidad y el impacto ambiental.", "Beneficios y riesgos personales, sociales y ambientales relacionados entre sí, indicando quién gana y quién pierde."]}, {"linea": "Guía: argumentos con evidencia y refutaciones", "peso": 22.2, "niveles": ["Opiniones sin estructura ni fuentes y sin prever al otro bando.", "Algún argumento con afirmación pero sin evidencia; nombra un argumento contrario sin responderlo.", "Tres argumentos ARE en una postura (o algunos en ambas) con alguna fuente, y dos refutaciones breves.", "Tres argumentos ARE por postura con evidencia y fuente fiable, y respuestas razonadas a los argumentos más fuertes del otro bando.", "Seis argumentos ARE sólidos con fuentes fiables y fechadas (alguna verificada en el foro) y refutaciones con evidencia que reconocen lo que el otro bando tiene de razón."]}, {"linea": "Guía: guion de roles y propuesta de uso responsable", "peso": 22.2, "niveles": ["No hay guion de roles ni propuesta.", "Guion de uno o dos roles y propuesta vaga («usarla bien»).", "Guion de todos los roles, incompleto en alguna postura, y una medida concreta.", "Guion completo de cada rol para las dos posturas (o guion de moderación completo) y dos o más medidas concretas.", "Guion ajustado a los tiempos, con frases de arranque respetuosas, y medidas realistas que equilibran beneficios, riesgos y sostenibilidad."]}, {"linea": "Debate en escena (S12): participación del equipo", "peso": 16.7, "niveles": ["El equipo no participa o abandona su rol, o hay faltas de respeto.", "Interviene solo una parte del equipo; se salen del tiempo o interrumpen a menudo.", "Todos los miembros ejercen su rol con ayuda y respetan casi siempre turnos y tiempos.", "Todos ejercen su rol con autonomía, respetan turnos y tiempos y escuchan al otro equipo (mesa: modera, cronometra y anota sin incidencias).", "Participación equilibrada y coordinada, con respeto ejemplar y apoyo entre miembros (mesa: dirige la ronda con fluidez y resuelve imprevistos)."]}, {"linea": "Debate en escena (S12): resultado de la argumentación", "peso": 16.7, "niveles": ["No defiende la postura sorteada o lo hace sin argumentos (mesa: no hay veredicto).", "Opiniones sin datos y sin responder al otro equipo (mesa: veredicto sin justificar).", "Usa algunos argumentos de su guía con evidencia, pero apenas refuta (mesa: veredicto basado solo en impresiones).", "Argumenta con datos y fuentes, refuta los argumentos principales del otro equipo y la conclusión resume bien (mesa: veredicto basado en las fichas).", "Argumentación sólida y adaptada a lo que ocurre en el debate, refutaciones con evidencia y conclusión que recoge el debate (mesa: veredicto claro, justo y explicado con ejemplos)."]}], "config": ["Entrega por grupos: Sí (agrupamiento «SdA3 Debate»)", "Texto en línea para el enlace", "Método de calificación: Rúbrica", "Puntos de los niveles en Moodle: líneas del producto digital 1, 3, 5, 7 y 10; líneas de puesta en público 0,75, 2,25, 3,75, 5,25 y 7,5 (así pesan un 33 %)"], "calificable": true, "codigo": "3.4"}], "ejercicios": ["Escribe las refutaciones previstas a los dos argumentos más fuertes del otro bando.", "Redacta el guion de tu rol para las dos posturas.", "Propón con tu equipo medidas de uso responsable de la IA generativa por menores.", "Entrega la guía del debate en la Tarea 3.4."], "clase": {"pregunta": "¿Estás preparado/a para defender cualquiera de las dos posturas?", "diapositivas": [{"tipo": "comparar", "titulo": "Control de evidencias", "columnas": [{"titulo": "No vale", "icono": "❌", "puntos": ["Dato sin fuente", "Vídeo viral sin autor", "«Lo he leído por ahí»"]}, {"titulo": "Vale", "icono": "✅", "puntos": ["Organismo oficial o medio fiable", "Fecha del dato", "Enlace que se puede abrir"]}], "pregunta": "¿Todos vuestros argumentos tienen fuente?"}, {"tipo": "practica", "titulo": "Guía del debate (II)", "tiempo": 22, "agrupamiento": "Equipos", "enunciado": "Completad las **partes 3, 4 y 5** de la guía.", "pasos": ["**Parte 3**: refutaciones previstas a los dos argumentos más fuertes del otro bando.", "**Parte 4**: guion de cada rol para las dos posturas (mesa: guion de moderación).", "**Parte 5**: propuesta de uso responsable de la IA por menores."], "material": ["Plantilla «Guía del debate»"]}, {"tipo": "ejemplo", "icono": "🗣️", "titulo": "Rebatir sin atacar", "situacion": "El otro equipo dice: «La IA no contamina nada». Te dan ganas de contestar: «¡Eso es una tontería!».", "explicacion": "Mejor: «**Entiendo** que una consulta de texto gasta poco, **pero** según la AIE los centros de datos podrían duplicar su consumo en 2030». Se rebate **la idea con un dato**, no a la persona.", "pregunta": "¿Qué otra frase sirve para empezar una refutación respetuosa?"}, {"tipo": "quiz", "pregunta": "¿Qué debe hacer el conclusor/a?", "opciones": ["Aportar el dato más impactante que se había guardado", "Resumir lo mejor de su equipo y responder a lo que quedó abierto, sin datos nuevos", "Repetir la introducción palabra por palabra"], "correcta": 1, "explicacion": "La conclusión **cierra**: resume, recoge lo que ha pasado en el debate y **no introduce datos nuevos** que el otro equipo ya no puede rebatir."}, {"tipo": "practica", "titulo": "Ensayo por roles", "tiempo": 15, "agrupamiento": "Parejas de equipos", "enunciado": "Ensayad con cronómetro: **introducción (2 min)** de un equipo y **refutación (1,5 min)** del otro. Después, cambiad.", "pasos": ["Introductor/a del equipo 1 → refutador/a 1 del equipo 2.", "Introductor/a del equipo 2 → refutador/a 1 del equipo 1.", "Mesa: presentación, tarjetas de tiempo y ficha del jurado.", "Cada observador/a deja una sugerencia."], "material": ["Tarjetas de tiempo", "Ficha del jurado"]}, {"tipo": "practica", "titulo": "Ajustes y entrega", "tiempo": 8, "agrupamiento": "Equipos", "enunciado": "Aplicad la sugerencia más importante y entregad el **enlace de la guía** con permiso de lectura.", "entrega": "Tarea 3.4 · Guía del debate: IA generativa y menores", "nota": "Recuerda: la guía es el 66 % de la nota; el 33 % restante es el debate en escena de la sesión 12."}, {"tipo": "cierre", "puntos": ["Prever los argumentos del otro bando es media victoria.", "Cada rol tiene su guion y su tiempo.", "La guía ya está entregada: el debate es la demostración."], "siguiente": "¡El gran debate! Sorteo de posturas y dos rondas.", "pregunta": "¿Qué frase de tu guion te sale mejor?"}]}}, {"n": 12, "fase": "Bloque 2 · Cierre", "titulo": "El gran debate y cierre de la SdA", "reto": "Defender con argumentos, datos y respeto la postura que toque en el sorteo, ejercer bien el rol asignado y reflexionar sobre lo aprendido en toda la SdA.", "actividades": [{"nombre": "Sorteo y preparación", "min": 5, "desc": "Sorteo de los emparejamientos (ronda 1 y ronda 2) y de la postura de cada equipo (a favor o en contra de la moción «El uso de la IA generativa debería prohibirse a menores de 16 años»). Los equipos de mesa ocupan su sitio, el moderador/a lee las normas (turnos, respeto, sin ataques personales, todo dato con fuente) y se reparten las fichas de jurado."}, {"nombre": "Ronda 1", "min": 15, "desc": "Debate del equipo A contra el equipo B, dirigido por la mesa 1 (moderación, cronometraje con tarjetas y relatoría). Introducción (2 min por equipo), refutación 1 y refutación 2 (1,5 min por equipo cada una) y conclusión (1,5 min por equipo). La mesa 2 y los equipos C y D valoran con la ficha del jurado. El docente califica a cada equipo (también a la mesa) con las líneas 4 y 5 de la rúbrica de la Tarea 3.4 (participación y resultado de la argumentación) y observa a cada estudiante con la lista de cotejo de DIG.4.4.1."}, {"nombre": "Ronda 2", "min": 15, "desc": "Debate del equipo C contra el equipo D, dirigido por la mesa 2, con el mismo formato. La mesa 1 y los equipos A y B valoran con la ficha del jurado. El docente califica las líneas 4 y 5 de la rúbrica de la Tarea 3.4 de estos equipos y de la mesa 2."}, {"nombre": "Veredicto", "min": 5, "desc": "Los relatores/as de las dos mesas suman las fichas y anuncian qué equipo ha argumentado mejor en cada ronda, el mejor argumento de cada postura y la mejor muestra de respeto. Se recuerda que el veredicto valora la argumentación, no qué postura es la correcta."}, {"nombre": "Cierre de la SdA", "min": 10, "desc": "Votación final con la pregunta de las sesiones 1 y 7 y comparación de resultados: ¿ha cambiado la opinión de la clase? Cada estudiante responde en Google Forms: ¿qué hábito digital he mantenido desde el bloque 1?, ¿ha cambiado mi forma de ver la IA generativa?, autoevaluación con la lista de cotejo y valoración de la SdA."}], "criterios": ["DIG.4.4.4", "DIG.4.4.1"], "saberes": ["DIG.4.D.5", "DIG.4.D.1"], "metodologia": ["Debate estructurado", "Coevaluación", "Metacognición"], "evidencias": ["Debate en escena (líneas 4 y 5 de la rúbrica de la Tarea 3.4)", "Fichas del jurado", "Autoevaluación final"], "recursos": ["Proyector", "Cronómetro proyectado", "Tarjetas de tiempo", "Fichas del jurado"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Turnos cortos y preparados con guion; posibilidad de leer la intervención; roles de mesa sin exposición prolongada; autoevaluación con preguntas cerradas y una abierta."}, "moodle": [], "ejercicios": ["Defiende en tu turno la postura sorteada con un argumento, un dato y su fuente.", "Valora la otra ronda con la ficha del jurado.", "Responde a la autoevaluación final y valora la SdA."], "clase": {"pregunta": "¿Debería prohibirse la IA generativa a menores de 16 años?", "diapositivas": [{"tipo": "practica", "titulo": "Sorteo y preparación", "tiempo": 5, "enunciado": "Sorteamos **emparejamientos** y **posturas**. Las mesas se colocan y el moderador/a lee las normas.", "pasos": ["Ronda 1: equipo A contra equipo B (mesa 1).", "Ronda 2: equipo C contra equipo D (mesa 2).", "Normas: turnos, respeto, sin ataques personales, todo dato con fuente."], "material": ["Bolsa de sorteo", "Fichas del jurado"]}, {"tipo": "idea", "icono": "🎤", "titulo": "La moción", "texto": "«El uso de la IA generativa **debería prohibirse** a menores de 16 años.»", "puntos": ["El debate en escena es el **33 %** de la nota de la Tarea 3.4.", "Se valora la **participación** de todo el equipo y la **argumentación**, no ganar.", "Idea + razonamiento + evidencia con fuente.", "Rebatir ideas, **no personas**."]}, {"tipo": "ejemplo", "icono": "⚽", "titulo": "El árbitro no elige equipo", "situacion": "En un partido, el árbitro puede ser del Betis o del Sevilla, pero **pita lo que pasa en el campo**.", "explicacion": "El jurado igual: puede pensar lo contrario que tu postura, pero **valora cómo se argumenta**: ideas claras, datos con fuente, refutaciones y respeto.", "pregunta": "¿Qué tres cosas mirarás tú en la ficha del jurado?"}, {"tipo": "flujo", "titulo": "Turnos de cada ronda", "nodos": [{"texto": "Introducción: 2 min por equipo", "tipo": "inicio"}, {"texto": "Refutación 1: 1,5 min por equipo", "tipo": "proceso"}, {"texto": "Refutación 2: 1,5 min por equipo", "tipo": "proceso"}, {"texto": "Conclusión: 1,5 min por equipo", "tipo": "fin"}]}, {"tipo": "practica", "titulo": "Ronda 1", "tiempo": 15, "enunciado": "**Equipo A** contra **equipo B**. Dirige la **mesa 1**. Valoran la mesa 2 y los equipos C y D.", "pasos": ["Introducción, refutación 1, refutación 2 y conclusión.", "El cronometrador/a enseña las tarjetas de 30 segundos y de tiempo.", "El público-jurado anota en su ficha."], "nota": "Califica las líneas 4 y 5 de la rúbrica de la Tarea 3.4 de los equipos A y B y de la mesa 1. Observación individual con la lista de cotejo de DIG.4.4.1."}, {"tipo": "practica", "titulo": "Ronda 2", "tiempo": 15, "enunciado": "**Equipo C** contra **equipo D**. Dirige la **mesa 2**. Valoran la mesa 1 y los equipos A y B.", "pasos": ["Mismo formato y mismos tiempos.", "Rebatid ideas, no personas.", "El público-jurado anota en su ficha."], "nota": "Califica las líneas 4 y 5 de la rúbrica de la Tarea 3.4 de los equipos C y D y de la mesa 2."}, {"tipo": "practica", "titulo": "Veredicto", "tiempo": 5, "agrupamiento": "Relatores/as de las mesas", "enunciado": "Sumad las fichas y anunciad el **equipo que mejor ha argumentado** en cada ronda, **el mejor argumento** de cada postura y **la mejor muestra de respeto**."}, {"tipo": "quiz", "pregunta": "Votación final: ¿debería poder usar la IA generativa sin límites un/a menor de 16 años?", "opciones": ["Sí, sin límites", "No, nunca", "Depende de para qué y cómo"], "correcta": 2, "explicacion": "Comparamos con las votaciones de las sesiones **1 y 7**. ¿Ha cambiado la opinión de la clase? ¿Qué argumento os ha hecho cambiar?", "nota": "Votación a mano alzada antes de pulsar; proyecta junto a los resultados anteriores."}, {"tipo": "practica", "titulo": "Autoevaluación y cierre", "tiempo": 10, "agrupamiento": "Individual", "enunciado": "Responde la **autoevaluación final** en el formulario.", "pasos": ["¿Qué hábito digital he mantenido desde el bloque 1?", "¿Ha cambiado mi forma de ver la IA generativa?", "Autoevaluación con la lista de cotejo.", "Valoración de la SdA."]}, {"tipo": "cierre", "puntos": ["Las pantallas afectan al cuerpo y a la mente: podemos elegir hábitos más sanos.", "La IA generativa ayuda y perjudica: depende de cómo, para qué y quién la use.", "Un buen argumento lleva dato, fuente y respeto."], "pregunta": "Si mañana pudieras poner una norma sobre la IA en el instituto, ¿cuál sería?"}]}}], "dua": {"Compromiso": ["Dos retos cortos con su producto, en lugar de uno largo que se acumula al final.", "Temas cercanos a TikTok, Instagram y las herramientas de IA que ya usan; casos ficticios para no exponer datos propios.", "Elección del tema del cómic; votaciones, galería, sorteo de posturas y roles del debate como retos."], "Representación": ["Cada concepto con un ejemplo cotidiano, una infografía con iconos y poco texto.", "Cifras traducidas a comparaciones (mochilas, bombilla, gotas de agua).", "Demostraciones proyectadas y grabadas en Moodle; web de clase disponible para repasar."], "Acción y Expresión": ["Entregas individuales en texto, PDF o audio.", "Un producto visual (cómic) y otro oral (debate), para que cada estudiante destaque en algo.", "Roles de debate con distinta exposición oral (mesa, refutación, introducción leída)."], "Andamiaje": ["Plantillas con huecos y frases para completar en todas las tareas.", "Hitos con minutos en la producción del cómic y ensayo del debate antes del día final.", "Rúbricas y listas de verificación publicadas en Moodle desde la sesión 1, en lenguaje sencillo."]}, "diversidad": [{"perfil": "Alumnado repetidor con desmotivación o historial de fracaso", "medidas": "Entregas repartidas con éxito temprano (Tarea 3.1 en la sesión 3), refuerzo positivo explícito, roles con responsabilidad visible (portavoz, verificador/a, moderador/a), temas cercanos a sus redes y recuperación sencilla de las Tareas Apto / No apto."}, {"perfil": "Alumnado con dificultades de lectura y escritura", "medidas": "Enunciados en lectura fácil y leídos en voz alta, plantillas con frases para completar, entregas en audio, apoyo visual con iconos y uso del lector inmersivo del navegador."}, {"perfil": "Alumnado con TDAH o dificultades de atención", "medidas": "Cronómetro visible, actividades de 5-20 minutos, pausa activa, roles con movimiento (diseño, cronometraje), lista de hitos de cada sesión y ubicación cerca del docente."}, {"perfil": "Alumnado con ansiedad al hablar en público", "medidas": "Equipos de mesa (cronometraje y relatoría) en el debate, presentación del cómic repartida o leída, y ensayo previo en pequeño grupo."}, {"perfil": "Alumnado con absentismo intermitente", "medidas": "Demostraciones grabadas y diapositivas de la web de clase en Moodle, roles que pueden asumir otros miembros del equipo y prórrogas individuales en las Tareas."}, {"perfil": "Alumnado con dificultades con el español", "medidas": "Glosario visual de términos (nomofobia, tecnoestrés, deepfake, sesgo, licencia), apoyo entre iguales y posibilidad de escribir primero en su lengua."}, {"perfil": "Alumnado con más facilidad o interés especial", "medidas": "Ampliación: interacciones avanzadas en Genially (ramificaciones), contraste de la fiabilidad de las cifras de distintas empresas y papel de introductor/a o mentor/a técnico/a."}], "roles": [{"rol": "Coordinador/a-portavoz (bloque 1)", "funcion": "Controla el tiempo con la lista de hitos, reparte el trabajo, entrega la Tarea 3.2 y habla en nombre del equipo en la presentación."}, {"rol": "Guionista (bloque 1)", "funcion": "Escribe la historia, los bocadillos, las cartelas y el texto de la publicación."}, {"rol": "Diseñador/a visual (bloque 1)", "funcion": "Monta las viñetas, los personajes y el carrusel, cuidando la accesibilidad."}, {"rol": "Verificador/a de datos (bloque 1)", "funcion": "Comprueba cada dato y su fuente, prepara las ventanas emergentes y mantiene la hoja de créditos y licencias. En los equipos de 3 asume también la coordinación."}, {"rol": "Introductor/a (bloque 2)", "funcion": "Abre el debate presentando la postura del equipo y sus argumentos principales (2 minutos)."}, {"rol": "Refutador/a 1 y refutador/a 2 (bloque 2)", "funcion": "Rebaten los argumentos del otro equipo y defienden los propios con evidencias (1,5 minutos cada turno)."}, {"rol": "Conclusor/a (bloque 2)", "funcion": "Resume lo mejor del equipo y responde a lo que quedó abierto, sin datos nuevos (1,5 minutos)."}, {"rol": "Moderador/a (bloque 2, mesa)", "funcion": "Presenta el debate, lee las normas, da los turnos y vela por el respeto."}, {"rol": "Cronometrador/a (bloque 2, mesa)", "funcion": "Controla los tiempos y muestra las tarjetas de 30 segundos y de tiempo."}, {"rol": "Relator/a-jurado (bloque 2, mesa)", "funcion": "Anota los mejores argumentos, suma las fichas del jurado y anuncia el veredicto."}], "evaluacion": {"instrumentos": {"DIG.4.2.3": ["Tarea 3.2 con rúbrica: cómic y versión para redes (66 %) y presentación oral en la sesión 6 (33 %)"], "DIG.4.3.3": ["Tarea 3.1 (Apto / No apto)", "Observación directa con lista de cotejo en la auditoría ergonómica (sesión 2) y en la presentación del cómic (sesión 6)"], "DIG.4.4.1": ["Tarea 3.3 (Apto / No apto)", "Lista de cotejo del foro S8 · Cazabulos", "Observación directa en el debate (sesión 12)"], "DIG.4.4.4": ["Tarea 3.4 con rúbrica: guía del deb
