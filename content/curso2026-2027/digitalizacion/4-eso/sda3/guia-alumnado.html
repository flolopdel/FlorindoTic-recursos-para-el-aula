*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}

nav.toc a.sub{padding-left:24px;font-size:14px}nav.toc a.sub2{padding-left:38px;font-size:13.5px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin:14px 0}

.scroll{overflow-x:auto}

</style>

eto tiene dos partes. En el **bloque 1** contarás en un **cómic interactivo** lo que tu pantalla no te cuenta. En el **bloque 2** descubrirás qué es la IA y defenderás tu postura en un **debate académico**: ¿deberían los menores de 16 años usar la IA generativa?\n\nEn cada apartado tienes lecturas, actividades numeradas, comprobaciones con varios niveles y ayudas plegables. ¡Vamos!", "aprenderas": ["Qué riesgos para el **cuerpo** y la **mente** tiene el uso masivo de pantallas y cómo prevenirlos.", "Cómo proteger tu **privacidad** y tu **identidad** y qué hacer ante el **ciberacoso** o el **cibercontrol**.", "A crear un **cómic interactivo** y publicarlo de forma responsable, respetando las **licencias** y la **netiqueta**.", "Qué es la **inteligencia artificial**, quién era **Alan Turing** y cómo **aprende** una máquina.", "A detectar **bulos** y **deepfakes** y a usar la IA de forma **ética y sostenible**.", "A preparar y defender un **debate académico** con argumentos, evidencias y respeto."], "apartados": [{"id": "1", "titulo": "Bloque 1 · Lo que tu pantalla no te cuenta", "fase": "Bloque 1 · Inicio", "sesiones": [1], "intro": "En este bloque vas a mirar tus pantallas con otros ojos y a convertir lo que descubras en un **cómic interactivo** para redes.", "bloques": [{"tipo": "texto", "titulo": "🎬 Vídeo de presentación de la SdA", "texto": "En un minuto: los dos retos de la SdA, cómo usaremos Moodle y cuándo se entrega cada tarea.", "enlace": "video-presentacion-sda3.mp4"}, {"tipo": "texto", "titulo": "La ruta del bloque 1", "puntos": ["**1.1** ¿Cuánto te cuesta tu scroll? (sesión 1).", "**1.2** Cuerpo digital (sesión 2).", "**1.3** Mente digital: dependencia y apps que enganchan (sesión 3).", "**1.4** Cuando la red hace daño (sesiones 3 y 4).", "**1.5** Nuestro cómic interactivo (sesiones 4 y 5).", "**1.6** ¡Estreno! (sesión 6)."]}]}, {"id": "1.1", "titulo": "¿Cuánto te cuesta tu scroll?", "fase": "Bloque 1 · Inicio", "sesiones": [1], "intro": "Empezamos con una  cuello soporta unos **27 kg**. Sube el móvil a la altura de los ojos.", "👀 **Vista cansada** (síndrome visual informático): ojos secos y visión borrosa. **Regla 20-20-20**: cada 20 minutos, mira 20 segundos algo a unos 6 metros.", "👍 **Pulgar y muñeca**: dolor al escribir. Muñeca recta y pausas.", "🪑 **Sedentarismo** y 🌙 **sueño**: levántate cada hora y deja la pantalla una hora antes de dormir."]}, {"tipo": "actividad", "numero": "4", "titulo": "Auditoría ergonómica", "agrupamiento": "Parejas", "criterios": ["DIG.4.3.3"], "enunciado": "Revisad el puesto de cada uno con estos 8 puntos. Puntuad de 0 a 8, ajustad silla y pantalla y volved a puntuar.", "pasos": ["Pantalla a la altura de los ojos.", "Distancia de 50-70 cm.", "Espalda apoyada.", "Pies en el suelo.", "Codos a 90°.", "Muñecas rectas.", "Luz sin reflejos.", "Pausas cada 20 minutos."]}, {"tipo": "actividad", "numero": "5", "titulo": "Mi radiografía digital · Parte 1: Cuerpo", "agrupamiento": "Individual", "criterios": ["DIG.4.3.3"], "enunciado": "En tu copia de la plantilla **A1**, escribe **dos riesgos físicos** que reconoces en ti, con su causa, y **tres cambios concretos** que puedes hacer.", "entrega": "Tarea 3.1 · Mi radiografía digital (se entrega en la sesión 3)", "ayudas": [{"tipo": "pista", "titulo": "Un cambio concreto", "texto": "No vale «usar menos el móvil». Mejor: «Pongo el portátil a la altura de los ojos con dos libros debajo»."}]}]}, {"id": "1.3", "titulo": "Mente digital: dependencia y apps que enganchan", "fase": "Bloque 1 · Inicio", "sesiones": [3], "intro": "¿Usas tú el móvil o el móvil te usa a ti? Muchas apps están diseñadas para que no las sueltes.", "bloques": [{"tipo": "texto", "titulo": "Cinco palabras para entender tu mente digital", "puntos": ["**Tecnoestrés**: agobio por la sobrecarga de notificaciones y tareas digitales. **FOMO**: miedo a perderte algo.", "**Nomofobia**: miedo a estar sin móvil. **Phubbing**: ignorar a quien tienes delante por mirar el móvil.", "**Adicción**: el abuso de los dispositivos y servicios de internet puede llevar a la dependencia, y **ninguna adicción es buena**: todas tienen consecuencias en la salud física y mental. Entre jóvenes, las más frecuentes son a las **redes** y a los **juegos**.", "Señales de alarma: dejar de dormir, quedar o estudiar por la pantalla, enfadarse si no se puede usar o mentir sobre el tiempo de uso."]}, {"tipo": "video", "titulo": "Las consecuencias de ser adicto al móvil", "youtube": "https://www.youtube.com/watch?v=5HSCHQAmjo4", "texto": "Vídeo del REA «¿Controlas las redes?» (apartado 13, «Adicción»). Mira los tres primeros minutos.", "preguntas": ["¿Qué consecuencias físicas y mentales aparecen?", "¿Cuál te parece más fácil de evitar?"]}, {"tipo": "actividad", "numero": "6", "titulo": "Test anónimo de nomofobia", "agrupamiento": "Individual", "enunciado": "Responde el test **F2**. No es un diagnóstico y nadie verá tu resultado: sirve para pensar en tus hábitos.", "enlace": "https://forms.gle/QJ8EuqAkaqKT1HtCA"}, {"tipo": "actividad", "numero": "7", "titulo": "Caza de trucos en FlashTok", "agrupamiento": "Parejas", "criterios": ["DIG.4.3.3"], "enunciado": "Analizad la app inventada **FlashTok**: encontrad **cinco trucos** de diseño que enganchan y proponed un **contra-truco** para cada uno.", "pasos": ["Scroll infinito.", "Punto rojo de notificación.", "Rachas de días.", "Vídeo que empieza solo.", "Recompensa variable (como una tragaperras)."], "enlace": "https://florindotic.es/content/curso2026-2027/digitalizacion/4-eso/sda3/flashtok.html", "ayudas": [{"tipo": "pista", "titulo": "Contra-trucos que funcionan", "puntos": ["Desactivar las notificaciones que no sean de personas.", "Límites de uso en Bienestar digital o Tiempo de uso.", "Modo escala de grises.", "Móvil cargando fuera del dormitorio."]}]}], "ayudas": [{"tipo": "saber_mas", "titulo": "¿Quieres conocer tu nivel de enganche?", "texto": "El REA «¿Controlas las redes?» propone hacer en pareja un test rápido de enganche a las nuevas tecnologías y escribir una reflexión sobre el resultado: por qué lo habéis obtenido y si tiene consecuencias en vuestra vida.", "puntos": ["Test de Ora Teknologi Berriak: https://www.orainteknologiberriak.es/es/actividades/quieres-conocer-tu-nivel-de-enganche-a-las-nuevas-tecnologias/"]}]}, {"id": "1.4", "titulo": "Cuando la red hace daño", "fase": "Bloque 1 · Inicio", "sesiones": [3, 4], "intro": "Solo por estar conectado/a, corres riesgos que van más allá de un virus: perder tu **privacidad**, que alguien **se haga pasar por ti**, el **acoso** o el **control** de otra persona. Estas fichas están adaptadas del REA «¿Controlas las redes? No dejes que te controlen». Si tu cómic trata uno de estos temas, lee su ficha con calma.", "bloques": [{"tipo": "texto", "titulo": "📸 Privacidad: ¿me compartes esa foto?", "texto": "Quizá sin pensarlo pones a disposición de cualquiera demasiada información sobre ti o sobre tus amigos. Una foto de grupo también es de **todas las personas que salen en ella**: compartirla sin su permiso puede causarles problemas y vulnera su derecho a la propia imagen. Si hay demasiada información sobre ti en la red, tienes el **derecho al olvido**: puedes pedir a los buscadores y a las redes que la retiren. Y cuidado con las **wifi abiertas**: cualquiera que las controle puede ver tus conversaciones y tus contraseñas."}, {"tipo": "video", "titulo": "¿Es privado?", "youtube": "https://www.youtube.com/watch?v=MXf-YGQr6jI", "texto": "Vídeo del REA sobre las fotos de grupo que compartimos sin pensar.", "preguntas": ["¿Qué problema causa compartir la foto?", "¿Qué tendría que haber hecho antes de compartirla?"]}, {"tipo": "texto", "titulo": "🎭 Identidad digital y suplantación", "texto": "Tu **identidad digital** es todo lo que se publica sobre ti: lo que tú cuentas y haces en la red y lo que otras personas dicen de ti. La **suplantación de identidad** consiste en hacerse pasar por otra persona para hacer daño o sacar provecho: entrando en tus cuentas sin permiso o creando **perfiles falsos** con tus fotos y tus datos.", "puntos": ["Señales: tus contactos reciben mensajes que no has enviado, ves cambios raros en tus cuentas o en tus juegos online, o alguien usa tus fotos (puedes comprobarlo con una búsqueda inversa de imágenes).", "Qué hacer: avisa a tus contactos, denuncia el perfil en la red social para que lo elimine, guarda capturas y cuéntalo a un adulto; si hace falta, se puede denunciar."]}, {"tipo": "texto", "titulo": "😢 Ciberacoso", "texto": "El **ciberacoso** (o ciberbullying cuando ocurre entre compañeros/as) es dañar a una persona una y otra vez por medios digitales: mensajes, memes, exclusión de grupos, difusión de fotos… Quien **reenvía o se ríe** también participa. Dos formas especialmente graves: la **sextorsión** (amenazar con difundir imágenes íntimas para obligar a alguien a hacer algo) y el **grooming** (una persona adulta que se gana la confianza de un/a menor en la red, a menudo con un perfil falso, para obtener imágenes o un encuentro).", "puntos": ["No reenvíes ni contestes con insultos. Guarda pruebas (capturas).", "Bloquea y denuncia en la plataforma.", "Apoya a quien lo sufre y cuéntalo a un adulto de confianza.", "Nunca envíes imágenes íntimas y, si alguien te amenaza, no cedas: pide ayuda enseguida."]}, {"tipo": "video", "titulo": "Ciberbullying: qué es y cómo evitarlo", "youtube": "https://www.youtube.com/watch?v=Gfsuj6wlg8Y", "texto": "Vídeo del REA «¿Controlas las redes?» (apartado 7). Mira los cuatro primeros minutos.", "preguntas": ["¿Qué papeles aparecen (quien acosa, quien lo sufre, quien mira)?", "¿Qué puede hacer quien mira?"]}, {"tipo": "texto", "titulo": "🔒 Cibercontrol en la pareja", "texto": "El **cibercontrol** es el control abusivo que ejerce un miembro de la pareja sobre el otro a través del móvil y las redes: pedir las contraseñas, revisar los mensajes, exigir la ubicación, enfadarse si no contestas al momento o decirte con quién puedes hablar. Reduce tu libertad de movimiento, de relación y de expresión. **No es amor, es control**, y es una forma de violencia.", "puntos": ["Tus contraseñas y tus mensajes son tuyos.", "Si te pasa a ti o a alguien que conoces, habladlo con alguien de confianza. El 016 atiende la violencia de género."]}, {"tipo": "video", "titulo": "Cibercontrol", "youtube": "https://www.youtube.com/watch?v=Kfb1FpDipE8", "texto": "Vídeo del REA «¿Controlas las redes?» (apartado 11).", "preguntas": ["¿Qué conductas de control aparecen?", "¿Te parecen exageradas? ¿Por qué?"]}, {"tipo": "multinivel", "numero": "8", "titulo": "¿Sabes reaccionar?", "agrupamiento": "Individual", "criterios": ["DIG.4.3.3"], "enunciado": "Después de ver los casos de la sesión 3, elige **una opción** y resuélvela en tu cuaderno.", "opciones": [{"letra": "A", "titulo": "Recuerda", "proceso": "Recordar", "enunciado": "Elige la respuesta correcta.", "test": {"pregunta": "Tu pareja te pide la contraseña del móvil «para estar tranquila» y se enfada si no contestas al momento. ¿Qué es?", "opciones": ["Una muestra de amor", "Cibercontrol", "Suplantación de identidad", "Netiqueta"], "correcta": 1, "explicacion": "Pedir contraseñas, ubicación o respuesta inmediata es **cibercontrol**: limita tu libertad y es una forma de violencia."}}, {"letra": "B", "titulo": "Analiza", "proceso": "Analizar", "enunciado": "En un grupo de clase se reenvían memes para reírse de un compañero. Explica por qué quien solo reenvía también participa en el ciberacoso y qué consecuencias tiene para la víctima."}, {"letra": "C", "titulo": "Evalúa", "proceso": "Evaluar", "enunciado": "Alguien ha creado un perfil falso con tus fotos. Ordena de más a menos urgente estas acciones y justifica tu orden: avisar a tus contactos, denunciar el perfil, contárselo a un adulto, guardar capturas, responder al perfil falso."}], "ayudas": [{"tipo": "pista", "titulo": "Para la opción C", "texto": "Responder al perfil falso casi nunca ayuda. Piensa primero en guardar pruebas y en pedir ayuda."}]}], "ayudas": [{"tipo": "emociones", "titulo": "Si algo de esto te está pasando", "texto": "No es culpa tuya y no tienes que resolverlo solo/a. Cuéntaselo a tu familia, a tu tutor/a o al Departamento de Orientación. También puedes llamar gratis al **017** (INCIBE, ayuda en ciberseguridad) o a la **Fundación ANAR: 900 20 20 10** (24 horas)."}, {"tipo": "repaso", "titulo": "Repasa lo aprendido", "puntos": ["¿Por qué necesito permiso para compartir una foto de grupo?", "¿Cómo sabría que me han suplantado?", "¿Qué tres cosas haría ante un caso de ciberacoso?", "¿Qué conductas son cibercontrol?"]}]}, {"id": "1.5", "titulo": "Nuestro cómic interactivo", "fase": "Bloque 1 · Desarrollo", "sesiones": [4, 5], "intro": "Un dato se olvida; una historia, no. Vamos a convertir lo que sabes en un cómic con personaje, conflicto y final.", "bloques": [{"tipo": "actividad", "numero": "9", "titulo": "Elegimos tema e investigamos", "agrupamiento": "Parejas", "criterios": ["DIG.4.3.3"], "enunciado": "Elegid un tema (como máximo dos parejas por tema) y leed su ficha (apartados 1.2, 1.3 y 1.4). Anotad el **dato clave**, su **fuente** y **qué hacer** ante el problema.", "pasos": ["1 · Cuello, postura y vista cansada.", "2 · Sueño y pantallas.", "3 · Nomofobia, adicción y diseño que engancha.", "4 · Ciberacoso: no seas cómplice.", "5 · Privacidad y huella: ¿me compartes esa foto?", "6 · Suplantación de identidad y perfiles falsos.", "7 · Cibercontrol en la pareja."]}, {"tipo": "actividad", "numero": "10", "titulo": "Guion gráfico de 6 viñetas", "agrupamiento": "Parejas", "criterios": ["DIG.4.2.3"], "enunciado": "Planificad la historia viñeta a viñeta y marcad dónde irán **dos elementos interactivos** (ventana con dato, pregunta o botón «¿Qué harías tú?»).", "pasos": ["1 · Protagonista adolescente inventado/a y situación.", "2-3 · Conflicto: aparece el problema.", "4 · Giro: el dato real con su fuente.", "5 · Solución: un hábito sano o cómo reaccionar.", "6 · Llamada a la acción."], "enlace": "https://docs.google.com/document/d/1lRlzeGkBpvg2Se434h_mOsxUzdBOZ3GcmovHhNBCcj8/copy"}, {"tipo": "texto", "titulo": "Imágenes con licencia: fórmula TAFL", "texto": "Busca en **Openverse** con el filtro de licencia y cita cada imagen con su **T**ítulo, **A**utor/a, **F**uente y **L**icencia. Ejemplo: «Chica con móvil» · Ana Ruiz · Openverse · CC BY 2.0.", "puntos": ["Nada de personajes con copyright ni fotos de compañeros/as.", "Si usas una imagen generada con IA, indica «imagen generada con IA» y la herramienta."]}, {"tipo": "texto", "titulo": "Publicar con netiqueta", "texto": "La **netiqueta** es el conjunto de normas de buena educación para comportarse en la red. Como en la vida real, en las redes hay que respetar a los demás.", "puntos": ["Trata a los demás como quieres que te traten.", "No escribas en MAYÚSCULAS: equivale a gritar.", "No difundas rumores ni contenido de otras personas sin su permiso.", "Responde a las críticas con respeto y cita siempre las fuentes."]}, {"tipo": "video", "titulo": "Normas de netiqueta", "youtube": "https://www.youtube.com/watch?v=55H-1IOYz0c", "texto": "Vídeo del REA «¿Controlas las redes?» (apartado 15).", "preguntas": ["¿Qué tres normas aplicaréis al texto de vuestra publicación?"]}, {"tipo": "actividad", "numero": "11", "titulo": "Producción del cómic y versión para redes", "agrupamiento": "Parejas", "criterios": ["DIG.4.2.3", "DIG.4.3.3", "DIG.4.4.1"], "enunciado": "Montad en Genially las viñetas 2-6, al menos **dos interacciones** y la **página de créditos**. Después, el **carrusel** de 4 imágenes (1080 × 1350 px) con portada, texto de la publicación y **texto alternativo**.", "entrega": "Tarea 3.2 · Cómic digital interactivo y versión para redes", "ayudas": [{"tipo": "pista", "titulo": "Antes de entregar", "puntos": ["Historia completa con dato y fuente.", "Interacciones que funcionan.", "Carrusel accesible (contraste, letra grande, texto alternativo).", "Créditos completos y licencia CC BY-SA del cómic.", "Texto de la publicación con netiqueta."]}]}]}, {"id": "1.6", "titulo": "¡Estreno!", "fase": "Bloque 1 · Cierre", "sesiones": [6], "intro": "Hoy es el estreno: visitaremos los cómics de toda la clase y cada pareja presentará el suyo.", "bloques": [{"tipo": "actividad", "numero": "12", "titulo": "Paseo de galería: dos estrellas y un deseo", "agrupamiento": "Individual", "enunciado": "Visita cada cómic, prueba sus interacciones y deja en el formulario **F3** dos cosas que funcionan y una mejora concreta.", "enlace": "https://forms.gle/mY6ZWC8vV3njvxro7"}, {"tipo": "actividad", "numero": "13", "titulo": "Presentamos nuestro cómic", "agrupamiento": "Parejas", "tiempo": "1,5 min", "criterios": ["DIG.4.2.3", "DIG.4.3.3"], "enunciado": "Presentad el cómic respondiendo a tres preguntas.", "pasos": ["¿Qué problema de salud o de las redes contamos y qué lo causa?", "¿Cuál es el dato clave y de dónde sale?", "¿Qué hábito o respuesta proponemos?"], "ayudas": [{"tipo": "emociones", "titulo": "Si te pone nervioso/a hablar", "texto": "Repartíos las preguntas con tu pareja o encárgate de manejar el cómic proyectado. Respira, habla despacio y mira a una persona amiga."}]}, {"tipo": "actividad", "numero": "14", "titulo": "Mi compromiso", "agrupamiento": "Individual", "enunciado": "Escribe en el formulario **F4** un hábito saludable que te comprometes a mantener las próximas semanas.", "enlace": "https://forms.gle/14yGNMkaZ4iKNifu5"}]}, {"id": "2", "titulo": "Bloque 2 · ¿IA generativa para menores?", "fase": "Bloque 2 · Inicio", "sesiones": [7], "intro": "La IA ya forma parte de tu vida. En este bloque descubrirás qué es y cómo aprende, analizarás sus luces y sombras y lo debatirás.", "bloques": [{"tipo": "texto", "titulo": "La ruta del bloque 2", "puntos": ["**2.1** ¿Qué es la inteligencia artificial? (sesión 7).", "**2.2** ¿Real o generado? (sesión 8).", "**2.3** ¿Quién paga la IA? (sesión 9).", "**2.4** Prepara el debate (sesiones 10 y 11).", "**2.5** El gran debate (sesión 12)."]}]}, {"id": "2.1", "titulo": "¿Qué es la inteligencia artificial?", "fase": "Bloque 2 · Inicio", "sesiones": [7], "intro": "Contenidos adaptados del REA «Hola, ¿necesitas ayuda?». En lugar de darte una definición, vamos a repasar su historia, conocer a **Alan Turing** y entender cómo **aprende** una máquina.", "bloques": [{"tipo": "video", "titulo": "¿Necesitas un corte de pelo?", "youtube": "https://www.youtube.com/watch?v=NW7bTGGmDNw", "texto": "Un asistente de voz llama a una peluquería para pedir cita (Google Duplex).", "preguntas": ["¿Te ha parecido una conversación real?", "¿Has sabido distinguir con claridad a la persona de la máquina?", "¿Qué te ha llamado más la atención?"]}, {"tipo": "texto", "titulo": "Un poco de historia", "texto": "La **inteligencia artificial** se encarga de crear programas que permiten a una máquina imitar el comportamiento de la mente humana. No es algo tan reciente ni obra de una sola persona:", "puntos": ["**1950**: Alan Turing, matemático inglés considerado el padre de la IA, propone el **test de Turing**: una máquina lo supera si en una conversación no sabemos distinguirla de una persona.", "**1956**: en un congreso en Dartmouth (Estados Unidos) se usa por primera vez el nombre «inteligencia artificial».", "**1966**: ELIZA, el primer chatbot, simula una conversación con una psicóloga.", "**2016**: AlphaGo gana al campeón mundial de go, un juego con más combinaciones que el ajedrez. Hoy los chatbots y la IA generativa están en el móvil."], "ayudas": [{"tipo": "saber_mas", "titulo": "Alan Turing", "texto": "Durante la Segunda Guerra Mundial, Turing ayudó a descifrar los mensajes de la máquina alemana **Enigma**. Su «máquina universal» es la base de los ordenadores actuales. Fue perseguido por ser homosexual y el Reino Unido le pidió perdón en 2009. Busca también quién es **Eugene Goostman**: no te dejará indiferente."}]}, {"tipo": "texto", "titulo": "Datos, algoritmos y aprendizaje", "texto": "Imagina que tienes que enseñar a alguien que nunca ha visto un perro qué es un perro. Le das **datos**: imágenes, características (cuatro patas, rabo, pelo) y comportamientos (ladra, buen olfato). Con una máquina pasa algo parecido.", "puntos": ["Los **datos** alimentan a la IA: cuantos más y de más calidad, mejor aprende.", "El **algoritmo** relaciona los datos y crea un **modelo** que da respuestas.", "Gracias a la **generalización**, el modelo reconoce casos nuevos aunque no coincidan exactamente con los datos iniciales.", "Si le enseñas un perro muy distinto (un **puli**, con rastas), se equivoca. Lo añades como dato, el algoritmo crea un nuevo modelo y ya lo reconoce. Eso es el **aprendizaje automático** o *machine learning*."], "ayudas": [{"tipo": "repaso", "titulo": "Lectura facilitada", "puntos": ["Los datos son información sobre una persona o una cosa.", "El algoritmo es un programa que relaciona los datos y crea un modelo.", "La máquina reconoce datos nuevos buscando coincidencias con los antiguos.", "Si se equivoca, se le dan más datos y vuelve a aprender."]}]}, {"tipo": "texto", "titulo": "¿Y la IA generativa?", "texto": "La **IA generativa** usa modelos entrenados con enormes cantidades de datos (también nuestros) para **crear** textos, imágenes, voces y vídeos. **Predice** lo más probable: no «sabe» ni «siente», y puede **inventar** datos con total seguridad (alucinaciones). ChatGPT no está destinado a menores de 13 años y de 13 a 17 pide consentimiento familiar."}, {"tipo": "video", "titulo": "El futuro es apasionante: Nuria Oliver", "youtube": "https://www.youtube.com/watch?v=ZgKAII5UIxg", "texto": "La investigadora española Nuria Oliver, Premio Nacional de Informática 2016, habla de las aplicaciones de la IA (vídeo del REA «Hola, ¿necesitas ayuda?»).", "preguntas": ["Anota dos aplicaciones de la IA que aparecen.", "¿Qué ventajas e inconvenientes menciona?"]}, {"tipo": "multinivel", "numero": "15", "titulo": "¿Cómo aprende una máquina?", "agrupamiento": "Individual", "criterios": ["DIG.4.4.4"], "enunciado": "Comprueba lo que has aprendido eligiendo **una opción**.", "opciones": [{"letra": "A", "titulo": "Recuerda", "proceso": "Recordar", "enunciado": "Elige la respuesta correcta.", "test": {"pregunta": "¿Qué propuso Alan Turing en 1950?", "opciones": ["El primer teléfono móvil", "Una prueba para saber si una máquina se hace pasar por una persona", "La primera red social", "El primer videojuego"], "correcta": 1, "explicacion": "El **test de Turing** mide si una máquina puede hacerse pasar por una persona en una conversación."}}, {"letra": "B", "titulo": "Comprende", "proceso": "Comprender", "enunciado": "Explica con tus palabras qué son los **datos**, el **modelo** y la **generalización**, usando un ejemplo distinto al del perro."}, {"letra": "C", "titulo": "Evalúa", "proceso": "Evaluar", "enunciado": "Un filtro de belleza funciona peor con las personas de piel oscura porque casi todas las fotos con las que se entrenó eran de personas de piel clara. ¿De quién es la responsabilidad y qué habría que cambiar? Justifícalo."}]}, {"tipo": "actividad", "numero": "16", "titulo": "Mapa del dilema", "agrupamiento": "Equipo", "criterios": ["DIG.4.4.4"], "enunciado": "En cada dimensión, escribid **un beneficio**, **un riesgo** y **quién gana o pierde** si los menores usan la IA generativa.", "pasos": ["📘 Aprender.", "♿ Accesibilidad e inclusión.", "🎨 Creatividad y autoría.", "🔒 Privacidad y datos.", "💛 Salud emocional y relaciones.", "🌍 Planeta (energía y agua)."], "enlace": "https://docs.google.com/document/d/1lNfWS3J8vk45S6EmQH6JyLTgNebrbt8GcbynJkSPe6U/copy"}]}, {"id": "2.2", "titulo": "¿Real o generado? Cazabulos y deepfakes", "fase": "Bloque 2 · Desarrollo", "sesiones": [8], "intro": "Con la IA, una foto, un audio o un vídeo ya no son prueba de nada. Antes de compartir, comprueba.", "bloques": [{"tipo": "texto", "titulo": "Kit del verificador/a", "puntos": ["1 · **Para**: no lo compartas todavía.", "2 · **Busca señales**: manos y dedos raros, textos deformados, sombras imposibles, voz plana, falta de fuente.", "3 · **Búsqueda inversa** con Google Lens y 4 · **verificadores**: Maldita.es, Newtral, EFE Verifica.", "5 · **Comprueba en otra fuente** lo que dice un chatbot. Y si lo corriges, sin humillar."]}, {"tipo": "texto", "titulo": "Las 12 tarjetas de casos", "texto": "El docente os dará un número. Investigad vuestra tarjeta con el kit y completad la ficha Cazabulos. Describid las imágenes con palabras: no copiéis fotos de personas reales.", "puntos": ["**1 · La foto viral del papa con un enorme abrigo de plumas blanco**: En marzo de 2023 millones de personas compartieron una foto del papa Francisco con un plumífero blanco de diseño, como de pasarela.", "**2 · Fotos de Donald Trump detenido por la policía**: En marzo de 2023 circularon imágenes de Trump forcejeando con policías en Nueva York y siendo arrastrado.", "**3 · Una explosión junto al Pentágono**: En mayo de 2023 se compartió en X la foto de una gran columna de humo al lado del Pentágono (Estados Unidos).", "**4 · Una canción nueva de Drake y The Weeknd**: En 2023 se hizo viral «Heart on My Sleeve», con las voces de estos dos cantantes famosos.", "**5 · Una llamada con la voz del presidente de Estados Unidos**: En enero de 2024 miles de votantes de New Hampshire recibieron una llamada con la voz de Joe Biden pidiéndoles que no votaran en las primarias.", "**6 · Un presentador famoso te recomienda invertir**: Un anuncio en redes muestra a un presentador de televisión conocido diciendo que se ha hecho rico con una plataforma de inversión.", "**7 · «La IA ya piensa y siente como una persona»**: Un titular asegura que un chatbot ha desarrollado sentimientos y conciencia.", "**8 · Una frase célebre que da un chatbot**: Le pides a un chatbot una cita de un científico para tu trabajo y te la da con libro y página.", "**9 · «Preguntar a la IA gasta lo mismo que buscar en Google»**: Un vídeo de TikTok afirma que usar un chatbot no consume más energía que una búsqueda normal.", "**10 · Foto de una nave llena de servidores**: Una foto muestra pasillos enormes con miles de ordenadores iluminados y se dice que es un centro de datos.", "**11 · «Borra tus correos antiguos y salvarás el planeta»**: Un mensaje en cadena asegura que borrar correos y fotos viejas ahorra muchísima agua y energía.", "**12 · «Si el detector dice que es IA, es que es IA»**: Una profesora pasa una redacción por un detector de textos de IA y le sale «98 % escrito por IA»."]}, {"tipo": "actividad", "numero": "17", "titulo": "Foro Cazabulos", "agrupamiento": "Parejas", "criterios": ["DIG.4.4.1"], "enunciado": "Verificad vuestro caso con el kit y publicadlo en el foro de Moodle con un titular, el veredicto (verdad, bulo, generado con IA o con matices), dos fuentes y cómo lo habéis comprobado. Responded con respeto a otra pareja.", "ayudas": [{"tipo": "pista", "titulo": "Normas del foro", "texto": "No subáis imágenes de personas reales ni de compañeros/as: describidlas y enlazad la fuente."}]}], "ayudas": [{"tipo": "emociones", "titulo": "Deepfakes de personas reales", "texto": "Crear o difundir un deepfake daña a la víctima aunque sea «en broma», y si es sexual es delito. Si te pasa: no lo compartas, guarda pruebas, cuéntalo a un adulto, pide la retirada en el **Canal prioritario de la AEPD** y llama al **017** o a **ANAR (900 20 20 10)**."}]}, {"id": "2.3", "titulo": "¿Quién paga la IA?", "fase": "Bloque 2 · Desarrollo", "sesiones": [9], "intro": "La IA parece gratis, pero tiene facturas: sesgos, autoría, privacidad y planeta.", "bloques": [{"tipo": "texto", "titulo": "Cuatro facturas de la IA", "puntos": ["⚖️ **Sesgos**: aprende de datos con prejuicios y los repite (recuerda el perro puli).", "©️ **Autoría**: imita a artistas sin permiso ni pago.", "🔒 **Privacidad**: tus textos y fotos pueden entrenar modelos.", "🌍 **Planeta**: los centros de datos podrían gastar unos 945 TWh en 2030, más del doble que en 2024 (AIE, 2025)."]}, {"tipo": "texto", "titulo": "Las 12 tarjetas del tribunal", "texto": "Vuestro equipo analizará el caso que os dé el docente con las cuatro preguntas del tribunal.", "puntos": ["**1 · Un filtro que «embellece»** (Sesgo e igualdad): Una app de fotos tiene un filtro de belleza que aclara la piel, afina la nariz y agranda los ojos. Millones de adolescentes lo usan cada día.", "**2 · Al estilo de una ilustradora** (Autoría y trabajo): Una web genera ilustraciones «al estilo de» una dibujante conocida escribiendo su nombre. Ella nunca dio permiso ni cobra nada; sus encargos han bajado.", "**3 · La app gratis que lo guarda todo** (Privacidad y datos): Una app de IA gratuita para hacer los deberes guarda todo lo que le escribes (también fotos y datos personales) para entrenar su modelo.", "**4 · Un centro de datos en una comarca con sequía** (Huella ambiental): Una gran empresa tecnológica proyecta un centro de datos para IA en una comarca española con restricciones de agua. Promete empleo; parte del vecindario protesta.", "**5 · Un amigo que siempre te da la razón** (Salud emocional): Una adolescente habla cada noche durante horas con un chatbot «amigo» que nunca le lleva la contraria. Cada vez queda menos con sus amistades.", "**6 · Elegir trabajadores con IA** (Sesgo e igualdad): Una gran empresa tecnológica probó una IA para filtrar currículos. Como aprendió de contrataciones antiguas, penalizaba los que incluían la palabra «mujer». La empresa la abandonó en 2018.", "**7 · Una cámara que no te reconoce** (Sesgo y derechos): Un estudio de 2018 («Gender Shades», del MIT) comprobó que varios sistemas de reconocimiento facial fallaban mucho más con mujeres de piel oscura que con hombres de piel clara.", "**8 · Imágenes falsas de compañeras** (Intimidad y dignidad): En 2023, en Almendralejo, unos menores usaron una app de IA para crear imágenes falsas de desnudos de compañeras a partir de fotos de sus redes. Fueron condenados.", "**9 · Acusado por un detector** (Justicia e igualdad): Un alumno escribe solo su redacción, pero un detector de IA dice que es «98 % IA» y le ponen un cero. Él escribe en español como segunda lengua.", "**10 · Voces clonadas** (Autoría y trabajo): Una plataforma clona con IA las voces de actores y actrices de doblaje para doblar nuevas series sin volver a contratarlos ni pagarles.", "**11 · El programa que decide las ayudas** (Transparencia): Un programa informático de la Administración decide quién recibe una ayuda en la factura de la luz (el bono social). Una fundación lleva años pidiendo en los tribunales conocer su código porque cree que se equivoca.", "**12 · La IA que lee mamografías** (Beneficios y responsabilidad): Un hospital usa una IA que detecta antes algunos cánceres de mama y salva vidas. Un día no avisa de un caso y nadie sabe si la responsabilidad es del hospital, de la empresa o del médico."]}, {"tipo": "actividad", "numero": "18", "titulo": "Tribunal de casos", "agrupamiento": "Equipo", "criterios": ["DIG.4.4.4"], "enunciado": "Analizad vuestro caso con cuatro preguntas y preparad un minuto de exposición.", "pasos": ["¿Quién gana?", "¿Quién pierde?", "¿Qué derecho está en juego?", "¿Qué proponemos?"], "enlace": "https://docs.google.com/document/d/1Q9gvNAL_mZhGF75Uqzv9qRA4k-5FtTVMybbc2KaIL7o/copy"}, {"tipo": "actividad", "numero": "19", "titulo": "Mi código ético de la IA", "agrupamiento": "Individual", "criterios": ["DIG.4.4.1"], "enunciado": "Escribe en la plantilla **A2** cinco normas personales para usar la IA generativa y responde al dilema: «Tu grupo quiere hacer un meme con la cara de un profesor generada con IA. ¿Qué haces?».", "entrega": "Tarea 3.3 · Mi código ético de la IA", "ayudas": [{"tipo": "pista", "titulo": "Ideas para tus normas", "puntos": ["Para qué sí la usaré y para qué no.", "Indicaré cuándo un trabajo lleva ayuda de IA.", "No meteré datos personales ni fotos de otras personas.", "Comprobaré lo que dice.", "Evitaré generar imágenes o vídeos sin necesidad."]}]}]}, {"id": "2.4", "titulo": "Prepara el debate", "fase": "Bloque 2 · Desarrollo", "sesiones": [10, 11], "intro": "Un **debate** es una discusión organizada entre personas que opinan de manera diferente. Usamos las palabras para que los demás comprendan nuestras ideas, para defendernos de ideas dañinas con argumentos sólidos y para valorar otros puntos de vista. **Lo importante no es ganar, sino acercar posturas.** Este apartado sigue la «Guía para el debate académico en el aula» del Proyecto REA/DUA Andalucía.", "bloques": [{"tipo": "texto", "titulo": "🎬 Vídeo: el gran debate académico", "texto": "Resumen del debate en 7 minutos: el reto, los equipos y la mesa, el papel de cada rol, los tiempos y cómo construir argumentos ARE. Mientras lo ves, apunta qué hace tu rol y cuánto tiempo tiene.", "enlace": "video-gran-debate.mp4"}, {"tipo": "texto", "titulo": "Orden de intervenciones", "puntos": ["1 · **Introductores/as**: primero el del equipo a favor y después el del equipo en contra (1,5 min cada uno).", "2 · **Refutadores/as 1**: a favor y en contra (2 min). 3 · **Refutadores/as 2**: a favor y en contra (2 min).", "4 · **Conclusores/as**: a favor y en contra (1,5 min).", "Durante el debate, el equipo se comunica **solo por escrito**. Para preguntar al otro equipo, **levanta la mano** (puede que no acepten la pregunta)."]}, {"tipo": "texto", "titulo": "⏱️ Cronómetro del debate", "texto": "Para ensayar en casa o en clase: elige la ronda «Ensayo (sesión 11)», pulsa **Espacio** para empezar y **→** para pasar de turno. Te avisa a 30 segundos del final y te dice qué toca en cada turno.", "enlace": "cronometro-debate.html"}, {"tipo": "texto", "titulo": "🎬 Rol introductor/a", "texto": "Abre el debate. Su intervención tiene estos elementos:", "puntos": ["**Exordio**: historia, noticia o anécdota que llama la atención y apunta a vuestra tesis. Después, presentación del equipo.", "**Statu quo**: la situación o el problema que provoca el debate.", "Análisis de la moción y **definición de sus términos**; vuestra **tesis** en una frase corta.", "Vuestros **argumentos** (2 o 3, brevemente) y una **conclusión** que conecta con el exordio."]}, {"tipo": "texto", "titulo": "🥊 Roles refutador/a 1 y 2", "puntos": ["**Refutador/a 1**: empieza con una **cita o sentencia**, hace una **crítica inicial** de los argumentos del otro equipo, desarrolla **dos de vuestros tres argumentos**, responde una o dos preguntas y anuncia lo que dirá su compañero/a.", "**Refutador/a 2**: hace una **crítica extensa** de los argumentos del otro equipo, desarrolla el **último argumento**, responde preguntas y termina con una cita o sentencia."]}, {"tipo": "texto", "titulo": "🏁 Rol conclusor/a", "puntos": ["Agradece a la organización y al otro equipo.", "Expone el **principal error** de la argumentación del otro equipo.", "Repasa cómo se han refutado sus argumentos y por qué los vuestros **siguen en pie**.", "Termina con una **moraleja** o una frase brillante que recuerda vuestra tesis y enlaza con el exordio."], "ayudas": [{"tipo": "repaso", "titulo": "Lectura facilitada de los roles", "puntos": ["El introductor/a empieza el debate: cuenta algo interesante, presenta al equipo, explica el problema y la idea del equipo.", "El refutador/a 1 dice una frase sobre el tema, critica al otro equipo, dice 2 ideas del equipo y responde.", "El refutador/a 2 dice las malas ideas del otro equipo, explica la última idea del equipo y responde.", "El conclusor/a da las gracias, dice el error del otro equipo, nombra las ideas de su equipo y dice una frase importante."]}]}, {"tipo": "multinivel", "numero": "20", "titulo": "¿Conoces los roles del debate?", "agrupamiento": "Individual", "criterios": ["DIG.4.4.4"], "enunciado": "Elige **una opción**.", "opciones": [{"letra": "A", "titulo": "Recuerda", "proceso": "Recordar", "enunciado": "Elige la respuesta correcta.", "test": {"pregunta": "¿Quién habla justo después del introductor/a del equipo a favor?", "opciones": ["El refutador/a 1 a favor", "El introductor/a en contra", "El conclusor/a a favor", "El moderador/a"], "correcta": 1, "explicacion": "Las intervenciones alternan: introductor/a a favor, introductor/a en contra, y después los refutadores/as en el mismo orden."}}, {"letra": "B", "titulo": "Compara", "proceso": "Analizar", "enunciado": "Explica en qué se diferencian el trabajo del refutador/a 1 y el del refutador/a 2, y por qué crees que la guía los reparte así."}, {"letra": "C", "titulo": "Evalúa", "proceso": "Evaluar", "enunciado": "Lee esta conclusión: «Gracias. Nosotros tenemos razón y ellos no. Fin». ¿Qué elementos le faltan según la guía? Reescríbela."}]}, {"tipo": "texto", "titulo": "Busca información y evidencias", "texto": "Busca información **a favor y en contra**: sé **riguroso/a**, **contrasta** la información y usa fuentes **fiables**. Por cada evidencia a favor, podéis encontrar otra en contra. Después decidid la **tesis** o línea argumental y redactad los argumentos con la estructura **ARE**: una **afirmación** clara y precisa, **razonada** y apoyada en **evidencias**.", "puntos": ["👩‍🔬 **Autoridad**: cita o opinión de una persona experta.", "💡 **Ejemplo**: ilustra de manera sencilla lo que explicas.", "📰 **Hecho**: una realidad conocida y aceptada.", "📊 **Dato**: información concreta y exacta; con una fuente reconocida, es el argumento más sólido."]}, {"tipo": "actividad", "numero": "21", "titulo": "Guía del debate", "agrupamiento": "Equipo", "criterios": ["DIG.4.4.4", "DIG.4.4.1"], "enunciado": "Completad la plantilla **A3** en dos sesiones.", "pasos": ["**Sesión 10 · Parte 1**: búsqueda de argumentos (3 a favor y 3 en contra, con evidencia y fuente).", "**Sesión 10 · Parte 2**: tesis de cada postura y posibles refutaciones de cada argumento.", "**Sesión 11 · Parte 3**: discurso del introductor/a para las dos posturas.", "**Sesión 11 · Parte 4**: guion de refutadores/as y conclusor/a (o de moderación) y **Parte 5**: propuesta de uso responsable."], "entrega": "Tarea 3.4 · Guía del debate: IA generativa y menores", "ayudas": [{"tipo": "pista", "titulo": "Redacta la introducción y la conclusión", "texto": "La **introducción** es una declaración de intenciones: resume vuestros argumentos y presenta al equipo. La **conclusión** debe tener una **redacción abierta**: dejad hueco para añadir los errores del otro equipo durante el debate."}, {"tipo": "pista", "titulo": "Ejemplo de tesis y de refutación prevista", "puntos": ["Tesis a favor: «Hasta los 16 años, la IA generativa hace más daño que bien: primero hay que proteger y después enseñar».", "Tesis en contra: «Prohibir no protege: lo que protege es aprender a usarla con normas y supervisión».", "Refutación prevista: «El problema son las personas, no la herramienta» → «Por eso mismo: si aún no se miden las consecuencias, no se debe dar una herramienta tan potente»."]}]}, {"tipo": "texto", "titulo": "Herramientas para el discurso", "texto": "Los **conectores** relacionan las ideas y los **marcadores** muestran lo que piensas y sientes.", "puntos": ["Empezar y ordenar: en primer lugar, para empezar, a continuación, por una parte… por otra parte, finalmente.", "Añadir y oponer: además, asimismo; pero, sin embargo, no obstante, por el contrario, aunque.", "Causa y consecuencia: por eso, ya que, puesto que, en consecuencia. Concluir: en resumen, como conclusión.", "Opinar y matizar: en mi opinión, considero que, de hecho, evidentemente, dudo que, es probable que, es decir, por ejemplo."]}, {"tipo": "actividad", "numero": "22", "titulo": "Nos autoevaluamos", "agrupamiento": "Individual", "enunciado": "Después del ensayo de la sesión 11, responde el formulario **F6**: marca lo que has hecho y escribe una **propuesta de mejora**. Conoce tus puntos fuertes y trabaja para mejorar el resto."}]}, {"id": "2.5", "titulo": "El gran debate", "fase": "Bloque 2 · Cierre", "sesiones": [12], "intro": "Llegó el día. Recuerda: se valora cómo argumentas, no qué postura te toca.", "bloques": [{"tipo": "texto", "titulo": "Principios para un buen debate", "puntos": ["1 · Escucha con atención al otro equipo. 2 · Explica tus argumentos con pruebas (datos y ejemplos).", "3 · Responde al equipo contrario: si la pregunta es difícil, relaciónala con algo que sepas. 4 · Céntrate en el tema.", "5 · Explica muy bien tus argumentos. 6 · Sé claro/a: habla con calma para que todo el mundo te oiga.", "7 · No mientas, no interrumpas ni digas cosas desagradables. 8 · Juega limpio: habla cuando te toque, respeta a la moderación y al jurado y, si gana el otro equipo, ¡felicítalo!"]}, {"tipo": "texto", "titulo": "⏱️ El cronómetro del debate", "texto": "El cronometrador/a proyecta el cronómetro del debate: verás quién habla, cuánto tiempo le queda y la tarjeta de 30 segundos. Si te pasas, el reloj sigue contando en rojo.", "enlace": "cronometro-debate.html"}, {"tipo": "actividad", "numero": "23", "titulo": "El debate en escena", "agrupamiento": "Equipo", "criterios": ["DIG.4.4.4", "DIG.4.4.1"], "enunciado": "Defended la postura que os toque en el sorteo, cada persona en su rol y en su turno. Cuando no debatáis, sois **público-jurado**.", "pasos": ["Ficha del jurado (1 a 4): introducción · argumentos con evidencias · refutación · conclusión · respeto.", "Anotad el mejor argumento de cada postura, la mejor muestra de respeto y un acuerdo entre las dos posturas."], "enlace": "https://docs.google.com/document/d/1QZoYzrR4OlxA1GRS_TiY6gr9yvthv14-G6E9BXx-PEQ/copy"}, {"tipo": "actividad", "numero": "24", "titulo": "Cierre de la SdA", "agrupamiento": "Individual", "enunciado": "Vota de nuevo, compara con las sesiones 1 y 7 y responde el formulario **F5**: tu hábito digital, cómo ves ahora la IA, tu autoevaluación y tu valoración de la SdA.", "enlace": "https://forms.gle/fFNUjtyXrQGfgzW28"}], "ayudas": [{"tipo": "emociones", "titulo": "¿Cómo te has sentido?", "texto": "Seguro que algunas cosas te han resultado fáciles y otras más difíciles. Fallar forma parte de aprender. ¡Enhorabuena por todo lo que has conseguido!"}]}]}, "fases": [{"nombre": "Bloque 1 · I }
function apartado(a){
  const k = pageKey(a);
  let h = `<div class="page-h" style="--fc:${fcol(a.fase)}"><div class="k">${esc(a.fase || '')}${a.sesiones ? ' · ' + sesTxt(a.sesiones) : ''}</div><h2>${esc(a.id)}. ${esc(a.titulo)}</h2></div>`;
  if (a.intro) h += B.narrador({texto: a.intro, icono: a.icono || G.icono});
  arr(a.bloques).forEach((b, j) => { const f = B[b.tipo]; if (f) h += f(b, k + '-' + j); });
  h += ayudas(a.ayudas);
  return `<div style="--fc:${fcol(a.fase)}">${h}</div>`;
}
function creditos(){
  const C = D.creditos || {}, o = C.original || {}, A = C.adaptacion || {}, L = C.licencia || {};
  let h = `<div class="page-h"><div class="k">Licencia y autoría</div><h2>Créditos</h2></div>`;
  if (o.titulo) h += `<div class="card"><h3>Recurso original</h3><p>Esta situación de aprendizaje es una adaptación de <b>«${esc(o.titulo)}»</b>${o.organizacion ? ' (' + esc(o.organizacion) + ')' : ''}.</p>
    <div class="scroll"><table class="tbl"><tbody>${arr(o.personas).map(x=>`<tr><th>${esc(x.funcion)}</th><td>${esc(x.nombres)}</td></tr>`).join('')}${o.version ? `<tr><th>Versión original</th><td>${esc(o.version)}</td></tr>` : ''}</tbody></table></div></div>`;
  if (A.autoria || A.cambios) h += `<div class="card"><h3>Adaptación</h3>${A.autoria ? `<p><b>${esc(A.autoria)}</b>${A.fecha ? ' · ' + esc(A.fecha) : ''}</p>` : ''}${A.cambios ? paras(A.cambios) : ''}</div>`;
  if (L.nombre) h += `<div class="card"><h3>Licencia</h3><p>${L.url ? `<a href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.nombre)}</a>` : esc(L.nombre)}</p>${L.nota ? paras(L.nota) : ''}${o.cita ? `<p class="note">${esc(o.cita)}</p>` : ''}</div>`;
  if (arr(C.recursos).length) h += `<div class="card"><h3>Recursos de terceros</h3><div class="scroll"><table class="tbl"><thead><tr><th>Recurso</th><th>Autoría</th><th>Licencia</th></tr></thead><tbody>${C.recursos.map(r=>`<tr><td>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.elemento)}</a>` : esc(r.elemento)}</td><td>${esc(r.autoria)}</td><td>${esc(r.licencia)}</td></tr>`).join('')}</tbody></table></div></div>`;
  return h;
}
const PAGES = [{k:'inicio', t:'Inicio', r:inicio}].concat(APS.map(a => ({k:pageKey(a), t:`${a.id}. ${a.titulo}`, a, r:() => apartado(a)})))
  .concat(D.creditos ? [{k:'creditos', t:'Créditos', r:creditos}] : []);

function toc(cur){
  let h = '', fz = null;
  PAGES.forEach(p => {
    if (p.a && p.a.fase !== fz) { fz = p.a.fase; h += `<div class="fz" style="--fc:${fcol(fz)}">${esc(fz || '')}</div>`; }
    if (!p.a && p.k === 'creditos') h += '<div class="fz">&nbsp;</div>';
    const depth = p.a ? String(p.a.id).split('.').length - 1 : 0;
    h += `<a href="#${p.k}" class="${p.k === cur ? 'on' : ''} ${depth === 1 ? 'sub' : depth > 1 ? 'sub2' : ''}" style="--fc:${p.a ? fcol(p.a.fase) : 'var(--brand)'}">${esc(p.t)}</a>`;
  });
  $('#toc').innerHTML = h;
}
function show(k){
  const i = Math.max(0, PAGES.findIndex(p => p.k === k)), p = PAGES[i], pv = PAGES[i-1], nx = PAGES[i+1];
  $('#app').innerHTML = `<div class="page">${p.r()}</div><div class="pager">${pv ? `<a href="#${pv.k}"><small>← Anterior</small>${esc(pv.t)}</a>` : ''}${nx ? `<a class="r" href="#${nx.k}"><small>Siguiente →</small>${esc(nx.t)}</a>` : ''}</div>`;
  $('#ttl').textContent = p.k === 'inicio' ? (D.meta.titulo || '') : p.t;
  toc(p.k); document.body.classList.remove('menu'); window.scrollTo(0, 0); setHash('#' + p.k);
}
function printAll(){ $('#app').innerHTML = PAGES.map(p => `<div class="page">${p.r()}</div>`).join(''); document.querySelectorAll('details').forEach(d => d.open = true); window.print(); }

// --------------------------------------------------- eventos
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a) { const k = a.getAttribute('href').slice(1); if (PAGES.some(p => p.k === k)) { e.preventDefault(); try { history.pushState(null, '', '#' + k); } catch(_) {} show(k); } return; }
  const t = e.target.closest('[data-ml]');
  if (t) { const key = t.dataset.ml, j = +t.dataset.j; store[key + '-o'] = j; save();
    document.querySelectorAll(`[data-ml="${key}"]`).forEach(x => x.setAttribute('aria-selected', +x.dataset.j === j));
    document.querySelectorAll(`[data-mlo="${key}"]`).forEach(x => x.classList.toggle('on', +x.dataset.j === j)); return; }
  const c = e.target.closest('[data-check]');
  if (c) { const q = c.closest('.quiz'), ok = q.dataset.ok.split(',').map(Number), fb = q.querySelector('.fb');
    const marked = [...q.querySelectorAll('input')].filter(x => x.checked).map(x => +x.value);
    q.querySelectorAll('label').forEach((l, j) => { l.classList.remove('ok','ko'); if (ok.includes(j)) l.classList.add('ok'); else if (marked.includes(j)) l.classList.add('ko'); });
    const bien = marked.length === ok.length && marked.every(x => ok.includes(x));
    fb.className = 'fb on ' + (bien ? 'ok' : 'ko');
    fb.innerHTML = (bien ? '<b>¡Muy bien!</b> ' : '<b>Revísalo:</b> las respuestas correctas están en verde. ') + md(fb.dataset.expl || ''); return; }
  const v = e.target.closest('.vid .play');
  if (v) { const box = v.closest('.vid'); box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${box.dataset.yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe>`; }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.done; if (k) { store[k] = e.target.checked; save(); } });
$('#b-menu').onclick = () => document.body.classList.toggle('menu');
$('#b-print').onclick = printAll;
$('#b-theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('guia-theme', r.dataset.theme); } catch(e) {} };
try { const t = localStorage.getItem('guia-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
if (D.url_clase) $('#b-clase').href = D.url_clase; else $('#b-clase').style.display = 'none';
// Atrás / adelante del navegador y enlaces directos (#a-3.1, #creditos)
addEventListener('hashchange', () => { let k = ''; try { k = location.hash.slice(1); } catch(e) {} if (PAGES.some(p => p.k === k)) show(k); });
addEventListener('popstate', () => { let k = ''; try { k = location.hash.slice(1); } catch(e) {} show(PAGES.some(p => p.k === k) ? k : 'inicio'); });
let h0 = ''; try { h0 = location.hash.slice(1); } catch(e) {}
show(PAGES.some(p => p.k === h0) ? h0 : 'inicio');
</script>
</body>
