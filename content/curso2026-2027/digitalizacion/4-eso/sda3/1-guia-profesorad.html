*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}

ul.clean{margin:6px 0;padding-left:18px;color:var(--ink2)}ul.clean li{margin:3px 0}

.mitem{margin:8px 0}.mitem .mt{font-weight:700}

.tbl th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.scroll{overflow-x:auto}

.cot li{list-style:none;margin:6px 0}.cot label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--brand);width:0;transition:width .2s}
.pct{float:right;font-size:12px;font-weight:700;color:var(--brand)}
.copybox{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.copybox .ch{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:6px 12px;font-size:13px;font-weight:700}
.copybox pre{margin:0;padding:10px 12px;white-space:pre-wrap;font:13px/1.5 system-ui,sans-serif;color:var(--ink2)}
.copy{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.note{font-size:13px;color:var(--muted)}
td.rc{cursor:pointer;font-size:13px}td.rc:hover{background:var(--bg)}td.rc.on{background:var(--brand-soft);outline:2px solid var(--brand)}
.rub th{text-align:center}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
#modal .box{background:var(--card);color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#modal .mhd{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
#modal .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--brand)}
#modal h3{margin:2px 0 0;font-size:18px}
#modal .mbd{padding:16px 18px;color:var(--ink2)}
#modal .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
@media print{

<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 3: Ética, Salud Digital y Sostenibilidad Ecosocial", "subtitulo": "«Viñetas que desconectan»: un cómic digital interactivo sobre salud digital y la huella oculta de la nube y la IA", "curso_texto": "4.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Equipos de 2 a 4 personas con roles (cómic) y cuatro equipos de debate de 5-6 personas (sesiones 10-11)", "temporalizacion": "Primer trimestre (orientativo: 4 semanas a 3 sesiones semanales)"}, "materias": [{"codigo": "DIG", "criterios": ["DIG.4.2.3", "DIG.4.3.3", "DIG.4.4.1", "DIG.4.4.4"], "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.C.3", "DIG.4.D.1", "DIG.4.D.5"]}], "vision": {"descripcion": "Pasamos horas delante de pantallas sin pensar en lo que le hacen a nuestro cuerpo, a nuestra cabeza y al planeta. En esta situación de aprendizaje el alumnado investiga los efectos físicos (postura, vista, sueño, sedentarismo) y psicológicos (tecnoestrés, nomofobia, FOMO, diseño persuasivo) del uso intensivo de la tecnología y el impacto ambiental y social de la «nube»: centros de datos, entrenamiento y uso de modelos de inteligencia artificial y residuos electrónicos. Lo cuenta con un cómic digital interactivo y lo defiende en un debate estructurado.", "contexto": "Grupo de 22 estudiantes de 4.º ESO de un curso adaptado, con mayoría de alumnado repetidor y con dificultades de aprendizaje, muy activo en TikTok e Instagram. Trabajan en el aula de informática con un ordenador por estudiante, con cuentas de Google Workspace del centro (@g.educaand.es), Genially para Educación y Moodle Centros. Como el uso del móvil no está permitido en la jornada lectiva, los datos de uso del propio teléfono se consultan en casa. Si el centro participa en Forma Joven o en el programa ALDEA de educación ambiental, la campaña puede vincularse a ellos.", "justificacion": "La SdA moviliza los bloques de Digitalización del entorno personal de aprendizaje, Seguridad y bienestar digital y Ciudadanía digital crítica de Digitalización 4.º ESO. El alumnado crea y publica contenidos digitales de forma responsable y respetando las licencias, desarrolla hábitos de uso saludable ante riesgos físicos y psicológicos y analiza de forma ética y ecosocial el desarrollo de la tecnología digital y de la IA. Parte de lo que el alumnado ya consume (vídeos cortos, redes, chatbots) para darle la vuelta: de consumidores a creadores críticos. Conecta con los ODS 3 (salud y bienestar), 12 (producción y consumo responsables) y 13 (acción por el clima).", "reto": "«Somos el equipo de creadores y creadoras de contenido del instituto. Nos han encargado una campaña para que el alumnado de 1.º y 2.º ESO se dé cuenta de lo que la tecnología le hace a su cuerpo, a su cabeza y al planeta. Vamos a crear un cómic digital interactivo en Genially, pensado para verse en el móvil como una publicación de redes, y defenderemos nuestras ideas en un debate ante la clase.»", "pregunta_guia": "¿Qué precio pagamos, nosotros y el planeta, por estar siempre conectados, y qué podemos hacer para cambiarlo?", "producto_final": "Cómic digital interactivo en Genially (formato vertical para redes, 6-9 viñetas) sobre una de dos líneas: A) salud digital (ergonomía, tecnoestrés, nomofobia) o B) huella ecosocial de los centros de datos y la IA. Incluye ventanas emergentes con datos y fuentes, una decisión interactiva para el lector, créditos y licencia Creative Commons. Se complementa con una guía-argumentario y un debate estructurado en el aula."}, "metodologias": [{"nombre": "Aprendizaje Basado en Proyectos (ABP)", "descripcion": "Toda la SdA gira en torno a una campaña real para el alumnado del primer ciclo, con un producto que se publica y se presenta."}, {"nombre": "Aprendizaje cooperativo", "descripcion": "Equipos de 2-4 con roles de guionista, ilustrador/a-maquetador/a, investigador/a de datos y portavoz; puzle de expertos en la sesión 4."}, {"nombre": "Narrativa visual (visual storytelling)", "descripcion": "El alumnado traduce datos y conceptos a una historia con personajes, conflicto y desenlace, en el lenguaje del cómic y de las redes."}, {"nombre": "Pensamiento crítico y alfabetización mediática", "descripcion": "Verificación de bulos con el método SIFT y verificadores (Maldita.es, Newtral, EFE Verifica) y análisis de dilemas éticos."}, {"nombre": "Debate estructurado", "descripcion": "Debate con mociones, posturas asignadas, turnos cronometrados, frases-andamio y jurado de compañeros y compañeras."}, {"nombre": "Coevaluación y metacognición", "descripcion": "Escalera de retroalimentación entre equipos, tabla SQA inicial y final y pacto digital personal al cierre."}], "recursos": ["Aula de informática con proyector", "Ordenadores (uno por estudiante)", "Genially para Educación", "Google Workspace del centro (Docs, Forms, Sheets)", "Moodle Centros", "Openverse y Wikimedia Commons", "Verificadores: Maldita.es, Newtral, EFE Verifica", "Fichas de lectura fácil y plantillas del docente"], "fases": [{"nombre": "Inicio", "sesiones": "1-3", "finalidad": "Motivación, diagnóstico y salud física y mental frente a la pantalla"}, {"nombre": "Desarrollo", "sesiones": "4-9", "finalidad": "Huella ecosocial de la nube y la IA, dilemas éticos y creación del cómic interactivo"}, {"nombre": "Cierre", "sesiones": "10-12", "finalidad": "Argumentario, debate estructurado, publicación responsable y reflexión"}], "sesiones": [{"n": 1, "fase": "Inicio", "titulo": "Gancho: ¿cuánto pesa un like?", "reto": "Descubrir que cada vídeo y cada like tiene un coste para nuestro cuerpo, nuestra mente y el planeta, y conocer el reto de la SdA.", "actividades": [{"nombre": "Levántate si…", "min": 10, "desc": "El docente lee afirmaciones y se levanta quien se identifica: «miro el móvil nada más despertarme», «me ha dolido el cuello o la vista después de jugar o hacer scroll», «me he dormido más tarde de lo que quería por el móvil», «he usado un chatbot de IA esta semana». Después proyecta una foto de un centro de datos y pregunta: «¿Dónde vive el último vídeo de TikTok que habéis visto?». Se recogen hipótesis en la pizarra sin corregirlas."}, {"nombre": "Encuesta diagnóstica", "min": 12, "desc": "Cada estudiante responde un Google Forms anónimo de 8 preguntas: horas de pantalla estimadas al día, apps más usadas, uso del móvil en la cama, molestias físicas (cuello, ojos, muñecas), si ha oído hablar de nomofobia y tecnoestrés, si cree que la nube contamina y si usa IA. El docente proyecta los gráficos de resultados en directo y comenta 2-3 datos llamativos de la clase."}, {"nombre": "Tabla SQA", "min": 13, "desc": "Por parejas, en una plantilla de Google Docs, rellenan las columnas «Qué sé» y «Qué quiero saber» sobre tres temas: mi cuerpo y la pantalla, mi cabeza y las redes, el planeta y la nube. Se ponen en común las preguntas más repetidas, que se convierten en preguntas de investigación de la SdA."}, {"nombre": "Presentación del reto", "min": 10, "desc": "El docente presenta el encargo, la pregunta guía y un ejemplo de cómic interactivo en Genially hecho por él o ella (3-4 viñetas, con una ventana emergente de dato y fuente). Enseña en Moodle la sección de la SdA, el calendario y las rúbricas del cómic y del argumentario, para que el alumnado sepa desde el principio cómo se le evalúa."}, {"nombre": "Equipos y roles", "min": 5, "desc": "Se forman equipos de 3-4 (excepcionalmente de 2) equilibrados por el docente. Cada equipo reparte provisionalmente los roles de guionista, ilustrador/a-maquetador/a, investigador/a de datos y portavoz con tarjetas de rol."}], "criterios": [], "saberes": ["DIG.4.C.3", "DIG.4.D.5"], "metodologia": ["Rutina de pensamiento", "ABP"], "evidencias": ["Encuesta diagnóstica (Google Forms)", "Tabla SQA inicial"], "recursos": ["Proyector", "Google Forms", "Plantilla SQA"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Gancho corporal sin lectura, resultados de la encuesta en gráficos, ejemplo de producto final real y rúbricas visibles desde el primer día."}, "ejercicios": ["Responde la encuesta anónima sobre tus hábitos digitales.", "Completa con tu pareja las columnas «Qué sé» y «Qué quiero saber» de la tabla SQA."], "moodle": []}, {"n": 2, "fase": "Inicio", "titulo": "El cuerpo frente a la pantalla: ergonomía y salud física", "reto": "Revisar y mejorar el propio puesto de trabajo y registrar los hábitos de uso de pantallas.", "actividades": [{"nombre": "¿Cuánto pesa tu cabeza?", "min": 8, "desc": "El docente pasa una mochila con unos 5 kg: es lo que pesa aproximadamente una cabeza adulta. Explica que, al inclinar el cuello para mirar el móvil, la carga que soporta la columna cervical se multiplica (un estudio de 2014 la estimó en unos 27 kg a 60 grados). El alumnado imita la postura de «cuello de texto» y la compara con la postura correcta."}, {"nombre": "Mini-lección de ergonomía", "min": 12, "desc": "Con una infografía de lectura fácil, el docente explica el puesto ergonómico: borde superior de la pantalla a la altura de los ojos, distancia de un brazo, espalda apoyada, pies en el suelo, muñecas rectas y luz sin reflejos. Añade la fatiga visual y la regla 20-20-20 (cada 20 minutos, mirar 20 segundos algo a unos 6 metros), el efecto de las pantallas antes de dormir sobre el sueño y el sedentarismo."}, {"nombre": "Auditoría ergonómica por parejas", "min": 15, "desc": "Con una lista de verificación de 6 puntos, cada estudiante revisa el puesto de su pareja en el aula de informática, ajusta silla y pantalla y fotografía solo el puesto (sin personas ni pantallas con datos). Anotan dos mejoras concretas que se pueden aplicar en casa (p. ej. «subir el portátil con dos libros», «poner un recordatorio de pausa cada 40 minutos»)."}, {"nombre": "Mi registro de salud digital", "min": 10, "desc": "El docente muestra en el proyector dónde se consultan «Bienestar digital» (Android) y «Tiempo de uso» (iPhone). Cada estudiante empieza la ficha con su estimación y la completa en casa con los datos reales (horas al día, app más usada, número de desbloqueos), sin capturas que muestren nombres, mensajes o contactos."}, {"nombre": "Pausa activa", "min": 5, "desc": "Un estudiante voluntario dirige con una tarjeta de imágenes tres estiramientos de cuello, hombros y muñecas. Se acuerda repetir la pausa a mitad de las sesiones largas de ordenador."}], "criterios": ["DIG.4.3.3"], "saberes": ["DIG.4.C.3"], "metodologia": ["Aprendizaje cooperativo", "Aprendizaje experiencial"], "evidencias": ["Ficha de auditoría ergonómica", "Registro de salud digital"], "recursos": ["Infografía de ergonomía", "Lista de verificación", "Mochila de 5 kg"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Infografía con iconos y lectura fácil, experiencia física con la mochila, ficha con casillas y espacio para respuestas cortas o dibujos."}, "ejercicios": ["Revisa el puesto de tu compañero o compañera con la lista de verificación y propón dos mejoras.", "Completa en casa tu registro de salud digital con los datos de tu móvil o una estimación."], "moodle": [{"recurso": "Tarea", "nombre": "S2 · Mi puesto ergonómico y mi registro digital (DIG.4.3.3)", "uso": "Recoger la ficha de auditoría ergonómica y el registro de hábitos como evidencia del criterio DIG.4.3.3.", "correccion": "apto", "criterio": "DIG.4.3.3", "cotejo": ["La lista de verificación ergonómica tiene los 6 puntos revisados.", "Hay una foto del puesto sin personas ni datos personales visibles.", "El registro digital recoge al menos 3 datos de uso (o una estimación razonada).", "Propone dos mejoras concretas y aplicables en casa."], "config": ["Entrega individual", "Tipo de entrega: archivo o texto en línea", "Calificación: escala Apto / No apto", "Fecha de entrega: antes de la sesión 4"], "calificable": true}]}, {"n": 3, "fase": "Inicio", "titulo": "Mente conectada: tecnoestrés, nomofobia y diseño persuasivo", "reto": "Reconocer cómo las apps captan nuestra atención, identificar señales de tecnoestrés y nomofobia y empezar a cazar bulos.", "actividades": [{"nombre": "¿Quién manda: tú o la app?", "min": 8, "desc": "El docente proyecta capturas de diseño persuasivo: scroll infinito, reproducción automática, notificaciones en rojo, rachas de Snapchat, «me gusta» que aparecen poco a poco. Pregunta qué tienen en común con una máquina tragaperras (recompensa variable). El alumnado señala qué truco le «engancha» más en una votación a mano alzada."}, {"nombre": "Conceptos clave", "min": 12, "desc": "Explicación con ejemplos cercanos: tecnoestrés, nomofobia (miedo a estar sin móvil), FOMO, dependencia tecnológica y comparación social con filtros. Señales de alerta (ansiedad sin móvil, sueño alterado, bajar el rendimiento) y dónde pedir ayuda: tutoría, Orientación, familia y la línea 017 de INCIBE para dudas de seguridad y bienestar en internet."}, {"nombre": "Mi test de nomofobia", "min": 10, "desc": "Cada estudiante responde de forma privada una versión breve y adaptada de un cuestionario de nomofobia (10 ítems del 1 al 7). La puntuación no se comparte: solo se reflexiona por escrito sobre qué ítem le ha sorprendido. Mensaje del docente: el test orienta, no diagnostica."}, {"nombre": "Cazadores de bulos", "min": 15, "desc": "El docente presenta tres afirmaciones virales: «La luz azul del móvil te deja ciego», «Borrar tus correos antiguos salva el planeta» y «La nube no contamina porque no es nada físico». Cada equipo elige una y la verifica con la ficha SIFT (para, investiga la fuente, busca otras fuentes, vuelve al origen) consultando Maldita.es, Newtral o EFE Verifica y fuentes oficiales. Publican el resultado en el foro de Moodle."}, {"nombre": "Mi plan de desconexión", "min": 5, "desc": "Cada estudiante escribe en un pósit un hábito que va a probar durante la SdA (p. ej. «quitar las notificaciones de una app», «móvil fuera de la habitación al dormir»). Se guardan para revisarlos en la sesión 12."}], "criterios": ["DIG.4.3.3"], "saberes": ["DIG.4.C.3"], "metodologia": ["Pensamiento crítico", "Aprendizaje cooperativo"], "evidencias": ["Reflexión del test de nomofobia", "Entrada del foro de bulos", "Plan de desconexión"], "recursos": ["Proyector", "Ficha SIFT", "Foro de Moodle"], "dua": {"principios": ["Compromiso", "Andamiaje"], "medidas": "Ejemplos de apps que usa el alumnado, test con respuesta privada, ficha SIFT con pasos numerados y enlaces directos a los verificadores."}, "ejercicios": ["Identifica en una app que uses tres trucos de diseño persuasivo.", "Verifica una afirmación viral con la ficha SIFT y publica el resultado en el foro.", "Escribe un hábito de desconexión que vas a probar."], "moodle": [{"recurso": "Foro", "nombre": "S3 · Cazadores de bulos digitales", "uso": "Cada equipo publica al menos un bulo sobre salud digital, IA o tecnología y medio ambiente: dónde lo vio, qué técnica usó para verificarlo, conclusión y enlace a una fuente fiable. Queda abierto hasta la sesión 5 y alimenta el cómic.", "config": ["Tipo: foro de debate sencillo", "Modo de grupo: sin grupos (todo el grupo ve las entradas)", "No calificable", "Normas de netiqueta en la descripción"]}]}, {"n": 4, "fase": "Desarrollo", "titulo": "La nube no es una nube: centros de datos, IA y residuos", "reto": "Comprender el impacto energético, hídrico, material y social de los centros de datos y de la inteligencia artificial.", "actividades": [{"nombre": "¿Dónde está tu foto?", "min": 8, "desc": "El docente proyecta fotos de un centro de datos (pasillos de servidores, sistemas de refrigeración) y un mapa con los principales centros de datos de España. Pregunta: «¿Qué necesita este edificio para funcionar las 24 horas?». El alumnado propone respuestas (electricidad, agua, suelo, minerales, personas) que se anotan en la pizarra."}, {"nombre": "Puzle de expertos", "min": 27, "desc": "Cada miembro del equipo recibe una ficha de lectura fácil con datos: 1) Energía: según la Agencia Internacional de la Energía, los centros de datos consumieron en torno al 1,5 % de la electricidad mundial en 2024 y su consumo podría duplicarse hacia 2030, en buena parte por la IA; diferencia entre entrenar un modelo y usarlo. 2) Agua: refrigeración de servidores y la polémica por centros de datos proyectados en zonas con sequía en España. 3) Residuos y materiales: según el Global E-waste Monitor, en 2022 se generaron unos 62 millones de toneladas de residuos electrónicos y menos de una cuarta parte se recicló de forma documentada; minerales y obsolescencia programada. 4) Lo social: empleo, soberanía tecnológica, brecha digital y usos positivos (IA para gestionar redes eléctricas o predecir sequías). Se reúnen los expertos de cada ficha 12 minutos y vuelven a su equipo 15 minutos para explicarla."}, {"nombre": "Huella de la clase", "min": 10, "desc": "Con una hoja de Google Sheets preparada, cada equipo introduce las horas de vídeo y de uso de IA de la clase (de la encuesta de la sesión 1) y la hoja aplica un factor de referencia que facilita el docente a partir de una fuente actual. Se compara el resultado con algo cotidiano (cargas de móvil, horas de una bombilla) y se insiste en que son estimaciones con mucha incertidumbre."}, {"nombre": "Mapa de impactos y soluciones", "min": 5, "desc": "Entre todos completan en la pizarra un mapa de dos columnas: impactos y soluciones posibles (energías renovables, alargar la vida de los dispositivos, ver vídeo en menor resolución, usar la IA cuando aporta)."}], "criterios": ["DIG.4.4.4"], "saberes": ["DIG.4.D.5"], "metodologia": ["Puzle de expertos (Jigsaw)", "Aprendizaje cooperativo"], "evidencias": ["Fichas de experto completadas", "Hoja de cálculo de huella de la clase"], "recursos": ["Fichas de expertos", "Google Sheets", "Proyector"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Fichas con poco texto, datos en gráficos e iconos, glosario (TWh, refrigeración, e-waste) y hoja de cálculo con las fórmulas ya hechas."}, "ejercicios": ["Explica a tu equipo el impacto de tu ficha de experto con un dato y su fuente.", "Calcula con la hoja de cálculo la huella estimada de la clase en una semana."], "moodle": []}, {"n": 5, "fase": "Desarrollo", "titulo": "Dilemas éticos de la tecnología y elección de la línea del cómic", "reto": "Posicionarse ante dilemas éticos de la IA y la tecnología argumentando con respeto y elegir la línea y el mensaje del cómic.", "actividades": [{"nombre": "Lo mejor del foro", "min": 7, "desc": "El docente proyecta 2-3 entradas del foro de bulos y pregunta qué técnica de verificación funcionó mejor. Se destaca alguna entrada por su buena fuente."}, {"nombre": "Dilemas en los rincones", "min": 20, "desc": "Cuatro carteles en el aula: «De acuerdo», «En desacuerdo», «Depende» y «No lo sé». El docente lee cuatro dilemas: a) ¿Generamos las ilustraciones del cómic con IA o dibujamos y usamos imágenes con licencia libre? b) Un influencer estrena un móvil cada año y lo promociona. c) Una app gratuita de sueño vende tus datos a anunciantes. d) Un generador de imágenes muestra siempre a ingenieros hombres y a enfermeras mujeres. El alumnado se mueve al rincón que elige y argumenta con frases-andamio («Pienso que… porque…», «Entiendo tu idea, pero…»)."}, {"nombre": "Normas del buen debate", "min": 8, "desc": "A partir de lo vivido, la clase consensúa 5 normas de netiqueta para el foro, las redes y el debate final: criticar ideas y no a personas, citar la fuente, no compartir datos ajenos, respetar el turno, no difundir lo que no se ha verificado."}, {"nombre": "Elegimos línea y mensaje", "min": 10, "desc": "Cada equipo elige la línea A (salud digital: ergonomía, tecnoestrés, nomofobia) o B (huella ecosocial de servidores e IA) y escribe en Google Docs su mensaje clave en una frase y su público (alumnado de 1.º y 2.º ESO). El docente comprueba que haya equipos en las dos líneas."}, {"nombre": "Ticket de salida", "min": 5, "desc": "Cada estudiante responde: «¿Qué dilema te ha hecho dudar y por qué?»."}], "criterios": ["DIG.4.4.1", "DIG.4.4.4"], "saberes": ["DIG.4.D.5", "DIG.4.D.1"], "metodologia": ["Dilemas morales", "Rutina de pensamiento"], "evidencias": ["Registro de observación de los dilemas", "Normas del debate", "Ticket de salida"], "recursos": ["Carteles de rincones", "Tarjetas de frases-andamio"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Posicionarse con el cuerpo antes de hablar, frases-andamio impresas, opción «No lo sé» para quien aún no tiene opinión y ticket de salida que puede ser oral."}, "ejercicios": ["Elige un rincón en cada dilema y explica tu postura con una frase-andamio.", "Escribe con tu equipo el mensaje clave del cómic y el público al que va dirigido."], "moodle": []}, {"n": 6, "fase": "Desarrollo", "titulo": "Narrativa visual: del mensaje al guion y al storyboard", "reto": "Convertir el mensaje del equipo en una historia de 6-9 viñetas con un guion y un boceto.", "actividades": [{"nombre": "Leemos cómics", "min": 10, "desc": "El docente proyecta dos tiras cortas con licencia libre o propias e identifica con la clase los elementos del cómic: viñeta, bocadillo (de diálogo, de pensamiento, de grito), cartela, onomatopeya, plano (general, medio, primer plano) y elipsis. El alumnado los señala en la tira."}, {"nombre": "Cómo se construye la historia", "min": 10, "desc": "Mini-lección: estructura en tres actos (situación inicial, conflicto, resolución), un personaje con el que se identifique el público, un «giro de datos» (un botón que abre un dato real con su fuente) y un final con decisión para el lector. Ejemplo: «Lucía no puede dormir… ¿apaga el móvil o sigue con el scroll?»."}, {"nombre": "Guion", "min": 15, "desc": "Con la plantilla de guion en Google Docs, el equipo completa una fila por viñeta: qué se ve, qué dicen los personajes, dato y fuente (si lo hay) y elemento interactivo. El guionista coordina; el investigador o investigadora aporta los datos de las sesiones 2-4."}, {"nombre": "Storyboard", "min": 15, "desc": "El ilustrador o ilustradora y el resto del equipo bocetan las viñetas en una plantilla de papel o en Google Drawings. Basta con figuras sencillas y flechas: importa el encuadre y el orden. El docente revisa que el mensaje se entienda sin leer todo el texto."}], "criterios": ["DIG.4.2.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Narrativa visual", "Aprendizaje cooperativo"], "evidencias": ["Guion del cómic", "Storyboard"], "recursos": ["Plantilla de guion", "Plantilla de viñetas", "Proyector"], "dua": {"principios": ["Representación", "Acción y Expresión", "Andamiaje"], "medidas": "Guion en tabla con ejemplos, storyboard en papel o digital, banco de frases para bocadillos y modelo resuelto proyectado."}, "ejercicios": ["Señala en una tira cómica una viñeta, un bocadillo, una cartela y un plano.", "Completa con tu equipo el guion de 6 a 9 viñetas y su storyboard."], "moodle": []}, {"n": 7, "fase": "Desarrollo", "titulo": "Créditos, licencias y uso ético de imágenes e IA", "reto": "Elegir recursos que se pueden usar legalmente, atribuirlos bien y decidir cómo se usa la IA en el cómic.", "actividades": [{"nombre": "¿Puedo usar esta imagen?", "min": 8, "desc": "Cinco casos proyectados que el alumnado vota con tarjetas verde, amarilla o roja: un meme con un fotograma de una serie, una foto sacada de Google Imágenes, una imagen de Openverse con licencia CC BY, una ilustración generada con IA y una foto de un compañero en el patio. Se discute cada caso."}, {"nombre": "Licencias y atribución", "min": 12, "desc": "El docente explica las licencias Creative Commons (BY, SA, NC, ND), el dominio público y cómo atribuir con la regla TASL (título, autor/a, fuente, licencia). Sobre la IA generativa: declarar la herramienta y para qué se usó, no imitar el estilo de artistas concretos ni personajes protegidos y valorar su huella. Privacidad: ni fotos ni nombres reales del alumnado en el cómic."}, {"nombre": "Búsqueda de recursos", "min": 20, "desc": "Cada equipo busca en Openverse, Wikimedia Commons y en los recursos de Genially los personajes, fondos e iconos que necesita y rellena la ficha de créditos (una línea TASL por recurso). Si decide usar IA, anota la herramienta y la instrucción usada."}, {"nombre": "Ajuste y entrega", "min": 10, "desc": "El docente devuelve comentarios rápidos sobre el guion. El equipo corrige, fotografía o exporta el storyboard y entrega guion, storyboard y ficha de créditos en Moodle."}], "criterios": ["DIG.4.4.1"], "saberes": ["DIG.4.D.1", "DIG.4.B.4"], "metodologia": ["Aprendizaje basado en casos", "Aprendizaje cooperativo"], "evidencias": ["Ficha de créditos", "Guion y storyboard revisados"], "recursos": ["Openverse", "Wikimedia Commons", "Plantilla de créditos"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Tarjetas de colores para votar sin hablar, chuleta visual de licencias CC y plantilla de créditos con un ejemplo hecho."}, "ejercicios": ["Decide si puedes usar cada una de las cinco imágenes y explica por qué.", "Completa la ficha de créditos del cómic con la regla TASL."], "moodle": [{"recurso": "Tarea", "nombre": "S7 · Guion, storyboard y ficha de créditos (DIG.4.4.1)", "uso": "Comprobar que el equipo ha planificado el cómic y que todos los recursos externos se usan de forma ética y legal antes de empezar la producción.", "correccion": "apto", "criterio": "DIG.4.4.1", "cotejo": ["Se entrega el guion con 6 a 9 viñetas y el mensaje clave.", "Se entrega el storyboard (foto, escaneo o archivo).", "La ficha de créditos tiene una línea TASL por cada recurso externo.", "Se declara el uso de IA o se indica que no se ha usado.", "No aparecen fotos ni nombres reales de alumnado."], "config": ["Entrega por grupos: Sí", "Calificación: escala Apto / No apto", "Tipo de entrega: archivos y texto en línea"], "calificable": true}]}, {"n": 8, "fase": "Desarrollo", "titulo": "Producción en Genially I: maquetamos las viñetas", "reto": "Pasar el storyboard a Genially y dejar terminada al menos la primera mitad del cómic.", "actividades": [{"nombre": "Demostración guiada", "min": 10, "desc": "El docente muestra en el proyector la plantilla base del cómic en Genially (formato vertical para móvil): duplicar páginas, insertar personajes y fondos, añadir bocadillos con texto legible y crear un botón que abre una ventana emergente con un dato y su fuente. Comparte un vídeo corto con los mismos pasos en Moodle."}, {"nombre": "Taller de producción", "min": 35, "desc": "Cada equipo maqueta las viñetas 1 a 5 siguiendo el storyboard, con los roles: ilustrador/a-maquetador/a monta las viñetas, guionista revisa los textos, investigador/a prepara las ventanas de datos y portavoz controla tiempos y la ficha de créditos. A mitad de sesión se hace una pausa activa de un minuto y cada equipo enseña una viñeta terminada al docente, que revisa con la lista de cotejo."}, {"nombre": "Guardado y semáforo", "min": 5, "desc": "El equipo comparte el Genially con el docente como colaborador y marca su avance en un semáforo (verde, amarillo, rojo) en un documento compartido para planificar la sesión siguiente."}], "criterios": ["DIG.4.2.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Aprendizaje cooperativo", "Aprendizaje basado en la práctica"], "evidencias": ["Genially con las viñetas 1-5"], "recursos": ["Genially para Educación", "Plantilla base", "Vídeo tutorial"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Plantilla con viñetas ya colocadas, vídeo tutorial para repetir a su ritmo y tarjeta de pasos para crear una ventana emergente."}, "ejercicios": ["Monta en Genially las viñetas 1 a 5 de tu cómic.", "Crea un botón que abra una ventana con un dato y su fuente."], "moodle": []}, {"n": 9, "fase": "Desarrollo", "titulo": "Producción en Genially II: interactividad, accesibilidad y revisión", "reto": "Terminar el cómic, hacerlo accesible y mejorarlo con la revisión de otro equipo.", "actividades": [{"nombre": "Mini-lección: accesible y responsable", "min": 8, "desc": "El docente explica en 4 diapositivas: contraste y tamaño de letra para leer en el móvil, texto alternativo en las imágenes, no depender solo del color, decisión interactiva con dos finales, página final de créditos y licencia del propio cómic (p. ej. CC BY-NC-SA) y publicación responsable (sin datos personales, etiquetas adecuadas, pensar en quién lo verá)."}, {"nombre": "Producción final", "min": 25, "desc": "Los equipos terminan las viñetas, la decisión interactiva, las ventanas de datos y la página de créditos. El docente atiende primero a los equipos en rojo del semáforo."}, {"nombre": "Escalera de retroalimentación", "min": 12, "desc": "Cada equipo revisa el cómic de otro con los cuatro peldaños (aclarar, valorar, preocuparse, sugerir) apoyándose en las líneas de la rúbrica, y deja sus comentarios en una ficha de Google Docs."}, {"nombre": "Ajustes y entrega", "min": 5, "desc": "El equipo aplica al menos una sugerencia recibida y entrega el enlace del Genially en Moodle. Puede terminar los ajustes hasta el día anterior a la sesión 10."}], "criterios": ["DIG.4.2.3"], "saberes": ["DIG.4.B.2", "DIG.4.B.4"], "metodologia": ["Coevaluación", "Aprendizaje cooperativo"], "evidencias": ["Cómic digital interactivo terminado", "Ficha de retroalimentación entre equipos"], "recursos": ["Genially para Educación", "Ficha de escalera de retroalimentación"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Peldaños de la escalera con frases de inicio, rúbrica en lenguaje sencillo y prórroga en Moodle para los equipos que lo necesiten."}, "ejercicios": ["Añade a tu cómic la decisión interactiva, las ventanas de datos y la página de créditos.", "Revisa el cómic de otro equipo con la escalera de retroalimentación."], "moodle": [{"recurso": "Tarea", "nombre": "S9 · Cómic digital interactivo para redes (DIG.4.2.3)", "uso": "Entrega del producto final: enlace del Genially publicado y ficha de créditos actualizada.", "correccion": "rubrica", "criterio": "DIG.4.2.3", "rubrica": [{"linea": "Historia y mensaje", "niveles": ["1 pto: No hay una historia reconocible; las viñetas no siguen un orden y no se entiende el mensaje.", "3 ptos: Hay personajes y alguna situación, pero falta el conflicto o el final y el mensaje es confuso.", "5 ptos: La historia tiene inicio, conflicto y final, pero el mensaje sobre salud digital o huella ecosocial queda poco claro.", "7 ptos: La historia tiene inicio, conflicto y final y el mensaje se entiende, aunque algún paso queda forzado o largo.", "10 ptos: La historia engancha al público de 1.º-2.º ESO, tiene inicio, conflicto y final claros y el mensaje se entiende sin explicaciones."]}, {"linea": "Lenguaje del cómic y diseño", "niveles": ["1 pto: Hay menos de 6 viñetas o no se usan bocadillos ni elementos del cómic.", "3 ptos: Hay 6 viñetas, pero los textos no se leen bien en el móvil o los bocadillos están mal colocados.", "5 ptos: Usa viñetas y bocadillos legibles, pero todos los planos son iguales y no hay cartelas ni onomatopeyas.", "7 ptos: Usa bocadillos, cartelas y al menos dos tipos de plano; el diseño es legible en formato vertical.", "10 ptos: Combina con intención planos, bocadillos, cartelas y onomatopeyas; diseño vertical cuidado, con buen contraste y texto alternativo."]}, {"linea": "Interactividad", "niveles": ["1 pto: No hay ningún elemento interactivo.", "3 ptos: Hay un botón o ventana, pero no funciona o no aporta información.", "5 ptos: Hay al menos una ventana emergente con un dato que funciona, pero no hay decisión para el lector.", "7 ptos: Hay ventanas de datos y una decisión interactiva que funcionan, aunque alguna lleva a una página equivocada.", "10 ptos: Todas las interacciones funcionan; la decisión del lector lleva a dos finales coherentes y las ventanas aportan datos clave."]}, {"linea": "Datos y fuentes", "niveles": ["1 pto: No aparece ningún dato o los datos son falsos.", "3 ptos: Aparece algún dato sin fuente o con una fuente poco fiable.", "5 ptos: Aparecen al menos dos datos correctos, pero solo uno tiene fuente enlazada.", "7 ptos: Aparecen al menos dos datos correctos con su fuente enlazada.", "10 ptos: Aparecen tres o más datos correctos y actuales, con fuentes fiables enlazadas y explicados con palabras sencillas."]}, {"linea": "Créditos y publicación responsable", "niveles": ["1 pto: No hay créditos y se usan imágenes protegidas o datos personales.", "3 ptos: Hay créditos incompletos o se usa algún recurso sin licencia adecuada.", "5 ptos: Todos los recursos tienen créditos, pero falta la licencia del propio cómic o la declaración de uso de IA.", "7 ptos: Créditos TASL completos, declaración de IA y licencia del cómic; falta revisar algún detalle de privacidad o etiquetas.", "10 ptos: Créditos TASL completos, declaración de IA, licencia CC del cómic, ningún dato personal y listo para publicarse en redes del centro."]}], "config": ["Entrega por grupos: Sí", "Método de calificación: Rúbrica", "Tipo de entrega: texto en línea (enlace) y archivo", "Fecha de entrega: día anterior a la sesión 10"], "calificable": true}]}, {"n": 10, "fase": "Cierre", "titulo": "Preparamos el debate: guía-argumentario", "reto": "Preparar con datos y fuentes la postura asignada en el debate y prever qué dirá el otro equipo.", "actividades": [{"nombre": "Formato del debate", "min": 8, "desc": "El docente presenta las dos mociones: A) «Las redes sociales deberían desactivar por defecto el scroll infinito y la reproducción automática para menores de 18 años»; B) «El instituto debería limitar el uso de la IA generativa por su impacto ambiental». Se forman cuatro equipos de debate de 5-6 personas (a favor y en contra de cada moción) mezclando equipos del cómic, y se sortea la postura. Se explican los turnos: introducción, argumentación, réplica y conclusión."}, {"nombre": "Guía-argumentario", "min": 22, "desc": "Cada equipo de debate completa la plantilla en Google Docs: tesis en una frase, tres argumentos con un dato y su fuente (pueden reutilizar los de las fichas de experto, el foro y los cómics), dos contraargumentos que espera del otro equipo con su réplica y dos propuestas concretas de uso responsable. Se reparten los turnos entre sus miembros."}, {"nombre": "Ensayo cronometrado", "min": 15, "desc": "Cada persona ensaya su intervención de 1 minuto ante su equipo, que la cronometra y le da una mejora. Se usan tarjetas de frases-andamio («Según…», «Este dato demuestra que…», «Nuestros oponentes dicen…, pero…»)."}, {"nombre": "Entrega", "min": 5, "desc": "El portavoz sube la guía-argumentario a Moodle."}], "criterios": ["DIG.4.4.4"], "saberes": ["DIG.4.D.5", "DIG.4.C.3"], "metodologia": ["Debate estructurado", "Aprendizaje cooperativo"], "evidencias": ["Guía-argumentario del equipo"], "recursos": ["Plantilla de argumentario", "Tarjetas de frases-andamio", "Cronómetro"], "dua": {"principios": ["Andamiaje", "Acción y Expresión"], "medidas": "Plantilla con huecos guiados, banco de datos ya trabajados en la SdA, frases-andamio y ensayo previo con su equipo para reducir la ansiedad de hablar en público."}, "ejercicios": ["Escribe la tesis de tu equipo y tres argumentos con dato y fuente.", "Prevé dos argumentos del otro equipo y prepara tu réplica.", "Ensaya tu intervención de un minuto."], "moodle": [{"recurso": "Tarea", "nombre": "S10 · Guía-argumentario del debate (DIG.4.4.4)", "uso": "Recoger la preparación del debate como evidencia del análisis ecosocial y ético de la tecnología.", "correccion": "rubrica", "criterio": "DIG.4.4.4", "rubrica": [{"linea": "Tesis y argumentos", "niveles": ["1 pto: No hay tesis o no se relaciona con la moción.", "3 ptos: Hay tesis, pero solo un argumento o argumentos que no la apoyan.", "5 ptos: Tesis clara y dos argumentos relacionados con ella.", "7 ptos: Tesis clara y tres argumentos relacionados, aunque alguno es repetitivo.", "10 ptos: Tesis clara y tres argumentos distintos y bien encadenados que la defienden."]}, {"linea": "Datos y fuentes", "niveles": ["1 pto: No hay datos ni fuentes.", "3 ptos: Hay algún dato sin fuente o de una fuente poco fiable.", "5 ptos: Dos argumentos tienen dato, pero solo uno con fuente fiable.", "7 ptos: Los tres argumentos tienen dato con fuente fiable.", "10 ptos: Los tres argumentos tienen datos actuales con fuentes fiables y el equipo explica qué significan."]}, {"linea": "Impacto ecosocial", "niveles": ["1 pto: No menciona ningún impacto de la tecnología.", "3 ptos: Menciona un impacto de forma general («contamina», «es malo»).", "5 ptos: Explica un impacto concreto (energía, agua, residuos o salud).", "7 ptos: Explica al menos dos impactos concretos y algún beneficio de la tecnología.", "10 ptos: Compara costes y beneficios en varios ámbitos (ambiental, salud, social, accesibilidad) con una visión equilibrada."]}, {"linea": "Contraargumentos y réplicas", "niveles": ["1 pto: No prevé ningún contraargumento.", "3 ptos: Prevé un contraargumento sin réplica.", "5 ptos: Prevé dos contraargumentos, pero las réplicas son débiles o no responden.", "7 ptos: Prevé dos contraargumentos con réplicas razonadas.", "10 ptos: Prevé dos o más contraargumentos fuertes y los rebate con datos y respeto."]}, {"linea": "Propuestas de uso responsable", "niveles": ["1 pto: No hay propuestas.", "3 ptos: Una propuesta vaga («usar menos el móvil»).", "5 ptos: Dos propuestas, pero poco concretas o difíciles de aplicar.", "7 ptos: Dos propuestas concretas y aplicables por el alumnado o el centro.", "10 ptos: Dos o más propuestas concretas, realistas y justificadas por su impacto, para personas, centro o empresas."]}], "config": ["Entrega por grupos: Sí (agrupamiento «Debate SdA3»)", "Método de calificación: Rúbrica", "Tipo de entrega: archivo o texto en línea"], "calificable": true}]}, {"n": 11, "fase": "Cierre", "titulo": "Debate estructurado: ¿qué tecnología queremos?", "reto": "Defender una postura con argumentos y datos, escuchar y rebatir con respeto.", "actividades": [{"nombre": "Preparación del espacio", "min": 5, "desc": "Se colocan las mesas en U con los dos equipos enfrentados. Se recuerdan las 5 normas del buen debate de la sesión 5. Los equipos de la otra moción actúan como jurado con una hoja de valoración sencilla (argumentos, datos, respeto, réplica)."}, {"nombre": "Debate de la moción A", "min": 20, "desc": "Scroll infinito y reproducción automática para menores. Turnos cronometrados por el docente: introducción (2 min por equipo), argumentación (3 min por equipo), réplica (2 min por equipo) y conclusión (1,5 min por equipo). Tras el debate, el jurado delibera 3 minutos y vota."}, {"nombre": "Debate de la moción B", "min": 20, "desc": "Limitar la IA generativa en el instituto por su impacto ambiental. Mismo formato; ahora hace de jurado el alumnado de la moción A. El docente registra en la lista de cotejo el uso de datos, el respeto al turno y la calidad de las réplicas."}, {"nombre": "Veredicto y reflexión", "min": 5, "desc": "Los jurados comunican su veredicto y la razón principal. El docente cierra preguntando: «¿Qué argumento del equipo contrario os ha hecho dudar?»."}], "criterios": ["DIG.4.4.4", "DIG.4.4.1"], "saberes": ["DIG.4.D.5", "DIG.4.D.1"], "metodologia": ["Debate estructurado", "Coevaluación"], "evidencias": ["Registro de observación del debate", "Hojas de valoración del jurado"], "recursos": ["Cronómetro visible", "Hoja del jurado", "Lista de cotejo"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Turnos cortos y repartidos, guion de intervención en la mano, rol de jurado para quien no debate y posibilidad de apoyarse en una diapositiva o tarjeta con el dato."}, "ejercicios": ["Defiende tu turno del debate con al menos un dato y su fuente.", "Como jurado, valora a los dos equipos con la hoja de valoración."], "moodle": []}, {"n": 12, "fase": "Cierre", "titulo": "Galería, publicación responsable y pacto digital", "reto": "Presentar el cómic, decidir cómo se publica de forma responsable y reflexionar sobre lo aprendido y los propios hábitos.", "actividades": [{"nombre": "Galería de cómics", "min": 20, "desc": "Cada equipo presenta su cómic en el proyector durante 2-3 minutos: el portavoz explica el mensaje, muestra la decisión interactiva y un dato con su fuente. El resto de la clase anota en un pósit qué le ha enseñado cada cómic. El docente registra la presentación en la lista de cotejo."}, {"nombre": "Publicación responsable", "min": 10, "desc": "La clase repasa la lista de publicación: créditos completos, licencia CC, sin datos personales, texto adecuado al público. Se acuerda con el docente dónde se publican: sección de Moodle de 1.º y 2.º ESO, web del centro o perfil del centro en redes, siempre con la autorización de la dirección. Cada equipo redacta el texto de presentación de su cómic (máximo 2 líneas y 3 etiquetas)."}, {"nombre": "Metacognición y pacto digital", "min": 15, "desc": "Cada estudiante completa la columna «Qué he aprendido» de la tabla SQA, revisa el pósit de su plan de desconexión de la sesión 3 («¿lo he cumplido?, ¿qué me ha costado?») y escribe su pacto digital: un compromiso de salud y otro de sostenibilidad. Se autoevalúa con la lista de cotejo de los criterios."}, {"nombre": "Valoración de la SdA", "min": 5, "desc": "Formulario anónimo de Google Forms: qué actividad le ha gustado más, qué cambiaría y cómo se ha sentido en su equipo."}], "criterios": ["DIG.4.2.3", "DIG.4.3.3"], "saberes": ["DIG.4.B.4", "DIG.4.C.3"], "metodologia": ["Exposición oral", "Metacognición"], "evidencias": ["Presentación del cómic", "Tabla SQA completa", "Pacto digital personal"], "recursos": ["Proyector", "Pósits", "Google Forms"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Presentación breve con guion y posibilidad de que hablen varias personas del equipo, pacto digital escrito, dibujado o grabado en audio."}, "ejercicios": ["Presenta el cómic de tu equipo explicando su mensaje y una interacción.", "Completa la tabla SQA y escribe tu pacto digital con un c
