l": "Alumnado con dificultades de atención o TDAH", "medidas": "Actividades de 10-15 minutos con cronómetro visible, pausas activas, rol práctico en la maquetación, agenda de la sesión en la pizarra y ubicación cerca del docente."}, {"perfil": "Alumnado con ansiedad al hablar en público", "medidas": "Ensayo previo en su equipo, intervención apoyada en tarjeta, rol de jurado o de cronometrador/a en el debate y presentación del cómic compartida con su equipo."}, {"perfil": "Alumnado con ausencias frecuentes", "medidas": "Todo el material y los tutoriales en Moodle, plantillas compartidas en Drive, roles que permiten incorporarse al equipo y prórrogas en las Tareas."}, {"perfil": "Alumnado que termina antes o con mayor dominio digital", "medidas": "Ampliación: versión del cómic con animaciones en Genially, adaptación de una viñeta a vídeo corto vertical con créditos, o rol de ayudante técnico de otro equipo."}], "roles": [{"rol": "Guionista", "funcion": "Coordina la historia y el mensaje, redacta los textos de los bocadillos y vela por que se entienda el cómic."}, {"rol": "Ilustrador/a-maquetador/a", "funcion": "Elige personajes y fondos, monta las viñetas en Genially y cuida la legibilidad en el móvil."}, {"rol": "Investigador/a de datos", "funcion": "Busca y verifica los datos, prepara las ventanas emergentes con su fuente y completa la ficha de créditos."}, {"rol": "Portavoz", "funcion": "Controla tiempos y entregas en Moodle, presenta el cómic y representa al equipo ante el docente. En equipos de 2 o 3 se fusiona con otro rol."}], "evaluacion": {"instrumentos": {"DIG.4.2.3": ["Tarea S9 con rúbrica (cómic interactivo)", "Observación directa de la presentación (sesión 12)"], "DIG.4.3.3": ["Tarea S2 (Apto / No apto)", "Lista de cotejo: foro de bulos, test de nomofobia y pacto digital"], "DIG.4.4.1": ["Tarea S7 (Apto / No apto)", "Observación directa en los dilemas y en el debate"], "DIG.4.4.4": ["Tarea S10 con rúbrica (guía-argumentario)", "Observación directa del debate (sesión 11)"]}, "cotejo": [{"criterio": "DIG.4.2.3", "indicadores": ["Construye un guion con mensaje claro y estructura de inicio, conflicto y final.", "Utiliza Genially para crear viñetas legibles en formato vertical.", "Integra elementos interactivos que funcionan (ventanas de datos, decisión del lector).", "Incluye datos verificados con su fuente.", "Colabora en su rol y explica el cómic en la presentación."]}, {"criterio": "DIG.4.3.3", "indicadores": ["Identifica riesgos físicos del uso de pantallas (postura, vista, sueño, sedentarismo) y propone medidas.", "Reconoce señales de tecnoestrés, nomofobia y dependencia y estrategias para afrontarlas.", "Explica al menos dos técnicas de diseño persuasivo de las apps.", "Verifica un bulo sobre salud o tecnología con una fuente fiable.", "Sabe a quién pedir ayuda ante una situación de riesgo en la red."]}, {"criterio": "DIG.4.4.1", "indicadores": ["Elige recursos con licencia adecuada y los atribuye con la regla TASL.", "Declara el uso de inteligencia artificial cuando la utiliza.", "No publica datos personales ni imágenes de otras personas.", "Respeta las normas de netiqueta en el foro y en el debate.", "Asigna una licencia Creative Commons a su propio cómic."]}, {"criterio": "DIG.4.4.4", "indicadores": ["Explica el consumo de energía y agua de los centros de datos y de la IA.", "Relaciona la obsolescencia y los residuos electrónicos con el consumo tecnológico.", "Valora beneficios y costes sociales y ambientales de la tecnología digital.", "Argumenta su postura con datos y fuentes fiables.", "Propone medidas concretas de uso sostenible y accesible."]}], "agentes": {"Heteroevaluación": "Tareas S2 y S7 (Apto / No apto), rúbricas de las Tareas S9 y S10 y observación directa en los dilemas, el debate y la presentación.", "Coevaluación": "Escalera de retroalimentación entre equipos (sesión 9) y hojas del jurado en el debate (sesión 11).", "Autoevaluación": "Tabla SQA inicial y final, revisión del plan de desconexión y lista de cotejo personal (sesión 12)."}}, "moodle": {"estructura": "Una sección «SdA 3 · Viñetas que desconectan» en el curso de Digitalización 4.º ESO con las cuatro Tareas y el Foro, numerados por sesión, más las plantillas y el tutorial de Genially.", "secciones": [{"nombre": "Sección SdA 3 · Viñetas que desconectan", "elementos": ["Área de texto y medios con el reto, la pregunta guía y el producto final", "Página «Cómo se evalúa» con las listas de verificación y las rúbricas", "Carpeta de plantillas (guion, créditos, argumentario) y URL a la plantilla de Genially", "Página con el vídeo tutorial de Genially", "Tarea S2 · Mi puesto ergonómico y mi registro digital", "Foro S3 · Cazadores de bulos digitales", "Tarea S7 · Guion, storyboard y ficha de créditos", "Tarea S9 · Cómic digital interactivo para redes", "Tarea S10 · Guía-argumentario del debate"]}], "calificaciones": "Cuatro categorías, una por criterio (DIG.4.2.3, DIG.4.3.3, DIG.4.4.1 y DIG.4.4.4). Las Tareas S2 y S7 usan la escala «No apto, Apto»; las Tareas S9 y S10 se califican con rúbrica sobre 10. La observación directa del debate (DIG.4.4.4 y DIG.4.4.1) y de la presentación (DIG.4.2.3) se añade como ítem de calificación manual en su categoría.", "configuracion": ["Escala personalizada «No apto, Apto».", "Grupos: un grupo por equipo del cómic (agrupamiento «SdA3 Cómic») y cuatro grupos de debate (agrupamiento «Debate SdA3»).", "Finalización de actividad activada para que el alumnado vea su progreso.", "Rúbricas de S9 y S10 guardadas como plantilla.", "Prórrogas individuales en las Tareas para alumnado con ausencias o NEAE."]}, "seneca": {"justificacion": "El alumnado de 4.º ESO investiga los efectos físicos y psicológicos del uso intensivo de la tecnología y el impacto ambiental y social de los centros de datos y la inteligencia artificial. Con lo aprendido crea un cómic digital interactivo para el alumnado del primer ciclo, respetando licencias y privacidad, y defiende una postura ética en un debate estructurado.", "actividades": [{"titulo": "¿Cuánto pesa un like?", "tipo": "Motivación", "abreviatura": "MOT1", "sesiones": [1]}, {"titulo": "Mi cuerpo y mi mente frente a la pantalla", "tipo": "Exploración", "abreviatura": "EXP1", "sesiones": [2, 3], "vinculaciones": [{"trazabilidad": "LISTA DE COTEJO", "criterios": ["DIG.4.3.3"]}, {"trazabilidad": "Búsqueda de información.", "criterios": ["DIG.4.3.3"]}]}, {"titulo": "La nube no es una nube: huella y dilemas éticos", "tipo": "Exploración", "abreviatura": "EXP2", "sesiones": [4, 5], "vinculaciones": [{"trazabilidad": "Realización de actividades.", "criterios": ["DIG.4.4.4"]}, {"trazabilidad": "OBSERVACIÓN DIRECTA", "criterios": ["DIG.4.4.1", "DIG.4.4.4"]}]}, {"titulo": "Creamos el cómic interactivo", "tipo": "Estructuración", "abreviatura": "EST1", "sesiones": [6, 7, 8, 9], "vinculaciones": [{"trazabilidad": "LISTA DE COTEJO", "criterios": ["DIG.4.4.1"]}, {"trazabilidad": "RÚBRICA", "criterios": ["DIG.4.2.3"]}]}, {"titulo": "Debatimos, publicamos y reflexionamos", "tipo": "Conclusión", "abreviatura": "CON1", "sesiones": [10, 11, 12], "vinculaciones": [{"trazabilidad": "RÚBRICA", "criterios": ["DIG.4.4.4"]}, {"trazabilidad": "OBSERVACIÓN DIRECTA", "criterios": ["DIG.4.4.4", "DIG.4.4.1"]}, {"trazabilidad": "Exposición oral", "criterios": ["DIG.4.2.3", "DIG.4.3.3"]}]}]}, "notas_rigor": ["DIG.4.D.3 (gestiones administrativas) está vinculado oficialmente al criterio DIG.4.4.1 pero no se moviliza en esta SdA; se trabaja en otra.", "DIG.4.B.4 y DIG.4.D.1 están vinculados a DIG.4.2.3 y se movilizan en la publicación responsable del cómic y en las licencias (sesiones 7, 9 y 12); DIG.4.D.1 también sustenta la netiqueta de DIG.4.4.1 en dilemas y debate.", "Las cifras de energía (Agencia Internacional de la Energía, 2025) y de residuos electrónicos (Global E-waste Monitor 2024) conviene actualizarlas antes de impartir la SdA, porque cambian cada año.", "Como el móvil no se usa en la jornada lectiva en los centros andaluces, el registro de uso del teléfono se completa en casa y sin capturas con datos personales.", "La sesión 1 es diagnóstica y no se califica. El test de nomofobia es orientativo y su puntuación no se recoge."]}, "cur": {"DIG.4.1": {"tipo": "ce", "texto": "Identificar y resolver problemas técnicos sencillos, conectar y configurar dispositivos a redes domésticas, aplicando los conocimientos de hardware y sistemas operativos, para gestionar de forma sostenible las herramientas e instalaciones informáticas y de comunicación de uso cotidiano.", "descriptores": ["STEM1", "STEM2", "CD4", "CD5", "CPSAA1", "CPSAA5", "CE3"]}, "DIG.4.2": {"tipo": "ce", "texto": "Configurar el entorno personal de aprendizaje, interactuando y aprovechando los recursos del ámbito digital, para optimizar y gestionar el aprendizaje permanente.", "descriptores": ["CD1", "CD2", "CD3", "CPSAA1", "CPSAA4", "CPSAA5", "CE3"]}, "DIG.4.3": {"tipo": "ce", "texto": "Desarrollar hábitos que fomenten el bienestar digital, aplicando medidas preventivas y correctivas, para proteger dispositivos, datos personales y la propia salud.", "descriptores": ["CCL3", "STEM5", "CD1", "CD4", "CPSAA2", "CPSAA5", "CC2", "CC3"]}, "DIG.4.4": {"tipo": "ce", "texto": "Ejercer una ciudadanía digital crítica, conociendo las posibles acciones que realizar en la red, e identificando sus repercusiones, para hacer un uso activo, responsable y ético de la tecnología.", "descriptores": ["CD3", "CD4", "CPSAA1", "CC1", "CC2", "CC3", "CC4", "CE1"]}, "DIG.4.1.1": {"tipo": "cr", "texto": "Conectar dispositivos y gestionar redes locales aplicando los conocimientos y procesos asociados a sistemas de comunicación alámbrica e inalámbrica con una actitud proactiva.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1", "DIG.4.A.4", "DIG.4.A.3"]}, "DIG.4.1.2": {"tipo": "cr", "texto": "Instalar y mantener sistemas operativos, configurando sus características en función de sus necesidades personales, de forma sostenible.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.2"]}, "DIG.4.1.3": {"tipo": "cr", "texto": "Identificar y resolver problemas técnicos sencillos, analizando componentes y funciones de los dispositivos digitales, evaluando las soluciones de manera crítica y reformulando el procedimiento, en caso necesario, fomentando un consumo y reposición de los sistemas digitales y/o tecnológicos de manera sostenible y responsable.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1"]}, "DIG.4.2.1": {"tipo": "cr", "texto": "Gestionar el aprendizaje en el ámbito digital, configurando el entorno personal de aprendizaje mediante la integración de recursos digitales de manera autónoma.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.D.1"]}, "DIG.4.2.2": {"tipo": "cr", "texto": "Buscar, seleccionar y archivar información en función de sus necesidades haciendo uso de las herramientas del entorno personal de aprendizaje con sentido crítico y siguiendo normas básicas de seguridad en la red.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.C.2", "DIG.4.C.3"]}, "DIG.4.2.3": {"tipo": "cr", "texto": "Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.D.1"]}, "DIG.4.2.4": {"tipo": "cr", "texto": "Interactuar en espacios virtuales de comunicación y plataformas de aprendizaje colaborativo, compartiendo y publicando información y datos, adaptándose a diferentes audiencias con una actitud participativa y respetuosa.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.3", "DIG.4.D.5", "DIG.4.D.6"]}, "DIG.4.3.1": {"tipo": "cr", "texto": "Proteger los datos personales y la huella digital generada en internet, configurando las condiciones de privacidad de las redes sociales y espacios virtuales de trabajo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.2"]}, "DIG.4.3.2": {"tipo": "cr", "texto": "Configurar y actualizar contraseñas, sistemas operativos y antivirus de forma periódica en los distintos dispositivos digitales de uso habitual.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.1"]}, "DIG.4.3.3": {"tipo": "cr", "texto": "Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.3"]}, "DIG.4.4.1": {"tipo": "cr", "texto": "Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.5"]}, "DIG.4.4.2": {"tipo": "cr", "texto": "Reconocer las aportaciones de las tecnologías digitales en las gestiones administrativas, y el comercio electrónico, siendo consciente de la brecha social de acceso, uso y aprovechamiento de dichas tecnologías para diversos colectivos.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.4"]}, "DIG.4.4.3": {"tipo": "cr", "texto": "Valorar la importancia de la oportunidad, facilidad y libertad de expresión que suponen los medios digitales conectados, analizando de forma crítica los mensajes que se reciben y transmiten teniendo en cuenta su objetividad, ideología, intencionalidad, sesgos y caducidad.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.6"]}, "DIG.4.4.4": {"tipo": "cr", "texto": "Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.5"]}, "DIG.4.A": {"tipo": "sb", "texto": "Dispositivos digitales, sistemas operativos y de comunicación.", "hijos": ["DIG.4.A.1", "DIG.4.A.2", "DIG.4.A.3", "DIG.4.A.4"], "criterios": []}, "DIG.4.A.1": {"tipo": "sb", "texto": "Arquitectura de ordenadores: elementos, montaje, configuración y resolución de problemas.", "hijos": [], "criterios": []}, "DIG.4.A.2": {"tipo": "sb", "texto": "Sistemas operativos: instalación y configuración de usuario.", "hijos": [], "criterios": []}, "DIG.4.A.3": {"tipo": "sb", "texto": "Sistemas de comunicación e internet: dispositivos de red y funcionamiento. Procedimiento de configuración de una red doméstica y conexión de dispositivos.", "hijos": [], "criterios": []}, "DIG.4.A.4": {"tipo": "sb", "texto": "Dispositivos conectados (IoT + Wearables): configuración y conexión de dispositivos.", "hijos": [], "criterios": []}, "DIG.4.B": {"tipo": "sb", "texto": "Digitalización del entorno personal de aprendizaje.", "hijos": ["DIG.4.B.1", "DIG.4.B.2", "DIG.4.B.3", "DIG.4.B.4"], "criterios": []}, "DIG.4.B.1": {"tipo": "sb", "texto": "Búsqueda, administración, gestión, selección y archivo de información.", "hijos": [], "criterios": []}, "DIG.4.B.2": {"tipo": "sb", "texto": "Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.B.3": {"tipo": "sb", "texto": "Comunicación y colaboración en red.", "hijos": [], "criterios": []}, "DIG.4.B.4": {"tipo": "sb", "texto": "Publicación y difusión responsable en redes.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.C": {"tipo": "sb", "texto": "Seguridad y bienestar digital.", "hijos": ["DIG.4.C.1", "DIG.4.C.2", "DIG.4.C.3"], "criterios": []}, "DIG.4.C.1": {"tipo": "sb", "texto": "Seguridad de dispositivos: medidas preventivas y correctivas para hacer frente a riesgos, amenazas y ataques a dispositivos.", "hijos": [], "criterios": []}, "DIG.4.C.2": {"tipo": "sb", "texto": "Seguridad y protección de datos: identidad, reputación digital, privacidad y huella digital. Medidas preventivas en la configuración de redes sociales y la gestión de identidades virtuales.", "hijos": [], "criterios": []}, "DIG.4.C.3": {"tipo": "sb", "texto": "Seguridad en la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).", "hijos": [], "criterios": ["DIG.4.3.3"]}, "DIG.4.D": {"tipo": "sb", "texto": "Ciudadanía digital crítica.", "hijos": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.3", "DIG.4.D.4", "DIG.4.D.5", "DIG.4.D.6"], "criterios": []}, "DIG.4.D.1": {"tipo": "sb", "texto": "Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.D.2": {"tipo": "sb", "texto": "Educación mediática: periodismo digital, blogosfera, estrategias comunicativas y uso crítico de la red. Herramientas para detectar noticias falsas y fraudes.", "hijos": [], "criterios": []}, "DIG.4.D.3": {"tipo": "sb", "texto": "Gestiones administrativas: servicios públicos en línea, registros digitales y certificados oficiales.", "hijos": [], "criterios": ["DIG.4.4.1"]}, "DIG.4.D.4": {"tipo": "sb", "texto": "Comercio electrónico: facturas digitales, formas de pago y criptomonedas.", "hijos": [], "criterios": []}, "DIG.4.D.5": {"tipo": "sb", "texto": "Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.", "hijos": [], "criterios": ["DIG.4.4.1", "DIG.4.4.4"]}, "DIG.4.D.6": {"tipo": "sb", "texto": "Activismo en línea: plataformas de iniciativa ciudadana y cibervoluntariado y comunidades de hardware y software libres.", "hijos": [], "criterios": []}, "CCL1": {"tipo": "de", "texto": "Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.", "competencias": []}, "CCL2": {"tipo": "de", "texto": "Comprende, interpreta y valora con actitud crítica textos orales, escritos, signados o multimodales de los ámbitos personal, social, educativo y profesional para participar en diferentes contextos de manera activa e informada y para construir conocimiento.", "competencias": []}, "CCL3": {"tipo": "de", "texto": "Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": ["DIG.4.3"]}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": []}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": []}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": []}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": ["DIG.4.3"]}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["DIG.4.2", "DIG.4.3"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": ["DIG.4.2"]}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["DIG.4.2", "DIG.4.4"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["DIG.4.3", "DIG.4.4"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": []}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": ["DIG.4.2", "DIG.4.4"]}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": ["DIG.4.3"]}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": []}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": ["DIG.4.2"]}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["DIG.4.2", "DIG.4.3"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": ["DIG.4.4"]}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": ["DIG.4.3", "DIG.4.4"]}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": ["DIG.4.3", "DIG.4.4"]}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": ["DIG.4.4"]}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": ["DIG.4.4"]}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["DIG.4.2"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": []}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": []}}, "idx": {"criterios": ["DIG.4.2.3", "DIG.4.3.3", "DIG.4.4.1", "DIG.4.4.4"], "competencias": ["DIG.4.2", "DIG.4.3", "DIG.4.4"], "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.C.3", "DIG.4.D.1", "DIG.4.D.5"], "descriptores": ["CC1", "CC2", "CC3", "CC4", "CCL3", "CD1", "CD2", "CD3", "CD4", "CE1", "CE3", "CPSAA1", "CPSAA2", "CPSAA4", "CPSAA5", "STEM5"], "sesionesPorCriterio": {"DIG.4.3.3": [2, 3, 12], "DIG.4.4.4": [4, 5, 10, 11], "DIG.4.4.1": [5, 7, 11], "DIG.4.2.3": [6, 8, 9, 12]}, "porMateria": [{"codigo": "DIG", "criterios": ["DIG.4.2.3", "DIG.4.3.3", "DIG.4.4.1", "DIG.4.4.4"], "competencias": ["DIG.4.2", "DIG.4.3", "DIG.4.4"], "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.C.3", "DIG.4.D.1", "DIG.4.D.5"], "descriptores": ["CC1", "CC2", "CC3", "CC4", "CCL3", "CD1", "CD2", "CD3", "CD4", "CE1", "CE3", "CPSAA1", "CPSAA2", "CPSAA4", "CPSAA5", "STEM5"]}], "materiasTxt": "Digitalización"}, "seneca": {"titulo": "SdA 3: Ética, Salud Digital y Sostenibilidad Ecosocial", "temporalizacion": "12 sesiones", "justificacion": "El alumnado de 4.º ESO investiga los efectos físicos y psicológicos del uso intensivo de la tecnología y el impacto ambiental y social de los centros de datos y la inteligencia artificial. Con lo aprendido crea un cómic digital interactivo para el alumnado del primer ciclo, respetando licencias y privacidad, y defiende una postura ética en un debate estructurado.", "producto_final": "Cómic digital interactivo en Genially (formato vertical para redes, 6-9 viñetas) sobre una de dos líneas: A) salud digital (ergonomía, tecnoestrés, nomofobia) o B) huella ecosocial de los centros de datos y la IA. Incluye ventanas emergentes con datos y fuentes, una decisión interactiva para el lector, créditos y licencia Creative Commons. Se complementa con una guía-argumentario y un debate estructurado en el aula.", "concrecion": [{"materia": "Digitalización", "texto": "COMPETENCIAS ESPECÍFICAS\nDIG.4.2.Configurar el entorno personal de aprendizaje, interactuando y aprovechando los recursos del ámbito digital, para optimizar y gestionar el aprendizaje permanente.\nDIG.4.3.Desarrollar hábitos que fomenten el bienestar digital, aplicando medidas preventivas y correctivas, para proteger dispositivos, datos personales y la propia salud.\nDIG.4.4.Ejercer una ciudadanía digital crítica, conociendo las posibles acciones que realizar en la red, e identificando sus repercusiones, para hacer un uso activo, responsable y ético de la tecnología.\n\nCRITERIOS DE EVALUACIÓN\nDIG.4.2.3.Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.\nDIG.4.3.3.Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.\nDIG.4.4.1.Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.\nDIG.4.4.4.Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.\n\nSABERES BÁSICOS\nDIG.4.B.2.Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.\nDIG.4.B.4.Publicación y difusión responsable en redes.\nDIG.4.C.3.Seguridad en la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).\nDIG.4.D.1.Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.\nDIG.4.D.5.Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.\n\nDESCRIPTORES OPERATIVOS\nCC1. Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA2. Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable."}], "actividades": [{"titulo": "¿Cuánto pesa un like?", "tipo": "Motivación", "abreviatura": "MOT1", "orden": "1", "descripcion": "Sesión 1 (50 min): Gancho: ¿cuánto pesa un like?\nReto: Descubrir que cada vídeo y cada like tiene un coste para nuestro cuerpo, nuestra mente y el planeta, y conocer el reto de la SdA.\n- Levántate si… (10 min). El docente lee afirmaciones y se levanta quien se identifica: «miro el móvil nada más despertarme», «me ha dolido el cuello o la vista después de jugar o hacer scroll», «me he dormido más tarde de lo que quería por el móvil», «he usado un chatbot de IA esta semana». Después proyecta una foto de un centro de datos y pregunta: «¿Dónde vive el último vídeo de TikTok que habéis visto?». Se recogen hipótesis en la pizarra sin corregirlas.\n- Encuesta diagnóstica (12 min). Cada estudiante responde un Google Forms anónimo de 8 preguntas: horas de pantalla estimadas al día, apps más usadas, uso del móvil en la cama, molestias físicas (cuello, ojos, muñecas), si ha oído hablar de nomofobia y tecnoestrés, si cree que la nube contamina y si usa IA. El docente proyecta los gráficos de resultados en directo y comenta 2-3 datos llamativos de la clase.\n- Tabla SQA (13 min). Por parejas, en una plantilla de Google Docs, rellenan las columnas «Qué sé» y «Qué quiero saber» sobre tres temas: mi cuerpo y la pantalla, mi cabeza y las redes, el planeta y la nube. Se ponen en común las preguntas más repetidas, que se convierten en preguntas de investigación de la SdA.\n- Presentación del reto (10 min). El docente presenta el encargo, la pregunta guía y un ejemplo de cómic interactivo en Genially hecho por él o ella (3-4 viñetas, con una ventana emergente de dato y fuente). Enseña en Moodle la sección de la SdA, el calendario y las rúbricas del cómic y del argumentario, para que el alumnado sepa desde el principio cómo se le evalúa.\n- Equipos y roles (5 min). Se forman equipos de 3-4 (excepcionalmente de 2) equilibrados por el docente. Cada equipo reparte provisionalmente los roles de guionista, ilustrador/a-maquetador/a, investigador/a de datos y portavoz con tarjetas de rol.\n- Evidencia: Encuesta diagnóstica (Google Forms)\n- Evidencia: Tabla SQA inicial", "temporalizacion": "1 sesión", "recursos": "Proyector, Google Forms, Plantilla SQA", "descriptores": "(Sin criterios vinculados)", "vinculacion": "Sin criterios vinculados (actividad no calificable)", "ejercicios": "Responde la encuesta anónima sobre tus hábitos digitales.\nCompleta con tu pareja las columnas «Qué sé» y «Qué quiero saber» de la tabla SQA.", "metodologias": "Rutina de pensamiento, ABP", "sesiones": [1]}, {"titulo": "Mi cuerpo y mi mente frente a la pantalla", "tipo": "Exploración", "abreviatura": "EXP1", "orden": "2", "descripcion": "Sesión 2 (50 min): El cuerpo frente a la pantalla: ergonomía y salud física\nReto: Revisar y mejorar el propio puesto de trabajo y registrar los hábitos de uso de pantallas.\n- ¿Cuánto pesa tu cabeza? (8 min). El docente pasa una mochila con unos 5 kg: es lo que pesa aproximadamente una cabeza adulta. Explica que, al inclinar el cuello para mirar el móvil, la carga que soporta la columna cervical se multiplica (un estudio de 2014 la estimó en unos 27 kg a 60 grados). El alumnado imita la postura de «cuello de texto» y la compara con la postura correcta.\n- Mini-lección de ergonomía (12 min). Con una infografía de lectura fácil, el docente explica el puesto ergonómico: borde superior de la pantalla a la altura de los ojos, distancia de un brazo, espalda apoyada, pies en el suelo, muñecas rectas y luz sin reflejos. Añade la fatiga visual y la regla 20-20-20 (cada 20 minutos, mirar 20 segundos algo a unos 6 metros), el efecto de las pantallas antes de dormir sobre el sueño y el sedentarismo.\n- Auditoría ergonómica por parejas (15 min). Con una lista de verificación de 6 puntos, cada estudiante revisa el puesto de su pareja en el aula de informática, ajusta silla y pantalla y fotografía solo el puesto (sin personas ni pantallas con datos). Anotan dos mejoras concretas que se pueden aplicar en casa (p. ej. «subir el portátil con dos libros», «poner un recordatorio de pausa cada 40 minutos»).\n- Mi registro de salud digital (10 min). El docente muestra en el proyector dónde se consultan «Bienestar digital» (Android) y «Tiempo de uso» (iPhone). Cada estudiante empieza la ficha con su estimación y la completa en casa con los datos reales (horas al día, app más usada, número de desbloqueos), sin capturas que muestren nombres, mensajes o contactos.\n- Pausa activa (5 min). Un estudiante voluntario dirige con una tarjeta de imágenes tres estiramientos de cuello, hombros y muñecas. Se acuerda repetir la pausa a mitad de las sesiones largas de ordenador.\n- Moodle Centros: Tarea «S2 · Mi puesto ergonómico y mi registro digital (DIG.4.3.3)» (corrección Apto / No apto). Recoger la ficha de auditoría ergonómica y el registro de hábitos como evidencia del criterio DIG.4.3.3.\n- Evidencia: Ficha de auditoría ergonómica\n- Evidencia: Registro de salud digital\n\nSesión 3 (50 min): Mente conectada: tecnoestrés, nomofobia y diseño persuasivo\nReto: Reconocer cómo las apps captan nuestra atención, identificar señales de tecnoestrés y nomofobia y empezar a cazar bulos.\n- ¿Quién manda: tú o la app? (8 min). El docente proyecta capturas de diseño persuasivo: scroll infinito, reproducción automática, notificaciones en rojo, rachas de Snapchat, «me gusta» que aparecen poco a poco. Pregunta qué tienen en común con una máquina tragaperras (recompensa variable). El alumnado señala qué truco le «engancha» más en una votación a mano alzada.\n- Conceptos clave (12 min). Explicación con ejemplos cercanos: tecnoestrés, nomofobia (miedo a estar sin móvil), FOMO, dependencia tecnológica y comparación social con filtros. Señales de alerta (ansiedad sin móvil, sueño alterado, bajar el rendimiento) y dónde pedir ayuda: tutoría, Orientación, familia y la línea 017 de INCIBE para dudas de seguridad y bienestar en internet.\n- Mi test de nomofobia (10 min). Cada estudiante responde de forma privada una versión breve y adaptada de un cuestionario de nomofobia (10 ítems del 1 al 7). La puntuación no se comparte: solo se reflexiona por escrito sobre qué ítem le ha sorprendido. Mensaje del docente: el test orienta, no diagnostica.\n- Cazadores de bulos (15 min). El docente presenta tres afirmaciones virales: «La luz azul del móvil te deja ciego», «Borrar tus correos antiguos salva el planeta» y «La nube no contamina porque no es nada físico». Cada equipo elige una y la verifica con la ficha SIFT (para, investiga la fuente, busca otras fuentes, vuelve al origen) consultando Maldita.es, Newtral o EFE Verifica y fuentes oficiales. Publican el resultado en el foro de Moodle.\n- Mi plan de desconexión (5 min). Cada estudiante escribe en un pósit un hábito que va a probar durante la SdA (p. ej. «quitar las notificaciones de una app», «móvil fuera de la habitación al dormir»). Se guardan para revisarlos en la sesión 12.\n- Moodle Centros: Foro «S3 · Cazadores de bulos digitales». Cada equipo publica al menos un bulo sobre salud digital, IA o tecnología y medio ambiente: dónde lo vio, qué técnica usó para verificarlo, conclusión y enlace a una fuente fiable. Queda abierto hasta la sesión 5 y alimenta el cómic.\n- Evidencia: Reflexión del test de nomofobia\n- Evidencia: Entrada del foro de bulos\n- Evidencia: Plan de desconexión", "temporalizacion": "2 sesiónes", "recursos": "Infografía de ergonomía, Lista de verificación, Mochila de 5 kg, Proyector, Ficha SIFT, Foro de Moodle", "descriptores": "CC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCPSAA2. Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "vinculacion": "Trazabilidad: LISTA DE COTEJO\nDIG.4.3.3.Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.\n\nTrazabilidad: Búsqueda de información.\nDIG.4.3.3.Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.", "ejercicios": "Revisa el puesto de tu compañero o compañera con la lista de verificación y propón dos mejoras.\nCompleta en casa tu registro de salud digital con los datos de tu móvil o una estimación.\nIdentifica en una app que uses tres trucos de diseño persuasivo.\nVerifica una afirmación viral con la ficha SIFT y publica el resultado en el foro.\nEscribe un hábito de desconexión que vas a probar.", "metodologias": "Aprendizaje cooperativo, Aprendizaje experiencial, Pensamiento crítico", "sesiones": [2, 3]}, {"titulo": "La nube no es una nube: huella y dilemas éticos", "tipo": "Exploración", "abreviatura": "EXP2", "orden": "3", "descripcion": "Sesión 4 (50 min): La nube no es una nube: centros de datos, IA y residuos\nReto: Comprender el impacto energético, hídrico, material y social de los centros de datos y de la inteligencia artificial.\n- ¿Dónde está tu foto? (8 min). El docente proyecta fotos de un centro de datos (pasillos de servidores, sistemas de refrigeración) y un mapa con los principales centros de datos de España. Pregunta: «¿Qué necesita este edificio para funcionar las 24 horas?». El alumnado propone respuestas (electricidad, agua, suelo, minerales, personas) que se anotan en la pizarra.\n- Puzle de expertos (27 min). Cada miembro del equipo recibe una ficha de lectura fácil con datos: 1) Energía: según la Agencia Internacional de la Energía, los centros de datos consumieron en torno al 1,5 % de la electricidad mundial en 2024 y su consumo podría duplicarse hacia 2030, en buena parte por la IA; diferencia entre entrenar un modelo y usarlo. 2) Agua: refrigeración de servidores y la polémica por centros de datos proyectados en zonas con sequía en España. 3) Residuos y materiales: según el Global E-waste Monitor, en 2022 se generaron unos 62 millones de toneladas de residuos electrónicos y menos de una cuarta parte se recicló de forma documentada; minerales y obsolescencia programada. 4) Lo social: empleo, soberanía tecnológica, brecha digital y usos positivos (IA para gestionar redes eléctricas o predecir sequías). Se reúnen los expertos de cada ficha 12 minutos y vuelven a su equipo 15 minutos para explicarla.\n- Huella de la clase (10 min). Con una hoja de Google Sheets preparada, cada equipo introduce las horas de vídeo y de uso de IA de la clase (de la encuesta de la sesión 1) y la hoja aplica un factor de referencia que facilita el docente a partir de una fuente actual. Se compara el resultado con algo cotidiano (cargas de móvil, horas de una bombilla) y se insiste en que son estimaciones con mucha incertidumbre.\n- Mapa de impactos y soluciones (5 min). Entre todos completan en la pizarra un mapa de dos columnas: impactos y soluciones posibles (energías renovables, alargar la vida de los dispositivos, ver vídeo en menor resolución, usar la IA cuando aporta).\n- Evidencia: Fichas de experto completadas\n- Evidencia: Hoja de cálculo de huella de la clase\n\nSesión 5 (50 min): Dilemas éticos de la tecnología y elección de la línea del cómic\nReto: Posicionarse ante dilemas éticos de la IA y la tecnología argumentando con respeto y elegir la línea y el mensaje del cómic.\n- Lo mejor del foro (7 min). El docente proyecta 2-3 entradas del foro de bulos y pregunta qué técnica de verificación funcionó mejor. Se destaca alguna entrada por su buena fuente.\n- Dilemas en los rincones (20 min). Cuatro carteles en el aula: «De acuerdo», «En desacuerdo», «Depende» y «No lo sé». El docente lee cuatro dilemas: a) ¿Generamos las ilustraciones del cómic con IA o dibujamos y usamos imágenes con licencia libre? b) Un influencer estrena un móvil cada año y lo promociona. c) Una app gratuita de sueño vende tus datos a anunciantes. d) Un generador de imágenes muestra siempre a ingenieros hombres y a enfermeras mujeres. El alumnado se mueve al rincón que elige y argumenta con frases-andamio («Pienso que… porque…», «Entiendo tu idea, pero…»).\n- Normas del buen debate (8 min). A partir de lo vivido, la clase consensúa 5 normas de netiqueta para el foro, las redes y el debate final: criticar ideas y no a personas, citar la fuente, no compartir datos ajenos, respetar el turno, no difundir lo que no se ha verificado.\n- Elegimos línea y mensaje (10 min). Cada equipo elige la línea A (salud digital: ergonomía, tecnoestrés, nomofobia) o B (huella ecosocial de servidores e IA) y escribe en Google Docs su mensaje clave en una frase y su público (alumnado de 1.º y 2.º ESO). El docente comprueba que haya equipos en las dos líneas.\n- Ticket de salida (5 min). Cada estudiante responde: «¿Qué dilema te ha hecho dudar y por qué?».\n- Evidencia: Registro de observación de los dilemas\n- Evidencia: Normas del debate\n- Evidencia: Ticket de salida", "temporalizacion": "2 sesiónes", "recursos": "Fichas de expertos, Google Sheets, Proyector, Carteles de rincones, Tarjetas de frases-andamio", "descriptores": "CC1. Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "vinculacion": "Trazabilidad: Realización de actividades.\nDIG.4.4.4.Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.\n\nTrazabilidad: OBSERVACIÓN DIRECTA\nDIG.4.4.1.Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.\nDIG.4.4.4.Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.", "ejercicios": "Explica a tu equipo el impacto de tu ficha de experto con un dato y su fuente.\nCalcula con la hoja de cálculo la huella estimada de la clase en una semana.\nElige un rincón en cada dilema y explica tu postura con una frase-andamio.\nEscribe con tu equipo el mensaje clave del cómic y el público al que va dirigido.", "metodologias": "Puzle de expertos (Jigsaw), Aprendizaje cooperativo, Dilemas morales, Rutina de pensamiento", "sesiones": [4, 5]}, {"titulo": "Creamos el cómic interactivo", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "4", "descripcion": "Sesión 6 (50 min): Narrativa visual: del mensaje al guion y al storyboard\nReto: Convertir el mensaje del equipo en una historia de 6-9 viñetas con un guion y un boceto.\n- Leemos cómics (10 min). El docente proyecta dos tiras cortas con licencia libre o propias e identifica con la clase los elementos del cómic: viñeta, bocadillo (de diálogo, de pensamiento, de grito), cartela, onomatopeya, plano (general, medio, primer plano) y elipsis. El alumnado los señala en la tira.\n- Cómo se construye la historia (10 min). Mini-lección: estructura en tres actos (situación inicial, conflicto, resolución), un personaje con el que se identifique el público, un «giro de datos» (un botón que abre un dato real con su fuente) y un final con decisión para el lector. Ejemplo: «Lucía no puede dormir… ¿apaga el móvil o sigue con el scroll?».\n- Guion (15 min). Con la plantilla de guion en Google Docs, el equipo completa una fila por viñeta: qué se ve, qué dicen los personajes, dato y fuente (si lo hay) y elemento interactivo. El guionista coordina; el investigador o investigadora aporta los datos de las sesiones 2-4.\n- Storyboard (15 min). El ilustrador o ilustradora y el resto del equipo bocetan las viñetas en una plantilla de papel o en Google Drawings. Basta con figuras sencillas y flechas: importa el encuadre y el orden. El docente revisa que el mensaje se entienda sin leer todo el texto.\n- Evidencia: Guion del cómic\n- Evidencia: Storyboard\n\nSesión 7 (50 min): Créditos, licencias y uso ético de imágenes e IA\nReto: Elegir recursos que se pueden usar legalmente, atribuirlos bien y decidir cómo se usa la IA en el cómic.\n- ¿Puedo usar esta imagen? (8 min). Cinco casos proyectados que el alumnado vota con tarjetas verde, amarilla o roja: un meme con un fotograma de una serie, una foto sacada de Google Imágenes, una imagen de Openverse con licencia CC BY, una ilustración generada con IA y una foto de un compañero en el patio. Se discute cada caso.\n- Licencias y atribución (12 min). El docente explica las licencias Creative Commons (BY, SA, NC, ND), el dominio público y cómo atribuir con la regla TASL (título, autor/a, fuente, licencia). Sobre la IA generativa: declarar la herramienta y para qué se usó, no imitar el estilo de artistas concretos ni personajes protegidos y valorar su huella. Privacidad: ni fotos ni nombres reales del alumnado en el cómic.\n- Búsqueda de recursos (20 min). Cada equipo busca en Openverse, Wikimedia Commons y en los recursos de Genially los personajes, fondos e iconos que necesita y rellena la ficha de créditos (una línea TASL por recurso). Si decide usar IA, anota la herramienta y la instrucción usada.\n- Ajuste y entrega (10 min). El docente devuelve comentarios rápidos sobre el guion. El equipo corrige, fotografía o exporta el storyboard y entrega guion, storyboard y ficha de créditos en Moodle.\n- Moodle Centros: Tarea «S7 · Guion, storyboard y ficha de créditos (DIG.4.4.1)» (corrección Apto / No apto). Comprobar que el equipo ha planificado el cómic y que todos los recursos externos se usan de forma ética y legal antes de empezar la producción.\n- Evidencia: Ficha de créditos\n- Evidencia: Guion y storyboard revisados\n\nSesión 8 (50 min): Producción en Genially I: maquetamos las viñetas\nReto: Pasar el storyboard a Genially y dejar terminada al menos la primera mitad del cómic.\n- Demostración guiada (10 min). El docente muestra en el proyector la plantilla base del cómic en Genially (formato vertical para móvil): duplicar páginas, insertar personajes y fondos, añadir bocadillos con texto legible y crear un botón que abre una ventana emergente con un dato y su fuente. Comparte un vídeo corto con los mismos pasos en Moodle.\n- Taller de producción (35 min). Cada equipo maqueta las viñetas 1 a 5 siguiendo el storyboard, con los roles: ilustrador/a-maquetador/a monta las viñetas, guionista revisa los textos, investigador/a prepara las ventanas de datos y portavoz controla tiempos y la ficha de créditos. A mitad de sesión se hace una pausa activa de un minuto y cada equipo enseña una viñeta terminada al docente, que revisa con la lista de cotejo.\n- Guardado y semáforo (5 min). El equipo comparte el Genially con el docente como colaborador y marca su avance en un semáforo (verde, amarillo, rojo) en un documento compartido para planificar la sesión siguiente.\n- Evidencia: Genially con las viñetas 1-5\n\nSesión 9 (50 min): Producción en Genially II: interactividad, accesibilidad y revisión\nReto: Terminar el cómic, hacerlo accesible y mejorarlo con la revisión de otro equipo.\n- Mini-lección: accesible y responsable (8 min). El docente explica en 4 diapositivas: contraste y tamaño de letra para leer en el móvil, texto alternativo en las imágenes, no depender solo del color, decisión interactiva con dos finales, página final de créditos y licencia del propio cómic (p. ej. CC BY-NC-SA) y publicación responsable (sin datos personales, etiquetas adecuadas, pensar en quién lo verá).\n- Producción final (25 min). Los equipos terminan las viñetas, la decisión interactiva, las ventanas de datos y la página de créditos. El docente atiende primero a los equipos en rojo del semáforo.\n- Escalera de retroalimentación (12 min). Cada equipo revisa el cómic de otro con los cuatro peldaños (aclarar, valorar, preocuparse, sugerir) apoyándose en las líneas de la rúbrica, y deja sus comentarios en una ficha de Google Docs.\n- Ajustes y entrega (5 min). El equipo aplica al menos una sugerencia recibida y entrega el enlace del Genially en Moodle. Puede terminar los ajustes hasta el día anterior a la sesión 10.\n- Moodle Centros: Tarea «S9 · Cómic digital interactivo para redes (DIG.4.2.3)» (evaluada con rúbrica 1-3-5-7-10). Entrega del producto final: enlace del Genially publicado y ficha de créditos actualizada.\n- Evidencia: Cómic digital interactivo terminado\n- Evidencia: Ficha de retroalimentación entre equipos", "temporalizacion": "4 sesiónes", "recursos": "Plantilla de guion, Plantilla de viñetas, Proyector, Openverse, Wikimedia Commons, Plantilla de créditos, Genially para Educación, Plantilla base, Vídeo tutorial, Ficha de escalera de retroalimentación", "descriptores": "CC1. Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "vinculacion": "Trazabilidad: LISTA DE COTEJO\nDIG.4.4.1.Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.\n\nTrazabilidad: RÚBRICA\nDIG.4.2.3.Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.", "ejercicios": "Señala en una tira cómica una viñeta, un bocadillo, una cartela y un plano.\nCompleta con tu equipo el guion de 6 a 9 viñetas y su storyboard.\nDecide si puedes usar cada una de las cinco imágenes y explica por qué.\nCompleta la ficha de créditos del cómic con la regla TASL.\nMonta en Genially las viñetas 1 a 5 de tu cómic.\nCrea un botón que abra una ventana con un dato y su fuente.\nAñade a tu cómic la decisión interactiva, las ventanas de datos y la página de créditos.\nRevisa el cómic de otro equipo con la escalera de retroalimentación.", "metodologias": "Narrativa visual, Aprendizaje cooperativo, Aprendizaje basado en casos, Aprendizaje basado en la práctica, Coevaluación", "sesiones": [6, 7, 8, 9]}, {"titulo": "Debatimos, publicamos y reflexionamos", "tipo": "Conclusión", "abreviatura": "CON1", "orden": "5", "descripcion": "Sesión 10 (50 min): Preparamos el debate: guía-argumentario\nReto: Preparar con datos y fuentes la postura asignada en el debate y prever qué dirá el otro equipo.\n- Formato del debate (8 min). El docente presenta las dos mociones: A) «Las redes sociales deberían desactivar por defecto el scroll infinito y la reproducción automática para menores de 18 años»; B) «El instituto debería limitar el uso de la IA generativa por su impacto ambiental». Se forman cuatro equipos de debate de 5-6 personas (a favor y en contra de cada moción) mezclando equipos del cómic, y se sortea la postura. Se explican los turnos: introducción, argumentación, réplica y conclusión.\n- Guía-argumentario (22 min). Cada equipo de debate completa la plantilla en Google Docs: tesis en una frase, tres argumentos con un dato y su fuente (pueden reutilizar los de las fichas de experto, el foro y los cómics), dos contraargumentos que espera del otro equipo con su réplica y dos propuestas concretas de uso responsable. Se reparten los turnos entre sus miembros.\n- Ensayo cronometrado (15 min). Cada persona ensaya su intervención de 1 minuto ante su equipo, que la cronometra y le da una mejora. Se usan tarjetas de frases-andamio («Según…», «Este dato demuestra que…», «Nuestros oponentes dicen…, pero…»).\n- Entrega (5 min). El portavoz sube la guía-argumentario a Moodle.\n- Moodle Centros: Tarea «S10 · Guía-argumentario del debate (DIG.4.4.4)» (evaluada con rúbrica 1-3-5-7-10). Recoger la preparación del debate como evidencia del análisis ecosocial y ético de la tecnología.\n- Evidencia: Guía-argumentario del equipo\n\nSesión 11 (50 min): Debate estructurado: ¿qué tecnología queremos?\nReto: Defender una postura con argumentos y datos, escuchar y rebatir con respeto.\n- Preparación del espacio (5 min). Se colocan las mesas en U con los dos equipos enfrentados. Se recuerdan las 5 normas del buen debate de la sesión 5. Los equipos de la otra moción actúan como jurado con una hoja de valoración sencilla (argumentos, datos, respeto, réplica).\n- Debate de la moción A (20 min). Scroll infinito y reproducción automática para menores. Turnos cronometrados por el docente: introducción (2 min por equipo), argumentación (3 min por equipo), réplica (2 min por equipo) y conclusión (1,5 min por equipo). Tras el debate, el jurado delibera 3 minutos y vota.\n- Debate de la moción B (20 min). Limitar la IA generativa en el instituto por su impacto ambiental. Mismo formato; ahora hace de jurado el alumnado de la moción A. El docente registra en la lista de cotejo el uso de datos, el respeto al turno y la calidad de las réplicas.\n- Veredicto y reflexión (5 min). Los jurados comunican su veredicto y la razón principal. El docente cierra preguntando: «¿Qué argumento del equipo contrario os ha hecho dudar?».\n- Evidencia: Registro de observación del debate\n- Evidencia: Hojas de valoración del jurado\n\nSesión 12 (50 min): Galería, publicación responsable y pacto digital\nReto: Presentar el cómic, decidir cómo se publica de forma responsable y reflexionar sobre lo aprendido y los propios hábitos.\n- Galería de cómics (20 min). Cada equipo presenta su cómic en el proyector durante 2-3 minutos: el portavoz explica el mensaje, muestra la decisión interactiva y un dato con su fuente. El resto de la clase anota en un pósit qué le ha enseñado cada cómic. El docente registra la presentación en la lista de cotejo.\n- Publicación responsable (10 min). La clase repasa la lista de publicación: créditos completos, licencia CC, sin datos personales, texto adecuado al público. Se acuerda con el docente dónde se publican: sección de Moodle de 1.º y 2.º ESO, web del centro o perfil del centro en redes, siempre con la autorización de la dirección. Cada equipo redacta el texto de presentación de su cómic (máximo 2 líneas y 3 etiquetas).\n- Metacognición y pacto digital (15 min). Cada estudiante completa la columna «Qué he aprendido» de la tabla SQA, revisa el pósit de su plan de desconexión de la sesión 3 («¿lo he cumplido?, ¿qué me ha costado?») y escribe su pacto digital: un compromiso de salud y otro de sostenibilidad. Se autoevalúa con la lista de cotejo de los criterios.\n- Valoración de la SdA (5 min). Formulario anónimo de Google Forms: qué actividad le ha gustado más, qué cambiaría y cómo se ha sentido en su equipo.\n- Evidencia: Presentación del cómic\n- Evidencia: Tabla SQA completa\n- Evidencia: Pacto digital personal", "temporalizacion": "3 sesiónes", "recursos": "Plantilla de argumentario, Tarjetas de frases-andamio, Cronómetro, Cronómetro visible, Hoja del jurado, Lista de cotejo, Proyector, Pósits, Google Forms", "descriptores": "CC1. Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y e function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }

  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

/* ---------- cabecera ---------- */
const M = S.meta;
$('#h-kicker').textContent = `LOMLOE · Andalucía · ${IDX.materiasTxt} · ${M.curso_texto || ''}`;
$('#h-title').textContent = M.titulo; $('#h-sub').textContent = M.subtitulo || '';
$('#h-meta').innerHTML = [ `${S.sesiones.length} sesiones de ${M.duracion_sesion||50} min`, M.agrupamiento, M.temporalizacion, M.anio_academico ].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');

/* ---------- pestañas ---------- */
const TABS = [['vision','1. Visión general'],['seq','2. Secuenciación'],['map','3. Mapeo curricular'],['moodle','4. Moodle Centros'],['dua','5. DUA y diversidad'],['eval','6. Evaluación'],['seneca','7. Para Séneca']];
$('#tabs').innerHTML = TABS.map(([id,t],i)=>`<button role="tab" data-tab="${id}" aria-selected="${i===0}">${t}</button>`).join('');
$('#main').innerHTML = TABS.map(([id],i)=>`<section class="panel ${i===0?'on':''}" id="p-${id}" role="tabpanel"></section>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+b.dataset.tab)); try{localStorage.setItem('sda-tab',b.dataset.tab)}catch(_){} };
try{ const t = localStorage.getItem('sda-tab'); if(t){ const b = document.querySelector(`#tabs button[data-tab="${t}"]`); b && b.click(); } }catch(_){}
function openAll(){ document.querySelectorAll('details.ses').forEach(d=>d.open=true); }
