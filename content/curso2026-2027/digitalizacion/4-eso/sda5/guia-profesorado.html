<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 5: El mundo de la imagen, edición y transparencia algorítmica", "numero": 5, "subtitulo": "«Cartel con sello propio»: diseñamos el cartel de un evento del centro con imágenes editadas, con licencia y con IA etiquetada", "curso_texto": "4.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Trabajo individual con apoyo en parejas (el cartel puede hacerse en pareja como máximo; las fichas se entregan de forma individual)", "temporalizacion": "Segundo trimestre (orientativo: 4-5 semanas, 9 sesiones de 50 minutos)", "carpeta_drive": "1E8H0NqyXJEFZYBwVHE_YIigO-fc9B_sv"}, "materias": [{"codigo": "DIG", "criterios": ["DIG.4.2.3", "DIG.4.4.1", "DIG.4.4.3"], "saberes": ["DIG.4.B.2", "DIG.4.D.1", "DIG.4.D.5"]}], "vision": {"descripcion": "El alumnado aprende a distinguir imágenes de mapa de bits y vectoriales, a elegir formato y resolución según se vayan a imprimir o publicar, a buscar imágenes en bancos libres y citarlas, a editarlas en GIMP con capas y selecciones, a revisar y borrar los metadatos EXIF que pueden revelar datos personales, y a entender de forma crítica cómo aprende una IA (entrenando su propio modelo con Teachable Machine), qué sesgos reproduce la IA generativa y qué cambia entre editar a mano y editar con IA. Todo confluye en un cartel real para un evento del centro, en versión impresa y digital, que cada estudiante defiende en público ante el centro.", "contexto": "Grupo de 22 estudiantes de 4.º ESO con un currículo adaptado, en su mayoría repetidores o con dificultades de aprendizaje, muy activos en TikTok e Instagram, donde los filtros, los retoques y las imágenes generadas con IA forman parte de su día a día. Aula de informática con un ordenador por estudiante, Google Workspace del centro, Canva para Educación, Genially y Moodle Centros. Se prioriza el trabajo individual con apoyo en parejas y tareas cortas con pasos muy guiados.", "justificacion": "La cultura visual en la que vive el alumnado exige comprender cómo se construyen los gráficos digitales (mapa de bits y vectorial), dominar una edición técnica básica, respetar la propiedad intelectual y el derecho a la propia imagen, y entender críticamente cómo funciona la inteligencia artificial que genera imágenes: con qué datos aprende, qué sesgos reproduce y por qué la transparencia es una obligación ética. Un encargo real del centro da sentido al aprendizaje y a un producto que se imprime, se publica y se defiende en público.", "reto": "«Somos el equipo de diseño del instituto: el centro nos encarga el cartel de un evento del segundo trimestre (la jornada del Día de Andalucía, el Día de Internet Segura, el 8M o la semana cultural). Tiene que verse bien impreso en A3 y en Instagram, usar imágenes editadas por nosotros, de bancos libres y sin metadatos personales, y si usamos IA, decirlo con claridad. Lo defenderemos en público ante el centro.»", "pregunta_guia": "¿Cómo creamos un cartel que llame la atención, que sea legal y que sea honesto con quien lo mira cuando usamos inteligencia artificial?", "producto_final": "Cartel publicitario o informativo para un evento escolar real, en versión impresa (PDF A3) y digital (PNG 1080 × 1350 px), con imágenes editadas en GIMP, recursos de bancos libres citados, sin metadatos personales y con un módulo de imagen generado o retocado con IA debidamente etiquetado, acompañado de su ficha técnica y de créditos y defendido en público ante el centro."}, "metodologias": [{"nombre": "Aprendizaje basado en proyectos", "descripcion": "Un encargo real del centro (el cartel del evento) guía todas las sesiones y cada Tarea es un paso hacia el producto final."}, {"nombre": "Aprender haciendo", "descripcion": "Cada sesión tiene una práctica guiada en el ordenador con pasos numerados y tiempo visible; la teoría se limita a lo que la práctica necesita."}, {"nombre": "Pensamiento crítico", "descripcion": "Experimento de sesgos con IA y análisis de imágenes reales y manipuladas para descubrir quién las crea, con qué intención y cómo se comprueban."}, {"nombre": "Aprendizaje entre iguales", "descripcion": "Parejas de apoyo para las prácticas y revisión entre parejas con la lista «Antes de entregar» antes de la entrega final."}, {"nombre": "Aprendizaje por experimentación", "descripcion": "El alumnado entrena su propio modelo de IA con Teachable Machine y lo pone a prueba con casos trampa para descubrir que la IA aprende lo que hay en sus datos."}], "recursos": {"Espacios y herramientas": ["Aula de informática", "GIMP (o Photopea en el navegador)", "Canva para Educación", "Teachable Machine", "Openverse y Wikimedia Commons", "Google Docs y Forms del centro", "Moodle Centros", "Proyector y webcam", "Impresora A3 del centro"], "Lo que prepara el docente (pendiente)": ["☐ Antes de empezar: compartir la carpeta de Drive de la SdA 5 con «Cualquier persona de la organización con el enlace · Lector» (plantillas A1 y A2 y banco de imágenes).", "☐ Antes de empezar: comprobar que GIMP está instalado en el aula (alternativa: Photopea en el navegador).", "☐ Antes de empezar: comprobar si Canva para Educación tiene activadas para el alumnado Magic Media, Quitar fondo, Magic Edit y Magic Expand.", "☐ Antes de empezar: comprobar que los equipos tienen webcam y que Teachable Machine abre en el navegador del aula.", "☐ Antes de empezar: crear en Moodle la sección, la escala «No apto, Apto», las Tareas 5.1-5.3 con sus rúbricas y pegar el bloque moodle.html.", "☐ Antes de empezar: acordar con el equipo directivo los eventos posibles, la impresión A3 del cartel elegido, su publicación en Instagram y el público invitado a la defensa de la sesión 9.", "☐ Sesión 1: seis imágenes del gancho (foto del patio sin personas, la misma con filtro, foto con un objeto borrado, imagen generada con IA del banco, anuncio con modelo retocada y logotipo del centro).", "☐ Sesión 1: logo.png y logo.svg del centro en la carpeta compartida.", "☐ Sesión 3: carpeta con cinco fotos sin personas (del centro o de dominio público) y una foto del edificio para la demostración.", "☐ Sesión 4: una foto libre con un objeto fácil de recortar (fondo liso) para la demostración de selecciones.", "☐ Sesión 5: foto de ejemplo hecha por ti en un lugar público con el GPS del móvil activado, sin personas, en la carpeta compartida.", "☐ Sesión 6: estuches y botellas para entrenar el modelo; si no hay webcam, carpeta con unas 30 fotos de cada objeto (y algunas trampa).", "☐ Sesión 7: banco de imágenes IA de los seis prompts (cuatro imágenes de cada uno), siguiendo el guion de la carpeta «Banco de imágenes IA» de Drive.", "☐ Sesión 8: módulos IA del banco (fondo ilustrado del evento, foto con fondo ampliado y objeto sin fondo) por si la IA de Canva no está activada.", "☐ Sesión 9: público invitado, espacio reservado, papeletas de votación y cronómetro visible."]}, "fases": [{"nombre": "Teoría de la imagen digital", "sesiones": "1-2", "finalidad": "Motivación, encargo real y diagnóstico; mapa de bits y vectorial, formatos (.jpg, .png, .svg), resolución y bancos de imágenes libres de derechos"}, {"nombre": "Taller de edición y metadatos", "sesiones": "3-5", "finalidad": "Edición técnica en GIMP (capas, selección y exportación) e inspección y borrado de los metadatos EXIF por privacidad"}, {"nombre": "IA gráfica y exposición", "sesiones": "6-9", "finalidad": "Entrenamiento de un modelo de IA con imágenes (Teachable Machine), sesgos de la IA generativa, edición con IA frente a edición manual, composición final del cartel y defensa pública ante el centro"}], "sesiones": [{"n": 1, "fase": "Teoría de la imagen digital", "titulo": "¿Real, retocada o IA? Píxeles y vectores", "reto": "Descubrir que casi todas las imágenes que vemos están editadas o generadas, conocer el encargo y entender por qué unas imágenes se pixelan y otras no.", "actividades": [{"nombre": "Gancho: ¿real, retocada o IA?", "min": 8, "desc": "El docente proyecta seis imágenes: una foto del patio si , "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Votación con gestos para que participe todo el mundo, encuesta con opciones cerradas, infografía con la cuadrícula de píxeles y rúbrica explicada con ejemplos visuales."}, "ejercicios": ["Clasifica seis imágenes como reales, retocadas o generadas con IA y explica una pista.", "Amplía al 800 % un logotipo en PNG y en SVG y explica la diferencia.", "Escribe tres ejemplos de imágenes de mapa de bits y tres de vectoriales."], "clase": {"pregunta": "¿Cuántas de las imágenes que ves hoy en tu móvil son 100 % reales?", "diapositivas": [{"tipo": "ejemplo", "icono": "📱", "titulo": "Tu feed de Instagram", "situacion": "Una foto de vacaciones con el cielo **más azul** de lo normal, una cara sin una sola imperfección, un paisaje imposible.", "explicacion": "Detrás hay **filtros**, **retoque** o una **IA generativa**. En esta SdA aprendes a distinguirlos y a usarlos con cabeza.", "nota": "Antes de esta sesión: seis imágenes del gancho (la de IA está en el banco de Drive) y logo.png y logo.svg del centro en la carpeta compartida."}, {"tipo": "practica", "titulo": "¿Real, retocada o IA?", "tiempo": 8, "enunciado": "Mira cada imagen y vota con la mano: **1 dedo** real, **2** retocada, **3** generada con IA.", "pasos": ["Imagen 1: el patio del instituto.", "Imagen 2: el patio con filtro.", "Imagen 3: una foto con algo borrado.", "Imagen 4: un paisaje creado con IA.", "Imagen 5: un anuncio con modelo.", "Imagen 6: el logotipo del centro."]}, {"tipo": "practica", "titulo": "Encuesta inicial", "tiempo": 7, "enunciado": "Responde la encuesta **anónima**: no hay respuestas buenas ni malas, nos sirve para saber de dónde partimos.", "agrupamiento": "Individual", "enlace": "https://forms.gle/DumEYmaaLG3Hk2jL6"}, {"tipo": "idea", "icono": "🎯", "titulo": "El encargo", "texto": "El centro nos pide el **cartel de un evento** del segundo trimestre.", "puntos": ["Se **imprime** en A3 y se publica en **Instagram**.", "Con imágen e=\"fill:var(--brand)\"/><rect x=\"60\" y=\"80\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"80\" y=\"80\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"100\" y=\"80\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"120\" y=\"80\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"60\" y=\"100\" width=\"20\" height=\"20\"/><rect x=\"80\" y=\"100\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"100\" y=\"100\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"120\" y=\"100\" width=\"20\" height=\"20\"/><\/g><text x=\"100\" y=\"160\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 18px system-ui\">Mapa de bits<\/text><text x=\"100\" y=\"185\" text-anchor=\"middle\" style=\"fill:var(--ink);font:15px system-ui\">16 píxeles, cada uno un color<\/text><circle cx=\"470\" cy=\"80\" r=\"42\" style=\"fill:var(--brand);stroke:var(--brand)\"/><text x=\"470\" y=\"160\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 18px system-ui\">Vectorial<\/text><text x=\"470\" y=\"185\" text-anchor=\"middle\" style=\"fill:var(--ink);font:15px system-ui\">«círculo: centro, radio 42, azul»<\/text><text x=\"320\" y=\"85\" text-anchor=\"middle\" style=\"fill:var(--accent);font:700 28px system-ui\">vs<\/text><text x=\"320\" y=\"220\" text-anchor=\"middle\" style=\"fill:var(--ink);font:600 15px system-ui\">El vectorial se vuelve a dibujar a cualquier tamaño<\/text><\/svg>"}]}, "moodle": []}, {"n": 2, "fase": "Teoría de la imagen digital", "titulo": "Formatos, resolución y bancos de imágenes libres", "reto": "Elegir el formato y la resolución adecuados y encontrar en bancos libres las imágenes del cartel, citándolas bien.", "actividades": [{"nombre": "¿Qué formato es mejor?", "min": 10, "desc": "Se presentan JPG (fotos, comprime con pérdida), PNG (transparencia, sin pérdida), SVG (vectorial para web) y PDF (para imprimir). Práctica: elegir el formato de ocho situaciones de la diapositiva (foto para Instagram, logotipo con fondo transparente, icono de una web, cartel para la imprenta…)."}, {"nombre": "Pantalla o papel", "min": 12, "desc": "En pantalla importan los píxeles (un post vertical de Instagram mide 1080 × 1350 px) y en papel los puntos por pulgada (300 ppp). Cálculo guiado: píxeles = cm ÷ 2,54 × 300; un DINA3 necesita unos 3508 × 4961 px. El alumnado comprueba en el cuaderno que una foto de 1200 × 900 px no sirve para el cartel impreso."}, {"nombre": "¿Puedo usar esta imagen?", "min": 10, "desc": "Caso: una cuenta escolar usa en su cartel una foto sacada de Google Imágenes y el fotógrafo reclama. Explicación breve: todos los derechos reservados por defecto, licencias Creative Commons (BY, SA, NC, ND), dominio público (CC0), derecho a la propia imagen (sin personas reconocibles sin permiso) y cómo se cita (Título, Autor/a, Fuente y Licencia: TAFL)."}, {"nombre": "Búsqueda en bancos libres", "min": 15, "desc": "Cada estudiante busca en Openverse (filtros «Uso comercial permitido» y «Modificar o adaptar») y en Wikimedia Commons al menos tres recursos para su cartel (una foto, una ilustración o icono y, si puede, un SVG), los descarga en su Drive y apunta sus créditos en la Parte 1 de la plantilla A2, que entregará en la Tarea 5.3."}, {"nombre": "Comprobación rápida", "min": 3, "desc": "Quiz proyectado sobre una imagen con licencia CC BY-ND: ¿se puede recortar y poner texto encima?"}], "criterios": ["DIG.4.2.3", "DIG.4.4.1"], "saberes": ["DIG.4.B.2", "DIG.4.D.1"], "metodologia": ["Aprender haciendo", "Pensamiento crítico"], "evidencias": ["Formatos y cálculo de resolución en el cuaderno", "Parte 1 de la plantilla A2 con tres créditos completos"], "recursos": ["Openverse y Wikimedia Commons", "Plantilla A2", "Calculadora"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Fórmula escrita con un ejemplo resuelto, tarjeta visual de las licencias Creative Commons, ejemplo de cita resuelto en la plantilla y capturas de los filtros de Openverse."}, "ejercicios": ["Elige el formato adecuado para ocho situaciones.", "Calcula si una foto de 1200 × 900 px sirve para un cartel A3 a 300 ppp.", "Busca tres imágenes con licencia libre para tu cartel y anota título, autor/a, fuente y licencia."], "clase": {"pregunta": "Si una imagen está en Google, ¿es gratis?", "diapositivas": [{"tipo": "practica", "titulo": "¿Qué formato es mejor?", "tiempo": 10, "enunciado": "Escribe en el cuaderno el formato que elegirías: **JPG, PNG, SVG o PDF**.", "pasos": ["Una foto del patio para Instagram.", "El logotipo con fondo transparente.", "Un icono para la web del centro.", "El cartel que va a la imprenta.", "Una captura de pantalla con texto.", "Una foto para enviar por correo sin que pese mucho.", "Una flecha que se va a ampliar a 2 metros.", "Un dibujo con transparencia para poner sobre una foto."], "ayudas": [{"tipo": "pista", "titulo": "Solución para comprobar", "texto": "JPG · PNG · SVG · PDF · PNG · JPG · SVG · PNG"}]}, {"tipo": "practica", "titulo": "Pantalla o papel: haz las cuentas", "tiempo": 12, "enunciado": "Fórmula: **píxeles = cm ÷ 2,54 × 300**. Un A3 mide 29,7 × 42 cm.", "pasos": ["Calcula los píxeles de ancho y de alto de un A3.", "¿Una foto de 1200 × 900 px sirve para el A3? ¿Cuántos cm mediría?", "Para Instagram: ¿cuántos píxeles mide un post vertical?"], "ayudas": [{"tipo": "pista", "titulo": "Resultados para comprobar", "texto": "A3 ≈ **3508 × 4961 px**. La foto de 1200 × 900 px mediría unos **10 × 7,6 cm**. Instagram vertical: **1080 × 1350 px**."}]}, {"tipo": "ejemplo", "icono": "⚖️", "titulo": "La foto sacada de Google", "situacion": "Una cuenta escolar pone en su cartel una foto sacada de **Google Imágenes**. A la semana, el fotógrafo **reclama**.", "explicacion": "Que una imagen esté en internet **no la hace libre**: por defecto tiene **todos los derechos reservados**. Hay que buscarla en **bancos libres** y citarla."}, {"tipo": "infografia", "titulo": "Licencias Creative Commons", "elementos": [{"icono": "👤", "titulo": "BY", "texto": "Cita a la persona autora (siempre)."}, {"icono": "🔁", "titulo": "SA", "texto": "Si la cambias, compártela igual."}, {"icono": "💶", "titulo": "NC", "texto": "Sin uso comercial."}, {"icono": "🚫", "titulo": "ND", "texto": "No se puede modificar."}, {"icono": "🌍", "titulo": "CC0", "texto": "Dominio público."}]}, {"tipo": "practica", "titulo": "Búsqueda en bancos libres", "tiempo": 15, "enunciado": "Busca **tres recursos** para tu cartel y apunta sus créditos en la **Parte 1 de la plantilla A2**.", "pasos": ["Openverse: activa «Uso comercial permitido» y «Modificar o adaptar».", "Una foto, una ilustración o icono y, si puedes, un SVG.", "Sin personas reconocibles.", "Copia título, autor/a, enlace y licencia (TAFL)."], "material": ["Plantilla A2"], "enlace": "https://docs.google.com/document/d/1c9I8SDDwtHb9f9AhudNCjGW_hM6NACpcJbSnPy3Jjsk/copy"}, {"tipo": "quiz", "pregunta": "Una imagen tiene licencia CC BY-ND. ¿Puedo recortarla y ponerle texto encima?", "opciones": ["Sí, si cito a la persona autora", "No, ND no permite modificarla", "Sí, porque es para el instituto"], "correcta": 1, "explicacion": "**ND** significa «sin obras derivadas»: se puede usar tal cual, citando, pero **no modificar**."}]}, "moodle": []}, {"n": 3, "fase": "Taller de edición y metadatos", "titulo": "GIMP I: recortar, escalar, corregir y exportar", "reto": "Retocar una foto con las operaciones básicas y exportarla en el formato y tamaño correctos.", "actividades": [{"nombre": "Demostración guiada", "min": 12, "desc": "El docente proyecta GIMP con una foto del edificio del centro (sin personas): herramienta Recortar con proporción fija 4:5; Imagen → Escalar imagen a 1080 × 1350 px; Colores → Niveles o Brillo y contraste; herramienta Clonar o Saneado para borrar un elemento; capa de texto. El alumnado mira y anota los pasos en el cuaderno."}, {"nombre": "Práctica de retoque", "min": 28, "desc": "Cada estudiante elige una foto de la carpeta compartida o una de las que descargó en la sesión 2 y aplica los pasos: recortar a 4:5, escalar, corregir niveles o brillo y contraste, borrar un elemento que sobre y añadir el nombre del evento en una capa de texto. Apunta lo que ha hecho en la Parte 2 de la plantilla A2. Si GIMP da problemas, usa Photopea en el navegador."}, {"nombre": "Exportar y comparar", "min": 10, "desc": "Archivo → Exportar como: la misma imagen en PNG y en JPG (calidad 85). Comparan el peso y la calidad de los dos archivos y guardan también el .xcf, que conserva las capas, para la sesión 4."}], "criterios": ["DIG.4.2.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Aprender haciendo", "Aprendizaje entre iguales"], "evidencias": ["Foto retocada en .xcf, PNG y JPG", "Parte 2 de la plantilla A2"], "recursos": ["GIMP o Photopea", "Carpeta de fotos libres", "Proyector"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Pasos que se revelan uno a uno en la diapositiva, pareja de apoyo, Photopea como alternativa y ampliación con ajustes de curvas."}, "ejercicios": ["Recorta una foto a 4:5 y escálala a 1080 × 1350 px.", "Corrige el color, borra un elemento y añade una capa de texto.", "Exporta en PNG y en JPG y compara el peso de los dos archivos."], "clase": {"pregunta": "¿Qué cambia en una foto antes de que llegue a tu feed?", "diapositivas": [{"tipo": "ejemplo", "icono": "📸", "titulo": "La foto de perfil perfecta", "situacion": "Antes de subir una foto, la **recortas**, le subes el **brillo** y quizá borras algo del fondo.", "explicacion": "Eso es **edición técnica**. Hoy lo haces en un programa profesional y gratuito: **GIMP**.", "nota": "Antes de esta sesión: carpeta con cinco fotos sin personas y la foto del edificio para la demostración; comprobar que GIMP abre en los equipos."}, {"tipo": "pasos", "titulo": "Los pasos del retoque", "progresivo": true, "pasos": ["**Recortar** con proporción fija 4:5.", "**Escalar** a 1080 × 1350 px (Imagen → Escalar imagen).", "**Corregir** color: Colores → Niveles o Brillo y contraste.", "**Borrar** lo que sobra con Clonar o Saneado.", "**Texto** en una capa nueva."]}, {"tipo": "practica", "titulo": "Tu retoque", "tiempo": 28, "enunciado": "Elige una foto y aplica los **cinco pasos**. Apunta en la **Parte 2 de la A2** qué has cambiado.", "pasos": ["Recorta a 4:5.", "Escala a 1080 × 1350 px.", "Corrige niveles o brillo y contraste.", "Borra un elemento que sobre.", "Añade el nombre del evento en una capa de texto."], "agrupamiento": "Individual con pareja de apoyo", "material": ["GIMP o Photopea", "Plantilla A2"], "ayudas": [{"tipo": "pista", "titulo": "Si no ves las capas", "texto": "Ventanas → Diálogos empotrables → **Capas** (Ctrl + L)."}], "enlace": "https://docs.google.com/document/d/1c9I8SDDwtHb9f9AhudNCjGW_hM6NACpcJbSnPy3Jjsk/copy"}, {"tipo": "practica", "titulo": "Exportar y comparar", "tiempo": 10, "enunciado": "Guarda el **.xcf** (con capas) y exporta en **PNG** y en **JPG** (calidad 85). ¿Cuál pesa más? ¿Se nota la diferencia?", "pasos": ["Archivo → Guardar como → .xcf.", "Archivo → Exportar como → .png.", "Archivo → Exportar como → .jpg (calidad 85).", "Clic derecho → Propiedades: compara el peso."]}, {"tipo": "quiz", "pregunta": "¿Qué archivo conserva las capas para seguir editando la semana que viene?", "opciones": ["El PNG", "El JPG", "El XCF de GIMP"], "correcta": 2, "explicacion": "El **.xcf** guarda las capas. PNG y JPG las **juntan** en una sola imagen."}]}, "moodle": []}, {"n": 4, "fase": "Taller de edición y metadatos", "titulo": "GIMP II: selecciones y capas", "reto": "Recortar un objeto con una selección y componerlo en capas sobre otro fondo.", "actividades": [{"nombre": "Selecciones y capas", "min": 8, "desc": "Explicación con ejemplos: una selección dice a GIMP qué parte de la imagen editar (rectangular, libre o lazo, varita mágica o selección difusa, selección por color y selección de primer plano); las capas apilan fondo, objeto y texto; la máscara de capa esconde partes sin borrarlas."}, {"nombre": "Demostración", "min": 10, "desc": "El docente recorta un objeto (por ejemplo, un balón de una foto libre) con la selección de primer plano o la varita mágica, lo copia como capa nueva sobre otro fondo, ajusta su tamaño y suaviza el borde con una máscara de capa. Añade el título en una capa de texto."}, {"nombre": "Mini-montaje para el cartel", "min": 22, "desc": "Cada estudiante crea en GIMP un montaje con al menos tres capas (fondo, objeto recortado con una selección y texto) usando las imágenes de la sesión 2 o la foto retocada de la sesión 3. Será una de las piezas del cartel. Apunta los pasos en la Parte 2 de la plantilla A2."}, {"nombre": "Entrega de la Tarea 5.1", "min": 10, "desc": "El alumnado exporta el montaje en PNG y sube a la Tarea 5.1 el PNG, el .xcf y una captura con el panel de capas visible. El docente comprueba en directo la lista de verificación."}], "criterios": ["DIG.4.2.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Aprender haciendo", "Aprendizaje entre iguales"], "evidencias": ["Montaje con tres capas en PNG y .xcf", "Captura del panel de capas"], "recursos": ["GIMP o Photopea", "Imágenes de bancos libres"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Objeto de práctica con fondo liso para quien empieza, pareja de apoyo y ampliación con máscaras de capa y sombras."}, "ejercicios": ["Recorta un objeto con una herramienta de selección.", "Crea un montaje con al menos tres capas: fondo, objeto y texto.", "Exporta el montaje y guarda el archivo con las capas."], "clase": {"pregunta": "¿Cómo se pone a alguien «en la Luna» en una foto?", "diapositivas": [{"tipo": "ejemplo", "icono": "🌙", "titulo": "El montaje de la Luna", "situacion": "Ves en redes a un futbolista **celebrando un gol en la Luna**.", "explicacion": "Alguien **seleccionó** al jugador, lo copió en una **capa** nueva y lo puso sobre una foto de la Luna. Hoy aprendes a hacerlo."}, {"tipo": "infografia", "titulo": "Herramientas de selección", "elementos": [{"icono": "⬜", "titulo": "Rectangular", "texto": "Zonas rectas."}, {"icono": "➰", "titulo": "Libre (lazo)", "texto": "Dibujas el borde a mano."}, {"icono": "🪄", "titulo": "Varita mágica", "texto": "Zonas de un color parecido."}, {"icono": "🎯", "titulo": "Primer plano", "texto": "Separa el objeto del fondo."}]}, {"tipo": "pasos", "titulo": "Del objeto al montaje", "progresivo": true, "pasos": ["**Selecciona** el objeto (varita o primer plano).", "Editar → Copiar y Editar → Pegar como → **Capa nueva**.", "Muévelo sobre el **fondo** y escálalo.", "Suaviza el borde con una **máscara de capa**.", "Añade el **texto** en otra capa."]}, {"tipo": "practica", "titulo": "Mini-montaje para el cartel", "tiempo": 22, "enunciado": "Crea un montaje con **tres capas**: fondo, objeto recortado y texto. Será una pieza de tu cartel.", "pasos": ["Abre el fondo.", "Recorta el objeto de otra imagen con una selección.", "Pégalo como capa nueva.", "Añade el título.", "Apunta los pasos en la Parte 2 de la A2."], "material": ["GIMP o Photopea", "Plantilla A2"], "enlace": "https://docs.google.com/document/d/1c9I8SDDwtHb9f9AhudNCjGW_hM6NACpcJbSnPy3Jjsk/copy"}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 10, "entrega": "Tarea 5.1 · Montaje con capas en GIMP", "enunciado": "Sube el **PNG**, el **.xcf** y una **captura** con el panel de capas.", "pasos": ["Archivo → Exportar como → .png.", "Archivo → Guardar → .xcf.", "Captura: Impr Pant o Recortes."]}]}, "moodle": [{"recurso": "Tarea", "nombre": "5.1 · Montaje con capas en GIMP", "uso": "Verificar que cada estudiante domina la edición técnica en GIMP que necesitará en el cartel: retoque, selección, capas y exportación.", "correccion": "apto", "criterio": "DIG.4.2.3", "cotejo": ["Se entrega el montaje en PNG y el archivo .xcf", "El montaje tiene al menos tres capas: fondo, objeto recortado y texto", "El objeto está recortado con una herramienta de selección (sin fondo original visible)", "La captura muestra el panel de capas", "Las imágenes usadas son de la carpeta compartida o de bancos libres"], "config": ["Tipo de entrega: archivos (.png, .xcf, .jpg)", "Calificación: escala Apto / No apto", "Fecha de entrega: final de la sesión; fecha límite: 3 días"], "calificable": true, "codigo": "5.1"}]}, {"n": 5, "fase": "Taller de edición y metadatos", "titulo": "Metadatos EXIF: lo que tu foto cuenta de ti", "reto": "Descubrir qué datos esconde una foto, borrarlos antes de publicarla y entender cómo los metadatos pueden indicar que una imagen se hizo con IA.", "actividades": [{"nombre": "Gancho: la foto que dice dónde vives", "min": 7, "desc": "El docente plantea un caso: alguien sube a un foro una foto de su nueva bici hecha en la puerta de casa y otra persona averigua la calle con los datos de la foto. Pregunta: «¿Cómo ha podido saberlo?». Lluvia de ideas."}, {"nombre": "¿Qué son los metadatos EXIF?", "min": 8, "desc": "Explicación: el móvil guarda dentro de la foto datos que no se ven (modelo del móvil, fecha y hora, ajustes de la cámara, ubicación GPS si está activada, a veces el autor y el copyright). Pueden ser útiles (ordenar fotos, demostrar la autoría) o un riesgo para la privacidad."}, {"nombre": "Inspección de metadatos", "min": 15, "desc": "Cada estudiante abre en GIMP la foto de ejemplo del docente (hecha en un lugar público con el GPS activado) e inspecciona Imagen → Metadatos → Ver metadatos (en Windows también Propiedades → Detalles). Completa la Parte 1 de la plantilla A1: móvil, fecha, ubicación y qué podría saber alguien con esos datos."}, {"nombre": "Borrar y comprobar", "min": 10, "desc": "Exportan una copia sin metadatos: en GIMP, al exportar, desmarcan guardar datos Exif, XMP e IPTC y la miniatura (en Windows, Propiedades → Detalles → Quitar propiedades e información personal). Comprueban que la copia ya no tiene ubicación. Lo harán también con las fotos del cartel."}, {"nombre": "Redes y credenciales de contenido", "min": 10, "desc": "Se comenta que muchas redes borran parte de los metadatos al publicar, pero enviar una foto como archivo o documento suele conservarlos. Se presentan las credenciales de contenido (Content Credentials): metadatos que algunas herramientas añaden para indicar cómo se creó una imagen, incluso si se generó o editó con IA. Quiz final."}], "criterios": ["DIG.4.4.1"], "saberes": ["DIG.4.D.5", "DIG.4.D.1"], "metodologia": ["Pensamiento crítico", "Aprender haciendo"], "evidencias": ["Parte 1 de la plantilla A1 (metadatos)", "Copia de la foto sin metadatos"], "recursos": ["GIMP", "Foto de ejemplo con GPS", "Plantilla A1"], "dua": {"principios": ["Compromiso", "Representación", "Andamiaje"], "medidas": "Caso cercano a sus redes, capturas de dónde están los metadatos en GIMP y en Windows, tabla con los campos ya rotulados y ampliación: comparar los metadatos de una foto de móvil y una imagen generada con IA."}, "ejercicios": ["Inspecciona los metadatos de una foto y anota qué datos personales revela.", "Exporta una copia sin metadatos y comprueba que ya no tiene ubicación.", "Explica qué son las credenciales de contenido y para qué sirven."], "clase": {"pregunta": "¿Qué sabe de ti una foto que subes?", "diapositivas": [{"tipo": "ejemplo", "icono": "🚲", "titulo": "La foto de la bici nueva", "situacion": "Alguien sube a un foro la foto de su **bici nueva** en la puerta de casa. Al día siguiente, un desconocido le dice **en qué calle vive**.", "explicacion": "La foto llevaba **metadatos EXIF** con la **ubicación GPS**. No se ven en la imagen, pero cualquiera puede leerlos.", "nota": "Antes de esta sesión: foto de ejemplo hecha por el docente en un lugar público con el GPS activado, copiada en la carpeta compartida."}, {"tipo": "idea", "icono": "🏷️", "titulo": "Metadatos EXIF", "texto": "Datos **escondidos** dentro de la foto.", "puntos": ["**Móvil** o cámara y sus ajustes.", "**Fecha y hora**.", "**Ubicación GPS** (si está activada).", "A veces **autor** y **copyright**."]}, {"tipo": "practica", "titulo": "Inspección de metadatos", "tiempo": 15, "enunciado": "Abre la **foto de ejemplo** en GIMP y mira sus metadatos. Completa la **Parte 1 de la A1**.", "pasos": ["GIMP: Imagen → Metadatos → Ver metadatos.", "Busca el modelo del móvil, la fecha y la ubicación.", "En Windows también: clic derecho → Propiedades → Detalles.", "¿Qué podría saber alguien con estos datos?"], "material": ["GIMP", "Plantilla A1"], "enlace": "https://docs.google.com/document/d/1DZ5lsmLuLm27qphg62I6g_1zFOB4CE9tZH3FllQxyng/copy"}, {"tipo": "practica", "titulo": "Borrar y comprobar", "tiempo": 10, "enunciado": "Exporta una **copia sin metadatos** y comprueba que ya no tiene ubicación.", "pasos": ["Archivo → Exportar como → .jpg.", "En el cuadro de exportación, desmarca guardar datos **Exif**, **XMP**, **IPTC** y la miniatura.", "Abre la copia y vuelve a ver sus metadatos.", "Windows: Propiedades → Detalles → Quitar propiedades e información personal."]}, {"tipo": "quiz", "pregunta": "Envías por WhatsApp una foto «como documento». ¿Qué pasa con sus metadatos?", "opciones": ["Se borran siempre", "Normalmente se conservan", "Se convierten en texto"], "correcta": 1, "explicacion": "Al enviarla como **archivo** suele llegar **tal cual**, con sus metadatos. Bórralos antes de compartir."}, {"tipo": "idea", "icono": "🔖", "titulo": "Credenciales de contenido", "puntos": ["Algunos programas añaden metadatos que dicen **cómo se creó** la imagen.", "Pueden indicar que se **generó o editó con IA**.", "Es **transparencia**: quien mira tiene derecho a saberlo.", "Pero se pueden **perder**: no son una prueba definitiva."]}]}, "moodle": []}, {"n": 6, "fase": "IA gráfica y exposición", "titulo": "¿Cómo aprende una IA? Entrenamos un modelo con Teachable Machine", "reto": "Entrenar un modelo de IA que reconoce objetos y descubrir con pruebas trampa que aprende lo que hay en sus datos, incluidos los sesgos.", "actividades": [{"nombre": "Gancho: la galería que te conoce", "min": 5, "desc": "El docente pregunta: «¿Cómo sabe la galería del móvil qué fotos son de perros o de comida?». Respuestas en voz alta."}, {"nombre": "Aprender con ejemplos", "min": 7, "desc": "Flujo proyectado: datos (muchas imágenes con su etiqueta) → entrenar → modelo → predecir. La IA no entiende qué es un perro: busca patrones en los ejemplos que le damos."}, {"nombre": "Entrenamos el modelo", "min": 15, "desc": "Por parejas, en teachablemachine.withgoogle.com → Proyecto de imagen → modelo estándar. Crean tres clases («Estuche», «Botella» y «Nada») y graban 30-50 fotos por clase con la webcam, solo de objetos y siempre sobre la misma mesa, o suben las imágenes de la carpeta del docente si no hay webcam. Pulsan «Entrenar modelo» y lo prueban. El entrenamiento se hace en el navegador y no se guarda el proyecto."}, {"nombre": "Pruebas trampa", "min": 13, "desc": "Prueban el modelo con casos que no ha visto: un estuche de otro color, la botella sobre otro fondo, el objeto medio tapado por la mano. Anotan en la Parte 2 de la plantilla A1 qué falla y por qué. Después añaden fotos más variadas, vuelven a entrenar y comparan."}, {"nombre": "De mi modelo a la IA que dibuja", "min": 10, "desc": "Puesta en común: el modelo aprendió también el fondo y el color, no solo el objeto (eso es un sesgo de los datos). Las IA que generan imágenes aprendieron igual, pero de millones de imágenes de internet: repiten lo que más vieron. Por eso importa la transparencia: saber con qué datos se entrenó una IA."}], "criterios": ["DIG.4.4.3"], "saberes": ["DIG.4.D.5"], "metodologia": ["Aprendizaje por experimentación", "Pensamiento crítico"], "evidencias": ["Modelo entrenado y probado (observación)", "Parte 2 de la plantilla A1 (pruebas trampa)"], "recursos": ["Teachable Machine", "Webcam o imágenes del docente", "Plantilla A1"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Experimento manipulativo por parejas, pasos con capturas, imágenes preparadas para quien no tenga webcam y ampliación: añadir una cuarta clase o probar el modelo con imágenes generadas con IA."}, "ejercicios": ["Entrena un modelo de Teachable Machine con tres clases de objetos.", "Pruébalo con tres casos trampa y explica por qué falla.", "Explica qué tiene que ver tu modelo con los sesgos de la IA generativa."], "clase": {"pregunta": "¿Cómo sabe la galería de tu móvil qué fotos son de perros?", "diapositivas": [{"tipo": "ejemplo", "icono": "🐶", "titulo": "La galería que te conoce", "situacion": "Escribes «perro» en la galería del móvil y aparecen **todas tus fotos de perros**, aunque nunca las etiquetaste.", "explicacion": "Una **IA** aprendió con miles de fotos de perros a reconocer sus **patrones**. Hoy entrenas tú una.", "nota": "Antes de esta sesión: comprobar que los equipos tienen webcam y que Teachable Machine abre; si no hay webcam, carpeta con 30 fotos de cada objeto."}, {"tipo": "flujo", "titulo": "Cómo aprende una IA", "nodos": [{"texto": "Datos: muchas fotos con su etiqueta", "tipo": "inicio"}, {"texto": "Entrenar: busca patrones", "tipo": "proceso"}, {"texto": "Modelo", "tipo": "proceso"}, {"texto": "Predice con fotos nuevas", "tipo": "fin"}], "pregunta": "Si todas las fotos del estuche son en la misma mesa, ¿qué aprenderá también?"}, {"tipo": "practica", "titulo": "Entrenamos el modelo", "tiempo": 15, "enunciado": "En **Teachable Machine** crea un proyecto de imagen con **tres clases** y entrénalo.", "pasos": ["teachablemachine.withgoogle.com → Empezar → Proyecto de imagen → Estándar.", "Clases: «Estuche», «Botella» y «Nada».", "30-50 fotos por clase con la webcam, **solo objetos**, sobre la misma mesa.", "Entrenar modelo.", "Pruébalo en la vista previa."], "agrupamiento": "Parejas", "material": ["Teachable Machine", "Estuche y botella"]}, {"tipo": "practica", "titulo": "Pruebas trampa", "tiempo": 13, "enunciado": "Engaña a tu modelo y anota en la **Parte 2 de la A1** qué falla y por qué.", "pasos": ["Un estuche de **otro color**.", "La botella sobre **otro fondo**.", "El objeto **medio tapado**.", "Añade fotos variadas, vuelve a entrenar y compara."], "material": ["Plantilla A1"], "enlace": "https://docs.google.com/document/d/1DZ5lsmLuLm27qphg62I6g_1zFOB4CE9tZH3FllQxyng/copy"}, {"tipo": "idea", "icono": "⚖️", "titulo": "De mi modelo a la IA que dibuja", "puntos": ["Tu modelo aprendió **también el fondo**: es un **sesgo de los datos**.", "Las IA de imágenes aprendieron de **millones** de fotos de internet.", "Repiten **lo que más vieron**.", "Transparencia: saber **con qué datos** se entrenó."], "pregunta": "¿Qué crees que pasará si le pides a una IA «una persona que programa»?"}]}, "moodle": []}, {"n": 7, "fase": "IA gráfica y exposición", "titulo": "IA generativa: sesgos y edición con IA frente a edición manual", "reto": "Comprobar qué sesgos reproduce la IA generativa, comparar la edición con IA con la edición manual en GIMP y fijar normas para usarla de forma ética.", "actividades": [{"nombre": "Cómo genera una imagen", "min": 5, "desc": "Flujo breve: la IA parte de ruido y lo va «limpiando» paso a paso guiada por el texto (prompt), usando los patrones que aprendió de sus datos. Se recuerda la sesión 6."}, {"nombre": "Experimento de sesgos", "min": 15, "desc": "Con el banco de imágenes que ha preparado el docente (o con Canva Magic Media si está activado para el alumnado), se miran las imágenes de seis prompts neutros: «una persona que programa», «una persona que dirige una empresa», «una persona que cuida a un bebé», «una persona que juega al fútbol profesional», «una familia andaluza» y «una persona que limpia una oficina». Cada estudiante registra en la Parte 3 de la plantilla A1 quién aparece y qué se repite, y escribe un prompt mejorado."}, {"nombre": "Edición manual o edición con IA", "min": 18, "desc": "Cada estudiante repite con IA una edición que ya hizo a mano en la sesión 4: quitar el fondo de un objeto con Canva (Quitar fondo) y ampliar o cambiar parte de una foto con una herramienta de edición por instrucciones (Magic Edit o Magic Expand). Compara en la Parte 4 de la plantilla A1: tiempo, calidad del borde, control sobre el resultado, qué ha decidido la IA por su cuenta y si hay que etiquetarlo."}, {"nombre": "Normas y entrega de la Tarea 5.2", "min": 12, "desc": "Breve puesta en común sobre cuándo es aceptable usar IA en un cartel. Cada estudiante escribe sus tres normas en la Parte 5 de la A1, revisa la lista «Antes de entregar», descarga la plantilla en PDF y la sube a la Tarea 5.2."}], "criterios": ["DIG.4.4.3", "DIG.4.4.1"], "saberes": ["DIG.4.D.5", "DIG.4.D.1"], "metodologia": ["Pensamiento crítico", "Aprendizaje por experimentación"], "evidencias": ["Plantilla A1 completa (Tarea 5.2)"], "recursos": ["Banco de imágenes IA", "Canva para Educación", "GIMP", "Plantilla A1"], "dua": {"principios": ["Representación", "Acción y Expresión", "Andamiaje"], "medidas": "Imágenes del banco agrupadas por prompt para comparar de un vistazo, tabla de comparación con criterios ya escritos y respuestas con frases cortas; ampliación: comparar dos herramientas de IA con el mismo prompt."}, "ejercicios": ["Registra quién aparece en las imágenes generadas con seis prompts neutros y qué sesgo se repite.", "Compara una edición hecha a mano en GIMP con la misma edición hecha con IA.", "Escribe tres normas para usar la IA de forma ética en un cartel."], "clase": {"pregunta": "Si le pides a una IA «una persona que programa», ¿quién aparece?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎨", "titulo": "La IA que «dibuja»", "situacion": "Escribes «gato astronauta en Sevilla» y en segundos tienes una imagen que **nunca ha existido**.", "explicacion": "Parte de **ruido** y lo va limpiando hacia lo que pides, con los **patrones** que aprendió. Como tu modelo de la sesión 6, **repite lo que más ha visto**.", "nota": "Antes de esta sesión: banco de imágenes IA de los seis prompts en la carpeta «Banco de imágenes IA» de Drive (cuatro imágenes por prompt), listo para proyectar."}, {"tipo": "practica", "titulo": "Experimento de sesgos", "tiempo": 15, "enunciado": "Mira las imágenes de cada prompt y anota en la **Parte 3 de la A1** quién aparece.", "pasos": ["«Una persona que programa».", "«Una persona que dirige una empresa».", "«Una persona que cuida a un bebé».", "«Una persona que juega al fútbol profesional».", "«Una familia andaluza».", "«Una persona que limpia una oficina»."], "material": ["Banco de imágenes IA", "Plantilla A1"], "enlace": "https://docs.google.com/document/d/1DZ5lsmLuLm27qphg62I6g_1zFOB4CE9tZH3FllQxyng/copy"}, {"tipo": "comparar", "titulo": "Prompt con sesgo o sin sesgo", "columnas": [{"titulo": "Prompt vago", "icono": "⚠️", "puntos": ["«Una persona que dirige una empresa»", "La IA elige por ti… y **repite estereotipos**."]}, {"titulo": "Prompt cuidado", "icono": "✅", "puntos": ["«Una mujer de unos 50 años, con hiyab, dirige una reunión»", "**Tú decides** a quién representas."]}], "pregunta": "Escribe tu prompt mejorado en la A1."}, {"tipo": "practica", "titulo": "Edición manual o edición con IA", "tiempo": 18, "enunciado": "Repite con IA lo que hiciste a mano en la sesión 4 y compáralo en la **Parte 4 de la A1**.", "pasos": ["Canva: sube tu objeto → Editar foto → **Quitar fondo**.", "Prueba **Magic Edit** o **Magic Expand** en una foto.", "Compara: tiempo, borde, control y qué ha decidido la IA.", "¿Hay que etiquetarlo?"], "material": ["Canva para Educación", "Tu montaje de la sesión 4"], "ayudas": [{"tipo": "pista", "titulo": "Si la IA de Canva no te aparece", "texto": "Usa las imágenes de módulos IA del banco del docente y compáralas con tu montaje de GIMP."}]}, {"tipo": "practica", "titulo": "Normas y entrega", "tiempo": 12, "entrega": "Tarea 5.2 · Laboratorio de imagen e IA", "enunciado": "Escribe tus **tres normas** para usar la IA (Parte 5 de la A1), revisa «Antes de entregar» y sube la A1 en **PDF**.", "pasos": ["Ideas: etiquetar, no imitar a personas reales, no usar fotos del alumnado, revisar sesgos, borrar metadatos.", "Archivo → Descargar → PDF.", "S achine, sesgos, IA frente a edición manual y cartel · Tarea 5.2 en la sesión 7, Tarea 5.3 en la sesión 8 y defensa en la sesión 9", "sesiones": "6-9"}], "eventos": [{"sesion": 9, "texto": "Defensa pública del cartel ante el centro (90 segundos)", "tipo": "Se evalúa en clase"}], "nota_evaluacion": "La Tarea 5.1 se corrige como **Apto / No apto**. Las Tareas 5.2 y 5.3 se califican con **rúbrica**; en la 5.3 la defensa pública cuenta un tercio de la nota.", "url_clase": "https://florindotic.es/content/curso2026-2027/digitalizacion/4-eso/sda5/clase.html"}}, "seneca": {"justificacion": "La cultura visual del alumnado exige comprender los gráficos digitales (mapa de bits y vectorial), editar imágenes con criterio técnico, proteger la privacidad borrando los metadatos, respetar la propiedad intelectual y entender críticamente cómo aprende la inteligencia artificial y qué sesgos reproduce. Un cartel real para un evento del centro, defendido en público, da sentido al aprendizaje.", "actividades": [{"titulo": "Laboratorio de imagen e IA", "tipo": "Exploración", "abreviatura": "EXP1", "tarea": "5.2", "sesiones": [5, 6, 7], "trazabilidad": "RÚBRICA", "criterios": ["DIG.4.4.3", "DIG.4.4.1"]}, {"titulo": "Cartel del evento: edición, composición y defensa pública", "tipo": "Conclusión", "abreviatura": "CON1", "tarea": "5.3", "sesiones": [1, 2, 3, 4, 8, 9], "trazabilidad": "RÚBRICA", "criterios": ["DIG.4.2.3", "DIG.4.4.1", "DIG.4.4.3"]}]}, "notas_rigor": ["El saber DIG.4.D.5 (ética, inteligencia artificial y sesgos algorítmicos) está vinculado oficialmente al criterio DIG.4.4.1 y se moviliza en las sesiones 5 a 9; DIG.4.B.2 y DIG.4.D.1 están vinculados a DIG.4.2.3, y DIG.4.D.1 también a DIG.4.4.3.", "Los descriptores operativos se derivan, como en Séneca, de las competencias específicas 2 y 4. De los propuestos por el docente, CD2 y CD3 están vinculados; CCL3, CD5 y CCEC4 no pertenecen a las competencias DIG.4.2 ni DIG.4.4, por lo que Séneca no los ofrecerá en esta SdA (se trabajan de forma transversal en la presentación oral y el diseño del cartel).", "Canva para Educación puede tener desactivadas las funciones de IA (Magic Media) para el alumnado: el docente debe comprobarlo y, si no están disponibles, preparar un banco de imágenes generadas para las sesiones 5 y 7.", "La secuencia sigue la secuenciación del docente: teoría de la imagen digital y bancos libres (sesiones 1-2), taller de edición en GIMP y metadatos EXIF (sesiones 3-5) e IA gráfica con Teachable Machine, edición con IA frente a manual, composición del cartel y defensa pública (sesiones 6-9).", "Los metadatos EXIF (privacidad) se trabajan dentro de DIG.4.4.1 (respeto a la privacidad en el uso de los datos) con el saber DIG.4.D.5. El saber DIG.4.C.2 (privacidad y huella digital) encajaría también, pero está vinculado a DIG.4.3.1, que no forma parte de esta SdA.", "Las fotos de partida, la foto con GPS, el logotipo y el banco de imágenes los prepara el docente sin personas reconocibles del centro. En Teachable Machine solo se fotografían objetos y no se guarda el proyecto.", "La lista «Lo que prepara el docente (pendiente)» está en Recursos: el generador avisa de que los recursos son largos, pero es intencionado."], "anexos": {"plantillas": [{"id": "A1", "titulo": "Laboratorio de imagen e IA", "sesiones": [5, 6, 7], "agrupamiento": "Individual", "herramienta": "Google Docs (una copia por estudiante)", "entrega": "la Tarea 5.2 (PDF)", "docente": "Preparar la foto de ejemplo con GPS (sesión 5), las imágenes para Teachable Machine si no hay webcam (sesión 6) y el banco de imágenes IA (sesión 7).", "instrucciones": "Rellena la **Parte 1** en la sesión 5, la **Parte 2** en la sesión 6 y las **Partes 3, 4 y 5** en la sesión 7. Responde con frases cortas. Al terminar, descárgala en **PDF** y súbela a la **Tarea 5.2**.", "bloques": [{"titulo": "Parte 1 · Metadatos de la foto de ejemplo", "tabla": {"columnas": ["Dato", "¿Qué pone?"], "filas": [["Móvil o cámara"], ["Fecha y hora"], ["Ubica ales y/o tecnológicos de manera sostenible y responsable.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1"]}, "DIG.4.2.1": {"tipo": "cr", "texto": "Gestionar el aprendizaje en el ámbito digital, configurando el entorno personal de aprendizaje mediante la integración de recursos digitales de manera autónoma.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.D.1"]}, "DIG.4.2.2": {"tipo": "cr", "texto": "Buscar, seleccionar y archivar información en función de sus necesidades haciendo uso de las herramientas del entorno personal de aprendizaje con sentido crítico y siguiendo normas básicas de seguridad en la red.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.C.2", "DIG.4.C.3"]}, "DIG.4.2.3": {"tipo": "cr", "texto": "Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.D.1"]}, "DIG.4.2.4": {"tipo": "cr", "texto": "Interactuar en espacios virtuales de comunicación y plataformas de aprendizaje colaborativo, compartiendo y publicando información y datos, adaptándose a diferentes audiencias con una actitud participativa y respetuosa.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.3", "DIG.4.D.5", "DIG.4.D.6"]}, "DIG.4.3.1": {"tipo": "cr", "texto": "Proteger los datos personales y la huella digital generada en internet, configurando las condiciones de privacidad de las redes sociales y espacios virtuales de trabajo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.2"]}, "DIG.4.3.2": {"tipo": "cr", "texto": "Configurar y actualizar contraseñas, sistemas operativos y antivirus de forma periódica en los distintos dispositivos digitales de uso habitual.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.1"]}, "DIG.4.3.3": {"tipo": "cr", "texto": "Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.3"]}, "DIG.4.4.1": {"tipo": "cr", "texto": "Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.5"]}, "DIG.4.4.2": {"tipo": "cr", "texto": "Reconocer las aportaciones de las tecnologías digitales en las gestiones administrativas, y el comercio electrónico, siendo consciente de la brecha social de acceso, uso y aprovechamiento de dichas tecnologías para diversos colectivos.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.4"]}, "DIG.4.4.3": {"tipo": "cr", "texto": "Valorar la importancia de la oportunidad, facilidad y libertad de expresión que suponen los medios digitales conectados, analizando de forma crítica los mensajes que se reciben y transmiten teniendo en cuenta su objetividad, ideología, intencionalidad, sesgos y caducidad.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.6"]}, "DIG.4.4.4": {"tipo": "cr", "texto": "Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.5"]}, "DIG.4.A": {"tipo": "sb", "texto": "Dispositivos digitales, sistemas operativos y de comunicación.", "hijos": ["DIG.4.A.1", "DIG.4.A.2", "DIG.4.A.3", "DIG.4.A.4"], "criterios": []}, "DIG.4.A.1": {"tipo": "sb", "texto": "Arquitectura de ordenadores: elementos, montaje, configuración y resolución de pr
