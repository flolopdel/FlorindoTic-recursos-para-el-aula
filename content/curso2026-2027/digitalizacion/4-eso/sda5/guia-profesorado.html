 una imagen usando capas.", "Exporta el cartel en PDF para imprimir y en PNG para Instagram con el tamaño correcto.", "Explica oralmente sus decisiones técnicas con el vocabulario adecuado."]}, {"criterio": "DIG.4.4.1", "indicadores": ["Usa solo imágenes cuya licencia permite el uso que les da.", "Cita los recursos con título, autor/a, fuente y licencia.", "Respeta el derecho a la propia imagen (sin personas reconocibles sin permiso).", "Etiqueta de forma visible el contenido generado o retocado con IA."]}, {"criterio": "DIG.4.4.3", "indicadores": ["Identifica sesgos en imágenes generadas por IA y los relaciona con los datos de entrenamiento.", "Combina pistas visuales y herramientas para comprobar si una imagen es real, retocada o generada.", "Explica la intención de quien difunde una imagen y el efecto que puede tener.", "Valora con argumentos qué aporta y qué riesgos tiene la IA en su propio cartel."]}], "agentes": {"Heteroevaluación": "Tarea 5.1 (Apto / No apto), rúbricas de las Tareas 5.2 y 5.3 y observación de la presentación oral.", "Coevaluación": "Revisión entre parejas con la lista «Antes de entregar» (sesión 8) y votación del cartel que se imprime (sesión 9).", "Autoevaluación": "Lista «Antes de entregar» de las plantillas A1 y A2 y formulario de autoevaluación F2 (sesión 9)."}}, "moodle": {"estructura": "Una sección «SdA 5 · El mundo de la imagen» en el curso de Digitalización 4.º ESO con el área de texto del reto, la página «Cómo se evalúa» y las Tareas 5.1, 5.2 y 5.3 en el orden de las sesiones.", "secciones": [{"nombre": "SdA 5 · El mundo de la imagen", "elementos": ["Área de texto y medios con el reto, las sesiones y el enlace a la web de clase", "Página «Cómo se evalúa» con la lista de la Tarea 5.1 y las rúbricas de las Tareas 5.2 y 5.3", "Tarea 5.1 · Retoque técnico en GIMP", "Tarea 5.2 · Detective de imágenes e IA", "Tarea 5.3 · Cartel del evento y presentación"]}], "calificaciones": "Tres categorías, una por criterio (DIG.4.2.3, DIG.4.4.1 y DIG.4.4.3). La Tarea 5.1 usa la escala Apto / No apto en DIG.4.2.3; la Tarea 5.2 va en DIG.4.4.3 y la Tarea 5.3 en DIG.4.2.3. La nota de cada criterio en las rúbricas que evalúan varios criterios se calcula en la guía del profesorado y se traslada a Séneca.", "configuracion": ["Escala personalizada «No apto, Apto».", "Rúbricas de las Tareas 5.2 y 5.3 guardadas como plantilla.", "Prórrogas individuales en las Tareas para el alumnado que lo necesite.", "Finalización de actividad activada para que el alumnado vea su progreso."], "area_texto": {"bloques": [{"nombre": "Bloque 1 · La imagen digital", "descripcion": "Píxeles, vectores, formatos y retoque · Tarea 5.1 en la sesión 3", "sesiones": "1-3"}, {"nombre": "Bloque 2 · Licencias e IA", "descripcion": "Licencias, sesgos y detección de imágenes · Tarea 5.2 en la sesión 6", "sesiones": "4-6"}, {"nombre": "Bloque 3 · El cartel", "descripcion": "Diseño, exportación y presentación · Tarea 5.3 en la sesión 8, presentación en la sesión 9", "sesiones": "7-9"}], "eventos": [{"sesion": 9, "texto": "Presentación del cartel ante la clase (90 segundos)", "tipo": "Se evalúa en clase"}], "nota_evaluacion": "La Tarea 5.1 se corrige como **Apto / No apto**. Las Tareas 5.2 y 5.3 se califican con **rúbrica**; en la 5.3 la presentación oral cuenta un tercio de la nota.", "url_clase": "https://florindotic.es/content/curso2026-2027/digitalizacion/4-eso/sda5/clase.html"}}, "seneca": {"justificacion": "La cultura visual del alumnado exige comprender los gráficos digitales (mapa de bits y vectorial), editar imágenes con criterio técnico, respetar la propiedad intelectual y el derecho a la propia imagen y entender críticamente cómo genera imágenes la inteligencia artificial y qué sesgos reproduce. Un cartel real para un evento del centro, impreso y publicado, da sentido al aprendizaje.", "actividades": [{"titulo": "Detectives de imágenes e IA", "tipo": "Exploración", "abreviatura": "EXP1", "tarea": "5.2", "sesiones": [4, 5, 6], "trazabilidad": "RÚBRICA", "criterios": ["DIG.4.4.3", "DIG.4.4.1"]}, {"titulo": "Cartel del evento: diseño, edición y presentación", "tipo": "Conclusión", "abreviatura": "CON1", "tarea": "5.3", "sesiones": [1, 2, 3, 7, 8, 9], "trazabilidad": "RÚBRICA", "criterios": ["DIG.4.2.3", "DIG.4.4.1", "DIG.4.4.3"]}]}, "notas_rigor": ["El saber DIG.4.D.5 (ética, inteligencia artificial y sesgos algorítmicos) está vinculado oficialmente al criterio DIG.4.4.1 y se moviliza en las sesiones 5 a 9; DIG.4.B.2 y DIG.4.D.1 están vinculados a DIG.4.2.3, y DIG.4.D.1 también a DIG.4.4.3.", "Los descriptores operativos se derivan, como en Séneca, de las competencias específicas 2 y 4. De los propuestos por el docente, CD2 y CD3 están vinculados; CCL3, CD5 y CCEC4 no pertenecen a las competencias DIG.4.2 ni DIG.4.4, por lo que Séneca no los ofrecerá en esta SdA (se trabajan de forma transversal en la presentación oral y el diseño del cartel).", "Canva para Educación puede tener desactivadas las funciones de IA (Magic Media) para el alumnado: el docente debe comprobarlo y, si no están disponibles, preparar un banco de imágenes generadas para las sesiones 5 y 7.", "La foto de partida, el logotipo y el dossier de imágenes los prepara el docente sin personas reconocibles del centro, respetando la protección de datos."], "anexos": {"plantillas": [{"id": "A1", "titulo": "Detective de imágenes e IA", "sesiones": [5, 6], "agrupamiento": "Individual", "herramienta": "Google Docs (una copia por estudiante)", "entrega": "la Tarea 5.2 (PDF)", "docente": "Preparar antes de la sesión 5 un banco de imágenes generadas con los cinco prompts (por si Magic Media no está activado para el alumnado) y el dossier de seis imágenes para la sesión 6.", "instrucciones": "Rellena la **Parte 1** en la sesión 5 y las **Partes 2 y 3** en la sesión 6. Responde con frases cortas. Al terminar, descárgala en **PDF** y súbela a la **Tarea 5.2**.", "bloques": [{"titulo": "Parte 1 · Experimento de sesgos", "texto": "Mira la imagen que genera la IA con cada prompt y apunta quién aparece. Ejemplo: «hombre, unos 40 años, piel clara, traje, oficina con cristales».", "tabla": {"columnas": ["Prompt (lo que pedimos)", "¿Quién aparece? (género, edad, piel, ropa)", "¿Dónde está? ¿Qué hace?"], "filas": [["Una persona que dirige una empresa"], ["Una persona que cuida a un bebé"], ["Una persona que juega al fútbol profesional"], ["Una familia andaluza"], ["Una persona que limpia una oficina"]], "anchos": [5, 7, 5], "alto": 1.4}}, {"campos": ["¿Qué se repite en las imágenes? ¿Qué sesgo has encontrado?", "¿Por qué crees que pasa? (piensa en los datos con los que aprende la IA)", "Mi prompt mejorado para evitar ese sesgo"], "alto": 1.6}, {"titulo": "Parte 2 · Detective de imágenes", "texto": "Elige **tres imágenes** del dossier. Pistas: manos, textos, luz y sombras, piel demasiado perfecta. Herramientas: Google Lens, etiqueta «Creado con IA», Content Credentials.", "tabla": {"columnas": ["Imagen n.º", "Pistas que veo", "Cómo lo he comprobado", "Veredicto: real, retocada o IA", "¿Quién la difunde y para qué? ¿Qué efecto tiene?"], "filas": [[""], [""], [""]], "anchos": [2, 4, 4, 3, 5], "alto": 2.4}}, {"titulo": "Parte 3 · Mis normas para usar la IA y las imágenes", "texto": "Escribe tres normas que vas a seguir en tu cartel y explica **por qué** cada una es necesaria.", "tabla": {"columnas": ["Norma", "¿Por qué es necesaria?"], "filas": [["1."], ["2."], ["3."]], "anchos": [8, 9], "alto": 1.6}}, {"titulo": "Antes de entregar", "casillas": ["He registrado las cinco imágenes del experimento y he escrito un prompt mejorado.", "He analizado tres imágenes con pistas y al menos una herramienta.", "He explicado quién difunde cada imagen y para qué.", "He escrito tres normas y por qué son necesarias.", "He descargado el documento en PDF para subirlo a la Tarea 5.2."]}], "enlace": "https://docs.google.com/document/d/1pwCgB8iYr5juMzYhgpj_abm_0S3fPHy6lR9qF-NmbOI/copy"}, {"id": "A2", "titulo": "Ficha técnica y de créditos del cartel", "sesiones": [4, 7, 8], "agrupamiento": "Individual", "herramienta": "Google Docs (una copia por estudiante)", "entrega": "la Tarea 5.3 (PDF)", "docente": "Si el cartel se hace en pareja, cada estudiante entrega su propia ficha A2 con lo que ha hecho.", "instrucciones": "Rellena la **Parte 1** en la sesión 4, las **Partes 2 y 3** en la sesión 7 y la **Parte 4** en la sesión 8. Descárgala en **PDF** y súbela a la **Tarea 5.3** junto al cartel.", "bloques": [{"titulo": "Datos del cartel", "campos": ["Evento", "Público al que va dirigido", "Mensaje principal (una frase)"], "alto": 1.2}, {"titulo": "Parte 1 · Créditos de los recursos (TAFL)", "texto": "Ejemplo: «Patio con naranjos» · Ana López · commons.wikimedia.org/… · CC BY-SA 4.0", "tabla": {"columnas": ["Recurso", "Título", "Autor/a", "Fuente (enlace)", "Licencia"], "filas": [["Foto"], ["Ilustración o icono"], ["SVG u otro"], [""]], "anchos": [3, 4, 3, 5, 3], "alto": 1.4}}, {"titulo": "Parte 2 · Edición de las imágenes", "tabla": {"columnas": ["Imagen", "Programa (GIMP, Photopea, Canva)", "Qué he cambiado (recortar, escalar, niveles, borrar, quitar fondo…)"], "filas": [[""], [""], [""]], "anchos": [4, 4, 9], "alto": 1.4}}, {"titulo": "Parte 3 · Módulo con inteligencia artificial", "campos": ["Herramienta de IA que he usado", "Prompt o instrucción que he escrito", "Qué parte del cartel es de IA", "Cómo lo indico en el cartel (texto de la etiqueta)", "Sesgos o problemas que he revisado y cómo los he evitado"], "alto": 1.5}, {"titulo": "Parte 4 · Versiones exportadas", "tabla": {"columnas": ["Versión", "Formato", "Tamaño (mm o px)", "Peso del archivo"], "filas": [["Para imprimir", "PDF", "297 × 420 mm"], ["Para Instagram", "PNG", "1080 × 1350 px"]], "anchos": [4, 3, 5, 4], "alto": 1.2}}, {"titulo": "Antes de entregar", "casillas": ["Todos mis recursos tienen una licencia que permite usarlos así y están citados (TAFL).", "En mi cartel no aparecen caras del alumnado ni personas sin permiso.", "La etiqueta de IA se ve en el cartel.", "He exportado el PDF para imprimir y el PNG de 1080 × 1350 px.", "El título, la fecha y el lugar se leen en 3 segundos.", "He descargado esta ficha en PDF para subirla con el cartel a la Tarea 5.3."]}], "enlace": "https://docs.google.com/document/d/1RhRiezW3NsDQ3MEZaUzgnYXfQfrzTm4z9w73EjeomCI/copy"}], "formularios": [{"id": "F1", "titulo": "SdA 5 · Encuesta inicial (anónima)", "sesiones": [1], "anonimo": true, "obligatorias": true, "descripcion": "Encuesta anónima para saber de dónde partimos. No hay respuestas buenas ni malas.", "confirmacion": "¡Gracias! Veremos los resultados de la clase en conjunto, sin nombres.", "preguntas": [{"tipo": "opcion", "titulo": "¿Usas filtros o retocas tus fotos antes de subirlas a redes?", "opciones": ["Siempre", "A veces", "Casi nunca", "No subo fotos"]}, {"tipo": "casillas", "titulo": "¿Con qué has editado alguna vez una imagen?", "opciones": ["Filtros de Instagram o TikTok", "CapCut", "Canva", "GIMP o Photoshop", "Una app de IA", "Nunca he editado imágenes"], "otra": true}, {"tipo": "opcion", "titulo": "¿Has creado alguna imagen con inteligencia artificial?", "opciones": ["Sí, muchas veces", "Alguna vez", "Nunca, pero sé que se puede", "No sabía que se podía"]}, {"tipo": "escala", "titulo": "¿Te ves capaz de distinguir una imagen hecha con IA de una foto real?", "min": 1, "max": 5, "etiquetas": ["Nada", "Totalmente"]}, {"tipo": "opcion", "titulo": "Si una imagen aparece en Google Imágenes, ¿la puedes usar en un cartel?", "opciones": ["Sí, si está en internet es gratis", "Depende de su licencia", "No lo sé"]}, {"tipo": "opcion", "titulo": "¿Qué pasa si amplías mucho una foto del móvil?", "opciones": ["Se ve igual de bien", "Se pixela (se ven cuadraditos)", "No lo sé"]}, {"tipo": "parrafo", "titulo": "¿Qué te gustaría aprender a hacer con imágenes?", "obligatoria": false}]}, {"id": "F2", "titulo": "SdA 5 · Autoevaluación final", "sesiones": [9], "anonimo": false, "obligatorias": true, "descripcion": "Valora con sinceridad lo que has logrado en esta situación de aprendizaje.", "confirmacion": "¡Gracias! Tu autoevaluación ayuda a mejorar las próximas SdA.", "preguntas": [{"tipo": "cuadricula", "titulo": "¿Qué he logrado?", "filas": ["Distingo mapa de bits y vectorial y elijo el formato adecuado", "Retoco una imagen con capas y la exporto con el tamaño correcto", "Uso imágenes con licencia y las cito bien", "Detecto sesgos en las imágenes generadas con IA", "Compruebo si una imagen es real, retocada o generada", "Etiqueto lo que he hecho con IA", "He presentado mi cartel explicando mis decisiones"], "columnas": ["Lo he logrado", "En parte", "Todavía no"]}, {"tipo": "parrafo", "titulo": "¿Qué es lo que más te ha costado y cómo lo has resuelto?"}, {"tipo": "parrafo", "titulo": "¿Qué harás distinto la próxima vez que veas o compartas una imagen viral?"}, {"tipo": "escala", "titulo": "¿Cuánto te ha gustado esta SdA?", "min": 1, "max": 5, "etiquetas": ["Nada", "Mucho"]}]}]}}, "cur": {"DIG.4.1": {"tipo": "ce", "texto": "Identificar y resolver problemas técnicos sencillos, conectar y configurar dispositivos a redes domésticas, aplicando los conocimientos de hardware y sistemas operativos, para gestionar de forma sostenible las herramientas e instalaciones informáticas y de comunicación de uso cotidiano.", "descriptores": ["STEM1", "STEM2", "CD4", "CD5", "CPSAA1", "CPSAA5", "CE3"]}, "DIG.4.2": {"tipo": "ce", "texto": "Configurar el entorno personal de aprendizaje, interactuando y aprovechando los recursos del ámbito digital, para optimizar y gestionar el aprendizaje permanente.", "descriptores": ["CD1", "CD2", "CD3", "CPSAA1", "CPSAA4", "CPSAA5", "CE3"]}, "DIG.4.3": {"tipo": "ce", "texto": "Desarrollar hábitos que fomenten el bienestar digital, aplicando medidas preventivas y correctivas, para proteger dispositivos, datos personales y la propia salud.", "descriptores": ["CCL3", "STEM5", "CD1", "CD4", "CPSAA2", "CPSAA5", "CC2", "CC3"]}, "DIG.4.4": {"tipo": "ce", "texto": "Ejercer una ciudadanía digital crítica, conociendo las posibles acciones que realizar en la red, e identificando sus repercusiones, para hacer un uso activo, responsable y ético de la tecnología.", "descriptores": ["CD3", "CD4", "CPSAA1", "CC1", "CC2", "CC3", "CC4", "CE1"]}, "DIG.4.1.1": {"tipo": "cr", "texto": "Conectar dispositivos y gestionar redes locales aplicando los conocimientos y procesos asociados a sistemas de comunicación alámbrica e inalámbrica con una actitud proactiva.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1", "DIG.4.A.4", "DIG.4.A.3"]}, "DIG.4.1.2": {"tipo": "cr", "texto": "Instalar y mantener sistemas operativos, configurando sus características en función de sus necesidades personales, de forma sostenible.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.2"]}, "DIG.4.1.3": {"tipo": "cr", "texto": "Identificar y resolver problemas técnicos sencillos, analizando componentes y funciones de los dispositivos digitales, evaluando las soluciones de manera crítica y reformulando el procedimiento, en caso necesario, fomentando un consumo y reposición de los sistemas digitales y/o tecnológicos de manera sostenible y responsable.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1"]}, "DIG.4.2.1": {"tipo": "cr", "texto": "Gestionar el aprendizaje en el ámbito digital, configurando el entorno personal de aprendizaje mediante la integración de recursos digitales de manera autónoma.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.D.1"]}, "DIG.4.2.2": {"tipo": "cr", "texto": "Buscar, seleccionar y archivar información en función de sus necesidades haciendo uso de las herramientas del entorno personal de aprendizaje con sentido crítico y siguiendo normas básicas de seguridad en la red.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.C.2", "DIG.4.C.3"]}, "DIG.4.2.3": {"tipo": "cr", "texto": "Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.D.1"]}, "DIG.4.2.4": {"tipo": "cr", "texto": "Interactuar en espacios virtuales de comunicación y plataformas de aprendizaje colaborativo, compartiendo y publicando información y datos, adaptándose a diferentes audiencias con una actitud participativa y respetuosa.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.3", "DIG.4.D.5", "DIG.4.D.6"]}, "DIG.4.3.1": {"tipo": "cr", "texto": "Proteger los datos personales y la huella digital generada en internet, configurando las condiciones de privacidad de las redes sociales y espacios virtuales de trabajo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.2"]}, "DIG.4.3.2": {"tipo": "cr", "texto": "Configurar y actualizar contraseñas, sistemas operativos y antivirus de forma periódica en los distintos dispositivos digitales de uso habitual.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.1"]}, "DIG.4.3.3": {"tipo": "cr", "texto": "Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.3"]}, "DIG.4.4.1": {"tipo": "cr", "texto": "Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.5"]}, "DIG.4.4.2": {"tipo": "cr", "texto": "Reconocer las aportaciones de las tecnologías digitales en las gestiones administrativas, y el comercio electrónico, siendo consciente de la brecha social de acceso, uso y aprovechamiento de dichas tecnologías para diversos colectivos.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.4"]}, "DIG.4.4.3": {"tipo": "cr", "texto": "Valorar la importancia de la oportunidad, facilidad y libertad de expresión que suponen los medios digitales conectados, analizando de forma crítica los mensajes que se reciben y transmiten teniendo en cuenta su objetividad, ideología, intencionalidad, sesgos y caducidad.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.6"]}, "DIG.4.4.4": {"tipo": "cr", "texto": "Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.5"]}, "DIG.4.A": {"tipo": "sb", "texto": "Dispositivos digitales, sistemas operativos y de comunicación.", "hijos": ["DIG.4.A.1", "DIG.4.A.2", "DIG.4.A.3", "DIG.4.A.4"], "criterios": []}, "DIG.4.A.1": {"tipo": "sb", "texto": "Arquitectura de ordenadores: elementos, montaje, configuración y resolución de problemas.", "hijos": [], "criterios": []}, "DIG.4.A.2": {"tipo": "sb", "texto": "Sistemas operativos: instalación y configuración de usuario.", "hijos": [], "criterios": []}, "DIG.4.A.3": {"tipo": "sb", "texto": "Sistemas de comunicación e internet: dispositivos de red y funcionamiento. Procedimiento de configuración de una red doméstica y conexión de dispositivos.", "hijos": [], "criterios": []}, "DIG.4.A.4": {"tipo": "sb", "texto": "Dispositivos conectados (IoT + Wearables): configuración y conexión de dispositivos.", "hijos": [], "criterios": []}, "DIG.4.B": {"tipo": "sb", "texto": "Digitalización del entorno personal de aprendizaje.", "hijos": ["DIG.4.B.1", "DIG.4.B.2", "DIG.4.B.3", "DIG.4.B.4"], "criterios": []}, "DIG.4.B.1": {"tipo": "sb", "texto": "Búsqueda, administración, gestión, selección y archivo de información.", "hijos": [], "criterios": []}, "DIG.4.B.2": {"tipo": "sb", "texto": "Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.B.3": {"tipo": "sb", "texto": "Comunicación y colaboración en red.", "hijos": [], "criterios": []}, "DIG.4.B.4": {"tipo": "sb", "texto": "Publicación y difusión responsable en redes.", "hijos": [], "criterios": ["DIG.4.2.3"]}, "DIG.4.C": {"tipo": "sb", "texto": "Seguridad y bienestar digital.", "hijos": ["DIG.4.C.1", "DIG.4.C.2", "DIG.4.C.3"], "criterios": []}, "DIG.4.C.1": {"tipo": "sb", "texto": "Seguridad de dispositivos: medidas preventivas y correctivas para hacer frente a riesgos, amenazas y ataques a dispositivos.", "hijos": [], "criterios": []}, "DIG.4.C.2": {"tipo": "sb", "texto": "Seguridad y protección de datos: identidad, reputación digital, privacidad y huella digital. Medidas preventivas en la configuración de redes sociales y la gestión de identidades virtuales.", "hijos": [], "criterios": []}, "DIG.4.C.3": {"tipo": "sb", "texto": "Seguridad en la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).", "hijos": [], "criterios": []}, "DIG.4.D": {"tipo": "sb", "texto": "Ciudadanía digital crítica.", "hijos": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.3", "DIG.4.D.4", "DIG.4.D.5", "DIG.4.D.6"], "criterios": []}, "DIG.4.D.1": {"tipo": "sb", "texto": "Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.", "hijos": [], "criterios": ["DIG.4.2.3", "DIG.4.4.3"]}, "DIG.4.D.2": {"tipo": "sb", "texto": "Educación mediática: periodismo digital, blogosfera, estrategias comunicativas y uso crítico de la red. Herramientas para detectar noticias falsas y fraudes.", "hijos": [], "criterios": ["DIG.4.4.3"]}, "DIG.4.D.3": {"tipo": "sb", "texto": "Gestiones administrativas: servicios públicos en línea, registros digitales y certificados oficiales.", "hijos": [], "criterios": ["DIG.4.4.1"]}, "DIG.4.D.4": {"tipo": "sb", "texto": "Comercio electrónico: facturas digitales, formas de pago y criptomonedas.", "hijos": [], "criterios": []}, "DIG.4.D.5": {"tipo": "sb", "texto": "Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.", "hijos": [], "criterios": ["DIG.4.4.1"]}, "DIG.4.D.6": {"tipo": "sb", "texto": "Activismo en línea: plataformas de iniciativa ciudadana y cibervoluntariado y comunidades de hardware y software libres.", "hijos": [], "criterios": ["DIG.4.4.3"]}, "CCL1": {"tipo": "de", "texto": "Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.", "competencias": []}, "CCL2": {"tipo": "de", "texto": "Comprende, interpreta y valora con actitud crítica textos orales, escritos, signados o multimodales de los ámbitos personal, social, educativo y profesional para participar en diferentes contextos de manera activa e informada y para construir conocimiento.", "competencias": []}, "CCL3": {"tipo": "de", "texto": "Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": []}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": []}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": []}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": []}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": []}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["DIG.4.2"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": ["DIG.4.2"]}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["DIG.4.2", "DIG.4.4"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["DIG.4.4"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": []}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": ["DIG.4.2", "DIG.4.4"]}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": []}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": []}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": ["DIG.4.2"]}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["DIG.4.2"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": ["DIG.4.4"]}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": ["DIG.4.4"]}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": ["DIG.4.4"]}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": ["DIG.4.4"]}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": ["DIG.4.4"]}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["DIG.4.2"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": []}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": []}}, "idx": {"criterios": ["DIG.4.2.3", "DIG.4.4.1", "DIG.4.4.3"], "competencias": ["DIG.4.2", "DIG.4.4"], "saberes": ["DIG.4.B.2", "DIG.4.D.1", "DIG.4.D.5"], "descriptores": ["CC1", "CC2", "CC3", "CC4", "CD1", "CD2", "CD3", "CD4", "CE1", "CE3", "CPSAA1", "CPSAA4", "CPSAA5"], "sesionesPorCriterio": {"DIG.4.2.3": [2, 3, 7, 8, 9], "DIG.4.4.1": [4, 6, 7, 8], "DIG.4.4.3": [5, 6, 9]}, "porMateria": [{"codigo": "DIG", "criterios": ["DIG.4.2.3", "DIG.4.4.1", "DIG.4.4.3"], "competencias": ["DIG.4.2", "DIG.4.4"], "saberes": ["DIG.4.B.2", "DIG.4.D.1", "DIG.4.D.5"], "descriptores": ["CC1", "CC2", "CC3", "CC4", "CD1", "CD2", "CD3", "CD4", "CE1", "CE3", "CPSAA1", "CPSAA4", "CPSAA5"]}], "materiasTxt": "Digitalización", "mapaAlumnado": {"DIG.4.2.3": [], "DIG.4.4.1": [], "DIG.4.4.3": []}, "multinivel": []}, "seneca": {"titulo": "SdA 5: El mundo de la imagen, edición y transparencia algorítmica", "temporalizacion": "9 sesiones", "justificacion": "La cultura visual del alumnado exige comprender los gráficos digitales (mapa de bits y vectorial), editar imágenes con criterio técnico, respetar la propiedad intelectual y el derecho a la propia imagen y entender críticamente cómo genera imágenes la inteligencia artificial y qué sesgos reproduce. Un cartel real para un evento del centro, impreso y publicado, da sentido al aprendizaje.", "producto_final": "Cartel publicitario o informativo para un evento escolar real, en versión impresa (PDF A3) y digital (PNG 1080 × 1350 px), con imágenes editadas en GIMP o Canva, recursos con licencia citados y un módulo de imagen generado o retocado con IA debidamente etiquetado, acompañado de su ficha técnica y de créditos y presentado oralmente ante la clase.", "concrecion": [{"materia": "Digitalización", "texto": "COMPETENCIAS ESPECÍFICAS\nDIG.4.2.Configurar el entorno personal de aprendizaje, interactuando y aprovechando los recursos del ámbito digital, para optimizar y gestionar el aprendizaje permanente.\nDIG.4.4.Ejercer una ciudadanía digital crítica, conociendo las posibles acciones que realizar en la red, e identificando sus repercusiones, para hacer un uso activo, responsable y ético de la tecnología.\n\nCRITERIOS DE EVALUACIÓN\nDIG.4.2.3.Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.\nDIG.4.4.1.Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.\nDIG.4.4.3.Valorar la importancia de la oportunidad, facilidad y libertad de expresión que suponen los medios digitales conectados, analizando de forma crítica los mensajes que se reciben y transmiten teniendo en cuenta su objetividad, ideología, intencionalidad, sesgos y caducidad.\n\nSABERES BÁSICOS\nDIG.4.B.2.Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.\nDIG.4.D.1.Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.\nDIG.4.D.5.Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.\n\nDESCRIPTORES OPERATIVOS\nCC1. Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento."}], "actividades": [{"titulo": "Detectives de imágenes e IA", "tipo": "Exploración", "abreviatura": "EXP1", "orden": "1", "tarea": "5.2 · Detective de imágenes e IA", "descripcion": "Sesión 4 (50 min): ¿Puedo usar esta imagen? Licencias y derecho a la propia imagen\nReto: Encontrar imágenes que se puedan usar legalmente en el cartel y citarlas bien.\n- Caso de partida (8 min). El docente plantea dos casos: una cuenta escolar que pone en su cartel una foto sacada de Google Imágenes y recibe una reclamación del fotógrafo, y una cuenta de TikTok que sube la foto de un compañero sin su permiso. Pregunta: «¿Qué han hecho mal en cada caso?». Lluvia de ideas en la pizarra.\n- Licencias y derecho de imagen (12 min). Explicación breve: todos los derechos reservados (por defecto, aunque no ponga nada), licencias Creative Commons (BY, SA, NC, ND), dominio público (CC0) y derecho a la propia imagen (no se publican personas reconocibles sin permiso; con menores, el de sus familias). Cómo se cita: Título, Autor/a, Fuente y Licencia (regla TAFL), con un ejemplo proyectado.\n- Búsqueda para mi cartel (20 min). Cada estudiante busca en Openverse (filtro «Uso comercial permitido» y «Modificar o adaptar») y en Wikimedia Commons al menos tres recursos para su cartel (una foto, una ilustración o icono y, si puede, un SVG), los descarga en la carpeta de su Drive y apunta sus créditos en la Parte 1 de la plantilla A2, que entregará en la Tarea 5.3.\n- ¿Se puede o no se puede? (10 min). Quiz en la web de clase con casos rápidos: usar una imagen CC BY-NC en el cartel del centro, modificar una imagen CC BY-ND, usar la foto de un famoso, publicar una foto de clase con caras. Se corrige y se comenta cada caso.\n- Evidencia: Parte 1 de la plantilla A2 con tres créditos completos\n- Evidencia: Respuestas al quiz de licencias\n\nSesión 5 (50 min): ¿Cómo «dibuja» una IA? Funcionamiento, sesgos y transparencia\nReto: Entender cómo genera imágenes una IA y comprobar con un experimento qué sesgos reproduce.\n- Gancho: «una persona que programa» (7 min). El docente pregunta: «Si le pido a una IA una persona que programa, ¿cómo será?». El alumnado lo apunta. Después proyecta cuatro resultados generados con ese mismo texto y se compara con lo que esperaban.\n- ¿Cómo funciona una IA de imágenes? (13 min). Explicación con un flujo sencillo: la IA se entrena con millones de imágenes de internet con su descripción; aprende patrones (no guarda las fotos); para crear, parte de ruido y lo va «limpiando» paso a paso guiada por el texto que escribimos (el prompt). Consecuencias: repite lo que más ha visto (sesgos), muchos artistas no dieron permiso para que se usaran sus obras, y quien mira una imagen tiene derecho a saber si es real (transparencia algorítmica). Vídeo corto opcional elegido por el docente.\n- Experimento de sesgos (20 min). Por parejas, con Canva para Educación (Magic Media) si el centro lo tiene activado para el alumnado, o con el banco de imágenes que el docente ha generado antes y proyecta: se piden cinco imágenes con textos neutros («una persona que dirige una empresa», «una persona que cuida a un bebé», «una persona que juega al fútbol profesional», «una familia andaluza», «una persona que limpia una oficina»). Cada estudiante registra en la Parte 1 de la plantilla A1 quién aparece (género, edad, color de piel, ropa, lugar) y qué se repite.\n- Puesta en común (10 min). ¿De dónde sale el sesgo? (de los datos con los que aprendió). ¿Cómo evitarlo en mi cartel? (describir con detalle la diversidad en el prompt, revisar los resultados y descartar los estereotipos). Cada estudiante escribe en la A1 un prompt mejorado.\n- Evidencia: Parte 1 de la plantilla A1 (experimento de sesgos)\n- Evidencia: Prompt mejorado en la plantilla A1\n\nSesión 6 (50 min): Detective de imágenes: ¿real, retocada o generada?\nReto: Analizar imágenes que circulan por redes, comprobar si son reales, retocadas o generadas y reflexionar sobre cómo usar la IA de forma ética.\n- Las pistas del detective (12 min). El docente muestra pistas visuales (manos y dedos raros, texto deformado, sombras y reflejos que no cuadran, piel demasiado perfecta, fondos repetidos) y herramientas: búsqueda inversa con Google Lens, verificación de credenciales de contenido (Content Credentials) y las etiquetas de «Creado con IA» de Instagram y TikTok. Se advierte de que los detectores automáticos se equivocan y de que hay que combinar pistas.\n- Investigación (20 min). Cada estudiante elige tres de las seis imágenes del dossier del docente (una imagen viral generada con IA, un anuncio retocado, una foto real sorprendente, un montaje de una noticia falsa, una foto con filtro de belleza y una ilustración etiquetada como IA) y completa la Parte 2 de la plantilla A1: pistas que ve, cómo lo ha comprobado, su veredicto y quién la difunde y para qué.\n- Uso ético de la IA (10 min). Debate breve guiado: ¿cuándo es aceptable usar IA en un cartel? Se acuerdan normas (etiquetar, no imitar a personas reales, no usar fotos del alumnado, no copiar el estilo de un artista concreto, revisar los sesgos). Cada estudiante escribe sus tres normas en la Parte 3 de la A1.\n- Entrega de la Tarea 5.2 (8 min). El alumnado revisa la lista «Antes de entregar» de la plantilla, descarga la A1 en PDF y la sube a la Tarea 5.2.\n- Moodle Centros: Tarea «5.2 · Detective de imágenes e IA» (evaluada con rúbrica 1-3-5-7-10). Evaluar con rúbrica el análisis crítico de imágenes generadas o manipuladas, los sesgos de la IA y el uso ético de las imágenes y de la IA, con la plantilla A1 completada en las sesiones 5 y 6.\n- Evidencia: Plantilla A1 completa (Tarea 5.2)", "temporalizacion": "3 sesiónes", "recursos": "Openverse, Wikimedia Commons, Plantilla A2, Canva para Educación, Banco de imágenes del docente, Plantilla A1, Dossier de seis imágenes, Google Lens", "descriptores": "CC1. Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nDIG.4.4.3.Valorar la importancia de la oportunidad, facilidad y libertad de expresión que suponen los medios digitales conectados, analizando de forma crítica los mensajes que se reciben y transmiten teniendo en cuenta su objetividad, ideología, intencionalidad, sesgos y caducidad.\nDIG.4.4.1.Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.", "ejercicios": "Explica qué han hecho mal en los dos casos de partida.\nBusca tres imágenes con licencia libre para tu cartel y anota título, autor/a, fuente y licencia.\nDecide si se pueden usar cuatro imágenes según su licencia y justifica tu respuesta.\nPredice cómo será la imagen de «una persona que programa» y compárala con la que genera la IA.\nRegistra en una tabla quién aparece en cinco imágenes generadas con textos neutros y qué se repite.\nReescribe un prompt para evitar el sesgo que has encontrado.\nAnaliza tres imágenes del dossier: pistas, comprobación, veredicto e intención de quien las difunde.\nEscribe tres normas para usar la IA de forma ética en un cartel.", "metodologias": "Pensamiento crítico, Aprender haciendo, Aprendizaje entre iguales", "sesiones": [4, 5, 6]}, {"titulo": "Cartel del evento: diseño, edición y presentación", "tipo": "Conclusión", "abreviatura": "CON1", "orden": "2", "tarea": "5.3 · Cartel del evento y presentación", "descripcion": "Sesión 1 (50 min): ¿Real, retocada o IA? El encargo del cartel\nReto: Descubrir que casi todas las imágenes que vemos están editadas o generadas, conocer el encargo y probar qué pasa al ampliar una imagen.\n- Gancho: ¿real, retocada o IA? (10 min). El docente proyecta seis imágenes: una foto del patio sin retocar, la misma con un filtro de Instagram, una foto con un objeto borrado, una imagen generada con IA, un anuncio con una modelo retocada y el logotipo del centro. El alumnado vota a mano alzada (1 dedo real, 2 retocada, 3 IA) y el docente revela la respuesta. Pregunta: «¿Cuántas imágenes de las que veis hoy en TikTok son 100 % reales?».\n- Encuesta inicial (8 min). El alumnado responde la encuesta anónima F1 (hábitos con filtros, edición, IA y licencias) desde el enlace de la web de clase. El docente proyecta después los resultados de la clase sin nombres.\n- El encargo (12 min). El docente presenta el encargo: el cartel de un evento del segundo trimestre que el centro imprimirá en DINA3 y publicará en su Instagram. Se elige el evento por votación (Día de Andalucía, Día de Internet Segura, 8M o semana cultural). Se enseñan el producto final, el calendario (Tareas 5.1, 5.2 y 5.3) y la rúbrica de la Tarea 5.3 para que sepan desde hoy qué se evalúa.\n- Primer experimento: el zoom (15 min). Cada estudiante abre en el navegador dos archivos del logotipo del centro que el docente ha dejado en la carpeta compartida (logo.png y logo.svg), amplía los dos al 800 % y anota en el cuaderno qué ve en cada uno (cuadraditos o bordes perfectos) y cuánto pesa cada archivo.\n- Pregunta de salida (5 min). Cada estudiante responde en voz alta o en un pósit: «¿Por qué crees que un archivo se pixela y el otro no?». Se recogen hipótesis para la sesión 2.\n- Evidencia: Encuesta inicial F1 (diagnóstica)\n- Evidencia: Anotaciones del experimento del zoom en el cuaderno\n\nSesión 2 (50 min): Píxeles y vectores: cada imagen en su formato\nReto: Saber qué tipo de imagen y qué formato usar, y calcular si una imagen tiene resolución suficiente para imprimir el cartel.\n- ¿Qué pasó con el zoom? (5 min). Puesta en común de las hipótesis de la sesión 1. El docente amplía de nuevo los dos logotipos en el proyector y pregunta quién acertó.\n- Mapa de bits y vectorial (12 min). Explicación con infografía: el mapa de bits es una cuadrícula de píxeles con un color cada uno (una foto del móvil de 12 megapíxeles tiene unos 4000 × 3000 píxeles); el vectorial guarda puntos, líneas, curvas y rellenos como instrucciones, por eso se amplía sin perder calidad (logotipos, iconos, tipografías). El alumnado completa en el cuaderno una tabla de dos columnas con tres ejemplos de cada tipo.\n- ¿Qué formato es mejor? (10 min). Se presentan JPG (fotos, comprime con pérdida), PNG (transparencia, sin pérdida), WEBP (web), GIF (animaciones sencillas), SVG (vectorial para web) y PDF (para imprimir). Práctica rápida: clasificar ocho situaciones de la diapositiva (foto para Instagram, logotipo con fondo transparente, icono de una web, cartel para la imprenta…).\n- Pantalla o papel (15 min). Se explica la resolución: en pantalla importan los píxeles (un post vertical de Instagram mide 1080 × 1350 px) y en papel los puntos por pulgada (300 ppp para imprimir bien). Cálculo guiado: píxeles = cm ÷ 2,54 × 300; un DINA3 (29,7 × 42 cm) necesita unos 3508 × 4961 px. El alumnado comprueba en el cuaderno si una foto de 1200 × 900 px sirve para un DINA3 (no: a 300 ppp solo mide unos 10 × 7,6 cm). Se menciona que la pantalla u const $ = s => document.querySelector(s);

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }

/* ---------- 2. secuenciación ---------- */
(function(){
  const COLORS = ['#2563eb','#0891b2','#0f766e','#7c3aed','#b45309','#be123c'];
  const fases = arr(S.fases);
  const total = S.sesiones.length;
  const fcol = {}; fases.forEach((f,i)=>fcol[f.nombre]=COLORS[i%COLORS.length]);
  const count = f => S.sesiones.filter(s=>s.fase===f.nombre).length;
  let h = `<div class="card"><h2>Distribución temporal</h2><div class="timeline">${fases.map(f=>`<div style="flex:${count(f)};background:${fcol[f.nombre]}">${esc(f.nombre)} · ${count(f)} ses.</div>`).join('')}</div>
    <div class="grid g2" style="margin-top:12px">${fases.map(f=>`<div><b style="color:${fcol[f.nombre]}">${esc(f.nombre)}</b> (sesiones ${esc(f.sesiones||'')}) — ${esc(f.finalidad||'')} · ${Math.round(count(f)/total*100)} %</div>`).join('')}</div></div>`;
  const duaSet = [...new Set(S.sesiones.flatMap(s=>arr(s.dua && s.dua.principios)))];
  h += `<div class="filters" id="ff"><span class="legend">Fase:</span><button class="on" data-f="*">Todas</button>${fases.map(f=>`<button data-f="${esc(f.nombre)}">${esc(f.nombre)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">DUA:</span>${duaSet.map(d=>`<button data-d="${esc(d)}">${esc(d)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">Moodle:</span><button data-m="1">Con actividad Moodle</button>
    <button data-open="1" style="margin-left:auto">Desplegar todas</button></div><div id="slist"></div>`;
  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){
    const list = S.sesiones.filter(s => (state.f==='*'||s.fase===state.f) && (!state.d || arr(s.dua&&s.dua.principios).includes(state.d)) && (!state.m || arr(s.moodle).length));
    $('#slist').innerHTML = list.map(s => `<details class="ses" data-n="${s.n}"><summary><div class="num" style="background:${fcol[s.fase]}22;color:${fcol[s.fase]}">${s.n}</div>
      <div><div class="stitle">Sesión ${s.n} · ${esc(s.titulo)} <span class="badge">${esc(s.fase)}</span>${arr(s.moodle).length?'<span class="badge" style="background:var(--moodle-bg);color:var(--moodle)">Moodle</span>':''}</div><div class="sreto">${esc(s.reto)}</div></div></summary>
      <div class="sbody"><div>${arr(s.actividades).map(a=>`<div class="act"><b>${esc(a.nombre)}</b><span class="min">${a.min?esc(a.min)+' min':''}</span><p>${esc(a.desc)}</p></div>`).join('')}
        ${arr(s.moodle).length?`<div class="moodle"><div class="mh">Integración con Moodle Centros</div>${arr(s.moodle).map(m=>`<div class="mitem"><div class="mt">${esc(m.recurso)} · «${esc(m.nombre)}»${corrBadge(m)}${m.criterio?' '+chip(m.criterio):''}</div><p>${esc(m.uso)}</p>${m.correccion==='apto'?`<div class="lab">Se verifica</div>${ul(m.cotejo)}`:''}${m.correccion==='rubrica'?`<p class="note">Se evalúa con la rúbrica de la pestaña «6. Evaluación».</p>`:''}${arr(m.config).length?`<div class="lab">Configuración</div>`+ul(m.config):''}</div>`).join('')}</div>`:''}
      </div><div class="side">
        <div class="lab">Criterios</div>${arr(s.criterios).length?chips(s.criterios):'<span class="note">Evaluación diagnóstica (no calificable)</span>'}
        <div class="lab">Saberes</div>${chips(s.saberes)}
        ${arr(s.metodologia).length?`<div class="lab">Metodología</div><p>${arr(s.metodologia).map(esc).join(' · ')}</p>`:''}
        ${arr(s.evidencias).length?`<div class="lab">Evidencias</div>${ul(s.evidencias)}`:''}
        ${arr(s.recursos).length?`<div class="lab">Recursos</div><p>${arr(s.recursos).map(esc).join(' · ')}</p>`:''}
        ${s.dua?`<div class="lab">DUA (${arr(s.dua.principios).map(esc).join(', ')})</div><p>${esc(s.dua.medidas)}</p>`:''}
      </div></div></details>`).join('') || '<p class="note">Ninguna sesión coincide con el filtro.</p>';
  }
  $('#ff').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.open){ openAll(); return; }
    if(b.dataset.f){ state.f=b.dataset.f; $('#ff').querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); }
    if(b.dataset.d){ state.d = state.d===b.dataset.d?null:b.dataset.d; $('#ff').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===state.d)); }
    if(b.dataset.m){ state.m=!state.m; b.classList.toggle('on',state.m); }
    render(); };
  render();
})();

      <td>${arr(it.saberes).map(s=>chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}</td><td>${chips(ce.descriptores)}</td>

  IDX.criterios.forEach(c => { h += `<tr><td>${chip(c)}</td>${S.sesiones.map(s=>`<td class="tick">${arr(s.criterios).includes(c)?'✔':''}</td>`).join('')}</tr>`; });

  if(arr(S.notas_rigor).length) h += `<div class="card" style="margin-top:16px"><h2>Notas de rigor curricular</h2>${ul(S.notas_rigor)}</div>`;
  $('#p-map').innerHTML = h;
})();

/* ---------- 4. moodle ---------- */
(function(){
  const Mo = S.moodle || {};
  // Criterios de una Tarea: el principal y los de cada línea de su rúbrica (así llegan todos a Séneca)
  const critsDe = m => [...new Set([m.criterio, ...arr(m.rubrica).map(l=>l.criterio)].filter(Boolean))];
  const all = S.sesiones.flatMap(s => arr(s.moodle).map(m => ({...m, n:s.n})));
  let h = `<div class="grid g2"><div class="card"><h2>Estructura del curso</h2>${Mo.estructura?`<p>${esc(Mo.estructura)}</p>`:''}${arr(Mo.secciones).map(sec=>`<div class="lab">${esc(sec.nombre)}</div>${ul(sec.elementos)}`).join('')}</div>
    <div class="card"><h2>Libro de calificaciones</h2>${Mo.calificaciones?`<p>${esc(Mo.calificaciones)}</p>`:''}<p class="note">Una Tarea con rúbrica aparece en todos los criterios que evalúan sus líneas; la nota de cada criterio la calcula la pestaña «Evaluación» y es la que se pasa a Séneca.</p>
      <table class="tbl"><thead><tr><th>Criterio</th><th>Elementos calificables en Moodle</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${all.filter(m=>m.calificable && critsDe(m).includes(c)).map(m=>{ const ls = arr(m.rubrica).filter(l=>l.criterio===c).map(l=>l.linea);
        return `S${m.n} · ${esc(m.recurso)} «${esc(m.nombre)}»${ls.length && critsDe(m).length>1 ? `<div class="note">Líneas de la rúbrica: ${ls.map(esc).join(' · ')}</div>` : ''}`; }).join('<br>') || '<span class="note">Se califica fuera de Moodle (observación, exposición…)</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(Mo.configuracion).length) h += `<div class="card" style="margin-top:16px"><h2>Configuración general recomendada</h2>${ul(Mo.configuracion)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Todas las actividades de Moodle</h2><div class="scroll"><table class="tbl"><thead><tr><th>Sesión</th><th>Recurso</th><th>Nombre</th><th>Corrección</th><th>Para qué</th><th>Configuración clave</th></tr></thead><tbody>${all.map(m=>`<tr><td>S${m.n}</td><td>${esc(m.recurso)}</td><td>${esc(m.nombre)} ${chips(critsDe(m))}</td><td>${corrBadge(m)||'—'}</td><td>${esc(m.uso)}</td><td>${ul(m.config)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#p-moodle').innerHTML = h;
})();

/* ---------- 6. evaluación ---------- */
(function(){
  const E = S.evaluacion || {};
  let st = {}; try{ st = JSON.parse(localStorage.getItem('sda-cotejo-'+M.titulo)||'{}'); }catch(_){}
  let h = `<div class="card"><h2>Lista de cotejo interactiva</h2><p class="note">Marca los indicadores logrados; el progreso se calcula por criterio y se guarda en este navegador.</p>
    <div class="grid g2">${arr(E.cotejo).map((g,gi)=>`<div class="side"><span class="pct" data-p="${gi}"></span>${chip(g.criterio)}<div class="bar"><div data-b="${gi}"></div></div><ul class="cot" style="padding:0">${arr(g.indicadores).map((t,i)=>`<li><label><input type="checkbox" data-k="${gi}-${i}" ${st[gi+'-'+i]?'checked':''}> <span>${esc(t)}</span></label></li>`).join('')}</ul></div>`).join('')}</div>
    <button class="copy" id="cot-reset" style="margin-top:10px">Borrar marcas</button></div>`;
  const TR = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='rubrica').map(m=>({...m,n:x.n})));
  const TA = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='apto').map(m=>({...m,n:x.n})));
  const PTS = [1,3,5,7,10];
  if(TR.length) h += `<div class="card" style="margin-top:16px"><h2>Rúbricas de las tareas finales</h2><p class="note">Cada línea se puntúa con 1, 3, 5, 7 o 10 puntos y la nota es la media (ponderada cuando la línea indica su peso). Pulsa una casilla para calcular la nota de un estudiante (no se guarda).</p>${TR.map((m,ti)=>`<h3>${tname(m)} ${chips([...new Set(arr(m.rubrica).map(l=>l.criterio||m.criterio))])} <span class="pct" data-rn="${ti}"></span></h3><div class="scroll"><table class="tbl rub" data-t="${ti}"><thead><tr><th>Línea</th>${PTS.map(p=>`<th>${p} pto</th>`).join('')}</tr></thead><tbody>${arr(m.rubrica).map((l,li)=>`<tr><td><b>${esc(l.linea)}</b>${l.criterio?`<br><small>${esc(l.criterio)}</small>`:''}${l.peso?`<br><small>peso ${String(l.peso).replace('.',',')} %</small>`:''}</td>${arr(l.niveles).map((x,k)=>`<td class="rc" data-l="${li}" data-w="${l.peso||1}" data-c="${esc(l.criterio||m.criterio||'')}" data-p="${PTS[k]}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
  if(TA.length) h += `<div class="card" style="margin-top:16px"><h2>Tareas de verificación (Apto / No apto)</h2><p class="note">Es Apto si se cumplen todos los elementos.</p><div class="grid g2">${TA.map(m=>`<div class="side"><b>${tname(m)}</b> ${chip(m.criterio)}${ul(m.cotejo)}</div>`).join('')}</div></div>`;
  if(arr(E.rubrica).length){ const niv = E.niveles || ['Insuficiente (1-4)','Suficiente / Bien (5-6)','Notable (7-8)','Sobresaliente (9-10)'];
    h += `<div class="card" style="margin-top:16px"><h2>Rúbrica</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${niv.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${E.rubrica.map(r=>`<tr><td>${chip(r.criterio)}</td>${arr(r.niveles).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; }
  if(E.agentes) h += `<div class="card" style="margin-top:16px"><h2>Agentes e instrumentos</h2>${Object.entries(E.agentes).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;
  $('#p-eval').innerHTML = h;
  const sel = {};
  $('#p-eval').addEventListener('click', e => { const c = e.target.closest('td.rc'); if(!c) return; const t = c.closest('table').dataset.t;
    c.parentElement.querySelectorAll('td.rc').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    sel[t] = sel[t]||{}; sel[t][c.dataset.l] = [+c.dataset.p, +c.dataset.w]; const v = Object.values(sel[t]); const nl = c.closest('tbody').rows.length;
    const wt = [...c.closest('tbody').rows].reduce((a,r)=>a+(+r.querySelector('td.rc').dataset.w),0);
    document.querySelector(`[data-rn="${t}"]`).textContent = `Nota: ${(v.reduce((a,[p,w])=>a+p*w,0)/wt).toFixed(1)}` + (()=>{ const rs=[...c.closest('tbody').rows].map(r=>r.querySelector('td.rc').dataset); const cs=[...new Set(rs.map(d=>d.c))]; if(cs.length<2) return ''; return ' · ' + cs.map(k=>{ const ws=rs.filter(d=>d.c===k).reduce((a,d)=>a+(+d.w),0); const pt=Object.entries(sel[t]).filter(([i])=>rs[i].c===k).reduce((a,[,x])=>a+x[0]*x[1],0); return k+': '+(pt/ws).toFixed(1); }).join(' · '); })() + (v.length<nl?` (faltan ${nl-v.length} líneas)`:''); });
  function upd(){ arr(E.cotejo).forEach((g,gi)=>{ const n = arr(g.indicadores).length; const k = arr(g.indicadores).filter((_,i)=>st[gi+'-'+i]).length; const p = n?Math.round(k/n*100):0;
    document.querySelector(`[data-b="${gi}"]`).style.width = p+'%'; document.querySelector(`[data-p="${gi}"]`).textContent = p+' %'; }); }
  function save(){ try{ localStorage.setItem('sda-cotejo-'+M.titulo, JSON.stringify(st)); }catch(_){} }
  $('#p-eval').addEventListener('change', e => { const k = e.target.dataset.k; if(k){ st[k]=e.target.checked; save(); upd(); } });
  $('#cot-reset').onclick = () => { st = {}; save(); document.querySelectorAll('#p-eval input[type=checkbox]').forEach(x=>x.checked=false); upd(); };
  upd();
})();

/* ---------- 7. Séneca ---------- */
(function(){
  const SE = DATA.seneca;
  const box = (t, txt) => `<div class="copybox"><div class="ch"><span>${esc(t)}</span><button class="copy">Copiar</button></div><pre>${esc(txt)}</pre></div>`;
  let h = `<div class="card"><h2>Textos listos para pegar en Séneca</h2><p class="note">Séneca guarda texto plano: estos bloques no llevan formato Markdown. Copia cada campo en su casilla del formulario de la situación de aprendizaje.</p>
    ${box('Título', SE.titulo)}${box('Temporalización', SE.temporalizacion)}${box('Justificación', SE.justificacion)}${box('Producto final', SE.producto_final)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Concreción curricular</h2><p class="note">En Séneca se marcan en las listas; aquí tienes la selección para comprobarla.</p>${SE.concrecion.map(m=>box(m.materia, m.texto)).join('')}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Actividades (formulario «Detalle de la actividad»)</h2><p class="note">Los campos siguen el orden del formulario de Séneca. Solo hay una actividad por cada Tarea de Moodle evaluada con rúbrica. En «Vinculación criterios de evaluación» elige la única trazabilidad indicada y pasa esos criterios a «seleccionados» (es obligatorio).</p>${SE.actividades.map(a=>`<h3>${esc(a.orden)}. ${esc(a.titulo)} <span class="badge">${esc(a.tipo)}</span> <span class="badge">${esc(a.abreviatura)}</span> <span class="badge">Tarea ${esc(a.tarea)}</span></h3>${box('Título de la actividad', a.titulo)}${box('Tipo de actividad', a.tipo)}${box('Abreviatura', a.abreviatura)}${box('Orden de la presentación', a.orden)}${box('Descripción', a.descripcion)}${box('Temporalización', a.temporalizacion)}${box('Recursos', a.recursos)}${box('Descriptores operativos', a.descriptores)}${box('Vinculación criterios de evaluación', a.vinculacion)}${box('Ejercicios', a.ejercicios)}${box('Metodologías', a.metodologias)}`).join('')}</div>`;
  $('#p-seneca').innerHTML = h;
})();

/* ---------- Anexos: plantillas y formularios ---------- */
(function(){
  if (!HAY_ANX) return;
  const A = S.anexos, P = arr(A.plantillas), F = arr(A.formularios);
  const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const ses = ns => { ns = arr(ns).slice().sort((a,b)=>a-b); if(!ns.length) return '';
    return (ns.length>1 && ns[ns.length-1]-ns[0]===ns.length-1) ? `Sesiones ${ns[0]}-${ns[ns.length-1]}` : (ns.length===1?'Sesión ':'Sesiones ')+ns.join(', '); };
  const TT = {opcion:'Una opción', casillas:'Varias opciones', desplegable:'Desplegable', escala:'Escala', texto:'Respuesta corta', parrafo:'Respuesta larga', cuadricula:'Cuadrícula', info:'Texto informativo'};
  let h = `<div class="card"><h2>Anexos para el alumnado</h2><p class="note">Solo las plantillas que se entregan en una Tarea y los formularios de Google. En el PDF cada plantilla empieza en su página, lista para imprimir o copiar en Google Docs. Los formularios se crean con <b>Codigo.gs</b>.</p>
    <p>${P.map(p=>`<span class="badge" style="margin-right:6px">${esc(p.id)} · ${esc(p.titulo)}</span>`).join('')}${F.map(f=>`<span class="badge" style="margin-right:6px">${esc(f.id)} · ${esc(f.titulo)}</span>`).join('')}</p></div>`;
  P.forEach(p => {
    let cab = p.cabecera;
    if (cab == null){ const ag = String(p.agrupamiento||'').toLowerCase();
      cab = ag.startsWith('individual') ? ['Nombre y apellidos','Grupo','Fecha'] : (ag.includes('pareja') ? ['Pareja','Fecha'] : ['Equipo','Integrantes','Fecha']); }
    const meta = [ses(p.sesiones), p.agrupamiento, p.herramienta, p.entrega ? 'Se entrega en '+p.entrega : ''].filter(Boolean).join(' · ');
    let b = `<div class="card anx anx-p"><h2>${esc(p.id)} · ${esc(p.titulo)}</h2><div class="am">${esc(meta)}</div>`;
    if (p.docente) b += `<div class="doc"><b>Para el docente:</b> ${md(p.docente)}</div>`;
    if (arr(cab).length) b += `<table class="w"><tbody><tr>${cab.map(c=>`<th style="width:auto;height:2.2em">${esc(c)}:</th>`).join('')}</tr></tbody></table>`;
    if (p.instrucciones) b += `<p>${md(p.instrucciones)}</p>`;
    arr(p.bloques).forEach(k => {
      if (k.titulo) b += `<h4>${esc(k.titulo)}</h4>`;
      if (k.texto) b += `<p>${md(k.texto)}</p>`;
      if (k.lista) b += `<ul>${arr(k.lista).map(x=>`<li>${md(x)}</li>`).join('')}</ul>`;
      if (k.casillas) b += arr(k.casillas).map(x=>`<div class="ck">☐ ${md(x)}</div>`).join('');
      if (k.campos) b += `<table class="w"><tbody>${arr(k.campos).map(c=>`<tr style="height:${(k.alto||1.3)*1.5}em"><th>${md(c)}</th><td></td></tr>`).join('')}</tbody></table>`;
      if (k.tabla){ const cols = arr(k.tabla.columnas); let fil = k.tabla.filas ?? 3;
        fil = typeof fil === 'number' ? Array.from({length:fil}, ()=>[]) : fil.map(arr);
        b += `<table class="w"><thead><tr>${cols.map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${fil.map(r=>`<tr style="height:${(k.tabla.alto||1.4)*1.5}em">${cols.map((_,i)=>`<td>${md(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
      if (k.lineas) b += `<div class="ln" style="height:${1.9*(k.lineas|0)}em"></div>`;
      if (k.nota) b += `<div class="am">${md(k.nota)}</div>`;
    });
    h += b + `</div>`;
  });
  F.forEach((f,fi) => {
    const meta = [ses(f.sesiones), f.anonimo ? 'Anónimo (no recoge el correo)' : 'Recoge el correo del centro', f.repetible ? 'Se puede responder varias veces' : ''].filter(Boolean).join(' · ');
    let n = 0, ob = false;
    const rows = arr(f.preguntas).map(q => {
      if (q.tipo === 'seccion') return `<tr><th colspan="4" style="background:var(--bg)">Sección: ${md(q.titulo)}${q.ayuda?' — '+md(q.ayuda):''}</th></tr>`;
      if (q.tipo !== 'info') n++;
      const o = q.obligatoria === undefined ? !!f.obligatorias : !!q.obligatoria; ob = ob || o;
      const et = arr(q.etiquetas);
      const op = q.tipo==='escala' ? `${q.min ?? 1}${et[0]?' ('+esc(et[0])+')':''} … ${q.max ?? 5}${et[1]?' ('+esc(et[1])+')':''}`
        : q.tipo==='cuadricula' ? `Filas: ${arr(q.filas).map(esc).join('; ')}. Columnas: ${arr(q.columnas).map(esc).join(' / ')}`
        : arr(q.opciones).map(esc).join(' / ') + (q.otra ? ' / Otra' : '');
      return `<tr><td>${q.tipo!=='info'?n:''}</td><td>${md(q.titulo)}${q.ayuda?` <span class="note">(${md(q.ayuda)})</span>`:''}${o?' *':''}</td><td>${TT[q.tipo]||esc(q.tipo)}</td><td>${op}</td></tr>`;
    }).join('');
    h += `<div class="card anx ${fi===0?'anx-p':''}"><h2>${esc(f.id)} · ${esc(f.titulo)}</h2><div class="am">${esc(meta)}</div>
      ${f.enlace?`<p>Ya creado: <a href="${esc(f.enlace)}" target="_blank" rel="noopener">${esc(f.enlace)}</a></p>`:''}${f.descripcion?`<p>${md(f.descripcion)}</p>`:''}
      <table class="w"><thead><tr><th>Nº</th><th>Pregunta</th><th>Respuesta</th><th>Opciones</th></tr></thead><tbody>${rows}</tbody></table>
      ${f.confirmacion?`<div class="am">Mensaje final: ${md(f.confirmacion)}</div>`:''}${ob?'<div class="am">* Respuesta obligatoria.</div>':''}</div>`;
  });
  $('#p-anx').innerHTML = h;
})();

/* ---------- Exportar PDF: todo desplegado + glosario con el texto oficial ---------- */
function prepararImpresion(){
  openAll();
  const ORD = {ce:0, cr:1, sb:2, de:3};
  const codes = [...new Set([...document.querySelectorAll('main .chip[data-code]')].map(c=>c.dataset.code))].filter(c=>CUR[c])
    .sort((a,b)=> (ORD[CUR[a].tipo]-ORD[CUR[b].tipo]) || a.localeCompare(b, 'es', {numeric:true}));
  $('#gloss').innerHTML = `<h2>Glosario: texto oficial de los códigos</h2><p class="note">Orden de 30 de mayo de 2023 (Andalucía). En la web, estos textos aparecen al pulsar cada código.</p>
    <dl>${codes.map(c=>`<dt>${esc(c)} · ${esc(KIND[CUR[c].tipo]||'')}</dt><dd>${esc(CUR[c].texto)}</dd>`).join('')}</dl>`;
}
addEventListener('beforeprint', prepararImpresion);   // también con Ctrl+P
function exportarPDF(){
  prepararImpresion();
  const t = document.title; document.title = (M.titulo || 'SdA').replace(/[\\/:*?"<>|]/g, '');
  setTimeout(() => { window.print(); document.title = t; }, 50);
}
</script>
