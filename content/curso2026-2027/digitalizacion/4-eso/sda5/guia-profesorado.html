<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 5: El mundo de la imagen, edición y transparencia algorítmica", "numero": 5, "subtitulo": "«Cartel con sello propio»: diseñamos el cartel de un evento del centro con imágenes editadas, con licencia y con IA etiquetada", "curso_texto": "4.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Trabajo individual con apoyo en parejas (el cartel puede hacerse en pareja como máximo; las fichas se entregan de forma individual)", "temporalizacion": "Segundo trimestre (orientativo: 4-5 semanas, 9 sesiones de 50 minutos)", "carpeta_drive": "1E8H0NqyXJEFZYBwVHE_YIigO-fc9B_sv"}, "materias": [{"codigo": "DIG", "criterios": ["DIG.4.2.3", "DIG.4.4.1", "DIG.4.4.3"], "saberes": ["DIG.4.B.2", "DIG.4.D.1", "DIG.4.D.5"]}], "vision": {"descripcion": "El alumnado aprende a distinguir imágenes de mapa de bits y vectoriales, a elegir formato y resolución según se vayan a imprimir o publicar, a retocarlas con GIMP y Canva, a usar solo imágenes con licencia y a entender de forma crítica cómo genera imágenes una inteligencia artificial, qué sesgos reproduce y por qué hay que etiquetar lo que crea. Todo confluye en un cartel real para un evento del centro, en versión impresa y digital, que cada estudiante presenta a la clase.", "contexto": "Grupo de 22 estudiantes de 4.º ESO con un currículo adaptado, en su mayoría repetidores o con dificultades de aprendizaje, muy activos en TikTok e Instagram, donde los filtros, los retoques y las imágenes generadas con IA forman parte de su día a día. Aula de informática con un ordenador por estudiante, Google Workspace del centro, Canva para Educación, Genially y Moodle Centros. Se prioriza el trabajo individual con apoyo en parejas y tareas cortas con pasos muy guiados.", "justificacion": "La cultura visual en la que vive el alumnado exige comprender cómo se construyen los gráficos digitales (mapa de bits y vectorial), dominar una edición técnica básica, respetar la propiedad intelectual y el derecho a la propia imagen, y entender críticamente cómo funciona la inteligencia artificial que genera imágenes: con qué datos aprende, qué sesgos reproduce y por qué la transparencia es una obligación ética. Un encargo real del centro da sentido al aprendizaje y a un producto que se imprime, se publica y se defiende en público.", "reto": "«Somos el equipo de diseño del instituto: el centro nos encarga el cartel de un evento del segundo trimestre (la jornada del Día de Andalucía, el Día de Internet Segura, el 8M o la semana cultural). Tiene que verse bien impreso en A3 y en Instagram, usar imágenes editadas por nosotros y con licencia, y si usamos IA, decirlo con claridad.»", "pregunta_guia": "¿Cómo creamos un cartel que llame la atención, que sea legal y que sea honesto con quien lo mira cuando usamos inteligencia artificial?", "producto_final": "Cartel publicitario o informativo para un evento escolar real, en versión impresa (PDF A3) y digital (PNG 1080 × 1350 px), con imágenes editadas en GIMP o Canva, recursos con licencia citados y un módulo de imagen generado o retocado con IA debidamente etiquetado, acompañado de su ficha técnica y de créditos y presentado oralmente ante la clase."}, "metodologias": [{"nombre": "Aprendizaje basado en proyectos", "descripcion": "Un encargo real del centro (el cartel del evento) guía todas las sesiones y cada Tarea es un paso hacia el producto final."}, {"nombre": "Aprender haciendo", "descripcion": "Cada sesión tiene una práctica guiada en el ordenador con pasos numerados y tiempo visible; la teoría se limita a lo que la práctica necesita."}, {"nombre": "Pensamiento crítico", "descripcion": "Experimento de sesgos con IA y análisis de imágenes reales y manipuladas para descubrir quién las crea, con qué intención y cómo se comprueban."}, {"nombre": "Aprendizaje entre iguales", "descripcion": "Parejas de apoyo para las prácticas y revisión entre parejas con la lista «Antes de entregar» antes de la entrega final."}], "recursos": ["Aula de informática", "GIMP (o Photopea en el navegador)", "Canva para Educación", "Openverse y Wikimedia Commons", "Google Docs y Forms del centro", "Moodle Centros", "Proyector", "Impresora A3 del centro"], "fases": [{"nombre": "Inicio", "sesiones": "1-2", "finalidad": "Motivación, encargo real, diagnóstico inicial y bases de la imagen digital (mapa de bits, vectorial, formatos y resolución)"}, {"nombre": "Desarrollo", "sesiones": "3-7", "finalidad": "Edición técnica, licencias y derechos de imagen, funcionamiento y sesgos de la IA generativa, verificación de imágenes y diseño del cartel"}, {"nombre": "Cierre", "sesiones": "8-9", "finalidad": "Exportación para papel y pantalla, revisión entre parejas, presentación oral y autoevaluación"}], "sesiones": [{"n": 1, "fase": "Inicio", "titulo": "¿Real, retocada o IA? El encargo del cartel", "reto": "Descubrir que casi todas las imágenes que vemos están editadas o generadas, conocer el encargo y probar qué pasa al ampliar una imagen.", "actividades": [{"nombre": "Gancho: ¿real, retocada o IA?", "min": 10, "desc": "El docente proyecta seis imágenes: una foto del patio sin retocar, la misma con un filtro de Instagram, una foto con un objeto borrado, una imagen generada con IA, un anuncio con una modelo retocada y el logotipo del centro. El alumnado vota a mano alzada (1 dedo real, 2 retocada, 3 IA) y el docente revela la respuesta. Pregunta: «¿Cuántas imágenes de las que veis hoy en TikTok son 100 % reales?»."}, {"nombre": "Encuesta inicial", "min": 8, "desc": "El alumnado responde la encuesta anónima F1 (hábitos con filtros, edición, IA y licencias) desde el enlace de la web de clase. El docente proyecta después los resultados de la clase sin nombres."}, {"nombre": "El encargo", "min": 12, "desc": "El docente presenta el encargo: el cartel de un evento del segundo trimestre que el centro imprimirá en DINA3 y publicará en su Instagram. Se elige el evento por votación (Día de Andalucía, Día de Internet Segura, 8M o semana cultural). Se enseñan el producto final, el calendario (Tareas 5.1, 5.2 y 5.3) y la rúbrica de la Tarea 5.3 para que sepan desde hoy qué se evalúa."}, {"nombre": "Primer experimento: el zoom", "min": 15, "desc": "Cada estudiante abre en el navegador dos archivos del logotipo del centro que el docente ha dejado en la carpeta compartida (logo.png y logo.svg), amplía los dos al 800 % y anota en el cuaderno qué ve en cada uno (cuadraditos o bordes perfectos) y cuánto pesa cada archivo."}, {"nombre": "Pregunta de salida", "min": 5, "desc": "Cada estudiante responde en voz alta o en un pósit: «¿Por qué crees que un archivo se pixela y el otro no?». Se recogen hipótesis para la sesión 2."}], "criterios": [], "saberes": ["DIG.4.B.2", "DIG.4.D.5"], "metodologia": ["Aprendizaje basado en proyectos", "Pensamiento crítico"], "evidencias": ["Encuesta inicial F1 (diagnóstica)", "Anotaciones del experimento del zoom en el cuaderno"], "recursos": ["Proyector", "Carpeta compartida con el logotipo", "Formulario F1"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Votación con gestos para que participe todo el mundo, encuesta con opciones cerradas y lenguaje sencillo, y rúbrica explicada con ejemplos visuales de cartel bueno y mejorable."}, "ejercicios": ["Clasifica seis imágenes como reales, retocadas o generadas con IA y explica una pista.", "Amplía al 800 % un logotipo en PNG y en SVG y anota qué observas y cuánto pesa cada archivo."], "clase": {"pregunta": "¿Cuántas de las imágenes que ves hoy en tu móvil son 100 % reales?", "diapositivas": [{"tipo": "ejemplo", "icono": "📱", "titulo": "Tu feed de Instagram", "situacion": "Una foto de vacaciones con el cielo **más azul** de lo normal, una cara sin una sola imperfección, un paisaje imposible.", "explicacion": "Detrás hay **filtros**, **retoque** o una **IA generativa**. Hoy aprendemos a distinguirlos y a usarlos con cabeza.", "pregunta": "¿Alguna vez te has creído una imagen que luego era falsa?"}, {"tipo": "practica", "titulo": "¿Real, retocada o IA?", "tiempo": 10, "enunciado": "Mira cada imagen y vota con la mano: **1 dedo** real, **2** retocada, **3** generada con IA.", "pasos": ["Imagen 1: el patio del instituto.", "Imagen 2: el patio con filtro.", "Imagen 3: una foto con algo borrado.", "Imagen 4: un paisaje creado con IA.", "Imagen 5: un anuncio con modelo.", "Imagen 6: el logotipo del centro."], "nota": "Proyectar las seis imágenes preparadas en la carpeta del docente. Revelar al final y preguntar qué pista les ayudó."}, {"tipo": "practica", "titulo": "Encuesta inicial", "tiempo": 8, "enunciado": "Responde la encuesta **anónima**: no hay respuestas buenas ni malas, nos sirve para saber de dónde partimos.", "agrupamiento": "Individual"}, {"tipo": "idea", "icono": "🎯", "titulo": "El encargo", "texto": "El centro nos pide el **cartel de un evento** del segundo trimestre.", "puntos": ["Se **imprime** en A3 y se publica en **Instagram**.", "Con imágenes **editadas por ti** y con **licencia**.", "Si usas **IA**, se dice en el cartel.", "Lo **presentas** a la clase en 90 segundos."], "pregunta": "¿Qué evento votamos: Día de Andalucía, Internet Segura, 8M o semana cultural?"}, {"tipo": "practica", "titulo": "Primer experimento: el zoom", "tiempo": 15, "enunciado": "Abre **logo.png** y **logo.svg** de la carpeta compartida en el navegador y amplía los dos al **800 %** (Ctrl + rueda del ratón).", "pasos": ["Anota en el cuaderno qué ves en el PNG.", "Anota qué ves en el SVG.", "Mira cuánto pesa cada archivo (clic derecho → Propiedades).", "Escribe tu hipótesis: ¿por qué pasa?"]}]}, "moodle": []}, {"n": 2, "fase": "Inicio", "titulo": "Píxeles y vectores: cada imagen en su formato", "reto": "Saber qué tipo de imagen y qué formato usar, y calcular si una imagen tiene resolución suficiente para imprimir el cartel.", "actividades": [{"nombre": "¿Qué pasó con el zoom?", "min": 5, "desc": "Puesta en común de las hipótesis de la sesión 1. El docente amplía de nuevo los dos logotipos en el proyector y pregunta quién acertó."}, {"nombre": "Mapa de bits y vectorial", "min": 12, "desc": "Explicación con infografía: el mapa de bits es una cuadrícula de píxeles con un color cada uno (una foto del móvil de 12 megapíxeles tiene unos 4000 × 3000 píxeles); el vectorial guarda puntos, líneas, curvas y rellenos como instrucciones, por eso se amplía sin perder calidad (logotipos, iconos, tipografías). El alumnado completa en el cuaderno una tabla de dos columnas con tres ejemplos de cada tipo."}, {"nombre": "¿Qué formato es mejor?", "min": 10, "desc": "Se presentan JPG (fotos, comprime con pérdida), PNG (transparencia, sin pérdida), WEBP (web), GIF (animaciones sencillas), SVG (vectorial para web) y PDF (para imprimir). Práctica rápida: clasificar ocho situaciones de la diapositiva (foto para Instagram, logotipo con fondo transparente, icono de una web, cartel para la imprenta…)."}, {"nombre": "Pantalla o papel", "min": 15, "desc": "Se explica la resolución: en pantalla importan los píxeles (un post vertical de Instagram mide 1080 × 1350 px) y en papel los puntos por pulgada (300 ppp para imprimir bien). Cálculo guiado: píxeles = cm ÷ 2,54 × 300; un DINA3 (29,7 × 42 cm) necesita unos 3508 × 4961 px. El alumnado comprueba en el cuaderno si una foto de 1200 × 900 px sirve para un DINA3 (no: a 300 ppp solo mide unos 10 × 7,6 cm). Se menciona que la pantalla usa colores RGB y la imprenta CMYK."}, {"nombre": "Quiz de comprobación", "min": 8, "desc": "Tres preguntas proyectadas con corrección inmediata en la web de clase. Quien falla una pregunta la repasa con su pareja con la infografía."}], "criterios": ["DIG.4.2.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Aprender haciendo", "Aprendizaje entre iguales"], "evidencias": ["Tabla de mapa de bits y vectorial en el cuaderno", "Cálculo de resolución para un A3 en el cuaderno"], "recursos": ["Proyector", "Cuaderno", "Calculadora"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Infografía con la cuadrícula de píxeles, fórmula escrita paso a paso con un ejemplo resuelto y calculadora permitida; ampliación: calcular la resolución para un A4 y una lona de 1 metro."}, "ejercicios": ["Completa una tabla con tres ejemplos de imágenes de mapa de bits y tres vectoriales.", "Elige el formato adecuado para ocho situaciones (foto para Instagram, logotipo transparente, cartel para imprimir…).", "Calcula si una foto de 1200 × 900 px tiene resolución suficiente para un cartel A3 a 300 ppp."], "clase": {"pregunta": "¿Por qué el logotipo en SVG no se pixela nunca?", "diapositivas": [{"tipo": "comparar", "titulo": "Dos formas de guardar una imagen", "columnas": [{"titulo": "Mapa de bits", "icono": "🟦", "puntos": ["Cuadrícula de **píxeles**.", "Fotos del móvil, capturas.", "Al ampliar: se **pixela**.", "JPG, PNG, WEBP, GIF."]}, {"titulo": "Vectorial", "icono": "✒️", "puntos": ["Puntos, líneas y **curvas**.", "Logotipos, iconos, letras.", "Al ampliar: **perfecto**.", "SVG, PDF, AI."]}], "pregunta": "¿El emoji de WhatsApp es de mapa de bits o vectorial?"}, {"tipo": "infografia", "titulo": "Lo que ve el ordenador", "svg": "<svg viewBox=\"0 0 640 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"A la izquierda un círculo hecho de cuadraditos de color; a la derecha el mismo círculo como instrucción: centro, radio y color\"><g style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:1\"><rect x=\"60\" y=\"40\" width=\"20\" height=\"20\"/><rect x=\"80\" y=\"40\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"100\" y=\"40\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"120\" y=\"40\" width=\"20\" height=\"20\"/><rect x=\"60\" y=\"60\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"80\" y=\"60\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"100\" y=\"60\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"120\" y=\"60\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"60\" y=\"80\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"80\" y=\"80\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"100\" y=\"80\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"120\" y=\"80\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"60\" y=\"100\" width=\"20\" height=\"20\"/><rect x=\"80\" y=\"100\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"100\" y=\"100\" width=\"20\" height=\"20\" style=\"fill:var(--brand)\"/><rect x=\"120\" y=\"100\" width=\"20\" height=\"20\"/><\/g><text x=\"100\" y=\"160\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 18px system-ui\">Mapa de bits<\/text><text x=\"100\" y=\"185\" text-anchor=\"middle\" style=\"fill:var(--ink);font:15px system-ui\">16 píxeles, cada uno un color<\/text><circle cx=\"470\" cy=\"80\" r=\"42\" style=\"fill:var(--brand);stroke:var(--brand)\"/><text x=\"470\" y=\"160\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 18px system-ui\">Vectorial<\/text><text x=\"470\" y=\"185\" text-anchor=\"middle\" style=\"fill:var(--ink);font:15px system-ui\">«círculo: centro, radio 42, azul»<\/text><text x=\"320\" y=\"85\" text-anchor=\"middle\" style=\"fill:var(--accent);font:700 28px system-ui\">vs<\/text><text x=\"320\" y=\"220\" text-anchor=\"middle\" style=\"fill:var(--ink);font:600 15px system-ui\">El vectorial se vuelve a dibujar a cualquier tamaño<\/text><\/svg>"}, {"tipo": "practica", "titulo": "¿Qué formato es mejor?", "tiempo": 10, "enunciado": "Escribe en el cuaderno el formato que elegirías en cada caso: **JPG, PNG, SVG, GIF o PDF**.", "pasos": ["Una foto del patio para Instagram.", "El logotipo con fondo transparente.", "Un icono para la web del centro.", "Un sticker animado.", "El cartel que va a la imprenta.", "Una captura de pantalla con texto.", "Una foto para enviar por correo sin que pese mucho.", "El dibujo de una flecha que se va a ampliar a 2 metros."], "ayudas": [{"tipo": "pista", "titulo": "Solución para comprobar", "texto": "JPG · PNG · SVG · GIF · PDF · PNG · JPG · SVG"}]}, {"tipo": "ejemplo", "icono": "🖨️", "titulo": "La foto que salió borrosa", "situacion": "Una persona imprime en grande una foto que descargó de WhatsApp y sale **borrosa y pixelada**.", "explicacion": "WhatsApp **reduce** la foto. Para imprimir bien hacen falta unos **300 puntos por pulgada**: muchos más píxeles de los que necesita la pantalla del móvil."}, {"tipo": "practica", "titulo": "Pantalla o papel: haz las cuentas", "tiempo": 15, "enunciado": "Fórmula: **píxeles = cm ÷ 2,54 × 300**. Un A3 mide 29,7 × 42 cm.", "pasos": ["Calcula los píxeles de ancho de un A3 (29,7 ÷ 2,54 × 300).", "Calcula los de alto (42 ÷ 2,54 × 300).", "¿Una foto de 1200 × 900 px sirve para el A3? ¿Cuántos cm mediría a 300 ppp?", "Para Instagram: ¿cuántos píxeles mide un post vertical? (1080 × 1350)."], "ayudas": [{"tipo": "pista", "titulo": "Resultados para comprobar", "texto": "A3 ≈ **3508 × 4961 px**. La foto de 1200 × 900 px mediría unos **10 × 7,6 cm**: no sirve para un A3."}]}, {"tipo": "quiz", "pregunta": "Vas a imprimir el cartel en A3. ¿Qué archivo mandas a la imprenta?", "opciones": ["Un JPG de 1080 × 1350 px", "Un PDF a 300 ppp", "Un GIF animado"], "correcta": 1, "explicacion": "El **PDF a 300 ppp** guarda la calidad para papel. Un JPG de Instagram tiene pocos píxeles para un A3."}]}, "moodle": []}, {"n": 3, "fase": "Desarrollo", "titulo": "Taller de retoque: edición técnica en GIMP", "reto": "Retocar una foto con cinco operaciones básicas y exportarla en el formato y tamaño correctos para Instagram.", "actividades": [{"nombre": "Demostración guiada", "min": 15, "desc": "El docente proyecta GIMP con una foto del edificio del centro (sin personas): Imagen → Escalar imagen; herramienta Recortar con proporción fija 4:5; Colores → Niveles o Brillo y contraste; herramienta Clonar o Saneado para borrar un elemento (una papelera, un cable); capa de texto nueva; Archivo → Exportar como PNG y como JPG con calidad 85. Muestra el panel de capas en cada paso. El alumnado no toca el ordenador: mira y anota los cinco pasos en el cuaderno."}, {"nombre": "Práctica de retoque", "min": 25, "desc": "Cada estudiante elige una de las cinco fotos de dominio público o del propio centro de la carpeta compartida (sin personas) y aplica los cinco pasos: recortar a 4:5, escalar a 1080 × 1350 px, corregir niveles o brillo y contraste, borrar un elemento que sobre y añadir una capa de texto con el nombre del evento. Exporta en PNG y en JPG y compara su peso. Si GIMP da problemas, puede usar Photopea en el navegador o Canva (Editar foto) con los mismos pasos."}, {"nombre": "Entrega de la Tarea 5.1", "min": 10, "desc": "El alumnado sube a la Tarea 5.1 la imagen en PNG y una captura de pantalla de GIMP con el panel de capas visible, y escribe en el texto en línea cuánto pesa el PNG y cuánto el JPG. El docente comprueba en directo la lista de verificación."}], "criterios": ["DIG.4.2.3"], "saberes": ["DIG.4.B.2"], "metodologia": ["Aprender haciendo", "Aprendizaje entre iguales"], "evidencias": ["Imagen retocada en PNG de 1080 × 1350 px", "Captura con el panel de capas", "Comparación de peso PNG y JPG"], "recursos": ["GIMP o Photopea", "Carpeta de fotos libres", "Proyector"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Pasos numerados con capturas en la diapositiva, pareja de apoyo, posibilidad de usar Canva o Photopea en lugar de GIMP y ampliación con máscaras de capa o eliminación de fondo."}, "ejercicios": ["Recorta una foto a proporción 4:5 y escálala a 1080 × 1350 px.", "Corrige los niveles o el brillo y contraste y borra un elemento que sobre.", "Añade una capa de texto, exporta en PNG y en JPG y compara el peso de los dos archivos."], "clase": {"pregunta": "¿Qué cambia en una foto antes de que llegue a tu feed?", "diapositivas": [{"tipo": "ejemplo", "icono": "📸", "titulo": "La foto de perfil perfecta", "situacion": "Antes de subir una foto, la **recortas**, le subes el **brillo** y quizá borras algo del fondo.", "explicacion": "Eso es **edición técnica**: recortar, escalar, corregir color, retocar y exportar. Hoy lo haces en un programa profesional y gratuito: **GIMP**."}, {"tipo": "pasos", "titulo": "Los cinco pasos del retoque", "progresivo": true, "pasos": ["**Recortar** con proporción fija 4:5 (herramienta Recortar).", "**Escalar** a 1080 × 1350 px (Imagen → Escalar imagen).", "**Corregir** color: Colores → Niveles o Brillo y contraste.", "**Borrar** lo que sobra con Clonar o Saneado.", "**Texto** en capa nueva y Archivo → **Exportar como** PNG y JPG."], "nota": "Hacer la demostración completa con la foto del edificio. Insistir en mirar el panel de capas en cada paso."}, {"tipo": "idea", "icono": "🗂️", "titulo": "Las capas", "texto": "Una imagen editada es como **hojas transparentes** apiladas.", "puntos": ["La foto va **abajo**.", "El texto va en **otra capa** encima.", "Puedes mover o borrar una capa **sin estropear** las demás.", "El archivo .xcf de GIMP **guarda las capas**; PNG y JPG las juntan."]}, {"tipo": "practica", "titulo": "Tu retoque", "tiempo": 25, "enunciado": "Elige una foto de la carpeta compartida y aplica los **cinco pasos**. Exporta en **PNG** y en **JPG** (calidad 85).", "pasos": ["Recorta a 4:5.", "Escala a 1080 × 1350 px.", "Corrige niveles o brillo y contraste.", "Borra un elemento que sobre.", "Añade el nombre del evento en una capa de texto.", "Exporta en PNG y en JPG y mira cuánto pesa cada uno."], "agrupamiento": "Individual con pareja de apoyo", "material": ["GIMP, Photopea o Canva", "Carpeta de fotos libres"], "ayudas": [{"tipo": "pista", "titulo": "Si te atascas", "texto": "¿No ves el panel de capas? Ventanas → Diálogos empotrables → **Capas** (Ctrl + L)."}]}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 10, "entrega": "Tarea 5.1 · Retoque técnico en GIMP", "enunciado": "Sube la imagen en **PNG** y una **captura** de GIMP con el panel de capas. En el texto escribe el **peso** del PNG y del JPG.", "pasos": ["Captura: tecla Impr Pant o Recortes de Windows.", "Peso: clic derecho → Propiedades."]}]}, "moodle": [{"recurso": "Tarea", "nombre": "5.1 · Retoque técnico en GIMP", "uso": "Verificar que cada estudiante domina la edición técnica básica que necesitará en el cartel (recorte, escala, color, retoque, capas y exportación).", "correccion": "apto", "criterio": "DIG.4.2.3", "cotejo": ["Se entrega la imagen en PNG de 1080 × 1350 px (proporción 4:5)", "Se nota la corrección de color y se ha borrado un elemento de la foto original", "La captura muestra el panel de capas con al menos una capa de texto", "En el texto en línea se indica el peso del PNG y del JPG", "La foto de partida es una de la carpeta compartida (libre o del centro)"], "config": ["Tipo de entrega: archivos (.png, .jpg) y texto en línea", "Calificación: escala Apto / No apto", "Fecha de entrega: final de la sesión; fecha límite: 3 días"], "calificable": true, "codigo": "5.1"}]}, {"n": 4, "fase": "Desarrollo", "titulo": "¿Puedo usar esta imagen? Licencias y derecho a la propia imagen", "reto": "Encontrar imágenes que se puedan usar legalmente en el cartel y citarlas bien.", "actividades": [{"nombre": "Caso de partida", "min": 8, "desc": "El docente plantea dos casos: una cuenta escolar que pone en su cartel una foto sacada de Google Imágenes y recibe una reclamación del fotógrafo, y una cuenta de TikTok que sube la foto de un compañero sin su permiso. Pregunta: «¿Qué han hecho mal en cada caso?». Lluvia de ideas en la pizarra."}, {"nombre": "Licencias y derecho de imagen", "min": 12, "desc": "Explicación breve: todos los derechos reservados (por defecto, aunque no ponga nada), licencias Creative Commons (BY, SA, NC, ND), dominio público (CC0) y derecho a la propia imagen (no se publican personas reconocibles sin permiso; con menores, el de sus familias). Cómo se cita: Título, Autor/a, Fuente y Licencia (regla TAFL), con un ejemplo proyectado."}, {"nombre": "Búsqueda para mi cartel", "min": 20, "desc": "Cada estudiante busca en Openverse (filtro «Uso comercial permitido» y «Modificar o adaptar») y en Wikimedia Commons al menos tres recursos para su cartel (una foto, una ilustración o icono y, si puede, un SVG), los descarga en la carpeta de su Drive y apunta sus créditos en la Parte 1 de la plantilla A2, que entregará en la Tarea 5.3."}, {"nombre": "¿Se puede o no se puede?", "min": 10, "desc": "Quiz en la web de clase con casos rápidos: usar una imagen CC BY-NC en el cartel del centro, modificar una imagen CC BY-ND, usar la foto de un famoso, publicar una foto de clase con caras. Se corrige y se comenta cada caso."}], "criterios": ["DIG.4.4.1"], "saberes": ["DIG.4.D.1"], "metodologia": ["Pensamiento crítico", "Aprender haciendo"], "evidencias": ["Parte 1 de la plantilla A2 con tres créditos completos", "Respuestas al quiz de licencias"], "recursos": ["Openverse", "Wikimedia Commons", "Plantilla A2"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Tarjeta visual con los iconos de las licencias Creative Commons, ejemplo de cita resuelto en la plantilla y búsqueda guiada con capturas de los filtros de Openverse."}, "ejercicios": ["Explica qué han hecho mal en los dos casos de partida.", "Busca tres imágenes con licencia libre para tu cartel y anota título, autor/a, fuente y licencia.", "Decide si se pueden usar cuatro imágenes según su licencia y justifica tu respuesta."], "clase": {"pregunta": "Si una imagen está en Google, ¿es gratis?", "diapositivas": [{"tipo": "ejemplo", "icono": "⚖️", "titulo": "La foto sacada de Google", "situacion": "Una cuenta escolar pone en su cartel una foto preciosa sacada de **Google Imágenes**. A la semana, el fotógrafo **reclama**.", "explicacion": "Que una imagen esté en internet **no la hace libre**: por defecto tiene **todos los derechos reservados**. Hay que buscar imágenes con licencia que permita usarlas."}, {"tipo": "infografia", "titulo": "Licencias Creative Commons", "elementos": [{"icono": "👤", "titulo": "BY", "texto": "Cita a la persona autora (siempre)."}, {"icono": "🔁", "titulo": "SA", "texto": "Si la cambias, compártela con la misma licencia."}, {"icono": "💶", "titulo": "NC", "texto": "Sin uso comercial."}, {"icono": "🚫", "titulo": "ND", "texto": "No se puede modificar."}, {"icono": "🌍", "titulo": "CC0", "texto": "Dominio público: úsala como quieras."}]}, {"tipo": "idea", "icono": "🤳", "titulo": "Tu cara es tuya", "puntos": ["No se publica a nadie **reconocible** sin su **permiso**.", "Con **menores**, el permiso es de su familia.", "En nuestro cartel: **sin caras** del alumnado.", "Cita así: **T**ítulo, **A**utor/a, **F**uente, **L**icencia."]}, {"tipo": "practica", "titulo": "Búsqueda para mi cartel", "tiempo": 20, "enunciado": "Busca **tres recursos** para tu cartel en Openverse o Wikimedia Commons y apunta sus créditos en la **Parte 1 de la plantilla A2**.", "pasos": ["Openverse: activa «Uso comercial permitido» y «Modificar o adaptar».", "Una foto, una ilustración o icono y, si puedes, un SVG.", "Descárgalos en tu carpeta de Drive.", "Copia título, autor/a, enlace y licencia en la A2."], "material": ["Plantilla A2"], "enlace": "https://docs.google.com/document/d/1RhRiezW3NsDQ3MEZaUzgnYXfQfrzTm4z9w73EjeomCI/copy"}, {"tipo": "quiz", "pregunta": "Una imagen tiene licencia CC BY-ND. ¿Puedo recortarla y ponerle texto encima?", "opciones": ["Sí, si cito a la persona autora", "No, ND no permite modificarla", "Sí, porque es para el instituto"], "correcta": 1, "explicacion": "**ND** significa «sin obras derivadas»: se puede usar tal cual, citando, pero **no modificar**."}, {"tipo": "quiz", "pregunta": "¿Puedo poner en el cartel una foto de la clase en la que se ven las caras?", "opciones": ["Sí, si es para el instituto", "Solo con el permiso de cada persona y de sus familias", "Sí, si la foto la he hecho yo"], "correcta": 1, "explicacion": "Es el **derecho a la propia imagen**. Por eso en este cartel **no usamos caras** del alumnado."}]}, "moodle": []}, {"n": 5, "fase": "Desarrollo", "titulo": "¿Cómo «dibuja» una IA? Funcionamiento, sesgos y transparencia", "reto": "Entender cómo genera imágenes una IA y comprobar con un experimento qué sesgos reproduce.", "actividades": [{"nombre": "Gancho: «una persona que programa»", "min": 7, "desc": "El docente pregunta: «Si le pido a una IA una persona que programa, ¿cómo será?». El alumnado lo apunta. Después proyecta cuatro resultados generados con ese mismo texto y se compara con lo que esperaban."}, {"nombre": "¿Cómo funciona una IA de imágenes?", "min": 13, "desc": "Explicación con un flujo sencillo: la IA se entrena con millones de imágenes de internet con su descripción; aprende patrones (no guarda las fotos); para crear, parte de ruido y lo va «limpiando» paso a paso guiada por el texto que escribimos (el prompt). Consecuencias: repite lo que más ha visto (sesgos), muchos artistas no dieron permiso para que se usaran sus obras, y quien mira una imagen tiene derecho a saber si es real (transparencia algorítmica). Vídeo corto opcional elegido por el docente."}, {"nombre": "Experimento de sesgos", "min": 20, "desc": "Por parejas, con Canva para Educación (Magic Media) si el centro lo tiene activado para el alumnado, o con el banco de imágenes que el docente ha generado antes y proyecta: se piden cinco imágenes con textos neutros («una persona que dirige una empresa», «una persona que cuida a un bebé», «una persona que juega al fútbol profesional», «una familia andaluza», «una persona que limpia una oficina»). Cada estudiante registra en la Parte 1 de la plantilla A1 quién aparece (género, edad, color de piel, ropa, lugar) y qué se repite."}, {"nombre": "Puesta en común", "min": 10, "desc": "¿De dónde sale el sesgo? (de los datos con los que aprendió). ¿Cómo evitarlo en mi cartel? (describir con detalle la diversidad en el prompt, revisar los resultados y descartar los estereotipos). Cada estudiante escribe en la A1 un prompt mejorado."}], "criterios": ["DIG.4.4.3"], "saberes": ["DIG.4.D.5"], "metodologia": ["Pensamiento crítico", "Aprendizaje entre iguales"], "evidencias": ["Parte 1 de la plantilla A1 (experimento de sesgos)", "Prompt mejorado en la plantilla A1"], "recursos": ["Canva para Educación", "Banco de imágenes del docente", "Plantilla A1"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Experimento visual con resultados que el alumnado conoce de sus redes, tabla con columnas ya rotuladas para registrar, y posibilidad de responder con palabras clave; ampliación: comparar dos herramientas de IA distintas con el mismo prompt."}, "ejercicios": ["Predice cómo será la imagen de «una persona que programa» y compárala con la que genera la IA.", "Registra en una tabla quién aparece en cinco imágenes generadas con textos neutros y qué se repite.", "Reescribe un prompt para evitar el sesgo que has encontrado."], "clase": {"pregunta": "Si le pides a una IA «una persona que programa», ¿quién aparece?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎨", "titulo": "La IA que «dibuja»", "situacion": "Escribes «gato astronauta en Sevilla» y en segundos tienes una imagen que **nunca ha existido**.", "explicacion": "La IA no busca una foto: ha **aprendido patrones** de millones de imágenes y fabrica una nueva. Por eso también **repite lo que más ha visto**."}, {"tipo": "flujo", "titulo": "Cómo genera una imagen", "nodos": [{"texto": "Aprende de millones de imágenes con texto", "tipo": "inicio"}, {"texto": "Escribes el prompt", "tipo": "proceso"}, {"texto": "Empieza con ruido (puntos al azar)", "tipo": "proceso"}, {"texto": "Lo «limpia» paso a paso hacia lo que pides", "tipo": "proceso"}, {"texto": "Imagen nueva", "tipo": "fin"}], "pregunta": "Si en sus datos casi todas las fotos de directivos son de hombres, ¿qué dibujará?"}, {"tipo": "video", "titulo": "Cómo funciona una IA de imágenes", "busqueda": "cómo funciona inteligencia artificial generar imágenes difusión explicado", "texto": "Vídeo corto (2-4 minutos) que elige el docente.", "preguntas": ["¿De dónde saca la IA lo que sabe?", "¿Por qué puede tener sesgos?"]}, {"tipo": "practica", "titulo": "Experimento de sesgos", "tiempo": 20, "enunciado": "Pide a la IA (o mira el banco del docente) estas **cinco imágenes** y apunta en la **Parte 1 de la A1** quién aparece.", "pasos": ["«Una persona que dirige una empresa».", "«Una persona que cuida a un bebé».", "«Una persona que juega al fútbol profesional».", "«Una familia andaluza».", "«Una persona que limpia una oficina».", "Para cada una: género, edad, piel, ropa y lugar. ¿Qué se repite?"], "agrupamiento": "Parejas (registro individual)", "material": ["Canva (Magic Media) o banco del docente", "Plantilla A1"], "nota": "Generar el banco de imágenes con antelación por si Magic Media no está activado para el alumnado.", "enlace": "https://docs.google.com/document/d/1pwCgB8iYr5juMzYhgpj_abm_0S3fPHy6lR9qF-NmbOI/copy"}, {"tipo": "comparar", "titulo": "Prompt con sesgo o sin sesgo", "columnas": [{"titulo": "Prompt vago", "icono": "⚠️", "puntos": ["«Una persona que dirige una empresa»", "La IA elige por ti… y **repite estereotipos**."]}, {"titulo": "Prompt cuidado", "icono": "✅", "puntos": ["«Una mujer de unos 50 años, con hiyab, dirige una reunión»", "**Tú decides** a quién representas."]}], "texto": "Y siempre: **revisar** el resultado y **etiquetar** que es IA.", "pregunta": "Escribe en la A1 tu prompt mejorado."}]}, "moodle": []}, {"n": 6, "fase": "Desarrollo", "titulo": "Detective de imágenes: ¿real, retocada o generada?", "reto": "Analizar imágenes que circulan por redes, comprobar si son reales, retocadas o generadas y reflexionar sobre cómo usar la IA de forma ética.", "actividades": [{"nombre": "Las pistas del detective", "min": 12, "desc": "El docente muestra pistas visuales (manos y dedos raros, texto deformado, sombras y reflejos que no cuadran, piel demasiado perfecta, fondos repetidos) y herramientas: búsqueda inversa con Google Lens, verificación de credenciales de contenido (Content Credentials) y las etiquetas de «Creado con IA» de Instagram y TikTok. Se advierte de que los detectores automáticos se equivocan y de que hay que combinar pistas."}, {"nombre": "Investigación", "min": 20, "desc": "Cada estudiante elige tres de las seis imágenes del dossier del docente (una imagen viral generada con IA, un anuncio retocado, una foto real sorprendente, un montaje de una noticia falsa, una foto con filtro de belleza y una ilustración etiquetada como IA) y completa la Parte 2 de la plantilla A1: pistas que ve, cómo lo ha comprobado, su veredicto y quién la difunde y para qué."}, {"nombre": "Uso ético de la IA", "min": 10, "desc": "Debate breve guiado: ¿cuándo es aceptable usar IA en un cartel? Se acuerdan normas (etiquetar, no imitar a personas reales, no usar fotos del alumnado, no copiar el estilo de un artista concreto, revisar los sesgos). Cada estudiante escribe sus tres normas en la Parte 3 de la A1."}, {"nombre": "Entrega de la Tarea 5.2", "min": 8, "desc": "El alumnado revisa la lista «Antes de entregar» de la plantilla, descarga la A1 en PDF y la sube a la Tarea 5.2."}], "criterios": ["DIG.4.4.3", "DIG.4.4.1"], "saberes": ["DIG.4.D.5", "DIG.4.D.1"], "metodologia": ["Pensamiento crítico", "Aprender haciendo"], "evidencias": ["Plantilla A1 completa (Tarea 5.2)"], "recursos": ["Dossier de seis imágenes", "Google Lens", "Plantilla A1"], "dua": {"principios": ["Representación", "Acción y Expresión", "Andamiaje"], "medidas": "Lista de pistas proyectada durante toda la práctica, posibilidad de analizar dos imágenes en lugar de tres con ayuda del docente y de responder con frases cortas; ampliación: analizar una imagen de una noticia actual que elija el alumno o alumna."}, "ejercicios": ["Analiza tres imágenes del dossier: pistas, comprobación, veredicto e intención de quien las difunde.", "Escribe tres normas para usar la IA de forma ética en un cartel."], "clase": {"pregunta": "¿Cómo sabes si una imagen viral es real?", "diapositivas": [{"tipo": "ejemplo", "icono": "🕵️", "titulo": "La foto viral del famoso", "situacion": "Te llega por WhatsApp una foto de un famoso en una situación **increíble**. Tiene miles de «me gusta».", "explicacion": "Antes de compartir: **mira las pistas**, **búscala** con Google Lens y piensa **quién la difunde y para qué** (risas, votos, clics, dinero)."}, {"tipo": "infografia", "titulo": "Pistas para detectar IA o retoque", "elementos": [{"icono": "✋", "titulo": "Manos", "texto": "Dedos de más, de menos o fundidos."}, {"icono": "🔤", "titulo": "Textos", "texto": "Letreros con letras deformadas."}, {"icono": "🌗", "titulo": "Luz y sombras", "texto": "Sombras o reflejos que no cuadran."}, {"icono": "✨", "titulo": "Piel de plástico", "texto": "Demasiado perfecta, sin poros."}, {"icono": "🔍", "titulo": "Comprueba", "texto": "Google Lens, Content Credentials y la etiqueta «Creado con IA»."}]}, {"tipo": "practica", "titulo": "Investigación", "tiempo": 20, "enunciado": "Elige **tres imágenes** del dossier y completa la **Parte 2 de la A1**.", "pasos": ["¿Qué pistas ves?", "¿Cómo lo has comprobado? (Lens, etiqueta, credenciales…)", "Tu veredicto: real, retocada o IA.", "¿Quién la difunde y para qué?"], "material": ["Dossier de imágenes", "Plantilla A1"], "nota": "Los detectores automáticos fallan: valorar el razonamiento y las pistas, no solo que acierten.", "enlace": "https://docs.google.com/document/d/1pwCgB8iYr5juMzYhgpj_abm_0S3fPHy6lR9qF-NmbOI/copy"}, {"tipo": "quiz", "pregunta": "Una web dice que una imagen es «98 % IA». ¿Qué haces?", "opciones": ["Me lo creo: lo dice una máquina", "Lo combino con otras pistas y comprobaciones", "La comparto para avisar a todo el mundo"], "correcta": 1, "explicacion": "Los **detectores se equivocan**. Hay que **combinar pistas** y buscar el origen antes de decidir o compartir."}, {"tipo": "practica", "titulo": "Normas para usar la IA y entrega", "tiempo": 18, "entrega": "Tarea 5.2 · Detective de imágenes e IA", "enunciado": "Escribe tus **tres normas** para usar la IA en un cartel (Parte 3 de la A1), revisa «Antes de entregar» y sube la A1 en **PDF**.", "pasos": ["Ideas: etiquetar, no imitar a personas reales, no usar fotos del alumnado, no copiar el estilo de un artista, revisar sesgos.", "Archivo → Descargar → PDF.", "Súbelo a la Tarea 5.2."]}]}, "moodle": [{"recurso": "Tarea", "nombre": "5.2 · Detective de imágenes e IA", "uso": "Evaluar con rúbrica el análisis crítico de imágenes generadas o manipuladas, los sesgos de la IA y el uso ético de las imágenes y de la IA, con la plantilla A1 completada en las sesiones 5 y 6.", "correccion": "rubrica", "criterio": "DIG.4.4.3", "rubrica": [{"linea": "Experimento de sesgos", "criterio": "DIG.4.4.3", "niveles": ["1 pto: La tabla está vacía o solo tiene una imagen registrada.", "3 ptos: Registra algunas imágenes, pero no indica qué se repite ni nombra ningún sesgo.", "5 ptos: Registra las cinco imágenes y nombra un sesgo de forma general («salen siempre hombres»).", "7 ptos: Registra las cinco imágenes con varios rasgos y explica un sesgo relacionándolo con los datos con los que aprende la IA.", "10 ptos: Registra las cinco imágenes con todos los rasgos, explica al menos dos sesgos y su origen en los datos y escribe un prompt mejorado que los corrige."]}, {"linea": "Análisis de las imágenes del dossier", "criterio": "DIG.4.4.3", "niveles": ["1 pto: No analiza ninguna imagen o solo da un veredicto sin pistas.", "3 ptos: Analiza una o dos imágenes con alguna pista, sin comprobarlas con ninguna herramienta.", "5 ptos: Analiza tres imágenes con pistas visuales y usa una herramienta de comprobación en al menos una.", "7 ptos: Analiza tres imágenes combinando pistas y herramientas (Lens, etiquetas, credenciales) y su veredicto es coherente con lo que encuentra.", "10 ptos: Analiza tres imágenes combinando varias pistas y herramientas, justifica cada veredicto y reconoce cuándo no se puede asegurar."]}, {"linea": "Intención de quien difunde la imagen", "criterio": "DIG.4.4.3", "niveles": ["1 pto: No indica quién difunde las imágenes ni para qué.", "3 ptos: Indica la intención en una imagen con una idea muy general («para engañar»).", "5 ptos: Indica en las tres imágenes quién podría difundirlas y con qué intención.", "7 ptos: Explica la intención y el efecto que puede tener cada imagen en quien la ve (creerse algo falso, compararse, comprar).", "10 ptos: Explica intención, efecto y a quién beneficia o perjudica cada imagen, y propone cómo actuar antes de compartirla."]}, {"linea": "Normas para un uso ético de la IA y de las imágenes", "criterio": "DIG.4.4.1", "niveles": ["1 pto: No escribe normas o no tienen relación con el uso ético de las imágenes.", "3 ptos: Escribe una o dos normas copiadas de la lista sin explicarlas.", "5 ptos: Escribe tres normas correctas (etiquetado, derecho de imagen o autoría) con una explicación breve de alguna.", "7 ptos: Escribe tres normas que tocan etiquetado, derecho a la propia imagen y autoría, y explica por qué cada una es necesaria.", "10 ptos: Escribe tres normas propias bien explicadas y las aplica a cómo usará la IA y las imágenes en su propio cartel."]}], "config": ["Tipo de entrega: archivo (.pdf)", "Método de calificación: Rúbrica (1-3-5-7-10 por línea)", "Calificación máxima: 10"], "criterios_rubrica": ["DIG.4.4.3", "DIG.4.4.1"], "calificable": true, "codigo": "5.2"}]}, {"n": 7, "fase": "Desarrollo", "titulo": "Diseñamos el cartel: composición y módulo con IA", "reto": "Montar en Canva el cartel del evento con las imágenes retocadas, los recursos con licencia y un módulo de IA etiquetado.", "actividades": [{"nombre": "Claves de un buen cartel", "min": 10, "desc": "El docente compara dos carteles de un mismo evento (uno saturado y uno claro) y extrae las claves: jerarquía (título grande, fecha y lugar, imagen, detalles), regla de los tercios, contraste y legibilidad (máximo dos tipografías y tres colores, letra grande), márgenes y aire. Prueba de los 3 segundos: ¿qué se lee de un vistazo?"}, {"nombre": "Boceto rápido", "min": 8, "desc": "Cada estudiante dibuja en el cuaderno un boceto con tres zonas: título, imagen principal y datos (fecha, hora, lugar, créditos y etiqueta de IA). La pareja de apoyo le hace la prueba de los 3 segundos."}, {"nombre": "Montaje en Canva", "min": 27, "desc": "En Canva para Educación, diseño personalizado de 297 × 420 mm. Coloca la imagen retocada en GIMP (la de la Tarea 5.1 u otra editada igual), los recursos con licencia de la sesión 4 y un módulo generado o retocado con IA (una ilustración de fondo, ampliar el fondo de una foto o quitar un fondo), con la etiqueta visible «Imagen generada con IA (herramienta)» y los créditos al pie en letra pequeña. Apunta en la Parte 2 y 3 de la plantilla A2 qué ha editado, qué herramienta de IA ha usado, el prompt y cómo ha evitado los sesgos."}, {"nombre": "Guardar el avance", "min": 5, "desc": "Cada estudiante comparte el enlace de su diseño de Canva con el docente (solo ver) y anota en el cuaderno qué le falta para la próxima sesión."}], "criterios": ["DIG.4.2.3", "DIG.4.4.1"], "saberes": ["DIG.4.B.2", "DIG.4.D.5"], "metodologia": ["Aprendizaje basado en proyectos", "Aprender haciendo"], "evidencias": ["Boceto del cartel", "Diseño del cartel en Canva (borrador)", "Partes 2 y 3 de la plantilla A2"], "recursos": ["Canva para Educación", "Imágenes retocadas y con licencia", "Plantilla A2"], "dua": {"principios": ["Acción y Expresión", "Andamiaje", "Compromiso"], "medidas": "Elección libre del estilo del cartel, plantilla de cuadrícula en tercios para quien la necesite, lista de claves proyectada y ampliación: diseñar también una historia de Instagram (1080 × 1920 px)."}, "ejercicios": ["Dibuja el boceto del cartel con tres zonas y comprueba con tu pareja qué se lee en tres segundos.", "Monta el cartel en Canva con tus imágenes editadas, recursos con licencia y un módulo de IA etiquetado.", "Completa en la ficha A2 qué has editado, , qué has editado y cómo, qué ha hecho la IA y cómo lo has indicado."}], "criterios": ["DIG.4.2.3", "DIG.4.4.1"], "saberes": ["DIG.4.B.2", "DIG.4.D.1"], "metodologia": ["Aprendizaje entre iguales", "Aprendizaje basado en proyectos"], "evidencias": ["Cartel en PDF de impresión y en PNG de 1080 × 1350 px", "Plantilla A2 completa", "Guion de la presentación"], "recursos": ["Canva para Educación", "Móvil o tableta para comprobar", "Plantilla A2"], "dua": {"principios": ["Andamiaje", "Acción y Expresión"], "medidas": "Indicación individual del docente con la rúbrica, lista de revisión proyectada, guion de la presentación con tres preguntas fijas y prórroga en la Tarea 5.3 para quien lo necesite."}, "ejercicios": ["Exporta el cartel en PDF para imprimir y en PNG de 1080 × 1350 px y anota formato, tamaño y peso.", "Revisa el cartel de tu pareja con la lista «Antes de entregar» y anota dos aciertos y una mejora.", "Prepara el guion de tu presentación de 90 segundos."], "clase": {"pregunta": "¿El mismo archivo sirve para la imprenta y para Instagram?", "diapositivas": [{"tipo": "ejemplo", "icono": "🖼️", "titulo": "El cartel del concierto", "situacion": "El cartel de un concierto aparece **pegado en la calle** y también como **post de Instagram**.", "explicacion": "Son **dos archivos**: un PDF de alta calidad para la imprenta y un PNG con el tamaño justo para el móvil, a veces con los elementos **recolocados**."}, {"tipo": "practica", "titulo": "Últimos retoques", "tiempo": 15, "enunciado": "Termina tu cartel repasando las **claves**: jerarquía, contraste, pocas cosas, créditos y etiqueta de IA."}, {"tipo": "pasos", "titulo": "Exporta las dos versiones", "pasos": ["**Imprimir**: Compartir → Descargar → **PDF para imprimir** (marcas de corte si aparece).", "**Instagram**: duplica el diseño → Cambiar tamaño → **1080 × 1350 px** → recoloca → Descargar **PNG**.", "Apunta en la **Parte 4 de la A2** formato, tamaño y peso.", "Ábrelo en el **móvil**: ¿se lee el texto?"]}, {"tipo": " ocada para que se lea bien en el móvil."]}, {"linea": "Diseño y comunicación visual del cartel", "criterio": "DIG.4.2.3", "peso": 22.2, "niveles": ["1 pto: No se entiende qué evento anuncia ni cuándo es.", "3 ptos: Se entiende el evento, pero falta la fecha o el lugar o el texto no se lee por falta de contraste.", "5 ptos: Están todos los datos y se leen, pero hay demasiados elementos, tipografías o colores.", "7 ptos: Jerarquía clara (título, fecha y lugar), buen contraste y como máximo dos tipografías y tres colores.", "10 ptos: Supera la prueba de los 3 segundos, usa la composición (tercios, márgenes, aire) con intención y la imagen refuerza el mensaje del evento."]}, {"linea": "Créditos, licencias y etiqueta de la IA", "criterio": "DIG.4.4.1", "peso": 22.2, "niveles": ["1 pto: Usa imágenes sin licencia o con caras del alumnado y no hay créditos.", "3 ptos: Usa imágenes con licencia, pero los créditos están incompletos y la IA no está etiquetada.", "5 ptos: Créditos de casi todos los recursos y la IA está etiquetada, aunque falta indicar la herramienta o el prompt en la A2.", "7 ptos: Todos los recursos tienen licencia que permite su uso y créditos completos (TAFL), y la etiqueta de IA es visible en el cartel.", "10 ptos: Créditos completos y bien situados, etiqueta de IA visible con la herramienta, y la A2 recoge prompt, sesgos revisados y licencias respetadas (por ejemplo, sin modificar imágenes ND)."]}, {"linea": "Presentación: análisis crítico del uso de la IA", "criterio": "DIG.4.4.3", "peso": 16.7, "niveles": ["1 pto: No menciona la IA en la presentación.", "3 ptos: Dice que ha usado IA, pero no explica para qué ni cómo lo ha indicado.", "5 ptos: Explica qué parte es de IA y cómo la ha etiquetado.", "7 ptos: Explica qué parte es de IA, por qué la ha usado y qué sesgo o problema ha revisado.", "10 ptos: Valora con argumentos qué aporta y qué riesgos tiene la IA en su cartel y responde con criterio a una pregunta del público."]}, {"linea": "Presentación: comu tiempo": 7, "enunciado": "Completa el formulario de **autoevaluación** con tu correo del centro. Sé sincero o sincera: sirve para mejorar.", "agrupamiento": "Individual"}, {"tipo": "cierre", "puntos": ["Mapa de bits o vectorial: **cada imagen en su formato**.", "Editar con **capas** y exportar para **papel** y **pantalla**.", "Solo imágenes **con licencia** y **sin caras** sin permiso.", "La IA repite lo que ha visto: **revisa sesgos** y **etiqueta**."], "pregunta": "¿Qué harás distinto la próxima vez que veas una imagen viral?"}]}, "moodle": []}], "dua": {"Compromiso": ["Encargo real del centro con un cartel que se imprime y se publica en el Instagram del centro.", "Ejemplos sacados de TikTok e Instagram y elección libre del evento y del estilo del cartel.", "Votación del cartel ganador y presentación breve de 90 segundos."], "Representación": ["Web de clase con infografías, ejemplos cotidianos y pasos numerados en cada práctica.", "Demostración en directo antes de cada práctica en GIMP y Canva.", "Vocabulario clave (píxel, vectorial, licencia, prompt, sesgo) siempre en negrita y con ejemplo."], "Acción y Expresión": ["GIMP, Photopea o Canva para la misma práctica de retoque.", "Respuestas con frases cortas o palabras clave en las plantillas.", "Presentación en pareja, desde el sitio o con un audio grabado si hace falta."], "Andamiaje": ["Plantillas con tablas ya rotuladas y un ejemplo resuelto.", "Soluciones plegables para comprobar en la web de clase.", "Lista «Antes de entregar» en cada plantilla y rúbricas publicadas desde la sesión 1.", "Pareja de apoyo en todas las prácticas y prórroga en las Tareas para quien la necesite."]}, "diversidad": [{"perfil": "Alumnado repetidor con desmotivación", "medidas": "Tareas cortas con tiempo visible, entregas pequeñas cada pocas sesiones (5.1, 5.2, 5.3), producto real con impacto en el centro y refuerzo positivo de cada entrega."}, {"perfil": "Alumnado con dificultades de lectura y escritura", "medidas": "Enunciados breves
