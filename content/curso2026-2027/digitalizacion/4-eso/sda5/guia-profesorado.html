n la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).", "hijos": [], "criterios": []}, "DIG.4.D": {"tipo": "sb", "texto": "Ciudadanía digital crítica.", "hijos": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.3", "DIG.4.D.4", "DIG.4.D.5", "DIG.4.D.6"], "criterios": []}, "DIG.4.D.1": {"tipo": "sb", "texto": "Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.", "hijos": [], "criterios": ["DIG.4.2.3", "DIG.4.4.3"]}, "DIG.4.D.2": {"tipo": "sb", "texto": "Educación mediática: periodismo digital, blogosfera, estrategias comunicativas y uso crítico de la red. Herramientas para detectar noticias falsas y fraudes.", "hijos": [], "criterios": ["DIG.4.4.3"]}, "DIG.4.D.3": {"tipo": "sb", "texto": "Gestiones administrativas: servicios públicos en línea, registros digitales y certificados oficiales.", "hijos": [], "criterios": ["DIG.4.4.1"]}, "DIG.4.D.4": {"tipo": "sb", "texto": "Comercio electrónico: facturas digitales, formas de pago y criptomonedas.", "hijos": [], "criterios": []}, "DIG.4.D.5": {"tipo": "sb", "texto": "Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.", "hijos": [], "criterios": ["DIG.4.4.1"]}, "DIG.4.D.6": {"tipo": "sb", "texto": "Activismo en línea: plataformas de iniciativa ciudadana y cibervoluntariado y comunidades de hardware y software libres.", "hijos": [], "criterios": ["DIG.4.4.3"]}, "CCL1": {"tipo": "de", "texto": "Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.", "competencias": []}, "CCL2": {"tipo": "de", "texto": "Comprende, interpreta y valora con actitud crítica textos orales, escritos, signados o multimodales de los ámbitos personal, social, educativo y profesional para participar en diferentes contextos de manera activa e informada y para construir conocimiento.", "competencias": []}, "CCL3": {"tipo": "de", "texto": "Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": []}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": []}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": []}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": []}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": []}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["DIG.4.2"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": ["DIG.4.2"]}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["DIG.4.2", "DIG.4.4"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["DIG.4.4"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": []}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": ["DIG.4.2", "DIG.4.4"]}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": []}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": []}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": ["DIG.4.2"]}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["DIG.4.2"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": ["DIG.4.4"]}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": ["DIG.4.4"]}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": ["DIG.4.4"]}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": ["DIG.4.4"]}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": ["DIG.4.4"]}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["DIG.4.2"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": []}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": []}}, "idx": {"criterios": ["DIG.4.2.3", "DIG.4.4.1", "DIG.4.4.3"], "competencias": ["DIG.4.2", "DIG.4.4"], "saberes": ["DIG.4.B.2", "DIG.4.D.1", "DIG.4.D.5"], "descriptores": ["CC1", "CC2", "CC3", "CC4", "CD1", "CD2", "CD3", "CD4", "CE1", "CE3", "CPSAA1", "CPSAA4", "CPSAA5"], "sesionesPorCriterio": {"DIG.4.2.3": [2, 3, 4, 8, 9], "DIG.4.4.1": [2, 5, 7, 8], "DIG.4.4.3": [6, 7, 9]}, "porMateria": [{"codigo": "DIG", "criterios": ["DIG.4.2.3", "DIG.4.4.1", "DIG.4.4.3"], "competencias": ["DIG.4.2", "DIG.4.4"], "saberes": ["DIG.4.B.2", "DIG.4.D.1", "DIG.4.D.5"], "descriptores": ["CC1", "CC2", "CC3", "CC4", "CD1", "CD2", "CD3", "CD4", "CE1", "CE3", "CPSAA1", "CPSAA4", "CPSAA5"]}], "materiasTxt": "Digitalización", "mapaAlumnado": {"DIG.4.2.3": [], "DIG.4.4.1": [], "DIG.4.4.3": []}, "multinivel": []}, "seneca": {"titulo": "SdA 5: El mundo de la imagen, edición y transparencia algorítmica", "temporalizacion": "9 sesiones", "justificacion": "La cultura visual del alumnado exige comprender los gráficos digitales (mapa de bits y vectorial), editar imágenes con criterio técnico, proteger la privacidad borrando los metadatos, respetar la propiedad intelectual y entender críticamente cómo aprende la inteligencia artificial y qué sesgos reproduce. Un cartel real para un evento del centro, defendido en público, da sentido al aprendizaje.", "producto_final": "Cartel publicitario o informativo para un evento escolar real, en versión impresa (PDF A3) y digital (PNG 1080 × 1350 px), con imágenes editadas en GIMP, recursos de bancos libres citados, sin metadatos personales y con un módulo de imagen generado o retocado con IA debidamente etiquetado, acompañado de su ficha técnica y de créditos y defendido en público ante el centro.", "concrecion": [{"materia": "Digitalización", "texto": "COMPETENCIAS ESPECÍFICAS\nDIG.4.2.Configurar el entorno personal de aprendizaje, interactuando y aprovechando los recursos del ámbito digital, para optimizar y gestionar el aprendizaje permanente.\nDIG.4.4.Ejercer una ciudadanía digital crítica, conociendo las posibles acciones que realizar en la red, e identificando sus repercusiones, para hacer un uso activo, responsable y ético de la tecnología.\n\nCRITERIOS DE EVALUACIÓN\nDIG.4.2.3.Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.\nDIG.4.4.1.Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.\nDIG.4.4.3.Valorar la importancia de la oportunidad, facilidad y libertad de expresión que suponen los medios digitales conectados, analizando de forma crítica los mensajes que se reciben y transmiten teniendo en cuenta su objetividad, ideología, intencionalidad, sesgos y caducidad.\n\nSABERES BÁSICOS\nDIG.4.B.2.Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.\nDIG.4.D.1.Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.\nDIG.4.D.5.Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.\n\nDESCRIPTORES OPERATIVOS\nCC1. Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento."}], "actividades": [{"titulo": "Laboratorio de imagen e IA", "tipo": "Exploración", "abreviatura": "EXP1", "orden": "1", "tarea": "5.2 · Laboratorio de imagen e IA", "descripcion": "Sesión 5 (50 min): Metadatos EXIF: lo que tu foto cuenta de ti\nReto: Descubrir qué datos esconde una foto, borrarlos antes de publicarla y entender cómo los metadatos pueden indicar que una imagen se hizo con IA.\n- Gancho: la foto que dice dónde vives (7 min). El docente plantea un caso: alguien sube a un foro una foto de su nueva bici hecha en la puerta de casa y otra persona averigua la calle con los datos de la foto. Pregunta: «¿Cómo ha podido saberlo?». Lluvia de ideas.\n- ¿Qué son los metadatos EXIF? (8 min). Explicación: el móvil guarda dentro de la foto datos que no se ven (modelo del móvil, fecha y hora, ajustes de la cámara, ubicación GPS si está activada, a veces el autor y el copyright). Pueden ser útiles (ordenar fotos, demostrar la autoría) o un riesgo para la privacidad.\n- Inspección de metadatos (15 min). Cada estudiante abre en GIMP la foto de ejemplo del docente (hecha en un lugar público con el GPS activado) e inspecciona Imagen → Metadatos → Ver metadatos (en Windows también Propiedades → Detalles). Completa la Parte 1 de la plantilla A1: móvil, fecha, ubicación y qué podría saber alguien con esos datos.\n- Borrar y comprobar (10 min). Exportan una copia sin metadatos: en GIMP, al exportar, desmarcan guardar datos Exif, XMP e IPTC y la miniatura (en Windows, Propiedades → Detalles → Quitar propiedades e información personal). Comprueban que la copia ya no tiene ubicación. Lo harán también con las fotos del cartel.\n- Redes y credenciales de contenido (10 min). Se comenta que muchas redes borran parte de los metadatos al publicar, pero enviar una foto como archivo o documento suele conservarlos. Se presentan las credenciales de contenido (Content Credentials): metadatos que algunas herramientas añaden para indicar cómo se creó una imagen, incluso si se generó o editó con IA. Quiz final.\n- Evidencia: Parte 1 de la plantilla A1 (metadatos)\n- Evidencia: Copia de la foto sin metadatos\n\nSesión 6 (50 min): ¿Cómo aprende una IA? Entrenamos un modelo con Teachable Machine\nReto: Entrenar un modelo de IA que reconoce objetos y descubrir con pruebas trampa que aprende lo que hay en sus datos, incluidos los sesgos.\n- Gancho: la galería que te conoce (5 min). El docente pregunta: «¿Cómo sabe la galería del móvil qué fotos son de perros o de comida?». Respuestas en voz alta.\n- Aprender con ejemplos (7 min). Flujo proyectado: datos (muchas imágenes con su etiqueta) → entrenar → modelo → predecir. La IA no entiende qué es un perro: busca patrones en los ejemplos que le damos.\n- Entrenamos el modelo (15 min). Por parejas, en teachablemachine.withgoogle.com → Proyecto de imagen → modelo estándar. Crean tres clases («Estuche», «Botella» y «Nada») y graban 30-50 fotos por clase con la webcam, solo de objetos y siempre sobre la misma mesa, o suben las imágenes de la carpeta del docente si no hay webcam. Pulsan «Entrenar modelo» y lo prueban. El entrenamiento se hace en el navegador y no se guarda el proyecto.\n- Pruebas trampa (13 min). Prueban el modelo con casos que no ha visto: un estuche de otro color, la botella sobre otro fondo, el objeto medio tapado por la mano. Anotan en la Parte 2 de la plantilla A1 qué falla y por qué. Después añaden fotos más variadas, vuelven a entrenar y comparan.\n- De mi modelo a la IA que dibuja (10 min). Puesta en común: el modelo aprendió también el fondo y el color, no solo el objeto (eso es un sesgo de los datos). Las IA que generan imágenes aprendieron igual, pero de millones de imágenes de internet: repiten lo que más vieron. Por eso importa la transparencia: saber con qué datos se entrenó una IA.\n- Evidencia: Modelo entrenado y probado (observación)\n- Evidencia: Parte 2 de la plantilla A1 (pruebas trampa)\n\nSesión 7 (50 min): IA generativa: sesgos y edición con IA frente a edición manual\nReto: Comprobar qué sesgos reproduce la IA generativa, comparar la edición con IA con la edición manual en GIMP y fijar normas para usarla de forma ética.\n- Cómo genera una imagen (5 min). Flujo breve: la IA parte de ruido y lo va «limpiando» paso a paso guiada por el texto (prompt), usando los patrones que aprendió de sus datos. Se recuerda la sesión 6.\n- Experimento de sesgos (15 min). Con el banco de imágenes que ha preparado el docente (o con Canva Magic Media si está activado para el alumnado), se miran las imágenes de seis prompts neutros: «una persona que programa», «una persona que dirige una empresa», «una persona que cuida a un bebé», «una persona que juega al fútbol profesional», «una familia andaluza» y «una persona que limpia una oficina». Cada estudiante registra en la Parte 3 de la plantilla A1 quién aparece y qué se repite, y escribe un prompt mejorado.\n- Edición manual o edición con IA (18 min). Cada estudiante repite con IA una edición que ya hizo a mano en la sesión 4: quitar el fondo de un objeto con Canva (Quitar fondo) y ampliar o cambiar parte de una foto con una herramienta de edición por instrucciones (Magic Edit o Magic Expand). Compara en la Parte 4 de la plantilla A1: tiempo, calidad del borde, control sobre el resultado, qué ha decidido la IA por su cuenta y si hay que etiquetarlo.\n- Normas y entrega de la Tarea 5.2 (12 min). Breve puesta en común sobre cuándo es aceptable usar IA en un cartel. Cada estudiante escribe sus tres normas en la Parte 5 de la A1, revisa la lista «Antes de entregar», descarga la plantilla en PDF y la sube a la Tarea 5.2.\n- Moodle Centros: Tarea «5.2 · Laboratorio de imagen e IA» (evaluada con rúbrica 1-3-5-7-10). Evaluar con rúbrica la protección de la privacidad con los metadatos, el análisis crítico de cómo aprende la IA y de sus sesgos, la comparación entre edición manual y con IA y las normas de uso ético, con la plantilla A1 completada en las sesiones 5, 6 y 7.\n- Evidencia: Plantilla A1 completa (Tarea 5.2)", "temporalizacion": "3 sesiónes", "recursos": "GIMP, Foto de ejemplo con GPS, Plantilla A1, Teachable Machine, Webcam o imágenes del docente, Banco de imágenes IA, Canva para Educación", "descriptores": "CC1. Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia const S = DATA.sa, CUR = DATA.cur, IDX = DATA.idx;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':''); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

/* ---------- cabecera ---------- */
const M = S.meta;
$('#h-kicker').textContent = `LOMLOE · Andalucía · ${IDX.materiasTxt} · ${M.curso_texto || ''}`;
$('#h-title').textContent = M.titulo; $('#h-sub').textContent = M.subtitulo || '';
$('#h-meta').innerHTML = [ `${S.sesiones.length} sesiones de ${M.duracion_sesion||50} min`, M.agrupamiento, M.temporalizacion, M.anio_academico ].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');

/* ---------- pestañas ---------- */
const TABS = [['vision','1. Visión general'],['seq','2. Secuenciación'],['map','3. Mapeo curricular'],['moodle','4. Moodle Centros'],['dua','5. DUA y diversidad'],['eval','6. Evaluación'],['seneca','7. Para Séneca']];
const HAY_ANX = !!(S.anexos && ((S.anexos.plantillas||[]).length || (S.anexos.formularios||[]).length));
if (HAY_ANX) TABS.push(['anx', (TABS.length+1)+'. Anexos']);
if (S.creditos) TABS.push(['cred', (TABS.length+1)+'. Créditos']);
$('#tabs').innerHTML = TABS.map(([id,t],i)=>`<button role="tab" data-tab="${id}" aria-selected="${i===0}">${t}</button>`).join('');
$('#main').innerHTML = TABS.map(([id],i)=>`<section class="panel ${i===0?'on':''}" id="p-${id}" role="tabpanel"></section>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+b.dataset.tab)); try{localStorage.setItem('sda-tab',b.dataset.tab)}catch(_){} };
try{ const t = localStorage.getItem('sda-tab'); if(t){ const b = document.querySelector(`#tabs button[data-tab="${t}"]`); b && b.click(); } }catch(_){}
function openAll(){ document.querySelectorAll('details.ses').forEach(d=>d.open=true); }

/* ---------- 1. visión ---------- */
(function(){
  const V = S.vision || {};
  const rec = S.recursos || {};
  $('#p-vision').innerHTML = `<div class="grid g3"><div class="grid">
    <div class="card"><h2>Descripción y contexto</h2><p>${esc(V.descripcion)}</p><p>${esc(V.contexto)}</p></div>
    <div class="card"><h2>Justificación curricular</h2><p>${esc(V.justificacion)}</p>
      <div class="lab">Competencias específicas</div>${chips(IDX.competencias)}
      <div class="lab">Criterios de evaluación</div>${chips(IDX.criterios)}
      <div class="lab">Saberes básicos</div>${chips(IDX.saberes)}
      <div class="lab">Descriptores del Perfil de salida</div>${chips(IDX.descriptores)}</div>
    <div class="card reto"><h2>El reto</h2><p><i>${esc(V.reto)}</i></p><div class="lab">Pregunta guía</div><p class="q">${esc(V.pregunta_guia)}</p></div>
    <div class="card"><h2>Producto final</h2><p>${esc(V.producto_final)}</p></div>
  </div><div class="grid" style="align-content:start">
    <div class="card"><h2>Metodologías</h2>${arr(S.metodologias).map(m=>`<p><b>${esc(m.nombre)}</b>${m.descripcion?': '+esc(m.descripcion):''}</p>`).join('')}</div>
    <div class="card"><h2>Recursos</h2>${Array.isArray(rec)?ul(rec):Object.entries(rec).map(([k,v])=>`<div class="lab">${esc(k)}</div>${ul(v)}`).join('')}</div>
  </div></div>`;
})();

/* ---------- 2. secuenciación ---------- */
(function(){
  const COLORS = ['#2563eb','#0891b2','#0f766e','#7c3aed','#b45309','#be123c'];
  const fases = arr(S.fases);
  const total = S.sesiones.length;
  const fcol = {}; fases.forEach((f,i)=>fcol[f.nombre]=COLORS[i%COLORS.length]);
  const count = f => S.sesiones.filter(s=>s.fase===f.nombre).length;
  let h = `<div class="card"><h2>Distribución temporal</h2><div class="timeline">${fases.map(f=>`<div style="flex:${count(f)};background:${fcol[f.nombre]}">${esc(f.nombre)} · ${count(f)} ses.</div>`).join('')}</div>
    <div class="grid g2" style="margin-top:12px">${fases.map(f=>`<div><b style="color:${fcol[f.nombre]}">${esc(f.nombre)}</b> (sesiones ${esc(f.sesiones||'')}) — ${esc(f.finalidad||'')} · ${Math.round(count(f)/total*100)} %</div>`).join('')}</div></div>`;
  const duaSet = [...new Set(S.sesiones.flatMap(s=>arr(s.dua && s.dua.principios)))];
  h += `<div class="filters" id="ff"><span class="legend">Fase:</span><button class="on" data-f="*">Todas</button>${fases.map(f=>`<button data-f="${esc(f.nombre)}">${esc(f.nombre)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">DUA:</span>${duaSet.map(d=>`<button data-d="${esc(d)}">${esc(d)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">Moodle:</span><button data-m="1">Con actividad Moodle</button>
    <button data-open="1" style="margin-left:auto">Desplegar todas</button></div><div id="slist"></div>`;
  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){
    const list = S.sesiones.filter(s => (state.f==='*'||s.fase===state.f) && (!state.d || arr(s.dua&&s.dua.principios).includes(state.d)) && (!state.m || arr(s.moodle).length));
    $('#slist').innerHTML = list.map(s => `<details class="ses" data-n="${s.n}"><summary><div class="num" style="background:${fcol[s.fase]}22;color:${fcol[s.fase]}">${s.n}</div>
      <div><div class="stitle">Sesión ${s.n} · ${esc(s.titulo)} <span class="badge">${esc(s.fase)}</span>${arr(s.moodle).length?'<span class="badge" style="background:var(--moodle-bg);color:var(--moodle)">Moodle</span>':''}</div><div class="sreto">${esc(s.reto)}</div></div></summary>
      <div class="sbody"><div>${arr(s.actividades).map(a=>`<div class="act"><b>${esc(a.nombre)}</b><span class="min">${a.min?esc(a.min)+' min':''}</span><p>${esc(a.desc)}</p></div>`).join('')}
        ${arr(s.moodle).length?`<div class="moodle"><div class="mh">Integración con Moodle Centros</div>${arr(s.moodle).map(m=>`<div class="mitem"><div class="mt">${esc(m.recurso)} · «${esc(m.nombre)}»${corrBadge(m)}${m.criterio?' '+chip(m.criterio):''}</div><p>${esc(m.uso)}</p>${m.correccion==='apto'?`<div class="lab">Se verifica</div>${ul(m.cotejo)}`:''}${m.correccion==='rubrica'?`<p class="note">Se evalúa con la rúbrica de la pestaña «6. Evaluación».</p>`:''}${arr(m.config).length?`<div class="lab">Configuración</div>`+ul(m.config):''}</div>`).join('')}</div>`:''}
      </div><div class="side">
        <div class="lab">Criterios</div>${arr(s.criterios).length?chips(s.criterios):'<span class="note">Evaluación diagnóstica (no calificable)</span>'}
        <div class="lab">Saberes</div>${chips(s.saberes)}
        ${arr(s.metodologia).length?`<div class="lab">Metodología</div><p>${arr(s.metodologia).map(esc).join(' · ')}</p>`:''}
        ${arr(s.evidencias).length?`<div class="lab">Evidencias</div>${ul(s.evidencias)}`:''}
        ${arr(s.recursos).length?`<div class="lab">Recursos</div><p>${arr(s.recursos).map(esc).join(' · ')}</p>`:''}
        ${s.dua?`<div class="lab">DUA (${arr(s.dua.principios).map(esc).join(', ')})</div><p>${esc(s.dua.medidas)}</p>`:''}
      </div></div></details>`).join('') || '<p class="note">Ninguna sesión coincide con el filtro.</p>';
  }
  $('#ff').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.open){ openAll(); return; }
    if(b.dataset.f){ state.f=b.dataset.f; $('#ff').querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); }
    if(b.dataset.d){ state.d = state.d===b.dataset.d?null:b.dataset.d; $('#ff').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===state.d)); }
    if(b.dataset.m){ state.m=!state.m; b.classList.toggle('on',state.m); }
    render(); };
  render();
})();

/* ---------- 3. mapeo ---------- */
(function(){
  const used = new Set(IDX.saberes);
  const inst = (S.evaluacion && S.evaluacion.instrumentos) || {};
  let h = `<div class="card"><h2>Matriz curricular</h2><p class="legend">Los saberes tachados están vinculados oficialmente al criterio pero no se movilizan en esta situación de aprendizaje.</p><div class="scroll"><table class="tbl"><thead><tr><th>Competencia</th><th>Criterio</th><th>Saberes</th><th>Descriptores</th><th>Sesiones</th><th>Instrumentos</th></tr></thead><tbody>`;
  IDX.criterios.forEach(c => { const it = CUR[c]; const ce = CUR[it.competencia];
    h += `<tr><td>${chip(it.competencia)}<div class="note">${esc(ce.texto)}</div></td><td>${chip(c)}<div class="note">${esc(it.texto)}</div></td>
      <td>${arr(it.saberes).map(s=>chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}</td><td>${chips(ce.descriptores)}</td>
      <td>${(IDX.sesionesPorCriterio[c]||[]).map(n=>'S'+n).join(', ')}</td><td>${ul(inst[c])}</td></tr>`; });
  h += `</tbody></table></div></div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Criterios trabajados por sesión</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${S.sesiones.map(s=>`<th>S${s.n}</th>`).join('')}</tr></thead><tbody>`;
  IDX.criterios.forEach(c => { h += `<tr><td>${chip(c)}</td>${S.sesiones.map(s=>`<td class="tick">${arr(s.criterios).includes(c)?'✔':''}</td>`).join('')}</tr>`; });
  h += `</tbody></table></div></div>`;
  const MA = IDX.mapaAlumnado || {};
  if(Object.values(MA).some(v=>v.length)) h += `<div class="card" style="margin-top:16px"><h2>Dónde se evidencia cada criterio en la guía del alumnado</h2><p class="note">Apartados y actividades de la guía del alumnado que dejan evidencia de cada criterio.</p><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th><th>Apartado y actividad</th><th>Sesiones</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${arr(MA[c]).map(x=>`<div><b>${esc(x.apartado)}</b> → ${esc(x.actividad)}</div>`).join('') || '<span class="note">—</span>'}</td><td>${[...new Set(arr(MA[c]).flatMap(x=>x.sesiones))].sort((a,b)=>a-b).map(n=>'S'+n).join(', ')}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(S.notas_rigor).length) h += `<div class="card" style="margin-top:16px"><h2>Notas de rigor curricular</h2>${ul(S.notas_rigor)}</div>`;
  $('#p-map').innerHTML = h;
})();

/* ---------- 4. moodle ---------- */
(function(){
  const Mo = S.moodle || {};
  // Criterios de una Tarea: el principal y los de cada línea de su rúbrica (así llegan todos a Séneca)
  const critsDe = m => [...new Set([m.criterio, ...arr(m.rubrica).map(l=>l.criterio)].filter(Boolean))];
  const all = S.sesiones.flatMap(s => arr(s.moodle).map(m => ({...m, n:s.n})));
  let h = `<div class="grid g2"><div class="card"><h2>Estructura del curso</h2>${Mo.estructura?`<p>${esc(Mo.estructura)}</p>`:''}${arr(Mo.secciones).map(sec=>`<div class="lab">${esc(sec.nombre)}</div>${ul(sec.elementos)}`).join('')}</div>
    <div class="card"><h2>Libro de calificaciones</h2>${Mo.calificaciones?`<p>${esc(Mo.calificaciones)}</p>`:''}<p class="note">Una Tarea con rúbrica aparece en todos los criterios que evalúan sus líneas; la nota de cada criterio la calcula la pestaña «Evaluación» y es la que se pasa a Séneca.</p>
      <table class="tbl"><thead><tr><th>Criterio</th><th>Elementos calificables en Moodle</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${all.filter(m=>m.calificable && critsDe(m).includes(c)).map(m=>{ const ls = arr(m.rubrica).filter(l=>l.criterio===c).map(l=>l.linea);
        return `S${m.n} · ${esc(m.recurso)} «${esc(m.nombre)}»${ls.length && critsDe(m).length>1 ? `<div class="note">Líneas de la rúbrica: ${ls.map(esc).join(' · ')}</div>` : ''}`; }).join('<br>') || '<span class="note">Se califica fuera de Moodle (observación, exposición…)</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(Mo.configuracion).length) h += `<div class="card" style="margin-top:16px"><h2>Configuración general recomendada</h2>${ul(Mo.configuracion)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Todas las actividades de Moodle</h2><div class="scroll"><table class="tbl"><thead><tr><th>Sesión</th><th>Recurso</th><th>Nombre</th><th>Corrección</th><th>Para qué</th><th>Configuración clave</th></tr></thead><tbody>${all.map(m=>`<tr><td>S${m.n}</td><td>${esc(m.recurso)}</td><td>${esc(m.nombre)} ${chips(critsDe(m))}</td><td>${corrBadge(m)||'—'}</td><td>${esc(m.uso)}</td><td>${ul(m.config)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#p-moodle').innerHTML = h;
})();

/* ---------- 5. DUA ---------- */
(function(){
  const D = S.dua || {};
  let h = `<div class="grid g2">${Object.entries(D).map(([k,v])=>`<div class="card"><h2>${esc(k)}</h2>${ul(v)}</div>`).join('')}</div>`;
  if(arr(S.diversidad).length) h += `<div class="card" style="margin-top:16px"><h2>Atención a la diversidad</h2><table class="tbl"><thead><tr><th>Perfil</th><th>Medidas concretas</th></tr></thead><tbody>${S.diversidad.map(d=>`<tr><td><b>${esc(d.perfil)}</b></td><td>${esc(d.medidas)}</td></tr>`).join('')}</tbody></table></div>`;
  if(arr(IDX.multinivel).length) h += `<div class="card" style="margin-top:16px"><h2>Actividades multinivel y procesos cognitivos</h2><p class="note">Cada actividad grupal se resuelve después de forma individual eligiendo una opción, de menor a mayor exigencia cognitiva.</p><div class="scroll"><table class="tbl"><thead><tr><th>Apartado</th><th>Actividad grupal</th><th>Opción individual</th><th>Proceso cognitivo</th></tr></thead><tbody>${IDX.multinivel.map(m=>arr(m.opciones).map((o,i)=>`<tr><td>${i?'':esc(m.apartado)}</td><td>${i?'':'<b>'+esc(m.actividad)+'</b>'}</td><td>${esc(o.letra)} · ${esc(o.titulo)}</td><td><span class="badge">${esc(o.proceso)}</span></td></tr>`).join('')).join('')}</tbody></table></div></div>`;
  if(arr(S.roles).length) h += `<div class="card" style="margin-top:16px"><h2>Roles del equipo</h2><table class="tbl"><tbody>${S.roles.map(r=>`<tr><td><b>${esc(r.rol)}</b></td><td>${esc(r.funcion)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#p-dua').innerHTML = h;
})();

/* ---------- 6. evaluación ---------- */
(function(){
  const E = S.evaluacion || {};
  let st = {}; try{ st = JSON.parse(localStorage.getItem('sda-cotejo-'+M.titulo)||'{}'); }catch(_){}
  let h = `<div class="card"><h2>Lista de cotejo interactiva</h2><p class="note">Marca los indicadores logrados; el progreso se calcula por criterio y se guarda en este navegador.</p>
    <div class="grid g2">${arr(E.cotejo).map((g,gi)=>`<div class="side"><span class="pct" data-p="${gi}"></span>${chip(g.criterio)}<div class="bar"><div data-b="${gi}"></div></div><ul class="cot" style="padding:0">${arr(g.indicadores).map((t,i)=>`<li><label><input type="checkbox" data-k="${gi}-${i}" ${st[gi+'-'+i]?'checked':''}> <span>${esc(t)}</span></label></li>`).join('')}</ul></div>`).join('')}</div>
    <button class="copy" id="cot-reset" style="margin-top:10px">Borrar marcas</button></div>`;
  const TR = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='rubrica').map(m=>({...m,n:x.n})));
  const TA = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='apto').map(m=>({...m,n:x.n})));
  const PTS = [1,3,5,7,10];
  if(TR.length) h += `<div class="card" style="margin-top:16px"><h2>Rúbricas de las tareas finales</h2><p class="note">Cada línea se puntúa con 1, 3, 5, 7 o 10 puntos y la nota es la media (ponderada cuando la línea indica su peso). Pulsa una casilla para calcular la nota de un estudiante (no se guarda).</p>${TR.map((m,ti)=>`<h3>${tname(m)} ${chips([...new Set(arr(m.rubrica).map(l=>l.criterio||m.criterio))])} <span class="pct" data-rn="${ti}"></span></h3><div class="scroll"><table class="tbl rub" data-t="${ti}"><thead><tr><th>Línea</th>${PTS.map(p=>`<th>${p} pto</th>`).join('')}</tr></thead><tbody>${arr(m.rubrica).map((l,li)=>`<tr><td><b>${esc(l.linea)}</b>${l.criterio?`<br><small>${esc(l.criterio)}</small>`:''}${l.peso?`<br><small>peso ${String(l.peso).replace('.',',')} %</small>`:''}</td>${arr(l.niveles).map((x,k)=>`<td class="rc" data-l="${li}" data-w="${l.peso||1}" data-c="${esc(l.criterio||m.criterio||'')}" data-p="${PTS[k]}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
  if(TA.length) h += `<div class="card" style="margin-top:16px"><h2>Tareas de verificación (Apto / No apto)</h2><p class="note">Es Apto si se cumplen todos los elementos.</p><div class="grid g2">${TA.map(m=>`<div class="side"><b>${tname(m)}</b> ${chip(m.criterio)}${ul(m.cotejo)}</div>`).join('')}</div></div>`;
  if(arr(E.rubrica).length){ const niv = E.niveles || ['Insuficiente (1-4)','Suficiente / Bien (5-6)','Notable (7-8)','Sobresaliente (9-10)'];
    h += `<div class="card" style="margin-top:16px"><h2>Rúbrica</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${niv.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${E.rubrica.map(r=>`<tr><td>${chip(r.criterio)}</td>${arr(r.niveles).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; }
  if(E.agentes) h += `<div class="card" style="margin-top:16px"><h2>Agentes e instrumentos</h2>${Object.entries(E.agentes).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;
  $('#p-eval').innerHTML = h;
  const sel = {};
  $('#p-eval').addEventListener('click', e => { const c = e.target.closest('td.rc'); if(!c) return; const t = c.closest('table').dataset.t;
    c.parentElement.querySelectorAll('td.rc').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    sel[t] = sel[t]||{}; sel[t][c.dataset.l] = [+c.dataset.p, +c.dataset.w]; const v = Object.values(sel[t]); const nl = c.closest('tbody').rows.length;
    const wt = [...c.closest('tbody').rows].reduce((a,r)=>a+(+r.querySelector('td.rc').dataset.w),0);
    document.querySelector(`[data-rn="${t}"]`).textContent = `Nota: ${(v.reduce((a,[p,w])=>a+p*w,0)/wt).toFixed(1)}` + (()=>{ const rs=[...c.closest('tbody').rows].map(r=>r.querySelector('td.rc').dataset); const cs=[...new Set(rs.map(d=>d.c))]; if(cs.length<2) return ''; return ' · ' + cs.map(k=>{ const ws=rs.filter(d=>d.c===k).reduce((a,d)=>a+(+d.w),0); const pt=Object.entries(sel[t]).filter(([i])=>rs[i].c===k).reduce((a,[,x])=>a+x[0]*x[1],0); return k+': '+(pt/ws).toFixed(1); }).join(' · '); })() + (v.length<nl?` (faltan ${nl-v.length} líneas)`:''); });
  function upd(){ arr(E.cotejo).forEach((g,gi)=>{ const n = arr(g.indicadores).length; const k = arr(g.indicadores).filter((_,i)=>st[gi+'-'+i]).length; const p = n?Math.round(k/n*100):0;
    document.querySelector(`[data-b="${gi}"]`).style.width = p+'%'; document.querySelector(`[data-p="${gi}"]`).textContent = p+' %'; }); }
  function save(){ try{ localStorage.setItem('sda-cotejo-'+M.titulo, JSON.stringify(st)); }catch(_){} }
  $('#p-eval').addEventListener('change', e => { const k = e.target.dataset.k; if(k){ st[k]=e.target.checked; save(); upd(); } });
  $('#cot-reset').onclick = () => { st = {}; save(); document.querySelectorAll('#p-eval input[type=checkbox]').forEach(x=>x.checked=false); upd(); };
  upd();
})();

/* ---------- 8. Créditos ---------- */
(function(){
  const C = S.creditos; if(!C) return;
  const o = C.original || {}, A = C.adaptacion || {}, L = C.licencia || {};
  const lic = L.url ? `<a href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.nombre)}</a>` : esc(L.nombre||'');
  let h = `<div class="grid g3"><div class="grid" style="align-content:start">`;
  if(o.titulo) h += `<div class="card"><h2>Recurso original</h2><p>Esta situación de aprendizaje es una adaptación de <b>«${esc(o.titulo)}»</b>${o.organizacion?' ('+esc(o.organizacion)+')':''}.</p>
    <table class="tbl"><tbody>${arr(o.personas).map(x=>`<tr><th style="width:38%">${esc(x.funcion)}</th><td>${esc(x.nombres)}</td></tr>`).join('')}${o.version?`<tr><th>Versión original</th><td>${esc(o.version)}</td></tr>`:''}${o.fuente?`<tr><th>Fuente</th><td>${/^https?:/.test(o.fuente)?`<a href="${esc(o.fuente)}" target="_blank" rel="noopener">${esc(o.fuente)}</a>`:esc(o.fuente)}</td></tr>`:''}</tbody></table></div>`;
  if(arr(C.recursos).length) h += `<div class="card"><h2>Recursos de terceros</h2><div class="scroll"><table class="tbl"><thead><tr><th>Recurso</th><th>Autoría</th><th>Licencia</th></tr></thead><tbody>${C.recursos.map(r=>`<tr><td>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.elemento)}</a>`:esc(r.elemento)}</td><td>${esc(r.autoria)}</td><td>${esc(r.licencia)}</td></tr>`).join('')}</tbody></table></div></div>`;
  h += `</div><div class="grid" style="align-content:start"><div class="card reto"><h2>Licencia</h2><p class="q">${L.url?`<a style="color:#fff" href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.nombre)}</a>`:esc(L.nombre||'')}</p>${L.nota?`<p>${esc(L.nota)}</p>`:''}</div>`;
  if(A.autoria||A.cambios) h += `<div class="card"><h2>Adaptación</h2>${A.autoria?`<p><b>${esc(A.autoria)}</b>${A.fecha?' · '+esc(A.fecha):''}</p>`:''}${A.cambios?`<p>${esc(A.cambios)}</p>`:''}</div>`;
  if(o.cita) h += `<div class="card"><h2>Cómo citarla</h2><div class="copybox"><div class="ch"><span>Cita</span><button class="copy">Copiar</button></div><pre>${esc(o.cita)}</pre></div></div>`;
  h += `</div></div>`;
  $('#p-cred').innerHTML = h;
  const f = document.createElement('footer'); f.className = 'wrap note'; f.style.padding = '0 16px 32px';
  f.innerHTML = `${o.titulo?`Adaptación de «${esc(o.titulo)}»${o.organizacion?' · '+esc(o.organizacion):''} · `:''}Licencia ${lic}`;
  document.body.appendChild(f);
})();

/* ---------- 7. Séneca ---------- */
(function(){
  const SE = DATA.seneca;
  const box = (t, txt) => `<div class="copybox"><div class="ch"><span>${esc(t)}</span><button class="copy">Copiar</button></div><pre>${esc(txt)}</pre></div>`;
  let h = `<div class="card"><h2>Textos listos para pegar en Séneca</h2><p class="note">Séneca guarda texto plano: estos bloques no llevan formato Markdown. Copia cada campo en su casilla del formulario de la situación de aprendizaje.</p>
    ${box('Título', SE.titulo)}${box('Temporalización', SE.temporalizacion)}${box('Justificación', SE.justificacion)}${box('Producto final', SE.producto_final)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Concreción curricular</h2><p class="note">En Séneca se marcan en las listas; aquí tienes la selección para comprobarla.</p>${SE.concrecion.map(m=>box(m.materia, m.texto)).join('')}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Actividades (formulario «Detalle de la actividad»)</h2><p class="note">Los campos siguen el orden del formulario de Séneca. Solo hay una actividad por cada Tarea de Moodle evaluada con rúbrica. En «Vinculación criterios de evaluación» elige la única trazabilidad indicada y pasa esos criterios a «seleccionados» (es obligatorio).</p>${SE.actividades.map(a=>`<h3>${esc(a.orden)}. ${esc(a.titulo)} <span class="badge">${esc(a.tipo)}</span> <span class="badge">${esc(a.abreviatura)}</span> <span class="badge">Tarea ${esc(a.tarea)}</span></h3>${box('Título de la actividad', a.titulo)}${box('Tipo de actividad', a.tipo)}${box('Abreviatura', a.abreviatura)}${box('Orden de la presentación', a.orden)}${box('Descripción', a.descripcion)}${box('Temporalización', a.temporalizacion)}${box('Recursos', a.recursos)}${box('Descriptores operativos', a.descriptores)}${box('Vinculación criterios de evaluación', a.vinculacion)}${box('Ejercicios', a.ejercicios)}${box('Metodologías', a.metodologias)}`).join('')}</div>`;
  $('#p-seneca').innerHTML = h;
})();

/* ---------- Anexos: plantillas y formularios ---------- */
(function(){
  if (!HAY_ANX) return;
  const A = S.anexos, P = arr(A.plantillas), F = arr(A.formularios);
  const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const ses = ns => { ns = arr(ns).slice().sort((a,b)=>a-b); if(!ns.length) return '';
    return (ns.length>1 && ns[ns.length-1]-ns[0]===ns.length-1) ? `Sesiones ${ns[0]}-${ns[ns.length-1]}` : (ns.length===1?'Sesión ':'Sesiones ')+ns.join(', '); };
  const TT = {opcion:'Una opción', casillas:'Varias opciones', desplegable:'Desplegable', escala:'Escala', texto:'Respuesta corta', parrafo:'Respuesta larga', cuadricula:'Cuadrícula', info:'Texto informativo'};
  let h = `<div class="card"><h2>Anexos para el alumnado</h2><p class="note">Solo las plantillas que se entregan en una Tarea y los formularios de Google. En el PDF cada plantilla empieza en su página, lista para imprimir o copiar en Google Docs. Los formularios se crean con <b>Codigo.gs</b>.</p>
    <p>${P.map(p=>`<span class="badge" style="margin-right:6px">${esc(p.id)} · ${esc(p.titulo)}</span>`).join('')}${F.map(f=>`<span class="badge" style="margin-right:6px">${esc(f.id)} · ${esc(f.titulo)}</span>`).join('')}</p></div>`;
  P.forEach(p => {
    let cab = p.cabecera;
    if (cab == null){ const ag = String(p.agrupamiento||'').toLowerCase();
      cab = ag.startsWith('individual') ? ['Nombre y apellidos','Grupo','Fecha'] : (ag.includes('pareja') ? ['Pareja','Fecha'] : ['Equipo','Integrantes','Fecha']); }
    const meta = [ses(p.sesiones), p.agrupamiento, p.herramienta, p.entrega ? 'Se entrega en '+p.entrega : ''].filter(Boolean).join(' · ');
    let b = `<div class="card anx anx-p"><h2>${esc(p.id)} · ${esc(p.titulo)}</h2><div class="am">${esc(meta)}</div>`;
    if (p.docente) b += `<div class="doc"><b>Para el docente:</b> ${md(p.docente)}</div>`;
    if (arr(cab).length) b += `<table class="w"><tbody><tr>${cab.map(c=>`<th style="width:auto;height:2.2em">${esc(c)}:</th>`).join('')}</tr></tbody></table>`;
    if (p.instrucciones) b += `<p>${md(p.instrucciones)}</p>`;
    arr(p.bloques).forEach(k => {
      if (k.titulo) b += `<h4>${esc(k.titulo)}</h4>`;
      if (k.texto) b += `<p>${md(k.texto)}</p>`;
      if (k.lista) b += `<ul>${arr(k.lista).map(x=>`<li>${md(x)}</li>`).join('')}</ul>`;
      if (k.casillas) b += arr(k.casillas).map(x=>`<div class="ck">☐ ${md(x)}</div>`).join('');
      if (k.campos) b += `<table class="w"><tbody>${arr(k.campos).map(c=>`<tr style="height:${(k.alto||1.3)*1.5}em"><th>${md(c)}</th><td></td></tr>`).join('')}</tbody></table>`;
      if (k.tabla){ const cols = arr(k.tabla.columnas); let fil = k.tabla.filas ?? 3;
        fil = typeof fil === 'number' ? Array.from({length:fil}, ()=>[]) : fil.map(arr);
        b += `<table class="w"><thead><tr>${cols.map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${fil.map(r=>`<tr style="height:${(k.tabla.alto||1.4)*1.5}em">${cols.map((_,i)=>`<td>${md(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
      if (k.lineas) b += `<div class="ln" style="height:${1.9*(k.lineas|0)}em"></div>`;
      if (k.nota) b += `<div class="am">${md(k.nota)}</div>`;
    });
    h += b + `</div>`;
  });
  F.forEach((f,fi) => {
    const meta = [ses(f.sesiones), f.anonimo ? 'Anónimo (no recoge el correo)' : 'Recoge el correo del centro', f.repetible ? 'Se puede responder varias veces' : ''].filter(Boolean).join(' · ');
    let n = 0, ob = false;
    const rows = arr(f.preguntas).map(q => {
      if (q.tipo === 'seccion') return `<tr><th colspan="4" style="background:var(--bg)">Sección: ${md(q.titulo)}${q.ayuda?' — '+md(q.ayuda):''}</th></tr>`;
      if (q.tipo !== 'info') n++;
      const o = q.obligatoria === undefined ? !!f.obligatorias : !!q.obligatoria; ob = ob || o;
      const et = arr(q.etiquetas);
      const op = q.tipo==='escala' ? `${q.min ?? 1}${et[0]?' ('+esc(et[0])+')':''} … ${q.max ?? 5}${et[1]?' ('+esc(et[1])+')':''}`
        : q.tipo==='cuadricula' ? `Filas: ${arr(q.filas).map(esc).join('; ')}. Columnas: ${arr(q.columnas).map(esc).join(' / ')}`
        : arr(q.opciones).map(esc).join(' / ') + (q.otra ? ' / Otra' : '');
      return `<tr><td>${q.tipo!=='info'?n:''}</td><td>${md(q.titulo)}${q.ayuda?` <span class="note">(${md(q.ayuda)})</span>`:''}${o?' *':''}</td><td>${TT[q.tipo]||esc(q.tipo)}</td><td>${op}</td></tr>`;
    }).join('');
    h += `<div class="card anx ${fi===0?'anx-p':''}"><h2>${esc(f.id)} · ${esc(f.titulo)}</h2><div class="am">${esc(meta)}</div>
      ${f.enlace?`<p>Ya creado: <a href="${esc(f.enlace)}" target="_blank" rel="noopener">${esc(f.enlace)}</a></p>`:''}${f.descripcion?`<p>${md(f.descripcion)}</p>`:''}
      <table class="w"><thead><tr><th>Nº</th><th>Pregunta</th><th>Respuesta</th><th>Opciones</th></tr></thead><tbody>${rows}</tbody></table>
      ${f.confirmacion?`<div class="am">Mensaje final: ${md(f.confirmacion)}</div>`:''}${ob?'<div class="am">* Respuesta obligatoria.</div>':''}</div>`;
  });
  $('#p-anx').innerHTML = h;
})();

/* ---------- Exportar PDF: todo desplegado + glosario con el texto oficial ---------- */
function prepararImpresion(){
  openAll();
  const ORD = {ce:0, cr:1, sb:2, de:3};
  const codes = [...new Set([...document.querySelectorAll('main .chip[data-code]')].map(c=>c.dataset.code))].filter(c=>CUR[c])
    .sort((a,b)=> (ORD[CUR[a].tipo]-ORD[CUR[b].tipo]) || a.localeCompare(b, 'es', {numeric:true}));
  $('#gloss').innerHTML = `<h2>Glosario: texto oficial de los códigos</h2><p class="note">Orden de 30 de mayo de 2023 (Andalucía). En la web, estos textos aparecen al pulsar cada código.</p>
    <dl>${codes.map(c=>`<dt>${esc(c)} · ${esc(KIND[CUR[c].tipo]||'')}</dt><dd>${esc(CUR[c].texto)}</dd>`).join('')}</dl>`;
}
addEventListener('beforeprint', prepararImpresion);   // también con Ctrl+P
function exportarPDF(){
  prepararImpresion();
  const t = document.title; document.title = (M.titulo || 'SdA').replace(/[\\/:*?"<>|]/g, '');
  setTimeout(() => { window.print(); document.title = t; }, 50);
}
</script>
