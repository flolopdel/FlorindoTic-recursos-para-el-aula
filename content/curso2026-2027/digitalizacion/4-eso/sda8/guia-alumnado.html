po": "narrador", "texto": "Todo lo que montes lo irás anotando en el **informe A1**. Ábrelo antes de empezar y tenlo a mano: al final de la sesión 3 lo entregarás en la Tarea 8.1."}]}, {"id": "2.1", "titulo": "Montamos la red", "fase": "Explorar", "sesiones": [2], "intro": "Igual que cada casa tiene calle y número para que llegue el correo, cada dispositivo de la red tiene una **dirección IP**. El router las reparte solo gracias al **DHCP**.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Montaje guiado de la red", "agrupamiento": "Individual", "tiempo": 20, "enunciado": "Repite cada paso **justo después** de verlo en el proyector.", "pasos": ["Coloca el **Home Router** (Network Devices → Wireless Devices).", "Añade **2 PC** y únelos al router con **cable directo** de cobre a los puertos Ethernet.", "Añade un **portátil**: en Physical, apágalo y cambia su tarjeta por la **WPC300N** (Wi-Fi).", "Añade un **smartphone** y comprueba en Config → Wireless0 que usa el SSID del router.", "En cada PC: Desktop → IP Configuration → **DHCP**.", "Comprueba que todos tienen una IP **192.168.0.x**."], "ayudas": [{"tipo": "pista", "titulo": "¿El portátil no se conecta?", "texto": "Apágalo con el botón de la pestaña Physical **antes** de cambiar la tarjeta, y vuelve a encenderlo después. Si un cable sale en rojo, espera unos segundos o revisa el puerto."}], "criterios": ["DIG.4.1.1"]}, {"tipo": "actividad", "numero": "2", "titulo": "¿Nos vemos? ipconfig y ping", "agrupamiento": "Individual", "tiempo": 10, "enunciado": "En el PC0 abre Desktop → Command Prompt. Escribe **ipconfig** y anota en la tabla del **informe A1** la IP de cada dispositivo. Después haz un **ping** a la IP del móvil: si vuelven los 4 paquetes, hay conexión. Guarda el archivo como **SdA8_red_Nombre_Apellido.pkt** en tu Drive.", "test": {"pregunta": "¿Qué hace el DHCP del router?", "opciones": ["Protege la red con contraseña", "Reparte automáticamente las direcciones IP", "Acelera el Wi-Fi"], "correcta": 1, "explicacion": "El **DHCP** asigna una IP libre a cada dispositivo que se conecta, sin escribirla a mano."}, "criterios": ["DIG.4.1.1"]}]}, {"id": "2.2", "titulo": "Internet y un router seguro", "fase": "Explorar", "sesiones": [3], "intro": "Escribes **tiktok.com** y no un número, igual que en WhatsApp buscas «Mamá» y no su teléfono. El **DNS** es la agenda de contactos de Internet: traduce el nombre a la IP del **servidor**, el ordenador que guarda la página y te la envía.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Conectamos la casa a «Internet»", "agrupamiento": "Individual", "tiempo": 18, "enunciado": "Añade un servidor web y abre **www.misitio.com** desde el móvil simulado. Haz una captura para el informe A1.", "pasos": ["Añade un **Server-PT** y únelo al puerto **Internet** del router.", "Router → GUI → Setup: **Static IP** 200.0.0.1 / 255.255.255.0 y **DNS 1 = 200.0.0.10**.", "Servidor: IP **200.0.0.10**, puerta de enlace 200.0.0.1.", "Servidor → Services → **DNS**: On, www.misitio.com → 200.0.0.10.", "Servidor → Services → **HTTP**: edita index.html con tu mensaje.", "Móvil → Desktop → Web Browser → **www.misitio.com**."], "ayudas": [{"tipo": "pista", "titulo": "¿La web no carga?", "texto": "Prueba antes con la IP **200.0.0.10** en el navegador del móvil. Si carga con la IP pero no con el nombre, revisa el registro DNS y el DNS 1 del router."}], "criterios": ["DIG.4.1.1"]}, {"tipo": "multinivel", "numero": "2", "titulo": "¿Qué opinas de mi nueva contraseña?", "agrupamiento": "Individual", "enunciado": "Antes de proteger tu Wi-Fi, comprueba que sabes distinguir una contraseña robusta. Elige **una opción**.", "opciones": [{"letra": "A", "titulo": "Recuerda", "proceso": "Recordar", "enunciado": "¿Cuál de estas contraseñas protegería bien tu Wi-Fi?", "test": {"opciones": ["123456789", "Azucenatequiero", "07-04-11", "C78-wk?2Tq"], "correcta": 3, "explicacion": "La buena mezcla **mayúsculas, minúsculas, números y símbolos**. Las otras son una de las más usadas del mundo, un nombre con palabras fáciles y una fecha."}}, {"letra": "B", "titulo": "Analiza", "proceso": "Analizar", "enunciado": "Explica en tu cuaderno por qué **Contraseña**, **Edelmiro-2011** y **soyelamo** no son seguras: ¿qué haría alguien para adivinarlas?"}, {"letra": "C", "titulo": "Crea y justifica", "proceso": "Crear", "enunciado": "Inventa una contraseña robusta para el **Wi-Fi de tu casa** y otra para tu **TikTok** (¡no las uses de verdad!). Explica qué reglas has seguido y cómo las recordarías sin apuntarlas."}], "ayudas": [{"tipo": "pista", "titulo": "Truco para una contraseña robusta", "texto": "Une tres palabras que recuerdes, un número y un símbolo: **Gato-Playa-Bici-27!** Nunca tu nombre, tu fecha de nacimiento ni la misma contraseña en todas partes."}], "criterios": ["DIG.4.3.2"]}, {"tipo": "actividad", "numero": "3", "titulo": "Protegemos el Wi-Fi y el router", "agrupamiento": "Individual", "tiempo": 12, "enunciado": "Pon a tu red un **SSID sin datos personales**, seguridad **WPA2 Personal** y una contraseña de **12 caracteres o más**. Cambia también la contraseña del router (viene de fábrica como «admin») y vuelve a conectar el portátil y el móvil.", "pasos": ["Router → GUI → Wireless: SSID y WPA2 Personal + contraseña.", "Router → GUI → Administration: nueva contraseña.", "Portátil y móvil → Config → Wireless0 → WPA2-PSK y la contraseña.", "Comprueba con ping que siguen conectados."], "criterios": ["DIG.4.3.2"]}, {"tipo": "actividad", "numero": "4", "titulo": "Informe y entrega", "agrupamiento": "Individual", "tiempo": 13, "enunciado": "Completa el **informe A1** con la tabla de IP, las tres capturas y las preguntas. Revisa la lista «Antes de entregar» y sube el **.pkt** y el **PDF**.", "entrega": "Tarea 8.1 · Mi red doméstica conectada y protegida", "criterios": ["DIG.4.1.1", "DIG.4.3.2"]}], "ayudas": [{"tipo": "saber_mas", "titulo": "Verificación en dos pasos (2FA)", "texto": "Una contraseña robusta es la primera barrera; la **verificación en dos pasos** es la segunda: además de la contraseña te piden un código, tu huella o tu cara. Aunque alguien adivine tu contraseña, no podrá entrar. Actívala en Instagram, TikTok y tu correo."}, {"tipo": "emociones", "titulo": "¡Sigue así!", "texto": "Si has llegado hasta aquí, ya has montado una red completa, la has conectado a Internet y la has protegido. Eso es lo que hace un técnico de redes. Cuando algo no salga a la primera, recuerda: **probar, fallar y volver a probar** también es aprender."}, {"tipo": "repaso", "titulo": "Reviso lo que aprendo", "puntos": ["¿Qué hacen el DNS y el servidor web?", "¿Qué tres cosas protegen un Wi-Fi?", "¿El router de tu casa tiene la contraseña de fábrica? ¿Sabrías comprobarlo con ayuda de un adulto?"]}]}, {"id": "3", "titulo": "¿Controlas las redes? No dejes que te controlen", "fase": "Estructurar", "sesiones": [4, 5, 6], "intro": "Ya sabes cómo viaja la información. Pero estar conectado también te expone a otros peligros: **fraudes**, **pérdida de privacidad**, **suplantación**, **acoso**, **control abusivo** o **dependencia**. En este apartado vas a convertirte en investigador o investigadora de dos de ellos.", "bloques": [{"tipo": "narrador", "texto": "Con tu pareja sortearéis **un tema de la lista A** (fraudes y ataques) y **otro de la lista B** (salud y convivencia). Los dos investigaréis los mismos temas, pero **cada persona entrega su propia ficha A2**."}]}, {"id": "3.1", "titulo": "¿Real o fraude? Mi privacidad", "fase": "Estructurar", "sesiones": [4], "intro": "Un SMS de un paquete que no esperabas, un sorteo de un iPhone, un «amigo» que te pide un código… Los ciberdelincuentes usan siempre las mismas pistas: **urgencia**, **premios**, **enlaces raros** y **peticiones de códigos**.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "¿Real o fraude?", "agrupamiento": "Gran grupo", "tiempo": 12, "enunciado": "Vota en el quiz de la web de clase si cada mensaje es real o un fraude y di qué pista lo delata.", "test": {"pregunta": "Un «amigo» te escribe por WhatsApp: «Te ha llegado un código por SMS por error, ¿me lo pasas?». ¿Qué haces?", "opciones": ["Se lo paso, es mi amigo", "No lo paso y le llamo por otra vía para comprobarlo", "Le pido que me lo explique por WhatsApp"], "correcta": 1, "explicacion": "Ese código sirve para **robar tu cuenta de WhatsApp**. Nunca se comparte. Si dudas, comprueba por **otra vía**."}, "criterios": ["DIG.4.3.3"]}, {"tipo": "actividad", "numero": "2", "titulo": "Me busco a ver si me encuentro", "agrupamiento": "Individual", "tiempo": 5, "enunciado": "Busca tu nombre y apellidos **entre comillas** en el buscador. Anota en tu cuaderno qué aparece de ti (imágenes, vídeos, comentarios, listados) y si te gusta la imagen que da de ti.", "criterios": ["DIG.4.3.1"]}, {"tipo": "actividad", "numero": "3", "titulo": "Reviso mi privacidad", "agrupamiento": "Individual", "tiempo": 8, "enunciado": "Revisa **en privado** tu TikTok o tu Instagram (o tu cuenta de Google del centro si no tienes redes) y marca en el cuaderno lo que hayas cambiado.", "pasos": ["Cuenta **privada**.", "Quién puede escribirme, comentar y hacer dúos: **amigos** o nadie.", "**Ubicación** desactivada y sin descargas de mis vídeos.", "**Verificación en dos pasos** activada.", "Cerrar las **sesiones abiertas** en otros dispositivos."], "criterios": ["DIG.4.3.1"]}, {"tipo": "texto", "titulo": "El catálogo de amenazas", "puntos": ["**Lista A · Fraudes y ataques**: phishing, smishing y vishing · fraude con códigos QR · malware y ransomware · suplantación de identidad · estafas en compras y sorteos falsos.", "**Lista B · Salud y convivencia**: ciberacoso · grooming · sextorsión · cibercontrol en la pareja · fake news y deepfakes · retos virales peligrosos · dependencia de las pantallas."]}, {"tipo": "actividad", "numero": "4", "titulo": "Primeras fuentes fiables", "agrupamiento": "Individual", "tiempo": 12, "enunciado": "Busca la **definición** de tus dos temas en **incibe.es**, **osi.es** o **is4k.es** y empieza la parte 1 de la **ficha A2**. Escríbela con **tus palabras**.", "ayudas": [{"tipo": "pista", "titulo": "¿Es una fuente fiable?", "puntos": ["¿Quién lo publica? Un organismo oficial o un medio conocido.", "¿Tiene fecha reciente?", "¿Cita de dónde saca los datos?"]}], "criterios": ["DIG.4.3.3"]}]}, {"id": "3.2", "titulo": "Investigo mis dos amenazas", "fase": "Estructurar", "sesiones": [5], "intro": "Para que tu vídeo sea útil, de cada amenaza tienes que saber cinco cosas: **qué es**, **un caso real**, **qué riesgos tiene**, **cómo se previene** y **qué hacer si ya ha pasado**.", "bloques": [{"tipo": "texto", "titulo": "Tipos de malware (lista A)", "puntos": ["**Virus**: alteran el funcionamiento y dañan archivos; necesitan que alguien los abra para extenderse.", "**Troyanos**: se esconden en un programa que parece inofensivo y dan el control del equipo a otra persona.", "**Spyware**: espían lo que haces y roban tus datos; los *keyloggers* registran lo que tecleas.", "**Ransomware**: cifran tus archivos y piden dinero por recuperarlos. Llegan en adjuntos o descargas poco fiables."]}, {"tipo": "texto", "titulo": "Formas de violencia en la red (lista B)", "puntos": ["**Ciberacoso**: daño repetido a una persona a través de redes, mensajes o juegos, por una o varias personas, a veces anónimas.", "**Sextorsión**: amenazar con difundir imágenes íntimas si no se hace lo que pide el agresor. Es un **delito**.", "**Grooming**: un adulto se gana la confianza de un menor por internet, a menudo con un perfil falso, para abusar de él. Es un **delito**.", "**Cibercontrol**: controlar a la pareja con el móvil (pedir contraseñas, revisar la ubicación, decidir a quién sigue). **Quien te quiere no te controla.**"]}, {"tipo": "actividad", "numero": "1", "titulo": "Investigo mi tema de la lista A", "agrupamiento": "Individual", "tiempo": 17, "enunciado": "Responde las cinco preguntas de tu tema de la **lista A** en la **ficha A2** y pon el **enlace** del caso real.", "pasos": ["Busca el caso en un medio conocido o en la web de la Policía Nacional o la Guardia Civil.", "Riesgos: dispositivo, dinero, datos.", "Tres medidas de prevención.", "Qué hacer: cambiar contraseñas, avisar al banco, denunciar, llamar al 017."], "criterios": ["DIG.4.3.3"]}, {"tipo": "actividad", "numero": "2", "titulo": "Investigo mi tema de la lista B", "agrupamiento": "Individual", "tiempo": 18, "enunciado": "Ahora tu tema de la **lista B**. Piensa en cómo afecta a la **salud** y a la **convivencia**.", "pasos": ["Riesgos: ansiedad, aislamiento, daño a otras personas.", "Qué hacer: no responder, **guardar pruebas**, bloquear.", "Contarlo a un adulto de confianza.", "ANAR **900 20 20 10** · Ciberseguridad **017**."], "test": {"pregunta": "Tu pareja te dice: «Si de verdad me quieres, dame las contraseñas de tus redes». ¿Qué es?", "opciones": ["Una prueba de confianza normal", "Cibercontrol: una forma de control abusivo", "Una broma sin importancia"], "correcta": 1, "explicacion": "Pedir contraseñas, revisar tu ubicación o decirte a quién seguir es **cibercontrol**: limita tu libertad."}, "criterios": ["DIG.4.3.3"]}], "ayudas": [{"tipo": "emociones", "titulo": "Si algo de esto te toca de cerca", "texto": "Algunos temas pueden recordarte cosas que te han pasado a ti o a alguien que conoces. Si te remueve, puedes pedir **cambiar de tema** sin dar explicaciones. Y si te está pasando, **no estás solo ni sola**: cuéntaselo a tu tutor o tutora, a Orientación o a tu familia, o llama al **017** o a **ANAR (900 20 20 10)**."}, {"tipo": "saber_mas", "titulo": "Programa ConRed", "texto": "La Junta de Andalucía tiene un programa para prevenir el acoso escolar y el ciberacoso en los institutos públicos: **ConRed**. Pregunta en Orientación si tu centro participa."}]}, {"id": "3.3", "titulo": "Bulos y comprobación", "fase": "Estructurar", "sesiones": [6], "intro": "Los bulos buscan **miedo o indignación** para que compartas sin pensar. Que lo hayan compartido miles de personas **no lo hace verdad**.", "bloques": [{"tipo": "texto", "titulo": "Regla de los cuatro pasos", "puntos": ["**¿Quién** lo dice? ¿Es un medio o un organismo conocido?", "**¿Cuándo?** ¿Es de ahora o es antiguo?", "Busca la noticia en **otro medio** o en Maldita.es o Newtral.", "Haz una **búsqueda inversa** de la imagen."]}, {"tipo": "actividad", "numero": "1", "titulo": "Termino mi investigación", "agrupamiento": "Individual", "tiempo": 17, "enunciado": "Termina tus **dos temas** de la ficha A2. Si acabas, añade un consejo pensado para alumnado de **1.º ESO**.", "criterios": ["DIG.4.3.3"]}, {"tipo": "multinivel", "numero": "2", "titulo": "Tú sí que sabes tratar las amenazas", "agrupamiento": "Individual", "enunciado": "Comprueba que sabes qué hacer ante el malware. Elige **una opción**.", "opciones": [{"letra": "A", "titulo": "Empareja", "proceso": "Recordar", "enunciado": "Te dejan un **USB** con el trabajo de mates. ¿Qué haces antes de abrirlo?", "test": {"opciones": ["Lo abro: es de un compañero", "Le paso el antivirus antes de abrir nada", "Lo formateo"], "correcta": 1, "explicacion": "Un USB puede traer malware aunque tu compañero no lo sepa. **Pásale el antivirus** antes de abrir los archivos. Las otras situaciones: si no actualizas, **actualiza el sistema y el antivirus**; si un juego te pide el móvil, **no lo des** (SMS de pago); si un vídeo te pide instalar algo, **no lo instales** y avisa."}}, {"letra": "B", "titulo": "Piensa", "proceso": "Analizar", "enunciado": "Elige una situación: ordenador sin actualizar desde hace meses, un juego que te pide tu móvil para desbloquear un nivel o un vídeo «alucinante» que te pide instalar algo. Explica en tu cuaderno qué podría pasar si no haces nada y qué harías tú, **paso a paso**."}], "criterios": ["DIG.4.3.3"]}, {"tipo": "actividad", "numero": "3", "titulo": "Reviso y entrego mi investigación", "agrupamiento": "Parejas", "tiempo": 18, "enunciado": "Intercambia tu ficha con tu pareja y comprobad la lista. Después exporta la ficha a **PDF** y súbela a Moodle.", "pasos": ["Dos temas, uno de cada lista.", "Cinco preguntas respondidas en cada tema.", "Caso real con **enlace** a una fuente fiable.", "Teléfonos de ayuda (017, ANAR)."], "entrega": "Tarea 8.2 · Investigación de mis dos ciberamenazas", "criterios": ["DIG.4.3.3"]}], "ayudas": [{"tipo": "repaso", "titulo": "Reviso lo que aprendo", "puntos": ["¿Qué pistas delatan un mensaje fraudulento?", "¿Sabrías explicar tus dos amenazas a alguien de 1.º ESO?", "¿Qué has cambiado en la privacidad de tus redes?", "¿Qué te ha resultado más difícil de investigar? ¿Por qué?"]}]}, {"id": "4", "titulo": "Nuestro vídeo concienciador", "fase": "Aplicar y comprobar", "sesiones": [7, 8], "intro": "¡Por fin ha llegado el momento! Con lo que sabes de redes y tus dos fichas, tu pareja y tú vais a crear un vídeo de **2-3 minutos** para el alumnado del instituto.", "bloques": [{"tipo": "narrador", "texto": "Repartíos los papeles: **guionista-locutor/a** (texto y voz sintética) y **animador/a-montador/a** (escenas y montaje). En la sesión 8 os cambiaréis 5 minutos para que los dos animéis."}]}, {"id": "4.1", "titulo": "Guion y voz con IA", "fase": "Aplicar y comprobar", "sesiones": [7], "intro": "Un buen vídeo corto engancha en los primeros segundos, cuenta pocas ideas y termina con un consejo claro.", "bloques": [{"tipo": "video", "titulo": "Analizamos un buen vídeo corto", "busqueda": "INCIBE is4k vídeo corto ciberseguridad adolescentes", "preguntas": ["¿Qué pasa en los primeros 5 segundos?", "¿Cuántas ideas cuenta?", "¿Qué consejo te llevas?"]}, {"tipo": "actividad", "numero": "1", "titulo": "Guion en pareja", "agrupamiento": "Parejas", "tiempo": 23, "enunciado": "Rellenad el **guion A3** con cinco escenas. Máximo **4 frases** de voz por escena: frases cortas, como si se lo contarais a alguien de 1.º.", "pasos": ["Gancho: una pregunta o una situación que enganche.", "Cómo funciona Internet: móvil → router → IP → DNS → servidor.", "Riesgo A y riesgo B: qué es, un caso y qué consecuencias tiene.", "Pautas: cómo prevenir y qué hacer, con 017 y ANAR."], "criterios": ["DIG.4.1.1", "DIG.4.3.3"]}, {"tipo": "actividad", "numero": "2", "titulo": "Voz sintética", "agrupamiento": "Parejas", "tiempo": 15, "enunciado": "Pega el texto de cada escena en **ElevenLabs** o **Speechgen.io** (con la cuenta que te indique el docente), elige una voz en español y descarga **un MP3 por escena** (escena1.mp3, escena2.mp3…).", "ayudas": [{"tipo": "saber_mas", "titulo": "¿Por qué no grabamos nuestra voz?", "texto": "La voz y la cara son **datos personales**. Si el vídeo se comparte, la voz sintética protege tu identidad y tu huella digital."}], "criterios": ["DIG.4.3.1"]}], "ayudas": [{"tipo": "emociones", "titulo": "Trabajar en pareja", "texto": "Cada persona tiene superpoderes: hay quien escribe muy bien y hay quien tiene buen ojo para el diseño. **Compartid lo que sabéis**, respetad las ideas del otro y sumad. ¡Juntos llegáis más lejos!"}]}, {"id": "4.2", "titulo": "Animamos el vídeo", "fase": "Aplicar y comprobar", "sesiones": [8], "intro": "En el autobús ves TikToks **sin sonido** y aun así los entiendes: tienen texto clave en pantalla e iconos. Vuestro vídeo también.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Montaje por escenas", "agrupamiento": "Parejas", "tiempo": 30, "enunciado": "Montad las **cinco escenas** del guion A3 en **Powtoon** o **Animaker** y apuntad de dónde sale cada imagen o música.", "pasos": ["Elige un fondo y un personaje de la biblioteca.", "Escribe la **idea clave** en pantalla (máx. 6 palabras).", "Añade iconos: router, candado, móvil, alerta.", "Importa el MP3 de la escena y ajusta la duración.", "**Nada de fotos** reales de personas."], "criterios": ["DIG.4.3.1", "DIG.4.3.3"]}, {"tipo": "actividad", "numero": "2", "titulo": "Revisión cruzada", "agrupamiento": "Parejas", "tiempo": 8, "enunciado": "Ved el borrador de otra pareja y dejad **un acierto** y **una mejora**.", "pasos": ["¿Se entiende cómo funciona Internet?", "¿Hay dos riesgos con consejos para prevenir y actuar?", "¿Aparece algún dato personal (nombre, cara, voz real, ubicación)?", "¿La voz se oye bien y va con las imágenes?"], "criterios": ["DIG.4.3.1"]}], "ayudas": [{"tipo": "saber_mas", "titulo": "Imágenes y música con permiso", "texto": "Usa la biblioteca de la herramienta o busca en **Openverse** o Pixabay. Anota el nombre del recurso, dónde lo encontraste, su autoría y su licencia en la tabla de créditos del guion A3, y ponlos al final del vídeo."}]}, {"id": "5", "titulo": "Estreno y ¿todo bien?", "fase": "Concluir", "sesiones": [9], "intro": "¡Enhorabuena! Al principio parecía complicado y ahora tienes un vídeo que puede ayudar a otros estudiantes. Es el momento de estrenarlo, decidir cómo se difunde y pensar en todo lo que has aprendido.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Entregamos el vídeo", "agrupamiento": "Parejas", "tiempo": 12, "enunciado": "Revisad la lista «Antes de entregar» del guion A3, exportad el vídeo y entregad **una vez por pareja**: enlace o MP4 + guion A3 en PDF.", "entrega": "Tarea 8.3 · Vídeo «Conectados y protegidos»", "criterios": ["DIG.4.1.1", "DIG.4.3.1", "DIG.4.3.3"]}, {"tipo": "actividad", "numero": "2", "titulo": "Estreno y coevaluación", "agrupamiento": "Gran grupo", "tiempo": 22, "enunciado": "Después de cada vídeo, valóralo en el **formulario F2** (anónimo). Valora el vídeo, no a las personas.", "criterios": ["DIG.4.3.3"]}, {"tipo": "actividad", "numero": "3", "titulo": "Difusión segura", "agrupamiento": "Gran grupo", "tiempo": 6, "enunciado": "¿Dónde publicamos los vídeos? **Sí**: Moodle, la pantalla del vestíbulo o la web del centro con permiso de Orientación. **No**: perfiles personales de TikTok o Instagram, grupos de WhatsApp abiertos ni con nombres, caras o comentarios abiertos.", "test": {"pregunta": "¿Por qué no subimos el vídeo a nuestras propias redes?", "opciones": ["Porque es aburrid   const k = pageKey(a);
  let h = `<div class="page-h" style="--fc:${fcol(a.fase)}"><div class="k">${esc(a.fase || '')}${a.sesiones ? ' · ' + sesTxt(a.sesiones) : ''}</div><h2>${esc(a.id)}. ${esc(a.titulo)}</h2></div>`;
  if (a.intro) h += B.narrador({texto: a.intro, icono: a.icono || G.icono});
  arr(a.bloques).forEach((b, j) => { const f = B[b.tipo]; if (f) h += f(b, k + '-' + j); });
  h += ayudas(a.ayudas);
  return `<div style="--fc:${fcol(a.fase)}">${h}</div>`;
}
function creditos(){
  const C = D.creditos || {}, o = C.original || {}, A = C.adaptacion || {}, L = C.licencia || {};
  let h = `<div class="page-h"><div class="k">Licencia y autoría</div><h2>Créditos</h2></div>`;
  if (o.titulo) h += `<div class="card"><h3>Recurso original</h3><p>Esta situación de aprendizaje es una adaptación de <b>«${esc(o.titulo)}»</b>${o.organizacion ? ' (' + esc(o.organizacion) + ')' : ''}.</p>
    <div class="scroll"><table class="tbl"><tbody>${arr(o.personas).map(x=>`<tr><th>${esc(x.funcion)}</th><td>${esc(x.nombres)}</td></tr>`).join('')}${o.version ? `<tr><th>Versión original</th><td>${esc(o.version)}</td></tr>` : ''}</tbody></table></div></div>`;
  if (A.autoria || A.cambios) h += `<div class="card"><h3>Adaptación</h3>${A.autoria ? `<p><b>${esc(A.autoria)}</b>${A.fecha ? ' · ' + esc(A.fecha) : ''}</p>` : ''}${A.cambios ? paras(A.cambios) : ''}</div>`;
  if (L.nombre) h += `<div class="card"><h3>Licencia</h3><p>${L.url ? `<a href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.nombre)}</a>` : esc(L.nombre)}</p>${L.nota ? paras(L.nota) : ''}${o.cita ? `<p class="note">${esc(o.cita)}</p>` : ''}</div>`;
  if (arr(C.recursos).length) h += `<div class="card"><h3>Recursos de terceros</h3><div class="scroll"><table class="tbl"><thead><tr><th>Recurso</th><th>Autoría</th><th>Licencia</th></tr></thead><tbody>${C.recursos.map(r=>`<tr><td>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.elemento)}</a>` : esc(r.elemento)}</td><td>${esc(r.autoria)}</td><td>${esc(r.licencia)}</td></tr>`).join('')}</tbody></table></div></div>`;
  return h;
}
const PAGES = [{k:'inicio', t:'Inicio', r:inicio}].concat(APS.map(a => ({k:pageKey(a), t:`${a.id}. ${a.titulo}`, a, r:() => apartado(a)})))
  .concat(D.creditos ? [{k:'creditos', t:'Créditos', r:creditos}] : []);

function toc(cur){
  let h = '', fz = null;
  PAGES.forEach(p => {
    if (p.a && p.a.fase !== fz) { fz = p.a.fase; h += `<div class="fz" style="--fc:${fcol(fz)}">${esc(fz || '')}</div>`; }
    if (!p.a && p.k === 'creditos') h += '<div class="fz">&nbsp;</div>';
    const depth = p.a ? String(p.a.id).split('.').length - 1 : 0;
    h += `<a href="#${p.k}" class="${p.k === cur ? 'on' : ''} ${depth === 1 ? 'sub' : depth > 1 ? 'sub2' : ''}" style="--fc:${p.a ? fcol(p.a.fase) : 'var(--brand)'}">${esc(p.t)}</a>`;
  });
  $('#toc').innerHTML = h;
}
function show(k){
  const i = Math.max(0, PAGES.findIndex(p => p.k === k)), p = PAGES[i], pv = PAGES[i-1], nx = PAGES[i+1];
  $('#app').innerHTML = `<div class="page">${p.r()}</div><div class="pager">${pv ? `<a href="#${pv.k}"><small>← Anterior</small>${esc(pv.t)}</a>` : ''}${nx ? `<a class="r" href="#${nx.k}"><small>Siguiente →</small>${esc(nx.t)}</a>` : ''}</div>`;
  $('#ttl').textContent = p.k === 'inicio' ? (D.meta.titulo || '') : p.t;
  toc(p.k); document.body.classList.remove('menu'); window.scrollTo(0, 0); setHash('#' + p.k);
}
function printAll(){ $('#app').innerHTML = PAGES.map(p => `<div class="page">${p.r()}</div>`).join(''); document.querySelectorAll('details').forEach(d => d.open = true); window.print(); }

// --------------------------------------------------- eventos
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a) { const k = a.getAttribute('href').slice(1); if (PAGES.some(p => p.k === k)) { e.preventDefault(); try { history.pushState(null, '', '#' + k); } catch(_) {} show(k); } return; }
  const t = e.target.closest('[data-ml]');
  if (t) { const key = t.dataset.ml, j = +t.dataset.j; store[key + '-o'] = j; save();
    document.querySelectorAll(`[data-ml="${key}"]`).forEach(x => x.setAttribute('aria-selected', +x.dataset.j === j));
    document.querySelectorAll(`[data-mlo="${key}"]`).forEach(x => x.classList.toggle('on', +x.dataset.j === j)); return; }
  const c = e.target.closest('[data-check]');
  if (c) { const q = c.closest('.quiz'), ok = q.dataset.ok.split(',').map(Number), fb = q.querySelector('.fb');
    const marked = [...q.querySelectorAll('input')].filter(x => x.checked).map(x => +x.value);
    q.querySelectorAll('label').forEach((l, j) => { l.classList.remove('ok','ko'); if (ok.includes(j)) l.classList.add('ok'); else if (marked.includes(j)) l.classList.add('ko'); });
    const bien = marked.length === ok.length && marked.every(x => ok.includes(x));
    fb.className = 'fb on ' + (bien ? 'ok' : 'ko');
    fb.innerHTML = (bien ? '<b>¡Muy bien!</b> ' : '<b>Revísalo:</b> las respuestas correctas están en verde. ') + md(fb.dataset.expl || ''); return; }
  const v = e.target.closest('.vid .play');
  if (v) { const box = v.closest('.vid'); box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${box.dataset.yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe>`; }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.done; if (k) { store[k] = e.target.checked; save(); } });
$('#b-menu').onclick = () => document.body.classList.toggle('menu');
$('#b-print').onclick = printAll;
$('#b-theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('guia-theme', r.dataset.theme); } catch(e) {} };
try { const t = localStorage.getItem('guia-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
if (D.url_clase) $('#b-clase').href = D.url_clase; else $('#b-clase').style.display = 'none';
// Atrás / adelante del navegador y enlaces directos (#a-3.1, #creditos)
addEventListener('hashchange', () => { let k = ''; try { k = location.hash.slice(1); } catch(e) {} if (PAGES.some(p => p.k === k)) show(k); });
addEventListener('popstate', () => { let k = ''; try { k = location.hash.slice(1); } catch(e) {} show(PAGES.some(p => p.k === k) ? k : 'inicio'); });
let h0 = ''; try { h0 = location.hash.slice(1); } catch(e) {}
show(PAGES.some(p => p.k === h0) ? h0 : 'inicio');
</script>
</body>
