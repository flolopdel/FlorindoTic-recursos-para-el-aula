 montaje."}], "recursos": ["Aula de informática", "Cisco Packet Tracer (o Filius)", "Moodle Centros", "Google Workspace del centro", "Powtoon o Animaker", "ElevenLabs o Speechgen.io", "Canva para Educación y Genially", "Webs de INCIBE, OSI e is4k", "Proyector y altavoces"], "fases": [{"nombre": "Movilizar y activar", "sesiones": "1", "finalidad": "Presentar el reto de Orientación, despertar el interés y activar lo que ya sabemos de redes (encuesta inicial y LAN/WAN)"}, {"nombre": "Explorar", "sesiones": "2-3", "finalidad": "Montar, conectar a Internet y proteger una red doméstica en Packet Tracer"}, {"nombre": "Estructurar", "sesiones": "4-6", "finalidad": "Reconocer fraudes y bulos, cuidar la privacidad e investigar dos ciberamenazas"}, {"nombre": "Aplicar y comprobar", "sesiones": "7-8", "finalidad": "Guion, locución sintética y animación del vídeo concienciador en pareja"}, {"nombre": "Concluir", "sesiones": "9", "finalidad": "Estreno, difusión segura, coevaluación y reflexión sobre lo aprendido"}], "sesiones": [{"n": 1, "fase": "Movilizar y activar", "titulo": "¿Qué pasa cuando abro TikTok? Redes LAN, WAN e Internet", "reto": "Entender el reto de la SdA, contar cómo nos conectamos y dibujar el camino de un vídeo desde el servidor hasta nuestro móvil.", "actividades": [{"nombre": "Gancho: el viaje de un vídeo", "min": 8, "desc": "El docente proyecta un TikTok cualquiera (sin datos de nadie) y pregunta: «¿De dónde ha salido este vídeo? ¿Por dónde ha pasado hasta llegar aquí?». Se anotan las ideas en la pizarra sin corregir. Se presenta el reto: Orientación nos pide vídeos para la semana de la convivencia digital."}, {"nombre": "Encuesta inicial anónima", "min": 8, "desc": "El alumnado responde el formulario F1 (anónimo) sobre cómo se conecta en casa, qué redes sociales usa, cuántas horas al día y si ha recibido mensajes sospechosos. El docente proyecta después los resultados agregados para comentarlos."}, {"nombre": "LAN, WAN e Internet con la casa de cada uno", " r de casa** (o a la antena 4G/5G), la petición viaja por la red de tu compañía hasta los **servidores** de TikTok y el vídeo vuelve por el mismo camino, troceado en paquetes.", "pregunta": "¿Cuántas «paradas» crees que hace por el camino?"}, {"tipo": "practica", "titulo": "Encuesta inicial (anónima)", "tiempo": 8, "enunciado": "Responde con sinceridad: es **anónima** y nos sirve para preparar la SdA. Al terminar veremos los resultados de la clase, nunca respuestas de nadie en concreto.", "entrega": "Formulario F1 · Encuesta inicial"}, {"tipo": "infografia", "titulo": "De la red de casa a Internet", "svg": "<svg viewBox=\"0 0 640 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"La red de casa (LAN) con móvil, portátil y consola conectados al router; el router conecta por la red de la compañía (WAN) con Internet y los servidores de TikTok\"><rect x=\"10\" y=\"20\" width=\"230\" height=\"180\" rx=\"14\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:3\"/><text x=\"125\" y=\"45\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 18px system-ui\">LAN · tu casa<\/text><text x=\"60\" y=\"95\" text-anchor=\"middle\" style=\"font:28px system-ui\">📱<\/text><text x=\"60\" y=\"170\" text-anchor=\"middle\" style=\"font:28px system-ui\">💻<\/text><text x=\"115\" y=\"132\" text-anchor=\"middle\" style=\"font:28px system-ui\">🎮<\/text><rect x=\"160\" y=\"105\" width=\"70\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--brand);stroke-width:3\"/><text x=\"195\" y=\"130\" text-anchor=\"middle\" style=\"fill:var(--ink);font:600 14px system-ui\">Router<\/text><path d=\"M240 125 L400 125\" style=\"stroke:var(--accent);stroke-width:4;fill:none;stroke-dasharray:10 8\"/><text x=\"320\" y=\"112\" text-anchor=\"middle\" style=\"fill:var(--accent);font:700 16px system-ui\">WAN · fibra de la compañía<\/text><ellipse cx=\"500\" cy=\"125\" rx=\"125\" ry=\"80\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:3\"/><text x=\"500\" y=\"110\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 18px system-ui\">Internet<\/text><text x=\"500\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:600 15px system-ui\">red de redes<\/text><text x=\"500\" y=\"170\" text-anchor=\"middle\" style=\"fill:var(--ink);font:600 15px system-ui\">🖥️ servidores de TikTok<\/text><\/svg>", "nota": "Señalar que el router es la «puerta» entre la LAN y la WAN. En el instituto pasa lo mismo, con más dispositivos."}, {"tipo": "practica", "titulo": "¿LAN o WAN?", "tiempo": 6, "enunciado": "Clasifica cada situación en **LAN** (red local) o **WAN** (red extensa). Lo corregimos en voz alta.", "pasos": ["Mandas una foto por AirDrop o Quick Share a tu amigo, al lado.", "Juegas online con alguien de Sevilla.", "La impresora del aula imprime desde tu ordenador.", "Ves una serie en Netflix.", "Tu móvil se conecta al Wi-Fi de casa.", "Tu compañía de fibra une tu barrio con la central."], "ayudas": [{"tipo": "pista", "titulo": "Solución para comprobar", "texto": "LAN: 1, 3 y 5. WAN: 2, 4 y 6."}]}, {"tipo": "comparar", "titulo": "Cable o Wi-Fi", "columnas": [{"titulo": "Por cable (Ethernet)", "icono": "🔌", "puntos": ["Más **estable** y rápido", "Ideal para PC fijo, consola y tele", "Hay que llevar el cable"]}, {"titulo": "Inalámbrico (Wi-Fi)", "icono": "📶", "puntos": ["**Movilidad**: móvil, tablet, portátil", "Paredes e interferencias lo frenan", "Si no tiene contraseña fuerte, **cualquiera** se cuela"]}], "pregunta": "¿Qué dispositivos de tu casa conectarías por cable?"}, {"tipo": "quiz", "pregunta": "¿Qué aparato une la red de tu casa con Internet?", "opciones": ["El móvil", "El router", "El servidor de TikTok"], "correcta": 1, "explicacion": "El **router** es la puerta entre tu LAN y la red de tu compañía, que te lleva a Internet."}]}, "moodle": []}, {"n": 2, "fase": "Explorar", "titulo": "Montamos la red de casa en Packet Tracer", "reto": "Construir en el simulador una red doméstica con router inalámbrico, dos ordenadores por cable, un portátil y un móvil por Wi-Fi, y comprobar que se comunican.", "actividades": [{"nombre": "Recordamos la red de casa", "min": 5, "desc": "Dos o tres estudiantes enseñan su dibujo de la sesión anterior. El docente lo relaciona con lo que vamos a montar: la misma casa, pero en el simulador."}, {"nombre": "Conocemos Packet Tracer", "min": 10, "desc": "Demostración en el proyector: barra de dispositivos (Network Devices → Wireless Devices → Home Router; End Devices → PC, Laptop, Smartphone), cables (Connections → cable directo de cobre) y modo tiempo real. El alumnado lo repite en su ordenador a la vez."}, {"nombre": "Montaje guiado de la red", "min": 20, "desc": "Paso a paso, todos a la vez: colocar el Home Router, dos PC conectados por cable directo a los puertos Ethernet del router, un portátil y un smartphone. Al portátil se le cambia la tarjeta por una inalámbrica (pestaña Physical, apagar, quitar la de cable y poner la WPC300N). En el móvil y el portátil, Config → Wireless0 → SSID por defecto del router. Cada PC: Desktop → IP Configuration → DHCP. Se comprueba que todos los dispositivos tienen una IP 192.168.0.x."}, {"nombre": "¿Nos vemos? ping e ipconfig", "min": 10, "desc": "En el PC0, Desktop → Command Prompt: «ipconfig» para ver su IP, máscara y puerta de enlace, y «ping» a la IP del móvil. El alumnado anota las IP de todos sus dispositivos en la tabla de la plantilla A1 (empiezan a rellenarla hoy). Quien termina antes cambia el nombre de los dispositivos (Mi PC, Móvil de casa…)."}, {"nombre": "Guardar y salida", "min": 5, "desc": "Se guarda el archivo como «SdA8_red_Nombre_Apellido.pkt» en Google Drive del centro. Pregunta de salida: ¿qué hace el DHCP del router?"}], "criterios": ["DIG.4.1.1"], "saberes": ["DIG.4.A.3"], "metodologia": ["Instrucción guiada con modelado", "Simulación"], "evidencias": ["Archivo .pkt con la red montada", "Tabla de direcciones IP (Plantilla A1, parte 1)"], "recursos": ["Packet Tracer", "Proyector", "Plantilla A1"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Cada paso se modela en el proyector y queda en la diapositiva de pasos; archivo base con el router ya colocado para quien se pierda; tarjeta de ayuda con las rutas de menús en español e inglés."}, "ejercicios": ["Monta una red doméstica con un router inalámbrico, dos PC por cable, un portátil y un móvil por Wi-Fi.", "Configura los PC con DHCP y anota la IP de cada dispositivo en la tabla de la plantilla A1.", "Comprueba con ping que el PC0 se comunica con el móvil."], "clase": {"pregunta": "¿Cómo sabe el router a qué móvil mandar cada vídeo?", "diapositivas": [{"tipo": "ejemplo", "icono": "📮", "titulo": "Cada casa tiene su dirección", "situacion": "El cartero sabe a qué buzón llevar cada carta porque cada casa tiene **calle y número**.", "explicacion": "En la red, cada dispositivo tiene una **dirección IP** (por ejemplo 192.168.0.101). El router las reparte solo gracias al **DHCP**, como un conserje que asigna buzones."}, {"tipo": "pasos", "titulo": "Montaje guiado de la red", "progresivo": true, "pasos": ["Coloca el **Home Router** (Network Devices → Wireless Devices).", "Añade **2 PC** y únelos al router con **cable directo** de cobre a los puertos Ethernet.", "Añade un **portátil**: en Physical, apágalo y cambia su tarjeta por la **WPC300N** (Wi-Fi).", "Añade un **smartphone**: en Config → Wireless0 comprueba que usa el SSID del router.", "En cada PC: Desktop → IP Configuration → **DHCP**.", "Comprueba que todos tienen una IP **192.168.0.x**."]}, {"tipo": "practica", "titulo": "Montaje guiado de la red", "tiempo": 20, "enunciado": "Repite cada paso **justo después** de verlo en el proyector. Si un cable sale en rojo, espera unos segundos o revisa el puerto.", "material": ["Packet Tracer", "Plantilla A1 (tabla de IP)"], "ayudas": [{"tipo": "pista", "titulo": "¿El portátil no se conecta?", "texto": "Apágalo con el botón de la pestaña Physical **antes** de cambiar la tarjeta, y vuelve a encenderlo después."}], "enlace": "https://docs.google.com/document/d/1oLF7qn6U-2EV4B8YuBwBT27pydv-cnXpuwJbBC_MK04/copy"}, {"tipo": "codigo", "titulo": "¿Nos vemos? ipconfig y ping", "codigo": "C:\\> ipconfig\n   IPv4 Address......: 192.168.0.100\n   Subnet Mask.......: 255.255.255.0\n   Default Gateway...: 192.168.0.1\n\nC:\\> ping 192.168.0.102\n   Reply from 192.168.0.102: bytes=32 time=12ms\n   Packets: Sent = 4, Received = 4, Lost = 0", "explicacion": ["**ipconfig** muestra la IP del equipo y la del router (puerta de enlace).", "**ping** manda 4 mensajes de prueba: si vuelven los 4, hay conexión.", "Si sale «Request timed out», revisa cables, Wi-Fi o DHCP."], "pregunta": "¿Qué IP tiene el router en tu red?"}, {"tipo": "practica", "titulo": "Anota tus IP y prueba el ping", "tiempo": 10, "enunciado": "Escribe en la **tabla de la plantilla A1** la IP de cada dispositivo y haz un **ping** del PC0 al móvil. Guarda el archivo como **SdA8_red_Nombre_Apellido.pkt** en tu Drive.", "pasos": ["Desktop → Command Prompt → ipconfig", "Anota la IP en la tabla A1", "ping a la IP del móvil", "Guardar en Drive"]}, {"tipo": "quiz", "pregunta": "¿Qué hace el DHCP del router?", "opciones": ["Protege la red con contraseña", "Reparte automáticamente las direcciones IP", "Acelera el Wi-Fi"], "correcta": 1, "explicacion": "El **DHCP** asigna una IP libre a cada dispositivo que se conecta, sin que tengamos que escribirla a mano."}]}, "moodle": []}, {"n": 3, "fase": "Explorar", "titulo": "Conectamos la casa a «Internet» y la protegemos", "reto": "Conectar la red doméstica a un servidor web simulado, abrir una página desde el móvil y proteger el Wi-Fi y el router con contraseñas seguras.", "actividades": [{"nombre": "¿Qué es un servidor y qué hace el DNS?", "min": 7, "desc": "Ejemplo: escribimos «tiktok.com» y no una IP; el DNS es la agenda de contactos de Internet que traduce el nombre a la IP del servidor. El servidor web es el ordenador que guarda la página y la envía."}, {"nombre": "Montamos Internet y el servidor web", "min": 18, "desc": "Paso a paso con el proyector: se añade un Server-PT y se conecta al puerto «Internet» del Home Router con cable directo. Router → GUI → Setup: Internet Connection type «Static IP», IP 200.0.0.1, máscara 255.255.255.0, y en DHCP Server Settings, DNS 1 = 200.0.0.10. Servidor: IP 200.0.0.10, puerta de enlace 200.0.0.1; Services → DNS: activado, registro www.misitio.com → 200.0.0.10; Services → HTTP: se edita index.html con un mensaje propio. Desde el smartphone: Desktop → Web Browser → www.misitio.com."}, {"nombre": "Protegemos el Wi-Fi y el router", "min": 12, "desc": "Juego rápido «¿Qué opinas de mi nueva contraseña?» (adaptado del REA «¿Controlas las redes? No dejes que te controlen»): se vota en el quiz cuál de cuatro contraseñas protegería el Wi-Fi y se explica por qué las otras no sirven. Después, Router → GUI → Wireless: SSID propio (sin nombre ni apellidos, p. ej. «CasaSegura_23»), Security Mode WPA2 Personal y una contraseña de al menos 12 caracteres con mayúsculas, números y símbolos. Administration: cambiar la contraseña de acceso al router («admin» por defecto). Volver a conectar el portátil y el móvil con la nueva contraseña (Config → Wireless0 → WPA2-PSK). Se explica por qué un Wi-Fi abierto o con la contraseña de fábrica es una puerta abierta."}, {"nombre": "Informe y entrega", "min": 13, "desc": "Cada estudiante completa la plantilla A1 (tabla de IP, capturas del ping, de la web abierta en el móvil y de la configuración WPA2, y tres preguntas cortas) y entrega en la Tarea 8.1 el archivo .pkt y el informe en PDF. Quien termine antes añade un segundo móvil de una visita y comprueba que sin contraseña no entra, o juega a «La Torre del Tesoro» de Interland (Be Internet Awesome, de Google), sobre contraseñas."}], "criterios": ["DIG.4.1.1", "DIG.4.3.2"], "saberes": ["DIG.4.A.3", "DIG.4.C.1"], "metodologia": ["Instrucción guiada con modelado", "Simulación"], "evidencias": ["Red con servidor web y Wi-Fi WPA2 (.pkt)", "Informe de la red (Plantilla A1)"], "recursos": ["Packet Tracer", "Plantilla A1", "Moodle (Tarea 8.1)"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Archivo base con el servidor ya colocado para quien no terminó la sesión 2; las respuestas del informe pueden escribirse o grabarse en audio; prórroga de la entrega en Moodle para quien lo necesite. Ampliación: segundo servidor con otra web o una red de invitados. Ampliación gamificada: «La Torre del Tesoro» de Interland."}, "ejercicios": ["Conecta un servidor web al router y abre www.misitio.com desde el móvil simulado.", "Protege el Wi-Fi con WPA2 y una contraseña robusta, y cambia la contraseña del router.", "Completa el informe A1 con capturas y entrégalo con el archivo .pkt en la Tarea 8.1."], "clase": {"pregunta": "¿Por qué escribes «tiktok.com» y no un número?", "diapositivas": [{"tipo": "ejemplo", "icono": "📒", "titulo": "La agenda de contactos de Internet", "situacion": "En WhatsApp buscas a **«Mamá»**, no te sabes su número de memoria.", "explicacion": "El **DNS** hace lo mismo: traduce **www.tiktok.com** a la IP del servidor. El **servidor web** es el ordenador que guarda la página y te la envía."}, {"tipo": "pasos", "titulo": "Montamos Internet y el servidor web", "progresivo": true, "pasos": ["Añade un **Server-PT** y únelo al puerto **Internet** del router.", "Router → GUI → Setup: **Static IP** 200.0.0.1 / 255.255.255.0 y **DNS 1 = 200.0.0.10**.", "Servidor: IP **200.0.0.10**, puerta de enlace 200.0.0.1.", "Servidor → Services → **DNS**: On, www.misitio.com → 200.0.0.10.", "Servidor → Services → **HTTP**: edita index.html con tu mensaje.", "Móvil → Desktop → Web Browser → **www.misitio.com**."]}, {"tipo": "practica", "titulo": "Montamos Internet y el servidor web", "tiempo": 18, "enunciado": "Sigue los pasos y **abre tu web desde el móvil**. Haz una captura para el informe A1.", "ayudas": [{"tipo": "pista", "titulo": "¿La web no carga?", "texto": "Prueba antes desde el móvil con la IP: **200.0.0.10**. Si carga con la IP pero no con el nombre, revisa el registro DNS y el DNS 1 del router."}], "enlace": "https://docs.google.com/document/d/1oLF7qn6U-2EV4B8YuBwBT27pydv-cnXpuwJbBC_MK04/copy"}, {"tipo": "quiz", "pregunta": "¿Cuál de estas contraseñas protegería bien tu Wi-Fi?", "opciones": ["123456789", "Azucenatequiero", "07-04-11", "C78-wk?2Tq"], "correcta": 3, "explicacion": "Las otras son una de las **más usadas del mundo**, un nombre con palabras fáciles de adivinar y una **fecha**. La buena mezcla mayúsculas, minúsculas, números y símbolos; y cuanto **más larga**, mejor.", "nota": "Contraseñas tomadas de la actividad «¿Qué opinas de mi nueva contraseña?» del REA «¿Controlas las redes? No dejes que te controlen» (CC BY-NC-SA 4.0).", "guia": "2.2"}, {"tipo": "dato", "valor": "admin / admin", "texto": "Usuario y contraseña de fábrica de **muchísimos routers**. Si no los cambias, cualquiera conectado a tu red puede entrar a configurarlo.", "pregunta": "¿Sabes si el router de tu casa sigue con la contraseña de fábrica?"}, {"tipo": "practica", "titulo": "Protegemos el Wi-Fi y el router", "tiempo": 12, "enunciado": "Pon a tu red un **SSID sin datos personales**, seguridad **WPA2 Personal** y una contraseña de **12 caracteres o más**. Cambia también la contraseña del router y vuelve a conectar el portátil y el móvil.", "pasos": ["Router → GUI → Wireless: SSID y WPA2 Personal + contraseña", "Router → GUI → Administration: nueva contraseña", "Portátil y móvil → Config → Wireless0 → WPA2-PSK y la contraseña", "Comprueba con ping que siguen conectados"], "ayudas": [{"tipo": "pista", "titulo": "Truco para una contraseña robusta", "texto": "Une tres palabras que recuerdes, un número y un símbolo: **Gato-Playa-Bici-27!** Nunca tu nombre ni tu fecha de nacimiento."}]}, {"tipo": "practica", "titulo": "Informe y entrega", "tiempo": 13, "enunciado": "Completa el **informe A1** con la tabla de IP, las tres capturas y las preguntas. Entrega el **.pkt** y el **PDF**.", "entrega": "Tarea 8.1 · Mi red doméstica conectada y protegida"}]}, "moodle": [{"recurso": "Tarea", "nombre": "8.1 · Mi red doméstica conectada y protegida", "uso": "Entrega individual del archivo de Packet Tracer y del informe A1 (tabla de IP, capturas y preguntas). Evalúa la conexión y configuración de la red y su protección con contraseñas.", "correccion": "rubrica", "criterio": "DIG.4.1.1", "rubrica": [{"linea": "Montaje de la red doméstica", "criterio": "DIG.4.1.1", "niveles": ["1 pto: Solo aparece el router o algún dispositivo suelto, sin conexiones.", "3 ptos: Router y algunos dispositivos conectados, pero faltan los inalámbricos o hay cables en rojo.", "5 ptos: Router, 2 PC por cable y un dispositivo por Wi-Fi conectados.", "7 ptos: Red completa (2 PC por cable, portátil y móvil por Wi-Fi) con todas las conexiones activas.", "10 ptos: Red completa y ordenada, con los dispositivos renombrados y alguna ampliación (segundo móvil, red de invitados…)."]}, {"linea": "Direcciones IP y comprobación con ping", "criterio": "DIG.4.1.1", "niveles": ["1 pto: No hay direcciones IP ni tabla.", "3 ptos: Algunos dispositivos tienen IP, pero la tabla está incompleta y no hay ping.", "5 ptos: Todos tienen IP por DHCP y la tabla está completa, pero falta la captura del ping o falla.", "7 ptos: Tabla completa y captura de un ping con los 4 paquetes recibidos.", "10 ptos: Además, explica con sus palabras qué son la IP, la puerta de enlace y el DHCP."]}, {"linea": "Conexión con el servidor web (Internet)", "criterio": "DIG.4.1.1", "niveles": ["1 pto: No hay servidor ni conexión con el puerto Internet.", "3 ptos: El servidor está conectado pero sin IP o sin servicios configurados.", "5 ptos: La web se abre desde el móvil escribiendo la IP del servidor.", "7 ptos: La web se abre con www.misitio.com (DNS funcionando) y hay captura.", "10 ptos: Además, la página tiene un mensaje propio y explica qué hacen el DNS y el servidor web."]}, {"linea": "Seguridad del Wi-Fi y del router", "criterio": "DIG.4.3.2", "niveles": ["1 pto: El Wi-Fi sigue abierto y el router con la contraseña de fábrica.", "3 ptos: Ha cambiado el SSID o la contraseña del router, pero el Wi-Fi sigue sin WPA2.", "5 ptos: Wi-Fi con WPA2, pero la contraseña es débil o el SSID lleva datos personales.", "7 ptos: WPA2 con contraseña robusta, SSID sin datos personales y contraseña del router cambiada; los dispositivos siguen conectados.", "10 ptos: Todo lo anterior y explica por qué cada medida protege la red y cómo lo aplicaría en su casa."]}], "config": ["Entrega individual: archivos .pkt y .pdf", "Método de calificación: Rúbrica", "Categoría: DIG.4.1.1"], "criterios_rubrica": ["DIG.4.1.1", "DIG.4.3.2"], "calificable": true, "codigo": "8.1"}]}, {"n": 4, "fase": "Estructurar", "titulo": "Ciberamenazas: ¿real o fraude? y nuestra privacidad", "reto": "Reconocer mensajes fraudulentos, revisar la privacidad de nuestras redes sociales y conocer el catálogo de amenazas del que elegiremos dos temas por pareja.", "actividades": [{"nombre": "¿Real o fraude?", "min": 12, "desc": "Se proyectan seis capturas inventadas: SMS de «Correos» con enlace, mensaje de Instagram de un sorteo de iPhone, código QR pegado sobre un parquímetro, correo del banco con faltas, aviso real de actualización del sistema y mensaje de un «amigo» que pide un código por WhatsApp. El alumnado vota en el quiz y explica qué pistas lo delatan (urgencia, enlace raro, premio, petición de códigos)."}, {"nombre": "Revisamos nuestra privacidad", "min": 13, "desc": "Primero, «¿Me busco a ver si me encuentro?» (adaptado del REA): cada estudiante busca su nombre y apellidos entre comillas en el buscador y anota qué aparece de su persona y si le gusta la imagen que da. Después, cada estudiante, con su propio móvil o en el ordenador, revisa en TikTok e Instagram la lista de la diapositiva: cuenta privada, quién puede escribirme y comentar, descarga de mis vídeos, ubicación desactivada, verificación en dos pasos y sesiones abiertas. No se muestra ningún perfil en público. Quien no tiene redes revisa la configuración de privacidad de su cuenta de Google del centro."}, {"nombre": "El catálogo de amenazas", "min": 10, "desc": "Presentación del catálogo en dos listas: A (fraudes y ataques: phishing, smishing y vishing, fraude con QR, malware y ransomware, suplantación de identidad, estafas en compras y sorteos falsos) y B (salud y convivencia: ciberacoso, grooming, sextorsión, cibercontrol en la pareja, fake news y deepfakes, retos virales peligrosos, dependencia de las pantallas). Se forman las parejas y cada una sortea un tema de la lista A y otro de la B."}, {"nombre": "Primeras fuentes fiables", "min": 15, "desc": "Cada estudiante, de forma individual, busca la definición de sus dos temas en INCIBE, OSI o Internet Segura for Kids (is4k) y empieza la parte 1 de la ficha A2. El docente enseña a reconocer una fuente fiable (quién lo publica, fecha, si cita fuentes)."}], "criterios": ["DIG.4.3.1", "DIG.4.3.3"], "saberes": ["DIG.4.C.1", "DIG.4.C.2", "DIG.4.C.3"], "metodologia": ["Aprendizaje por indagación", "Gamificación"], "evidencias": ["Lista de privacidad revisada (observación)", "Temas asignados y ficha A2 iniciada"], "recursos": ["Proyector", "Móviles del alumnado (opcional)", "Webs de INCIBE e is4k", "Plantilla A2"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Casos con capturas de redes que usan a diario; la revisión de privacidad se hace en privado y con alternativa para quien no tiene redes o no trae móvil; temas sorteados en dos listas para que todas las parejas tengan un tema técnico y otro de bienestar."}, "ejercicios": ["Decide si cada mensaje es real o fraude y escribe la pista que lo delata.", "Búscate en Internet y anota qué información aparece sobre ti.", "Revisa la privacidad de tus redes sociales con la lista de la sesión.", "Busca en una fuente fiable la definición de tus dos amenazas."], "clase": {"pregunta": "¿Cómo distingues un mensaje real de un fraude en diez segundos?", "diapositivas": [{"tipo": "ejemplo", "icono": "📦", "titulo": "«Tu paquete está retenido»", "situacion": "Te llega un SMS: **«Correos: tu paquete no se ha podido entregar. Paga 1,99 € aquí»** y un enlace raro.", "explicacion": "Es **smishing** (phishing por SMS): buscan tus datos o tu tarjeta. Pistas: **urgencia**, un pago pequeño, un enlace que no es el oficial y que no esperabas ningún paquete."}, {"tipo": "quiz", "pregunta": "Un «amigo» te escribe por WhatsApp: «Te ha llegado un código por SMS por error, ¿me lo pasas?». ¿Qué haces?", "opciones": ["Se lo paso, es mi amigo", "No lo paso y le llamo por otra vía para comprobarlo", "Le pido que me lo explique por WhatsApp"], "correcta": 1, "explicacion": "Ese código sirve para **robar tu cuenta de WhatsApp**. Nunca se comparte, y si dudas, comprueba con tu amigo por **otra vía** (llamada, en persona)."}, {"tipo": "practica", "titulo": "Revisamos nuestra privacidad", "tiempo": 13, "enunciado": "Búscate en Internet y revisa **en privado** tu TikTok o Instagram (o tu cuenta de Google del centro si no tienes redes) y marca en el cuaderno lo que hayas cambiado.", "pasos": ["**Búscate**: tu nombre y apellidos «entre comillas» en el buscador. ¿Qué dice Internet de ti?", "Cuenta **privada**", "Quién puede escribirme, comentar y hacer dúos: **amigos** o nadie", "**Ubicación** desactivada y sin descargas de mis vídeos", "**Verificación en dos pasos** activada", "Cerrar **sesiones abiertas** en otros dispositivos"]}, {"tipo": "comparar", "titulo": "El catálogo de amenazas", "columnas": [{"titulo": "Lista A · Fraudes y ataques", "icono": "🎣", "puntos": ["Phishing, smishing y vishing · Fraude con QR", "Malware y ransomware", "Suplantación de identidad", "Estafas en compras y sorteos falsos"]}, {"titulo": "Lista B · Salud y convivencia", "icono": "💬", "puntos": ["Ciberacoso · Grooming · Sextorsión", "Cibercontrol en la pareja", "Fake news, deepfakes y retos virales", "Dependencia de las pantallas"]}], "texto": "Cada pareja sortea **un tema de la lista A y otro de la B**.", "nota": "Si algún tema de la lista B puede tocar una situación personal de alguien del grupo, ofrecer cambio discreto. Recordar el 017 y ANAR."}, {"tipo": "practica", "titulo": "Primeras fuentes fiables", "tiempo": 15, "enunciado": "Busca la **definición** de tus dos temas y empieza la **parte 1 de la ficha A2**. Usa estas webs: **incibe.es**, **osi.es** o **is4k.es**.", "pasos": ["¿Quién lo publica? (organismo oficial, medio conocido)", "¿Tiene fecha reciente?", "Escribe la definición con **tus palabras**, no copiada"], "enlace": "https://docs.google.com/document/d/1GsvPnPSzYUiclcOjX-WCA4sYBJAnr2vVo03lSDmxi0U/copy"}]}, "moodle": []}, {"n": 5, "fase": "Estructurar", "titulo": "Investigamos: casos reales, riesgos y prevención", "reto": "Encontrar un caso real de cada amenaza y analizar sus riesgos, cómo se previene y qué hacer si ya ha ocurrido.", "actividades": [{"nombre": "Modelo de análisis", "min": 10, "desc": "El docente analiza en voz alta un tema que no está en el catálogo (el fraude del falso soporte técnico) siguiendo las cinco preguntas de la ficha A2: qué es, un caso real (noticia de un medio conocido o de la Policía Nacional o Guardia Civil), qué riesgos tiene, cómo se previene y qué hacer si ya ha pasado."}, {"nombre": "Investigación del tema A", "min": 17, "desc": "Cada estudiante completa en la ficha A2 su tema de la lista A: caso real con enlace a la fuente, riesgos (para el dispositivo, el dinero, los datos), tres medidas de prevención y qué hacer (cambiar contraseñas, avisar al banco, denunciar, llamar al 017). La pareja puede comentar, pero cada ficha es individual."}, {"nombre": "Investigación del tema B", "min": 18, "desc": "Lo mismo con el tema de la lista B, centrando los riesgos en la salud física y mental y la convivencia (ansiedad, aislamiento, daño a otras personas) y la actuación: no responder, guardar pruebas, bloquear, contar a un adulto de confianza, ANAR o 017, y denunciar si es delito."}, {"nombre": "Puesta en común rápida", "min": 5, "desc": "Tres estudiantes leen una medida de prevención que no sabían. Pregunta de salida: ¿a quién pedirías ayuda si te pasara?"}], "criterios": ["DIG.4.3.3"], "saberes": ["DIG.4.C.1", "DIG.4.C.3"], "metodologia": ["Aprendizaje por indagación", "Modelado"], "evidencias": ["Ficha A2 con los dos temas en progreso"], "recursos": ["Webs de INCIBE, OSI e is4k", "Plantilla A2"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Modelo resuelto en voz alta antes de investigar; ficha con preguntas cortas y ejemplos de respuesta; enlaces directos a páginas concretas de INCIBE e is4k para quien tenga dificultades de búsqueda; posibilidad de responder con frases cortas o esquemas."}, "ejercicios": ["Completa en la ficha A2 tu tema de la lista A: caso real, riesgos, prevención y actuación.", "Completa tu tema de la lista B, centrando los riesgos en la salud y la convivencia."], "clase": {"pregunta": "Si te pasara a ti, ¿sabrías qué hacer en los primeros cinco minutos?", "diapositivas": [{"tipo": "ejemplo", "icono": "🖥️", "titulo": "Modelo: el falso soporte técnico", "situacion": "Aparece una ventana: **«Tu ordenador está infectado. Llama ya a este número de Microsoft»**.", "explicacion": "**Qué es**: un fraude que asusta para que llames. **Riesgo**: te piden instalar un programa y controlan tu equipo. **Prevención**: Microsoft no avisa así; cierra el navegador. **Si ya ha pasado**: desconecta, cambia contraseñas y llama al **017**."}, {"tipo": "flujo", "titulo": "Las cinco preguntas de la ficha A2", "nodos": [{"texto": "1. ¿Qué es?", "tipo": "inicio"}, {"texto": "2. Un caso real (con fuente)", "tipo": "proceso"}, {"texto": "3. ¿Qué riesgos tiene?", "tipo": "proceso"}, {"texto": "4. ¿Cómo se previene?", "tipo": "proceso"}, {"texto": "5. ¿Qué hago si ya ha pasado?", "tipo": "fin"}]}, {"tipo": "practica", "titulo": "Investigación del tema A", "tiempo": 17, "enunciado": "Responde las cinco preguntas de tu tema de la **lista A** en la **ficha A2**. Pon el **enlace** del caso real.", "pasos": ["Busca el caso en un medio conocido o en la web de la Policía o la Guardia Civil", "Riesgos: dispositivo, dinero, datos", "Tres medidas de prevención", "Qué hacer: contraseñas, banco, denuncia, 017"], "enlace": "https://docs.google.com/document/d/1GsvPnPSzYUiclcOjX-WCA4sYBJAnr2vVo03lSDmxi0U/copy"}, {"tipo": "quiz", "pregunta": "Tu pareja te dice: «Si de verdad me quieres, dame las contraseñas de tus redes». ¿Qué es?", "opciones": ["Una prueba de confianza normal", "Cibercontrol: una forma de control abusivo", "Una broma sin importancia"], "correcta": 1, "explicacion": "Pedir contraseñas, revisar tu ubicación o decirte a quién seguir es **cibercontrol**: limita tu libertad. **Quien te quiere no te controla.**", "nota": "Frase de la actividad «¡Qué bonito es el amor!» del REA «¿Controlas las redes? No dejes que te controlen» (CC BY-NC-SA 4.0). Si el grupo lo pide, leer otras frases del REA (historial de ubicaciones, fotos de perfil, likes) y votar si son control."}, {"tipo": "practica", "titulo": "Investigación del tema B", "tiempo": 18, "enunciado": "Ahora tu tema de la **lista B**. Piensa en cómo afecta a la **salud** y a la **convivencia**.", "pasos": ["Riesgos: ansiedad, aislamiento, daño a otras personas", "Qué hacer: no responder, **guardar pruebas**, bloquear", "Contarlo a un adulto de confianza", "ANAR **900 20 20 10** · Ciberseguridad **017**"], "guia": "3.2"}, {"tipo": "idea", "icono": "🆘", "titulo": "Nunca estás solo o sola", "puntos": ["**017**: línea de ayuda en ciberseguridad de INCIBE", "**ANAR 900 20 20 10**: ayuda a niños, niñas y adolescentes", "**Policía o Guardia Civil** si es un delito", "Un adulto de confianza: familia, tutoría, Orientación"]}]}, "moodle": []}, {"n": 6, "fase": "Estructurar", "titulo": "Bulos, comprobación y entrega de la investigación", "reto": "Aprender a comprobar si una información es un bulo, revisar la ficha y entregar la investigación de las dos amenazas.", "actividades": [{"nombre": "¿Bulo o verdad?", "min": 10, "desc": "Se proyectan tres titulares inventados con formato de publicación de Instagram (un reto viral, un supuesto peligro de una app y una cifra exagerada). Se aplica la regla de los cuatro pasos: quién lo dice, cuándo, busca la noticia en otro medio y búsqueda inversa de la imagen. Se nombran verificadores como Maldita.es o Newtral."}, {"nombre": "Completar la ficha A2", "min": 17, "desc": "Cada estudiante termina las dos investigaciones. Quien ya ha terminado añade en la parte final un consejo pensado para alumnado de 1.º ESO. El docente revisa fichas en directo con la lista «Antes de entregar»."}, {"nombre": "Comprobación multinivel: ¿qué harías?", "min": 5, "desc": "Comprobación individual con dos opciones de distinta exigencia, adaptada de «Tú sí que sabes tratar al malware» del REA. A (Recordar): emparejar cuatro situaciones (memoria USB de un compañero, ordenador sin actualizar desde hace meses, juego que pide tu móvil para desbloquear un nivel, vídeo «alucinante» que pide instalar algo) con la medida que protege. B (Analizar): elegir una situación y explicar en el cuaderno qué puede pasar y qué haría paso a paso."}, {"nombre": "Revisión entre la pareja", "min": 8, "desc": "Los miembros de la pareja intercambian fichas y comprueban con la lista de cotejo de la Tarea 8.2 que están completas: dos temas, cinco preguntas cada uno, caso real con enlace a una fuente fiable y teléfonos de ayuda."}, {"nombre": "Entrega de la Tarea 8.2", "min": 10, "desc": "Exportar la ficha a PDF y entregarla en la Tarea 8.2 de forma individual. Avance de la sesión siguiente: con estas dos fichas la pareja escribirá el guion del vídeo."}], "criterios": ["DIG.4.3.2", "DIG.4.3.3"], "saberes": ["DIG.4.C.1", "DIG.4.C.3"], "metodologia": ["Aprendizaje por indagación", "Coevaluación"], "evidencias": ["Ficha A2 completa (Tarea 8.2)", "Comprobación multinivel en el cuaderno"], "recursos": [" ue **no actualizas** el ordenador · 3) Un juego te pide tu **móvil** para desbloquear un nivel · 4) Un vídeo «alucinante» te pide **instalar algo**. Medidas: a) No lo instales, bórralo y avisa · b) Pásale el antivirus antes de abrirlo · c) Actualiza el sistema y el antivirus · d) No des tu número: son SMS de pago."}, {"letra": "B", "titulo": "Piensa", "proceso": "Analizar", "enunciado": "Elige **una** de las cuatro situaciones y explica qué podría pasar si no haces nada y qué harías tú, **paso a paso**."}], "ayudas": [{"tipo": "pista", "titulo": "Solución de la opción A", "texto": "1-b · 2-c · 3-d · 4-a"}], "nota": "Adaptado de la actividad multinivel «Tú sí que sabes tratar al malware» del REA «¿Controlas las redes? No dejes que te controlen» (CC BY-NC-SA 4.0).", "guia": "3.3"}, {"tipo": "practica", "titulo": "Revisión entre la pareja", "tiempo": 8, "enunciado": "Intercambiad las fichas y comprobad la lista. Si falta algo, se arregla **ahora**.", "pasos": ["Dos temas, uno de cada lista", "Cinco preguntas respondidas en cada tema", "Caso real con **enlace** a una fuente fiable", "Teléfonos de ayuda (017, ANAR)"]}, {"tipo": "practica", "titulo": "Entrega de la investigación", "tiempo": 10, "enunciado": "Archivo → Descargar → **PDF** y súbelo a Moodle.", "entrega": "Tarea 8.2 · Investigación de mis dos ciberamenazas"}]}, "moodle": [{"recurso": "Tarea", "nombre": "8.2 · Investigación de mis dos ciberamenazas", "uso": "Entrega individual de la ficha A2. Verifica que cada estudiante ha investigado sus dos amenazas antes de pasar al guion del vídeo.", "correccion": "apto", "criterio": "DIG.4.3.3", "cotejo": ["Están los dos temas asignados, uno de cada lista", "Cada tema responde las cinco preguntas (qué es, caso real, riesgos, prevención y actuación)", "Cada caso real tiene el enlace a una fuente fiable", "Las respuestas están escritas con sus palabras, no copiadas", "Aparece al menos un recurso de ayuda (017, ANAR, Policía)"], "config": ["Entrega individual: archivo PDF" os temas · Entrega en la sesión 6", "sesiones": "4-6"}, {"nombre": "Bloque 3 · Vídeo concienciador", "descripcion": "Producto: vídeo animado en pareja + guion A3 · Estreno en la sesión 9", "sesiones": "7-9"}], "eventos": [{"sesion": 9, "texto": "Estreno de los vídeos en clase y coevaluación", "tipo": "Se valora en clase"}], "nota_evaluacion": "Se evalúan **cuatro criterios** con las rúbricas de la **Tarea 8.1** (red doméstica, individual) y la **Tarea 8.3** (vídeo, en pareja). La **Tarea 8.2** (investigación, individual) es Apto / No apto y hay que tenerla apta para entregar el vídeo.", "ayuda": "¿Te está pasando algo en la red? Guarda pruebas, no respondas y cuéntalo. **017**: ayuda en ciberseguridad (INCIBE) · **ANAR 900 20 20 10**: ayuda a adolescentes · También puedes hablar con tu tutor/a u Orientación.", "url_clase": "https://florindotic.es/content/curso2026-2027/digitalizacion/4-eso/sda8/clase.html"}}, "seneca": {"justificacion": "El alumnado de 4.º ESO monta y protege en un simulador la red de una casa conectada a Internet e investiga amenazas reales de la red. En pareja produce un vídeo animado con voz sintética que explica cómo funciona Internet y cómo prevenir y actuar ante dos riesgos de ciberseguridad o salud digital, para difundirlo de forma segura en el instituto.", "actividades": [{"titulo": "Montamos y protegemos la red de casa", "tipo": "Exploración", "abreviatura": "EXP1", "tarea": "8.1", "sesiones": [1, 2, 3], "trazabilidad": "RÚBRICA", "criterios": ["DIG.4.1.1", "DIG.4.3.2"]}, {"titulo": "Vídeo «Conectados y protegidos»", "tipo": "Conclusión", "abreviatura": "CON1", "tarea": "8.3", "sesiones": [4, 5, 6, 7, 8, 9], "trazabilidad": "RÚBRICA", "criterios": ["DIG.4.1.1", "DIG.4.3.1", "DIG.4.3.3"]}]}, "notas_rigor": ["Todos los saberes movilizados están vinculados oficialmente a los criterios elegidos: DIG.4.A.3 a DIG.4.1.1, DIG.4.C.1 a DIG.4.3.2, DIG.4.C.2 a DIG.4.3.1 y DIG.4.C.3 a DIG.4.3.3. Los saberes DIG.4.A.1 y DIG.4.A.4, también vinculados a DIG.4.1.1, no se movilizan en esta SdA.", "Cisco Packet Tracer exige una cuenta gratuita de Cisco Networking Academy. Conviene comprobar antes de la SdA la edad mínima de registro y crear o verificar las cuentas, o usar Filius (libre, sin registro) como alternativa; los pasos de las sesiones 2 y 3 están escritos para Packet Tracer 8.x (Home Router).", "Antes de la sesión 7, revisar las condiciones de uso y la edad mínima de ElevenLabs, Speechgen.io, Powtoon y Animaker. Si el alumnado no puede registrarse, el docente genera las voces con su cuenta a partir del guion, o se usan las cuentas educativas del centro (Canva para Educación, Genially) para la animación.", "Los temas de la lista B (grooming, sextorsión, ciberacoso) se tratan desde la prevención y la petición de ayuda, sin casos con detalles explícitos, coordinados con Orientación y con el protocolo de ciberacoso del centro.", "Los vídeos se difunden solo en el entorno escolar, sin datos personales del alumnado, con voz sintética y con la autorización de Orientación y del equipo directivo.", "El REA de referencia es de Computación y Robótica 2.º ESO (criterios 6.1-6.4 del borrador de 2022): no se usa su concreción curricular, solo actividades adaptadas, que aquí se vinculan a los criterios de Digitalización 4.º ESO. Su licencia (CC BY-NC-SA 4.0) obliga a citarlo y a publicar la adaptación con la misma licencia y sin fines comerciales.", "Licencia del REA: las propiedades de la guía docente indican CC BY-NC 4.0, pero sus páginas de créditos y las de la guía del alumnado declaran CC BY-NC-SA 4.0; se aplica la más exigente (BY-NC-SA). Una de las páginas de la guía docente trae la cita del original con el título en blanco; se ha usado la cita completa de la página «Descarga este REA».", "Los enlaces a noticias y vídeos del REA (2022) no se reutilizan porque no se ha podido comprobar que sigan disponibles; los casos reales los busca el alumnado en fuentes actuales."], "anexos": {"plantillas": [{"id": "A1", "titulo": "
