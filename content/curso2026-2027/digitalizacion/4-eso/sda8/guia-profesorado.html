un tema de la lista A y otro de la lista B.", "He respondido las cinco preguntas de cada tema.", "Cada caso real tiene el enlace a una fuente fiable.", "He escrito con mis palabras.", "Aparece al menos un recurso de ayuda.", "Entrego la ficha en PDF en la Tarea 8.2."]}], "enlace": "https://docs.google.com/document/d/1GsvPnPSzYUiclcOjX-WCA4sYBJAnr2vVo03lSDmxi0U/copy"}, {"id": "A3", "titulo": "Guion del vídeo «Conectados y protegidos»", "sesiones": [7, 8, 9], "agrupamiento": "Por parejas", "herramienta": "Google Docs (una copia por pareja, compartida entre los dos)", "entrega": "la Tarea 8.3 (PDF, junto con el vídeo)", "docente": "La duración total orientativa es de 2-3 minutos (unas 4 frases de voz por escena). La columna de créditos se completa en la sesión 8.", "instrucciones": "Escribid el texto de la **voz** de cada escena (máximo **4 frases**, cortas) y qué se **verá** en pantalla. Nada de nombres, caras ni datos personales.", "bloques": [{"titulo": "Nuestro vídeo", "campos": ["Título del vídeo", "Riesgo A", "Riesgo B", "Herramienta de animación y de voz"], "alto": 1}, {"titulo": "Escenas", "tabla": {"columnas": ["Escena", "Texto de la voz", "Qué se ve (texto clave e iconos)"], "filas": [["1. Gancho (10 s)"], ["2. Cómo funciona Internet (40 s)"], ["3. Riesgo A: qué es, caso y consecuencias (35 s)"], ["4. Riesgo B: qué es, caso y consecuencias (35 s)"], ["5. Cómo prevenir y qué hacer + 017 / ANAR (20 s)"]], "anchos": [4, 8, 5], "alto": 2.6}}, {"titulo": "Créditos de imágenes y música", "tabla": {"columnas": ["Recurso", "Dónde lo encontramos", "Licencia"], "filas": [[""], [""], [""]], "anchos": [5, 7, 5], "alto": 1}}, {"titulo": "Antes de entregar", "casillas": ["El vídeo dura entre 2 y 3 minutos y tiene las cinco escenas.", "Explicamos el camino móvil → router → IP → DNS → servidor.", "Hay dos riesgos con un caso real y sus consecuencias.", "Damos pautas para prevenir y qué hacer, con 017 y ANAR.", "No aparecen nombres, caras, voces reales ni ubicaciones.", "Usamos voz sintética y recursos con licencia, con créditos.", "Entregamos el enlace o el MP4 y este guion en PDF en la Tarea 8.3."]}], "enlace": "https://docs.google.com/document/d/1KcgA7Y4XF6_mNLcpOnGuM_0FMS7hQ1OtIeyosEHtrOY/copy"}], "formularios": [{"id": "F1", "titulo": "SdA 8 · Encuesta inicial: ¿cómo me conecto?", "sesiones": [1], "anonimo": true, "obligatorias": false, "descripcion": "Encuesta anónima para preparar la SdA de ciberseguridad. No hay respuestas buenas ni malas.", "confirmacion": "¡Gracias! Veremos los resultados de la clase en conjunto, nunca respuestas de nadie en concreto.", "preguntas": [{"tipo": "casillas", "titulo": "¿Cómo te conectas a Internet en casa?", "opciones": ["Wi-Fi de casa", "Cable", "Datos del móvil", "No tengo Internet en casa"]}, {"tipo": "casillas", "titulo": "¿Qué redes sociales usas?", "opciones": ["TikTok", "Instagram", "WhatsApp", "YouTube", "Snapchat", "Discord", "Ninguna"], "otra": true}, {"tipo": "opcion", "titulo": "¿Cuántas horas al día usas las redes sociales?", "opciones": ["Menos de 1", "Entre 1 y 3", "Entre 3 y 5", "Más de 5"]}, {"tipo": "opcion", "titulo": "¿Tu cuenta principal es privada?", "opciones": ["Sí", "No", "No lo sé"]}, {"tipo": "opcion", "titulo": "¿Has recibido alguna vez un mensaje sospechoso (premio, paquete, código, enlace raro)?", "opciones": ["Sí", "No", "No lo sé"]}, {"tipo": "opcion", "titulo": "¿Sabes qué es un router?", "opciones": ["Sí, y sabría explicarlo", "Más o menos", "No"]}, {"tipo": "escala", "titulo": "¿Cuánto crees que sabes de protegerte en Internet?", "min": 1, "max": 5, "etiquetas": ["Nada", "Mucho"]}, {"tipo": "parrafo", "titulo": "¿Qué te gustaría aprender sobre seguridad en Internet?"}]}, {"id": "F2", "titulo": "SdA 8 · Coevaluación del estreno de los vídeos", "sesiones": [9], "anonimo": true, "repetible": true, "obligatorias": true, "descripcion": "Valora cada vídeo después de verlo. Envía una respuesta por vídeo. Sé respetuoso/a: valora el vídeo, no a las personas.", "confirmacion": "Valoración enviada. Pulsa «Enviar otra respuesta» para valorar el siguiente vídeo.", "preguntas": [{"tipo": "desplegable", "titulo": "¿Qué vídeo valoras?", "ayuda": "El docente cambiará estas opciones por los títulos o números de los vídeos.", "opciones": ["Vídeo 1", "Vídeo 2", "Vídeo 3", "Vídeo 4", "Vídeo 5", "Vídeo 6", "Vídeo 7", "Vídeo 8", "Vídeo 9", "Vídeo 10", "Vídeo 11"]}, {"tipo": "cuadricula", "titulo": "Valora el vídeo", "filas": ["Se entiende cómo funciona Internet", "Explica bien los dos riesgos", "Los consejos son útiles", "No aparecen datos personales", "Engancha y se ve bien"], "columnas": ["Sí", "En parte", "No"]}, {"tipo": "texto", "titulo": "Lo mejor del vídeo", "obligatoria": false}, {"tipo": "texto", "titulo": "Una mejora", "obligatoria": false}]}, {"id": "F3", "titulo": "SdA 8 · Autoevaluación final", "sesiones": [9], "anonimo": false, "obligatorias": true, "descripcion": "Reflexiona sobre lo que has aprendido en la SdA 8. Se recoge tu correo del centro para que el docente pueda leer tu reflexión.", "confirmacion": "¡Gracias por tu reflexión!", "preguntas": [{"tipo": "cuadricula", "titulo": "¿Qué he logrado?", "filas": ["Montar una red doméstica en Packet Tracer", "Explicar qué hacen el router, la IP y el DNS", "Proteger un Wi-Fi y un router", "Reconocer un fraude o un bulo", "Saber qué hacer y a quién pedir ayuda ante un riesgo"], "columnas": ["Lo he hecho de manera autónoma", "Lo he hecho con ayuda", "He necesitado una guía continua", "Todavía no lo he logrado"], "ayuda": "Niveles tomados de la rúbrica final del REA «¿Controlas las redes? No dejes que te controlen» (CC BY-NC-SA 4.0) (autoría: José Pujol Pérez)."}, {"tipo": "parrafo", "titulo": "¿Qué riesgo te ha sorprendido más y por qué?"}, {"tipo": "casillas", "titulo": "¿Qué has cambiado en tu privacidad durante esta SdA?", "opciones": ["He puesto mi cuenta en privado", "He activado la verificación en dos pasos", "He desactivado la ubicación", "He limitado quién me escribe", "He cambiado alguna contraseña", "Nada todavía"], "otra": true}, {"tipo": "escala", "titulo": "¿Cómo ha funcionado tu pareja?", "min": 1, "max": 5, "etiquetas": ["Mal", "Muy bien"]}, {"tipo": "texto", "titulo": "Lo que más me ha gustado de la SdA", "obligatoria": false}]}]}, "creditos": {"licencia": {"nombre": "CC BY-NC-SA 4.0 (Reconocimiento-NoComercial-CompartirIgual)", "url": "https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es", "nota": "Se puede copiar, adaptar y compartir citando la autoría, sin fines comerciales y con la misma licencia. Esta SdA, en lo que adapta del REA, se publica con la misma licencia."}, "original": {"titulo": "¿Controlas las redes? No dejes que te controlen (REA 5 de Computación y Robótica 2.º ESO) y su Guía docente", "organizacion": "Proyecto REA Andalucía. Dirección General de Formación del Profesorado e Innovación Educativa. Consejería de Educación y Deporte. Junta de Andalucía", "version": "Versión 01 (guía del alumnado: 2 de junio de 2022; guía docente: julio-septiembre de 2022)", "fuente": "Archivos fuente COM_2ESO_REA_05_V01.elp y COM_2ESO_GUIA_REA_05.v01.elp", "personas": [{"funcion": "Elaboración del contenido y de la Situación de Aprendizaje", "nombres": "Manuel Solera Iglesias"}, {"funcion": "Elaboración de la guía docente", "nombres": "Manuel Solera Iglesias, F. Javier Álvarez Jiménez y Lydia Nacimiento Rodríguez"}, {"funcion": "Asesoría en DUA, lectura fácil y CAAP", "nombres": "Lydia Nacimiento Rodríguez"}, {"funcion": "Soporte técnico y elaboración técnica", "nombres": "Manuel Solera Iglesias y F. Javier Álvarez Jiménez"}, {"funcion": "Asesoría técnica docente", "nombres": "José Pujol Pérez"}, {"funcion": "Coordinación de la materia", "nombres": "Francisco Javier Álvarez Jiménez"}, {"funcion": "Dirección del modelo DUA, lectura facilitada y CAAP", "nombres": "Antonio Márquez Ordóñez y Luz González Domínguez-Adame"}, {"funcion": "Dirección técnica", "nombres": "Luis Miguel Iglesias Albarrán"}, {"funcion": "Dirección del proyecto", "nombres": "Diego Bernal Ortega y Luz González Domínguez-Adame"}, {"funcion": "Elaboración", "nombres": "Servicio de Innovación Educativa de la Consejería de Educación de la Junta de Andalucía"}], "cita": "Esta situación de aprendizaje adapta actividades del recurso original «¿Controlas las redes? No dejes que te controlen» del Proyecto REA Andalucía de la Consejería de Educación y Deporte de la Junta de Andalucía, que lo distribuye bajo licencia CC BY-NC-SA 4.0."}, "adaptacion": {"autoria": "Profesorado de Digitalización del IES Villa de Mijas", "fecha": "Octubre de 2026", "cambios": "Se toman como base algunas actividades del REA, adaptadas a Digitalización 4.º ESO y a un grupo adaptado: «¿Qué opinas de mi nueva contraseña?» (sesión 3), «Me busco a ver si me encuentro» (sesión 4), las frases de cibercontrol de «¡Qué bonito es el amor!» (sesión 5), la actividad multinivel «Tú sí que sabes tratar al malware» (sesión 6), los niveles de autonomía de la rúbrica final (autoevaluación F3) y la idea del encargo de difundir consejos de ciberseguridad a otros estudiantes del centro. La guía del alumnado sigue la estructura del REA (fases Movilizar y activar, Explorar, Estructurar, Aplicar y comprobar y Concluir; apartados con narrador, «Diccionario», actividades multinivel y ayudas tipo Lumen, Motus, Clavis y Kardia, y el «Reviso lo que aprendo») y adapta sus textos sobre tipos de malware, ciberacoso, sextorsión, grooming y cibercontrol. El currículo, la red doméstica en Packet Tracer, el vídeo con voz sintética, las tareas, rúbricas y plantillas son de elaboración propia."}, "recursos": [{"elemento": "Rúbrica final del REA (niveles de autonomía)", "autoria": "José Pujol Pérez", "licencia": "CC BY-SA"}, {"elemento": "Juego «La Torre del Tesoro» (Interland, Be Internet Awesome)", "autoria": "Google", "licencia": "Recurso web gratuito (enlace)"}]}, "guia_alumnado": {"icono": "🛡️", "presentacion": "El departamento de Orientación necesita tu ayuda: quiere vídeos cortos para la **semana de la convivencia digital** del instituto, para que otros estudiantes entiendan cómo llega TikTok a su móvil y cómo protegerse de los riesgos de la red.\n\nPara hacerlo bien vas a ser, primero, **técnico o técnica de redes** (montarás la red de una casa en un simulador), después **investigador o investigadora** de amenazas reales y, al final, **creador o creadora de contenido** con tu pareja: un vídeo animado con voz sintética, sin mostrar tu cara ni tu voz.\n\nAvanza a tu ritmo, sin prisa pero sin pausa. ¡Tu reto lo vale!", "aprenderas": ["Qué son una **LAN**, una **WAN** e **Internet**, y qué hacen el **router**, la **IP**, el **DHCP** y el **DNS**.", "A montar y **proteger** la red de una casa: Wi-Fi con **WPA2**, contraseñas robustas y router sin la clave de fábrica.", "A reconocer **fraudes**, **bulos** y otras amenazas de la red, y a cuidar tu **privacidad** en TikTok e Instagram.", "Qué hacer y **a quién pedir ayuda** si algo va mal: guardar pruebas, contarlo, **017** y **ANAR**.", "A crear un **vídeo animado** con voz sintética y recursos con licencia, y a difundirlo de forma segura."], "apartados": [{"id": "1", "titulo": "¡Necesitamos tu ayuda!", "fase": "Movilizar y activar", "sesiones": [1], "intro": "Cada día abres TikTok, Instagram o WhatsApp sin pensar en lo que pasa por detrás. En este apartado vas a descubrir el **viaje** que hace un vídeo hasta tu móvil y vas a contarnos cómo te conectas tú.", "bloques": [{"tipo": "texto", "titulo": "Diccionario", "puntos": ["**Router**: aparato que une la red de tu casa con Internet y reparte la conexión. *Ejemplo: el router de casa da Wi-Fi a mi móvil y a la consola.*", "**LAN** (red local): red de un lugar pequeño, como tu casa o el aula. *Ejemplo: la impresora del aula está en la LAN.*", "**WAN** (red extensa): red que une lugares lejanos, como la fibra de tu compañía. *Ejemplo: juego online con alguien de Sevilla a través de la WAN.*", "**Internet**: la red de redes, que une millones de LAN de todo el mundo."]}, {"tipo": "actividad", "numero": "1", "titulo": "¿Cómo me conecto?", "agrupamiento": "Individual", "tiempo": 8, "enunciado": "Responde la **encuesta inicial F1**. Es **anónima**: nadie sabrá qué has contestado tú. Al terminar veremos los resultados de toda la clase.", "criterios": []}, {"tipo": "actividad", "numero": "2", "titulo": "¿LAN o WAN?", "agrupamiento": "Individual", "tiempo": 6, "enunciado": "Clasifica cada situación en **LAN** o **WAN**: 1) mandas una foto por Quick Share a tu amigo, al lado; 2) juegas online con alguien de Sevilla; 3) la impresora del aula imprime desde tu ordenador; 4) ves una serie en Netflix; 5) tu móvil se conecta al Wi-Fi de casa; 6) tu compañía de fibra une tu barrio con la central.", "test": {"pregunta": "¿Qué situaciones son de una red LAN?", "opciones": ["1, 3 y 5", "2, 4 y 6", "1, 2 y 3", "Todas"], "correcta": 0, "explicacion": "La foto al amigo de al lado, la impresora del aula y el Wi-Fi de casa ocurren **dentro de una red local**. Las otras viajan lejos, por la WAN."}, "criterios": ["DIG.4.1.1"]}, {"tipo": "actividad", "numero": "3", "titulo": "Dibujo la red de mi casa", "agrupamiento": "Individual", "tiempo": 10, "enunciado": "Dibuja en tu cuaderno tu casa con el **router** y todos los dispositivos que se conectan (móviles, tele, consola, ordenador…). Marca con una línea continua los que van **por cable** y con una línea discontinua los que van **por Wi-Fi**.", "ayudas": [{"tipo": "pista", "titulo": "¿No sabes cuáles van por cable?", "texto": "Mira detrás de la tele, la consola o el ordenador: si sale un cable con un conector ancho (como el del teléfono fijo, pero más grande) hasta el router, es **Ethernet**. Todo lo demás va por Wi-Fi."}], "criterios": ["DIG.4.1.1"]}], "ayudas": [{"tipo": "emociones", "titulo": "¿Esto de las redes no es lo tuyo?", "texto": "Al principio palabras como router, IP o DNS pueden asustar. Es normal. Piensa que **ya usas todo esto cada día**: solo vas a ponerle nombre a lo que pasa por detrás. Paso a paso, lo vas a conseguir."}, {"tipo": "repaso", "titulo": "Reviso lo que aprendo", "puntos": ["¿Sabrías explicar a alguien de tu familia qué es una LAN y qué es una WAN?", "¿Qué dispositivos de tu casa conectarías por cable? ¿Por qué?", "¿Qué aparato une tu casa con Internet?"]}]}, {"id": "2", "titulo": "La red de mi casa", "fase": "Explorar", "sesiones": [2, 3], "intro": "Ahora vas a ser **técnico o técnica de redes**. En el simulador **Cisco Packet Tracer** montarás la red de una casa, la conectarás a un servidor web de «Internet» y la protegerás para que nadie se cuele.", "bloques": [{"tipo": "narrador", "texto": "Todo lo que montes lo irás anotando en el **informe A1**. Ábrelo antes de empezar y tenlo a mano: al final de la sesión 3 lo entregarás en la Tarea 8.1."}]}, {"id": "2.1", "titulo": "Montamos la red", "fase": "Explorar", "sesiones": [2], "intro": "Igual que cada casa tiene calle y número para que llegue el correo, cada dispositivo de la red tiene una **dirección IP**. El router las reparte solo gracias al **DHCP**.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Montaje guiado de la red", "agrupamiento": "Individual", "tiempo": 20, "enunciado": "Repite cada paso **justo después** de verlo en el proyector.", "pasos": ["Coloca el **Home Router** (Network Devices → Wireless Devices).", "Añade **2 PC** y únelos al router con **cable directo** de cobre a los puertos Ethernet.", "Añade un **portátil**: en Physical, apágalo y cambia su tarjeta por la **WPC300N** (Wi-Fi).", "Añade un **smartphone** y comprueba en Config → Wireless0 que usa el SSID del router.", "En cada PC: Desktop → IP Configuration → **DHCP**.", "Comprueba que todos tienen una IP **192.168.0.x**."], "ayudas": [{"tipo": "pista", "titulo": "¿El portátil no se conecta?", "texto": "Apágalo con el botón de la pestaña Physical **antes** de cambiar la tarjeta, y vuelve a encenderlo después. Si un cable sale en rojo, espera unos segundos o revisa el puerto."}], "criterios": ["DIG.4.1.1"]}, {"tipo": "actividad", "numero": "2", "titulo": "¿Nos vemos? ipconfig y ping", "agrupamiento": "Individual", "tiempo": 10, "enunciado": "En el PC0 abre Desktop → Command Prompt. Escribe **ipconfig** y anota en la tabla del **informe A1** la IP de cada dispositivo. Después haz un **ping** a la IP del móvil: si vuelven los 4 paquetes, hay conexión. Guarda el archivo como **SdA8_red_Nombre_Apellido.pkt** en tu Drive.", "test": {"pregunta": "¿Qué hace el DHCP del router?", "opciones": ["Protege la red con contraseña", "Reparte automáticamente las direcciones IP", "Acelera el Wi-Fi"], "correcta": 1, "explicacion": "El **DHCP** asigna una IP libre a cada dispositivo que se conecta, sin escribirla a mano."}, "criterios": ["DIG.4.1.1"]}]}, {"id": "2.2", "titulo": "Internet y un router seguro", "fase": "Explorar", "sesiones": [3], "intro": "Escribes **tiktok.com** y no un número, igual que en WhatsApp buscas «Mamá» y no su teléfono. El **DNS** es la agenda de contactos de Internet: traduce el nombre a la IP del **servidor**, el ordenador que guarda la página y te la envía.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Conectamos la casa a «Internet»", "agrupamiento": "Individual", "tiempo": 18, "enunciado": "Añade un servidor web y abre **www.misitio.com** desde el móvil simulado. Haz una captura para el informe A1.", "pasos": ["Añade un **Server-PT** y únelo al puerto **Internet** del router.", "Router → GUI → Setup: **Static IP** 200.0.0.1 / 255.255.255.0 y **DNS 1 = 200.0.0.10**.", "Servidor: IP **200.0.0.10**, puerta de enlace 200.0.0.1.", "Servidor → Services → **DNS**: On, www.misitio.com → 200.0.0.10.", "Servidor → Services → **HTTP**: edita index.html con tu mensaje.", "Móvil → Desktop → Web Browser → **www.misitio.com**."], "ayudas": [{"tipo": "pista", "titulo": "¿La web no carga?", "texto": "Prueba antes con la IP **200.0.0.10** en el navegador del móvil. Si carga con la IP pero no con el nombre, revisa el registro DNS y el DNS 1 del router."}], "criterios": ["DIG.4.1.1"]}, {"tipo": "multinivel", "numero": "2", "titulo": "¿Qué opinas de mi nueva contraseña?", "agrupamiento": "Individual", "enunciado": "Antes de proteger tu Wi-Fi, comprueba que sabes distinguir una contraseña robusta. Elige **una opción**.", "opciones": [{"letra": "A", "titulo": "Recuerda", "proceso": "Recordar", "enunciado": "¿Cuál de estas contraseñas protegería bien tu Wi-Fi?", "test": {"opciones": ["123456789", "Azucenatequiero", "07-04-11", "C78-wk?2Tq"], "correcta": 3, "explicacion": "La buena mezcla **mayúsculas, minúsculas, números y símbolos**. Las otras son una de las más usadas del mundo, un nombre con palabras fáciles y una fecha."}}, {"letra": "B", "titulo": "Analiza", "proceso": "Analizar", "enunciado": "Explica en tu cuaderno por qué **Contraseña**, **Edelmiro-2011** y **soyelamo** no son seguras: ¿qué haría alguien para adivinarlas?"}, {"letra": "C", "titulo": "Crea y justifica", "proceso": "Crear", "enunciado": "Inventa una contraseña robusta para el **Wi-Fi de tu casa** y otra para tu **TikTok** (¡no las uses de verdad!). Explica qué reglas has seguido y cómo las recordarías sin apuntarlas."}], "ayudas": [{"tipo": "pista", "titulo": "Truco para una contraseña robusta", "texto": "Une tres palabras que recuerdes, un número y un símbolo: **Gato-Playa-Bici-27!** Nunca tu nombre, tu fecha de nacimiento ni la misma contraseña en todas partes."}], "criterios": ["DIG.4.3.2"]}, {"tipo": "actividad", "numero": "3", "titulo": "Protegemos el Wi-Fi y el router", "agrupamiento": "Individual", "tiempo": 12, "enunciado": "Pon a tu red un **SSID sin datos personales**, seguridad **WPA2 Personal** y una contraseña de **12 caracteres o más**. Cambia también la contraseña del router (viene de fábrica como «admin») y vuelve a conectar el portátil y el móvil.", "pasos": ["Router → GUI → Wireless: SSID y WPA2 Personal + contraseña.", "Router → GUI → Administration: nueva contraseña.", "Portátil y móvil → Config → Wireless0 → WPA2-PSK y la contraseña.", "Comprueba con ping que siguen conectados."], "criterios": ["DIG.4.3.2"]}, {"tipo": "actividad", "numero": "4", "titulo": "Informe y entrega", "agrupamiento": "Individual", "tiempo": 13, "enunciado": "Completa el **informe A1** con la tabla de IP, las tres capturas y las preguntas. Revisa la lista «Antes de entregar» y sube el **.pkt** y el **PDF**.", "entrega": "Tarea 8.1 · Mi red doméstica conectada y protegida", "criterios": ["DIG.4.1.1", "DIG.4.3.2"]}], "ayudas": [{"tipo": "saber_mas", "titulo": "Verificación en dos pasos (2FA)", "texto": "Una contraseña robusta es la primera barrera; la **verificación en dos pasos** es la segunda: además de la contraseña te piden un código, tu huella o tu cara. Aunque alguien adivine tu contraseña, no podrá entrar. Actívala en Instagram, TikTok y tu correo."}, {"tipo": "emociones", "titulo": "¡Sigue así!", "texto": "Si has llegado hasta aquí, ya has montado una red completa, la has conectado a Internet y la has protegido. Eso es lo que hace un técnico de redes. Cuando algo no salga a la primera, recuerda: **probar, fallar y volver a probar** también es aprender."}, {"tipo": "repaso", "titulo": "Reviso lo que aprendo", "puntos": ["¿Qué hacen el DNS y el servidor web?", "¿Qué tres cosas protegen un Wi-Fi?", "¿El router de tu casa tiene la contraseña de fábrica? ¿Sabrías comprobarlo con ayuda de un adulto?"]}]}, {"id": "3", "titulo": "¿Controlas las redes? No dejes que te controlen", "fase": "Estructurar", "sesiones": [4, 5, 6], "intro": "Ya sabes cómo viaja la información. Pero estar conectado también te expone a otros peligros: **fraudes**, **pérdida de privacidad**, **suplantación**, **acoso**, **control abusivo** o **dependencia**. En este apartado vas a convertirte en investigador o investigadora de dos de ellos.", "bloques": [{"tipo": "narrador", "texto": "Con tu pareja sortearéis **un tema de la lista A** (fraudes y ataques) y **otro de la lista B** (salud y convivencia). Los dos investigaréis los mismos temas, pero **cada persona entrega su propia ficha A2**."}]}, {"id": "3.1", "titulo": "¿Real o fraude? Mi privacidad", "fase": "Estructurar", "sesiones": [4], "intro": "Un SMS de un paquete que no esperabas, un sorteo de un iPhone, un «amigo» que te pide un código… Los ciberdelincuentes usan siempre las mismas pistas: **urgencia**, **premios**, **enlaces raros** y **peticiones de códigos**.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "¿Real o fraude?", "agrupamiento": "Gran grupo", "tiempo": 12, "enunciado": "Vota en el quiz de la web de clase si cada mensaje es real o un fraude y di qué pista lo delata.", "test": {"pregunta": "Un «amigo» te escribe por WhatsApp: «Te ha llegado un código por SMS por error, ¿me lo pasas?». ¿Qué haces?", "opciones": ["Se lo paso, es mi amigo", "No lo paso y le llamo por otra vía para comprobarlo", "Le pido que me lo explique por WhatsApp"], "correcta": 1, "explicacion": "Ese código sirve para **robar tu cuenta de WhatsApp**. Nunca se comparte. Si dudas, comprueba por **otra vía**."}, "criterios": ["DIG.4.3.3"]}, {"tipo": "actividad", "numero": "2", "titulo": "Me busco a ver si me encuentro", "agrupamiento": "Individual", "tiempo": 5, "enunciado": "Busca tu nombre y apellidos **entre comillas** en el buscador. Anota en tu cuaderno qué aparece de ti (imágenes, vídeos, comentarios, listados) y si te gusta la imagen que da de ti.", "criterios": ["DIG.4.3.1"]}, {"tipo": "actividad", "numero": "3", "titulo": "Reviso mi privacidad", "agrupamiento": "Individual", "tiempo": 8, "enunciado": "Revisa **en privado** tu TikTok o tu Instagram (o tu cuenta de Google del centro si no tienes redes) y marca en el cuaderno lo que hayas cambiado.", "pasos": ["Cuenta **privada**.", "Quién puede escribirme, comentar y hacer dúos: **amigos** o nadie.", "**Ubicación** desactivada y sin descargas de mis vídeos.", "**Verificación en dos pasos** activada.", "Cerrar las **sesiones abiertas** en otros dispositivos."], "criterios": ["DIG.4.3.1"]}, {"tipo": "texto", "titulo": "El catálogo de amenazas", "puntos": ["**Lista A · Fraudes y ataques**: phishing, smishing y vishing · fraude con códigos QR · malware y ransomware · suplantación de identidad · estafas en compras y sorteos falsos.", "**Lista B · Salud y convivencia**: ciberacoso · grooming · sextorsión · cibercontrol en la pareja · fake news y deepfakes · retos virales peligrosos · dependencia de las pantallas."]}, {"tipo": "actividad", "numero": "4", "titulo": "Primeras fuentes fiables", "agrupamiento": "Individual", "tiempo": 12, "enunciado": "Busca la **definición** de tus dos temas en **incibe.es**, **osi.es** o **is4k.es** y empieza la parte 1 de la **ficha A2**. Escríbela con **tus palabras**.", "ayudas": [{"tipo": "pista", "titulo": "¿Es una fuente fiable?", "puntos": ["¿Quién lo publica? Un organismo oficial o un medio conocido.", "¿Tiene fecha reciente?", "¿Cita de dónde saca los datos?"]}], "criterios": ["DIG.4.3.3"]}]}, {"id": "3.2", "titulo": "Investigo mis dos amenazas", "fase": "Estructurar", "sesiones": [5], "intro": "Para que tu vídeo sea útil, de cada amenaza tienes que saber cinco cosas: **qué es**, **un caso real**, **qué riesgos tiene**, **cómo se previene** y **qué hacer si ya ha pasado**.", "bloques": [{"tipo": "texto", "titulo": "Tipos de malware (lista A)", "puntos": ["**Virus**: alteran el funcionamiento y dañan archivos; necesitan que alguien los abra para extenderse.", "**Troyanos**: se esconden en un programa que parece inofensivo y dan el control del equipo a otra persona.", "**Spyware**: espían lo que haces y roban tus datos; los *keyloggers* registran lo que tecleas.", "**Ransomware**: cifran tus archivos y piden dinero por recuperarlos. Llegan en adjuntos o descargas poco fiables."]}, {"tipo": "texto", "titulo": "Formas de violencia en la red (lista B)", "puntos": ["**Ciberacoso**: daño repetido a una persona a través de redes, mensajes o juegos, por una o varias personas, a veces anónimas.", "**Sextorsión**: amenazar con difundir imágenes íntimas si no se hace lo que pide el agresor. Es un **delito**.", "**Grooming**: un adulto se gana la confianza de un menor por internet, a menudo con un perfil falso, para abusar de él. Es un **delito**.", "**Cibercontrol**: controlar a la pareja con el móvil (pedir contraseñas, revisar la ubicación, decidir a quién sigue). **Quien te quiere no te controla.**"]}, {"tipo": "actividad", "numero": "1", "titulo": "Investigo mi tema de la lista A", "agrupamiento": "Individual", "tiempo": 17, "enunciado": "Responde las cinco preguntas de tu tema de la **lista A** en la **ficha A2** y pon el **enlace** del caso real.", "pasos": ["Busca el caso en un medio conocido o en la web de la Policía Nacional o la Guardia Civil.", "Riesgos: dispositivo, dinero, datos.", "Tres medidas de prevención.", "Qué hacer: cambiar contraseñas, avisar al banco, denunciar, llamar al 017."], "criterios": ["DIG.4.3.3"]}, {"tipo": "actividad", "numero": "2", "titulo": "Investigo mi tema de la lista B", "agrupamiento": "Individual", "tiempo": 18, "enunciado": "Ahora tu tema de la **lista B**. Piensa en cómo afecta a la **salud** y a la **convivencia**.", "pasos": ["Riesgos: ansiedad, aislamiento, daño a otras personas.", "Qué hacer: no responder, **guardar pruebas**, bloquear.", "Contarlo a un adulto de confianza.", "ANAR **900 20 20 10** · Ciberseguridad **017**."], "test": {"pregunta": "Tu pareja te dice: «Si de verdad me quieres, dame las contraseñas de tus redes». ¿Qué es?", "opciones": ["Una prueba de confianza normal", "Cibercontrol: una forma de control abusivo", "Una broma sin importancia"], "correcta": 1, "explicacion": "Pedir contraseñas, revisar tu ubicación o decirte a quién seguir es **cibercontrol**: limita tu libertad."}, "criterios": ["DIG.4.3.3"]}], "ayudas": [{"tipo": "emociones", "titulo": "Si algo de esto te toca de cerca", "texto": "Algunos temas pueden recordarte cosas que te han pasado a ti o a alguien que conoces. Si te remueve, puedes pedir **cambiar de tema** sin dar explicaciones. Y si te está pasando, **no estás solo ni sola**: cuéntaselo a tu tutor o tutora, a Orientación o a tu familia, o llama al **017** o a **ANAR (900 20 20 10)**."}, {"tipo": "saber_mas", "titulo": "Programa ConRed", "texto": "La Junta de Andalucía tiene un programa para prevenir el acoso escolar y el ciberacoso en los institutos públicos: **ConRed**. Pregunta en Orientación si tu centro participa."}]}, {"id": "3.3", "titulo": "Bulos y comprobación", "fase": "Estructurar", "sesiones": [6], "intro": "Los bulos buscan **miedo o indignación** para que compartas sin pensar. Que lo hayan compartido miles de personas **no lo hace verdad**.", "bloques": [{"tipo": "texto", "titulo": "Regla de los cuatro pasos", "puntos": ["**¿Quién** lo dice? ¿Es un medio o un organismo conocido?", "**¿Cuándo?** ¿Es de ahora o es antiguo?", "Busca la noticia en **otro medio** o en Maldita.es o Newtral.", "Haz una **búsqueda inversa** de la imagen."]}, {"tipo": "actividad", "numero": "1", "titulo": "Termino mi investigación", "agrupamiento": "Individual", "tiempo": 17, "enunciado": "Termina tus **dos temas** de la ficha A2. Si acabas, añade un consejo pensado para alumnado de **1.º ESO**.", "criterios": ["DIG.4.3.3"]}, {"tipo": "multinivel", "numero": "2", "titulo": "Tú sí que sabes tratar las amenazas", "agrupamiento": "Individual", "enunciado": "Comprueba que sabes qué hacer ante el malware. Elige **una opción**.", "opciones": [{"letra": "A", "titulo": "Empareja", "proceso": "Recordar", "enunciado": "Te dejan un **USB** con el trabajo de mates. ¿Qué haces antes de abrirlo?", "test": {"opciones": ["Lo abro: es de un compañero", "Le paso el antivirus antes de abrir nada", "Lo formateo"], "correcta": 1, "explicacion": "Un USB puede traer malware aunque tu compañero no lo sepa. **Pásale el antivirus** antes de abrir los archivos. Las otras situaciones: si no actualizas, **actualiza el sistema y el antivirus**; si un juego te pide el móvil, **no lo des** (SMS de pago); si un vídeo te pide instalar algo, **no lo instales** y avisa."}}, {"letra": "B", "titulo": "Piensa", "proceso": "Analizar", "enunciado": "Elige una situación: ordenador sin actualizar desde hace meses, un juego que te pide tu móvil para desbloquear un nivel o un vídeo «alucinante» que te pide instalar algo. Explica en tu cuaderno qué podría pasar si no haces nada y qué harías tú, **paso a paso**."}], "criterios": ["DIG.4.3.3"]}, {"tipo": "actividad", "numero": "3", "titulo": "Reviso y entrego mi investigación", "agrupamiento": "Parejas", "tiempo": 18, "enunciado": "Intercambia tu ficha con tu pareja y comprobad la lista. Después exporta la ficha a **PDF** y súbela a Moodle.", "pasos": ["Dos temas, uno de cada lista.", "Cinco preguntas respondidas en cada tema.", "Caso real con **enlace** a una fuente fiable.", "Teléfonos de ayuda (017, ANAR)."], "entrega": "Tarea 8.2 · Investigación de mis dos ciberamenazas", "criterios": ["DIG.4.3.3"]}], "ayudas": [{"tipo": "repaso", "titulo": "Reviso lo que aprendo", "puntos": ["¿Qué pistas delatan un mensaje fraudulento?", "¿Sabrías explicar tus dos amenazas a alguien de 1.º ESO?", "¿Qué has cambiado en la privacidad de tus redes?", "¿Qué te ha resultado más difícil de investigar? ¿Por qué?"]}]}, {"id": "4", "titulo": "Nuestro vídeo concienciador", "fase": "Aplicar y comprobar", "sesiones": [7, 8], "intro": "¡Por fin ha llegado el momento! Con lo que sabes de redes y tus dos fichas, tu pareja y tú vais a crear un vídeo de **2-3 minutos** para el alumnado del instituto.", "bloques": [{"tipo": "narrador", "texto": "Repartíos los papeles: **guionista-locutor/a** (texto y voz sintética) y **animador/a-montador/a** (escenas y montaje). En la sesión 8 os cambiaréis 5 minutos para que los dos animéis."}]}, {"id": "4.1", "titulo": "Guion y voz con IA", "fase": "Aplicar y comprobar", "sesiones": [7], "intro": "Un buen vídeo corto engancha en los primeros segundos, cuenta pocas ideas y termina con un consejo claro.", "bloques": [{"tipo": "video", "titulo": "Analizamos un buen vídeo corto", "busqueda": "INCIBE is4k vídeo corto ciberseguridad adolescentes", "preguntas": ["¿Qué pasa en los primeros 5 segundos?", "¿Cuántas ideas cuenta?", "¿Qué consejo te llevas?"]}, {"tipo": "actividad", "numero": "1", "titulo": "Guion en pareja", "agrupamiento": "Parejas", "tiempo": 23, "enunciado": "Rellenad el **guion A3** con cinco escenas. Máximo **4 frases** de voz por escena: frases cortas, como si se lo contarais a alguien de 1.º.", "pasos": ["Gancho: una pregunta o una situación que enganche.", "Cómo funciona Internet: móvil → router → IP → DNS → servidor.", "Riesgo A y riesgo B: qué es, un caso y qué consecuencias tiene.", "Pautas: cómo prevenir y qué hacer, con 017 y ANAR."], "criterios": ["DIG.4.1.1", "DIG.4.3.3"]}, {"tipo": "actividad", "numero": "2", "titulo": "Voz sintética", "agrupamiento": "Parejas", "tiempo": 15, "enunciado": "Pega el texto de cada escena en **ElevenLabs** o **Speechgen.io** (con la cuenta que te indique el docente), elige una voz en español y descarga **un MP3 por escena** (escena1.mp3, escena2.mp3…).", "ayudas": [{"tipo": "saber_mas", "titulo": "¿Por qué no grabamos nuestra voz?", "texto": "La voz y la cara son **datos personales**. Si el vídeo se comparte, la voz sintética protege tu identidad y tu huella digital."}], "criterios": ["DIG.4.3.1"]}], "ayudas": [{"tipo": "emociones", "titulo": "Trabajar en pareja", "texto": "Cada persona tiene superpoderes: hay quien escribe muy bien y hay quien tiene buen ojo para el diseño. **Compartid lo que sabéis**, respetad las ideas del otro y sumad. ¡Juntos llegáis más lejos!"}]}, {"id": "4.2", "titulo": "Animamos el vídeo", "fase": "Aplicar y comprobar", "sesiones": [8], "intro": "En el autobús ves TikToks **sin sonido** y aun así los entiendes: tienen texto clave en pantalla e iconos. Vuestro vídeo también.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Montaje por escenas", "agrupamiento": "Parejas", "tiempo": 30, "enunciado": "Montad las **cinco escenas** del guion A3 en **Powtoon** o **Animaker** y apuntad de dónde sale cada imagen o música.", "pasos": ["Elige un fondo y un personaje de la biblioteca.", "Escribe la **idea clave** en pantalla (máx. 6 palabras).", "Añade iconos: router, candado, móvil, alerta.", "Importa el MP3 de la escena y ajusta la duración.", "**Nada de fotos** reales de personas."], "criterios": ["DIG.4.3.1", "DIG.4.3.3"]}, {"tipo": "actividad", "numero": "2", "titulo": "Revisión cruzada", "agrupamiento": "Parejas", "tiempo": 8, "enunciado": "Ved el borrador de otra pareja y dejad **un acierto** y **una mejora**.", "pasos": ["¿Se entiende cómo funciona Internet?", "¿Hay dos riesgos con consejos para prevenir y actuar?", "¿Aparece algún dato personal (nombre, cara, voz real, ubicación)?", "¿La voz se oye bien y va con las imágenes?"], "criterios": ["DIG.4.3.1"]}], "ayudas": [{"tipo": "saber_mas", "titulo": "Imágenes y música con permiso", "texto": "Usa la biblioteca de la herramienta o busca en **Openverse** o Pixabay. Anota el nombre del recurso, dónde lo encontraste, su autoría y su licencia en la tabla de créditos del guion A3, y ponlos al final del vídeo."}]}, {"id": "5", "titulo": "Estreno y ¿todo bien?", "fase": "Concluir", "sesiones": [9], "intro": "¡Enhorabuena! Al principio parecía complicado y ahora tienes un vídeo que puede ayudar a otros estudiantes. Es el momento de estrenarlo, decidir cómo se difunde y pensar en todo lo que has aprendido.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Entregamos el vídeo", "agrupamiento": "Parejas", "tiempo": 12, "enunciado": "Revisad la lista «Antes de entregar» del guion A3, exportad el vídeo y entregad **una vez por pareja**: enlace o MP4 + guion A3 en PDF.", "entrega": "Tarea 8.3 · Vídeo «Conectados y protegidos»", "criterios": ["DIG.4.1.1", "DIG.4.3.1", "DIG.4.3.3"]}, {"tipo": "actividad", "numero": "2", "titulo": "Estreno y coevaluación", "agrupamiento": "Gran grupo", "tiempo": 22, "enunciado": "Después de cada vídeo, valóralo en el **formulario F2** (anónimo). Valora el vídeo, no a las personas.", "criterios": ["DIG.4.3.3"]}, {"tipo": "actividad", "numero": "3", "titulo": "Difusión segura", "agrupamiento": "Gran grupo", "tiempo": 6, "enunciado": "¿Dónde publicamos los vídeos? **Sí**: Moodle, la pantalla del vestíbulo o la web del centro con permiso de Orientación. **No**: perfiles personales de TikTok o Instagram, grupos de WhatsApp abiertos ni con nombres, caras o comentarios abiertos.", "test": {"pregunta": "¿Por qué no subimos el vídeo a nuestras propias redes?", "opciones": ["Porque es aburrido", "Porque lo que se publica forma nuestra huella digital y puede descargarse y difundirse sin control", "Porque no se puede"], "correcta": 1, "explicacion": "Un vídeo no se puede «desubir»: alguien puede haberlo descargado. Por eso se difunde **solo en el entorno escolar**."}, "criterios": ["DIG.4.3.1"]}, {"tipo": "actividad", "numero": "4", "titulo": "¿Qué he aprendido?", "agrupamiento": "Individual", "tiempo": 10, "enunciado": "Responde con sinceridad la **autoevaluación F3**: qué has aprendido, qué has cambiado en tu privacidad y cómo ha ido la pareja.", "criterios": []}], "ayudas": [{"tipo": "repaso", "titulo": "Lo que te llevas", "puntos": ["Un vídeo viaja: móvil → **router** → WAN → **DNS** → servidor.", "Protege tu red: **WPA2**, contraseña robusta y router sin la clave de fábrica.", "Protege tus cuentas: **privacidad** y verificación en dos pasos.", "Si pasa algo: **guarda pruebas**, cuéntalo y llama al **017** o a **ANAR**."]}, {"tipo": "emociones", "titulo": "Piensa en lo que has conseguido", "texto": "Has montado una red, has investigado amenazas reales y has creado un vídeo que puede ayudar a otras personas. **Valora tu esfuerzo**: cada día aparecen amenazas nuevas, pero ahora sabes cómo informarte y protegerte."}]}]}}, "cur": {"DIG.4.1": {"tipo": "ce", "texto": "Identificar y resolver problemas técnicos sencillos, conectar y configurar dispositivos a redes domésticas, aplicando los conocimientos de hardware y sistemas operativos, para gestionar de forma sostenible las herramientas e instalaciones informáticas y de comunicación de uso cotidiano.", "descriptores": ["STEM1", "STEM2", "CD4", "CD5", "CPSAA1", "CPSAA5", "CE3"]}, "DIG.4.2": {"tipo": "ce", "texto": "Configurar el entorno personal de aprendizaje, interactuando y aprovechando los recursos del ámbito digital, para optimizar y gestionar el aprendizaje permanente.", "descriptores": ["CD1", "CD2", "CD3", "CPSAA1", "CPSAA4", "CPSAA5", "CE3"]}, "DIG.4.3": {"tipo": "ce", "texto": "Desarrollar hábitos que fomenten el bienestar digital, aplicando medidas preventivas y correctivas, para proteger dispositivos, datos personales y la propia salud.", "descriptores": ["CCL3", "STEM5", "CD1", "CD4", "CPSAA2", "CPSAA5", "CC2", "CC3"]}, "DIG.4.4": {"tipo": "ce", "texto": "Ejercer una ciudadanía digital crítica, conociendo las posibles acciones que realizar en la red, e identificando sus repercusiones, para hacer un uso activo, responsable y ético de la tecnología.", "descriptores": ["CD3", "CD4", "CPSAA1", "CC1", "CC2", "CC3", "CC4", "CE1"]}, "DIG.4.1.1": {"tipo": "cr", "texto": "Conectar dispositivos y gestionar redes locales aplicando los conocimientos y procesos asociados a sistemas de comunicación alámbrica e inalámbrica con una actitud proactiva.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1", "DIG.4.A.4", "DIG.4.A.3"]}, "DIG.4.1.2": {"tipo": "cr", "texto": "Instalar y mantener sistemas operativos, configurando sus características en función de sus necesidades personales, de forma sostenible.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.2"]}, "DIG.4.1.3": {"tipo": "cr", "texto": "Identificar y resolver problemas técnicos sencillos, analizando componentes y funciones de los dispositivos digitales, evaluando las soluciones de manera crítica y reformulando el procedimiento, en caso necesario, fomentando un consumo y reposición de los sistemas digitales y/o tecnológicos de manera sostenible y responsable.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1"]}, "DIG.4.2.1": {"tipo": "cr", "texto": "Gestionar el aprendizaje en el ámbito digital, configurando el entorno personal de aprendizaje mediante la integración de recursos digitales de manera autónoma.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.D.1"]}, "DIG.4.2.2": {"tipo": "cr", "texto": "Buscar, seleccionar y archivar información en función de sus necesidades haciendo uso de las herramientas del entorno personal de aprendizaje con sentido crítico y siguiendo normas básicas de seguridad en la red.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.C.2", "DIG.4.C.3"]}, "DIG.4.2.3": {"tipo": "cr", "texto": "Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.D.1"]}, "DIG.4.2.4": {"tipo": "cr", "texto": "Interactuar en espacios virtuales de comunicación y plataformas de aprendizaje colaborativo, compartiendo y publicando información y datos, adaptándose a diferentes audiencias con una actitud participativa y respetuosa.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.3", "DIG.4.D.5", "DIG.4.D.6"]}, "DIG.4.3.1": {"tipo": "cr", "texto": "Proteger los datos personales y la huella digital generada en internet, configurando las condiciones de privacidad de las redes sociales y espacios virtuales de trabajo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.2"]}, "DIG.4.3.2": {"tipo": "cr", "texto": "Configurar y actualizar contraseñas, sistemas operativos y antivirus de forma periódica en los distintos dispositivos digitales de uso habitual.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.1"]}, "DIG.4.3.3": {"tipo": "cr", "texto": "Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.3"]}, "DIG.4.4.1": {"tipo": "cr", "texto": "Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.5"]}, "DIG.4.4.2": {"tipo": "cr", "texto": "Reconocer las aportaciones de las tecnologías digitales en las gestiones administrativas, y el comercio electrónico, siendo consciente de la brecha social de acceso, uso y aprovechamiento de dichas tecnologías para diversos colectivos.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.4"]}, "DIG.4.4.3": {"tipo": "cr", "texto": "Valorar la importancia de la oportunidad, facilidad y libertad de expresión que suponen los medios digitales conectados, analizando de forma crítica los mensajes que se reciben y transmiten teniendo en cuenta su objetividad, ideología, intencionalidad, sesgos y caducidad.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.6"]}, "DIG.4.4.4": {"tipo": "cr", "texto": "Analizar la necesidad y los beneficios globales de un uso y desarrollo ecosocialmente responsable de las tecnologías digitales, teniendo en cuenta criterios de accesibilidad, sostenibilidad e impacto.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.5"]}, "DIG.4.A": {"tipo": "sb", "texto": "Dispositivos digitales, sistemas operativos y de comunicación.", "hijos": ["DIG.4.A.1", "DIG.4.A.2", "DIG.4.A.3", "DIG.4.A.4"], "criterios": []}, "DIG.4.A.1": {"tipo": "sb", "texto": "Arquitectura de ordenadores: elementos, montaje, configuración y resolución de problemas.", "hijos": [], "criterios": ["DIG.4.1.1"]}, "DIG.4.A.2": {"tipo": "sb", "texto": "Sistemas operativos: instalación y configuración de usuario.", "hijos": [], "criterios": []}, "DIG.4.A.3": {"tipo": "sb", "texto": "Sistemas de comunicación e internet: dispositivos de red y funcionamiento. Procedimiento de configuración de una red doméstica y conexión de dispositivos.", "hijos": [], "criterios": ["DIG.4.1.1"]}, "DIG.4.A.4": {"tipo": "sb", "texto": "Dispositivos conectados (IoT + Wearables): configuración y conexión de dispositivos.", "hijos": [], "criterios": ["DIG.4.1.1"]}, "DIG.4.B": {"tipo": "sb", "texto": "Digitalización del entorno personal de aprendizaje.", "hijos": ["DIG.4.B.1", "DIG.4.B.2", "DIG.4.B.3", "DIG.4.B.4"], "criterios": []}, "DIG.4.B.1": {"tipo": "sb", "texto": "Búsqueda, administración, gestión, selección y archivo de información.", "hijos": [], "criterios": []}, "DIG.4.B.2": {"tipo": "sb", "texto": "Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.", "hijos": [], "criterios": []}, "DIG.4.B.3": {"tipo": "sb", "texto": "Comunicación y colaboración en red.", "hijos": [], "criterios": []}, "DIG.4.B.4": {"tipo": "sb", "texto": "Publicación y difusión responsable en redes.", "hijos": [], "criterios": []}, "DIG.4.C": {"tipo": "sb", "texto": "Seguridad y bienestar digital.", "hijos": ["DIG.4.C.1", "DIG.4.C.2", "DIG.4.C.3"], "criterios": []}, "DIG.4.C.1": {"tipo": "sb", "texto": "Seguridad de dispositivos: medidas preventivas y correctivas para hacer frente a riesgos, amenazas y ataques a dispositivos.", "hijos": [], "criterios": ["DIG.4.3.2"]}, "DIG.4.C.2": {"tipo": "sb", "texto": "Seguridad y protección de datos: identidad, reputación digital, privacidad y huella digital. Medidas preventivas en la configuración de redes sociales y la gestión de identidades virtuales.", "hijos": [], "criterios": ["DIG.4.3.1"]}, "DIG.4.C.3": {"tipo": "sb", "texto": "Seguridad en la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).", "hijos": [], "criterios": ["DIG.4.3.3"]}, "DIG.4.D": {"tipo": "sb", "texto": "Ciudadanía digital crítica.", "hijos": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.3", "DIG.4.D.4", "DIG.4.D.5", "DIG.4.D.6"], "criterios": []}, "DIG.4.D.1": {"tipo": "sb", "texto": "Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.", "hijos": [], "criterios": []}, "DIG.4.D.2": {"tipo": "sb", "texto": "Educación mediática: periodismo digital, blogosfera, estrategias comunicativas y uso crítico de la red. Herramientas para detectar noticias falsas y fraudes.", "hijos": [], "criterios": []}, "DIG.4.D.3": {"tipo": "sb", "texto": "Gestiones administrativas: servicios públicos en línea, registros digitales y certificados oficiales.", "hijos": [], "criterios": []}, "DIG.4.D.4": {"tipo": "sb", "texto": "Comercio electrónico: facturas digitales, formas de pago y criptomonedas.", "hijos": [], "criterios": []}, "DIG.4.D.5": {"tipo": "sb", "texto": "Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.", "hijos": [], "criterios": []}, "DIG.4.D.6": {"tipo": "sb", "texto": "Activismo en línea: plataformas de iniciativa ciudadana y cibervoluntariado y comunidades de hardware y software libres.", "hijos": [], "criterios": []}, "CCL1": {"tipo": "de", "texto": "Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.", "competencias": []}, "CCL2": {"tipo": "de", "texto": "Comprende, interpreta y valora con actitud crítica textos orales, escritos, signados o multimodales de los ámbitos personal, social, educativo y profesional para participar en diferentes contextos de manera activa e informada y para construir conocimiento.", "competencias": []}, "CCL3": {"tipo": "de", "texto": "Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": ["DIG.4.3"]}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": ["DIG.4.1"]}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": ["DIG.4.1"]}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": []}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": ["DIG.4.3"]}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["DIG.4.3"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": []}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": []}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["DIG.4.1", "DIG.4.3"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": ["DIG.4.1"]}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": ["DIG.4.1"]}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": ["DIG.4.3"]}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": []}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": []}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["DIG.4.1", "DIG.4.3"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": []}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": ["DIG.4.3"]}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": ["DIG.4.3"]}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": []}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": []}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["DIG.4.1"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": []}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": []}}, "idx": {"criterios": ["DIG.4.1.1", "DIG.4.3.1", "DIG.4.3.2", "DIG.4.3.3"], "competencias": ["DIG.4.1", "DIG.4.3"], "saberes": ["DIG.4.A.3", "DIG.4.C.1", "DIG.4.C.2", "DIG.4.C.3"], "descriptores": ["CC2", "CC3", "CCL3", "CD1", "CD4", "CD5", "CE3", "CPSAA1", "CPSAA2", "CPSAA5", "STEM1", "STEM2", "STEM5"], "sesionesPorCriterio": {"DIG.4.1.1": [2, 3, 7], "DIG.4.3.2": [3, 6], "DIG.4.3.1": [4, 8, 9], "DIG.4.3.3": [4, 5, 6, 7, 8, 9]}, "porMateria": [{"codigo": "DIG", "criterios": ["DIG.4.1.1", "DIG.4.3.1", "DIG.4.3.2", "DIG.4.3.3"], "competencias": ["DIG.4.1", "DIG.4.3"], "saberes": ["DIG.4.A.3", "DIG.4.C.1", "DIG.4.C.2", "DIG.4.C.3"], "descriptores": ["CC2", "CC3", "CCL3", "CD1", "CD4", "CD5", "CE3", "CPSAA1", "CPSAA2", "CPSAA5", "STEM1", "STEM2", "STEM5"]}], "materiasTxt": "Digitalización", "mapaAlumnado": {"DIG.4.1.1": [{"apartado": "1. ¡Necesitamos tu ayuda!", "actividad": "2. ¿LAN o WAN?", "sesiones": [1]}, {"apartado": "1. ¡Necesitamos tu ayuda!", "actividad": "3. Dibujo la red de mi casa", "sesiones": [1]}, {"apartado": "2.1. Montamos la red", "actividad": "1. Montaje guiado de la red", "sesiones": [2]}, {"apartado": "2.1. Montamos la red", "actividad": "2. ¿Nos vemos? ipconfig y ping", "sesiones": [2]}, {"apartado": "2.2. Internet y un router seguro", "actividad": "1. Conectamos la casa a «Internet»", "sesiones": [3]}, {"apartado": "2.2. Internet y un router seguro", "actividad": "4. Informe y entrega", "sesiones": [3]}, {"apartado": "4.1. Guion y voz con IA", "actividad": "1. Guion en pareja", "sesiones": [7]}, {"apartado": "5. Estreno y ¿todo bien?", "actividad": "1. Entregamos el vídeo", "sesiones": [9]}], "DIG.4.3.1": [{"apartado": "3.1. ¿Real o fraude? Mi privacidad", "actividad": "2. Me busco a ver si me encuentro", "sesiones": [4]}, {"apartado": "3.1. ¿Real o fraude? Mi privacidad", "actividad": "3. Reviso mi privacidad", "sesiones": [4]}, {"apartado": "4.1. Guion y voz con IA", "actividad": "2. Voz sintética", "sesiones": [7
