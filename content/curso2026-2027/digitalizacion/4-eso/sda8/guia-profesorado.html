ividad": "2. ¿Qué opinas de mi nueva contraseña?", "sesiones": [3], "opciones": [{"letra": "A", "titulo": "Recuerda", "proceso": "Recordar"}, {"letra": "B", "titulo": "Analiza", "proceso": "Analizar"}, {"letra": "C", "titulo": "Crea y justifica", "proceso": "Crear"}]}, {"apartado": "3.3. Bulos y comprobación", "actividad": "2. Tú sí que sabes tratar las amenazas", "sesiones": [6], "opciones": [{"letra": "A", "titulo": "Empareja", "proceso": "Recordar"}, {"letra": "B", "titulo": "Piensa", "proceso": "Analizar"}]}]}, "seneca": {"titulo": "SdA 8: Ciberseguridad, redes domésticas y prevención de riesgos", "temporalizacion": "9 sesiones", "justificacion": "El alumnado de 4.º ESO monta y protege en un simulador la red de una casa conectada a Internet e investiga amenazas reales de la red. En pareja produce un vídeo animado con voz sintética que explica cómo funciona Internet y cómo prevenir y actuar ante dos riesgos de ciberseguridad o salud digital, para difundirlo de forma segura en el instituto.", "producto_final": "Una red doméstica simulada en Cisco Packet Tracer (individual), conectada a un servidor web y protegida con WPA2, y un vídeo educativo animado de 2-3 minutos hecho en pareja con Powtoon o Animaker y locución sintética (ElevenLabs o Speechgen.io), que explica cómo funciona Internet y analiza dos riesgos de ciberseguridad o salud digital con sus pautas de prevención y actuación. Los vídeos se estrenan en clase y se difunden de forma segura en el entorno escolar.", "concrecion": [{"materia": "Digitalización", "texto": "COMPETENCIAS ESPECÍFICAS\nDIG.4.1.Identificar y resolver problemas técnicos sencillos, conectar y configurar dispositivos a redes domésticas, aplicando los conocimientos de hardware y sistemas operativos, para gestionar de forma sostenible las herramientas e instalaciones informáticas y de comunicación de uso cotidiano.\nDIG.4.3.Desarrollar hábitos que fomenten el bienestar digital, aplicando medidas preventivas y correctivas, para proteger dispositivos, datos personales y la propia salud.\n\nCRITERIOS DE EVALUACIÓN\nDIG.4.1.1.Conectar dispositivos y gestionar redes locales aplicando los conocimientos y procesos asociados a sistemas de comunicación alámbrica e inalámbrica con una actitud proactiva.\nDIG.4.3.1.Proteger los datos personales y la huella digital generada en internet, configurando las condiciones de privacidad de las redes sociales y espacios virtuales de trabajo.\nDIG.4.3.2.Configurar y actualizar contraseñas, sistemas operativos y antivirus de forma periódica en los distintos dispositivos digitales de uso habitual.\nDIG.4.3.3.Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.\n\nSABERES BÁSICOS\nDIG.4.A.3.Sistemas de comunicación e internet: dispositivos de red y funcionamiento. Procedimiento de configuración de una red doméstica y conexión de dispositivos.\nDIG.4.C.1.Seguridad de dispositivos: medidas preventivas y correctivas para hacer frente a riesgos, amenazas y ataques a dispositivos.\nDIG.4.C.2.Seguridad y protección de datos: identidad, reputación digital, privacidad y huella digital. Medidas preventivas en la configuración de redes sociales y la gestión de identidades virtuales.\nDIG.4.C.3.Seguridad en la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).\n\nDESCRIPTORES OPERATIVOS\nCC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA2. Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable."}], "actividades": [{"titulo": "Montamos y protegemos la red de casa", "tipo": "Exploración", "abreviatura": "EXP1", "orden": "1", "tarea": "8.1 · Mi red doméstica conectada y protegida", "descripcion": "Sesión 1 (50 min): ¿Qué pasa cuando abro TikTok? Redes LAN, WAN e Internet\nReto: Entender el reto de la SdA, contar cómo nos conectamos y dibujar el camino de un vídeo desde el servidor hasta nuestro móvil.\n- Gancho: el viaje de un vídeo (8 min). El docente proyecta un TikTok cualquiera (sin datos de nadie) y pregunta: «¿De dónde ha salido este vídeo? ¿Por dónde ha pasado hasta llegar aquí?». Se anotan las ideas en la pizarra sin corregir. Se presenta el reto: Orientación nos pide vídeos para la semana de la convivencia digital.\n- Encuesta inicial anónima (8 min). El alumnado responde el formulario F1 (anónimo) sobre cómo se conecta en casa, qué redes sociales usa, cuántas horas al día y si ha recibido mensajes sospechosos. El docente proyecta después los resultados agregados para comentarlos.\n- LAN, WAN e Internet con la casa de cada uno (14 min). Explicación corta con la infografía de la web de clase: la LAN es la red de casa (router, móviles, consola, tele), la WAN une redes lejanas e Internet es la red de redes. Ejemplos: el Wi-Fi de casa y del instituto (LAN), la fibra de la compañía (WAN). Cada estudiante clasifica 6 situaciones en LAN o WAN en la diapositiva de práctica y se corrige en voz alta.\n- Cable o Wi-Fi (10 min). Comparación de conexión cableada (Ethernet: más estable y rápida) e inalámbrica (Wi-Fi: movilidad, más interferencias y más expuesta si no se protege). En el cuaderno, cada estudiante dibuja su casa con el router y los dispositivos, marcando cuáles van por cable y cuáles por Wi-Fi.\n- Quiz y salida (10 min). Quiz rápido de 3 preguntas en la web de clase. El docente comprueba que todo el alumnado puede abrir Cisco Packet Tracer con su cuenta (o Filius como alternativa) para la sesión siguiente.\n- Evidencia: Encuesta inicial F1 (diagnóstica)\n- Evidencia: Dibujo de la red de casa en el cuaderno\n\nSesión 2 (50 min): Montamos la red de casa en Packet Tracer\nReto: Construir en el simulador una red doméstica con router inalámbrico, dos ordenadores por cable, un portátil y un móvil por Wi-Fi, y comprobar que se comunican.\n- Recordamos la red de casa (5 min). Dos o tres estudiantes enseñan su dibujo de la sesión anterior. El docente lo relaciona con lo que vamos a montar: la misma casa, pero en el simulador.\n- Conocemos Packet Tracer (10 min). Demostración en el proyector: barra de dispositivos (Network Devices → Wireless Devices → Home Router; End Devices → PC, Laptop, Smartphone), cables (Connections → cable directo de cobre) y modo tiempo real. El alumnado lo repite en su ordenador a la vez.\n- Montaje guiado de la red (20 min). Paso a paso, todos a la vez: colocar el Home Router, dos PC conectados por cable directo a los puertos Ethernet del router, un portátil y un smartphone. Al portátil se le cambia la tarjeta por una inalámbrica (pestaña Physical, apagar, quitar la de cable y poner la WPC300N). En el móvil y el portátil, Config → Wireless0 → SSID por defecto del router. Cada PC: Desktop → IP Configuration → DHCP. Se comprueba que todos los dispositivos tienen una IP 192.168.0.x.\n- ¿Nos vemos? ping e ipconfig (10 min). En el PC0, Desktop → Command Prompt: «ipconfig» para ver su IP, máscara y puerta de enlace, y «ping» a la IP del móvil. El alumnado anota las IP de todos sus dispositivos en la tabla de la plantilla A1 (empiezan a rellenarla hoy). Quien termina antes cambia el nombre de los dispositivos (Mi PC, Móvil de casa…).\n- Guardar y salida (5 min). Se guarda el archivo como «SdA8redNombreApellido.pkt» en Google Drive del centro. Pregunta de salida: ¿qué hace el DHCP del router?\n- Evidencia: Archivo .pkt con la red montada\n- Evidencia: Tabla de direcciones IP (Plantilla A1, parte 1)\n\nSesión 3 (50 min): Conectamos la casa a «Internet» y la protegemos\nReto: Conectar la red doméstica a un servidor web simulado, abrir una página desde el móvil y proteger el Wi-Fi y el router con contraseñas seguras.\n- ¿Qué es un servidor y qué hace el DNS? (7 min). Ejemplo: escribimos «tiktok.com» y no una IP; el DNS es la agenda de contactos de Internet que traduce el nombre a la IP del servidor. El servidor web es el ordenador que guarda la página y la envía.\n- Montamos Internet y el servidor web (18 min). Paso a paso con el proyector: se añade un Server-PT y se conecta al puerto «Internet» del Home Router con cable directo. Router → GUI → Setup: Internet Connection type «Static IP», IP 200.0.0.1, máscara 255.255.255.0, y en DHCP Server Settings, DNS 1 = 200.0.0.10. Servidor: IP 200.0.0.10, puerta de enlace 200.0.0.1; Services → DNS: activado, registro www.misitio.com → 200.0.0.10; Services → HTTP: se edita index.html con un mensaje propio. Desde el smartphone: Desktop → Web Browser → www.misitio.com.\n- Protegemos el Wi-Fi y el router (12 min). Juego rápido «¿Qué opinas de mi nueva contraseña?» (adaptado del REA «¿Controlas las redes? No dejes que te controlen»): se vota en el quiz cuál de cuatro contraseñas protegería el Wi-Fi y se explica por qué las otras no sirven. Después, Router → GUI → Wireless: SSID propio (sin nombre ni apellidos, p. ej. «CasaSegura23»), Security Mode WPA2 Personal y una contraseña de al menos 12 caracteres con mayúsculas, números y símbolos. Administration: cambiar la contraseña de acceso al router («admin» por defecto). Volver a conectar el portátil y el móvil con la nueva contraseña (Config → Wireless0 → WPA2-PSK). Se explica por qué un Wi-Fi abierto o con la contraseña de fábrica es una puerta abierta.\n- Informe y entrega (13 min). Cada estudiante completa la plantilla A1 (tabla de IP, capturas del ping, de la web abierta en el móvil y de la configuración WPA2, y tres preguntas cortas) y entrega en la Tarea 8.1 el archivo .pkt y el informe en PDF. Quien termine antes añade un segundo móvil de una visita y comprueba que sin contraseña no entra, o juega a «La Torre del Tesoro» de Interland (Be Internet Awesome, de Google), sobre contraseñas.\n- Moodle Centros: Tarea «8.1 · Mi red doméstica conectada y protegida» (evaluada con rúbrica 1-3-5-7-10). Entrega individual del archivo de Packet Tracer y del informe A1 (tabla de IP, capturas y preguntas). Evalúa la conexión y configuración de la red y su protección con contraseñas.\n- Evidencia: Red con servidor web y Wi-Fi WPA2 (.pkt)\n- Evidencia: Informe de la red (Plantilla A1)", "temporalizacion": "3 sesiónes", "recursos": "Proyector, Formulario F1, Cuaderno, Packet Tracer, Plantilla A1, Moodle (Tarea 8.1)", "descriptores": "CC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA2. Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nDIG.4.1.1.Conectar dispositivos y gestionar redes locales aplicando los conocimientos y procesos asociados a sistemas de comunicación alámbrica e inalámbrica con una actitud proactiva.\nDIG.4.3.2.Configurar y actualizar contraseñas, sistemas operativos y antivirus de forma periódica en los distintos dispositivos digitales de uso habitual.", "ejercicios": "Responde la encuesta inicial F1 sobre cómo te conectas y qué redes usas.\nClasifica seis situaciones cotidianas en LAN o WAN.\nDibuja la red de tu casa marcando qué dispositivos van por cable y cuáles por Wi-Fi.\nMonta una red doméstica con un router inalámbrico, dos PC por cable, un portátil y un móvil por Wi-Fi.\nConfigura los PC con DHCP y anota la IP de cada dispositivo en la tabla de la plantilla A1.\nComprueba con ping que el PC0 se comunica con el móvil.\nConecta un servidor web al router y abre www.misitio.com desde el móvil simulado.\nProtege el Wi-Fi con WPA2 y una contraseña robusta, y cambia la contraseña del router.\nCompleta el informe A1 con capturas y entrégalo con el archivo .pkt en la Tarea 8.1.", "metodologias": "ABP, Rutina de pensamiento, Instrucción guiada con modelado, Simulación", "sesiones": [1, 2, 3]}, {"titulo": "Vídeo «Conectados y protegidos»", "tipo": "Conclusión", "abreviatura": "CON1", "orden": "2", "tarea": "8.3 · Vídeo «Conectados y protegidos»", "descripcion": "Sesión 4 (50 min): Ciberamenazas: ¿real o fraude? y nuestra privacidad\nReto: Reconocer mensajes fraudulentos, revisar la privacidad de nuestras redes sociales y conocer el catálogo de amenazas del que elegiremos dos temas por pareja.\n- ¿Real o fraude? (12 min). Se proyectan seis capturas inventadas: SMS de «Correos» con enlace, mensaje de Instagram de un sorteo de iPhone, código QR pegado sobre un parquímetro, correo del banco con faltas, aviso real de actualización del sistema y mensaje de un «amigo» que pide un código por WhatsApp. El alumnado vota en el quiz y explica qué pistas lo delatan (urgencia, enlace raro, premio, petición de códigos).\n- Revisamos nuestra privacidad (13 min). Primero, «¿Me busco a ver si me encuentro?» (adaptado del REA): cada estudiante busca su nombre y apellidos entre comillas en el buscador y anota qué aparece de su persona y si le gusta la imagen que da. Después, cada estudiante, con su propio móvil o en el ordenador, revisa en TikTok e Instagram la lista de la diapositiva: cuenta privada, quién puede escribirme y comentar, descarga de mis vídeos, ubicación desactivada, verificación en dos pasos y sesiones abiertas. No se muestra ningún perfil en público. Quien no tiene redes revisa la configuración de privacidad de su cuenta de Google del centro.\n- El catálogo de amenazas (10 min). Presentación del catálogo en dos listas: A (fraudes y ataques: phishing, smishing y vishing, fraude con QR, malware y ransomware, suplantación de identidad, estafas en compras y sorteos falsos) y B (salud y convivencia: ciberacoso, grooming, sextorsión, cibercontrol en la pareja, fake news y deepfakes, retos virales peligrosos, dependencia de las pantallas). Se forman las parejas y cada una sortea un tema de la lista A y otro de la B.\n- Primeras fuentes fiables (15 min). Cada estudiante, de forma individual, busca la definición de sus dos temas en INCIBE, OSI o Internet Segura for Kids (is4k) y empieza la parte 1 de la ficha A2. El docente enseña a reconocer una fuente fiable (quién lo publica, fecha, si cita fuentes).\n- Evidencia: Lista de privacidad revisada (observación)\n- Evidencia: Temas asignados y ficha A2 iniciada\n\nSesión 5 (50 min): Investigamos: casos reales, riesgos y prevención\nReto: Encontrar un caso real de cada amenaza y analizar sus riesgos, cómo se previene y qué hacer si ya ha ocurrido.\n- Modelo de análisis (10 min). El docente analiza en voz alta un tema que no está en el catálogo (el fraude del falso soporte técnico) siguiendo las cinco preguntas de la ficha A2: qué es, un caso real (noticia de un medio conocido o de la Policía Nacional o Guardia Civil), qué riesgos tiene, cómo se previene y qué hacer si ya ha pasado.\n- Investigación del tema A (17 min). Cada estudiante completa en la ficha A2 su tema de la lista A: caso real con enlace a la fuente, riesgos (para el dispositivo, el dinero, los datos), tres medidas de prevención y qué hacer (cambiar contraseñas, avisar al banco, denunciar, llamar al 017). La pareja puede comentar, pero cada ficha es individual.\n- Investigación del tema B (18 min). Lo mismo con el tema de la lista B, centrando los riesgos en la salud física y mental y la convivencia (ansiedad, aislamiento, daño a otras personas) y la actuación: no responder, guardar pruebas, bloquear, contar a un adulto de confianza, ANAR o 017, y denunciar si es delito.\n- Puesta en común rápida (5 min). Tres estudiantes leen una medida de prevención que no sabían. Pregunta de salida: ¿a quién pedirías ayuda si te pasara?\n- Evidencia: Ficha A2 con los dos temas en progreso\n\nSesión 6 (50 min): Bulos, comprobación y entrega de la investigación\nReto: Aprender a comprobar si una información es un bulo, revisar la ficha y entregar la investigación de las dos amenazas.\n- ¿Bulo o verdad? (10 min). Se proyectan tres titulares inventados con formato de publicación de Instagram (un reto viral, un supuesto peligro de una app y una cifra exagerada). Se aplica la regla de los cuatro pasos: quién lo dice, cuándo, busca la noticia en otro medio y búsqueda inversa de la imagen. Se nombran verificadores como Maldita.es o Newtral.\n- Completar la ficha A2 (17 min). Cada estudiante termina las dos investigaciones. Quien ya ha terminado añade en la parte final un consejo pensado para alumnado de 1.º ESO. El docente revisa fichas en directo con la lista «Antes de entregar».\n- Comprobación multinivel: ¿qué harías? (5 min). Comprobación individual con dos opciones de distinta exigencia, adaptada de «Tú sí que sabes tratar al malware» del REA. A (Recordar): emparejar cuatro situaciones (memoria USB de un compañero, ordenador sin actualizar desde hace meses, juego que pide tu móvil para desbloquear un nivel, vídeo «alucinante» que pide instalar algo) con la medida que protege. B (Analizar): elegir una situación y explicar en el cuaderno qué puede pasar y qué haría paso a paso.\n- Revisión entre la pareja (8 min). Los miembros de la pareja intercambian fichas y comprueban con la lista de cotejo de la Tarea 8.2 que están completas: dos temas, cinco preguntas cada uno, caso real con enlace a una fuente fiable y teléfonos de ayuda.\n- Entrega de la Tarea 8.2 (10 min). Exportar la ficha a PDF y entregarla en la Tarea 8.2 de forma individual. Avance de la sesión siguiente: con estas dos fichas la pareja escribirá el guion del vídeo.\n- Moodle Centros: Tarea «8.2 · Investigación de mis dos ciberamenazas» (corrección Apto / No apto). Entrega individual de la ficha A2. Verifica que cada estudiante ha investigado sus dos amenazas antes de pasar al guion del vídeo.\n- Evidencia: Ficha A2 completa (Tarea 8.2)\n- Evidencia: Comprobación multinivel en el cuaderno\n\nSesión 7 (50 min): Guion del vídeo y voz con inteligencia artificial\nReto: Escribir en pareja el guion del vídeo y generar la locución con una voz sintética.\n- Analizamos un buen vídeo corto (7 min). Se ve un vídeo divulgativo breve sobre ciberseguridad (búsqueda propuesta en la web de clase) y se identifica su estructura: gancho en los primeros 5 segundos, explicación, consejo y cierre. Se recuerda el encargo: 2-3 minutos, para estudiantes del instituto.\n- Guion en pareja (23 min). Cada pareja rellena la plantilla A3: escena 1, gancho; escena 2, cómo funciona Internet (router, IP, DNS y servidor, con lo aprendido en Packet Tracer); escenas 3 y 4, un riesgo cada una (qué es, caso, consecuencia); escena 5, pautas de prevención y qué hacer, con los teléfonos de ayuda. Cada escena lleva el texto de la voz (máximo 4 frases) y la idea de lo que se verá. Roles: guionista-locutor/a y animador/a-montador/a.\n- Voz sintética (15 min). El guionista-locutor/a pega el texto de cada escena en ElevenLabs o Speechgen.io (con la cuenta que indique el docente), elige una voz en español, ajusta la velocidad y descarga un MP3 por escena. Se explica por qué usamos voz sintética: protege nuestra identidad (ni nuestra voz ni nuestra cara aparecen en el vídeo). Mientras, el animador/a prepara el proyecto en Powtoon o Animaker y elige plantilla.\n- Control de avance (5 min). Cada pareja enseña al docente el guion y al menos un audio. Se guardan los MP3 en una carpeta compartida de Drive de la pareja.\n- Evidencia: Guion A3 en progreso\n- Evidencia: Audios de la locución\n\nSesión 8 (50 min): Animamos el vídeo en Powtoon o Animaker\nReto: Montar la animación de las cinco escenas sincronizada con la locución y con imágenes y música con licencia libre.\n- Demostración de montaje (8 min). El docente monta en directo una escena en Powtoon o Animaker: fondo, personaje, texto clave en pantalla, iconos (router, candado, móvil), importar el MP3 de la escena y ajustar la duración al audio. Se recuerda: nada de fotos reales de personas, ni del alumnado ni de nadie.\n- Montaje por escenas (30 min). Cada pareja monta sus cinco escenas siguiendo el guion A3. Animador/a: animación y textos; guionista-locutor/a: revisa que cada escena coincide con el guion y busca recursos con licencia (bibliotecas de la propia herramienta, Openverse o Pixabay) y anota los créditos. A mitad de sesión se cambian los roles 5 minutos para que ambos animen.\n- Revisión cruzada (8 min). Cada pareja ve el borrador de otra con la lista de la diapositiva: se entiende cómo funciona Internet, aparecen dos riesgos con consejos, no hay datos personales y la voz se oye bien. Se dejan dos comentarios: algo que funciona y algo que mejorar.\n- Plan para terminar (4 min). Cada pareja anota en el guion A3 lo que le falta. Quien vaya retrasado puede terminar en casa o en el recreo con el aula abierta.\n- Evidencia: Borrador del vídeo animado\n- Evidencia: Comentarios de la revisión cruzada\n\nSesión 9 (50 min): Estreno y difusión segura de los vídeos\nReto: Terminar y entregar el vídeo, estrenarlo en clase, valorar los de otras parejas y decidir cómo se difunden de forma segura.\n- Últimos retoques y exportación (12 min). Cada pareja termina, revisa con la lista «Antes de entregar» del guion A3, exporta el vídeo (o copia el enlace de visualización) y entrega en la Tarea 8.3 el enlace o el MP4 y el guion A3 en PDF. Una entrega por pareja, con los dos nombres.\n- Estreno en clase (22 min). Se proyectan los vídeos (unos 2-3 minutos cada uno; si no da tiempo a todos, se ven 6-7 y el resto se comparte en Moodle). Tras cada uno, el alumnado valora en el formulario F2 (anónimo y repetible): si se entiende cómo funciona Internet, si los consejos son útiles y qué mejoraría.\n- Difusión segura (6 min). Debate breve: ¿dónde publicamos los vídeos? Se acuerda compartirlos solo en el entorno escolar (Moodle, pantalla del vestíbulo, web del centro con autorización de Orientación) y se repasa: sin datos personales, con créditos, sin comentarios abiertos.\n- Autoevaluación y cierre (10 min). Formulario F3 de autoevaluación (con el correo del centro): qué he aprendido de redes, qué riesgo me ha sorprendido, qué he cambiado en mi privacidad y cómo ha funcionado la pareja. Se vuelve a la pregunta guía y se completa el dibujo del viaje de un TikTok de la sesión 1.\n- Moodle Centros: Tarea «8.3 · Vídeo «Conectados y protegidos»» (evaluada con rúbrica 1-3-5-7-10). Entrega por pareja del vídeo animado (enlace o MP4) y del guion A3 en PDF. Evalúa la explicación de cómo funciona Internet, el análisis de los dos riesgos con sus pautas y la protección de la privacidad en la difusión.\n- Evidencia: Vídeo final y guion A3 (Tarea 8.3)\n- Evidencia: Coevaluación F2\n- Evidencia: Autoevaluación F3", "temporalizacion": "6 sesiónes", "recursos": "Proyector, Móviles del alumnado (opcional), Webs de INCIBE e is4k, Plantilla A2, Webs de INCIBE, OSI e is4k, Moodle (Tarea 8.2), Maldita.es / Newtral, Plantilla A3, ElevenLabs o Speechgen.io, Powtoon o Animaker, Auriculares, Openverse / Pixabay, Proyector y altavoces, Moodle (Tarea 8.3), Formularios F2 y F3", "descriptores": "CC2. Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':''); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

/* ---------- cabecera ---------- */
const M = S.meta;
$('#h-kicker').textContent = `LOMLOE · Andalucía · ${IDX.materiasTxt} · ${M.curso_texto || ''}`;
$('#h-title').textContent = M.titulo; $('#h-sub').textContent = M.subtitulo || '';
$('#h-meta').innerHTML = [ `${S.sesiones.length} sesiones de ${M.duracion_sesion||50} min`, M.agrupamiento, M.temporalizacion, M.anio_academico ].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');

/* ---------- pestañas ---------- */
const TABS = [['vision','1. Visión general'],['seq','2. Secuenciación'],['map','3. Mapeo curricular'],['moodle','4. Moodle Centros'],['dua','5. DUA y diversidad'],['eval','6. Evaluación'],['seneca','7. Para Séneca']];
const HAY_ANX = !!(S.anexos && ((S.anexos.plantillas||[]).length || (S.anexos.formularios||[]).length));
if (HAY_ANX) TABS.push(['anx', (TABS.length+1)+'. Anexos']);
if (S.creditos) TABS.push(['cred', (TABS.length+1)+'. Créditos']);
$('#tabs').innerHTML = TABS.map(([id,t],i)=>`<button role="tab" data-tab="${id}" aria-selected="${i===0}">${t}</button>`).join('');
$('#main').innerHTML = TABS.map(([id],i)=>`<section class="panel ${i===0?'on':''}" id="p-${id}" role="tabpanel"></section>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+b.dataset.tab)); try{localStorage.setItem('sda-tab',b.dataset.tab)}catch(_){} };
try{ const t = localStorage.getItem('sda-tab'); if(t){ const b = document.querySelector(`#tabs button[data-tab="${t}"]`); b && b.click(); } }catch(_){}
function openAll(){ document.querySelectorAll('details.ses').forEach(d=>d.open=true); }

/* ---------- 1. visión ---------- */
(function(){
  const V = S.vision || {};
  const rec = S.recursos || {};
  $('#p-vision').innerHTML = `<div class="grid g3"><div class="grid">
    <div class="card"><h2>Descripción y contexto</h2><p>${esc(V.descripcion)}</p><p>${esc(V.contexto)}</p></div>
    <div class="card"><h2>Justificación curricular</h2><p>${esc(V.justificacion)}</p>
      <div class="lab">Competencias específicas</div>${chips(IDX.competencias)}
      <div class="lab">Criterios de evaluación</div>${chips(IDX.criterios)}
      <div class="lab">Saberes básicos</div>${chips(IDX.saberes)}
      <div class="lab">Descriptores del Perfil de salida</div>${chips(IDX.descriptores)}</div>
    <div class="card reto"><h2>El reto</h2><p><i>${esc(V.reto)}</i></p><div class="lab">Pregunta guía</div><p class="q">${esc(V.pregunta_guia)}</p></div>
    <div class="card"><h2>Producto final</h2><p>${esc(V.producto_final)}</p></div>
  </div><div class="grid" style="align-content:start">
    <div class="card"><h2>Metodologías</h2>${arr(S.metodologias).map(m=>`<p><b>${esc(m.nombre)}</b>${m.descripcion?': '+esc(m.descripcion):''}</p>`).join('')}</div>
    <div class="card"><h2>Recursos</h2>${Array.isArray(rec)?ul(rec):Object.entries(rec).map(([k,v])=>`<div class="lab">${esc(k)}</div>${ul(v)}`).join('')}</div>
  </div></div>`;
})();

/* ---------- 2. secuenciación ---------- */
(function(){
  const COLORS = ['#2563eb','#0891b2','#0f766e','#7c3aed','#b45309','#be123c'];
  const fases = arr(S.fases);
  const total = S.sesiones.length;
  const fcol = {}; fases.forEach((f,i)=>fcol[f.nombre]=COLORS[i%COLORS.length]);
  const count = f => S.sesiones.filter(s=>s.fase===f.nombre).length;
  let h = `<div class="card"><h2>Distribución temporal</h2><div class="timeline">${fases.map(f=>`<div style="flex:${count(f)};background:${fcol[f.nombre]}">${esc(f.nombre)} · ${count(f)} ses.</div>`).join('')}</div>
    <div class="grid g2" style="margin-top:12px">${fases.map(f=>`<div><b style="color:${fcol[f.nombre]}">${esc(f.nombre)}</b> (sesiones ${esc(f.sesiones||'')}) — ${esc(f.finalidad||'')} · ${Math.round(count(f)/total*100)} %</div>`).join('')}</div></div>`;
  const duaSet = [...new Set(S.sesiones.flatMap(s=>arr(s.dua && s.dua.principios)))];
  h += `<div class="filters" id="ff"><span class="legend">Fase:</span><button class="on" data-f="*">Todas</button>${fases.map(f=>`<button data-f="${esc(f.nombre)}">${esc(f.nombre)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">DUA:</span>${duaSet.map(d=>`<button data-d="${esc(d)}">${esc(d)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">Moodle:</span><button data-m="1">Con actividad Moodle</button>
    <button data-open="1" style="margin-left:auto">Desplegar todas</button></div><div id="slist"></div>`;
  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){
    const list = S.sesiones.filter(s => (state.f==='*'||s.fase===state.f) && (!state.d || arr(s.dua&&s.dua.principios).includes(state.d)) && (!state.m || arr(s.moodle).length));
    $('#slist').innerHTML = list.map(s => `<details class="ses" data-n="${s.n}"><summary><div class="num" style="background:${fcol[s.fase]}22;color:${fcol[s.fase]}">${s.n}</div>
      <div><div class="stitle">Sesión ${s.n} · ${esc(s.titulo)} <span class="badge">${esc(s.fase)}</span>${arr(s.moodle).length?'<span class="badge" style="background:var(--moodle-bg);color:var(--moodle)">Moodle</span>':''}</div><div class="sreto">${esc(s.reto)}</div></div></summary>
      <div class="sbody"><div>${arr(s.actividades).map(a=>`<div class="act"><b>${esc(a.nombre)}</b><span class="min">${a.min?esc(a.min)+' min':''}</span><p>${esc(a.desc)}</p></div>`).join('')}
        ${arr(s.moodle).length?`<div class="moodle"><div class="mh">Integración con Moodle Centros</div>${arr(s.moodle).map(m=>`<div class="mitem"><div class="mt">${esc(m.recurso)} · «${esc(m.nombre)}»${corrBadge(m)}${m.criterio?' '+chip(m.criterio):''}</div><p>${esc(m.uso)}</p>${m.correccion==='apto'?`<div class="lab">Se verifica</div>${ul(m.cotejo)}`:''}${m.correccion==='rubrica'?`<p class="note">Se evalúa con la rúbrica de la pestaña «6. Evaluación».</p>`:''}${arr(m.config).length?`<div class="lab">Configuración</div>`+ul(m.config):''}</div>`).join('')}</div>`:''}
      </div><div class="side">
        <div class="lab">Criterios</div>${arr(s.criterios).length?chips(s.criterios):'<span class="note">Evaluación diagnóstica (no calificable)</span>'}
        <div class="lab">Saberes</div>${chips(s.saberes)}
        ${arr(s.metodologia).length?`<div class="lab">Metodología</div><p>${arr(s.metodologia).map(esc).join(' · ')}</p>`:''}
        ${arr(s.evidencias).length?`<div class="lab">Evidencias</div>${ul(s.evidencias)}`:''}
        ${arr(s.recursos).length?`<div class="lab">Recursos</div><p>${arr(s.recursos).map(esc).join(' · ')}</p>`:''}
        ${s.dua?`<div class="lab">DUA (${arr(s.dua.principios).map(esc).join(', ')})</div><p>${esc(s.dua.medidas)}</p>`:''}
      </div></div></details>`).join('') || '<p class="note">Ninguna sesión coincide con el filtro.</p>';
  }
  $('#ff').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.open){ openAll(); return; }
    if(b.dataset.f){ state.f=b.dataset.f; $('#ff').querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); }
    if(b.dataset.d){ state.d = state.d===b.dataset.d?null:b.dataset.d; $('#ff').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===state.d)); }
    if(b.dataset.m){ state.m=!state.m; b.classList.toggle('on',state.m); }
    render(); };
  render();
})();

/* ---------- 3. mapeo ---------- */
(function(){
  const used = new Set(IDX.saberes);
  const inst = (S.evaluacion && S.evaluacion.instrumentos) || {};
  let h = `<div class="card"><h2>Matriz curricular</h2><p class="legend">Los saberes tachados están vinculados oficialmente al criterio pero no se movilizan en esta situación de aprendizaje.</p><div class="scroll"><table class="tbl"><thead><tr><th>Competencia</th><th>Criterio</th><th>Saberes</th><th>Descriptores</th><th>Sesiones</th><th>Instrumentos</th></tr></thead><tbody>`;
  IDX.criterios.forEach(c => { const it = CUR[c]; const ce = CUR[it.competencia];
    h += `<tr><td>${chip(it.competencia)}<div class="note">${esc(ce.texto)}</div></td><td>${chip(c)}<div class="note">${esc(it.texto)}</div></td>
      <td>${arr(it.saberes).map(s=>chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}</td><td>${chips(ce.descriptores)}</td>
      <td>${(IDX.sesionesPorCriterio[c]||[]).map(n=>'S'+n).join(', ')}</td><td>${ul(inst[c])}</td></tr>`; });
  h += `</tbody></table></div></div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Criterios trabajados por sesión</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${S.sesiones.map(s=>`<th>S${s.n}</th>`).join('')}</tr></thead><tbody>`;
  IDX.criterios.forEach(c => { h += `<tr><td>${chip(c)}</td>${S.sesiones.map(s=>`<td class="tick">${arr(s.criterios).includes(c)?'✔':''}</td>`).join('')}</tr>`; });
  h += `</tbody></table></div></div>`;
  const MA = IDX.mapaAlumnado || {};
  if(Object.values(MA).some(v=>v.length)) h += `<div class="card" style="margin-top:16px"><h2>Dónde se evidencia cada criterio en la guía del alumnado</h2><p class="note">Apartados y actividades de la guía del alumnado que dejan evidencia de cada criterio.</p><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th><th>Apartado y actividad</th><th>Sesiones</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${arr(MA[c]).map(x=>`<div><b>${esc(x.apartado)}</b> → ${esc(x.actividad)}</div>`).join('') || '<span class="note">—</span>'}</td><td>${[...new Set(arr(MA[c]).flatMap(x=>x.sesiones))].sort((a,b)=>a-b).map(n=>'S'+n).join(', ')}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(S.notas_rigor).length) h += `<div class="card" style="margin-top:16px"><h2>Notas de rigor curricular</h2>${ul(S.notas_rigor)}</div>`;
  $('#p-map').innerHTML = h;
})();

/* ---------- 4. moodle ---------- */
(function(){
  const Mo = S.moodle || {};
  // Criterios de una Tarea: el principal y los de cada línea de su rúbrica (así llegan todos a Séneca)
  const critsDe = m => [...new Set([m.criterio, ...arr(m.rubrica).map(l=>l.criterio)].filter(Boolean))];
  const all = S.sesiones.flatMap(s => arr(s.moodle).map(m => ({...m, n:s.n})));
  let h = `<div class="grid g2"><div class="card"><h2>Estructura del curso</h2>${Mo.estructura?`<p>${esc(Mo.estructura)}</p>`:''}${arr(Mo.secciones).map(sec=>`<div class="lab">${esc(sec.nombre)}</div>${ul(sec.elementos)}`).join('')}</div>
    <div class="card"><h2>Libro de calificaciones</h2>${Mo.calificaciones?`<p>${esc(Mo.calificaciones)}</p>`:''}<p class="note">Una Tarea con rúbrica aparece en todos los criterios que evalúan sus líneas; la nota de cada criterio la calcula la pestaña «Evaluación» y es la que se pasa a Séneca.</p>
      <table class="tbl"><thead><tr><th>Criterio</th><th>Elementos calificables en Moodle</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${all.filter(m=>m.calificable && critsDe(m).includes(c)).map(m=>{ const ls = arr(m.rubrica).filter(l=>l.criterio===c).map(l=>l.linea);
        return `S${m.n} · ${esc(m.recurso)} «${esc(m.nombre)}»${ls.length && critsDe(m).length>1 ? `<div class="note">Líneas de la rúbrica: ${ls.map(esc).join(' · ')}</div>` : ''}`; }).join('<br>') || '<span class="note">Se califica fuera de Moodle (observación, exposición…)</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(Mo.configuracion).length) h += `<div class="card" style="margin-top:16px"><h2>Configuración general recomendada</h2>${ul(Mo.configuracion)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Todas las actividades de Moodle</h2><div class="scroll"><table class="tbl"><thead><tr><th>Sesión</th><th>Recurso</th><th>Nombre</th><th>Corrección</th><th>Para qué</th><th>Configuración clave</th></tr></thead><tbody>${all.map(m=>`<tr><td>S${m.n}</td><td>${esc(m.recurso)}</td><td>${esc(m.nombre)} ${chips(critsDe(m))}</td><td>${corrBadge(m)||'—'}</td><td>${esc(m.uso)}</td><td>${ul(m.config)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#p-moodle').innerHTML = h;
})();

/* ---------- 5. DUA ---------- */
(function(){
  const D = S.dua || {};
  let h = `<div class="grid g2">${Object.entries(D).map(([k,v])=>`<div class="card"><h2>${esc(k)}</h2>${ul(v)}</div>`).join('')}</div>`;
  if(arr(S.diversidad).length) h += `<div class="card" style="margin-top:16px"><h2>Atención a la diversidad</h2><table class="tbl"><thead><tr><th>Perfil</th><th>Medidas concretas</th></tr></thead><tbody>${S.diversidad.map(d=>`<tr><td><b>${esc(d.perfil)}</b></td><td>${esc(d.medidas)}</td></tr>`).join('')}</tbody></table></div>`;
  if(arr(IDX.multinivel).length) h += `<div class="card" style="margin-top:16px"><h2>Actividades multinivel y procesos cognitivos</h2><p class="note">Cada actividad grupal se resuelve después de forma individual eligiendo una opción, de menor a mayor exigencia cognitiva.</p><div class="scroll"><table class="tbl"><thead><tr><th>Apartado</th><th>Actividad grupal</th><th>Opción individual</th><th>Proceso cognitivo</th></tr></thead><tbody>${IDX.multinivel.map(m=>arr(m.opciones).map((o,i)=>`<tr><td>${i?'':esc(m.apartado)}</td><td>${i?'':'<b>'+esc(m.actividad)+'</b>'}</td><td>${esc(o.letra)} · ${esc(o.titulo)}</td><td><span class="badge">${esc(o.proceso)}</span></td></tr>`).join('')).join('')}</tbody></table></div></div>`;
  if(arr(S.roles).length) h += `<div class="card" style="margin-top:16px"><h2>Roles del equipo</h2><table class="tbl"><tbody>${S.roles.map(r=>`<tr><td><b>${esc(r.rol)}</b></td><td>${esc(r.funcion)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#p-dua').innerHTML = h;
})();

/* ---------- 6. evaluación ---------- */
(function(){
  const E = S.evaluacion || {};
  let st = {}; try{ st = JSON.parse(localStorage.getItem('sda-cotejo-'+M.titulo)||'{}'); }catch(_){}
  let h = `<div class="card"><h2>Lista de cotejo interactiva</h2><p class="note">Marca los indicadores logrados; el progreso se calcula por criterio y se guarda en este navegador.</p>
    <div class="grid g2">${arr(E.cotejo).map((g,gi)=>`<div class="side"><span class="pct" data-p="${gi}"></span>${chip(g.criterio)}<div class="bar"><div data-b="${gi}"></div></div><ul class="cot" style="padding:0">${arr(g.indicadores).map((t,i)=>`<li><label><input type="checkbox" data-k="${gi}-${i}" ${st[gi+'-'+i]?'checked':''}> <span>${esc(t)}</span></label></li>`).join('')}</ul></div>`).join('')}</div>
    <button class="copy" id="cot-reset" style="margin-top:10px">Borrar marcas</button></div>`;
  const TR = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='rubrica').map(m=>({...m,n:x.n})));
  const TA = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='apto').map(m=>({...m,n:x.n})));
  const PTS = [1,3,5,7,10];
  if(TR.length) h += `<div class="card" style="margin-top:16px"><h2>Rúbricas de las tareas finales</h2><p class="note">Cada línea se puntúa con 1, 3, 5, 7 o 10 puntos y la nota es la media (ponderada cuando la línea indica su peso). Pulsa una casilla para calcular la nota de un estudiante (no se guarda).</p>${TR.map((m,ti)=>`<h3>${tname(m)} ${chips([...new Set(arr(m.rubrica).map(l=>l.criterio||m.criterio))])} <span class="pct" data-rn="${ti}"></span></h3><div class="scroll"><table class="tbl rub" data-t="${ti}"><thead><tr><th>Línea</th>${PTS.map(p=>`<th>${p} pto</th>`).join('')}</tr></thead><tbody>${arr(m.rubrica).map((l,li)=>`<tr><td><b>${esc(l.linea)}</b>${l.criterio?`<br><small>${esc(l.criterio)}</small>`:''}${l.peso?`<br><small>peso ${String(l.peso).replace('.',',')} %</small>`:''}</td>${arr(l.niveles).map((x,k)=>`<td class="rc" data-l="${li}" data-w="${l.peso||1}" data-c="${esc(l.criterio||m.criterio||'')}" data-p="${PTS[k]}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
  if(TA.length) h += `<div class="card" style="margin-top:16px"><h2>Tareas de verificación (Apto / No apto)</h2><p class="note">Es Apto si se cumplen todos los elementos.</p><div class="grid g2">${TA.map(m=>`<div class="side"><b>${tname(m)}</b> ${chip(m.criterio)}${ul(m.cotejo)}</div>`).join('')}</div></div>`;
  if(arr(E.rubrica).length){ const niv = E.niveles || ['Insuficiente (1-4)','Suficiente / Bien (5-6)','Notable (7-8)','Sobresaliente (9-10)'];
    h += `<div class="card" style="margin-top:16px"><h2>Rúbrica</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${niv.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${E.rubrica.map(r=>`<tr><td>${chip(r.criterio)}</td>${arr(r.niveles).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; }
  if(E.agentes) h += `<div class="card" style="margin-top:16px"><h2>Agentes e instrumentos</h2>${Object.entries(E.agentes).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;
  $('#p-eval').innerHTML = h;
  const sel = {};
  $('#p-eval').addEventListener('click', e => { const c = e.target.closest('td.rc'); if(!c) return; const t = c.closest('table').dataset.t;
    c.parentElement.querySelectorAll('td.rc').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    sel[t] = sel[t]||{}; sel[t][c.dataset.l] = [+c.dataset.p, +c.dataset.w]; const v = Object.values(sel[t]); const nl = c.closest('tbody').rows.length;
    const wt = [...c.closest('tbody').rows].reduce((a,r)=>a+(+r.querySelector('td.rc').dataset.w),0);
    document.querySelector(`[data-rn="${t}"]`).textContent = `Nota: ${(v.reduce((a,[p,w])=>a+p*w,0)/wt).toFixed(1)}` + (()=>{ const rs=[...c.closest('tbody').rows].map(r=>r.querySelector('td.rc').dataset); const cs=[...new Set(rs.map(d=>d.c))]; if(cs.length<2) return ''; return ' · ' + cs.map(k=>{ const ws=rs.filter(d=>d.c===k).reduce((a,d)=>a+(+d.w),0); const pt=Object.entries(sel[t]).filter(([i])=>rs[i].c===k).reduce((a,[,x])=>a+x[0]*x[1],0); return k+': '+(pt/ws).toFixed(1); }).join(' · '); })() + (v.length<nl?` (faltan ${nl-v.length} líneas)`:''); });
  function upd(){ arr(E.cotejo).forEach((g,gi)=>{ const n = arr(g.indicadores).length; const k = arr(g.indicadores).filter((_,i)=>st[gi+'-'+i]).length; const p = n?Math.round(k/n*100):0;
    document.querySelector(`[data-b="${gi}"]`).style.width = p+'%'; document.querySelector(`[data-p="${gi}"]`).textContent = p+' %'; }); }
  function save(){ try{ localStorage.setItem('sda-cotejo-'+M.titulo, JSON.stringify(st)); }catch(_){} }
  $('#p-eval').addEventListener('change', e => { const k = e.target.dataset.k; if(k){ st[k]=e.target.checked; save(); upd(); } });
  $('#cot-reset').onclick = () => { st = {}; save(); document.querySelectorAll('#p-eval input[type=checkbox]').forEach(x=>x.checked=false); upd(); };
  upd();
})();

/* ---------- 8. Créditos ---------- */
(function(){
  const C = S.creditos; if(!C) return;
  const o = C.original || {}, A = C.adaptacion || {}, L = C.licencia || {};
  const lic = L.url ? `<a href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.nombre)}</a>` : esc(L.nombre||'');
  let h = `<div class="grid g3"><div class="grid" style="align-content:start">`;
  if(o.titulo) h += `<div class="card"><h2>Recurso original</h2><p>Esta situación de aprendizaje es una adaptación de <b>«${esc(o.titulo)}»</b>${o.organizacion?' ('+esc(o.organizacion)+')':''}.</p>
    <table class="tbl"><tbody>${arr(o.personas).map(x=>`<tr><th style="width:38%">${esc(x.funcion)}</th><td>${esc(x.nombres)}</td></tr>`).join('')}${o.version?`<tr><th>Versión original</th><td>${esc(o.version)}</td></tr>`:''}${o.fuente?`<tr><th>Fuente</th><td>${/^https?:/.test(o.fuente)?`<a href="${esc(o.fuente)}" target="_blank" rel="noopener">${esc(o.fuente)}</a>`:esc(o.fuente)}</td></tr>`:''}</tbody></table></div>`;
  if(arr(C.recursos).length) h += `<div class="card"><h2>Recursos de terceros</h2><div class="scroll"><table class="tbl"><thead><tr><th>Recurso</th><th>Autoría</th><th>Licencia</th></tr></thead><tbody>${C.recursos.map(r=>`<tr><td>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.elemento)}</a>`:esc(r.elemento)}</td><td>${esc(r.autoria)}</td><td>${esc(r.licencia)}</td></tr>`).join('')}</tbody></table></div></div>`;
  h += `</div><div class="grid" style="align-content:start"><div class="card reto"><h2>Licencia</h2><p class="q">${L.url?`<a style="color:#fff" href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.nombre)}</a>`:esc(L.nombre||'')}</p>${L.nota?`<p>${esc(L.nota)}</p>`:''}</div>`;
  if(A.autoria||A.cambios) h += `<div class="card"><h2>Adaptación</h2>${A.autoria?`<p><b>${esc(A.autoria)}</b>${A.fecha?' · '+esc(A.fecha):''}</p>`:''}${A.cambios?`<p>${esc(A.cambios)}</p>`:''}</div>`;
  if(o.cita) h += `<div class="card"><h2>Cómo citarla</h2><div class="copybox"><div class="ch"><span>Cita</span><button class="copy">Copiar</button></div><pre>${esc(o.cita)}</pre></div></div>`;
  h += `</div></div>`;
  $('#p-cred').innerHTML = h;
  const f = document.createElement('footer'); f.className = 'wrap note'; f.style.padding = '0 16px 32px';
  f.innerHTML = `${o.titulo?`Adaptación de «${esc(o.titulo)}»${o.organizacion?' · '+esc(o.organizacion):''} · `:''}Licencia ${lic}`;
  document.body.appendChild(f);
})();

/* ---------- 7. Séneca ---------- */
(function(){
  const SE = DATA.seneca;
  const box = (t, txt) => `<div class="copybox"><div class="ch"><span>${esc(t)}</span><button class="copy">Copiar</button></div><pre>${esc(txt)}</pre></div>`;
  let h = `<div class="card"><h2>Textos listos para pegar en Séneca</h2><p class="note">Séneca guarda texto plano: estos bloques no llevan formato Markdown. Copia cada campo en su casilla del formulario de la situación de aprendizaje.</p>
    ${box('Título', SE.titulo)}${box('Temporalización', SE.temporalizacion)}${box('Justificación', SE.justificacion)}${box('Producto final', SE.producto_final)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Concreción curricular</h2><p class="note">En Séneca se marcan en las listas; aquí tienes la selección para comprobarla.</p>${SE.concrecion.map(m=>box(m.materia, m.texto)).join('')}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Actividades (formulario «Detalle de la actividad»)</h2><p class="note">Los campos siguen el orden del formulario de Séneca. Solo hay una actividad por cada Tarea de Moodle evaluada con rúbrica. En «Vinculación criterios de evaluación» elige la única trazabilidad indicada y pasa esos criterios a «seleccionados» (es obligatorio).</p>${SE.actividades.map(a=>`<h3>${esc(a.orden)}. ${esc(a.titulo)} <span class="badge">${esc(a.tipo)}</span> <span class="badge">${esc(a.abreviatura)}</span> <span class="badge">Tarea ${esc(a.tarea)}</span></h3>${box('Título de la actividad', a.titulo)}${box('Tipo de actividad', a.tipo)}${box('Abreviatura', a.abreviatura)}${box('Orden de la presentación', a.orden)}${box('Descripción', a.descripcion)}${box('Temporalización', a.temporalizacion)}${box('Recursos', a.recursos)}${box('Descriptores operativos', a.descriptores)}${box('Vinculación criterios de evaluación', a.vinculacion)}${box('Ejercicios', a.ejercicios)}${box('Metodologías', a.metodologias)}`).join('')}</div>`;
  $('#p-seneca').innerHTML = h;
})();

/* ---------- Anexos: plantillas y formularios ---------- */
(function(){
  if (!HAY_ANX) return;
  const A = S.anexos, P = arr(A.plantillas), F = arr(A.formularios);
  const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const ses = ns => { ns = arr(ns).slice().sort((a,b)=>a-b); if(!ns.length) return '';
    return (ns.length>1 && ns[ns.length-1]-ns[0]===ns.length-1) ? `Sesiones ${ns[0]}-${ns[ns.length-1]}` : (ns.length===1?'Sesión ':'Sesiones ')+ns.join(', '); };
  const TT = {opcion:'Una opción', casillas:'Varias opciones', desplegable:'Desplegable', escala:'Escala', texto:'Respuesta corta', parrafo:'Respuesta larga', cuadricula:'Cuadrícula', info:'Texto informativo'};
  let h = `<div class="card"><h2>Anexos para el alumnado</h2><p class="note">Solo las plantillas que se entregan en una Tarea y los formularios de Google. En el PDF cada plantilla empieza en su página, lista para imprimir o copiar en Google Docs. Los formularios se crean con <b>Codigo.gs</b>.</p>
    <p>${P.map(p=>`<span class="badge" style="margin-right:6px">${esc(p.id)} · ${esc(p.titulo)}</span>`).join('')}${F.map(f=>`<span class="badge" style="margin-right:6px">${esc(f.id)} · ${esc(f.titulo)}</span>`).join('')}</p></div>`;
  P.forEach(p => {
    let cab = p.cabecera;
    if (cab == null){ const ag = String(p.agrupamiento||'').toLowerCase();
      cab = ag.startsWith('individual') ? ['Nombre y apellidos','Grupo','Fecha'] : (ag.includes('pareja') ? ['Pareja','Fecha'] : ['Equipo','Integrantes','Fecha']); }
    const meta = [ses(p.sesiones), p.agrupamiento, p.herramienta, p.entrega ? 'Se entrega en '+p.entrega : ''].filter(Boolean).join(' · ');
    let b = `<div class="card anx anx-p"><h2>${esc(p.id)} · ${esc(p.titulo)}</h2><div class="am">${esc(meta)}</div>`;
    if (p.docente) b += `<div class="doc"><b>Para el docente:</b> ${md(p.docente)}</div>`;
    if (arr(cab).length) b += `<table class="w"><tbody><tr>${cab.map(c=>`<th style="width:auto;height:2.2em">${esc(c)}:</th>`).join('')}</tr></tbody></table>`;
    if (p.instrucciones) b += `<p>${md(p.instrucciones)}</p>`;
    arr(p.bloques).forEach(k => {
      if (k.titulo) b += `<h4>${esc(k.titulo)}</h4>`;
      if (k.texto) b += `<p>${md(k.texto)}</p>`;
      if (k.lista) b += `<ul>${arr(k.lista).map(x=>`<li>${md(x)}</li>`).join('')}</ul>`;
      if (k.casillas) b += arr(k.casillas).map(x=>`<div class="ck">☐ ${md(x)}</div>`).join('');
      if (k.campos) b += `<table class="w"><tbody>${arr(k.campos).map(c=>`<tr style="height:${(k.alto||1.3)*1.5}em"><th>${md(c)}</th><td></td></tr>`).join('')}</tbody></table>`;
      if (k.tabla){ const cols = arr(k.tabla.columnas); let fil = k.tabla.filas ?? 3;
        fil = typeof fil === 'number' ? Array.from({length:fil}, ()=>[]) : fil.map(arr);
        b += `<table class="w"><thead><tr>${cols.map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${fil.map(r=>`<tr style="height:${(k.tabla.alto||1.4)*1.5}em">${cols.map((_,i)=>`<td>${md(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
      if (k.lineas) b += `<div class="ln" style="height:${1.9*(k.lineas|0)}em"></div>`;
      if (k.nota) b += `<div class="am">${md(k.nota)}</div>`;
    });
    h += b + `</div>`;
  });
  F.forEach((f,fi) => {
    const meta = [ses(f.sesiones), f.anonimo ? 'Anónimo (no recoge el correo)' : 'Recoge el correo del centro', f.repetible ? 'Se puede responder varias veces' : ''].filter(Boolean).join(' · ');
    let n = 0, ob = false;
    const rows = arr(f.preguntas).map(q => {
      if (q.tipo === 'seccion') return `<tr><th colspan="4" style="background:var(--bg)">Sección: ${md(q.titulo)}${q.ayuda?' — '+md(q.ayuda):''}</th></tr>`;
      if (q.tipo !== 'info') n++;
      const o = q.obligatoria === undefined ? !!f.obligatorias : !!q.obligatoria; ob = ob || o;
      const et = arr(q.etiquetas);
      const op = q.tipo==='escala' ? `${q.min ?? 1}${et[0]?' ('+esc(et[0])+')':''} … ${q.max ?? 5}${et[1]?' ('+esc(et[1])+')':''}`
        : q.tipo==='cuadricula' ? `Filas: ${arr(q.filas).map(esc).join('; ')}. Columnas: ${arr(q.columnas).map(esc).join(' / ')}`
        : arr(q.opciones).map(esc).join(' / ') + (q.otra ? ' / Otra' : '');
      return `<tr><td>${q.tipo!=='info'?n:''}</td><td>${md(q.titulo)}${q.ayuda?` <span class="note">(${md(q.ayuda)})</span>`:''}${o?' *':''}</td><td>${TT[q.tipo]||esc(q.tipo)}</td><td>${op}</td></tr>`;
    }).join('');
    h += `<div class="card anx ${fi===0?'anx-p':''}"><h2>${esc(f.id)} · ${esc(f.titulo)}</h2><div class="am">${esc(meta)}</div>
      ${f.enlace?`<p>Ya creado: <a href="${esc(f.enlace)}" target="_blank" rel="noopener">${esc(f.enlace)}</a></p>`:''}${f.descripcion?`<p>${md(f.descripcion)}</p>`:''}
      <table class="w"><thead><tr><th>Nº</th><th>Pregunta</th><th>Respuesta</th><th>Opciones</th></tr></thead><tbody>${rows}</tbody></table>
      ${f.confirmacion?`<div class="am">Mensaje final: ${md(f.confirmacion)}</div>`:''}${ob?'<div class="am">* Respuesta obligatoria.</div>':''}</div>`;
  });
  $('#p-anx').innerHTML = h;
})();

/* ---------- Exportar PDF: todo desplegado + glosario con el texto oficial ---------- */
function prepararImpresion(){
  openAll();
  const ORD = {ce:0, cr:1, sb:2, de:3};
  const codes = [...new Set([...document.querySelectorAll('main .chip[data-code]')].map(c=>c.dataset.code))].filter(c=>CUR[c])
    .sort((a,b)=> (ORD[CUR[a].tipo]-ORD[CUR[b].tipo]) || a.localeCompare(b, 'es', {numeric:true}));
  $('#gloss').innerHTML = `<h2>Glosario: texto oficial de los códigos</h2><p class="note">Orden de 30 de mayo de 2023 (Andalucía). En la web, estos textos aparecen al pulsar cada código.</p>
    <dl>${codes.map(c=>`<dt>${esc(c)} · ${esc(KIND[CUR[c].tipo]||'')}</dt><dd>${esc(CUR[c].texto)}</dd>`).join('')}</dl>`;
}
addEventListener('beforeprint', prepararImpresion);   // también con Ctrl+P
function exportarPDF(){
  prepararImpresion();
  const t = document.title; document.title = (M.titulo || 'SdA').replace(/[\\/:*?"<>|]/g, '');
  setTimeout(() => { window.print(); document.title = t; }, 50);
}
</script>
</body>
</html>
