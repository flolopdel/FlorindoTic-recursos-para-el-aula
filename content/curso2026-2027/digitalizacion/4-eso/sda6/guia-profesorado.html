bienestar digital.", "hijos": ["DIG.4.C.1", "DIG.4.C.2", "DIG.4.C.3"], "criterios": []}, "DIG.4.C.1": {"tipo": "sb", "texto": "Seguridad de dispositivos: medidas preventivas y correctivas para hacer frente a riesgos, amenazas y ataques a dispositivos.", "hijos": [], "criterios": []}, "DIG.4.C.2": {"tipo": "sb", "texto": "Seguridad y protección de datos: identidad, reputación digital, privacidad y huella digital. Medidas preventivas en la configuración de redes sociales y la gestión de identidades virtuales.", "hijos": [], "criterios": []}, "DIG.4.C.3": {"tipo": "sb", "texto": "Seguridad en la salud física y mental. Riesgos y amenazas al bienestar personal. Opciones de respuesta y prácticas de uso saludable. Situaciones de violencia y de riesgo en la red (ciberacoso, sextorsión, acceso a contenidos inadecuados, dependencia tecnológica, etc).", "hijos": [], "criterios": []}, "DIG.4.D": {"tipo": "sb", "texto": "Ciudadanía digital crítica.", "hijos": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.3", "DIG.4.D.4", "DIG.4.D.5", "DIG.4.D.6"], "criterios": []}, "DIG.4.D.1": {"tipo": "sb", "texto": "Interactividad en la red: libertad de expresión, etiqueta digital, propiedad intelectual y licencias de uso.", "hijos": [], "criterios": ["DIG.4.2.1", "DIG.4.2.3"]}, "DIG.4.D.2": {"tipo": "sb", "texto": "Educación mediática: periodismo digital, blogosfera, estrategias comunicativas y uso crítico de la red. Herramientas para detectar noticias falsas y fraudes.", "hijos": [], "criterios": []}, "DIG.4.D.3": {"tipo": "sb", "texto": "Gestiones administrativas: servicios públicos en línea, registros digitales y certificados oficiales.", "hijos": [], "criterios": []}, "DIG.4.D.4": {"tipo": "sb", "texto": "Comercio electrónico: facturas digitales, formas de pago y criptomonedas.", "hijos": [], "criterios": []}, "DIG.4.D.5": {"tipo": "sb", "texto": "Ética en el uso de datos y herramientas digitales: inteligencia artificial, sesgos algorítmicos e ideológicos, obsolescencia programada, soberanía tecnológica y digitalización sostenible.", "hijos": [], "criterios": ["DIG.4.2.4"]}, "DIG.4.D.6": {"tipo": "sb", "texto": "Activismo en línea: plataformas de iniciativa ciudadana y cibervoluntariado y comunidades de hardware y software libres.", "hijos": [], "criterios": ["DIG.4.2.4"]}, "CCL1": {"tipo": "de", "texto": "Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.", "competencias": []}, "CCL2": {"tipo": "de", "texto": "Comprende, interpreta y valora con actitud crítica textos orales, escritos, signados o multimodales de los ámbitos personal, social, educativo y profesional para participar en diferentes contextos de manera activa e informada y para construir conocimiento.", "competencias": []}, "CCL3": {"tipo": "de", "texto": "Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": []}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": []}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": []}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": []}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": []}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["DIG.4.2"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": ["DIG.4.2"]}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["DIG.4.2"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": []}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": []}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": ["DIG.4.2"]}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": []}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": []}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": ["DIG.4.2"]}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["DIG.4.2"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": []}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": []}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": []}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": []}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": []}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["DIG.4.2"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": []}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": []}}, "idx": {"criterios": ["DIG.4.2.1", "DIG.4.2.3", "DIG.4.2.4"], "competencias": ["DIG.4.2"], "saberes": ["DIG.4.B.1", "DIG.4.B.2", "DIG.4.B.3"], "descriptores": ["CD1", "CD2", "CD3", "CE3", "CPSAA1", "CPSAA4", "CPSAA5"], "sesionesPorCriterio": {"DIG.4.2.1": [2, 3, 6], "DIG.4.2.3": [2, 3, 4, 5, 6, 7, 9], "DIG.4.2.4": [4, 5, 7, 8, 9]}, "porMateria": [{"codigo": "DIG", "criterios": ["DIG.4.2.1", "DIG.4.2.3", "DIG.4.2.4"], "competencias": ["DIG.4.2"], "saberes": ["DIG.4.B.1", "DIG.4.B.2", "DIG.4.B.3"], "descriptores": ["CD1", "CD2", "CD3", "CE3", "CPSAA1", "CPSAA4", "CPSAA5"]}], "materiasTxt": "Digitalización", "mapaAlumnado": {"DIG.4.2.1": [], "DIG.4.2.3": [], "DIG.4.2.4": []}, "multinivel": []}, "seneca": {"titulo": "SdA 6: Gestión de Datos y Hoja de Cálculo Cooperativa", "temporalizacion": "9 sesiones", "justificacion": "El tratamiento de datos con hojas de cálculo es una habilidad clave en los estudios y en el trabajo. El alumnado organiza datos cercanos, crea hojas con fórmulas, pestañas enlazadas, alertas, gráficos y una función propia con Apps Script, y diseña en pareja y en la nube una hoja útil que otra pareja valida.", "producto_final": "Hoja de cálculo funcional en Google Sheets, diseñada en parejas y en línea, con al menos tres pestañas enlazadas (Datos, Cálculos y Panel), fórmulas con referencias relativas, absolutas y entre pestañas, formato condicional para alertas, al menos dos gráficos interpretados, rangos protegidos y validación de datos, revisada por otra pareja. Temas a elegir: presupuesto del viaje de fin de curso, control de hábitos académicos o calculadora de calificaciones. Profundización opcional: una función o un menú propio con Apps Script.", "concrecion": [{"materia": "Digitalización", "texto": "COMPETENCIAS ESPECÍFICAS\nDIG.4.2.Configurar el entorno personal de aprendizaje, interactuando y aprovechando los recursos del ámbito digital, para optimizar y gestionar el aprendizaje permanente.\n\nCRITERIOS DE EVALUACIÓN\nDIG.4.2.1.Gestionar el aprendizaje en el ámbito digital, configurando el entorno personal de aprendizaje mediante la integración de recursos digitales de manera autónoma.\nDIG.4.2.3.Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.\nDIG.4.2.4.Interactuar en espacios virtuales de comunicación y plataformas de aprendizaje colaborativo, compartiendo y publicando información y datos, adaptándose a diferentes audiencias con una actitud participativa y respetuosa.\n\nSABERES BÁSICOS\nDIG.4.B.1.Búsqueda, administración, gestión, selección y archivo de información.\nDIG.4.B.2.Edición y creación de contenidos: aplicaciones de productividad, desarrollo de aplicaciones sencillas para dispositivos móviles y web, realidad virtual, aumentada y mixta.\nDIG.4.B.3.Comunicación y colaboración en red.\n\nDESCRIPTORES OPERATIVOS\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento."}], "actividades": [{"titulo": "La tienda del viaje: pestañas, fórmulas y Apps Script", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "1", "tarea": "6.2 · La tienda del viaje: pestañas, fórmulas y Apps Script", "descripcion": "Sesión 1 (50 min): Los números de tu móvil: ¿qué es una hoja de cálculo?\nReto: Descubrir qué datos genera nuestro día a día y dar los primeros pasos en Google Sheets: celdas, filas, columnas, rangos y tipos de datos.\n- Gancho: ¿cuántas horas al año? (8 min). El docente proyecta la pregunta «Si pasas 3 horas al día en el móvil, ¿cuántos días enteros pasas al año?». El alumnado apuesta en voz alta y después se calcula en la pizarra: 3 × 365 = 1095 horas = 45,6 días. Se pregunta quién sabe dónde mira el móvil su tiempo de pantalla (Bienestar digital en Android, Tiempo de uso en iPhone). Nadie tiene que enseñar sus datos.\n- Encuesta inicial (7 min). Cada estudiante responde el formulario F1 (anónimo): qué hojas de cálculo ha usado, qué sabe hacer (sumar, hacer un gráfico…) y qué le gustaría calcular. El docente proyecta el resumen de respuestas al acabar para decidir los retos extra.\n- Recorrido por Google Sheets (15 min). Con la técnica «yo lo hago, lo hacemos, lo haces» el docente crea una hoja nueva desde Drive y la recorre: celda (B3), fila, columna, rango (B2:D6), barra de fórmulas, pestañas de abajo. El alumnado lo repite: crea la carpeta «SdA6 Hoja de cálculo» en su Drive y dentro la hoja «SdA6PruebasNombre»; escribe en ella su nombre, un número, un precio con decimales (2,50) y una fecha (15/02/2027) y observa cómo se alinea cada tipo de dato (texto a la izquierda, números a la derecha).\n- Caza del tipo de dato (15 min). Por parejas de mesa, el alumnado copia en su hoja la tabla «Mi semana de apps» de la web de clase (días de la semana y minutos de TikTok, Instagram y WhatsApp, con datos inventados) y descubre los tres errores trampa: un número escrito como texto («60 min»), un decimal con punto (1.5) y una fecha imposible. Los corrigen y comentan por qué la hoja no podía calcular con ellos.\n- Salida (5 min). Pregunta de salida en voz alta o en el cuaderno: «¿Qué dato de tu vida te gustaría tener en una hoja que calcule sola?». El docente apunta ideas en la pizarra para el producto final.\n- Evidencia: Encuesta inicial F1 (diagnóstica)\n- Evidencia: Carpeta y hoja de pruebas en Drive\n\nSesión 2 (50 min): El ticket del súper: formatos y operaciones\nReto: Dar formato a los datos (moneda, porcentaje, fecha, colores, bordes) y hacer que la hoja calcule con operaciones aritméticas.\n- Un ticket que se lee solo (7 min). El docente proyecta un ticket de supermercado inventado y pregunta qué hace la máquina: multiplica unidades por precio, suma y calcula el IVA. Se anuncia el reto del día: rehacer ese ticket en una hoja que haga las cuentas sola.\n- Operaciones con fórmulas (13 min). Modelado en pantalla: toda fórmula empieza por «=», se usan referencias y no números (=B2C2 y no =21,20), operadores + −  / y paréntesis. El alumnado crea la pestaña «Ticket» en su hoja de pruebas con 6 productos (unidades, precio, total por fila) y comprueba que al cambiar un precio cambia el total.\n- Formato que ayuda a leer (15 min). Cada estudiante aplica formato al ticket: moneda (€) en precios y totales, negrita y color de relleno en la cabecera, bordes, alinear y ajustar el ancho de columna, inmovilizar la primera fila. Reto 🌶️: añadir una fila con el descuento del 10 % (=total10%) y otra con el total final.\n- Ordena tu Drive (10 min). El docente muestra la diferencia entre un Drive desordenado («Sin título (7)») y uno con carpetas y nombres claros. Cada estudiante revisa nombre y ubicación de su hoja, usa el buscador de Drive con el nombre y marca la carpeta de la SdA con una estrella para encontrarla rápido.\n- Salida (5 min). Quiz rápido proyectado sobre qué fórmula es correcta. Se recuerda que la próxima sesión se entrega la primera Tarea de Moodle.\n- Evidencia: Pestaña «Ticket» con fórmulas y formato\n- Evidencia: Drive ordenado en la carpeta de la SdA\n\nSesión 3 (50 min): Mi semana en pantalla: SUMA, PROMEDIO y CONTAR.SI\nReto: Usar funciones básicas para resumir una semana de datos y entregar la primera Tarea de Moodle.\n- De la fórmula larga a la función (8 min). El docente recupera el total del ticket (=D2+D3+…) y pregunta qué pasaría con 300 productos. Presenta SUMA(D2:D7) y, en la misma tabla, PROMEDIO, MAX y MIN. Se recuerda que en Sheets en español los argumentos se separan con punto y coma (;).\n- CONTAR.SI con condición (7 min). Modelado: =CONTAR.SI(B2:B8;\">120\") cuenta los días con más de 2 horas de TikTok. El alumnado prueba cambiar la condición (\">60\", \"<30\") y comenta qué cuenta cada una.\n- Tarea 6.1: Mi semana en pantalla (28 min). Cada estudiante crea la hoja «SdA66.1Nombre» con los minutos por día (lunes a domingo) de 4 apps: sus datos reales del móvil o la tabla de ejemplo de la web de clase. Calcula el total por app y por día con SUMA, la media diaria con PROMEDIO, el día de más y menos uso con MAX y MIN, y cuántos días supera 2 horas una app con CONTAR.SI. Aplica formato (cabecera, minutos con 0 decimales). Comparte la hoja con el docente como lector y entrega el enlace en la Tarea 6.1. Reto 🌶️: pasar los minutos a horas (=total/60) con un decimal.\n- Salida (7 min). Cada estudiante escribe en la Tarea, en una frase, qué le ha sorprendido de sus números. Quien lo desee lo comparte en voz alta (sin dar cifras personales si no quiere).\n- Moodle Centros: Tarea «6.1 · Mi semana en pantalla» (corrección Apto / No apto). Primera entrega individual: comprueba que el alumnado organiza datos, guarda bien su hoja y usa las funciones básicas.\n- Evidencia: Hoja «Mi semana en pantalla» (Tarea 6.1, Apto / No apto)\n\nSesión 4 (50 min): El truco del $: referencias relativas y absolutas en una hoja compartida\nReto: Entender qué pasa con una fórmula al arrastrarla, fijar celdas con $ y trabajar a la vez en una hoja compartida.\n- La fórmula que se rompe (7 min). El docente proyecta una tabla de precios con el IVA del 21 % en una sola celda (F1). Escribe =B2F1, la arrastra hacia abajo y aparecen ceros. El alumnado propone por qué. Se explica la referencia relativa (se mueve al arrastrar) y la absoluta $F$1 (se queda quieta), con la tecla de función que añade los $ sola.\n- Práctica del $ (13 min). Cada estudiante crea la pestaña «Precios» en su hoja de pruebas: 6 productos del viaje de estudios (sudadera, camiseta, gorra, botella, mochila, pulsera) con precio sin IVA, una celda con el IVA y otra con el descuento de grupo (5 %). Calcula IVA, precio final y precio con descuento arrastrando fórmulas con $. Reto 🌶️: referencia mixta en una tabla de multiplicar (=$B3C$2).\n- Compartir y colaborar en vivo (15 min). El docente comparte una hoja de la clase «Buzón de ideas» como editor. Cada estudiante escribe su idea de producto final en una fila distinta a la vez, añade un comentario (Ctrl+Alt+M) mencionando al docente con @ y prueba el historial de versiones (Archivo → Historial de versiones) para ver quién escribió qué. Se pactan normas: cada cual escribe solo en su zona, no se borra nada ajeno y los cambios se proponen con comentarios.\n- Parejas y elección de proyecto (10 min). Se forman las parejas (el docente propone parejas equilibradas) y cada una elige tema: presupuesto del viaje de fin de curso, control de hábitos académicos o calculadora de calificaciones. Una persona crea la hoja «SdA6ProyectoNombre1Nombre2» con tres pestañas (Datos, Cálculos, Panel) y la comparte con su pareja como editora y con el docente como comentarista. Se reparten los roles.\n- Salida (5 min). Quiz proyectado sobre qué referencia usar en cada caso.\n- Evidencia: Pestaña «Precios» con referencias absolutas\n- Evidencia: Aportación y comentario en el «Buzón de ideas»\n- Evidencia: Hoja del proyecto creada y compartida\n\nSesión 5 (50 min): Pestañas que hablan entre sí y colores que avisan\nReto: Enlazar datos entre pestañas con 'Hoja'!A1 y usar formato condicional y SI para que la hoja avise cuando algo va mal.\n- La app del banco (6 min). El docente proyecta la pantalla inventada de una app bancaria: en la pestaña de movimientos están los gastos y en la de inicio aparece el saldo en rojo cuando baja de 0. Se pregunta cómo «se entera» la pantalla de inicio de los gastos: está enlazada a otra hoja.\n- Referencias entre pestañas (14 min). Modelado e imitación: en la hoja de pruebas, el alumnado crea la pestaña «Pedidos» (unidades de cada producto pedidas por 8 compradores ficticios) y la pestaña «Resumen». Calcula el dinero de cada producto multiplicando las unidades por el precio de la pestaña «Precios» (='Precios'!$E$2SUMA(B2:B9)) y lleva el total al «Resumen» (='Pedidos'!B12). Comprueba que al cambiar un precio en «Precios» cambia el «Resumen».\n- Formato condicional y SI (18 min). El alumnado aplica reglas de formato condicional: rojo si el stock de un producto es menor que 5, verde si las ventas superan el objetivo, y una escala de color en las unidades. Después escribe en el «Resumen» una celda con =SI(B2>=B3;\"Objetivo conseguido 🎉\";\"Seguimos vendiendo\"). Reto 🌶️: usar una fórmula personalizada en el formato condicional (=$C2<$G$3).\n- Avance del proyecto en pareja (10 min). Cada pareja escribe en la pestaña «Datos» de su proyecto las primeras filas reales (gastos del viaje, horas de estudio o notas) y decide qué alerta de color pondrá. El docente revisa los comentarios de cada hoja.\n- Salida (2 min). Pregunta de salida: «¿Qué alerta te ayudaría en tu proyecto?»\n- Evidencia: Pestañas «Pedidos» y «Resumen» enlazadas\n- Evidencia: Reglas de formato condicional\n- Evidencia: Pestaña «Datos» del proyecto iniciada\n\nSesión 6 (50 min): Mi hoja aprende trucos: Apps Script y entrega de la Tarea 6.2\nReto: Añadir a la hoja una función propia y un menú con Apps Script, y entregar la tienda del viaje completa.\n- ¿Y si la hoja hiciera algo que no trae? (5 min). El docente pregunta si existe una función que ponga un semáforo 🟢🟡🔴 según el stock. No existe, así que la vamos a programar. Se presenta Apps Script como el «taller» escondido de Google Sheets (Extensiones → Apps Script).\n- Mi primera función con Apps Script (15 min). Guiado paso a paso: el alumnado abre Extensiones → Apps Script en su hoja de pruebas, borra el contenido, pega la función SEMAFORO de la web de clase, guarda y la usa en la hoja como cualquier otra: =SEMAFORO(C2;5). El docente explica cada línea (function, if, return). Después se pega la función onOpen que crea el menú «🎒 Mi hoja» con la opción «Poner fecha de hoy», se recarga la hoja y se acepta el permiso. Si el centro tiene Apps Script desactivado para el alumnado, el docente lo muestra en su pantalla y cada estudiante copia el código en el cuaderno explicando qué hace.\n- Tarea 6.2: La tienda del viaje (25 min). Cada estudiante revisa su hoja de pruebas y la deja lista para entregar como «SdA66.2Nombre»: pestañas Precios, Pedidos y Resumen enlazadas, referencias absolutas al IVA y al descuento, formato condicional en stock y ventas, la celda SI de objetivo y la función SEMAFORO aplicada. Escribe en la pestaña Resumen dos frases: qué celda cambiaría para subir el descuento y qué pasaría en el resto. Entrega el enlace en la Tarea 6.2. Reto 🌶️: modificar SEMAFORO para que tenga tres niveles con un segundo límite.\n- Salida (5 min). Autoevaluación rápida con la lista de la diapositiva final antes de enviar (lo tengo / me falta).\n- Moodle Centros: Tarea «6.2 · La tienda del viaje: pestañas, fórmulas y Apps Script» (evaluada con rúbrica 1-3-5-7-10). Tarea individual evaluable del bloque 2: muestra que el alumnado organiza y archiva su trabajo y crea una hoja con fórmulas avanzadas, pestañas enlazadas, alertas y una función propia.\n- Evidencia: Función SEMAFORO y menú propio en Apps Script\n- Evidencia: Hoja «La tienda del viaje» (Tarea 6.2 con rúbrica)", "temporalizacion": "6 sesiónes", "recursos": "Proyector, Google Sheets, Formulario F1, Google Drive, Moodle Centros, Hoja compartida de la clase, Google Apps Script", "descriptores": "CD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso const S = DATA.sa, CUR = DATA.cur, IDX = DATA.idx;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':''); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

  const duaSet = [...new Set(S.sesiones.flatMap(s=>arr(s.dua && s.dua.principios)))];
  h += `<div class="filters" id="ff"><span class="legend">Fase:</span><button class="on" data-f="*">Todas</button>${fases.map(f=>`<button data-f="${esc(f.nombre)}">${esc(f.nombre)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">DUA:</span>${duaSet.map(d=>`<button data-d="${esc(d)}">${esc(d)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">Moodle:</span><button data-m="1">Con actividad Moodle</button>
    <button data-open="1" style="margin-left:auto">Desplegar todas</button></div><div id="slist"></div>`;
  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){
    const list = S.sesiones.filter(s => (state.f==='*'||s.fase===state.f) && (!state.d || arr(s.dua&&s.dua.principios).includes(state.d)) && (!state.m || arr(s.moodle).length));
    $('#slist').innerHTML = list.map(s => `<details class="ses" data-n="${s.n}"><summary><div class="num" style="background:${fcol[s.fase]}22;color:${fcol[s.fase]}">${s.n}</div>

  }

    if (cab == null){ const ag = String(p.agrupamiento||'').toLowerCase();
      cab = ag.startsWith('individual') ? ['Nombre y apellidos','Grupo','Fecha'] : (ag.includes('pareja') ? ['Pareja','Fecha'] : ['Equipo','Integrantes','Fecha']); }
    const meta = [ses(p.sesiones), p.agrupamiento, p.herramienta, p.entrega ? 'Se entrega en '+p.entrega : ''].filter(Boolean).join(' · ');
    let b = `<div class="card anx anx-p"><h2>${esc(p.id)} · ${esc(p.titulo)}</h2><div class="am">${esc(meta)}</div>`;
    if (p.docente) b += `<div class="doc"><b>Para el docente:</b> ${md(p.docente)}</div>`;
    if (arr(cab).length) b += `<table class="w"><tbody><tr>${cab.map(c=>`<th style="width:auto;height:2.2em">${esc(c)}:</th>`).join('')}</tr></tbody></table>`;
    if (p.instrucciones) b += `<p>${md(p.instrucciones)}</p>`;
    arr(p.bloques).forEach(k => {
      if (k.titulo) b += `<h4>${esc(k.titulo)}</h4>`;
      if (k.texto) b += `<p>${md(k.texto)}</p>`;
      if (k.lista) b += `<ul>${arr(k.lista).map(x=>`<li>${md(x)}</li>`).join('')}</ul>`;
      if (k.casillas) b += arr(k.casillas).map(x=>`<div class="ck">☐ ${md(x)}</div>`).join('');
      if (k.campos) b += `<table class="w"><tbody>${arr(k.campos).map(c=>`<tr style="height:${(k.alto||1.3)*1.5}em"><th>${md(c)}</th><td></td></tr>`).join('')}</tbody></table>`;
      if (k.tabla){ const cols = arr(k.tabla.columnas); let fil = k.tabla.filas ?? 3;
        fil = typeof fil === 'number' ? Array.from({length:fil}, ()=>[]) : fil.map(arr);
        b += `<table class="w"><thead><tr>${cols.map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${fil.map(r=>`<tr style="height:${(k.tabla.alto||1.4)*1.5}em">${cols.map((_,i)=>`<td>${md(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
      if (k.lineas) b += `<div class="ln" style="height:${1.9*(k.lineas|0)}em"></div>`;
      if (k.nota) b += `<div class="am">${md(k.nota)}</div>`;
    });
    h += b + `</div>`;
  });
  F.forEach((f,fi) => {
    const meta = [ses(f.sesiones), f.anonimo ? 'Anónimo (no recoge el correo)' : 'Recoge el correo del centro', f.repetible ? 'Se puede responder varias veces' : ''].filter(Boolean).join(' · ');
    let n = 0, ob = false;
    const rows = arr(f.preguntas).map(q => {
      if (q.tipo === 'seccion') return `<tr><th colspan="4" style="background:var(--bg)">Sección: ${md(q.titulo)}${q.ayuda?' — '+md(q.ayuda):''}</th></tr>`;
      if (q.tipo !== 'info') n++;
      const o = q.obligatoria === undefined ? !!f.obligatorias : !!q.obligatoria; ob = ob || o;
      const et = arr(q.etiquetas);
      const op = q.tipo==='escala' ? `${q.min ?? 1}${et[0]?' ('+esc(et[0])+')':''} … ${q.max ?? 5}${et[1]?' ('+esc(et[1])+')':''}`
        : q.tipo==='cuadricula' ? `Filas: ${arr(q.filas).map(esc).join('; ')}. Columnas: ${arr(q.columnas).map(esc).join(' / ')}`
        : arr(q.opciones).map(esc).join(' / ') + (q.otra ? ' / Otra' : '');
      return `<tr><td>${q.tipo!=='info'?n:''}</td><td>${md(q.titulo)}${q.ayuda?` <span class="note">(${md(q.ayuda)})</span>`:''}${o?' *':''}</td><td>${TT[q.tipo]||esc(q.tipo)}</td><td>${op}</td></tr>`;
    }).join('');
    h += `<div class="card anx ${fi===0?'anx-p':''}"><h2>${esc(f.id)} · ${esc(f.titulo)}</h2><div class="am">${esc(meta)}</div>
      ${f.enlace?`<p>Ya creado: <a href="${esc(f.enlace)}" target="_blank" rel="noopener">${esc(f.enlace)}</a></p>`:''}${f.descripcion?`<p>${md(f.descripcion)}</p>`:''}
      <table class="w"><thead><tr><th>Nº</th><th>Pregunta</th><th>Respuesta</th><th>Opciones</th></tr></thead><tbody>${rows}</tbody></table>
      ${f.confirmacion?`<div class="am">Mensaje final: ${md(f.confirmacion)}</div>`:''}${ob?'<div class="am">* Respuesta obligatoria.</div>':''}</div>`;
  });
  $('#p-anx').innerHTML = h;
})();

/* ---------- Exportar PDF: todo desplegado + glosario con el texto oficial ---------- */
function prepararImpresion(){
  openAll();
  const ORD = {ce:0, cr:1, sb:2, de:3};
  const codes = [...new Set([...document.querySelectorAll('main .chip[data-code]')].map(c=>c.dataset.code))].filter(c=>CUR[c])
    .sort((a,b)=> (ORD[CUR[a].tipo]-ORD[CUR[b].tipo]) || a.localeCompare(b, 'es', {numeric:true}));
  $('#gloss').innerHTML = `<h2>Glosario: texto oficial de los códigos</h2><p class="note">Orden de 30 de mayo de 2023 (Andalucía). En la web, estos textos aparecen al pulsar cada código.</p>
    <dl>${codes.map(c=>`<dt>${esc(c)} · ${esc(KIND[CUR[c].tipo]||'')}</dt><dd>${esc(CUR[c].texto)}</dd>`).join('')}</dl>`;
}
addEventListener('beforeprint', prepararImpresion);   // también con Ctrl+P
function exportarPDF(){
  prepararImpresion();
  const t = document.title; document.title = (M.titulo || 'SdA').replace(/[\\/:*?"<>|]/g, '');
  setTimeout(() => { window.print(); document.title = t; }, 50);
}
</script>
