<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 6: Gestión de Datos y Hoja de Cálculo Cooperativa", "numero": 6, "subtitulo": "«Los números cuentan»: una hoja de cálculo que nos ayuda de verdad, hecha en pareja y en la nube", "curso_texto": "4.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Trabajo individual en las Tareas 6.1 y 6.2; parejas en el producto final (Tarea 6.3)", "temporalizacion": "Segundo trimestre (orientativo: 3 semanas, 9 sesiones de 50 minutos)", "carpeta_drive": "1_asR6hE570T1YjTRWF3omhYPMhNLa5tw"}, "materias": [{"codigo": "DIG", "criterios": ["DIG.4.2.1", "DIG.4.2.3", "DIG.4.2.4"], "saberes": ["DIG.4.B.1", "DIG.4.B.2", "DIG.4.B.3"]}], "vision": {"descripcion": "Las apps que usamos cada día viven de datos: TikTok cuenta los segundos que miramos cada vídeo, el banco suma nuestros gastos y la plataforma del instituto calcula medias. En esta situación de aprendizaje el alumnado aprende a organizar datos en Google Sheets, a hacer que la hoja calcule sola con fórmulas y funciones, a enlazar pestañas, a avisar con colores, a automatizar con un poco de Apps Script y a contar lo que dicen los números con gráficos, trabajando a la vez en la misma hoja desde la nube.", "contexto": "Grupo adaptado de 4.º ESO de 22 estudiantes, la mayoría con algún curso repetido o con dificultades de aprendizaje, muy activo en TikTok e Instagram. Aula de informática con un ordenador por estudiante y Google Workspace del centro (@g.educaand.es). Se trabaja en tareas cortas, con datos cercanos (tiempo de pantalla, la tienda de sudaderas del viaje de estudios, notas y gastos) y casi todo se entrega de forma individual; solo el producto final se hace en pareja.", "justificacion": "Tratar datos con hojas de cálculo es una de las habilidades digitales más pedidas en los estudios posteriores y en cualquier trabajo. Hacerlo en una hoja compartida en la nube permite aprender a colaborar en tiempo real, a repartir el trabajo, a comentar y a proteger lo que hace cada persona. Partir de datos de su propia vida (pantalla, gastos, notas) da sentido a las fórmulas y ayuda a mirar los gráficos con espíritu crítico.", "reto": "«Somos el equipo de datos de 4.º: vamos a construir, en pareja y en la nube, una hoja de cálculo que resuelva un problema real (el presupuesto del viaje de fin de curso, el control de nuestros hábitos de estudio o la calculadora de nuestras notas) y que otra pareja pueda usar sin romperla.»", "pregunta_guia": "¿Cómo podemos convertir un montón de números en una herramienta que calcule sola, avise cuando algo va mal y lo cuente con un gráfico?", "producto_final": "Hoja de cálculo funcional en Google Sheets, diseñada en parejas y en línea, con al menos tres pestañas enlazadas (Datos, Cálculos y Panel), fórmulas con referencias relativas, absolutas y entre pestañas, formato condicional para alertas, al menos dos gráficos interpretados, rangos protegidos y validación de datos, revisada por otra pareja. Temas a elegir: presupuesto del viaje de fin de curso, control de hábitos académicos o calculadora de calificaciones. Profundización opcional: una función o un menú propio con Apps Script."}, "metodologias": [{"nombre": "Aprendizaje Basado en Proyectos (ABP)", "descripcion": "Toda la SdA prepara un producto final útil (una hoja que resuelve un problema real del grupo) que se va construyendo con lo aprendido en cada bloque."}, {"nombre": "Instrucción directa con modelado", "descripcion": "Cada técnica nueva se muestra en pantalla paso a paso (el docente lo hace, lo hacemos juntos, lo haces tú) con ejemplos cotidianos antes de la práctica individual."}, {"nombre": "Aprendizaje cooperativo en parejas", "descripcion": "En el producto final cada pareja reparte roles (arquitecto/a de datos y diseñador/a del panel) y trabaja a la vez sobre la misma hoja compartida, con comentarios y el historial de versiones como registro."}, {"nombre": "Retos por niveles", "descripcion": "Cada práctica tiene un nivel básico obligatorio y retos extra (🌶️, 🌶️🌶️) para que nadie se aburra ni se quede atrás."}, {"nombre": "Evaluación entre iguales", "descripcion": "Validación cruzada: cada pareja prueba la hoja de otra con un formulario de comprobación y propone mejoras antes de la entrega final."}], "recursos": ["Aula de informática (un ordenador por estudiante)", "Google Sheets", "Google Apps Script", "Google Forms", "Google Drive del centro", "Moodle Centros", "Web de clase de la SdA", "Proyector"], "fases": [{"nombre": "Bloque 1 · Introducción y estructura", "sesiones": "1-3", "finalidad": "Motivación, diagnóstico, celdas, rangos, tipos de datos, formatos, operaciones y funciones básicas"}, {"nombre": "Bloque 2 · Pestañas y fórmulas avanzadas", "sesiones": "4-6", "finalidad": "Trabajo colaborativo sincrónico, referencias relativas y absolutas, referencias entre pestañas, formato condicional y Apps Script"}, {"nombre": "Bloque 3 · Visualización y presentación", "sesiones": "7-9", "finalidad": "Gráficos y su interpretación crítica, protección, validación cruzada entre parejas y entrega del producto final"}], "sesiones": [{"n": 1, "fase": "Bloque 1 · Introducción y estructura", "titulo": "Los números de tu móvil: ¿qué es una hoja de cálculo?", "reto": "Descubrir qué datos genera nuestro día a día y dar los primeros pasos en Google Sheets: celdas, filas, columnas, rangos y tipos de datos.", "actividades": [{"nombre": "Gancho: ¿cuántas horas al año?", "min": 8, "desc": "El docente proyecta la pregunta «Si pasas 3 horas al día en el móvil, ¿cuántos días enteros pasas al año?». El alumnado apuesta en voz alta y después se calcula en la pizarra: 3 × 365 = 1095 horas = 45,6 días. Se pregunta quién sabe dónde mira el móvil su tiempo de pantalla (Bienestar digital en Android, Tiempo de uso en iPhone). Nadie tiene que enseñar sus datos."}, {"nombre": "Encuesta inicial", "min": 7, "desc": "Cada estudiante responde el formulario F1 (anónimo): qué hojas de cálculo ha usado, qué sabe hacer (sumar, hacer un gráfico…) y qué le gustaría calcular. El docente proyecta el resumen de respuestas al acabar para decidir los retos extra."}, {"nombre": "Recorrido por Google Sheets", "min": 15, "desc": "Con la técnica «yo lo hago, lo hacemos, lo haces» el docente crea una hoja nueva desde Drive y la recorre: celda (B3), fila, columna, rango (B2:D6), barra de fórmulas, pestañas de abajo. El alumnado lo repite: crea la carpeta «SdA6 Hoja de cálculo» en su Drive y dentro la hoja «SdA6_Pruebas_Nombre»; escribe en ella su nombre, un número, un precio con decimales (2,50) y una fecha (15/02/2027) y observa cómo se alinea cada tipo de dato (texto a la izquierda, números a la derecha)."}, {"nombre": "Caza del tipo de dato", "min": 15, "desc": "Por parejas de mesa, el alumnado copia en su hoja la tabla «Mi semana de apps» de la web de clase (días de la semana y minutos de TikTok, Instagram y WhatsApp, con datos inventados) y descubre los tres errores trampa: un número escrito como texto («60 min»), un decimal con punto (1.5) y una fecha imposible. Los corrigen y comentan por qué la hoja no podía calcular con ellos."}, {"nombre": "Salida", "min": 5, "desc": "Pregunta de salida en voz alta o en el cuaderno: «¿Qué dato de tu vida te gustaría tener en una hoja que calcule sola?». El docente apunta ideas en la pizarra para el producto final."}], "criterios": [], "saberes": ["DIG.4.B.1", "DIG.4.B.2"], "metodologia": ["Instrucción directa con modelado", "Evaluación diagnóstica"], "evidencias": ["Encuesta inicial F1 (diagnóstica)", "Carpeta y hoja de pruebas en Drive"], "recursos": ["Proyector", "Google Sheets", "Formulario F1"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Pregunta gancho con datos cercanos y sin exponer los datos personales; recorrido modelado en pantalla y repetido paso a paso; tabla de prácticas con datos inventados para quien no quiera usar los suyos."}, "ejercicios": ["Crea la carpeta «SdA6 Hoja de cálculo» en tu Drive y, dentro, la hoja «SdA6_Pruebas_Nombre».", "Copia la tabla «Mi semana de apps», encuentra los tres datos mal escritos y corrígelos."], "clase": {"pregunta": "¿Cuántos días al año pasas mirando el móvil?", "diapositivas": [{"tipo": "dato", "valor": "45 días", "texto": "Es lo que suman **3 horas de móvil al día** durante un año: 3 × 365 = 1095 horas.", "pregunta": "¿Y si fueran 5 horas al día?", "nota": "Que apuesten antes de enseñar la cifra. Con 5 horas salen 76 días. Nadie tiene que decir su tiempo real."}, {"tipo": "practica", "titulo": "Encuesta inicial (F1)", "tiempo": 7, "enunciado": "Responde la encuesta: es **anónima** y sirve para preparar los retos de esta SdA. No hay respuestas buenas ni malas.", "nota": "Proyecta el resumen al terminar.", "enlace": "https://forms.gle/bo7v8fkz6RNPRYKv9"}, {"tipo": "ejemplo", "icono": "🏀", "titulo": "La tabla de la liga", "situacion": "En la app de la liga ves la **clasificación**: partidos, victorias, puntos… y se actualiza sola tras cada jornada.", "explicacion": "Es una **hoja de cálculo**: cada dato vive en una **celda** y los puntos se calculan con una fórmula (victorias × 3 + empates).", "pregunta": "¿Qué otra tabla de tu móvil se calcula sola?"}, {"tipo": "infografia", "titulo": "Las piezas de una hoja de cálculo", "svg": "<svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Esquema de una hoja de cálculo con columnas, filas, una celda y un rango\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"60\" y=\"40\" width=\"420\" height=\"30\" style=\"fill:var(--brand-soft);stroke:var(--brand)\"/><text x=\"105\" y=\"61\" font-size=\"16\" style=\"fill:var(--ink)\">A<\/text><text x=\"205\" y=\"61\" font-size=\"16\" style=\"fill:var(--ink)\">B<\/text><text x=\"305\" y=\"61\" font-size=\"16\" style=\"fill:var(--ink)\">C<\/text><text x=\"405\" y=\"61\" font-size=\"16\" style=\"fill:var(--ink)\">D<\/text><rect x=\"20\" y=\"70\" width=\"40\" height=\"120\" style=\"fill:var(--brand-soft);stroke:var(--brand)\"/><text x=\"34\" y=\"92\" font-size=\"16\" style=\"fill:var(--ink)\">1<\/text><text x=\"34\" y=\"122\" font-size=\"16\" style=\"fill:var(--ink)\">2<\/text><text x=\"34\" y=\"152\" font-size=\"16\" style=\"fill:var(--ink)\">3<\/text><text x=\"34\" y=\"182\" font-size=\"16\" style=\"fill:var(--ink)\">4<\/text><rect x=\"60\" y=\"70\" width=\"420\" height=\"120\" style=\"fill:var(--card);stroke:var(--ink)\"/><rect x=\"160\" y=\"130\" width=\"100\" height=\"30\" style=\"fill:var(--accent-soft);stroke:var(--accent)\" stroke-width=\"3\"/><text x=\"178\" y=\"151\" font-size=\"15\" style=\"fill:var(--ink)\">celda B3<\/text><rect x=\"360\" y=\"70\" width=\"100\" height=\"120\" style=\"fill:none;stroke:var(--warm)\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><text x=\"490\" y=\"110\" font-size=\"15\" style=\"fill:var(--ink)\">rango D1:D4<\/text><text x=\"490\" y=\"130\" font-size=\"14\" style=\"fill:var(--ink)\">(de D1 a D4)<\/text><text x=\"60\" y=\"25\" font-size=\"15\" style=\"fill:var(--ink)\">columnas = letras<\/text><text x=\"20\" y=\"215\" font-size=\"15\" style=\"fill:var(--ink)\">filas = números<\/text><\/svg>", "nota": "Señala cada parte en la hoja real después de la diapositiva."}, {"tipo": "pasos", "titulo": "Tu primera hoja en Drive", "progresivo": true, "pasos": ["Drive → **Nuevo → Carpeta**: «SdA6 Hoja de cálculo».", "Dentro: **Nuevo → Hojas de cálculo de Google**.", "Ponle nombre arriba a la izquierda: **SdA6_Pruebas_TuNombre**.", "Escribe: tu nombre, el número 12, el precio **2,50** y la fecha **15/02/2027**.", "Mira: ¿qué datos se van a la izquierda y cuáles a la derecha?"]}, {"tipo": "practica", "titulo": "Caza del tipo de dato", "tiempo": 15, "agrupamiento": "Parejas de mesa (cada uno en su hoja)", "enunciado": "Copia esta tabla de minutos en tu hoja. Hay **3 datos mal escritos** que la hoja no puede sumar. Encuéntralos y corrígelos.", "pasos": ["Lunes: TikTok 95 · Instagram 40 · WhatsApp 30", "Martes: TikTok **60 min** · Instagram 35 · WhatsApp 25", "Miércoles: TikTok 80 · Instagram **1.5** · WhatsApp 45", "Fecha de hoy: **31/02/2027**"], "ayudas": [{"tipo": "pista", "texto": "Si un número se queda pegado a la **izquierda**, la hoja lo trata como texto. En España los decimales llevan **coma**. ¿Febrero tiene 31 días?"}]}, {"tipo": "cierre", "puntos": ["Una hoja tiene **celdas** (B3), **rangos** (A1:C5) y **pestañas**.", "Texto a la izquierda, números a la derecha: así sabes si la hoja podrá calcular.", "Todo se guarda solo en tu **Drive**."], "pregunta": "¿Qué dato de tu vida te gustaría tener en una hoja que calcule sola?"}]}}, {"n": 2, "fase": "Bloque 1 · Introducción y estructura", "titulo": "El ticket del súper: formatos y operaciones", "reto": "Dar formato a los datos (moneda, porcentaje, fecha, colores, bordes) y hacer que la hoja calcule con operaciones aritméticas.", "actividades": [{"nombre": "Un ticket que se lee solo", "min": 7, "desc": "El docente proyecta un ticket de supermercado inventado y pregunta qué hace la máquina: multiplica unidades por precio, suma y calcula el IVA. Se anuncia el reto del día: rehacer ese ticket en una hoja que haga las cuentas sola."}, {"nombre": "Operaciones con fórmulas", "min": 13, "desc": "Modelado en pantalla: toda fórmula empieza por «=», se usan referencias y no números (=B2*C2 y no =2*1,20), operadores + − * / y paréntesis. El alumnado crea la pestaña «Ticket» en su hoja de pruebas con 6 productos (unidades, precio, total por fila) y comprueba que al cambiar un precio cambia el total."}, {"nombre": "Formato que ayuda a leer", "min": 15, "desc": "Cada estudiante aplica formato al ticket: moneda (€) en precios y totales, negrita y color de relleno en la cabecera, bordes, alinear y ajustar el ancho de columna, inmovilizar la primera fila. Reto 🌶️: añadir una fila con el descuento del 10 % (=total*10%) y otra con el total final."}, {"nombre": "Ordena tu Drive", "min": 10, "desc": "El docente muestra la diferencia entre un Drive desordenado («Sin título (7)») y uno con carpetas y nombres claros. Cada estudiante revisa nombre y ubicación de su hoja, usa el buscador de Drive con el nombre y marca la carpeta de la SdA con una estrella para encontrarla rápido."}, {"nombre": "Salida", "min": 5, "desc": "Quiz rápido proyectado sobre qué fórmula es correcta. Se recuerda que la próxima sesión se entrega la primera Tarea de Moodle."}], "criterios": ["DIG.4.2.1", "DIG.4.2.3"], "saberes": ["DIG.4.B.1", "DIG.4.B.2"], "metodologia": ["Instrucción directa con modelado", "Retos por niveles"], "evidencias": ["Pestaña «Ticket» con fórmulas y formato", "Drive ordenado en la carpeta de la SdA"], "recursos": ["Proyector", "Google Sheets", "Google Drive"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Chuleta visual de operadores en la web de clase; tabla del ticket ya escrita para copiar y no perder tiempo tecleando; reto 🌶️ opcional para quien termina antes."}, "ejercicios": ["Rehaz el ticket del súper en la pestaña «Ticket» con fórmulas que calculen el total de cada producto y el total de la compra.", "Aplica formato de moneda, bordes y colores a la cabecera."], "clase": {"pregunta": "¿Cómo sabe la caja del súper cuánto tienes que pagar?", "diapositivas": [{"tipo": "ejemplo", "icono": "🧾", "titulo": "El ticket del súper", "situacion": "Compras **3 yogures a 0,45 €** y la caja escribe 1,35 € sin que nadie haga la cuenta.", "explicacion": "Dentro hay una fórmula: **unidades × precio**. Si cambia el precio, el ticket se recalcula. Hoy hacemos lo mismo en una hoja."}, {"tipo": "idea", "icono": "🟰", "titulo": "Las reglas de una fórmula", "puntos": ["Empieza siempre por **=**", "Usa celdas, no números: **=B2*C2**", "Operadores: **+  −  *  /** y paréntesis", "Porcentajes: **=D8*10%**"], "nota": "Demuestra que con =2*1,20 el total no cambia si cambias el precio."}, {"tipo": "practica", "titulo": "El ticket que se calcula solo", "tiempo": 13, "enunciado": "Crea la pestaña **Ticket** y copia la tabla. En la columna D escribe la fórmula del total de cada producto y, abajo, el total de la compra.", "pasos": ["A: Producto · B: Unidades · C: Precio · D: Total", "Pan 2 · 1,20 | Leche 6 · 0,95 | Yogur 3 · 0,45 | Pasta 2 · 1,10 | Manzanas 1 · 2,30 | Zumo 2 · 1,75", "D2: **=B2*C2** y arrastra el cuadradito azul hacia abajo", "D8: **=D2+D3+D4+D5+D6+D7**", "Cambia un precio: ¿cambia el total?"]}, {"tipo": "practica", "titulo": "Formato que ayuda a leer", "tiempo": 15, "enunciado": "Haz que tu ticket parezca de verdad.", "pasos": ["Precios y totales: **Formato → Número → Moneda**", "Cabecera en **negrita** con color de relleno", "Bordes a toda la tabla y ajusta el ancho de columnas", "**Ver → Inmovilizar → 1 fila**", "🌶️ Fila de descuento del 10 % y total final"]}, {"tipo": "quiz", "pregunta": "¿Qué fórmula calcula bien el total de la fila 4 (unidades en B4, precio en C4)?", "opciones": ["B4*C4", "=3*0,45", "=B4*C4", "=B4+C4"], "correcta": 2, "explicacion": "Empieza por **=** y usa las celdas: si cambia el precio, el total se recalcula. «=3*0,45» da bien hoy, pero no se actualiza."}, {"tipo": "cierre", "puntos": ["Las fórmulas empiezan por **=** y usan **celdas**.", "El **formato** no cambia el dato, ayuda a leerlo.", "Un Drive ordenado = encontrar tu trabajo en segundos."], "siguiente": "Funciones: SUMA, PROMEDIO y CONTAR.SI (y primera Tarea de Moodle)."}]}}, {"n": 3, "fase": "Bloque 1 · Introducción y estructura", "titulo": "Mi semana en pantalla: SUMA, PROMEDIO y CONTAR.SI", "reto": "Usar funciones básicas para resumir una semana de datos y entregar la primera Tarea de Moodle.", "actividades": [{"nombre": "De la fórmula larga a la función", "min": 8, "desc": "El docente recupera el total del ticket (=D2+D3+…) y pregunta qué pasaría con 300 productos. Presenta SUMA(D2:D7) y, en la misma tabla, PROMEDIO, MAX y MIN. Se recuerda que en Sheets en español los argumentos se separan con punto y coma (;)."}, {"nombre": "CONTAR.SI con condición", "min": 7, "desc": "Modelado: =CONTAR.SI(B2:B8;\">120\") cuenta los días con más de 2 horas de TikTok. El alumnado prueba cambiar la condición (\">60\", \"<30\") y comenta qué cuenta cada una."}, {"nombre": "Tarea 6.1: Mi semana en pantalla", "min": 28, "desc": "Cada estudiante crea la hoja «SdA6_6.1_Nombre» con los minutos por día (lunes a domingo) de 4 apps: sus datos reales del móvil o la tabla de ejemplo de la web de clase. Calcula el total por app y por día con SUMA, la media diaria con PROMEDIO, el día de más y menos uso con MAX y MIN, y cuántos días supera 2 horas una app con CONTAR.SI. Aplica formato (cabecera, minutos con 0 decimales). Comparte la hoja con el docente como lector y entrega el enlace en la Tarea 6.1. Reto 🌶️: pasar los minutos a horas (=total/60) con un decimal."}, {"nombre": "Salida", "min": 7, "desc": "Cada estudiante escribe en la Tarea, en una frase, qué le ha sorprendido de sus números. Quien lo desee lo comparte en voz alta (sin dar cifras personales si no quiere)."}], "criterios": ["DIG.4.2.1", "DIG.4.2.3"], "saberes": ["DIG.4.B.1", "DIG.4.B.2"], "metodologia": ["Instrucción directa con modelado", "Retos por niveles"], "evidencias": ["Hoja «Mi semana en pantalla» (Tarea 6.1, Apto / No apto)"], "recursos": ["Google Sheets", "Moodle Centros", "Proyector"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Datos reales o de ejemplo, a elección; lista de comprobación de la Tarea proyectada; chuleta de funciones con un ejemplo de cada una; prórroga en Moodle para quien la necesite."}, "ejercicios": ["Calcula el total, la media, el máximo y el mínimo de minutos de tu semana con SUMA, PROMEDIO, MAX y MIN.", "Cuenta con CONTAR.SI cuántos días una app supera las 2 horas."], "moodle": [{"recurso": "Tarea", "nombre": "6.1 · Mi semana en pantalla", "uso": "Primera entrega individual: comprueba que el alumnado organiza datos, guarda bien su hoja y usa las funciones básicas.", "correccion": "apto", "criterio": "DIG.4.2.3", "cotejo": ["La hoja se llama «SdA6_6.1_Nombre» y está en la carpeta de la SdA", "Tiene los 7 días y al menos 4 apps con datos numéricos (sin texto en las celdas de minutos)", "Usa SUMA y PROMEDIO con rangos (no sumas celda a celda)", "Usa MAX o MIN y un CONTAR.SI con condición", "La cabecera tiene formato y la hoja está compartida con el docente como lector"], "config": ["Tipo de entrega: texto en línea (enlace a la hoja)", "Calificación: escala Apto / No apto", "Pegar la lista de comprobación en la descripción"], "calificable": true, "codigo": "6.1"}], "clase": {"pregunta": "¿Qué día de la semana usas más el móvil?", "diapositivas": [{"tipo": "comparar", "titulo": "Fórmula larga vs función", "columnas": [{"titulo": "A mano", "icono": "🐢", "puntos": ["=D2+D3+D4+D5+D6+D7", "Con 300 filas… imposible"]}, {"titulo": "Con función", "icono": "⚡", "puntos": ["**=SUMA(D2:D7)**", "Igual de corta con 3 o con 3000 filas"]}]}, {"tipo": "codigo", "titulo": "Chuleta de funciones", "codigo": "=SUMA(B2:B8)        → suma todo el rango\n=PROMEDIO(B2:B8)    → media\n=MAX(B2:B8)         → el valor más alto\n=MIN(B2:B8)         → el valor más bajo\n=CONTAR.SI(B2:B8;\">120\")  → cuántos superan 120", "explicacion": ["En español se separa con **punto y coma (;)**.", "La condición de CONTAR.SI va **entre comillas**."], "pregunta": "¿Qué contaría =CONTAR.SI(B2:B8;\"<30\")?"}, {"tipo": "ejemplo", "icono": "📱", "titulo": "Bienestar digital del móvil", "situacion": "El móvil te dice «**media diaria: 3 h 12 min**» y te enseña el día que más lo usaste.", "explicacion": "Por dentro hace un **PROMEDIO** y un **MAX** de los minutos de cada día. Hoy lo calculas tú."}, {"tipo": "practica", "titulo": "Tarea 6.1 · Mi semana en pantalla", "tiempo": 28, "entrega": "Tarea 6.1 · Mi semana en pantalla", "enunciado": "Crea **SdA6_6.1_TuNombre**: filas = días, columnas = 4 apps. Usa tus minutos reales **o** estos datos de ejemplo.", "pasos": ["Ejemplo (TikTok · Instagram · WhatsApp · YouTube) L 95·40·30·20 | M 130·35·25·45 | X 80·50·45·10 | J 150·30·40·25 | V 170·60·35·60 | S 210·75·20·90 | D 185·55·30·70", "Total por app y por día con **SUMA**", "Media diaria con **PROMEDIO**; día máximo y mínimo con **MAX** y **MIN**", "Días con más de 2 h de una app: **CONTAR.SI(…;\">120\")**", "Compartir → con tu docente como **Lector** → pega el enlace en Moodle", "🌶️ Pasa los totales a horas con un decimal"], "ayudas": [{"tipo": "pista", "texto": "Si una función da **#ERROR!**, revisa que separas con **;** y que el rango tiene dos puntos (B2:B8)."}]}, {"tipo": "quiz", "pregunta": "Tienes los minutos de lunes a domingo en C2:C8. ¿Cómo calculas la media diaria?", "opciones": ["=SUMA(C2:C8)", "=PROMEDIO(C2:C8)", "=PROMEDIO(C2;C8)", "=MAX(C2:C8)"], "correcta": 1, "explicacion": "Con **dos puntos** (C2:C8) es el rango completo. Con punto y coma (C2;C8) solo haría la media de esas dos celdas."}, {"tipo": "cierre", "puntos": ["**SUMA, PROMEDIO, MAX, MIN** resumen un rango.", "**CONTAR.SI** cuenta los que cumplen una condición.", "Argumentos separados por **;**"], "siguiente": "Trabajamos en la misma hoja a la vez y aprendemos el truco del $."}]}}, {"n": 4, "fase": "Bloque 2 · Pestañas y fórmulas avanzadas", "titulo": "El truco del $: referencias relativas y absolutas en una hoja compartida", "reto": "Entender qué pasa con una fórmula al arrastrarla, fijar celdas con $ y trabajar a la vez en una hoja compartida.", "actividades": [{"nombre": "La fórmula que se rompe", "min": 7, "desc": "El docente proyecta una tabla de precios con el IVA del 21 % en una sola celda (F1). Escribe =B2*F1, la arrastra hacia abajo y aparecen ceros. El alumnado propone por qué. Se explica la referencia relativa (se mueve al arrastrar) y la absoluta $F$1 (se queda quieta), con la tecla de función que añade los $ sola."}, {"nombre": "Práctica del $", "min": 13, "desc": "Cada estudiante crea la pestaña «Precios» en su hoja de pruebas: 6 productos del viaje de estudios (sudadera, camiseta, gorra, botella, mochila, pulsera) con precio sin IVA, una celda con el IVA y otra con el descuento de grupo (5 %). Calcula IVA, precio final y precio con descuento arrastrando fórmulas con $. Reto 🌶️: referencia mixta en una tabla de multiplicar (=$B3*C$2)."}, {"nombre": "Compartir y colaborar en vivo", "min": 15, "desc": "El docente comparte una hoja de la clase «Buzón de ideas» como editor. Cada estudiante escribe su idea de producto final en una fila distinta a la vez, añade un comentario (Ctrl+Alt+M) mencionando al docente con @ y prueba el historial de versiones (Archivo → Historial de versiones) para ver quién escribió qué. Se pactan normas: cada cual escribe solo en su zona, no se borra nada ajeno y los cambios se proponen con comentarios."}, {"nombre": "Parejas y elección de proyecto", "min": 10, "desc": "Se forman las parejas (el docente propone parejas equilibradas) y cada una elige tema: presupuesto del viaje de fin de curso, control de hábitos académicos o calculadora de calificaciones. Una persona crea la hoja «SdA6_Proyecto_Nombre1_Nombre2» con tres pestañas (Datos, Cálculos, Panel) y la comparte con su pareja como editora y con el docente como comentarista. Se reparten los roles."}, {"nombre": "Salida", "min": 5, "desc": "Quiz proyectado sobre qué referencia usar en cada caso."}], "criterios": ["DIG.4.2.3", "DIG.4.2.4"], "saberes": ["DIG.4.B.2", "DIG.4.B.3"], "metodologia": ["Instrucción directa con modelado", "Aprendizaje cooperativo en parejas"], "evidencias": ["Pestaña «Precios» con referencias absolutas", "Aportación y comentario en el «Buzón de ideas»", "Hoja del proyecto creada y compartida"], "recursos": ["Google Sheets", "Proyector", "Hoja compartida de la clase"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Animación paso a paso del arrastre en la web de clase; tarjeta de normas de colaboración; elección de tema del proyecto final; parejas formadas por el docente para equilibrar ritmos."}, "ejercicios": ["Calcula el precio final con IVA de los productos del viaje usando una referencia absoluta a la celda del IVA.", "Escribe tu idea en la hoja compartida de la clase y deja u ciones (SUMA, SI) bien escritas; explica en el Resumen qué pasa si cambia el descuento."]}, {"linea": "Alertas con formato condicional y SI", "criterio": "DIG.4.2.3", "niveles": ["No hay formato condicional.", "Hay una regla de color, pero no se aplica al rango correcto.", "Hay una regla que funciona (stock bajo en rojo).", "Dos reglas que funcionan y la celda SI muestra el mensaje según el objetivo.", "Además usa una escala de color o una fórmula personalizada que se entiende a simple vista."]}, {"linea": "Función propia con Apps Script", "criterio": "DIG.4.2.3", "niveles": ["No hay función propia ni explicación del código.", "Explica por escrito qué hace el código, pero no lo usa en la hoja.", "Pega la función SEMAFORO y la usa al menos en una celda.", "Usa SEMAFORO en toda la columna y el menú «Mi hoja» funciona.", "Modifica el código (otro nivel, otros emojis u otra opción de menú) y funciona."]}, {"linea": "Organización y archivo en mi Drive", "criterio": "DIG.4.2.1", "niveles": ["No entrega el enlace o la hoja no se puede abrir.", "Entrega el enlace, pero la hoja tiene otro nombre o está fuera de la carpeta.", "Nombre y carpeta correctos y compartida con el docente.", "Además las pestañas tienen nombres claros y la cabecera tiene formato.", "Su carpeta SdA6 está ordenada (6.1, 6.2 y proyecto) y la hoja tiene una nota de uso para quien la abra."]}], "config": ["Tipo de entrega: texto en línea (enlace a la hoja)", "Método de calificación: Rúbrica (1-3-5-7-10 por línea)", "Categoría del libro: DIG.4.2.3"], "criterios_rubrica": ["DIG.4.2.3", "DIG.4.2.1"], "calificable": true, "codigo": "6.2"}], "clase": {"pregunta": "¿Puede una hoja de cálculo aprender algo que no sabe hacer?", "diapositivas": [{"tipo": "ejemplo", "icono": "🚦", "titulo": "El semáforo de stock", "situacion": "En la tienda online pone «**¡Quedan 2!**» en naranja cuando casi no queda stock.", "explicacion": "Alguien programó esa regla. En Sheets no existe una función SEMAFORO, pero la podemos **programar con Apps Script**: Extensiones → Apps Script."}, {"tipo": "codigo", "titulo": "Función SEMAFORO (cópiala)", "codigo": "/** Devuelve un semáforo según el valor y un límite */\nfunction SEMAFORO(valor, limite) {\n  if (valor < limite) {\n    return \"🔴\";              // por debajo del límite\n  }\n  if (valor < limite * 2) {\n    return \"🟡\";              // cerca del límite\n  }\n  return \"🟢\";                // todo bien\n}", "explicacion": ["**function** crea la función; entre paréntesis, los datos que recibe.", "**if** comprueba una condición; **return** devuelve el resultado a la celda.", "En la hoja se usa con **;** → =SEMAFORO(C2;5)"], "pregunta": "¿Qué devuelve =SEMAFORO(7;5)?"}, {"tipo": "codigo", "titulo": "Un menú propio en tu hoja", "codigo": "function onOpen() {\n  SpreadsheetApp.getUi()\n    .createMenu(\"🎒 Mi hoja\")\n    .addItem(\"Poner fecha de hoy\", \"ponerFecha\")\n    .addToUi();\n}\n\nfunction ponerFecha() {\n  SpreadsheetApp.getActiveRange().setValue(new Date());\n}", "explicacion": ["**onOpen** se ejecuta sola al abrir la hoja.", "Al usar el menú la primera vez, Google pide **permiso**: es tu propio código."], "nota": "Si Apps Script está bloqueado para el alumnado, haz la demostración en tu cuenta y pide que expliquen el código por escrito (vale para la línea de la rúbrica)."}, {"tipo": "pasos", "titulo": "Pegar y probar", "progresivo": true, "pasos": ["Hoja → **Extensiones → Apps Script**", "Borra lo que hay y pega los dos códigos", "💾 Guardar (Ctrl+S)", "Vuelve a la hoja: en D2 escribe **=SEMAFORO(C2;5)** y arrastra", "Recarga la página: aparece el menú **🎒 Mi hoja**"]}, {"tipo": "practica", "titulo": "Tarea 6.2 · La tienda del viaje", "tiempo": 25, "entrega": "Tarea 6.2 · La tienda del viaje: pestañas, fórmulas y Apps Script", "enunciado": "Deja lista tu hoja como **SdA6_6.2_TuNombre** y entrega el enlace.", "pasos": ["☐ Pestañas **Precios, Pedidos y Resumen** enlazadas", "☐ **$** en el IVA y el descuento", "☐ Formato condicional en stock y ventas + celda **SI**", "☐ **SEMAFORO** aplicado y menú funcionando", "☐ Dos frases en Resumen: ¿qué celda cambias para subir el descuento y qué pasa?", "☐ En la carpeta SdA6 y compartida con tu docente", "🌶️ Cambia SEMAFORO para que use otro emoji u otro nivel"]}]}}, {"n": 7, "fase": "Bloque 3 · Visualización y presentación", "titulo": "Gráficos que cuentan (y gráficos que engañan)", "reto": "Elegir el gráfico adecuado para cada dato (sectores, barras, líneas), crearlo en la hoja del proyecto e interpretarlo con espíritu crítico.", "actividades": [{"nombre": "¿Qué gráfico te engaña?", "min": 10, "desc": "El docente proyecta dos gráficos de barras con los mismos datos (seguidores de dos creadores de contenido): uno con el eje vertical empezando en 0 y otro empezando en 95 000, donde parece que uno tiene el triple. El alumnado decide cuál es honesto y por qué. Se comenta que en redes y noticias circulan gráficos así."}, {"nombre": "Cada dato, su gráfico", "min": 10, "desc": "Con la hoja «Mi semana en pantalla» (6.1) el alumnado crea tres gráficos guiados: sectores para el reparto del total por app, barras para comparar los días y líneas para ver la evolución de una app durante la semana. Se cambia el título, los colores y las etiquetas de datos."}, {"nombre": "Gráficos del proyecto", "min": 25, "desc": "Cada pareja crea en la pestaña «Panel» de su proyecto al menos dos gráficos de tipos distintos a partir de la pestaña «Cálculos», con título, ejes con unidades y eje vertical desde 0. Debajo de cada gráfico escriben una frase de interpretación («El mayor gasto del viaje es el alojamiento, casi la mitad del total»). La persona diseñadora del panel coloca y da formato; la arquitecta de datos revisa que los rangos sean correctos, y luego cambian."}, {"nombre": "Salida", "min": 5, "desc": "Quiz proyectado: qué gráfico usar en tres situaciones."}], "criterios": ["DIG.4.2.3", "DIG.4.2.4"], "saberes": ["DIG.4.B.2", "DIG.4.B.3"], "metodologia": ["Aprendizaje cooperativo en parejas", "Pensamiento crítico"], "evidencias": ["Tres gráficos en la hoja 6.1", "Pestaña «Panel» del proyecto con dos gráficos interpretados"], "recursos": ["Google Sheets", "Proyector", "Hoja del proyecto"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Tabla «qué gráfico para qué» siempre visible; ejemplo con datos de creadores de contenido; frases de interpretación con un modelo para completar («El mayor… es… porque…»)."}, "ejercicios": ["Crea un gráfico de sectores, uno de barras y uno de líneas con tus datos de pantalla.", "Añade al panel del proyecto dos gráficos de tipos distintos con una frase de interpretación cada uno."], "clase": {"pregunta": "¿Puede un gráfico mentir con datos verdaderos?", "diapositivas": [{"tipo": "ejemplo", "icono": "📈", "titulo": "El triple… o casi lo mismo", "situacion": "Un vídeo dice: «**@creadora_A tiene el triple de seguidores que @creador_B**» y lo enseña con un gráfico de barras.", "explicacion": "Los datos: **101 000 frente a 97 000**. El eje empieza en **95 000**, por eso la barra parece el triple. Con el eje desde **0** casi no hay diferencia.", "pregunta": "¿Por qué alguien haría el gráfico así?"}, {"tipo": "comparar", "titulo": "Qué gráfico para qué", "columnas": [{"titulo": "Sectores", "icono": "🥧", "puntos": ["**Partes de un total**", "Reparto del presupuesto del viaje", "Máximo 5-6 trozos"]}, {"titulo": "Barras", "icono": "📊", "puntos": ["**Comparar** categorías", "Minutos por día, notas por materia"]}, {"titulo": "Líneas", "icono": "📈", "puntos": ["**Evolución** en el tiempo", "Horas de estudio semana a semana"]}]}, {"tipo": "pasos", "titulo": "Crear y arreglar un gráfico", "pasos": ["Selecciona el rango con su cabecera", "**Insertar → Gráfico** y elige el tipo en el editor", "Personalizar: **título**, títulos de ejes y etiquetas de datos", "Eje vertical: **mínimo 0**"]}, {"tipo": "video", "titulo": "Gráficos engañosos", "busqueda": "gráficos engañosos estadística explicación", "texto": "Fragmento corto de un vídeo que explique trucos de gráficos engañosos.", "preguntas": ["¿Qué truco usa cada gráfico?", "¿Cómo lo harías honesto?"], "nota": "Elige y prueba el vídeo antes de clase (máximo 3-4 minutos). Si no hay tiempo, sáltate esta diapositiva."}, {"tipo": "practica", "titulo": "El panel del proyecto", "tiempo": 25, "agrupamiento": "Parejas", "enunciado": "En la pestaña **Panel**, cread al menos **dos gráficos de tipos distintos** con datos de **Cálculos** y una frase de interpretación debajo de cada uno.", "pasos": ["Título que diga qué se ve", "Ejes con unidades (€, horas, puntos) y eje desde 0", "Frase: «El mayor … es … porque …»", "🎨 coloca y da formato · 🧱 revisa los rangos → después cambiáis"]}, {"tipo": "quiz", "pregunta": "Quieres enseñar cómo ha cambiado tu nota de Matemáticas en cada examen del curso. ¿Qué gráfico usas?", "opciones": ["Sectores", "Líneas", "Ninguno: mejor una tabla"], "correcta": 1, "explicacion": "Es una **evolución en el tiempo**: las líneas muestran si sube o baja de un examen a otro."}]}}, {"n": 8, "fase": "Bloque 3 · Visualización y presentación", "titulo": "A prueba de errores: proteger, validar y probar la hoja de otra pareja", "reto": "Proteger las fórmulas, limitar lo que se puede escribir con validación de datos y probar la hoja de otra pareja para encontrar fallos.", "actividades": [{"nombre": "El compañero que lo rompe todo", "min": 5, "desc": "El docente abre una hoja de ejemplo, borra sin querer una fórmula y escribe «mucho» donde iba un número: el panel se llena de errores. Se pregunta cómo evitarlo en una hoja que van a usar otras personas."}, {"nombre": "Proteger y validar", "min": 15, "desc": "Modelado e imitación en la hoja del proyecto: proteger las pestañas Cálculos y Panel (Datos → Proteger hojas e intervalos, mostrar advertencia o solo editores), validación de datos con desplegables (categorías de gasto, materias) y números entre un mínimo y un máximo, y nota de uso en la primera celda de Datos. Cada pareja revisa los permisos para compartir: la otra pareja será comentarista."}, {"nombre": "Validación cruzada", "min": 22, "desc": "El docente asigna a cada pareja otra pareja. Con permiso de comentarista (o con una copia de la hoja), la pareja revisora prueba la hoja ajena: introduce datos nuevos en Datos, comprueba que los totales y los gráficos se actualizan, intenta escribir un texto donde va un número y busca errores. Deja comentarios con @ en las celdas con fallos y rellena el formulario F2 de validación cruzada."}, {"nombre": "Lectura de comentarios", "min": 8, "desc": "Cada pareja lee los comentarios recibidos, los marca como resueltos o responde y apunta en un comentario de la primera celda de Datos las mejoras que hará en la última sesión."}], "criterios": ["DIG.4.2.4"], "saberes": ["DIG.4.B.3"], "metodologia": ["Evaluación entre iguales", "Aprendizaje cooperativo en parejas"], "evidencias": ["Rangos protegidos y validación de datos en la hoja del proyecto", "Comentarios en la hoja de otra pareja", "Formulario F2 de validación cruzada"], "recursos": ["Google Sheets", "Formulario F2", "Hojas de los proyectos"], "dua": {"principios": ["Compromiso", "Andamiaje"], "medidas": "Guion de prueba en cinco pasos para la validación cruzada; frases modelo para comentar con respeto («Al escribir… pasa…, podríais…»); el docente asigna las parejas revisoras."}, "ejercicios": ["Protege las pestañas de cálculos y panel y añade una validación de datos en la pestaña Datos.", "Prueba la hoja de otra pareja, deja al menos tres comentarios y rellena el formulario de validación cruzada."], "clase": {"pregunta": "¿Tu hoja sobreviviría a que otra persona la usara?", "diapositivas": [{"tipo": "ejemplo", "icono": "🧯", "titulo": "La hoja del grupo de clase", "situacion": "Alguien en el grupo de WhatsApp comparte la hoja del regalo del profe y otra persona **borra sin querer la fórmula del total**.", "explicacion": "Por eso las hojas que usan varias personas se **protegen** (solo se edita lo que toca) y se **validan** (solo se aceptan datos con sentido)."}, {"tipo": "pasos", "titulo": "Protege y valida tu hoja", "progresivo": true, "pasos": ["Pestaña Cálculos → clic derecho → **Proteger hoja** → solo editores", "Lo mismo en **Panel**", "Datos → selecciona la columna de categorías → **Datos → Validación de datos → Desplegable**", "Columna de cantidades: **número entre** 0 y un máximo", "A1 de Datos: nota con **Cómo usar esta hoja**"]}, {"tipo": "practica", "titulo": "Validación cruzada", "tiempo": 22, "agrupamiento": "Parejas (revisáis la hoja de otra pareja)", "enunciado": "Probad la hoja que os toque como si fuerais a usarla de verdad. Después rellenad el formulario **F2**.", "pasos": ["1. Leed la nota de uso: ¿se entiende qué hay que hacer?", "2. Añadid 3 datos nuevos en Datos: ¿cambian los totales y los gráficos?", "3. Escribid «mucho» donde va un número: ¿la hoja lo impide?", "4. Mirad el Panel: ¿los gráficos tienen título y eje desde 0?", "5. Dejad **3 comentarios con @**: «Al escribir… pasa… Podríais…»"], "enlace": "https://forms.gle/Tc6YxwGWGiDJCzBG9"}, {"tipo": "quiz", "pregunta": "Quieres que tu pareja revisora pueda dejar comentarios, pero no cambiar nada. ¿Qué permiso le das?", "opciones": ["Editor", "Comentarista", "Lector"], "correcta": 1, "explicacion": "**Comentarista**: ve la hoja y comenta, pero no modifica. Lector solo ve; Editor puede cambiarlo todo."}, {"tipo": "practica", "titulo": "Leemos lo que nos han dicho", "tiempo": 8, "agrupamiento": "Parejas", "enunciado": "Leed los comentarios de vuestra hoja, responded o marcadlos como resueltos y apuntad en A1 las mejoras que haréis.", "pasos": ["Comentario útil → respondedlo y planead el cambio", "Comentario que no compartís → explicad por qué con respeto"]}]}}, {"n": 9, "fase": "Bloque 3 · Visualización y presentación", "titulo": "Edición final, escaparate y entrega del producto", "reto": "Aplicar las mejoras de la validación cruzada, enseñar la hoja en un minuto y entregar el producto final en pareja.", "actividades": [{"nombre": "Mejoras tras la validación", "min": 18, "desc": "Cada pareja corrige los fallos de los comentarios y revisa la lista de comprobación final de la web de clase: tres pestañas enlazadas, fórmulas con $ y referencias entre pestañas, alertas, dos gráficos interpretados, rangos protegidos, validación de datos y nota de uso. Reto 🌶️ de profundización: añadir al proyecto la función SEMAFORO o un menú propio con Apps Script adaptado a su tema."}, {"nombre": "Escaparate de un minuto", "min": 17, "desc": "Paseo por la galería: cada pareja deja su hoja abierta en el Panel y la mitad de la clase visita las demás mesas mientras la otra mitad explica en un minuto qué problema resuelve su hoja y qué dice su gráfico principal; después se cambian los papeles. No se califica: sirve para ver otras soluciones y llevarse ideas."}, {"nombre": "Entrega de la Tarea 6.3", "min": 10, "desc": "Una persona de cada pareja entrega en la Tarea 6.3 el enlace de la hoja (compartida con el docente como comentarista) y ambas escriben en el comentario de la entrega qué hizo cada una, que el docente contrasta con el historial de versiones."}, {"nombre": "Cierre de la SdA", "min": 5, "desc": "Pregunta final en voz alta: «¿Dónde usarás una hoja de cálculo fuera del instituto?». El docente recoge ideas y cierra la SdA."}], "criterios": ["DIG.4.2.3", "DIG.4.2.4"], "saberes": ["DIG.4.B.2", "DIG.4.B.3"], "metodologia": ["Aprendizaje Basado en Proyectos (ABP)", "Aprendizaje cooperativo en parejas"], "evidencias": ["Hoja del proyecto final (Tarea 6.3 con rúbrica)", "Historial de versiones con la aportación de cada persona"], "recursos": ["Google Sheets", "Moodle Centros", "Hojas de los proyectos"], "dua": {"principios": ["Acción y Expresión", "Compromiso"], "medidas": "Escaparate de un minuto no calificado y en pequeño grupo (sin exposición ante toda la clase); lista de comprobación final; reto de Apps Script opcional para quien quiere más."}, "ejercicios": ["Corrige tu hoja con los comentarios de la validación cruzada y comprueba la lista final.", "Explica en un minuto qué problema resuelve vuestra hoja y qué dice su gráfico principal.", "Entrega el enlace del proyecto en la Tarea 6.3 indicando qué ha hecho cada persona."], "moodle": [{"recurso": "Tarea", "nombre": "6.3 · Producto final: nuestra hoja de cálculo cooperativa", "uso": "Tarea final en parejas: hoja completa con pestañas enlazadas, fórmulas, alertas, gráficos interpretados, protección y mejoras de la validación cruzada.", "correccion": "rubrica", "criterio": "DIG.4.2.3", "rubrica": [{"linea": "Estructura y fórmulas enlazadas", "criterio": "DIG.4.2.3", "niveles": ["La hoja tiene una sola pestaña o casi no hay fórmulas.", "Hay tres pestañas, pero Cálculos copia los datos a mano o hay errores (#REF!, #ERROR!).", "Cálculos usa los datos de Datos con fórmulas y funciones básicas sin errores.", "Usa referencias entre pestañas, absolutas donde hace falta y funciones como SUMA, PROMEDIO, CONTAR.SI o SI.", "Todo se recalcula solo al añadir datos nuevos y, además, integra una función o menú propio de Apps Script."]}, {"linea": "Alertas visuales", "criterio": "DIG.4.2.3", "niveles": ["No hay formato condicional.", "Hay una regla de color que no funciona bien o no tiene sentido para el tema.", "Hay una alerta que funciona y ayuda a ver un problema (gasto excesivo, nota baja, pocas horas de sueño).", "Dos o más alertas útiles y coherentes con el tema.", "Alertas útiles con fórmula personalizada o escala de color y mensaje SI que explica qué hacer."]}, {"linea": "Gráficos e interpretación", "criterio": "DIG.4.2.3", "niveles": ["No hay gráficos.", "Hay un gráfico, pero el tipo no encaja con los datos o no tiene título.", "Dos gráficos de tipos distintos con título, sin frase de interpretación.", "Dos gráficos adecuados, con título, ejes con unidades y eje desde 0, y una frase de interpretación correcta cada uno.", "Además las frases sacan una conclusión útil (qué decisión tomar) y el panel se entiende sin explicaciones."]}, {"linea": "Colaboración en la hoja compartida", "criterio": "DIG.4.2.4", "niveles": ["El historial muestra que una sola persona hizo todo el trabajo.", "Las dos personas aparecen en el historial, pero la participación es muy desigual.", "Las dos personas aportan y la hoja está compartida con los permisos pedidos.", "Aportación equilibrada según los roles, con comentarios entre la pareja para coordinarse.", "Además cualquiera de las dos sabe explicar cualquier parte de la hoja y la nota de entrega coincide con el historial."]}, {"linea": "Protección y validación cruzada", "criterio": "DIG.4.2.4", "niveles": ["No protege la hoja ni participa en la validación cruzada.", "Participa en la validación cruzada, pero sin comentarios útiles, o su hoja no tiene protección.", "Protege Cálculos y Panel y deja al menos tres comentarios en la hoja revisada.", "Además usa validación de datos y responde a los comentarios recibidos con respeto.", "Corrige los fallos señalados por la otra pareja, sus comentarios a la otra pareja son concretos y útiles y la hoja tiene nota de uso."]}], "config": ["Entrega por grupos: Sí (agrupamiento «SdA6-Parejas»)", "Tipo de entrega: texto en línea (enlace + qué hizo cada persona)", "Método de calificación: Rúbrica (1-3-5-7-10 por línea)"], "criterios_rubrica": ["DIG.4.2.3", "DIG.4.2.4"], "calificable": true, "codigo": "6.3"}], "clase": {"pregunta": "¿Usaría otra persona vuestra hoja sin preguntaros nada?", "diapositivas": [{"tipo": "practica", "titulo": "Lista final antes de entregar", "tiempo": 18, "agrupamiento": "Parejas", "enunciado": "Corregid lo que os señalaron y comprobad cada punto.", "pasos": ["☐ Pestañas **Datos · Cálculos · Panel** enlazadas, sin errores", "☐ Fórmulas con **$** y **'Hoja'!celda** · SUMA, PROMEDIO, CONTAR.SI o SI", "☐ Al menos **una alerta** de color útil", "☐ **Dos gráficos** distintos con título, unidades, eje desde 0 y frase", "☐ Cálculos y Panel **protegidos** · **validación** en Datos · **nota de uso** en A1", "☐ Comentarios de la validación cruzada **resueltos**", "🌶️ SEMAFORO o menú propio con Apps Script"]}, {"tipo": "practica", "titulo": "Escaparate de un minuto", "tiempo": 17, "agrupamiento": "Media clase explica, media clase visita", "enunciado": "Dejad vuestra hoja abierta en el **Panel**. Cuando os visiten, explicad en **1 minuto**:", "pasos": ["Qué problema resuelve vuestra hoja", "Qué dice vuestro gráfico principal", "Un truco del que estáis orgullosos (una fórmula, una alerta, un script)", "A los 8 minutos, **cambio de papeles**"], "nota": "No se califica. Marca el tiempo con el temporizador."}, {"tipo": "practica", "titulo": "Tarea 6.3 · Entrega en pareja", "tiempo": 10, "agrupamiento": "Parejas", "entrega": "Tarea 6.3 · Producto final: nuestra hoja de cálculo cooperativa", "enunciado": "Una persona entrega por las dos: pega el enlace de la hoja y escribe **qué ha hecho cada persona**.", "pasos": ["Hoja compartida con tu docente como **comentarista**", "«Nombre 1: … · Nombre 2: …» (lo compararé con el historial de versiones)"]}, {"tipo": "ejemplo", "icono": "💼", "titulo": "Fuera del instituto", "situacion": "En una tienda, un taller o un club deportivo alguien lleva **las cuentas, los turnos o los resultados** en una hoja compartida.", "explicacion": "Lo que habéis hecho (**datos enlazados, alertas, gráficos y permisos**) es exactamente lo que se pide en muchos trabajos y en el bachillerato o la FP.", "pregunta": "¿Dónde usarás tú una hoja de cálculo?"}, {"tipo": "cierre", "puntos": ["Datos ordenados → fórmulas → **alertas** → **gráficos**: los números cuentan algo.", "Una hoja compartida necesita **permisos, protección y validación**.", "Lo que otra pareja ve en tu hoja te ayuda a mejorarla."], "pregunta": "¿Qué te ha costado más y qué harías distinto?"}]}}], "dua": {"Compromiso": ["Datos cercanos al alumnado: tiempo de pantalla, la tienda del viaje de estudios, el presupuesto del viaje, las notas.", "Elección del tema del producto final entre tres opciones.", "Retos 🌶️ opcionales en cada práctica y escaparate de un minuto sin calificación."], "Representación": ["Cada técnica se muestra en pantalla antes de pedirla (yo lo hago, lo hacemos, lo haces).", "Chuletas visuales de funciones, referencias y tipos de gráfico en la web de clase, consultables desde el móvil.", "Ejemplos cotidianos antes de cada concepto (ticket del súper, app del banco, tienda online)."], "Acción y Expresión": ["Datos reales o de ejemplo, a elección, en la Tarea 6.1.", "Si Apps Script no está disponible, se puede explicar el código por escrito.", "Entrega por enlace en texto en línea, sin archivos ni formatos complicados."], "Andamiaje": ["Tablas de datos listas para copiar para no perder tiempo tecleando.", "Listas de comprobación de cada Tarea proyectadas antes de entregar.", "Ayudas plegables con pistas en las prácticas y guion de cinco pasos para la validación cruzada."]}, "diversidad": [{"perfil": "Alumnado repetidor con desmotivación", "medidas": "Tareas cortas con resultado visible en la misma sesión, datos de su propia vida, retos 🌶️ para quien quiere demostrar más y reconocimiento público de los avances en el escaparate."}, {"perfil": "Alumnado con dificultades de aprendizaje o de lectura", "medidas": "Instrucciones en pasos numerados y frases cortas, chuletas con un ejemplo de cada función, tablas para copiar, ubicación cerca del docente y prórroga en las Tareas de Moodle."}, {"perfil": "Alumnado con dificultades de atención", "medidas": "Prácticas con temporizador visible, cambio de actividad cada 10-15 minutos y una sola instrucción en pantalla cada vez (pasos progresivos)."}, {"perfil": "Alumnado con más soltura digital", "medidas": "Retos 🌶️ (referencias mixtas, fórmulas personalizadas en el formato condicional, modificar el script SEMAFORO, menú propio en el proyecto) y papel de ayudante en la validación cruzada."}, {"perfil": "Alumnado que no quiere compartir datos personales", "medidas": "Siempre hay datos de ejemplo inventados; nadie tiene que enseñar su tiempo de pantalla ni sus notas reales."}], "roles": [{"rol": "Arquitecto/a de datos", "funcion": "Organiza la pestaña Datos, escribe y revisa las fórmulas de Cálculos y comprueba que los rangos de los gráficos son correctos."}, {"rol": "Diseñador/a del panel", "funcion": "Crea los gráficos y las alertas del Panel, da formato, escribe la nota de uso y las frases de interpretación. Los roles se intercambian a mitad de la sesión 7 para que ambas personas toquen todo."}], "evaluacion": {"instrumentos": {"DIG.4.2.1": ["Tarea 6.2 con rúbrica (línea «Organización y archivo en mi Drive»)", "Observación directa de la carpeta de Drive en las sesiones 1-3"], "DIG.4.2.3": ["Tarea 6.1 (Apto / No apto)", "Tarea 6.2 con rúbrica", "Tarea 6.3 con rúbrica (líneas de fórmulas, alertas y gráficos)"], "DIG.4.2.4": ["Tarea 6.3 con rúbrica (líneas de colaboración y validación cruzada)", "Formulario F2 de validación cruzada", "Historial de versiones y comentarios de la hoja compartida"]}, "cotejo": [{"criterio": "DIG.4.2.1", "indicadores": ["Crea y usa una carpeta propia de la SdA en Drive con nombres de archivo claros.", "Encuentra sus archivos con el buscador de Drive sin ayuda.", "Comparte sus hojas con los permisos adecuados (lector, comentarista o editor).", "Usa la ayuda de la web de clase o del propio Sheets para resolver dudas de fórmulas."]}, {"criterio": "DIG.4.2.3", "indicadores": ["Distingue tipos de datos y aplica formatos (moneda, porcentaje, fecha).", "Escribe fórmulas con referencias relativas y absolutas y funciones básicas sin errores.", "Enlaza datos entre pestañas con 'Hoja'!celda.", "Crea alertas con formato condicional y la función SI.", "Elige el gráfico adecuado y lo interpreta de forma crítica.", "Integra una función propia de Apps Script en la hoja (o explica su código)."]}, {"criterio": "DIG.4.2.4", "indicadores": ["Trabaja a la vez con su pareja en la misma hoja respetando la zona de cada persona.", "Usa comentarios con @ para coordinarse y proponer cambios.", "Protege rangos y valida datos para que otras personas usen la hoja sin romperla.", "Revisa la hoja de otra pareja y da comentarios concretos y respetuosos.", "Responde a los comentarios recibidos y aplica mejoras."]}], "agentes": {"Heteroevaluación": "El docente corrige las Tareas 6.1 (Apto / No apto), 6.2 y 6.3 (rúbricas) y observa el trabajo en el aula y el historial de versiones de las hojas compartidas.", "Coevaluación": "Validación cruzada de la sesión 8: cada pareja prueba la hoja de otra, deja comentarios y rellena el formulario F2, que el docente usa como evidencia de la línea «Protección y validación cruzada».", "Autoevaluación": "Listas de comprobación antes de cada entrega (sesiones 3, 6 y 9) y pregunta de reflexión final."}}, "moodle": {"estructura": "Una sección «SdA 6 · Hoja de cálculo cooperativa» en el curso de Digitalización 4.º ESO con el área de texto de la SdA y las Tareas 6.1, 6.2 y 6.3 en el orden de las sesiones. Sin foros.", "secciones": [{"nombre": "SdA 6 · Hoja de cálculo cooperativa", "elementos": ["Área de texto y medios con el reto, la pregunta guía, las sesiones y el calendario de entregas", "Tarea 6.1 · Mi semana en pantalla (Apto / No apto)", "Tarea 6.2 · La tienda del viaje (rúbrica)", "Tarea 6.3 · Producto final en parejas (rúbrica)"]}], "calificaciones": "Tres categorías, una por criterio (DIG.4.2.1, DIG.4.2.3 y DIG.4.2.4). La Tarea 6.1 usa la escala «No apto, Apto»; las Tareas 6.2 y 6.3 se califican con rúbrica sobre 10 y van en la categoría DIG.4.2.3, pero la nota de cada criterio se calcula con sus líneas (6.2 → 2.1 y 2.3; 6.3 → 2.3 y 2.4) en la guía del profesorado y se traslada a Séneca.", "configuracion": ["Escala personalizada «No apto, Apto».", "Grupos: una pareja por grupo y agrupamiento «SdA6-Parejas» solo para la Tarea 6.3.", "Rúbricas de 6.2 y 6.3 guardadas como plantilla.", "Finalización de actividad activada en las tres Tareas."], "area_tex te (STEM4, CD2, CD3, CPSAA3, CE2) no coinciden del todo con los vinculados oficialmente a la CE 2 de Digitalización. Séneca deriva de la CE 2 los descriptores CD1, CD2, CD3, CPSAA1, CPSAA4, CPSAA5 y CE3, que son los que se registran. STEM4, CPSAA3 y CE2 pueden trabajarse, pero no se vinculan a estos criterios.", "Referencias 3D: en Excel una referencia 3D abarca varias hojas a la vez (=SUMA(Hoja1:Hoja3!A1)), algo que Google Sheets no admite. En esta SdA se trabajan las referencias a otras pestañas ('Hoja'!A1), que es lo que pide la secuencia y lo que Sheets sí permite.", "Separador de argumentos: con la configuración regional de España, Google Sheets separa los argumentos con punto y coma (;) y usa coma decimal; todos los ejemplos están escritos así.", "Apps Script: algunas consolas de Google Workspace de centros restringen Apps Script para las cuentas del alumnado. Conviene probarlo antes de la sesión 6 con una cuenta de estudiante; si está bloqueado, la línea de la rúbrica 6.2 se evalúa con la explicación escrita del código (niveles 1-3) y la demostración del docente.", "El criterio DIG.4.2.1 se evalúa en la Tarea 6.2 (línea «Organización y archivo en mi Drive») porque la gestión del entorno personal de aprendizaje (carpetas, nombres, búsqueda y permisos en Drive) se trabaja en las sesiones 1-3 y se consolida en la entrega de la 6.2.", "Los saberes DIG.4.D.1, DIG.4.B.4, DIG.4.C.2, DIG.4.C.3, DIG.4.D.5 y DIG.4.D.6, vinculados oficialmente a estos criterios, no se movilizan en esta SdA."], "anexos": {"formularios": [{"id": "F1", "titulo": "SdA 6 · Encuesta inicial: hojas de cálculo", "sesiones": [1], "anonimo": true, "obligatorias": true, "descripcion": "Es anónima. Sirve para saber qué sabéis ya de hojas de cálculo y preparar los retos. No hay respuestas buenas ni malas.", "confirmacion": "¡Gracias! Veremos el resumen de la clase en pantalla.", "preguntas": [{"tipo": "casillas", "titulo": "¿Qué hojas de cálculo has usado alguna vez?", "opciones": ["Google Sheets (Hojas de cálculo de Google)", "Microsoft Excel", "LibreOffice Calc", "Numbers (Apple)", "Ninguna"]}, {"tipo": "cuadricula", "titulo": "¿Qué sabes hacer en una hoja de cálculo?", "filas": ["Escribir datos y cambiar el ancho de las columnas", "Poner formato de moneda o porcentaje", "Hacer una suma con una fórmula", "Usar funciones como SUMA o PROMEDIO", "Hacer un gráfico", "Trabajar a la vez con otra persona en la misma hoja"], "columnas": ["Sé hacerlo", "Más o menos", "No sé"]}, {"tipo": "escala", "titulo": "¿Cuánto te apetece aprender a hacer hojas de cálculo?", "min": 1, "max": 5, "etiquetas": ["Nada", "Mucho"]}, {"tipo": "opcion", "titulo": "Si tuvieras que elegir hoy, ¿qué proyecto te gustaría hacer?", "opciones": ["🎒 Presupuesto del viaje de fin de curso", "📚 Control de mis hábitos de estudio", "🧮 Calculadora de mis notas", "Todavía no lo sé"]}, {"tipo": "parrafo", "titulo": "¿Qué te gustaría calcular o controlar con una hoja de cálculo?", "obligatoria": false}], "enlace": "https://forms.gle/bo7v8fkz6RNPRYKv9"}, {"id": "F2", "titulo": "SdA 6 · Validación cruzada entre parejas", "sesiones": [8], "anonimo": false, "obligatorias": true, "descripcion": "Rellenadlo después de probar la hoja de la otra pareja con el guion de 5 pasos de la web de clase. Responde una persona por pareja revisora.", "confirmacion": "¡Gracias! La otra pareja verá vuestros comentarios en su hoja. Recordad dejar al menos 3 comentarios con @.", "preguntas": [{"tipo": "texto", "titulo": "Nombres de vuestra pareja (revisora)"}, {"tipo": "texto", "titulo": "Nombres de la pareja cuya hoja habéis revisado"}, {"tipo": "cuadricula", "titulo": "Comprobaciones", "filas": ["La nota de uso explica qué hay que hacer", "Al añadir datos nuevos, los totales cambian solos", "Al añadir datos nuevos, los gráficos se actualizan", "La hoja impide escribir un texto donde va un número", "Las pestañas de cálculos y panel están protegidas", "Hay al menos una alerta de color que funciona", "Los gráficos tienen título .A.1", "DIG.4.A.4", "DIG.4.A.3"]}, "DIG.4.1.2": {"tipo": "cr", "texto": "Instalar y mantener sistemas operativos, configurando sus características en función de sus necesidades personales, de forma sostenible.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.2"]}, "DIG.4.1.3": {"tipo": "cr", "texto": "Identificar y resolver problemas técnicos sencillos, analizando componentes y funciones de los dispositivos digitales, evaluando las soluciones de manera crítica y reformulando el procedimiento, en caso necesario, fomentando un consumo y reposición de los sistemas digitales y/o tecnológicos de manera sostenible y responsable.", "competencia": "DIG.4.1", "saberes": ["DIG.4.A.1"]}, "DIG.4.2.1": {"tipo": "cr", "texto": "Gestionar el aprendizaje en el ámbito digital, configurando el entorno personal de aprendizaje mediante la integración de recursos digitales de manera autónoma.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.D.1"]}, "DIG.4.2.2": {"tipo": "cr", "texto": "Buscar, seleccionar y archivar información en función de sus necesidades haciendo uso de las herramientas del entorno personal de aprendizaje con sentido crítico y siguiendo normas básicas de seguridad en la red.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.1", "DIG.4.C.2", "DIG.4.C.3"]}, "DIG.4.2.3": {"tipo": "cr", "texto": "Crear, programar, integrar y reelaborar contenidos digitales de forma individual o colectiva, seleccionando las herramientas más apropiadas para generar nuevo conocimiento y contenidos digitales de manera creativa, respetando los derechos de autor y licencias de uso.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.2", "DIG.4.B.4", "DIG.4.D.1"]}, "DIG.4.2.4": {"tipo": "cr", "texto": "Interactuar en espacios virtuales de comunicación y plataformas de aprendizaje colaborativo, compartiendo y publicando información y datos, adaptándose a diferentes audiencias con una actitud participativa y respetuosa.", "competencia": "DIG.4.2", "saberes": ["DIG.4.B.3", "DIG.4.D.5", "DIG.4.D.6"]}, "DIG.4.3.1": {"tipo": "cr", "texto": "Proteger los datos personales y la huella digital generada en internet, configurando las condiciones de privacidad de las redes sociales y espacios virtuales de trabajo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.2"]}, "DIG.4.3.2": {"tipo": "cr", "texto": "Configurar y actualizar contraseñas, sistemas operativos y antivirus de forma periódica en los distintos dispositivos digitales de uso habitual.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.1"]}, "DIG.4.3.3": {"tipo": "cr", "texto": "Identificar y saber reaccionar ante situaciones que representan una amenaza en la red, escogiendo la mejor solución entre diversas opciones, desarrollando prácticas saludables y seguras, y valorando el bienestar físico y mental, tanto personal como colectivo.", "competencia": "DIG.4.3", "saberes": ["DIG.4.C.3"]}, "DIG.4.4.1": {"tipo": "cr", "texto": "Hacer un uso ético de los datos y las herramientas digitales, aplicando las normas de etiqueta digital y respetando la privacidad y las licencias de uso y propiedad intelectual en la comunicación, colaboración y participación activa en la red, basadas en el respeto mutuo.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.5"]}, "DIG.4.4.2": {"tipo": "cr", "texto": "Reconocer las aportaciones de las tecnologías digitales en las gestiones administrativas, y el comercio electrónico, siendo consciente de la brecha social de acceso, uso y aprovechamiento de dichas tecnologías para diversos colectivos.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.3", "DIG.4.D.4"]}, "DIG.4.4.3": {"tipo": "cr", "texto": "Valorar la importancia de la oportunidad, facilidad y libertad de expresión que suponen los medios digitales conectados, analizando de forma crítica los mensajes que se reciben y transmiten teniendo en cuenta su objetividad, ideología, intencionalidad, sesgos y caducidad.", "competencia": "DIG.4.4", "saberes": ["DIG.4.D.1", "DIG.4.D.2", "DIG.4.D.6"]}, "DIG.4.4.4": {"tipo":
