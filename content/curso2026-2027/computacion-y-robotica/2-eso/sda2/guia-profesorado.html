udocódigo impresas.", "Código «de emergencia» del ejemplo resuelto, después de intentar pensarlo.", "Listas de verificación «Antes de entregar» en cada plantilla y rúbricas publicadas en Moodle desde la sesión 1."]}, "diversidad": [{"perfil": "Alumnado con TDAH (2)", "medidas": "Prácticas troceadas en pasos cortos con temporizador visible en la web de clase, una sola consigna proyectada cada vez, ubicación cerca del docente y lejos de la puerta, rol activo de tester/a en el producto final, pausas activas al cambiar de actividad y lista de pasos de la sesión en la plantilla."}, {"perfil": "Alumnado con más dificultades (2)", "medidas": "Programas base con huecos y tarjetas de pseudocódigo impresas, versión mínima de cada práctica claramente marcada (los retos extra y de profundización son opcionales), compañero/a de apoyo en la pareja, prórroga en las Tareas de Moodle y presentación con guion de apoyo."}, {"perfil": "Alumnado con poca experiencia digital", "medidas": "Primeras sesiones desenchufadas, tutoriales oficiales de Scratch paso a paso, glosario visual y recordatorio de cómo guardar y compartir en cada práctica."}, {"perfil": "Alumnado con más nivel o que cursó CyR en 1.º", "medidas": "Retos de profundización 🚀 dentro de cada práctica (ver las actividades y la diapositiva de práctica de cada sesión): estrella y espiral con variables, rosetón, modo examen con «preguntar», séptima puerta sobre HTML, CSS y JavaScript, vidas, niveles, récord y clones. Se registran en la tabla «Retos de profundización que he hecho» del cuaderno A4, la rúbrica los reconoce en el nivel de 10 puntos y pueden hacer de mentor/a técnico en el foro «Bugs y soluciones»."}], "roles": [{"rol": "Programador/a", "funcion": "Traduce el diagrama a bloques, organiza los programas de cada objeto y coordina la depuración."}, {"rol": "Diseñador/a-guionista", "funcion": "Escribe la historia y los mensajes del ODS, diseña personajes y fondos, busca los recursos libres y mantiene la ficha de créditos."}, {"rol": "Tester/a-documentalista (en tríos)", "funcion": "Prueba el juego, anota los bugs, completa el cuaderno y prepara la demostración. En parejas, este rol se reparte."}], "evaluacion": {"instrumentos": {"CYR.1.1.3": ["Tarea 2.1 (Apto / No apto)", "Rúbricas de las Tareas 2.3, 2.4, 2.7 y 2.8", "Observación directa"], "CYR.1.2.1": ["Rúbricas de las Tareas 2.3, 2.4, 2.5, 2.7 y 2.8", "Observación directa del trabajo en equipo y de la Feria", "Ficha de game testers (coevaluación)"], "CYR.1.5.1": ["Rúbrica de la Tarea 2.5", "Observación directa de las sesiones 1 y 3"], "CYR.1.6.2": ["Tarea 2.2 (Apto / No apto)", "Rúbrica de la Tarea 2.6", "Observación del uso de las cuentas"], "CYR.1.6.3": ["Rúbricas de las Tareas 2.6 y 2.8", "Ficha de créditos y licencias"]}, "cotejo": [{"criterio": "CYR.2.1.3", "indicadores": ["Expresa un algoritmo de varias formas (lenguaje natural, pseudocódigo, diagrama de flujo y bloques).", "Explica una ventaja y un inconveniente de los lenguajes visuales frente a los de texto.", "Usa bucles (repetir, por siempre) para evitar instrucciones repetidas.", "Usa condicionales «si... entonces» y eventos para que el programa decida y reaccione.", "Explica qué hace cada bloque de su programa."]}, {"criterio": "CYR.2.2.1", "indicadores": ["Resuelve las prácticas de Scratch siguiendo la rutina Pienso - Programo - Pruebo.", "Generaliza una solución (el polígono de n lados) en lugar de repetir casos.", "Detecta y corrige errores probando su programa.", "Diseña pantallas de inicio, instrucciones y final para interactuar con el usuario.", "Colabora en su equipo, cumple su rol y el videojuego final funciona y responde al reto ODS."]}, {"criterio": "CYR.2.5.1", "indicadores": ["Clasifica periféricos de entrada, salida y E/S y distingue software de base y de aplicación.", "Explica la función de componentes como la placa base, la CPU, la memoria o el disco duro.", "Describe cómo responde un servidor web a la petición del navegador.", "Identifica head y body en una página y qué aportan HTML, CSS y JavaScript."]}, {"criterio": "CYR.2.6.2", "indicadores": ["Usa un nombre de usuario sin datos personales y una contraseña segura que no comparte.", "Reconoce vulnerabilidades de la plataforma (proyectos trampa, sesión abierta, datos en comentarios) y cómo evitarlas.", "Publica en Scratch sin datos personales ni fotos de personas, con instrucciones claras.", "Respeta las normas de la comunidad de Scratch al comentar."]}, {"criterio": "CYR.2.6.3", "indicadores": ["Distingue copyright, Creative Commons y dominio público.", "Busca recursos en bancos de contenido libre y comprueba su licencia.", "Cita autoría, web y licencia de cada recurso en la ficha de créditos y en Notas y créditos de Scratch."]}], "agentes": {"Heteroevaluación": "Tareas Apto / No apto 2.1 y 2.2, rúbricas de las Tareas 2.3 a 2.8 y observación directa de la presentación y la demostración en la Feria.", "Coevaluación": "Formulario de game testers entre equipos (sesión 16) antes de publicar.", "Autoevaluación": "Diana de autoevaluación y KWL en Google Forms (sesión 18) y listas «Antes de entregar» de cada plantilla."}}, "moodle": {"estructura": "Una sección «SdA 2 · Código en Acción» en el curso de Computación y Robótica de 2.º ESO, con el área de texto de presentación, la página «Cómo se evalúa», las ocho Tareas (2.1 a 2.8) en el orden de las sesiones y el foro «Bugs y soluciones».", "secciones": [{"nombre": "Sección SdA 2 · Código en Acción", "elementos": ["Área de texto y medios con el reto, la pregunta guía y los enlaces a la web de clase", "Página «Cómo se evalúa» con listas de verificación y rúbricas", "URL al estudio de Scratch de la clase", "Tareas 2.1 a 2.8", "Foro «Bugs y soluciones»"]}], "calificaciones": "Cinco categorías, una por criterio (CYR.2.1.3, CYR.2.2.1, CYR.2.5.1, CYR.2.6.2 y CYR.2.6.3). Las Tareas 2.1 y 2.2 usan la escala «No apto, Apto»; las Tareas 2.3 a 2.8 se califican con rúbrica sobre 10 y, como sus líneas evalúan varios criterios, la nota de cada criterio se toma de la media de sus líneas (la web de la SdA la calcula). La presentación de la Feria completa la rúbrica de la Tarea 2.8.", "configuracion": ["Escala personalizada «No apto, Apto».", "Grupos: un grupo por equipo y agrupamiento «SdA2-Feria» para la entrega por grupos de la Tarea 2.8.", "Archivos permitidos en las Tareas de Scratch: .pdf y enlace del proyecto en texto en línea.", "Rúbricas guardadas como plantilla para reutilizarlas.", "Prórrogas individuales para el alumnado con NEAE."], "area_texto": {"bloques": [{"nombre": "Inicio · Pensar como un ordenador", "descripcion": "Algoritmos, diagramas de flujo y primeros pasos en Scratch", "sesiones": "1-5"}, {"nombre": "Desarrollo · Prácticas de Scratch", "descripcion": "Coordenadas, bucles, condicionales, hardware e internet, licencias y variables", "sesiones": "6-12"}, {"nombre": "Cierre · Videojuego ODS y Feria", "descripcion": "Producto final en equipo · **Feria en las sesiones 17 y 18**", "sesiones": "13-18"}], "eventos": [{"sesion": 17, "texto": "Feria de Videojuegos Sostenibles (primera ronda de equipos)", "tipo": "Se evalúa en clase"}, {"sesion": 18, "texto": "Feria de Videojuegos Sostenibles (segunda ronda) y diana de autoevaluación", "tipo": "Se evalúa en clase"}], "nota_evaluacion": "Las Tareas **2.1 y 2.2** se corrigen como **Apto / No apto**. Las Tareas **2.3 a 2.8** se puntúan con **rúbrica** (1, 3, 5, 7 o 10 puntos por línea). En la Tarea 2.8 el videojuego cuenta un **66 %** y la presentación en la Feria un **33 %**. Tienes las rúbricas completas en la página **«Cómo se evalúa»**. En cada práctica hay un **reto 🚀 de profundización** opcional para quien quiera ir más allá.", "url_clase": "https://florindotic.es/content/curso2026-2027/computacion-y-robotica/2-eso/sda2/clase.html"}}, "seneca": {"justificacion": "El alumnado de 2.º ESO desarrolla el pensamiento computacional pasando de actividades desenchufadas a la programación por bloques en Scratch, un entorno orientado a eventos. Expresa algoritmos de distintas formas, resuelve prácticas guiadas con bucles, condicionales y variables, clasifica periféricos y software, conoce la estructura de una página web y el funcionamiento de un servidor, detecta vulnerabilidades al publicar y aplica licencias libres, y en equipo crea un videojuego sobre un ODS con pantallas de interacción que presenta en una feria de aula.", "actividades": [{"titulo": "Primeros programas: el gato y la bailarina", "tipo": "Estructuración", "abreviatura": "EST1", "tarea": "2.3", "sesiones": [1, 2, 3, 4, 5, 6], "trazabilidad": "RÚBRICA", "criterios": ["CYR.2.1.3", "CYR.2.2.1"]}, {"titulo": "Bucles: dibujos, polígonos y lluvia de residuos", "tipo": "Estructuración", "abreviatura": "EST2", "tarea": "2.4", "sesiones": [7, 8], "trazabilidad": "RÚBRICA", "criterios": ["CYR.2.1.3", "CYR.2.2.1"]}, {"titulo": "Hardware e internet en Scratch", "tipo": "Exploración", "abreviatura": "EXP1", "tarea": "2.5", "sesiones": [9, 10], "trazabilidad": "RÚBRICA", "criterios": ["CYR.2.5.1", "CYR.2.2.1"]}, {"titulo": "Licencias y créditos: las puertas de las licencias", "tipo": "Exploración", "abreviatura": "EXP2", "tarea": "2.6", "sesiones": [11], "trazabilidad": "RÚBRICA", "criterios": ["CYR.2.6.3", "CYR.2.6.2"]}, {"titulo": "Marcador, tiempo y depuración", "tipo": "Ampliación", "abreviatura": "AMP1", "tarea": "2.7", "sesiones": [12], "trazabilidad": "RÚBRICA", "criterios": ["CYR.2.2.1", "CYR.2.1.3"]}, {"titulo": "Producto final: videojuego ODS y Feria de Videojuegos Sostenibles", "tipo": "Conclusión", "abreviatura": "CON1", "tarea": "2.8", "sesiones": [13, 14, 15, 16, 17, 18], "trazabilidad": "RÚBRICA", "criterios": ["CYR.2.2.1", "CYR.2.1.3", "CYR.2.6.3"]}]}, "notas_rigor": ["Adaptación de la SdA 2 de 1.º ESO: se mantienen las 18 sesiones y las 8 Tareas (2.1 a 2.8) y se sustituyen los criterios por sus equivalentes de 2.º: CYR.1.1.3 → CYR.2.1.3, CYR.1.2.1 → CYR.2.2.1, CYR.1.5.1 → CYR.2.5.1, CYR.1.6.2 → CYR.2.6.2 y CYR.1.6.3 → CYR.2.6.3.", "Contenidos propios de 2.º añadidos sin cambiar las tareas: medios de expresión de algoritmos y ventajas e inconvenientes de los lenguajes visuales (CYR.2.A.1, A.3, sesión 3), pantallas de interacción con el usuario (CYR.2.A.5, sesiones 13-16), estructura de una página web, funcionamiento del servidor y lenguajes HTML, CSS y JavaScript (CYR.2.E.1, E.2, E.3, sesión 10) y vulnerabilidades de las plataformas de publicación (CYR.2.I.4, sesión 5).", "CYR.2.F.3 (periféricos de entrada y salida; software de base y de aplicación) está vinculado oficialmente a CYR.2.3.1, no a CYR.2.5.1; se usa en las sesiones 1 y 9 porque el juego de los componentes lo trabaja y se evalúa en la Tarea 2.5 dentro de CYR.2.5.1 (funcionamiento interno de las aplicaciones). Si prefieres evaluarlo con su criterio oficial, habría que añadir CYR.2.1.1 (funcionamiento de los sistemas de computación física).", "CYR.2.D.2 (programación orientada a eventos) pertenece al bloque de Desarrollo Móvil y está vinculado a CYR.2.2.2 y CYR.2.2.3, no a los criterios elegidos; se moviliza porque Scratch funciona por eventos (sesiones 5 y 14), sin evaluarlo con un criterio propio.", "Ponderación orientativa para el cuaderno del docente: CYR.2.1.3 25 %, CYR.2.2.1 30 %, CYR.2.5.1 15 %, CYR.2.6.2 15 % y CYR.2.6.3 15 %. Séneca calcula la nota de cada criterio con su propia configuración.", "Los retos 🚀 de profundización son opcionales y amplían la misma práctica; no cambian las Tareas ni las listas de cotejo, y las rúbricas los reconocen en el nivel de 10 puntos.", "Los formularios F1, F2 y F3 no llevan enlace: Codigo.gs los crea de nuevo para que las respuestas de 2.º no se mezclen con las de 1.º. Las plantillas de Google Docs (A1-A7) enlazan a los mismos documentos que en 1.º, que se comparten con «Hacer una copia».", "Saberes CYR.2.A.1 a CYR.2.A.5 se trabajan en todas las prácticas. Las Tareas Apto / No apto (2.1 y 2.2) y el foro no generan actividad en Séneca; sus sesiones van dentro de la actividad de la Tarea 2.3. ación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": ["CYR.2.2", "CYR.2.5", "CYR.2.6"]}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando l YR.2.I.5"], "descriptores": ["CC3", "CC4", "CCEC3", "CCEC4", "CCL3", "CD1", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM2", "STEM3"]}], "materiasTxt": "Computación y Robótica"}, "seneca": {"titulo": "SdA 2: Código en Acción: Videojuegos e Historias Interactivas Sostenibles", "temporalizacion": "18 sesiones", "justificacion": "El alumnado de 2.º ESO desarrolla el pensamiento computacional pasando de actividades desenchufadas a la programación por bloques en Scratch, un entorno orientado a eventos. Expresa algoritmos de distintas formas, resuelve prácticas guiadas con bucles, condicionales y variables, clasifica periféricos y software, conoce la estructura de una página web y el funcionamiento de un servidor, detecta vulnerabilidades al publicar y aplica licencias libres, y en equipo crea un videojuego sobre un ODS con pantallas de interacción que presenta en una feria de aula.", "producto_final": "Videojuego o historia interactiva en Scratch sobre un ODS, creado en parejas o tríos, con pantallas de inicio, instrucciones y final, personaje controlado por teclado, objetos con bucles, condicionales de colisión y variables de puntos y tiempo, publicado en el estudio de Scratch de la clase con instrucciones y ficha de créditos de recursos libres, y presentado con un elevator pitch y una demostración en directo en la Feria de Videojuegos Sostenibles.", "concrecion": [{"materia": "Computación y Robótica", "texto": "COMPETENCIAS ESPECÍFICAS\nCYR.2.1.Comprender el impacto que la computación y la robótica tienen en nuestra sociedad y desarrollar el pensamiento computacional para realizar proyectos de construcción de sistemas digitales de forma sostenible.\nCYR.2.2.Producir programas informáticos, colaborando en un equipo de trabajo y creando aplicaciones sencillas, mediante lenguaje de bloques, utilizando las principales estructuras de un lenguaje de programación para solventar un problema determinado o exhibir un comportamiento deseado.\nCYR.2.5.Utilizar y crear aplicaciones informáticas y web sencillas, entendiendo su funcionamiento interno, de forma segura, responsable y respetuosa, protegiendo la identidad online y la privacidad.\nCYR.2.6.Conocer y aplicar los principios de la ciberseguridad, adoptando hábitos y conductas de seguridad, para permitir la protección del individuo en su interacción en la red.\n\nCRITERIOS DE EVALUACIÓN\nCYR.2.1.3.Entender cómo funciona un programa informático, la manera de elaborarlo y sus principales componentes.\nCYR.2.2.1.Conocer y resolver la variedad de problemas posibles, desarrollando un programa informático y generalizando las soluciones, tanto de forma individual como trabajando en equipo, colaborando y comunicándose de forma adecuada.\nCYR.2.5.1.Conocer la construcción de aplicaciones informáticas y web, entendiendo su funcionamiento interno, de forma segura, responsable y respetuosa.\nCYR.2.6.2.Acceder a servicios de intercambio y publicación de información digital aplicando criterios de seguridad y uso responsable.\nCYR.2.6.3.Reconocer y comprender los derechos de los materiales alojados en Internet.\n\nSABERES BÁSICOS\nCYR.2.A.1.Lenguajes de programación visuales: ventajas e inconvenientes.\nCYR.2.A.2.Elementos de los programas con lenguaje de bloques.\nCYR.2.A.3.Secuencia de instrucciones. Medios de expresión de algoritmos.\nCYR.2.A.4.Generación de tareas repetitivas y condicionales.\nCYR.2.A.5.Pantallas de interacción con el usuario.\nCYR.2.D.2.Programación orientada a eventos: características, ventajas e inconvenientes.\nCYR.2.E.1.Estructura básica de una página web.\nCYR.2.E.2.Servidores web: funcionamiento.\nCYR.2.E.3.Lenguajes para la edición de páginas web: diferencias.\nCYR.2.F.3.Hardware: periféricos de entrada y salida. Software: de base y de aplicación.\nCYR.2.I.4.Interacción de plataformas virtuales: vulnerabilidades.\nCYR.2.I.5.Protección de la propiedad intelectual.\n\nDESCRIPTORES OPERATIVOS\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad."}], "actividades": [{"titulo": "Primeros programas: el gato y la bailarina", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "1", "tarea": "2.3 · El gato en coordenadas y la bailarina", "descripcion": "Sesión 1 (50 min): ¿Cómo piensa un videojuego? Hardware y software\nReto: Descubrir que un ordenador solo sigue instrucciones exactas y distinguir hardware, sistema operativo y aplicaciones.\n- Gancho: de jugar a crear (8 min). El docente proyecta 2-3 juegos sencillos hechos en Scratch (buscar en el estudio de Scratch «juegos de reciclaje») y pregunta: «¿Quién le dice al personaje que salte?». Se presenta el reto: crear un videojuego sostenible y enseñarlo en la Feria de Videojuegos Sostenibles.\n- El robot humano (14 min). Un/a voluntario/a hace de robot y solo obedece órdenes literales («da 2 pasos», «gira a la derecha»). La clase le guía para ir de la puerta a la papelera esquivando 2 mochilas y tirar una bola de papel. Se anotan en la pizarra las órdenes ambiguas («ve por allí») y qué falló. Conclusión: el ordenador hace exactamente lo que se le dice.\n- La receta del cacao (10 min). Por parejas, ordenan 8 tarjetas desordenadas de la receta del vaso de leche con cacao (coger el vaso, echar la leche, calentar 1 minuto, echar 2 cucharadas, remover…). Se comprueba que la secuencia es ordenada, precisa y tiene final: eso es un algoritmo.\n- ¿Hardware o software? (12 min). Con la infografía de capas (hardware, sistema operativo, aplicaciones, usuario) se recuerda la diferencia hardware-software y se amplía como corresponde a 2.º: los periféricos de entrada (teclado, ratón, micrófono), de salida (pantalla, altavoz, impresora) y de entrada/salida (pantalla táctil, pendrive, impresora multifunción), y el software de base (sistema operativo y controladores) frente al de aplicación (Scratch, Chrome, Minecraft). El alumnado clasifica en voz alta 10 ejemplos: teclado, Windows, Scratch, disco duro, Android, Minecraft, CPU, pantalla táctil, altavoz y el controlador de la impresora. Se explica que un videojuego es software de aplicación que el sistema operativo ejecuta sobre el hardware. 🚀 Profundización: ¿en qué grupo pondrías el mando de una consola que vibra, unas gafas de realidad virtual o un altavoz inteligente? Justifícalo.\n- Encuesta inicial (6 min). Cada estudiante responde el Google Forms anónimo de diagnóstico sobre videojuegos, programación y sostenibilidad (Formulario F1). El docente usa los resultados para formar parejas equilibradas.\n- Evidencia: Lista de órdenes ambiguas del robot humano (diagnóstica)\n- Evidencia: Respuestas de la encuesta inicial\n\nSesión 2 (50 min): Pensamiento computacional y la rutina «Pienso - Programo - Pruebo»\nReto: Aplicar descomposición, patrones, abstracción y algoritmos a problemas cotidianos y a retos de lógica.\n- Recordamos el robot humano (5 min). Lluvia de ideas rápida: ¿qué aprendimos del robot humano? Se recuerdan las 3 propiedades de un algoritmo.\n- Las 4 técnicas con un cumpleaños (12 min). El docente explica las 4 técnicas con un ejemplo cercano: organizar una fiesta de cumpleaños. Descomposición (comida, invitaciones, música), patrones (todas las invitaciones tienen nombre, hora y sitio), abstracción (no importa el color del bolígrafo) y algoritmo (lista de pasos del día). El alumnado propone un segundo ejemplo: preparar la mochila.\n- Pienso - Programo - Pruebo (8 min). Se presenta la rutina de aula que se usará en todas las prácticas. Pienso: descompongo y escribo los pasos. Programo: ordeno las acciones con bloques. Pruebo: ejecuto, miro qué falla y corrijo. Se aplica en voz alta a «hacer un bocadillo».\n- Retos de lógica desenchufados (20 min). Por parejas completan la ficha «Pienso como un ordenador» (plantilla en el anexo A1): tabla de las 4 técnicas con un ejemplo propio y dos retos de lógica al estilo Bebras (el robot repartidor en una cuadrícula y el patrón de las pulseras). Cada estudiante entrega su ficha. Enlace A1: https://docs.google.com/document/d/1fAIRb6mQU7MWUx8HRkLiZSJefOhrDBuX6ph9GLIRwW4/edit?usp=drivelink. 🚀 Profundización: resolver el robot repartidor con el menor número de órdenes usando «repetir» e inventar un patrón de pulseras propio para que lo descubra otra pareja.\n- Entrega (5 min). Se fotografía o escanea la ficha y se sube a la Tarea 2.1 de Moodle. Quien no termine la acaba en casa.\n- Moodle Centros: Tarea «2.1 · Ficha de pensamiento computacional» (corrección Apto / No apto). Comprobar que cada estudiante aplica las 4 técnicas y resuelve los retos de lógica.\n- Evidencia: Ficha «Pienso como un ordenador»\n\nSesión 3 (50 min): Algoritmos, pseudocódigo y programa\nReto: Escribir algoritmos precisos en pseudocódigo y entender cómo se convierten en un programa que ejecuta el ordenador.\n- Cazar el algoritmo malo (10 min). Se proyecta un algoritmo con fallos para lavarse los dientes («echar pasta un rato», «cepillar hasta que esté bien», sin final). El alumnado detecta qué incumple de las 3 propiedades: precisión, final y pasos sencillos ordenados.\n- Del pseudocódigo al procesador (10 min). El docente muestra el mismo algoritmo (dibujar un cuadrado) con los distintos medios de expresión: lenguaje natural, pseudocódigo («repetir 4 veces: mover 100, girar 90»), diagrama de flujo, bloques de Scratch, texto en Python (for i in range(4): forward(100); left(90)) y una línea de ceros y unos. Explica que el pseudocódigo es para personas, el programa lo traduce a un lenguaje que entiende el ordenador y la CPU lo ejecuta en código máquina. En 2 minutos se recogen ventajas e inconvenientes de los lenguajes visuales: no hay errores de escritura y los colores ayudan, pero los programas grandes ocupan mucho y en la industria se programa sobre todo con texto.\n- Escribimos pseudocódigo (25 min). Individualmente, en la ficha «Algoritmos y pseudocódigo» (plantilla en el anexo A2), corrigen el algoritmo malo y escriben el pseudocódigo de tres situaciones: cambiar una bombilla, comprar un bocadillo en la cantina y comprobar si un cargador de móvil funciona (con un «si… entonces»). Enlace A2: https://docs.google.com/document/d/1ouT8MgvVfkHHXD9LWZ1UGG4gd9otpac1Lqb0BUi9QEE/edit?usp=drivelink. 🚀 Profundización: dibujar también el algoritmo del cargador como diagrama de flujo y añadirle un bucle «repetir hasta que…» (probar otro enchufe hasta que cargue o no queden enchufes).\n- Lo probamos en voz alta (5 min). Dos estudiantes leen su pseudocódigo y un compañero/a lo ejecuta al pie de la letra. Se comentan los fallos encontrados.\n- Evidencia: Ficha de pseudocódigo\n\nSesión 4 (50 min): Diagramas de flujo: el algoritmo dibujado\nReto: Representar algoritmos con los símbolos de los diagramas de flujo y diseñar uno para clasificar residuos.\n- Los símbolos (8 min). Explicación con la infografía: óvalo (inicio y fin), rectángulo (proceso), paralelogramo (entrada o salida de datos), rombo (decisión sí/no) y flechas (camino).\n- Ejemplos guiados (12 min). Se analizan juntos tres diagramas: comprobar la edad para sacar una licencia (si edad ≥ 16), la lámpara que no funciona (¿está enchufada? ¿bombilla fundida?) e ir al baño en el instituto (pedir permiso, coger la tarjeta, volver). El alumnado señala cada símbolo.\n- Diagrama de los residuos (20 min). Por parejas, en la ficha «Diagrama de flujo: ¿a qué contenedor va?» (plantilla en el anexo A3), dibujan el diagrama que clasifica un residuo: si es plástico, lata o brik → amarillo; si es papel o cartón → azul; si es vidrio → verde; si es orgánico → marrón; si no → gris. Enlace A3: https://docs.google.com/document/d/1STFcn6wCav2-d0umR6nipYamy0BcvF1Wr2hV0bTSYGk/edit?usp=drivelink. 🚀 Profundización: añadir un bucle (¿quedan residuos en la bolsa? → coger otro) y una salida al punto limpio para pilas, medicamentos y aceite.\n- Lo ejecuta otra pareja (10 min). Intercambian el diagrama con otra pareja, que lo «ejecuta» con 5 residuos (botella de agua, periódico, tarro de mermelada, piel de plátano, bolígrafo) y anota en la tabla de pruebas si llega al contenedor correcto. Se corrigen las incoherencias.\n- Evidencia: Diagrama de flujo de los residuos en papel con su tabla de pruebas\n\nSesión 5 (50 min): Primeros pasos en Scratch: cuenta segura, escenario y movimiento\nReto: Entrar en Scratch con una cuenta segura, conocer la interfaz y mover un personaje con las flechas.\n- Una cuenta segura (12 min). El docente reparte a cada estudiante el usuario de clase creado desde su cuenta de profesor/a de Scratch (sin correo ni nombre real). Cada estudiante entra, cambia la contraseña por una segura (frase de 3 palabras y un número), la apunta en la agenda y no la comparte. Como corresponde a 2.º, se buscan juntos las vulnerabilidades de una plataforma de publicación: contraseña débil o compartida, no cerrar sesión en el ordenador del aula, datos personales en el perfil o en los comentarios, enlaces a webs externas y proyectos trampa que piden la contraseña «para regalar seguidores». Se acuerdan 4 medidas y se repasan las normas: sin datos personales ni fotos de personas en los proyectos, comentarios respetuosos. Cambian el idioma a español si hace falta.\n- La interfaz y el escenario (10 min). Recorrido guiado: escenario, lista de objetos, paleta de bloques por colores y área de programas. Se explica que el escenario mide 480 × 360 y que el centro es (0, 0); el alumnado mueve el ratón y observa cómo cambian x e y. Se presenta Scratch como programación orientada a eventos: cada programa empieza con un evento (bandera verde, tecla, clic) y espera a que ocurra; ventaja: varios programas funcionan a la vez; inconveniente: si dos eventos cambian lo mismo, el resultado puede sorprender.\n- Tutoriales de Scratch (8 min). Siguen los tutoriales oficiales «Para empezar» y «Usar las teclas de flechas» (menú Tutoriales). Quien termine antes hace «Añadir un fondo».\n- Mi personaje con flechas (15 min). Programan el gato para moverse en las 4 direcciones con «al presionar tecla [flecha derecha] → sumar 10 a x» y equivalentes, y para volver a (0, 0) al pulsar la bandera verde. Eligen un fondo. 🚀 Profundización: programar el movimiento con «por siempre + si ¿tecla presionada?» en lugar de «al presionar tecla», comparar cuál responde más suave y por qué, y hacer que el personaje mire hacia donde se mueve.\n- Guardar, compartir y entregar (5 min). Guardan el proyecto como «Práctica 1», lo comparten, lo añaden al estudio de la clase y pegan el enlace en la Tarea 2.2 de Moodle.\n- Moodle Centros: Tarea «2.2 · Mi cuenta y mi primer proyecto» (corrección Apto / No apto). Verificar que cada estudiante tiene una cuenta segura, sabe compartir y su personaje se mueve con las flechas.\n- Evidencia: Proyecto «Práctica 1» con personaje que se mueve con las flechas, en el estudio de la clase\n\nSesión 6 (50 min): Primeros proyectos: el gato en coordenadas y la bailarina\nReto: Programar un recorrido exacto con coordenadas y una bailarina que reacciona al chocar.\n- Ir o deslizar (8 min). Con el fondo «Xy-grid», el docente compara «ir a x: y:» (salto instantáneo) y «deslizar en 1 segundos a x: y:» (movimiento visible). El alumnado lo prueba y responde: ¿cuál es la diferencia entre ir y deslizar? Se cambia un disfraz con el editor (orejas puntiagudas).\n- Problema del gato en coordenadas (17 min). Primero escriben el pseudocódigo (colocar, orientar hacia arriba, mover, orientar a la izquierda, mover…) y después programan que el gato recorra un cuadrado sobre el Xy-grid y vuelva al punto de partida (por ejemplo, de (0,0) a (0,100), (−100,100), (−100,0) y (0,0)). 🚀 Profundización: que el gato dibuje la inicial de su nombre o un rectángulo de 200 × 100 calculando antes todas las coordenadas en una tabla.\n- La bailarina (20 min). Con el programa resuelto proyectado, programan una bailarina que se desplaza hacia el puntero del ratón cada vez que se pulsa espacio. Si toca el borde cambia de disfraz y dice «¡Cuidado!»; si toca a la princesa cambia de disfraz y saluda. Reducen el tamaño de la princesa. Atención: cada programa va en su objeto. 🚀 Profundización: la princesa salta a una posición aleatoria cada 2 segundos y una variable cuenta los saludos.\n- Evidencias (5 min). Copian en su cuaderno de prácticas (plantilla en el anexo A4) el enlace, el pseudocódigo y las capturas del código de las dos prácticas, lo exportan a PDF y lo suben a la Tarea 2.3. Enlace A4: https://docs.google.com/document/d/1Bsju9D2ObOFgzrFKqAVxVq9jry2PMESmcCR9lqNSkh0/edit?usp=drivelink.\n- Moodle Centros: Tarea «2.3 · El gato en coordenadas y la bailarina» (evaluada con rúbrica 1-3-5-7-10). Primera tarea evaluable: dos prácticas resueltas con su pseudocódigo y evidencias.\n- Evidencia: Prácticas 2 (gato) y 3 (bailarina)\n- Evidencia: Cuaderno de prácticas en PDF", "temporalizacion": "6 sesiónes", "recursos": "Proyector, Tarjetas de la receta, Google Forms, Ficha A1 impresa, Moodle Centros, Ficha A2, Ficha A3, Guía visual de símbolos, Scratch, Tarjetas de usuario, Cuaderno A4 (Google Docs)", "descriptores": "CC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nCYR.2.1.3.Entender cómo funciona un programa informático, la manera de elaborarlo y sus principales componentes.\nCYR.2.2.1.Conocer y resolver la variedad de problemas posibles, desarrollando un programa informático y generalizando las soluciones, tanto de forma individual como trabajando en equipo, colaborando y comunicándose de forma adecuada.", "ejercicios": "Da órdenes precisas al robot humano para llegar a la papelera esquivando obstáculos.\nOrdena las tarjetas de la receta del cacao y explica por qué es un algoritmo.\nClasifica estos elementos en hardware o software: teclado, Windows, Scratch, disco duro, Android, CPU.\nClasifica 10 elementos en periférico de entrada, de salida o de E/S, componente interno, software de base o software de aplicación.\nProfundización (opcional): Clasifica el mando de una consola que vibra, unas gafas de realidad virtual y un altavoz inteligente (entrada, salida o E/S) y justifícalo.\nExplica con un ejemplo propio las 4 técnicas del pensamiento computacional.\nResuelve el reto del robot repartidor escribiendo la secuencia de flechas.\nDescubre el patrón de las pulseras y completa la siguiente.\nProfundización (opcional): resolver el robot repartidor con el menor número de órdenes usando «repetir» e inventar un patrón de pulseras propio para que lo descubra otra pareja.\nCorrige el algoritmo de lavarse los dientes para que sea preciso y tenga final.\nEscribe el pseudocódigo para cambiar una bombilla.\nEscribe el pseudocódigo para comprobar si un cargador funciona usando «si… entonces».\nExpresa el algoritmo del cuadrado en lenguaje natural, pseudocódigo y diagrama de flujo, y escribe una ventaja y un inconveniente de los lenguajes visuales.\nProfundización (opcional): dibujar también el algoritmo del cargador como diagrama de flujo y añadirle un bucle «repetir hasta que…» (probar otro enchufe hasta que cargue o no queden enchufes).\nSeñala los símbolos del diagrama de la lámpara que no funciona.\nDibuja el diagrama de flujo que clasifica un residuo en su contenedor.\nPrueba el diagrama de otra pareja con 5 residuos y anota los errores.\nProfundización (opcional): añadir un bucle (¿quedan residuos en la bolsa? → coger otro) y una salida al punto limpio para pilas, medicamentos y aceite.\nCambia tu contraseña de Scratch por una segura y comprueba que tu usuario no tiene datos personales.\nPrograma el personaje para moverse con las 4 flechas.\nComparte el proyecto en el estudio de la clase.\nEscribe tres vulnerabilidades de una plataforma de publicación como Scratch y la medida que las evita.\nProfundización (opcional): programar el movimiento con «por siempre + si ¿tecla presionada?» en lugar de «al presionar tecla», comparar cuál responde más suave y por qué, y hacer que el personaje mire hacia donde se mueve.\nEscribe el pseudocódigo y programa que el gato recorra un cuadrado y vuelva al inicio.\nPrograma la bailarina que sigue al ratón al pulsar espacio y reacciona al tocar el borde y a la princesa.\nExplica la diferencia entre «ir a» y «deslizar».\nProfundización (opcional): que el gato dibuje la inicial de su nombre o un rectángulo de 200 × 100 calculando antes todas las coordenadas en una tabla / la princesa salta a una posición aleatoria cada 2 segundos y una variable cuenta los saludos.", "metodologias": "Computación desenchufada, ABP, Aprendizaje cooperativo, Rutina «Pienso - Programo - Pruebo», Aprendizaje a partir de ejemplos resueltos", "sesiones": [1, 2, 3, 4, 5, 6]}, {"titulo": "Bucles: dibujos, polígonos y lluvia de residuos", "tipo": "Estructuración", "abreviatura": "EST2", "orden": "2", "tarea": "2.4 · Bucles: dibujos, polígonos y lluvia de residuos", "descripcion": "Sesión 7 (50 min): Bucles I: animaciones y dibujos con el lápiz\nReto: Usar «por siempre» y «repetir» para animar un personaje y dibujar figuras sin repetir bloques.\n- ¿Cuántas veces lo repito? (8 min). Se recuerda el cuadrado de la sesión 6 (cuatro veces «apuntar + deslizar») y se buscan patrones repetidos en la vida diaria: el lavado de la lavadora, las vueltas a la pista, el estribillo de una canción. Se presentan «repetir (n)» y «por siempre».\n- Animación con por siempre (12 min). Programan un personaje con varios disfraces (por ejemplo, el murciélago o el pájaro) que alterna disfraces dentro de un «por siempre» con «esperar 0.2 segundos» para simular el vuelo o la caminata, y que rebota en los bordes.\n- Cuadrado con y sin bucle (15 min). Añaden la extensión Lápiz y dibujan un cuadrado de dos formas: primero repitiendo 4 veces «mover 100, girar 90» y después con «repetir 4». Siguen las normas del lápiz: borrar todo, bajar el lápiz, dibujar y subir el lápiz. Comparan cuántos bloques ocupa cada versión.\n- Reto del triángulo (12 min). Dibujan un triángulo equilátero con «repetir 3» y descubren el giro de 120°. Retos extra: reproducir un sonido en cada esquina del cuadrado (extensión Música) y cambiar de disfraz en cada esquina. 🚀 Profundización: dibujar una estrella de 5 puntas (girar 144°) y una espiral con una variable «lado» que aumenta 5 pasos en cada vuelta.\n- Guardar (3 min). Guardan como «Práctica 4» (animación) y «Práctica 5» (dibujos) y anotan los enlaces en el cuaderno de prácticas.\n- Evidencia: Prácticas 4 (animación) y 5 (cuadrado y triángulo)\n\nSesión 8 (50 min): Bucles II: lluvia de residuos y polígonos\nReto: Hacer que caigan objetos sin parar desde posiciones aleatorias y generalizar el dibujo a un polígono de n lados.\n- Lluvia de residuos (15 min). Inspirados en «Lluvia de albóndigas», programan un objeto (una botella o una lata, a tamaño 50 %) que aparece arriba en una x aleatoria entre −220 y 220, cae con «por siempre: sumar −5 a y» y, al llegar abajo (y < −170), vuelve arriba en otra x aleatoria. Extra: cinco residuos a velocidades distintas que salen con 3 segundos de diferencia. 🚀 Profundización: la velocidad de caída aumenta un poco cada vez que el residuo vuelve arriba.\n- Pienso el polígono (8 min). Se escribe juntos el pseudocódigo del polígono: borrar, colocar el lápiz, preguntar el número de lados, bajar el lápiz, repetir «lados» veces mover y girar, subir el lápiz. Se descubre la fórmula: ángulo = 360 / lados y pasos = 60 − lados (para que la figura quepa).\n- Programo el polígono (17 min). Programan el polígono con «preguntar» y la variable «respuesta». Extra con condicional: si el número de lados es mayor que 12 o menor que 3, el personaje dice «No puedo dibujar ese polígono» y no dibuja. 🚀 Profundización: un rosetón: repetir 12 veces el polígono girando 30° y cambiando el color del lápiz en cada vuelta.\n- Entrega (10 min). Completan el cuaderno de prácticas (anexo A4) con las prácticas 4, 5, 6 (lluvia) y 7 (polígono): enlaces, pseudocódigo y capturas. Lo suben en PDF a la Tarea 2.4. Enlace A4: https://docs.google.com/document/d/1Bsju9D2ObOFgzrFKqAVxVq9jry2PMESmcCR9lqNSkh0/edit?usp=drivelink.\n- Moodle Centros: Tarea «2.4 · Bucles: dibujos, polígonos y lluvia de residuos» (evaluada con rúbrica 1-3-5-7-10). Tarea evaluable de bucles: dibujo con y sin bucle, triángulo, polígono generalizado y lluvia de residuos.\n- Evidencia: Prácticas 6 (lluvia de residuos) y 7 (polígono)\n- Evidencia: Cuaderno de prácticas en PDF", "temporalizacion": "2 sesiónes", "recursos": "Scratch, Cuaderno A4, Moodle Centros", "descriptores": "CC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nCYR.2.1.3.Entender cómo funciona un programa informático, la manera de elaborarlo y sus principales componentes.\nCYR.2.2.1.Conocer y resolver la variedad de problemas posibles, desarrollando un programa informático y generalizando las soluciones, tanto de forma individual como trabajando en equipo, colaborando y comunicándose de forma adecuada.", "ejercicios": "Anima un personaje alternando disfraces dentro de un bucle «por siempre».\nDibuja un cuadrado sin bucle y con «repetir 4» y compara el número de bloques.\nDibuja un triángulo equilátero: ¿cuántos grados gira en cada esquina?\nProfundización (opcional): dibujar una estrella de 5 puntas (girar 144°) y una espiral con una variable «lado» que aumenta 5 pasos en cada vuelta.\nPrograma un residuo que cae sin parar desde una x aleatoria.\nPrograma un polígono de n lados preguntando el número de lados (ángulo = 360 / lados).\nExtra: no dibujes si el número de lados es mayor que 12.\nProfundización (opcional): un rosetón: repetir 12 veces el polígono girando 30° y cambiando el color del lápiz en cada vuelta / la velocidad de caída aumenta un poco cada vez que el residuo vuelve arriba.", "metodologias": "Aprendizaje a partir de ejemplos resueltos, Rutina «Pienso - Programo - Pruebo»", "sesiones": [7, 8]}, {"titulo": "Hardware e internet en Scratch", "tipo": "Exploración", "abreviatura": "EXP1", "orden": "3", "tarea": "2.5 · Hardware e internet en Scratch", "descripcion": "Sesión 9 (50 min): Condicionales y sensores: ¿reconoces el hardware?\nReto: Usar «si… entonces» y sensores de contacto para crear un juego que explica los componentes del ordenador.\n- Si llueve, cojo el paraguas (6 min). Ejemplos cotidianos de decisiones (si el semáforo está en rojo, paro; si el móvil tiene menos del 20 %, lo cargo) y su traducción al bloque «si… entonces… si no».\n- Repaso de la bailarina (6 min). Se repasa la bailarina de la sesión 6 para ver los sensores «¿tocando [objeto]?» y «¿tocando el color…?» y las consecuencias: sonido, cambio de disfraz, desaparecer (esconder).\n- Dentro del ordenador (10 min). Con la infografía y, si es posible, un ordenador viejo abierto, el docente presenta la placa base, la CPU, la memoria RAM, el disco duro, la tarjeta de sonido y la tarjeta wifi, y su función. Se recuerda la clasificación de la sesión 1: componentes internos, periféricos de entrada, salida y E/S, y software de base y de aplicación.\n- Juego «¿Reconoces el hardware?» (25 min). Siguiendo el ejemplo resuelto, crean un juego: el personaje se mueve con las flechas por un fondo con imágenes de 4 componentes (placa base, disco duro, tarjeta de sonido, tarjeta wifi) y, cuando toca uno, dice qué es y para qué sirve, emite un sonido positivo y el componente se esconde. Primero escriben el pseudocódigo. Extra: añadir la CPU y la RAM. 🚀 Profundización: modo examen: al tocar un componente o periférico, el personaje pregunta «¿Interno, entrada, salida o E/S?» con «preguntar», comprueba la respuesta con un condicional y suma puntos si acierta.\n- Guardar (3 min). Guardan como «Práctica 8» y anotan el enlace en el cuaderno.\n- Evidencia: Práctica 8: juego de los componentes del hardware\n\nSesión 10 (50 min): Las seis puertas de internet\nReto: Investigar los servicios de internet y programar un juego en el que cada puerta abre la explicación de un servicio.\n- ¿Qué pasa al abrir una web? (12 min). Con la infografía cliente-servidor, el docente explica cómo funciona un servidor web: el navegador hace una petición, el servidor busca el archivo y lo devuelve por internet. El alumnado pone ejemplos de servidores que usa (Scratch, YouTube, Moodle). Después, con Ctrl+U en una página sencilla (por ejemplo, example.com), localizan las etiquetas <html>, <head>, <title> y <body>: una web es texto con etiquetas. Se presentan los tres lenguajes de una página: HTML (estructura, el esqueleto), CSS (aspecto, la ropa) y JavaScript (comportamiento, los músculos).\n- Investigamos los servicios (8 min). Por parejas buscan una frase corta que defina cada servicio: WWW, correo electrónico, web social, grupos de noticias (foros), plataformas de streaming y comercio electrónico, y la escriben en su cuaderno con un ejemplo.\n- Programamos las puertas (22 min). Individualmente diseñan un fondo con 6 puertas de colores distintos. El personaje se mueve con las flechas; si toca el color de una puerta, cambia a un fondo blanco con la explicación del servicio, espera 3 segundos y vuelve a las puertas. Usan el cuentagotas para elegir el color exacto en «¿tocando el color…?». Primero programan una puerta y después copian el patrón. 🚀 Profundización: una séptima puerta «¿Cómo se hace una web?» que explique HTML, CSS y JavaScript, o una pregunta de comprobación al salir de cada puerta con «preguntar» que suma puntos si se acierta.\n- Entrega (8 min). Completan el cuaderno con las prácticas 8 (hardware) y 9 (puertas), con enlaces, pseudocódigo, capturas, las definiciones de los servicios y para qué sirven HTML, CSS y JavaScript, y lo suben en PDF a la Tarea 2.5.\n- Moodle Centros: Tarea «2.5 · Hardware e internet en Scratch» (evaluada con rúbrica 1-3-5-7-10). Tarea evaluable: juego de los componentes del ordenador y juego de las seis puertas de internet.\n- Evidencia: Práctica 9: las seis puertas de internet\n- Evidencia: Cuaderno de prácticas en PDF", "temporalizacion": "2 sesiónes", "recursos": "Scratch, Ordenador viejo para abrir, Cuaderno A4, Navegador, Moodle Centros", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\
