<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 2: Código en Acción: Videojuegos e Historias Interactivas Sostenibles", "numero": 2, "subtitulo": "«Feria de Videojuegos Sostenibles»: creamos en Scratch un juego o historia interactiva sobre un ODS, con pantallas de inicio, instrucciones y final", "curso_texto": "2.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Individual en las prácticas guiadas; parejas o tríos cooperativos con roles en el producto final", "temporalizacion": "Primer y segundo trimestre (orientativo: 18 sesiones, 9 semanas a 2 sesiones semanales)"}, "materias": [{"codigo": "CYR", "criterios": ["CYR.2.1.3", "CYR.2.2.1", "CYR.2.5.1", "CYR.2.6.2", "CYR.2.6.3"], "saberes": ["CYR.2.A.1", "CYR.2.A.2", "CYR.2.A.3", "CYR.2.A.4", "CYR.2.A.5", "CYR.2.D.2", "CYR.2.E.1", "CYR.2.E.2", "CYR.2.E.3", "CYR.2.F.3", "CYR.2.I.4", "CYR.2.I.5"]}], "vision": {"descripcion": "El alumnado de 2.º ESO pasa de jugar a crear. Expresa algoritmos de varias formas (lenguaje natural, pseudocódigo, diagramas de flujo, bloques y texto) y valora las ventajas e inconvenientes de los lenguajes visuales; programa en Scratch, un entorno orientado a eventos, con bucles, condicionales y variables a partir de prácticas resueltas; clasifica los periféricos y el software de base y de aplicación; descubre cómo está hecha una página web y cómo responde un servidor; detecta las vulnerabilidades de una plataforma de publicación; usa recursos multimedia respetando las licencias y, en equipo, crea un videojuego o historia interactiva con pantallas de inicio, instrucciones y final que conciencia sobre un Objetivo de Desarrollo Sostenible.", "contexto": "Grupo de 18 estudiantes de 2.º ESO con un perfil muy parecido al de 1.º: poca experiencia en programación, entre ellos dos con TDAH y dos con más dificultades de aprendizaje; parte del grupo puede haber cursado Computación y Robótica en 1.º y avanzar más rápido, por lo que cada práctica incluye un reto de profundización (🚀) opcional. Se trabaja en el aula de informática con un ordenador por estudiante, Google Workspace del centro (@g.educaand.es), Moodle Centros y Scratch con la cuenta de profesor/a de Scratch para Educación, desde la que el docente crea las cuentas del alumnado sin pedir su correo. El producto final se presenta en una Feria de Videojuegos Sostenibles en el aula.", "justificacion": "La SdA desarrolla el pensamiento computacional (descomposición, patrones, abstracción y algoritmos) con un andamiaje graduado: primero actividades desenchufadas, después diagramas de flujo y, por último, programación por bloques. Moviliza los bloques de 2.º ESO de Introducción a la Programación (medios de expresión de algoritmos, ventajas e inconvenientes de los lenguajes visuales, tareas repetitivas y condicionales y pantallas de interacción con el usuario), Desarrollo Móvil (programación orientada a eventos), Desarrollo Web (estructura de una página, funcionamiento de los servidores y lenguajes web), Fundamentos de la Computación Física (periféricos de entrada y salida, software de base y de aplicación) y Ciberseguridad (vulnerabilidades de las plataformas virtuales y propiedad intelectual). Conecta la competencia digital y la STEM con un compromiso ecosocial real (ODS 12, Producción y consumo responsables, y ODS 13, Acción por el clima). Las tareas son las mismas que en 1.º, porque el nivel de partida del alumnado es muy parecido; la progresión de 2.º está en los contenidos añadidos y en los retos de profundización de cada práctica.", "reto": "«Somos un estudio de videojuegos del instituto. Nos han encargado crear en Scratch un videojuego o una historia interactiva que ayude a nuestra comunidad educativa a entender un problema de sostenibilidad (reciclaje, ahorro de agua, energía, biodiversidad o huella digital) y a actuar. Lo publicaremos en el estudio de Scratch de la clase, usando solo recursos con licencia libre, y lo presentaremos en la Feria de Videojuegos Sostenibles.»", "pregunta_guia": "¿Cómo podemos concienciar a nuestra comunidad sobre el desarrollo sostenible creando un videojuego o una historia interactiva en Scratch?", "producto_final": "Videojuego o historia interactiva en Scratch sobre un ODS, creado en parejas o tríos, con pantallas de inicio, instrucciones y final, personaje controlado por teclado, objetos con bucles, condicionales de colisión y variables de puntos y tiempo, publicado en el estudio de Scratch de la clase con instrucciones y ficha de créditos de recursos libres, y presentado con un elevator pitch y una demostración en directo en la Feria de Videojuegos Sostenibles."}, "metodologias": [{"nombre": "Aprendizaje Basado en Proyectos (ABP)", "descripcion": "Las prácticas guiadas preparan las piezas (movimiento, bucles, condicionales, variables, recursos libres) que cada equipo une en su videojuego ODS, presentado ante la clase."}, {"nombre": "Computación desenchufada", "descripcion": "El robot humano, la receta, las fichas de pensamiento computacional y los diagramas en papel dan sentido a los algoritmos antes de usar el ordenador."}, {"nombre": "Rutina «Pienso - Programo - Pruebo»", "descripcion": "Cada práctica empieza con pseudocódigo o diagrama (Pienso), sigue con los bloques (Programo) y termina probando y corrigiendo (Pruebo)."}, {"nombre": "Aprendizaje a partir de ejemplos resueltos", "descripcion": "Las prácticas de Scratch parten de programas resueltos (gato, bailarina, lápiz, polígonos, puertas) que el alumnado reproduce, entiende y mejora con retos extra."}, {"nombre": "Aprendizaje cooperativo", "descripcion": "Parejas o tríos con roles rotativos (Programador/a, Diseñador/a-guionista, Tester/a-documentalista) y contrato de equipo."}, {"nombre": "Cultura maker y depuración", "descripcion": "El error es una oportunidad: los bugs se cazan, se documentan y se comparten en el foro «Bugs y soluciones»."}, {"nombre": "Coevaluación y metacognición", "descripcion": "Game testers entre equipos antes de publicar y diana de autoevaluación con KWL al cierre."}, {"nombre": "Enseñanza multinivel", "descripcion": "Cada práctica tiene tres niveles: versión mínima (programa base con huecos), versión completa (la del enunciado) y reto de profundización 🚀 para quien termina antes o tiene más nivel. Los retos amplían la misma práctica y la rúbrica los reconoce en el nivel de 10 puntos; nunca son obligatorios."}], "recursos": ["Aula de informática (un ordenador por estudiante)", "Proyector", "Scratch (cuenta de profesor/a y cuentas de clase)", "Estudio de Scratch de la clase", "Moodle Centros", "Google Workspace del centro", "Bancos de recursos libres (Freesound, Openverse)", "Fichas y plantillas del docente"], "fases": [{"nombre": "Inicio", "sesiones": "1-5", "finalidad": "Motivación, pensamiento computacional desenchufado, algoritmos, diagramas de flujo y primeros pasos en Scratch"}, {"nombre": "Desarrollo", "sesiones": "6-12", "finalidad": "Prácticas resueltas en Scratch: coordenadas, bucles, condicionales, hardware e internet, licencias y variables"}, {"nombre": "Cierre", "sesiones": "13-18", "finalidad": "Videojuego ODS en equipo, publicación, Feria de Videojuegos Sostenibles y metacognición"}], "sesiones": [{"n": 1, "fase": "Inicio", "titulo": "¿Cómo piensa un videojuego? Hardware y software", "reto": "Descubrir que un ordenador solo sigue instrucciones exactas y distinguir hardware, sistema operativo y aplicaciones.", "actividades": [{"nombre": "Gancho: de jugar a crear", "min": 8, "desc": "El docente proyecta 2-3 juegos sencillos hechos en Scratch (buscar en el estudio de Scratch «juegos de reciclaje») y pregunta: «¿Quién le dice al personaje que salte?». Se presenta el reto: crear un videojuego sostenible y enseñarlo en la Feria de Videojuegos Sostenibles."}, {"nombre": "El robot humano", "min": 14, "desc": "Un/a voluntario/a hace de robot y solo obedece órdenes literales («da 2 pasos», «gira a la derecha»). La clase le guía para ir de la puerta a la papelera esquivando 2 mochilas y tirar una bola de papel. Se anotan en la pizarra las órdenes ambiguas («ve por allí») y qué falló. Conclusión: el ordenador hace exactamente lo que se le dice."}, {"nombre": "La receta del cacao", "min": 10, "desc": "Por parejas, ordenan 8 tarjetas desordenadas de la receta del vaso de leche con cacao (coger el vaso, echar la leche, calentar 1 minuto, echar 2 cucharadas, remover…). Se comprueba que la secuencia es ordenada, precisa y tiene final: eso es un algoritmo."}, {"nombre": "¿Hardware o software?", "min": 12, "desc": "Con la infografía de capas (hardware, sistema operativo, aplicaciones, usuario) se recuerda la diferencia hardware-software y se amplía como corresponde a 2.º: los periféricos de entrada (teclado, ratón, micrófono), de salida (pantalla, altavoz, impresora) y de entrada/salida (pantalla táctil, pendrive, impresora multifunción), y el software de base (sistema operativo y controladores) frente al de aplicación (Scratch, Chrome, Minecraft). El alumnado clasifica en voz alta 10 ejemplos: teclado, Windows, Scratch, disco duro, Android, Minecraft, CPU, pantalla táctil, altavoz y el controlador de la impresora. Se explica que un videojuego es software de aplicación que el sistema operativo ejecuta sobre el hardware. 🚀 Profundización: ¿en qué grupo pondrías el mando de una consola que vibra, unas gafas de realidad virtual o un altavoz inteligente? Justifícalo."}, {"nombre": "Encuesta inicial", "min": 6, "desc": "Cada estudiante responde el Google Forms anónimo de diagnóstico sobre videojuegos, programación y sostenibilidad (Formulario F1). El docente usa los resultados para formar parejas equilibradas. Enlace F1: https://forms.gle/hZivwDLmTKPC5KDWA."}], "criterios": [], "saberes": ["CYR.2.A.3", "CYR.2.F.3"], "metodologia": ["Computación desenchufada", "ABP"], "evidencias": ["Lista de órdenes ambiguas del robot humano (diagnóstica)", "Respuestas de la encuesta inicial"], "recursos": ["Proyector", "Tarjetas de la receta", "Google Forms"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "El alumnado con TDAH puede hacer de robot o de «programador/a jefe/a»; la infografía de capas queda proyectada mientras se clasifica."}, "ejercicios": ["Da órdenes precisas al robot humano para llegar a la papelera esquivando obstáculos.", "Ordena las tarjetas de la receta del cacao y explica por qué es un algoritmo.", "Clasifica estos elementos en hardware o software: teclado, Windows, Scratch, disco duro, Android, CPU.", "Clasifica 10 elementos en periférico de entrada, de salida o de E/S, componente interno, software de base o software de aplicación.", "Profundización (opcional): Clasifica el mando de una consola que vibra, unas gafas de realidad virtual y un altavoz inteligente (entrada, salida o E/S) y justifícalo."], "clase": {"pregunta": "Cuando pulsas un botón y tu personaje salta, ¿quién ha decidido que salte?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎮", "titulo": "Pulsas «espacio» y el personaje salta", "situacion": "En cualquier videojuego, al pulsar una tecla el personaje **reacciona siempre igual**.", "explicacion": "Alguien escribió las instrucciones: «cuando se pulse espacio → subir 50 pasos → bajar». El juego **no piensa**: obedece un programa."}, {"tipo": "idea", "icono": "🏆", "titulo": "Nuestro reto", "puntos": ["Crear un **videojuego o historia** en Scratch sobre un **ODS**.", "Publicarlo en el **estudio de Scratch** de la clase.", "Presentarlo en la **Feria de Videojuegos Sostenibles**."], "nota": "Enseñar 2-3 juegos de reciclaje del estudio de Scratch antes de esta diapositiva."}, {"tipo": "practica", "titulo": "El robot humano", "tiempo": 14, "enunciado": "Guiad al robot de la **puerta a la papelera** esquivando 2 mochilas y que tire una bola de papel. Solo órdenes **literales**.", "pasos": ["Ejemplo de orden válida: «da 2 pasos», «gira 90° a la derecha».", "Anotad cada orden que el robot no entienda.", "¿Qué orden ha fallado y por qué?"], "agrupamiento": "Toda la clase"}, {"tipo": "codigo", "titulo": "La receta del cacao es un algoritmo", "codigo": "1. Coger un vaso\n2. Echar leche hasta 3/4 del vaso\n3. Calentar en el microondas 1 minuto\n4. Echar 2 cucharadas de cacao\n5. Remover 10 veces\n6. Fin", "pregunta": "¿Qué pasa si cambiamos el orden de los pasos 2 y 3?", "nota": "Pasos ordenados: no se calienta antes de echar la leche. Pasos precisos: «2 cucharadas», no «un poco». Tiene final."}, {"tipo": "infografia", "titulo": "Las capas de un ordenador", "svg": "<svg viewBox=\"0 0 640 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Capas de un ordenador: usuario arriba, luego aplicaciones, sistema operativo y hardware abajo\">\n<rect x=\"120\" y=\"10\" width=\"400\" height=\"44\" rx=\"10\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:3\"/>\n<text x=\"320\" y=\"39\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 18px system-ui\">🙋 Usuario/a: pulsa, escribe, juega</text>\n<rect x=\"90\" y=\"64\" width=\"460\" height=\"44\" rx=\"10\" style=\"fill:var(--accent-soft);stroke:var(--accent);stroke-width:3\"/>\n<text x=\"320\" y=\"93\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 18px system-ui\">📱 Aplicaciones: Scratch, Chrome, Minecraft</text>\n<rect x=\"60\" y=\"118\" width=\"520\" height=\"44\" rx=\"10\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:3\"/>\n<text x=\"320\" y=\"147\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 18px system-ui\">⚙️ Sistema operativo: Windows, Linux, Android</text>\n<rect x=\"30\" y=\"172\" width=\"580\" height=\"48\" rx=\"10\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:3\"/>\n<text x=\"320\" y=\"203\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 18px system-ui\">🔩 Hardware: CPU, memoria, disco, pantalla, teclado</text>\n</svg>", "nota": "Un videojuego es una aplicación: el sistema operativo hace de intermediario con el hardware."}, {"tipo": "infografia", "titulo": "Periféricos y tipos de software", "elementos": [{"icono": "⌨️", "titulo": "Entrada", "texto": "Meten datos: teclado, ratón, micrófono."}, {"icono": "🔊", "titulo": "Salida", "texto": "Sacan datos: pantalla, altavoz, impresora."}, {"icono": "📲", "titulo": "Entrada/salida", "texto": "Las dos cosas: pantalla táctil, pendrive."}, {"icono": "⚙️", "titulo": "Software de base", "texto": "Hace funcionar el equipo: **sistema operativo** y controladores."}, {"icono": "🎮", "titulo": "Software de aplicación", "texto": "Para una tarea: Scratch, Chrome, Minecraft."}], "nota": "Clasificar en voz alta: teclado, Windows, Scratch, disco duro, Android, Minecraft, CPU, pantalla táctil, altavoz, controlador de impresora."}, {"tipo": "quiz", "pregunta": "¿Cuál de estos es hardware?", "opciones": ["Minecraft", "Android", "El disco duro", "Scratch"], "correcta": 2, "explicacion": "El **disco duro** se puede tocar: es hardware. Minecraft y Scratch son aplicaciones y Android es un sistema operativo: software."}, {"tipo": "quiz", "pregunta": "La pantalla táctil del móvil es un periférico…", "opciones": ["De entrada", "De salida", "De entrada y salida"], "correcta": 2, "explicacion": "Muestra la imagen (**salida**) y recoge tus toques (**entrada**): es de **entrada/salida**."}, {"tipo": "practica", "titulo": "Encuesta inicial", "tiempo": 6, "enunciado": "Responde la encuesta **anónima** (Formulario F1): no hay respuestas buenas ni malas.", "agrupamiento": "Individual", "enlace": "https://forms.gle/hZivwDLmTKPC5KDWA"}, {"tipo": "cierre", "puntos": ["El ordenador **solo hace lo que se le dice**.", "Un algoritmo: pasos **ordenados, precisos y con final**.", "Periféricos de **entrada, salida y E/S**; software **de base** y **de aplicación**."], "siguiente": "Las 4 técnicas del pensamiento computacional.", "pregunta": "Di una orden ambigua que le darías a un robot y cómo la harías precisa."}]}, "moodle": []}, {"n": 2, "fase": "Inicio", "titulo": "Pensamiento computacional y la rutina «Pienso - Programo - Pruebo»", "reto": "Aplicar descomposición, patrones, abstracción y algoritmos a problemas cotidianos y a retos de lógica.", "actividades": [{"nombre": "Recordamos el robot humano", "min": 5, "desc": "Lluvia de ideas rápida: ¿qué aprendimos del robot humano? Se recuerdan las 3 propiedades de un algoritmo."}, {"nombre": "Las 4 técnicas con un cumpleaños", "min": 12, "desc": "El docente explica las 4 técnicas con un ejemplo cercano: organizar una fiesta de cumpleaños. Descomposición (comida, invitaciones, música), patrones (todas las invitaciones tienen nombre, hora y sitio), abstracción (no importa el color del bolígrafo) y algoritmo (lista de pasos del día). El alumnado propone un segundo ejemplo: preparar la mochila."}, {"nombre": "Pienso - Programo - Pruebo", "min": 8, "desc": "Se presenta la rutina de aula que se usará en todas las prácticas. Pienso: descompongo y escribo los pasos. Programo: ordeno las acciones con bloques. Pruebo: ejecuto, miro qué falla y corrijo. Se aplica en voz alta a «hacer un bocadillo»."}, {"nombre": "Retos de lógica desenchufados", "min": 20, "desc": "Por parejas completan la ficha «Pienso como un ordenador» (plantilla en el anexo A1): tabla de las 4 técnicas con un ejemplo propio y dos retos de lógica al estilo Bebras (el robot repartidor en una cuadrícula y el patrón de las pulseras). Cada estudiante entrega su ficha. Enlace A1: https://docs.google.com/document/d/1fAIRb6mQU7MWUx8HRkLiZSJefOhrDBuX6ph9GLIRwW4/edit?usp=drive_link. 🚀 Profundización: resolver el robot repartidor con el menor número de órdenes usando «repetir» e inventar un patrón de pulseras propio para que lo descubra otra pareja."}, {"nombre": "Entrega", "min": 5, "desc": "Se fotografía o escanea la ficha y se sube a la Tarea 2.1 de Moodle. Quien no termine la acaba en casa."}], "criterios": ["CYR.2.1.3"], "saberes": ["CYR.2.A.3"], "metodologia": ["Computación desenchufada", "Aprendizaje cooperativo"], "evidencias": ["Ficha «Pienso como un ordenador»"], "recursos": ["Proyector", "Ficha A1 impresa", "Moodle Centros"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Ficha con un ejemplo resuelto de cada técnica; los retos de lógica se pueden resolver con fichas o dibujando en la cuadrícula."}, "ejercicios": ["Explica con un ejemplo propio las 4 técnicas del pensamiento computacional.", "Resuelve el reto del robot repartidor escribiendo la secuencia de flechas.", "Descubre el patrón de las pulseras y completa la siguiente.", "Profundización (opcional): resolver el robot repartidor con el menor número de órdenes usando «repetir» e inventar un patrón de pulseras propio para que lo descubra otra pareja."], "clase": {"pregunta": "¿Cómo organizarías una fiesta de cumpleaños sin olvidar nada?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎂", "titulo": "Organizar un cumpleaños", "situacion": "Hay que pensar en comida, invitaciones, música y juegos… ¡y parece **imposible**!", "explicacion": "Si lo **divides en partes**, buscas lo que se repite y te olvidas de lo que no importa, se convierte en una lista de pasos. Eso es **pensamiento computacional**."}, {"tipo": "infografia", "titulo": "Las 4 técnicas", "elementos": [{"icono": "🧩", "titulo": "Descomposición", "texto": "Dividir el problema en **partes pequeñas**."}, {"icono": "🔁", "titulo": "Patrones", "texto": "Encontrar lo que **se repite**."}, {"icono": "🔍", "titulo": "Abstracción", "texto": "Quedarse con **lo esencial**."}, {"icono": "📝", "titulo": "Algoritmo", "texto": "Escribir los **pasos en orden**."}]}, {"tipo": "flujo", "titulo": "Nuestra rutina en cada práctica", "nodos": [{"texto": "🧠 Pienso: descompongo y escribo los pasos", "tipo": "inicio"}, {"texto": "🧱 Programo: ordeno los bloques", "tipo": "proceso"}, {"texto": "▶️ Pruebo: ¿funciona?", "tipo": "decision"}, {"texto": "🔧 Si falla, corrijo y vuelvo a probar", "tipo": "fin"}]}, {"tipo": "quiz", "pregunta": "Para dibujar 10 casas iguales en un juego, te das cuenta de que todas tienen tejado, puerta y 2 ventanas. ¿Qué técnica usas?", "opciones": ["Descomposición", "Reconocimiento de patrones", "Abstracción"], "correcta": 1, "explicacion": "Has encontrado lo que **se repite**: es un patrón. Así dibujas una casa y la repites."}, {"tipo": "practica", "titulo": "Pienso como un ordenador", "tiempo": 20, "enunciado": "Completa la ficha del **anexo A1**: las 4 técnicas con tu ejemplo y los dos retos de lógica.", "pasos": ["Tabla de las 4 técnicas con un ejemplo de tu vida.", "Reto 1: el robot repartidor (secuencia de flechas).", "Reto 2: el patrón de las pulseras.", "🚀 **Profundización:** robot repartidor con **«repetir»** y el menor número de órdenes; inventa un patrón para otra pareja."], "agrupamiento": "Parejas (cada estudiante entrega su ficha)", "entrega": "Tarea 2.1 · Ficha de pensamiento computacional", "enlace": "https://docs.google.com/document/d/1fAIRb6mQU7MWUx8HRkLiZSJefOhrDBuX6ph9GLIRwW4/edit?usp=drive_link"}, {"tipo": "cierre", "puntos": ["Divide, busca patrones, quédate con lo esencial y ordena los pasos.", "En cada práctica: **Pienso - Programo - Pruebo**."], "siguiente": "Algoritmos y pseudocódigo: hablar como un programa.", "pregunta": "¿Qué técnica te ha costado más y por qué?"}]}, "moodle": [{"recurso": "Tarea", "nombre": "2.1 · Ficha de pensamiento computacional", "uso": "Comprobar que cada estudiante aplica las 4 técnicas y resuelve los retos de lógica.", "correccion": "apto", "criterio": "CYR.2.1.3", "cotejo": ["Se entrega la ficha completa en PDF o foto legible", "Las 4 técnicas tienen un ejemplo propio", "El reto del robot repartidor tiene una secuencia de flechas que llega al destino", "El reto de las pulseras explica el patrón"], "config": ["Archivos permitidos: .pdf, .jpg, .png", "Calificación: escala Apto / No apto"], "calificable": true, "codigo": "2.1"}]}, {"n": 3, "fase": "Inicio", "titulo": "Algoritmos, pseudocódigo y programa", "reto": "Escribir algoritmos precisos en pseudocódigo y entender cómo se convierten en un programa que ejecuta el ordenador.", "actividades": [{"nombre": "Cazar el algoritmo malo", "min": 10, "desc": "Se proyecta un algoritmo con fallos para lavarse los dientes («echar pasta un rato», «cepillar hasta que esté bien», sin final). El alumnado detecta qué incumple de las 3 propiedades: precisión, final y pasos sencillos ordenados."}, {"nombre": "Del pseudocódigo al procesador", "min": 10, "desc": "El docente muestra el mismo algoritmo (dibujar un cuadrado) con los distintos medios de expresión: lenguaje natural, pseudocódigo («repetir 4 veces: mover 100, girar 90»), diagrama de flujo, bloques de Scratch, texto en Python (for i in range(4): forward(100); left(90)) y una línea de ceros y unos. Explica que el pseudocódigo es para personas, el programa lo traduce a un lenguaje que entiende el ordenador y la CPU lo ejecuta en código máquina. En 2 minutos se recogen ventajas e inconvenientes de los lenguajes visuales: no hay errores de escritura y los colores ayudan, pero los programas grandes ocupan mucho y en la industria se programa sobre todo con texto."}, {"nombre": "Escribimos pseudocódigo", "min": 25, "desc": "Individualmente, en la ficha «Algoritmos y pseudocódigo» (plantilla en el anexo A2), corrigen el algoritmo malo y escriben el pseudocódigo de tres situaciones: cambiar una bombilla, comprar un bocadillo en la cantina y comprobar si un cargador de móvil funciona (con un «si… entonces»). Enlace A2: https://docs.google.com/document/d/1ouT8MgvVfkHHXD9LWZ1UGG4gd9otpac1Lqb0BUi9QEE/edit?usp=drive_link. 🚀 Profundización: dibujar también el algoritmo del cargador como diagrama de flujo y añadirle un bucle «repetir hasta que…» (probar otro enchufe hasta que cargue o no queden enchufes)."}, {"nombre": "Lo probamos en voz alta", "min": 5, "desc": "Dos estudiantes leen su pseudocódigo y un compañero/a lo ejecuta al pie de la letra. Se comentan los fallos encontrados."}], "criterios": ["CYR.2.1.3", "CYR.2.5.1"], "saberes": ["CYR.2.A.1", "CYR.2.A.3", "CYR.2.F.3"], "metodologia": ["Computación desenchufada", "Rutina «Pienso - Programo - Pruebo»"], "evidencias": ["Ficha de pseudocódigo"], "recursos": ["Proyector", "Ficha A2"], "dua": {"principios": ["Andamiaje", "Acción y Expresión"], "medidas": "Banco de verbos de acción (coger, mover, girar, comprobar, repetir) en la ficha; el alumnado con más dificultades puede ordenar tarjetas de pasos en lugar de escribirlos."}, "ejercicios": ["Corrige el algoritmo de lavarse los dientes para que sea preciso y tenga final.", "Escribe el pseudocódigo para cambiar una bombilla.", "Escribe el pseudocódigo para comprobar si un cargador funciona usando «si… entonces».", "Expresa el algoritmo del cuadrado en lenguaje natural, pseudocódigo y diagrama de flujo, y escribe una ventaja y un inconveniente de los lenguajes visuales.", "Profundización (opcional): dibujar también el algoritmo del cargador como diagrama de flujo y añadirle un bucle «repetir hasta que…» (probar otro enchufe hasta que cargue o no queden enchufes)."], "clase": {"pregunta": "¿En qué idioma hablamos con un ordenador?", "diapositivas": [{"tipo": "ejemplo", "icono": "🪥", "titulo": "Lavarse los dientes… mal explicado", "situacion": "«Echa pasta **un rato**. Cepilla **hasta que esté bien**. Enjuaga.»", "explicacion": "Un robot no sabe cuánto es «un rato» ni cuándo está «bien». Un algoritmo necesita pasos **precisos** y un **final** claro."}, {"tipo": "comparar", "titulo": "Las 3 propiedades de un algoritmo", "columnas": [{"titulo": "Preciso", "icono": "🎯", "puntos": ["Sin dudas: «2 cucharadas», no «un poco»."]}, {"titulo": "Finito", "icono": "🏁", "puntos": ["Siempre **termina**."]}, {"titulo": "Ordenado", "icono": "🪜", "puntos": ["Pasos **sencillos** uno detrás de otro."]}]}, {"tipo": "codigo", "titulo": "Un mismo algoritmo, tres idiomas", "codigo": "PSEUDOCÓDIGO (para personas)\n  repetir 4 veces:\n     mover 100 pasos y girar 90°\n\nSCRATCH (programa)\n  repetir (4)\n     mover (100) pasos\n     girar ↻ (90) grados\n\nPROCESADOR (código máquina)\n  10110000 01100100 ...", "explicacion": ["El **pseudocódigo** nos ayuda a pensar antes de programar.", "El **programa** traduce el algoritmo a un lenguaje del ordenador.", "La **CPU** solo entiende ceros y unos."], "pregunta": "¿Por qué es más fácil encontrar errores en el pseudocódigo?"}, {"tipo": "comparar", "titulo": "Bloques o texto: ventajas e inconvenientes", "columnas": [{"titulo": "Lenguaje visual (Scratch)", "icono": "🧱", "puntos": ["**Sin errores** de escritura.", "Colores por tipo de bloque.", "Programas grandes: **ocupan mucho**."]}, {"titulo": "Lenguaje de texto (Python)", "icono": "⌨️", "puntos": ["Más **rápido** de escribir y leer cuando es largo.", "Una coma mal puesta da **error**.", "El que se usa en la **industria**."]}], "pregunta": "¿Con cuál empezarías a enseñar a tu hermano/a pequeño/a? ¿Por qué?", "nota": "Mismo cuadrado en Python: for i in range(4): forward(100) / left(90). No hace falta saber Python; solo comparar."}, {"tipo": "codigo", "titulo": "Ejemplo resuelto: ¿funciona el cargador?", "codigo": "Inicio\n  Enchufar el cargador a la pared\n  Conectar el cable al móvil\n  Esperar 5 segundos\n  si aparece el rayo de carga entonces\n      decir \"El cargador funciona\"\n  si no\n      probar con otro enchufe\nFin", "nota": "«si… entonces… si no» es una decisión."}, {"tipo": "practica", "titulo": "Escribimos pseudocódigo", "tiempo": 25, "enunciado": "Completa la ficha del **anexo A2**.", "pasos": ["Corrige el algoritmo de los dientes.", "Pseudocódigo: cambiar una bombilla.", "Pseudocódigo: comprar un bocadillo en la cantina.", "Pseudocódigo con «si»: comprobar un cargador.", "🚀 **Profundización:** el cargador también como **diagrama de flujo** y con un bucle **«repetir hasta que…»**."], "agrupamiento": "Individual", "enlace": "https://docs.google.com/document/d/1ouT8MgvVfkHHXD9LWZ1UGG4gd9otpac1Lqb0BUi9QEE/edit?usp=drive_link"}, {"tipo": "practica", "titulo": "Lo probamos en voz alta", "tiempo": 5, "enunciado": "Lee tu pseudocódigo y un compañero/a lo ejecuta **al pie de la letra**. ¿Ha salido ink);font:700 16px system-ui\">Proceso</text>\n<path d=\"M330 40 L450 40 L425 100 L305 100 Z\" style=\"fill:var(--accent-soft);stroke:var(--accent);stroke-width:3\"/>\n<text x=\"378\" y=\"68\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 15px system-ui\">Entrada /</text>\n<text x=\"378\" y=\"88\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 15px system-ui\">Salida</text>\n<path d=\"M545 25 L605 70 L545 115 L485 70 Z\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:3\"/>\n<text x=\"545\" y=\"76\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">¿Decisión?</text>\n<text x=\"70\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">Empieza y acaba</text>\n<text x=\"220\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">Una acción</text>\n<text x=\"378\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">Pide o muestra datos</text>\n<text x=\"545\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">Sí / No</text>\n<path d=\"M200 195 L420 195\" style=\"stroke:var(--ink);stroke-width:4;fill:none\"/><path d=\"M410 184 L432 195 L410 206 Z\" style=\"fill:var(--ink)\"/>\n<text x=\"320\" y=\"228\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">Flecha: indica el camino a seguir</text>\n</svg>"}, {"tipo": "flujo", "titulo": "Ejemplo resuelto: la lámpara no funciona", "nodos": [{"texto": "Inicio", "tipo": "inicio"}, {"texto": "¿Está enchufada?", "tipo": "decision"}, {"texto": "No → enchufarla · Sí → ¿bombilla fundida?", "tipo": "decision"}, {"texto": "Sí → cambiar la bombilla · No → llamar al técnico", "tipo": "proceso"}, {"texto": "Fin", "tipo": "fin"}]}, {"tipo": "quiz", "pregunta": "En el diagrama de la licencia, «Introducir la edad» va en un…", "opciones": ["Rombo", "Paralelogramo", "Óvalo"], "correcta": 1, "explicacion": "Pedir o mostrar datos es **entrada/salida**: paralelogramo. piden la contraseña «para regalar seguidores». Se acuerdan 4 medidas y se repasan las normas: sin datos personales ni fotos de personas en los proyectos, comentarios respetuosos. Cambian el idioma a español si hace falta."}, {"nombre": "La interfaz y el escenario", "min": 10, "desc": "Recorrido guiado: escenario, lista de objetos, paleta de bloques por colores y área de programas. Se explica que el escenario mide 480 × 360 y que el centro es (0, 0); el alumnado mueve el ratón y observa cómo cambian x e y. Se presenta Scratch como programación orientada a eventos: cada programa empieza con un evento (bandera verde, tecla, clic) y espera a que ocurra; ventaja: varios programas funcionan a la vez; inconveniente: si dos eventos cambian lo mismo, el resultado puede sorprender."}, {"nombre": "Tutoriales de Scratch", "min": 8, "desc": "Siguen los tutoriales oficiales «Para empezar» y «Usar las teclas de flechas» (menú Tutoriales). Quien termine antes hace «Añadir un fondo»."}, {"nombre": "Mi personaje con flechas", "min": 15, "desc": "Programan el gato para moverse en las 4 direcciones con «al presionar tecla [flecha derecha] → sumar 10 a x» y equivalentes, y para volver a (0, 0) al pulsar la bandera verde. Eligen un fondo. 🚀 Profundización: programar el movimiento con «por siempre + si ¿tecla presionada?» en lugar de «al presionar tecla», comparar cuál responde más suave y por qué, y hacer que el personaje mire hacia donde se mueve."}, {"nombre": "Guardar, compartir y entregar", "min": 5, "desc": "Guardan el proyecto como «Práctica 1», lo comparten, lo añaden al estudio de la clase y pegan el enlace en la Tarea 2.2 de Moodle."}], "criterios": ["CYR.2.1.3", "CYR.2.2.1", "CYR.2.6.2"], "saberes": ["CYR.2.A.1", "CYR.2.A.2", "CYR.2.A.5", "CYR.2.D.2", "CYR.2.I.4"], "metodologia": ["Aprendizaje a partir de ejemplos resueltos", "Rutina «Pienso - Programo - Pruebo»"], "evidencias": ["Proyecto «Práctica 1» con personaje que se mueve con las flechas, en el estudio de la clase"], "re y apúntala.", "Idioma: Español (icono del globo).", "Tutoriales: «Para empezar» y «Usar las teclas de flechas»."], "progresivo": true}, {"tipo": "practica", "titulo": "Mi personaje con flechas", "tiempo": 15, "enunciado": "Programa el personaje para moverse con las **4 flechas** y volver al centro con la **bandera verde**. Elige un fondo.", "pasos": ["Pienso: ¿qué tecla cambia x y cuál y?", "Programo los 4 eventos.", "Pruebo: ¿llega a las 4 esquinas?", "🚀 **Profundización:** movimiento con **«por siempre + si ¿tecla presionada?»**: ¿cuál va más suave? Que mire hacia donde va."]}, {"tipo": "practica", "titulo": "Guardar, compartir y entregar", "tiempo": 5, "enunciado": "Guarda como **«Práctica 1»**, pulsa **Compartir**, añádelo al estudio de la clase y pega el enlace en Moodle.", "entrega": "Tarea 2.2 · Mi cuenta y mi primer proyecto"}, {"tipo": "cierre", "puntos": ["Cuenta segura: usuario sin datos y contraseña secreta.", "Escenario: centro (0, 0), x horizontal, y vertical.", "Evento: «al presionar tecla» pone en marcha un programa."], "siguiente": "El gato dibuja un cuadrado y la bailarina choca.", "pregunta": "¿Qué coordenadas tiene la esquina de arriba a la derecha?"}]}, "moodle": [{"recurso": "Tarea", "nombre": "2.2 · Mi cuenta y mi primer proyecto", "uso": "Verificar que cada estudiante tiene una cuenta segura, sabe compartir y su personaje se mueve con las flechas.", "correccion": "apto", "criterio": "CYR.2.6.2", "cotejo": ["Se entrega el enlace al proyecto «Práctica 1» compartido", "El proyecto está en el estudio de la clase", "El nombre de usuario, la descripción y los comentarios no tienen datos personales", "El personaje se mueve con las 4 flechas"], "config": ["Tipo de entrega: texto en línea (enlace)", "Calificación: escala Apto / No apto"], "calificable": true, "codigo": "2.2"}]}, {"n": 6, "fase": "Desarrollo", "titulo": "Primeros proyectos: el gato en coordenadas y la bailarina", "reto": "Programar un recorrido exacto con coordenadas y una bailarina que reacciona al chocar.", "actividades": [{"nombre": "Ir o deslizar", "min": 8, "desc": "Con el fondo «Xy-grid», el docente compara «ir a x: y:» (salto instantáneo) y «deslizar en 1 segundos a x: y:» (movimiento visible). El alumnado lo prueba y responde: ¿cuál es la diferencia entre ir y deslizar? Se cambia un disfraz con el editor (orejas puntiagudas)."}, {"nombre": "Problema del gato en coordenadas", "min": 17, "desc": "Primero escriben el pseudocódigo (colocar, orientar hacia arriba, mover, orientar a la izquierda, mover…) y después programan que el gato recorra un cuadrado sobre el Xy-grid y vuelva al punto de partida (por ejemplo, de (0,0) a (0,100), (−100,100), (−100,0) y (0,0)). 🚀 Profundización: que el gato dibuje la inicial de su nombre o un rectángulo de 200 × 100 calculando antes todas las coordenadas en una tabla."}, {"nombre": "La bailarina", "min": 20, "desc": "Con el programa resuelto proyectado, programan una bailarina que se desplaza hacia el puntero del ratón cada vez que se pulsa espacio. Si toca el borde cambia de disfraz y dice «¡Cuidado!»; si toca a la princesa cambia de disfraz y saluda. Reducen el tamaño de la princesa. Atención: cada programa va en su objeto. 🚀 Profundización: la princesa salta a una posición aleatoria cada 2 segundos y una variable cuenta los saludos."}, {"nombre": "Evidencias", "min": 5, "desc": "Copian en su cuaderno de prácticas (plantilla en el anexo A4) el enlace, el pseudocódigo y las capturas del código de las dos prácticas, lo exportan a PDF y lo suben a la Tarea 2.3. Enlace A4: https://docs.google.com/document/d/1Bsju9D2ObOFgzrFKqAVxVq9jry2PMESmcCR9lqNSkh0/edit?usp=drive_link."}], "criterios": ["CYR.2.1.3", "CYR.2.2.1"], "saberes": ["CYR.2.A.1", "CYR.2.A.2", "CYR.2.A.3", "CYR.2.A.5"], "metodologia": ["Aprendizaje a partir de ejemplos resueltos", "Rutina «Pienso - Programo - Pruebo»"], "evidencias": ["Prácticas 2 (gato) y 3 (bailarina)", "Cuaderno de prácticas en PDF"], "recursos": ["Scratch", "Cuaderno A4 (Google Docs)", "Moodle Centros"], "dua": {"principios": ["Andamiaje", "Compromiso"], "medidas": "Programa base de la bailarina con los bloques mezclados para ordenar; reto extra: rectángulo o rombo con el gato y un tercer personaje con otra reacción."}, "ejercicios": ["Escribe el pseudocódigo y programa que el gato recorra un cuadrado y vuelva al inicio.", "Programa la bailarina que sigue al ratón al pulsar espacio y reacciona al tocar el borde y a la princesa.", "Explica la diferencia entre «ir a» y «deslizar».", "Profundización (opcional): que el gato dibuje la inicial de su nombre o un rectángulo de 200 × 100 calculando antes todas las coordenadas en una tabla / la princesa salta a una posición aleatoria cada 2 segundos y una variable cuenta los saludos."], "clase": {"pregunta": "¿Cómo le dices a un personaje exactamente a dónde ir?", "diapositivas": [{"tipo": "ejemplo", "icono": "🗺️", "titulo": "Quedar en el mapa del móvil", "situacion": "Para quedar con alguien le mandas tu **ubicación**: un punto exacto.", "explicacion": "En Scratch, cada punto del escenario tiene su ubicación: **(x, y)**. Con coordenadas el personaje va justo donde quieres."}, {"tipo": "comparar", "titulo": "¿Ir o deslizar?", "columnas": [{"titulo": "ir a x: y:", "icono": "⚡", "puntos": ["Aparece **de golpe** en el punto."]}, {"titulo": "deslizar en 1 s a x: y:", "icono": "🛝", "puntos": ["Se **ve el camino** hasta el punto."]}]}, {"tipo": "codigo", "titulo": "Pienso: el cuadrado en pseudocódigo", "codigo": "Colocar el gato en (0, 0)\nApuntar hacia arriba\nDeslizar a (0, 100)\nApuntar a la izquierda\nDeslizar a (-100, 100)\nApuntar hacia abajo\nDeslizar a (-100, 0)\nApuntar a la derecha\nDeslizar a (0, 0)", "explicacion": ["Fondo **Xy-grid** para ver las coordenadas."], "pregunta": "¿Cómo harías un rectángulo el doble de ancho?"}, {"tipo": "practica", "titulo": "Problema del gato en coordenadas", "tiempo": 17, "enunciado": "Programa que el gato recorra un **cuadrado** y vuelva al punto de partida. Guarda como «Práctica 2».", "pasos": ["Pienso: pseudocódigo en el cuaderno.", "Programo: «apuntar en dirección» y «deslizar».", "Pruebo: ¿vuelve exactamente a (0, 0)?", "🚀 **Profundización:** la **inicial de tu nombre** o un rectángulo de 200 × 100, con las coordenadas calculadas antes."]}, {"tipo": "codigo", "titulo": "Ejemplo resuelto: la bailarina", "codigo": "BAILARINA\nal presionar tecla [espacio]\n    apuntar hacia [puntero del ratón]\n    mover (20) pasos\n    si ¿tocando [borde]? entonces\n        siguiente disfraz\n        decir [¡Cuidado!] durante (1) segundos\n    si ¿tocando [Princesa]? entonces\n        siguiente disfraz\n        decir [¡Hola, princesa!] durante (2) segundos\n\nPRINCESA\nal hacer clic en 🏁\n    fijar tamaño al (50) %", "nota": "Cada programa va en su objeto: ¡cuidado al copiarlo! «¿tocando…?» es un sensor."}, {"tipo": "practica", "titulo": "La bailarina", "tiempo": 20, "enunciado": "Programa la bailarina y la princesa. Guarda como «Práctica 3».", "pasos": ["Se mueve hacia el ratón al pulsar espacio.", "Borde → cambia disfraz y avisa.", "Princesa → cambia disfraz y saluda.", "Extra: añade un tercer personaje con otra reacción.", "🚀 **Profundización:** la princesa salta a un sitio **aleatorio** cada 2 s y una **variable** cuenta los saludos."]}, {"tipo": "practica", "titulo": "Evidencias en el cuaderno", "tiempo": 5, "enunciado": "En tu cuaderno de prácticas (**anexo A4**): enlace, pseudocódigo y capturas de las prácticas 2 y 3. Exporta a PDF.", "entrega": "Tarea 2.3 · El gato en coordenadas y la bailarina", "enlace": "https://docs.google.com/document/d/1Bsju9D2ObOFgzrFKqAVxVq9jry2PMESmcCR9lqNSkh0/edit?usp=drive_link"}, {"tipo": "cierre", "puntos": ["Coordenadas: posición exacta (x, y).", "Primero pseudocódigo, luego bloques.", "Sensor «¿tocando…?» + «si» = el personaje reacciona."], "siguiente": "Bucles: repetir sin cansarse.", "pregunta": "¿Cuántas veces has repetido «apuntar + deslizar»? ¿Se podría hacer más corto?"}]}, "moodle": [{"recurso": "Tarea", "nombre": "2.3 · El gato en coordenadas y la bailarina", "uso": "Primera tarea evaluable: dos prácticas resueltas con su pseudocódigo y evidencias.", "correccion": "rubrica", "criterio": "CYR.2.1.3", "rubrica": [{"linea": "Pseudocódigo del cuadrado", "criterio": "CYR.2.1.3", "niveles": ["No hay pseudocódigo.", "Pseudocódigo incompleto o desordenado.", "Pseudocódigo con todos los pasos, con alguna imprecisión.", "Pseudocódigo ordenado y preciso.", "Pseudocódigo preciso y el programa lo sigue paso a paso."]}, {"linea": "Recorrido del gato con coordenadas", "criterio": "CYR.2.1.3", "niveles": ["El gato no se mueve o no hay programa.", "Se mueve pero no forma el cuadrado.", "Forma el cuadrado pero no vuelve al inicio o se orienta mal.", "Recorre el cuadrado y vuelve exactamente al punto de partida.", "Además resuelve otra figura (rectángulo o rombo) o explica ir/deslizar."]}, {"linea": "Bailarina: evento y movimiento", "criterio": "CYR.2.2.1", "niveles": ["No hay programa de la bailarina.", "La bailarina se mueve, pero no con el espacio o no hacia el ratón.", "Se mueve hacia el ratón al pulsar espacio con algún fallo.", "Se mueve correctamente y la princesa tiene el tamaño adecuado.", "Todo correcto y añade una mejora propia (tercer personaje, sonido)."]}, {"linea": "Bailarina: condicionales de choque", "criterio": "CYR.2.2.1", "niveles": ["No usa condicionales.", "Usa un condicional, pero no funciona.", "Reacciona a uno de los dos choques (borde o princesa).", "Reacciona a los dos choques con disfraz y mensaje.", "Reacciones correctas, programas en el objeto adecuado y bien ordenados."]}, {"linea": "Cuaderno de evidencias", "criterio": "CYR.2.2.1", "niveles": ["No se entrega.", "Faltan enlaces o capturas.", "Incluye enlaces y capturas de las dos prácticas.", "Completo y ordenado, con el pseudocódigo.", "Completo y explica qué falló y cómo lo corrigió."]}], "config": ["Tipo de entrega: archivo PDF + enlaces en texto en línea", "Método de calificación: Rúbrica"], "criterios_rubrica": ["CYR.2.1.3", "CYR.2.2.1"], "calificable": true, "codigo": "2.3"}]}, {"n": 7, "fase": "Desarrollo", "titulo": "Bucles I: animaciones y dibujos con el lápiz", "reto": "Usar «por siempre» y «repetir» para animar un personaje y dibujar figuras sin repetir bloques.", "actividades": [{"nombre": "¿Cuántas veces lo repito?", "min": 8, "desc": "Se recuerda el cuadrado de la sesión 6 (cuatro veces «apuntar + deslizar») y se buscan patrones repetidos en la vida diaria: el lavado de la lavadora, las vueltas a la pista, el estribillo de una canción. Se presentan «repetir (n)» y «por siempre»."}, {"nombre": "Animación con por siempre", "min": 12, "desc": "Programan un personaje con varios disfraces (por ejemplo, el murciélago o el pájaro) que alterna disfraces dentro de un «por siempre» con «esperar 0.2 segundos» para simular el vuelo o la caminata, y que rebota en los bordes."}, {"nombre": "Cuadrado con y sin bucle", "min": 15, "desc": "Añaden la extensión Lápiz y dibujan un cuadrado de dos formas: primero repitiendo 4 veces «mover 100, girar 90» y después con «repetir 4». Siguen las normas del lápiz: borrar todo, bajar el lápiz, dibujar y subir el lápiz. Comparan cuántos bloques ocupa cada versión."}, {"nombre": "Reto del triángulo", "min": 12, "desc": "Dibujan un triángulo equilátero con «repetir 3» y descubren el giro de 120°. Retos extra: reproducir un sonido en cada esquina del cuadrado (extensión Música) y cambiar de disfraz en cada esquina. 🚀 Profundización: dibujar una estrella de 5 puntas (girar 144°) y una espiral con una variable «lado» que aumenta 5 pasos en cada vuelta."}, {"nombre": "Guardar", "min": 3, "desc": "Guardan como «Práctica 4» (animación) y «Práctica 5» (dibujos) y anotan los enlaces en el cuaderno de prácticas."}], "criterios": ["CYR.2.1.3", "CYR.2.2.1"], "saberes": ["CYR.2.A.2", "CYR.2.A.4"], "metodologia": ["Aprendizaje a partir de ejemplos resueltos", "Rutina «Pienso - Programo - Pruebo»"], "evidencias": ["Prácticas 4 (animación) y 5 (cuadrado y triángulo)"], "recursos": ["Scratch", "Cuaderno A4"], "dua": {"principios": ["Andamiaje", "Compromiso"], "medidas": "Código «de emergencia» del cuadrado disponible tras 5 minutos de intento; retos de sonido y disfraz para quien avanza más rápido."}, "ejercicios": ["Anima un personaje alternando disfraces dentro de un bucle «por siempre».", "Dibuja un cuadrado sin bucle y con «repetir 4» y compara el número de bloques.", "Dibuja un triángulo equilátero: ¿cuántos grados gira en cada esquina?", "Profundización (opcional): dibujar una estrella de 5 puntas (girar 144°) y una espiral con una variable «lado» que aumenta 5 pasos en cada vuelta."], "clase": {"pregunta": "Si tuvieras que escribir «mover y girar» 100 veces, ¿qué harías?", "diapositivas": [{"tipo": "ejemplo", "icono": "🏃", "titulo": "Dar 4 vueltas a la pista", "situacion": "El profe de Educación Física no dice «corre, corre, corre, corre». Dice «**da 4 vueltas**».", "explicacion": "Eso es un **bucle**: repetir un bloque de acciones un número de veces (o para siempre)."}, {"tipo": "comparar", "titulo": "Dos bucles", "columnas": [{"titulo": "repetir (n)", "icono": "🔢", "puntos": ["Repite **n veces** y sigue.", "El cuadrado: repetir 4."]}, {"titulo": "por siempre", "icono": "♾️", "puntos": ["Repite **sin parar**.", "Animaciones y juegos."]}]}, {"tipo": "codigo", "titulo": "Animación: el murciélago vuela", "codigo": "al hacer clic en 🏁\n    por siempre\n        siguiente disfraz\n        mover (10) pasos\n        rebotar si toca un borde\n        esperar (0.2) segundos", "explicacion": ["El cambio de disfraz rápido crea la **ilusión de movimiento**."], "pregunta": "¿Qué pasa si quitas el «esperar»?"}, {"tipo": "practica", "titulo": "Animación con por siempre", "tiempo": 12, "enunciado": "Anima un personaje que **vuele o camine** y rebote en los bordes. Guarda como «Práctica 4»."}, {"tipo": "codigo", "titulo": "El cuadrado: sin bucle y con bucle", "codigo": "SIN BUCLE                 CON BUCLE\nborrar todo               borrar todo\nbajar lápiz               bajar lápiz\nmover (100) pasos         repetir (4)\ngirar ↻ (90) grados           mover (100) pasos\nmover (100) pasos             girar ↻ (90) grados\ngirar ↻ (90) grados       subir lápiz\nmover (100) pasos\ngirar ↻ (90) grados\nmover (100) pasos\ngirar ↻ (90) grados\nsubir lápiz", "nota": "Extensión Lápiz: botón azul de abajo a la izquierda. Borrar → bajar lápiz → dibujar → subir lápiz."}, {"tipo": "practica", "titulo": "Cuadrado y triángulo", "tiempo": 27, "enunciado": "Dibuja el cuadrado de las **dos formas** y después un **triángulo** con «repetir 3». Guarda como «Práctica 5».", "pasos": ["Cuadrado sin bucle y con bucle.", "Triángulo: ¿cuántos grados gira?", "Extra: sonido en cada esquina (extensión Música).", "Extra: cambia de disfraz en cada esquina.", "🚀 **Profundización:** **estrella** de 5 puntas (gira 144°) y **espiral** con una variable que crece."]}, {"tipo": "quiz", "pregunta": "Para dibujar un triángulo equilátero, en cada esquina el lápiz gira…", "opciones": ["60°", "90°", "120°"], "correcta": 2, "explicacion": "El lápiz da una vuelta completa (360°) en 3 giros: 360 ÷ 3 = **120°**."}, {"tipo": "cierre", "puntos": ["Bucle: repetir sin copiar bloques.", "«repetir (n)» para figuras; «por siempre» para animar.", "Giro de un polígono = 360 ÷ lados."], "siguiente": "Lluvia de residuos y el polígono de cualquier número de lados.", "pregunta": "¿Cuánto giraría el lápiz para un hexágono?"}]}, "moodle": []}, {"n": 8, "fase": "Desarrollo", "titulo": "Bucles II: lluvia de residuos y polígonos", "reto": "Hacer que caigan objetos sin parar desde posiciones aleatorias y generalizar el dibujo a un polígono de n lados.", "actividades": [{"nombre": "Lluvia de residuos", "min": 15, "desc": "Inspirados en «Lluvia de albóndigas», programan un objeto (una botella o una lata, a tamaño 50 %) que aparece arriba en una x aleatoria entre −220 y 220, cae con «por siempre: sumar −5 a y» y, al llegar abajo (y < −170), vuelve arriba en otra x aleatoria. Extra: cinco residuos a velocidades distintas que salen con 3 segundos de diferencia. 🚀 Profundización: la velocidad de caída aumenta un poco cada vez que el residuo vuelve arriba."}, {"nombre": "Pienso el polígono", "min": 8, "desc": "Se escribe juntos el pseudocódigo del polígono: borrar, colocar el lápiz, preguntar el número de lados, bajar el lápiz, repetir «lados» veces mover y girar, subir el lápiz. Se descubre la fórmula: ángulo = 360 / lados y pasos = 60 − lados (para que la figura quepa)."}, {"nombre": "Programo el polígono", "min": 17, "desc": "Programan el polígono con «preguntar» y la variable «respuesta». Extra con condicional: si el número de lados es mayor que 12 o menor que 3, el personaje dice «No puedo dibujar ese polígono» y no dibuja. 🚀 Profundización: un rosetón: repetir 12 veces el polígono girando 30° y cambiando el color del lápiz en cada vuelta."}, {"nombre": "Entrega", "min": 10, "desc": "Completan el cuaderno de prácticas (anexo A4) con las prácticas 4, 5, 6 (lluvia) y 7 (polígono): enlaces, pseudocódigo y capturas. Lo suben en PDF a la Tarea 2.4. Enlace A4: https://docs.google.com/document/d/1Bsju9D2ObOFgzrFKqAVxVq9jry2PMESmcCR9lqNSkh0/edit?usp=drive_link."}], "criterios": ["CYR.2.1.3", "CYR.2.2.1"], "saberes": ["CYR.2.A.3", "CYR.2.A.4", "CYR.2.A.5"], "metodologia": ["Aprendizaje a partir de ejemplos resueltos", "Rutina «Pienso - Programo - Pruebo»"], "evidencias": ["Prácticas 6 (lluvia de residuos) y 7 (polígono)", "Cuaderno de prácticas en PDF"], "recursos": ["Scratch", "Cuaderno A4", "Moodle Centros"], "dua": {"principios": ["Andamiaje", "Acción y Expresión"], "medidas": "Programa base del polígono con los bloques sin ordenar; la versión mínima es un polígono fijo de 5 o 6 lados con bucle, y la pregunta del número de lados es el paso siguiente."}, "ejercicios": ["Programa un residuo que cae sin parar desde una x aleatoria.", "Programa un polígono de n lados preguntando el número de lados (ángulo = 360 / lados).", "Extra: no dibujes si el número de lados es mayor que 12.", "Profundización (opcional): un rosetón: repetir 12 veces el polígono girando 30° y cambiando el color del lápiz en cada vuelta / la velocidad de caída aumenta un poco cada vez que el residuo vuelve arriba."], "clase": {"pregunta": "¿Cómo dibujarías con un solo programa un triángulo, un cuadrado o un decágono?", "diapositivas": [{"tipo": "ejemplo", "icono": "🍔", "titulo": "Lluvia de albóndigas", "situacion": "En la película, la máquina de Flint hace caer **comida del cielo** sin parar.", "explicacion": "Un objeto que cae y vuelve arriba es un **bucle por siempre**. Lo haremos con **residuos** que hay que recoger."}, {"tipo": "codigo", "titulo": "Ejemplo resuelto: el residuo que cae", "codigo": "al hacer clic en 🏁\n    fijar tamaño al (50) %\n    ir a x: (número aleatorio entre -220 y 220) y: (170)\n    por siempre\n        sumar (-5) a y\n        si (posición en y) < (-170) entonces\n            ir a x: (número aleatorio entre -220 y 220) y: (170)", "pregunta": "¿Cómo harías que cayera más rápido?", "nota": "«número aleatorio» hace que cada vez caiga en un sitio distinto."}, {"tipo": "practica", "titulo": "Lluvia de residuos", "tiempo": 15, "enunciado": "Programa un residuo que cae sin parar. Guarda como «Práctica 6».", "pasos": ["Elige una botella o una lata (tamaño 50 %).", "Cae con «por siempre».", "Vuelve arriba en otra x aleatoria.", "Extra: 5 residuos, velocidades distintas, salen cada 3 s.", "🚀 **Profundización:** la velocidad **aumenta** cada vez que el residuo vuelve arriba."]}, {"tipo": "codigo", "titulo": "Pienso: el polígono", "codigo": "borrar todo\nir a x: (0) y: (0)\npreguntar [¿Cuántos lados?] y esperar\nbajar lápiz\nrepetir (respuesta)\n    mover (60 - respuesta) pasos\n    girar ↻ (360 / respuesta) grados\nsubir lápiz", "nota": "ángulo = 360 / lados pasos = 60 − lados, para que quepa en el escenario. Un solo programa para cualquier polígono: eso es generalizar."}, {"tipo": "practica", "titulo": "Programo el polígono", "tiempo": 17, "enunciado": "Programa el polígono de n lados. Guarda como «Práctica 7».", "pasos": ["Prueba con 3, 4, 6 y 10 lados.", "Extra: si lados > 12 o < 3 → «No puedo dibujar ese polígono».", "🚀 **Profundización:** **rosetón**: repite 12 veces el polígono, gira 30° y cambia el color del lápiz."]}, {"tipo": "quiz", "pregunta": "Si el usuario escribe 8, ¿cuántos grados gira el lápiz en cada esquina?", "opciones": ["8°", "45°", "90°"], "correcta": 1, "explicacion": "360 ÷ 8 = **45°**."}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 10, "enunciado": "Cuaderno de prácticas con las prácticas **4, 5, 6 y 7**: enlaces, pseudocódigo y capturas. Exporta a PDF.", "entrega": "Tarea 2.4 · Bucles: dibujos, polígonos y lluvia de residuos"}, {"tipo": "cierre", "puntos": ["«por siempre» + aleatorio = objetos que no paran de caer.", "Un programa general sirve para muchos casos.", "Un «si» puede impedir datos imposibles."], "siguiente": "Condicionales: el juego de los componentes del ordenador.", "pregunta": "¿Qué pasa si alguien escribe 0 lados? ¿Por qué?"}]}, "moodle": [{"recurso": "Tarea", "nombre": "2.4 · Bucles: dibujos, polígonos y lluvia de residuos", "uso": "Tarea evaluable de bucles: dibujo con y sin bucle, triángulo, polígono generalizado y lluvia de residuos.", "correccion": "rubrica", "criterio": "CYR.2.1.3", "rubrica": [{"linea": "Cuadrado con y sin bucle", "criterio": "CYR.2.1.3", "niveles": ["No hay dibujo.", "Solo una de las dos versiones o el cuadrado no se cierra.", "Las dos versiones, con algún fallo del lápiz (no borra o no sube).", "Las dos versiones correctas y explica qué ventaja tiene el bucle.", "Correctas, explicadas y con sonido o disfraz en cada esquina."]}, {"linea": "Triángulo y ángulo de giro", "criterio": "CYR.2.1.3", "niveles": ["No hay triángulo.", "Intenta el triángulo pero gira un ángulo equivocado.", "Triángulo correcto sin bucle.", "Triángulo correcto con «repetir 3» y giro de 120°.",  duro, la tarjeta de sonido y la tarjeta wifi, y su función. Se recuerda la clasificación de la sesión 1: componentes internos, periféricos de entrada, salida y E/S, y software de base y de aplicación."}, {"nombre": "Juego «¿Reconoces el hardware?»", "min": 25, "desc": "Siguiendo el ejemplo resuelto, crean un juego: el personaje se mueve con las flechas por un fondo con imágenes de 4 componentes (placa base, disco duro, tarjeta de sonido, tarjeta wifi) y, cuando toca uno, dice qué es y para qué sirve, emite un sonido positivo y el componente se esconde. Primero escriben el pseudocódigo. Extra: añadir la CPU y la RAM. 🚀 Profundización: modo examen: al tocar un componente o periférico, el personaje pregunta «¿Interno, entrada, salida o E/S?» con «preguntar», comprueba la respuesta con un condicional y suma puntos si acierta."}, {"nombre": "Guardar", "min": 3, "desc": "Guardan como «Práctica 8» y anotan el enlace en el cuaderno."}], "criterios": ["CYR.2.1.3", "CYR.2.2.1", "CYR.2.5.1"], "saberes": ["CYR.2.A.4", "CYR.2.A.5", "CYR.2.F.3"], "metodologia": ["Aprendizaje a partir de ejemplos resueltos", "Rutina «Pienso - Programo - Pruebo»"], "evidencias": ["Práctica 8: juego de los componentes del hardware"], "recursos": ["Scratch", "Ordenador viejo para abrir", "Cuaderno A4"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Las definiciones de los componentes están escritas en la diapositiva para copiarlas; quien lo necesite empieza con 2 componentes y añade los demás después."}, "ejercicios": ["Escribe el pseudocódigo del juego de los componentes.", "Programa que el personaje explique cada componente al tocarlo y que este desaparezca.", "Explica la diferencia entre la memoria RAM y el disco duro.", "Añade al juego dos periféricos (uno de entrada y otro de salida) que digan de qué tipo son.", "Profundización (opcional): modo examen: al tocar un componente o periférico, el personaje pregunta «¿Interno, entrada, salida o E/S?» con «preguntar», comprueba la respuesta con un condicional y suma puntos si acierta."], "clase": {"pregunta": "¿Qué pasa dentro del ordenador cuando abres un juego?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔋", "titulo": "«Batería baja»", "situacion": "Cuando el móvil baja del 20 %, te avisa **solo**.", "explicacion": "Dentro hay una decisión: **si batería < 20 entonces avisar**. En los juegos, los condicionales deciden qué pasa cuando chocas o recoges algo."}, {"tipo": "codigo", "titulo": "El bloque «si… entonces… si no»", "codigo": "si ¿tocando [Placa base]? entonces\n    decir [...] durante (3) segundos\n    iniciar sonido [Win]\nsi no\n    (no hace nada)", "nota": "El sensor pregunta; el condicional decide. Va dentro de un «por siempre» para comprobar todo el rato."}, {"tipo": "infografia", "titulo": "Dentro del ordenador", "svg": "<svg viewBox=\"0 0 640 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Componentes del ordenador conectados a la placa base: CPU, memoria RAM, disco duro, tarjeta de sonido y tarjeta wifi\">\n<rect x=\"150\" y=\"60\" width=\"340\" height=\"150\" rx=\"12\" style=\"fill:var(--ok);fill-opacity:.15;stroke:var(--ok);stroke-width:3\"/>\n<text x=\"320\" y=\"200\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">Placa base: conecta todo</text>\n<rect x=\"175\" y=\"80\" width=\"110\" height=\"60\" rx=\"8\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:3\"/>\n<text x=\"230\" y=\"108\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">CPU</text>\n<text x=\"230\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px system-ui\">ejecuta</text>\n<rect x=\"300\" y=\"80\" width=\"80\" height=\"60\" rx=\"8\" style=\"fill:var(--accent-soft);stroke:var(--accent);stroke-width:3\"/>\n<text x=\"340\" y=\"108\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">RAM</text>\n<text x=\"340\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px system-ui\">trabaja</text>\n<rect x=\"395\" y=\"80\" width=\"80\" height=\"60\" rx=\"8\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:3\"/>\n<text x=\"435\" y=\"108\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 15px system-ui\">Disco</text>\n<text x=\"435\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px system-ui\">guarda</text>\n<rect x=\"10\" y=\"90\" width=\"120\" height=\"50\" rx=\"8\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n<text x=\"70\" y=\"120\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 14px system-ui\">🔊 T. de sonido</text>\n<rect x=\"510\" y=\"90\" width=\"120\" height=\"50\" rx=\"8\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n<text x=\"570\" y=\"120\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 14px system-ui\">📶 T. wifi</text>\n<path d=\"M130 115 L150 115 M490 115 L510 115\" style=\"stroke:var(--ink);stroke-width:3\"/>\n<text x=\"320\" y=\"35\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 17px system-ui\">Hardware: lo que se puede tocar</text>\n</svg>"}, {"tipo": "infografia", "titulo": "¿Qué dice cada componente?", "elementos": [{"icono": "🟩", "titulo": "Placa base", "texto": "Circuito al que se **conectan** todos los componentes."}, {"icono": "💽", "titulo": "Disco duro", "texto": "**Guarda** los datos aunque apagues."}, {"icono": "🔊", "titulo": "Tarjeta de sonido", "texto": "Permite la **salida de audio**."}, {"icono": "📶", "titulo": "Tarjeta wifi", "texto": "Envía y recibe datos **sin cables**."}]}, {"tipo": "codigo", "titulo": "Pienso: pseudocódigo del juego", "codigo": "Al hacer clic en la bandera\n  Colocar el personaje en (-200, -140)\n  Decir \"¿Reconoces estos componentes?\" 3 segundos\n  Decir \"Usa las flechas para moverte\" 2 segundos\n  Por siempre\n    Si toca Placa base entonces decir ...\n    Si toca Disco duro entonces decir ...\n    ...\n\nCada componente: si toca al personaje → sonido y esconder", "nota": "Mira el ejemplo resuelto del cuaderno de Scratch. Ajusta el tamaño de las imágenes."}, {"tipo": "practica", "titulo": "Juego «¿Reconoces el hardware?»", "tiempo": 25, "enunciado": "Crea el juego con **4 componentes**. Guarda como «Práctica 8».", "pasos": ["Fondo e imágenes de los componentes (tamaño adecuado).", "Personaje con flechas.", "Al tocar: explica, suena y el componente se esconde.", "Extra: CPU y memoria RAM.", "🚀 **Profundización:** **modo examen**: «¿Interno, entrada, salida o E/S?» con «preguntar» y puntos si aciertas."]}, {"tipo": "quiz", "pregunta": "¿Qué componente guarda tus fotos aunque apagues el ordenador?", "opciones": ["La memoria RAM", "El disco duro", "La tarjeta wifi"], "correcta": 1, "explicacion": "El **disco duro** guarda los datos de forma permanente; la RAM se borra al apagar."}, {"tipo": "cierre", "puntos": ["Sensor + condicional = el juego reacciona.", "Hardware: placa base, CPU, RAM, disco, tarjetas.", "Programa = software que la CPU ejecuta."], "siguiente": "Las seis puertas de internet.", "pregunta": "¿Por qué el «si» va dentro de un «por siempre»?"}]}, "moodle": []}, {"n": 10, "fase": "Desarrollo", "titulo": "Las seis puertas de internet", "reto": "Investigar los servicios de internet y programar un juego en el que cada puerta abre la explicación de un servicio.", "actividades": [{"nombre": "¿Qué pasa al abrir una web?", "min": 12, "desc": "Con la infografía cliente-servidor, el docente explica cómo funciona un servidor web: el navegador hace una petición, el servidor busca el archivo y lo devuelve por internet. El alumnado pone ejemplos de servidores que usa (Scratch, YouTube, Moodle). Después, con Ctrl+U en una página sencilla (por ejemplo, example.com), localizan las etiquetas <html>, <head>, <title> y <body>: una web es texto con etiquetas. Se presentan los tres lenguajes de una página: HTML (estructura, el esqueleto), CSS (aspecto, la ropa) y JavaScript (comportamiento, los músculos)."}, {"nombre": "Investigamos los servicios", "min": 8, "desc": "Por parejas buscan una frase corta que defina cada servicio: WWW, correo electrónico, web social, grupos de noticias (foros), plataformas de streaming y comercio electrónico, y la escriben en su cuaderno con un ejemplo."}, {"nombre": "Programamos las puertas", "min": 22, "desc": "Individualmente diseñan un fondo con 6 puertas de colores distintos. El personaje se mueve con las flechas; si toca el color de una puerta, cambia a un fondo blanco con la explicación del servicio, espera 3 segundos y vuelve a las puertas. Usan el cuentagotas para elegir el color exacto en «¿tocando el color…?». Primero programan una puerta y después copian el patrón. 🚀 Profundización: una séptima puerta «¿Cómo se hace una web?» que explique HTML, CSS y JavaScript, o una pregunta de comprobación al salir de cada puerta con «preguntar» que suma puntos si se acierta."}, {"nombre": "Entrega", "min": 8, "desc": "Completan el cuaderno con las prácticas 8 (hardware) y 9 (puertas), con enlaces, pseudocódigo, capturas, las definiciones de los servicios y para qué sirven HTML, CSS y JavaScript, y lo suben en PDF a la Tarea 2.5."}], "criterios": ["CYR.2.2.1", "CYR.2.5.1"], "saberes": ["CYR.2.A.4", "CYR.2.A.5", "CYR.2.E.1", "CYR.2.E.2", "CYR.2.E.3"], "metodologia": ["Aprendizaje a partir de ejemplos resueltos", "Investigación guiada"], "evidencias": ["Práctica 9: las seis puertas de internet", "Cuaderno de prácticas en PDF"], "recursos": ["Scratch", "Navegador", "Cuaderno A4", "Moodle Centros"], "dua": {"principios": ["Andamiaje", "Acción y Expresión"], "medidas": "Fondo de las puertas ya dibujado disponible para quien lo necesite; versión mínima con 3 puertas; las definiciones se pueden grabar como sonido en lugar de texto."}, "ejercicios": ["Explica qué hace un servidor web cuando abres una página.", "Escribe una frase que defina cada uno de los seis servicios de internet.", "Programa el juego de las seis puertas con cambio de fondo.", "Señala el head y el body de una página web sencilla y explica con un ejemplo qué hacen HTML, CSS y JavaScript.", "Profundización (opcional): una séptima puerta «¿Cómo se hace una web?» que explique HTML, CSS y JavaScript, o una pregunta de comprobación al salir de cada puerta con «preguntar» que suma puntos si se acierta."], "clase": {"pregunta": "Cuando escribes scratch.mit.edu, ¿de dónde sale la página?", "diapositivas": [{"tipo": "ejemplo", "icono": "🍕", "titulo": "Pedir una pizza a domicilio", "situacion": "Haces el **pedido**, la pizzería lo prepara y un repartidor te lo **trae**.", "explicacion": "Con una web igual: tu navegador **pide** la página, el **servidor** la tiene guardada y te la envía por **internet**."}, {"tipo": "infografia", "titulo": "Navegador, servidor e internet", "svg": "<svg viewBox=\"0 0 640 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"El navegador pide una página web al servidor a través de internet y el servidor la devuelve\">\n<rect x=\"20\" y=\"60\" width=\"150\" height=\"90\" rx=\"12\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:3\"/>\n<text x=\"95\" y=\"100\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 17px system-ui\">💻 Tu navegador</text>\n<text x=\"95\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">(cliente)</text>\n<rect x=\"470\" y=\"60\" width=\"150\" height=\"90\" rx=\"12\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:3\"/>\n<text x=\"545\" y=\"100\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 17px system-ui\">🗄️ Servidor web</text>\n<text x=\"545\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">guarda las páginas</text>\n<path d=\"M180 85 L455 85\" style=\"stroke:var(--accent);stroke-width:4;fill:none\"/><path d=\"M445 75 L463 85 L445 95 Z\" style=\"fill:var(--accent)\"/>\n<path d=\"M460 130 L185 130\" style=\"stroke:var(--ok);stroke-width:4;fill:none\"/><path d=\"M195 120 L177 130 L195 140 Z\" style=\"fill:var(--ok)\"/>\n<text a escribe su propia definición con un ejemplo."}, {"tipo": "practica", "titulo": "Investigamos los servicios", "tiempo": 8, "enunciado": "Escribid en el cuaderno **una frase y un ejemplo** de cada servicio.", "agrupamiento": "Parejas"}, {"tipo": "codigo", "titulo": "Ejemplo resuelto: una puerta", "codigo": "PERSONAJE\nal hacer clic en 🏁\n    cambiar fondo a [Puertas]\n    ir a x: (0) y: (-140)\n    por siempre\n        si ¿tocando el color [🟥]? entonces\n            cambiar fondo a [WWW]\n            esconder\n            esperar (3) segundos\n            cambiar fondo a [Puertas]\n            ir a x: (0) y: (-140)\n            mostrar", "pregunta": "¿Por qué vuelve a (0, -140) antes de mostrarse?", "nota": "Elige el color con el cuentagotas. Haz una puerta, pruébala y copia el patrón para las demás."}, {"tipo": "practica", "titulo": "Programamos las puertas", "tiempo": 22, "enunciado": "Crea el juego de las **seis puertas**. Guarda como «Práctica 9».", "pasos": ["Fondo con 6 puertas de colores distintos.", "Un fondo blanco con texto para cada servicio.", "Personaje con flechas.", "Tocar puerta → fondo del servicio → vuelve.", "🚀 **Profundización:** 7.ª puerta **«¿Cómo se hace una web?»** (HTML, CSS, JS) o una **pregunta** al salir de cada puerta."]}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 8, "enunciado": "Cuaderno con las prácticas **8 y 9**, las definiciones y los **tres lenguajes de la web**. Exporta a PDF.", "entrega": "Tarea 2.5 · Hardware e internet en Scratch"}, {"tipo": "cierre", "puntos": ["Navegador **pide** → servidor **busca y envía** → internet transporta.", "Una web: **head** y **body**; HTML, CSS y JavaScript.", "Un patrón de código se copia y adapta."], "siguiente": "¿De quién es esta canción? Licencias y recursos libres.", "pregunta": "¿Qué servicio de internet usas más y de qué tipo es?"}]}, "moodle": [{"recurso": "Tarea", "nombre": "2.5 · Hardware e internet en Scratch", "uso": "Tarea evaluable: juego de los componentes del ordenador y juego de las seis puertas de internet.", "correccion": "rubrica", "criterio": "CYR.2.5.1", "rubrica": [{"linea": "Componentes del hardware", "criterio": "CYR.2.5.1", "niveles": ["No aparecen componentes.", "Aparecen componentes con explicaciones erróneas.", "Explica correctamente 2-3 componentes.", "Explica correctamente los 4 componentes.", "Explica 6 o más componentes, clasifica periféricos de entrada, salida y E/S y distingue software de base y de aplicación."]}, {"linea": "Servicios de internet y páginas web", "criterio": "CYR.2.5.1", "niveles": ["No hay definiciones.", "Definiciones copiadas sin sentido o erróneas.", "Define correctamente 3-4 servicios.", "Define los 6 servicios con un ejemplo y explica cómo responde un servidor web.", "Además identifica head y body en una página y explica qué hacen HTML, CSS y JavaScript."]}, {"linea": "Sensores y condicionales", "criterio": "CYR.2.2.1", "niveles": ["No usa condicionales.", "Los condicionales no funcionan o están fuera del bucle.", "Funcionan en uno de los dos juegos.", "Funcionan en los dos juegos (tocar objeto y tocar color).", "Funcionan y el programa está ordenado y sin bloques repetidos innecesarios."]}, {"linea": "Fondos y reacciones del juego", "criterio": "CYR.2.2.1", "niveles": ["El juego no responde.", "Solo funciona una puerta o un componente.", "Funcionan la mitad de las puertas o componentes.", "Funcionan todas: cambio de fondo, vuelta, sonido y esconder.", "Todo funciona y añade mejoras (instrucciones, sonidos distintos, contador)."]}], "config": ["Tipo de entrega: archivo PDF + enlaces en texto en línea", "Método de calificación: Rúbrica"], "criterios_rubrica": ["CYR.2.5.1", "CYR.2.2.1"], "calificable": true, "codigo": "2.5"}]}, {"n": 11, "fase": "Desarrollo", "titulo": "¿De quién es esta canción? Licencias y recursos libres", "reto": "Distinguir copyright, Creative Commons y dominio público, usar recursos libres en Scratch y citarlos correctamente.", "actividades": [{"nombre": "¿Puedo usar esta canción?", "min": 8, "desc": "Situación de partida: un creador de contenido usa una canción de moda en su vídeo y la plataforma le silencia el audio. ¿Por qué? Se debate brevemente quién es el dueño de una canción, una foto o un dibujo."}, {"nombre": "Copyright, CC y dominio público", "min": 10, "desc": "El docente explica las tres situaciones y los símbolos de Creative Commons: BY (cita al autor), SA (comparte igual), NC (no comercial), ND (sin cambios) y CC0. Se practica con 4 ejemplos: ¿puedo usarlo en mi juego? ¿qué tengo que hacer?"}, {"nombre": "Buscamos recursos libres", "min": 12, "desc": "Buscan en Freesound (filtro de licencia CC0) y en Openverse (imágenes con licencia CC) un sonido y una imagen para su proyecto, comprueban la licencia, los descargan y los importan en Scratch. Anotan cada recurso en la ficha de créditos y licencias (plantilla en el anexo A5). Enlace A5: https://docs.google.com/document/d/1T6K_RIvnTru43qVn5SLxBm4jnUlSQ3lL0F0aRoTy3pI/edit?usp=drive_link."}, {"nombre": "Las tres puertas de las licencias", "min": 15, "desc": "Reutilizando el juego de las puertas de la sesión 10, crean un juego con tres puertas (copyright, Creative Commons y dominio público): al tocar cada puerta aparece un fondo que explica la licencia, con un ejemplo y un sonido libre. Escriben los créditos en «Notas y créditos» del proyecto y una descripción sin datos personales. 🚀 Profundización: en la puerta de Creative Commons, un minijuego: el personaje pregunta «¿Puedo usar una imagen CC BY-NC en un juego que voy a vender?» y comprueba la respuesta con un condicional."}, {"nombre": "Compartir y entregar", "min": 5, "desc": "Comparten el proyecto en el estudio de la clase y suben a la Tarea 2.6 el enlace y la ficha de créditos en PDF (se termina en casa si hace falta)."}], "criterios": ["CYR.2.6.2", "CYR.2.6.3"], "saberes": ["CYR.2.I.4", "CYR.2.I.5"], "metodologia": ["Aprendizaje a partir de ejemplos resueltos", "Investigación guiada"], "evidencias": ["Práctica 10: las tres puertas de las licencias", "Ficha de créditos y licencias"], "recursos": ["Scratch", "Freesound y Openverse", "Ficha A5", "Moodle Centros"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Tarjeta con los símbolos CC y su significado en pictogramas; el alumnado elige los recursos según sus gustos (animales, deportes, música)."}, "ejercicios": ["Explica la diferencia entre copyright, Creative Commons y dominio público.", "Busca un sonido CC0 y una imagen CC, compruébalos y anótalos en la ficha de créditos.", "Programa el juego de las tres puertas de las licencias y escribe los créditos en Notas y créditos.", "Profundización (opcional): en la puerta de Creative Commons, un minijuego: el personaje pregunta «¿Puedo usar una imagen CC BY-NC en un juego que voy a vender?» y comprueba la respuesta con un condicional."], "clase": {"pregunta": "Si encuentras una canción en internet, ¿puedes ponerla en tu juego?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔇", "titulo": "El vídeo sin sonido", "situacion": "Un creador sube un vídeo con una canción de moda y la plataforma le **silencia el audio**.", "explicacion": "La canción tiene **copyright**: es de su autor y de su discográfica. Para usarla hace falta permiso. Que esté en internet **no significa que sea libre**."}, {"tipo": "comparar", "titulo": "Tres tipos de derechos", "columnas": [{"titulo": "Copyright ©", "icono": "🔒", "puntos": ["Todos los derechos reservados.", "Necesitas **permiso**."]}, {"titulo": "Creative Commons", "icono": "🤝", "puntos": ["El autor da **algunos permisos**.", "Cumple sus condiciones."]}, {"titulo": "Dominio público", "icono": "🌍", "puntos": ["Libre para todos.", "CC0 o autor fallecido hace más de 80 años."]}]}, {"tipo": "infografia", "titulo": "Los símbolos de Creative Commons", "elementos": [{"icono": "👤", "titulo": "BY", "texto": "**Cita** al autor."}, {"icono": "🔄", "titulo": "SA", "texto": "Comparte con la **misma licencia**."}, {"icono": "💶", "titulo": "NC", "texto": "**No** uso comercial."}, {"icono": "✋", "titulo": "ND", "texto": "**Sin cambios**."}]}, {"tipo": "quiz", "pregunta": "Encuentras una imagen con licencia CC BY-NC. ¿Puedes usarla en tu juego del instituto?", "opciones": ["No, nunca", "Sí, citando al autor porque no lo vendo", "Sí, y no hace falta citar"], "correcta": 1, "explicacion": "BY obliga a **citar** y NC prohíbe venderlo. Un juego de clase gratuito cumple las dos condiciones."}, {"tipo": "pasos", "titulo": "Buscar un recurso libre", "pasos": ["Freesound: busca en inglés («rain», «coin») y filtra por **CC0**.", "Openverse: busca la imagen y mira la **licencia**.", "Descarga e importa en Scratch.", "Anota autor, web y licencia en la **ficha A5**."], "progresivo": true}, {"tipo": "practica", "titulo": "Buscamos recursos libres", "tiempo": 12, "enunciado": "Busca **un sonido y una imagen** libres, impórtalos en Scratch y anótalos en la ficha de créditos (**anexo A5**).", "enlace": "https://docs.google.com/document/d/1T6K_RIvnTru43qVn5SLxBm4jnUlSQ3lL0F0aRoTy3pI/edit?usp=drive_link"}, {"tipo": "practica", "titulo": "Las tres puertas de las licencias", "tiempo": 20, "enunciado": "Adapta el juego de las puertas: **copyright, Creative Commons y dominio público**. Guarda como «Práctica 10».", "pasos": ["Cada puerta → fondo con explicación y un ejemplo.", "Usa tus recursos libres.", "Créditos en «Notas y créditos».", "Descripción sin datos personales y compártelo en el estudio.", "🚀 **Profundización:** minijuego en la puerta CC: **«¿Puedo usar una imagen CC BY-NC en un juego que vendo?»**"], "entrega": "Tarea 2.6 · Las puertas de las licencias y ficha de créditos"}, {"tipo": "cierre", "puntos": ["En internet ≠ libre.", "CC: cumple sus condiciones (casi siempre, **citar**).", "Publica sin datos personales y con créditos."], "siguiente": "Variables: puntos, tiempo y caza de bugs.", "pregunta": "¿Qué licencia elegirías para tu videojuego y por qué?"}]}, "moodle": [{"recurso": "Tarea", "nombre": "2.6 · Las puertas de las licencias y ficha de créditos", "uso": "Tarea evaluable: juego que explica las licencias con recursos libres, ficha de créditos y publicación segura.", "correccion": "rubrica", "criterio": "CYR.2.6.3", "rubrica": [{"linea": "Explicación de las tres licencias", "criterio": "CYR.2.6.3", "niveles": ["No explica las licencias.", "Las explicaciones son erróneas o están copiadas sin sentido.", "Explica correctamente dos de las tres.", "Explica las tres con un ejemplo de cada una.", "Explica las tres y los símbolos BY, SA, NC y ND."]}, {"linea": "Recursos multimedia libres", "criterio": "CYR.2.6.3", "niveles": ["Usa recursos con copyright o de origen desconocido.", "Usa algún recurso libre pero no comprueba la licencia.", "Usa un recurso libre con su licencia comprobada.", "Usa sonido e imagen libres con licencia comprobada.", "Usa varios recursos libres bien elegidos para cada puerta."]}, {"linea": "Ficha de créditos y atribución", "criterio": "CYR.2.6.3", "niveles": ["No hay créditos.", "Créditos incompletos (falta autor o licencia).", "Ficha completa, pero no aparece en Notas y créditos de Scratch.", "Ficha completa y créditos en Notas y créditos.", "Créditos impecables: autor, web, licencia y cambios realizados."]}, {"linea": "Publicación segura en Scratch", "criterio": "CYR.2.6.2", "niveles": ["No comparte el proyecto.", "Lo comparte con datos personales o fotos de personas.", "Lo comparte sin datos personales, pero sin instrucciones.", "Lo comparte en el estudio, sin datos personales y con instrucciones.", "Además revisa los comentarios y explica cómo protege su identidad en la plataforma."]}], "config": ["Tipo de entrega: enlace en texto en línea + ficha en PDF", "Método de calificación: Rúbrica"], "criterios_rubrica": ["CYR.2.6.3", "CYR.2.6.2"], "calificable": true, "codigo": "2.6"}]}, {"n": 12, "fase": "Desarrollo", "titulo": "Variables: puntos, tiempo y caza de bugs", "reto": "Añadir a un juego un marcador de puntos y una cuenta atrás que terminan la partida
