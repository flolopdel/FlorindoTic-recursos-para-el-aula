puntos si acierta.\nExplica qué hace un servidor web cuando abres una página.\nEscribe una frase que defina cada uno de los seis servicios de internet.\nPrograma el juego de las seis puertas con cambio de fondo.\nSeñala el head y el body de una página web sencilla y explica con un ejemplo qué hacen HTML, CSS y JavaScript.\nProfundización (opcional): una séptima puerta «¿Cómo se hace una web?» que explique HTML, CSS y JavaScript, o una pregunta de comprobación al salir de cada puerta con «preguntar» que suma puntos si se acierta.", "metodologias": "Aprendizaje a partir de ejemplos resueltos, Rutina «Pienso - Programo - Pruebo», Investigación guiada", "sesiones": [9, 10]}, {"titulo": "Licencias y créditos: las puertas de las licencias", "tipo": "Exploración", "abreviatura": "EXP2", "orden": "4", "tarea": "2.6 · Las puertas de las licencias y ficha de créditos", "descripcion": "Sesión 11 (50 min): ¿De quién es esta canción? Licencias y recursos libres\nReto: Distinguir copyright, Creative Commons y dominio público, usar recursos libres en Scratch y citarlos correctamente.\n- ¿Puedo usar esta canción? (8 min). Situación de partida: un creador de contenido usa una canción de moda en su vídeo y la plataforma le silencia el audio. ¿Por qué? Se debate brevemente quién es el dueño de una canción, una foto o un dibujo.\n- Copyright, CC y dominio público (10 min). El docente explica las tres situaciones y los símbolos de Creative Commons: BY (cita al autor), SA (comparte igual), NC (no comercial), ND (sin cambios) y CC0. Se practica con 4 ejemplos: ¿puedo usarlo en mi juego? ¿qué tengo que hacer?\n- Buscamos recursos libres (12 min). Buscan en Freesound (filtro de licencia CC0) y en Openverse (imágenes con licencia CC) un sonido y una imagen para su proyecto, comprueban la licencia, los descargan y los importan en Scratch. Anotan cada recurso en la ficha de créditos y licencias (plantilla en el anexo A5). Enlace A5: https://docs.google.com/document/d/1T6KRIvnTru43qVn5SLxBm4jnUlSQ3lL0F0aRoTy3pI/edit?usp=drivelink.\n- Las tres puertas de las licencias (15 min). Reutilizando el juego de las puertas de la sesión 10, crean un juego con tres puertas (copyright, Creative Commons y dominio público): al tocar cada puerta aparece un fondo que explica la licencia, con un ejemplo y un sonido libre. Escriben los créditos en «Notas y créditos» del proyecto y una descripción sin datos personales. 🚀 Profundización: en la puerta de Creative Commons, un minijuego: el personaje pregunta «¿Puedo usar una imagen CC BY-NC en un juego que voy a vender?» y comprueba la respuesta con un condicional.\n- Compartir y entregar (5 min). Comparten el proyecto en el estudio de la clase y suben a la Tarea 2.6 el enlace y la ficha de créditos en PDF (se termina en casa si hace falta).\n- Moodle Centros: Tarea «2.6 · Las puertas de las licencias y ficha de créditos» (evaluada con rúbrica 1-3-5-7-10). Tarea evaluable: juego que explica las licencias con recursos libres, ficha de créditos y publicación segura.\n- Evidencia: Práctica 10: las tres puertas de las licencias\n- Evidencia: Ficha de créditos y licencias", "temporalizacion": "1 sesión", "recursos": "Scratch, Freesound y Openverse, Ficha A5, Moodle Centros", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nCYR.2.6.3.Reconocer y comprender los derechos de los materiales alojados en Internet.\nCYR.2.6.2.Acceder a servicios de intercambio y publicación de información digital aplicando criterios de seguridad y uso responsable.", "ejercicios": "Explica la diferencia entre copyright, Creative Commons y dominio público.\nBusca un sonido CC0 y una imagen CC, compruébalos y anótalos en la ficha de créditos.\nPrograma el juego de las tres puertas de las licencias y escribe los créditos en Notas y créditos.\nProfundización (opcional): en la puerta de Creative Commons, un minijuego: el personaje pregunta «¿Puedo usar una imagen CC BY-NC en un juego que voy a vender?» y comprueba la respuesta con un condicional.", "metodologias": "Aprendizaje a partir de ejemplos resueltos, Investigación guiada", "sesiones": [11]}, {"titulo": "Marcador, tiempo y depuración", "tipo": "Ampliación", "abreviatura": "AMP1", "orden": "5", "tarea": "2.7 · Marcador, tiempo y depuración", "descripcion": "Sesión 12 (50 min): Variables: puntos, tiempo y caza de bugs\nReto: Añadir a un juego un marcador de puntos y una cuenta atrás que terminan la partida, y depurar los errores.\n- El dado virtual (8 min). El docente crea en directo un dado: variable «dado» con «número aleatorio entre 1 y 6» y el personaje dice el número. Se explica que una variable es una caja con nombre que guarda un dato que cambia.\n- Puntos (12 min). Cada estudiante elige uno de sus juegos (la lluvia de residuos, la bailarina o el de hardware) y crea la variable «Puntos»: se pone a 0 al pulsar la bandera y suma 1 cada vez que el personaje recoge un objeto correcto (con un cubo o papelera abajo en la lluvia de residuos).\n- Cuenta atrás (12 min). Crean la variable «Tiempo» que empieza en 30 y resta 1 cada segundo. El juego termina con «detener todo» y un mensaje cuando el tiempo llega a 0 o los puntos llegan a 10. 🚀 Profundización: añadir vidas (una variable que resta al tocar un residuo equivocado), niveles (cada 5 puntos sube la velocidad) o una variable «Récord» que guarda la mejor puntuación.\n- Taller de debugging (13 min). Juegan varias partidas seguidas para cazar bugs: la variable que no vuelve a 0 al pulsar la bandera, el tiempo que baja demasiado rápido, los puntos que suman muchas veces de golpe (falta esconder el objeto o esperar). Cada estudiante publica en el foro «Bugs y soluciones» un bug que encontró y cómo lo arregló.\n- Entrega (5 min). Añaden la práctica 11 al cuaderno (enlace, capturas de los programas con variables y el bug cazado) y suben el PDF a la Tarea 2.7.\n- Moodle Centros: Tarea «2.7 · Marcador, tiempo y depuración» (evaluada con rúbrica 1-3-5-7-10). Tarea evaluable: juego con variables de puntos y tiempo, fin de partida y bug documentado.\n- Moodle Centros: Foro «S12 · Bugs y soluciones». Registro colectivo de errores y soluciones que sirve de ayuda a toda la clase hasta el final del videojuego.\n- Evidencia: Práctica 11: juego con puntos y tiempo\n- Evidencia: Mensaje en el foro «Bugs y soluciones»", "temporalizacion": "1 sesión", "recursos": "Scratch, Cuaderno A4, Moodle Centros", "descriptores": "CC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nCYR.2.2.1.Conocer y resolver la variedad de problemas posibles, desarrollando un programa informático y generalizando las soluciones, tanto de forma individual como trabajando en equipo, colaborando y comunicándose de forma adecuada.\nCYR.2.1.3.Entender cómo funciona un programa informático, la manera de elaborarlo y sus principales componentes.", "ejercicios": "Crea la variable «Puntos» y haz que sume al recoger un objeto.\nCrea una cuenta atrás de 30 segundos que termine la partida.\nDescribe un bug que hayas encontrado y cómo lo corregiste.\nProfundización (opcional): añadir vidas (una variable que resta al tocar un residuo equivocado), niveles (cada 5 puntos sube la velocidad) o una variable «Récord» que guarda la mejor puntuación.", "metodologias": "Cultura maker y depuración, Rutina «Pienso - Programo - Pruebo»", "sesiones": [12]}, {"titulo": "Producto final: videojuego ODS y Feria de Videojuegos Sostenibles", "tipo": "Conclusión", "abreviatura": "CON1", "orden": "6", "tarea": "2.8 · Videojuego ODS y presentación en la Feria", "descripcion": "Sesión 13 (50 min): Videojuego ODS I: equipos, idea y diseño\nReto: Formar el equipo, elegir el ODS y diseñar la historia, los personajes y la mecánica del videojuego.\n- El encargo y la rúbrica (8 min). El docente recuerda el reto, enseña la rúbrica de la Tarea 2.8 (66 % videojuego, 33 % presentación) y la lista de verificación final. Forma parejas o tríos equilibrados a partir de la encuesta inicial y de las prácticas.\n- Contrato y roles (7 min). Cada equipo firma el contrato de equipo (ayuda mutua, cuentas seguras, resolver diferencias hablando) y reparte los roles de Programador/a, Diseñador/a-guionista y Tester/a-documentalista, que rotarán a mitad del proyecto. Todo en la plantilla «Contrato y diseño del videojuego ODS» (anexo A6). Enlace A6: https://docs.google.com/document/d/1Ob6ZnT8CSdbBEdJg0DEfjft2-c02muZ7iqPiWYYD-I/edit?usp=drivelink.\n- Elegimos el ODS y la idea (10 min). Con tarjetas de ideas (recoger residuos y clasificarlos, cerrar grifos que gotean, apagar luces, salvar abejas, historia de una botella que viaja al mar), el equipo elige el problema, el tipo de producto (juego o historia interactiva) y el mensaje que quiere dejar.\n- Guion del juego (15 min). Completan en la plantilla A6 la historia (inicio, objetivo, final), los personajes y objetos, los controles, qué da puntos, qué quita y cuándo termina la partida (puntos y tiempo). Diseñan las tres pantallas de interacción con el usuario: inicio (título y botón «Jugar»), instrucciones (controles y objetivo) y final (has ganado o se acabó el tiempo, con el mensaje del ODS). Dibujan un boceto del escenario. 🚀 Profundización: diseñar dos niveles de dificultad y qué cambia en cada uno.\n- Diagrama de la mecánica (10 min). Dibujan el diagrama de flujo de la mecánica principal (por ejemplo: ¿toca residuo correcto? → +1 punto; ¿toca residuo equivocado? → aviso; ¿tiempo = 0? → fin). El docente revisa cada diagrama antes de la siguiente sesión.\n- Evidencia: Contrato de equipo y diseño del videojuego (A6)\n- Evidencia: Diagrama de flujo de la mecánica\n\nSesión 14 (50 min): Videojuego ODS II: recursos libres y primeros programas\nReto: Reunir personajes, fondos y sonidos libres con sus créditos y programar el escenario y el protagonista.\n- Revisión del diseño (5 min). El docente devuelve los diagramas revisados con una sugerencia por equipo. Cada equipo anota en su plantilla el objetivo de la sesión.\n- Recursos libres (15 min). La persona diseñadora busca o dibuja en el editor de Scratch los personajes y fondos, y busca los sonidos en Freesound (CC0) y las imágenes en Openverse. Cada recurso se anota en la ficha de créditos y licencias del equipo (anexo A5). Se puede usar la biblioteca de Scratch, que también se cita. Enlace A5: https://docs.google.com/document/d/1T6KRIvnTru43qVn5SLxBm4jnUlSQ3lL0F0aRoTy3pI/edit?usp=drivelink.\n- Escenario y protagonista (25 min). La persona programadora crea el proyecto del equipo (compartido desde una de las cuentas), con la pantalla de inicio y un botón «Jugar» que, al hacer clic en él, envía el mensaje «empezar»: es el evento que pone en marcha el fondo del juego y el protagonista controlado por teclado. Quien hace de tester prueba cada cambio y anota los fallos. 🚀 Profundización: menú con dos botones (Jugar e Instrucciones) y pantalla final que aparece «al recibir [fin]».\n- Diario de avance (5 min). Cada equipo anota en la plantilla A6 qué ha conseguido, qué falta y quién lo hará en la próxima sesión. Guardan el proyecto.\n- Evidencia: Proyecto del equipo con escenario y protagonista\n- Evidencia: Ficha de créditos del equipo\n\nSesión 15 (50 min): Videojuego ODS III: mecánicas con bucles, condicionales y variables\nReto: Programar las mecánicas del juego: objetos con bucles, reacciones a los choques y marcador de puntos y tiempo.\n- Plan del día (5 min). Cada equipo lee su diario de avance y elige 3 objetivos para hoy. Rotan los roles: quien diseñaba programa y al revés.\n- Programamos las mecánicas (35 min). Programan los objetos que se mueven solos con «por siempre» (residuos que caen, gotas, nubes), las reacciones con «si ¿tocando…?» (recoger el objeto correcto suma y suena, el equivocado avisa) y las variables Puntos y Tiempo con fin de partida y mensaje final del ODS. Consultan sus prácticas anteriores y el foro «Bugs y soluciones». El docente pasa por los equipos con la lista de verificación. 🚀 Profundización: usar clones para que caigan muchos residuos con un solo objeto, añadir vidas o un segundo nivel más rápido.\n- Prueba relámpago (7 min). Un miembro de otro equipo juega 2 minutos sin ayuda y dice una cosa que funciona y una que no entiende.\n- Guardar y anotar (3 min). Guardan, anotan en el diario los bugs pendientes y comprueban que el proyecto está guardado en la cuenta del equipo.\n- Evidencia: Proyecto con mecánicas programadas\n- Evidencia: Diario de avance\n\nSesión 16 (50 min): Videojuego ODS IV: game testers, publicación y pitch\nReto: Probar los juegos entre equipos, corregir los errores, publicar en el estudio y preparar la presentación.\n- Game testers (15 min). Cada estudiante prueba los juegos de dos equipos (rotación indicada en la pizarra) y los valora con el formulario de game testers (Formulario F2): ¿se entiende el objetivo?, ¿funcionan los controles?, ¿hay algún bug?, ¿se entiende el mensaje del ODS?, una sugerencia.\n- Corregimos (12 min). Los equipos leen las valoraciones (el docente las proyecta por equipo) y corrigen los dos fallos más importantes.\n- Publicar en el estudio (8 min). Comparten el proyecto en el estudio de la clase con título, instrucciones y créditos completos en «Notas y créditos», sin datos personales. Revisan la lista de verificación final.\n- Preparamos el pitch (12 min). Con el guion del elevator pitch (plantilla en el anexo A7) preparan 2 minutos: el problema del ODS, cómo se juega, un bloque del que estén orgullosos y una dificultad superada. Hacen 3 diapositivas en Google Presentaciones (portada, ODS, cómo funciona por dentro) y reparten quién dice qué. Enlace A7: https://docs.google.com/document/d/1PWb8GZlQ79cTQISQ1n4QLPX-VPB6efSaWSgjnYka8w/edit?usp=drivelink. 🚀 Profundización: añadir una cuarta diapositiva que compare un fragmento del código con su diagrama de flujo o con cómo se escribiría en texto (Python).\n- Entrega (3 min). Una persona por equipo sube a la Tarea 2.8 el enlace del proyecto, el PDF con el diseño (A6), la ficha de créditos (A5) y la presentación. La nota de la Tarea se completa con la presentación en la Feria.\n- Moodle Centros: Tarea «2.8 · Videojuego ODS y presentación en la Feria» (evaluada con rúbrica 1-3-5-7-10). Tarea final en equipo: videojuego publicado con diseño y créditos (66 %) y presentación en la Feria de las sesiones 17 y 18 (33 %). La nota se completa en la sesión de la presentación.\n- Evidencia: Valoraciones de game testers\n- Evidencia: Proyecto publicado en el estudio\n- Evidencia: Guion del pitch y presentación\n\nSesión 17 (50 min): Feria de Videojuegos Sostenibles (I)\nReto: Presentar el videojuego con un elevator pitch y una demostración en directo, y jugar a los de los demás.\n- Montaje y normas (5 min). Cada equipo prepara su ordenador como «stand» con el juego abierto. Se recuerdan las normas: escuchar, preguntar con respeto y aplaudir. El docente tiene la rúbrica de la Tarea 2.8 para la observación.\n- Pitch y demostración (equipos 1-4) (30 min). Cada equipo presenta en 2 minutos con su presentación proyectada y hace una demostración en directo de 3 minutos; después hay 2 minutos de preguntas del público. El docente completa las líneas de presentación de la rúbrica.\n- Ronda de juego libre (10 min). El alumnado recorre los stands y juega a los videojuegos presentados, dejando un comentario respetuoso en el proyecto del estudio de Scratch.\n- Lo mejor de hoy (5 min). Puesta en común: ¿qué idea os ha gustado más de otro equipo? ¿Qué mejoraríais del vuestro tras verlos?\n- Evidencia: Observación del pitch y la demostración (rúbrica 2.8)\n- Evidencia: Comentarios en el estudio\n\nSesión 18 (50 min): Feria de Videojuegos Sostenibles (II) y metacognición\nReto: Terminar las presentaciones y reflexionar sobre lo aprendido con la diana de autoevaluación.\n- Pitch y demostración (equipos 5-7) (21 min). Los equipos que faltan presentan con la misma estructura (2 + 3 + 2 minutos). El docente completa la rúbrica de la Tarea 2.8.\n- Ronda de juego libre (9 min). Se juega a los videojuegos presentados hoy y se dejan comentarios en el estudio.\n- Diana de autoevaluación y KWL (12 min). Cada estudiante completa la diana de autoevaluación y la tabla KWL (qué sabía, qué quería saber, qué he aprendido) en el Formulario F3, con sus correos del centro.\n- Cierre y reconocimientos (8 min). El docente comparte el estudio con toda la clase, resume los aprendizajes (de pensar como un ordenador a crear un videojuego) y entrega reconocimientos simbólicos: mejor mensaje ODS, mejor depuración, mejor diseño y mejor trabajo en equipo, elegidos por votación a mano alzada.\n- Evidencia: Observación del pitch y la demostración (rúbrica 2.8)\n- Evidencia: Diana de autoevaluación y KWL", "temporalizacion": "6 sesiónes", "recursos": "Plantilla A6, Tarjetas de ideas ODS, Proyector, Scratch, Freesound y Openverse, Fichas A5 y A6, Foro de Moodle, Google Forms y Presentaciones, Plantilla A7, Moodle Centros, Ordenadores como stands, Rúbrica 2.8, Google Forms", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propio const S = DATA.sa, CUR = DATA.cur, IDX = DATA.idx;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':''); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

/* ---------- 2. secuenciación ---------- */
(function(){
  const COLORS = ['#0f766e','#1d4ed8','#7c3aed','#b45309','#be123c'];
  const fases = arr(S.fases);
  const total = S.sesiones.length;
  const fcol = {}; fases.forEach((f,i)=>fcol[f.nombre]=COLORS[i%COLORS.length]);
  const count = f => S.sesiones.filter(s=>s.fase===f.nombre).length;
  let h = `<div class="card"><h2>Distribución temporal</h2><div class="timeline">${fases.map(f=>`<div style="flex:${count(f)};background:${fcol[f.nombre]}">${esc(f.nombre)} · ${count(f)} ses.</div>`).join('')}</div>
    <div class="grid g2" style="margin-top:12px">${fases.map(f=>`<div><b style="color:${fcol[f.nombre]}">${esc(f.nombre)}</b> (sesiones ${esc(f.sesiones||'')}) — ${esc(f.finalidad||'')} · ${Math.round(count(f)/total*100)} %</div>`).join('')}</div></div>`;
  const duaSet = [...new Set(S.sesiones.flatMap(s=>arr(s.dua && s.dua.principios)))];
  h += `<div class="filters" id="ff"><span class="legend">Fase:</span><button class="on" data-f="*">Todas</button>${fases.map(f=>`<button data-f="${esc(f.nombre)}">${esc(f.nombre)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">DUA:</span>${duaSet.map(d=>`<button data-d="${esc(d)}">${esc(d)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">Moodle:</span><button data-m="1">Con actividad Moodle</button>
    <button data-open="1" style="margin-left:auto">Desplegar todas</button></div><div id="slist"></div>`;
  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){
    const list = S.sesiones.filter(s => (state.f==='*'||s.fase===state.f) && (!state.d || arr(s.dua&&s.dua.principios).includes(state.d)) && (!state.m || arr(s.moodle).length));
    $('#slist').innerHTML = list.map(s => `<details class="ses" data-n="${s.n}"><summary><div class="num" style="background:${fcol[s.fase]}22;color:${fcol[s.fase]}">${s.n}</div>
      <div><div class="stitle">Sesión ${s.n} · ${esc(s.titulo)} <span class="badge">${esc(s.fase)}</span>${arr(s.moodle).length?'<span class="badge" style="background:var(--moodle-bg);color:var(--moodle)">Moodle</span>':''}</div><div class="sreto">${esc(s.reto)}</div></div></summary>
      <div class="sbody"><div>${arr(s.actividades).map(a=>`<div class="act"><b>${esc(a.nombre)}</b><span class="min">${a.min?esc(a.min)+' min':''}</span><p>${esc(a.desc)}</p></div>`).join('')}
        ${arr(s.moodle).length?`<div class="moodle"><div class="mh">Integración con Moodle Centros</div>${arr(s.moodle).map(m=>`<div class="mitem"><div class="mt">${esc(m.recurso)} · «${esc(m.nombre)}»${corrBadge(m)}${m.criterio?' '+chip(m.criterio):''}</div><p>${esc(m.uso)}</p>${m.correccion==='apto'?`<div class="lab">Se verifica</div>${ul(m.cotejo)}`:''}${m.correccion==='rubrica'?`<p class="note">Se evalúa con la rúbrica de la pestaña «6. Evaluación».</p>`:''}${arr(m.config).length?`<div class="lab">Configuración</div>`+ul(m.config):''}</div>`).join('')}</div>`:''}
      </div><div class="side">
        <div class="lab">Criterios</div>${arr(s.criterios).length?chips(s.criterios):'<span class="note">Evaluación diagnóstica (no calificable)</span>'}
        <div class="lab">Saberes</div>${chips(s.saberes)}
        ${arr(s.metodologia).length?`<div class="lab">Metodología</div><p>${arr(s.metodologia).map(esc).join(' · ')}</p>`:''}
        ${arr(s.evidencias).length?`<div class="lab">Evidencias</div>${ul(s.evidencias)}`:''}
        ${arr(s.recursos).length?`<div class="lab">Recursos</div><p>${arr(s.recursos).map(esc).join(' · ')}</p>`:''}
        ${s.dua?`<div class="lab">DUA (${arr(s.dua.principios).map(esc).join(', ')})</div><p>${esc(s.dua.medidas)}</p>`:''}
      </div></div></details>`).join('') || '<p class="note">Ninguna sesión coincide con el filtro.</p>';
  }
  $('#ff').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.open){ openAll(); return; }
    if(b.dataset.f){ state.f=b.dataset.f; $('#ff').querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); }
    if(b.dataset.d){ state.d = state.d===b.dataset.d?null:b.dataset.d; $('#ff').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===state.d)); }
    if(b.dataset.m){ state.m=!state.m; b.classList.toggle('on',state.m); }
    render(); };
  render();
})();

  let h = `<div class="grid g2"><div class="card"><h2>Estructura del curso</h2>${Mo.estructura?`<p>${esc(Mo.estructura)}</p>`:''}${arr(Mo.secciones).map(sec=>`<div class="lab">${esc(sec.nombre)}</div>${ul(sec.elementos)}`).join('')}</div>
    <div class="card"><h2>Libro de calificaciones</h2>${Mo.calificaciones?`<p>${esc(Mo.calificaciones)}</p>`:''}
      <table class="tbl"><thead><tr><th>Criterio</th><th>Elementos calificables en Moodle</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${all.filter(m=>m.calificable && m.criterio===c).map(m=>`S${m.n} · ${esc(m.recurso)} «${esc(m.nombre)}»`).join('<br>') || '<span class="note">Se califica fuera de Moodle (observación, exposición…)</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(Mo.configuracion).length) h += `<div class="card" style="margin-top:16px"><h2>Configuración general recomendada</h2>${ul(Mo.configuracion)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Todas las actividades de Moodle</h2><div class="scroll"><table class="tbl"><thead><tr><th>Sesión</th><th>Recurso</th><th>Nombre</th><th>Corrección</th><th>Para qué</th><th>Configuración clave</th></tr></thead><tbody>${all.map(m=>`<tr><td>S${m.n}</td><td>${esc(m.recurso)}</td><td>${esc(m.nombre)}${m.criterio?' '+chip(m.criterio):''}</td><td>${corrBadge(m)||'—'}</td><td>${esc(m.uso)}</td><td>${ul(m.config)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#p-moodle').innerHTML = h;
})();

/* ---------- 5. DUA ---------- */
(function(){
  const D = S.dua || {};
  let h = `<div class="grid g2">${Object.entries(D).map(([k,v])=>`<div class="card"><h2>${esc(k)}</h2>${ul(v)}</div>`).join('')}</div>`;
  if(arr(S.diversidad).length) h += `<div class="card" style="margin-top:16px"><h2>Atención a la diversidad</h2><table class="tbl"><thead><tr><th>Perfil</th><th>Medidas concretas</th></tr></thead><tbody>${S.diversidad.map(d=>`<tr><td><b>${esc(d.perfil)}</b></td><td>${esc(d.medidas)}</td></tr>`).join('')}</tbody></table></div>`;
  if(arr(S.roles).length) h += `<div class="card" style="margin-top:16px"><h2>Roles del equipo</h2><table class="tbl"><tbody>${S.roles.map(r=>`<tr><td><b>${esc(r.rol)}</b></td><td>${esc(r.funcion)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#p-dua').innerHTML = h;
})();

/* ---------- 6. evaluación ---------- */
(function(){
  const E = S.evaluacion || {};
  let st = {}; try{ st = JSON.parse(localStorage.getItem('sda-cotejo-'+M.titulo)||'{}'); }catch(_){}
  let h = `<div class="card"><h2>Lista de cotejo interactiva</h2><p class="note">Marca los indicadores logrados; el progreso se calcula por criterio y se guarda en este navegador.</p>
    <div class="grid g2">${arr(E.cotejo).map((g,gi)=>`<div class="side"><span class="pct" data-p="${gi}"></span>${chip(g.criterio)}<div class="bar"><div data-b="${gi}"></div></div><ul class="cot" style="padding:0">${arr(g.indicadores).map((t,i)=>`<li><label><input type="checkbox" data-k="${gi}-${i}" ${st[gi+'-'+i]?'checked':''}> <span>${esc(t)}</span></label></li>`).join('')}</ul></div>`).join('')}</div>
    <button class="copy" id="cot-reset" style="margin-top:10px">Borrar marcas</button></div>`;
  const TR = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='rubrica').map(m=>({...m,n:x.n})));
  const TA = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='apto').map(m=>({...m,n:x.n})));
  const PTS = [1,3,5,7,10];
  if(TR.length) h += `<div class="card" style="margin-top:16px"><h2>Rúbricas de las tareas finales</h2><p class="note">Cada línea se puntúa con 1, 3, 5, 7 o 10 puntos y la nota es la media (ponderada cuando la línea indica su peso). Pulsa una casilla para calcular la nota de un estudiante (no se guarda).</p>${TR.map((m,ti)=>`<h3>${tname(m)} ${chips([...new Set(arr(m.rubrica).map(l=>l.criterio||m.criterio))])} <span class="pct" data-rn="${ti}"></span></h3><div class="scroll"><table class="tbl rub" data-t="${ti}"><thead><tr><th>Línea</th>${PTS.map(p=>`<th>${p} pto</th>`).join('')}</tr></thead><tbody>${arr(m.rubrica).map((l,li)=>`<tr><td><b>${esc(l.linea)}</b>${l.criterio?`<br><small>${esc(l.criterio)}</small>`:''}${l.peso?`<br><small>peso ${String(l.peso).replace('.',',')} %</small>`:''}</td>${arr(l.niveles).map((x,k)=>`<td class="rc" data-l="${li}" data-w="${l.peso||1}" data-c="${esc(l.criterio||m.criterio||'')}" data-p="${PTS[k]}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
  if(TA.length) h += `<div class="card" style="margin-top:16px"><h2>Tareas de verificación (Apto / No apto)</h2><p class="note">Es Apto si se cumplen todos los elementos.</p><div class="grid g2">${TA.map(m=>`<div class="side"><b>${tname(m)}</b> ${chip(m.criterio)}${ul(m.cotejo)}</div>`).join('')}</div></div>`;
  if(arr(E.rubrica).length){ const niv = E.niveles || ['Insuficiente (1-4)','Suficiente / Bien (5-6)','Notable (7-8)','Sobresaliente (9-10)'];
    h += `<div class="card" style="margin-top:16px"><h2>Rúbrica</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${niv.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${E.rubrica.map(r=>`<tr><td>${chip(r.criterio)}</td>${arr(r.niveles).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; }
  if(E.agentes) h += `<div class="card" style="margin-top:16px"><h2>Agentes e instrumentos</h2>${Object.entries(E.agentes).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;
  $('#p-eval').innerHTML = h;
  const sel = {};
  $('#p-eval').addEventListener('click', e => { const c = e.target.closest('td.rc'); if(!c) return; const t = c.closest('table').dataset.t;
    c.parentElement.querySelectorAll('td.rc').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    sel[t] = sel[t]||{}; sel[t][c.dataset.l] = [+c.dataset.p, +c.dataset.w]; const v = Object.values(sel[t]); const nl = c.closest('tbody').rows.length;
    const wt = [...c.closest('tbody').rows].reduce((a,r)=>a+(+r.querySelector('td.rc').dataset.w),0);
    document.querySelector(`[data-rn="${t}"]`).textContent = `Nota: ${(v.reduce((a,[p,w])=>a+p*w,0)/wt).toFixed(1)}` + (()=>{ const rs=[...c.closest('tbody').rows].map(r=>r.querySelector('td.rc').dataset); const cs=[...new Set(rs.map(d=>d.c))]; if(cs.length<2) return ''; return ' · ' + cs.map(k=>{ const ws=rs.filter(d=>d.c===k).reduce((a,d)=>a+(+d.w),0); const pt=Object.entries(sel[t]).filter(([i])=>rs[i].c===k).reduce((a,[,x])=>a+x[0]*x[1],0); return k+': '+(pt/ws).toFixed(1); }).join(' · '); })() + (v.length<nl?` (faltan ${nl-v.length} líneas)`:''); });
  function upd(){ arr(E.cotejo).forEach((g,gi)=>{ const n = arr(g.indicadores).length; const k = arr(g.indicadores).filter((_,i)=>st[gi+'-'+i]).length; const p = n?Math.round(k/n*100):0;
    document.querySelector(`[data-b="${gi}"]`).style.width = p+'%'; document.querySelector(`[data-p="${gi}"]`).textContent = p+' %'; }); }
  function save(){ try{ localStorage.setItem('sda-cotejo-'+M.titulo, JSON.stringify(st)); }catch(_){} }
  $('#p-eval').addEventListener('change', e => { const k = e.target.dataset.k; if(k){ st[k]=e.target.checked; save(); upd(); } });
  $('#cot-reset').onclick = () => { st = {}; save(); document.querySelectorAll('#p-eval input[type=checkbox]').forEach(x=>x.checked=false); upd(); };
  upd();
})();

/* ---------- 7. Séneca ---------- */
(function(){
  const SE = DATA.seneca;
  const box = (t, txt) => `<div class="copybox"><div class="ch"><span>${esc(t)}</span><button class="copy">Copiar</button></div><pre>${esc(txt)}</pre></div>`;
  let h = `<div class="card"><h2>Textos listos para pegar en Séneca</h2><p class="note">Séneca guarda texto plano: estos bloques no llevan formato Markdown. Copia cada campo en su casilla del formulario de la situación de aprendizaje.</p>
    ${box('Título', SE.titulo)}${box('Temporalización', SE.temporalizacion)}${box('Justificación', SE.justificacion)}${box('Producto final', SE.producto_final)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Concreción curricular</h2><p class="note">En Séneca se marcan en las listas; aquí tienes la selección para comprobarla.</p>${SE.concrecion.map(m=>box(m.materia, m.texto)).join('')}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Actividades (formulario «Detalle de la actividad»)</h2><p class="note">Los campos siguen el orden del formulario de Séneca. Solo hay una actividad por cada Tarea de Moodle evaluada con rúbrica. En «Vinculación criterios de evaluación» elige la única trazabilidad indicada y pasa esos criterios a «seleccionados» (es obligatorio).</p>${SE.actividades.map(a=>`<h3>${esc(a.orden)}. ${esc(a.titulo)} <span class="badge">${esc(a.tipo)}</span> <span class="badge">${esc(a.abreviatura)}</span> <span class="badge">Tarea ${esc(a.tarea)}</span></h3>${box('Título de la actividad', a.titulo)}${box('Tipo de actividad', a.tipo)}${box('Abreviatura', a.abreviatura)}${box('Orden de la presentación', a.orden)}${box('Descripción', a.descripcion)}${box('Temporalización', a.temporalizacion)}${box('Recursos', a.recursos)}${box('Descriptores operativos', a.descriptores)}${box('Vinculación criterios de evaluación', a.vinculacion)}${box('Ejercicios', a.ejercicios)}${box('Metodologías', a.metodologias)}`).join('')}</div>`;
  $('#p-seneca').innerHTML = h;
})();
</script>
</body>
