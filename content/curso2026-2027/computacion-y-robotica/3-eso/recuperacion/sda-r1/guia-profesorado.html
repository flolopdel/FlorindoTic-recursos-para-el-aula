<script>
const DATA = {"sa": {"meta": {"titulo": "Proyecto de recuperación R1: Mi videojuego, del papel a la pantalla", "numero": "R1", "subtitulo": "«Game Designer»: un videojuego o una historia interactiva en Scratch, con su guion, su diagrama de flujo y su memoria", "curso_texto": "3.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Individual. Trabajo autónomo por hitos, con derecho a consultar dudas al docente (foro de dudas de Moodle o en persona)", "temporalizacion": "Recuperación de la materia pendiente. 6 hitos; el alumno reparte su tiempo como prefiera (orientativo: unas 3 semanas, equivalentes a 6 sesiones de 50 minutos)", "temporalizacion_seneca": "6 sesiones (trabajo autónomo organizado en 6 hitos)"}, "materias": [{"codigo": "CYR", "criterios": ["CYR.3.1.3", "CYR.3.2.1", "CYR.3.6.1", "CYR.3.6.2"], "saberes": ["CYR.3.A.1", "CYR.3.A.2", "CYR.3.A.3", "CYR.3.A.4", "CYR.3.A.5", "CYR.3.I.1", "CYR.3.I.2", "CYR.3.I.4"]}], "vision": {"descripcion": "Primero de los tres proyectos de recuperación de Computación y Robótica de 3.º ESO. El alumno diseña un videojuego o una historia interactiva: escribe el guion, dibuja el diagrama de flujo, lo programa en Scratch y lo publica de forma segura. Todo queda recogido en una memoria con el enlace del proyecto y un vídeo explicativo.", "contexto": "El alumno trabaja solo y fuera del horario de clase, con un ordenador como único recurso. Por eso el proyecto se organiza en hitos (no en sesiones de duración fija): cada hito tiene un objetivo claro, una guía paso a paso en la guía del alumno y, cuando toca, una entrega en Moodle. Puede preguntar dudas en el foro de la sección o al docente en persona. El juego se reutiliza en la app móvil del proyecto R2 y se publica en el portfolio web del proyecto R3.", "justificacion": "Los videojuegos son un contexto cercano que obliga a usar las estructuras básicas de programación (secuencias, bucles, condicionales anidados, variables, colisiones y mensajes), a planificar antes de programar (guion y diagrama de flujo) y a publicar contenido en una comunidad en línea con criterios de seguridad.", "reto": "«Un estudio de videojuegos independiente busca nuevos talentos. Para entrar, tengo que presentar un videojuego o una historia interactiva original hecho en Scratch, con su guion y su diagrama de flujo, publicado de forma segura. Lo entrego todo en una memoria con los enlaces.»", "pregunta_guia": "¿Cómo convierto una idea de juego en un programa que funciona y que otras personas pueden jugar sin riesgos?", "producto_final": "Memoria del proyecto (guion, storyboard, diagrama de flujo, tabla de pruebas y publicación segura) con el enlace del videojuego o historia interactiva publicado en Scratch y un vídeo de pantalla de unos 3 minutos explicando el código."}, "metodologias": [{"nombre": "Aprendizaje basado en proyectos (ABP)", "descripcion": "Un único producto final (juego + app + memoria) que se construye hito a hito."}, {"nombre": "Trabajo autónomo guiado", "descripcion": "Cada hito tiene una guía en la guía del alumno con ejemplos, pasos y una lista de comprobación antes de entregar."}, {"nombre": "Ciclo de diseño iterativo", "descripcion": "Planificar (guion y diagrama), programar, probar, corregir y volver a probar, registrando los errores en la tabla de pruebas."}, {"nombre": "Evaluación formativa", "descripcion": "La Tarea R1.1 (con rúbrica) revisa el guion y el diagrama antes de programar, para corregir el rumbo a tiempo."}], "recursos": ["Ordenador con navegador", "Scratch (scratch.mit.edu)", "diagrams.net o Dibujos de Google", "Google Docs del centro", "Moodle Centros", "Guía del alumno del proyecto"], "fases": [{"nombre": "Inicio", "sesiones": "1-2", "finalidad": "Cuenta segura, idea del juego y guion"}, {"nombre": "Desarrollo", "sesiones": "3-5", "finalidad": "Diagrama de flujo, programación en Scratch y publicación segura"}, {"nombre": "Cierre", "sesiones": "6", "finalidad": "Memoria final, vídeo explicativo y autoevaluación"}], "sesiones": [{"n": 1, "fase": "Inicio", "titulo": "Cuenta segura e idea del juego", "reto": "Crear (o revisar) tu cuenta de Scratch sin datos personales y elegir la idea de tu videojuego o historia interactiva. Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Leer el reto", "desc": "El alumno lee en la guía del alumno el reto, el calendario de entregas y cómo se evalúa (rúbricas de las Tareas R1.1 y R1.2). Apunta en el foro de dudas cualquier pregunta inicial."}, {"nombre": "Cuenta segura", "desc": "Crea una cuenta de Scratch (o revisa la que ya tiene) siguiendo la ficha A1: nombre de usuario que no revela su nombre real, edad, centro ni localidad; contraseña larga tipo frase (p. ej. «3Gatos-Comen-Pizza!») que no usa en otros sitios; correo del centro; perfil sin foto real. Comprueba también que su navegador está actualizado y que no instala extensiones o «Scratch hackeados» de páginas desconocidas."}, {"nombre": "Jugar y analizar", "desc": "Juega a dos proyectos de la comunidad de Scratch (uno de juego y otro de historia interactiva) y pulsa «Ver dentro»: anota qué controles usan, qué variables aparecen (puntos, vidas, tiempo) y cómo empieza y termina el juego."}, {"nombre": "Elegir la idea", "desc": "Elige el tipo de proyecto (juego de esquivar, plataformas sencillo, laberinto, quiz con historia, aventura con decisiones…) y lo describe en una frase en la ficha A1: «Un juego en el que [personaje] tiene que [objetivo] evitando [obstáculo]». (Plantilla en el anexo A1.)"}], "criterios": [], "saberes": ["CYR.3.I.1", "CYR.3.I.2"], "metodologia": ["Trabajo autónomo guiado", "Análisis de productos"], "evidencias": ["Ficha A1 completada (diagnóstica)"], "recursos": ["Scratch", "Ficha A1"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Libertad para elegir juego o historia interactiva y el tema; ejemplos de ideas por niveles de dificultad."}, "ejercicios": ["Crea o revisa tu cuenta de Scratch siguiendo la ficha de cuenta segura.", "Analiza dos proyectos de la comunidad de Scratch: controles, variables, inicio y final.", "Describe tu idea de juego en una frase."], "moodle": [{"recurso": "Foro", "nombre": "R1 · Dudas del proyecto", "uso": "Canal para que el alumno pregunte dudas en cualquier hito. El docente responde y puede proponer ayudas.", "config": ["Tipo: foro de uso general", "Suscripción forzosa para el alumno y el docente", "Visible solo para el alumno (restricción de acceso)"]}], "clase": {"pregunta": "¿Qué necesita un buen videojuego… y qué no debe contar nunca su creador en Internet?", "diapositivas": [{"tipo": "infografia", "titulo": "Tu camino en 6 hitos", "elementos": [{"icono": "🔐", "titulo": "H1 · Cuenta e idea", "texto": "Cuenta segura y tu idea en una frase"}, {"icono": "📝", "titulo": "H2 · Guion", "texto": "Personajes, reglas y storyboard"}, {"icono": "🔀", "titulo": "H3 · Diagrama", "texto": "Entrega **R1.1**"}, {"icono": "🎮", "titulo": "H4-H5 · Scratch", "texto": "Programar, probar y publicar"}, {"icono": "📦", "titulo": "H6 · Memoria", "texto": "Memoria y vídeo · **R1.2**"}], "nota": "Organiza tu tiempo como quieras, pero respeta el orden: cada hito usa lo que hiciste en el anterior."}, {"tipo": "ejemplo", "icono": "🕵️", "titulo": "¿Qué dice de ti tu nombre de usuario?", "situacion": "«LucasGarcia_Mijas2011» parece un nombre inocente…", "explicacion": "…pero revela **nombre, apellido, pueblo y año de nacimiento**. Un buen nombre de usuario no dice quién eres ni dónde vives: «PixelNinja_3141».", "pregunta": "¿Qué datos revela el tuyo?"}, {"tipo": "comparar", "titulo": "Contraseña débil vs. fuerte", "columnas": [{"titulo": "Débil", "icono": "❌", "puntos": ["123456 o tu nombre", "La misma en todas partes", "Compartida con amistades"]}, {"titulo": "Fuerte", "icono": "✅", "puntos": ["Frase larga: 3Gatos-Comen-Pizza!", "**Una distinta** para cada servicio", "Solo la sabes tú"]}]}, {"tipo": "practica", "titulo": "Crea o revisa tu cuenta de Scratch", "enunciado": "Completa la parte 1 de la **ficha A1** mientras creas o revisas tu cuenta.", "pasos": ["Entra en scratch.mit.edu → «Únete».", "Usuario sin nombre real, edad ni pueblo.", "Contraseña tipo frase y correo del centro.", "Perfil: sin foto real ni datos personales.", "Marca las casillas de la ficha A1."], "material": ["Ficha A1 · Cuenta segura e idea del juego"], "enlace": "https://docs.google.com/document/d/1xnjE82O7zftwXJcap0vg4bqbC-cw9xBjMLbsvKHC-C8/copy"}, {"tipo": "practica", "titulo": "Juega y mira por dentro", "enunciado": "Busca en Scratch un juego y una historia interactiva. Juega y después pulsa **«Ver dentro»**.", "pasos": ["¿Con qué teclas o clics se juega?", "¿Qué variables ves (puntos, vidas, tiempo)?", "¿Cómo empieza y cómo termina?", "Anótalo en la parte 2 de la ficha A1."]}, {"tipo": "ejemplo", "icono": "💡", "titulo": "Tu idea en una frase", "situacion": "«Un juego en el que **un gato astronauta** tiene que **recoger 10 estrellas** evitando **meteoritos**.»", "explicacion": "Personaje + objetivo + obstáculo. Si cabe en una frase, cabe en Scratch. Empieza **pequeño**: es mejor un juego corto que funciona que uno enorme a medias."}, {"tipo": "cierre", "puntos": ["Tu cuenta no revela quién eres.", "Has visto cómo se construyen otros juegos.", "Tienes tu idea en una frase."], "siguiente": "Hito 2: escribir el guion y el storyboard.", "pregunta": "¿Qué dudas tienes? Escríbelas en el foro «R1 · Dudas del proyecto»."}]}}, {"n": 2, "fase": "Inicio", "titulo": "El guion y el storyboard", "reto": "Escribir el guion completo del juego y dibujar un storyboard de 4 a 6 viñetas. Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Guion", "desc": "Completa en la memoria (plantilla A2, parte 1) el guion: título, género, sinopsis (3-4 líneas), personajes (objetos) con su función, escenarios (fondos), controles (teclas o ratón), reglas, variables que necesitará (puntos, vidas, tiempo, nivel) y condiciones de victoria y derrota. Ejemplo: «Si el gato toca un meteorito, pierde una vida; con 0 vidas aparece GAME OVER»."}, {"nombre": "Storyboard", "desc": "Dibuja (a mano y foto, o con Dibujos de Google) 4-6 viñetas: pantalla de inicio, instrucciones, momento de juego, cambio de nivel o de escena, victoria y derrota. Cada viñeta lleva una frase debajo."}, {"nombre": "Historia interactiva (opción)", "desc": "Si elige historia interactiva, el guion incluye al menos dos decisiones del jugador que llevan a finales distintos (árbol de decisiones)."}], "criterios": ["CYR.3.1.3"], "saberes": ["CYR.3.A.2", "CYR.3.A.5"], "metodologia": ["Trabajo autónomo guiado", "Pensamiento de diseño"], "evidencias": ["Guion y storyboard en la memoria"], "recursos": ["Plantilla A2 (memoria)", "Dibujos de Google"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Guion con preguntas guía; el storyboard puede dibujarse a mano o en digital."}, "ejercicios": ["Escribe el guion de tu juego: sinopsis, personajes, escenarios, controles, reglas, variables, victoria y derrota.", "Dibuja un storyboard de 4 a 6 viñetas."], "clase": {"pregunta": "¿Por qué los estudios de videojuegos escriben antes de programar?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎬", "titulo": "Las películas también tienen guion", "situacion": "Antes de rodar una escena, el equipo sabe quién aparece, qué pasa y cómo termina.", "explicacion": "En un juego es igual: el guion evita que programes cosas que luego no encajan. **Planificar ahorra tiempo.**"}, {"tipo": "infografia", "titulo": "Las 6 piezas de tu guion", "elementos": [{"icono": "🐱", "titulo": "Personajes", "texto": "Objetos de Scratch y su función"}, {"icono": "🏞️", "titulo": "Escenarios", "texto": "Fondos: inicio, juego, final"}, {"icono": "⌨️", "titulo": "Controles", "texto": "Flechas, espacio, clic…"}, {"icono": "📏", "titulo": "Reglas", "texto": "Qué pasa si toca, si coge…"}, {"icono": "🔢", "titulo": "Variables", "texto": "Puntos, vidas, tiempo"}, {"icono": "🏁", "titulo": "Final", "texto": "Cuándo ganas y cuándo pierdes"}]}, {"tipo": "ejemplo", "icono": "🚀", "titulo": "Una regla bien escrita", "situacion": "Mal: «Los meteoritos hacen daño».", "explicacion": "Bien: «Cada 2 segundos cae un meteorito desde un punto aleatorio arriba. **Si toca al gato**, vidas − 1 y suena un golpe. **Si vidas = 0**, se muestra GAME OVER». Una regla bien escrita casi se convierte sola en bloques."}, {"tipo": "practica", "titulo": "Escribe tu guion", "enunciado": "Rellena la **parte 1 de la memoria (plantilla A2)**. Escribe cada regla con la forma «si… entonces…».", "pasos": ["Sinopsis en 3-4 líneas.", "Tabla de personajes y escenarios.", "Controles y reglas «si… entonces…».", "Variables y condiciones de victoria y derrota."], "material": ["Plantilla A2 · Memoria del proyecto"], "enlace": "https://docs.google.com/document/d/1ELX431BHO0qKYlGvga7izkUNS3HTy6zcw2voYSyeeHU/copy"}, {"tipo": "practica", "titulo": "Dibuja tu storyboard", "enunciado": "De 4 a 6 viñetas: inicio, instrucciones, juego, cambio de nivel, victoria y derrota. Una frase debajo de cada una.", "pasos": ["A mano y una foto, o con Dibujos de Google.", "Pégalo en la parte 2 de la memoria."]}, {"tipo": "quiz", "pregunta": "¿Cuál de estas reglas está lista para programarse?", "opciones": ["El juego es divertido y difícil", "Si el gato toca una estrella, puntos + 1 y la estrella reaparece arriba", "Hay enemigos"], "correcta": 1, "explicacion": "Tiene una **condición** (toca una estrella) y unas **acciones** concretas (sumar, reaparecer)."}, {"tipo": "cierre", "puntos": ["El guion dice qué pasa y cuándo.", "Las reglas «si… entonces…» serán tus condicionales.", "El storyboard enseña cómo se verá."], "siguiente": "Hito 3: el diagrama de flujo y la primera entrega (R1.1)."}]}}, {"n": 3, "fase": "Desarrollo", "titulo": "El diagrama de flujo", "reto": "Dibujar el diagrama de flujo del bucle principal del juego y entregar el guion y el diagrama (Tarea R1.1). Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Símbolos", "desc": "Repasa en la guía del alumno los símbolos del diagrama de flujo: inicio/fin (óvalo), proceso (rectángulo), decisión (rombo) y entrada/salida (paralelogramo), con un ejemplo cotidiano (preparar un Cola Cao)."}, {"nombre": "Diagrama del juego", "desc": "Dibuja en diagrams.net (app.diagrams.net, guardando en Google Drive) o en Dibujos de Google el diagrama del bucle principal: inicio → poner variables a su valor inicial → repetir hasta que vidas = 0 o puntos = meta → leer controles → mover → ¿toca enemigo? (rombo) → ¿toca premio? (rombo) → final. Debe incluir al menos un bucle y dos decisiones, una de ellas anidada (p. ej. «si toca premio» → «si puntos = 10 → siguiente nivel»)."}, {"nombre": "Comprobar y entregar", "desc": "Recorre el diagrama con el dedo como si jugara una partida y comprueba que cada camino llega a un final. Exporta el diagrama como imagen, lo pega en la memoria (parte 3) y entrega el PDF de la memoria hasta aquí en la Tarea R1.1. (Plantilla en el anexo A2.)"}], "criterios": ["CYR.3.1.3", "CYR.3.6.2"], "saberes": ["CYR.3.A.3", "CYR.3.A.4"], "metodologia": ["Pensamiento computacional", "Evaluación formativa"], "evidencias": ["Diagrama de flujo", "Tarea R1.1 (rúbrica)"], "recursos": ["diagrams.net", "Plantilla A2 (memoria)"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Diagrama de ejemplo parcialmente completado para copiar la estructura; posibilidad de dibujarlo a mano y fotografiarlo."}, "ejercicios": ["Dibuja el diagrama de flujo del bucle principal de tu juego con al menos un bucle y dos decisiones (una anidada).", "Recorre el diagrama simulando una partida y corrige los caminos sin final."], "moodle": [{"recurso": "Tarea", "nombre": "R1.1 · Guion y diagrama de flujo", "uso": "Evaluar que la planificación está completa antes de programar. El docente devuelve comentarios para corregir el rumbo.", "correccion": "rubrica", "criterio": "CYR.3.1.3", "config": ["Archivos permitidos: .pdf", "Método de calificación: Rúbrica", "Comentarios de retroalimentación activados"], "rubrica": [{"linea": "Guion completo", "criterio": "CYR.3.1.3", "niveles": ["1 pto: no hay guion.", "3 ptos: guion con menos de la mitad de los apartados.", "5 ptos: guion completo, pero con reglas vagas («hay enemigos»).", "7 ptos: guion completo con la mayoría de reglas en forma «si… entonces…».", "10 ptos: guion completo, con todas las reglas «si… entonces…», variables con valor inicial y condiciones de victoria y derrota claras."]}, {"linea": "Storyboard", "criterio": "CYR.3.1.3", "niveles": ["1 pto: no hay storyboard.", "3 ptos: 1-2 viñetas sin explicación.", "5 ptos: 3 viñetas o viñetas sin frase.", "7 ptos: 4-6 viñetas con frase, falta alguna pantalla clave (inicio, juego o final).", "10 ptos: 4-6 viñetas con frase que muestran inicio, instrucciones, juego, cambio de nivel, victoria y derrota."]}, {"linea": "Diagrama: símbolos y estructura", "criterio": "CYR.3.1.3", "niveles": ["1 pto: no hay diagrama.", "3 ptos: diagrama sin símbolos correctos o sin decisiones.", "5 ptos: símbolos correctos con un bucle o una decisión, pero no ambos.", "7 ptos: símbolos correctos, un bucle y dos decisiones, sin decisión anidada.", "10 ptos: símbolos correctos, un bucle y dos o más decisiones, una de ellas anidada."]}, {"linea": "Diagrama: lógica completa", "criterio": "CYR.3.1.3", "niveles": ["1 pto: el diagrama no se puede seguir.", "3 ptos: varios caminos sin final o flechas sin sentido.", "5 ptos: un camino sin final o sin relación con el guion.", "7 ptos: todos los caminos terminan; alguna regla del guion no aparece.", "10 ptos: todos los caminos llegan a un final y el diagrama recoge todas las reglas del guion."]}], "criterios_rubrica": ["CYR.3.1.3"], "calificable": true, "codigo": "R1.1"}], "clase": {"pregunta": "¿Cómo se dibuja una partida antes de que exista?", "diapositivas": [{"tipo": "ejemplo", "icono": "🗺️", "titulo": "El GPS también decide", "situacion": "Vas en coche y el GPS dice: «En 300 metros, gire a la derecha». Si te la saltas 140\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:14px\">leer teclas<\/text><\/svg>"}, {"tipo": "flujo", "titulo": "El bucle principal de un juego", "nodos": [{"texto": "Bandera verde: vidas = 3, puntos = 0", "tipo": "inicio"}, {"texto": "Leer teclas y mover", "tipo": "proceso"}, {"texto": "¿Toca meteorito? → vidas − 1", "tipo": "decision"}, {"texto": "¿Toca estrella? → puntos + 1 → ¿puntos = 10?", "tipo": "decision"}, {"texto": "¿vidas = 0? Si no, volver a «Leer teclas»", "tipo": "decision"}, {"texto": "GAME OVER o ¡VICTORIA!", "tipo": "fin"}], "pregunta": "¿Dónde está la decisión anidada?"}, {"tipo": "quiz", "pregunta": "En tu juego, «¿toca un meteorito?» se dibuja con…", "opciones": ["Un óvalo", "Un rectángulo", "Un rombo"], "correcta": 2, "explicacion": "Es una **pregunta con dos salidas** (sí / no): eso es una decisión, el rombo. En Scratch será un bloque «si»."}, {"tipo": "practica", "titulo": "Dibuja tu diagrama", "enunciado": "Usa **app.diagrams.net** (guarda en tu Drive) o Dibujos de Google. Copia la estructura del ejemplo y adáptala a **tus** reglas.", "pasos": ["Un óvalo de inicio con las variables iniciales.", "Un bucle que se repite hasta ganar o perder.", "Al menos dos rombos, uno dentro de otro.", "Óvalos de final para victoria y derrota."], "enlace": "https://docs.google.com/document/d/1ELX431BHO0qKYlGvga7izkUNS3HTy6zcw2voYSyeeHU/copy"}, {"tipo": "practica", "titulo": "Recorre y entrega", "enunciado": "Recorre el diagrama con el dedo como si jugaras. Si un camino no llega a un final, corrígelo. Exporta como imagen, pégalo en la memoria y entrega el PDF.", "entrega": "Tarea R1.1 · Guion y diagrama de flujo"}, {"tipo": "cierre", "puntos": ["Rombo = decisión = bloque «si».", "Flecha que vuelve atrás = bucle.", "Si el diagrama funciona, el programa será más fácil."], "siguiente": "Hito 4: programar el juego en Scratch.", "pregunta": "¿Qué parte de tu diagrama crees que será más difícil de programar?"}]}}, {"n": 4, "fase": "Desarrollo", "titulo": "Programar el juego en Scratch", "reto": "Convertir el guion y el diagrama en un programa que funciona, probándolo y anotando los errores. Tiempo orientativo: 2 sesiones.", "actividades": [{"nombre": "Versión mínima jugable", "desc": "Crea el proyecto en Scratch con los objetos y fondos del guion. Programa primero lo mínimo para jugar: movimiento del personaje con las teclas, un enemigo o premio que se mueve, y las variables (puntos, vidas). Prueba antes de seguir."}, {"nombre": "Estructuras obligatorias", "desc": "Completa el juego con: al menos un bucle «por siempre» o «repetir hasta», condicionales anidados («si toca estrella» → «si puntos = 10» → cambiar de nivel), variables que se reinician al pulsar la bandera, mensajes («enviar» y «al recibir») para cambiar de pantalla o de nivel, y una pantalla de inicio con instrucciones y otra de final. En una historia interactiva, las decisiones se programan con «preguntar» y «si respuesta = …»."}, {"nombre": "Tabla de pruebas", "desc": "Cada vez que algo falle, lo anota en la tabla de pruebas de la memoria (parte 4): qué esperaba, qué pasó y cómo lo arregló. Mínimo 4 filas. Ejemplo: «Las vidas no vuelven a 3 al reiniciar → faltaba fijar vidas a 3 al pulsar la bandera»."}, {"nombre": "Compararlo con el diagrama", "desc": "Marca en el diagrama de flujo qué bloque de Scratch corresponde a cada símbolo y, si el programa ha cambiado respecto al diagrama, actualiza el diagrama."}], "criterios": ["CYR.3.1.3", "CYR.3.2.1"], "saberes": ["CYR.3.A.2", "CYR.3.A.3", "CYR.3.A.4", "CYR.3.A.5"], "metodologia": ["Ciclo de diseño iterativo", "Aprender haciendo"], "evidencias": ["Proyecto de Scratch en desarrollo", "Tabla de pruebas"], "recursos": ["Scratch", "Plantilla A2 (memoria)"], "dua": {"principios": ["Andamiaje", "Compromiso"], "medidas": "Fragmentos de código comentados en la guía del alumno; retos extra opcionales (segundo nivel, cronómetro, récord) para quien quiera ampliar."}, "ejercicios": ["Programa el movimiento del personaje y las variables puntos y vidas.", "Programa un condicional anidado que cambie de nivel o de escena.", "Usa mensajes para pasar de la pantalla de inicio al juego y del juego al final.", "Registra al menos 4 errores y su solución en la tabla de pruebas."], "clase": {"pregunta": "¿Qué bloques de Scratch hay detrás de cada regla de tu guion?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎮", "titulo": "El mando de la consola", "situacion": "Pulsas la flecha y el personaje se mueve. Sueltas y se para.", "explicacion": "Detrás hay un **bucle** que pregunta muchas veces por segundo «¿está pulsada la flecha?». Eso es un «por siempre» con un «si» dentro."}, {"tipo": "codigo", "titulo": "Movimiento y variables", "codigo": "al hacer clic en la bandera\n  fijar vidas a 3\n  fijar puntos a 0\n  ir a x: 0 y: -140\n  por siempre\n    si ¿tecla flecha derecha presionada? entonces\n      sumar 5 a x\n    si ¿tecla flecha izquierda presionada? entonces\n      sumar -5 a x", "explicacion": ["Las variables **se reinician** al empezar.", "El bucle «por siempre» lee las teclas sin parar.", "Cada «si» es un rombo de tu diagrama."]}, {"tipo": "codigo", "titulo": "Condicional anidado: subir de nivel", "codigo": "por siempre\n  si ¿tocando Estrella? entonces\n    sumar 1 a puntos\n    enviar «nueva estrella»\n    si puntos = 10 entonces\n      enviar «nivel 2»", "explicacion": ["Un «si» **dentro** de otro «si».", "«enviar» avisa a otros objetos o al escenario.", "En el escenario: «al recibir nivel 2» → cambiar fondo."], "pregunta": "¿Qué pasaría si el segundo «si» estuviera fuera del primero?"}, {"tipo": "pasos", "titulo": "Orden de trabajo recomendado", "pasos": ["Personaje que se mueve.", "Un enemigo o premio que aparece.", "Variables puntos y vidas.", "Condiciones de victoria y derrota.", "Pantallas de inicio y final con mensajes.", "Mejoras: sonidos, segundo nivel, récord."], "progresivo": true}, {"tipo": "practica", "titulo": "Programa tu versión mínima", "enunciado": "Consigue que tu juego **se pueda jugar** de principio a fin, aunque sea sencillo. Después añade lo demás.", "pasos": ["Guarda a menudo (Archivo → Guardar ahora).", "Prueba cada cambio antes del siguiente.", "Anota cada error en la tabla de pruebas."]}, {"tipo": "ejemplo", "icono": "🐞", "titulo": "Errores típicos y su arreglo", "situacion": "Las vidas siguen en 0 al volver a jugar. El enemigo se queda pegado arriba. El juego no termina nunca.", "explicacion": "Falta **fijar vidas a 3** al empezar · falta **ir a** una posición nueva al reaparecer · falta un **«detener todo»** o un «repetir hasta». Depurar es parte del trabajo: anótalo."}, {"tipo": "practica", "titulo": "Tabla de pruebas", "enunciado": "Rellena al menos **4 filas** en la parte 4 de la memoria: qué esperaba · qué pasó · cómo lo arreglé.", "material": ["Plantilla A2 · Memoria del proyecto"], "enlace": "https://docs.google.com/document/d/1ELX431BHO0qKYlGvga7izkUNS3HTy6zcw2voYSyeeHU/copy"}, {"tipo": "cierre", "puntos": ["Bucle + «si» = el corazón de tu juego.", "Los mensajes conectan objetos y pantallas.", "Cada error anotado es una evidencia de aprendizaje."], "siguiente": "Hito 5: publicar el juego en la comunidad de Scratch de forma segura.", "pregunta": "¿Qué error te costó más arreglar?"}]}}, {"n": 5, "fase": "Desarrollo", "titulo": "Publicar con seguridad", "reto": "Compartir el juego en la comunidad de Scratch con instrucciones, créditos y sin datos personales, y relacionar los bloques con un lenguaje de texto. Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Revisión antes de publicar", "desc": "Revisa el proyecto con la lista de la memoria (parte 5): ningún dato personal en el título, las notas, los objetos ni los sonidos (ni su voz grabada con su nombre); imágenes y sonidos propios, de la biblioteca de Scratch o con licencia que permita reutilizarlos; nada ofensivo."}, {"nombre": "Compartir", "desc": "Pulsa «Compartir» y completa la página del proyecto: «Instrucciones» (cómo se juega) y «Notas y créditos» (de dónde salen los recursos que no son suyos y, si ha remezclado, a quién). Decide si desactiva los comentarios y explica por qué. Copia el enlace del proyecto en la memoria."}, {"nombre": "Conducta en la comunidad", "desc": "Escribe en la memoria tres normas que seguirá en la comunidad (no compartir datos ni quedar con desconocidos, denunciar con el botón «Informar» lo que sea ofensivo, no descargar «mods» de páginas externas) y qué haría si alguien le pide datos o le escribe mensajes que le incomodan (no responder, bloquear o informar y contárselo a un adulto)."}, {"nombre": "De bloques a texto", "desc": "Elige un fragmento de su programa (p. ej. el condicional anidado) y lo escribe en la memoria en pseudocódigo, con frases cortas en el orden en que se ejecutan (MIENTRAS…, SI… ENTONCES…, SUMAR…). Así conecta el lenguaje de bloques con un lenguaje escrito."}], "criterios": ["CYR.3.6.1", "CYR.3.6.2", "CYR.3.1.3"], "saberes": ["CYR.3.A.1", "CYR.3.I.1", "CYR.3.I.2", "CYR.3.I.4"], "metodologia": ["Trabajo autónomo guiado", "Ciudadanía digital"], "evidencias": ["Proyecto compartido en Scratch", "Parte 5 de la memoria (publicación segura y de bloques a texto)"], "recursos": ["Scratch", "Plantilla A2 (memoria)"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Ejemplos de bloques con su pseudocódigo; ejemplos de notas y créditos bien redactados."}, "ejercicios": ["Revisa que tu proyecto no contiene datos personales y comparte el proyecto con instrucciones y créditos.", "Escribe tres normas de conducta para la comunidad de Scratch.", "Traduce un fragmento de tu programa a pseudocódigo."], "clase": {"pregunta": "¿Qué cuenta tu proyecto de ti cuando lo publicas?", "diapositivas": [{"tipo": "ejemplo", "icono": "📸", "titulo": "La foto del uniforme", "situacion": "Un creador sube un vídeo de su juego en el que se ve su sudadera con el nombre del instituto.", "explicacion": "Sin querer ha dicho **dónde estudia**. Antes de publicar, revisa títulos, notas, imágenes y sonidos: **ningún dato personal**."}, {"tipo": "pasos", "titulo": "Lista antes de pulsar «Compartir»", "pasos": ["Sin nombre real, centro ni localidad.", "Sin mi voz diciendo mi nombre.", "Recursos propios, de la biblioteca o con licencia libre.", "Instrucciones claras.", "Créditos de lo que no es mío."], "progresivo": true}, {"tipo": "idea", "icono": "🧾", "titulo": "Lo que publicas en Scratch es CC BY-SA", "texto": "Todo proyecto compartido en Scratch se publica con licencia **Creative Commons BY-SA**: cualquiera puede remezclarlo **citándote**, y tú puedes remezclar otros **citando a su autor**.", "nota": "Las licencias se trabajan a fondo en la proyecto R3; aquí basta con citar bien en «Notas y créditos»."}, {"tipo": "practica", "titulo": "Comparte tu juego", "enunciado": "Pulsa **Compartir** y rellena «Instrucciones» y «Notas y créditos». Copia el enlace del proyecto en la memoria.", "pasos": ["Decide si dejas los comentarios activados y explica por qué.", "Prueba el enlace en una ventana de incógnito: ¿se puede jugar?"]}, {"tipo": "comparar", "titulo": "Si alguien en la comunidad…", "columnas": [{"titulo": "Te pide datos", "icono": "🙅", "puntos": ["No respondas", "Usa «Informar»", "Cuéntaselo a un adulto"]}, {"titulo": "Te ofrece un «mod» o descarga", "icono": "🦠", "puntos": ["Puede ser malware", "Usa solo scratch.mit.edu", "No instales nada"]}, {"titulo": "Te molesta o insulta", "icono": "🛡️", "puntos": ["No contestes", "Bloquea e informa", "Guarda una captura"]}]}, {"tipo": "codigo", "titulo": "De bloques a pseudocódigo", "codigo": "Bloques                               Pseudocódigo\npor siempre                           MIENTRAS el juego siga:\n  si ¿tocando Estrella? entonces        SI el gato toca una estrella ENTONCES\n    sumar 1 a puntos                      SUMAR 1 a puntos\n    si puntos = 10 entonces               SI puntos = 10 ENTONCES\n      enviar «nivel 2»                      PASAR al nivel 2", "explicacion": ["El pseudocódigo describe el programa **con palabras**.", "Respeta el orden y la sangría de los bloques.", "Es el paso previo a un lenguaje de texto como Python."]}, {"tipo": "practica", "titulo": "Completa la parte 5 de la memoria", "enunciado": "Pega el enlace, escribe tus tres normas de conducta y traduce un fragmento de tu programa a pseudocódigo.", "material": ["Plantilla A2 · Memoria del proyecto"], "enlace": "https://docs.google.com/document/d/1ELX431BHO0qKYlGvga7izkUNS3HTy6zcw2voYSyeeHU/copy"}, {"tipo": "cierre", "puntos": ["Publicar es una responsabilidad.", "Citar es obligatorio, también en Scratch.", "Los bloques y el texto dicen lo mismo con distinta forma."], "siguiente": "Hito 6: memoria final y vídeo (Tarea R1.2).", "pregunta": "¿Has activado o desactivado los comentarios? ¿Por qué?"}]}}, {"n": 6, "fase": "Cierre", "titulo": "Memoria final y vídeo explicativo", "reto": "Completar la memoria, grabar un vídeo de pantalla de unos 3 minutos explicando el código y entregar el producto final (Tarea R1.2). Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Completar la memoria", "desc": "Revisa todas las partes de la memoria (anexo A2): guion, storyboard, diagrama actualizado, tabla de pruebas, publicación segura, de bloques a texto y la autoevaluación final. Añade el enlace del juego en Scratch en la portada."}, {"nombre": "Vídeo de pantalla", "desc": "Graba un vídeo de unos 3 minutos con una herramienta de captura de pantalla (p. ej. la Barra de juegos de Windows, Win + G, o Screencastify) en el que juega una partida corta y explica con su voz un fragmento de su código de Scratch (un bucle con un condicional anidado) y cómo detecta una colisión entre personajes. Sin mostrar la cara ni decir su nombre completo. Lo sube a su Google Drive del centro con acceso para el docente y pega el enlace en la memoria."}, {"nombre": "Autoevaluación", "desc": "Se autoevalúa con las rúbricas de las Tareas R1.1 y R1.2 (parte 6 de la memoria) y completa la lista «Antes de entregar»."}, {"nombre": "Entregar", "desc": "Entrega el PDF de la memoria final en la Tarea R1.2 (con los enlaces del juego y del vídeo). (Plantilla en el anexo A2.)"}, {"nombre": "Defensa breve (opcional, a criterio del docente)", "desc": "Si el docente lo considera conveniente para comprobar la autoría y que el alumno domina lo que ha hecho, le cita a una conversación de 5-10 minutos: el alumno abre su proyecto, explica un fragmento elegido por el docente y hace un pequeño cambio en directo (p. ej. que el juego empiece con 5 vidas). Si el alumno no sabe explicar su propio trabajo, el docente puede pedirle que lo rehaga o ajustar las líneas de la rúbrica afectadas."}], "criterios": ["CYR.3.1.3", "CYR.3.2.1", "CYR.3.6.1", "CYR.3.6.2"], "saberes": ["CYR.3.A.3", "CYR.3.A.4"], "metodologia": ["Metacognición", "Evaluación formativa"], "evidencias": ["Memoria final", "Vídeo de pantalla", "Autoevaluación"], "recursos": ["Plantilla A2 (memoria)", "Grabador de pantalla", "Google Drive del centro"], "dua": {"principios": ["Acción y Expresión", "Compromiso"], "medidas": "El vídeo puede sustituirse por una explicación escrita con capturas si el alumno lo necesita (lo decide el docente)."}, "ejercicios": ["Completa todas las partes de la memoria y añade los enlaces del juego y del vídeo.", "Graba un vídeo de pantalla explicando un fragmento de tu código.", "Autoevalúate con las rúbricas de las Tareas R1.1 y R1.2."], "moodle": [{"recurso": "Tarea", "nombre": "R1.2 · Memoria final y videojuego publicado", "uso": "Evaluar el producto final: la memoria con guion y diagrama, el juego publicado en Scratch y el vídeo explicativo. Si el docente hace la defensa opcional, la usa para confirmar las notas.", "correccion": "rubrica", "criterio": "CYR.3.2.1", "rubrica": [{"linea": "Guion y diagrama de flujo coherentes con el programa", "criterio": "CYR.3.1.3", "niveles": ["1 pto: falta el guion o el diagrama.", "3 ptos: guion y diagrama incompletos y sin relación con el programa final.", "5 ptos: guion y diagrama completos, pero el programa no se parece al diagrama.", "7 ptos: guion y diagrama completos; el programa sigue el diagrama con pequeñas diferencias.", "10 ptos: guion, storyboard y diagrama actualizado coinciden con el programa y la memoria explica la correspondencia entre símbolos y bloques."]}, {"linea": "Estructuras de programación del juego", "criterio": "CYR.3.2.1", "niveles": ["1 pto: el proyecto no funciona o no es original.", "3 ptos: el juego funciona a medias y solo usa secuencias.", "5 ptos: usa bucles y condicionales, pero no condicionales anidados o las variables no se reinician.", "7 ptos: usa bucles, condicionales anidados, variables y mensajes con algún fallo.", "10 ptos: usa bucles, condicionales anidados, variables bien inicializadas y mensajes; el juego se puede jugar de principio a fin sin fallos."]}, {"linea": "Variables, lógica y mecánicas del juego", "criterio": "CYR.3.2.1", "niveles": ["1 pto: no utiliza variables ni detecta interacciones entre objetos.", "3 ptos: utiliza variables, pero no se inicializan al empezar (ej. vidas/puntos no vuelven a su valor inicial) o no cambian de valor.", "5 ptos: define variables para el juego (puntos, vidas, tiempo), pero la lógica de victoria/derrota o las colisiones fallan en ocasiones.", "7 ptos: variables bien inicializadas y actualizadas correctamente; las condiciones de fin de juego (Game Over / Victoria) funcionan bien la mayor parte del tiempo.", "10 ptos: control total de variables correctamente inicializadas (puntos, vidas, etc.), gestión impecable de colisiones/detectores y condiciones de victoria/derrota perfectamente integradas."]}, {"linea": "Pruebas, depuración y vídeo", "criterio": "CYR.3.2.1", "niveles": ["1 pto: no hay tabla de pruebas ni vídeo.", "3 ptos: tabla con 1-2 filas o vídeo que no explica el código.", "5 ptos: tabla con 4 filas o vídeo que explica el código de forma general.", "7 ptos: tabla con 4 filas y vídeo que explica un bucle y un condicional.", "10 ptos: tabla con 4 o más errores reales y su solución, y vídeo que explica con precisión el bucle, el condicional anidado y la detección de colisiones."]}, {"linea": "Cuenta y hábitos de protección", "criterio": "CYR.3.6.1", "niveles": ["1 pto: el proyecto muestra datos personales.", "3 ptos: hay algún dato personal (nombre real, centro) en el usuario o el proyecto.", "5 ptos: sin datos personales, pero la memoria no explica las medidas tomadas.", "7 ptos: sin datos personales y explica la contraseña y la configuración del perfil.", "10 ptos: sin datos personales; explica contraseña, perfil, normas de conducta y qué hacer ante peticiones de datos o malware."]}, {"linea": "Publicación segura en Scratch", "criterio": "CYR.3.6.2", "niveles": ["1 pto: el proyecto no está compartido.", "3 ptos: compartido sin instrucciones ni créditos.", "5 ptos: compartido con instrucciones o créditos, pero no ambos.", "7 ptos: compartido con instrucciones y créditos; el enlace funciona.", "10 ptos: compartido con instrucciones claras, créditos completos (incluidas remezclas), decisión razonada sobre los comentarios y enlace probado en incógnito."]}], "config": ["Archivos permitidos: .pdf", "Método de calificación: Rúbrica", "Fecha límite fijada por el docente"], "criterios_rubrica": ["CYR.3.1.3", "CYR.3.2.1", "CYR.3.6.1", "CYR.3.6.2"], "calificable": true, "codigo": "R1.2"}], "clase": {"pregunta": "¿Podrías explicarle tu juego a alguien que nunca ha programado?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎥", "titulo": "Los «devlogs» de los creadores", "situacion": "Muchos desarrolladores independientes publican vídeos cortos enseñando cómo programaron una parte de su juego.", "explicacion": "Explicar tu código demuestra que **lo entiendes**. Tu vídeo es tu «devlog»: 3 minutos, tu voz, tu pantalla y **sin tu cara ni tu nombre**."}, {"tipo": "pasos", "titulo": "Guion de tu vídeo (3 min)", "pasos": ["0:00 · Qué juego es y de qué va (sin tu nombre).", "0:30 · Juega una partida corta.", "1:15 · Explica un bucle con un condicional anidado.", "2:15 · Enseña cómo detecta tu juego una colisión.", "2:45 · Qué te costó más y cómo lo resolviste."]}, {"tipo": "practica", "titulo": "Graba y comparte el enlace", "enunciado": "Graba con **Win + G** (Barra de juegos) u otro grabador. Súbelo a tu Drive del centro, compártelo con el docente y pega el enlace en la memoria.", "pasos": ["Cierra pestañas con datos personales antes de grabar.", "Si te equivocas, no pasa nada: sigue explicando."]}, {"tipo": "practica", "titulo": "Autoevalúate y entrega", "enunciado": "Puntúate con las rúbricas de R1.1 y R1.2 en la parte 7 de la memoria, repasa la lista «Antes de entregar» y sube el PDF.", "entrega": "Tarea R1.2 · Memoria final y videojuego publicado", "material": ["Plantilla A2 · Memoria del proyecto"], "enlace": "https://docs.google.com/document/d/1ELX431BHO0qKYlGvga7izkUNS3HTy6zcw2voYSyeeHU/copy"}, {"tipo": "idea", "icono": "🗣️", "titulo": "Puede que haya una defensa breve", "texto": "Si el docente lo decide, te pedirá **5-10 minutos** para que expliques una parte de tu proyecto y hagas un pequeño cambio en directo.", "puntos": ["Abre tu proyecto y explica un fragmento.", "Haz un cambio sencillo (p. ej. empezar con 5 vidas).", "Si lo has hecho tú, no tienes que preparar nada más."]}, {"tipo": "cierre", "puntos": ["Has planificado, programado, probado y publicado.", "Tu juego tiene variables, colisiones y mensajes.", "Tu personaje volverá en la app del proyecto R2."], "siguiente": "Proyecto R2: el almacén automático en Tinkercad y la app de tu juego.", "pregunta": "¿Qué mejorarías si tuvieras una semana más?"}]}}], "dua": {"Compromiso": ["Libertad para elegir videojuego o historia interactiva y su temática.", "Hitos cortos con un objetivo claro y un calendario de entregas visible.", "Retos de ampliación opcionales (segundo nivel, récord, cronómetro)."], "Representación": ["Guía por hitos en la guía del alumno, legible en el móvil (modo estudio).", "Ejemplos cotidianos, diagramas y fragmentos de código comentados.", "Ejemplos de pseudocódigo junto a los bloques."], "Acción y Expresión": ["Storyboard y diagrama a mano o en digital.", "Explicación del código en vídeo o, si el docente lo autoriza, por escrito con capturas."], "Andamiaje": ["Plantilla de memoria con preguntas guía y lista «Antes de entregar».", "Foro de dudas con respuesta del docente.", "Tarea R1.1 con rúbrica antes de programar."]}, "diversidad": [{"perfil": "Alumno con dificultades de organización", "medidas": "El docente puede fijar fechas intermedias para cada hito y revisar el avance en el foro; lista de comprobación al final de cada hito."}, {"perfil": "Alumno con dificultades en programación", "medidas": "Se acepta un juego más sencillo (un nivel) siempre que use bucle, condicional anidado y variables; fragmentos de código de ejemplo en la guía del alumno."}], "evaluacion": {"instrumentos": {"CYR.3.1.3": ["Tarea R1.1 (rúbrica)", "Rúbrica de la Tarea R1.2"], "CYR.3.2.1": ["Rúbrica de la Tarea R1.2", "Vídeo de pantalla"], "CYR.3.6.1": ["Rúbrica de la Tarea R1.2", "Ficha A1"], "CYR.3.6.2": ["Rúbrica de la Tarea R1.2", "Página pública del proyecto en Scratch", "Rúbrica general R1.G (sin Tarea)"]}, "cotejo": [{"criterio": "CYR.3.1.3", "indicadores": ["Escribe un guion con reglas del tipo «si… entonces…»", "Dibuja un diagrama de flujo con símbolos correctos, un bucle y decisiones anidadas", "Relaciona cada símbolo del diagrama con los bloques del programa", "Traduce un fragmento de bloques a pseudocódigo"]}, {"criterio": "CYR.3.2.1", "indicadores": ["Usa bucles, condicionales anidados y variables inicializadas", "Inicializa variables y detecta colisiones entre objetos", "Usa mensajes para comunicar objetos y pantallas", "Registra errores y sus soluciones en la tabla de pruebas", "Explica su código en el vídeo"]}, {"criterio": "CYR.3.6.1", "indicadores": ["Su usuario y su perfil no contienen datos personales", "Usa una contraseña robusta y exclusiva", "Sabe qué hacer ante peticiones de datos o descargas sospechosas"]}, {"criterio": "CYR.3.6.2", "indicadores": ["Comparte el proyecto con instrucciones y créditos", "Revisa que no publica datos personales ni recursos sin permiso", "Razona la configuración de los comentarios", "Entrega en Moodle, en plazo y en la Tarea correcta", "Usa el formato y el nombre de archivo pedidos", "Incluye capturas de pantalla legibles y recortadas"]}], "agentes": {"Heteroevaluación": "El docente evalúa las Tareas R1.1 y R1.2 con sus rúbricas, igual que la Tarea R1.1. Puede realizar, si lo considera conveniente, una defensa breve (5-10 min) para comprobar la autoría y que el alumno domina lo que ha hecho. Al cerrar el proyecto aplica además la rúbrica general R1.G (uso de herramientas digitales, CYR.3.6.2), que no está asociada a ninguna Tarea.", "Autoevaluación": "El alumno se puntúa con las rúbricas en la parte 7 de la memoria antes de entregar; el docente compara y comenta las diferencias."}}, "moodle": {"estructura": "Una sección «Recuperación CYR 3.º · Proyecto R1 · Mi videojuego» en el curso de Computación y Robótica de 3.º (o en el curso de pendientes), visible solo para el alumno mediante una restricción de acceso por usuario o por un grupo «Recuperación CYR3».", "secciones": [{"nombre": "Recuperación · Proyecto R1", "elementos": ["Área de texto y medios con el reto, los hitos y el calendario (snippet de Moodle)", "Página «Cómo se evalúa» con las rúbricas de R1.1 y R1.2", "Foro «R1 · Dudas del proyecto»", "URL a la guía del alumno (guía por hitos)", "Tareas R1.1 y R1.2"]}], "calificaciones": "Una categoría por criterio (CYR.3.1.3, CYR.3.2.1, CYR.3.6.1, CYR.3.6.2). La nota de cada criterio sale de las líneas de rúbrica que lo evalúan (la web de la SdA la calcula al marcar la rúbrica) y es la que se traslada a Séneca. Además, el ítem manual R1.G recoge la rúbrica general de uso de herramientas digitales (CYR.3.6.2).", "configuracion": ["Restricción de acceso: solo el alumno de recuperación", "Finalización de actividad activada para ver el progreso por hitos", "Fechas de entrega orientativas por hito; fecha límite solo en R1.2", "Ítem de calificación manual «R1.G · Uso de herramientas digitales» en la categoría CYR.3.6.2 (rúbrica general, sin entrega)"], "area_texto": {"eventos": [{"sesion": 6, "texto": "Defensa breve del proyecto (opcional, si el docente la convoca)", "tipo": "Conversación con el docente"}], "nota_evaluacion": "Organizas tu tiempo como quieras, pero sigue el orden de los hitos. **Todas las Tareas** (R1.1 y R1.2) se puntúan con rúbrica (1, 3, 5, 7 o 10 por línea) y cuentan para la nota de su criterio; tienes las rúbricas en **«Cómo se evalúa»** y en tu guía en PDF. Dudas: en el foro de dudas de esta sección.", "ayuda": "Si en la comunidad de Scratch alguien te pide datos personales o te hace sentir incómodo, no respondas, usa «Informar» y cuéntaselo a un adulto. También puedes llamar al 017 (Ayuda en ciberseguridad de INCIBE, gratuito y confidencial).", "url_clase": "https://florindotic.es/content/curso2026-2027/computacion-y-robotica/3-eso/recuperacion/sda-r1/clase.html"}}, "seneca": {"justificacion": "Proyecto de recuperación de la materia pendiente, trabajado de forma autónoma por hitos. El alumno planifica (guion y diagrama de flujo), programa y publica de forma segura un videojuego en Scratch, con lo que evidencia los criterios de programación y ciberseguridad.", "actividades": [{"titulo": "Guion y diagrama de flujo", "tipo": "Estructuración", "abreviatura": "EST1", "tarea": "R1.1", "sesiones": [1, 2, 3], "trazabilidad": "RÚBRICA", "criterios": ["CYR.3.1.3"], "temporalizacion": "3 sesiones (trabajo autónomo)"}, {"titulo": "Videojuego publicado y memoria", "tipo": "Conclusión", "abreviatura": "CON1", "tarea": "R1.2", "sesiones": [4, 5, 6], "trazabilidad": "RÚBRICA", "criterios": ["CYR.3.1.3", "CYR.3.2.1", "CYR.3.6.1", "CYR.3.6.2"], "temporalizacion": "3 sesiones (trabajo autónomo)"}]}, "notas_rigor": ["Proyecto de recuperación: los hitos sustituyen a las sesiones de duración fija; la temporalización de Séneca se expresa en sesiones equivalentes (6).", "CYR.3.2.1 menciona el trabajo en equipo; al ser una recuperación individual, se evidencia la parte de resolver problemas desarrollando un programa y la comunicación (vídeo y foro de dudas).", "CYR.3.I.3 (malware y antimalware) se menciona al hablar de «mods» y descargas, pero se trabaja a fondo en la proyecto R3 (CYR.3.6.4).", "La rúbrica general R1.G (CYR.3.6.2) no pertenece a ninguna Tarea: valora el uso de Moodle y Google Drive en todo el proyecto y aparece al final de la guía del alumno.", "Los criterios de desarrollo móvil (CYR.3.2.2 y CYR.3.2.3) se evalúan en el proyecto R2, con la app del personaje de este juego."], "anexos": {"plantillas": [{"id": "A1", "titulo": "Cuenta segura e idea del juego", "sesiones": [1], "agrupamiento": "Individual", "herramienta": "Google Docs (copia propia) o papel", "docente": "Ficha diagnóstica del hito 1. No se entrega en una Tarea: el alumno la incorpora a la memoria o la enseña si hay defensa.", "instrucciones": "Completa esta ficha mientras creas o revisas tu cuenta de Scratch y analizas otros proyectos. **No escribas aquí tu contraseña.**", "bloques": [{"titulo": "Parte 1 · Mi cuenta es segura", "casillas": ["Mi nombre de usuario no contiene mi nombre real, mi edad, mi centro ni mi localidad.", "Mi contraseña es una frase larga con mayúsculas, números y símbolos.", "No uso esta contraseña en ningún otro sitio y no se la he dicho a nadie.", "He usado el correo del centro (@g.educaand.es).", "Mi perfil no tiene foto real ni datos personales en «Sobre mí».", "Solo uso scratch.mit.edu: no descargo «mods» ni versiones de otras páginas."]}, {"campos": ["Mi nombre de usuario (sin contraseña)", "¿Por qué no revela quién soy?"], "alto": 0.9}, {"titulo": "Parte 2 · Analizo dos proyectos de la comunidad", "tabla": {"columnas": ["", "Proyecto 1 (juego)", "Proyecto 2 (historia interactiva)"], "filas": [["Título y enlace"], ["Controles"], ["Variables que usa"], ["Cómo empieza"], ["Cómo termina"], ["Una idea que me inspira"]], "anchos": [3.8, 6.6, 6.6], "alto": 0.85}}, {"titulo": "Parte 3 · Mi idea en una frase", "texto": "Un juego (o historia) en el que **[personaje]** tiene que **[objetivo]** evitando **[obstáculo]**. Añade qué tipo de proyecto es (esquivar, plataformas, laberinto, quiz con historia, aventura con decisiones…) y por qué lo has elegido.", "lineas": 3}], "enlace": "https://docs.google.com/document/d/1xnjE82O7zftwXJcap0vg4bqbC-cw9xBjMLbsvKHC-C8/copy"}, {"id": "A2", "titulo": "Memoria del proyecto «Mi videojuego»", "sesiones": [2, 3, 4, 5, 6], "agrupamiento": "Individual", "herramienta": "Google Docs (copia propia)", "entrega": "las Tareas R1.1 (partes 1-3) y R1.2 (completa), en PDF", "docente": "Es el documento central del proyecto. La Tarea R1.1 recoge las partes 1-3 y la R1.2 la memoria completa con los enlaces.", "instrucciones": "Ve completando la memoria hito a hito. Escribe con tus palabras: en la defensa (si la hay) tendrás que explicarlo. **Portada:** título del juego, enlace del proyecto en Scratch, enlace del vídeo.", "bloques": [{"campos": ["Título del juego o historia", "Enlace del proyecto en Scratch", "Enlace del vídeo explicativo (Drive)"], "alto": 1}, {"titulo": "Parte 1 · Guion (hito 2)", "campos": ["Género", "Sinopsis (3-4 líneas)", "Controles (teclas o ratón)", "Condición de victoria", "Condición de derrota"], "alto": 1.1}, {"tabla": {"columnas": ["Personaje u objeto", "Qué hace en el juego", "Escenario donde aparece"], "filas": 4, "anchos": [5, 7, 5], "alto": 0.95}}, {"tabla": {"columnas": ["Regla: si…", "…entonces…"], "filas": [["Si el personaje toca un enemigo", "pierde una vida y suena un golpe"], [""], [""], [""]], "anchos": [8.5, 8.5], "alto": 0.85}}, {"tabla": {"columnas": ["Variable", "Valor inicial", "Cuándo cambia"], "filas": [["puntos", "0", "al tocar un premio"], ["vidas", "3", "al tocar un enemigo"], [""]], "anchos": [5, 4, 8], "alto": 0.9}}, {"titulo": "Parte 2 · Storyboard (hito 2)", "texto": "Pega aquí 4-6 viñetas (dibujo a mano fotografiado o Dibujos de Google): inicio, instrucciones, juego, cambio de nivel, victoria y derrota. Una frase debajo de cada viñeta.", "lineas": 5}, {"titulo": "Parte 3 · Diagrama de flujo (hitos 3 y 4)", "texto": "Pega el diagrama del bucle principal (diagrams.net o Dibujos de Google). Debe tener inicio, un bucle, al menos dos decisiones (una anidada) y finales de victoria y derrota.", "lineas": 7}, {"tabla": {"columnas": ["Símbolo del diagrama", "Bloque de Scratch que lo programa"], "filas": [["Rombo «¿toca estrella?»", "si ¿tocando Estrella? entonces"], [""], [""]], "anchos": [8.5, 8.5], "alto": 0.9}}, {"titulo": "Parte 4 · Tabla de pruebas (hito 4)", "tabla": {"columnas": ["Nº", "Qué esperaba", "Qué pasó", "Cómo lo arreglé"], "filas": [["1"], ["2"], ["3"], ["4"], ["5"]], "anchos": [1, 5.3, 5.3, 5.4], "alto": 0.95}}, {"titulo": "Parte 5 · Publicación segura y de bloques a pseudocódigo (hito 5)", "casillas": ["El título, las notas y los objetos no tienen datos personales.", "Las imágenes y sonidos son míos, de la biblioteca de Scratch o con licencia que permite reutilizarlos.", "He escrito «Instrucciones» y «Notas y créditos».", "He probado el enlace en una ventana de incógnito."]}, {"campos": ["Comentarios: ¿activados o desactivados? ¿Por qué?", "Mis tres normas de conducta en la comunidad", "Qué haría si alguien me pide datos o me ofrece una descarga"], "alto": 1.3}, {"tabla": {"columnas": ["Mi fragmento en bloques (captura o descripción)", "Pseudocódigo"], "filas": 1, "anchos": [8.5, 8.5], "alto": 3.85}}, {"titulo": "Parte 6 · Autoevaluación (hito 6)", "tabla": {"columnas": ["Línea de rúbrica", "Mi nota (1-3-5-7-10)", "Por qué"], "filas": [["R1.1 · Guion completo"], ["R1.1 · Storyboard"], ["R1.1 · Diagrama: símbolos y estructura"], ["R1.1 · Diagrama: lógica completa"], ["R1.2 · Guion y diagrama coherentes"], ["R1.2 · Estructuras de programación"], ["R1.2 · Variables, lógica y mecánicas"], ["R1.2 · Pruebas y vídeo"], ["R1.2 · Cuenta y hábitos de protección"], ["R1.2 · Publicación segura"]], "anchos": [6.5, 3, 7.5], "alto": 0.7}}, {"titulo": "Antes de entregar (Tarea R1.1)", "casillas": ["He incluido el guion completo con reglas «si… entonces…».", "He pegado un storyboard de 4 a 6 viñetas.", "Mi diagrama usa óvalo, rectángulo y rombo.", "Mi diagrama tiene un bucle y dos decisiones, una anidada.", "Todos los caminos de mi diagrama llegan a un final."]}, {"titulo": "Antes de entregar (Tarea R1.2)", "casillas": ["La portada tiene el enlace del juego y el del vídeo.", "Mi juego usa bucles, condicionales anidados, variables, colisiones y mensajes.", "La tabla de pruebas tiene al menos 4 errores reales.", "He completado la publicación segura y la parte de bloques a pseudocódigo.", "Me he autoevaluado con las rúbricas."]}], "enlace": "https://docs.google.com/document/d/1ELX431BHO0qKYlGvga7izkUNS3HTy6zcw2voYSyeeHU/copy"}]}, "rubrica_general": {"nombre": "R1.G · Uso de herramientas digitales", "criterio": "CYR.3.6.2", "uso": "Valora cómo el alumno usa Moodle en todo el proyecto: entregas en plazo y en su sitio, formatos y nombres de archivo pedidos (PDF…) y capturas de pantalla. No pertenece a ninguna Tarea: se aplica una vez, al cerrar el proyecto, sobre todas las entregas.", "rubrica": [{"linea": "Entregas en Moodle", "criterio": "CYR.3.6.2", "niveles": ["1 pto: no entrega en Moodle o entrega por otras vías.", "3 ptos: entrega menos de la mitad de las Tareas o fuera de la Tarea que corresponde.", "5 ptos: entrega todas las Tareas, pero varias fuera de plazo o con archivos que faltan.", "7 ptos: entrega todas las Tareas en su sitio; algún retraso o algún archivo olvidado que corrige.", "10 ptos: entrega todas las Tareas en su sitio, en plazo y con todos los archivos y enlaces pedidos."]}, {"linea": "Formatos y nombres de archivo", "criterio": "CYR.3.6.2", "niveles": ["1 pto: los archivos no se pueden abrir.", "3 ptos: la mayoría de entre tación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": ["CYR.3.2", "CYR.3.6"]}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": ["CYR.3.1"]}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": ["CYR.3.1", "CYR.3.2", "CYR.3.6"]}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": []}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["CYR.3.1", "CYR.3.6"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": []}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["CYR.3.2"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["CYR.3.1", "CYR.3.6"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": ["CYR.3.2", "CYR.3.6"]}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": ["CYR.3.1"]}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": []}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": ["CYR.3.2", "CYR.3.6"]}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": []}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": []}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": []}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": []}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": ["CYR.3.6"]}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": ["CYR.3.1"]}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": ["CYR.3.1"]}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["CYR.3.2"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": ["CYR.3.2"]}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": ["CYR.3.6"]}}, "idx": {"criterios": ["CYR.3.1.3", "CYR.3.2.1", "CYR.3.6.1", "CYR.3.6.2"], "competencias": ["CYR.3.1", "CYR.3.2", "CYR.3.6"], "saberes": ["CYR.3.A.1", "CYR.3.A.2", "CYR.3.A.3", "CYR.3.A.4", "CYR.3.A.5", "CYR.3.I.1", "CYR.3.I.2", "CYR.3.I.4"], "descriptores": ["CC3", "CC4", "CCEC3", "CCEC4", "CCL3", "CD1", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "CPSAA3", "STEM1", "STEM2", "STEM3"], "sesionesPorCriterio": {"CYR.3.1.3": [2, 3, 4, 5, 6], "CYR.3.6.2": [3, 5, 6], "CYR.3.2.1": [4, 6], "CYR.3.6.1": [5, 6]}, "porMateria": [{"codigo": "CYR", "criterios": ["CYR.3.1.3", "CYR.3.2.1", "CYR.3.6.1", "CYR.3.6.2"], "competencias": ["CYR.3.1", "CYR.3.2", "CYR.3.6"], "saberes": ["CYR.3.A.1", "CYR.3.A.2", "CYR.3.A.3", "CYR.3.A.4", "CYR.3.A.5", "CYR.3.I.1", "CYR.3.I.2", "CYR.3.I.4"], "descriptores": ["CC3", "CC4", "CCEC3", "CCEC4", "CCL3", "CD1", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "CPSAA3", "STEM1", "STEM2", "STEM3"]}], "materiasTxt": "Computación y Robótica"}, "seneca": {"titulo": "Proyecto de recuperación R1: Mi videojuego, del papel a la pantalla", "temporalizacion": "6 sesiones (trabajo autónomo organizado en 6 hitos)", "justificacion": "Proyecto de recuperación de la materia pendiente, trabajado de forma autónoma por hitos. El alumno planifica (guion y diagrama de flujo), programa y publica de forma segura un videojuego en Scratch, con lo que evidencia los criterios de programación y ciberseguridad.", "producto_final": "Memoria del proyecto (guion, storyboard, diagrama de flujo, tabla de pruebas y publicación segura) con el enlace del videojuego o historia interactiva publicado en Scratch y un vídeo de pantalla de unos 3 minutos explicando el código.", "concrecion": [{"materia": "Computación y Robótica", "texto": "COMPETENCIAS ESPECÍFICAS\nCYR.3.1.Comprender el impacto que la computación y la robótica tienen en nuestra sociedad y desarrollar el pensamiento computacional para realizar proyectos de construcción de sistemas digitales de forma sostenible.\nCYR.3.2.Producir programas informáticos, colaborando en un equipo de trabajo y creando aplicaciones sencillas, mediante lenguaje de bloques, utilizando las principales estructuras de un lenguaje de programación para solventar un problema determinado o exhibir un comportamiento deseado.\nCYR.3.6.Conocer y aplicar los principios de la ciberseguridad, adoptando hábitos y conductas de seguridad, para permitir la protección del individuo en su interacción en la red.\n\nCRITERIOS DE EVALUACIÓN\nCYR.3.1.3.Entender cómo funciona un programa informático, la manera de elaborarlo y sus principales componentes.\nCYR.3.2.1.Conocer y resolver la variedad de problemas posibles, desarrollando un programa informático y generalizando las soluciones, tanto de forma individual como trabajando en equipo, colaborando y comunicándose de forma adecuada.\nCYR.3.6.1.Adoptar conductas y hábitos que permitan la protección activa del individuo en su interacción en la red.\nCYR.3.6.2.Acceder a servicios de intercambio y publicación de información digital aplicando criterios de seguridad y uso responsable.\n\nSABERES BÁSICOS\nCYR.3.A.1.Conexión de los lenguajes de programación visuales con los lenguajes de programación textuales.\nCYR.3.A.2.Generación de programas con especificaciones básicas en lenguajes de bloques.\nCYR.3.A.3.Secuencia de instrucciones. Implementación de algoritmos.\nCYR.3.A.4.Bucles y condicionales anidadas básicas.\nCYR.3.A.5.Entornos de interacción con el usuario.\nCYR.3.I.1.Ciberseguridad: tipologías.\nCYR.3.I.2.Ciberseguridad: necesidad y concienciación.\nCYR.3.I.4.Interacción de plataformas virtuales: soluciones.\n\nDESCRIPTORES OPERATIVOS\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad."}], "actividades": [{"titulo": "Guion y diagrama de flujo", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "1", "tarea": "R1.1 · Guion y diagrama de flujo", "descripcion": "Hito 1: Cuenta segura e idea del juego\nReto: Crear (o revisar) tu cuenta de Scratch sin datos personales y elegir la idea de tu videojuego o historia interactiva. Tiempo orientativo: 1 sesión.\n- Leer el reto. El alumno lee en la guía del alumno el reto, el calendario de entregas y cómo se evalúa (rúbricas de las Tareas R1.1 y R1.2). Apunta en el foro de dudas cualquier pregunta inicial.\n- Cuenta segura. Crea una cuenta de Scratch (o revisa la que ya tiene) siguiendo la ficha A1: nombre de usuario que no revela su nombre real, edad, centro ni localidad; contraseña larga tipo frase (p. ej. «3Gatos-Comen-Pizza!») que no usa en otros sitios; correo del centro; perfil sin foto real. Comprueba también que su navegador está actualizado y que no instala extensiones o «Scratch hackeados» de páginas desconocidas.\n- Jugar y analizar. Juega a dos proyectos de la comunidad de Scratch (uno de juego y otro de historia interactiva) y pulsa «Ver dentro»: anota qué controles usan, qué variables aparecen (puntos, vidas, tiempo) y cómo empieza y termina el juego.\n- Elegir la idea. Elige el tipo de proyecto (juego de esquivar, plataformas sencillo, laberinto, quiz con historia, aventura con decisiones…) y lo describe en una frase en la ficha A1: «Un juego en el que [personaje] tiene que [objetivo] evitando [obstáculo]». (Plantilla en el anexo A1.)\n- Moodle Centros: Foro «R1 · Dudas del proyecto». Canal para que el alumno pregunte dudas en cualquier hito. El docente responde y puede proponer ayudas.\n- Evidencia: Ficha A1 completada (diagnóstica)\n\nHito 2: El guion y el storyboard\nReto: Escribir el guion completo del juego y dibujar un storyboard de 4 a 6 viñetas. Tiempo orientativo: 1 sesión.\n- Guion. Completa en la memoria (plantilla A2, parte 1) el guion: título, género, sinopsis (3-4 líneas), personajes (objetos) con su función, escenarios (fondos), controles (teclas o ratón), reglas, variables que necesitará (puntos, vidas, tiempo, nivel) y condiciones de victoria y derrota. Ejemplo: «Si el gato toca un meteorito, pierde una vida; con 0 vidas aparece GAME OVER».\n- Storyboard. Dibuja (a mano y foto, o con Dibujos de Google) 4-6 viñetas: pantalla de inicio, instrucciones, momento de juego, cambio de nivel o de escena, victoria y derrota. Cada viñeta lleva una frase debajo.\n- Historia interactiva (opción). Si elige historia interactiva, el guion incluye al menos dos decisiones del jugador que llevan a finales distintos (árbol de decisiones).\n- Evidencia: Guion y storyboard en la memoria\n\nHito 3: El diagrama de flujo\nReto: Dibujar el diagrama de flujo del bucle principal del juego y entregar el guion y el diagrama (Tarea R1.1). Tiempo orientativo: 1 sesión.\n- Símbolos. Repasa en la guía del alumno los símbolos del diagrama de flujo: inicio/fin (óvalo), proceso (rectángulo), decisión (rombo) y entrada/salida (paralelogramo), con un ejemplo cotidiano (preparar un Cola Cao).\n- Diagrama del juego. Dibuja en diagrams.net (app.diagrams.net, guardando en Google Drive) o en Dibujos de Google el diagrama del bucle principal: inicio → poner variables a su valor inicial → repetir hasta que vidas = 0 o puntos = meta → leer controles → mover → ¿toca enemigo? (rombo) → ¿toca premio? (rombo) → final. Debe incluir al menos un bucle y dos decisiones, una de ellas anidada (p. ej. «si toca premio» → «si puntos = 10 → siguiente nivel»).\n- Comprobar y entregar. Recorre el diagrama con el dedo como si jugara una partida y comprueba que cada camino llega a un final. Exporta el diagrama como imagen, lo pega en la memoria (parte 3) y entrega el PDF de la memoria hasta aquí en la Tarea R1.1. (Plantilla en el anexo A2.)\n- Moodle Centros: Tarea «R1.1 · Guion y diagrama de flujo» (evaluada con rúbrica 1-3-5-7-10). Evaluar que la planificación está completa antes de programar. El docente devuelve comentarios para corregir el rumbo.\n- Evidencia: Diagrama de flujo\n- Evidencia: Tarea R1.1 (rúbrica)", "temporalizacion": "3 sesiones (trabajo autónomo)", "recursos": "Scratch, Ficha A1, Plantilla A2 (memoria), Dibujos de Google, diagrams.net", "descriptores": "CC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre a
