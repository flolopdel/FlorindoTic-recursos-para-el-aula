tienes y lo proteges", "Control total"]}, {"titulo": "Alojamiento o nube", "icono": "☁️", "puntos": ["Alquilas espacio a una empresa", "Compartido, VPS o nube", "Pagas por uso"]}, {"titulo": "Plataforma", "icono": "🧩", "puntos": ["Google Sites, GitHub Pages…", "Gratis y sin instalar nada", "**Aquí vivirá tu portfolio**"]}]}, {"tipo": "practica", "titulo": "Dibuja el mapa de tu portfolio", "enunciado": "En la parte 3 de la ficha A1, dibuja las seis páginas y escribe qué irá en cada una.", "pasos": ["Inicio: quién soy (sin datos personales) y cabecera animada.", "Videojuego y app · Almacén automático.", "Créditos y licencias · Datos · Inteligencia artificial."]}, {"tipo": "cierre", "puntos": ["HTML estructura, CSS decora, JavaScript da vida.", "Las webs viven en servidores.", "Tu portfolio vivirá en Google Sites."], "siguiente": "Hito 2: construir la web con animación (Tarea R3.1).", "pregunta": "¿Qué web te gustaría inspeccionar a fondo y por qué?"}]}}, {"n": 2, "fase": "Desarrollo", "titulo": "Construir el portfolio y animarlo", "reto": "Crear el portfolio en Google Sites con sus páginas, insertar los proyectos de R1 y R2 y añadir una cabecera animada, resolviendo los problemas que aparezcan. Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Crear el sitio", "desc": "Entra en sites.google.com con la cuenta del centro y crea un sitio en blanco. Nombre del sitio sin datos personales (p. ej. «PixelNinja · Portfolio maker»). Crea las seis páginas del mapa y comprueba que el menú de navegación aparece arriba."}, {"nombre": "Insertar proyectos", "desc": "En «Videojuego y app» inserta el juego de Scratch (Insertar → Insertar código, con el código de la opción «Insertar» de la página del proyecto) y una captura de la app; en «Almacén automático», el enlace del circuito de Tinkercad y capturas o el vídeo del AGV desde su Drive. Cada proyecto con un texto breve: qué es, con qué se hizo y qué aprendió."}, {"nombre": "Cabecera animada", "desc": "Crea una animación corta para la página de inicio: un GIF hecho con ezgif.com (subiendo 3-5 capturas de sus proyectos) o una animación con Canva para Educación exportada como GIF o MP4. Compara en la ficha A1 los formatos de animación web (GIF, vídeo MP4/WebM, animación CSS, SVG animado, Lottie) y las herramientas que los crean."}, {"nombre": "Problemas y soluciones", "desc": "Anota en la ficha A1 (parte 4) al menos tres problemas encontrados y su solución. Ejemplos: el GIF pesa mucho y tarda en cargar → reducir tamaño y número de fotogramas; el juego de Scratch no aparece → usar el código «Insertar» y no el enlace normal; el vídeo de Drive no se ve → cambiar el permiso a «cualquier persona de la organización con el enlace»."}, {"nombre": "Entregar", "desc": "Entrega en la Tarea R3.1 el enlace de vista previa del sitio (o el de edición compartido con el docente) y la ficha A1. (Plantilla en el anexo A1.)"}], "criterios": ["CYR.3.5.1", "CYR.3.5.2"], "saberes": ["CYR.3.E.1", "CYR.3.E.3", "CYR.3.E.4"], "metodologia": ["Aprender haciendo", "Ciclo de diseño iterativo"], "evidencias": ["Sitio con las seis páginas y los proyectos insertados", "Cabecera animada", "Tabla de problemas y soluciones", "Tarea R3.1 (Apto / No apto)"], "recursos": ["Google Sites", "ezgif.com o Canva para Educación", "Ficha A1"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Elección de herramienta de animación; pasos con capturas en la web de clase; tabla de problemas frecuentes con soluciones."}, "ejercicios": ["Crea el portfolio en Google Sites con las seis páginas.", "Inserta el juego de Scratch, la app y el almacén automático.", "Crea una cabecera animada y compara formatos de animación web.", "Anota tres problemas y su solución."], "moodle": [{"recurso": "Tarea", "nombre": "R3.1 · Estructura del portfolio", "uso": "Comprobar que el sitio está creado con todas las páginas y los proyectos insertados antes de seguir.", "correccion": "apto", "criterio": "CYR.3.5.1", "cotejo": ["El enlace del sitio se abre", "Están las seis páginas con menú de navegación", "El juego de Scratch está insertado y se puede jugar", "Hay capturas o enlaces de la app y del almacén automático", "La ficha A1 tiene las partes 1 a 4 completas"], "config": ["Entrega: texto en línea (enlace) + PDF", "Calificación: escala Apto / No apto", "Permitir reenvío hasta que sea Apto"], "calificable": true, "codigo": "R3.1"}], "clase": {"pregunta": "¿Por qué hay webs que cargan al instante y otras que tardan una eternidad?", "diapositivas": [{"tipo": "ejemplo", "icono": "🐢", "titulo": "La web del restaurante que no carga", "situacion": "Buscas la carta de un restaurante en el móvil y la página tarda 20 segundos: tiene un vídeo enorme de fondo.", "explicacion": "Las animaciones hacen una web atractiva, pero **pesan**. Elegir bien el **formato** y el **tamaño** es parte del trabajo de quien desarrolla la web."}, {"tipo": "pasos", "titulo": "Crea tu sitio", "pasos": ["sites.google.com con tu cuenta del centro → Sitio en blanco.", "Nombre sin datos personales.", "Páginas → «+»: crea las seis páginas.", "Insertar → Insertar código: pega el código «Insertar» de tu juego de Scratch.", "Inserta capturas de la app y del almacén (desde Drive)."], "progresivo": true}, {"tipo": "infografia", "titulo": "Formatos de animación web", "elementos": [{"icono": "🎞️", "titulo": "GIF", "texto": "Fácil y universal; pesa mucho y pocos colores"}, {"icono": "🎬", "titulo": "Vídeo MP4/WebM", "texto": "Mejor calidad por menos peso"}, {"icono": "🎨", "titulo": "CSS", "texto": "Animación con código, muy ligera"}, {"icono": "✏️", "titulo": "SVG / Lottie", "texto": "Vectores: se ven nítidos a cualquier tamaño"}]}, {"tipo": "practica", "titulo": "Crea tu cabecera animada", "enunciado": "Haz un GIF con **ezgif.com** (sube 3-5 capturas de tus proyectos) o una animación con **Canva para Educación**. Insértala en la página de inicio.", "pasos": ["Ancho máximo 1200 px.", "Pocos fotogramas y bucle infinito.", "Si pesa más de 2 MB, redúcela (Optimize / Resize).", "Compara formatos en la parte 4 de la ficha A1."], "enlace": "https://docs.google.com/document/d/1R1fOidh43PmRsVhF8F1HysFhyt79p2WZKP5gVK0DrDw/copy"}, {"tipo": "comparar", "titulo": "Problemas frecuentes y soluciones", "columnas": [{"titulo": "El juego no aparece", "icono": "🧩", "puntos": ["Usa el código «Insertar» de Scratch", "No el enlace normal", "El proyecto debe estar compartido"]}, {"titulo": "El vídeo no se ve", "icono": "🔒", "puntos": ["Revisa el permiso de Drive", "«Organización con el enlace»", "Prueba en una ventana de incógnito"]}, {"titulo": "La página va lenta", "icono": "🐢", "puntos": ["GIF demasiado grande", "Reduce tamaño y fotogramas", "O usa vídeo MP4"]}]}, {"tipo": "practica", "titulo": "Anota y entrega", "enunciado": "Anota al menos **tres problemas** con su solución en la ficha A1 y entrega el enlace del sitio con la ficha.", "entrega": "Tarea R3.1 · Estructura del portfolio", "material": ["Ficha A1 · Analizo una web y planifico la mía"]}, {"tipo": "cierre", "puntos": ["Google Sites genera el HTML por ti.", "Cada formato de animación tiene ventajas e inconvenientes.", "Los problemas se resuelven probando y anotando."], "siguiente": "Hito 3: licencias y créditos de todo lo que publicas."}]}}, {"n": 3, "fase": "Desarrollo", "titulo": "Licencias y créditos", "reto": "Conocer los derechos de autor, elegir una licencia Creative Commons para tus proyectos y dar crédito a todo lo que no es tuyo en la página «Créditos y licencias». Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Derechos de autor en cinco ideas", "desc": "Lee en la web de clase las ideas básicas de la Ley de Propiedad Intelectual: la obra es del autor desde que la crea, sin registrarla; derechos morales (reconocimiento, para siempre) y patrimoniales (explotación); el derecho de cita; las obras pasan a dominio público 70 años después de la muerte del autor; «está en Internet» no significa «es libre»."}, {"nombre": "Creative Commons", "desc": "Con el elegidor de licencias de Creative Commons (chooser-beta.creativecommons.org) decide qué licencia pondrá a su portfolio y a cada proyecto, y explica en la ficha A2 qué significan BY, SA, NC y ND. Recuerda que su juego de Scratch ya es CC BY-SA por las condiciones de Scratch y que las remezclas deben respetar la licencia original."}, {"nombre": "Créditos", "desc": "Hace en la ficha A2 un inventario de todo lo que usa en la web y en sus proyectos y no es suyo (imágenes, sonidos, fuentes, ejemplos de código, la imagen de un robot industrial…). Sustituye lo que no tenga licencia por recursos de Openverse (openverse.org) o la biblioteca de Scratch y escribe los créditos con el formato TASL: Título, Autor, Fuente (enlace) y Licencia."}, {"nombre": "Página «Créditos y licencias»", "desc": "Crea la página en el portfolio con: la licencia elegida (con su icono y enlace), la tabla de créditos y una frase en el pie de todas las páginas («Contenido bajo licencia CC BY-SA 4.0, salvo los recursos indicados en Créditos»). (Plantilla en el anexo A2.)"}], "criterios": ["CYR.3.6.3"], "saberes": ["CYR.3.I.5"], "metodologia": ["Trabajo autónomo guiado", "Ciudadanía digital"], "evidencias": ["Ficha A2, partes 1 y 2", "Página «Créditos y licencias»"], "recursos": ["Elegidor de licencias CC", "Openverse", "Ficha A2"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Iconos de las licencias con ejemplos de uso permitido y no permitido; plantilla de crédito TASL para copiar."}, "ejercicios": ["Explica qué son los derechos morales y patrimoniales y cuándo una obra pasa a dominio público.", "Elige una licencia Creative Commons para tu portfolio y justifícala.", "Haz el inventario de recursos ajenos y escribe sus créditos con el formato TASL."], "clase": {"pregunta": "Si una imagen está en Google Imágenes, ¿puedo usarla en mi web?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎵", "titulo": "El vídeo que se quedó sin música", "situacion": "Un creador sube un vídeo con una canción famosa de fondo y la plataforma le quita el sonido o bloquea el vídeo.", "explicacion": "La canción tiene **derechos de autor**. Usarla sin permiso no es legal aunque «esté en Internet». Lo mismo pasa con imágenes, sonidos y textos de tu web."}, {"tipo": "idea", "icono": "⚖️", "titulo": "Ley de Propiedad Intelectual en 4 ideas", "puntos": ["La obra es tuya **desde que la creas**, sin registrarla.", "**Derechos morales**: que te reconozcan (para siempre). **Patrimoniales**: explotarla.", "Puedes **citar** fragmentos indicando autor y fuente.", "**Dominio público**: 70 años después de la muerte del autor."]}, {"tipo": "infografia", "titulo": "Las piezas de Creative Commons", "elementos": [{"icono": "👤", "titulo": "BY", "texto": "Reconocer al autor (siempre)"}, {"icono": "🔁", "titulo": "SA", "texto": "Compartir igual: misma licencia"}, {"icono": "💶", "titulo": "NC", "texto": "No comercial"}, {"icono": "🚫", "titulo": "ND", "texto": "Sin obras derivadas"}]}, {"tipo": "quiz", "pregunta": "Una imagen tiene licencia CC BY-NC. ¿Puedes ponerla en tu portfolio?", "opciones": ["No, nunca", "Sí, citando al autor, porque tu web no es comercial", "Sí, y además puedes venderla en camisetas"], "correcta": 1, "explicacion": "**BY**: tienes que reconocer al autor. **NC**: no puedes usarla con fines comerciales. En un portfolio educativo sin ánimo de lucro, sí."}, {"tipo": "codigo", "titulo": "Un crédito bien hecho (TASL)", "codigo": "«Robot industrial» (Título)\npor Juan Pérez (Autor)\nen Openverse: https://openverse.org/... (Fuente)\nbajo licencia CC BY 4.0 (Licencia)", "explicacion": ["**T**ítulo, **A**utor, **S**ource (fuente), **L**icencia.", "Cópialo en tu tabla de créditos.", "Si no encuentras la licencia, **no lo uses**."]}, {"tipo": "practica", "titulo": "Inventario y página de créditos", "enunciado": "Completa la ficha A2: elige tu licencia en el elegidor de CC, haz el inventario de recursos ajenos y crea la página «Créditos y licencias».", "pasos": ["Sustituye lo que no tenga licencia por recursos de Openverse.", "Créditos con formato TASL.", "Añade la licencia en el pie de todas las páginas."], "material": ["Ficha A2 · Licencias, créditos y seguridad"], "enlace": "https://docs.google.com/document/d/15weh80KEWKMoYN4KXKb8JFYhEslQzl4CH1UZLWqwx7Q/copy"}, {"tipo": "cierre", "puntos": ["En Internet no todo es libre.", "Creative Commons dice qué se puede hacer con una obra.", "Citar bien protege al autor… y a ti."], "siguiente": "Hito 4: revisar la seguridad y publicar (Tarea R3.2).", "pregunta": "¿Qué licencia has elegido y por qué?"}]}}, {"n": 4, "fase": "Desarrollo", "titulo": "Web segura y publicación", "reto": "Revisar la seguridad de tu cuenta y de tu web, publicarla y entregar el portfolio (Tarea R3.2). Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Tipos de ciberseguridad y de malware", "desc": "Lee en la web de clase los tipos de ciberseguridad (física y lógica; activa y pasiva) y los tipos de malware (virus, gusano, troyano, ransomware, spyware, adware) con su forma de protección (antimalware actualizado, actualizaciones, no descargar de sitios dudosos, copias de seguridad). Completa la tabla de la ficha A2 (parte 3)."}, {"nombre": "Proteger la cuenta", "desc": "Revisa la seguridad de su cuenta del centro en myaccount.google.com → Seguridad (o lo que permita el centro): contraseña robusta, verificación en dos pasos si está disponible, dispositivos con sesión iniciada y cierre de sesión en ordenadores compartidos."}, {"nombre": "Lista «Mi web es segura»", "desc": "Antes de publicar, recorre la lista de la ficha A2: sin nombre completo, foto, dirección, teléfono, centro ni horarios; sin capturas con datos personales; permisos de los archivos de Drive revisados; recursos solo de fuentes fiables (sin plantillas o widgets de webs dudosas); la web se sirve por HTTPS (candado); no inserta encuestas ni campos que pidan datos."}, {"nombre": "Publicar", "desc": "Pulsa «Publicar» en Google Sites y elige quién puede verla: por defecto, solo las personas de la organización (cuentas del centro) o lo que indique el docente. Comprueba la web publicada en una ventana de incógnito y en el móvil (vista previa móvil de Sites)."}, {"nombre": "Entregar", "desc": "Entrega en la Tarea R3.2 el enlace de la web publicada y la ficha A2 completa. (Plantilla en el anexo A2.)"}], "criterios": ["CYR.3.6.4", "CYR.3.5.1", "CYR.3.5.2", "CYR.3.6.3"], "saberes": ["CYR.3.I.1", "CYR.3.I.3", "CYR.3.E.2"], "metodologia": ["Ciudadanía digital", "Evaluación formativa"], "evidencias": ["Ficha A2, parte 3 y lista de seguridad", "Web publicada", "Tarea R3.2 (rúbrica)"], "recursos": ["Google Sites", "Cuenta de Google del centro", "Ficha A2"], "dua": {"principios": ["Andamiaje", "Representación"], "medidas": "Lista de comprobación cerrada; tabla de malware con ejemplos de noticias reales."}, "ejercicios": ["Clasifica los tipos de ciberseguridad y de malware con su protección.", "Revisa la seguridad de tu cuenta del centro.", "Recorre la lista «Mi web es segura» y publica tu portfolio."], "moodle": [{"recurso": "Tarea", "nombre": "R3.2 · Portfolio publicado", "uso": "Evaluar el portfolio publicado: estructura y alojamiento, animación y problemas resueltos, licencias y créditos, y seguridad.", "correccion": "rubrica", "criterio": "CYR.3.5.1", "rubrica": [{"linea": "Estructura de la web y alojamiento", "criterio": "CYR.3.5.1", "niveles": ["1 pto: la web no está publicada o no se abre.", "3 ptos: faltan varias páginas o no hay menú.", "5 ptos: seis páginas con menú, pero la ficha no explica su estructura ni dónde se aloja.", "7 ptos: seis páginas con menú y la ficha identifica las partes de una web y el tipo de servidor.", "10 ptos: web completa y clara; la ficha explica con ejemplos de la inspección las partes, HTML/CSS/JavaScript y por qué Google Sites es una plataforma alojada."]}, {"linea": "Animación, proyectos insertados y problemas resueltos", "criterio": "CYR.3.5.2", "niveles": ["1 pto: no hay animación ni proyectos insertados.", "3 ptos: hay animación o proyectos, pero no funcionan.", "5 ptos: animación y proyectos funcionan; problemas sin documentar.", "7 ptos: todo funciona, con comparación de formatos y dos problemas resueltos.", "10 ptos: animación optimizada, juego jugable desde la web, comparación razonada de formatos y tres o más problemas con su solución."]}, {"linea": "Licencias y créditos", "criterio": "CYR.3.6.3", "niveles": ["1 pto: no hay licencia ni créditos.", "3 ptos: hay recursos ajenos sin citar o sin licencia.", "5 ptos: licencia elegida, pero créditos incompletos.", "7 ptos: licencia elegida y justificada; créditos con formato TASL con algún error.", "10 ptos: licencia justificada, créditos TASL completos, licencia en el pie y explicación correcta de derechos morales, patrimoniales y dominio público."]}, {"linea": "Seguridad de la cuenta y de la web", "criterio": "CYR.3.6.4", "niveles": ["1 pto: la web muestra datos personales.", "3 ptos: hay algún dato personal o archivos con permisos abiertos sin necesidad.", "5 ptos: sin datos personales, pero la ficha de seguridad está incompleta.", "7 ptos: sin datos personales, lista completa y tabla de malware correcta.", "10 ptos: sin datos personales, lista completa, tabla de ciberseguridad y malware correcta, cuenta revisada y publicación con permisos razonados."]}], "config": ["Entrega: texto en línea (enlace) + PDF de la ficha A2", "Método de calificación: Rúbrica", "Comentarios de retroalimentación activados"], "criterios_rubrica": ["CYR.3.5.1", "CYR.3.5.2", "CYR.3.6.3", "CYR.3.6.4"], "calificable": true, "codigo": "R3.2"}], "clase": {"pregunta": "¿Qué podría averiguar un desconocido sobre ti solo con tu web?", "diapositivas": [{"tipo": "ejemplo", "icono": "🧩", "titulo": "El puzle de los datos", "situacion": "Una web dice «estudio 3.º», otra foto muestra el uniforme del equipo de fútbol y en un vídeo se oye el nombre del pueblo.", "explicacion": "Cada dato parece inofensivo, pero **juntos** dicen quién eres y dónde encontrarte. Por eso revisamos la web **entera** antes de publicarla."}, {"tipo": "comparar", "titulo": "Tipos de ciberseguridad", "columnas": [{"titulo": "Física / lógica", "icono": "🔐", "puntos": ["Física: candados, sala de servidores, SAI", "Lógica: contraseñas, cifrado, antivirus"]}, {"titulo": "Activa / pasiva", "icono": "🛡️", "puntos": ["Activa: **evita** el ataque (2FA, cortafuegos)", "Pasiva: **reduce el daño** (copias de seguridad)"]}]}, {"tipo": "infografia", "titulo": "Malware más común", "elementos": [{"icono": "🦠", "titulo": "Virus y gusanos", "texto": "Se copian y se extienden"}, {"icono": "🐴", "titulo": "Troyano", "texto": "Parece un programa útil («mod», «hack»)"}, {"icono": "💰", "titulo": "Ransomware", "texto": "Cifra tus archivos y pide un rescate"}, {"icono": "👀", "titulo": "Spyware / adware", "texto": "Espía o llena de anuncios"}]}, {"tipo": "quiz", "pregunta": "Un ransomware cifra todos los archivos de tu ordenador. ¿Qué medida te salva?", "opciones": ["Tener una copia de seguridad reciente fuera del ordenador", "Cambiar el fondo de pantalla", "Pagar el rescate"], "correcta": 0, "explicacion": "La **copia de seguridad** (seguridad pasiva) permite recuperar los archivos. Pagar no garantiza nada y anima a los delincuentes."}, {"tipo": "practica", "titulo": "Lista «Mi web es segura»", "enunciado": "Recorre **toda** la web con la lista de la ficha A2 y corrige lo que falle antes de publicar.", "pasos": ["Sin nombre completo, foto, centro ni horarios.", "Permisos de Drive revisados.", "Recursos solo de fuentes fiables.", "Candado HTTPS en la web publicada."], "material": ["Ficha A2 · Licencias, créditos y seguridad"], "enlace": "https://docs.google.com/document/d/15weh80KEWKMoYN4KXKb8JFYhEslQzl4CH1UZLWqwx7Q/copy"}, {"tipo": "practica", "titulo": "Publica y entrega", "enunciado": "Publica el sitio (por defecto, visible para la organización del centro o lo que diga el docente), compruébalo en incógnito y en vista móvil, y entrega el enlace y la ficha A2.", "entrega": "Tarea R3.2 · Portfolio publicado"}, {"tipo": "cierre", "puntos": ["Seguridad activa evita; pasiva reduce el daño.", "Un troyano suele llegar disfrazado de regalo.", "Revisar antes de publicar es un hábito profesional."], "siguiente": "Hito 5: los datos detrás de tus proyectos.", "pregunta": "¿Qué has cambiado en tu web después de pasar la lista?"}]}}, {"n": 5, "fase": "Desarrollo", "titulo": "Los datos detrás de mis proyectos", "reto": "Descubrir los metadatos de tus propios archivos y proyectos y extraer una tabla de la web con data scraping para crear un gráfico en la página «Datos». Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Metadatos de mis archivos", "desc": "Mira los metadatos de tres de sus archivos: las propiedades de una captura o del vídeo del juego (Windows: clic derecho → Propiedades → Detalles; o el panel de detalles de Drive), una fotografía de Wikimedia Commons (sección «Metadatos» al final de la página: cámara, fecha, a veces GPS) y su proyecto de Scratch (fecha de creación y de modificación, vistas, «me gusta», favoritos, remezclas). Los anota en el cuaderno A3."}, {"nombre": "Clasificar metadatos", "desc": "Clasifica los metadatos encontrados en descriptivos (título, autor, etiquetas), estructurales (formato, tamaño, duración, resolución) y administrativos (fechas, licencia, permisos), y dónde se almacenan: dentro del archivo (EXIF de una foto), en el sistema de archivos o en la base de datos del servidor (Scratch, Drive). Reflexiona: ¿qué metadatos revelan algo personal (ubicación GPS de una foto hecha con el móvil) y cómo se borran?"}, {"nombre": "Data scraping con una hoja de cálculo", "desc": "En una hoja de cálculo de Google usa la función IMPORTHTML para traer una tabla de Wikipedia relacionada con sus proyectos: busca en es.wikipedia.org una página con una tabla de videojuegos o videoconsolas más vendidos, copia la dirección y escribe =IMPORTHTML(\"dirección\"; \"table\"; 1), cambiando el último número (1, 2, 3…) hasta que aparezca la tabla deseada. Limpia los datos si hace falta y crea un gráfico de barras con los 10 primeros."}, {"nombre": "Análisis crítico", "desc": "Responde en el cuaderno A3: ¿de dónde salen los datos y de qué fecha son?, ¿qué conclusión saca el gráfico y qué no puede concluir?, ¿cuándo es legal y ético el scraping (datos públicos, respetar las condiciones de uso y el archivo robots.txt, no recoger datos personales, no saturar el servidor)?"}, {"nombre": "Página «Datos»", "desc": "Inserta el gráfico en la página «Datos» del portfolio (Insertar → Gráficos, desde la hoja de cálculo), con la fuente citada y un texto con su conclusión y la tabla de metadatos de su juego. (Plantilla en el anexo A3.)"}], "criterios": ["CYR.3.4.1", "CYR.3.4.3"], "saberes": ["CYR.3.G.1", "CYR.3.G.2", "CYR.3.G.3", "CYR.3.G.4"], "metodologia": ["Aprendizaje por descubrimiento", "Pensamiento crítico"], "evidencias": ["Cuaderno A3, partes 1 y 2", "Hoja de cálculo con IMPORTHTML y gráfico", "Página «Datos» del portfolio"], "recursos": ["Hojas de cálculo de Google", "Wikipedia y Wikimedia Commons", "Cuaderno A3"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Fórmula de ejemplo para copiar y modificar; vídeo o pasos con capturas para insertar el gráfico."}, "ejercicios": ["Localiza los metadatos de tres archivos o proyectos tuyos y clasifícalos en descriptivos, estructurales y administrativos.", "Importa una tabla de Wikipedia con IMPORTHTML y crea un gráfico.", "Analiza de forma crítica la fuente y las conclusiones del gráfico.", "Explica cuándo el data scraping es legal y ético."], "clase": {"pregunta": "¿Qué cuenta una foto de ti aunque no salgas en ella?", "diapositivas": [{"tipo": "ejemplo", "icono": "📍", "titulo": "La foto que decía dónde vives", "situacion": "Alguien sube la foto de su nuevo gato hecha con el móvil y desde casa. En la foto solo sale el gato.", "explicacion": "Pero el archivo guarda **metadatos EXIF**: modelo del móvil, fecha y hora… y a veces las **coordenadas GPS**. Los metadatos son «datos sobre los datos»."}, {"tipo": "infografia", "titulo": "Tipos de metadatos", "elementos": [{"icono": "🏷️", "titulo": "Descriptivos", "texto": "Título, autor, etiquetas"}, {"icono": "📐", "titulo": "Estructurales", "texto": "Formato, tamaño, duración, resolución"}, {"icono": "🗂️", "titulo": "Administrativos", "texto": "Fechas, licencia, permisos"}]}, {"tipo": "practica", "titulo": "Busca tus metadatos", "enunciado": "Mira los metadatos de **tres** archivos y anótalos en el cuaderno A3.", "pasos": ["Una captura o tu vídeo: Propiedades → Detalles (o panel de Drive).", "Una foto de Wikimedia Commons: sección «Metadatos».", "Tu proyecto de Scratch: fechas, vistas, «me gusta», remezclas.", "Clasifícalos y di dónde se guardan."], "material": ["Cuaderno A3 · Datos e IA"], "enlace": "https://docs.google.com/document/d/1tvxwMz9DxaPmoirENdMj8XlEQ107QkMJ7hJPwSDzkA8/copy"}, {"tipo": "ejemplo", "icono": "🛒", "titulo": "Los comparadores de precios", "situacion": "Una web te enseña el precio de la misma consola en diez tiendas a la vez.", "explicacion": "Un programa **visita las tiendas y copia los precios automáticamente**: eso es **data scraping**. Tú lo harás con una fórmula de hoja de cálculo."}, {"tipo": "codigo", "titulo": "Scraping con una fórmula", "codigo": "=IMPORTHTML(\"https://es.wikipedia.org/wiki/...\"; \"table\"; 1)\n\n// \"table\" → importa una tabla (\"list\" importaría una lista)\n// 1       → la primera tabla de la página; prueba 2, 3… si no es la que buscas", "explicacion": ["Pega la dirección de la página de Wikipedia.", "La hoja **descarga y copia** la tabla.", "Selecciona 10 filas → Insertar → Gráfico."]}, {"tipo": "practica", "titulo": "Tu gráfico de datos", "enunciado": "Importa una tabla de videojuegos o videoconsolas más vendidos, crea un gráfico de barras con los 10 primeros e insértalo en la página «Datos» con la fuente citada.", "pasos": ["Hoja de cálculo nueva en tu Drive del centro.", "Fórmula IMPORTHTML.", "Gráfico de barras con título y ejes.", "Sites: Insertar → Gráficos."]}, {"tipo": "comparar", "titulo": "Scraping: ¿sí o no?", "columnas": [{"titulo": "Aceptable", "icono": "✅", "puntos": ["Datos públicos (Wikipedia)", "Citando la fuente", "Pocas peticiones"]}, {"titulo": "No aceptable", "icono": "⛔", "puntos": ["Datos personales de perfiles", "Saltarse las condiciones de uso o robots.txt", "Saturar el servidor"]}]}, {"tipo": "cierre", "puntos": ["Todos tus archivos llevan metadatos.", "El scraping copia datos de la web de forma automática.", "Un gráfico necesita fuente, fecha y espíritu crítico."], "siguiente": "Hito 6: tu modelo de inteligencia artificial y la entrega final (Tarea R3.3)."}]}}, {"n": 6, "fase": "Cierre", "titulo": "Mi modelo de inteligencia artificial y entrega final", "reto": "Entrenar un modelo de aprendizaje automático con Teachable Machine, analizar sus errores y su ética, completar la página «Inteligencia artificial» y entregar el producto final (Tarea R3.3). Tiempo orientativo: 1-2 sesiones.", "actividades": [{"nombre": "La IA hoy", "desc": "Lee en la web de clase ejemplos actuales de IA (recomendaciones de vídeos, traductores, asistentes de texto e imagen, coches con ayudas a la conducción) y la diferencia entre un agente inteligente simple (percibe → decide → actúa con reglas, como su AGV de la SdA R2) y el aprendizaje automático (aprende de ejemplos)."}, {"nombre": "Entrenar el modelo", "desc": "En teachablemachine.withgoogle.com crea un «Proyecto de imagen» con tres clases para controlar su videojuego por gestos: «Izquierda» (mano a la izquierda), «Derecha» (mano a la derecha) y «Nada» (sin mano). Graba unas 50 imágenes por clase con la webcam, solo de la mano (nunca de la cara), o sube imágenes de objetos si no tiene webcam. Pulsa «Entrenar modelo» y pruébalo en la vista previa."}, {"nombre": "Buscar los fallos", "desc": "Prueba el modelo cambiando la iluminación, el fondo, la distancia o la otra mano y anota en el cuaderno A3 cuándo falla y por qué (los datos de entrenamiento no representaban esa situación: sesgo). Reentrena añadiendo ejemplos variados y compara la mejora."}, {"nombre": "Publicar y reflexionar", "desc": "Exporta el modelo («Exportar modelo» → «Subir mi modelo»: se sube el modelo, no las imágenes) y pone el enlace en la página «Inteligencia artificial» con una captura y su reflexión ética: sesgos, privacidad de los datos de entrenamiento, deepfakes y desinformación, y una «declaración de uso de IA» en la que dice si ha usado alguna herramienta de IA en las SdA de recuperación y para qué."}, {"nombre": "Revisión final y entrega", "desc": "Repasa todo el portfolio, se autoevalúa con las rúbricas de R3.2 y R3.3 y entrega en la Tarea R3.3 el enlace de la web y el cuaderno A3. (Plantilla en el anexo A3.)"}, {"nombre": "Defensa breve (opcional, a criterio del docente)", "desc": "Si el docente lo considera conveniente para comprobar la autoría y que el alumno domina lo que ha hecho, le pide 5-10 minutos para recorrer el portfolio, explicar la fórmula IMPORTHTML y probar el modelo de IA en directo. Si el alumno no sabe explicar su trabajo, el docente puede pedirle que lo rehaga o ajustar las líneas de la rúbrica afectadas."}], "criterios": ["CYR.3.4.2", "CYR.3.4.1", "CYR.3.4.3"], "saberes": ["CYR.3.H.1", "CYR.3.H.2", "CYR.3.H.3", "CYR.3.H.4"], "metodologia": ["Aprender haciendo", "Pensamiento crítico", "Metacognición"], "evidencias": ["Modelo de Teachable Machine publicado", "Página «Inteligencia artificial»", "Cuaderno A3 completo"], "recursos": ["Teachable Machine", "Webcam (o imágenes)", "Cuaderno A3"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Alternativa sin webcam (subir imágenes de objetos); preguntas guía para la reflexión ética."}, "ejercicios": ["Diferencia un agente inteligente simple del aprendizaje automático con un ejemplo de tus SdA.", "Entrena un modelo de imagen con tres clases en Teachable Machine.", "Prueba el modelo en situaciones distintas, explica sus fallos y reentrénalo.", "Escribe una reflexión ética y tu declaración de uso de IA."], "moodle": [{"recurso": "Tarea", "nombre": "R3.3 · Datos e inteligencia artificial", "uso": "Evaluar las páginas «Datos» e «Inteligencia artificial» del portfolio y el cuaderno A3.", "correccion": "rubrica", "criterio": "CYR.3.4.2", "rubrica": [{"linea": "Metadatos de mis proyectos", "criterio": "CYR.3.4.1", "niveles": ["1 pto: no hay metadatos.", "3 ptos: metadatos de un archivo sin clasificar.", "5 ptos: metadatos de tres archivos con clasificación incompleta.", "7 ptos: tres archivos, clasificación correcta y dónde se almacenan.", "10 ptos: tres archivos bien clasificados, dónde se almacenan y qué revelan de la persona, con medidas para borrarlos."]}, {"linea": "Gráfico y análisis crítico", "criterio": "CYR.3.4.1", "niveles": ["1 pto: no hay gráfico.", "3 ptos: gráfico sin fuente ni título.", "5 ptos: gráfico correcto con fuente, sin análisis.", "7 ptos: gráfico con fuente y una conclusión razonada.", "10 ptos: gráfico claro con fuente y fecha, conclusión razonada y límites de lo que se puede concluir."]}, {"linea": "Data scraping", "criterio": "CYR.3.4.3", "niveles": ["1 pto: los datos se han copiado a mano o no hay hoja.", "3 ptos: hay fórmula IMPORTHTML que no funciona.", "5 ptos: la fórmula importa la tabla, sin explicar cómo funciona.", "7 ptos: la fórmula funciona y explica sus partes.", "10 ptos: la fórmula funciona, explica sus partes y cuándo el scraping es legal y ético (datos públicos, condiciones de uso, robots.txt, datos personales)."]}, {"linea": "Modelo de aprendizaje automático", "criterio": "CYR.3.4.2", "niveles": ["1 pto: no hay modelo.", "3 ptos: modelo con una sola clase o sin probar.", "5 ptos: modelo de tres clases que funciona, sin pruebas de fallos.", "7 ptos: modelo probado en situaciones distintas, con los fallos anotados.", "10 ptos: modelo publicado, fallos analizados como sesgo de los datos, reentrenado con mej
