ón de plataformas virtuales: soluciones.", "hijos": [], "criterios": []}, "CYR.3.I.5": {"tipo": "sb", "texto": "Ley de propiedad intelectual.", "hijos": [], "criterios": ["CYR.3.6.3"]}, "CCL1": {"tipo": "de", "texto": "Se expresa de forma oral, escrita, signada o multimodal con coherencia, corrección y adecuación a los diferentes contextos sociales, y participa en interacciones comunicativas con actitud cooperativa y respetuosa tanto para intercambiar información, crear conocimiento y transmitir opiniones, como para construir vínculos personales.", "competencias": []}, "CCL2": {"tipo": "de", "texto": "Comprende, interpreta y valora con actitud crítica textos orales, escritos, signados o multimodales de los ámbitos personal, social, educativo y profesional para participar en diferentes contextos de manera activa e informada y para construir conocimiento.", "competencias": []}, "CCL3": {"tipo": "de", "texto": "Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": []}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": ["CYR.3.5", "CYR.3.6"]}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": []}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": ["CYR.3.5", "CYR.3.6"]}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": ["CYR.3.4"]}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["CYR.3.4", "CYR.3.6"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": []}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": []}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["CYR.3.4", "CYR.3.6"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": ["CYR.3.5", "CYR.3.6"]}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": []}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": []}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": ["CYR.3.5", "CYR.3.6"]}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": ["CYR.3.5"]}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["CYR.3.4", "CYR.3.5"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": []}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": []}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": ["CYR.3.4", "CYR.3.5", "CYR.3.6"]}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": []}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": []}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["CYR.3.5"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": []}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": ["CYR.3.6"]}}, "idx": {"criterios": ["CYR.3.4.1", "CYR.3.4.2", "CYR.3.4.3", "CYR.3.5.1", "CYR.3.5.2", "CYR.3.6.3", "CYR.3.6.4"], "competencias": ["CYR.3.4", "CYR.3.5", "CYR.3.6"], "saberes": ["CYR.3.E.1", "CYR.3.E.2", "CYR.3.E.3", "CYR.3.E.4", "CYR.3.G.1", "CYR.3.G.2", "CYR.3.G.3", "CYR.3.G.4", "CYR.3.H.1", "CYR.3.H.2", "CYR.3.H.3", "CYR.3.H.4", "CYR.3.I.1", "CYR.3.I.3", "CYR.3.I.5"], "descriptores": ["CC3", "CCEC4", "CD1", "CD4", "CD5", "CE3", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM3", "STEM5"], "sesionesPorCriterio": {"CYR.3.5.1": [1, 2, 4], "CYR.3.5.2": [2, 4], "CYR.3.6.3": [3, 4], "CYR.3.6.4": [4], "CYR.3.4.1": [5, 6], "CYR.3.4.3": [5, 6], "CYR.3.4.2": [6]}, "porMateria": [{"codigo": "CYR", "criterios": ["CYR.3.4.1", "CYR.3.4.2", "CYR.3.4.3", "CYR.3.5.1", "CYR.3.5.2", "CYR.3.6.3", "CYR.3.6.4"], "competencias": ["CYR.3.4", "CYR.3.5", "CYR.3.6"], "saberes": ["CYR.3.E.1", "CYR.3.E.2", "CYR.3.E.3", "CYR.3.E.4", "CYR.3.G.1", "CYR.3.G.2", "CYR.3.G.3", "CYR.3.G.4", "CYR.3.H.1", "CYR.3.H.2", "CYR.3.H.3", "CYR.3.H.4", "CYR.3.I.1", "CYR.3.I.3", "CYR.3.I.5"], "descriptores": ["CC3", "CCEC4", "CD1", "CD4", "CD5", "CE3", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM3", "STEM5"]}], "materiasTxt": "Computación y Robótica"}, "seneca": {"titulo": "SdA R3: Mi portfolio maker, la web de mis proyectos", "temporalizacion": "6 sesiones (trabajo autónomo organizado en 6 hitos)", "justificacion": "SdA de recuperación trabajada de forma autónoma por hitos. El alumno publica en Google Sites un portfolio con los productos de las SdA R1 y R2, aplicando licencias Creative Commons y medidas de ciberseguridad, y añade una página de datos (metadatos y data scraping) y otra de inteligencia artificial (modelo de Teachable Machine y reflexión ética), evidenciando los criterios de desarrollo web, propiedad intelectual, ciberseguridad, datos e IA.", "producto_final": "Portfolio web en Google Sites con las páginas Inicio (cabecera animada), Videojuego y app (R1), Almacén automático (R2), Créditos y licencias, Datos (metadatos y gráfico con data scraping) e Inteligencia artificial (modelo de Teachable Machine y reflexión ética), publicado tras una revisión de seguridad.", "concrecion": [{"materia": "Computación y Robótica", "texto": "COMPETENCIAS ESPECÍFICAS\nCYR.3.4.Recopilar, almacenar y procesar datos, identificando patrones y descubriendo conexiones para resolver problemas mediante la Inteligencia Artificial entendiendo cómo nos ayuda a mejorar nuestra comprensión del mundo.\nCYR.3.5.Utilizar y crear aplicaciones informáticas y web sencillas, entendiendo su funcionamiento interno, de forma segura, responsable y respetuosa, protegiendo la identidad online y la privacidad.\nCYR.3.6.Conocer y aplicar los principios de la ciberseguridad, adoptando hábitos y conductas de seguridad, para permitir la protección del individuo en su interacción en la red.\n\nCRITERIOS DE EVALUACIÓN\nCYR.3.4.1.Conocer la naturaleza de los distintos tipos de datos generados hoy en día, siendo capaces de analizarlos, visualizarlos y compararlos, empleando a su vez un espíritu crítico y científico.\nCYR.3.4.2.Comprender los principios básicos de funcionamiento de los agentes inteligentes y de las técnicas de aprendizaje automático, con objeto de aplicarlos para la resolución de situaciones mediante la Inteligencia Artificial de forma ética y responsable.\nCYR.3.4.3.Comprender los principios básicos de funcionamiento del Data Scraping.\nCYR.3.5.1.Conocer la construcción de aplicaciones informáticas y web, entendiendo su funcionamiento interno, de forma segura, responsable y respetuosa.\nCYR.3.5.2.Conocer y resolver la variedad de problemas potencialmente presentes en el desarrollo de una aplicación web, tratando de generalizar posibles soluciones.\nCYR.3.6.3.Reconocer y comprender los derechos de los materiales alojados en la web.\nCYR.3.6.4.Conocer las estrategias de ciberseguridad que garantizan protección a los usuarios de Internet.\n\nSABERES BÁSICOS\nCYR.3.E.1.Análisis de la estructura de las páginas web.\nCYR.3.E.2.Servidores web: tipología.\nCYR.3.E.3.Formatos de animación web.\nCYR.3.E.4.Herramientas de animación web.\nCYR.3.G.1.Clasificación de los metadatos.\nCYR.3.G.2.Uso de Metadatos.\nCYR.3.G.3.Almacenamiento de Metadatos.\nCYR.3.G.4.Data scraping.\nCYR.3.H.1.Situación actual de la Inteligencia Artificial.\nCYR.3.H.2.Ética y responsabilidad social en el uso de IA: análisis y consecuencias del mal uso.\nCYR.3.H.3.Agentes inteligentes simples: funcionamiento.\nCYR.3.H.4.Aprendizaje automático: casos prácticos.\nCYR.3.I.1.Ciberseguridad: tipologías.\nCYR.3.I.3.Tipos de Malware y antimalware: protección.\nCYR.3.I.5.Ley de propiedad intelectual.\n\nDESCRIPTORES OPERATIVOS\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable."}], "actividades": [{"titulo": "Portfolio web publicado", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "1", "tarea": "R3.2 · Portfolio publicado", "descripcion": "Hito 1: ¿Cómo está hecha una web y dónde vive?\nReto: Descubrir la estructura de una página web inspeccionando su código, conocer los tipos de servidores y planificar las páginas del portfolio. Tiempo orientativo: 1 sesión.\n- Inspeccionar una web. Abre una web que use a menudo (p. ej. la de un videojuego o un club deportivo) y pulsa F12 o clic derecho → «Inspeccionar». Localiza las partes de la página (cabecera, menú de navegación, contenido principal, pie) y las etiquetas HTML que las forman (header, nav, main, footer, h1, p, img, a). Cambia un texto en el inspector y comprueba que el cambio solo lo ve él y desaparece al recargar. Lo anota en la ficha A1.\n- HTML, CSS y JavaScript. Con la web de clase, relaciona cada lenguaje con su función (estructura, aspecto, comportamiento) y desactiva el CSS de una página (extensión o ver código fuente) para ver «la web desnuda».\n- Dónde vive una web. Completa en la ficha A1 la tabla de servidores web: servidor propio, alojamiento compartido, servidor en la nube y plataformas que alojan por ti (Google Sites, GitHub Pages); web estática frente a dinámica. Identifica que su portfolio en Google Sites es una web alojada en los servidores de Google.\n- Planificar el portfolio. Dibuja en la ficha A1 el mapa del sitio con las seis páginas (Inicio, Videojuego y app, Almacén automático, Créditos y licencias, Datos, Inteligencia artificial) y qué irá en cada una. (Plantilla en el anexo A1.)\n- Moodle Centros: Foro «R3 · Dudas del portfolio». Canal para preguntar dudas de Google Sites, licencias, datos o IA en cualquier hito.\n- Evidencia: Ficha A1, partes 1 a 3\n\nHito 2: Construir el portfolio y animarlo\nReto: Crear el portfolio en Google Sites con sus páginas, insertar los proyectos de R1 y R2 y añadir una cabecera animada, resolviendo los problemas que aparezcan. Tiempo orientativo: 1 sesión.\n- Crear el sitio. Entra en sites.google.com con la cuenta del centro y crea un sitio en blanco. Nombre del sitio sin datos personales (p. ej. «PixelNinja · Portfolio maker»). Crea las seis páginas del mapa y comprueba que el menú de navegación aparece arriba.\n- Insertar proyectos. En «Videojuego y app» inserta el juego de Scratch (Insertar → Insertar código, con el código de la opción «Insertar» de la página del proyecto) y una captura de la app; en «Almacén automático», el enlace del circuito de Tinkercad y capturas o el vídeo del AGV desde su Drive. Cada proyecto con un texto breve: qué es, con qué se hizo y qué aprendió.\n- Cabecera animada. Crea una animación corta para la página de inicio: un GIF hecho con ezgif.com (subiendo 3-5 capturas de sus proyectos) o una animación con Canva para Educación exportada como GIF o MP4. Compara en la ficha A1 los formatos de animación web (GIF, vídeo MP4/WebM, animación CSS, SVG animado, Lottie) y las herramientas que los crean.\n- Problemas y soluciones. Anota en la ficha A1 (parte 4) al menos tres problemas encontrados y su solución. Ejemplos: el GIF pesa mucho y tarda en cargar → reducir tamaño y número de fotogramas; el juego de Scratch no aparece → usar el código «Insertar» y no el enlace normal; el vídeo de Drive no se ve → cambiar el permiso a «cualquier persona de la organización con el enlace».\n- Entregar. Entrega en la Tarea R3.1 el enlace de vista previa del sitio (o el de edición compartido con el docente) y la ficha A1. (Plantilla en el anexo A1.)\n- Moodle Centros: Tarea «R3.1 · Estructura del portfolio» (corrección Apto / No apto). Comprobar que el sitio está creado con todas las páginas y los proyectos insertados antes de seguir.\n- Evidencia: Sitio con las seis páginas y los proyectos insertados\n- Evidencia: Cabecera animada\n- Evidencia: Tabla de problemas y soluciones\n- Evidencia: Tarea R3.1 (Apto / No apto)\n\nHito 3: Licencias y créditos\nReto: Conocer los derechos de autor, elegir una licencia Creative Commons para tus proyectos y dar crédito a todo lo que no es tuyo en la página «Créditos y licencias». Tiempo orientativo: 1 sesión.\n- Derechos de autor en cinco ideas. Lee en la web de clase las ideas básicas de la Ley de Propiedad Intelectual: la obra es del autor desde que la crea, sin registrarla; derechos morales (reconocimiento, para siempre) y patrimoniales (explotación); el derecho de cita; las obras pasan a dominio público 70 años después de la muerte del autor; «está en Internet» no significa «es libre».\n- Creative Commons. Con el elegidor de licencias de Creative Commons (chooser-beta.creativecommons.org) decide qué licencia pondrá a su portfolio y a cada proyecto, y explica en la ficha A2 qué significan BY, SA, NC y ND. Recuerda que su juego de Scratch ya es CC BY-SA por las condiciones de Scratch y que las remezclas deben respetar la licencia original.\n- Créditos. Hace en la ficha A2 un inventario de todo lo que usa en la web y en sus proyectos y no es suyo (imágenes, sonidos, fuentes, ejemplos de código, la imagen de un robot industrial…). Sustituye lo que no tenga licencia por recursos de Openverse (openverse.org) o la biblioteca de Scratch y escribe los créditos con el formato TASL: Título, Autor, Fuente (enlace) y Licencia.\n- Página «Créditos y licencias». Crea la página en el portfolio con: la licencia elegida (con su icono y enlace), la tabla de créditos y una frase en el pie de todas las páginas («Contenido bajo licencia CC BY-SA 4.0, salvo los recursos indicados en Créditos»). (Plantilla en el anexo A2.)\n- Evidencia: Ficha A2, partes 1 y 2\n- Evidencia: Página «Créditos y licencias»\n\nHito 4: Web segura y publicación\nReto: Revisar la seguridad de tu cuenta y de tu web, publicarla y entregar el portfolio (Tarea R3.2). Tiempo orientativo: 1 sesión.\n- Tipos de ciberseguridad y de malware. Lee en la web de clase los tipos de ciberseguridad (física y lógica; activa y pasiva) y los tipos de malware (virus, gusano, troyano, ransomware, spyware, adware) con su forma de protección (antimalware actualizado, actualizaciones, no descargar de sitios dudosos, copias de seguridad). Completa la tabla de la ficha A2 (parte 3).\n- Proteger la cuenta. Revisa la seguridad de su cuenta del centro en myaccount.google.com → Seguridad (o lo que permita el centro): contraseña robusta, verificación en dos pasos si está disponible, dispositivos con sesión iniciada y cierre de sesión en ordenadores compartidos.\n- Lista «Mi web es segura». Antes de publicar, recorre la lista de la ficha A2: sin nombre completo, foto, dirección, teléfono, centro ni horarios; sin capturas con datos personales; permisos de los archivos de Drive revisados; recursos solo de fuentes fiables (sin plantillas o widgets de webs dudosas); la web se sirve por HTTPS (candado); no inserta encuestas ni campos que pidan datos.\n- Publicar. Pulsa «Publicar» en Google Sites y elige quién puede verla: por defecto, solo las personas de la organización (cuentas del centro) o lo que indique el docente. Comprueba la web publicada en una ventana de incógnito y en el móvil (vista previa móvil de Sites).\n- Entregar. Entrega en la Tarea R3.2 el enlace de la web publicada y la ficha A2 completa. (Plantilla en el anexo A2.)\n- Moodle Centros: Tarea «R3.2 · Portfolio publicado» (evaluada con rúbrica 1-3-5-7-10). Evaluar el portfolio publicado: estructura y alojamiento, animación y problemas resueltos, licencias y créditos, y seguridad.\n- Evidencia: Ficha A2, parte 3 y lista de seguridad\n- Evidencia: Web publicada\n- Evidencia: Tarea R3.2 (rúbrica)", "temporalizacion": "4 sesiones (trabajo autónomo)", "recursos": "Navegador con inspector, Ficha A1, Google Sites, ezgif.com o Canva para Educación, Elegidor de licencias CC, Openverse, Ficha A2, Cuenta de Google del centro", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nCYR.3.5.1.Conocer la construcción de aplicaciones informáticas y web, entendiendo su funcionamiento interno, de forma segura, responsable y respetuosa.\nCYR.3.5.2.Conocer y resolver la variedad de problemas potencialmente presentes en el desarrollo de una aplicación web, tratando de generalizar posibles soluciones.\nCYR.3.6.3.Reconocer y comprender los derechos de los materiales alojados en la web.\nCYR.3.6.4.Conocer las estrategias de ciberseguridad que garantizan protección a los usuarios de Internet.", "ejercicios": "Inspecciona una web e identifica cabecera, navegación, contenido principal y pie.\nExplica para qué sirven HTML, CSS y JavaScript.\nClasifica tipos de servidores web y di dónde se aloja tu portfolio.\nDibuja el mapa de tu portfolio.\nCrea el portfolio en Google Sites con las seis páginas.\nInserta el juego de Scratch, la app y el almacén automático.\nCrea una cabecera animada y compara formatos de animación web.\nAnota tres problemas y su solución.\nExplica qué son los derechos morales y patrimoniales y cuándo una obra pasa a dominio público.\nElige una licencia Creative Commons para tu portfolio y justifícala.\nHaz el inventario de recursos ajenos y escribe sus créditos con el formato TASL.\nClasifica los tipos de ciberseguridad y de malware con su protección.\nRevisa la seguridad de tu cuenta del centro.\nRecorre la lista «Mi web es segura» y publica tu portfolio.", "metodologias": "Aprendizaje por descubrimiento, Trabajo autónomo guiado, Aprender haciendo, Ciclo de diseño iterativo, Ciudadanía digital, Evaluación formativa", "sesiones": [1, 2, 3, 4]}, {"titulo": "Datos e inteligencia artificial", "tipo": "Conclusión", "abreviatura": "CON1", "orden": "2", "tarea": "R3.3 · Datos e inteligencia artificial", "descripcion": "Hito 5: Los datos detrás de mis proyectos\nReto: Descubrir los metadatos de tus propios archivos y proyectos y extraer una tabla de la web con data scraping para crear un gráfico en la página «Datos». Tiempo orientativo: 1 sesión.\n- Metadatos de mis archivos. Mira los metadatos de tres de sus archivos: las propiedades de una captura o del vídeo del juego (Windows: clic derecho → Propiedades → Detalles; o el panel de detalles de Drive), una fotografía de Wikimedia Commons (sección «Metadatos» al final de la página: cámara, fecha, a veces GPS) y su proyecto de Scratch (fecha de creación y de modificación, vistas, «me gusta», favoritos, remezclas). Los anota en el cuaderno A3.\n- Clasificar metadatos. Clasifica los metadatos encontrados en descriptivos (título, autor, etiquetas), estructurales (formato, tamaño, duración, resolución) y administrativos (fechas, licencia, permisos), y dónde se almacenan: dentro del archivo (EXIF de una foto), en el sistema de archivos o en la base de datos del servidor (Scratch, Drive). Reflexiona: ¿qué metadatos revelan algo personal (ubicación GPS de una foto hecha con el móvil) y cómo se borran?\n- Data scraping con una hoja de cálculo. En una hoja de cálculo de Google usa la función IMPORTHTML para traer una tabla de Wikipedia relacionada con sus proyectos: busca en es.wikipedia.org una página con una tabla de videojuegos o videoconsolas más vendidos, copia la dirección y escribe =IMPORTHTML(\"dirección\"; \"table\"; 1), cambiando el último número (1, 2, 3…) hasta que aparezca la tabla deseada. Limpia los datos si hace falta y crea un gráfico de barras con los 10 primeros.\n- Análisis crítico. Responde en el cuaderno A3: ¿de dónde salen los datos y de qué fecha son?, ¿qué conclusión saca el gráfico y qué no puede concluir?, ¿cuándo es legal y ético el scraping (datos públicos, respetar las condiciones de uso y el archivo robots.txt, no recoger datos personales, no saturar el servidor)?\n- Página «Datos». Inserta el gráfico en la página «Datos» del portfolio (Insertar → Gráficos, desde la hoja de cálculo), con la fuente citada y un texto con su conclusión y la tabla de metadatos de su juego. (Plantilla en el anexo A3.)\n- Evidencia: Cuaderno A3, partes 1 y 2\n- Evidencia: Hoja de cálculo con IMPORTHTML y gráfico\n- Evidencia: Página «Datos» del portfolio\n\nHito 6: Mi modelo de inteligencia artificial y entrega final\nReto: Entrenar un modelo de aprendizaje automático con Teachable Machine, analizar sus errores y su ética, completar la página «Inteligencia artificial» y entregar el producto final (Tarea R3.3). Tiempo orientativo: 1-2 sesiones.\n- La IA hoy. Lee en la web de clase ejemplos actuales de IA (recomendaciones de vídeos, traductores, asistentes de texto e imagen, coches con ayudas a la conducción) y la diferencia entre un agente inteligente simple (percibe → decide → actúa con reglas, como su AGV de la SdA R2) y el aprendizaje automático (aprende de ejemplos).\n- Entrenar el modelo. En teachablemachine.withgoogle.com crea un «Proyecto de imagen» con tres clases para controlar su videojuego por gestos: «Izquierda» (mano a la izquierda), «Derecha» (mano a la derecha) y «Nada» (sin mano). Graba unas 50 imágenes por clase con la webcam, solo de la mano (nunca de la cara), o sube imágenes de objetos si no tiene webcam. Pulsa «Entrenar modelo» y pruébalo en la vista previa.\n- Buscar los fallos. Prueba el modelo cambiando la iluminación, el fondo, la distancia o la otra mano y anota en el cuaderno A3 cuándo falla y por qué (los datos de entrenamiento no representaban esa situación: sesgo). Reentrena añadiendo ejemplos variados y compara la mejora.\n- Publicar y reflexionar. Exporta el modelo («Exportar modelo» → «Subir mi modelo»: se sube el modelo, no las imágenes) y pone el enlace en la página «Inteligencia artificial» con una captura y su reflexión ética: sesgos, privacidad de los datos de entrenamiento, deepfakes y desinformación, y una «declaración de uso de IA» en la que dice si ha usado alguna herramienta de IA en las SdA de recuperación y para qué.\n- Revisión final y entrega. Repasa todo el portfolio, se autoevalúa con las rúbricas de R3.2 y R3.3 y entrega en la Tarea R3.3 el enlace de la web y el cuaderno A3. (Plantilla en el anexo A3.)\n- Defensa breve (opcional, a criterio del docente). Si el docente lo considera conveniente para comprobar la autoría y que el alumno domina lo que ha hecho, le pide 5-10 minutos para recorrer el portfolio, explicar la fórmula IMPORTHTML y probar el modelo de IA en directo. Si el alumno no sabe explicar su trabajo, el docente puede pedirle que lo rehaga o ajustar las líneas de la rúbrica afectadas.\n- Moodle Centros: Tarea «R3.3 · Datos e inteligencia artificial» (evaluada con rúbrica 1-3-5-7-10). Evaluar las páginas «Datos» e «Inteligencia artificial» del portfolio y el cuaderno A3.\n- Evidencia: Modelo de Teachable Machine publicado\n- Evidencia: Página «Inteligencia artificial»\n- Evidencia: Cuaderno A3 completo", "temporalizacion": "2 sesiones (trabajo autónomo)", "recursos": "Hojas de cálculo de Google, Wikipedia y Wikimedia Commons, Cuaderno A3, Teachable Machine, Webcam (o imágenes)", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nCYR.3.4.1.Conocer la naturaleza de los distintos tipos de datos generados hoy en día, siendo capaces de analizarlos, visualizarlos y compararlos, empleando a su vez un espíritu crítico y científico.\nCYR.3.4.2.Comprender los principios básicos de funcionamiento de los agentes inteligentes y de las técnicas de aprendizaje automático, con objeto de aplicarlos para la resolución de situaciones mediante la Inteligencia Artificial de forma ética y responsable.\nCYR.3.4.3.Comprender los principios básicos de funcionamiento del Data Scraping.", "ejercicios": "Localiza los metadatos de tres archivos o proyectos tuyos y clasifícalos en descriptivos, estructurales y administrativos.\nImporta una tabla de Wikipedia con IMPORTHTML y crea un gráfico.\nAnaliza de forma crítica la fuente y las conclusiones del gráfico.\nExplica cuándo el data scraping es legal y ético.\nDiferencia un agente inteligente simple del aprendizaje automático con un ejemplo de tus SdA.\nEntrena un modelo de imagen con tres clases en Teachable Machine.\nPrueba el modelo en situaciones distintas, explica sus fallos y reentrénalo.\nEscribe una reflexión ética y tu declaración de uso de IA.", "metodologias": "Aprendizaje por descubrimiento, Pensamiento crítico, Aprender haciendo, Metacognición", "sesiones": [5, 6]}]}};
const S = DATA.sa, CUR = DATA.cur, IDX = DATA.idx;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':''); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Hitos donde se trabaja</div><p>${ses.map(n=>'H'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

/* ---------- cabecera ---------- */
const M = S.meta;
$('#h-kicker').textContent = `LOMLOE · Andalucía · ${IDX.materiasTxt} · ${M.curso_texto || ''}`;
$('#h-title').textContent = M.titulo; $('#h-sub').textContent = M.subtitulo || '';
$('#h-meta').innerHTML = [ `${S.sesiones.length} hitos de trabajo autónomo`, M.agrupamiento, M.temporalizacion, M.anio_academico ].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');

/* ---------- pestañas ---------- */
const TABS = [['vision','1. Visión general'],['seq','2. Secuenciación'],['map','3. Mapeo curricular'],['moodle','4. Moodle Centros'],['dua','5. DUA y diversidad'],['eval','6. Evaluación'],['seneca','7. Para Séneca']];
$('#tabs').innerHTML = TABS.map(([id,t],i)=>`<button role="tab" data-tab="${id}" aria-selected="${i===0}">${t}</button>`).join('');
$('#main').innerHTML = TABS.map(([id],i)=>`<section class="panel ${i===0?'on':''}" id="p-${id}" role="tabpanel"></section>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+b.dataset.tab)); try{localStorage.setItem('sda-tab',b.dataset.tab)}catch(_){} };
try{ const t = localStorage.getItem('sda-tab'); if(t){ const b = document.querySelector(`#tabs button[data-tab="${t}"]`); b && b.click(); } }catch(_){}
function openAll(){ document.querySelectorAll('details.ses').forEach(d=>d.open=true); }

/* ---------- 1. visión ---------- */
(function(){
  const V = S.vision || {};
  const rec = S.recursos || {};
  $('#p-vision').innerHTML = `<div class="grid g3"><div class="grid">
    <div class="card"><h2>Descripción y contexto</h2><p>${esc(V.descripcion)}</p><p>${esc(V.contexto)}</p></div>
    <div class="card"><h2>Justificación curricular</h2><p>${esc(V.justificacion)}</p>
      <div class="lab">Competencias específicas</div>${chips(IDX.competencias)}
      <div class="lab">Criterios de evaluación</div>${chips(IDX.criterios)}
      <div class="lab">Saberes básicos</div>${chips(IDX.saberes)}
      <div class="lab">Descriptores del Perfil de salida</div>${chips(IDX.descriptores)}</div>
    <div class="card reto"><h2>El reto</h2><p><i>${esc(V.reto)}</i></p><div class="lab">Pregunta guía</div><p class="q">${esc(V.pregunta_guia)}</p></div>
    <div class="card"><h2>Producto final</h2><p>${esc(V.producto_final)}</p></div>
  </div><div class="grid" style="align-content:start">
    <div class="card"><h2>Metodologías</h2>${arr(S.metodologias).map(m=>`<p><b>${esc(m.nombre)}</b>${m.descripcion?': '+esc(m.descripcion):''}</p>`).join('')}</div>
    <div class="card"><h2>Recursos</h2>${Array.isArray(rec)?ul(rec):Object.entries(rec).map(([k,v])=>`<div class="lab">${esc(k)}</div>${ul(v)}`).join('')}</div>
  </div></div>`;
})();

/* ---------- 2. secuenciación ---------- */
(function(){
  const COLORS = ['#0f766e','#1d4ed8','#7c3aed','#b45309','#be123c'];
  const fases = arr(S.fases);
  const total = S.sesiones.length;
  const fcol = {}; fases.forEach((f,i)=>fcol[f.nombre]=COLORS[i%COLORS.length]);
  const count = f => S.sesiones.filter(s=>s.fase===f.nombre).length;
  let h = `<div class="card"><h2>Distribución temporal</h2><div class="timeline">${fases.map(f=>`<div style="flex:${count(f)};background:${fcol[f.nombre]}">${esc(f.nombre)} · ${count(f)} ses.</div>`).join('')}</div>
    <div class="grid g2" style="margin-top:12px">${fases.map(f=>`<div><b style="color:${fcol[f.nombre]}">${esc(f.nombre)}</b> (hitos ${esc(f.sesiones||'')}) — ${esc(f.finalidad||'')} · ${Math.round(count(f)/total*100)} %</div>`).join('')}</div></div>`;
  const duaSet = [...new Set(S.sesiones.flatMap(s=>arr(s.dua && s.dua.principios)))];
  h += `<div class="filters" id="ff"><span class="legend">Fase:</span><button class="on" data-f="*">Todas</button>${fases.map(f=>`<button data-f="${esc(f.nombre)}">${esc(f.nombre)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">DUA:</span>${duaSet.map(d=>`<button data-d="${esc(d)}">${esc(d)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">Moodle:</span><button data-m="1">Con actividad Moodle</button>
    <button data-open="1" style="margin-left:auto">Desplegar todas</button></div><div id="slist"></div>`;
  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){
    const list = S.sesiones.filter(s => (state.f==='*'||s.fase===state.f) && (!state.d || arr(s.dua&&s.dua.principios).includes(state.d)) && (!state.m || arr(s.moodle).length));
    $('#slist').innerHTML = list.map(s => `<details class="ses" data-n="${s.n}"><summary><div class="num" style="background:${fcol[s.fase]}22;color:${fcol[s.fase]}">${s.n}</div>
      <div><div class="stitle">Hito ${s.n} · ${esc(s.titulo)} <span class="badge">${esc(s.fase)}</span>${arr(s.moodle).length?'<span class="badge" style="background:var(--moodle-bg);color:var(--moodle)">Moodle</span>':''}</div><div class="sreto">${esc(s.reto)}</div></div></summary>
      <div class="sbody"><div>${arr(s.actividades).map(a=>`<div class="act"><b>${esc(a.nombre)}</b><span class="min">${a.min?esc(a.min)+' min':''}</span><p>${esc(a.desc)}</p></div>`).join('')}
        ${arr(s.moodle).length?`<div class="moodle"><div class="mh">Integración con Moodle Centros</div>${arr(s.moodle).map(m=>`<div class="mitem"><div class="mt">${esc(m.recurso)} · «${esc(m.nombre)}»${corrBadge(m)}${m.criterio?' '+chip(m.criterio):''}</div><p>${esc(m.uso)}</p>${m.correccion==='apto'?`<div class="lab">Se verifica</div>${ul(m.cotejo)}`:''}${m.correccion==='rubrica'?`<p class="note">Se evalúa con la rúbrica de la pestaña «6. Evaluación».</p>`:''}${arr(m.config).length?`<div class="lab">Configuración</div>`+ul(m.config):''}</div>`).join('')}</div>`:''}
      </div><div class="side">
        <div class="lab">Criterios</div>${arr(s.criterios).length?chips(s.criterios):'<span class="note">Evaluación diagnóstica (no calificable)</span>'}
        <div class="lab">Saberes</div>${chips(s.saberes)}
        ${arr(s.metodologia).length?`<div class="lab">Metodología</div><p>${arr(s.metodologia).map(esc).join(' · ')}</p>`:''}
        ${arr(s.evidencias).length?`<div class="lab">Evidencias</div>${ul(s.evidencias)}`:''}
        ${arr(s.recursos).length?`<div class="lab">Recursos</div><p>${arr(s.recursos).map(esc).join(' · ')}</p>`:''}
        ${s.dua?`<div class="lab">DUA (${arr(s.dua.principios).map(esc).join(', ')})</div><p>${esc(s.dua.medidas)}</p>`:''}
      </div></div></details>`).join('') || '<p class="note">Ningún hito coincide con el filtro.</p>';
  }
  $('#ff').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.open){ openAll(); return; }
    if(b.dataset.f){ state.f=b.dataset.f; $('#ff').querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); }
    if(b.dataset.d){ state.d = state.d===b.dataset.d?null:b.dataset.d; $('#ff').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===state.d)); }
    if(b.dataset.m){ state.m=!state.m; b.classList.toggle('on',state.m); }
    render(); };
  render();
})();

/* ---------- 3. mapeo ---------- */
(function(){
  const used = new Set(IDX.saberes);
  const inst = (S.evaluacion && S.evaluacion.instrumentos) || {};
  let h = `<div class="card"><h2>Matriz curricular</h2><p class="legend">Los saberes tachados están vinculados oficialmente al criterio pero no se movilizan en esta situación de aprendizaje.</p><div class="scroll"><table class="tbl"><thead><tr><th>Competencia</th><th>Criterio</th><th>Saberes</th><th>Descriptores</th><th>Sesiones</th><th>Instrumentos</th></tr></thead><tbody>`;
  IDX.criterios.forEach(c => { const it = CUR[c]; const ce = CUR[it.competencia];
    h += `<tr><td>${chip(it.competencia)}<div class="note">${esc(ce.texto)}</div></td><td>${chip(c)}<div class="note">${esc(it.texto)}</div></td>
      <td>${arr(it.saberes).map(s=>chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}</td><td>${chips(ce.descriptores)}</td>
      <td>${(IDX.sesionesPorCriterio[c]||[]).map(n=>'H'+n).join(', ')}</td><td>${ul(inst[c])}</td></tr>`; });
  h += `</tbody></table></div></div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Criterios trabajados por hito</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${S.sesiones.map(s=>`<th>H${s.n}</th>`).join('')}</tr></thead><tbody>`;
  IDX.criterios.forEach(c => { h += `<tr><td>${chip(c)}</td>${S.sesiones.map(s=>`<td class="tick">${arr(s.criterios).includes(c)?'✔':''}</td>`).join('')}</tr>`; });
  h += `</tbody></table></div></div>`;
  if(arr(S.notas_rigor).length) h += `<div class="card" style="margin-top:16px"><h2>Notas de rigor curricular</h2>${ul(S.notas_rigor)}</div>`;
  $('#p-map').innerHTML = h;
})();

/* ---------- 4. moodle ---------- */
(function(){
  const Mo = S.moodle || {};
  const all = S.sesiones.flatMap(s => arr(s.moodle).map(m => ({...m, n:s.n})));
  let h = `<div class="grid g2"><div class="card"><h2>Estructura del curso</h2>${Mo.estructura?`<p>${esc(Mo.estructura)}</p>`:''}${arr(Mo.secciones).map(sec=>`<div class="lab">${esc(sec.nombre)}</div>${ul(sec.elementos)}`).join('')}</div>
    <div class="card"><h2>Libro de calificaciones</h2>${Mo.calificaciones?`<p>${esc(Mo.calificaciones)}</p>`:''}
      <table class="tbl"><thead><tr><th>Criterio</th><th>Elementos calificables en Moodle</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${all.filter(m=>m.calificable && m.criterio===c).map(m=>`H${m.n} · ${esc(m.recurso)} «${esc(m.nombre)}»`).join('<br>') || '<span class="note">Se califica fuera de Moodle (observación, exposición…)</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(Mo.configuracion).length) h += `<div class="card" style="margin-top:16px"><h2>Configuración general recomendada</h2>${ul(Mo.configuracion)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Todas las actividades de Moodle</h2><div class="scroll"><table class="tbl"><thead><tr><th>Hito</th><th>Recurso</th><th>Nombre</th><th>Corrección</th><th>Para qué</th><th>Configuración clave</th></tr></thead><tbody>${all.map(m=>`<tr><td>H${m.n}</td><td>${esc(m.recurso)}</td><td>${esc(m.nombre)}${m.criterio?' '+chip(m.criterio):''}</td><td>${corrBadge(m)||'—'}</td><td>${esc(m.uso)}</td><td>${ul(m.config)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#p-moodle').innerHTML = h;
})();

/* ---------- 5. DUA ---------- */
(function(){
  const D = S.dua || {};
  let h = `<div class="grid g2">${Object.entries(D).map(([k,v])=>`<div class="card"><h2>${esc(k)}</h2>${ul(v)}</div>`).join('')}</div>`;
  if(arr(S.diversidad).length) h += `<div class="card" style="margin-top:16px"><h2>Atención a la diversidad</h2><table class="tbl"><thead><tr><th>Perfil</th><th>Medidas concretas</th></tr></thead><tbody>${S.diversidad.map(d=>`<tr><td><b>${esc(d.perfil)}</b></td><td>${esc(d.medidas)}</td></tr>`).join('')}</tbody></table></div>`;
  if(arr(S.roles).length) h += `<div class="card" style="margin-top:16px"><h2>Roles del equipo</h2><table class="tbl"><tbody>${S.roles.map(r=>`<tr><td><b>${esc(r.rol)}</b></td><td>${esc(r.funcion)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#p-dua').innerHTML = h;
})();

/* ---------- 6. evaluación ---------- */
(function(){
  const E = S.evaluacion || {};
  let st = {}; try{ st = JSON.parse(localStorage.getItem('sda-cotejo-'+M.titulo)||'{}'); }catch(_){}
  let h = `<div class="card"><h2>Lista de cotejo interactiva</h2><p class="note">Marca los indicadores logrados; el progreso se calcula por criterio y se guarda en este navegador.</p>
    <div class="grid g2">${arr(E.cotejo).map((g,gi)=>`<div class="side"><span class="pct" data-p="${gi}"></span>${chip(g.criterio)}<div class="bar"><div data-b="${gi}"></div></div><ul class="cot" style="padding:0">${arr(g.indicadores).map((t,i)=>`<li><label><input type="checkbox" data-k="${gi}-${i}" ${st[gi+'-'+i]?'checked':''}> <span>${esc(t)}</span></label></li>`).join('')}</ul></div>`).join('')}</div>
    <button class="copy" id="cot-reset" style="margin-top:10px">Borrar marcas</button></div>`;
  const TR = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='rubrica').map(m=>({...m,n:x.n})));
  const TA = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='apto').map(m=>({...m,n:x.n})));
  const PTS = [1,3,5,7,10];
  if(TR.length) h += `<div class="card" style="margin-top:16px"><h2>Rúbricas de las tareas finales</h2><p class="note">Cada línea se puntúa con 1, 3, 5, 7 o 10 puntos y la nota es la media (ponderada cuando la línea indica su peso). Pulsa una casilla para calcular la nota de un estudiante (no se guarda).</p>${TR.map((m,ti)=>`<h3>${tname(m)} ${chips([...new Set(arr(m.rubrica).map(l=>l.criterio||m.criterio))])} <span class="pct" data-rn="${ti}"></span></h3><div class="scroll"><table class="tbl rub" data-t="${ti}"><thead><tr><th>Línea</th>${PTS.map(p=>`<th>${p} pto</th>`).join('')}</tr></thead><tbody>${arr(m.rubrica).map((l,li)=>`<tr><td><b>${esc(l.linea)}</b>${l.criterio?`<br><small>${esc(l.criterio)}</small>`:''}${l.peso?`<br><small>peso ${String(l.peso).replace('.',',')} %</small>`:''}</td>${arr(l.niveles).map((x,k)=>`<td class="rc" data-l="${li}" data-w="${l.peso||1}" data-c="${esc(l.criterio||m.criterio||'')}" data-p="${PTS[k]}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
  if(TA.length) h += `<div class="card" style="margin-top:16px"><h2>Tareas de verificación (Apto / No apto)</h2><p class="note">Es Apto si se cumplen todos los elementos.</p><div class="grid g2">${TA.map(m=>`<div class="side"><b>${tname(m)}</b> ${chip(m.criterio)}${ul(m.cotejo)}</div>`).join('')}</div></div>`;
  if(arr(E.rubrica).length){ const niv = E.niveles || ['Insuficiente (1-4)','Suficiente / Bien (5-6)','Notable (7-8)','Sobresaliente (9-10)'];
    h += `<div class="card" style="margin-top:16px"><h2>Rúbrica</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${niv.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${E.rubrica.map(r=>`<tr><td>${chip(r.criterio)}</td>${arr(r.niveles).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; }
  if(E.agentes) h += `<div class="card" style="margin-top:16px"><h2>Agentes e instrumentos</h2>${Object.entries(E.agentes).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;
  $('#p-eval').innerHTML = h;
  const sel = {};
  $('#p-eval').addEventListener('click', e => { const c = e.target.closest('td.rc'); if(!c) return; const t = c.closest('table').dataset.t;
    c.parentElement.querySelectorAll('td.rc').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    sel[t] = sel[t]||{}; sel[t][c.dataset.l] = [+c.dataset.p, +c.dataset.w]; const v = Object.values(sel[t]); const nl = c.closest('tbody').rows.length;
    const wt = [...c.closest('tbody').rows].reduce((a,r)=>a+(+r.querySelector('td.rc').dataset.w),0);
    document.querySelector(`[data-rn="${t}"]`).textContent = `Nota: ${(v.reduce((a,[p,w])=>a+p*w,0)/wt).toFixed(1)}` + (()=>{ const rs=[...c.closest('tbody').rows].map(r=>r.querySelector('td.rc').dataset); const cs=[...new Set(rs.map(d=>d.c))]; if(cs.length<2) return ''; return ' · ' + cs.map(k=>{ const ws=rs.filter(d=>d.c===k).reduce((a,d)=>a+(+d.w),0); const pt=Object.entries(sel[t]).filter(([i])=>rs[i].c===k).reduce((a,[,x])=>a+x[0]*x[1],0); return k+': '+(pt/ws).toFixed(1); }).join(' · '); })() + (v.length<nl?` (faltan ${nl-v.length} líneas)`:''); });
  function upd(){ arr(E.cotejo).forEach((g,gi)=>{ const n = arr(g.indicadores).length; const k = arr(g.indicadores).filter((_,i)=>st[gi+'-'+i]).length; const p = n?Math.round(k/n*100):0;
    document.querySelector(`[data-b="${gi}"]`).style.width = p+'%'; document.querySelector(`[data-p="${gi}"]`).textContent = p+' %'; }); }
  function save(){ try{ localStorage.setItem('sda-cotejo-'+M.titulo, JSON.stringify(st)); }catch(_){} }
  $('#p-eval').addEventListener('change', e => { const k = e.target.dataset.k; if(k){ st[k]=e.target.checked; save(); upd(); } });
  $('#cot-reset').onclick = () => { st = {}; save(); document.querySelectorAll('#p-eval input[type=checkbox]').forEach(x=>x.checked=false); upd(); };
  upd();
})();

/* ---------- 7. Séneca ---------- */
(function(){
  const SE = DATA.seneca;
  const box = (t, txt) => `<div class="copybox"><div class="ch"><span>${esc(t)}</span><button class="copy">Copiar</button></div><pre>${esc(txt)}</pre></div>`;
  let h = `<div class="card"><h2>Textos listos para pegar en Séneca</h2><p class="note">Séneca guarda texto plano: estos bloques no llevan formato Markdown. Copia cada campo en su casilla del formulario de la situación de aprendizaje.</p>
    ${box('Título', SE.titulo)}${box('Temporalización', SE.temporalizacion)}${box('Justificación', SE.justificacion)}${box('Producto final', SE.producto_final)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Concreción curricular</h2><p class="note">En Séneca se marcan en las listas; aquí tienes la selección para comprobarla.</p>${SE.concrecion.map(m=>box(m.materia, m.texto)).join('')}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Actividades (formulario «Detalle de la actividad»)</h2><p class="note">Los campos siguen el orden del formulario de Séneca. Solo hay una actividad por cada Tarea de Moodle evaluada con rúbrica. En «Vinculación criterios de evaluación» elige la única trazabilidad indicada y pasa esos criterios a «seleccionados» (es obligatorio).</p>${SE.actividades.map(a=>`<h3>${esc(a.orden)}. ${esc(a.titulo)} <span class="badge">${esc(a.tipo)}</span> <span class="badge">${esc(a.abreviatura)}</span> <span class="badge">Tarea ${esc(a.tarea)}</span></h3>${box('Título de la actividad', a.titulo)}${box('Tipo de actividad', a.tipo)}${box('Abreviatura', a.abreviatura)}${box('Orden de la presentación', a.orden)}${box('Descripción', a.descripcion)}${box('Temporalización', a.temporalizacion)}${box('Recursos', a.recursos)}${box('Descriptores operativos', a.descriptores)}${box('Vinculación criterios de evaluación', a.vinculacion)}${box('Ejercicios', a.ejercicios)}${box('Metodologías', a.metodologias)}`).join('')}</div>`;
  $('#p-seneca').innerHTML = h;
})();
</script>
</body>
</html>
