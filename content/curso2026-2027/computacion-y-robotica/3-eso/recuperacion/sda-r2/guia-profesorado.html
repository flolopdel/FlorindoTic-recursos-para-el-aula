<html lang="es">
<head>

<title>Proyecto de recuperación R2: Almacén automático y app móvil</title>
<style>
:root{

    --bg:#0b1220; --card:#111a2e; --ink:#e2e8f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#1e293b;
    --brand:#2dd4bf; --brand2:#5eead4; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
    --warn-bg:#2a1f05; --warn-line:#a16207; --warn-ink:#fde68a;
    --ce:#93c5fd; --ce-bg:#1e3a8a; --cr:#fdba74; --cr-bg:#7c2d12; --sb:#86efac; --sb-bg:#14532d; --de:#d8b4fe; --de-bg:#581c87;
    --moodle:#fdba74; --moodle-bg:#2a1608; --head1:#042f2e; --head2:#172554;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2e; --ink:#e2e8f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#1e293b;
  --brand:#2dd4bf; --brand2:#5eead4; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
  --warn-bg:#2a1f05; --warn-line:#a16207; --warn-ink:#fde68a;
  --ce:#93c5fd; --ce-bg:#1e3a8a; --cr:#fdba74; --cr-bg:#7c2d12; --sb:#86efac; --sb-bg:#14532d; --de:#d8b4fe; --de-bg:#581c87;
  --moodle:#fdba74; --moodle-bg:#2a1608; --head1:#042f2e; --head2:#172554;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;padding:28px 0 36px}
header .kicker{font-size:13px;opacity:.85;letter-spacing:.02em}
header h1{margin:8px 0 4px;font-size:clamp(24px,4vw,36px);line-height:1.15}
header .sub{margin:0;opacity:.9;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.meta span{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-size:13px}
.hbtns{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
.btn:hover{background:rgba(255,255,255,.26)}
.notice{margin-top:-18px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:12px 16px;font-size:14px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:16px 0 4px}
nav.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
main{padding:12px 0 48px}
.panel{display:none}.panel.on{display:block}
.grid{display:grid;gap:16px}
@media(min-width:900px){.g3{grid-template-columns:2fr 1fr}.g2{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h2{margin:0 0 10px;font-size:19px}
.card h3{margin:14px 0 6px;font-size:15px}
.card p{margin:6px 0;color:var(--ink2)}
.reto{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;border:0}
.reto p{color:#fff}.reto .q{font-size:19px;font-weight:700}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:10px}
.reto .lab{color:rgba(255,255,255,.8)}
ul.clean{margin:6px 0;padding-left:18px;color:var(--ink2)}ul.clean li{margin:3px 0}
.chip{display:inline-flex;align-items:center;border:0;border-radius:6px;padding:2px 8px;margin:2px 3px 2px 0;font:600 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
.chip:hover{filter:brightness(.95);text-decoration:underline}
.chip.ce{background:var(--ce-bg);color:var(--ce)}.chip.cr{background:var(--cr-bg);color:var(--cr)}
.chip.sb{background:var(--sb-bg);color:var(--sb)}.chip.de{background:var(--de-bg);color:var(--de)}
.chip.off{opacity:.55;text-decoration:line-through}
.legend{font-size:13px;color:var(--muted)}
.timeline{display:flex;height:40px;border-radius:10px;overflow:hidden;margin-top:8px}
.timeline div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;padding:0 6px;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

details.ses>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
details.ses>summary::-webkit-details-marker{display:none}
.num{flex:none;width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand2);display:flex;align-items:center;justify-content:center;font-weight:800}
.stitle{font-weight:700}.sreto{color:var(--muted);font-size:14px}
.sbody{padding:0 18px 18px;display:grid;gap:16px}
@media(min-width:900px){.sbody{grid-template-columns:3fr 2fr}}
.act{border-left:3px solid var(--brand);padding:4px 0 4px 12px;margin:10px 0}
.act b{color:var(--ink)}.act .min{font-size:12px;color:var(--muted);margin-left:6px}
.act p{margin:2px 0;color:var(--ink2)}
.side{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14px}
.side .lab:first-child{margin-top:0}
.moodle{background:var(--moodle-bg);border:1px solid var(--line);border-left:4px solid var(--moodle);border-radius:10px;padding:10px 14px;margin-top:12px}
.moodle .mh{color:var(--moodle);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.mitem{margin:8px 0}.mitem .mt{font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.scroll{overflow-x:auto}
.tick{text-align:center;color:var(--brand);font-weight:800}
.cot li{list-style:none;margin:6px 0}.cot label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--brand);width:0;transition:width .2s}
.pct{float:right;font-size:12px;font-weight:700;color:var(--brand)}
.copybox{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.copybox .ch{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:6px 12px;font-size:13px;font-weight:700}
.copybox pre{margin:0;padding:10px 12px;white-space:pre-wrap;font:13px/1.5 system-ui,sans-serif;color:var(--ink2)}
.copy{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.note{font-size:13px;color:var(--muted)}
td.rc{cursor:pointer;font-size:13px}td.rc:hover{background:var(--bg)}td.rc.on{background:var(--brand-soft);outline:2px solid var(--brand)}
.rub th{text-align:center}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
#modal .box{background:var(--card);color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#modal .mhd{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
#modal .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--brand)}
#modal h3{margin:2px 0 0;font-size:18px}
#modal .mbd{padding:16px 18px;color:var(--ink2)}
#modal .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
@media print{
  nav.tabs,.hbtns,.filters,.copy,#modal{display:none!important}
  .panel{display:block!important;page-break-before:always}.panel:first-of-type{page-break-before:auto}
  details.ses>.sbody{display:grid!important}
  body{background:#fff}
}
</style>

 automático es un ejemplo cercano de computación física y robótica: sensores, actuadores, robots y vehículos que se guían solos. El simulador permite construir y programar un sistema real sin material, y la app móvil completa el trabajo con la programación orientada a eventos.", "reto": "«Una empresa de logística de Andalucía quiere automatizar su almacén y nos encarga el prototipo virtual del muelle de carga: detecta camiones, abre la puerta y avisa si hay peligro. Además, el estudio de videojuegos del proyecto R1 quiere la versión móvil de mi juego.»", "pregunta_guia": "¿Cómo perciben, deciden y actúan las máquinas automáticas… y cómo responde una app a lo que hace el usuario?", "producto_final": "Circuito del muelle de carga en Tinkercad Circuits programado en texto, con su informe técnico (conexiones, código, pruebas y sostenibilidad), la ficha de componentes y robots, y la app «Atrapa al personaje» de App Inventor (.aia) con su plantilla de planificación y pruebas."}, "metodologias": [{"nombre": "Aprendizaje basado en retos", "descripcion": "Un encargo realista (automatizar un almacén) dividido en dos subsistemas."}, {"nombre": "Trabajo autónomo guiado", "descripcion": "Guía por hitos en la guía del alumno con pasos, código comentado y lista de comprobación."}, {"nombre": "Ciclo de diseño iterativo", "descripcion": "Diseñar, simular, medir, corregir y documentar en el informe técnico."}, {"nombre": "Simulación", "descripcion": "Tinkercad Circuits sustituye al material físico y permite probar y corregir sin riesgo."}], "recursos": ["Ordenador con navegador", "Tinkercad Circuits (clase virtual del docente)", "MIT App Inventor y su emulador", "Google Docs del centro", "Moodle Centros", "Guía del alumno del proyecto"], "fases": [{"nombre": "Inicio", "sesiones": "1", "finalidad": "El encargo y los sistemas de computación física"}, {"nombre": "Desarrollo", "sesiones": "2-3", "finalidad": "Robots por dentro, primer circuito y muelle de carga"}, {"nombre": "Cierre", "sesiones": "4", "finalidad": "App móvil en App Inventor"}], "sesiones": [{"n": 1, "fase": "Inicio", "titulo": "El encargo y los componentes", "reto": "Entender el encargo, descubrir qué es un sistema de computación física y conocer sus componentes y microcontroladores. Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Leer el encargo", "desc": "El alumno lee el reto, los hitos y cómo se evalúa. Ve un vídeo corto de un almacén automatizado (robots que mueven estanterías, cintas clasificadoras) y anota en la ficha A1 cuatro máquinas que aparecen."}, {"nombre": "Entrada, proceso y salida", "desc": "Para cada máquina anota qué percibe (sensor), quién decide (microcontrolador u ordenador) y qué hace (actuador). Ejemplo: puerta automática del supermercado → sensor de presencia → microcontrolador → motor que abre la puerta."}, {"nombre": "Clasificar componentes", "desc": "Completa la parte 2 de la ficha A1: clasifica componentes de hardware en entrada (sensor de distancia, pulsador, sensor de temperatura), proceso (microcontrolador), salida (LED, zumbador, servo), alimentación y comunicación."}, {"nombre": "Tipos de microcontroladores", "desc": "Compara Arduino Uno, micro:bit y ESP32 en una tabla (programación, sensores incluidos, conexión wifi/Bluetooth, usos típicos) y el ciclo de vida del software: requisitos, diseño, programación, pruebas, mantenimiento."}, {"nombre": "Seguridad eléctrica y de hardware", "desc": "Lee en la guía del alumno por qué un LED necesita resistencia, qué es un cortocircuito y qué hacen un cortafuegos de hardware y un módulo de seguridad de hardware (HSM) en un almacén conectado. Lo resume en la ficha A1 (parte 3)."}, {"nombre": "Preparar Tinkercad", "desc": "Entra en Tinkercad con el enlace y el código de la clase virtual que le facilita el docente (sin correo personal) y abre un circuito nuevo. Si algo no funciona, lo pregunta en el foro."}], "criterios": ["CYR.3.1.1"], "saberes": ["CYR.3.F.1", "CYR.3.B.1", "CYR.3.F.2", "CYR.3.F.3", " 4"], "calificable": true, "codigo": "R2.2"}], "clase": {"pregunta": "¿Cómo sabe la puerta del muelle que ha llegado un camión?", "diapositivas": [{"tipo": "ejemplo", "icono": "🚗", "titulo": "El pitido al aparcar", "situacion": "Cuando un coche da marcha atrás, pita cada vez más rápido al acercarse a la pared.", "explicacion": "Usa un **sensor de ultrasonidos**: lanza un sonido que no oímos, mide cuánto tarda el eco y calcula la distancia. El de tu muelle funciona igual."}, {"tipo": "infografia", "titulo": "Así mide la distancia el ultrasonido", "svg": "<svg viewBox=\"0 0 640 200\" role=\"img\" aria-label=\"Eco del sensor de ultrasonidos\"><rect x=\"20\" y=\"70\" width=\"90\" height=\"60\" rx=\"8\" style=\"fill:var(--brand-soft);stroke:var(--brand)\"/><text x=\"65\" y=\"105\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px\">Sensor<\/text><rect x=\"520\" y=\"50\" width=\"100\" height=\"100\" rx=\"8\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><text x=\"570\" y=\"105\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px\">Camión<\/text><path d=\"M120 85 L510 85\" style=\"stroke:var(--accent);stroke-width:3;fill:none\" stroke-dasharray=\"8 6\"/><path d=\"M510 115 L120 115\" style=\"stroke:var(--brand);stroke-width:3;fill:none\" stroke-dasharray=\"8 6\"/><text x=\"315\" y=\"75\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px\">1. Sale el ultrasonido →<\/text><text x=\"315\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px\">← 2. Vuelve el eco<\/text><text x=\"320\" y=\"185\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px\">distancia = velocidad del sonido × tiempo ÷ 2<\/text><\/svg>"}, {"tipo": "infografia", "titulo": "Los tres requisitos del muelle", "elementos": [{"icono": "🚚", "titulo": "Camión < 50 cm", "texto": "Servo a 90° (abre) y LED verde"}, {"icono": "🚫", "titulo": "Sin camión", "texto": "Servo a 0° (cierra) y LED rojo"}, {"icono": "🔥", "titulo": "Temperatura > 40 °C", "texto": "Suena el zumbador"}]}, {"tipo": "codigo", "titulo": "Código guía 1/2: preparar (modo Texto)", "codigo": "#include <Servo.h>\nServo puerta;\nconst int TRIG = 7, ECHO = 6;  // distancia\nconst int VERDE = 4, ROJO = 5, ZUMB = 8;\n\nlong medirCm() {               // devuelve cm\n  digitalWrite(TRIG, LOW);  delayMicroseconds(2);\n  digitalWrite(TRIG, HIGH); delayMicroseconds(10);\n  digitalWrite(TRIG, LOW);\n  return pulseIn(ECHO, HIGH) * 0.01723;\n}\n\nvoid setup() {\n  puerta.attach(9);            // servo en el pin 9\n  pinMode(TRIG, OUTPUT); pinMode(ECHO, INPUT);\n  pinMode(VERDE, OUTPUT); pinMode(ROJO, OUTPUT);\n  pinMode(ZUMB, OUTPUT);\n  Serial.begin(9600);\n}", "explicacion": ["Copia este bloque al principio del programa.", "**medirCm()** lanza el ultrasonido y convierte el tiempo del eco en cm.", "Con el sensor de **3 pines**, usa el mismo pin para TRIG y ECHO."]}, {"tipo": "codigo", "titulo": "Código guía 2/2: decidir en loop()", "codigo": "void loop() {\n  long cm = medirCm();\n  float temp = (analogRead(A0) * 5.0 / 1024 - 0.5) * 100;\n  Serial.print(cm); Serial.print(\" cm  \");\n  Serial.println(temp);\n  if (cm < 50) {      // ¿hay camión?\n    // COMPLETA: abrir puerta y LED verde\n  } else {\n    // COMPLETA: cerrar puerta y LED rojo\n  }\n  // COMPLETA: si temp > 40, zumbador encendido;\n  //           si no, apagado\n  delay(200);\n}", "explicacion": ["Completa las tres líneas **COMPLETA**.", "**puerta.write(90)** abre; **puerta.write(0)** cierra.", "La línea de **temp** convierte la lectura del TMP36 en °C.", "Abre el **monitor serie** para ver distancia y temperatura."]}, {"tipo": "practica", "titulo": "Monta y programa el muelle", "enunciado": "Monta los componentes, copia el código guía en modo **Texto**, complétalo y comenta cada parte con tus palabras. Apunta las conexiones en el informe (A3).", "pasos": ["Primero la puerta (sensor + servo + LED).", "Después la temperatura (TMP36 + zumbador).", "Inicia la simulación después de cada parte."], "material": ["Plantilla A3 · Informe técnico del almacén"], "enlace": "https://docs.google.com/document/d/1gOxuZK4exAIq-x7SPorPJAWhg7hOv83kMpNmt-vCLys/copy"}, {"tipo": "practica", "titulo": "Prueba los tres requisitos", "enunciado": "Durante la simulación, haz clic en el sensor y **arrastra el objeto** para cambiar la distancia; haz clic en el TMP36 y **mueve la temperatura**. Anota cinco pruebas.", "pasos": ["Camión a 30 cm.", "Camión a 120 cm.", "Temperatura 25 °C y 45 °C.", "Camión cerca y 45 °C a la vez."]}, {"tipo": "quiz", "pregunta": "El zumbador suena siempre, haga la temperatura que haga. ¿Qué es lo más probable?", "opciones": ["El servo está mal conectado", "Falta el «else» que apaga el zumbador cuando temp ≤ 40", "El sensor de distancia no funciona"], "correcta": 1, "explicacion": "Si solo encendemos el zumbador en el «if» y nunca lo apagamos, se queda encendido. Hace falta **apagarlo** en el caso contrario."}, {"tipo": "comparar", "titulo": "Sostenibilidad del almacén", "columnas": [{"titulo": "Energía", "icono": "🔌", "puntos": ["Apagar lo que no se usa", "Sensores que «duermen»", "Placas solares en la nave"]}, {"titulo": "Materiales", "icono": "♻️", "puntos": ["Reutilizar placas y sensores", "Reciclar como RAEE", "Diseñar para reparar"]}, {"titulo": "Personas", "icono": "👷", "puntos": ["Menos tareas pesadas", "Nuevos empleos técnicos", "Formación necesaria"]}]}, {"tipo": "practica", "titulo": "Entrega el muelle", "enunciado": "Comparte el circuito y entrega el informe A3 completo (conexiones, código, pruebas y sostenibilidad) con el enlace.", "entrega": "Tarea R2.2 · Sistema del muelle de carga"}, {"tipo": "cierre", "puntos": ["Sensores → Arduino → actuadores.", "El programa en texto decide con «if / else».", "Un buen diseño también ahorra energía."], "siguiente": "Hito 4: la app de tu juego en App Inventor (Tarea R2.3)."}]}}, {"n": 4, "fase": "Cierre", "titulo": "La app de tu juego en App Inventor", "reto": "Crear una mini app móvil con el personaje del videojuego del proyecto R1 (atrapa al personaje) con eventos y un temporizador, entender cómo funciona por dentro y probarla en el emulador. Tiempo orientativo: 2 sesiones.", "actividades": [{"nombre": "Preparar el entorno", "desc": "Entra en ai2.appinventor.mit.edu con la cuenta de Google del centro. Instala el emulador siguiendo la guía oficial (aiStarter) o, si no puede instalar programas en su ordenador, avisa en el foro de dudas: el docente le dará una alternativa (probarla en un móvil del centro con la app MIT AI2 Companion)."}, {"nombre": "Diseñador: la interfaz", "desc": "En la vista Diseñador añade: un Lienzo (Canvas) con el fondo del juego, un SpriteImagen con el personaje de su juego, dos Etiquetas (puntos y tiempo), un Botón «Jugar» y un Reloj (Clock, en el cajón Sensores). Planifica antes en la plantilla A4 qué componentes usa y qué evento dispara cada acción."}, {"nombre": "Bloques: los eventos", "desc": "Programa los eventos: «cuando Botón.Clic» (pone puntos a 0, tiempo a 30 y activa el reloj); «cuando Reloj.Temporizador» (cada segundo mueve el sprite a un punto aleatorio del lienzo y resta 1 al tiempo; si tiempo = 0, desactiva el reloj y muestra «¡Fin! Puntos: …»); «cuando SpriteImagen.Tocado» (suma 1 punto y suena un sonido). Ampliación opcional: con un móvil real, usar el AcelerómetroSensor («cuando Agitado» reinicia la partida)."}, {"nombre": "Probar y explicar", "desc": "Prueba la app en el emulador (Conectar → Emulador) y anota tres pruebas en la plantilla A4. Escribe en la plantilla A4 (parte 4) cómo funciona la app por dentro: diferencia entre Diseñador y Bloques, qué es un componente, qué es un evento, qué hace el reloj como generador de eventos y qué es el archivo .aia (proyecto) frente al .apk (app instalable)."}, {"nombre": "Entregar", "desc": "Exporta el proyecto (Proyectos → Exportar proyecto seleccionado .aia) y entrega en la Tarea R2.3 el archivo .aia, una captura de los bloques, una captura de la app funcionando en el emulador y la plantilla A4. (Plantilla en la plantilla A4.)"}, {"nombre": "Defensa breve (opcional, a criterio del docente)", "desc": "Si el docente lo considera conveniente para comprobar la autoría y que el alumno domina lo que ha hecho, le pide 5-10 minutos para abrir el circuito y la app, explicar una parte del código C++ y un evento de la app, y hacer un cambio en directo (p. ej. que la puerta se abra a 30 cm). Si el alumno no sabe explicar su trabajo, el docente puede pedirle que lo rehaga o ajustar las líneas de la rúbrica afectadas."}], "criterios": ["CYR.3.2.2", "CYR.3.2.3", "CYR.3.6.2"], "saberes": ["CYR.3.D.1", "CYR.3.D.2", "CYR.3.D.3", "CYR.3.D.4", "CYR.3.D.5"], "metodologia": ["Aprender haciendo", "Ciclo de diseño iterativo"], "evidencias": ["Proyecto .aia", "Capturas de bloques y de la app funcionando", "Plantilla A4 completada"], "recursos": ["MIT App Inventor", "Emulador de App Inventor", "Plantilla A4"], "dua": {"principios": ["Andamiaje", "Acción y Expresión"], "medidas": "Bloques comentados paso a paso en la guía del alumno; alternativa de prueba en un móvil del centro si el emulador no se puede instalar."}, "ejercicios": ["Diseña la interfaz de la app con Lienzo, SpriteImagen, Etiquetas, Botón y Reloj.", "Programa los eventos Botón.Clic, Reloj.Temporizador y SpriteImagen.Tocado.", "Prueba la app en el emulador y anota tres pruebas.", "Explica la diferencia entre Diseñador y Bloques, y entre .aia y .apk (plantilla A4)."], "moodle": [{"recurso": "Tarea", "nombre": "R2.3 · App móvil «Atrapa al personaje»", "uso": "Evaluar la app móvil: interfaz, eventos, uso del reloj como sensor, pruebas y explicación de su funcionamiento interno.", "correccion": "rubrica", "criterio": "CYR.3.2.3", "rubrica": [{"linea": "Interfaz y componentes", "criterio": "CYR.3.2.2", "niveles": ["1 pto: la app no tiene los componentes pedidos o no se abre.", "3 ptos: faltan dos o más componentes (lienzo, sprite, etiquetas, botón, reloj).", "5 ptos: tiene todos los componentes, pero con nombres p n ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": ["CYR.3.2", "CYR.3.6"]}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": ["CYR.3.1", "CYR.3.3"]}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": ["CYR.3.1", "CYR.3.3", "CYR.3.2", "CYR.3.6"]}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": ["CYR.3.3"]}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["CYR.3.1", "CYR.3.6"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": []}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["CYR.3.3", "CYR.3.2"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["CYR.3.1", "CYR.3.3", "CYR.3.6"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": ["CYR.3.3", "CYR.3.2", "CYR.3.6"]}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": ["CYR.3.1"]}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": []}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": ["CYR.3.2", "CYR.3.6"]}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fia ugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": ["CYR.3.2"]}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": ["CYR.3.6"]}}, "idx": {"criterios": ["CYR.3.1.1", "CYR.3.1.2", "CYR.3.1.4", "CYR.3.3.1", "CYR.3.2.2", "CYR.3.2.3", "CYR.3.6.2"], "competencias": ["CYR.3.1", "CYR.3.3", "CYR.3.2", "CYR.3.6"], "saberes": ["CYR.3.B.1", "CYR.3.C.1", "CYR.3.C.2", "CYR.3.C.3", "CYR.3.C.4", "CYR.3.C.5", "CYR.3.F.1", "CYR.3.F.2", "CYR.3.F.3", "CYR.3.F.4", "CYR.3.I.4", "CYR.3.D.1", "CYR.3.D.2", "CYR.3.D.3", "CYR.3.D.4", "CYR.3.D.5"], "descriptores": ["CC3", "CC4", "CCEC3", "CCEC4", "CCL3", "CD1", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "CPSAA3", "STEM1", "STEM2", "STEM3", "STEM5"], "sesionesPorCriterio": {"CYR.3.1.1": [1, 2, 3], "CYR.3.1.2": [2], "CYR.3.6.2": [2, 3, 4], "CYR.3.3.1": [3], "CYR.3.1.4": [3], "CYR.3.2.2": [4], "CYR.3.2.3": [4]}, "porMateria": [{"codigo": "CYR", "criterios": ["CYR.3.1.1", "CYR.3.1.2", "CYR.3.1.4", "CYR.3.3.1", "CYR.3.2.2", "CYR.3.2.3", "CYR.3.6.2"], "competencias": ["CYR.3.1", "CYR.3.3", "CYR.3.2", "CYR.3.6"], "saberes": ["CYR.3.B.1", "CYR.3.C.1", "CYR.3.C.2", "CYR.3.C.3", "CYR.3.C.4", "CYR.3.C.5", "CYR.3.F.1", "CYR.3.F.2", "CYR.3.F.3", "CYR.3.F.4", "CYR.3.I.4", "CYR.3.D.1", "CYR.3.D.2", "CYR.3.D.3", "CYR.3.D.4", "CYR.3.D.5"], "descriptores": ["CC3", "CC4", "CCEC3", "CCEC4", "CCL3", "CD1", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "CPSAA3", "STEM1", "STEM2", "STEM3", "STEM5"]}], "materiasTxt": "Computación y Robótica"}, "seneca": {"titulo": "Proyecto de recuperación R2: Almacén automático y app móvil", "temporalizacion": "6 sesiones (trabajo autónomo organizado en 4 hitos)", "justificacion": "Proyecto de recuperación trabajado de forma autónoma por hitos. El alumno estudia los componentes de los sistemas de computación física y de los robots, construye y programa en texto el sistema automático de un muelle de carga en Tinkercad Circuits y crea una app móvil guiada por eventos en MIT App Inventor.", "producto_final": "Circuito del muelle de carga en Tinkercad Circuits programado en texto, con su informe técnico (conexiones, código, pruebas y sostenibilidad), la ficha de componentes y robots, y la app «Atrapa al personaje» de App Inventor (.aia) con su plantilla de planificación y pruebas.", "concrecion": [{"materia": "Computación y Robótica", "texto": "COMPETENCIAS ESPECÍFICAS\nCYR.3.1.Comprender el impacto que la computación y la robótica tienen en nuestra sociedad y desarrollar el pensamiento computacional para realizar proyectos de construcción de sistemas digitales de forma sostenible.\nCYR.3.3.Diseñar y construir sistemas de computación físicos o robóticos sencillos, aplicando los conocimientos necesarios para desarrollar soluciones automatizadas a problemas planteados.\nCYR.3.2.Producir programas informáticos, colaborando en un equipo de trabajo y creando aplicaciones sencillas, mediante lenguaje de bloques, utilizando las principales estructuras de un lenguaje de programación para solventar un problema determinado o exhibir un comportamiento deseado.\nCYR.3.6.Conocer y aplicar los principios de la ciberseguridad, adoptando hábitos y conductas de seguridad, para permitir la protección del individuo en su interacción en la red.\n\nCRITERIOS DE EVALUACIÓN\nCYR.3.1.1.Comprender el funcionamiento de los sistemas de computación física, sus componentes y principales características.\nCYR.3.1.2.Reconocer los conceptos básicos de la robótica, así como las configuraciones morfológicas más comunes.\nCYR.3.1.4.Comprender los principios de ingeniería en los que se basan los robots, su funcionamiento, componentes y características.\nCYR.3.3.1.Ser capaz de construir un sistema de computación o robótico, promoviendo la interacción con el mundo físico en el contexto de un problema del mundo real, de forma sostenible.\nCYR.3.2.2.Entender el funcionamiento interno de las aplicaciones móviles y cómo se construyen, dando respuesta a las posibles demandas del escenario a resolver.\nCYR.3.2.3.Conocer y resolver la variedad de problemas posibles desarrollando una aplicación móvil y generalizando las soluciones.\nCYR.3.6.2.Acceder a servicios de intercambio y publicación de información digital aplicando criterios de seguridad y uso responsable.\n\nSABERES BÁSICOS\nCYR.3.B.1.Aplicaciones de los sensores IoT.\nCYR.3.C.1.Concepto de grado de libertad.\nCYR.3.C.2.Tipología de las articulaciones.\nCYR.3.C.3.Configuraciones morfológicas y parámetros característicos de los robots industriales.\nCYR.3.C.4.Análisis de los AGV (Automated Guided Vehicles).\nCYR.3.C.5.Programación con lenguaje de texto de microprocesadores.\nCYR.3.F.1.Sistemas de computación: aplicaciones.\nCYR.3.F.2.Microcontroladores: tipología.\nCYR.3.F.3.Hardware: clasificación de los componentes y Software: ciclo de vida.\nCYR.3.F.4.Seguridad eléctrica: cortafuegos o firewall de hardware, y módulos de seguridad de hardware (HSM).\nCYR.3.I.4.Interacción de plataformas virtuales: soluciones.\nCYR.3.D.1.Uso básico de IDEs de lenguajes de bloques para móviles.\nCYR.3.D.2.Programación orientada a eventos.\nCYR.3.D.3.Definición de eventos.\nCYR.3.D.4.Generadores de eventos: los sensores.\nCYR.3.D.5.E/S: captura de eventos y su respuesta.\n\nDESCRIPTORES OPERATIVOS\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable."}], "actividades": [{"titulo": "Componentes, robots y primer circuito", "tipo": "Exploración", "abreviatura": "EXP1", "orden": "1", "tarea": "R2.1 · Componentes, robots y primer circuito", "descripcion": "Hito 1: El encargo y los componentes\nReto: Entender el encargo, descubrir qué es un sistema de computación física y conocer sus componentes y microcontroladores. Tiempo orientativo: 1 sesión.\n- Leer el encargo. El alumno lee el reto, los hitos y cómo se evalúa. Ve un vídeo corto de un almacén automatizado (robots que mueven estanterías, cintas clasificadoras) y anota en la ficha A1 cuatro máquinas que aparecen.\n- Entrada, proceso y salida. Para cada máquina anota qué percibe (sensor), quién decide (microcontrolador u ordenador) y qué hace (actuador). Ejemplo: puerta automática del supermercado → sensor de presencia → microcontrolador → motor que abre la puerta.\n- Clasificar componentes. Completa la parte 2 de la ficha A1: clasifica componentes de hardware en entrada (sensor de distancia, pulsador, sensor de temperatura), proceso (microcontrolador), salida (LED, zumbador, servo), alimentación y comunicación.\n- Tipos de microcontroladores. Compara Arduino Uno, micro:bit y ESP32 en una tabla (programación, sensores incluidos, conexión wifi/Bluetooth, usos típicos) y el ciclo de vida del software: requisitos, diseño, programación, pruebas, mantenimiento.\n- Seguridad eléctrica y de hardware. Lee en la guía del alumno por qué un LED necesita resistencia, qué es un cortocircuito y qué hacen un cortafuegos de hardware y un módulo de seguridad de hardware (HSM) en un almacén conectado. Lo resume en la ficha A1 (parte 3).\n- Preparar Tinkercad. Entra en Tinkercad con el enlace y el código de la clase virtual que le facilita el docente (sin correo personal) y abre un circuito nuevo. Si algo no funciona, lo pregunta en el foro.\n- Moodle Centros: Foro «R2 · Dudas del almacén». Canal para preguntar dudas de los simuladores y del proyecto en cualquier hito.\n- Evidencia: Ficha A1, partes 1 a 3\n\nHito 2: Robots por dentro y primer circuito\nReto: Entender los grados de libertad, las configuraciones de los robots y los AGV, y montar y programar el primer circuito en Tinkercad. Tiempo orientativo: 1 sesión.\n- Mi brazo es un robot. Mueve su propio brazo y cuenta cuántos movimientos independientes puede hacer el hombro, el codo y la muñeca. Así entiende qué es un grado de libertad (GDL).\n- Articulaciones y morfologías. Con la guía del alumno, completa la ficha A2: articulaciones de rotación y prismáticas (lineales); configuraciones cartesiana, cilíndrica, esférica (polar), SCARA y angular (articulada), con su número de GDL, su espacio de trabajo y un uso típico. Parámetros de un robot industrial: número de GDL, alcance, carga máxima, precisión y velocidad.\n- Robots en vídeo. Ve vídeos de robots industriales (búsqueda propuesta en la guía del alumno) e identifica en la ficha A2 la configuración de tres robots y sus GDL.\n- AGV. Investiga qué es un AGV (vehículo de guiado automático), cómo se guía (líneas, imanes, láser, visión) y qué sensores usa. Explica en qué parte del almacén usaría uno. (Plantilla en el anexo A2.)\n- Primer circuito. En Tinkercad monta Arduino Uno + LED + resistencia de 220 Ω en la placa de pruebas. Programa con bloques que el LED parpadee (1 s encendido, 1 s apagado), cambia el modo de código a «Bloques + Texto» para ver el C++ y añade un comentario en el texto. Inicia la simulación y entrega en la Tarea R2.1 el enlace del circuito y las fichas A1 y A2. (Plantilla en el anexo A1.)\n- Moodle Centros: Tarea «R2.1 · Componentes, robots y primer circuito» (evaluada con rúbrica 1-3-5-7-10). Evaluar que el alumno conoce los componentes de un sistema de computación física, los conceptos básicos de los robots y sabe montar y simular un circuito.\n- Evidencia: Ficha A2 de robots\n- Evidencia: Circuito de parpadeo en Tinkercad\n- Evidencia: Tarea R2.1 (rúbrica)", "temporalizacion": "2 sesiones (trabajo autónomo)", "recursos": "Vídeo de un almacén, Ficha A1, Tinkercad Circuits, Fichas A1 y A2", "descriptores": "CC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referen atura, y con condicionales decide la posición del servo, los LED y el zumbador. Cada bloque del código lleva un comentario explicando qué hace. Muestra la distancia y la temperatura en el monitor serie.\n- Pruebas. En la simulación, arrastra el objeto delante del sensor y cambia la temperatura del TMP36 para probar los tres requisitos. Anota cinco pruebas en la tabla del informe (anexo A3, parte 2) y corrige lo que falle.\n- Sostenibilidad y personas. Responde en el informe: ¿cómo ahorrar energía en el muelle (p. ej. apagar el LED verde cuando no hay camión, sensores que «duermen»)? ¿Qué se puede reutilizar o reciclar de los componentes? ¿Qué trabajos cambian para las personas con la automatización?\n- Entregar. Entrega en la Tarea R2.2 el enlace del circuito (compartido), el código copiado en el informe y el informe completo. (Plantilla en el anexo A3.)\n- Moodle Centros: Tarea «R2.2 · Sistema del muelle de carga» (evaluada con rúbrica 1-3-5-7-10). Evaluar el sistema automatizado del muelle: montaje, programación en texto, funcionamiento y pruebas.\n- Evidencia: Circuito del muelle en Tinkercad\n- Evidencia: Código C++ comentado\n- Evidencia: Tabla de pruebas", "temporalizacion": "2 sesiones (trabajo autónomo)", "recursos": "Tinkercad Circuits, Informe técnico (A3)", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinen se basan los robots, su funcionamiento, componentes y características.", "ejercicios": "Monta en Tinkercad el sistema del muelle con sensor de distancia, servo, LED, zumbador y TMP36.\nPrograma en C++ los tres requisitos del muelle con comentarios.\nPrueba los tres requisitos en la simulación y anota cinco pruebas.\nPropón dos medidas para que el muelle consuma menos energía y explica qué trabajos cambian con la automatización.", "metodologias": "Simulación, Ciclo de diseño iterativo", "sesiones": [3]}, {"titulo": "App móvil del videojuego", "tipo": "Estructuración", "abreviatura": "EST2", "orden": "3", "tarea": "R2.3 · App móvil «Atrapa al personaje»", "descripcion": "Hito 4: La app de tu juego en App Inventor\nReto: Crear una mini app móvil con el personaje del videojuego del proyecto R1 (atrapa al personaje) con eventos y un temporizador, entender cómo funciona por dentro y probarla en el emulador. Tiempo orientativo: 2 sesiones.\n- Preparar el entorno. Entra en ai2.appinventor.mit.edu con la cuenta de Google del centro. Instala el emulador siguiendo la guía oficial (aiStarter) o, si no puede instalar programas en su ordenador, avisa en el foro de dudas: el docente le dará una alternativa (probarla en un móvil del centro con la app MIT AI2 Companion).\n- Diseñador: la interfaz. En la vista Diseñador añade: un Lienzo (Canvas) con el fondo del juego, un SpriteImagen con el personaje de su juego, dos Etiquetas (puntos y tiempo), un Botón «Jugar» y un Reloj (Clock, en el cajón Sensores). Planifica antes en la plantilla A4 qué componentes usa y qué evento dispara cada acción.\n- Bloques: los eventos. Programa los eventos: «cuando Botón.Clic» (pone puntos a 0, tiempo a 30 y activa el reloj); «cuando Reloj.Temporizador» (cada segundo mueve el sprite a un punto aleatorio del lienzo y resta 1 al tiempo; si tiempo = 0, desactiva el reloj y muestra «¡Fin! Puntos: …»); «cuando SpriteImagen.Tocado» (suma 1 punto y suena un sonido). Ampliación opcional: con un móvil real, usar const S = DATA.sa, CUR = DATA.cur, IDX = DATA.idx;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':''); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Hitos donde se trabaja</div><p>${ses.map(n=>'H'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

(function(){
  const COLORS = ['#0f766e','#1d4ed8','#7c3aed','#b45309','#be123c'];
  const fases = arr(S.fases);
  const total = S.sesiones.length;
  const fcol = {}; fases.forEach((f,i)=>fcol[f.nombre]=COLORS[i%COLORS.length]);
  const count = f => S.sesiones.filter(s=>s.fase===f.nombre).length;
  let h = `<div class="card"><h2>Distribución temporal</h2><div class="timeline">${fases.map(f=>`<div style="flex:${count(f)};background:${fcol[f.nombre]}">${esc(f.nombre)} · ${count(f)} ses.</div>`).join('')}</div>
    <div class="grid g2" style="margin-top:12px">${fases.map(f=>`<div><b style="color:${fcol[f.nombre]}">${esc(f.nombre)}</b> (hitos ${esc(f.sesiones||'')}) — ${esc(f.finalidad||'')} · ${Math.round(count(f)/total*100)} %</div>`).join('')}</div></div>`;
  const duaSet = [...new Set(S.sesiones.flatMap(s=>arr(s.dua && s.dua.principios)))];

    <span class="legend" style="margin-left:10px">DUA:</span>${duaSet.map(d=>`<button data-d="${esc(d)}">${esc(d)}</button>`).join('')}

    <button data-open="1" style="margin-left:auto">Desplegar todas</button></div><div id="slist"></div>`;
  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){
    const list = S.sesiones.filter(s => (state.f==='*'||s.fase===state.f) && (!state.d || arr(s.dua&&s.dua.principios).includes(state.d)) && (!state.m || arr(s.moodle).length));
    $('#slist').innerHTML = list.map(s => `<details class="ses" data-n="${s.n}"><summary><div class="num" style="background:${fcol[s.fase]}22;color:${fcol[s.fase]}">${s.n}</div>
      <div><div class="stitle">Hito ${s.n} · ${esc(s.titulo)} <span class="badge">${esc(s.fase)}</span>${arr(s.moodle).length?'<span class="badge" style="background:var(--moodle-bg);color:var(--moodle)">Moodle</span>':''}</div><div class="sreto">${esc(s.reto)}</div></div></summary>
      <div class="sbody"><div>${arr(s.actividades).map(a=>`<div class="act"><b>${esc(a.nombre)}</b><span class="min">${a.min?esc(a.min)+' min':''}</span><p>${esc(a.desc)}</p></div>`).join('')}
        ${arr(s.moodle).length?`<div class="moodle"><div class="mh">Integración con Moodle Centros</div>${arr(s.moodle).map(m=>`<div class="mitem"><div class="mt">${esc(m.recurso)} · «${esc(m.nombre)}»${corrBadge(m)}${m.criterio?' '+chip(m.criterio):''}</div><p>${esc(m.uso)}</p>${m.correccion==='apto'?`<div class="lab">Se verifica</div>${ul(m.cotejo)}`:''}${m.correccion==='rubrica'?`<p class="note">Se evalúa con la rúbrica de la pestaña «6. Evaluación».</p>`:''}${arr(m.config).length?`<div class="lab">Configuración</div>`+ul(m.config):''}</div>`).join('')}</div>`:''}
      </div><div class="side">
        <div class="lab">Criterios</div>${arr(s.criterios).length?chips(s.criterios):'<span class="note">Evaluación diagnóstica (no calificable)</span>'}
        <div class="lab">Saberes</div>${chips(s.saberes)}
        ${arr(s.metodologia).length?`<div class="lab">Metodología</div><p>${arr(s.metodologia).map(esc).join(' · ')}</p>`:''}
        ${arr(s.evidencias).length?`<div class="lab">Evidencias</div>${ul(s.evidencias)}`:''}
        ${arr(s.recursos).length?`<div class="lab">Recursos</div><p>${arr(s.recursos).map(esc).join(' · ')}</p>`:''}
        ${s.dua?`<div class="lab">DUA (${arr(s.dua.principios).map(esc).join(', ')})</div><p>${esc(s.dua.medidas)}</p>`:''}

  }

    if(b.dataset.d){ state.d = state.d===b.dataset.d?null:b.dataset.d; $('#ff').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===state.d)); }

      <table class="tbl"><thead><tr><th>Criterio</th><th>Elementos calificables en Moodle</th></tr></thead><tbody>${IDX.criterios.map(c=>`<tr><td>${chip(c)}</td><td>${all.filter(m=>m.calificable && m.criterio===c).map(m=>`H${m.n} · ${esc(m.recurso)} «${esc(m.nombre)}»`).join('<br>') || '<span class="note">Se califica fuera de Moodle (observación, exposición…)</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(arr(Mo.configuracion).length) h += `<div class="card" style="margin-top:16px"><h2>Configuración general recomendada</h2>${ul(Mo.configuracion)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Todas las actividades de Moodle</h2><div class="scroll"><table class="tbl"><thead><tr><th>Hito</th><th>Recurso</th><th>Nombre</th><th>Corrección</th><th>Para qué</th><th>Configuración clave</th></tr></thead><tbody>${all.map(m=>`<tr><td>H${m.n}</td><td>${esc(m.recurso)}</td><td>${esc(m.nombre)}${m.criterio?' '+chip(m.criterio):''}</td><td>${corrBadge(m)||'—'}</td><td>${esc(m.uso)}</td><td>${ul(m.config)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#p-moodle').innerHTML = h;
})();

/* ---------- 5. DUA ---------- */
(function(){
  const D = S.dua || {};
  let h = `<div class="grid g2">${Object.entries(D).map(([k,v])=>`<div class="card"><h2>${esc(k)}</h2>${ul(v)}</div>`).join('')}</div>`;
  if(arr(S.diversidad).length) h += `<div class="card" style="margin-top:16px"><h2>Atención a la diversidad</h2><table class="tbl"><thead><tr><th>Perfil</th><th>Medidas concretas</th></tr></thead><tbody>${S.diversidad.map(d=>`<tr><td><b>${esc(d.perfil)}</b></td><td>${esc(d.medidas)}</td></tr>`).join('')}</tbody></table></div>`;
  if(arr(S.roles).length) h += `<div class="card" style="margin-top:16px"><h2>Roles del equipo</h2><table class="tbl"><tbody>${S.roles.map(r=>`<tr><td><b>${esc(r.rol)}</b></td><td>${esc(r.funcion)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#p-dua').innerHTML = h;
})();

/* ---------- 6. evaluación ---------- */
(function(){
  const E = S.evaluacion || {};
  let st = {}; try{ st = JSON.parse(localStorage.getItem('sda-cotejo-'+M.titulo)||'{}'); }catch(_){}
  let h = `<div class="card"><h2>Lista de cotejo interactiva</h2><p class="note">Marca los indicadores logrados; el progreso se calcula por criterio y se guarda en este navegador.</p>
    <div class="grid g2">${arr(E.cotejo).map((g,gi)=>`<div class="side"><span class="pct" data-p="${gi}"></span>${chip(g.criterio)}<div class="bar"><div data-b="${gi}"></div></div><ul class="cot" style="padding:0">${arr(g.indicadores).map((t,i)=>`<li><label><input type="checkbox" data-k="${gi}-${i}" ${st[gi+'-'+i]?'checked':''}> <span>${esc(t)}</span></label></li>`).join('')}</ul></div>`).join('')}</div>
    <button class="copy" id="cot-reset" style="margin-top:10px">Borrar marcas</button></div>`;
  const TR = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='rubrica').map(m=>({...m,n:x.n}))).concat(S.rubrica_general ? [{...S.rubrica_general, nombre: (S.rubrica_general.nombre||'Rúbrica general') + ' (sin Tarea · se aplica al cerrar el proyecto)', correccion:'rubrica', n:0}] : []);
  const TA = S.sesiones.flatMap(x=>arr(x.moodle).filter(m=>m.correccion==='apto').map(m=>({...m,n:x.n})));
  const PTS = [1,3,5,7,10];
  if(TR.length) h += `<div class="card" style="margin-top:16px"><h2>Rúbricas de las tareas finales</h2><p class="note">Cada línea se puntúa con 1, 3, 5, 7 o 10 puntos y la nota es la media (ponderada cuando la línea indica su peso). Pulsa una casilla para calcular la nota de un estudiante (no se guarda).</p>${TR.map((m,ti)=>`<h3>${tname(m)} ${chips([...new Set(arr(m.rubrica).map(l=>l.criterio||m.criterio))])} <span class="pct" data-rn="${ti}"></span></h3><div class="scroll"><table class="tbl rub" data-t="${ti}"><thead><tr><th>Línea</th>${PTS.map(p=>`<th>${p} pto</th>`).join('')}</tr></thead><tbody>${arr(m.rubrica).map((l,li)=>`<tr><td><b>${esc(l.linea)}</b>${l.criterio?`<br><small>${esc(l.criterio)}</small>`:''}${l.peso?`<br><small>peso ${String(l.peso).replace('.',',')} %</small>`:''}</td>${arr(l.niveles).map((x,k)=>`<td class="rc" data-l="${li}" data-w="${l.peso||1}" data-c="${esc(l.criterio||m.criterio||'')}" data-p="${PTS[k]}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
  if(TA.length) h += `<div class="card" style="margin-top:16px"><h2>Tareas de verificación (Apto / No apto)</h2><p class="note">Es Apto si se cumplen todos los elementos.</p><div class="grid g2">${TA.map(m=>`<div class="side"><b>${tname(m)}</b> ${chip(m.criterio)}${ul(m.cotejo)}</div>`).join('')}</div></div>`;
  if(arr(E.rubrica).length){ const niv = E.niveles || ['Insuficiente (1-4)','Suficiente / Bien (5-6)','Notable (7-8)','Sobresaliente (9-10)'];
    h += `<div class="card" style="margin-top:16px"><h2>Rúbrica</h2><div class="scroll"><table class="tbl"><thead><tr><th>Criterio</th>${niv.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${E.rubrica.map(r=>`<tr><td>${chip(r.criterio)}</td>${arr(r.niveles).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; }
  if(E.agentes) h += `<div class="card" style="margin-top:16px"><h2>Agentes e instrumentos</h2>${Object.entries(E.agentes).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;
  $('#p-eval').innerHTML = h;
  const sel = {};
  $('#p-eval').addEventListener('click', e => { const c = e.target.closest('td.rc'); if(!c) return; const t = c.closest('table').dataset.t;
    c.parentElement.querySelectorAll('td.rc').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    sel[t] = sel[t]||{}; sel[t][c.dataset.l] = [+c.dataset.p, +c.dataset.w]; const v = Object.values(sel[t]); const nl = c.closest('tbody').rows.length;
    const wt = [...c.closest('tbody').rows].reduce((a,r)=>a+(+r.querySelector('td.rc').dataset.w),0);
    document.querySelector(`[data-rn="${t}"]`).textContent = `Nota: ${(v.reduce((a,[p,w])=>a+p*w,0)/wt).toFixed(1)}` + (()=>{ const rs=[...c.closest('tbody').rows].map(r=>r.querySelector('td.rc').dataset); const cs=[...new Set(rs.map(d=>d.c))]; if(cs.length<2) return ''; return ' · ' + cs.map(k=>{ const ws=rs.filter(d=>d.c===k).reduce((a,d)=>a+(+d.w),0); const pt=Object.entries(sel[t]).filter(([i])=>rs[i].c===k).reduce((a,[,x])=>a+x[0]*x[1],0); return k+': '+(pt/ws).toFixed(1); }).join(' · '); })() + (v.length<nl?` (faltan ${nl-v.length} líneas)`:''); });
  function upd(){ arr(E.cotejo).forEach((g,gi)=>{ const n = arr(g.indicadores).length; const k = arr(g.indicadores).filter((_,i)=>st[gi+'-'+i]).length; const p = n?Math.round(k/n*100):0;
    document.querySelector(`[data-b="${gi}"]`).style.width = p+'%'; document.querySelector(`[data-p="${gi}"]`).textContent = p+' %'; }); }
  function save(){ try{ localStorage.setItem('sda-cotejo-'+M.titulo, JSON.stringify(st)); }catch(_){} }
  $('#p-eval').addEventListener('change', e => { const k = e.target.dataset.k; if(k){ st[k]=e.target.checked; save(); upd(); } });
  $('#cot-reset').onclick = () => { st = {}; save(); document.querySelectorAll('#p-eval input[type=checkbox]').forEach(x=>x.checked=false); upd(); };
  upd();
})();

/* ---------- 7. Séneca ---------- */
(function(){
  const SE = DATA.seneca;
  const box = (t, txt) => `<div class="copybox"><div class="ch"><span>${esc(t)}</span><button class="copy">Copiar</button></div><pre>${esc(txt)}</pre></div>`;
  let h = `<div class="card"><h2>Textos listos para pegar en Séneca</h2><p class="note">Séneca guarda texto plano: estos bloques no llevan formato Markdown. Copia cada campo en su casilla del formulario de la situación de aprendizaje.</p>
    ${box('Título', SE.titulo)}${box('Temporalización', SE.temporalizacion)}${box('Justificación', SE.justificacion)}${box('Producto final', SE.producto_final)}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Concreción curricular</h2><p class="note">En Séneca se marcan en las listas; aquí tienes la selección para comprobarla.</p>${SE.concrecion.map(m=>box(m.materia, m.texto)).join('')}</div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Actividades (formulario «Detalle de la actividad»)</h2><p class="note">Los campos siguen el orden del formulario de Séneca. Solo hay una actividad por cada Tarea de Moodle evaluada con rúbrica. En «Vinculación criterios de evaluación» elige la única trazabilidad indicada y pasa esos criterios a «seleccionados» (es obligatorio).</p>${SE.actividades.map(a=>`<h3>${esc(a.orden)}. ${esc(a.titulo)} <span class="badge">${esc(a.tipo)}</span> <span class="badge">${esc(a.abreviatura)}</span> <span class="badge">Tarea ${esc(a.tarea)}</span></h3>${box('Título de la actividad', a.titulo)}${box('Tipo de actividad', a.tipo)}${box('Abreviatura', a.abreviatura)}${box('Orden de la presentación', a.orden)}${box('Descripción', a.descripcion)}${box('Temporalización', a.temporalizacion)}${box('Recursos', a.recursos)}${box('Descriptores operativos', a.descriptores)}${box('Vinculación criterios de evaluación', a.vinculacion)}${box('Ejercicios', a.ejercicios)}${box('Metodologías', a.metodologias)}`).join('')}</div>`;
  $('#p-seneca').innerHTML = h;
})();
</script>
</body>
</html>
