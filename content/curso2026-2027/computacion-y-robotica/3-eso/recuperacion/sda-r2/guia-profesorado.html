<html lang="es">
<head>
<meta charset="UTF-8">

<title>SdA R2: Almacén automático, robots sin robot</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0;

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#111a2e; --ink:#e2e8f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#1e293b;
    --brand:#2dd4bf; --brand2:#5eead4; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
    --warn-bg:#2a1f05; --warn-line:#a16207; --warn-ink:#fde68a;
    --ce:#93c5fd; --ce-bg:#1e3a8a; --cr:#fdba74; --cr-bg:#7c2d12; --sb:#86efac; --sb-bg:#14532d; --de:#d8b4fe; --de-bg:#581c87;
    --moodle:#fdba74; --moodle-bg:#2a1608; --head1:#042f2e; --head2:#172554;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2e; --ink:#e2e8f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#1e293b;
  --brand:#2dd4bf; --brand2:#5eead4; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
  --warn-bg:#2a1f05; --warn-line:#a16207; --warn-ink:#fde68a;
  --ce:#93c5fd; --ce-bg:#1e3a8a; --cr:#fdba74; --cr-bg:#7c2d12; --sb:#86efac; --sb-bg:#14532d; --de:#d8b4fe; --de-bg:#581c87;
  --moodle:#fdba74; --moodle-bg:#2a1608; --head1:#042f2e; --head2:#172554;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;padding:28px 0 36px}
header .kicker{font-size:13px;opacity:.85;letter-spacing:.02em}
header h1{margin:8px 0 4px;font-size:clamp(24px,4vw,36px);line-height:1.15}
header .sub{margin:0;opacity:.9;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.meta span{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-size:13px}
.hbtns{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
.btn:hover{background:rgba(255,255,255,.26)}
.notice{margin-top:-18px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:12px 16px;font-size:14px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:16px 0 4px}
nav.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
main{padding:12px 0 48px}
.panel{display:none}.panel.on{display:block}
.grid{display:grid;gap:16px}
@media(min-width:900px){.g3{grid-template-columns:2fr 1fr}.g2{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h2{margin:0 0 10px;font-size:19px}
.card h3{margin:14px 0 6px;font-size:15px}
.card p{margin:6px 0;color:var(--ink2)}
.reto{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;border:0}
.reto p{color:#fff}.reto .q{font-size:19px;font-weight:700}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:10px}
.reto .lab{color:rgba(255,255,255,.8)}
ul.clean{margin:6px 0;padding-left:18px;color:var(--ink2)}ul.clean li{margin:3px 0}
.chip{display:inline-flex;align-items:center;border:0;border-radius:6px;padding:2px 8px;margin:2px 3px 2px 0;font:600 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
.chip:hover{filter:brightness(.95);text-decoration:underline}
.chip.ce{background:var(--ce-bg);color:var(--ce)}.chip.cr{background:var(--cr-bg);color:var(--cr)}
.chip.sb{background:var(--sb-bg);color:var(--sb)}.chip.de{background:var(--de-bg);color:var(--de)}
.chip.off{opacity:.55;text-decoration:line-through}
.legend{font-size:13px;color:var(--muted)}
.timeline{display:flex;height:40px;border-radius:10px;overflow:hidden;margin-top:8px}
.timeline div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;padding:0 6px;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
details.ses{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
details.ses>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
details.ses>summary::-webkit-details-marker{display:none}
.num{flex:none;width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand2);display:flex;align-items:center;justify-content:center;font-weight:800}
.stitle{font-weight:700}.sreto{color:var(--muted);font-size:14px}
.sbody{padding:0 18px 18px;display:grid;gap:16px}
@media(min-width:900px){.sbody{grid-template-columns:3fr 2fr}}
.act{border-left:3px solid var(--brand);padding:4px 0 4px 12px;margin:10px 0}
.act b{color:var(--ink)}.act .min{font-size:12px;color:var(--muted);margin-left:6px}
.act p{margin:2px 0;color:var(--ink2)}
.side{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14px}
.side .lab:first-child{margin-top:0}
.moodle{background:var(--moodle-bg);border:1px solid var(--line);border-left:4px solid var(--moodle);border-radius:10px;padding:10px 14px;margin-top:12px}
.moodle .mh{color:var(--moodle);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.mitem{margin:8px 0}.mitem .mt{font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.scroll{overflow-x:auto}
.tick{text-align:center;color:var(--brand);font-weight:800}
.cot li{list-style:none;margin:6px 0}.cot label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--brand);width:0;transition:width .2s}
.pct{float:right;font-size:12px;font-weight:700;color:var(--brand)}
.copybox{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.copybox .ch{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:6px 12px;font-size:13px;font-weight:700}
.copybox pre{margin:0;padding:10px 12px;white-space:pre-wrap;font:13px/1.5 system-ui,sans-serif;color:var(--ink2)}
.copy{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.note{font-size:13px;color:var(--muted)}
td.rc{cursor:pointer;font-size:13px}td.rc:hover{background:var(--bg)}td.rc.on{background:var(--brand-soft);outline:2px solid var(--brand)}
.rub th{text-align:center}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
#modal .box{background:var(--card);color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#modal .mhd{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
#modal .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--brand)}
#modal h3{margin:2px 0 0;font-size:18px}
#modal .mbd{padding:16px 18px;color:var(--ink2)}
#modal .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
@media print{
  nav.tabs,.hbtns,.filters,.copy,#modal{display:none!important}
  .panel{display:block!important;page-break-before:always}.panel:first-of-type{page-break-before:auto}
  details.ses>.sbody{display:grid!important}
  body{background:#fff}
}
</style>

ca y robótica: puertas y sensores automáticos, robots que mueven estanterías y brazos que clasifican paquetes. Los simuladores permiten evidenciar los criterios de computación física, robótica y construcción de sistemas automatizados sin material físico.", "reto": "«Una empresa de logística de Andalucía quiere automatizar su almacén y nos encarga el prototipo virtual: el sistema del muelle de carga (detecta camiones, abre la puerta y avisa si hay peligro) y un AGV que clasifica los paquetes por colores. Tengo que entregarlo funcionando en simuladores, con un informe técnico.»", "pregunta_guia": "¿Cómo perciben, deciden y actúan las máquinas de un almacén automático… y cómo puedo construirlas sin tocar un solo cable?", "producto_final": "Informe técnico del almacén automático con el enlace del circuito del muelle de carga en Tinkercad Circuits (programado en texto), el programa del AGV clasificador de VEXcode VR y la ficha de análisis de morfologías de robots."}, "metodologias": [{"nombre": "Aprendizaje basado en retos", "descripcion": "Un encargo realista (automatizar un almacén) dividido en dos subsistemas."}, {"nombre": "Simulación", "descripcion": "Tinkercad Circuits y VEXcode VR sustituyen al material físico y permiten probar y corregir sin riesgo."}, {"nombre": "Trabajo autónomo guiado", "descripcion": "Guía por hitos en la web de clase con pasos, código comentado y lista de comprobación."}, {"nombre": "Ciclo de diseño iterativo", "descripcion": "Diseñar, simular, medir, corregir y documentar en el informe técnico."}], "recursos": ["Ordenador con navegador", "Tinkercad Circuits (clase virtual del docente)", "VEXcode VR (vr.vex.com)", "Google Docs del centro", "Moodle Centros", "Web de clase de la SdA (guía por hitos)"], "fases": [{"nombre": "Inicio", "sesiones": "1", "finalidad": "El encargo y los sistemas de computación física"}, {"nombre": "Desarrollo", "sesiones": "2-5", "finalidad": "Componentes y microcontroladores, muelle de carga, robots industriales y AGV"}, {"nombre": "Cierre", "sesiones": "6", "finalidad": "Informe técnico y autoevaluación"}], "sesiones": [{"n": 1, "fase": "Inicio", "titulo": "El encargo: un almacén que piensa", "reto": "Entender el encargo, descubrir qué es un sistema de computación física y preparar los simuladores. Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Leer el encargo", "desc": "El alumno lee el reto, los hitos y cómo se evalúa. Ve un vídeo corto de un almacén automatizado (robots que mueven estanterías, cintas clasificadoras) y anota en la ficha A1 cuatro máquinas que aparecen."}, {"nombre": "Entrada, proceso y salida", "desc": "Para cada máquina anota qué percibe (sensor), quién decide (microcontrolador u ordenador) y qué hace (actuador). Ejemplo: puerta automática del supermercado → sensor de presencia → microcontrolador → motor que abre la puerta."}, {"nombre": "Preparar los simuladores", "desc": "Entra en Tinkercad con el enlace y el código de la clase virtual que le facilita el docente (sin correo personal) y abre un circuito nuevo. Abre vr.vex.com y prueba a mover el robot en el área de juego «Grid Map». Si algo no funciona, lo pregunta en el foro."}], "criterios": [], "saberes": ["CYR.3.F.1", "CYR.3.B.1"], "metodologia": ["Trabajo autónomo guiado", "Análisis de casos"], "evidencias": ["Ficha A1, parte 1 (diagnóstica)"], "recursos": ["Vídeo de un almacén", "Ficha A1"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Vídeo con subtítulos y ejemplos cotidianos antes del almacén."}, "ejercicios": ["Identifica cuatro máquinas automáticas de un almacén y anota su sensor, quién decide y su actuador.", "Accede a Tinkercad Circuits y a VEXcode VR y comprueba que funcionan."], "moodle": [{"recurso": "Foro", "nombre": "R2 · Dudas del almacén", "uso": "Canal para preguntar dudas de los simuladores y del proyecto en cualquier hito.", "config": ["Tipo: foro de uso general", "Suscripción forzosa", "Visible solo para el alumno (restricción de acceso)"]}], "clase": {"pregunta": "¿Quién abre la puerta del supermercado cuando llegas?", "diapositivas": [{"tipo": "ejemplo", "icono": "🚪", "titulo": "La puerta del supermercado", "situacion": "Te acercas y la puerta se abre sola. Te alejas y se cierra.", "explicacion": "Un **sensor** te detecta, un **microcontrolador** decide «abrir» y un **motor** (actuador) mueve la puerta. Eso es un **sistema de computación física**: un programa que actúa en el mundo real."}, {"tipo": "flujo", "titulo": "Entrada → proceso → salida", "nodos": [{"texto": "Sensor: detecta a una persona", "tipo": "inicio"}, {"texto": "Microcontrolador: ¿hay alguien a menos de 1 m?", "tipo": "decision"}, {"texto": "Actuador: el motor abre la puerta", "tipo": "proceso"}, {"texto": "Espera y cierra", "tipo": "fin"}]}, {"tipo": "video", "titulo": "Un almacén automatizado por dentro", "busqueda": "almacén automatizado robots logística cómo funciona", "texto": "Elige un vídeo corto (2-4 min) de un centro logístico automatizado.", "preguntas": ["¿Qué máquinas se mueven solas?", "¿Qué crees que detectan sus sensores?", "¿Qué trabajos hacen las personas?"]}, {"tipo": "practica", "titulo": "Analiza cuatro máquinas", "enunciado": "Completa la **parte 1 de la ficha A1**: para cuatro máquinas del vídeo, anota sensor, quién decide y actuador.", "material": ["Ficha A1 · Componentes y microcontroladores"], "enlace": "https://docs.google.com/document/d/11CdA8xhWZiEJmd6mN-Gw12l9jxHgrsWLk37mAFI2dag/copy"}, {"tipo": "pasos", "titulo": "Prepara los simuladores", "pasos": ["Tinkercad: entra con el enlace y el código de clase que te da el docente.", "Crear → Circuito: comprueba que se abre el editor.", "Abre vr.vex.com → elige el área de juego «Grid Map».", "Arrastra «avanzar 200 mm» y pulsa Iniciar.", "Si algo falla, pregúntalo en el foro de dudas."]}, {"tipo": "cierre", "puntos": ["Sensor → decisión → actuador.", "Un almacén automático es un sistema de computación física gigante.", "Vas a construirlo en dos simuladores."], "siguiente": "Hito 2: componentes, microcontroladores y tu primer circuito.", "pregunta": "¿Qué máquina automática usas cada día sin darte cuenta?"}]}}, {"n": 2, "fase": "Desarrollo", "titulo": "Componentes, microcontroladores y primer circuito", "reto": "Clasificar los componentes de un sistema de computación, conocer tipos de microcontroladores y montar y programar el primer circuito en Tinkercad. Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Clasificar componentes", "desc": "Completa la parte 2 de la ficha A1: clasifica componentes de hardware en entrada (sensor de distancia, pulsador, sensor de temperatura), proceso (microcontrolador), salida (LED, zumbador, servo), alimentación y comunicación."}, {"nombre": "Tipos de microcontroladores", "desc": "Compara Arduino Uno, micro:bit y ESP32 en una tabla (programación, sensores incluidos, conexión wifi/Bluetooth, usos típicos) y el ciclo de vida del software: requisitos, diseño, programación, pruebas, mantenimiento."}, {"nombre": "Seguridad eléctrica y de hardware", "desc": "Lee en la web de clase por qué un LED necesita resistencia, qué es un cortocircuito y qué hacen un cortafuegos de hardware y un módulo de seguridad de hardware (HSM) en un almacén conectado. Lo resume en la ficha A1 (parte 3)."}, {"nombre": "Primer circuito", "desc": "En Tinkercad monta Arduino Uno + LED + resistencia de 220 Ω en la placa de pruebas. Programa con bloques que el LED parpadee (1 s encendido, 1 s apagado), cambia el modo de código a «Bloques + Texto» para ver el C++ y añade un comentario en el texto. Inicia la simulación y entrega en la Tarea R2.1 el enlace del circuito y la ficha A1. (Plantilla en el anexo A1.)"}], "criterios": ["CYR.3.1.1"], "saberes": ["CYR.3.F.2", "CYR.3.F.3", "CYR.3.F.4", "CYR.3.C.5"], "metodologia": ["Simulación", "Aprender haciendo"], "evidencias": ["Ficha A1 completa", "Circuito de parpadeo en Tinkercad", "Tarea R2.1 (Apto / No apto)"], "recursos": ["Tinkercad Circuits", "Ficha A1"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Esquema del montaje paso a paso; vista Bloques + Texto para conectar bloques y C++."}, "ejercicios": ["Clasifica componentes de hardware en entrada, proceso, salida, alimentación y comunicación.", "Compara Arduino Uno, micro:bit y ESP32.", "Explica por qué un LED necesita resistencia y qué es un HSM.", "Monta y programa un LED que parpadea en Tinkercad."], "moodle": [{"recurso": "Tarea", "nombre": "R2.1 · Ficha de componentes y primer circuito", "uso": "Verificar que el alumno conoce los componentes y sabe montar y simular un circuito antes del muelle de carga.", "correccion": "apto", "criterio": "CYR.3.1.1", "cotejo": ["La ficha A1 tiene completas las partes 1, 2 y 3", "El enlace del circuito de Tinkercad se abre", "El LED lleva resistencia y el circuito simula sin errores", "El código muestra el texto C++ con al menos un comentario propio"], "config": ["Entrega: texto en línea (enlace) + archivo PDF", "Calificación: escala Apto / No apto", "Permitir reenvío hasta que sea Apto"], "calificable": true, "codigo": "R2.1"}], "clase": {"pregunta": "¿Qué tienen en común un mando de la tele, un micro:bit y la puerta del almacén?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎛️", "titulo": "El cerebro de la lavadora", "situacion": "Eliges «algodón 40 °C» y la lavadora llena, calienta, gira y centrifuga sola.", "explicacion": "Dentro hay un **microcontrolador**: un ordenador diminuto que lee sensores (temperatura, nivel de agua) y controla actuadores (motor, resistencia). Arduino, micro:bit y ESP32 son microcontroladores educativos."}, {"tipo": "infografia", "titulo": "Componentes de un sistema", "elementos": [{"icono": "👁️", "titulo": "Entrada", "texto": "Sensores: distancia, temperatura, pulsador"}, {"icono": "🧠", "titulo": "Proceso", "texto": "Microcontrolador: Arduino, micro:bit, ESP32"}, {"icono": "💡", "titulo": "Salida", "texto": "Actuadores: LED, zumbador, servo, motor"}, {"icono": "🔋", "titulo": "Alimentación", "texto": "USB, pilas, fuente"}]}, {"tipo": "comparar", "titulo": "Tres microcontroladores", "columnas": [{"titulo": "Arduino Uno", "icono": "🔵", "puntos": ["Bloques y C++", "Muchos pines para sensores", "Sin wifi"]}, {"titulo": "micro:bit", "icono": "🟢", "puntos": ["MakeCode y Python", "Sensores incluidos", "Bluetooth y radio"]}, {"titulo": "ESP32", "icono": "🟠", "puntos": ["Arduino C++ y MicroPython", "**Wifi y Bluetooth**", "Ideal para IoT"]}]}, {"tipo": "idea", "icono": "⚡", "titulo": "Seguridad eléctrica y de hardware", "puntos": ["El LED necesita una **resistencia** (220 Ω) o se quema.", "**Cortocircuito**: unir + y − sin nada en medio.", "**Cortafuegos de hardware**: filtra lo que entra en la red del almacén.", "**HSM**: chip que guarda claves sin que se puedan copiar."]}, {"tipo": "codigo", "titulo": "El parpadeo en C++ (vista texto de Tinkercad)", "codigo": "// Parpadeo del LED del pin 13\nvoid setup() {\n  pinMode(13, OUTPUT);     // el pin 13 será salida\n}\n\nvoid loop() {               // se repite siempre\n  digitalWrite(13, HIGH);  // enciende\n  delay(1000);             // espera 1 s\n  digitalWrite(13, LOW);   // apaga\n  delay(1000);\n}", "explicacion": ["**setup()** se ejecuta una vez al empezar.", "**loop()** es el «por siempre» de Scratch.", "// es un comentario: explica, no se ejecuta."]}, {"tipo": "practica", "titulo": "Tu primer circuito", "enunciado": "Monta Arduino + LED + resistencia de 220 Ω. Programa el parpadeo con bloques, cambia a **Bloques + Texto** y añade un comentario tuyo.", "pasos": ["Pata larga del LED (ánodo) → resistencia → pin 13.", "Pata corta (cátodo) → GND.", "Iniciar simulación: ¿parpadea?", "Compartir → copia el enlace."]}, {"tipo": "practica", "titulo": "Entrega", "enunciado": "Sube la ficha A1 (partes 1-3) en PDF y pega el enlace del circuito.", "entrega": "Tarea R2.1 · Ficha de componentes y primer circuito", "material": ["Ficha A1 · Componentes y microcontroladores"], "enlace": "https://docs.google.com/document/d/11CdA8xhWZiEJmd6mN-Gw12l9jxHgrsWLk37mAFI2dag/copy"}, {"tipo": "cierre", "puntos": ["Entrada, proceso y salida.", "Cada microcontrolador tiene sus usos.", "Bloques y C++ son el mismo programa."], "siguiente": "Hito 3: el sistema del muelle de carga (Tarea R2.2)."}]}}, {"n": 3, "fase": "Desarrollo", "titulo": "El muelle de carga automático", "reto": "Diseñar, montar y programar en texto el sistema del muelle de carga: detecta el camión, abre la puerta y avisa si hay peligro. Tiempo orientativo: 2 sesiones.", "actividades": [{"nombre": "Requisitos", "desc": "Lee los requisitos del sistema en la web de clase y los copia en el informe (anexo A3, parte 1): (1) si un camión está a menos de 50 cm (sensor de distancia ultrasónico), el servo abre la puerta (90°) y se enciende el LED verde; (2) si no hay camión, la puerta se cierra (0°) y se enciende el LED rojo; (3) si la temperatura del muelle supera 40 °C (sensor TMP36), suena el zumbador aunque no haya camión."}, {"nombre": "Montaje", "desc": "En Tinkercad monta Arduino Uno, sensor de distancia ultrasónico (de 3 o 4 pines), micro servo, LED verde y rojo con sus resistencias, zumbador piezoeléctrico y sensor de temperatura TMP36. Dibuja una tabla de conexiones (componente → pin) en el informe."}, {"nombre": "Programa en texto", "desc": "Programa en modo Texto (C++) a partir del código guía de la web de clase: lee la distancia, lee la temperatura, y con condicionales decide la posición del servo, los LED y el zumbador. Cada bloque del código lleva un comentario explicando qué hace. Muestra la distancia y la temperatura en el monitor serie."}, {"nombre": "Pruebas", "desc": "En la simulación, arrastra el objeto delante del sensor y cambia la temperatura del TMP36 para probar los tres requisitos. Anota cinco pruebas en la tabla del informe (anexo A3, parte 2) y corrige lo que falle."}, {"nombre": "Entregar", "desc": "Entrega en la Tarea R2.2 el enlace del circuito (compartido), el código copiado en el informe y las partes 1 y 2 del informe. (Plantilla en el anexo A3.)"}], "criterios": ["CYR.3.3.1", "CYR.3.1.1", "CYR.3.1.4"], "saberes": ["CYR.3.F.1", "CYR.3.F.2", "CYR.3.F.3", "CYR.3.C.5", "CYR.3.B.1"], "metodologia": ["Simulación", "Ciclo de diseño iterativo"], "evidencias": ["Circuito del muelle en Tinkercad", "Código C++ comentado", "Tabla de pruebas"], "recursos": ["Tinkercad Circuits", "Informe técnico (A3)"], "dua": {"principios": ["Andamiaje", "Acción y Expresión"], "medidas": "Código guía con huecos para completar; el montaje puede hacerse por partes (primero puerta, después temperatura)."}, "ejercicios": ["Monta en Tinkercad el sistema del muelle con sensor de distancia, servo, LED, zumbador y TMP36.", "Programa en C++ los tres requisitos del muelle con comentarios.", "Prueba los tres requisitos en la simulación y anota cinco pruebas."], "moodle": [{"recurso": "Tarea", "nombre": "R2.2 · Sistema del muelle de carga", "uso": "Evaluar el sistema automatizado del muelle: montaje, programación en texto, funcionamiento y pruebas.", "correccion": "rubrica", "criterio": "CYR.3.3.1", "rubrica": [{"linea": "Montaje y conexiones del circuito", "criterio": "CYR.3.1.1", "niveles": ["1 pto: no hay circuito o no se abre el enlace.", "3 ptos: faltan varios componentes o hay conexiones que impiden simular.", "5 ptos: están todos los componentes, pero algún LED sin resistencia o conexiones confusas.", "7 ptos: montaje completo y correcto; la tabla de conexiones tiene algún error.", "10 ptos: montaje completo, ordenado y seguro (resistencias, sin cortocircuitos) con tabla de conexiones correcta."]}, {"linea": "La puerta se abre y se cierra con el camión", "criterio": "CYR.3.3.1", "niveles": ["1 pto: el servo no responde.", "3 ptos: el servo se mueve, pero no depende de la distancia.", "5 ptos: abre con el camión cerca, pero no cierra o los LED no cambian.", "7 ptos: abre y cierra según la distancia; algún LED no coincide.", "10 ptos: abre a menos de 50 cm, cierra al alejarse y los LED verde y rojo indican el estado correcto."]}, {"linea": "Alarma de temperatura", "criterio": "CYR.3.3.1", "niveles": ["1 pto: no hay sensor de temperatura.", "3 ptos: el sensor está, pero no se lee en el programa.", "5 ptos: se lee la temperatura, pero el zumbador no suena o suena siempre.", "7 ptos: el zumbador suena por encima de 40 °C, pero bloquea el funcionamiento de la puerta.", "10 ptos: el zumbador suena por encima de 40 °C y la puerta sigue funcionando; se muestra la temperatura en el monitor serie."]}, {"linea": "Programa en texto (C++) comentado", "criterio": "CYR.3.1.4", "niveles": ["1 pto: el programa está solo en bloques o no compila.", "3 ptos: hay código en texto, pero sin comentarios ni estructura clara.", "5 ptos: código en texto con setup() y loop() y pocos comentarios.", "7 ptos: código en texto con condicionales y comentarios en la mayoría de bloques.", "10 ptos: código en texto bien organizado, con variables con nombre claro, condicionales y comentarios propios que explican cada parte."]}, {"linea": "Pruebas y corrección", "criterio": "CYR.3.3.1", "niveles": ["1 pto: no hay pruebas.", "3 ptos: una o dos pruebas sin resultado.", "5 ptos: tres pruebas con resultado.", "7 ptos: cinco pruebas que cubren los tres requisitos.", "10 ptos: cinco o más pruebas que cubren los tres requisitos y documentan al menos una corrección."]}], "config": ["Entrega: texto en línea (enlace) + PDF del informe", "Método de calificación: Rúbrica", "Comentarios de retroalimentación activados"], "criterios_rubrica": ["CYR.3.1.1", "CYR.3.3.1", "CYR.3.1.4"], "calificable": true, "codigo": "R2.2"}], "clase": {"pregunta": "¿Cómo sabe la puerta del muelle que ha llegado un camión?", "diapositivas": [{"tipo": "ejemplo", "icono": "🚗", "titulo": "El pitido al aparcar", "situacion": "Cuando un coche da marcha atrás, pita cada vez más rápido al acercarse a la pared.", "explicacion": "Usa un **sensor de ultrasonidos**: lanza un sonido que no oímos, mide cuánto tarda el eco y calcula la distancia. El de tu muelle funciona igual."}, {"tipo": "infografia", "titulo": "Así mide la distancia el ultrasonido", "svg": "<svg viewBox=\"0 0 640 200\" role=\"img\" aria-label=\"Eco del sensor de ultrasonidos\"><rect x=\"20\" y=\"70\" width=\"90\" height=\"60\" rx=\"8\" style=\"fill:var(--brand-soft);stroke:var(--brand)\"/><text x=\"65\" y=\"105\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px\">Sensor<\/text><rect x=\"520\" y=\"50\" width=\"100\" height=\"100\" rx=\"8\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><text x=\"570\" y=\"105\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px\">Camión<\/text><path d=\"M120 85 L510 85\" style=\"stroke:var(--accent);stroke-width:3;fill:none\" stroke-dasharray=\"8 6\"/><path d=\"M510 115 L120 115\" style=\"stroke:var(--brand);stroke-width:3;fill:none\" stroke-dasharray=\"8 6\"/><text x=\"315\" y=\"75\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px\">1. Sale el ultrasonido →<\/text><text x=\"315\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px\">← 2. Vuelve el eco<\/text><text x=\"320\" y=\"185\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px\">distancia = velocidad del sonido × tiempo ÷ 2<\/text><\/svg>"}, {"tipo": "infografia", "titulo": "Los tres requisitos del muelle", "elementos": [{"icono": "🚚", "titulo": "Camión < 50 cm", "texto": "Servo a 90° (abre) y LED verde"}, {"icono": "🚫", "titulo": "Sin camión", "texto": "Servo a 0° (cierra) y LED rojo"}, {"icono": "🔥", "titulo": "Temperatura > 40 °C", "texto": "Suena el zumbador"}]}, {"tipo": "codigo", "titulo": "Código guía 1/2: preparar (modo Texto)", "codigo": "#include <Servo.h>\nServo puerta;\nconst int TRIG = 7, ECHO = 6;  // distancia\nconst int VERDE = 4, ROJO = 5, ZUMB = 8;\n\nlong medirCm() {               // devuelve cm\n  digitalWrite(TRIG, LOW);  delayMicroseconds(2);\n  digitalWrite(TRIG, HIGH); delayMicroseconds(10);\n  digitalWrite(TRIG, LOW);\n  return pulseIn(ECHO, HIGH) * 0.01723;\n}\n\nvoid setup() {\n  puerta.attach(9);            // servo en el pin 9\n  pinMode(TRIG, OUTPUT); pinMode(ECHO, INPUT);\n  pinMode(VERDE, OUTPUT); pinMode(ROJO, OUTPUT);\n  pinMode(ZUMB, OUTPUT);\n  Serial.begin(9600);\n}", "explicacion": ["Copia este bloque al principio del programa.", "**medirCm()** lanza el ultrasonido y convierte el tiempo del eco en cm.", "Con el sensor de **3 pines**, usa el mismo pin para TRIG y ECHO."]}, {"tipo": "codigo", "titulo": "Código guía 2/2: decidir en loop()", "codigo": "void loop() {\n  long cm = medirCm();\n  float temp = (analogRead(A0) * 5.0 / 1024 - 0.5) * 100;\n  Serial.print(cm); Serial.print(\" cm  \");\n  Serial.println(temp);\n  if (cm < 50) {      // ¿hay camión?\n    // COMPLETA: abrir puerta y LED verde\n  } else {\n    // COMPLETA: cerrar puerta y LED rojo\n  }\n  // COMPLETA: si temp > 40, zumbador encendido;\n  //           si no, apagado\n  delay(200);\n}", "explicacion": ["Completa las tres líneas **COMPLETA**.", "**puerta.write(90)** abre; **puerta.write(0)** cierra.", "La línea de **temp** convierte la lectura del TMP36 en °C.", "Abre el **monitor serie** para ver distancia y temperatura."]}, {"tipo": "practica", "titulo": "Monta y programa el muelle", "enunciado": "Monta los componentes, copia el código guía en modo **Texto**, complétalo y comenta cada parte con tus palabras. Apunta las conexiones en el informe (A3).", "pasos": ["Primero la puerta (sensor + servo + LED).", "Después la temperatura (TMP36 + zumbador).", "Inicia la simulación después de cada parte."], "material": ["Plantilla A3 · Informe técnico del almacén"], "enlace": "https://docs.google.com/document/d/1gOxuZK4exAIq-x7SPorPJAWhg7hOv83kMpNmt-vCLys/copy"}, {"tipo": "practica", "titulo": "Prueba los tres requisitos", "enunciado": "Durante la simulación, haz clic en el sensor y **arrastra el objeto** para cambiar la distancia; haz clic en el TMP36 y **mueve la temperatura**. Anota cinco pruebas.", "pasos": ["Camión a 30 cm.", "Camión a 120 cm.", "Temperatura 25 °C y 45 °C.", "Camión cerca y 45 °C a la vez."]}, {"tipo": "quiz", "pregunta": "El zumbador suena siempre, haga la temperatura que haga. ¿Qué es lo más probable?", "opciones": ["El servo está mal conectado", "Falta el «else» que apaga el zumbador cuando temp ≤ 40", "El sensor de distancia no funciona"], "correcta": 1, "explicacion": "Si solo encendemos el zumbador en el «if» y nunca lo apagamos, se queda encendido. Hace falta **apagarlo** en el caso contrario."}, {"tipo": "practica", "titulo": "Entrega el muelle", "enunciado": "Comparte el circuito, copia el código en el informe y entrega las partes 1 y 2 del informe con el enlace.", "entrega": "Tarea R2.2 · Sistema del muelle de carga"}, {"tipo": "cierre", "puntos": ["Sensores → Arduino → actuadores.", "El programa en texto decide con «if / else».", "Probar cada requisito es parte del diseño."], "siguiente": "Hito 4: cómo son los robots por dentro."}]}}, {"n": 4, "fase": "Desarrollo", "titulo": "Robots por dentro: grados de libertad y morfologías", "reto": "Entender qué es un grado de libertad, los tipos de articulaciones y las configuraciones de los robots industriales, y qué es un AGV. Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Mi brazo es un robot", "desc": "Mueve su propio brazo y cuenta cuántos movimientos independientes puede hacer el hombro, el codo y la muñeca. Así entiende qué es un grado de libertad (GDL)."}, {"nombre": "Articulaciones y morfologías", "desc": "Con la web de clase, completa la ficha A2: articulaciones de rotación y prismáticas (lineales); configuraciones cartesiana, cilíndrica, esférica (polar), SCARA y angular (articulada), con su número de GDL, su espacio de trabajo y un uso típico. Parámetros de un robot industrial: número de GDL, alcance, carga máxima, precisión y velocidad."}, {"nombre": "Robots en vídeo", "desc": "Ve vídeos de robots industriales (búsqueda propuesta en la web de clase) e identifica en la ficha A2 la configuración de tres robots y sus GDL. "n": 5, "fase": "Desarrollo", "titulo": "El AGV clasificador en VEXcode VR", "reto": "Programar el robot virtual de VEXcode VR para que clasifique los discos de colores (paquetes) en sus zonas, usando sensores y el electroimán. Tiempo orientativo: 2 sesiones.", "actividades": [{"nombre": "Conocer el robot", "desc": "En vr.vex.com abre el área de juego «Disk Mover» (clasificar discos de colores en las zonas de su color con el electroimán). Explora el robot virtual: tren motriz (dos ruedas motrices = robot móvil de 2 GDL en el plano), electroimán (actuador que coge y suelta discos), sensor de color (ojo), sensor de distancia y posición (GPS)."}, {"nombre": "Primer paquete", "desc": "Programa con bloques que el robot vaya a por el primer disco, lo coja con el electroimán («energizar electroimán para impulsar»), lo lleve a la zona de su color y lo suelte («energizar … para soltar»). Usa la ventana de monitorización para ver los valores de los sensores."}, {"nombre": "Clasificar con sensores", "desc": "Mejora el programa para clasificar al menos tres discos: usa bucles («repetir»), el sensor de color para decidir a qué zona va cada disco («si el ojo detecta rojo…») y una función o «Mis bloques» para no repetir código. Compara su programa en bloques con la vista de Python de VEXcode VR y copia un fragmento en el informe."}, {"nombre": "Documentar", "desc": "Guarda el proyecto en su ordenador (archivo .vrblocks), graba la pantalla o hace capturas del robot clasificando y completa la parte 3 del informe (anexo A3): estrategia, sensores usados, problemas y soluciones, y cómo encaja su AGV en el almacén. (Plantilla en el anexo A3.)"}], "criterios": ["CYR.3.1.4", "CYR.3.1.2"], "saberes": ["CYR.3.C.4", "CYR.3.C.5", "CYR.3.C.1"], "metodologia": ["Simulación", "Gamificación (retos por niveles)"], "evidencias": ["Proyecto .vrblocks", "Capturas o vídeo del AGV clasificando", "Parte 3 del informe"], "recursos": ["VEXcode VR", "Informe técnico (A3)"], "dua": {"principios": ["Compromiso", "Andamiaje"], "medidas": "Retos por niveles (1 disco, 3 discos, todos los discos); fragmentos de bloques de ejemplo en la web de clase."}, "ejercicios": ["Programa el AGV para coger un disco con el electroimán y dejarlo en su zona.", "Usa un bucle y el sensor de color para clasificar al menos tres discos.", "Compara tu programa en bloques con la vista de Python."], "clase": {"pregunta": "¿Cómo decide un robot dónde va cada paquete?", "diapositivas": [{"tipo": "ejemplo", "icono": "🍎", "titulo": "La clasificadora de frutas", "situacion": "En las cooperativas agrícolas de Andalucía, las naranjas pasan por una cinta y se separan solas por tamaño y color.", "explicacion": "Una **cámara o sensor de color** mide cada fruta y el sistema decide a qué caja va. Tu AGV hará lo mismo con discos de colores."}, {"tipo": "infografia", "titulo": "El robot de VEXcode VR", "elementos": [{"icono": "🛞", "titulo": "Tren motriz", "texto": "2 ruedas: avanzar y girar"}, {"icono": "🧲", "titulo": "Electroimán", "texto": "Coge y suelta discos"}, {"icono": "👁️", "titulo": "Sensor de color", "texto": "¿Rojo, verde, azul?"}, {"icono": "📏", "titulo": "Distancia y GPS", "texto": "Dónde está y qué tiene delante"}]}, {"tipo": "pasos", "titulo": "Primer paquete", "pasos": ["vr.vex.com → Seleccionar área de juego → **Disk Mover**.", "Abre la ventana de monitorización para ver los sensores.", "Avanza hasta el primer disco.", "Energizar electroimán para **impulsar** (lo coge).", "Gira y avanza hasta la zona de su color.", "Energizar electroimán para **soltar**."], "progresivo": true}, {"tipo": "codigo", "titulo": "Clasificar con el sensor de color (vista Python)", "codigo": "def clasificar():\n    # el disco ya está cogido\n    if down_eye.detect(RED):\n        drivetrain.turn_for(LEFT, 90, DEGREES)\n    elif down_eye.detect(BLUE):\n        drivetrain.turn_for(RIGHT, 90, DEGREES)\n    drivetrain.drive_for(FORWARD, 400, MM)\n    magnet.energize(DROP)\n\nfor i in range(3):   # repetir 3 veces\n    # ir al siguiente disco y cogerlo…\n    magnet.energize(BOOST)\n    clasificar()", "explicacion": ["Programa en **bloques**; esta es su vista en Python.", "**if / elif** = «si / si no, si».", "Las distancias y giros dependen de tu mapa: ajústalos probando."]}, {"tipo": "practica", "titulo": "Retos por niveles", "enunciado": "Supera los niveles en orden y guarda el proyecto después de cada uno (Archivo → Guardar en tu ordenador).", "pasos": ["🥉 Nivel 1: lleva un disco a su zona.", "🥈 Nivel 2: clasifica tres discos con un bucle y el sensor de color.", "🥇 Nivel 3: clasifica todos los discos usando una función («Mis bloques»)."]}, {"tipo": "quiz", "pregunta": "¿Qué parte de tu AGV es un actuador?", "opciones": ["El sensor de color", "El GPS", "El electroimán"], "correcta": 2, "explicacion": "El **electroimán** actúa sobre el mundo (coge y suelta). El sensor de color y el GPS son **sensores**: solo informan."}, {"tipo": "practica", "titulo": "Documenta tu AGV", "enunciado": "Haz capturas (o un vídeo) del robot clasificando y completa la parte 3 del informe: estrategia, sensores, problemas y soluciones, y un fragmento de la vista Python.", "material": ["Plantilla A3 · Informe técnico del almacén"], "enlace": "https://docs.google.com/document/d/1gOxuZK4exAIq-x7SPorPJAWhg7hOv83kMpNmt-vCLys/copy"}, {"tipo": "cierre", "puntos": ["El AGV percibe, decide y actúa.", "El sensor de color permite clasificar.", "Bloques y Python son el mismo programa."], "siguiente": "Hito 6: el informe técnico final (Tarea R2.3)."}]}}, {"n": 6, "fase": "Cierre", "titulo": "Informe técnico del almacén automático", "reto": "Terminar el informe técnico, reflexionar sobre la sostenibilidad del almacén y entregar el producto final (Tarea R2.3). Tiempo orientativo: 1 sesión.", "actividades": [{"nombre": "Completar el informe", "desc": "Completa el informe técnico (anexo A3): portada con los enlaces, el muelle de carga (requisitos, conexiones, código y pruebas), robots por dentro (resumen de la ficha A2 y co orma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": ["CYR.3.1"]}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": []}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": ["CYR.3.1", "CYR.3.3"]}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": ["CYR.3.1", "CYR.3.3"]}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": ["CYR.3.3"]}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["CYR.3.1"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": []}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["CYR.3.3"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["CYR.3.1", "CYR.3.3"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": ["CYR.3.3"]}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": ["CYR.3.1"]}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": []}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": []}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": []}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": []}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": []}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": []}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": ["CYR.3.3"]}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": ["CYR.3.1"]}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": ["CYR.3.1"]}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["CYR.3.3"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": []}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": []}}, "idx": {"criterios": ["CYR.3.1.1", "CYR.3.1.2", "CYR.3.1.4", "CYR.3.3.1"], "competencias": ["CYR.3.1", "CYR.3.3"], "saberes": ["CYR.3.B.1", "CYR.3.C.1", "CYR.3.C.2", "CYR.3.C.3", "CYR.3.C.4", "CYR.3.C.5", "CYR.3.F.1", "CYR.3.F.2", "CYR.3.F.3", "CYR.3.F.4"], "descriptores": ["CC3", "CC4", "CCL3", "CD1", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "STEM2", "STEM3", "STEM5"], "sesionesPorCriterio": {"CYR.3.1.1": [2, 3], "CYR.3.3.1": [3, 6], "CYR.3.1.4": [3, 4, 5, 6], "CYR.3.1.2": [4, 5, 6]}, "porMateria": [{"codigo": "CYR", "criterios": ["CYR.3.1.1", "CYR.3.1.2", "CYR.3.1.4", "CYR.3.3.1"], "competencias": ["CYR.3.1", "CYR.3.3"], "saberes": ["CYR.3.B.1", "CYR.3.C.1", "CYR.3.C.2", "CYR.3.C.3", "CYR.3.C.4", "CYR.3.C.5", "CYR.3.F.1", "CYR.3.F.2", "CYR.3.F.3", "CYR.3.F.4"], "descriptores": ["CC3", "CC4", "CCL3", "CD1", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "STEM2", "STEM3", "STEM5"]}], "materiasTxt": "Computación y Robótica"}, "seneca": {"titulo": "SdA R2: Almacén automático, robots sin robot", "temporalizacion": "6 sesiones (trabajo autónomo organizado en 6 hitos)", "justificacion": "SdA de recuperación trabajada de forma autónoma por hitos y solo con simuladores. El alumno construye y programa en texto el sistema automático de un muelle de carga en Tinkercad Circuits, estudia la morfología de los robots industriales y programa un AGV clasificador en VEXcode VR, evidenciando los criterios de computación física, robótica y construcción de sistemas.", "producto_final": "Informe técnico del almacén automático con el enlace del circuito del muelle de carga en Tinkercad Circuits (programado en texto), el programa del AGV clasificador de VEXcode VR y la ficha de análisis de morfologías de robots.", "concrecion": [{"materia": "Computación y Robótica", "texto": "COMPETENCIAS ESPECÍFICAS\nCYR.3.1.Comprender el impacto que la computación y la robótica tienen en nuestra sociedad y desarrollar el pensamiento computacional para realizar proyectos de construcción de sistemas digitales de forma sostenible.\nCYR.3.3.Diseñar y construir sistemas de computación físicos o robóticos sencillos, aplicando los conocimientos necesarios para desarrollar soluciones automatizadas a problemas planteados.\n\nCRITERIOS DE EVALUACIÓN\nCYR.3.1.1.Comprender el funcionamiento de los sistemas de computación física, sus componentes y principales características.\nCYR.3.1.2.Reconocer los conceptos básicos de la robótica, así como las configuraciones morfológicas más comunes.\nCYR.3.1.4.Comprender los principios de ingeniería en los que se basan los robots, su funcionamiento, componentes y características.\nCYR.3.3.1.Ser capaz de construir un sistema de computación o robótico, promoviendo la interacción con el mundo físico en el contexto de un problema del mundo real, de forma sostenible.\n\nSABERES BÁSICOS\nCYR.3.B.1.Aplicaciones de los sensores IoT.\nCYR.3.C.1.Concepto de grado de libertad.\nCYR.3.C.2.Tipología de las articulaciones.\nCYR.3.C.3.Configuraciones morfológicas y parámetros característicos de los robots industriales.\nCYR.3.C.4.Análisis de los AGV (Automated Guided Vehicles).\nCYR.3.C.5.Programación con lenguaje de texto de microprocesadores.\nCYR.3.F.1.Sistemas de computación: aplicaciones.\nCYR.3.F.2.Microcontroladores: tipología.\nCYR.3.F.3.Hardware: clasificación de los componentes y Software: ciclo de vida.\nCYR.3.F.4.Seguridad eléctrica: cortafuegos o firewall de hardware, y módulos de seguridad de hardware (HSM).\n\nDESCRIPTORES OPERATIVOS\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable."}], "actividades": [{"titulo": "Sistema del muelle de carga", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "1", "tarea": "R2.2 · Sistema del muelle de carga", "descripcion": "Hito 1: El encargo: un almacén que piensa\nReto: Entender el encargo, descubrir qué es un sistema de computación física y preparar los simuladores. Tiempo orientativo: 1 sesión.\n- Leer el encargo. El alumno lee el reto, los hitos y cómo se evalúa. Ve un vídeo corto de un almacén automatizado (robots que mueven estanterías, cintas clasificadoras) y anota en la ficha A1 cuatro máquinas que aparecen.\n- Entrada, proceso y salida. Para cada máquina anota qué percibe (sensor), quién decide (microcontrolador u ordenador) y qué hace (actuador). Ejemplo: puerta automática del supermercado → sensor de presencia → microcontrolador → motor que abre la puerta.\n- Preparar los simuladores. Entra en Tinkercad con el enlace y el código de la clase virtual que le facilita el docente (sin correo personal) y abre un circuito nuevo. Abre vr.vex.com y prueba a mover el robot en el área de juego «Grid Map». Si algo no funciona, lo pregunta en el foro.\n- Moodle Centros: Foro «R2 · Dudas del almacén». Canal para preguntar dudas de los simuladores y del proyecto en cualquier hito.\n- Evidencia: Ficha A1, parte 1 (diagnóstica)\n\nHito 2: Componentes, microcontroladores y primer circuito\nReto: Clasificar los componentes de un sistema de computación, conocer tipos de microcontroladores y montar y programar el primer circuito en Tinkercad. Tiempo orientativo: 1 sesión.\n- Clasificar componentes. Completa la parte 2 de la ficha A1: clasifica componentes de hardware en entrada (sensor de distancia, pulsador, sensor de temperatura), proceso (microcontrolador), salida (LED, zumbador, servo), alimentación y comunicación.\n- Tipos de microcontroladores. Compara Arduino Uno, micro:bit y ESP32 en una tabla (programación, sensores incluidos, conexión wifi/Bluetooth, usos típicos) y el ciclo de vida del software: requisitos, diseño, programación, pruebas, mantenimiento.\n- Seguridad eléctrica y de hardware. Lee en la web de clase por qué un LED necesita resistencia, qué es un cortocircuito y qué hacen un cortafuegos de hardware y un módulo de seguridad de hardware (HSM) en un almacén conectado. Lo resume en la ficha A1 (parte 3).\n- Primer circuito. En Tinkercad monta Arduino Uno + LED + resistencia de 220 Ω en la placa de pruebas. Programa con bloques que el LED parpadee (1 s encendido, 1 s apagado), cambia el modo de código a «Bloques + Texto» para ver el C++ y añade un comentario en el texto. Inicia la simulación y entrega en la Tarea R2.1 el enlace del circuito y la ficha A1. (Plantilla en el anexo A1.)\n- Moodle Centros: Tarea «R2.1 · Ficha de componentes y primer circuito» (corrección Apto / No apto). Verificar que el alumno conoce los componentes y sabe montar y simular un circuito antes del muelle de carga.\n- Evidencia: Ficha A1 completa\n- Evidencia: Circuito de parpadeo en Tinkercad\n- Evidencia: Tarea R2.1 (Apto / No apto)\n\nHito 3: El muelle de carga automático\nReto: Diseñar, montar y programar en texto el sistema del muelle de carga: detecta el camión, abre la puerta y avisa si hay peligro. Tiempo orientativo: 2 sesiones.\n- Requisitos. Lee los requisitos del sistema en la web de clase y los copia en el informe (anexo A3, parte 1): (1) si un camión está a menos de 50 cm (sensor de distancia ultrasónico), el servo abre la puerta (90°) y se enciende el LED verde; (2) si no hay camión, la puerta se cierra (0°) y se enciende el LED rojo; (3) si la temperatura del muelle supera 40 °C (sensor TMP36), suena el zumbador aunque no haya camión.\n- Montaje. En Tinkercad monta Arduino Uno, sensor de distancia ultrasónico (de 3 o 4 pines), micro servo, LED verde y rojo con sus resistencias, zumbador piezoeléctrico y sensor de temperatura TMP36. Dibuja una tabla de conexiones (componente → pin) en el informe.\n- Programa en texto. Programa en modo Texto (C++) a partir del código guía de la web de clase: lee la distancia, lee la temperatura, y con condicionales decide la posición del servo, los LED y el zumbador. Cada bloque del código lleva un comentario explicando qué hace. Muestra la distancia y la temperatura en el monitor serie.\n- Pruebas. En la simulación, arrastra el objeto delante del sensor y cambia la temperatura del TMP36 para probar los tres requisitos. Anota cinco pruebas en la tabla del informe (anexo A3, parte 2) y corrige lo que falle.\n- Entregar. Entrega en la Tarea R2.2 el enlace del circuito (compartido), el código copiado en el informe y las partes 1 y 2 del informe. (Plantilla en el anexo A3.)\n- Moodle Centros: Tarea «R2.2 · Sistema del muelle de carga» (evaluada con rúbrica 1-3-5-7-10). Evaluar el sistema automatizado del muelle: montaje, programación en texto, funcionamiento y pruebas.\n- Evidencia: Circuito del muelle en Tinkercad\n- Evidencia: Código C++ comentado\n- Evidencia: Tabla de pruebas", "temporalizacion": "4 sesiones (trabajo autónomo)", "recursos": "Vídeo de un almacén, Ficha A1, Tinkercad Circuits, Informe técnico (A3)", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, segu r dentro: grados de libertad y morfologías\nReto: Entender qué es un grado de libertad, los tipos de articulaciones y las configuraciones de los robots industriales, y qué es un AGV. Tiempo orientativo: 1 sesión.\n- Mi brazo es un robot. Mueve su propio brazo y cuenta cuántos movimientos independientes puede hacer el hombro, el codo y la muñeca. Así entiende qué es un grado de libertad (GDL).\n- Articulaciones y morfologías. Con la web de clase, completa la ficha A2: articulaciones de rotación y prismáticas (lineales); configuraciones cartesiana, cilíndrica, esférica (polar), SCARA y angular (articulada), con su número de GDL, su espacio de trabajo y un uso típico. Parámetros de un robot industrial: número de GDL, alcance, carga máxima, precisión y velocidad.\n- Robots en vídeo. Ve vídeos de robots industriales (búsqueda propuesta en la web de clase) e identifica en la ficha A2 la configuración de tres robots y sus GDL.\n- AGV. Investiga qué es un AGV (vehículo de guiado automático), cómo se guía (líneas, imanes, láser, visión) y qué sensores usa. Lo relaciona con el robot de VEXcode VR que programará en el hito 5. (Plantilla en el anexo A2.)\n- Evidencia: Ficha A2 de morfologías y AGV\n\nHito 5: El AGV clasificador en VEXcode VR\nReto: Programar el robot virtual de VEXcode VR para que clasifique los discos de colores (paquetes) en sus zonas, usando sensores y el electroimán. Tiempo orientativo: 2 sesiones.\n- Conocer el robot. En vr.vex.com abre el área de juego «Disk Mover» (clasificar discos de colores en las zonas de su color con el electroimán). Explora el robot virtual: tren motriz (dos ruedas motrices = robot móvil de 2 GDL en el plano), electroimán (actuador que coge y suelta discos), sensor de color (ojo), sensor de distancia y posición (GPS).\n- Primer paquete. Programa con bloques que el robot vaya a por el primer disco, lo coja con el electroimán («energizar electroimán para impulsar»), lo lleve a la zona de su color y lo suelte («energizar … para soltar const S = DATA.sa, CUR = DATA.cur, IDX = DATA.idx;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':''); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Hitos donde se trabaja</div><p>${ses.map(n=>'H'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };
