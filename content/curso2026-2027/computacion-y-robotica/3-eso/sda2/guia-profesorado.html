<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 2: Código en Acción - Videojuegos e Historias Interactivas Sostenibles", "numero": 2, "subtitulo": "«Arcade Game Fair 3.º ESO»: creamos, depuramos y publicamos nuestro videojuego retro 2D en MakeCode Arcade", "curso_texto": "3.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Individual en las sesiones 1-9 (con apoyo entre iguales) y equipos de 2-3 con roles profesionales en el proyecto final (sesiones 10-16)", "temporalizacion": "Primer y segundo trimestre (16 sesiones de 50 minutos; orientativo: 8 semanas a 2 sesiones semanales). Peso de la SdA: 30 % de la calificación anual."}, "materias": [{"codigo": "CYR", "criterios": ["CYR.3.1.3", "CYR.3.2.1", "CYR.3.2.2", "CYR.3.5.1", "CYR.3.6.2", "CYR.3.6.3"], "saberes": ["CYR.3.A.1", "CYR.3.A.2", "CYR.3.A.3", "CYR.3.A.4", "CYR.3.A.5", "CYR.3.D.2", "CYR.3.D.3", "CYR.3.E.1", "CYR.3.E.2", "CYR.3.E.4", "CYR.3.I.4", "CYR.3.I.5"]}], "vision": {"descripcion": "Los videojuegos son el producto cultural que más tiempo ocupa al alumnado de 3.º, pero casi nadie sabe qué hay dentro de ellos. En esta situación de aprendizaje el alumnado da el salto de la programación por bloques a la lógica algorítmica y al código textual (JavaScript y Python) diseñando, programando, depurando y publicando un videojuego retro 2D en Microsoft MakeCode Arcade. Por el camino trabaja con variables, condicionales, bucles, eventos y listas, aprende a usar recursos multimedia respetando la Ley de Propiedad Intelectual y las licencias Creative Commons, y publica su proyecto de forma segura.", "contexto": "Grupo de 12 estudiantes de Computación y Robótica de 3.º ESO: 2 con experiencia alta en programación y el resto con experiencia media-baja. En el grupo hay una alumna o alumno con TDA y altas capacidades (doble excepcionalidad), 2 con TDAH y 2 con más dificultades de aprendizaje. Se trabaja en el aula de informática con un ordenador por estudiante, Google Workspace del centro (@g.educaand.es), Scratch para Educación como puente para quien lo necesite y Moodle Centros, donde ya están creadas las Tareas 2.1 a 2.7. La SdA termina con la «Arcade Game Fair 3.º ESO», una feria jugable en el aula.", "justificacion": "La SdA moviliza el bloque de Introducción a la Programación (conexión entre lenguajes visuales y textuales, algoritmos, bucles, condicionales y entornos de interacción con el usuario), la programación orientada a eventos, el análisis de cómo se publica una aplicación web y el bloque de Ciberseguridad (publicación responsable y Ley de Propiedad Intelectual). Evalúa 6 criterios de la materia a través de 5 Tareas con rúbrica que se trasladan a Séneca. Conecta con la competencia digital, la STEM, la emprendedora y la personal y social, y con el ODS 12 (consumo responsable) al analizar el impacto ambiental del sector del videojuego.", "reto": "«Somos un pequeño estudio indie de videojuegos. Tenemos que crear un juego retro 2D original en MakeCode Arcade, sin errores, con recursos que podamos usar legalmente y publicado de forma segura, y presentarlo en la Arcade Game Fair 3.º ESO, donde el resto de estudios lo jugará y lo valorará.»", "pregunta_guia": "¿Qué hay detrás de un videojuego y cómo lo creamos y compartimos de forma responsable?", "producto_final": "Videojuego arcade 2D original programado en equipos de 2-3 en MakeCode Arcade (con eventos, condicionales, bucles, listas, marcador y pantalla de victoria/derrota), publicado con un enlace seguro, acompañado de una memoria con la ficha de depuración y el registro de versiones, una presentación digital de 4 diapositivas y un elevator pitch en la Arcade Game Fair 3.º ESO."}, "metodologias": [{"nombre": "Aprendizaje Basado en Proyectos (ABP)", "descripcion": "Toda la SdA conduce a un videojuego propio que se publica y se juega en una feria ante el grupo."}, {"nombre": "Gamificación", "descripcion": "Diagnóstico con Blooket, mapas de habilidades (Skillmaps) con insignias de MakeCode y retos por niveles (básico, plus y pro) en cada práctica."}, {"nombre": "Aprendizaje basado en retos escalonados", "descripcion": "Cada práctica tiene un reto básico obligatorio y ampliaciones voluntarias para atender ritmos distintos."}, {"nombre": "Símil bloques ↔ código", "descripcion": "Cada estructura se muestra a la vez en bloques, JavaScript y Python para facilitar el salto al código textual."}, {"nombre": "Aprendizaje cooperativo con roles profesionales", "descripcion": "En el proyecto final cada equipo reparte los roles de Lead Programmer, UI/UX y Arte y QA Tester y Documentación."}, {"nombre": "Coevaluación técnica (peer-testing)", "descripcion": "Los equipos prueban los juegos de otros, registran bugs y valoran los juegos en la feria con un formulario."}, {"nombre": "Enseñanza directa interactiva y pensamiento visible", "descripcion": "Explicaciones breves con ejemplos cotidianos (la batería del móvil, la alarma que pospones) antes de cada práctica."}], "recursos": ["Aula de informática (un ordenador por estudiante)", "Proyector y web de clase", "MakeCode Arcade", "Scratch para Educación", "Google Workspace del centro", "Moodle Centros", "Blooket", "Repositorios libres (OpenGameArt, Freesound, Openverse)"], "fases": [{"nombre": "Inicio", "sesiones": "1-3", "finalidad": "Motivación, diagnóstico y primeros pasos en MakeCode Arcade (individual)"}, {"nombre": "Desarrollo", "sesiones": "4-13", "finalidad": "Algoritmos, eventos, listas, licencias Creative Commons y proyecto final en equipos"}, {"nombre": "Cierre", "sesiones": "14-16", "finalidad": "Presentación digital, Arcade Game Fair, coevaluación y reflexión"}], "sesiones": [{"n": 1, "fase": "Inicio", "titulo": "Presentación de la SdA y gaming sostenible", "reto": "Conocer el reto de la Arcade Game Fair, reflexionar sobre el impacto ambiental de los videojuegos y completar un primer mapa de habilidades de MakeCode Arcade.", "actividades": [{"nombre": "Presentación del reto", "min": 8, "desc": "El docente presenta el reto («somos un estudio indie»), el producto final, la Arcade Game Fair y cómo se evalúa (las Tareas 2.1 a 2.7 en Moodle). Muestra en el proyector un juego retro hecho en MakeCode Arcade y pregunta: «¿cuántas decisiones toma este juego por segundo?»."}, {"nombre": "Vídeo y debate: gaming sostenible", "min": 12, "desc": "Se proyecta un vídeo breve sobre el impacto ambiental de los videojuegos (consumo de las consolas, servidores, residuos electrónicos). Debate en gran grupo con tres preguntas: ¿cuánta energía gasta una partida?, ¿qué pasa con una consola vieja?, ¿por qué un juego retro de 160 × 120 píxeles puede ser más sostenible? Se apuntan en la pizarra las ideas de economía circular (reparar, reutilizar, juegos ligeros que funcionan en equipos antiguos)."}, {"nombre": "Diagnóstico con Blooket", "min": 12, "desc": "Juego individual de Blooket sobre lógica de videojuegos (variables, condiciones, bucles, eventos). El docente anota las preguntas con más fallos para reforzarlas en las sesiones 2 y 4 y detecta quién tiene experiencia alta."}, {"nombre": "Skillmap de MakeCode Arcade", "min": 15, "desc": "Cada estudiante abre un mapa de habilidades: «Adventure» (recomendado para empezar) o «Galaxy» (para quien ya ha programado). Completa los primeros tutoriales y consigue la insignia. Hace capturas del mapa completado, de la insignia y del juego resultante. (Plantilla en el anexo A1.)"}, {"nombre": "Entrega y salida", "min": 3, "desc": "Se explica qué se entrega en la Tarea 2.1 y cómo pegar las capturas en la plantilla. Quien no termine el Skillmap lo acaba en casa (funciona en el navegador, también en el móvil)."}], "criterios": ["CYR.3.1.3"], "saberes": ["CYR.3.A.2", "CYR.3.A.5"], "metodologia": ["Gamificación", "Enseñanza directa interactiva"], "evidencias": ["Resultados de Blooket (diagnóstica)", "Capturas del Skillmap y de la insignia"], "recursos": ["Proyector", "Blooket", "MakeCode Arcade Skillmaps"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Dos Skillmaps de distinto nivel para elegir, subtítulos y traducción automática en el vídeo y guía visual de cómo hacer capturas."}, "ejercicios": ["Responde al Blooket de diagnóstico.", "Completa el Skillmap «Adventure» o «Galaxy» y entrega las capturas del mapa, la insignia y el juego."], "moodle": [{"recurso": "Tarea", "nombre": "2.1: Diagnóstico y Skillmap Inicial", "uso": "Comprobar que cada estudiante entra en MakeCode Arcade y completa un primer Skillmap.", "correccion": "apto", "criterio": "CYR.3.1.3", "config": ["Entrega individual", "Archivos: PDF o documento de Google compartido", "Calificación: escala Apto / No apto"], "url_moodle": "https://educacionadistancia.juntadeandalucia.es/centros/malaga/mod/assign/view.php?id=319604", "cotejo": ["Hay una captura del mapa de habilidades completado", "Hay una captura de la insignia obtenida", "Hay una captura del juego resultante en el simulador", "El documento indica qué Skillmap se ha hecho (Adventure o Galaxy)"], "calificable": true, "codigo": "2.1"}], "clase": {"pregunta": "¿Cuántas decisiones toma un videojuego cada segundo?", "diapositivas": [{"tipo": "idea", "icono": "🎮", "titulo": "Nuestro reto: un estudio indie", "texto": "En 16 sesiones crearemos un **videojuego retro 2D** en MakeCode Arcade y lo presentaremos en la **Arcade Game Fair 3.º ESO**.", "puntos": ["Primero aprendemos solos (sesiones 1-9).", "Después, estudios de 2-3 personas (sesiones 10-13).", "Al final, feria jugable (sesiones 14-16)."], "nota": "Enseña un juego de MakeCode Arcade hecho por ti o de la galería y juega 30 segundos."}, {"tipo": "ejemplo", "icono": "⚡", "titulo": "¿Cuánto gasta una partida?", "situacion": "Una consola potente encendida 3 horas al día gasta en un año casi lo mismo que un **frigorífico**.", "explicacion": "Los juegos también consumen en **servidores** y generan **residuos electrónicos**. Un juego retro ligero funciona en ordenadores viejos: alarga su vida.", "pregunta": "¿Qué podemos hacer con una consola que ya no usamos?"}, {"tipo": "video", "titulo": "Gaming sostenible", "busqueda": "videojuegos sostenibles impacto ambiental consolas residuos electrónicos", "texto": "Mira el vídeo y apunta un dato que te sorprenda.", "preguntas": ["¿Qué parte del videojuego gasta más energía?", "¿Qué es la economía circular aplicada a la tecnología?", "¿Por qué un juego de 160 × 120 píxeles puede ser más sostenible?"]}, {"tipo": "practica", "titulo": "Diagnóstico con Blooket", "tiempo": 12, "agrupamiento": "Individual", "enunciado": "Entra con el código que aparece en pantalla y responde. **No cuenta para nota**: sirve para saber de dónde partimos.", "enlace": "https://dashboard.blooket.com/set/6a3dd7f1edbcb5c209fb5595"}, {"tipo": "practica", "titulo": "Elige tu Skillmap", "tiempo": 15, "agrupamiento": "Individual", "enunciado": "Abre **Adventure** si es tu primera vez o **Galaxy** si ya has programado. Completa los primeros tutoriales y consigue la insignia.", "pasos": ["Entra en el Skillmap y sigue las instrucciones.", "Captura el mapa completado y la insignia.", "Captura tu juego funcionando en el simulador."], "enlace": "https://arcade.makecode.com/--skillmap#adventure"}, {"tipo": "practica", "titulo": "Skillmap avanzado: Galaxy", "enunciado": "Para quien ya ha programado: el mapa **Galaxy** trabaja proyectiles, enemigos y vidas.", "enlace": "https://arcade.makecode.com/--skillmap#galaxy"}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 3, "entrega": "Tarea 2.1: Diagnóstico y Skillmap Inicial", "enunciado": "Pega las tres capturas en la plantilla del anexo A1, guárdala en PDF y súbela a Moodle."}, {"tipo": "cierre", "puntos": ["El reto: un videojuego retro para la feria.", "Los videojuegos también tienen impacto ambiental.", "MakeCode Arcade funciona en el navegador."], "siguiente": "Descubrimos la programación escondida en tu móvil.", "pregunta": "Nombra un videojuego que hayas jugado y una decisión que tome el juego."}]}}, {"n": 2, "fase": "Inicio", "titulo": "La programación en el mundo real", "reto": "Descubrir variables, condicionales y bucles en objetos cotidianos y simular uno de ellos en MakeCode Arcade.", "actividades": [{"nombre": "¿Cuántos programas has usado hoy?", "min": 5, "desc": "Lluvia de ideas: despertador, semáforo, recomendador de vídeos, cajero automático, el móvil que avisa de batería baja. El docente apunta en la pizarra qué «decide» cada uno."}, {"nombre": "Exposición dialogada: tres ideas clave", "min": 12, "desc": "El docente explica con la web de clase: 1) Variables, «la mochila»: guardan datos que cambian, como la batería del móvil o la puntuación (score) y las vidas (life) en MakeCode Arcade. 2) Condicionales, «tomar decisiones»: si se cumple una regla, entonces..., como activar el ahorro de batería o sumar puntos al tocar una moneda (on overlap). 3) Bucles, «repetir tareas»: como la alarma que pospones cada 5 minutos o los enemigos que aparecen cada 2 segundos (on game update every). Se proyecta la página de ejemplos para pasar a MakeCode Arcade."}, {"nombre": "Modelado en MakeCode Arcade", "min": 25, "desc": "Cada estudiante elige y simula uno de los tres sistemas: A) Batería del móvil: una variable empieza en 100, baja 10 cada segundo y, si es menor de 20, el sprite dice «Modo ahorro». B) Alarma que se pospone: cada 5 segundos suena un sonido y al pulsar A se pospone. C) Generador de enemigos: cada 2 segundos aparece un enemigo en una posición aleatoria. Reto plus: combinar dos sistemas. Quien tenga más dificultades puede hacerlo en Scratch para Educación con el mismo esquema."}, {"nombre": "Documentación", "min": 8, "desc": "Captura del código en bloques y del simulador y breve explicación con la plantilla (anexo A2): qué variable usa, qué condición comprueba y qué se repite."}], "criterios": ["CYR.3.1.3"], "saberes": ["CYR.3.A.2", "CYR.3.A.3", "CYR.3.A.4"], "metodologia": ["Enseñanza directa interactiva", "Pensamiento visible"], "evidencias": ["Simulación en MakeCode Arcade", "Documento con capturas y explicación"], "recursos": ["Web de ejemplos de la vida real", "MakeCode Arcade", "Scratch para Educación"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Tres sistemas para elegir con distinta dificultad, ejemplos resueltos en la web de ejemplos y Scratch para Educación como alternativa."}, "ejercicios": ["Simula en MakeCode Arcade la batería del móvil, la alarma que se pospone o el generador de enemigos.", "Explica qué variable, qué condicional y qué bucle usa tu simulación."], "moodle": [{"recurso": "Tarea", "nombre": "2.2: Algoritmos de la Vida Real", "uso": "Comprobar que el alumnado reconoce y usa una variable, un condicional y un bucle en una simulación sencilla.", "correccion": "apto", "criterio": "CYR.3.1.3", "config": ["Entrega individual", "Archivos: PDF", "Calificación: escala Apto / No apto"], "url_moodle": "https://educacionadistancia.juntadeandalucia.es/centros/malaga/mod/assign/view.php?id=319659", "cotejo": ["Hay captura del código en bloques", "Hay captura de la simulación funcionando", "La simulación usa una variable y un condicional (si... entonces)", "La explicación indica qué variable, qué condición y qué se repite"], "calificable": true, "codigo": "2.2"}], "clase": {"pregunta": "¿Dónde se esconde la programación en tu día a día?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔋", "titulo": "Variables: la mochila", "situacion": "Tu móvil marca **73 %** de batería. Dentro de un rato marcará 72, 71...", "explicacion": "Una **variable** es una mochila con nombre que guarda un dato que cambia. En MakeCode Arcade: **score** (puntos) y **life** (vidas).", "pregunta": "¿Qué otras variables tiene tu móvil?"}, {"tipo": "ejemplo", "icono": "🪫", "titulo": "Condicionales: tomar decisiones", "situacion": "Cuando la batería baja del **20 %**, el móvil activa solo el modo ahorro.", "explicacion": "**Si** se cumple una regla, **entonces** hace algo. En un juego: si el jugador toca una moneda, entonces suma 1 punto (**on overlap**)."}, {"tipo": "ejemplo", "icono": "⏰", "titulo": "Bucles: repetir tareas", "situacion": "Pospones la alarma y vuelve a sonar **cada 5 minutos**.", "explicacion": "Un **bucle** repite instrucciones. En un juego: cada 2 segundos aparece un enemigo (**on game update every 2000 ms**)."}, {"tipo": "codigo", "titulo": "La batería del móvil en MakeCode Arcade", "codigo": "let bateria = 100\ngame.onUpdateInterval(1000, function () {\n    bateria = bateria - 10\n    movil.sayText(bateria)\n    if (bateria < 20) {\n        movil.sayText(\"Modo ahorro\")\n    }\n})", "explicacion": ["**bateria** es la variable.", "**onUpdateInterval** repite cada segundo (bucle).", "**if** decide cuándo avisar (condicional)."], "pregunta": "¿Qué pasaría si la batería llega a 0? ¿Cómo lo arreglarías?"}, {"tipo": "practica", "titulo": "Simula un sistema real", "tiempo": 25, "agrupamiento": "Individual", "enunciado": "Elige **uno** y prográmalo en MakeCode Arcade (o en Scratch para Educación):", "pasos": ["A) Batería: baja 10 cada segundo y avisa por debajo de 20.", "B) Alarma: suena cada 5 s; al pulsar A se pospone.", "C) Enemigos: aparece uno cada 2 s en un sitio aleatorio.", "Plus: combina dos sistemas."], "enlace": "https://florindotic.es/content/curso2026-2027/computacion-y-robotica/3-eso/sda2/sesiones/ejemplos-vida-real.html"}, {"tipo": "quiz", "pregunta": "En «cada 2 segundos aparece un enemigo», ¿qué estructura es?", "opciones": ["Una variable", "Un bucle", "Un condicional"], "correcta": 1, "explicacion": "Se repite una y otra vez: es un **bucle** (en MakeCode, on game update every)."}, {"tipo": "practica", "titulo": "Documenta y entrega", "tiempo": 8, "entrega": "Tarea 2.2: Algoritmos de la Vida Real", "enunciado": "Usa la plantilla del anexo A2: captura del código, captura del simulador y explica qué **variable**, qué **condición** y qué **se repite**."}, {"tipo": "cierre", "puntos": ["Variable = mochila que guarda un dato.", "Condicional = si... entonces.", "Bucle = repetir."], "siguiente": "Primer juego: El Laberinto.", "pregunta": "Pon un ejemplo de condicional que veas al salir de clase."}]}}, {"n": 3, "fase": "Inicio", "titulo": "Primeros pasos con MakeCode Arcade: El Laberinto", "reto": "Conocer el entorno de MakeCode Arcade, programar el juego guiado «El Laberinto», ver su código en JavaScript y compartirlo con un enlace seguro.", "actividades": [{"nombre": "Tour guiado por el entorno", "min": 8, "desc": "El docente recorre el entorno en el proyector: simulador a la izquierda, categorías de bloques en el centro, editor de sprites y de tilemaps, botón Bloques ↔ JavaScript ↔ Python y botón de compartir. El alumnado lo sigue en su ordenador."}, {"nombre": "Práctica guiada «El Laberinto»", "min": 25, "desc": "Siguiendo el PDF de prácticas: crear un sprite de tipo Player (sprites.create), moverlo con la cruceta (controller.moveSprite), diseñar un tilemap con paredes (walls), hacer que la cámara siga al jugador y colocar una meta: al tocarla, game over con victoria. Reto plus: añadir un temporizador de 30 s. Reto pro: segundo nivel. Las dos personas con experiencia alta hacen de mentoras en los primeros 10 minutos."}, {"nombre": "Revisión del código textual", "min": 7, "desc": "Se cambia a la vista JavaScript y se localizan sprites.create(), controller.moveSprite() y tiles.setCurrentTilemap(). Se comenta que un bloque es una línea de código y que los paréntesis llevan los datos (parámetros)."}, {"nombre": "Compartir con seguridad y entregar", "min": 10, "desc": "El docente muestra el botón Compartir: el enlace es público para quien lo tenga. Antes de compartir se revisa que el título no lleve el nombre completo ni datos personales. El alumnado genera el enlace, hace las capturas y entrega con la plantilla del anexo A3."}], "criterios": ["CYR.3.5.1", "CYR.3.6.2"], "saberes": ["CYR.3.A.1", "CYR.3.A.2", "CYR.3.A.5", "CYR.3.E.1", "CYR.3.I.4"], "metodologia": ["Descubrimiento guiado", "Símil bloques ↔ código"], "evidencias": ["Juego «El Laberinto» funcionando", "Enlace compartido", "Capturas del código en bloques y JavaScript"], "recursos": ["PDF de El Laberinto", "MakeCode Arcade"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "PDF con capturas paso a paso, proyecto plantilla con el tilemap ya dibujado para quien lo necesite y mentoría entre iguales."}, "ejercicios": ["Programa «El Laberinto»: jugador, control con la cruceta, tilemap con paredes y meta.", "Cambia a JavaScript y localiza las funciones sprites.create y controller.moveSprite.", "Comparte el juego con un enlace sin datos personales."], "moodle": [{"recurso": "Tarea", "nombre": "2.3: Práctica Guiada El Laberinto (CEv 5.1, 6.2)", "uso": "Primera Tarea evaluable: el juego guiado, su código en bloques y JavaScript y el enlace compartido de forma segura.", "correccion": "rubrica", "criterio": "CYR.3.5.1", "config": ["Entrega individual", "Archivos: PDF con capturas y enlace del proyecto", "Método de calificación: Rúbrica"], "url_moodle": "https://educacionadistancia.juntadeandalucia.es/centros/malaga/mod/assign/view.php?id=319664", "rubrica": [{"linea": "Jugador y control con la cruceta", "criterio": "CYR.3.5.1", "niveles": ["No hay sprite jugador o no se mueve.", "Hay sprite jugador, pero no responde bien a la cruceta.", "El jugador se mueve con la cruceta.", "El jugador se mueve y la cámara lo sigue.", "Además el sprite es propio y el movimiento está ajustado (velocidad adecuada)."]}, {"linea": "Tilemap con paredes y meta", "criterio": "CYR.3.5.1", "niveles": ["No hay tilemap.", "Hay tilemap, pero sin paredes: el jugador lo atraviesa.", "El laberinto tiene paredes que bloquean al jugador.", "Paredes correctas y una meta que da la victoria.", "Además añade un temporizador o un segundo nivel."]}, {"linea": "De los bloques a JavaScript", "criterio": "CYR.3.5.1", "niveles": ["No hay captura del código.", "Solo hay captura de los bloques.", "Hay captura de bloques y de JavaScript.", "Señala en JavaScript qué línea corresponde a cada bloque principal.", "Explica con sus palabras qué hacen sprites.create y controller.moveSprite y sus parámetros."]}, {"linea": "Enlace compartido y publicación segura", "criterio": "CYR.3.6.2", "niveles": ["No entrega enlace.", "El enlace no funciona o no es el del proyecto.", "El enlace funciona.", "El enlace funciona y el proyecto no incluye datos personales.", "Además explica quién puede ver el juego con ese enlace."]}], "criterios_rubrica": ["CYR.3.5.1", "CYR.3.6.2"], "calificable": true, "codigo": "2.3"}], "clase": {"pregunta": "¿Qué pasa por dentro cuando pulsas la cruceta?", "diapositivas": [{"tipo": "infografia", "titulo": "El entorno de MakeCode Arcade", "elementos": [{"icono": "🕹️", "titulo": "Simulador", "texto": "Prueba el juego al momento."}, {"icono": "🧩", "titulo": "Bloques", "texto": "Categorías: Sprites, Controller, Scene, Info…"}, {"icono": "🎨", "titulo": "Editores", "texto": "Dibuja sprites y tilemaps."}, {"icono": "⌨️", "titulo": "JavaScript / Python", "texto": "El mismo programa, en texto."}], "nota": "Haz el recorrido en directo y pide que todo el mundo encuentre el botón de compartir."}, {"tipo": "practica", "titulo": "El Laberinto (guiado)", "tiempo": 25, "agrupamiento": "Individual (mentoría entre iguales)", "enunciado": "Sigue el PDF de prácticas y construye el laberinto.", "pasos": ["Crea un sprite de tipo **Player**.", "Muévelo con **move mySprite with buttons**.", "Dibuja un tilemap y marca las **paredes**.", "La cámara sigue al jugador y la meta da la victoria.", "Plus: temporizador de 30 s · Pro: segundo nivel."], "enlace": "https://drive.google.com/file/d/1jfLrnzg82DiNSX-IYEYpVvKFYCFK8y-7/view?usp=drive_link"}, {"tipo": "codigo", "titulo": "Lo que hay detrás de los bloques", "codigo": "let jugador = sprites.create(img`...`, SpriteKind.Player)\ncontroller.moveSprite(jugador)\ntiles.setCurrentTilemap(tilemap`laberinto`)\nscene.cameraFollowSprite(jugador)", "explicacion": ["Cada **bloque** es una **línea**.", "Los paréntesis llevan los **datos** (parámetros).", "**SpriteKind.Player** dice de qué tipo es el sprite."], "pregunta": "¿Qué cambiarías para que el jugador vaya más despacio?"}, {"tipo": "quiz", "pregunta": "¿Qué hace controller.moveSprite(jugador)?", "opciones": ["Dibuja el jugador", "Mueve el jugador con la cruceta", "Hace que la cámara lo siga"], "correcta": 1, "explicacion": "Conecta la **cruceta** con el sprite: es la línea del bloque «move with buttons»."}, {"tipo": "ejemplo", "icono": "🔗", "titulo": "Compartir no es lo mismo que publicar a lo loco", "situacion": "Pulsas **Compartir** y MakeCode te da un enlace. Cualquiera que lo tenga puede jugar y ver tu código.", "explicacion": "Por eso el título y el juego **no llevan** tu nombre completo, tu foto ni tu centro. Usa un nombre de estudio o un alias."}, {"tipo": "practica", "titulo": "Comparte y entrega", "tiempo": 10, "entrega": "Tarea 2.3: Práctica Guiada El Laberinto", "enunciado": "Genera el enlace, haz capturas del juego, de los bloques y de JavaScript y completa la plantilla del anexo A3."}, {"tipo": "cierre", "puntos": ["Sprite + cruceta + tilemap = primer juego.", "Bloques y JavaScript son el mismo programa.", "Comparte sin datos personales."], "siguiente": "Condicionales, bucles y un juego de plataformas.", "pregunta": "¿Quién puede ver tu juego si compartes el enlace?"}]}}, {"n": 4, "fase": "Desarrollo", "titulo": "Condicionales, bucles y pseudocódigo", "reto": "Entender cómo se escriben en JavaScript y Python los condicionales, los bucles y los eventos, y empezar el juego guiado «Plataformas».", "actividades": [{"nombre": "Calentamiento", "min": 5, "desc": "Quiz rápido en la web de clase con las preguntas del Blooket que más fallaron (qué es una variable, qué es un bucle)."}, {"nombre": "Taller de sintaxis: bloques ↔ código", "min": 15, "desc": "Repaso para el alumnado de nueva matrícula y profundización para el resto. El docente proyecta a la vez el bloque y su código: if-then-else → if (...) { } else { }; repeat 4 → for (let i = 0; i < 4; i++) { }; on overlap → sprites.onOverlap(...); forever → forever(function () { }). Ejemplo: al chocar con un enemigo se pierde una vida (info.changeLifeBy(-1))."}, {"nombre": "Pseudocódigo de las reglas de un juego", "min": 10, "desc": "En parejas, escriben en pseudocódigo las reglas de un juego conocido (por ejemplo, el dinosaurio sin conexión de Chrome): «SI toca un cactus ENTONCES fin de partida; MIENTRAS el juego siga, suma 1 punto cada segundo». Se comparten dos ejemplos en voz alta."}, {"nombre": "Plataformas guiado (parte 1)", "min": 20, "desc": "Siguiendo el PDF de Plataformas: sprite con gravedad (ay), movimiento solo horizontal, salto con el botón A cuando toca el suelo (isHittingTile) y tilemap con plataformas. El docente abre el foro «Detector de bugs y minitutoriales» para que se publiquen dudas y soluciones."}], "criterios": ["CYR.3.1.3", "CYR.3.2.1"], "saberes": ["CYR.3.A.1", "CYR.3.A.4", "CYR.3.D.2"], "metodologia": ["Símil bloques ↔ código", "Aprendizaje basado en retos escalonados"], "evidencias": ["Pseudocódigo de las reglas", "Plataformas en progreso"], "recursos": ["PDF de Plataformas", "MakeCode Arcade"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Tabla de equivalencias bloques-JavaScript-Python en la web de clase y proyecto plantilla con la gravedad ya configurada."}, "ejercicios": ["Escribe en pseudocódigo las reglas del juego del dinosaurio de Chrome.", "Programa la gravedad y el salto del juego Plataformas."], "moodle": [{"recurso": "Foro", "nombre": "Detector de bugs y minitutoriales", "uso": "Espacio abierto hasta el final de la SdA para publicar un bug con su captura, ayudar a resolverlo o compartir un minitutorial (un truco de MakeCode en 3-5 pasos).", "config": ["Tipo: foro para uso general", "Suscripción opcional", "No calificable (se tiene en cuenta en la observación)"]}], "clase": {"pregunta": "¿Cómo se escribe un bloque con letras?", "diapositivas": [{"tipo": "quiz", "pregunta": "¿Qué guarda la variable life en MakeCode Arcade?", "opciones": ["La puntuación", "Las vidas", "El tiempo"], "correcta": 1, "explicacion": "**life** son las vidas y **score** la puntuación."}, {"tipo": "comparar", "titulo": "El mismo programa, tres idiomas", "columnas": [{"titulo": "Bloques", "icono": "🧩", "puntos": ["if ‹choca› then", "  cambiar vidas en -1"]}, {"titulo": "JavaScript", "icono": "🟨", "puntos": ["if (choca) {", "  info.changeLifeBy(-1)", "}"]}, {"titulo": "Python", "icono": "🐍", "puntos": ["if choca:", "    info.change_life_by(-1)"]}], "texto": "Llaves { } en JavaScript; sangría (espacios) en Python."}, {"tipo": "codigo", "titulo": "Eventos, condicionales y bucles en un juego", "codigo": "// Evento: al chocar con un enemigo\nsprites.onOverlap(SpriteKind.Player, SpriteKind.Enemy, function (sprite, otherSprite) {\n    info.changeLifeBy(-1)\n    otherSprite.destroy()\n})\n// Bucle: se repite siempre\nforever(function () {\n    if (info.score() >= 10) {\n        game.gameOver(true)\n    }\n})", "explicacion": ["**onOverlap** se dispara cuando dos sprites se tocan (evento).", "**forever** repite sin parar (bucle).", "**if** comprueba la condición de victoria."]}, {"tipo": "ejemplo", "icono": "🦖", "titulo": "Las reglas del dinosaurio de Chrome", "situacion": "Sin internet, Chrome te deja saltar cactus con un dinosaurio.", "explicacion": "SI toca un cactus ENTONCES fin de partida. MIENTRAS siga vivo, suma puntos. SI pulsa espacio Y está en el suelo ENTONCES salta. Eso es **pseudocódigo**."}, {"tipo": "practica", "titulo": "Pseudocódigo en pareja", "tiempo": 10, "agrupamiento": "Parejas", "enunciado": "Escribid en pseudocódigo las **reglas** de un juego que conozcáis: cómo se gana, cómo se pierde y qué se repite. Usad SI... ENTONCES y MIENTRAS."}, {"tipo": "practica", "titulo": "Plataformas (parte 1)", "tiempo": 20, "agrupamiento": "Individual", "enunciado": "Sigue el PDF de Plataformas hasta tener **gravedad y salto**.", "pasos": ["Gravedad: **jugador.ay = 300**.", "Movimiento solo horizontal: **controller.moveSprite(jugador, 100, 0)**.", "Salto con A solo si toca el suelo (**isHittingTile**).", "¿Un bug? Publícalo en el foro «Detector de bugs»."], "enlace": "https://drive.google.com/file/d/1B4KmOh7RNGR_bx-99m-VInvWnBZHNFRp/view?usp=drive_link"}, {"tipo": "cierre", "puntos": ["Bloque = código: if, for, forever, onOverlap.", "Pseudocódigo = reglas en lenguaje natural.", "El foro sirve para pedir y dar ayuda."], "siguiente": "Terminamos Plataformas con monedas, cuenta atrás y victoria.", "pregunta": "Escribe en JavaScript: si la puntuación llega a 5, ganas."}]}}, {"n": 5, "fase": "Desarrollo", "titulo": "Reto Plataformas: monedas, cuenta atrás y victoria", "reto": "Modificar el juego Plataformas con plataformas a varias alturas, monedas que suman puntos, una cuenta atrás y una condición propia de victoria o derrota.", "actividades": [{"nombre": "Repaso del salto", "min": 5, "desc": "El docente resuelve en directo el bug más repetido de la sesión anterior (el doble salto infinito) y lo publica en el foro como minitutorial."}, {"nombre": "Reto de modificación", "min": 30, "desc": "Cada estudiante modifica su Plataformas: 1) plataformas a varias alturas en el tilemap; 2) monedas (SpriteKind.Food o tiles de moneda) que suman 1 punto al tocarlas (on overlap); 3) cuenta atrás de 30-60 s (info.startCountdown) o un bucle que genera enemigos; 4) condición propia de victoria o derrota (por ejemplo, ganar al reunir 10 monedas antes de que acabe el tiempo). Reto pro: enemigos que persiguen al jugador (follow) o un segundo nivel."}, {"nombre": "Pseudocódigo de mis reglas", "min": 8, "desc": "En la plantilla (anexo A4) cada estudiante escribe en pseudocódigo la condición de victoria y de derrota de su juego y la relaciona con el bloque y la línea de JavaScript correspondiente."}, {"nombre": "Compartir y entregar", "min": 7, "desc": "Generan el enlace seguro (sin datos personales), hacen capturas y entregan en la Tarea 2.4."}], "criterios": ["CYR.3.1.3", "CYR.3.2.1", "CYR.3.6.2"], "saberes": ["CYR.3.A.3", "CYR.3.A.4", "CYR.3.A.5", "CYR.3.D.2", "CYR.3.I.4"], "metodologia": ["Aprendizaje basado en retos escalonados", "Símil bloques ↔ código"], "evidencias": ["Juego Plataformas modificado", "Pseudocódigo de las reglas", "Enlace compartido"], "recursos": ["PDF de Plataformas", "MakeCode Arcade", "Foro de bugs"], "dua": {"principios": ["Compromiso", "Andamiaje"], "medidas": "Reto en cuatro pasos independientes (se puede entregar con los dos primeros), retos pro para altas capacidades y tarjetas de ayuda con el bloque de cuenta atrás."}, "ejercicios": ["Añade plataformas a varias alturas y monedas que sumen puntos.", "Programa una cuenta atrás o un bucle y una condición de victoria o derrota propia.", "Escribe en pseudocódigo las reglas de tu juego."], "moodle": [{"recurso": "Tarea", "nombre": "2.4: Modificación de Juego Plataformas (CEv 1.3, 2.1, 6.2)", "uso": "Tarea evaluable del bloque de condicionales y bucles: juego modificado, pseudocódigo y enlace.", "correccion": "rubrica", "criterio": "CYR.3.2.1", "config": ["Entrega individual", "Archivos: PDF con capturas, pseudocódigo y enlace", "Método de calificación: Rúbrica"], "url_moodle": "https://educacionadistancia.juntadeandalucia.es/centros/malaga/mod/assign/view.php?id=320068", "rubrica": [{"linea": "Plataformas a varias alturas", "criterio": "CYR.3.2.1", "niveles": ["No hay cambios en el nivel.", "Añade plataformas, pero no se pueden alcanzar.", "Hay plataformas a varias alturas alcanzables con el salto.", "El nivel tiene un recorrido pensado de principio a fin.", "Además el nivel aumenta de dificultad o tiene un segundo nivel."]}, {"linea": "Monedas y puntuación", "criterio": "CYR.3.2.1", "niveles": ["No hay monedas.", "Hay monedas, pero no suman puntos.", "Las monedas suman puntos al tocarlas.", "Las monedas suman y desaparecen; el marcador se ve siempre.", "Además hay objetos de distinto valor o sonido al recogerlos."]}, {"linea": "Cuenta atrás o bucle y regla de victoria/derrota", "criterio": "CYR.3.2.1", "niveles": ["No hay temporizador ni bucle ni condición de fin.", "Hay temporizador o bucle, pero el juego no termina.", "El juego termina con victoria o derrota.", "La condición combina dos datos (puntos y tiempo, o vidas y puntos).", "Condición original y equilibrada, probada y ajustada."]}, {"linea": "Pseudocódigo y equivalencia con el código", "criterio": "CYR.3.1.3", "niveles": ["No hay pseudocódigo.", "El pseudocódigo no corresponde al juego.", "El pseudocódigo describe la victoria o la derrota.", "Describe las dos y señala el bloque correspondiente.", "Además relaciona cada regla con su línea de JavaScript o Python."]}, {"linea": "Enlace compartido", "criterio": "CYR.3.6.2", "niveles": ["No hay enlace.", "El enlace no funciona.", "El enlace funciona.", "Funciona y el proyecto no tiene datos personales.", "Además el proyecto tiene un título y una descripción claros sin datos personales."]}], "criterios_rubrica": ["CYR.3.2.1", "CYR.3.1.3", "CYR.3.6.2"], "calificable": true, "codigo": "2.4"}], "clase": {"pregunta": "¿Qué hace que un juego sea un reto y no un paseo?", "diapositivas": [{"tipo": "codigo", "titulo": "Bug famoso: el salto infinito", "codigo": "controller.A.onEvent(ControllerButtonEvent.Pressed, function () {\n    if (jugador.isHittingTile(CollisionDirection.Bottom)) {\n        jugador.vy = -150\n    }\n})", "explicacion": ["Sin el **if**, el jugador salta en el aire una y otra vez.", "**isHittingTile(Bottom)**: solo salta si toca el suelo.", "**vy** negativa = hacia arriba."]}, {"tipo": "ejemplo", "icono": "🍄", "titulo": "Los juegos de plataformas clásicos", "situacion": "En los plataformas clásicos recoges monedas, el tiempo corre y llegas a la meta.", "explicacion": "Detrás hay **variables** (monedas, tiempo), **eventos** (tocar una moneda) y **condiciones** (si el tiempo llega a 0, pierdes)."}, {"tipo": "codigo", "titulo": "Monedas y cuenta atrás", "codigo": "sprites.onOverlap(SpriteKind.Player, SpriteKind.Food, function (sprite, moneda) {\n    moneda.destroy()\n    info.changeScoreBy(1)\n})\ninfo.startCountdown(45)\ninfo.onCountdownEnd(function () {\n    game.gameOver(info.score() >= 10)\n})", "explicacion": ["Al tocar una moneda: desaparece y **suma 1**.", "**startCountdown(45)**: 45 segundos.", "Al acabar el tiempo: gana si tiene 10 o más."]}, {"tipo": "practica", "titulo": "Reto de modificación", "tiempo": 30, "agrupamiento": "Individual", "enunciado": "Convierte el Plataformas en **tu** juego:", "pasos": ["1. Plataformas a varias alturas.", "2. Monedas que suman puntos.", "3. Cuenta atrás o bucle de enemigos.", "4. Tu propia regla de victoria o derrota.", "Pro: enemigos que te persiguen o segundo nivel."]}, {"tipo": "quiz", "pregunta": "¿Qué pasa con game.gameOver(info.score() >= 10) si tienes 7 monedas?", "opciones": ["Ganas", "Pierdes", "El juego sigue"], "correcta": 1, "explicacion": "7 >= 10 es **falso**, así que gameOver(false): **derrota**."}, {"tipo": "practica", "titulo": "Pseudocódigo y entrega", "tiempo": 15, "entrega": "Tarea 2.4: Modificación de Juego Plataformas", "enunciado": "Completa la plantilla del anexo A4 (pseudocódigo de tus reglas y su bloque o línea de código), comparte el juego sin datos personales y entrégalo."}, {"tipo": "cierre", "puntos": ["Evento + condicional = reglas del juego.", "Cuenta atrás = presión de tiempo.", "Pseudocódigo antes de programar."], "siguiente": "¿Podemos usar cualquier música o sprite de internet?", "pregunta": "Escribe la regla de derrota de tu juego en una frase."}]}}, {"n": 6, "fase": "Desarrollo", "titulo": "Recursos multimedia y licencias Creative Commons", "reto": "Distinguir las licencias Creative Commons, buscar sprites y sonidos que podamos usar legalmente y aprender a atribuirlos.", "actividades": [{"nombre": "Gancho: ¿puedo usar esta canción?", "min": 7, "desc": "El docente plantea: «Quiero poner en mi juego la canción de moda y el personaje de un videojuego famoso, ¿puedo?». Votación a mano alzada y debate breve. Se cuenta que muchos vídeos y juegos amateurs se retiran por usar música o personajes protegidos."}, {"nombre": "Ley de Propiedad Intelectual y licencias CC", "min": 12, "desc": "Explicación con la web de clase: los derechos de autor protegen una obra desde que se crea; las licencias Creative Commons permiten usarla con condiciones. Se ven los cuatro símbolos (BY reconocimiento, SA compartir igual, NC no comercial, ND sin obras derivadas) y las licencias que más se usan en juegos: CC BY, CC BY-SA, CC BY-NC y CC0 (dominio público). Se explica la fórmula de atribución TASL: título, autoría, fuente y licencia."}, {"nombre": "¿Puedo usarlo? (casos)", "min": 8, "desc": "Cinco casos rápidos en la web de clase (un sprite CC BY-NC para un juego que se vende, un sonido CC0, una música CC BY-SA, una imagen de un buscador sin licencia, un sprite de la galería de MakeCode). Cada estudiante responde y se corrige en grupo."}, {"nombre": "Búsqueda en repositorios libres", "min": 18, "desc": "Cada estudiante busca para su futuro juego 2 sprites o fondos (OpenGameArt, Openverse o la galería de MakeCode) y 1 efecto de sonido (Freesound), comprueba la licencia y los anota en la ficha de atribución (anexo A5). Importante: no se descarga nada que pida registro con datos personales; Freesound solo se usa para escuchar y anotar si no hay cuenta del centro."}, {"nombre": "Ficha de atribución", "min": 5, "desc": "Revisión entre compañeros: cada estudiante comprueba que la ficha del de al lado tiene título, autoría, fuente y licencia de cada recurso. La ficha se usará en las Tareas 2.5 y 2.6 y en la presentación final."}], "criterios": ["CYR.3.6.3"], "saberes": ["CYR.3.I.5"], "metodologia": ["Investigación guiada", "Aprendizaje cooperativo"], "evidencias": ["Ficha de atribución de recursos", "Respuestas a los casos"], "recursos": ["OpenGameArt", "Freesound", "Openverse", "Galería de MakeCode"], "dua": {"principios": ["Representación", "Compromiso"], "medidas": "Tarjeta resumen con los cuatro símbolos CC y ejemplos, casos con imágenes y búsqueda guiada con tres enlaces directos."}, "ejercicios": ["Decide si puedes usar cada recurso de los casos y explica por qué.", "Busca 2 sprites o fondos y 1 sonido con licencia libre y atribúyelos en la ficha."], "moodle": [], "clase": {"pregunta": "¿Todo lo que está en internet se puede usar?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎵", "titulo": "La canción de moda en tu juego", "situacion": "Subes tu juego con la canción del verano y, a los dos días, la plataforma lo retira.", "explicacion": "La música tiene **derechos de autor** desde que se crea. Usarla sin permiso es infringir la **Ley de Propiedad Intelectual**, aunque no ganes dinero.", "pregunta": "¿Y si cito al autor? ¿Ya puedo usarla?"}, {"tipo": "video", "titulo": "¿Qué son las licencias Creative Commons?", "busqueda": "licencias Creative Commons explicación sencilla para estudiantes", "preguntas": ["¿Qué significa BY?", "¿Qué diferencia hay entre NC y SA?"]}, {"tipo": "infografia", "titulo": "Las licencias que usaremos", "elementos": [{"icono": "👤", "titulo": "CC BY", "texto": "Úsalo como quieras, **citando** al autor/a."}, {"icono": "🔁", "titulo": "CC BY-SA", "texto": "Cita y comparte tu obra con la **misma licencia**."}, {"icono": "🚫💶", "titulo": "CC BY-NC", "texto": "Cita y **sin fines comerciales**."}, {"icono": "🆓", "titulo": "CC0", "texto": "Dominio público: **sin condiciones**."}], "nota": "Menciona también ND (sin obras derivadas): no sirve para juegos porque no se puede modificar."}, {"tipo": "pasos", "titulo": "Cómo atribuir un recurso (TASL)", "progresivo": true, "pasos": ["**T**ítulo: «Pixel Coin».", "**A**utoría: «Ana Pixel».", "**S** fuente: enlace a la página de OpenGameArt.", "**L**icencia: CC BY 4.0, con enlace."], "texto": "Ejemplo: «Pixel Coin» de Ana Pixel (OpenGameArt), CC BY 4.0."}, {"tipo": "quiz", "pregunta": "Vas a vender tu juego por 1 €. ¿Puedes usar un sprite CC BY-NC?", "opciones": ["Sí, si lo cito", "No, porque es de uso no comercial", "Sí, si lo modifico"], "correcta": 1, "explicacion": "NC = **no comercial**. Si vendes el juego no puedes usarlo, aunque lo cites o lo modifiques."}, {"tipo": "quiz", "pregunta": "Una imagen de un buscador sin licencia indicada…", "opciones": ["Se puede usar porque está en internet", "Se considera protegida: mejor no usarla", "Es dominio público"], "correcta": 1, "explicacion": "Si no sabemos la licencia, está **protegida** por defecto. Busca en repositorios con licencia clara."}, {"tipo": "practica", "titulo": "Busca tus recursos", "tiempo": 18, "agrupamiento": "Individual", "enunciado": "Busca **2 sprites o fondos** y **1 sonido** para tu futuro juego y anótalos en la ficha de atribución (anexo A5).", "pasos": ["OpenGameArt u Openverse para sprites y fondos.", "Freesound para sonidos (solo escuchar y anotar si no hay cuenta del centro).", "Comprueba la licencia antes de anotar.", "Nunca te registres con tus datos personales."], "enlace": "https://openverse.org"}, {"tipo": "cierre", "puntos": ["Todo tiene derechos de autor desde que se crea.", "CC = permiso con condiciones.", "Atribuye con TASL."], "siguiente": "Listas: guardar muchos datos en una sola variable.", "pregunta": "¿Qué licencia elegirías para tu juego y por qué?"}]}}, {"n": 7, "fase": "Desarrollo", "titulo": "Las listas (arrays): un estante numerado", "reto": "Entender qué es una lista, cómo se numeran sus posiciones y usarla para crear un selector aleatorio de frases o premios.", "actividades": [{"nombre": "Gancho: tu playlist", "min": 5, "desc": "El docente pregunta: «¿cómo sabe la app de música cuál es la canción 3 de tu playlist?». Una playlist, la lista de la compra o la clasificación de una liga son listas: muchos datos ordenados en una sola variable."}, {"nombre": "Analogía del estante numerado", "min": 12, "desc": "Explicación con la infografía del estante: cada balda es una posición (índice) que empieza en 0; la longitud es el número de elementos; leer un elemento (get value at index → lista[i]); añadir al final (add value to end → lista.push()). Se ve por qué el último índice es length - 1."}, {"nombre": "Bloques Arrays ↔ código", "min": 8, "desc": "En el proyector, la categoría Arrays de MakeCode Arcade y su equivalente en JavaScript: let premios = [\"Escudo\", \"Vida extra\", \"Turbo\"], premios[0], premios.length, premios.push(\"Imán\"), premios._pickRandom() o premios[randint(0, premios.length - 1)]."}, {"nombre": "Práctica: el cofre de premios", "min": 20, "desc": "Cada estudiante programa un minijuego: al pulsar A, un cofre muestra un premio elegido al azar de una lista de 5 elementos y suma puntos. Reto plus: con B se añade un premio nuevo con push y se muestra la longitud. Reto pro: una lista de posiciones donde aparecen monedas o una lista de mensajes para un NPC (anticipa la sesión 8)."}, {"nombre": "Comprobación", "min": 5, "desc": "Quiz de índices en la web de clase y publicación en el foro de un bug típico (índice fuera de rango) con su solución."}], "criterios": ["CYR.3.1.3", "CYR.3.2.1"], "saberes": ["CYR.3.A.1", "CYR.3.A.4"], "metodologia": ["Tinkering", "Símil bloques ↔ código"], "evidencias": ["Minijuego del cofre de premios"], "recursos": ["MakeCode Arcade", "Infografía del estante"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Infografía del estante con índices, proyecto plantilla con la lista ya creada y retos plus y pro."}, "ejercicios": ["Crea una lista de 5 premios y muestra uno al azar al pulsar A.", "Añade un premio con push y muestra la longitud de la lista."], "moodle": [], "clase": {"pregunta": "¿Cómo guardas 100 datos sin crear 100 variables?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎧", "titulo": "Tu playlist es una lista", "situacion": "Tienes 30 canciones en orden. Pulsas «siguiente» y suena la que está en la posición siguiente.", "explicacion": "Una **lista** (array) guarda muchos datos **en orden** dentro de una sola variable. Cada dato tiene su aje basado en retos escalonados"], "evidencias": ["Guion del minijuego", "Minijuego en progreso"], "recursos": ["MakeCode Arcade", "Ficha de atribución", "Plantilla de guion"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Plantilla de guion con un ejemplo hecho, proyecto base con el NPC y la lista vacía para rellenar, y opción de explicar las licencias con iconos además de texto."}, "ejercicios": ["Escribe el guion con la explicación y un ejemplo de cada licencia CC.", "Programa un NPC que muestre las explicaciones de una lista una a una."], "moodle": [], "clase": {"pregunta": "¿Puede un videojuego enseñar algo de verdad?", "diapositivas": [{"tipo": "ejemplo", "icono": "🧙", "titulo": "Los personajes que te hablan", "situacion": "En muchos juegos te acercas a un personaje, pulsas A y te cuenta algo. Vuelves a pulsar y sigue la conversación.", "explicacion": "Las frases están guardadas en una **lista** y una variable **índice** recuerda por cuál va. Cada pulsación es un **evento**."}, {"tipo": "flujo", "titulo": "Cómo funciona el diálogo", "nodos": [{"texto": "Pulsar A cerca del NPC (evento)", "tipo": "inicio"}, {"texto": "¿índice < licencias.length?", "tipo": "decision"}, {"texto": "Sí → mostrar licencias[índice] y sumar 1 al índice", "tipo": "proceso"}, {"texto": "No → «¡Ya conoces las 4 licencias!»", "tipo": "fin"}]}, {"tipo": "practica", "titulo": "Escribe el guion", "tiempo": 12, "agrupamiento": "Individual", "enunciado": "Completa la plantilla del anexo A6: **una frase y un ejemplo** por licencia, máximo 2 líneas cada una.", "pasos": ["CC BY, CC BY-SA, CC BY-NC y CC0.", "¿Dónde ocurre la historia?", "¿Qué evento hace hablar al NPC?"]}, {"tipo": "codigo", "titulo": "El NPC en JavaScript", "codigo": "let licencias = [\"CC BY: úsalo citando a su autor/a.\", \"CC BY-SA: cita y comparte igual.\", \"CC BY-NC: cita y sin vender.\", \"CC0: dominio público, sin condiciones.\"]\nlet indice = 0\ncontroller.A.onEvent(ControllerButtonEvent.Pressed, ltos.", "Las explicaciones salen de la lista con un índice.", "Lista e índice correctos y el diálogo recorre las 4 licencias.", "Además usa una segunda lista (nombres, sprites o preguntas) de forma coherente."]}, {"linea": "Eventos e interacción con el NPC", "criterio": "CYR.3.2.2", "niveles": ["No hay interacción.", "El diálogo aparece solo, sin evento del jugador.", "Un evento (botón u overlap) hace avanzar el diálogo.", "Varios eventos coordinados (acercarse + pulsar A) y pantalla de inicio con instrucciones.", "Además hay un test final o una respuesta distinta según lo que hace el jugador."]}, {"linea": "Rigor de las explicaciones de las licencias", "criterio": "CYR.3.6.3", "niveles": ["Las explicaciones faltan o son incorrectas.", "Explica 1-2 licencias o con errores.", "Explica bien las 4 licencias.", "Explica las 4 con un ejemplo de uso cada una.", "Además diferencia con claridad cuándo se puede usar en un juego que se vende."]}, {"linea": "Atribución de los recursos del minijuego", "criterio": "CYR.3.6.3", "niveles": ["Usa recursos ajenos sin citar.", "Cita algunos recursos sin licencia o sin fuente.", "Cita todos los recursos ajenos o indica que son de la galería de MakeCode.", "Atribución completa (título, autoría, fuente y licencia) en el juego o la descripción.", "Además elige y justifica una licencia CC para su propio minijuego."]}, {"linea": "Depuración de los índices", "criterio": "CYR.3.2.1", "niveles": ["El juego se bloquea o muestra errores.", "Se sale de la lista o se salta una licencia.", "Recorre la lista sin errores.", "Controla el final de la lista con un condicional.", "Además permite reiniciar o repetir el diálogo sin errores."]}], "criterios_rubrica": ["CYR.3.2.1", "CYR.3.2.2", "CYR.3.6.3"], "calificable": true, "codigo": "2.5"}], "clase": {"pregunta": "¿Por qué los programas fallan justo en el último elemento?", "diapositivas": [{"tipo": "codigo", "titulo": "Caza del bug: tres errores", "codigo": "let indice = 1                      // bug 1\ncontroller.A.onEvent(ControllerButtonEvent.Pressed, function () {\n    if (indice <= licencias.length) { // bug 2\n        game.showLongText(licencias[indice], DialogLayout.Bottom)\n        indice += 1\n    }\n})\n// bug 3: al volver a jugar, indice no vuelve a 0", "explicacion": ["Bug 1: empieza en 1 y se salta **CC BY**.", "Bug 2: con **<=** intenta leer la posición 4, que no existe.", "Bug 3: hay que poner **indice = 0** al reiniciar."], "pregunta": "¿Cómo lo arreglarías antes de mirar la solución?"}, {"tipo": "ejemplo", "icono": "📺", "titulo": "Los créditos de una serie", "situacion": "Al final de una serie o de un videojuego aparecen los créditos: quién hizo la música, el arte, el código…", "explicacion": "Tu minijuego también lleva **créditos**: título, autoría, fuente y licencia de cada recurso que no sea tuyo."}, {"tipo": "practica", "titulo": "Pulido y atribución", "tiempo": 15, "agrupamiento": "Individual", "enunciado": "Repasa tu minijuego:", "pasos": ["Pantalla de inicio: «Pulsa A para hablar».", "Textos sin faltas, que quepan en pantalla.", "Pantalla final o descripción con los **créditos**.", "Si todo es de la galería de MakeCode, indícalo."]}, {"tipo": "practica", "titulo": "Prueba con otra persona", "tiempo": 10, "agrupamiento": "Parejas (distintas a la sesión 8)", "enunciado": "Juega el minijuego de otra persona con la lista de comprobación de la plantilla A6 y dile qué bug has encontrado."}, {"tipo": "quiz", "pregunta": "La lista tiene 4 licencias. ¿Qué condición evita salirse?", "opciones": ["indice <= 4", "indice < licencias.length", "indice > 0"], "correcta": 1, "explicacion": "Las posiciones van de 0 a 3: **indice < length** (4) es correcto."}, {"tipo": "practica", "titulo": "Comparte y entrega", "tiempo": 15, "entrega": "Tarea 2.5: Minijuego Interactivo con Listas sobre Licencias CC", "enunciado": "Comparte el proyecto con un título sin datos personales y entrega el enlace junto con el guion (anexo A6)."}, {"tipo": "cierre", "puntos": ["Los bugs de índices son los más comunes.", "Los créditos son obligatorios.", "Probar con otra persona encuentra lo que tú no ves."], "siguiente": "Formamos los estudios y diseñamos el juego final.", "pregunta": "¿Qué bug te ha costado más encontrar hoy?"}]}}, {"n": 10, "fase": "Desarrollo", "titulo": "Proyecto final: estudios, roles y Game Design Canvas", "reto": "Formar los estudios de 2-3 personas, repartir los roles profesionales y diseñar el videojuego final en un Game Design Canvas.", "actividades": [{"nombre": "Formación de estudios y roles", "min": 10, "desc": "El docente forma 4 equipos de 3 (o parejas si lo prefiere) equilibrando experiencia: cada estudio tiene a alguien con más soltura programando y se reparten las dos personas con experiencia alta en estudios distintos. Se explican los roles: Lead Programmer, UI/UX y Arte, QA Tester y Documentación (en parejas, UI/UX asume también QA). Cada estudio elige nombre (sin datos personales)."}, {"nombre": "Contrato del estudio", "min": 5, "desc": "Firman el contrato del estudio (anexo A7): roles, cómo se toman las decisiones y qué hacen si alguien falta."}, {"nombre": "Game Design Canvas", "min": 25, "desc": "Rellenan el Game Design Canvas (anexo A7): tipología (laberinto, plataformas o recolección arcade), historia en 3 frases, personaje y enemigos, cómo se gana y cómo se pierde (pseudocódigo), qué eventos tendrá (botones, colisiones, tiempo), qué lista usará (niveles, mensajes, posiciones, enemigos), recursos con su licencia (de la ficha A5) y boceto de la pantalla. Requisitos mínimos: eventos, condicionales, un bucle o temporizador, una lista, marcador y pantalla de victoria/derrota."}, {"nombre": "Validación con el docente", "min": 10, "desc": "Cada estudio explica su canvas al docente en 2 minutos; el docente comprueba que cumple los requisitos y que es alcanzable en 3 sesiones. El resto del tiempo empiezan el proyecto en MakeCode (un único proyecto compartido por el Lead Programmer)."}], "criterios": ["CYR.3.2.1"], "saberes": ["CYR.3.A.3"], "metodologia": ["ABP", "Aprendizaje cooperativo"], "evidencias": ["Contrato del estudio", "Game Design Canvas"], "recursos": ["Plantilla Game Design Canvas", "Ficha de atribución"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Elección de temática y tipología, roles según intereses (el rol de QA Tester encaja con el alumnado con TDAH por ser dinámico) y canvas con ejemplos de cada casilla."}, "ejercicios": ["Rellena con tu estudio el Game Design Canvas del juego final.", "Escribe en pseudocódigo cómo se gana y cómo se pierde."], "moodle": [], "clase": {"pregunta": "¿Qué decide un estudio antes de escribir la primera línea de código?", "diapositivas": [{"tipo": "ejemplo", "icono": "🏢", "titulo": "Los estudios indie", "situacion": "Muchos juegos indie de éxito los hicieron equipos de 1 a 5 personas.", "explicacion": "Antes de programar, diseñan en un **documento de diseño**: qué se hace, cómo se gana, quién hace qué. Nosotros usaremos un **Game Design Canvas**."}, {"tipo": "infografia", "titulo": "Roles del estudio", "elementos": [{"icono": "💻", "titulo": "Lead Programmer", "texto": "Lógica, eventos, listas y marcador."}, {"icono": "🎨", "titulo": "UI/UX y Arte", "texto": "Tilemap, sprites, controles y licencias."}, {"icono": "🐞", "titulo": "QA Tester y Documentación", "texto": "Prueba, registra bugs y versiones."}], "nota": "En parejas, UI/UX y Arte asume también QA. Recuerda que todo el estudio responde del juego completo."}, {"tipo": "practica", "titulo": "Contrato del estudio", "tiempo": 5, "agrupamiento": "Estudios de 2-3", "enunciado": "Elegid nombre (sin datos personales), repartid los roles y firmad el contrato del anexo A7."}, {"tipo": "pasos", "titulo": "Requisitos mínimos del juego", "pasos": ["Eventos: botones y colisiones.", "Condicionales y un bucle o temporizador.", "Al menos **una lista**.", "Marcador (puntos o vidas) y pantalla de victoria/derrota.", "Recursos con licencia y créditos."]}, {"tipo": "practica", "titulo": "Game Design Canvas", "tiempo": 25, "agrupamiento": "Estudios de 2-3", "enunciado": "Rellenad el canvas del anexo A7.", "pasos": ["Tipología: laberinto, plataformas o recolección arcade.", "Historia en 3 frases y personajes.", "Cómo se gana y cómo se pierde (pseudocódigo).", "Eventos, lista y recursos con licencia.", "Boceto de la pantalla."]}, {"tipo": "practica", "titulo": "Validación", "tiempo": 10, "enunciado": "Explicad el canvas al docente en **2 minutos**. Si se valida, el Lead Programmer crea el proyecto y lo comparte con el estudio."}, {"tipo": "cierre", "puntos": ["Diseñar antes de programar ahorra bugs.", "Cada rol tiene una responsabilidad.", "El canvas es nuestro mapa."], "siguiente": "Programamos el núcleo: mapa, movimiento y colisiones.", "pregunta": "¿Cuál es la mecánica principal de vuestro juego en una frase?"}]}}, {"n": 11, "fase": "Desarrollo", "titulo": "Programación del núcleo: mapa, movimiento y colisiones", "reto": "Tener la versión 0.1 (alfa) del juego: escenario, movimiento, colisiones y animación del personaje.", "actividades": [{"nombre": "Reunión de pie (stand-up)", "min": 5, "desc": "Cada estudio responde en 1 minuto: ¿qué hicimos?, ¿qué haremos hoy?, ¿qué nos bloquea? El docente anota los bloqueos."}, {"nombre": "Desarrollo del núcleo", "min": 35, "desc": "Lead Programmer: movimiento, cámara, colisiones con paredes y eventos on overlap (monedas, enemigos, meta). UI/UX y Arte: tilemap del nivel 1, sprites y animación del personaje (animation.runImageAnimation para andar o saltar). QA Tester: prueba cada cambio y anota bugs en la ficha de depuración (anexo A8). Cada 10 minutos se cambia quién maneja el teclado del proyecto compartido para que todo el estudio programe. El docente asesora y anima a quien quiera a escribir partes en JavaScript o Python."}, {"nombre": "Versión 0.1 (alfa)", "min": 10, "desc": "El estudio guarda la versión 0.1 (botón de historial de versiones o copia del proyecto con «v0.1» en el título) y la anota en el registro de versiones. Si hay un bug que no saben resolver, lo publican en el foro «Detector de bugs y minitutoriales»."}], "criterios": ["CYR.3.2.1", "CYR.3.2.2"], "saberes": ["CYR.3.A.2", "CYR.3.A.5", "CYR.3.D.2", "CYR.3.D.3", "CYR.3.E.4"], "metodologia": ["ABP", "Aprendizaje cooperativo"], "evidencias": ["Versión 0.1 del juego", "Primeras entradas de la ficha de depuración"], "recursos": ["MakeCode Arcade", "Ficha de depuración", "Foro de bugs"], "dua": {"principios": ["Andamiaje", "Compromiso"], "medidas": "Tarjetas de ayuda por mecánica (salto, enemigos que persiguen, monedas), turnos de teclado cada 10 minutos y temporizador visible."}, "ejercicios": ["Programa el movimiento, las colisiones y la animación del personaje.", "Guarda la versión 0.1 y anota al menos un bug en la ficha."], "moodle": [], "clase": {"pregunta": "¿Qué tiene que funcionar sí o sí para que un juego sea jugable?", "diapositivas": [{"tipo": "practica", "titulo": "Stand-up", "tiempo": 5, "agrupamiento": "Estudios", "enunciado": "Un minuto por estudio: **¿qué hicimos? ¿qué haremos hoy? ¿qué nos bloquea?**"}, {"tipo": "codigo", "titulo": "Animar al personaje", "codigo": "animation.runImageAnimation(\n    jugador,\n    [img`...`, img`...`, img`...`],  // fotogramas\n    150,                             // ms entre fotogramas\n    true                             // repetir\n)", "explicacion": ["Una animación es una **lista de imágenes**.", "150 ms entre fotogramas.", "true = se repite en bucle."]}, {"tipo": "codigo", "titulo": "Un enemigo que te persigue (reto pro)", "codigo": "game.onUpdateInterval(3000, function () {\n    let enemigo = sprites.create(img`...`, SpriteKind.Enemy)\n    tiles.placeOnRandomTile(enemigo, assets.tile`suelo`)\n    enemigo.follow(jugador, 40)\n})", "explicacion": ["Cada 3 s aparece un enemigo (**bucle**).", "Se coloca en una casilla al azar.", "**follow** lo hace perseguir al jugador."]}, {"tipo": "practica", "titulo": "Desarrollo del núcleo", "tiempo": 35, "agrupamiento": "Estudios con roles", "enunciado": "Hoy, cada rol con su tarea; **cada 10 minutos** cambia quién maneja el teclado.", "pasos": ["Lead Programmer: movimiento, cámara y colisiones.", "UI/UX y Arte: tilemap, sprites y animación.", "QA Tester: prueba y anota bugs en la ficha A8.", "Quien quiera: una parte en JavaScript o Python."]}, {"tipo": "ejemplo", "icono": "🧪", "titulo": "Versión alfa", "situacion": "Los juegos se prueban por fases: **alfa** (lo básico funciona), **beta** (casi completo) y **1.0** (final).", "explicacion": "Guardar versiones permite volver atrás si algo se rompe. Hoy cerramos la **0.1**."}, {"tipo": "practica", "titulo": "Guarda la versión 0.1", "tiempo": 10, "enunciado": "Guardad la v0.1, anotadla en el registro de versiones de la ficha A8 y publicad en el foro los bugs que no sepáis resolver."}, {"tipo": "cierre", "puntos": ["Núcleo = mapa + movimiento + colisiones.", "Todo el estudio programa por turnos.", "Versión guardada = red de seguridad."], "siguiente": "Listas, marcador, sonido y publicación segura.", "pregunta": "¿Qué bug habéis anotado hoy?"}]}}, {"n": 12, "fase": "Desarrollo", "titulo": "Ensamblaje y publicación cibersegura", "reto": "Completar la versión 0.2 (beta) con listas, marcador, temporizador, sonido y pantallas de victoria y derrota, y publicarla de forma segura.", "actividades": [{"nombre": "Stand-up", "min": 3, "desc": "Reunión de pie de 1 minuto por estudio con los bloqueos pendientes."}, {"nombre": "Ensamblaje de la beta", "min": 27, "desc": "Cada estudio integra lo que falta de los requisitos mínimos: la lista (por ejemplo, lista de niveles, de mensajes de ánimo, de posiciones de aparición o de enemigos), el marcador de puntos o vidas, un temporizador o bucle, efectos de sonido (music.play) y las pantallas de inicio (game.splash) y de victoria/derrota (game.gameOver). UI/UX y Arte añade los créditos de los recursos en una pantalla final. Se guarda la versión 0.2 (beta)."}, {"nombre": "¿Dónde vive mi juego?", "min": 10, "desc": "El docente explica con la web de clase qué ocurre al pulsar Compartir: el proyecto se sube a los servidores de MakeCode y se crea una página web con una dirección pública (makecode.com/_xxxx) que cualquiera con el enlace puede abrir, jugar y ver su código. Se analiza la estructura de esa página (simulador, título, descripción, botón de editar). Lista de comprobación cibersegura: alias o nombre del estudio en lugar de nombres reales, sin fotos ni datos del centro, descripción sin información personal, compartir el enlace solo por Moodle."}, {"nombre": "Publicación segura", "min": 10, "desc": "El estudio revisa su proyecto con la lista de comprobación, lo comparte y prueba el enlace en otro ordenador (o en modo incógnito). Anota el enlace en la ficha de depuración."}], "criterios": ["CYR.3.2.1", "CYR.3.5.1", "CYR.3.6.2"], "saberes": ["CYR.3.A.4", "CYR.3.A.5", "CYR.3.E.1", "CYR.3.E.2", "CYR.3.E.4", "CYR.3.I.4"], "metodologia": ["ABP", "Enseñanza directa interactiva"], "evidencias": ["Versión 0.2 (beta)", "Enlace publicado y lista de comprobación"], "recursos": ["MakeCode Arcade", "Ficha de depuración"], "dua": {"principios": ["Representación", "Andamiaje"], "medidas": "Esquema visual del recorrido del proyecto (ordenador → servidor → enlace → quien juega) y lista de comprobación cibersegura en la ficha."}, "ejercicios": ["Integra en tu juego una lista, un marcador, un temporizador o bucle y las pantallas de victoria y derrota.", "Publica el juego con la lista de comprobación cibersegura y prueba el enlace."], "moodle": [], "clase": {"pregunta": "Cuando compartes tu juego, ¿quién puede verlo?", "diapositivas": [{"tipo": "practica", "titulo": "Ensamblaje de la beta", "tiempo": 27, "agrupamiento": "Estudios con roles", "enunciado": "Completad los **requisitos mínimos** y guardad la versión 0.2.", "pasos": ["Una lista: niveles, mensajes, posiciones o enemigos.", "Marcador y temporizador o bucle.", "Sonidos con music.play.", "Pantalla de inicio, victoria/derrota y créditos."]}, {"tipo": "codigo", "titulo": "Una lista de niveles", "codigo": "let niveles = [tilemap`nivel1`, tilemap`nivel2`, tilemap`nivel3`]\nlet nivel = 0\ntiles.setCurrentTilemap(niveles[nivel])\nscene.onOverlapTile(SpriteKind.Player, assets.tile`meta`, function (sprite, location) {\n    nivel += 1\n    if (nivel < niveles.length) {\n        tiles.setCurrentTilemap(niveles[nivel])\n    } else {\n        game.gameOver(true)\n    }\n})", "explicacion": ["Los niveles se guardan en una **lista**.", "Al llegar a la meta se pasa al siguiente.", "Tras el último: **victoria**."]}, {"tipo": "ejemplo", "icono": "📸", "titulo": "La foto que se reenvía", "situacion": "Mandas una foto a un grupo y, a la semana, la ha visto gente que no conoces.", "explicacion": "Lo que se comparte con un **enlace** puede llegar a cualquiera. Con tu juego pasa lo mismo: el enlace es **público** para quien lo tenga."}, {"tipo": "infografia", "titulo": "¿Dónde vive mi juego?", "elementos": [{"icono": "💻", "titulo": "Tu ordenador", "texto": "Programas en el navegador."}, {"icono": "☁️", "titulo": "Servidor de MakeCode", "texto": "Al compartir, el proyecto **se sube**."}, {"icono": "🔗", "titulo": "Enlace público", "texto": "makecode.com/_xxxx: una **página web**."}, {"icono": "🌍", "titulo": "Quien tenga el enlace", "texto": "Juega y **ve tu código**."}], "nota": "Abre un enlace compartido y analiza la página: simulador, título, descripción, botón de editar."}, {"tipo": "pasos", "titulo": "Lista de comprobación cibersegura", "progresivo": true, "pasos": ["Título con el **nombre del estudio** o un alias.", "Sin nombres reales, fotos ni datos del centro.", "Descripción sin información personal.", "El enlace se comparte **solo por Moodle**.", "Pruébalo en modo incógnito antes de entregarlo."]}, {"tipo": "quiz", "pregunta": "¿Qué título es más seguro para el proyecto?", "opciones": ["«Juego de Lucía García 3.º B IES …»", "«PixelPanda Studio – Cave Run»", "«Mi juego (mi Instagram: @…)»"], "correcta": 1, "explicacion": "Un nombre de estudio no revela **datos personales** ni deja rastro hacia tus redes."}, {"tipo": "practica", "titulo": "Publica y prueba", "tiempo": 10, "agrupamiento": "Estudios", "enunciado": "Revisad la lista, compartid el proyecto, abrid el enlace en modo incógnito y anotadlo en la ficha de depuración (A8).", "enlace": "https://arcade.makecode.com"}, {"tipo": "cierre", "puntos": ["Beta = juego casi completo.", "Compartir = subir a un servidor y crear una web pública.", "Sin datos personales."], "siguiente": "Peer-testing, ficha de depuración y entrega del juego.", "pregunta": "¿Qué dato no pondrías nunca en tu proyecto?"}]}}, {"n": 13, "fase": "Desarrollo", "titulo": "Peer-testing, ficha de depuración y entrega del juego", "reto": "Probar los juegos de otro estudio, corregir los bugs detectados, cerrar la versión 1.0 y entregar el juego con su memoria y ficha de depuración.", "actividades": [{"nombre": "Peer-testing", "min": 18, "desc": "Cada estudio juega el juego de otro (rotación A→B→C→D→A) durante 8 minutos y anota en la hoja de pruebas de la ficha (anexo A8) al menos 2 bugs o mejoras: qué ocurre, cuándo ocurre y cómo reproducirlo. Después se devuelven las hojas y se comentan en 2 minutos."}, {"nombre": "Corrección de bugs", "min": 17, "desc": "Cada estudio corrige los bugs recibidos y los propios y los registra en el Debugging Log: ID, descripción, cuándo ocurre y solución aplicada (mínimo 2). Se guarda la versión 1.0 con el enlace definitivo."}, {"nombre": "Memoria y entrega", "min": 15, "desc": "QA Tester y Documentación completa la memoria (canvas actualizado, capturas del juego y del código, ficha de depuración, registro de versiones y ficha de atribución) y el estudio entrega en la Tarea 2.6 el enlace de la versión 1.0 y la memoria en PDF."}], "criterios": ["CYR.3.2.1", "CYR.3.2.2", "CYR.3.5.1", "CYR.3.6.2", "CYR.3.6.3"], "saberes": ["CYR.3.A.3", "CYR.3.A.5", "CYR.3.D.2", "CYR.3.I.4", "CYR.3.I.5"], "metodologia": ["Coevaluación técnica", "Ciclo de depuración"], "evidencias": ["Hojas de peer-testing", "Ficha de depuración y registro de versiones", "Juego 1.0 publicado"], "recursos": ["Ficha de depuración", "MakeCode Arcade"], "dua": {"principios": ["Acción y Expresión", "Compromiso"], "medidas": "Hoja de pruebas con preguntas guiadas, la memoria puede incluir audio o vídeo corto explicando un bug y prórroga si se necesita."}, "ejercicios": ["Juega el juego de otro estudio y anota al menos 2 bugs o mejoras.", "Registra en el Debugging Log 2 bugs con su solución y guarda la versión 1.0."], "moodle": [{"recurso": "Tarea", "nombre": "2.6: Proyecto Final: Entrega de Juego con capturas y Ficha de Depuración", "uso": "Tarea final del producto: enlace del videojuego 1.0, memoria con capturas, ficha de depuración, registro de versiones y créditos.", "correccion": "rubrica", "criterio": "CYR.3.2.1", "config": ["Entrega por grupos: Sí (agrupamiento SdA2-Estudios)", "Texto en línea: enlace del juego + archivo PDF de la memoria", "Método de calificación: Rúbrica"], "url_moodle": "https://educacionadistancia.juntadeandalucia.es/centros/malaga/mod/assign/view.php?id=321067", "rubrica": [{"linea": "Mecánicas y lógica del juego", "criterio": "CYR.3.2.1", "niveles": ["El juego no funciona o no se puede jugar.", "Funciona a medias: falta la condición de victoria o de derrota.", "Cumple los requisitos mínimos (condicionales, bucle o temporizador, lista y marcador).", "Requisitos cumplidos con una mecánica propia bien resuelta.", "Juego completo, equilibrado y con alguna parte en código textual o mecánica avanzada."]}, {"linea": "Eventos, controles y colisiones", "criterio": "CYR.3.2.2", "niveles": ["No responde a los controles.", "Los controles o las colisiones fallan a menudo.", "Botones y colisiones funcionan.", "Varios tipos de eventos (botones, colisiones y tiempo) coordinados.", "Eventos bien pensados que hacen el juego fluido y explicados en la memoria."]}, {"linea": "Experiencia de u
