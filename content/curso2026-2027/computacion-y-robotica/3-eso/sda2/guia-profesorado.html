 libre, dentro de tres tipologías (laberinto, plataformas o recolección arcade).", "Retos por niveles (básico, plus y pro) en todas las prácticas e insignias de los Skillmaps.", "Feria final con público real: el resto de la clase juega y valora los juegos.", "Roles profesionales elegidos según los intereses de cada estudiante."], "Representación": ["Cada estructura se muestra en bloques, JavaScript y Python a la vez (símil bloques ↔ código).", "Ejemplos cotidianos antes de cada concepto: la mochila (variable), tomar decisiones (condicional) y repetir tareas (bucle).", "Guías en PDF paso a paso (El Laberinto, Plataformas) y web de clase en modo estudio para repasar en casa o en el móvil.", "Subtítulos y traducción automática en los vídeos."], "Acción y Expresión": ["Evidencias como capturas, enlace del proyecto, documento o explicación oral grabada.", "Scratch para Educación como alternativa en la sesión 2 para quien aún no se maneja con MakeCode.", "Presentación final en Google Presentaciones o Canva para Educación; el pitch puede apoyarse en una tarjeta guion."], "Andamiaje": ["Proyectos plantilla con mecánicas base ya montadas para quien lo necesite.", "Tarjetas de ayuda con el bloque que falta y foro «Detector de bugs y minitutoriales» para pedir y dar ayuda.", "Listas de comprobación «Antes de entregar» en todas las plantillas y rúbricas visibles en Moodle desde la sesión 1.", "Mentoría entre iguales: el alumnado con experiencia alta ayuda en las prácticas de las sesiones 3-9."]}, "diversidad": [{"perfil": "Alumna o alumno con TDA y altas capacidades (doble excepcionalidad)", "medidas": "Retos «pro» con código textual obligatorio (JavaScript o Python), físicas personalizadas (gravedad, impulso), enemigos que siguen al jugador y listas de sprites; tareas troceadas en hitos de 10-15 minutos con lista de pasos visible; ubicación con pocas distracciones; rol de Lead Programmer o de mentor/a técnico en momentos concretos (sin convertirle en ayudante permanente); posibilidad de proponer su propio reto si termina antes."}, {"perfil": "Alumnado con TDAH (2)", "medidas": "Actividades cortas con temporizador visible en la web de clase, una instrucción cada vez, agenda de la sesión en la pizarra, sitio cerca del docente y lejos de la puerta, pausas activas al cambiar de actividad, rol de QA Tester (dinámico, prueba y registra) y prórroga en Moodle si la necesita."}, {"perfil": "Alumnado con más dificultades de aprendizaje (2)", "medidas": "Proyectos plantilla de MakeCode con los bloques base ya colocados, guías en PDF con capturas, reto básico claramente delimitado, trabajo en bloques sin exigir código textual, Scratch para Educación en la sesión 2, pareja con un compañero o compañera de experiencia alta en la fase individual y más tiempo de entrega."}, {"perfil": "Alumnado con experiencia alta en programación (2)", "medidas": "Retos «plus» y «pro» en cada práctica, explicación al grupo de un minitutorial en el foro y rol de Lead Programmer en equipos mixtos; nunca en el mismo equipo para repartir la experiencia."}, {"perfil": "Alumnado con experiencia media-baja", "medidas": "Skillmap «Adventure» guiado en la sesión 1, ejemplos resueltos proyectados antes de cada práctica y tarjetas de ayuda con el bloque que falta."}], "roles": [{"rol": "Lead Programmer", "funcion": "Se encarga de la lógica del juego: eventos, condicionales, bucles, listas, marcador y temporizadores. Coordina el paso a código textual."}, {"rol": "UI/UX y Arte", "funcion": "Diseña el tilemap, los sprites y la experiencia de juego (controles, pantallas de inicio y fin), busca recursos con licencia libre y rellena la ficha de atribución."}, {"rol": "QA Tester y Documentación", "funcion": "Prueba el juego, registra los bugs y las versiones en la ficha de depuración y prepara la memoria. En los equipos de 2, la persona de UI/UX asume también este rol."}], "evaluacion": {"instrumentos": {"CYR.3.1.3": ["Tareas 2.1 y 2.2 (Apto / No apto)", "Rúbrica de la Tarea 2.4", "Rúbrica de la Entrega 2.7", "Observación directa en el elevator pitch"], "CYR.3.2.1": ["Rúbricas de las Tareas 2.4, 2.5 y 2.6", "Rúbrica de la Entrega 2.7 (feria)", "Formulario de coevaluación de la feria"], "CYR.3.2.2": ["Rúbricas de las Tareas 2.5 y 2.6"], "CYR.3.5.1": ["Rúbricas de las Tareas 2.3 y 2.6"], "CYR.3.6.2": ["Rúbricas de las Tareas 2.3, 2.4, 2.6 y 2.7"], "CYR.3.6.3": ["Rúbricas de las Tareas 2.5, 2.6 y 2.7", "Ficha de atribución de recursos"]}, "cotejo": [{"criterio": "CYR.3.1.3", "indicadores": ["Identifica en un juego los sprites, las variables (puntos, vidas), los eventos, los condicionales y los bucles.", "Escribe en pseudocódigo la condición de victoria o derrota de su juego.", "Relaciona un bloque de MakeCode con su equivalente en JavaScript o Python.", "Explica con sus palabras cómo funciona su programa en el elevator pitch."]}, {"criterio": "CYR.3.2.1", "indicadores": ["Resuelve los retos de las prácticas (Plataformas, minijuego CC) con un programa que funciona.", "Usa bucles y condicionales para que el juego tenga reglas de victoria y derrota.", "Detecta, registra y corrige al menos dos bugs en su proyecto.", "Cumple su rol en el equipo y comunica sus propuestas de forma adecuada."]}, {"criterio": "CYR.3.2.2", "indicadores": ["Programa eventos de botones (A, B, cruceta) que producen una respuesta en el juego.", "Programa eventos de colisión (on overlap) y de tiempo (on game update every).", "Explica qué evento dispara cada acción de su juego."]}, {"criterio": "CYR.3.5.1", "indicadores": ["Reconoce las partes del entorno de MakeCode Arcade (simulador, bloques, editor de sprites, vista de código).", "Construye un juego jugable, con controles claros y pantallas de inicio y fin.", "Explica qué ocurre al compartir un proyecto: dónde se guarda y quién puede verlo."]}, {"criterio": "CYR.3.6.2", "indicadores": ["Comparte el proyecto con el enlace oficial de MakeCode Arcade.", "No incluye datos personales (nombre completo, foto, centro) en el título, la descripción ni el juego.", "Entrega en Moodle y comparte la presentación solo con las personas que la necesitan."]}, {"criterio": "CYR.3.6.3", "indicadores": ["Distingue las licencias CC BY, CC BY-SA, CC BY-NC y CC0.", "Elige recursos que puede usar legalmente según su licencia.", "Atribuye correctamente cada recurso ajeno (título, autoría, fuente y licencia).", "Elige y justifica una licencia para su propio juego."]}], "agentes": {"Heteroevaluación": "Tareas 2.1 y 2.2 con lista de verificación (Apto / No apto), rúbricas de las Tareas 2.3 a 2.6 y de la Entrega 2.7, y observación directa del elevator pitch y de los debates de aula.", "Coevaluación": "Peer-testing entre equipos con registro de bugs (sesión 13) y formulario de coevaluación de la Arcade Game Fair (sesiones 15-16).", "Autoevaluación": "Lista «Antes de entregar» en cada plantilla y formulario de autoevaluación y valoración de la SdA (sesión 16)."}}, "moodle": {"estructura": "La sección «SdA 2 · Código en Acción» del curso de Computación y Robótica de 3.º ESO mantiene las siete Tareas que ya existen (2.1 a 2.6 y Entrega 2.7) con sus nombres actuales; solo se sustituye el Área de texto y medios por el nuevo bloque y se añade el foro «Detector de bugs y minitutoriales».", "secciones": [{"nombre": "Sección SdA 2 · Código en Acción", "elementos": ["Área de texto y medios con el reto, la pregunta guía y los enlaces a la web de clase (snippet nuevo)", "Página «Cómo se evalúa» con las listas de verificación y las rúbricas", "Tareas 2.1 y 2.2 (Apto / No apto)", "Tareas 2.3, 2.4, 2.5 y 2.6 y Entrega 2.7 (rúbrica, pasan a Séneca)", "Foro «Detector de bugs y minitutoriales»"]}], "calificaciones": "Seis categorías, una por criterio (CYR.3.1.3, CYR.3.2.1, CYR.3.2.2, CYR.3.5.1, CYR.3.6.2 y CYR.3.6.3). Las Tareas 2.1 y 2.2 usan la escala «No apto, Apto». Las Tareas 2.3 a 2.6 y la Entrega 2.7 se califican con rúbrica sobre 10; como cada rúbrica evalúa varios criterios, la nota de cada criterio (media de sus líneas) se calcula en la web de la SdA y se añade como ítem manual en su categoría. La observación directa del pitch se anota como ítem manual en CYR.3.1.3.", "configuracion": ["Escala personalizada «No apto, Apto».", "Grupos: un grupo por equipo del proyecto y agrupamiento «SdA2-Estudios» para la Tarea 2.6 y la Entrega 2.7.", "Rúbricas de las Tareas 2.3 a 2.7 guardadas como plantilla.", "Prórrogas en las Tareas para el alumnado con TDAH o con más dificultades cuando lo necesite."], "area_texto": {"url_clase": "https://florindotic.es/content/curso2026-2027/computacion-y-robotica/3-eso/sda2/clase.html", "eventos": [{"sesion": 15, "texto": "Arcade Game Fair: elevator pitch y feria jugable (completa la Entrega 2.7)", "tipo": "Se evalúa en clase"}, {"sesion": 16, "texto": "Coevaluación de la feria y autoevaluación (formularios)", "tipo": "Coevaluación"}]}}, "seneca": {"justificacion": "El alumnado de 3.º ESO pasa de la programación por bloques a la lógica algorítmica y al código textual creando, depurando y publicando un videojuego retro 2D en MakeCode Arcade. Trabaja variables, condicionales, bucles, eventos y listas, usa recursos multimedia respetando las licencias Creative Commons, publica su proyecto de forma segura y lo presenta en la Arcade Game Fair 3.º ESO.", "actividades": [{"titulo": "Primeros pasos: El Laberinto en MakeCode Arcade", "tipo": "Exploración", "abreviatura": "EXP1", "tarea": "2.3", "sesiones": [1, 2, 3], "trazabilidad": "RÚBRICA", "criterios": ["CYR.3.5.1", "CYR.3.6.2"]}, {"titulo": "Reto Plataformas: condicionales, bucles y pseudocódigo", "tipo": "Estructuración", "abreviatura": "EST1", "tarea": "2.4", "sesiones": [4, 5], "trazabilidad": "RÚBRICA", "criterios": ["CYR.3.2.1", "CYR.3.1.3", "CYR.3.6.2"]}, {"titulo": "Minijuego-historia con listas sobre licencias Creative Commons", "tipo": "Estructuración", "abreviatura": "EST2", "tarea": "2.5", "sesiones": [6, 7, 8, 9], "trazabilidad": "RÚBRICA", "criterios": ["CYR.3.2.1", "CYR.3.2.2", "CYR.3.6.3"]}, {"titulo": "Proyecto final: videojuego retro 2D y ficha de depuración", "tipo": "Conclusión", "abreviatura": "CON1", "tarea": "2.6", "sesiones": [10, 11, 12, 13], "trazabilidad": "RÚBRICA", "criterios": ["CYR.3.2.1", "CYR.3.2.2", "CYR.3.5.1", "CYR.3.6.2", "CYR.3.6.3"]}, {"titulo": "Arcade Game Fair: presentación digital y elevator pitch", "tipo": "Conclusión", "abreviatura": "CON2", "tarea": "2.7", "sesiones": [14, 15, 16], "trazabilidad": "RÚBRICA", "criterios": ["CYR.3.1.3", "CYR.3.6.3", "CYR.3.6.2", "CYR.3.2.1"]}]}, "anexos": {"plantillas": [{"id": "A1", "titulo": "Mi Skillmap de MakeCode Arcade", "sesiones": [1], "agrupamiento": "Individual", "herramienta": "Google Docs (una copia por estudiante)", "entrega": "la Tarea 2.1 (PDF)", "instrucciones": "Pega en cada recuadro la captura que se pide. Para hacer una captura: tecla **Impr Pant** o **Windows + Mayús + S**.", "bloques": [{"titulo": "1 · ¿Qué Skillmap he hecho?", "casillas": ["Adventure (para empezar)", "Galaxy (avanzado)"]}, {"titulo": "2 · Capturas", "tabla": {"columnas": ["Qué se ve", "Captura"], "filas": [["Mapa de habilidades completado"], ["Insignia obtenida"], ["Mi juego funcionando en el simulador"]], "anchos": [5, 12], "alto": 3.3}}, {"titulo": "3 · En una frase", "texto": "¿Qué ha sido lo más fácil y lo más difícil del Skillmap?", "lineas": 2}, {"titulo": "Antes de entregar", "casillas": ["Están las tres capturas y se leen bien.", "He marcado qué Skillmap he hecho.", "He guardado el documento en PDF."]}]}, {"id": "A2", "titulo": "Algoritmos de la vida real", "sesiones": [2], "agrupamiento": "Individual", "herramienta": "Google Docs", "entrega": "la Tarea 2.2 (PDF)", "instrucciones": "Elige **uno** de los tres sistemas, prográmalo en MakeCode Arcade (o en Scratch para Educación) y explica sus piezas.", "bloques": [{"titulo": "1 · Mi sistema", "casillas": ["A) Batería del móvil: baja 10 cada segundo y avisa por debajo de 20.", "B) Alarma que se pospone: suena cada 5 s; con A se pospone.", "C) Generador de enemigos : "la Tarea 2.4 (PDF)", "bloques": [{"titulo": "1 · Mi juego", "campos": ["Enlace compartido", "¿Qué he modificado? (plataformas, monedas, tiempo…)"]}, {"titulo": "2 · Checklist del reto", "casillas": ["Plataformas a varias alturas.", "Monedas que suman puntos.", "Cuenta atrás o bucle (por ejemplo, enemigos cada X segundos).", "Mi propia regla de victoria o derrota.", "Pro: enemigos que persiguen o segundo nivel."]}, {"titulo": "3 · Pseudocódigo de mis reglas", "texto": "Ejemplo: **SI** se acaba el tiempo **Y** tengo 10 monedas o más **ENTONCES** gano; **SI NO** pierdo.", "tabla": {"columnas": ["Regla", "Pseudocódigo", "Bloque o línea de JavaScript"], "filas": [["Victoria"], ["Derrota"], ["Lo que se repite"]], "anchos": [3, 7, 7], "alto": 1.2}}, {"titulo": "4 · Capturas", "tabla": {"columnas": ["Juego en el simulador", "Código (bloques o JavaScript)"], "filas": 1, "alto": 3}}, {"titulo": "Antes de entregar", "casillas": ["El enlace funciona y no tiene datos personales.", "He escrito el pseudocódigo de la victoria y de la derrota.", "He señalado su bloque o línea de código."]}]}, {"id": "A5", "titulo": "Ficha de atribución de recursos", "sesiones": [6, 9, 13, 14], "agrupamiento": "Individual", "herramienta": "Google Docs (se reutiliza en el proyecto final)", "entrega": "las Tareas 2.5 y 2.6 y la Entrega 2.7 (dentro de la memoria o la presentación)", "instrucciones": "Anota **cada** recurso que no hayas creado tú. Usa la fórmula **TASL**: Título, Autoría, Fuente (enlace) y Licencia.", "bloques": [{"titulo": "Licencias de un vistazo", "lista": ["**CC BY**: úsalo como quieras citando al autor/a.", "**CC BY-SA**: cita y comparte tu obra con la misma licencia.", "**CC BY-NC**: cita y sin fines comerciales.", "**CC0**: dominio público, sin condiciones.", "**ND** (sin derivadas) no sirve para juegos: no se puede modificar."]}, {"titulo": "Mis recursos", "tabla": {"columnas": ["Tipo", "Título", "Autoría", "Fuente (enlace)", "Licencia", "¿Puedo usarlo? ¿Por qué?"], "filas": [ s orales, escritos, signados o multimodales de los ámbitos personal, social, educativo y profesional para participar en diferentes contextos de manera activa e informada y para construir conocimiento.", "competencias": []}, "CCL3": {"tipo": "de", "texto": "Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": ["CYR.3.1"]}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": []}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": ["CYR.3.2", "CYR.3.5", "CYR.3.6"]}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": ["CYR.3.1"]}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": ["CYR.3.1", "CYR.3.2", "CYR.3.5", "CYR.3.6"]}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": []}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["CYR.3.1", "CYR.3.6"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": []}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["CYR.3.2"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": ["CYR.3.1", "CYR.3.6"]}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": ["CYR.3.2", "CYR.3.5", "CYR.3.6"]}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": ["CYR.3.1"]}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": []}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": ["CYR.3.2", "CYR.3.5", "CYR.3.6"]}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": ["CYR.3.5"]}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["CYR.3.5"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": []}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": []}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": ["CYR.3.5", "CYR.3.6"]}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": ["CYR.3.1"]}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": ["CYR.3.1"]}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["CYR.3.2", "CYR.3.5"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": ["CYR.3.2"]}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": ["CYR.3.6"]}}, "idx": {"criterios": ["CYR.3.1.3", "CYR.3.2.1", "CYR.3.2.2", "CYR.3.5.1", "CYR.3.6.2", "CYR.3.6.3"], "competencias": ["CYR.3.1", "CYR.3.2", "CYR.3.5", "CYR.3.6"], "saberes": ["CYR.3.A.1", "CYR.3.A.2", "CYR.3.A.3", "CYR.3.A.4", "CYR.3.A.5", "CYR.3.D.2", "CYR.3.D.3", "CYR.3.E.1", "CYR.3.E.2", "CYR.3.E.4", "CYR.3.I.4", "CYR.3.I.5"], "descriptores": ["CC3", "CC4", "CCEC3", "CCEC4", "CCL3", "CD1", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM2", "STEM3"], "sesionesPorCriterio": {"CYR.3.1.3": [1, 2, 4, 5, 7, 14, 15, 16], "CYR.3.5.1": [3, 12, 13], "CYR.3.6.2": [3, 5, 12, 13, 14], "CYR.3.2.1": [4, 5, 7, 8, 9, 10, 11, 12, 13, 15, 16], "CYR.3.6.3": [6, 8, 9, 13, 14], "CYR.3.2.2": [8, 9, 11, 13]}, "porMateria": [{"codigo": "CYR", "criterios": ["CYR.3.1.3", "CYR.3.2.1", "CYR.3.2.2", "CYR.3.5.1", "CYR.3.6.2", "CYR.3.6.3"], "competencias": ["CYR.3.1", "CYR.3.2", "CYR.3.5", "CYR.3.6"], "saberes": ["CYR.3.A.1", "CYR.3.A.2", "CYR.3.A.3", "CYR.3.A.4", "CYR.3.A.5", "CYR.3.D.2", "CYR.3.D.3", "CYR.3.E.1", "CYR.3.E.2", "CYR.3.E.4", "CYR.3.I.4", "CYR.3.I.5"], "descriptores": ["CC3", "CC4", "CCEC3", "CCEC4", "CCL3", "CD1", "CD3", "CD4", "CD5", "CE1", "CE3", "CPSAA1", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM2", "STEM3"]}], "materiasTxt": "Computación y Robótica"}, "seneca": {"titulo": "SdA 2: Código en Acción - Videojuegos e Historias Interactivas Sostenibles", "temporalizacion": "16 sesiones", "justificacion": "El alumnado de 3.º ESO pasa de la programación por bloques a la lógica algorítmica y al código textual creando, depurando y publicando un videojuego retro 2D en MakeCode Arcade. Trabaja variables, condicionales, bucles, eventos y listas, usa recursos multimedia respetando las licencias Creative Commons, publica su proyecto de forma segura y lo presenta en la Arcade Game Fair 3.º ESO.", "producto_final": "Videojuego arcade 2D original programado en equipos de 2-3 en MakeCode Arcade (con eventos, condicionales, bucles, listas, marcador y pantalla de victoria/derrota), publicado con un enlace seguro, acompañado de una memoria con la ficha de depuración y el registro de versiones, una presentación digital de 4 diapositivas y un elevator pitch en la Arcade Game Fair 3.º ESO.", "concrecion": [{"materia": "Computación y Robótica", "texto": "COMPETENCIAS ESPECÍFICAS\nCYR.3.1.Comprender el impacto que la computación y la robótica tienen en nuestra sociedad y desarrollar el pensamiento computacional para realizar proyectos de construcción de sistemas digitales de forma sostenible.\nCYR.3.2.Producir programas informáticos, colaborando en un equipo de trabajo y creando aplicaciones sencillas, mediante lenguaje de bloques, utilizando las principales estructuras de un lenguaje de programación para solventar un problema determinado o exhibir un comportamiento deseado.\nCYR.3.5.Utilizar y crear aplicaciones informáticas y web sencillas, entendiendo su funcionamiento interno, de forma segura, responsable y respetuosa, protegiendo la identidad online y la privacidad.\nCYR.3.6.Conocer y aplicar los principios de la ciberseguridad, adoptando hábitos y conductas de seguridad, para permitir la protección del individuo en su interacción en la red.\n\nCRITERIOS DE EVALUACIÓN\nCYR.3.1.3.Entender cómo funciona un programa informático, la manera de elaborarlo y sus principales componentes.\nCYR.3.2.1.Conocer y resolver la variedad de problemas posibles, desarrollando un programa informático y generalizando las soluciones, tanto de forma individual como trabajando en equipo, colaborando y comunicándose de forma adecuada.\nCYR.3.2.2.Entender el funcionamiento interno de las aplicaciones móviles y cómo se construyen, dando respuesta a las posibles demandas del escenario a resolver.\nCYR.3.5.1.Conocer la construcción de aplicaciones informáticas y web, entendiendo su funcionamiento interno, de forma segura, responsable y respetuosa.\nCYR.3.6.2.Acceder a servicios de intercambio y publicación de información digital aplicando criterios de seguridad y uso responsable.\nCYR.3.6.3.Reconocer y comprender los derechos de los materiales alojados en la web.\n\nSABERES BÁSICOS\nCYR.3.A.1.Conexión de los lenguajes de programación visuales con los lenguajes de programación textuales.\nCYR.3.A.2.Generación de programas con especificaciones básicas en lenguajes de bloques.\nCYR.3.A.3.Secuencia de instrucciones. Implementación de algoritmos.\nCYR.3.A.4.Bucles y condicionales anidadas básicas.\nCYR.3.A.5.Entornos de interacción con el usuario.\nCYR.3.D.2.Programación orientada a eventos.\nCYR.3.D.3.Definición de eventos.\nCYR.3.E.1.Análisis de la estructura de las páginas web.\nCYR.3.E.2.Servidores web: tipología.\nCYR.3.E.4.Herramientas de animación web.\nCYR.3.I.4.Interacción de plataformas virtuales: soluciones.\nCYR.3.I.5.Ley de propiedad intelectual.\n\nDESCRIPTORES OPERATIVOS\nCC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad."}], "actividades": [{"titulo": "Primeros pasos: El Laberinto en MakeCode Arcade", "tipo": "Exploración", "abreviatura": "EXP1", "orden": "1", "tarea": "2.3 · Práctica Guiada El Laberinto (CEv 5.1, 6.2)", "descripcion": "Sesión 1 (50 min): Presentación de la SdA y gaming sostenible\nReto: Conocer el reto de la Arcade Game Fair, reflexionar sobre el impacto ambiental de los videojuegos y completar un primer mapa de habilidades de MakeCode Arcade.\n- Presentación del reto (8 min). El docente presenta el reto («somos un estudio indie»), el producto final, la Arcade Game Fair y cómo se evalúa (las Tareas 2.1 a 2.7 en Moodle). Muestra en el proyector un juego retro hecho en MakeCode Arcade y pregunta: «¿cuántas decisiones toma este juego por segundo?».\n- Vídeo y debate: gaming sostenible (12 min). Se proyecta un vídeo breve sobre el impacto ambiental de los videojuegos (consumo de las consolas, servidores, residuos electrónicos). Debate en gran grupo con tres preguntas: ¿cuánta energía gasta una partida?, ¿qué pasa con una consola vieja?, ¿por qué un juego retro de 160 × 120 píxeles puede ser más sostenible? Se apuntan en la pizarra las ideas de economía circular (reparar, reutilizar, juegos ligeros que funcionan en equipos antiguos).\n- Diagnóstico con Blooket (12 min). Juego individual de Blooket sobre lógica de videojuegos (variables, condiciones, bucles, eventos). El docente anota las preguntas con más fallos para reforzarlas en las sesiones 2 y 4 y detecta quién tiene experiencia alta.\n- Skillmap de MakeCode Arcade (15 min). Cada estudiante abre un mapa de habilidades: «Adventure» (recomendado para empezar) o «Galaxy» (para quien ya ha programado). Completa los primeros tutoriales y consigue la insignia. Hace capturas del mapa completado, de la insignia y del juego resultante. (Plantilla en el anexo A1.)\n- Entrega y salida (3 min). Se explica qué se entrega en la Tarea 2.1 y cómo pegar las capturas en la plantilla. Quien no termine el Skillmap lo acaba en casa (funciona en el navegador, también en el móvil).\n- Moodle Centros: Tarea «2.1: Diagnóstico y Skillmap Inicial» (corrección Apto / No apto). Comprobar que cada estudiante entra en MakeCode Arcade y completa un primer Skillmap.\n- Evidencia: Resultados de Blooket (diagnóstica)\n- Evidencia: Capturas del Skillmap y de la insignia\n\nSesión 2 (50 min): La programación en el mundo real\nReto: Descubrir variables, condicionales y bucles en objetos cotidianos y simular uno de ellos en MakeCode Arcade.\n- ¿Cuántos programas has usado hoy? (5 min). Lluvia de ideas: despertador, semáforo, recomendador de vídeos, cajero automático, el móvil que avisa de batería baja. El docente apunta en la pizarra qué «decide» cada uno.\n- Exposición dialogada: tres ideas clave (12 min). El docente explica con la web de clase: 1) Variables, «la mochila»: guardan datos que cambian, como la batería del móvil o la puntuación (score) y las vidas (life) en MakeCode Arcade. 2) Condicionales, «tomar decisiones»: si se cumple una regla, entonces..., como activar el ahorro de batería o sumar puntos al tocar una moneda (on overlap). 3) Bucles, «repetir tareas»: como la alarma que pospones cada 5 minutos o los enemigos que aparecen cada 2 segundos (on game update every). Se proyecta la página de ejemplos para pasar a MakeCode Arcade.\n- Modelado en MakeCode Arcade (25 min). Cada estudiante elige y simula uno de los tres sistemas: A) Batería del móvil: una variable empieza en 100, baja 10 cada segundo y, si es menor de 20, el sprite dice «Modo ahorro». B) Alarma que se pospone: cada 5 segundos suena un sonido y al pulsar A se pospone. C) Generador de enemigos: cada 2 segundos aparece un enemigo en una posición aleatoria. Reto plus: combinar dos sistemas. Quien tenga más dificultades puede hacerlo en Scratch para Educación con el mismo esquema.\n- Documentación (8 min). Captura del código en bloques y del simulador y breve explicación con la plantilla (anexo A2): qué variable usa, qué condición comprueba y qué se repite.\n- Moodle Centros: Tarea «2.2: Algoritmos de la Vida Real» (corrección Apto / No apto). Comprobar que el alumnado reconoce y usa una variable, un condicional y un bucle en una simulación sencilla.\n- Evidencia: Simulación en MakeCode Arcade\n- Evidencia: Documento con capturas y explicación\n\nSesión 3 (50 min): Primeros pasos con MakeCode Arcade: El Laberinto\nReto: Conocer el entorno de MakeCode Arcade, programar el juego guiado «El Laberinto», ver su código en JavaScript y compartirlo con un enlace seguro.\n- Tour guiado por el entorno (8 min). El docente recorre el entorno en el proyector: simulador a la izquierda, categorías de bloques en el centro, editor de sprites y de tilemaps, botón Bloques ↔ JavaScript ↔ Python y botón de compartir. El alumnado lo sigue en su ordenador.\n- Práctica guiada «El Laberinto» (25 min). Siguiendo el PDF de prácticas: crear un sprite de tipo Player (sprites.create), moverlo con la cruceta (controller.moveSprite), diseñar un tilemap con paredes (walls), hacer que la cámara siga al jugador y colocar una meta: al tocarla, game over con victoria. Reto plus: añadir un temporizador de 30 s. Reto pro: segundo nivel. Las dos personas con experiencia alta hacen de mentoras en los primeros 10 minutos.\n- Revisión del código textual (7 min). Se cambia a la vista JavaScript y se localizan sprites.create(), controller.moveSprite() y tiles.setCurrentTilemap(). Se comenta que un bloque es una línea de código y que los paréntesis llevan los datos (parámetros).\n- Compartir con seguridad y entregar (10 min). El docente muestra el botón Compartir: el enlace es público para quien lo tenga. Antes de compartir se revisa que el título no lleve el nombre completo ni datos personales. El alumnado genera el enlace, hace las capturas y entrega con la plantilla del anexo A3.\n- Moodle Centros: Tarea «2.3: Práctica Guiada El Laberinto (CEv 5.1, 6.2)» (evaluada con rúbrica 1-3-5-7-10). Primera Tarea evaluable: el juego guiado, su código en bloques y JavaScript y el enlace compartido de forma segura.\n- Evidencia: Juego «El Laberinto» funcionando\n- Evidencia: Enlace compartido\n- Evidencia: Capturas del código en bloques y JavaScript", "temporalizacion": "3 sesiónes", "recursos": "Proyector, Blooket, MakeCode Arcade Skillmaps, Web de ejemplos de la vida real, MakeCode Arcade, Scratch para Educación, PDF de El Laberinto", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nCYR.3.5.1.Conocer la construcción de aplicaciones informáticas y web, entendiendo su funcionamiento interno, de forma segura, responsable y respetuosa.\nCYR.3.6.2.Acceder a servicios de intercambio y publicación de información digital aplicando criterios de seguridad y uso responsable.", "ejercicios": "Responde al Blooket de diagnóstico.\nCompleta el Skillmap «Adventure» o «Galaxy» y entrega las capturas del mapa, la insignia y el juego.\nSimula en MakeCode Arcade la batería del móvil, la alarma que se pospone o el generador de enemigos.\nExplica qué variable, qué condicional y qué bucle usa tu simulación.\nPrograma «El Laberinto»: jugador, control con la cruceta, tilemap con paredes y meta.\nCambia a JavaScript y localiza las funciones sprites.create y controller.moveSprite.\nComparte el juego con un enlace sin datos personales.", "metodologias": "Gamificación, Enseñanza directa interactiva, Pensamiento visible, Descubrimiento guiado, Símil bloques ↔ código", "sesiones": [1, 2, 3]}, {"titulo": "Reto Plataformas: condicionales, bucles y pseudocódigo", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "2", "tarea": "2.4 · Modificación de Juego Plataformas (CEv 1.3, 2.1, 6.2)", "descripcion": "Sesión 4 (50 min): Condicionales, bucles y pseudocódigo\nReto: Entender cómo se escriben en JavaScript y Python los condicionales, los bucles y los eventos, y empezar el juego guiado «Plataformas».\n- Calentamiento (5 min). Quiz rápido en la web de clase con las preguntas del Blooket que más fallaron (qué es una variable, qué es un bucle).\n- Taller de sintaxis: bloques ↔ código (15 min). Repaso para el alumnado de nueva matrícula y profundización para el resto. El docente proyecta a la vez el bloque y su código: if-then-else → if (...) { } else { }; repeat 4 → for (let i = 0; i < 4; i++) { }; on overlap → sprites.onOverlap(...); forever → forever(function () { }). Ejemplo: al chocar con un enemigo se pierde una vida (info.changeLifeBy(-1)).\n- Pseudocódigo de las reglas de un juego (10 min). En parejas, escriben en pseudocódigo las reglas de un juego conocido (por ejemplo, el dinosaurio sin conexión de Chrome): «SI toca un cactus ENTONCES fin de partida; MIENTRAS el juego siga, suma 1 punto cada segundo». Se comparten dos ejemplos en voz alta.\n- Plataformas guiado (parte 1) (20 min). Siguiendo el PDF de Plataformas: sprite con gravedad (ay), movimiento solo horizontal, salto con el botón A cuando toca el suelo (isHittingTile) y tilemap con plataformas. El docente abre el foro «Detector de bugs y minitutoriales» para que se publiquen dudas y soluciones.\n- Moodle Centros: Foro «Detector de bugs y minitutoriales». Espacio abierto hasta el final de la SdA para publicar un bug con su captura, ayudar a resolverlo o compartir un minitutorial (un truco de MakeCode en 3-5 pasos).\n- Evidencia: Pseudocódigo de las reglas\n- Evidencia: Plataformas en progreso\n\nSesión 5 (50 min): Reto Plataformas: monedas, cuenta atrás y victoria\nReto: Modificar el juego Plataformas con plataformas a varias alturas, monedas que suman puntos, una cuenta atrás y una condición propia de victoria o derrota.\n- Repaso del salto (5 min). El docente resuelve en directo el bug más repetido de la sesión anterior (el doble salto infinito) y lo publica en el foro como minitutorial.\n- Reto de modificación (30 min). Cada estudiante modifica su Plataformas: 1) plataformas a varias alturas en el tilemap; 2) monedas (SpriteKind.Food o tiles de moneda) que suman 1 punto al tocarlas (on overlap); 3) cuenta atrás de 30-60 s (info.startCountdown) o un bucle que genera enemigos; 4) condición propia de victoria o derrota (por ejemplo, ganar al reunir 10 monedas antes de que acabe el tiempo). Reto pro: enemigos que persiguen al jugador (follow) o un segundo nivel.\n- Pseudocódigo de mis reglas (8 min). En la plantilla (anexo A4) cada estudiante escribe en pseudocódigo la condición de victoria y de derrota de su juego y la relaciona con el bloque y la línea de JavaScript correspondiente.\n- Compartir y entregar (7 min). Generan el enlace seguro (sin datos personales), hacen capturas y entregan en la Tarea 2.4.\n- Moodle Centros: Tarea «2.4: Modificación de Juego Plataformas (CEv 1.3, 2.1, 6.2)» (evaluada con rúbrica 1-3-5-7-10). Tarea evaluable del bloque de condicionales y bucles: juego modificado, pseudocódigo y enlace.\n- Evidencia: Juego Plataformas modificado\n- Evidencia: Pseudocódigo de las reglas\n- Evidencia: Enlace compartido", "temporalizacion": "2 sesiónes", "recursos": "PDF de Plataformas, MakeCode Arcade, Foro de bugs", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCCL3. Localiza, selecciona y contrasta de manera progresivamente autónoma información procedente de diferentes fuentes, evaluando su fiabilidad y pertinencia en función de los objetivos de lectura y evitando los riesgos de manipulación y desinformación, y la integra y transforma en conocimiento para comunicarla adoptando un punto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA1. Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nCYR.3.2.1.Conocer y resolver la variedad de problemas posibles, desarrollando un programa informático y generalizando las soluciones, tanto de forma individual como trabajando en equipo, colaborando y comunicándose de forma adecuada.\nCYR.3.1.3.Entender cómo funciona un programa informático, la manera de elaborarlo y sus principales componentes.\nCYR.3.6.2.Acceder a servicios de intercambio y publicación de información digital aplicando criterios de seguridad y uso responsable.", "ejercicios": "Escribe en pseudocódigo las reglas del juego del dinosaurio de Chrome.\nPrograma la gravedad y el salto del juego Plataformas.\nAñade plataformas a varias alturas y monedas que sumen puntos.\nPrograma una cuenta atrás o un bucle y una condición de victoria o derrota propia.\nEscribe en pseudocódigo las reglas de tu juego.", "metodologias": "Símil bloques ↔ código, Aprendizaje basado en retos escalonados", "sesiones": [4, 5]}, {"titulo": "Minijuego-historia con listas sobre licencias Creative Commons", "tipo": "Estructuración", "abreviatura": "EST2", "orden": "3", "tarea": "2.5 · Minijuego Interactivo con Listas sobre Licencias CC (CEv 2.1, 2.2, 6.3)", "descripcion": "Sesión 6 (50 min): Recursos multimedia y licencias Creative Commons\nReto: Distinguir las licencias Creative Commons, buscar sprites y sonidos que podamos usar legalmente y aprender a atribuirlos.\n- Gancho: ¿puedo usar esta canción? (7 min). El docente plantea: «Quiero poner en mi juego la canción de moda y el personaje de un videojuego famoso, ¿puedo?». Votación a mano alzada y debate breve. Se cuenta que muchos vídeos y juegos amateurs se retiran por usar música o personajes protegidos.\n- Ley de Propiedad Intelectual y licencias CC (12 min). Explicación con la web de clase: los derechos de autor protegen una obra desde que se crea; las licencias Creative Commons permiten usarla con condiciones. Se ven los cuatro símbolos (BY reconocimiento, SA compartir igual, NC no comercial, ND sin obras derivadas) y las licencias que más se usan en juegos: CC BY, CC BY-SA, CC BY-NC y CC0 (dominio público). Se explica la fórmula de atribución TASL: título, autoría, fuente y licencia.\n- ¿Puedo usarlo? (casos) (8 min). Cinco casos rápidos en la web de clase (un sprite CC BY-NC para un juego que se vende, un sonido CC0, una música CC BY-SA, una imagen de un buscador sin licencia, un sprite de la galería de MakeCode). Cada estudiante responde y se corrige en grupo.\n- Búsqueda en repositorios libres (18 min). Cada estudiante busca para su futuro juego 2 sprites o fondos (OpenGameArt, Openverse o la galería de MakeCode) y 1 efecto de sonido (Freesound), comprueba la licencia y los anota en la ficha de atribución (anexo A5). Importante: no se descarga nada que pida registro con datos personales; Freesound solo se usa para escuchar y anotar si no hay cuenta del centro.\n- Ficha de atribución (5 min). Revisión entre compañeros: cada estudiante comprueba que la ficha del de al lado tiene título, autoría, fuente y licencia de cada recurso. La ficha se usará en las Tareas 2.5 y 2.6 y en la presentación final.\n- Evidencia: Ficha de atribución de recursos\n- Evidencia: Respuestas a los casos\n\nSesión 7 (50 min): Las listas (arrays): un estante numerado\nReto: Entender qué es una lista, cómo se numeran sus posiciones y usarla para crear un selector aleatorio de frases o premios.\n- Gancho: tu playlist (5 min). El docente pregunta: «¿cómo sabe la app de música cuál es la canción 3 de tu playlist?». Una playlist, la lista de la compra o la clasificación de una liga son listas: muchos datos ordenados en una sola variable.\n- Analogía del estante numerado (12 min). Explicación con la infografía del estante: cada balda es una posición (índice) que empieza en 0; la longitud es el número de elementos; leer un elemento (get value at index → lista[i]); añadir al final (add value to end → lista.push()). Se ve por qué el último índice es length - 1.\n- Bloques Arrays ↔ código (8 min). En el proyector, la categoría Arrays de MakeCode Arcade y su equivalente en JavaScript: let premios = [\"Escudo\", \"Vida extra\", \"Turbo\"], premios[0], premios.length, premios.push(\"Imán\"), premios.pickRandom() o premios[randint(0, premios.length - 1)].\n- Práctica: el cofre de premios (20 min). Cada estudiante programa un minijuego: al pulsar A, un cofre muestra un premio elegido al azar de una lista de 5 elementos y suma puntos. Reto plus: con B se añade un premio nuevo con push y se muestra la longitud. Reto pro: una lista de posiciones donde aparecen monedas o una lista de mensajes para un NPC (anticipa la sesión 8).\n- Comprobación (5 min). Quiz de índices en la web de clase y publicación en el foro de un bug típico (índice fuera de rango) con su solución.\n- Evidencia: Minijuego del cofre de premios\n\nSesión 8 (50 min): Minijuego-historia: un NPC que explica las licencias CC\nReto: Diseñar y programar un minijuego en el que un personaje (NPC) explica, una a una, las licencias Creative Commons guardadas en una lista.\n- Ejemplo jugado (5 min). El docente juega en el proyector un ejemplo: el jugador se acerca a un guía, pulsa A y el guía va explicando una licencia cada vez; al terminar, aparece un pequeño test.\n- Guion del minijuego (12 min). Con la plantilla (anexo A6) cada estudiante escribe los textos de la lista: una explicación breve y un ejemplo de cada licencia (CC BY, CC BY-SA, CC BY-NC y CC0), el escenario y qué evento hace avanzar el diálogo. Las explicaciones deben caber en pantalla (máximo 2 líneas cada una).\n- Programación del NPC (28 min). Programan: un jugador que se mueve; un sprite NPC (tipo propio o Food); una lista con las 4 explicaciones; una variable índice que empieza en 0; un evento (pulsar A cerca del NPC u on overlap) que muestra lista[índice] con showLongText o sayText y suma 1 al índice. Reto plus: una segunda lista con los nombres de las licencias y un sprite distinto para cada una. Reto pro: test final con game.ask y puntuación.\n- Prueba cruzada rápida (5 min). El compañero o compañera de al lado juega el minijuego y dice si se entiende cada licencia.\n- Evidencia: Guion del minijuego\n- Evidencia: Minijuego en progreso\n\nSesión 9 (50 min): Depuración y entrega del minijuego CC\nReto: Depurar el minijuego (sobre todo los índices de la lista), atribuir los recursos usados y entregarlo con un enlace seguro.\n- Caza del bug: índice fuera de rango (10 min). El docente proyecta un minijuego con tres errores provocados: el índice empieza en 1 (se salta CC BY), la condición usa <= length (falla en la última pulsación) y el índice no se reinicia al volver a jugar. Por parejas los localizan y se resuelve en común. Se publica la solución en el foro.\n- Pulido y atribución (15 min). Cada estudiante revisa su minijuego: textos sin errores, controles claros (pantalla de inicio que diga «Pulsa A para hablar») y créditos de los recursos usados (si son de la galería de MakeCode se indica; si son externos, título, autoría, fuente y licencia). Los créditos aparecen en una pantalla final del juego o en la descripción del proyecto.\n- Prueba con otra persona (10 min). Prueba cruzada con alguien distinto a la sesión 8 usando la lista de comprobación de la plantilla A6. Cada bug encontrado se corrige o se anota.\n- Compartir y entregar (15 min). Comparten el proyecto (título sin datos personales), copian el enlace y lo entregan en la Tarea 2.5 junto con el guion y la lista de comprobación.\n- Moodle Centros: Tarea «2.5: Minijuego Interactivo con Listas sobre Licencias CC (CEv 2.1, 2.2, 6.3)» (evaluada con rúbrica 1-3-5-7-10). Tarea evaluable del bloque de listas, eventos y licencias: minijuego-historia CC publicado.\n- Evidencia: Minijuego CC publicado\n- Evidencia: Guion y lista de comprobación", "temporalizacion": "4 sesiónes", "recursos": "OpenGameArt, Freesound, Openverse, Galería de MakeCode, MakeCode Arcade, Infografía del estante, Ficha de atribución, Plantilla de guion, Foro de bugs", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD4. Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nCYR.3.2.1.Conocer y resolver la variedad de problemas posibles, desarrollando un programa informático y generalizando las soluciones, tanto de forma individual como trabajando en equipo, colaborando y comunicándose de forma adecuada.\nCYR.3.2.2.Entender el funcionamiento interno de las aplicaciones móviles y cómo se construyen, dando respuesta a las posibles demandas del escenario a resolver.\nCYR.3.6.3.Reconocer y comprender los derechos de los materiales alojados en la web.", "ejercicios": "Decide si puedes usar cada recurso de los casos y explica por qué.\nBusca 2 sprites o fondos y 1 sonido con licencia libre y atribúyelos en la ficha.\nCrea una lista de 5 premios y muestra uno al azar al pulsar A.\nAñade un premio con push y muestra la longitud de la lista.\nEscribe el guion con la explicación y un ejemplo de cada licencia CC.\nPrograma un NPC que muestre las explicaciones de una lista una a una.\nEncuentra y corrige los tres bugs del minijuego del docente.\nAñade los créditos de los recursos a tu minijuego y entrégalo con su enlace.", "metodologias": "Investigación guiada, Aprendizaje cooperativo, Tinkering, Símil bloques ↔ código, Creación narrativa, Aprendizaje basado en retos escalonados, Ciclo de depuración, Coevaluación técnica", "sesiones": [6, 7, 8, 9]}, {"titulo": "Proyecto final: videojuego retro 2D y ficha de depuración", "tipo": "Conclusión", "abreviatura": "CON1", "orden": "4", "tarea": "2.6 · Proyecto Final: Entrega de Juego con capturas y Ficha de Depuración", "descripcion": "Sesión 10 (50 min): Proyecto final: estudios, roles y Game Design Canvas\nReto: Formar los estudios de 2-3 personas, repartir los roles profesionales y diseñar el videojuego final en un Game Design Canvas.\n- Formación de estudios y roles (10 min). El docente forma 4 equipos de 3 (o parejas si lo prefiere) equilibrando experiencia: cada estudio tiene a alguien con más soltura programando y se reparten las dos personas con experiencia alta en estudios distintos. Se explican los roles: Lead Programmer, UI/UX y Arte, QA Tester y Documentación (en parejas, UI/UX asume también QA). Cada estudio elige nombre (sin datos personales).\n- Contrato del estudio (5 min). Firman el contrato del estudio (anexo A7): roles, cómo se toman las decisiones y qué hacen si alguien falta.\n- Game Design Canvas (25 min). Rellenan el Game Design Canvas (anexo A7): tipología (laberinto, plataformas o recolección arcade), historia en 3 frases, personaje y enemigos, cómo se gana y cómo se pierde (pseudocódigo), qué eventos tendrá (botones, colisiones, tiempo), qué lista usará (niveles, mensajes, posiciones, enemigos), recursos con su licencia (de la ficha A5) y boceto de la pantalla. Requisitos mínimos: eventos, condicionales, un bucle o temporizador, una lista, marcador y pantalla de victoria/derrota.\n- Validación con el docente (10 min). Cada estudio explica su canvas al docente en 2 minutos; el docente comprueba que cumple los requisitos y que es alcanzable en 3 sesiones. El resto del tiempo empiezan el proyecto en MakeCode (un único proyecto compartido por el Lead Programmer).\n- Evidencia: Contrato del estudio\n- Evidencia: Game Design Canvas\n\nSesión 11 (50 min): Programación del núcleo: mapa, movimiento y colisiones\nReto: Tener la versión 0.1 (alfa) del juego: escenario, movimiento, colisiones y animación del personaje.\n- Reunión de pie (stand-up) (5 min). Cada estudio responde en 1 minuto: ¿qué hicimos?, ¿qué haremos hoy?, ¿qué nos bloquea? El docente anota los bloqueos.\n- Desarrollo del núcleo (35 min). Lead Programmer: movimiento, cámara, colisiones con paredes y eventos on overlap (monedas, enemigos, meta). UI/UX y Arte: tilemap del nivel 1, sprites y animación del personaje (animation.runImageAnimation para andar o saltar). QA Tester: prueba cada cambio y anota bugs en la ficha de depuración (anexo A8). Cada 10 minutos se cambia quién maneja el teclado del proyecto compartido para que todo el estudio programe. El docente asesora y anima a quien quiera a escribir partes en JavaScript o Python.\n- Versión 0.1 (alfa) (10 min). El estudio guarda la versión 0.1 (botón de historial de versiones o copia del proyecto con «v0.1» en el título) y la anota en el registro de versiones. Si hay un bug que no saben resolver, lo publican en el foro «Detector de bugs y minitutoriales».\n- Evidencia: Versión 0.1 del juego\n- Evidencia: Primeras entradas de la ficha de depuración\n\nSesión 12 (50 min): Ensamblaje y publicación cibersegura\nReto: Completar la versión 0.2 (beta) con listas, marcador, temporizador, sonido y pantallas de victoria y derrota, y publicarla de forma segura.\n- Stand-up (3 min). Reunión de pie de 1 minuto por estudio con los bloqueos pendientes.\n- Ensamblaje de la beta (27 min). Cada estudio integra lo que falta de los requisitos mínimos: la lista (por ejemplo, lista de niveles, de mensajes de ánimo, de posiciones de aparición o de enemigos), el marcador de puntos o vidas, un temporizador o bucle, efectos de sonido (music.play) y las pantallas de inicio (game.splash) y de victoria/derrota (game.gameOver). UI/UX y Arte añade los créditos de los recursos en una pantalla final. Se guarda la versión 0.2 (beta).\n- ¿Dónde vive mi juego? (10 min). El docente explica con la web de clase qué ocurre al pulsar Compartir: el proyecto se sube a los servidores de MakeCode y se crea una página web con una dirección pública (makecode.com/xxxx) que cualquiera con el enlace puede abrir, jugar y ver su código. Se analiza la estructura de esa página (simulador, título, descripción, botón de editar). Lista de comprobación cibersegura: alias o nombre del estudio en lugar de nombres reales, sin fotos ni datos del centro, descripción sin información personal, compartir el enlace solo por Moodle.\n- Publicación segura (10 min). El estudio revisa su proyecto con la lista de comprobación, lo comparte y prueba el enlace en otro ordenador (o en modo incógnito). Anota el enlace en la ficha de depuración.\n- Evidencia: Versión 0.2 (beta)\n- Evidencia: Enlace publicado y lista de comprobación\n\nSesión 13 (50 min): Peer-testing, ficha de depuración y entrega del juego\nReto: Probar los juegos de otro estudio, corregir los bugs detectados, cerrar la versión 1.0 y entregar el juego con su memoria y ficha de depuración.\n- Peer-testing (18 min). Cada estudio juega el juego de otro (rotación A→B→C→D→A) durante 8 minutos y anota en la hoja de pruebas de la ficha (anexo A8) al menos 2 bugs o mejoras: qué ocurre, cuándo ocurre y cómo reproducirlo. Después se devuelven las hojas y se comentan en 2 minutos.\n- Corrección de bugs (17 min). Cada estudio corrige los bugs recibidos y los propios y los registra en el Debugging Log: ID, descripción, cuándo ocurre y solución aplicada (mínimo 2). Se guarda la versión 1.0 con el enlace definitivo.\n- Memoria y entrega (15 min). QA Tester y Documentación completa la memoria (canvas actualizado, capturas del juego y del código, ficha de depuración, registro de versiones y ficha de atribución) y el estudio entrega en la Tarea 2.6 el enlace de la versión 1.0 y la memoria en PDF.\n- Moodle Centros: Tarea «2.6: Proyecto Final: Entrega de Juego con capturas y Ficha de Depuración» (evaluada con rúbrica 1-3-5-7-10). Tarea final del producto: enlace del videojuego 1.0, memoria con capturas, ficha de depuración, registro de versiones y créditos.\n- Evidencia: Hojas de peer-testing\n- Evidencia: Ficha de depuración y registro de versiones\n- Evidencia: Juego 1.0 publicado", "temporalizacion": "4 sesiónes", "recursos": "Plantilla Game Design Canvas, Ficha de atribución, MakeCode Arcade, Ficha de depuración, Foro de bugs", "descriptores": "CC3. Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.\nCCEC3. Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crí
