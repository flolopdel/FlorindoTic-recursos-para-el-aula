<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clase · SdA 2: Código en Acción - Videojuegos e Historias Interactivas Sostenibles</title>
<style>
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#dbe3ec;
  --brand:#0f766e; --brand-soft:#ccfbf1; --accent:#7c3aed; --accent-soft:#ede9fe;
  --ok:#15803d; --ok-bg:#dcfce7; --ko:#b91c1c; --ko-bg:#fee2e2; --warm:#c2410c; --warm-bg:#fff7ed;
  --code-bg:#0f172a; --code-ink:#e2e8f0; --slide:#ffffff; --f-ini:#2563eb; --f-des:#0f766e; --f-cie:#9333ea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#111a2e; --ink:#e5e9f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#23304a;
    --brand:#2dd4bf; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
    --ok:#4ade80; --ok-bg:#14532d; --ko:#f87171; --ko-bg:#450a0a; --warm:#fdba74; --warm-bg:#2a1608;
    --code-bg:#020617; --code-ink:#e2e8f0; --slide:#111a2e; --f-ini:#60a5fa; --f-des:#2dd4bf; --f-cie:#c084fc;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2e; --ink:#e5e9f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#23304a;
  --brand:#2dd4bf; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
  --ok:#4ade80; --ok-bg:#14532d; --ko:#f87171; --ko-bg:#450a0a; --warm:#fdba74; --warm-bg:#2a1608;
  --code-bg:#020617; --code-ink:#e2e8f0; --slide:#111a2e; --f-ini:#60a5fa; --f-des:#2dd4bf; --f-cie:#c084fc;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
@media(max-width:760px){.top{overflow-x:auto}.top .ttl{display:none}.top .tb{flex:0 0 auto}select.tb{max-width:60vw}}
.top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.top .ttl small{font-weight:500;color:var(--muted);margin-left:8px}
.tb{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.tb:hover{border-color:var(--brand);color:var(--brand)}
.tb[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
select.tb{max-width:42vw}
/* ---------- índice */
.home{max-width:1180px;margin:0 auto;padding:28px 16px 48px}
.hero{background:linear-gradient(135deg,#134e4a,#1e3a8a);color:#fff;border-radius:18px;padding:28px 24px}
.hero h1{margin:6px 0;font-size:clamp(26px,4vw,40px);line-height:1.1}
.hero p{margin:6px 0;opacity:.92;font-size:18px}
.hero .k{font-size:13px;opacity:.8;letter-spacing:.04em;text-transform:uppercase}
.help{margin:14px 0 0;font-size:14px;opacity:.85}
.kbd{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:0 6px;font-size:12px;margin:0 2px}
.cards{display:grid;gap:14px;margin-top:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sc{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);border-top:6px solid var(--fc,var(--brand))}
.sc:hover{border-color:var(--fc,var(--brand));transform:translateY(-1px)}
.sc .n{font-size:13px;font-weight:700;color:var(--fc,var(--brand));text-transform:uppercase;letter-spacing:.04em}
.sc h3{margin:6px 0;font-size:18px;line-height:1.25}
.sc p{margin:0;color:var(--ink2);font-size:14px}
.sc .c{margin-top:10px;font-size:13px;color:var(--muted)}
/* ---------- modo proyección */
.stage{position:relative;height:calc(100vh - 57px);display:flex;align-items:center;justify-content:center;padding:12px}
.fs .stage{height:100vh;padding:0}
.fs .top{display:none}
.slide{position:relative;width:min(100%, calc((100vh - 81px) * 16 / 9));aspect-ratio:16/9;background:var(--slide);border-radius:14px;box-shadow:0 10px 40px rgba(15,23,42,.18);overflow:hidden;
  font-size:min(2.05vw, 3.6vh);container-type:inline-size}
.fs .slide{width:min(100vw, calc(100vh * 16 / 9));border-radius:0;box-shadow:none}
@supports (font-size:1cqw){ .slide{font-size:2.05cqw} }
.slide .in{position:absolute;inset:0;padding:3.2em 3.6em 3em;display:flex;flex-direction:column;overflow:auto}
.slide .bar{position:absolute;left:0;right:0;bottom:0;height:.35em;background:var(--line)}
.slide .bar i{display:block;height:100%;background:var(--fc,var(--brand))}
.slide .pg{position:absolute;right:1.4em;bottom:.9em;font-size:.62em;color:var(--muted)}
.slide .tag{position:absolute;left:5.8em;top:2.1em;font-size:.62em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fc,var(--brand))}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(15,23,42,.08);color:var(--ink2);font-size:24px;opacity:.4}
.nav:hover{opacity:1}.nav.l{left:4px}.nav.r{right:4px}
.fs .nav{display:none}
.notes{position:fixed;left:16px;right:16px;bottom:16px;z-index:9;background:var(--warm-bg);border:1px solid var(--warm);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:15px;max-height:30vh;overflow:auto;display:none}
.notes.on{display:block}
.notes b{color:var(--warm)}
/* ---------- modo estudio */
.study{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.study .slide{width:100%;aspect-ratio:auto;font-size:18px;margin:0 0 16px;box-shadow:none;border:1px solid var(--line);container-type:normal}
@media(max-width:640px){.study .slide{font-size:16px}}
.study .slide .in{position:static;padding:2.4em 1.4em 1.4em;overflow:visible}
.study .slide .bar,.study .slide .pg{display:none}
.study .slide .tag{left:2.3em;top:1.6em}
.study h2.sh{margin:28px 0 12px;font-size:22px}
/* ---------- piezas de diapositiva */
.s-h{margin:0 0 .5em;font-size:1.75em;line-height:1.15;font-weight:800}
.s-lead{font-size:1.1em;color:var(--ink2);margin:0 0 .7em}
.ico{font-size:2.4em;line-height:1;margin-bottom:.2em}
ul.pts{margin:.2em 0;padding-left:1.1em}ul.pts li{margin:.35em 0}
.cover{justify-content:center;background:linear-gradient(135deg,var(--fc,var(--brand)),#1e3a8a);color:#fff}
.cover .s-h{font-size:2.6em}.cover .s-lead{color:rgba(255,255,255,.9)}
.cover .q{margin-top:1em;font-size:1.25em;font-weight:700;background:rgba(255,255,255,.14);border-radius:.5em;padding:.6em .8em}
.cover .tag{color:rgba(255,255,255,.85)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2em;align-items:start}
@media(max-width:640px){.study .two{grid-template-columns:1fr}}
.box{background:var(--bg);border-radius:.6em;padding:.8em 1em}
.box.hl{background:var(--brand-soft)}
.box.ac{background:var(--accent-soft)}
.box.wa{background:var(--warm-bg)}
.box .lb{font-size:.62em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.3em}
.ask{margin-top:auto;padding-top:.7em;font-size:1.1em;font-weight:700;color:var(--accent)}
ol.steps{list-style:none;margin:.3em 0;padding:0;counter-reset:st;display:grid;gap:.45em}
ol.steps li{counter-increment:st;display:flex;gap:.7em;align-items:flex-start;background:var(--bg);border-radius:.5em;padding:.45em .7em}
ol.steps li::before{content:counter(st);flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;background:var(--fc,var(--brand));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85em}
ol.steps li.hid{visibility:hidden}
.cols{display:grid;gap:1em;grid-template-columns:repeat(var(--n,2),1fr)}
@media(max-width:640px){.study .cols{grid-template-columns:1fr}}
.col{border:2px solid var(--line);border-radius:.6em;padding:.7em .9em}
.col h4{margin:0 0 .3em;font-size:1.1em;color:var(--fc,var(--brand))}
.grid-i{display:grid;gap:.7em;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
@media (max-width:700px){.grid-i{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gi{background:var(--bg);border-radius:.6em;padding:.7em;text-align:center}
.gi .e{font-size:1.8em}.gi>b{display:block;margin:.2em 0}.gi>span{display:block;font-size:.85em;line-height:1.35;color:var(--ink2)}.gi>span b{color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5em;margin:.6em 0}
.fn{padding:.55em .9em;border-radius:.5em;background:var(--brand-soft);border:2px solid var(--brand);font-weight:600;text-align:center;max-width:12em}
.fn.inicio,.fn.fin{border-radius:2em;background:var(--accent-soft);border-color:var(--accent)}
.fn.decision{background:var(--warm-bg);border-color:var(--warm);transform:skew(-8deg)}
.fn.decision>span{display:inline-block;transform:skew(8deg)}
.arr{font-size:1.3em;color:var(--muted)}
.svgw{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.svgw svg{max-width:100%;max-height:100%;height:auto}
pre.code{margin:.3em 0;background:var(--code-bg);color:var(--code-ink);border-radius:.6em;padding:.8em 1em;font:0.82em/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;white-space:pre}
.big{font-size:4.2em;font-weight:900;line-height:1;color:var(--fc,var(--brand))}
.src{font-size:.6em;color:var(--muted);margin-top:.6em}
.opts{display:grid;gap:.5em;margin:.4em 0}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:.5em;padding:.5em .8em;font-size:1em}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.expl{display:none;margin-top:.4em}.expl.on{display:block}
.chip{display:inline-block;border-radius:2em;padding:.15em .7em;font-size:.7em;font-weight:700;background:var(--warm-bg);color:var(--warm);border:1px solid var(--warm);margin-right:.4em}
.timer{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--fc,var(--brand));color:var(--fc,var(--brand));background:transparent;border-radius:2em;padding:.2em .8em;font-weight:800;font-size:.9em}
.timer.end{background:var(--ko);border-color:var(--ko);color:#fff}
.vid{position:relative;flex:1;min-height:6em;border-radius:.6em;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .play{border:0;background:#dc2626;color:#fff;border-radius:.6em;padding:.6em 1.2em;font-size:1em;font-weight:800}
.study .vid{aspect-ratio:16/9;flex:none}
.reveal{border:1px dashed var(--muted);background:transparent;color:var(--muted);border-radius:.4em;padding:.2em .7em;font-size:.7em;margin-top:.4em}
.empty{max-width:700px;margin:60px auto;text-align:center;color:var(--muted)}
@media print{.top,.nav,.notes{display:none}.study .slide{break-inside:avoid}}
</style>
</head>

</div>
<div id="app"></div>

nde la programación en tu día a día?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔋", "titulo": "Variables: la mochila", "situacion": "Tu móvil marca **73 %** de batería. Dentro de un rato marcará 72, 71...", "explicacion": "Una **variable** es una mochila con nombre que guarda un dato que cambia. En MakeCode Arcade: **score** (puntos) y **life** (vidas).", "pregunta": "¿Qué otras variables tiene tu móvil?"}, {"tipo": "ejemplo", "icono": "🪫", "titulo": "Condicionales: tomar decisiones", "situacion": "Cuando la batería baja del **20 %**, el móvil activa solo el modo ahorro.", "explicacion": "**Si** se cumple una regla, **entonces** hace algo. En un juego: si el jugador toca una moneda, entonces suma 1 punto (**on overlap**)."}, {"tipo": "ejemplo", "icono": "⏰", "titulo": "Bucles: repetir tareas", "situacion": "Pospones la alarma y vuelve a sonar **cada 5 minutos**.", "explicacion": "Un **bucle** repite instrucciones. En un juego: cada 2 segundos aparece un enemigo (**on game update every 2000 ms**)."}, {"tipo": "codigo", "titulo": "La batería del móvil en MakeCode Arcade", "codigo": "let bateria = 100\ngame.onUpdateInterval(1000, function () {\n    bateria = bateria - 10\n    movil.sayText(bateria)\n    if (bateria < 20) {\n        movil.sayText(\"Modo ahorro\")\n    }\n})", "explicacion": ["**bateria** es la variable.", "**onUpdateInterval** repite cada segundo (bucle).", "**if** decide cuándo avisar (condicional)."], "pregunta": "¿Qué pasaría si la batería llega a 0? ¿Cómo lo arreglarías?"}, {"tipo": "practica", "titulo": "Simula un sistema real", "tiempo": 25, "agrupamiento": "Individual", "enunciado": "Elige **uno** y prográmalo en MakeCode Arcade (o en Scratch para Educación):", "pasos": ["A) Batería: baja 10 cada segundo y avisa por debajo de 20.", "B) Alarma: suena cada 5 s; al pulsar A se pospone.", "C) Enemigos: aparece uno cada 2 s en un sitio aleatorio.", "Plus: combina dos sistemas."], "enlace": "https://florindotic.es/content/curso2026-2027/computaci p y marca las **paredes**.", "La cámara sigue al jugador y la meta da la victoria.", "Plus: temporizador de 30 s · Pro: segundo nivel."], "enlace": "https://drive.google.com/file/d/1jfLrnzg82DiNSX-IYEYpVvKFYCFK8y-7/view?usp=drive_link"}, {"tipo": "codigo", "titulo": "Lo que hay detrás de los bloques", "codigo": "let jugador = sprites.create(img`...`, SpriteKind.Player)\ncontroller.moveSprite(jugador)\ntiles.setCurrentTilemap(tilemap`laberinto`)\nscene.cameraFollowSprite(jugador)", "explicacion": ["Cada **bloque** es una **línea**.", "Los paréntesis llevan los **datos** (parámetros).", "**SpriteKind.Player** dice de qué tipo es el sprite."], "pregunta": "¿Qué cambiarías para que el jugador vaya más despacio?"}, {"tipo": "quiz", "pregunta": "¿Qué hace controller.moveSprite(jugador)?", "opciones": ["Dibuja el jugador", "Mueve el jugador con la cruceta", "Hace que la cámara lo siga"], "correcta": 1, "explicacion": "Conecta la **cruceta** con el sprite: es la línea del bloque «move with buttons»."}, {"tipo": "ejemplo", "icono": "🔗", "titulo": "Compartir no es lo mismo que publicar a lo loco", "situacion": "Pulsas **Compartir** y MakeCode te da un enlace. Cualquiera que lo tenga puede jugar y ver tu código.", "explicacion": "Por eso el título y el juego **no llevan** tu nombre completo, tu foto ni tu centro. Usa un nombre de estudio o un alias."}, {"tipo": "practica", "titulo": "Comparte y entrega", "tiempo": 10, "entrega": "Tarea 2.3: Práctica Guiada El Laberinto", "enunciado": "Genera el enlace, haz capturas del juego, de los bloques y de JavaScript y completa la plantilla del anexo A3."}, {"tipo": "cierre", "puntos": ["Sprite + cruceta + tilemap = primer juego.", "Bloques y JavaScript son el mismo programa.", "Comparte sin datos personales."], "siguiente": "Condicionales, bucles y un juego de plataformas.", "pregunta": "¿Quién puede ver tu juego si compartes el enlace?"}]}, {"n": 4, "fase": "Desarrollo", "titulo": "Condicionales, bucles y pseudocódigo", "reto": "Entender cómo se escriben en JavaScript y Python los condicionales, los bucles y los eventos, y empezar el juego guiado «Plataformas».", "pregunta": "¿Cómo se escribe un bloque con letras?", "diapositivas": [{"tipo": "quiz", "pregunta": "¿Qué guarda la variable life en MakeCode Arcade?", "opciones": ["La puntuación", "Las vidas", "El tiempo"], "correcta": 1, "explicacion": "**life** son las vidas y **score** la puntuación."}, {"tipo": "comparar", "titulo": "El mismo programa, tres idiomas", "columnas": [{"titulo": "Bloques", "icono": "🧩", "puntos": ["if ‹choca› then", "  cambiar vidas en -1"]}, {"titulo": "JavaScript", "icono": "🟨", "puntos": ["if (choca) {", "  info.changeLifeBy(-1)", "}"]}, {"titulo": "Python", "icono": "🐍", "puntos": ["if choca:", "    info.change_life_by(-1)"]}], "texto": "Llaves { } en JavaScript; sangría (espacios) en Python."}, {"tipo": "codigo", "titulo": "Eventos, condicionales y bucles en un juego", "codigo": "// Evento: al chocar con un enemigo\nsprites.onOverlap(SpriteKind.Player, SpriteKind.Enemy, function (sprite, otherSprite) {\n    info.changeLifeBy(-1)\n    otherSprite.destroy()\n})\n// Bucle: se repite siempre\nforever(function () {\n    if (info.score() >= 10) {\n        game.gameOver(true)\n    }\n})", "explicacion": ["**onOverlap** se dispara cuando dos sprites se tocan (evento).", "**forever** repite sin parar (bucle).", "**if** comprueba la condición de victoria."]}, {"tipo": "ejemplo", "icono": "🦖", "titulo": "Las reglas del dinosaurio de Chrome", "situacion": "Sin internet, Chrome te deja saltar cactus con un dinosaurio.", "explicacion": "SI toca un cactus ENTONCES fin de partida. MIENTRAS siga vivo, suma puntos. SI pulsa espacio Y está en el suelo ENTONCES salta. Eso es **pseudocódigo**."}, {"tipo": "practica", "titulo": "Pseudocódigo en pareja", "tiempo": 10, "agrupamiento": "Parejas", "enunciado": "Escribid en pseudocódigo las **reglas** de un juego que conozcáis: cómo se gana, cómo se pierde y qué se repite. Usad SI... ENTONCES y MIENTRAS."}, {"tipo": "practica", "titulo": "Plataformas (parte 1)", "tiempo": 20, "agrupamiento": "Individual", "enunciado": "Sigue el PDF de Plataformas hasta tener **gravedad y salto**.", "pasos": ["Gravedad: **jugador.ay = 300**.", "Movimiento solo horizontal: **controller.moveSprite(jugador, 100, 0)**.", "Salto con A solo si toca el suelo (**isHittingTile**).", "¿Un bug? Publícalo en el foro «Detector de bugs»."], "enlace": "https://drive.google.com/file/d/1B4KmOh7RNGR_bx-99m-VInvWnBZHNFRp/view?usp=drive_link"}, {"tipo": "cierre", "puntos": ["Bloque = código: if, for, forever, onOverlap.", "Pseudocódigo = reglas en lenguaje natural.", "El foro sirve para pedir y dar ayuda."], "siguiente": "Terminamos Plataformas con monedas, cuenta atrás y victoria.", "pregunta": "Escribe en JavaScript: si la puntuación llega a 5, ganas."}]}, {"n": 5, "fase": "Desarrollo", "titulo": "Reto Plataformas: monedas, cuenta atrás y victoria", "reto": "Modificar el juego Plataformas con plataformas a varias alturas, monedas que suman puntos, una cuenta atrás y una condición propia de victoria o derrota.", "pregunta": "¿Qué hace que un juego sea un reto y no un paseo?", "diapositivas": [{"tipo": "codigo", "titulo": "Bug famoso: el salto infinito", "codigo": "controller.A.onEvent(ControllerButtonEvent.Pressed, function () {\n    if (jugador.isHittingTile(CollisionDirection.Bottom)) {\n        jugador.vy = -150\n    }\n})", "explicacion": ["Sin el **if**, el jugador salta en el aire una y otra vez.", "**isHittingTile(Bottom)**: solo salta si toca el suelo.", "**vy** negativa = hacia arriba."]}, {"tipo": "ejemplo", "icono": "🍄", "titulo": "Los juegos de plataformas clásicos", "situacion": "En los plataformas clásicos recoges monedas, el tiempo corre y llegas a la meta.", "explicacion": "Detrás hay **variables** (monedas, tiempo), **eventos** (tocar una moneda) y **condiciones** (si el tiempo llega a 0, pierdes)."}, {"tipo": "codigo", "titulo": "Monedas y cuenta atrás", "codigo": "sprites.onOverlap(SpriteKind.Player, SpriteKind.Food, function (sprite, moneda) {\n    moneda.destroy()\n    info.changeScoreBy(1)\n})\ninfo.startCountdown(45)\ninfo.onCountdownEnd(function () {\n    game.gameOver(info.score() >= 10)\n})", "explicacion": ["Al tocar una moneda: desaparece y **suma 1**.", "**startCountdown(45)**: 45 segundos.", "Al acabar el tiempo: gana si tiene 10 o más."]}, {"tipo": "practica", "titulo": "Reto de modificación", "tiempo": 30, "agrupamiento": "Individual", "enunciado": "Convierte el Plataformas en **tu** juego:", "pasos": ["1. Plataformas a varias alturas.", "2. Monedas que suman puntos.", "3. Cuenta atrás o bucle de enemigos.", "4. Tu propia regla de victoria o derrota.", "Pro: enemigos que te persiguen o segundo nivel."]}, {"tipo": "quiz", "pregunta": "¿Qué pasa con game.gameOver(info.score() >= 10) si tienes 7 monedas?", "opciones": ["Ganas", "Pierdes", "El juego sigue"], "correcta": 1, "explicacion": "7 >= 10 es **falso**, así que gameOver(false): **derrota**."}, {"tipo": "practica", "titulo": "Pseudocódigo y entrega", "tiempo": 15, "entrega": "Tarea 2.4: Modificación de Juego Plataformas", "enunciado": "Completa la plantilla del anexo A4 (pseudocódigo de tus reglas y su bloque o línea de código), comparte el juego sin datos personales y entrégalo."}, {"tipo": "cierre", "puntos": ["Evento + condicional = reglas del juego.", "Cuenta atrás = presión de tiempo.", "Pseudocódigo antes de programar."], "siguiente": "¿Podemos usar cualquier música o sprite de internet?", "pregunta": "Escribe la regla de derrota de tu juego en una frase."}]}, {"n": 6, "fase": "Desarrollo", "titulo": "Recursos multimedia y licencias Creative Commons", "reto": "Distinguir las licencias Creative Commons, buscar sprites y sonidos que podamos usar legalmente y aprender a atribuirlos.", "pregunta": "¿Todo lo que está en internet se puede usar?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎵", "titulo": "La canción de moda en tu juego", "situacion": "Subes tu juego con la canción del verano y, a los dos días, la plataforma lo retira.", "explicacion": "La música tiene **derechos de autor** desde que se crea. Usarla sin permiso es infringir la **Ley de Propiedad Intelectual**, aunque no ganes dinero.", "pregunta": "¿Y si cito al autor? ¿Ya puedo usarla?"}, {"tipo": "video", "titulo": "¿Qué son las licencias Creative Commons?", "busqueda": "licencias Creative Commons explicación sencilla para estudiantes", "preguntas": ["¿Qué significa BY?", "¿Qué diferencia hay entre NC y SA?"]}, {"tipo": "infografia", "titulo": "Las licencias que usaremos", "elementos": [{"icono": "👤", "titulo": "CC BY", "texto": "Úsalo como quieras, **citando** al autor/a."}, {"icono": "🔁", "titulo": "CC BY-SA", "texto": "Cita y comparte tu obra con la **misma licencia**."}, {"icono": "🚫💶", "titulo": "CC BY-NC", "texto": "Cita y **sin fines comerciales**."}, {"icono": "🆓", "titulo": "CC0", "texto": "Dominio público: **sin condiciones**."}], "nota": "Menciona también ND (sin obras derivadas): no sirve para juegos porque no se puede modificar."}, {"tipo": "pasos", "titulo": "Cómo atribuir un recurso (TASL)", "progresivo": true, "pasos": ["**T**ítulo: «Pixel Coin».", "**A**utoría: «Ana Pixel».", "**S** fuente: enlace a la página de OpenGameArt.", "**L**icencia: CC BY 4.0, con enlace."], "texto": "Ejemplo: «Pixel Coin» de Ana Pixel (OpenGameArt), CC BY 4.0."}, {"tipo": "quiz", "pregunta": "Vas a vender tu juego por 1 €. ¿Puedes usar un sprite CC BY-NC?", "opciones": ["Sí, si lo cito", "No, porque es de uso no comercial", "Sí, si lo modifico"], "correcta": 1, "explicacion": "NC = **no comercial**. Si vendes el juego no puedes usarlo, aunque lo cites o lo modifiques."}, {"tipo": "quiz", "pregunta": "Una imagen de un buscador sin licencia indicada…", "opciones": ["Se puede usar porque está en internet", "Se considera protegida: mejor no usarla", "Es dominio público"], "correcta": 1, "explicacion": "Si no sabemos la licencia, está **protegida** por defecto. Busca en repositorios con licencia clara."}, {"tipo": "practica", "titulo": "Busca tus recursos", "tiempo": 18, "agrupamiento": "Individual", "enunciado": "Busca **2 sprites o fondos** y **1 sonido** para tu futuro juego y anótalos en la ficha de atribución (anexo A5).", "pasos": ["OpenGameArt u Openverse para sprites y fondos.", "Freesound para sonidos (solo escuchar y anotar si no hay cuenta del centro).", "Comprueba la licencia antes de anotar.", "Nunca te registres con tus datos personales."], "enlace": "https://openverse.org"}, {"tipo": "cierre", "puntos": ["Todo tiene derechos de autor desde que se crea.", "CC = permiso con condiciones.", "Atribuye con TASL."], "siguiente": "Listas: guardar muchos datos en una sola variable.", "pregunta": "¿Qué licencia elegirías para tu juego y por qué?"}]}, {"n": 7, "fase": "Desarrollo", "titulo": "Las listas (arrays): un estante numerado", "reto": "Entender qué es una lista, cómo se numeran sus posiciones y usarla para crear un selector aleatorio de frases o premios.", "pregunta": "¿Cómo guardas 100 datos sin crear 100 variables?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎧", "titulo": "Tu playlist es una lista", "situacion": "Tienes 30 canciones en orden. Pulsas «siguiente» y suena la que está en la posición siguiente.", "explicacion": "Una **lista** (array) guarda muchos datos **en orden** dentro de una sola variable. Cada dato tiene su **posición** (índice)."}, {"tipo": "infografia", "titulo": "Una lista es un estante numerado", "svg": "<svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Una lista como un estante con cuatro posiciones numeradas de 0 a 3\" xmlns=\"http://www.w3.org/2000/svg\">\n<text x=\"20\" y=\"28\" style=\"fill:var(--ink);font-size:17px;font-weight:700\">let licencias = [ … ]<\/text>\n<rect x=\"20\" y=\"60\" width=\"140\" height=\"80\" rx=\"10\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:2\"/>\n<rect x=\"170\" y=\"60\" width=\"140\" height=\"80\" rx=\"10\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:2\"/>\n<rect x=\"320\" y=\"60\" width=\"140\" height=\"80\" rx=\"10\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:2\"/>\n<rect x=\"470\" y=\"60\" width=\"140\" height=\"80\" rx=\"10\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:2\"/>\n<text x=\"90\" y=\"106\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:18px;font-weight:700\">\"CC BY\"<\/text>\n<text x=\"240\" y=\"106\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:18px;font-weight:700\">\"CC BY-SA\"<\/text>\n<text x=\"390\" y=\"106\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:18px;font-weight:700\">\"CC BY-NC\"<\/text>\n<text x=\"540\" y=\"106\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:18px;font-weight:700\">\"CC0\"<\/text>\n<circle cx=\"90\" cy=\"172\" r=\"16\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><text x=\"90\" y=\"178\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px;font-weight:700\">0<\/text>\n<circle cx=\"240\" cy=\"172\" r=\"16\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><text x=\"240\" y=\"178\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px;font-weight:700\">1<\/text>\n<circle cx=\"390\" cy=\"172\" r=\"16\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><text x=\"390\" y=\"178\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px;font-weight:700\">2<\/text>\n<circle cx=\"540\" cy=\"172\" r=\"16\" style=\"fill:var(--warm-bg);stroke:var(--warm)\"/><text x=\"540\" y=\"178\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px;font-weight:700\">3<\/text>\n<text x=\"20\" y=\"218\" style=\"fill:var(--ink);font-size:15px\">Índice (posición): empieza en 0 · licencias.length = 4 · licencias[2] = \"CC BY-NC\"<\/text>\n<\/svg>", "nota": "Insiste en que se empieza a contar en 0: el elemento 1 está en la posición 0."}, {"tipo": "comparar", "titulo": "Bloques Arrays ↔ JavaScript", "columnas": [{"titulo": "Bloques", "icono": "🧩", "puntos": ["set premios to array of…", "get value at 0", "length of array", "add value to end"]}, {"titulo": "JavaScript", "icono": "🟨", "puntos": ["let premios = [\"Escudo\", \"Turbo\"]", "premios[0]", "premios.length", "premios.push(\"Imán\")"]}]}, {"tipo": "quiz", "pregunta": "En la lista [\"Escudo\", \"Vida extra\", \"Turbo\"], ¿qué hay en premios[1]?", "opciones": ["Escudo", "Vida extra", "Turbo"], "correcta": 1, "explicacion": "Se cuenta desde **0**: posición 0 = Escudo, posición 1 = **Vida extra**."}, {"tipo": "codigo", "titulo": "El cofre de premios", "codigo": "let premios = [\"Escudo\", \"Vida extra\", \"Turbo\", \"Imán\", \"x2 puntos\"]\ncontroller.A.onEvent(ControllerButtonEvent.Pressed, function () {\n    let i = randint(0, premios.length - 1)\n    cofre.sayText(premios[i], 1500)\n    info.changeScoreBy(1)\n})", "explicacion": ["**randint** elige una posición al azar.", "**length - 1** es la última posición.", "**premios[i]** lee el premio de esa posición."], "pregunta": "¿Qué pasaría si escribimos randint(0, premios.length)?"}, {"tipo": "practica", "titulo": "Programa tu cofre", "tiempo": 20, "agrupamiento": "Individual", "enunciado": "Al pulsar **A**, el cofre muestra un premio al azar de una lista de 5.", "pasos": ["Crea la lista con 5 premios.", "Evento del botón A: elige una posición al azar.", "Muestra el premio y suma 1 punto.", "Plus: con B añade un premio (push) y muestra la longitud.", "Pro: lista de posiciones para colocar monedas."]}, {"tipo": "cierre", "puntos": ["Lista = muchos datos en orden.", "Índices desde 0 hasta length - 1.", "push añade al final."], "siguiente": "Un personaje que explica las licencias CC usando una lista.", "pregunta": "Si una lista tiene 4 elementos, ¿cuál es el último índice?"}]}, {"n": 8, "fase": "Desarrollo", "titulo": "Minijuego-historia: un NPC que explica las licencias CC", "reto": "Diseñar y programar un minijuego en el que un personaje (NPC) explica, una a una, las licencias Creative Commons guardadas en una lista.", "pregunta": "¿Puede un videojuego enseñar algo de verdad?", "diapositivas": [{"tipo": "ejemplo", "icono": "🧙", "titulo": "Los personajes que te hablan", "situacion": "En muchos juegos te acercas a un personaje, pulsas A y te cuenta algo. Vuelves a pulsar y sigue la conversación.", "explicacion": "Las frases están guardadas en una **lista** y una variable **índice** recuerda por cuál va. Cada pulsación es un **evento**."}, {"tipo": "flujo", "titulo": "Cómo funciona el diálogo", "nodos": [{"texto": "Pulsar A cerca del NPC (evento)", "tipo": "inicio"}, {"texto": "¿índice < licencias.length?", "tipo": "decision"}, {"texto": "Sí → mostrar licencias[índice] y sumar 1 al índice", "tipo": "proceso"}, {"texto": "No → «¡Ya conoces las 4 licencias!»", "tipo": "fin"}]}, {"tipo": "practica", "titulo": "Escribe el guion", "tiempo": 12, "agrupamiento": "Individual", "enunciado": "Completa la plantilla del anexo A6: **una frase y un ejemplo** por licencia, máximo 2 líneas cada una.", "pasos": ["CC BY, CC BY-SA, CC BY-NC y CC0.", "¿Dónde ocurre la historia?", "¿Qué evento hace hablar al NPC?"]}, {"tipo": "codigo", "titulo": "El NPC en JavaScript", "codigo": "let licencias = [\"CC BY: úsalo citando a su autor/a.\", \"CC BY-SA: cita y comparte igual.\", \"CC BY-NC: cita y sin vender.\", \"CC0: dominio público, sin condiciones.\"]\nlet indice = 0\ncontroller.A.onEvent(ControllerButtonEvent.Pressed, function () {\n    if (indice < licencias.length) {\n        game.showLongText(licencias[indice], DialogLayout.Bottom)\n        indice += 1\n    } else {\n        game.splash(\"¡Ya conoces las 4 licencias!\")\n    }\n})", "explicacion": ["La **lista** guarda las 4 explicaciones.", "**indice** recuerda por cuál va.", "El **if** evita salirse de la lista."]}, {"tipo": "practica", "titulo": "Programa tu NPC", "tiempo": 28, "agrupamiento": "Individual", "enunciado": "Programa el minijuego-historia con tu guion.", "pasos": ["Jugador que se mueve y un NPC en el mapa.", "Lista con las 4 explicaciones.", "Variable índice y evento que avanza el diálogo.", "Plus: lista de nombres y sprite por licencia.", "Pro: test final con game.ask y puntuación."]}, {"tipo": "practica", "titulo": "Prueba cruzada", "tiempo": 5, "agrupamiento": "Parejas", "enunciado": "Juega el minijuego de tu compañero o compañera: ¿se entiende cada licencia? Díselo en una frase."}, {"tipo": "cierre", "puntos": ["Lista + índice = diálogo por turnos.", "Evento = lo que hace avanzar la historia.", "El if evita salir de la lista."], "siguiente": "Depuramos, atribuimos y entregamos el minijuego.", "pregunta": "¿Qué pasaría sin el if al pulsar A una quinta vez?"}]}, {"n": 9, "fase": "Desarrollo", "titulo": "Depuración y entrega del minijuego CC", "reto": "Depurar el minijuego (sobre todo los índices de la lista), atribuir los recursos usados y entregarlo con un enlace seguro.", "pregunta": "¿Por qué los programas fallan justo en el último elemento?", "diapositivas": [{"tipo": "codigo", "titulo": "Caza del bug: tres errores", "codigo": "let indice = 1                      // bug 1\ncontroller.A.onEvent(ControllerButtonEvent.Pressed, function () {\n    if (indice <= licencias.length) { // bug 2\n        game.showLongText(licencias[indice], DialogLayout.Bottom)\n        indice += 1\n    }\n})\n// bug 3: al volver a jugar, indice no vuelve a 0", "explicacion": ["Bug 1: empieza en 1 y se salta **CC BY**.", "Bug 2: con **<=** intenta leer la posición 4, que no existe.", "Bug 3: hay que poner **indice = 0** al reiniciar."], "pregunta": "¿Cómo lo arreglarías antes de mirar la solución?"}, {"tipo": "ejemplo", "icono": "📺", "titulo": "Los créditos de una serie", "situacion": "Al final de una serie o de un videojuego aparecen los créditos: quién hizo la música, el arte, el código…", "explicacion": "Tu minijuego también lleva **créditos**: título, autoría, fuente y licencia de cada recurso que no sea tuyo."}, {"tipo": "practica", "titulo": "Pulido y atribución", "tiempo": 15, "agrupamiento": "Individual", "enunciado": "Repasa tu minijuego:", "pasos": ["Pantalla de inicio: «Pulsa A para hablar».", "Textos sin faltas, que quepan en pantalla.", "Pantalla final o descripción con los **créditos**.", "Si todo es de la galería de MakeCode, indícalo."]}, {"tipo": "practica", "titulo": "Prueba con otra persona", "tiempo": 10, "agrupamiento": "Parejas (distintas a la sesión 8)", "enunciado": "Juega el minijuego de otra persona con la lista de comprobación de la plantilla A6 y dile qué bug has encontrado."}, {"tipo": "quiz", "pregunta": "La lista tiene 4 licencias. ¿Qué condición evita salirse?", "opciones": ["indice <= 4", "indice < licencias.length", "indice > 0"], "correcta": 1, "explicacion": "Las posiciones van de 0 a 3: **indice < length** (4) es correcto."}, {"tipo": "practica", "titulo": "Comparte y entrega", "tiempo": 15, "entrega": "Tarea 2.5: Minijuego Interactivo con Listas sobre Licencias CC", "enunciado": "Comparte el proyecto con un título sin datos personales y entrega el enlace junto con el guion (anexo A6)."}, {"tipo": "cierre", "puntos": ["Los bugs de índices son los más comunes.", "Los créditos son obligatorios.", "Probar con otra persona encuentra lo que tú no ves."], "siguiente": "Formamos los estudios y diseñamos el juego final.", "pregunta": "¿Qué bug te ha costado más encontrar hoy?"}]}, {"n": 10, "fase": "Desarrollo", "titulo": "Proyecto final: estudios, roles y Game Design Canvas", "reto": "Formar los estudios de 2-3 personas, repartir los roles profesionales y diseñar el videojuego final en un Game Design Canvas.", "pregunta": "¿Qué decide un estudio antes de escribir la primera línea de código?", "diapositivas": [{"tipo": "ejemplo", "icono": "🏢", "titulo": "Los estudios indie", "situacion": "Muchos juegos indie de éxito los hicieron equipos de 1 a 5 personas.", "explicacion": "Antes de programar, diseñan en un **documento de diseño**: qué se hace, cómo se gana, quién hace qué. Nosotros usaremos un **Game Design Canvas**."}, {"tipo": "infografia", "titulo": "Roles del estudio", "elementos": [{"icono": "💻", "titulo": "Lead Programmer", "texto": "Lógica, eventos, listas y marcador."}, {"icono": "🎨", "titulo": "UI/UX y Arte", "texto": "Tilemap, sprites, controles y licencias."}, {"icono": "🐞", "titulo": "QA Tester y Documentación", "texto": "Prueba, registra bugs y versiones."}], "nota": "En parejas, UI/UX y Arte asume también QA. Recuerda que todo el estudio responde del juego completo."}, {"tipo": "practica", "titulo": "Contrato del estudio", "tiempo": 5, "agrupamiento": "Estudios de 2-3", "enunciado": "Elegid nombre (sin datos personales), repartid los roles y firmad el contrato del anexo A7."}, {"tipo": "pasos", "titulo": "Requisitos mínimos del juego", "pasos": ["Eventos: botones y colisiones.", "Condicionales y un bucle o temporizador.", "Al menos **una lista**.", "Marcador (puntos o vidas) y pantalla de victoria/derrota.", "Recursos con licencia y créditos."]}, {"tipo": "practica", "titulo": "Game Design Canvas", "tiempo": 25, "agrupamiento": "Estudios de 2-3", "enunciado": "Rellenad el canvas del anexo A7.", "pasos": ["Tipología: laberinto, plataformas o recolección arcade.", "Historia en 3 frases y personajes.", "Cómo se gana y cómo se pierde (pseudocódigo).", "Eventos, lista y recursos con licencia.", "Boceto de la pantalla."]}, {"tipo": "practica", "titulo": "Validación", "tiempo": 10, "enunciado": "Explicad el canvas al docente en **2 minutos**. Si se valida, el Lead Programmer crea el proyecto y lo comparte con el estudio."}, {"tipo": "cierre", "puntos": ["Diseñar antes de programar ahorra bugs.", "Cada rol tiene una responsabilidad.", "El canvas es nuestro mapa."], "siguiente": "Programamos el núcleo: mapa, movimiento y colisiones.", "pregunta": "¿Cuál es la mecánica principal de vuestro juego en una frase?"}]}, {"n": 11, "fase": "Desarrollo", "titulo": "Programación del núcleo: mapa, movimiento y colisiones", "reto": "Tener la versión 0.1 (alfa) del juego: escenario, movimiento, colisiones y animación del personaje.", "pregunta": "¿Qué tiene que funcionar sí o sí para que un juego sea jugable?", "diapositivas": [{"tipo": "practica", "titulo": "Stand-up", "tiempo": 5, "agrupamiento": "Estudios", "enunciado": "Un minuto por estudio: **¿qué hicimos? ¿qué haremos hoy? ¿qué nos bloquea?**"}, {"tipo": "codigo", "titulo": "Animar al personaje", "codigo": "animation.runImageAnimation(\n    jugador,\n    [img`...`, img`...`, img`...`],  // fotogramas\n    150,                             // ms entre fotogramas\n    true                             // repetir\n)", "explicacion": ["Una animación es una **lista de imágenes**.", "150 ms entre fotogramas.", "true = se repite en bucle."]}, {"tipo": "codigo", "titulo": "Un enemigo que te persigue (reto pro)", "codigo": "game.onUpdateInterval(3000, function () {\n    let enemigo = sprites.create(img`...`, SpriteKind.Enemy)\n    tiles.placeOnRandomTile(enemigo, assets.tile`suelo`)\n    enemigo.follow(jugador, 40)\n})", "explicacion": ["Cada 3 s aparece un enemigo (**bucle**).", "Se coloca en una casilla al azar.", "**follow** lo hace perseguir al jugador."]}, {"tipo": "practica", "titulo": "Desarrollo del núcleo", "tiempo": 35, "agrupamiento": "Estudios con roles", "enunciado": "Hoy, cada rol con su tarea; **cada 10 minutos** cambia quién maneja el teclado.", "pasos": ["Lead Programmer: movimiento, cámara y colisiones.", "UI/UX y Arte: tilemap, sprites y animación.", "QA Tester: prueba y anota bugs en la ficha A8.", "Quien quiera: una parte en JavaScript o Python."]}, {"tipo": "ejemplo", "icono": "🧪", "titulo": "Versión alfa", "situacion": "Los juegos se prueban por fases: **alfa** (lo básico funciona), **beta** (casi completo) y **1.0** (final).", "explicacion": "Guardar versiones permite volver atrás si algo se rompe. Hoy cerramos la **0.1**."}, {"tipo": "practica", "titulo": "Guarda la versión 0.1", "tiempo": 10, "enunciado": "Guardad la v0.1, anotadla en el registro de versiones de la ficha A8 y publicad en el foro los bugs que no sepáis resolver."}, {"tipo": "cierre", "puntos": ["Núcleo = mapa + movimiento + colisiones.", "Todo el estudio programa por turnos.", "Versión guardada = red de seguridad."], "siguiente": "Listas, marcador, sonido y publicación segura.", "pregunta": "¿Qué bug habéis anotado hoy?"}]}, {"n": 12, "fase": "Desarrollo", "titulo": "Ensamblaje y publicación cibersegura", "reto": "Completar la versión 0.2 (beta) con listas, marcador, temporizador, sonido y pantallas de victoria y derrota, y publicarla de forma segura.", "pregunta": "Cuando compartes tu juego, ¿quién puede verlo?", "diapositivas": [{"tipo": "practica", "titulo": "Ensamblaje de la beta", "tiempo": 27, "agrupamiento": "Estudios con roles", "enunciado": "Completad los **requisitos mínimos** y guardad la versión 0.2.", "pasos": ["Una lista: niveles, mensajes, posiciones o enemigos.", "Marcador y temporizador o bucle.", "Sonidos con music.play.", "Pantalla de inicio, victoria/derrota y créditos."]}, {"tipo": "codigo", "titulo": "Una lista de niveles", "codigo": "let niveles = [tilemap`nivel1`, tilemap`nivel2`, tilemap`nivel3`]\nlet nivel = 0\ntiles.setCurrentTilemap(niveles[nivel])\nscene.onOverlapTile(SpriteKind.Player, assets.tile`meta`, function (sprite, location) {\n    nivel += 1\n    if (nivel < niveles.length) {\n        tiles.setCurrentTilemap(niveles[nivel])\n    } else {\n        game.gameOver(true)\n    }\n})", "explicacion": ["Los niveles se guardan en una **lista**.", "Al llegar a la meta se pasa al siguiente.", "Tras el último: **victoria**."]}, {"tipo": "ejemplo", "icono": "📸", "titulo": "La foto que se reenvía", "situacion": "Mandas una foto a un grupo y, a la semana, la ha visto gente que no conoces.", "explicacion": "Lo que se comparte con un **enlace** puede llegar a cualquiera. Con tu juego pasa lo mismo: el enlace es **público** para quien lo tenga."}, {"tipo": "infografia", "titulo": "¿Dónde vive mi juego?", "elementos": [{"icono": "💻", "titulo": "Tu ordenador", "texto": "Programas en el navegador."}, {"icono": "☁️", "titulo": "Servidor de MakeCode", "texto": "Al compartir, el proyecto **se sube**."}, {"icono": "🔗", "titulo": "Enlace público", "texto": "makecode.com/_xxxx: una **página web**."}, {"icono": "🌍", "titulo": "Quien tenga el enlace", "texto": "Juega y **ve tu código**."}], "nota": "Abre un enlace compartido y analiza la página: simulador, título, descripción, botón de editar."}, {"tipo": "pasos", "titulo": "Lista de comprobación cibersegura", "progresivo": true, "pasos": ["Título con el **nombre del estudio** o un alias.", "Sin nombres reales, fotos ni datos del centro.", "Descripción sin información personal.", "El enlace se comparte **solo por Moodle**.", "Pruébalo en modo incógnito antes de entregarlo."]}, {"tipo": "quiz", "pregunta": "¿Qué título es más seguro para el proyecto?", "opciones": ["«Juego de Lucía García 3.º B IES …»", "«PixelPanda Studio – Cave Run»", "«Mi juego (mi Instagram: @…)»"], "correcta": 1, "explicacion": "Un nombre de estudio no revela **datos personales** ni deja rastro hacia tus redes."}, {"tipo": "practica", "titulo": "Publica y prueba", "tiempo": 10, "agrupamiento": "Estudios", "enunciado": "Revisad la lista, compartid el proyecto, abrid el enlace en modo incógnito y anotadlo en la ficha de depuración (A8).", "enlace": "https://arcade.makecode.com"}, {"tipo": "cierre", "puntos": ["Beta = juego casi completo.", "Compartir = subir a un servidor y crear una web pública.", "Sin datos personales."], "siguiente": "Peer-testing, ficha de depuración y entrega del juego.", "pregunta": "¿Qué dato no pondrías nunca en tu proyecto?"}]}, {"n": 13, "fase": "Desarrollo", "titulo": "Peer-testing, ficha de depuración y entrega del juego", "reto": "Probar los juegos de otro estudio, corregir los bugs detectados, cerrar la versión 1.0 y entregar el juego con su memoria y ficha de depuración.", "pregunta": "¿Por qué los estudios piden a otras personas que prueben sus juegos?", "diapositivas": [{"tipo": "ejemplo", "icono": "🐞", "titulo": "Los testers de videojuegos", "situacion": "Antes de lanzar un juego, personas que no lo han programado lo juegan una y otra vez para encontrar fallos.", "explicacion": "Quien programa sabe cómo «debe» jugarse; quien prueba hace cosas inesperadas y **encuentra bugs**."}, {"tipo": "practica", "titulo": "Peer-testing", "tiempo": 18, "agrupamiento": "Rotación de estudios A→B→C→D→A", "enunciado": "Jugad 8 minutos el juego de otro estudio y anotad en la hoja de pruebas (anexo A8) **al menos 2 bugs o mejoras**.", "pasos": ["¿Qué ocurre?", "¿Cuándo ocurre?", "¿Cómo se reproduce?", "Devolved la hoja y comentadla en 2 minutos."]}, {"tipo": "pasos", "titulo": "Cómo se rellena el Debugging Log", "pasos": ["**ID**: 01, 02…", "**Descripción**: el jugador atraviesa la pared derecha.", "**Cuándo**: al saltar pegado a la pared.", "**Solución**: marcar esa casilla como pared en el tilemap."]}, {"tipo": "practica", "titulo": "Corregid y cerrad la 1.0", "tiempo": 17, "agrupamiento": "Estudios con roles", "enunciado": "Corregid los bugs, registradlos (mínimo 2) y guardad la **versión 1.0** con su enlace definitivo."}, {"tipo": "quiz", "pregunta": "Un tester dice «el juego va mal». ¿Qué le falta a ese informe?", "opciones": ["Nada", "Qué ocurre exactamente, cuándo y cómo reproducirlo", "El nombre del tester"], "correcta": 1, "explicacion": "Un buen informe de bug permite **reproducirlo**: qué, cuándo y cómo."}, {"tipo": "practica", "titulo": "Memoria y entrega", "tiempo": 15, "entrega": "Tarea 2.6: Proyecto Final: Entrega de Juego con capturas y Ficha de Depuración", "enunciado": "Entregad el enlace de la versión 1.0 y la memoria en PDF: canvas, capturas del juego y del código, ficha de depuración, registro de versiones y créditos."}, {"tipo": "cierre", "puntos": ["Probar con otras personas encuentra bugs ocultos.", "Un bug bien descrito se arregla antes.", "Versión 1.0 = juego final."], "siguiente": "Preparamos la presentación para la feria.", "pregunta const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x == null || x === '' ? [] : [x]);
// **negrita** dentro de los textos
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const FC = {'Inicio':'var(--f-ini)','Desarrollo':'var(--f-des)','Cierre':'var(--f-cie)'};
// Admite nombres de fase compuestos («Bloque 1 · Inicio»)
const fcol = f => FC[f] || FC[Object.keys(FC).find(k => String(f || '').includes(k))] || 'var(--brand)';
const st = { s: null, i: 0, mode: 'proy', notes: false, revealed: {} };
const SES = D.sesiones;

function ytId(v){
  const m = String(v||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/) || String(v||'').match(/^([\w-]{11})$/);
  return m ? m[1] : null;
}
// En vistas previas protegidas (iframe sandbox, about:srcdoc) el navegador bloquea replaceState: se ignora.
function setHash(h){ try { history.replaceState(null, '', h); } catch(e){} }
function fmtT(s){ s = Math.max(0, s|0); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

    const box = id ? `<div class="vid" data-yt="${id}" data-ini="${ini}" data-fin="${+d.fin||0}"><button class="play">▶ Reproducir aquí</button></div>`
      : `<a class="box wa" style="display:block;text-decoration:none;color:inherit" href="${esc(url)}" target="_blank" rel="noopener">🔎 Buscar en YouTube: <b>${esc(d.busqueda||'')}</b><div class="src">El docente elige el vídeo antes de clase.</div></a>`;
    return `<div class="in"><h2 class="s-h">🎬 ${md(d.titulo)}</h2>${d.texto ? `<p class="s-lead">${md(d.texto)}</p>` : ''}
      <div class="two" style="grid-template-columns:${arr(d.preguntas).length?'1.5fr 1fr':'1fr'};flex:1;min-height:0">${box}
      ${arr(d.preguntas).length ? `<div class="box ac"><div class="lb">Mientras lo ves</div><ul class="pts">${arr(d.preguntas).map(p=>`<li>${md(p)}</li>`).join('')}</ul></div>` : ''}</div>
      ${url && id ? `<div class="src"><a href="${esc(url)}" target="_blank" rel="noopener">Abrir en YouTube ↗</a>${d.duracion ? ' · '+esc(d.duracion) : ''}${ini ? ' · desde '+fmtT(ini) : ''}</div>` : ''}</div>`;

    return `<div class="in"><h2 class="s-h">✅ ${md(d.titulo || 'Hoy hemos aprendido')}</h2>
      <ul class="pts">${arr(d.puntos).map(p=>`<li>${md(p)}</li>`).join('')}</ul>

const TAG = {idea:'Idea clave', ejemplo:'Ejemplo cotidiano', pasos:'Paso a paso', comparar:'Comparamos', flujo:'Diagrama de flujo',
  infografia:'Infografía', codigo:'Programa', dato:'Dato', practica:'¡Manos a la obra!', quiz:'Comprueba', video:'Vídeo', cierre:'Cierre'};

function slidesOf(s){ return [{tipo:'portada', pregunta: s.pregunta}].concat(arr(s.diapositivas)); }
function renderSlide(s, d, k, total){
  const f = R[d.tipo] || R.idea;
  const tag = d.tipo !== 'portada' ? `<div class="tag">${esc(TAG[d.tipo]||'')}</div>` : '';
  return `<section class="slide" style="--fc:${fcol(s.fase)}" data-k="${k}">${f(d, s, k)}${tag}
    <div class="bar"><i style="width:${(k+1)/total*100}%"></i></div><div class="pg">${k+1} / ${total}</div></section>`;
}

// --------------------------------------------------- vistas
function home(){
  st.s = null; document.body.classList.remove('fs');
  $('#ttl').innerHTML = esc(D.meta.titulo || 'Sesiones');
  $('#sel').value = ''; $('#notes').classList.remove('on');
  $('#app').innerHTML = `<div class="home"><div class="hero"><div class="k">${esc([D.meta.curso_texto, D.materias].filter(Boolean).join(' · '))}</div>
    <h1>${esc(D.meta.titulo||'')}</h1>${D.meta.subtitulo ? `<p>${esc(D.meta.subtitulo)}</p>` : ''}
    ${D.reto ? `<p><b>Reto:</b> ${esc(D.reto)}</p>` : ''}
    <p class="help">Elige una sesión. Proyectar: <span class="kbd">←</span><span class="kbd">→</span> pasar · <span class="kbd">F</span> pantalla completa · <span class="kbd">N</span> notas del docente · <span class="kbd">E</span> modo estudio · <span class="kbd">Esc</span> volver aquí.</p></div>
    <div class="cards">${SES.map(s=>`<button class="sc" data-s="${s.n}" style="--fc:${fcol(s.fase)}"><div class="n">Sesión ${s.n} · ${esc(s.fase||'')}</div><h3>${esc(s.titulo)}</h3><p>${esc(s.reto||'')}</p><div class="c">${arr(s.diapositivas).length + 1} diapositivas</div></button>`).join('')}</div></div>`;
  setHash('#');
  wire();
}
function show(n, i){
  const s = SES.find(x => x.n == n); if (!s) return home();
  const sl = slidesOf(s);
  st.s = s; st.i = Math.max(0, Math.min(i|0, sl.length - 1));
  $('#ttl').innerHTML = `Sesión ${s.n}. ${esc(s.titulo)}<small>${esc(D.meta.titulo||'')}</small>`;
  $('#sel').value = String(s.n);
  $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar';
  if (st.mode === 'proy') {
    $('#app').innerHTML = `<div class="stage"><button class="nav l" id="pv" aria-label="Anterior">‹</button>${renderSlide(s, sl[st.i], st.i, sl.length)}<button class="nav r" id="nx" aria-label="Siguiente">›</button></div>`;
    $('#pv').onclick = prev; $('#nx').onclick = next;
  } else {
    $('#app').innerHTML = `<div class="study">${sl.map((d,k)=>renderSlide(s, d, k, sl.length)).join('')}
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:20px">${SES.find(x=>x.n==s.n-1) ? `<button class="tb" data-s="${s.n-1}">← Sesión ${s.n-1}</button>` : '<span></span>'}${SES.find(x=>x.n==s.n+1) ? `<button class="tb" data-s="${s.n+1}">Sesión ${s.n+1} →</button>` : ''}</div></div>`;
    window.scrollTo(0, 0);
  }
  const nt = st.mode === 'proy' ? sl[st.i].nota : null;
  $('#notes').innerHTML = nt ? `<b>Notas para el docente:</b> ${md(nt)}` : '<b>Notas:</b> sin notas en esta diapositiva.';
  $('#notes').classList.toggle('on', st.notes && st.mode === 'proy');
  setHash(`#s${s.n}-${st.i + 1}`);
  wire();
  fit();
}
function next(){
  if (!st.s) return; const sl = slidesOf(st.s), d = sl[st.i];
  if (d.tipo === 'pasos' && d.progresivo) { const key = st.s.n+'-'+st.i, v = st.revealed[key] ?? 1;
    if (v < arr(d.pasos).length) { st.revealed[key] = v + 1; return show(st.s.n, st.i); } }
  if (st.i < sl.length - 1) show(st.s.n, st.i + 1);
  else { const nx = SES.find(x => x.n == st.s.n + 1); if (nx) show(nx.n, 0); }
}
function prev(){ if (!st.s) return; if (st.i > 0) show(st.s.n, st.i - 1); else { const p = SES.find(x => x.n == st.s.n - 1); if (p) show(p.n, slidesOf(p).length - 1); } }

// Si el contenido no cabe en la diapositiva proyectada, reduce la letra (hasta un 62 %)
function fit(){
  const sl = document.querySelector('.stage .slide'); if (!sl) return;
  const inn = sl.querySelector('.in'); sl.style.fontSize = '';
  const base = parseFloat(getComputedStyle(sl).fontSize); let f = base;
  while (inn.scrollHeight > inn.clientHeight + 1 && f > base * 0.62) { f *= 0.96; sl.style.fontSize = f + 'px'; }
}
let fitT; addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fit, 80); });
let timers = {};
function wire(){
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => show(+b.dataset.s, 0));
  document.querySelectorAll('.opts').forEach(q => q.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    const ok = +q.dataset.ok; q.querySelectorAll('.opt').forEach(x => x.classList.remove('ok','ko'));
    o.classList.add(+o.dataset.j === ok ? 'ok' : 'ko'); q.querySelectorAll('.opt')[ok]?.classList.add('ok');
    document.getElementById('ex-' + q.dataset.q)?.classList.add('on');
  }));
  document.querySelectorAll('.reveal').forEach(b => b.onclick = () => { st.revealed[b.dataset.rev] = (st.revealed[b.dataset.rev] ?? 1) + 1; show(st.s.n, st.i); });
  document.querySelectorAll('.vid').forEach(v => { const b = v.querySelector('.play'); if (b) b.onclick = () => {
    const p = new URLSearchParams({autoplay: '1', rel: '0'}); if (+v.dataset.ini) p.set('start', v.dataset.ini); if (+v.dataset.fin) p.set('end', v.dataset.fin);
    v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?${p}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe>`; }; });
  document.querySelectorAll('.timer').forEach(b => {
    const k = b.dataset.k, paint = () => { const t = timers[k]; if (!t) return; const left = Math.round((t.end - Date.now())/1000);
      b.textContent = left > 0 ? '⏱ ' + fmtT(left) : '⏰ ¡Tiempo!'; b.classList.toggle('end', left <= 0); };
    if (timers[k]) paint();
    b.onclick = () => { if (timers[k]) { clearInterval(timers[k].iv); delete timers[k]; b.textContent = '⏱ ' + (b.dataset.timer/60) + ' min'; b.classList.remove('end'); return; }
      timers[k] = { end: Date.now() + b.dataset.timer * 1000 }; timers[k].iv = setInterval(() => { if (!document.body.contains(b)) return; paint(); }, 500); paint(); };
  });
}

// --------------------------------------------------- controles
$('#sel').innerHTML = `<option value="">Ir a la sesión…</option>` + SES.map(s => `<option value="${s.n}">S${s.n}. ${esc(s.titulo)}</option>`).join('');
$('#sel').onchange = e => e.target.value ? show(+e.target.value, 0) : home();
$('#b-home').onclick = home;
$('#b-mode').onclick = () => { st.mode = st.mode === 'proy' ? 'est' : 'proy'; st.s ? show(st.s.n, st.i) : null; $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar'; };
$('#b-notes').onclick = () => { st.notes = !st.notes; $('#b-notes').setAttribute('aria-pressed', st.notes); $('#notes').classList.toggle('on', st.notes && st.mode === 'proy' && !!st.s); };
$('#b-fs').onclick = toggleFs;
$('#b-theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('clase-theme', r.dataset.theme); } catch(e){} };
try { const t = localStorage.getItem('clase-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
function toggleFs(){
  if (!st.s) return;
  if (st.mode !== 'proy') { st.mode = 'proy'; show(st.s.n, st.i); }
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.().catch(()=>{}); document.body.classList.add('fs'); }
  else { document.exitFullscreen?.(); document.body.classList.remove('fs'); }
}
document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('fs', !!document.fullscreenElement); setTimeout(fit, 120); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (st.s && st.mode === 'proy' && ['ArrowRight','ArrowDown','PageDown',' '].includes(k)) { e.preventDefault(); next(); }
  else if (st.s && st.mode === 'proy' && ['ArrowLeft','ArrowUp','PageUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home' && st.s && st.mode === 'proy') show(st.s.n, 0);
  else if (k === 'End' && st.s && st.mode === 'proy') show(st.s.n, slidesOf(st.s).length - 1);
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'n' || k === 'N') $('#b-notes').click();
  else if ((k === 'e' || k === 'E') && st.s) $('#b-mode').click();
  else if (k === 'Escape' && !document.fullscreenElement) home();
});
// enlace directo: #s3-2 (sesión 3, diapositiva 2)
let m = null; try { m = location.hash.match(/^#s(\d+)(?:-(\d+))?/); } catch(e){}
if (!SES.length) $('#app').innerHTML = '<div class="empty">Esta situación de aprendizaje todavía no tiene diapositivas de clase.</div>';
else if (m) show(+m[1], (+m[2] || 1) - 1); else home();
</script>
