*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap;text-decoration:none}
.tb:hover{border-color:var(--brand);color:var(--brand)}
#b-menu{display:none}
.layout{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;padding:20px 16px 60px}
nav.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
nav.toc a{display:block;text-decoration:none;color:var(--ink2);border-radius:8px;padding:6px 10px;font-size:15px;line-height:1.35;border-left:4px solid transparent}
nav.toc a:hover{background:var(--bg)}
nav.toc a.on{background:var(--bg);color:var(--ink);font-weight:700;border-left-color:var(--fc,var(--brand))}
nav.toc a.sub{padding-left:24px;font-size:14px}nav.toc a.sub2{padding-left:38px;font-size:13.5px}
nav.toc .fz{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fc,var(--muted));margin:10px 10px 2px}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  #b-menu{display:inline-block}
  nav.toc{display:none;position:static;max-height:none}
  body.menu nav.toc{display:block}
}
main{min-width:0}
.hero{background:linear-gradient(135deg,#134e4a,#1e3a8a);color:#fff;border-radius:18px;padding:26px 24px}
.hero .k{font-size:13px;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.hero h1{margin:6px 0 4px;font-size:clamp(26px,4vw,38px);line-height:1.12}
.hero p{margin:6px 0;opacity:.95}
.page-h{border-top:6px solid var(--fc,var(--brand));background:var(--card);border-radius:14px;padding:18px 22px;margin-bottom:16px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.page-h .k{font-size:13px;font-weight:700;color:var(--fc,var(--brand));text-transform:uppercase;letter-spacing:.05em}
.page-h h2{margin:4px 0 0;font-size:clamp(22px,3.2vw,30px);line-height:1.2}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:14px 0}
.card h3{margin:0 0 8px;font-size:20px;line-height:1.3}
.card p{margin:8px 0;color:var(--ink2)}
.narr{display:flex;gap:14px;align-items:flex-start;background:var(--brand-soft);border-radius:14px;padding:14px 18px;margin:14px 0}
.narr .av{flex:0 0 auto;font-size:34px;line-height:1}
.narr p{margin:4px 0;color:var(--ink)}
.act{border-left:6px solid var(--fc,var(--brand))}
.act .hd{display:flex;gap:10px;align-items:flex-start}
.act .no{flex:0 0 auto;min-width:36px;height:36px;padding:0 8px;border-radius:10px;background:var(--fc,var(--brand));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.chip.ent{background:var(--warm-bg);color:var(--warm);border-color:var(--warm)}
ol.steps{margin:8px 0;padding-left:1.4em}ol.steps li{margin:4px 0;color:var(--ink2)}
ul.pts{margin:8px 0;padding-left:1.3em}ul.pts li{margin:4px 0;color:var(--ink2)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.lk{flex:1 1 14em;display:block;text-decoration:none;color:var(--ink);background:var(--warm-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
.lk:hover{border-color:var(--warm)}
details.ay{border:1px solid var(--line);border-left:5px solid var(--ayc,var(--brand));border-radius:10px;background:var(--card);margin:10px 0}
details.ay>summary{cursor:pointer;padding:9px 14px;font-weight:700;color:var(--ayc,var(--brand));list-style:none}
details.ay>summary::-webkit-details-marker{display:none}
details.ay>summary::after{content:' ▸';color:var(--muted)}details.ay[open]>summary::after{content:' ▾'}
details.ay>div{padding:0 16px 12px;color:var(--ink2)}
details.ay p{margin:6px 0}
.ay-pista{--ayc:var(--a-pista)}.ay-emociones{--ayc:var(--a-emociones)}.ay-repaso{--ayc:var(--a-repaso)}.ay-saber_mas{--ayc:var(--a-saber_mas)}
.ml .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.ml .tab{flex:1 1 12em;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px}
.ml .tab b{display:block}
.ml .tab .pc{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.ml .tab[aria-selected="true"]{border-color:var(--fc,var(--brand));background:var(--bg)}
.ml .opt{display:none;border:2px solid var(--fc,var(--brand));border-top:0;border-radius:0 0 12px 12px;padding:12px 16px;margin-top:-2px;background:var(--bg)}
.ml .opt.on{display:block}
.ml .opt p{color:var(--ink)}
.quiz label{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer}
.quiz label.ok{border-color:var(--ok);background:var(--ok-bg)}.quiz label.ko{border-color:var(--ko);background:var(--ko-bg)}
.quiz input{margin-top:.35em}
.btn{border:0;background:var(--fc,var(--brand));color:#fff;border-radius:10px;padding:8px 16px;font-weight:700}
.fb{display:none;margin-top:8px;border-radius:10px;padding:10px 14px}
.fb.on{display:block}.fb.ok{background:var(--ok-bg)}.fb.ko{background:var(--ko-bg)}
.done{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin-top:8px;cursor:pointer}
.vid{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;margin:10px 0}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .play{border:0;background:#dc2626;color:#fff;border-radius:10px;padding:10px 18px;font-weight:800}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.pager a{flex:1;max-width:48%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink)}
.pager a small{display:block;color:var(--muted)}
.pager a.r{text-align:right;margin-left:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin:14px 0}
.ap{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-top:5px solid var(--fc,var(--brand));border-radius:12px;padding:12px 16px}
.ap small{display:block;font-weight:700;color:var(--fc,var(--brand));text-transform:uppercase;letter-spacing:.04em;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:700}
.scroll{overflow-x:auto}
.note{font-size:14px;color:var(--muted)}
@media print{.top,nav.toc,.pager,.tabs,.btn,.done{display:none!important}.layout{display:block}.ml .opt{display:block;border-top:2px solid var(--line);margin:8px 0;border-radius:12px}details.ay>div{display:block}.page{break-before:page}}
</style>
</head>

ido un accidente.** Hay que hacer un programa que compruebe que sigue vivo y que todos sus circuitos continúan funcionando bien. ¿Nos ayudas? ¡Te necesitamos!", "bloques": [{"tipo": "texto", "titulo": "El sueño de crear vida artificial", "texto": "Uno de los grandes sueños del ser humano ha sido **dar vida a las máquinas**. Ya en la Antigüedad los griegos fabricaron los primeros **autómatas**, algunos capaces de moverse solos e imitar a los seres vivos.\n\nLa ciencia ficción también lo ha imaginado: en 1818 **Mary Shelley** escribió *Frankenstein*, la historia de un científico que da vida a un ser en su laboratorio. Hoy, la **robótica** y la **inteligencia artificial** nos acercan cada día un poco más a ese sueño.\n\nEn esta situación de aprendizaje te enfrentas al reto de **dar vida a nuestra placa robótica**."}, {"tipo": "actividad", "numero": "1", "titulo": "Antes de empezar nos preguntamos", "enunciado": "Piensa en estas preguntas (no tienes que responderlas todas) y contesta el formulario **F1**. Es anónimo: queremos saber de dónde partimos.", "agrupamiento": "Individual", "pasos": ["¿Qué crees que es un robot?", "¿Cuál sería el primer mensaje que te gustaría que dijera tu robot al recuperar la conciencia?", "¿Crees que los robots pueden sentir? ¿Cómo?", "¿Conoces robots que mejoren la vida de las personas?", "¿Te imaginas inventando una máquina que aún no existe?"]}, {"tipo": "texto", "titulo": "¿Qué pueden hacer los robots?", "texto": "Hoy los robots ya hacen muchísimas cosas:", "puntos": ["**Bailar**, hacer **música** y **dibujar**.", "Medir la **radiación** en centrales nucleares.", "Ayudar a **operar** y servir de **prótesis** inteligentes para recuperar movilidad.", "**Clasificar paquetes** en almacenes y **construir** edificios.", "**Conducir** solos y jugar al **tenis de mesa**.", "**Acompañar** a personas mayores y **cocinar** cualquier receta."]}, {"tipo": "video", "titulo": "Robots que bailan", "youtube": "https://www.youtube.com/watch?v=fn3KWM1kuAw" con las demás.", "Colaboramos para que el equipo funcione.", "Valoramos y respetamos lo que aporta cada persona."]}]}, {"tipo": "actividad", "numero": "3", "titulo": "Si fuéramos un robot", "enunciado": "Piensa en tu cuerpo como si fuera un robot y responde en el cuaderno. Después clasifica **piernas, brazos, manos, voz, oído, vista, tacto, gusto y cerebro** en **sensor**, **procesador** o **actuador**.", "agrupamiento": "Parejas", "criterios": ["CYR.1.1.4"], "pasos": ["¿Cuáles serían nuestros **sensores**?", "¿Cuáles serían nuestros **actuadores**?", "¿Con qué **procesamos** la información?", "¿Con qué órgano **almacenamos** información?", "¿Cómo **transmitimos** la información?"], "ayudas": [{"tipo": "pista", "titulo": "Solución para comprobar la clasificación", "puntos": ["**Sensores**: oído, vista, tacto y gusto.", "**Procesador** (y memoria): cerebro.", "**Actuadores**: piernas, brazos, manos y voz."]}, {"tipo": "pista", "titulo": "Palabras clave", "puntos": ["**Sensor**: dispositivo que detecta movimientos, ruidos, presión, luz…", "**Actuador**: dispositivo que transforma la energía en movimiento, luz o sonido.", "**Procesar**: hacer operaciones con unos datos."]}]}, {"tipo": "actividad", "numero": "4", "titulo": "Detecta y actúa con Scratch", "enunciado": "¿Los aparatos digitales también «sienten»? Seguro que ya lo has hecho en Scratch. En pareja, haz un proyecto en el que el ordenador reciba información, la procese y dé una respuesta.", "agrupamiento": "Parejas", "optativa": true, "pasos": ["Elige una **entrada**: un evento o un bloque de «Sensores».", "El programa **procesa** la información.", "Muestra una respuesta con una **salida**.", "¿Cuál ha sido tu entrada y tu salida? ¡Compártelo con la clase!"], "ayudas": [{"tipo": "pista", "titulo": "Un ejemplo", "texto": "Al pulsar la **tecla espacio**, el gato anda: la entrada es la tecla espacio y la salida es la animación en la pantalla. Míralo en [este proyecto de Scratch](https://scratch.mit.edu/projects/524669537/)."}]}], "ayudas": [{"tipo": "repaso", "titulo": "Reviso lo que aprendo", "puntos": ["¿Has recordado cómo percibimos los humanos la realidad?", "¿Sabes cuáles son nuestros «sensores» y «actuadores»?", "¿Sabrías hacer un proyecto de Scratch con una entrada y una salida?"]}]}, {"id": "3", "titulo": "Nuestra placa robótica", "fase": "Explorar", "sesiones": [2], "intro": "En este apartado empezamos a trabajar con la **placa robótica**: exploraremos sus componentes, conoceremos el **microcontrolador**, que es su cerebro, y veremos cómo se relaciona con el resto de componentes. ¿Empezamos?", "bloques": [{"tipo": "texto", "titulo": "La ruta de este apartado", "puntos": ["**3.1** Exploramos la placa (sesión 2).", "**3.2** El cerebro de nuestro robot (sesión 3).", "**3.2.1** ¿Qué has aprendido sobre los microcontroladores? (sesiones 3 y 4).", "**3.3** Entradas, procesamiento y salidas (sesión 4)."]}, {"tipo": "actividad", "numero": "", "titulo": "Mi Diario de aprendizaje", "enunciado": "Para tener éxito en el reto necesitarás estrategias que te sirvan para esta y otras tareas. Las irás descubriendo en tu **Diario de aprendizaje**: cuatro pasos que responderás en tu cuaderno.", "agrupamiento": "Individual", "pasos": ["**Paso 1**: Identifico lo que tengo que hacer (sesión 2).", "**Paso 2**: ¿Seré capaz de hacerlo? (sesión 2, en casa).", "**Paso 3**: Reviso lo aprendido (sesión 5).", "**Paso 4**: ¿Qué he aprendido? (sesión 9) y… ¡tu insignia de **Mega-Estratega**!"]}]}, {"id": "3.1", "titulo": "Exploramos la placa", "fase": "Explorar", "sesiones": [2], "intro": "Después del accidente, **esto es lo que ha quedado de nuestro robot**: su placa. En las siguientes actividades vamos a identificar sus componentes. ¿Te animas?", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Diseña tu placa robótica", "enunciado": "Imagina que vas a diseñar la placa robótica con la que trabajaremos en clase. Anótalo en la plantilla **A2**.", "agrupamiento": "Individual y después parejas", "criterios": ["CYR.1.1.4"], "pasos": ["Haz una lista de los **sensores** y **actuadores** que te gustaría que llevase.", "Piensa en otros componentes necesarios: conectividad, procesamiento, alimentación…", "Pon en común tu diseño con tu pareja y añade lo que te guste del suyo.", "Clasificad los componentes: sensores (**S**), procesamiento (**P**), actuadores (**A**), conectividad (**C**) y alimentación (**AL**)."], "ayudas": [{"tipo": "pista", "titulo": "¿Necesitas ideas?", "puntos": ["Sensores: pulsadores, sensor de temperatura, sensor de luz, acelerómetro, joystick, micrófono.", "Actuadores: LED, altavoz, motores.", "Otros: microcontrolador, conexión USB, Bluetooth, batería o pilas."]}]}, {"tipo": "actividad", "numero": "2", "titulo": "Diario de aprendizaje: paso 1", "enunciado": "En tu cuaderno, completa el **paso 1** del Diario de aprendizaje antes de empezar la siguiente actividad: ¿qué me están pidiendo? ¿recuerdo algo parecido que hice bien?", "agrupamiento": "Individual"}, {"tipo": "actividad", "numero": "3", "titulo": "Exploramos nuestra placa robótica", "enunciado": "Por parejas, coged la placa que os dará vuestro profesor o profesora y tratad de identificar sus componentes. Dibujadla en **A2**.", "agrupamiento": "Parejas", "criterios": ["CYR.1.1.1", "CYR.1.1.4"], "pasos": ["Observa detenidamente la cara **frontal**.", "Observa detenidamente la cara **trasera**.", "Dibuja la placa por ambas caras.", "Señala con una flecha los componentes que puedas identificar.", "Intenta adivinar la función de los demás: no pasa nada si te equivocas.", "Marca los que también estaban en tu diseño.", "¿Cómo se llama la placa? ¿Puedes encontrar su web oficial?"], "ayudas": [{"tipo": "pista", "titulo": "Normas de seguridad", "puntos": ["Coge la placa por los bordes.", "No toques los pines con objetos metálicos mientras está conectada.", "Conecta y desconecta el cable USB con cuidado."]}]}, {"tipo": "actividad", "numero": "4", "titulo": "Corrige los componentes de las dos caras", "enunciado": "Pon en común con tu pareja los componentes que habéis identificado y corregid el dibujo **con otro color** ayudándoos de la imagen que proyecta el docente. Añade a cada componente su letra (S, P, A, C o AL).", "agrupamiento": "Parejas", "criterios": ["CYR.1.1.1"], "entrega": "Tarea 3.1 · Exploramos la placa y MakeCode", "ayudas": [{"tipo": "pista", "titulo": "Los componentes de la micro:bit", "puntos": ["**Cara frontal**: botones A y B (entrada), matriz de 25 LED (salida y sensor de luz), logo táctil (entrada, V2), pines para conectar componentes y alimentación (3 V y GND).", "**Cara trasera**: microprocesador, acelerómetro y brújula (entradas), antena de radio y Bluetooth (conectividad), conector micro USB (conectividad y alimentación), conector de baterías, altavoz (salida) y micrófono (entrada) en la V2, botón de reset y LED testigo."]}, {"tipo": "saber_mas", "titulo": "¿Sabes cómo se llama nuestra placa?", "texto": "El modelo de nuestra placa robótica es **micro:bit**. Tienes mucha información en su web oficial, [microbit.org](https://microbit.org/)."}]}, {"tipo": "actividad", "numero": "5", "titulo": "Un vistazo al entorno de programación", "enunciado": "Ya conoces Scratch; ahora vamos a explorar el entorno con el que programaremos la placa: **MakeCode**. Entrad en [makecode.microbit.org](https://makecode.microbit.org/) y cread un proyecto nuevo.", "agrupamiento": "Parejas", "criterios": ["CYR.1.1.1"], "pasos": ["Comparadlo con Scratch: ¿qué se parece y qué es diferente?", "¿Dónde están los bloques? ¿Y la zona de programación?", "En MakeCode no hay escenario, pero ¿ves la micro:bit dibujada? ¿Para qué crees que sirve?", "Haced en **A2** un croquis de las zonas del entorno.", "Arrastrad «mostrar icono» dentro de «al iniciar» y miradlo en el simulador. ¡Tocad todo lo que queráis: los programas no se rompen!"], "ayudas": [{"tipo": "pista", "titulo": "Cambiar el idioma", "texto": "Pulsa el engranaje ⚙️ de arriba a la derecha → **Language** → **Español**."}, {"tipo": "pista", "titulo": "Las partes del entorno", "puntos": ["**Simulador**: una micro:bit virtual para probar el programa.", "**Bloques**: ordenados por colores (Básico, Entrada, Música, LED…).", "**Zona de programación**: donde se arrastran y unen los bloques.", "**Descargar**: guarda el programa para cargarlo en la placa."]}]}], "ayudas": [{"tipo": "emociones", "titulo": "¿Cómo ha ido tu confianza en esta actividad?", "texto": "Al empezar algo nuevo podemos tener dudas sobre si seremos capaces. Completa en casa el **paso 2** del Diario en el cuaderno (¿Seré capaz de hacerlo?).", "puntos": ["Hay cosas que haces muy bien: úsalas.", "Hay cosas que te cuestan un poco: inténtalo y cree en ti.", "Hay cosas muy difíciles: fíjate en un ejemplo, pregunta a tu pareja o pide ayuda al profe."]}]}, {"id": "3.2", "titulo": "El cerebro de nuestro robot", "fase": "Estructurar", "sesiones": [3], "intro": "En este apartado vamos a aprender cómo es y cómo funciona **el cerebro de nuestra placa**. Mucha información será nueva para ti: si no entiendes algo, no te desanimes y pregunta. Puedes ir apuntando en tu cuaderno las ideas importantes. ¡Merecerá la pena!", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "¿Qué tienen en común estos aparatos?", "enunciado": "En pareja, piensa qué dispositivo tecnológico tienen en común: **un robot, una radio, un ratón, un microondas, un reloj, una aspiradora robot, un mando de videojuego y una impresora 3D**.", "agrupamiento": "Parejas", "criterios": ["CYR.1.1.2"], "ayudas": [{"tipo": "pista", "titulo": "¿Quieres saber qué tienen en común?", "texto": "Todos llevan un **microcontrolador** como «cerebro». Controla las funciones del aparato. Hoy casi todos los aparatos que nos rodean funcionan con uno… ¡y nuestra placa robótica también!"}]}, {"tipo": "actividad", "numero": "2", "titulo": "Identifica el microcontrolador", "enunciado": "Coge la placa robótica e intenta identificar cuál es el microcontrolador.", "agrupamiento": "Parejas", "criterios": ["CYR.1.1.1"], "ayudas": [{"tipo": "pista", "texto": "Es el **chip cuadrado** de la cara trasera de la micro:bit."}]}, {"tipo": "actividad", "numero": "3", "titulo": "Pero… ¿qué conoces sobre los microcontroladores?", "enunciado": "En gran grupo, debatid estas preguntas. Anotad las que más os interesen para responderlas con la lectura.", "agrupamiento": "Gran grupo", "criterios": ["CYR.1.1.2"], "pasos": ["¿Por qué son tan importantes en la sociedad actual?", "¿Cómo se fabrican? ¿De qué material están hechos?", "¿Qué ocurre en su interior? ¿Cómo le doy las órdenes?", "¿Qué tamaño tienen? ¿Cuánto cuestan?", "Nuestra placa es de código abierto: ¿sabes qué significa?"]}, {"tipo": "texto", "titulo": "4. Qué es un microcontrolador", "texto": "Un **microcontrolador** es el cerebro de la mayoría de los aparatos y robots que nos rodean. Es un **circuito integrado**, un chip de **silicio** con millones de circuitos, que contiene un **microprocesador** rodeado de **memoria** (para el programa y la RAM) y de circuitos de **entrada y salida** para comunicarse con otros componentes.\n\n**Cómo funciona.** Sus circuitos hacen operaciones a gran velocidad: cálculos, comparar datos, leer las entradas, activar las salidas… Las tareas se las escribimos con un **programa**. En MakeCode lo hacemos con bloques; al descargarlo se convierte en un archivo **binario** (.hex), hecho de unos y ceros, que es el lenguaje que entiende el chip, y lo cargamos en la placa.", "puntos": ["**Fáciles de programar** con lenguajes de alto nivel, parecidos al lenguaje humano.", "**Flexibles**: sirven para casi todo (radio, reloj, microondas, teclado…).", "**Pequeños**: caben desde en una tarjeta hasta en una nave espacial.", "**Baratos**: los más sencillos cuestan céntimos.", "**Rápidos**: hacen millones de operaciones por segundo."], "ayudas": [{"tipo": "saber_mas", "titulo": "La importancia de los microcontroladores", "texto": "Una de las principales razones de la evolución tecnológica de los últimos años es la capacidad de hacer los circuitos **cada vez más pequeños**: así son más rápidos, consumen menos y son más baratos. Hasta los años 70 los ordenadores ocupaban habitaciones enteras; en 1971 el **Intel 4004** metió un procesador completo en un solo chip, con unos 2 300 componentes. Hoy un chip puede tener miles de millones."}, {"tipo": "saber_mas", "titulo": "¿Microprocesador o microcontrolador?", "texto": "Los ordenadores y los móviles llevan un **microprocesador**, muy potente, que necesita otros elementos para funcionar (memorias, reloj…). El **microcontrolador** de nuestra placa es menos potente, pero lleva **todo lo necesario en un solo chip**. ¡Suficiente para lo que vamos a hacer!"}, {"tipo": "saber_mas", "titulo": "Nuestra placa es de código abierto", "texto": "La micro:bit es **hardware de código abierto** (open source): su diseño está publicado con una licencia que permite estudiarlo, reproducirlo y modificarlo. ¿Conoces otros proyectos abiertos, como las impresoras 3D RepRap? ¿Qué ventajas tiene que mucha gente pueda participar?"}]}, {"tipo": "actividad", "numero": "5", "titulo": "Te ayudo a planificar el siguiente ejercicio", "enunciado": "Para llegar a una meta conviene ser **buen o buena estratega**: tener «trucos» para llegar antes o de forma más fácil. Te enseño uno para hacer **esquemas**. Tómate el tiempo que necesites.", "agrupamiento": "Individual", "ayudas": [{"tipo": "pista", "titulo": "Truco para hacer un esquema", "puntos": ["En el centro, la **idea principal**.", "Una **rama** para cada pregunta o tema.", "En cada rama, solo **palabras clave**.", "Usa **flechas** para unir ideas relacionadas."]}]}, {"tipo": "actividad", "numero": "6", "titulo": "Completa el esquema", "enunciado": "En pareja, a partir de la lectura «4. Qué es un microcontrolador», completa el **esquema** de la plantilla **A3** y comenta con tu pareja las conclusiones.", "agrupamiento": "Parejas", "criterios": ["CYR.1.1.1", "CYR.1.1.2"], "entrega": "Tarea 3.2 · El cerebro y los sentidos del robot", "ayudas": [{"tipo": "emociones", "titulo": "¿Te has dado cuenta de todo lo que has hecho?", "texto": "Para completar el esquema has puesto en juego todo lo que sabes. A veces aprender exige esfuerzo, pero **lo más importante es lo que has aprendido**. ¡Sigue así!"}]}]}, {"id": "3.2.1", "titulo": "¿Qué has aprendido sobre los microcontroladores?", "fase": "Estructurar", "sesiones": [3, 4], "intro": "Ha llegado el momento de **comprobar lo que has aprendido**. Cada actividad tiene varias opciones: **elige la que prefieras** (A, B o C). Si terminas, ¡prueba otra! Antes de empezar, relájate: seguro que lo haces genial. Las respuestas de las opciones B y C van a la plantilla **A3**.", "bloques": [{"tipo": "multinivel", "numero": "1", "titulo": "¿Sabes qué aparatos llevan un microcontrolador?", "enunciado": "Comprueba que sabes qué aparatos llevan un microcontrolador.", "opciones": [{"letra": "A", "titulo": "Recuerda los nombres de estos aparatos", "proceso": "Recordar", "enunciado": "Marca los aparatos que usan un microcontrolador como «cerebro».", "test": {"opciones": ["Alicates", "Ratón de ordenador", "Microondas", "Destornillador", "Mando de videojuego"], "correctas": [1, 2, 4], "explicacion": "El **ratón**, el **microondas** y el **mando** llevan un microcontrolador que lee sus botones o sensores y controla lo que hacen. Los alicates y el destornillador son herramientas sin electrónica."}}, {"letra": "B", "titulo": "En tu vida cotidiana", "proceso": "Comprender", "enunciado": "Haz dos listas: aparatos que usas a diario que crees que tienen un microcontrolador como cerebro, y objetos que crees que no lo llevan."}, {"letra": "C", "titulo": "¿En un ratón?", "proceso": "Evaluar", "enunciado": "Con lo que has aprendido, justifica por qué crees que un ratón de ordenador lleva un microcontrolador."}], "agrupamiento": "Individual", "criterios": ["CYR.1.1.2"]}, {"tipo": "multinivel", "numero": "2", "titulo": "¿De qué están hechos los microcontroladores?", "enunciado": "Comprueba que sabes de qué material están hechos.", "opciones": [{"letra": "A", "titulo": "Recuerda de qué están hechos", "proceso": "Recordar", "enunciado": "¿De qué material están fabricados los microcontroladores?", "test": {"opciones": ["Cobre", "Plástico", "Silicio", "Madera"], "correcta": 2, "explicacion": "Se fabrican con **silicio**, un material **semiconductor**: según cómo se trate, conduce la corriente o la aísla."}}, {"letra": "B", "titulo": "¿Se podría usar plástico o madera?", "proceso": "Analizar", "enunciado": "¿Por qué crees que para fabricar un microcontrolador no se usa el plástico o la madera?"}], "agrupamiento": "Individual", "criterios": ["CYR.1.1.1"]}, {"tipo": "multinivel", "numero": "3", "titulo": "¿Cómo se programan los microcontroladores?", "enunciado": "Comprueba que sabes cómo se les dan las órdenes.", "opciones": [{"letra": "A", "titulo": "Ordena el proceso de programación", "proceso": "Recordar", "enunciado": "¿Cuál es el orden correcto?", "test": {"opciones": ["Se carga en el microcontrolador → se hace el programa → se convierte a binario", "Se hace el programa en el entorno de programación → se convierte a binario → se carga en el microcontrolador", "Se convierte a binario → se hace el programa → se carga en el microcontrolador"], "correcta": 1, "explicacion": "Primero se **programa** en el entorno (bloques), después se **convierte a binario** (.hex) y por último se **carga** en el microcontrolador."}}, {"letra": "B", "titulo": "De los bloques al binario", "proceso": "Comprender", "enunciado": "¿Por qué crees que hay que convertir a binario el programa hecho con bloques para cargarlo en el microcontrolador?"}], "agrupamiento": "Individual", "criterios": ["CYR.1.1.1"]}, {"tipo": "multinivel", "numero": "4", "titulo": "Ventajas de los microcontroladores", "enunciado": "Comprueba que conoces las ventajas que aportan.", "opciones": [{"letra": "A", "titulo": "Los motivos de su éxito", "proceso": "Recordar", "enunciado": "¿Por qué los microcontroladores están en tantos aparatos? Marca todas las razones correctas.", "test": {"opciones": ["Son baratos", "Son pequeños", "Pueden realizar muchas funciones", "Son rápidos", "Es fácil programarlos", "Necesitan un ordenador conectado para funcionar"], "correctas": [0, 1, 2, 3, 4], "explicacion": "Son **baratos, pequeños, flexibles, rápidos y fáciles de programar**. Una vez cargado el programa, funcionan solos, sin ordenador."}}, {"letra": "B", "titulo": "Elige los más importantes", "proceso": "Evaluar", "enunciado": "De todos los motivos, ¿cuáles crees que son los más importantes? Justifica tu respuesta."}], "agrupamiento": "Individual", "criterios": ["CYR.1.1.2"]}, {"tipo": "multinivel", "numero": "5", "titulo": "La importancia de los microcontroladores", "enunciado": "Comprueba que reconoces su importancia en la sociedad actual.", "opciones": [{"letra": "A", "titulo": "Recuerda su importancia", "proceso": "Recordar", "enunciado": "Verdadero o falso: muchos de los aparatos que usamos hoy funcionan con un microcontrolador o un microprocesador.", "test": {"opciones": ["Verdadero", "Falso"], "correcta": 0, "explicacion": "Verdadero: hoy **la mayoría de los aparatos** funcionan con un microcontrolador, o con un microprocesador si necesitan más potencia de cálculo."}}, {"letra": "B", "titulo": "Imagina la vida sin ellos", "proceso": "Evaluar", "enunciado": "Imagina que no se hubieran inventado los microprocesadores y microcontroladores. ¿Qué aparatos importantes para ti no existirían? ¿Cómo cambiaría nuestra vida?"}], "agrupamiento": "Individual", "criterios": ["CYR.1.1.2"]}, {"tipo": "multinivel", "numero": "6", "titulo": "¿Qué son las tecnologías open source?", "enunciado": "Actividad **optativa**. Antes, lee la ayuda «Nuestra placa es de código abierto» del apartado 3.2.", "opciones": [{"letra": "A", "titulo": "¿Recuerdas qué son las tecnologías abiertas?", "proceso": "Recordar", "enunciado": "Una tecnología es open source… (marca todas las correctas)", "test": {"opciones": ["Cuando podemos acceder a la información y saber cómo está hecha", "Cuando tenemos licencia para estudiarla, replicarla y modificarla", "Cuando es gratis"], "correctas": [0, 1], "explicacion": "El precio no tiene que ver: una tecnología es abierta si podemos **saber cómo está hecha** y tenemos **licencia** para replicarla y modificarla."}}, {"letra": "B", "titulo": "Cuáles son sus ventajas", "proceso": "Evaluar", "enunciado": "¿Qué ventajas tiene trabajar con una tecnología open source para quien la usa? ¿Y para la sociedad?"}], "agrupamiento": "Individual", "criterios": ["CYR.1.1.2"]}], "ayudas": [{"tipo": "emociones", "titulo": "¿Te has equivocado en algo?", "texto": "Cuando aprendemos algo, **lo normal es equivocarse al principio**: fallar forma parte de aprender. ¿Recuerdas cuando montaste en bici por primera vez?", "puntos": ["Me doy cuenta de en qué he fallado.", "Busco la forma de mejorar.", "Lo intento de nuevo.", "Entiendo que el error me ayuda a aprender."]}]}, {"id": "3.3", "titulo": "Entradas, procesamiento y salidas", "fase": "Estructurar", "sesiones": [4], "intro": "Ya conocemos los componentes de la placa y su cerebro. Nos queda ver **cómo se relaciona el microcontrolador con los demás componentes**: así entenderemos cómo los robots reciben estímulos del exterior, los procesan y dan una respuesta.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Recuerda: ¿cómo sienten los robots?", "enunciado": "En el apartado 2 imaginaste qué pasa cuando alguien te da un pellizco. Repásalo mentalmente: nos ayudará a entender lo que viene ahora.", "agrupamiento": "Individual"}, {"tipo": "texto", "titulo": "2. El esquema de funcionamiento de nuestra placa", "texto": "Los microcontroladores funcionan con un esquema de **entradas → procesamiento → salidas**.", "puntos": ["**Entradas**: son los **sensores** y dan información al microcontrolador. Por ejemplo: pulsadores, sensor de luz, de temperatura, acelerómetro.", "**Microcontrolador**: guarda el programa, lee la información de las entradas, la procesa y envía una orden a las salidas.", "**Salidas**: son los **actuadores** y responden con sonido, luz o movimiento. Por ejemplo: LED, zumbador, motores.", "Ejemplo: el microcontrolador lee un **pulsador** (entrada); si está pulsado, enciende un **LED** (salida); si no, lo apaga."]}, {"tipo": "video", "titulo": "Dispositivos de entrada y salida", "youtube": "https://www.youtube.com/watch?v=NkoS2JXaBuM", "preguntas": ["Di dos entradas de la micro:bit.", "Di dos salidas."]}, {"tipo": "actividad", "numero": "3", "titulo": "Explica el esquema", "enunciado": "En pareja, explica a tu compañero o compañera el esquema y después que te lo explique a ti. Escríbelo con tus palabras en **A3**.", "agrupamiento": "Parejas", "criterios": ["CYR.1.1.4"]}, {"tipo": "actividad", "numero": "4", "titulo": "Clasifica en entradas, procesamiento y salidas", "enunciado": "Con la placa delante, clasifica en la tabla de **A3** los componentes de la micro:bit en entrada, procesamiento, salida, conectividad o alimentación. Ojo: algún componente puede ser a la vez de entrada y de salida.", "agrupamiento": "Parejas", "criterios": ["CYR.1.1.1", "CYR.1.1.4"], "ayudas": [{"tipo": "pista", "titulo": "Solución para comprobar", "puntos": ["Pulsadores, logo táctil, sensor de luz, magnetómetro (brújula), acelerómetro y micrófono: **entrada**.", "Matriz de LED y altavoz: **salida**.", "Microprocesador: **procesamiento**.", "Antena de radio y Bluetooth: **entrada/salida** (conectividad).", "USB: **conectividad y alimentación**. Conector de baterías: **alimentación**."]}]}, {"tipo": "multinivel", "numero": "5", "titulo": "La función de los sensores y actuadores", "enunciado": "Comprueba que sabes cuál es la función de un sensor y de un actuador.", "opciones": [{"letra": "A", "titulo": "Recuerda la función", "proceso": "Recordar", "enunciado": "Un sensor es…", "test": {"opciones": ["una entrada", "una salida", "un procesador"], "correcta": 0, "explicacion": "Un **sensor** es una **entrada**; un **actuador** es una **salida**; el **microcontrolador** es el **procesador**."}}, {"letra": "B", "titulo": "Explicamos la función", "proceso": "Comprender", "enunciado": "Explica de forma resumida y con tus palabras cuál es la función de un sensor y de un actuador."}], "agrupamiento": "Individual", "criterios": ["CYR.1.1.4"]}, {"tipo": "multinivel", "numero": "6", "titulo": "Las entradas y las salidas", "enunciado": "Comprueba que sabes identificar la entrada y la salida de un sistema.", "opciones": [{"letra": "A", "titulo": "Identifica la entrada y la salida", "proceso": "Recordar", "enunciado": "En un sistema que enciende y apaga las luces de la calle automáticamente según la luz del sol, la entrada es…", "test": {"opciones": ["Las luces", "El sensor de luz", "El interruptor de la casa"], "correcta": 1, "explicacion": "El **sensor de luz** es la entrada y las **luces** son la salida."}}, {"letra": "B", "titulo": "En tu vida cotidiana", "proceso": "Comprender", "enunciado": "Piensa en varios ejemplos reales con una entrada, un procesador y una salida, e identifica cada parte. Por ejemplo, las luces que se encienden al anochecer."}], "agrupamiento": "Individual", "criterios": ["CYR.1.1.4"]}], "ayudas": [{"tipo": "repaso", "titulo": "Repasa lo aprendido", "texto": "Una buena estrategia para saber si avanzamos es hacernos preguntas. Párate un momento y responde:", "puntos": ["¿Entiendo el proceso entrada → procesador → salida? ¿Sabría explicarlo?", "¿Conozco la diferencia entre un sensor y un actuador?", "¿Sé poner ejemplos de componentes de entrada y de salida?", "¿Sé clasificar los componentes de la placa?", "¿Sé qué componentes permiten la conectividad y la alimentación de la placa?"]}]}, {"id": "4", "titulo": "El entorno de programación", "fase": "Aplicar y comprobar", "sesiones": [5], "intro": "Ya exploraste MakeCode en la sesión 2. Ahora lo vas a usar para **comunicarte con la placa**.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Exploramos los bloques de programación", "enunciado": "Haz un recorrido por los bloques de [makecode.microbit.org](https://makecode.microbit.org/).", "agrupamiento": "Parejas", "criterios": ["CYR.1.2.1"], "pasos": ["¿Qué categorías ves? Fíjate en que se diferencian por colores.", "Ve a **Básico**: ¿para qué sirven «mostrar icono» y «mostrar cadena»? Arrástralos a la zona de programación.", "Entra en **Bucles** y en **Lógica**: ¿qué bloques te resultan familiares de Scratch?", "Busca qué bloques se relacionan con las **entradas** de la placa y cuáles con las **salidas**. Por ejemplo, «al presionar el botón A» se relaciona con la entrada «pulsador A»."], "ayudas": [{"tipo": "emociones", "titulo": "¿Te has emocionado con esta actividad?", "texto": "Una actividad puede hacernos sentir confundidos, aliviadas, inseguros, alegres u orgullosas. Conocer tus emociones te ayuda a **pedir ayuda**, a **relajarte** y a pensar cómo resolverla. ¡Haz caso a tus emociones!"}]}]}, {"id": "4.1", "titulo": "¡Hola, Mundo!", "fase": "Aplicar y comprobar", "sesiones": [5], "intro": "Ha llegado el momento de **despertar a nuestro robot** y comprobar que sigue con vida después del accidente. En programación eso se llama **¡Hola, Mundo!** ¡Verás qué divertido es programar!", "bloques": [{"tipo": "texto", "titulo": "Qué es el ¡Hola, Mundo!", "puntos": ["Es el **primer programa** que se hace en cualquier lenguaje de programación.", "Se llama así porque escribe en la pantalla: ¡Hola, Mundo!", "Sirve para saber que el entorno funciona y para empezar a programar.", "En robótica comprueba además que el programa **se carga en el microcontrolador**: suele ser un LED que parpadea. ¡Con nuestra matriz de 25 LED podemos escribir lo que queramos!"]}, {"tipo": "actividad", "numero": "1", "titulo": "¡Hola, Mundo! en el simulador", "enunciado": "Haz tu primer programa: el robot dice «Hola» al iniciar y después muestra un **corazón que late**. Pruébalo en el simulador.", "agrupamiento": "Parejas", "criterios": ["CYR.1.2.1"], "pasos": ["Abre MakeCode y pulsa **Nuevo proyecto**.", "Localiza los bloques: todos están en el menú **Básico**.", "Programa: en «al iniciar», «mostrar cadena “Hola”»; en «para siempre», un corazón grande, una pausa de 500 ms, un corazón pequeño y otra pausa.", "Dale al ▶ del simulador y comprueba que funciona. Si no hace lo que querías, cámbialo y vuelve a probar."]}, {"tipo": "actividad", "numero": "2", "titulo": "¡Hola, Mundo! en la placa", "enunciado": "¿Qué te gustaría que dijera tu robot? Cambia el mensaje y **carga el programa en la placa**.", "agrupamiento": "Parejas", "criterios": ["CYR.1.2.1"], "pasos": ["Conecta la micro:bit al ordenador con el cable USB.", "Opción 1 (sincronización): **Conectar dispositivo** y después **Descargar**.", "Opción 2 (carga manual): pulsa **Descargar**, guarda el archivo **.hex** y arrástralo a la unidad **MICROBIT**.", "¿Saluda tu robot? ¡Está vivo!"], "ayudas": [{"tipo": "pista", "titulo": "¿No consigues cargar el programa?", "texto": "Mira el vídeo de cómo cargar el programa (tiene subtítulos en español). Comprueba también que el cable pasa datos y que se enciende el LED de la parte de atrás."}, {"tipo": "saber_mas", "titulo": "¿Tienes una tableta?", "texto": "La micro:bit también se puede programar desde una tableta con la aplicación **micro:bit**, conectándola por **Bluetooth**."}]}, {"tipo": "video", "titulo": "Cómo cargar el programa en la placa", "youtube": "https://www.youtube.com/watch?v=-FZ8yTnoozY"}, {"tipo": "actividad", "numero": "3", "titulo": "Diario de aprendizaje: paso 3", "enunciado": "¡Cuánto has aprendido hasta aquí! Reflexiona un momento y completa el **paso 3** de tu Diario, en el cuaderno (Reviso lo aprendido).", "agrupamiento": "Individual"}], "ayudas": [{"tipo": "emociones", "titulo": "¿Cómo se ha sentido tu pareja?", "texto": "Puede que tu pareja se haya sentido insegura o nerviosa al cargar el programa, o enfadada si no salía. En las próximas actividades:", "puntos": ["Piensa en cómo te sientes tú.", "Pregunta a tu pareja cómo se siente.", "Celebrad juntos cuando funcione."]}]}, {"id": "5", "titulo": "Nos ponemos manos a la obra", "fase": "Aplicar y comprobar", "sesiones": [5, 6, 7], "intro": "Hemos explorado la placa, conocemos su cerebro y su entorno de programación. **Ahora toca comprobar por fin el estado de nuestro robot.** Pon en práctica todo lo aprendido. ¡Confía en ti!", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Escribe tu ¡Hola, Mundo! interactivo", "enunciado": "De forma individual, escribe en la plantilla **A5**, en forma de guion, cómo quieres que se comunique tu robot al «despertar».", "agrupamiento": "Individual", "criterios": ["CYR.1.2.1"], "ayudas": [{"tipo": "pista", "titulo": "Un posible guion", "puntos": ["**Al empezar**: decir «Hola».", "**De forma continua**: corazón latiendo (corazón grande, esperar 0,5 s, corazón pequeño).", "**Al recibir estímulos**: reaccionar a botones, movimiento o sonido (lo verás en las actividades 3, 4 y 5)."]}]}, {"tipo": "actividad", "numero": "2", "titulo": "Crea tus propios iconos y animaciones", "enunciado": "Diseña en las cuadrículas 5 × 5 de **A5** tus propios iconos o los fotogramas de una animación para la pantalla del robot. Después dibújalos en MakeCode con el bloque «mostrar LEDs».", "agrupamiento": "Individual"}, {"tipo": "actividad", "numero": "3", "titulo": "Interactividad con pulsadores", "enunciado": "Hacemos que el robot reaccione a estímulos. Son ejercicios escalonados: cuando acabes uno, pasa al siguiente. ¡Avanza a tu ritmo!", "agrupamiento": "Parejas", "criterios": ["CYR.1.2.1"], "pasos": ["**3.1** Replica el ejemplo: «al presionar el botón A» → «mostrar cadena “A”». Cárgalo y compruébalo.", "**3.2** Añade más interactividad: botón B, los dos botones a la vez (A+B) y, en la V2, el logo táctil.", "**3.3** Piensa cómo incluirás los pulsadores en tu ¡Hola, Mundo! y anótalo en A5."], "ayudas": [{"tipo": "pista", "titulo": "¿Cómo lo incorporo?", "texto": "Por ejemplo: al pulsar A, el robot guiña un ojo; al pulsar B, muestra una carita sonriente. Así compruebas que **cada botón funciona**."}]}, {"tipo": "actividad", "numero": "3.4", "titulo": "¡Esto se ha bugueao!", "enunciado": "El programa que proyecta el docente tiene **bugs** (errores) y no funciona bien. Arréglalo para que escriba **A** al pulsar el botón A, **B** al pulsar el B y **A+B** al pulsar los dos.", "agrupamiento": "Parejas", "criterios": ["CYR.1.2.1"], "ayudas": [{"tipo": "repaso", "titulo": "Para encontrar un error", "puntos": ["Prueba cada botón por separado.", "Compara lo que pasa con lo que debería pasar.", "Cambia una sola cosa cada vez y vuelve a probar."]}]}, {"tipo": "actividad", "numero": "4", "titulo": "Interactividad agitando", "enunciado": "Con el bloque «al agitar» (menú Entrada), haz que el robot muestre un icono o un mensaje cuando se agita la placa. Después **personaliza el mensaje** para que tenga sentido en tu programa de arranque.", "agrupamiento": "Parejas", "criterios": ["CYR.1.2.1", "CYR.1.3.1"]}, {"tipo": "actividad", "numero": "5", "titulo": "Interactividad con sonido (solo micro:bit V2)", "enunciado": "Con «al detectar sonido fuerte», haz que el robot escriba un mensaje al dar una palmada. Si tu placa es una V1, pruébalo en el simulador. ¿Cómo lo incorporarías a tu programa?", "agrupamiento": "Parejas", "criterios": ["CYR.1.2.1", "CYR.1.3.1"], "ayudas": [{"tipo": "saber_mas", "titulo": "Revisa el código en Python", "texto": "Pulsa la pestaña **Python** de MakeCode: verás el mismo programa escrito con texto. Python es uno de los lenguajes más usados, por ejemplo en inteligencia artificial. ¿Te atreves a cambiar un mensaje desde ahí?"}]}, {"tipo": "narrador", "texto": "Ya sabes hacer el ¡Hola, Mundo!, reaccionar a los pulsadores, al movimiento y al sonido. Ahora **integra todo en un solo programa**: ¡ha llegado el momento de cumplir el reto!"}, {"tipo": "actividad", "numero": "6", "titulo": "Realizamos el programa de chequeo de nuestro robot", "enunciado": "Haz tu ¡Hola, Mundo! interactivo: el robot despierta y, con la ayuda de una persona, **comprueba que sus circuitos funcionan**. Programar es un proceso cíclico: elige un objetivo, codifícalo, pruébalo y pasa al siguiente.", "agrupamiento": "Parejas", "criterios": ["CYR.1.2.1", "CYR.1.3.1"], "entrega": "Tarea 3.3 · Programa de chequeo del robot", "pasos": ["**6.1** Escribe en A5 la **lista de instrucciones** (el algoritmo) del programa de chequeo.", "**6.2** Dibuja en A5 su **diagrama de flujo**.", "**6.3** Programa el chequeo, cárgalo en la placa y anota cada prueba en la **tabla de pruebas** de A5."], "ayudas": [{"tipo": "pista", "titulo": "El proceso de programación", "puntos": ["**Elegir un objetivo**: analiza el problema y elige el primer objetivo.", "**Codificar**: escribe el código para conseguirlo.", "**Probar**: si funciona, pasa al siguiente; si no, corrige los errores.", "**Siguiente objetivo**: añade nuevas funciones al programa."]}, {"tipo": "pista", "titulo": "Símbolos del diagrama de flujo", "puntos": ["**Óvalo**: inicio y fin.", "**Rectángulo**: una acción (mostrar, esperar…).", "**Rombo**: una pregunta (¿se ha pulsado A?).", "**Flechas**: el orden."]}, {"tipo": "saber_mas", "titulo": "¿Has terminado?", "texto": "Añade un sensor más al chequeo: **temperatura**, **nivel de luz** o **brújula** (menú Entrada)."}]}], "ayudas": [{"tipo": "repaso", "titulo": "¿Cómo te ha ido?", "texto": "Esta ha sido la parte más importante: hemos dado vida al robot. Responde estas preguntas o házselas a tu pareja como en una entrevista:", "puntos": ["¿Has escrito y personalizado tu ¡Hola, Mundo!? ¿Has creado tus iconos?", "¿Sabrías explicar el funcionamiento del programa?", "¿Tu robot reacciona a los botones, al movimiento y al sonido?", "¿Has arreglado el programa que se había bugueado?", "¿Te ha resultado difícil el diagrama de flujo?", "¿Qué harás la próxima vez para mejorar en lo que te ha costado más?"]}]}, {"id": "6", "titulo": "Presentamos nuestro trabajo", "fase": "Concluir", "sesiones": [8, 9], "intro": "Es hora de enseñar a la clase **lo que hemos sido capaces de hacer**. Al compartir ayudamos a que los demás aprendan, y al explicar nuestro proyecto lo entendemos mejor. ¡Compartiendo ganamos todos! Esa es la filosofía del **código abierto**.", "bloques": [{"tipo": "actividad", "numero": "1", "titulo": "Feria de proyectos", "enunciado": "La clase se divide en dos turnos: una mitad explica su proyecto desde la mesa y la otra circula por las mesas; después se cambian. Prepara tu presentación de **2 minutos** con el guion de cuatro partes (funcionamiento, esquema, cómo lo habéis hecho y programa).", "agrupamiento": "Parejas", "criterios": ["CYR.1.2.1", "CYR.1.3.1"], "entrega": "Tarea 3.3 · Programa de chequeo del robot", "pasos": ["Muestra el **funcionamiento** del proyecto.", "Enseña el **esquema de entradas y salidas**.", "Cuenta **cómo lo has hecho**: el proceso que has seguido.", "Explica el **programa**."], "ayudas": [{"tipo": "pista", "titulo": "Consejos para presentar", "puntos": ["Haz un borrador y repártelo con tu pareja.", "Ensaya con el cronómetro.", "Habla mirando al público y enseña la placa funcionando.", "Prepara la respuesta a una pregunta que te puedan hacer."]}]}, {"tipo": "actividad", "numero": "2", "titulo": "Si la feria no es para ti: otras formas de presentarlo", "enunciado": "Con el visto bueno de tu profesor o profesora, puedes presentar el proyecto de otra forma.", "agrupamiento": "Parejas", "optativa": true, "pasos": ["**Vídeo**: graba el robot funcionando y explica cómo está programado, qué dificultades tuviste y cómo las resolviste.", "**Diapositivas**: presenta el desarrollo y el funcionamiento del proyecto.", "**Memoria**: un documento con la finalidad, el esquema de entradas y salidas, una imagen del código, el enlace al vídeo y una evaluación (qué funciona, qué problemas hubo y qué mejo   if (A.autoria || A.cambios) h += `<div class="card"><h3>Adaptación</h3>${A.autoria ? `<p><b>${esc(A.autoria)}</b>${A.fecha ? ' · ' + esc(A.fecha) : ''}</p>` : ''}${A.cambios ? paras(A.cambios) : ''}</div>`;
  if (L.nombre) h += `<div class="card"><h3>Licencia</h3><p>${L.url ? `<a href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.nombre)}</a>` : esc(L.nombre)}</p>${L.nota ? paras(L.nota) : ''}${o.cita ? `<p class="note">${esc(o.cita)}</p>` : ''}</div>`;
  if (arr(C.recursos).length) h += `<div class="card"><h3>Recursos de terceros</h3><div class="scroll"><table class="tbl"><thead><tr><th>Recurso</th><th>Autoría</th><th>Licencia</th></tr></thead><tbody>${C.recursos.map(r=>`<tr><td>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.elemento)}</a>` : esc(r.elemento)}</td><td>${esc(r.autoria)}</td><td>${esc(r.licencia)}</td></tr>`).join('')}</tbody></table></div></div>`;
  return h;
}
const PAGES = [{k:'inicio', t:'Inicio', r:inicio}].concat(APS.map(a => ({k:pageKey(a), t:`${a.id}. ${a.titulo}`, a, r:() => apartado(a)})))
  .concat(D.creditos ? [{k:'creditos', t:'Créditos', r:creditos}] : []);

function toc(cur){
  let h = '', fz = null;
  PAGES.forEach(p => {
    if (p.a && p.a.fase !== fz) { fz = p.a.fase; h += `<div class="fz" style="--fc:${fcol(fz)}">${esc(fz || '')}</div>`; }
    if (!p.a && p.k === 'creditos') h += '<div class="fz">&nbsp;</div>';
    const depth = p.a ? String(p.a.id).split('.').length - 1 : 0;
    h += `<a href="#${p.k}" class="${p.k === cur ? 'on' : ''} ${depth === 1 ? 'sub' : depth > 1 ? 'sub2' : ''}" style="--fc:${p.a ? fcol(p.a.fase) : 'var(--brand)'}">${esc(p.t)}</a>`;
  });
  $('#toc').innerHTML = h;
}
function show(k){
  const i = Math.max(0, PAGES.findIndex(p => p.k === k)), p = PAGES[i], pv = PAGES[i-1], nx = PAGES[i+1];
  $('#app').innerHTML = `<div class="page">${p.r()}</div><div class="pager">${pv ? `<a href="#${pv.k}"><small>← Anterior</small>${esc(pv.t)}</a>` : ''}${nx ? `<a class="r" href="#${nx.k}"><small>Siguiente →</small>${esc(nx.t)}</a>` : ''}</div>`;
  $('#ttl').textContent = p.k === 'inicio' ? (D.meta.titulo || '') : p.t;
  toc(p.k); document.body.classList.remove('menu'); window.scrollTo(0, 0); setHash('#' + p.k);
}
function printAll(){ $('#app').innerHTML = PAGES.map(p => `<div class="page">${p.r()}</div>`).join(''); document.querySelectorAll('details').forEach(d => d.open = true); window.print(); }

// --------------------------------------------------- eventos
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a) { const k = a.getAttribute('href').slice(1); if (PAGES.some(p => p.k === k)) { e.preventDefault(); try { history.pushState(null, '', '#' + k); } catch(_) {} show(k); } return; }
  const t = e.target.closest('[data-ml]');
  if (t) { const key = t.dataset.ml, j = +t.dataset.j; store[key + '-o'] = j; save();
    document.querySelectorAll(`[data-ml="${key}"]`).forEach(x => x.setAttribute('aria-selected', +x.dataset.j === j));
    document.querySelectorAll(`[data-mlo="${key}"]`).forEach(x => x.classList.toggle('on', +x.dataset.j === j)); return; }
  const c = e.target.closest('[data-check]');
  if (c) { const q = c.closest('.quiz'), ok = q.dataset.ok.split(',').map(Number), fb = q.querySelector('.fb');
    const marked = [...q.querySelectorAll('input')].filter(x => x.checked).map(x => +x.value);
    q.querySelectorAll('label').forEach((l, j) => { l.classList.remove('ok','ko'); if (ok.includes(j)) l.classList.add('ok'); else if (marked.includes(j)) l.classList.add('ko'); });
    const bien = marked.length === ok.length && marked.every(x => ok.includes(x));
    fb.className = 'fb on ' + (bien ? 'ok' : 'ko');
    fb.innerHTML = (bien ? '<b>¡Muy bien!</b> ' : '<b>Revísalo:</b> las respuestas correctas están en verde. ') + md(fb.dataset.expl || ''); return; }
  const v = e.target.closest('.vid .play');
  if (v) { const box = v.closest('.vid'); box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${box.dataset.yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe>`; }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.done; if (k) { store[k] = e.target.checked; save(); } });
$('#b-menu').onclick = () => document.body.classList.toggle('menu');
$('#b-print').onclick = printAll;
$('#b-theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('guia-theme', r.dataset.theme); } catch(e) {} };
try { const t = localStorage.getItem('guia-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
if (D.url_clase) $('#b-clase').href = D.url_clase; else $('#b-clase').style.display = 'none';
// Atrás / adelante del navegador y enlaces directos (#a-3.1, #creditos)
addEventListener('hashchange', () => { let k = ''; try { k = location.hash.slice(1); } catch(e) {} if (PAGES.some(p => p.k === k)) show(k); });
addEventListener('popstate', () => { let k = ''; try { k = location.hash.slice(1); } catch(e) {} show(PAGES.some(p => p.k === k) ? k : 'inicio'); });
let h0 = ''; try { h0 = location.hash.slice(1); } catch(e) {}
show(PAGES.some(p => p.k === h0) ? h0 : 'inicio');
</script>
</body>
