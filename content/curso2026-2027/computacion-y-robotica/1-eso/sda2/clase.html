<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clase · SdA 2: Código en Acción: Videojuegos e Historias Interactivas Sostenibles</title>
<style>
:root{

  --brand:#0f766e; --brand-soft:#ccfbf1; --accent:#7c3aed; --accent-soft:#ede9fe;
  --ok:#15803d; --ok-bg:#dcfce7; --ko:#b91c1c; --ko-bg:#fee2e2; --warm:#c2410c; --warm-bg:#fff7ed;
  --code-bg:#0f172a; --code-ink:#e2e8f0; --slide:#ffffff; --f-ini:#2563eb; --f-des:#0f766e; --f-cie:#9333ea;

  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#111a2e; --ink:#e5e9f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#23304a;
    --brand:#2dd4bf; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
    --ok:#4ade80; --ok-bg:#14532d; --ko:#f87171; --ko-bg:#450a0a; --warm:#fdba74; --warm-bg:#2a1608;
    --code-bg:#020617; --code-ink:#e2e8f0; --slide:#111a2e; --f-ini:#60a5fa; --f-des:#2dd4bf; --f-cie:#c084fc;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2e; --ink:#e5e9f0; --ink2:#cbd5e1; --muted:#94a3b8; --line:#23304a;
  --brand:#2dd4bf; --brand-soft:#134e4a; --accent:#a78bfa; --accent-soft:#2e1065;
  --ok:#4ade80; --ok-bg:#14532d; --ko:#f87171; --ko-bg:#450a0a; --warm:#fdba74; --warm-bg:#2a1608;
  --code-bg:#020617; --code-ink:#e2e8f0; --slide:#111a2e; --f-ini:#60a5fa; --f-des:#2dd4bf; --f-cie:#c084fc;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
@media(max-width:760px){.top{overflow-x:auto}.top .ttl{display:none}.top .tb{flex:0 0 auto}select.tb{max-width:60vw}}
.top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.top .ttl small{font-weight:500;color:var(--muted);margin-left:8px}
.tb{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.tb:hover{border-color:var(--brand);color:var(--brand)}
.tb[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
select.tb{max-width:42vw}
/* ---------- índice */
.home{max-width:1180px;margin:0 auto;padding:28px 16px 48px}
.hero{background:linear-gradient(135deg,#134e4a,#1e3a8a);color:#fff;border-radius:18px;padding:28px 24px}
.hero h1{margin:6px 0;font-size:clamp(26px,4vw,40px);line-height:1.1}
.hero p{margin:6px 0;opacity:.92;font-size:18px}
.hero .k{font-size:13px;opacity:.8;letter-spacing:.04em;text-transform:uppercase}
.help{margin:14px 0 0;font-size:14px;opacity:.85}
.kbd{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:0 6px;font-size:12px;margin:0 2px}
.cards{display:grid;gap:14px;margin-top:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sc{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);border-top:6px solid var(--fc,var(--brand))}
.sc:hover{border-color:var(--fc,var(--brand));transform:translateY(-1px)}
.sc .n{font-size:13px;font-weight:700;color:var(--fc,var(--brand));text-transform:uppercase;letter-spacing:.04em}
.sc h3{margin:6px 0;font-size:18px;line-height:1.25}
.sc p{margin:0;color:var(--ink2);font-size:14px}
.sc .c{margin-top:10px;font-size:13px;color:var(--muted)}
/* ---------- modo proyección */
.stage{position:relative;height:calc(100vh - 57px);display:flex;align-items:center;justify-content:center;padding:12px}
.fs .stage{height:100vh;padding:0}
.fs .top{display:none}
.slide{position:relative;width:min(100%, calc((100vh - 81px) * 16 / 9));aspect-ratio:16/9;background:var(--slide);border-radius:14px;box-shadow:0 10px 40px rgba(15,23,42,.18);overflow:hidden;
  font-size:min(2.05vw, 3.6vh);container-type:inline-size}
.fs .slide{width:min(100vw, calc(100vh * 16 / 9));border-radius:0;box-shadow:none}
@supports (font-size:1cqw){ .slide{font-size:2.05cqw} }
.slide .in{position:absolute;inset:0;padding:3.2em 3.6em 3em;display:flex;flex-direction:column;overflow:auto}
.slide .bar{position:absolute;left:0;right:0;bottom:0;height:.35em;background:var(--line)}
.slide .bar i{display:block;height:100%;background:var(--fc,var(--brand))}
.slide .pg{position:absolute;right:1.4em;bottom:.9em;font-size:.62em;color:var(--muted)}
.slide .tag{position:absolute;left:5.8em;top:2.1em;font-size:.62em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fc,var(--brand))}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(15,23,42,.08);color:var(--ink2);font-size:24px;opacity:.4}
.nav:hover{opacity:1}.nav.l{left:4px}.nav.r{right:4px}
.fs .nav{display:none}
.notes{position:fixed;left:16px;right:16px;bottom:16px;z-index:9;background:var(--warm-bg);border:1px solid var(--warm);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:15px;max-height:30vh;overflow:auto;display:none}
.notes.on{display:block}
.notes b{color:var(--warm)}
/* ---------- modo estudio */
.study{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.study .slide{width:100%;aspect-ratio:auto;font-size:18px;margin:0 0 16px;box-shadow:none;border:1px solid var(--line);container-type:normal}
@media(max-width:640px){.study .slide{font-size:16px}}
.study .slide .in{position:static;padding:2.4em 1.4em 1.4em;overflow:visible}
.study .slide .bar,.study .slide .pg{display:none}
.study .slide .tag{left:2.3em;top:1.6em}
.study h2.sh{margin:28px 0 12px;font-size:22px}
/* ---------- piezas de diapositiva */
.s-h{margin:0 0 .5em;font-size:1.75em;line-height:1.15;font-weight:800}
.s-lead{font-size:1.1em;color:var(--ink2);margin:0 0 .7em}
.ico{font-size:2.4em;line-height:1;margin-bottom:.2em}
ul.pts{margin:.2em 0;padding-left:1.1em}ul.pts li{margin:.35em 0}
.cover{justify-content:center;background:linear-gradient(135deg,var(--fc,var(--brand)),#1e3a8a);color:#fff}
.cover .s-h{font-size:2.6em}.cover .s-lead{color:rgba(255,255,255,.9)}
.cover .q{margin-top:1em;font-size:1.25em;font-weight:700;background:rgba(255,255,255,.14);border-radius:.5em;padding:.6em .8em}
.cover .tag{color:rgba(255,255,255,.85)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2em;align-items:start}
@media(max-width:640px){.study .two{grid-template-columns:1fr}}
.box{background:var(--bg);border-radius:.6em;padding:.8em 1em}
.box.hl{background:var(--brand-soft)}
.box.ac{background:var(--accent-soft)}
.box.wa{background:var(--warm-bg)}
.box .lb{font-size:.62em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.3em}
.ask{margin-top:auto;padding-top:.7em;font-size:1.1em;font-weight:700;color:var(--accent)}
ol.steps{list-style:none;margin:.3em 0;padding:0;counter-reset:st;display:grid;gap:.45em}
ol.steps li{counter-increment:st;display:flex;gap:.7em;align-items:flex-start;background:var(--bg);border-radius:.5em;padding:.45em .7em}
ol.steps li::before{content:counter(st);flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;background:var(--fc,var(--brand));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85em}
ol.steps li.hid{visibility:hidden}
.cols{display:grid;gap:1em;grid-template-columns:repeat(var(--n,2),1fr)}
@media(max-width:640px){.study .cols{grid-template-columns:1fr}}
.col{border:2px solid var(--line);border-radius:.6em;padding:.7em .9em}
.col h4{margin:0 0 .3em;font-size:1.1em;color:var(--fc,var(--brand))}
.grid-i{display:grid;gap:.7em;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
@media (max-width:700px){.grid-i{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gi{background:var(--bg);border-radius:.6em;padding:.7em;text-align:center}
.gi .e{font-size:1.8em}.gi>b{display:block;margin:.2em 0}.gi>span{display:block;font-size:.85em;line-height:1.35;color:var(--ink2)}.gi>span b{color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5em;margin:.6em 0}
.fn{padding:.55em .9em;border-radius:.5em;background:var(--brand-soft);border:2px solid var(--brand);font-weight:600;text-align:center;max-width:12em}
.fn.inicio,.fn.fin{border-radius:2em;background:var(--accent-soft);border-color:var(--accent)}
.fn.decision{background:var(--warm-bg);border-color:var(--warm);transform:skew(-8deg)}
.fn.decision>span{display:inline-block;transform:skew(8deg)}
.arr{font-size:1.3em;color:var(--muted)}
.svgw{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.svgw svg{max-width:100%;max-height:100%;height:auto}
pre.code{margin:.3em 0;background:var(--code-bg);color:var(--code-ink);border-radius:.6em;padding:.8em 1em;font:0.82em/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;white-space:pre}
.big{font-size:4.2em;font-weight:900;line-height:1;color:var(--fc,var(--brand))}
.src{font-size:.6em;color:var(--muted);margin-top:.6em}
.opts{display:grid;gap:.5em;margin:.4em 0}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:.5em;padding:.5em .8em;font-size:1em}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.expl{display:none;margin-top:.4em}.expl.on{display:block}
.chip{display:inline-block;border-radius:2em;padding:.15em .7em;font-size:.7em;font-weight:700;background:var(--warm-bg);color:var(--warm);border:1px solid var(--warm);margin-right:.4em}
.timer{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--fc,var(--brand));color:var(--fc,var(--brand));background:transparent;border-radius:2em;padding:.2em .8em;font-weight:800;font-size:.9em}
.timer.end{background:var(--ko);border-color:var(--ko);color:#fff}
.vid{position:relative;flex:1;min-height:6em;border-radius:.6em;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .play{border:0;background:#dc2626;color:#fff;border-radius:.6em;padding:.6em 1.2em;font-size:1em;font-weight:800}
.study .vid{aspect-ratio:16/9;flex:none}
.reveal{border:1px dashed var(--muted);background:transparent;color:var(--muted);border-radius:.4em;padding:.2em .7em;font-size:.7em;margin-top:.4em}
.empty{max-width:700px;margin:60px auto;text-align:center;color:var(--muted)}
@media print{.top,.nav,.notes{display:none}.study .slide{break-inside:avoid}}
</style>
</head>

n videojuego es una aplicación: el sistema operativo hace de intermediario con el hardware."}, {"tipo": "quiz", "pregunta": "¿Cuál de estos es hardware?", "opciones": ["Minecraft", "Android", "El disco duro", "Scratch"], "correcta": 2, "explicacion": "El **disco duro** se puede tocar: es hardware. Minecraft y Scratch son aplicaciones y Android es un sistema operativo: software."}, {"tipo": "practica", "titulo": "Encuesta inicial", "tiempo": 6, "enunciado": "Responde la encuesta **anónima** (Formulario F1): no hay respuestas buenas ni malas.", "agrupamiento": "Individual", "enlace": "https://forms.gle/ghXZ2FWzpa2m8TA77"}, {"tipo": "cierre", "puntos": ["El ordenador **solo hace lo que se le dice**.", "Un algoritmo: pasos **ordenados, precisos y con final**.", "Hardware se toca; software son instrucciones."], "siguiente": "Las 4 técnicas del pensamiento computacional.", "pregunta": "Di una orden ambigua que le darías a un robot y cómo la harías precisa."}]}, {"n": 2, "fase": "Inicio", "titulo": "Pensamiento computacional y la rutina «Pienso - Programo - Pruebo»", "reto": "Aplicar descomposición, patrones, abstracción y algoritmos a problemas cotidianos y a retos de lógica.", "pregunta": "¿Cómo organizarías una fiesta de cumpleaños sin olvidar nada?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎂", "titulo": "Organizar un cumpleaños", "situacion": "Hay que pensar en comida, invitaciones, música y juegos… ¡y parece **imposible**!", "explicacion": "Si lo **divides en partes**, buscas lo que se repite y te olvidas de lo que no importa, se convierte en una lista de pasos. Eso es **pensamiento computacional**."}, {"tipo": "infografia", "titulo": "Las 4 técnicas", "elementos": [{"icono": "🧩", "titulo": "Descomposición", "texto": "Dividir el problema en **partes pequeñas**."}, {"icono": "🔁", "titulo": "Patrones", "texto": "Encontrar lo que **se repite**."}, {"icono": "🔍", "titulo": "Abstracción", "texto": "Quedarse con **lo esencial**."}, {"icono": "📝", "titulo": "Algoritmo", "texto": "Escribir los **pasos en orden**."}]}, {"tipo": "flujo", "titulo": "Nuestra rutina en cada práctica", "nodos": [{"texto": "🧠 Pienso: descompongo y escribo los pasos", "tipo": "inicio"}, {"texto": "🧱 Programo: ordeno los bloques", "tipo": "proceso"}, {"texto": "▶️ Pruebo: ¿funciona?", "tipo": "decision"}, {"texto": "🔧 Si falla, corrijo y vuelvo a probar", "tipo": "fin"}]}, {"tipo": "quiz", "pregunta": "Para dibujar 10 casas iguales en un juego, te das cuenta de que todas tienen tejado, puerta y 2 ventanas. ¿Qué técnica usas?", "opciones": ["Descomposición", "Reconocimiento de patrones", "Abstracción"], "correcta": 1, "explicacion": "Has encontrado lo que **se repite**: es un patrón. Así dibujas una casa y la repites."}, {"tipo": "practica", "titulo": "Pienso como un ordenador", "tiempo": 20, "enunciado": "Completa la ficha del **anexo A1**: las 4 técnicas con tu ejemplo y los dos retos de lógica.", "pasos": ["Tabla de las 4 técnicas con un ejemplo de tu vida.", "Reto 1: el robot repartidor (secuencia de flechas).", "Reto 2: el patrón de las pulseras."], "agrupamiento": "Parejas (cada estudiante entrega su ficha)", "entrega": "Tarea 2.1 · Ficha de pensamiento computacional", "enlace": "https://docs.google.com/document/d/1fAIRb6mQU7MWUx8HRkLiZSJefOhrDBuX6ph9GLIRwW4/edit?usp=drive_link"}, {"tipo": "cierre", "puntos": ["Divide, busca patrones, quédate con lo esencial y ordena los pasos.", "En cada práctica: **Pienso - Programo - Pruebo**."], "siguiente": "Algoritmos y pseudocódigo: hablar como un programa.", "pregunta": "¿Qué técnica te ha costado más y por qué?"}]}, {"n": 3, "fase": "Inicio", "titulo": "Algoritmos, pseudocódigo y programa", "reto": "Escribir algoritmos precisos en pseudocódigo y entender cómo se convierten en un programa que ejecuta el ordenador.", "pregunta": "¿En qué idioma hablamos con un ordenador?", "diapositivas": [{"tipo": "ejemplo", "icono": "🪥", "titulo": "Lavarse los dientes… mal explicado", "situacion": "«Echa pasta **un rato**. Cepilla **hasta que esté bien**. Enjuaga.»", "explicacion": "Un robot no sabe cuánto es «un rato» ni cuándo está «bien». Un algoritmo necesita pasos **precisos** y un **final** claro."}, {"tipo": "comparar", "titulo": "Las 3 propiedades de un algoritmo", "columnas": [{"titulo": "Preciso", "icono": "🎯", "puntos": ["Sin dudas: «2 cucharadas», no «un poco»."]}, {"titulo": "Finito", "icono": "🏁", "puntos": ["Siempre **termina**."]}, {"titulo": "Ordenado", "icono": "🪜", "puntos": ["Pasos **sencillos** uno detrás de otro."]}]}, {"tipo": "codigo", "titulo": "Un mismo algoritmo, tres idiomas", "codigo": "PSEUDOCÓDIGO (para personas)\n  repetir 4 veces:\n     mover 100 pasos y girar 90°\n\nSCRATCH (programa)\n  repetir (4)\n     mover (100) pasos\n     girar ↻ (90) grados\n\nPROCESADOR (código máquina)\n  10110000 01100100 ...", "explicacion": ["El **pseudocódigo** nos ayuda a pensar antes de programar.", "El **programa** traduce el algoritmo a un lenguaje del ordenador.", "La **CPU** solo entiende ceros y unos."], "pregunta": "¿Por qué es más fácil encontrar errores en el pseudocódigo?"}, {"tipo": "codigo", "titulo": "Ejemplo resuelto: ¿funciona el cargador?", "codigo": "Inicio\n  Enchufar el cargador a la pared\n  Conectar el cable al móvil\n  Esperar 5 segundos\n  si aparece el rayo de carga entonces\n      decir \"El cargador funciona\"\n  si no\n      probar con otro enchufe\nFin", "nota": "«si… entonces… si no» es una decisión."}, {"tipo": "practica", "titulo": "Escribimos pseudocódigo", "tiempo": 22, "enunciado": "Completa la ficha del **anexo A2**.", "pasos": ["Corrige el algoritmo de los dientes.", "Pseudocódigo: cambiar una bombilla.", "Pseudocódigo: comprar un bocadillo en la cantina.", "Pseudocódigo con «si»: comprobar un cargador."], "agrupamiento": "Individual", "enlace": "https://docs.google.com/document/d/1ouT8MgvVfkHHXD9LWZ1UGG4gd9otpac1Lqb0BUi9QEE/edit?usp=drive_link", "entrega": "Tarea 2.2 · Algoritmos y pseudocódigo"}, {"tipo": "practica", "titulo": "Lo probamos en voz alta", "tiempo": 5, "enunciado": "Lee tu pseudocódigo y un compañero/a lo ejecuta **al pie de la letra**. ¿Ha salido bien?"}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 3, "enunciado": "Haz una **foto o escaneo** de tu ficha, guárdala en **PDF** y súbela a Moodle.", "agrupamiento": "Individual", "entrega": "Tarea 2.2 · Algoritmos y pseudocódigo"}, {"tipo": "cierre", "puntos": ["Pseudocódigo: el algoritmo en palabras sencillas.", "Programa: el algoritmo en un lenguaje del ordenador.", "La CPU ejecuta el programa."], "siguiente": "Dibujamos algoritmos: los diagramas de flujo.", "pregunta": "¿Qué diferencia hay entre pseudocódigo y programa?"}]}, {"n": 4, "fase": "Inicio", "titulo": "Diagramas de flujo: el algoritmo dibujado", "reto": "Representar algoritmos con los símbolos de los diagramas de flujo y diseñar uno para clasificar residuos.", "pregunta": "¿Cómo sabe la app del reciclaje a qué contenedor va tu botella?", "diapositivas": [{"tipo": "ejemplo", "icono": "♻️", "titulo": "¿Amarillo, azul o verde?", "situacion": "En casa dudas: «¿el brik va al amarillo o al azul?». Te haces **preguntas** hasta decidir.", "explicacion": "Cada pregunta con respuesta **sí o no** es una decisión. Dibujadas con flechas forman un **diagrama de flujo**."}, {"tipo": "infografia", "titulo": "Los símbolos", "svg": "<svg viewBox=\"0 0 640 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Símbolos de los diagramas de flujo: óvalo inicio o fin, rectángulo proceso, paralelogramo entrada o salida, rombo decisión y flecha\">\n<ellipse cx=\"70\" cy=\"70\" rx=\"58\" ry=\"30\" style=\"fill:var(--ok);fill-opacity:.18;stroke:var(--ok);stroke-width:3\"/>\n<text x=\"70\" y=\"76\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">Inicio / Fin<\/text>\n<rect x=\"160\" y=\"40\" width=\"120\" height=\"60\" rx=\"4\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:3\"/>\n<text x=\"220\" y=\"76\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">Proceso<\/text>\n<path d=\"M330 40 L450 40 L425 100 L305 100 Z\" style=\"fill:var(--accent-soft);stroke:var(--accent);stroke-width:3\"/>\n<text x=\"378\" y=\"68\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 15px system-ui\">Entrada /<\/text>\n<text x=\"378\" y=\"88\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 15px system-ui\">Salida<\/text>\n<path d=\"M545 25 L605 70 L545 115 L485 70 Z\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:3\"/>\n<text x=\"545\" y=\"76\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">¿Decisión?<\/text>\n<text x=\"70\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">Empieza y acaba<\/text>\n<text x=\"220\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">Una acción<\/text>\n<text x=\"378\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">Pide o muestra datos<\/text>\n<text x=\"545\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">Sí / No<\/text>\n<path d=\"M200 195 L420 195\" style=\"stroke:var(--ink);stroke-width:4;fill:none\"/><path d=\"M410 184 L432 195 L410 206 Z\" style=\"fill:var(--ink)\"/>\n<text x=\"320\" y=\"228\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">Flecha: indica el camino a seguir<\/text>\n<\/svg>"}, {"tipo": "flujo", "titulo": "Ejemplo resuelto: la lámpara no funciona", "nodos": [{"texto": "Inicio", "tipo": "inicio"}, {"texto": "¿Está enchufada?", "tipo": "decision"}, {"texto": "No → enchufarla · Sí → ¿bombilla fundida?", "tipo": "decision"}, {"texto": "Sí → cambiar la bombilla · No → llamar al técnico", "tipo": "proceso"}, {"texto": "Fin", "tipo": "fin"}]}, {"tipo": "quiz", "pregunta": "En el diagrama de la licencia, «Introducir la edad» va en un…", "opciones": ["Rombo", "Paralelogramo", "Óvalo"], "correcta": 1, "explicacion": "Pedir o mostrar datos es **entrada/salida**: paralelogramo. El rombo es para la pregunta «¿edad ≥ 16?»."}, {"tipo": "practica", "titulo": "Diagrama de los residuos", "tiempo": 20, "enunciado": "Dibujad el diagrama que decide el contenedor de un residuo (**anexo A3**).", "pasos": ["Plástico, lata o brik → amarillo.", "Papel o cartón → azul.", "Vidrio → verde · Orgánico → marrón.", "Si no es nada de eso → gris."], "agrupamiento": "Parejas", "enlace": "https://docs.google.com/document/d/1STFcn6wCav2-d0umR6nipYamy0BcvF1Wr2hV0bTSYGk/edit?usp=drive_link"}, {"tipo": "practica", "titulo": "Lo ejecuta otra pareja", "tiempo": 10, "enunciado": "Probad el diagrama de otra pareja con: **botella de agua, periódico, tarro de mermelada, piel de plátano y bolígrafo**. Anotad si acierta."}, {"tipo": "cierre", "puntos": ["Óvalo, rectángulo, paralelogramo, rombo y flechas.", "Un rombo siempre tiene dos salidas: **sí y no**.", "Probar con otra persona ayuda a encontrar errores."], "siguiente": "¡Por fin Scratch! Cuenta segura y primer personaje.", "pregunta": "¿Qué residuo ha confundido más a los diagramas?"}]}, {"n": 5, "fase": "Inicio", "titulo": "Primeros pasos en Scratch: cuenta segura, escenario y movimiento", "reto": "Entrar en Scratch con una cuenta segura, conocer la interfaz y mover un personaje con las flechas.", "pregunta": "¿Qué datos tuyos NO deberían aparecer nunca en un proyecto publicado?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔐", "titulo": "La contraseña del Wi-Fi de casa", "situacion": "Si la pegas en la nevera, **cualquier visita** puede usar tu internet.", "explicacion": "Con tu cuenta pasa igual: contraseña **segura y secreta**, y un usuario que **no diga quién eres**."}, {"tipo": "comparar", "titulo": "Cuenta segura en Scratch", "columnas": [{"titulo": "Sí", "icono": "✅", "puntos": ["Usuario de clase sin tu nombre.", "Contraseña tipo **«gato-nube-tren-27»**.", "Apuntada en la agenda."]}, {"titulo": "No", "icono": "⛔", "puntos": ["Tu nombre, edad o instituto.", "Fotos de personas.", "Compartir la contraseña."]}]}, {"tipo": "infografia", "titulo": "El escenario: 480 × 360", "svg": "<svg viewBox=\"0 0 640 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Escenario de Scratch de 480 por 360 con el centro en 0,0; x va de -240 a 240 e y de -180 a 180\">\n<rect x=\"160\" y=\"20\" width=\"320\" height=\"220\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:3\"/>\n<path d=\"M160 130 L480 130 M320 20 L320 240\" style=\"stroke:var(--ink);stroke-width:2;stroke-dasharray:6 6\"/>\n<circle cx=\"320\" cy=\"130\" r=\"6\" style=\"fill:var(--warm)\"/>\n<text x=\"330\" y=\"150\" style=\"fill:var(--ink);font:700 16px system-ui\">(0, 0)<\/text>\n<text x=\"150\" y=\"135\" text-anchor=\"end\" style=\"fill:var(--ink);font:700 16px system-ui\">x = −240<\/text>\n<text x=\"490\" y=\"135\" style=\"fill:var(--ink);font:700 16px system-ui\">x = 240<\/text>\n<text x=\"320\" y=\"14\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">y = 180<\/text>\n<text x=\"320\" y=\"258\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">y = −180<\/text>\n<circle cx=\"420\" cy=\"70\" r=\"6\" style=\"fill:var(--accent)\"/>\n<text x=\"430\" y=\"66\" style=\"fill:var(--accent);font:700 15px system-ui\">(150, 90)<\/text>\n<\/svg>", "nota": "Que muevan el ratón y lean x e y abajo a la derecha."}, {"tipo": "codigo", "titulo": "Mover con las flechas", "codigo": "al hacer clic en 🏁\n    ir a x: (0) y: (0)\n\nal presionar tecla [flecha derecha]\n    sumar (10) a x\nal presionar tecla [flecha izquierda]\n    sumar (-10) a x\nal presionar tecla [flecha arriba]\n    sumar (10) a y\nal presionar tecla [flecha abajo]\n    sumar (-10) a y", "explicacion": ["Cada **evento** (pulsar una tecla) pone en marcha su programa.", "x cambia en horizontal; y, en vertical."], "pregunta": "¿Qué número pondrías para que vaya el doble de rápido?"}, {"tipo": "pasos", "titulo": "Entrar y prepararse", "pasos": ["Entra en scratch.mit.edu con tu usuario de clase.", "Cambia la contraseña y apúntala.", "Idioma: Español (icono del globo).", "Tutoriales: «Para empezar» y «Usar las teclas de flechas»."], "progresivo": true}, {"tipo": "practica", "titulo": "Mi personaje con flechas", "tiempo": 15, "enunciado": "Programa el personaje para moverse con las **4 flechas** y volver al centro con la **bandera verde**. Elige un fondo.", "pasos": ["Pienso: ¿qué tecla cambia x y cuál y?", "Programo los 4 eventos.", "Pruebo: ¿llega a las 4 esquinas?"]}, {"tipo": "practica", "titulo": "Guardar, compartir y entregar", "tiempo": 5, "enunciado": "Guarda como **«Práctica 1»**, pulsa **Compartir**, añádelo al estudio de la clase y pega el enlace en Moodle.", "entrega": "Tarea 2.3 · Mi cuenta y mi primer proyecto"}, {"tipo": "cierre", "puntos": ["Cuenta segura: usuario sin datos y contraseña secreta.", "Escenario: centro (0, 0), x horizontal, y vertical.", "Evento: «al presionar tecla» pone en marcha un programa."], "siguiente": "El gato dibuja un cuadrado y la bailarina choca.", "pregunta": "¿Qué coordenadas tiene la esquina de arriba a la derecha?"}]}, {"n": 6, "fase": "Desarrollo", "titulo": "Primeros proyectos: el gato en coordenadas y la bailarina", "reto": "Programar un recorrido exacto con coordenadas y una bailarina que reacciona al chocar.", "pregunta": "¿Cómo le dices a un personaje exactamente a dónde ir?", "diapositivas": [{"tipo": "ejemplo", "icono": "🗺️", "titulo": "Quedar en el mapa del móvil", "situacion": "Para quedar con alguien le mandas tu **ubicación**: un punto exacto.", "explicacion": "En Scratch, cada punto del escenario tiene su ubicación: **(x, y)**. Con coordenadas el personaje va justo donde quieres."}, {"tipo": "comparar", "titulo": "¿Ir o deslizar?", "columnas": [{"titulo": "ir a x: y:", "icono": "⚡", "puntos": ["Aparece **de golpe** en el punto."]}, {"titulo": "deslizar en 1 s a x: y:", "icono": "🛝", "puntos": ["Se **ve el camino** hasta el punto."]}]}, {"tipo": "codigo", "titulo": "Pienso: el cuadrado en pseudocódigo", "codigo": "Colocar el gato en (0, 0)\nApuntar hacia arriba\nDeslizar a (0, 100)\nApuntar a la izquierda\nDeslizar a (-100, 100)\nApuntar hacia abajo\nDeslizar a (-100, 0)\nApuntar a la derecha\nDeslizar a (0, 0)", "explicacion": ["Fondo **Xy-grid** para ver las coordenadas."], "pregunta": "¿Cómo harías un rectángulo el doble de ancho?"}, {"tipo": "practica", "titulo": "Problema del gato en coordenadas", "tiempo": 17, "enunciado": "Programa que el gato recorra un **cuadrado** y vuelva al punto de partida. Guarda como «Práctica 2».", "pasos": ["Pienso: pseudocódigo en el cuaderno.", "Programo: «apuntar en dirección» y «deslizar».", "Pruebo: ¿vuelve exactamente a (0, 0)?"]}, {"tipo": "codigo", "titulo": "Ejemplo resuelto: la bailarina", "codigo": "BAILARINA\nal presionar tecla [espacio]\n    apuntar hacia [puntero del ratón]\n    mover (20) pasos\n    si ¿tocando [borde]? entonces\n        siguiente disfraz\n        decir [¡Cuidado!] durante (1) segundos\n    si ¿tocando [Princesa]? entonces\n        siguiente disfraz\n        decir [¡Hola, princesa!] durante (2) segundos\n\nPRINCESA\nal hacer clic en 🏁\n    fijar tamaño al (50) %", "nota": "Cada programa va en su objeto: ¡cuidado al copiarlo! «¿tocando…?» es un sensor."}, {"tipo": "practica", "titulo": "La bailarina", "tiempo": 20, "enunciado": "Programa la bailarina y la princesa. Guarda como «Práctica 3».", "pasos": ["Se mueve hacia el ratón al pulsar espacio.", "Borde → cambia disfraz y avisa.", "Princesa → cambia disfraz y saluda.", "Extra: añade un tercer personaje con otra reacción."]}, {"tipo": "practica", "titulo": "Evidencias en el cuaderno", "tiempo": 5, "enunciado": "En tu cuaderno de prácticas (**anexo A4**): enlace, pseudocódigo y capturas de las prácticas 2 y 3. Exporta a PDF.", "entrega": "Tarea 2.4 · El gato en coordenadas y la bailarina", "enlace": "https://docs.google.com/document/d/1Bsju9D2ObOFgzrFKqAVxVq9jry2PMESmcCR9lqNSkh0/edit?usp=drive_link"}, {"tipo": "cierre", "puntos": ["Coordenadas: posición exacta (x, y).", "Primero pseudocódigo, luego bloques.", "Sensor «¿tocando…?» + «si» = el personaje reacciona."], "siguiente": "Bucles: repetir sin cansarse.", "pregunta": "¿Cuántas veces has repetido «apuntar + deslizar»? ¿Se podría hacer más corto?"}]}, {"n": 7, "fase": "Desarrollo", "titulo": "Bucles I: animaciones y dibujos con el lápiz", "reto": "Usar «por siempre» y «repetir» para animar un personaje y dibujar figuras sin repetir bloques.", "pregunta": "Si tuvieras que escribir «mover y girar» 100 veces, ¿qué harías?", "diapositivas": [{"tipo": "ejemplo", "icono": "🏃", "titulo": "Dar 4 vueltas a la pista", "situacion": "El profe de Educación Física no dice «corre, corre, corre, corre». Dice «**da 4 vueltas**».", "explicacion": "Eso es un **bucle**: repetir un bloque de acciones un número de veces (o para siempre)."}, {"tipo": "comparar", "titulo": "Dos bucles", "columnas": [{"titulo": "repetir (n)", "icono": "🔢", "puntos": ["Repite **n veces** y sigue.", "El cuadrado: repetir 4."]}, {"titulo": "por siempre", "icono": "♾️", "puntos": ["Repite **sin parar**.", "Animaciones y juegos."]}]}, {"tipo": "codigo", "titulo": "Animación: el murciélago vuela", "codigo": "al hacer clic en 🏁\n    por siempre\n        siguiente disfraz\n        mover (10) pasos\n        rebotar si toca un borde\n        esperar (0.2) segundos", "explicacion": ["El cambio de disfraz rápido crea la **ilusión de movimiento**."], "pregunta": "¿Qué pasa si quitas el «esperar»?"}, {"tipo": "practica", "titulo": "Animación con por siempre", "tiempo": 12, "enunciado": "Anima un personaje que **vuele o camine** y rebote en los bordes. Guarda como «Práctica 4»."}, {"tipo": "codigo", "titulo": "El cuadrado: sin bucle y con bucle", "codigo": "SIN BUCLE                 CON BUCLE\nborrar todo               borrar todo\nbajar lápiz               bajar lápiz\nmover (100) pasos         repetir (4)\ngirar ↻ (90) grados           mover (100) pasos\nmover (100) pasos             girar ↻ (90) grados\ngirar ↻ (90) grados       subir lápiz\nmover (100) pasos\ngirar ↻ (90) grados\nmover (100) pasos\ngirar ↻ (90) grados\nsubir lápiz", "nota": "Extensión Lápiz: botón azul de abajo a la izquierda. Borrar → bajar lápiz → dibujar → subir lápiz."}, {"tipo": "practica", "titulo": "Cuadrado y triángulo", "tiempo": 27, "enunciado": "Dibuja el cuadrado de las **dos formas** y después un **triángulo** con «repetir 3». Guarda como «Práctica 5».", "pasos": ["Cuadrado sin bucle y con bucle.", "Triángulo: ¿cuántos grados gira?", "Extra: sonido en cada esquina (extensión Música).", "Extra: cambia de disfraz en cada esquina."]}, {"tipo": "quiz", "pregunta": "Para dibujar un triángulo equilátero, en cada esquina el lápiz gira…", "opciones": ["60°", "90°", "120°"], "correcta": 2, "explicacion": "El lápiz da una vuelta completa (360°) en 3 giros: 360 ÷ 3 = **120°**."}, {"tipo": "cierre", "puntos": ["Bucle: repetir sin copiar bloques.", "«repetir (n)» para figuras; «por siempre» para animar.", "Giro de un polígono = 360 ÷ lados."], "siguiente": "Lluvia de residuos y el polígono de cualquier número de lados.", "pregunta": "¿Cuánto giraría el lápiz para un hexágono?"}]}, {"n": 8, "fase": "Desarrollo", "titulo": "Bucles II: lluvia de residuos y polígonos", "reto": "Hacer que caigan objetos sin parar desde posiciones aleatorias y generalizar el dibujo a un polígono de n lados.", "pregunta": "¿Cómo dibujarías con un solo programa un triángulo, un cuadrado o un decágono?", "diapositivas": [{"tipo": "ejemplo", "icono": "🍔", "titulo": "Lluvia de albóndigas", "situacion": "En la película, la máquina de Flint hace caer **comida del cielo** sin parar.", "explicacion": "Un objeto que cae y vuelve arriba es un **bucle por siempre**. Lo haremos con **residuos** que hay que recoger."}, {"tipo": "codigo", "titulo": "Ejemplo resuelto: el residuo que cae", "codigo": "al hacer clic en 🏁\n    fijar tamaño al (50) %\n    ir a x: (número aleatorio entre -220 y 220) y: (170)\n    por siempre\n        sumar (-5) a y\n        si (posición en y) < (-170) entonces\n            ir a x: (número aleatorio entre -220 y 220) y: (170)", "pregunta": "¿Cómo harías que cayera más rápido?", "nota": "«número aleatorio» hace que cada vez caiga en un sitio distinto."}, {"tipo": "practica", "titulo": "Lluvia de residuos", "tiempo": 15, "enunciado": "Programa un residuo que cae sin parar. Guarda como «Práctica 6».", "pasos": ["Elige una botella o una lata (tamaño 50 %).", "Cae con «por siempre».", "Vuelve arriba en otra x aleatoria.", "Extra: 5 residuos, velocidades distintas, salen cada 3 s."]}, {"tipo": "codigo", "titulo": "Pienso: el polígono", "codigo": "borrar todo\nir a x: (0) y: (0)\npreguntar [¿Cuántos lados?] y esperar\nbajar lápiz\nrepetir (respuesta)\n    mover (60 - respuesta) pasos\n    girar ↻ (360 / respuesta) grados\nsubir lápiz", "nota": "ángulo = 360 / lados pasos = 60 − lados, para que quepa en el escenario. Un solo programa para cualquier polígono: eso es generalizar."}, {"tipo": "practica", "titulo": "Programo el polígono", "tiempo": 17, "enunciado": "Programa el polígono de n lados. Guarda como «Práctica 7».", "pasos": ["Prueba con 3, 4, 6 y 10 lados.", "Extra: si lados > 12 o < 3 → «No puedo dibujar ese polígono»."]}, {"tipo": "quiz", "pregunta": "Si el usuario escribe 8, ¿cuántos grados gira el lápiz en cada esquina?", "opciones": ["8°", "45°", "90°"], "correcta": 1, "explicacion": "360 ÷ 8 = **45°**."}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 10, "enunciado": "Cuaderno de prácticas con las prácticas **4, 5, 6 y 7**: enlaces, pseudocódigo y capturas. Exporta a PDF.", "entrega": "Tarea 2.5 · Bucles: dibujos, polígonos y lluvia de residuos"}, {"tipo": "cierre", "puntos": ["«por siempre» + aleatorio = objetos que no paran de caer.", "Un programa general sirve para muchos casos.", "Un «si» puede impedir datos imposibles."], "siguiente": "Condicionales: el juego de los componentes del ordenador.", "pregunta": "¿Qué pasa si alguien escribe 0 lados? ¿Por qué?"}]}, {"n": 9, "fase": "Desarrollo", "titulo": "Condicionales y sensores: ¿reconoces el hardware?", "reto": "Usar «si… entonces» y sensores de contacto para crear un juego que explica los componentes del ordenador.", "pregunta": "¿Qué pasa dentro del ordenador cuando abres un juego?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔋", "titulo": "«Batería baja»", "situacion": "Cuando el móvil baja del 20 %, te avisa **solo**.", "explicacion": "Dentro hay una decisión: **si batería < 20 entonces avisar**. En los juegos, los condicionales deciden qué pasa cuando chocas o recoges algo."}, {"tipo": "codigo", "titulo": "El bloque «si… entonces… si no»", "codigo": "si ¿tocando [Placa base]? entonces\n    decir [...] durante (3) segundos\n    iniciar sonido [Win]\nsi no\n    (no hace nada)", "nota": "El sensor pregunta; el condicional decide. Va dentro de un «por siempre» para comprobar todo el rato."}, {"tipo": "infografia", "titulo": "Dentro del ordenador", "svg": "<svg viewBox=\"0 0 640 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Componentes del ordenador conectados a la placa base: CPU, memoria RAM, disco duro, tarjeta de sonido y tarjeta wifi\">\n<rect x=\"150\" y=\"60\" width=\"340\" height=\"150\" rx=\"12\" style=\"fill:var(--ok);fill-opacity:.15;stroke:var(--ok);stroke-width:3\"/>\n<text x=\"320\" y=\"200\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">Placa base: conecta todo<\/text>\n<rect x=\"175\" y=\"80\" width=\"110\" height=\"60\" rx=\"8\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:3\"/>\n<text x=\"230\" y=\"108\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">CPU<\/text>\n<text x=\"230\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px system-ui\">ejecuta<\/text>\n<rect x=\"300\" y=\"80\" width=\"80\" height=\"60\" rx=\"8\" style=\"fill:var(--accent-soft);stroke:var(--accent);stroke-width:3\"/>\n<text x=\"340\" y=\"108\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">RAM<\/text>\n<text x=\"340\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px system-ui\">trabaja<\/text>\n<rect x=\"395\" y=\"80\" width=\"80\" height=\"60\" rx=\"8\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:3\"/>\n<text x=\"435\" y=\"108\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 15px system-ui\">Disco<\/text>\n<text x=\"435\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px system-ui\">guarda<\/text>\n<rect x=\"10\" y=\"90\" width=\"120\" height=\"50\" rx=\"8\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n<text x=\"70\" y=\"120\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 14px system-ui\">🔊 T. de sonido<\/text>\n<rect x=\"510\" y=\"90\" width=\"120\" height=\"50\" rx=\"8\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n<text x=\"570\" y=\"120\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 14px system-ui\">📶 T. wifi<\/text>\n<path d=\"M130 115 L150 115 M490 115 L510 115\" style=\"stroke:var(--ink);stroke-width:3\"/>\n<text x=\"320\" y=\"35\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 17px system-ui\">Hardware: lo que se puede tocar<\/text>\n<\/svg>"}, {"tipo": "infografia", "titulo": "¿Qué dice cada componente?", "elementos": [{"icono": "🟩", "titulo": "Placa base", "texto": "Circuito al que se **conectan** todos los componentes."}, {"icono": "💽", "titulo": "Disco duro", "texto": "**Guarda** los datos aunque apagues."}, {"icono": "🔊", "titulo": "Tarjeta de sonido", "texto": "Permite la **salida de audio**."}, {"icono": "📶", "titulo": "Tarjeta wifi", "texto": "Envía y recibe datos **sin cables**."}]}, {"tipo": "codigo", "titulo": "Pienso: pseudocódigo del juego", "codigo": "Al hacer clic en la bandera\n  Colocar el personaje en (-200, -140)\n  Decir \"¿Reconoces estos componentes?\" 3 segundos\n  Decir \"Usa las flechas para moverte\" 2 segundos\n  Por siempre\n    Si toca Placa base entonces decir ...\n    Si toca Disco duro entonces decir ...\n    ...\n\nCada componente: si toca al personaje → sonido y esconder", "nota": "Mira el ejemplo resuelto del cuaderno de Scratch. Ajusta el tamaño de las imágenes."}, {"tipo": "practica", "titulo": "Juego «¿Reconoces el hardware?»", "tiempo": 25, "enunciado": "Crea el juego con **4 componentes**. Guarda como «Práctica 8».", "pasos": ["Fondo e imágenes de los componentes (tamaño adecuado).", "Personaje con flechas.", "Al tocar: explica, suena y el componente se esconde.", "Extra: CPU y memoria RAM."]}, {"tipo": "quiz", "pregunta": "¿Qué componente guarda tus fotos aunque apagues el ordenador?", "opciones": ["La memoria RAM", "El disco duro", "La tarjeta wifi"], "correcta": 1, "explicacion": "El **disco duro** guarda los datos de forma permanente; la RAM se borra al apagar."}, {"tipo": "cierre", "puntos": ["Sensor + condicional = el juego reacciona.", "Hardware: placa base, CPU, RAM, disco, tarjetas.", "Programa = software que la CPU ejecuta."], "siguiente": "Las seis puertas de internet.", "pregunta": "¿Por qué el «si» va dentro de un «por siempre»?"}]}, {"n": 10, "fase": "Desarrollo", "titulo": "Las seis puertas de internet", "reto": "Investigar los servicios de internet y programar un juego en el que cada puerta abre la explicación de un servicio.", "pregunta": "Cuando escribes scratch.mit.edu, ¿de dónde sale la página?", "diapositivas": [{"tipo": "ejemplo", "icono": "🍕", "titulo": "Pedir una pizza a domicilio", "situacion": "Haces el **pedido**, la pizzería lo prepara y un repartidor te lo **trae**.", "explicacion": "Con una web igual: tu navegador **pide** la página, el **servidor** la tiene guardada y te la envía por **internet**."}, {"tipo": "infografia", "titulo": "Navegador, servidor e internet", "svg": "<svg viewBox=\"0 0 640 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"El navegador pide una página web al servidor a través de internet y el servidor la devuelve\">\n<rect x=\"20\" y=\"60\" width=\"150\" height=\"90\" rx=\"12\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:3\"/>\n<text x=\"95\" y=\"100\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 17px system-ui\">💻 Tu navegador<\/text>\n<text x=\"95\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">(cliente)<\/text>\n<rect x=\"470\" y=\"60\" width=\"150\" height=\"90\" rx=\"12\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:3\"/>\n<text x=\"545\" y=\"100\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 17px system-ui\">🗄️ Servidor web<\/text>\n<text x=\"545\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink);font:14px system-ui\">guarda las páginas<\/text>\n<path d=\"M180 85 L455 85\" style=\"stroke:var(--accent);stroke-width:4;fill:none\"/><path d=\"M445 75 L463 85 L445 95 Z\" style=\"fill:var(--accent)\"/>\n<path d=\"M460 130 L185 130\" style=\"stroke:var(--ok);stroke-width:4;fill:none\"/><path d=\"M195 120 L177 130 L195 140 Z\" style=\"fill:var(--ok)\"/>\n<text x=\"320\" y=\"75\" text-anchor=\"middle\" style=\"fill:var(--accent);font:700 16px system-ui\">1. «Dame scratch.mit.edu»<\/text>\n<text x=\"320\" y=\"158\" text-anchor=\"middle\" style=\"fill:var(--ok);font:700 16px system-ui\">2. Aquí tienes la página<\/text>\n<text x=\"320\" y=\"192\" text-anchor=\"middle\" style=\"fill:var(--ink);font:700 16px system-ui\">🌐 Internet: la red que los une<\/text>\n<\/svg>"}, {"tipo": "infografia", "titulo": "Seis servicios de internet", "elementos": [{"icono": "🌐", "titulo": "WWW", "texto": "Páginas web enlazadas."}, {"icono": "✉️", "titulo": "Correo", "texto": "Mensajes entre buzones."}, {"icono": "👥", "titulo": "Web social", "texto": "Redes para compartir."}, {"icono": "💬", "titulo": "Grupos de noticias", "texto": "Foros por temas."}, {"icono": "📺", "titulo": "Streaming", "texto": "Vídeo y música al momento."}, {"icono": "🛒", "titulo": "Comercio electrónico", "texto": "Comprar y vender en línea."}], "nota": "Son pistas: cada pareja escribe su propia definición con un ejemplo."}, {"tipo": "practica", "titulo": "Investigamos los servicios", "tiempo": 10, "enunciado": "Escribid en el cuaderno **una frase y un ejemplo** de cada servicio.", "agrupamiento": "Parejas"}, {"tipo": "codigo", "titulo": "Ejemplo resuelto: una puerta", "codigo": "PERSONAJE\nal hacer clic en 🏁\n    cambiar fondo a [Puertas]\n    ir a x: (0) y: (-140)\n    por siempre\n        si ¿tocando el color [🟥]? entonces\n            cambiar fondo a [WWW]\n            esconder\n            esperar (3) segundos\n            cambiar fondo a [Puertas]\n            ir a x: (0) y: (-140)\n            mostrar", "pregunta": "¿Por qué vuelve a (0, -140) antes de mostrarse?", "nota": "Elige el color con el cuentagotas. Haz una puerta, pruébala y copia el patrón para las demás."}, {"tipo": "practica", "titulo": "Programamos las puertas", "tiempo": 22, "enunciado": "Crea el juego de las **seis puertas**. Guarda como «Práctica 9».", "pasos": ["Fondo con 6 puertas de colores distintos.", "Un fondo blanco con texto para cada servicio.", "Personaje con flechas.", "Tocar puerta → fondo del servicio → vuelve."]}, {"tipo": "practica", "titulo": "Entrega", "tiempo": 8, "enunciado": "Cuaderno con las prácticas **8 y 9** y las definiciones. Exporta a PDF.", "entrega": "Tarea 2.6 · Hardware e internet en Scratch"}, {"tipo": "cierre", "puntos": ["Navegador pide → servidor envía → internet transporta.", "Seis servicios: WWW, correo, social, foros, streaming, comercio.", "Un patrón de código se copia y adapta."], "siguiente": "¿De quién es esta canción? Licencias y recursos libres.", "pregunta": "¿Qué servicio de internet usas más y de qué tipo es?"}]}, {"n": 11, "fase": "Desarrollo", "titulo": "¿De quién es esta canción? Licencias y recursos libres", "reto": "Distinguir copyright, Creative Commons y dominio público, usar recursos libres en Scratch y citarlos correctamente.", "pregunta": "Si encuentras una canción en // **negrita** dentro de los textos
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const FC = {'Inicio':'var(--f-ini)','Desarrollo':'var(--f-des)','Cierre':'var(--f-cie)'};
// Admite nombres de fase compuestos («Bloque 1 · Inicio»)
const fcol = f => FC[f] || FC[Object.keys(FC).find(k => String(f || '').includes(k))] || 'var(--brand)';
const st = { s: null, i: 0, mode: 'proy', notes: false, revealed: {} };
const SES = D.sesiones;

function ytId(v){
  const m = String(v||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/) || String(v||'').match(/^([\w-]{11})$/);
  return m ? m[1] : null;
}
// En vistas previas protegidas (iframe sandbox, about:srcdoc) el navegador bloquea replaceState: se ignora.
function setHash(h){ try { history.replaceState(null, '', h); } catch(e){} }
function fmtT(s){ s = Math.max(0, s|0); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

// --------------------------------------------------- renderizado de cada tipo
const R = {
  portada(d, s){
    return `<div class="in cover"><div class="tag">Sesión ${s.n} · ${esc(s.fase||'')}</div>
      <h1 class="s-h">${md(s.titulo)}</h1>${s.reto ? `<p class="s-lead">${md(s.reto)}</p>` : ''}
      ${d.pregunta ? `<div class="q">${md(d.pregunta)}</div>` : ''}</div>`;
  },
  idea(d){
    return `<div class="in">${d.icono ? `<div class="ico">${esc(d.icono)}</div>` : ''}<h2 class="s-h">${md(d.titulo)}</h2>
      ${d.texto ? `<p class="s-lead">${md(d.texto)}</p>` : ''}${arr(d.puntos).length ? `<ul class="pts">${arr(d.puntos).map(p=>`<li>${md(p)}</li>`).join('')}</ul>` : ''}
      ${d.pregunta ? `<div class="ask">❓ ${md(d.pregunta)}</div>` : ''}</div>`;
  },
  ejemplo(d){
    return `<div class="in"><h2 class="s-h">${d.icono ? esc(d.icono)+' ' : ''}${md(d.titulo)}</h2>
      <div class="two"><div class="box wa"><div class="lb">En tu día a día</div>${md(d.situacion)}</div>
      <div class="box hl"><div class="lb">¿Qué hay detrás?</div>${md(d.explicacion)}</div></div>
      ${d.pregunta ? `<div class="ask">❓ ${md(d.pregunta)}</div>` : ''}</div>`;
  },
  pasos(d, s, k){
    const key = s.n+'-'+k, prog = d.progresivo, shown = st.revealed[key] ?? (prog ? 1 : 1e9);
    const ps = arr(d.pasos);
    return `<div class="in"><h2 class="s-h">${md(d.titulo)}</h2>${d.texto ? `<p class="s-lead">${md(d.texto)}</p>` : ''}
      <ol class="steps">${ps.map((p,j)=>`<li class="${st.mode==='proy' && j>=shown ? 'hid':''}"><span>${md(p)}</span></li>`).join('')}</ol>
      ${prog && st.mode==='proy' && shown < ps.length ? `<button class="reveal" data-rev="${key}" data-max="${ps.length}">Siguiente paso (↓)</button>` : ''}</div>`;
  },
  comparar(d){
    const c = arr(d.columnas);
    return `<div class="in"><h2 class="s-h">${md(d.titulo)}</h2>${d.texto ? `<p class="s-lead">${md(d.texto)}</p>` : ''}
      <div class="cols" style="--n:${c.length}">${c.map(x=>`<div class="col"><h4>${esc(x.icono||'')} ${md(x.titulo)}</h4><ul class="pts">${arr(x.puntos).map(p=>`<li>${md(p)}</li>`).join('')}</ul></div>`).join('')}</div>
      ${d.pregunta ? `<div class="ask">❓ ${md(d.pregunta)}</div>` : ''}</div>`;
  },
  flujo(d){
    const n = arr(d.nodos);
    return `<div class="in"><h2 class="s-h">${md(d.titulo)}</h2>${d.texto ? `<p class="s-lead">${md(d.texto)}</p>` : ''}
      <div class="flow">${n.map((x,j)=>`${j?'<span class="arr">→</span>':''}<div class="fn ${esc(x.tipo||'proceso')}"><span>${md(x.texto ?? x)}</span></div>`).join('')}</div>
      ${d.pregunta ? `<div class="ask">❓ ${md(d.pregunta)}</div>` : ''}</div>`;
  },
  infografia(d){
    const body = d.svg ? `<div class="svgw">${d.svg}</div>`
      : `<div class="grid-i" style="--cols:${Math.min(arr(d.elementos).length, arr(d.elementos).length === 4 ? 4 : 3) || 1}">${arr(d.elementos).map(e=>`<div class="gi"><div class="e">${esc(e.icono||'')}</div><b>${md(e.titulo)}</b><span>${md(e.texto)}</span></div>`).join('')}</div>`;
    return `<div class="in"><h2 class="s-h">${md(d.titulo)}</h2>${d.texto ? `<p class="s-lead">${md(d.texto)}</p>` : ''}${body}
      ${d.pregunta ? `<div class="ask">❓ ${md(d.pregunta)}</div>` : ''}</div>`;
  },
  codigo(d){
    return `<div class="in"><h2 class="s-h">${md(d.titulo)}</h2><div class="two" style="grid-template-columns:${d.explicacion?'1.2fr 1fr':'1fr'}">
      <pre class="code">${esc(d.codigo)}</pre>${d.explicacion ? `<div class="box hl"><div class="lb">Qué hace</div>${arr(d.explicacion).map(x=>`<p style="margin:.2em 0">${md(x)}</p>`).join('')}</div>` : ''}</div>
      ${d.pregunta ? `<div class="ask">❓ ${md(d.pregunta)}</div>` : ''}</div>`;
  },
  dato(d){
    return `<div class="in" style="justify-content:center;text-align:center"><div class="big">${esc(d.valor)}</div>
      <p class="s-lead" style="margin-top:.5em;font-size:1.3em">${md(d.texto)}</p>${d.fuente ? `<div class="src">Fuente: ${esc(d.fuente)}</div>` : ''}
      ${d.pregunta ? `<div class="ask" style="margin-top:1em">❓ ${md(d.pregunta)}</div>` : ''}</div>`;
  },
  practica(d, s, k){
    const min = +d.tiempo || 0;
    return `<div class="in"><h2 class="s-h">🛠 ${md(d.titulo)}</h2>
      <div>${d.entrega ? `<span class="chip">📤 ${esc(d.entrega)}</span>` : ''}${d.agrupamiento ? `<span class="chip">👥 ${esc(d.agrupamiento)}</span>` : ''}
      ${min ? `<button class="timer" data-timer="${min*60}" data-k="${s.n}-${k}">⏱ ${min} min</button>` : ''}</div>
      <p class="s-lead" style="margin-top:.5em">${md(d.enunciado)}</p>
      ${d.enlace ? `<a class="box wa" style="display:block;text-decoration:none;color:inherit;margin:.6em 0" href="${esc(d.enlace)}" target="_blank" rel="noopener">🔗 <b>${esc(String(d.enlace).replace(/^https?:\/\//,''))}</b></a>` : ''}
      ${arr(d.pasos).length ? `<ol class="steps">${arr(d.pasos).map(p=>`<li><span>${md(p)}</span></li>`).join('')}</ol>` : ''}
      ${d.material ? `<div class="src">Material: ${esc(arr(d.material).join(', '))}</div>` : ''}</div>`;
  },
  quiz(d, s, k){
    return `<div class="in"><h2 class="s-h">🧠 ${md(d.pregunta)}</h2>
      <div class="opts" data-q="${s.n}-${k}" data-ok="${+d.correcta||0}">${arr(d.opciones).map((o,j)=>`<button class="opt" data-j="${j}">${String.fromCharCode(65+j)}. ${md(o)}</button>`).join('')}</div>
      <div class="expl box hl" id="ex-${s.n}-${k}">${md(d.explicacion||'')}</div></div>`;
  },
  video(d){
    const id = ytId(d.youtube), ini = +d.inicio || 0;
    const url = id ? `https://www.youtube.com/watch?v=${id}${ini?'&t='+ini+'s':''}` : (d.busqueda ? 'https://www.youtube.com/results?search_query='+encodeURIComponent(d.busqueda) : '');
    const box = id ? `<div class="vid" data-yt="${id}" data-ini="${ini}" data-fin="${+d.fin||0}"><button class="play">▶ Reproducir aquí</button></div>`
      : `<a class="box wa" style="display:block;text-decoration:none;color:inherit" href="${esc(url)}" target="_blank" rel="noopener">🔎 Buscar en YouTube: <b>${esc(d.busqueda||'')}</b><div class="src">El docente elige el vídeo antes de clase.</div></a>`;
    return `<div class="in"><h2 class="s-h">🎬 ${md(d.titulo)}</h2>${d.texto ? `<p class="s-lead">${md(d.texto)}</p>` : ''}
      <div class="two" style="grid-template-columns:${arr(d.preguntas).length?'1.5fr 1fr':'1fr'};flex:1;min-height:0">${box}
      ${arr(d.preguntas).length ? `<div class="box ac"><div class="lb">Mientras lo ves</div><ul class="pts">${arr(d.preguntas).map(p=>`<li>${md(p)}</li>`).join('')}</ul></div>` : ''}</div>
      ${url && id ? `<div class="src"><a href="${esc(url)}" target="_blank" rel="noopener">Abrir en YouTube ↗</a>${d.duracion ? ' · '+esc(d.duracion) : ''}${ini ? ' · desde '+fmtT(ini) : ''}</div>` : ''}</div>`;
  },
  cierre(d){
    return `<div class="in"><h2 class="s-h">✅ ${md(d.titulo || 'Hoy hemos aprendido')}</h2>
      <ul class="pts">${arr(d.puntos).map(p=>`<li>${md(p)}</li>`).join('')}</ul>
      ${d.siguiente ? `<div class="box ac" style="margin-top:.6em"><div class="lb">Próxima sesión</div>${md(d.siguiente)}</div>` : ''}
      ${d.pregunta ? `<div class="ask">🚪 Pregunta de salida: ${md(d.pregunta)}</div>` : ''}</div>`;
  },
};
const TAG = {idea:'Idea clave', ejemplo:'Ejemplo cotidiano', pasos:'Paso a paso', comparar:'Comparamos', flujo:'Diagrama de flujo',
  infografia:'Infografía', codigo:'Programa', dato:'Dato', practica:'¡Manos a la obra!', quiz:'Comprueba', video:'Vídeo', cierre:'Cierre'};

function slidesOf(s){ return [{tipo:'portada', pregunta: s.pregunta}].concat(arr(s.diapositivas)); }
function renderSlide(s, d, k, total){
  const f = R[d.tipo] || R.idea;
  const tag = d.tipo !== 'portada' ? `<div class="tag">${esc(TAG[d.tipo]||'')}</div>` : '';
  return `<section class="slide" style="--fc:${fcol(s.fase)}" data-k="${k}">${f(d, s, k)}${tag}
    <div class="bar"><i style="width:${(k+1)/total*100}%"></i></div><div class="pg">${k+1} / ${total}</div></section>`;
}

// --------------------------------------------------- vistas
function home(){
  st.s = null; document.body.classList.remove('fs');
  $('#ttl').innerHTML = esc(D.meta.titulo || 'Sesiones');
  $('#sel').value = ''; $('#notes').classList.remove('on');
  $('#app').innerHTML = `<div class="home"><div class="hero"><div class="k">${esc([D.meta.curso_texto, D.materias].filter(Boolean).join(' · '))}</div>
    <h1>${esc(D.meta.titulo||'')}</h1>${D.meta.subtitulo ? `<p>${esc(D.meta.subtitulo)}</p>` : ''}
    ${D.reto ? `<p><b>Reto:</b> ${esc(D.reto)}</p>` : ''}
    <p class="help">Elige una sesión. Proyectar: <span class="kbd">←</span><span class="kbd">→</span> pasar · <span class="kbd">F</span> pantalla completa · <span class="kbd">N</span> notas del docente · <span class="kbd">E</span> modo estudio · <span class="kbd">Esc</span> volver aquí.</p></div>
    <div class="cards">${SES.map(s=>`<button class="sc" data-s="${s.n}" style="--fc:${fcol(s.fase)}"><div class="n">Sesión ${s.n} · ${esc(s.fase||'')}</div><h3>${esc(s.titulo)}</h3><p>${esc(s.reto||'')}</p><div class="c">${arr(s.diapositivas).length + 1} diapositivas</div></button>`).join('')}</div></div>`;
  setHash('#');
  wire();
}
function show(n, i){
  const s = SES.find(x => x.n == n); if (!s) return home();
  const sl = slidesOf(s);
  st.s = s; st.i = Math.max(0, Math.min(i|0, sl.length - 1));
  $('#ttl').innerHTML = `Sesión ${s.n}. ${esc(s.titulo)}<small>${esc(D.meta.titulo||'')}</small>`;
  $('#sel').value = String(s.n);
  $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar';
  if (st.mode === 'proy') {
    $('#app').innerHTML = `<div class="stage"><button class="nav l" id="pv" aria-label="Anterior">‹</button>${renderSlide(s, sl[st.i], st.i, sl.length)}<button class="nav r" id="nx" aria-label="Siguiente">›</button></div>`;
    $('#pv').onclick = prev; $('#nx').onclick = next;
  } else {
    $('#app').innerHTML = `<div class="study">${sl.map((d,k)=>renderSlide(s, d, k, sl.length)).join('')}
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:20px">${SES.find(x=>x.n==s.n-1) ? `<button class="tb" data-s="${s.n-1}">← Sesión ${s.n-1}</button>` : '<span></span>'}${SES.find(x=>x.n==s.n+1) ? `<button class="tb" data-s="${s.n+1}">Sesión ${s.n+1} →</button>` : ''}</div></div>`;
    window.scrollTo(0, 0);
  }
  const nt = st.mode === 'proy' ? sl[st.i].nota : null;
  $('#notes').innerHTML = nt ? `<b>Notas para el docente:</b> ${md(nt)}` : '<b>Notas:</b> sin notas en esta diapositiva.';
  $('#notes').classList.toggle('on', st.notes && st.mode === 'proy');
  setHash(`#s${s.n}-${st.i + 1}`);
  wire();
  fit();
}
function next(){
  if (!st.s) return; const sl = slidesOf(st.s), d = sl[st.i];
  if (d.tipo === 'pasos' && d.progresivo) { const key = st.s.n+'-'+st.i, v = st.revealed[key] ?? 1;
    if (v < arr(d.pasos).length) { st.revealed[key] = v + 1; return show(st.s.n, st.i); } }
  if (st.i < sl.length - 1) show(st.s.n, st.i + 1);
  else { const nx = SES.find(x => x.n == st.s.n + 1); if (nx) show(nx.n, 0); }
}
function prev(){ if (!st.s) return; if (st.i > 0) show(st.s.n, st.i - 1); else { const p = SES.find(x => x.n == st.s.n - 1); if (p) show(p.n, slidesOf(p).length - 1); } }

// Si el contenido no cabe en la diapositiva proyectada, reduce la letra (hasta un 62 %)
function fit(){
  const sl = document.querySelector('.stage .slide'); if (!sl) return;
  const inn = sl.querySelector('.in'); sl.style.fontSize = '';
  const base = parseFloat(getComputedStyle(sl).fontSize); let f = base;
  while (inn.scrollHeight > inn.clientHeight + 1 && f > base * 0.62) { f *= 0.96; sl.style.fontSize = f + 'px'; }
}
let fitT; addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fit, 80); });
let timers = {};
function wire(){
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => show(+b.dataset.s, 0));
  document.querySelectorAll('.opts').forEach(q => q.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    const ok = +q.dataset.ok; q.querySelectorAll('.opt').forEach(x => x.classList.remove('ok','ko'));
    o.classList.add(+o.dataset.j === ok ? 'ok' : 'ko'); q.querySelectorAll('.opt')[ok]?.classList.add('ok');
    document.getElementById('ex-' + q.dataset.q)?.classList.add('on');
  }));
  document.querySelectorAll('.reveal').forEach(b => b.onclick = () => { st.revealed[b.dataset.rev] = (st.revealed[b.dataset.rev] ?? 1) + 1; show(st.s.n, st.i); });
  document.querySelectorAll('.vid').forEach(v => { const b = v.querySelector('.play'); if (b) b.onclick = () => {
    const p = new URLSearchParams({autoplay: '1', rel: '0'}); if (+v.dataset.ini) p.set('start', v.dataset.ini); if (+v.dataset.fin) p.set('end', v.dataset.fin);
    v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?${p}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe>`; }; });
  document.querySelectorAll('.timer').forEach(b => {
    const k = b.dataset.k, paint = () => { const t = timers[k]; if (!t) return; const left = Math.round((t.end - Date.now())/1000);
      b.textContent = left > 0 ? '⏱ ' + fmtT(left) : '⏰ ¡Tiempo!'; b.classList.toggle('end', left <= 0); };
    if (timers[k]) paint();
    b.onclick = () => { if (timers[k]) { clearInterval(timers[k].iv); delete timers[k]; b.textContent = '⏱ ' + (b.dataset.timer/60) + ' min'; b.classList.remove('end'); return; }
      timers[k] = { end: Date.now() + b.dataset.timer * 1000 }; timers[k].iv = setInterval(() => { if (!document.body.contains(b)) return; paint(); }, 500); paint(); };
  });
}

// --------------------------------------------------- controles
$('#sel').innerHTML = `<option value="">Ir a la sesión…</option>` + SES.map(s => `<option value="${s.n}">S${s.n}. ${esc(s.titulo)}</option>`).join('');
$('#sel').onchange = e => e.target.value ? show(+e.target.value, 0) : home();
$('#b-home').onclick = home;
$('#b-mode').onclick = () => { st.mode = st.mode === 'proy' ? 'est' : 'proy'; st.s ? show(st.s.n, st.i) : null; $('#b-mode').textContent = st.mode === 'proy' ? '📖 Estudiar' : '📽 Proyectar'; };
$('#b-notes').onclick = () => { st.notes = !st.notes; $('#b-notes').setAttribute('aria-pressed', st.notes); $('#notes').classList.toggle('on', st.notes && st.mode === 'proy' && !!st.s); };
$('#b-fs').onclick = toggleFs;
$('#b-theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('clase-theme', r.dataset.theme); } catch(e){} };
try { const t = localStorage.getItem('clase-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
function toggleFs(){
  if (!st.s) return;
  if (st.mode !== 'proy') { st.mode = 'proy'; show(st.s.n, st.i); }
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.().catch(()=>{}); document.body.classList.add('fs'); }
  else { document.exitFullscreen?.(); document.body.classList.remove('fs'); }
}
document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('fs', !!document.fullscreenElement); setTimeout(fit, 120); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (st.s && st.mode === 'proy' && ['ArrowRight','ArrowDown','PageDown',' '].includes(k)) { e.preventDefault(); next(); }
  else if (st.s && st.mode === 'proy' && ['ArrowLeft','ArrowUp','PageUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home' && st.s && st.mode === 'proy') show(st.s.n, 0);
  else if (k === 'End' && st.s && st.mode === 'proy') show(st.s.n, slidesOf(st.s).length - 1);
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'n' || k === 'N') $('#b-notes').click();
  else if ((k === 'e' || k === 'E') && st.s) $('#b-mode').click();
  else if (k === 'Escape' && !document.fullscreenElement) home();
});
// enlace directo: #s3-2 (sesión 3, diapositiva 2)
let m = null; try { m = location.hash.match(/^#s(\d+)(?:-(\d+))?/); } catch(e){}
if (!SES.length) $('#app').innerHTML = '<div class="empty">Esta situación de aprendizaje todavía no tiene diapositivas de clase.</div>';
else if (m) show(+m[1], (+m[2] || 1) - 1); else home();
</script>
