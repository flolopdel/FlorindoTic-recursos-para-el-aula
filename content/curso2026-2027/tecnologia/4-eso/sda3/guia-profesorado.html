<script>
const DATA = {"sa": {"meta": {"titulo": "SdA 3: Electrónica analógica", "numero": 3, "subtitulo": "«Smart City (parte 1)»: diseñamos y construimos una maqueta de ciudad inteligente con alumbrado automático, parking y semáforos", "curso_texto": "4.º ESO", "anio_academico": "2026/2027", "duracion_sesion": 50, "agrupamiento": "Individual en la teoría, las prácticas, el montaje de circuitos y la prueba escrita; por parejas (9 parejas y 1 trío) en el reto Smart City", "temporalizacion": "Primer trimestre (orientativo: 13 sesiones, algo más de 4 semanas a 3 sesiones semanales, una de ellas en el taller)", "carpeta_drive": "1IIjAsi5anvzLaMycOMSSXPgqYkxVt25d"}, "materias": [{"codigo": "TEC", "criterios": ["TEC.4.1.1", "TEC.4.1.2", "TEC.4.2.2", "TEC.4.4.1"], "saberes": ["TEC.4.A.1.1", "TEC.4.A.1.2", "TEC.4.A.3.2", "TEC.4.B.1", "TEC.4.C.2"]}], "vision": {"descripcion": "El alumnado aprende los componentes básicos de la electrónica analógica (semiconductores, resistencias fijas y variables, condensadores, diodos, LED y transistores), calcula resistencias limitadoras con la ley de Ohm, analiza y monta circuitos físicos y simulados en Tinkercad y aplica lo aprendido en la primera parte del reto Smart City: el diseño a escala y la construcción por parejas de una maqueta de ciudad inteligente de 30 × 40 cm con parking, semáforos y alumbrado.", "contexto": "Grupo de 19 estudiantes de Tecnología 4.º ESO del IES Villa de Mijas. Hay un día de taller a la semana (herramientas de taller y material de electrónica) y el resto de sesiones en el aula con un ordenador por estudiante. El alumnado usa Google Workspace del centro, Canva y Tinkercad. En el grupo hay un alumno repetidor con poca atención en clase y una alumna marroquí con dificultades con el español.", "justificacion": "La electrónica está detrás de casi todo lo que usa el alumnado (móvil, consola, coche, farolas). Entender cómo se controla la corriente con unos pocos componentes y aplicarlo a problemas reales de su ciudad (tráfico, aparcamiento, consumo del alumbrado) da sentido a la teoría y prepara la segunda parte del reto, en la que se programará la maqueta.", "reto": "«El Ayuntamiento quiere probar ideas de ciudad inteligente antes de instalarlas en Mijas. Somos un equipo de ingeniería y diseñamos y construimos la maqueta de un barrio inteligente con alumbrado de LED, un parking con barrera y semáforos, que programaremos en la segunda parte del reto.»", "pregunta_guia": "¿Cómo pueden unos pocos componentes electrónicos hacer que una ciudad gaste menos y funcione mejor?", "producto_final": "Maqueta de Smart City de 30 × 40 cm diseñada a escala (según un coche de juguete) y construida por parejas, con alumbrado de LED y su circuito y los espacios del parking con barrera y de los semáforos preparados para programarlos en la parte 2, más el cuaderno de proyecto (escala, croquis, cálculos y diario de taller). La presentación ante la clase se hará al terminar la parte 2."}, "metodologias": [{"nombre": "Aprendizaje Basado en Proyectos (ABP)", "descripcion": "El reto Smart City recorre toda la SdA: una sesión de taller por semana avanza la maqueta mientras las sesiones de aula dan la base de electrónica que la maqueta necesita (alumbrado con LED, resistencias, LDR y transistor)."}, {"nombre": "Instrucción directa con práctica guiada", "descripcion": "Explicaciones cortas con la web de teoría y la web de clase, un ejemplo resuelto en la pizarra y práctica individual inmediata con las fichas de clase."}, {"nombre": "Aprendizaje por descubrimiento con simuladores", "descripcion": "Montajes en Tinkercad Circuits y en protoboard para observar qué pasa antes de explicarlo (girar el potenciómetro, tapar la LDR, pulsar la base del transistor)."}, {"nombre": "Aprendizaje cooperativo por parejas", "descripcion": "Parejas heterogéneas en el reto con reparto de tareas y diario de taller; el resto de entregas son individuales."}, {"nombre": "Evaluación formativa", "descripcion": "Prácticas Apto / No apto corregidas en clase, quiz en la web de clase, sesión de repaso con estaciones multinivel antes de la prueba y listas «Antes de entregar» en las plantillas."}], "recursos": ["Aula con un ordenador por estudiante", "Taller de Tecnología y herramientas", "Kits de electrónica: protoboard, LED, resistencias, pila 9 V", "LDR, NTC, potenciómetros y transistores BC547", "Tinkercad Circuits", "Web de teoría de electrónica analógica", "Fichas de práctica de clase (PDF)", "Google Workspace del centro", "Moodle Centros"], "fases": [{"nombre": "Inicio", "sesiones": "1-3", "finalidad": "Diagnóstico, fundamentos (semiconductores, diodos, resistencias y ley de Ohm) y presentación del reto Smart City en el taller"}, {"nombre": "Desarrollo", "sesiones": "4-12", "finalidad": "Prácticas de clase, montajes físicos y simulados, prueba escrita y diseño y construcción de la maqueta en el taller"}, {"nombre": "Cierre", "sesiones": "13", "finalidad": "Simulación del alumbrado, cierre y entrega del cuaderno de proyecto"}], "sesiones": [{"n": 1, "fase": "Inicio", "titulo": "¿Qué hay dentro de tu móvil? Electricidad, electrónica y semiconductores", "reto": "Distinguir electricidad y electrónica, clasificar materiales en conductores, aislantes y semiconductores y entender qué es un semiconductor tipo P y tipo N.", "actividades": [{"nombre": "Gancho: la placa por dentro", "min": 8, "desc": "El docente enseña la placa de un aparato viejo (router, mando o móvil roto) y pregunta: «¿Qué hacen estas piezas tan pequeñas? ¿Por qué un cargador no es solo un cable?». Se anotan las ideas en la pizarra. Se pide que para la sesión 3 traigan un coche de juguete pequeño (si no hay, el taller presta uno)."}, {"nombre": "Diagnóstico inicial (F1)", "min": 7, "desc": "Cuestionario anónimo F1 (Google Forms) de 8 preguntas: qué es un LED, para qué sirve una resistencia, si un diodo deja pasar la corriente en los dos sentidos, qué es una protoboard. El docente proyecta los resultados agregados al terminar."}, {"nombre": "Electricidad o electrónica", "min": 10, "desc": "Con la web de teoría (apartado Introducción): la electricidad transforma la energía (lámpara, motor); la electrónica controla y procesa señales con bajas tensiones (móvil: pantalla táctil, cámara, sonido). Actividad rápida: el alumnado clasifica 6 aparatos (tostadora, consola, ventilador, router, plancha, mando a distancia) según si su función principal es eléctrica o electrónica."}, {"nombre": "Conductores, aislantes y semiconductores", "min": 15, "desc": "Explicación con el apartado «Componentes» de la web de teoría y su actividad de clasificar materiales. Silicio (segundo elemento más abundante de la corteza terrestre) y germanio: a baja temperatura son aislantes y al subir la temperatura algunos electrones se liberan de sus enlaces covalentes. Dopado: tipo N (átomos pentavalentes como P o As, sobran electrones) y tipo P (trivalentes como B o Al, sobran huecos). Se insiste en el vocabulario de la Práctica 1 (intrínseco, extrínseco o dopado, hueco, electrón de valencia)."}, {"nombre": "El diodo: la unión PN", "min": 10, "desc": "Simulador «Gira la pila y observa qué hace el diodo» de la web de teoría: polarización directa (positivo de la pila al ánodo, conduce si supera la tensión umbral) e inversa (la unión PN se ensancha y no conduce). Cada estudiante copia en el cuaderno el símbolo del diodo con ánodo, cátodo, zona P y zona N."}], "criterios": [], "saberes": ["TEC.4.B.1"], "metodologia": ["Instrucción directa con práctica guiada", "Evaluación formativa"], "evidencias": ["Cuestionario diagnóstico F1", "Clasificación de aparatos y materiales en el cuaderno"], "recursos": ["Proyector", "Web de teoría", "Placa de un aparato viejo"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Objeto real para empezar; glosario visual con símbolo y traducción al árabe de las palabras clave (conductor, aislante, semiconductor, diodo); simulador interactivo para quien aprende mejor manipulando."}, "ejercicios": ["Clasifica seis aparatos según su función sea principalmente eléctrica o electrónica.", "Clasifica materiales en conductores, aislantes y semiconductores.", "Dibuja el símbolo del diodo y señala ánodo, cátodo, zona P y zona N."], "clase": {"pregunta": "¿Por qué tu móvil necesita algo más que cables?", "diapositivas": [{"tipo": "ejemplo", "icono": "📱", "titulo": "Lo que hace tu móvil", "situacion": "Tocas la pantalla, suena una notificación y la cámara enfoca sola.", "explicacion": "La **electricidad** da la energía, pero la **electrónica** decide qué pasa: controla y procesa señales con **bajas tensiones**.", "pregunta": "¿Y una tostadora? ¿Es electrónica?"}, {"tipo": "practica", "titulo": "Diagnóstico: ¿qué sé de electrónica?", "tiempo": 7, "enunciado": "Responde el cuestionario F1. Es **anónimo** y no cuenta para nota: sirve para saber por dónde empezar.", "agrupamiento": "Individual"}, {"tipo": "comparar", "titulo": "Conductor, aislante o semiconductor", "columnas": [{"titulo": "Conductor", "icono": "🔌", "puntos": ["Deja pasar la corriente", "Cobre, aluminio"]}, {"titulo": "Aislante", "icono": "🧤", "puntos": ["No deja pasar la corriente", "Plástico, madera, vidrio"]}, {"titulo": "Semiconductor", "icono": "💎", "puntos": ["**Depende** de las condiciones", "Silicio, germanio", "Base de diodos y transistores"]}], "texto": "El **silicio** es el material estrella de la electrónica."}, {"tipo": "comparar", "titulo": "Dopar el silicio: tipo N y tipo P", "columnas": [{"titulo": "Tipo N", "icono": "➖", "puntos": ["Se añaden átomos con **5** electrones de valencia (P, As)", "Sobran **electrones**"]}, {"titulo": "Tipo P", "icono": "➕", "puntos": ["Se añaden átomos con **3** electrones de valencia (B, Al)", "Sobran **huecos**"]}], "texto": "Silicio puro = **intrínseco**. Con impurezas = **extrínseco o dopado**."}, {"tipo": "practica", "titulo": "Gira la pila y observa el diodo", "tiempo": 10, "enunciado": "Abre la web de teoría en el apartado **Diodos** y prueba el simulador. Copia en el cuaderno el símbolo con **ánodo, cátodo, zona P y zona N** y escribe cuándo conduce.", "enlace": "https://florindotic.es/content/curso2026-2027/tecnologia/4-eso/teoria/electronica-analogica.html#diodos", "agrupamiento": "Individual"}, {"tipo": "quiz", "pregunta": "¿Qué ocurre con el silicio a temperaturas muy bajas?", "opciones": ["Se comporta como conductor", "Se comporta como aislante", "Genera electricidad", "Se funde"], "correcta": 1, "explicacion": "A baja temperatura sus electrones están sujetos en los **enlaces covalentes**: se comporta como **aislante**. Al calentarse, algunos se liberan y conduce."}]}}, {"n": 2, "fase": "Inicio", "titulo": "Diodos, LED y resistencias: el código de colores y la ley de Ohm", "reto": "Saber cuándo se enciende un LED en un circuito, leer el valor y la tolerancia de una resistencia y calcular la resistencia limitadora de un LED.", "actividades": [{"nombre": "Repaso relámpago", "min": 5, "desc": "Quiz de la web de clase sobre la sesión 1 (semiconductor tipo N, polarización directa)."}, {"nombre": "El LED: patilla larga, patilla corta", "min": 8, "desc": "Se reparte un LED por mesa: la patilla larga es el ánodo (+) y la corta, junto al lado plano, el cátodo (−). Como cualquier diodo, solo emite luz en polarización directa. Ejemplos: semáforos, pantallas, luces del coche."}, {"nombre": "¿Qué bombillas se encienden?", "min": 10, "desc": "El docente resuelve en la pizarra el circuito a) de la Práctica 1 siguiendo el camino de la corriente desde el polo positivo; el alumnado resuelve el b) en el cuaderno y se corrige en voz alta. Estrategia: marcar en cada diodo PD o PI y tachar las ramas con un diodo en inversa."}, {"nombre": "Resistencias fijas y código de colores", "min": 12, "desc": "Con el laboratorio «Elige los colores y lee el valor» de la web de teoría: 1.ª cifra, 2.ª cifra, multiplicador y tolerancia. Ejemplo resuelto: rojo-violeta-amarillo-oro = 27 × 10 kΩ = 270 kΩ ± 5 %, valor máximo 283,5 kΩ y mínimo 256,5 kΩ. El alumnado lee dos resistencias del kit."}, {"nombre": "Ley de Ohm: la resistencia del LED", "min": 10, "desc": "V = I × R. Problema de la ficha: LED rojo de 1,9 V y 20 mA con una pila de 9 V → R = (9 − 1,9) / 0,02 = 355 Ω. Se explica por qué se elige el valor comercial superior (si no está, se ponen dos en serie: 330 Ω + 220 Ω = 550 Ω)."}, {"nombre": "Salida", "min": 5, "desc": "Cada estudiante calcula en el cuaderno la resistencia para un LED de 2 V y 15 mA con 9 V (≈ 467 Ω) y la enseña al salir."}], "criterios": ["TEC.4.4.1"], "saberes": ["TEC.4.B.1"], "metodologia": ["Instrucción directa con práctica guiada"], "evidencias": ["Circuito b) resuelto en el cuaderno", "Cálculo de salida de la resistencia limitadora"], "recursos": ["Proyector", "LED y resistencias del kit", "Calculadora"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Tabla del código de colores impresa en la mesa; ejemplo resuelto paso a paso en la pizarra; calculadora permitida; fórmula R = (Vcc − VD) / I con la traducción al árabe de tensión, intensidad y resistencia."}, "ejercicios": ["Indica qué bombillas se encienden en el circuito b) según la polarización de sus diodos.", "Calcula el valor nominal, máximo y mínimo de dos resistencias del kit.", "Calcula la resistencia limitadora de un LED de 2 V y 15 mA conectado a 9 V."], "clase": {"pregunta": "¿Por qué un LED se quema si lo conectas directamente a una pila de 9 V?", "diapositivas": [{"tipo": "ejemplo", "icono": "🚦", "titulo": "Los semáforos ya son LED", "situacion": "Los semáforos y las farolas nuevas de tu calle ya no usan bombillas: usan **LED**.", "explicacion": "Un LED es un **diodo que emite luz**: solo se enciende en **polarización directa** y gasta mucha menos energía que una bombilla."}, {"tipo": "infografia", "titulo": "Cómo se conecta un LED", "svg": "<svg viewBox=\"0 0 640 220\" role=\"img\" aria-label=\"LED con patilla larga ánodo positivo y patilla corta cátodo negativo, conectado en serie con una resistencia a una pila\"><rect x=\"30\" y=\"80\" width=\"70\" height=\"60\" rx=\"8\" style=\"fill:var(--warm-bg);stroke:var(--warm);stroke-width:2\"/><text x=\"65\" y=\"116\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:16px\">9 V<\/text><line x1=\"100\" y1=\"95\" x2=\"200\" y2=\"95\" style=\"stroke:var(--ink);stroke-width:3\"/><rect x=\"200\" y=\"82\" width=\"90\" height=\"26\" rx=\"4\" style=\"fill:var(--accent-soft);stroke:var(--accent);stroke-width:2\"/><text x=\"245\" y=\"70\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px\">Resistencia<\/text><line x1=\"290\" y1=\"95\" x2=\"380\" y2=\"95\" style=\"stroke:var(--ink);stroke-width:3\"/><polygon points=\"380,75 380,115 420,95\" style=\"fill:var(--brand-soft);stroke:var(--brand);stroke-width:2\"/><line x1=\"420\" y1=\"75\" x2=\"420\" y2=\"115\" style=\"stroke:var(--brand);stroke-width:3\"/><text x=\"380\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:14px\">Ánodo (+)<\/text><text x=\"380\" y=\"158\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:14px\">patilla larga<\/text><text x=\"440\" y=\"60\" style=\"fill:var(--ink);font-size:14px\">Cátodo (−) patilla corta<\/text><line x1=\"420\" y1=\"95\" x2=\"560\" y2=\"95\" style=\"stroke:var(--ink);stroke-width:3\"/><line x1=\"560\" y1=\"95\" x2=\"560\" y2=\"190\" style=\"stroke:var(--ink);stroke-width:3\"/><line x1=\"560\" y1=\"190\" x2=\"65\" y2=\"190\" style=\"stroke:var(--ink);stroke-width:3\"/><line x1=\"65\" y1=\"190\" x2=\"65\" y2=\"140\" style=\"stroke:var(--ink);stroke-width:3\"/><text x=\"300\" y=\"212\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:15px\">La corriente sale del + y atraviesa el LED de ánodo a cátodo<\/text><\/svg>"}, {"tipo": "practica", "titulo": "¿Qué bombillas se encienden?", "tiempo": 10, "enunciado": "Mira el circuito b) de la Práctica 1. Sigue la corriente desde el **polo positivo** y marca cada diodo con **PD** (directa) o **PI** (inversa).", "pasos": ["Busca el + de la pila", "Recorre cada rama hasta el −", "Si una rama tiene un diodo en PI, tacha la rama: sus bombillas no lucen"], "agrupamiento": "Individual"}, {"tipo": "pasos", "titulo": "Leer una resistencia", "pasos": ["Pon la banda dorada o plateada a la **derecha**", "1.ª y 2.ª banda: las **dos cifras**", "3.ª banda: el **multiplicador** (ceros que se añaden)", "4.ª banda: la **tolerancia** (oro ±5 %, plata ±10 %)", "Máximo = nominal + tolerancia · Mínimo = nominal − tolerancia"], "progresivo": true}, {"tipo": "practica", "titulo": "La resistencia que salva al LED", "tiempo": 10, "enunciado": "LED rojo: **1,9 V y 20 mA**. Pila de **9 V**. Calcula la resistencia limitadora con **R = (Vcc − VD) / I**. Recuerda pasar los mA a A (20 mA = 0,02 A).", "enlace": "https://florindotic.es/content/curso2026-2027/tecnologia/4-eso/teoria/electronica-analogica.html#resistencias", "agrupamiento": "Individual", "ayudas": [{"tipo": "pista", "texto": "R = (9 − 1,9) / 0,02 = 7,1 / 0,02 = **355 Ω**. Como no existe ese valor, se pone uno igual o mayor: 330 Ω + 220 Ω en serie = 550 Ω."}]}, {"tipo": "quiz", "pregunta": "Naranja, naranja, rojo, oro. ¿Cuánto vale?", "opciones": ["33 Ω ± 5 %", "330 Ω ± 5 %", "3300 Ω ± 5 %", "3300 Ω ± 10 %"], "correcta": 2, "explicacion": "3 y 3 → 33; rojo multiplica por 100 → **3300 Ω**; oro = **± 5 %** (entre 3135 Ω y 3465 Ω)."}]}}, {"n": 3, "fase": "Inicio", "titulo": "Taller I: conocemos el material y aceptamos el reto Smart City", "reto": "Conocer el material de electrónica y del taller con sus normas de seguridad, formar las parejas y calcular la escala de la maqueta con un coche de juguete.", "actividades": [{"nombre": "Normas de seguridad del taller", "min": 5, "desc": "Repaso de las normas: herramientas en su sitio, pistola termofusible y soldador solo con el docente delante y sobre su soporte, cúter con regla metálica y cortando hacia fuera, pila desconectada mientras se monta."}, {"nombre": "El material que vamos a usar", "min": 15, "desc": "Demostración en la mesa del docente: protoboard (cómo se conectan sus filas y columnas), pila de 9 V con portapilas, LED, resistencias, potenciómetro, LDR, NTC, transistor BC547, pulsador, cables de conexión y polímetro. Herramientas: alicates, pelacables, segueta, cúter, regla metálica, pistola termofusible. Material de la maqueta: base de cartón pluma o contrachapado de 30 × 40 cm, cartulinas, palillos y pajitas para farolas."}, {"nombre": "Presentación del reto Smart City", "min": 10, "desc": "Se lee el encargo del reto y la definición de Smart City de la ficha del reto y se proyecta el vídeo de la Fase 1 (introducción a las ciudades inteligentes) y el de un proyecto similar. Se explican los tres sistemas: parking con barrera automática, alumbrado automático y semáforos, y que en esta primera parte se diseña y construye la maqueta; la programación llega en la parte 2."}, {"nombre": "Parejas y escala", "min": 15, "desc": "Formación de 9 parejas y 1 trío (heterogéneas, propuestas por el docente). Cada pareja copia su cuaderno de proyecto A2, mide el ancho de su coche de juguete y calcula su escala: escala = medida del coche de juguete / 180 cm (ejemplo de la ficha: 3 cm / 180 cm = 1:60). Con la escala comprueban cuántos metros reales caben en el panel de 30 × 40 cm."}, {"nombre": "Cierre y orden", "min": 5, "desc": "Cada pareja anota su escala en el diario de taller del cuaderno A2 y recoge su puesto."}], "criterios": ["TEC.4.1.1"], "saberes": ["TEC.4.A.1.2", "TEC.4.A.3.2"], "metodologia": ["Aprendizaje Basado en Proyectos (ABP)", "Aprendizaje cooperativo por parejas"], "evidencias": ["Escala de la maqueta en el cuaderno A2", "Parejas formadas"], "recursos": ["Taller", "Kits de electrónica", "Coches de juguete", "Regla y calculadora"], "dua": {"principios": ["Compromiso", "Representación"], "medidas": "Material real para tocar y vídeos con imágenes; parejas heterogéneas (la alumna con dificultades con el español con un compañero o compañera de apoyo y el alumno repetidor con el rol de responsable de material del taller); guía rápida de 4 pasos para la escala."}, "ejercicios": ["Mide el ancho de tu coche de juguete y calcula la escala de la maqueta.", "Calcula cuántos metros reales representa el panel de 30 × 40 cm a tu escala."], "clase": {"pregunta": "¿Cuántos metros de ciudad caben en un panel de 30 × 40 cm?", "diapositivas": [{"tipo": "video", "titulo": "Fase 1: ¿qué es una Smart City?", "youtube": "https://www.youtube.com/watch?v=2br8xkxh4e0", "texto": "Fíjate en qué problemas de la ciudad se resuelven con sensores.", "preguntas": ["¿Qué servicios de la ciudad mejoran?", "¿Cuál pondrías en Mijas?"]}, {"tipo": "video", "titulo": "Un proyecto como el nuestro", "youtube": "https://www.youtube.com/watch?v=xSZf94pLtHc", "texto": "Busca los tres sistemas de nuestro reto.", "preguntas": ["¿Dónde están las farolas, el parking y los semáforos?", "¿Qué material usan para la base?"]}, {"tipo": "ejemplo", "icono": "🅿️", "titulo": "El parking del centro comercial", "situacion": "Encima de cada plaza hay una luz **verde** si está libre y **roja** si está ocupada, y la barrera se abre sola.", "explicacion": "Eso ya es una **Smart City** en pequeño: sensores, electrónica y control para ahorrar tiempo, combustible y energía."}, {"tipo": "idea", "icono": "🏙️", "titulo": "Nuestro reto: Smart City (parte 1)", "puntos": ["**Parking** con barrera automática", "**Alumbrado** que se enciende solo", "**Semáforos** para el tráfico", "Hoy: parejas, material y **escala**"]}, {"tipo": "practica", "titulo": "Calcula la escala de tu ciudad", "tiempo": 15, "enunciado": "Copia el **cuaderno de proyecto A2** (uno por pareja). Mide el **ancho** del coche de juguete en cm y calcula la escala.", "pasos": ["Coche patrón: mide su ancho (cm)", "Coche real: unos **180 cm** de ancho", "Escala = juguete / real (ejemplo: 3 / 180 = **1:60**)", "Panel de 30 × 40 cm × 60 = **18 m × 24 m** reales"], "agrupamiento": "Por parejas", "enlace": "https://docs.google.com/document/d/1tn0tp6d9x7MRft0Nf6QH9o7u48m15n_velyXWwjKPnc/copy"}, {"tipo": "pasos", "titulo": "Seguridad en el taller", "pasos": ["Pistola termofusible y soldador **siempre en su soporte**", "Cúter con **regla metálica**, cortando hacia fuera", "Pila **desconectada** mientras montas", "Cada herramienta vuelve a su sitio al terminar"]}]}}, {"n": 4, "fase": "Desarrollo", "titulo": "Práctica 1: semiconductores, diodos y condensadores", "reto": "Resolver la Práctica 1 (cuestionario de semiconductores y análisis de circuitos con diodos) y conocer el condensador y su polaridad.", "actividades": [{"nombre": "Condensadores en 10 minutos", "min": 10, "desc": "Con el apartado «Condensadores» de la web de teoría: el condensador almacena carga y la suelta después (como un depósito de agua); animación de carga y descarga. Electrolíticos (con polaridad: patilla larga +, franja −) y cerámicos (sin polaridad). Ejemplo: el flash de una cámara o el LED del cargador que tarda en apagarse."}, {"nombre": "Práctica 1 · Ejercicio 1: cuestionario", "min": 12, "desc": "Individual. Las 10 preguntas de opción múltiple de la ficha «Introducción y diodos» (electrones, silicio, semiconductores a baja temperatura, enlaces covalentes, dopado, tipo N y tipo P, polarización directa e inversa)."}, {"nombre": "Práctica 1 · Ejercicio 2: circuitos a) a g)", "min": 20, "desc": "Individual. Señalar qué bombillas o LED se encienden en los circuitos a) a g). El docente pasa por las mesas; en el f) y el g) recuerda que dos diodos opuestos en paralelo siempre dejan pasar la corriente por uno de ellos."}, {"nombre": "Corrección y entrega", "min": 8, "desc": "Se corrigen en voz alta las preguntas más falladas, cada estudiante marca sus errores en otro color y sube la foto o el PDF a la Tarea 3.1."}], "criterios": ["TEC.4.4.1"], "saberes": ["TEC.4.B.1"], "metodologia": ["Instrucción directa con práctica guiada", "Evaluación formativa"], "evidencias": ["Práctica 1 resuelta y corregida (Tarea 3.1)"], "recursos": ["Ficha Práctica 1", "Web de teoría", "Moodle Centros"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Versión de la ficha con las palabras clave traducidas al árabe; resolver primero en voz alta un circuito modelo; quien termina antes ayuda como revisor/a; corrección con otro color para aprender del error."}, "ejercicios": ["Responde las 10 preguntas de opción múltiple sobre semiconductores y diodos.", "Indica qué bombillas o LED se encienden en los circuitos a) a g)."], "moodle": [{"recurso": "Tarea", "nombre": "3.1 · Práctica 1: introducción y diodos", "uso": "Comprobar que cada estudiante ha resuelto y corregido la Práctica 1 en clase.", "correccion": "apto", "criterio": "TEC.4.4.1", "cotejo": ["Están respondidas las 10 preguntas del ejercicio 1", "Están resueltos los 7 circuitos del ejercicio 2 (a-g)", "Los errores están corregidos en otro color", "La foto o el PDF se lee bien"], "config": ["Entrega individual: archivo .pdf, .jpg o .png", "Calificación: escala Apto / No apto", "Fecha de entrega: final de la sesión (prórroga para quien la necesite)"], "calificable": true, "codigo": "3.1"}], "clase": {"pregunta": "¿Por qué el LED del cargador tarda un poco en apagarse?", "diapositivas": [{"tipo": "ejemplo", "icono": "🔋", "titulo": "El LED que no se apaga", "situacion": "Desenchufas el cargador y su lucecita sigue encendida **un segundo**.", "explicacion": "Dentro hay un **condensador**: guarda carga eléctrica y la va soltando, como un depósito de agua que se vacía."}, {"tipo": "comparar", "titulo": "Dos tipos de condensador", "columnas": [{"titulo": "Electrolítico", "icono": "🥫", "puntos": ["Forma de bote", "**Tiene polaridad**: patilla larga +, franja −", "Mucha capacidad"]}, {"titulo": "Cerámico", "icono": "🟠", "puntos": ["Forma de lenteja", "**Sin polaridad**", "Poca capacidad"]}]}, {"tipo": "practica", "titulo": "Práctica 1 · Ejercicio 1", "tiempo": 12, "enunciado": "Responde las **10 preguntas** de opción múltiple de la ficha. Si dudas, vuelve a mo lo vamos a resolver.", "agrupamiento": "Por parejas"}]}}, {"n": 7, "fase": "Desarrollo", "titulo": "Montajes en Tinkercad: potenciómetro, LDR y transistor", "reto": "Entrenar el montaje simulado de circuitos con LED, potenciómetro, LDR y transistor antes de la práctica evaluable.", "actividades": [{"nombre": "Tinkercad Circuits en 8 minutos", "min": 8, "desc": "El docente monta en directo un LED con su resistencia en la protoboard virtual: cómo se conectan las filas, cómo se cambia el valor de la resistencia y cómo se mide con el multímetro. Cada estudiante entra con su cuenta del centro."}, {"nombre": "Actividad 3: LED y potenciómetro", "min": 12, "desc": "Ficha «Actividades de electrónica analógica»: montar un LED en polarización directa con una resistencia limitadora y un potenciómetro. Responder: para qué sirve la resistencia en serie, qué pasa con el brillo al girar el eje y cómo se relaciona con la ley de Ohm."}, {"nombre": "Actividad 4: el circuito con LDR", "min": 12, "desc": "Montar el circuito con LDR (330 Ω + 220 Ω, LED y LDR) y cambiar la luz con el control del simulador. Describir qué cambia y por qué."}, {"nombre": "Actividad 7: el transistor con pulsador", "min": 13, "desc": "Montar el circuito del transistor NPN con pulsador de la ficha. Explicar qué pasa al pulsar (corriente de base → el transistor conduce → el LED se enciende)."}, {"nombre": "Cierre", "min": 5, "desc": "Cada estudiante guarda sus diseños con un nombre claro (S7_potenciometro, S7_LDR, S7_transistor) para reutilizarlos en la práctica de la próxima sesión."}], "criterios": ["TEC.4.4.1"], "saberes": ["TEC.4.B.1", "TEC.4.C.2"], "metodologia": ["Aprendizaje por descubrimiento con simuladores"], "evidencias": ["Diseños guardados en Tinkercad", "Respuestas de las actividades 3, 4 y 7 en el cuaderno"], "recursos": ["Ordenadores", "Tinkercad Circuits", "Ficha de actividades"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Demostración en directo antes de montar; pasos numerados en la diapositiva; respuestas en el cuaderno con frases cortas o un dibujo; parejas de ayuda (no de entrega) para quien se bloquea."}, "ejercicios": ["Monta un LED con resistencia limitadora y potenciómetro y explica qué ocurre al girar el eje.", "Monta el circuito con LDR y describe cómo influye la luz.", "Monta el circuito del transistor con pulsador y explica lo que ocurre."], "clase": {"pregunta": "¿Y si pudieras montar el circuito antes de tocar un cable?", "diapositivas": [{"tipo": "ejemplo", "icono": "🎮", "titulo": "Como un simulador de vuelo", "situacion": "Los pilotos practican en un **simulador** antes de volar de verdad.", "explicacion": "En **Tinkercad Circuits** montamos y probamos circuitos sin quemar ningún LED. Si funciona en la pantalla, funcionará en la protoboard."}, {"tipo": "practica", "titulo": "Actividad 3: LED y potenciómetro", "tiempo": 12, "enunciado": "Monta un LED en **polarización directa** con su **resistencia** y un **potenciómetro**. Gira el eje y observa.", "pasos": ["¿Para qué sirve la resistencia en serie?", "¿Qué pasa con el brillo al girar el eje?", "¿Cómo se relaciona con la ley de Ohm?"], "enlace": "https://www.tinkercad.com/", "agrupamiento": "Individual"}, {"tipo": "practica", "titulo": "Actividad 4: el circuito con LDR", "tiempo": 12, "enunciado": "Monta el circuito (330 Ω + 220 Ω, LED y LDR). Pulsa la LDR y mueve el control de luz.", "pasos": ["¿Qué pasa con mucha luz?", "¿Y a oscuras?", "Explica por qué"], "agrupamiento": "Individual"}, {"tipo": "practica", "titulo": "Actividad 7: transistor con pulsador", "tiempo": 13, "enunciado": "Monta el circuito del transistor NPN con pulsador de la ficha y explica lo que ocurre al pulsar.", "agrupamiento": "Individual", "ayudas": [{"tipo": "pista", "texto": "Al pulsar llega una pequeña corriente a la **base** → el transistor conduce entre **colector y emisor** → el LED se enciende."}]}, {"tipo": "quiz", "pregunta": "Si giras el potenciómetro y aumenta su resistencia, el LED…", "opciones": ["brilla más", "brilla menos", "no cambia", "se funde"], "correcta": 1, "explicacion": "Con la misma tensión y **más resistencia** pasa **menos corriente** (I = V / R): el LED brilla menos."}]}}, {"n": 8, "fase": "Desarrollo", "titulo": "Reto: montaje de circuitos físicos y simulados", "reto": "Calcular resistencias limitadoras, montar cuatro circuitos con LED (en Tinkercad y, si hay material, en protoboard) y explicar lo que se observa.", "actividades": [{"nombre": "Ponte a prueba", "min": 8, "desc": "Individual, en la plantilla A1 (reto «Montaje de circuitos»): calcular la resistencia limitadora de un LED de 1,5 V y 35 mA conectado a 9 V con la fórmula, los datos y el resultado."}, {"nombre": "Circuito 1: LED rojo con 330 Ω + 220 Ω", "min": 10, "desc": "Montaje del circuito 1 en Tinkercad (y en protoboard con el kit cuando haya material en el aula). Captura o foto en la plantilla y explicación de por qué se usan dos resistencias en serie (550 Ω ≥ 355 Ω)."}, {"nombre": "Circuito 2: tres LED en serie", "min": 12, "desc": "Calcular la resistencia para tres LED en serie (rojo 1,5 V, verde 2 V, amarillo 2 V) con 9 V e I = 15 mA: R = (9 − 5,5) / 0,015 ≈ 233 Ω, elegir el valor comercial y montarlo."}, {"nombre": "Circuitos 3 y 4: observar y explicar", "min": 12, "desc": "Circuito 3: LED transparente con 330 Ω + 220 Ω; circuito 4: LED pequeño en serie con un motor. Describir qué ocurre y explicarlo con lo aprendido (polarización, corriente, ley de Ohm)."}, {"nombre": "Revisión y entrega", "min": 8, "desc": "Cada estudiante repasa el «Antes de entregar» de la plantilla A1, la descarga en PDF y la sube a la Tarea 3.3."}], "criterios": ["TEC.4.1.2", "TEC.4.4.1"], "saberes": ["TEC.4.B.1", "TEC.4.C.2"], "metodologia": ["Aprendizaje por descubrimiento con simuladores", "Instrucción directa con práctica guiada"], "evidencias": ["Plantilla A1 con cálculos, capturas y explicaciones (Tarea 3.3)"], "recursos": ["Ordenadores", "Tinkercad Circuits", "Kits de electrónica", "Moodle Centros"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Plantilla A1 con huecos guiados y glosario español-árabe; fórmula en la propia plantilla; montaje físico o simulado a elegir según el material; prórroga de una sesión para quien la necesite."}, "ejercicios": ["Calcula la resistencia limitadora de un LED de 1,5 V y 35 mA conectado a 9 V.", "Monta el circuito 1 con un LED rojo y dos resistencias en serie de 330 Ω y 220 Ω.", "Calcula la resistencia para tres LED en serie con 9 V e I = 15 mA y monta el circuito 2.", "Monta los circuitos 3 y 4 y explica lo que observas."], "moodle": [{"recurso": "Tarea", "nombre": "3.3 · Reto: montaje de circuitos", "uso": "Evaluar con rúbrica la práctica de montaje de circuitos físicos y simulados (plantilla A1).", "correccion": "rubrica", "criterio": "TEC.4.4.1", "rubrica": [{"linea": "Cálculo de resistencias limitadoras (Ponte a prueba y circuito 2)", "criterio": "TEC.4.1.2", "niveles": ["1 pto: No hace los cálculos o no usa la ley de Ohm.", "3 ptos: Plantea la fórmula pero confunde los datos (no resta la tensión del LED o no pasa los mA a A) en los dos cálculos.", "5 ptos: Resuelve bien uno de los dos cálculos; en el otro hay un error de datos o de unidades.", "7 ptos: Resuelve bien los dos cálculos, pero sin unidades en algún paso o sin elegir el valor comercial adecuado.", "10 ptos: Resuelve bien los dos cálculos (≈ 214 Ω y ≈ 233 Ω) con fórmula, datos en unidades del SI, resultado en Ω y elige un valor comercial igual o superior."]}, {"linea": "Montaje de los circuitos 1 y 2 (protoboard o Tinkercad)", "criterio": "TEC.4.4.1", "niveles": ["1 pto: No monta ningún circuito.", "3 ptos: Monta un circuito, pero no funciona (LED al revés, filas de la protoboard mal usadas).", "5 ptos: Monta un circuito que funciona; el otro está incompleto o no funciona.", "7 ptos: Los dos circuitos funcionan, con algún detalle a mejorar (cables cruzados o resistencia de otro valor sin justificar).", " ": 30, "enunciado": "Copia la **plantilla A1** y haz los cuatro montajes en **Tinkercad** (o en protoboard si tienes kit). Pega las capturas y responde.", "pasos": ["Ponte a prueba: LED de 1,5 V y 35 mA a 9 V", "Circuito 1: LED rojo + 330 Ω + 220 Ω", "Circuito 2: tres LED en serie con I = 15 mA", "Circuitos 3 y 4: observa y explica"], "agrupamiento": "Individual", "enlace": "https://docs.google.com/document/d/1jok0BIrJ--xunsFvp-k50Ib4FPUlO4QnSe_8Ubx9gVI/copy"}, {"tipo": "pasos", "titulo": "Circuito 2 paso a paso", "pasos": ["Suma las tensiones: 1,5 + 2 + 2 = **5,5 V**", "Resta a la pila: 9 − 5,5 = **3,5 V**", "Pasa a amperios: 15 mA = **0,015 A**", "R = 3,5 / 0,015 ≈ **233 Ω** → valor comercial igual o superior"], "progresivo": true}, {"tipo": "quiz", "pregunta": "En el circuito 1 se ponen 330 Ω + 220 Ω en serie. ¿Cuánto vale la resistencia total?", "opciones": ["110 Ω", "355 Ω", "550 Ω", "72 600 Ω"], "correcta": 2, "explicacion": "En serie las resistencias **se suman**: 330 + 220 = **550 Ω**, mayor que los 355 Ω mínimos. El LED luce algo menos, pero está protegido."}, {"tipo": "practica", "titulo": "Antes de entregar", "tiempo": 8, "enunciado": "Repasa la lista final de la plantilla, descárgala en **PDF** y súbela.", "entrega": "Tarea 3.3 · Reto: montaje de circuitos"}]}}, {"n": 9, "fase": "Desarrollo", "titulo": "Taller III: construimos la ciudad y su alumbrado", "reto": "Construir calles, edificios y parking de la maqueta y montar las farolas con LED y su resistencia.", "actividades": [{"nombre": "Plan del día", "min": 5, "desc": "Cada pareja mira su plan de construcción del cuaderno A2 y se reparte las tareas de la sesión (quien construye edificios y parking, quien prepara las farolas)."}, {"nombre": "Construcción de la ciudad", "min": 22, "desc": "Pegado de calles y aceras, pasos de peatones, plazas de parking (comprobando con el coche patrón), edificios de cartulina o cartón, zonas verdes y huecos de la barrera del parking y de los semáforos para la parte 2."}, {"nombre": "Farolas con LED", "min": 18, "desc": "Las farolas se hacen con pajitas o palillos y un LED en la punta; los cables bajan por dentro y pasan bajo la base. Cada LED lleva su resistencia calculada y los LED se conectan en paralelo a la alimentación. Se prueban con la pila antes de fijarlos. El docente supervisa la pistola termofusible y, si hace falta, el soldador."}, {"nombre": "Diario y orden", "min": 5, "desc": "Entrada del diario de taller (qué hemos hecho, qué falló, cómo lo hemos arreglado) y recogida."}], "criterios": ["TEC.4.1.2", "TEC.4.2.2"], "saberes": ["TEC.4.A.1.1", "TEC.4.A.3.2", "TEC.4.B.1"], "metodologia": ["Aprendizaje Basado en Proyectos (ABP)", "Aprendizaje cooperativo por parejas"], "evidencias": ["Maqueta en construcción con farolas probadas", "Entrada del diario de taller"], "recursos": ["Taller", "LED, resistencias y cables", "Pistola termofusible", "Cartulinas y pajitas"], "dua": {"principios": ["Compromiso", "Acción y Expresión"], "medidas": "Tareas repartidas y visibles en el plan del cuaderno; demostración de una farola terminada; alumno repetidor como responsable de probar las farolas con la pila (tarea corta y con resultado inmediato)."}, "ejercicios": ["Construye las calles, el parking y los edificios de tu maqueta según el croquis.", "Monta las farolas con LED y su resistencia y pruébalas antes de fijarlas."], "clase": {"pregunta": "¿Cómo conectamos varias farolas para que, si una falla, las demás sigan encendidas?", "diapositivas": [{"tipo": "ejemplo", "icono": "🏘️", "titulo": "Las farolas de tu calle", "situacion": "Si se funde una farola de tu calle, **las demás siguen encendidas**.", "explicacion": "Están en **paralelo**. En la maqueta, cada LED con su resistencia se conecta en paralelo a la alimentación."}, {"tipo": "practica", "titulo": "Construimos la ciudad", "tiempo": 22, "enunciado": "Sigue tu **plan de construcción** del cuaderno A2 y tu croquis.", "pasos": ["Calles, aceras y pasos de peatones", "Plazas de parking ompromiso", "Andamiaje"], "medidas": "Niveles A, B y C a elegir en cada estación; soluciones visibles para autocorregirse; glosario de la prueba con traducción al árabe; el alumno repetidor recibe una lista de 4 cosas mínimas que debe dominar."}, "ejercicios": ["Calcula el valor nominal, máximo y mínimo de una resistencia a partir de sus colores.", "Calcula la resistencia limitadora de uno y de varios LED en serie.", "Indica la polarización de los diodos de un circuito y qué lámparas se encienden."], "clase": {"pregunta": "¿Qué me falta por dominar antes de la prueba?", "diapositivas": [{"tipo": "ejemplo", "icono": "⚽", "titulo": "El entrenamiento antes del partido", "situacion": "Antes de un partido no se juega uno entero: se entrenan **jugadas concretas** que salen en el partido.", "explicacion": "Hoy entrenamos las **cuatro jugadas** de la prueba: colores, ley de Ohm, polarización y componentes."}, {"tipo": "quiz", "pregunta": "Verde, azul, marrón, plata. ¿Valor y tolerancia?", "opciones": ["56 Ω ± 10 %", "560 Ω ± 10 %", "560 Ω ± 5 %", "5600 Ω ± 10 %"], "correcta": 1, "explicacion": "5 y 6 → 56; marrón × 10 → **560 Ω**; plata **± 10 %** → entre 504 Ω y 616 Ω."}, {"tipo": "multinivel", "titulo": "Estaciones de repaso", "texto": "En cada estación elige tu nivel. Tienes **7 minutos** por estación.", "opciones": [{"letra": "A", "titulo": "Recuerdo", "proceso": "Recordar", "enunciado": "Lee el valor de una resistencia o di qué hace una LDR."}, {"letra": "B", "titulo": "Aplico", "proceso": "Aplicar", "enunciado": "Calcula una resistencia limitadora o el máximo y mínimo de una resistencia."}, {"letra": "C", "titulo": "Analizo", "proceso": "Analizar", "enunciado": "Di qué lámparas y LED se encienden en un circuito con varios diodos y explica por qué."}]}, {"tipo": "practica", "titulo": "Las cuatro estaciones", "tiempo": 30, "enunciado": "Pasa por las cuatro estaciones y corrige con las soluciones.", "pasos": ["1 · Código de colores y tolerancia", "2 · Ley de Ohm: uno y varios LED", "3 · Polarización de diodos", "4 · Semiconductores, resistencias variables y transistor"], "agrupamiento": "Individual", "ayudas": [{"tipo": "pista", "texto": "Soluciones rápidas: 1) naranja-amarillo-naranja-oro = 34 kΩ ± 5 % (32,3-35,7 kΩ). 2) LED 1,5 V y 35 mA a 9 V ≈ 214 Ω. 3) Dos diodos opuestos en paralelo: siempre conduce uno. 4) NTC: ↑ temperatura → ↓ resistencia."}]}, {"tipo": "idea", "icono": "📝", "titulo": "Así es la prueba", "puntos": ["**10 preguntas** de 1 punto", "Resistencias, polarización y ley de Ohm", "Semiconductores, LDR, NTC y transistor", "Trae **calculadora**; las operaciones cuentan"]}]}}, {"n": 11, "fase": "Desarrollo", "titulo": "Prueba escrita de electrónica analógica", "reto": "Demostrar en una prueba individual lo aprendido sobre componentes, análisis de circuitos y cálculo de resistencias.", "actividades": [{"nombre": "Instrucciones", "min": 5, "desc": "Se reparte la prueba (versión en español y, para quien la necesite, con la traducción al árabe de los enunciados). Se recuerda que los valores máximo y mínimo y los cálculos deben estar justificados con operaciones."}, {"nombre": "Prueba escrita", "min": 40, "desc": "Individual: 10 preguntas de 1 punto (código de colores, polarización y P y N del diodo, verdadero o falso, resistencia limitadora, lámparas que se encienden, polarización de 8 diodos, opción múltiple, LED en serie, resistencias variables y transistor)."}, {"nombre": "Recogida", "min": 5, "desc": "Recogida de la prueba. Quien termine antes repasa sus operaciones. El alumnado con más tiempo concedido continúa en el recreo o en la sesión siguiente según lo acordado."}], "criterios": ["TEC.4.1.2", "TEC.4.4.1"], "saberes": ["TEC.4.B.1"], "metodologia": ["Evaluación formativa"], "evidencias": ["Prueba escrita (Tarea 3.4)"], "recursos": ["Prueba impresa", "Calculadora"], "dua": {"principios": ["Representación", "Acción y Expresión"], "medidas": "Versión bilingüe español-árabe de los enunciados y glosario; letra grande y is definitivos, cálculo de la resistencia de las farolas, diario de las cuatro sesiones de taller, foto de la maqueta sin personas y el apartado «¿A quién ayuda nuestra ciudad?»."}, {"nombre": "Revisión y entrega", "min": 10, "desc": "Cada pareja repasa el «Antes de entregar» del cuaderno A2, lo descarga en PDF y lo sube a la Tarea 3.5. Se anuncia la parte 2: programar farolas, barrera y semáforos y presentar la Smart City."}], "criterios": ["TEC.4.1.1", "TEC.4.1.2", "TEC.4.2.2"], "saberes": ["TEC.4.A.1.1", "TEC.4.B.1", "TEC.4.C.2"], "metodologia": ["Aprendizaje Basado en Proyectos (ABP)", "Aprendizaje por descubrimiento con simuladores"], "evidencias": ["Simulación del alumbrado en Tinkercad", "Cuaderno A2 con la foto de la maqueta (Tarea 3.5)"], "recursos": ["Ordenadores", "Tinkercad Circuits", "Moodle Centros"], "dua": {"principios": ["Acción y Expresión", "Andamiaje"], "medidas": "Lista «Antes de entregar» del cuaderno; captura de Tinkercad en lugar de esquema dibujado para quien lo necesite; la alumna con dificultades con el español puede apoyarse en el glosario y en frases modelo; prórroga de entrega a quien la necesite."}, "ejercicios": ["Simula en Tinkercad el alumbrado de tu maqueta.", "Completa y entrega el cuaderno de proyecto con la foto de la maqueta."], "clase": {"pregunta": "¿Está lista vuestra ciudad para programarla en la parte 2?", "diapositivas": [{"tipo": "ejemplo", "icono": "🧪", "titulo": "Probar antes de programar", "situacion": "Los ingenieros simulan un circuito antes de instalarlo en toda una calle.", "explicacion": "Hoy simulamos el **alumbrado** de la maqueta en Tinkercad: es el circuito que **programaremos en la parte 2**."}, {"tipo": "practica", "titulo": "El alumbrado en Tinkercad", "tiempo": 20, "enunciado": "Monta los **LED en paralelo con su resistencia**. Ampliación: añade el interruptor automático con **LDR y transistor BC547** y comprueba que se encienden al oscurecer.", "enlace": "https://florindotic.es/content/curso2026-2027/tecnologia/4-eso/teoria/electronica-analogica.html#circuitos", "agrupamiento": "Individual o por parejas"}, {"tipo": "quiz", "pregunta": "¿Por qué una farola LED con LDR ahorra energía?", "opciones": ["Porque el LED da más calor", "Porque gasta menos que una bombilla y solo se enciende cuando hace falta", "Porque la LDR produce electricidad", "No ahorra energía"], "correcta": 1, "explicacion": "El **LED** convierte más energía en luz y menos en calor, y la **LDR** hace que solo se encienda **cuando oscurece**."}, {"tipo": "practica", "titulo": "Completamos y entregamos el cuaderno", "tiempo": 30, "enunciado": "Terminad el **cuaderno de proyecto A2**, repasad el «Antes de entregar», descargadlo en PDF y subidlo.", "pasos": ["Croquis y tabla de medidas definitivos", "Cálculo de las resistencias de las farolas", "Diario de las cuatro sesiones de taller", "Foto de la maqueta **sin personas** y captura de Tinkercad"], "entrega": "Tarea 3.5 · Proyecto Smart City (parte 1): diseño y construcción", "agrupamiento": "Por parejas", "enlace": "https://docs.google.com/document/d/1tn0tp6d9x7MRft0Nf6QH9o7u48m15n_velyXWwjKPnc/copy"}]}, "moodle": [{"recurso": "Tarea", "nombre": "3.5 · Proyecto Smart City (parte 1): diseño y construcción", "uso": "Evaluar con rúbrica el diseño y la construcción de la maqueta de cada pareja a partir del cuaderno A2 (PDF con la foto) y de la maqueta revisada en el taller en la sesión 12.", "correccion": "rubrica", "criterio": "TEC.4.2.2", "rubrica": [{"linea": "Croquis a escala y planificación", "criterio": "TEC.4.1.1", "niveles": ["1 pto: No hay croquis o no tiene medidas.", "3 ptos: Croquis con pocas medidas; la escala no está calculada o no se aplica.", "5 ptos: Croquis con medidas y escala calculada, pero falta la ubicación de algún sistema o hay medidas mal pasadas a escala.", "7 ptos: Croquis completo y a escala con los tres sistemas ubicados; algún error menor de cotas o de anotaciones.", "10 ptos: Croquis detallado a escala con cotas, ubicación de upos: uno por pareja, agrupamiento «SdA3 Smart City» para la Tarea 3.5", "Finalización de actividad activada", "Prórrogas individuales en las Tareas para quien las necesite"], "area_texto": {"bloques": [{"nombre": "Bloque 1 · Fundamentos de electrónica", "descripcion": "Semiconductores, diodos, resistencias, ley de Ohm y transistor · Prácticas 3.1 y 3.2", "sesiones": "1-5"}, {"nombre": "Bloque 2 · Montajes y prueba escrita", "descripcion": "Tinkercad, reto de montaje 3.3 y prueba 3.4 · Taller de la Smart City", "sesiones": "6-11"}, {"nombre": "Bloque 3 · Smart City (parte 1)", "descripcion": "Terminamos la maqueta y entregamos el cuaderno · Tarea 3.5", "sesiones": "12-13"}], "eventos": [{"sesion": 11, "texto": "Prueba escrita de electrónica analógica", "tipo": "Se evalúa en clase"}], "nota_evaluacion": "Las prácticas **3.1 y 3.2** se corrigen como **Apto / No apto**. El **reto de montaje (3.3)** y el **proyecto Smart City (3.5)** se evalúan con rúbrica, y la **prueba escrita (3.4)** se puntúa de 0 a 10. La presentación de la Smart City se hará al terminar la parte 2.", "url_clase": "https://florindotic.es/content/curso2026-2027/tecnologia/4-eso/sda3/clase.html"}}, "seneca": {"justificacion": "El alumnado de 4.º ESO aprende los componentes de la electrónica analógica, calcula resistencias con la ley de Ohm y monta circuitos físicos y simulados. Lo aplica en la primera parte del reto Smart City: diseña a escala y construye por parejas la maqueta de un barrio inteligente con alumbrado de LED, parking y semáforos, que programará en la segunda parte.", "actividades": [{"titulo": "Reto: montaje de circuitos físicos y simulados", "tipo": "Estructuración", "abreviatura": "EST1", "tarea": "3.3", "sesiones": [1, 2, 4, 5, 7, 8], "trazabilidad": "RÚBRICA", "criterios": ["TEC.4.1.2", "TEC.4.4.1"]}, {"titulo": "Prueba escrita de electrónica analógica", "tipo": "Estructuración", "abreviatura": "EST2", "tarea": "3.4", "sesiones": [10, 11], "trazabilidad": "Prueba escrita", "criterios": ["TEC.4.1.2", "TEC.4.4.1"]}, {"titulo": "Smart City (parte 1): diseño y construcción", "tipo": "Conclusión", "abreviatura": "CON1", "tarea": "3.5", "sesiones": [3, 6, 9, 12, 13], "trazabilidad": "RÚBRICA", "criterios": ["TEC.4.1.1", "TEC.4.1.2", "TEC.4.2.2"]}]}, "notas_rigor": ["TEC.4.4.2 (IoT, robótica, IA) y TEC.4.6.3 (repercusión social del proyecto) se evaluarán en la parte 2 de la Smart City, junto con la programación de farolas, barrera y semáforos y la presentación ante la clase.", "La prueba escrita (Tarea 3.4) se califica con nota directa de 0 a 10 (cada pregunta 1 punto) y se vincula en Séneca a TEC.4.1.2 y TEC.4.4.1.", "TEC.4.C.2 (simuladores informáticos) no está vinculado oficialmente a los criterios elegidos; se usa porque los montajes simulados en Tinkercad forman parte del saber TEC.4.B.1 («montaje físico y simulado de circuitos elementales»).", "La parte 1 del reto deja construidos la barrera del parking y los semáforos sin programar; su automatización y la presentación se trabajan en la parte 2 (ficha «Reto Smart City parte 2» de la carpeta de Drive)."], "anexos": {"plantillas": [{"id": "A1", "titulo": "Reto · Montaje de circuitos", "sesiones": [8], "agrupamiento": "Individual", "herramienta": "Google Docs (una copia por estudiante)", "entrega": "la Tarea 3.3 (PDF)", "docente": "Adaptación para entregar en digital de la ficha «Reto · Montaje de circuitos». Si hay kits en el aula, quien monte en protoboard pega una foto en lugar de la captura de Tinkercad. Comprueba el LED «transparente» del circuito 3 antes de la sesión (si es infrarrojo, su luz solo se ve con la cámara del móvil).", "instrucciones": "Escribe siempre **fórmula → datos → resultado con unidades**. Pega una **captura** de Tinkercad (o una foto del montaje) en cada circuito.", "bloques": [{"titulo": "Ponte a prueba", "texto": "Calcula la resistencia de limitación para proteger un LED de **VD = 1,5 V** e **I = 35 mA** conectado a **9 V**. Recuerda: R = (Vcc − VD) / I.", "campos": ["Datos (en V y A)", "Operación", "Resultado (Ω)", "Valor comercial que elegirías y por qué"], "alto": 1.2}, {"titulo": "Circuito 1 · LED rojo con 330 Ω + 220 Ω", "campos": ["Captura o foto del montaje", "¿Se enciende el LED? ¿Brilla mucho o poco?", "¿Por qué usamos 330 Ω + 220 Ω en lugar de 355 Ω? ¿Cuánto vale la resistencia total?"], "alto": 2.2}, {"titulo": "Circuito 2 · Tres LED en serie (I = 15 mA, pila de 9 V)", "tabla": {"columnas": ["LED", "Tensión VD (V)"], "filas": [["Rojo", "1,5"], ["Verde", "2"], ["Amarillo", "2"], ["Suma de tensiones", ""]], "anchos": [8, 8], "alto": 0.9}}, {"campos": ["Operación R = (9 − suma de VD) / I", "Resultado (Ω) y valor comercial elegido", "Captura o foto del montaje"], "alto": 1.8}, {"titulo": "Circuito 3 · LED transparente con 330 Ω + 220 Ω", "campos": ["Captura o foto del montaje", "¿Qué observas? (¿se ve luz? mira también con la cámara del móvil)", "¿Por qué crees que ocurre?"], "alto": 1.8}, {"titulo": "Circuito 4 · LED pequeño en serie con un motor", "campos": ["Captura o foto del montaje", "¿Qué ocurre con el LED y con el motor?", "Explícalo con la ley de Ohm (¿cuánta corriente puede pasar?)"], "alto": 1.8}, {"titulo": "Glosario · مسرد", "tabla": {"columnas": ["Español", "العربية"], "filas": [["Resistencia", "مقاومة"], ["Tensión / voltaje", "جهد كهربائي"], ["Intensidad de corriente", "شدة التيار"], ["Diodo LED", "ثنائي باعث للضوء"], ["Polarización directa / inversa", "انحياز أمامي / عكسي"], ["En serie / en paralelo", "على التوالي / على التوازي"]], "anchos": [8, 8], "alto": 0.8}}, {"titulo": "Antes de entregar", "casillas": ["He resuelto los dos cálculos con fórmula, datos en V y A, y resultado en Ω.", "Mis circuitos 1 y 2 funcionan y he pegado su captura o foto.", "He descrito y explicado lo que pasa en los circuitos 3 y 4.", "Mi documento está ordenado y lo entrego en PDF en la Tarea 3.3."]}], "enlace": "https://docs.google.com/document/d/1jok0BIrJ--xunsFvp-k50Ib4FPUlO4QnSe_8Ubx9gVI/copy"}, {"id": "A2", "titulo": "Cuaderno de proyecto Smart City", "sesiones": [3, 6, 9, 12, 13], "agrupamiento": "Por parejas", "herramienta": "Google Docs (una copia por pareja, compartida entre sus miembros)", "entrega": "la Tarea 3.5 (PDF)", "docente": "Cada pareja hace su copia en la sesión 3 y la comparte con su compañero o compañera. El diario de taller se completa al final de cada sesión de taller (3, 6, 9 y 12) y el cuaderno se entrega en la sesión 13. La foto de la maqueta no debe mostrar personas.", "instrucciones": "Rellenad el cuaderno **en cada sesión de taller**. El croquis podéis hacerlo a mano y pegar una foto.", "bloques": [{"titulo": "1 · Pareja y reparto", "campos": ["Nombre de nuestra Smart City", "Responsable de diseño", "Responsable de electrónica", "(Trío) Responsable de documentación"], "alto": 0.9}, {"titulo": "2 · Nuestra escala", "tabla": {"columnas": ["Ancho del coche de juguete (cm)", "Ancho de un coche real (cm)", "Escala = juguete / real", "Escala simplificada (1:…)"], "filas": [["", "180", "", ""]], "anchos": [4, 4, 4, 4], "alto": 1.0}, "texto": "Ejemplo: 3 cm / 180 cm = 1/60 → **1:60**. Con 1:60, el panel de 30 × 40 cm representa 18 m × 24 m reales."}, {"titulo": "3 · Medidas reales y en la maqueta", "tabla": {"columnas": ["Elemento", "Medida real (cm)", "÷ escala", "Medida en la maqueta (cm)"], "filas": [["Carril de la calle", "350", "", ""], ["Acera", "200", "", ""], ["Plaza de parking (ancho × largo)", "250 × 500", "", ""], ["Paso de peatones (ancho)", "400", "", ""], ["Farola (altura)", "500", "", ""], ["Semáforo (altura)", "300", "", ""], ["Edificio de 4 plantas (altura)", "1200", "", ""]], "anchos": [5.4, 3.4, 2.6, 4.6], "alto": 0.85}}, {"titulo": "4 · Croquis detallado", "texto": "Dibujad la ciudad con **cotas** y anotaciones: farolas, semáforos, barrera del parking, zonas verdes y recorrido de los cables. Podéis pegar una foto del croquis a mano.", "lineas": 14}, {"titulo": "5 · Plan de construcción", "tabla": {"columnas": ["Tarea", "Quién", "Sesión", "Hecho"], "filas": [["Trazar calles y aceras en la base"], ["Plazas de parking y barrera"], ["Edificios y zonas verdes"], ["Farolas con LED y resistencia"], ["Torretas de los semáforos"], ["Cableado bajo la base y etiquetas"]], "anchos": [7, 3.5, 2.5, 2.5], "alto": 0.85}}, {"titulo": "6 · El circuito del alumbrado", "campos": ["Esquema del circuito (foto o captura de Tinkercad)", "Cálculo de la resistencia de cada farola: R = (Vcc − VD) / I", "¿Por qué conectamos las farolas en paralelo?", "Ampliación: ¿cómo se enciende solo con la LDR y el transistor?"], "alto": 1.6}, {"titulo": "7 · Diario de taller", "tabla": {"columnas": ["Sesión", "Qué hemos hecho", "Problema que tuvimos", "Cómo lo resolvimos"], "filas": [["3"], ["6"], ["9"], ["12"]], "anchos": [1.8, 5, 4.6, 4.6], "alto": 1.6}}, {"titulo": "8 · Foto de la maqueta terminada", "texto": "Pegad una foto de la maqueta **sin personas**.", "lineas": 8}, {"titulo": "9 · ¿A quién ayuda nuestra ciudad?", "campos": ["Qué problema real de Mijas o de vuestro barrio resuelve", "Cómo ahorra energía o mejora la movilidad"], "alto": 1.3}, {"titulo": "Antes de entregar", "casillas": ["Tenemos la escala calculada y la tabla de medidas completa.", "El croquis tiene cotas y la ubicación de los tres sistemas.", "El diario tiene una entrada por cada sesión de taller, con problemas y soluciones.", "Hay foto de la maqueta (sin personas) y captura del alumbrado en Tinkercad.", "Entregamos el PDF en la Tarea 3.5."]}], "enlace": "https://docs.google.com/document/d/1tn0tp6d9x7MRft0Nf6QH9o7u48m15n_velyXWwjKPnc/copy"}], "formularios": [{"id": "F1", "titulo": "Diagnóstico inicial: ¿qué sé de electrónica?", "sesiones": [1], "anonimo": true, "obligatorias": true, "descripcion": "Cuestionario anónimo para saber qué conoces de electrónica antes de empezar. No cuenta para nota.", "confirmacion": "¡Gracias! Veremos los resultados de la clase juntos.", "preguntas": [{"tipo": "opcion", "titulo": "¿Qué es un LED?", "opciones": ["Un tipo de bombilla de filamento", "Un diodo que emite luz", "Una resistencia que brilla", "No lo sé"]}, {"tipo": "opcion", "titulo": "¿Para qué sirve una resistencia en un circuito con un LED?", "opciones": ["Para que brille más", "Para limitar la corriente y que no se queme", "Para guardar energía", "No lo sé"]}, {"tipo": "opcion", "titulo": "¿Un diodo deja pasar la corriente en los dos sentidos?", "opciones": ["Sí", "No, solo en un sentido", "Depende del color", "No lo sé"]}, {"tipo": "opcion", "titulo": "¿Cuál de estos materiales es un semiconductor?", "opciones": ["Cobre", "Plástico", "Silicio", "No lo sé"]}, {"tipo": "opcion", "titulo": "¿Has usado alguna vez una protoboard (placa de prototipos)?", "opciones": ["Sí, varias veces", "Una vez", "Nunca", "No sé qué es"]}, {"tipo": "opcion", "titulo": "¿Has usado Tinkercad Circuits?", "opciones": ["Sí", "Solo Tinkercad 3D", "No"]}, {"tipo": "escala", "titulo": "¿Cuánto te interesa construir una maqueta de ciudad inteligente?", "min": 1, "max": 5, "etiquetas": ["Nada", "Mucho"]}, {"tipo": "parrafo", "titulo": "Nombra un aparato de tu casa que creas que tiene electrónica y di qué hace.", "obligatoria": false}]}]}}, "cur": {"TEC.4.1": {"tipo": "ce", "texto": "Identificar y proponer problemas tecnológicos con iniciativa y creatividad, estudiando las necesidades de su entorno próximo y aplicando estrategias y procesos colaborativos e iterativos relativos a proyectos, para idear y planificar soluciones de manera eficiente, accesible, sostenible e innovadora.", "descriptores": ["STEM1", "STEM2", "CD1", "CD3", "CPSAA3", "CPSAA4", "CE1", "CE3"]}, "TEC.4.2": {"tipo": "ce", "texto": "Aplicar de forma apropiada y segura distintas técnicas y conocimientos interdisciplinares, utilizando procedimientos y recursos tecnológicos y analizando el ciclo de vida de productos para fabricar soluciones tecnológicas accesibles y sostenibles que den respuesta a necesidades planteadas.", "descriptores": ["STEM2", "STEM5", "CD2", "CPSAA4", "CC4", "CCEC4"]}, "TEC.4.3": {"tipo": "ce", "texto": "Expresar, comunicar y difundir ideas, propuestas o soluciones tecnológicas en diferentes foros de manera efectiva, usando un lenguaje inclusivo y no sexista, empleando los recursos disponibles y aplicando los elementos y técnicas necesarias, para intercambiar la información de manera responsable y fomentar el trabajo en equipo.", "descriptores": ["CCL1", "STEM4", "CD3", "CPSAA3", "CCEC3"]}, "TEC.4.4": {"tipo": "ce", "texto": "Desarrollar soluciones automatizadas a problemas planteados, aplicando los conocimientos necesarios e incorporando tecnologías emergentes, para diseñar y construir sistemas de control programables y robóticos.", "descriptores": ["CP2", "STEM1", "STEM3", "CD5", "CPSAA5", "CE3"]}, "TEC.4.5": {"tipo": "ce", "texto": "Aprovechar y emplear de manera responsable las posibilidades de las herramientas digitales, adaptándolas a sus necesidades, configurándolas y aplicando conocimientos interdisciplinares, para la resolución de tareas de una manera más eficiente.", "descriptores": ["CP2", "CD2", "CD5", "CPSAA4", "CPSAA5"]}, "TEC.4.6": {"tipo": "ce", "texto": "Analizar procesos tecnológicos, teniendo en cuenta su impacto en la sociedad y el entorno, aplicando criterios de sostenibilidad y accesibilidad para hacer un uso ético y ecosocialmente responsable de la tecnología.", "descriptores": ["STEM2", "STEM5", "CD4", "CC4"]}, "TEC.4.1.1": {"tipo": "cr", "texto": "Idear y planificar soluciones tecnológicas emprendedoras que generen un valor para la comunidad, a partir de la observación y el análisis del entorno más cercano, estudiando sus necesidades, requisitos y posibilidades de mejora.", "competencia": "TEC.4.1", "saberes": ["TEC.4.A.1"]}, "TEC.4.1.2": {"tipo": "cr", "texto": "Aplicar con iniciativa estrategias colaborativas de gestión de proyectos y técnicas de resolución de problemas iterativas e innovadoras que den lugar a la elaboración o mejora de soluciones a problemas detectados.", "competencia": "TEC.4.1", "saberes": ["TEC.4.A.1"]}, "TEC.4.1.3": {"tipo": "cr", "texto": "Mostrar interés en procesos de toma de decisiones, gestionando las emociones de forma adecuada, respetando las estructuras de gestión del grupo y la función de cada miembro para favorecer el éxito del proyecto en equipo.", "competencia": "TEC.4.1", "saberes": ["TEC.4.A.1"]}, "TEC.4.2.1": {"tipo": "cr", "texto": "Diseñar y construir un producto que responda a una necesidad detectada, mediante la integración de operadores mecánicos, electrónicos o neumáticos, analizando su ciclo de vida y utilizando materiales y procesos eficientes.", "competencia": "TEC.4.2", "saberes": ["TEC.4.A.2", "TEC.4.A.3.1", "TEC.4.D.4"]}, "TEC.4.2.2": {"tipo": "cr", "texto": "Fabricar productos o sistemas tecnológicos adaptados a las necesidades planteadas empleando técnicas de fabricación manuales, mecánicas y digitales y herramientas de diseño asistido por computador con destreza y rigor en el proceso de trabajo.", "competencia": "TEC.4.2", "saberes": ["TEC.4.A.2.2", "TEC.4.A.3"]}, "TEC.4.3.1": {"tipo": "cr", "texto": "Intercambiar información e ideas trabajando en equipo de manera eficaz, colaborativa y ética en entornos virtuales, haciendo uso de un lenguaje técnico, preciso y adecuado, así como un lenguaje inclusivo y no sexista.", "competencia": "TEC.4.3", "saberes": ["TEC.4.A.1.1", "TEC.4.A.1.4", "TEC.4.A.3.1", "TEC.4.A.4"]}, "TEC.4.3.2": {"tipo": "cr", "texto": "Presentar y difundir las propuestas y soluciones tecnológicas de manera efectiva, cuidando la entonación, expresión, gestión del tiempo y adaptación al contexto, con lenguaje inclusivo, no sexista e impacto visual positivo.", "competencia": "TEC.4.3", "saberes": ["TEC.4.A.1.4", "TEC.4.A.4"]}, "TEC.4.4.1": {"tipo": "cr", "texto": "Diseñar, construir, controlar o simular sistemas automáticos o robots empleando los elementos físicos (hardware), así como programas de control y lenguajes de programación adecuados (software), respondiendo a una necesidad concreta.", "competencia": "TEC.4.4", "saberes": ["TEC.4.B.1", "TEC.4.B.2", "TEC.4.B.3", "TEC.4.B.4"]}, "TEC.4.4.2": {"tipo": "cr", "texto": "Integrar en los sistemas o soluciones tecnológicas aplicaciones informáticas y tecnologías emergentes, tales como internet de las cosas (IoT), robótica, inteligencia artificial o big data con sentido crítico y ético.", "competencia": "TEC.4.4", "saberes": ["TEC.4.C.1", "TEC.4.C.2", "TEC.4.C.3", "TEC.4.C.4"]}, "TEC.4.5.1": {"tipo": "cr", "texto": "Usar con destreza y autonomía diferentes herramientas y plataformas digitales, aplicando conocimientos interdisciplinares en la resolución de tareas complejas.", "competencia": "TEC.4.5", "saberes": ["TEC.4.A.1.4", "TEC.4.A.3", "TEC.4.C.1", "TEC.4.C.2"]}, "TEC.4.6.1": {"tipo": "cr", "texto": "Hacer un uso responsable de la tecnología, analizando el impacto de aplicación de criterios de sostenibilidad y accesibilidad en la selección de materiales y en el diseño de productos, así como en los procesos de fabricación de soluciones tecnológicas, minimizando el impacto negativo en la sociedad y en el planeta.", "competencia": "TEC.4.6", "saberes": ["TEC.4.A.2", "TEC.4.D.1", "TEC.4.D.2", "TEC.4.D.3"]}, "TEC.4.6.2": {"tipo": "cr", "texto": "Valorar la contribución de las tecnologías en la búsqueda de soluciones sostenibles para el desarrollo de productos y la consecución de los Objetivos de Desarrollo Sostenible (ODS).", "competencia": "TEC.4.6", "saberes": ["TEC.4.A.2", "TEC.4.D.1", "TEC.4.D.2", "TEC.4.D.3"]}, "TEC.4.6.3": {"tipo": "cr", "texto": "Identificar y valorar la repercusión y las oportunidades del desarrollo de proyectos tecnológicos con responsabilidad social, por medio de comunidades abiertas, acciones de voluntariado y proyectos de servicio a la comunidad.", "competencia": "TEC.4.6", "saberes": ["TEC.4.D.2", "TEC.4.D.3", "TEC.4.D.4"]}, "TEC.4.A": {"tipo": "sb", "texto": "Proceso de resolución de problemas.", "hijos": ["TEC.4.A.1", "TEC.4.A.2", "TEC.4.A.3", "TEC.4.A.4"], "criterios": []}, "TEC.4.A.1": {"tipo": "sb",
