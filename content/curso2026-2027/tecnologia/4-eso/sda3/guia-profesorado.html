unto de vista creativo, crítico y personal a la par que respetuoso con la propiedad intelectual.", "competencias": []}, "CCL4": {"tipo": "de", "texto": "Lee con autonomía obras diversas adecuadas a su edad, seleccionando las que mejor se ajustan a sus gustos e intereses; aprecia el patrimonio literario como cauce privilegiado de la experiencia individual y colectiva; y moviliza su propia experiencia biográfica y sus conocimientos literarios y culturales para construir y compartir su interpretación de las obras y para crear textos de intención literaria de progresiva complejidad.", "competencias": []}, "CCL5": {"tipo": "de", "texto": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas, evitando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "competencias": []}, "CP1": {"tipo": "de", "texto": "Usa eficazmente una o más lenguas, además de la lengua o lenguas familiares, para responder a sus necesidades comunicativas, de manera apropiada y adecuada tanto a su desarrollo e intereses como a diferentes situaciones y contextos de los ámbitos personal, social, educativo y profesional.", "competencias": []}, "CP2": {"tipo": "de", "texto": "A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.", "competencias": ["TEC.4.4"]}, "CP3": {"tipo": "de", "texto": "Conoce, valora y respeta la diversidad lingüística y cultural presente en la sociedad, integrándola en su desarrollo personal como factor de diálogo, para fomentar la cohesión social.", "competencias": []}, "STEM1": {"tipo": "de", "texto": "Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.", "competencias": ["TEC.4.1", "TEC.4.4"]}, "STEM2": {"tipo": "de", "texto": "Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.", "competencias": ["TEC.4.1", "TEC.4.2"]}, "STEM3": {"tipo": "de", "texto": "Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "competencias": ["TEC.4.4"]}, "STEM4": {"tipo": "de", "texto": "Interpreta y transmite los elementos más relevantes de procesos, razonamientos, demostraciones, métodos y resultados científicos, matemáticos y tecnológicos de forma clara y precisa y en diferentes formatos (gráficos, tablas, diagramas, fórmulas, esquemas, símbolos...), y aprovechando de forma crítica la cultura digital e incluyendo el lenguaje matemático-formal, con ética y responsabilidad para compartir y construir nuevos conocimientos.", "competencias": []}, "STEM5": {"tipo": "de", "texto": "Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "competencias": ["TEC.4.2"]}, "CD1": {"tipo": "de", "texto": "Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.", "competencias": ["TEC.4.1"]}, "CD2": {"tipo": "de", "texto": "Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.", "competencias": ["TEC.4.2"]}, "CD3": {"tipo": "de", "texto": "Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.", "competencias": ["TEC.4.1"]}, "CD4": {"tipo": "de", "texto": "Identifica riesgos y adopta medidas preventivas al usar las tecnologías digitales para proteger los dispositivos, los datos personales, la salud y el medioambiente, y para tomar conciencia de la importancia y necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de dichas tecnologías.", "competencias": []}, "CD5": {"tipo": "de", "texto": "Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.", "competencias": ["TEC.4.4"]}, "CPSAA1": {"tipo": "de", "texto": "Regula y expresa sus emociones, fortaleciendo el optimismo, la resiliencia, la autoeficacia y la búsqueda de propósito y motivación hacia el aprendizaje, para gestionar los retos y cambios y armonizarlos con sus propios objetivos.", "competencias": []}, "CPSAA2": {"tipo": "de", "texto": "Comprende los riesgos para la salud relacionados con factores sociales, consolida estilos de vida saludable a nivel físico y mental, reconoce conductas contrarias a la convivencia y aplica estrategias para abordarlas.", "competencias": []}, "CPSAA3": {"tipo": "de", "texto": "Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.", "competencias": ["TEC.4.1"]}, "CPSAA4": {"tipo": "de", "texto": "Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.", "competencias": ["TEC.4.1", "TEC.4.2"]}, "CPSAA5": {"tipo": "de", "texto": "Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.", "competencias": ["TEC.4.4"]}, "CC1": {"tipo": "de", "texto": "Analiza y comprende ideas relativas a la dimensión social y ciudadana de su propia identidad, así como a los hechos culturales, históricos y normativos que la determinan, demostrando respeto por las normas, empatía, equidad y espíritu constructivo en la interacción con los demás en cualquier contexto.", "competencias": []}, "CC2": {"tipo": "de", "texto": "Analiza y asume fundadamente los principios y valores que emanan del proceso de integración europea, la Constitución española y los derechos humanos y de la infancia, participando en actividades comunitarias, como la toma de decisiones o la resolución de conflictos, con actitud democrática, respeto por la diversidad, y compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial.", "competencias": []}, "CC3": {"tipo": "de", "texto": "Comprende y analiza problemas éticos fundamentales y de actualidad, considerando críticamente los valores propios y ajenos, y desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa, respetuosa, y opuesta a cualquier tipo de discriminación o violencia.", "competencias": []}, "CC4": {"tipo": "de", "texto": "Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.", "competencias": ["TEC.4.2"]}, "CE1": {"tipo": "de", "texto": "Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.", "competencias": ["TEC.4.1"]}, "CE2": {"tipo": "de", "texto": "Evalúa las fortalezas y debilidades propias, haciendo uso de estrategias de autoconocimiento y autoeficacia, y comprende los elementos fundamentales de la economía y las finanzas, aplicando conocimientos económicos y financieros a actividades y situaciones concretas, utilizando destrezas que favorezcan el trabajo colaborativo y en equipo, para reunir y optimizar los recursos necesarios que lleven a la acción una experiencia emprendedora que genere valor.", "competencias": []}, "CE3": {"tipo": "de", "texto": "Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.", "competencias": ["TEC.4.1", "TEC.4.4"]}, "CCEC1": {"tipo": "de", "texto": "Conoce, aprecia críticamente y respeta el patrimonio cultural y artístico, implicándose en su conservación y valorando el enriquecimiento inherente a la diversidad cultural y artística.", "competencias": []}, "CCEC2": {"tipo": "de", "texto": "Disfruta, reconoce y analiza con autonomía las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, distinguiendo los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "competencias": []}, "CCEC3": {"tipo": "de", "texto": "Expresa ideas, opiniones, sentimientos y emociones por medio de producciones culturales y artísticas, integrando su propio cuerpo y desarrollando la autoestima, la creatividad y el sentido del lugar que ocupa en la sociedad, con una actitud empática, abierta y colaborativa.", "competencias": []}, "CCEC4": {"tipo": "de", "texto": "Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.", "competencias": ["TEC.4.2"]}}, "idx": {"criterios": ["TEC.4.1.1", "TEC.4.1.2", "TEC.4.2.2", "TEC.4.4.1"], "competencias": ["TEC.4.1", "TEC.4.2", "TEC.4.4"], "saberes": ["TEC.4.A.1.1", "TEC.4.A.1.2", "TEC.4.A.3.2", "TEC.4.B.1", "TEC.4.C.2"], "descriptores": ["CC4", "CCEC4", "CD1", "CD2", "CD3", "CD5", "CE1", "CE3", "CP2", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM2", "STEM3", "STEM5"], "sesionesPorCriterio": {"TEC.4.4.1": [2, 4, 5, 7, 8, 10, 11], "TEC.4.1.1": [3, 6, 13], "TEC.4.1.2": [6, 8, 9, 10, 11, 12, 13], "TEC.4.2.2": [6, 9, 12, 13]}, "porMateria": [{"codigo": "TEC", "criterios": ["TEC.4.1.1", "TEC.4.1.2", "TEC.4.2.2", "TEC.4.4.1"], "competencias": ["TEC.4.1", "TEC.4.2", "TEC.4.4"], "saberes": ["TEC.4.A.1.1", "TEC.4.A.1.2", "TEC.4.A.3.2", "TEC.4.B.1", "TEC.4.C.2"], "descriptores": ["CC4", "CCEC4", "CD1", "CD2", "CD3", "CD5", "CE1", "CE3", "CP2", "CPSAA3", "CPSAA4", "CPSAA5", "STEM1", "STEM2", "STEM3", "STEM5"]}], "materiasTxt": "Tecnología", "mapaAlumnado": {"TEC.4.1.1": [], "TEC.4.1.2": [], "TEC.4.2.2": [], "TEC.4.4.1": []}, "multinivel": []}, "seneca": {"titulo": "SdA 3: Electrónica analógica", "temporalizacion": "13 sesiones", "justificacion": "El alumnado de 4.º ESO aprende los componentes de la electrónica analógica, calcula resistencias con la ley de Ohm y monta circuitos físicos y simulados. Lo aplica en la primera parte del reto Smart City: diseña a escala y construye por parejas la maqueta de un barrio inteligente con alumbrado de LED, parking y semáforos, que programará en la segunda parte.", "producto_final": "Maqueta de Smart City de 30 × 40 cm diseñada a escala (según un coche de juguete) y construida por parejas, con alumbrado de LED y su circuito y los espacios del parking con barrera y de los semáforos preparados para programarlos en la parte 2, más el cuaderno de proyecto (escala, croquis, cálculos y diario de taller). La presentación ante la clase se hará al terminar la parte 2.", "concrecion": [{"materia": "Tecnología", "texto": "COMPETENCIAS ESPECÍFICAS\nTEC.4.1.Identificar y proponer problemas tecnológicos con iniciativa y creatividad, estudiando las necesidades de su entorno próximo y aplicando estrategias y procesos colaborativos e iterativos relativos a proyectos, para idear y planificar soluciones de manera eficiente, accesible, sostenible e innovadora.\nTEC.4.2.Aplicar de forma apropiada y segura distintas técnicas y conocimientos interdisciplinares, utilizando procedimientos y recursos tecnológicos y analizando el ciclo de vida de productos para fabricar soluciones tecnológicas accesibles y sostenibles que den respuesta a necesidades planteadas.\nTEC.4.4.Desarrollar soluciones automatizadas a problemas planteados, aplicando los conocimientos necesarios e incorporando tecnologías emergentes, para diseñar y construir sistemas de control programables y robóticos.\n\nCRITERIOS DE EVALUACIÓN\nTEC.4.1.1.Idear y planificar soluciones tecnológicas emprendedoras que generen un valor para la comunidad, a partir de la observación y el análisis del entorno más cercano, estudiando sus necesidades, requisitos y posibilidades de mejora.\nTEC.4.1.2.Aplicar con iniciativa estrategias colaborativas de gestión de proyectos y técnicas de resolución de problemas iterativas e innovadoras que den lugar a la elaboración o mejora de soluciones a problemas detectados.\nTEC.4.2.2.Fabricar productos o sistemas tecnológicos adaptados a las necesidades planteadas empleando técnicas de fabricación manuales, mecánicas y digitales y herramientas de diseño asistido por computador con destreza y rigor en el proceso de trabajo.\nTEC.4.4.1.Diseñar, construir, controlar o simular sistemas automáticos o robots empleando los elementos físicos (hardware), así como programas de control y lenguajes de programación adecuados (software), respondiendo a una necesidad concreta.\n\nSABERES BÁSICOS\nTEC.4.A.1.1.Estrategias de gestión de proyectos colaborativos y técnicas de resolución de problemas iterativas.\nTEC.4.A.1.2.Estudio de necesidades del centro, locales y de la Comunidad Autónoma Andaluza. Planteamiento de proyectos colaborativos o cooperativos.\nTEC.4.A.3.2.Técnicas de fabricación manual y mecánica. Aplicaciones prácticas.\nTEC.4.B.1.Electrónica analógica. Componentes básicos, simbología, análisis y montaje físico y simulado de circuitos elementales.\nTEC.4.C.2.El ordenador y los dispositivos móviles como elementos de programación y control. Trabajo con simuladores informáticos en la verificación y comprobación del funcionamiento de los sistemas diseñados. Iniciación a las aplicaciones de inteligencia artificial y el big data. Espacios compartidos y discos virtuales.\n\nDESCRIPTORES OPERATIVOS\nCC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCP2. A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable."}], "actividades": [{"titulo": "Reto: montaje de circuitos físicos y simulados", "tipo": "Estructuración", "abreviatura": "EST1", "orden": "1", "tarea": "3.3 · Reto: montaje de circuitos", "descripcion": "Sesión 1 (50 min): ¿Qué hay dentro de tu móvil? Electricidad, electrónica y semiconductores\nReto: Distinguir electricidad y electrónica, clasificar materiales en conductores, aislantes y semiconductores y entender qué es un semiconductor tipo P y tipo N.\n- Gancho: la placa por dentro (8 min). El docente enseña la placa de un aparato viejo (router, mando o móvil roto) y pregunta: «¿Qué hacen estas piezas tan pequeñas? ¿Por qué un cargador no es solo un cable?». Se anotan las ideas en la pizarra. Se pide que para la sesión 3 traigan un coche de juguete pequeño (si no hay, el taller presta uno).\n- Diagnóstico inicial (F1) (7 min). Cuestionario anónimo F1 (Google Forms) de 8 preguntas: qué es un LED, para qué sirve una resistencia, si un diodo deja pasar la corriente en los dos sentidos, qué es una protoboard. El docente proyecta los resultados agregados al terminar.\n- Electricidad o electrónica (10 min). Con la web de teoría (apartado Introducción): la electricidad transforma la energía (lámpara, motor); la electrónica controla y procesa señales con bajas tensiones (móvil: pantalla táctil, cámara, sonido). Actividad rápida: el alumnado clasifica 6 aparatos (tostadora, consola, ventilador, router, plancha, mando a distancia) según si su función principal es eléctrica o electrónica.\n- Conductores, aislantes y semiconductores (15 min). Explicación con el apartado «Componentes» de la web de teoría y su actividad de clasificar materiales. Silicio (segundo elemento más abundante de la corteza terrestre) y germanio: a baja temperatura son aislantes y al subir la temperatura algunos electrones se liberan de sus enlaces covalentes. Dopado: tipo N (átomos pentavalentes como P o As, sobran electrones) y tipo P (trivalentes como B o Al, sobran huecos). Se insiste en el vocabulario de la Práctica 1 (intrínseco, extrínseco o dopado, hueco, electrón de valencia).\n- El diodo: la unión PN (10 min). Simulador «Gira la pila y observa qué hace el diodo» de la web de teoría: polarización directa (positivo de la pila al ánodo, conduce si supera la tensión umbral) e inversa (la unión PN se ensancha y no conduce). Cada estudiante copia en el cuaderno el símbolo del diodo con ánodo, cátodo, zona P y zona N.\n- Evidencia: Cuestionario diagnóstico F1\n- Evidencia: Clasificación de aparatos y materiales en el cuaderno\n\nSesión 2 (50 min): Diodos, LED y resistencias: el código de colores y la ley de Ohm\nReto: Saber cuándo se enciende un LED en un circuito, leer el valor y la tolerancia de una resistencia y calcular la resistencia limitadora de un LED.\n- Repaso relámpago (5 min). Quiz de la web de clase sobre la sesión 1 (semiconductor tipo N, polarización directa).\n- El LED: patilla larga, patilla corta (8 min). Se reparte un LED por mesa: la patilla larga es el ánodo (+) y la corta, junto al lado plano, el cátodo (−). Como cualquier diodo, solo emite luz en polarización directa. Ejemplos: semáforos, pantallas, luces del coche.\n- ¿Qué bombillas se encienden? (10 min). El docente resuelve en la pizarra el circuito a) de la Práctica 1 siguiendo el camino de la corriente desde el polo positivo; el alumnado resuelve el b) en el cuaderno y se corrige en voz alta. Estrategia: marcar en cada diodo PD o PI y tachar las ramas con un diodo en inversa.\n- Resistencias fijas y código de colores (12 min). Con el laboratorio «Elige los colores y lee el valor» de la web de teoría: 1.ª cifra, 2.ª cifra, multiplicador y tolerancia. Ejemplo resuelto: rojo-violeta-amarillo-oro = 27 × 10 kΩ = 270 kΩ ± 5 %, valor máximo 283,5 kΩ y mínimo 256,5 kΩ. El alumnado lee dos resistencias del kit.\n- Ley de Ohm: la resistencia del LED (10 min). V = I × R. Problema de la ficha: LED rojo de 1,9 V y 20 mA con una pila de 9 V → R = (9 − 1,9) / 0,02 = 355 Ω. Se explica por qué se elige el valor comercial superior (si no está, se ponen dos en serie: 330 Ω + 220 Ω = 550 Ω).\n- Salida (5 min). Cada estudiante calcula en el cuaderno la resistencia para un LED de 2 V y 15 mA con 9 V (≈ 467 Ω) y la enseña al salir.\n- Evidencia: Circuito b) resuelto en el cuaderno\n- Evidencia: Cálculo de salida de la resistencia limitadora\n\nSesión 4 (50 min): Práctica 1: semiconductores, diodos y condensadores\nReto: Resolver la Práctica 1 (cuestionario de semiconductores y análisis de circuitos con diodos) y conocer el condensador y su polaridad.\n- Condensadores en 10 minutos (10 min). Con el apartado «Condensadores» de la web de teoría: el condensador almacena carga y la suelta después (como un depósito de agua); animación de carga y descarga. Electrolíticos (con polaridad: patilla larga +, franja −) y cerámicos (sin polaridad). Ejemplo: el flash de una cámara o el LED del cargador que tarda en apagarse.\n- Práctica 1 · Ejercicio 1: cuestionario (12 min). Individual. Las 10 preguntas de opción múltiple de la ficha «Introducción y diodos» (electrones, silicio, semiconductores a baja temperatura, enlaces covalentes, dopado, tipo N y tipo P, polarización directa e inversa).\n- Práctica 1 · Ejercicio 2: circuitos a) a g) (20 min). Individual. Señalar qué bombillas o LED se encienden en los circuitos a) a g). El docente pasa por las mesas; en el f) y el g) recuerda que dos diodos opuestos en paralelo siempre dejan pasar la corriente por uno de ellos.\n- Corrección y entrega (8 min). Se corrigen en voz alta las preguntas más falladas, cada estudiante marca sus errores en otro color y sube la foto o el PDF a la Tarea 3.1.\n- Moodle Centros: Tarea «3.1 · Práctica 1: introducción y diodos» (corrección Apto / No apto). Comprobar que cada estudiante ha resuelto y corregido la Práctica 1 en clase.\n- Evidencia: Práctica 1 resuelta y corregida (Tarea 3.1)\n\nSesión 5 (50 min): Resistencias variables y transistor: circuitos que reaccionan solos\nReto: Entender cómo cambian la LDR, la NTC, la PTC y el potenciómetro, usar el transistor como interruptor y resolver las actividades de análisis y cálculo de la Práctica 2.\n- Resistencias que cambian (10 min). Con el laboratorio de resistencias variables de la web de teoría: potenciómetro (se ajusta girando: volumen de un altavoz), LDR (menos luz → más resistencia: farola automática), NTC (más temperatura → menos resistencia) y PTC (más temperatura → más resistencia). Se apuntan con flechas en el cuaderno.\n- El transistor como interruptor (10 min). Apartado «Transistores» de la web de teoría: colector, base y emisor; NPN y PNP. Una pequeña corriente en la base deja pasar una corriente grande entre colector y emisor (como el grifo que abre una manguera).\n- El interruptor de luz automático (8 min). Circuito n.º 1 de la web de teoría (LDR + transistor + LED): al oscurecer sube la resistencia de la LDR, cambia la tensión de la base y el transistor enciende el LED. Se anuncia que este es el circuito de las farolas de la Smart City.\n- Práctica 2: análisis y cálculo (18 min). Individual, de la ficha «Tema completo»: actividad 1 (circuito h), actividad 2 (resistencia limitadora de un LED de 1,5 V y 35 mA a 9 V), actividad 4 (tabla del código de colores), actividad 5 (relacionar símbolos), actividad 8 (motor con NTC al subir la temperatura) y actividad 9 (qué resistencia usarías). Los montajes (actividades 3, 6, 7 y 10) se harán en las sesiones 7 y 8.\n- Entrega (4 min). Foto o PDF de las actividades a la Tarea 3.2.\n- Moodle Centros: Tarea «3.2 · Práctica 2: análisis y cálculo de circuitos» (corrección Apto / No apto). Comprobar que cada estudiante ha resuelto en clase las actividades de análisis y cálculo de la Práctica 2.\n- Evidencia: Actividades 1, 2, 4, 5, 8 y 9 de la Práctica 2 (Tarea 3.2)\n\nSesión 7 (50 min): Montajes en Tinkercad: potenciómetro, LDR y transistor\nReto: Entrenar el montaje simulado de circuitos con LED, potenciómetro, LDR y transistor antes de la práctica evaluable.\n- Tinkercad Circuits en 8 minutos (8 min). El docente monta en directo un LED con su resistencia en la protoboard virtual: cómo se conectan las filas, cómo se cambia el valor de la resistencia y cómo se mide con el multímetro. Cada estudiante entra con su cuenta del centro.\n- Actividad 3: LED y potenciómetro (12 min). Ficha «Actividades de electrónica analógica»: montar un LED en polarización directa con una resistencia limitadora y un potenciómetro. Responder: para qué sirve la resistencia en serie, qué pasa con el brillo al girar el eje y cómo se relaciona con la ley de Ohm.\n- Actividad 4: el circuito con LDR (12 min). Montar el circuito con LDR (330 Ω + 220 Ω, LED y LDR) y cambiar la luz con el control del simulador. Describir qué cambia y por qué.\n- Actividad 7: el transistor con pulsador (13 min). Montar el circuito del transistor NPN con pulsador de la ficha. Explicar qué pasa al pulsar (corriente de base → el transistor conduce → el LED se enciende).\n- Cierre (5 min). Cada estudiante guarda sus diseños con un nombre claro (S7potenciometro, S7LDR, S7transistor) para reutilizarlos en la práctica de la próxima sesión.\n- Evidencia: Diseños guardados en Tinkercad\n- Evidencia: Respuestas de las actividades 3, 4 y 7 en el cuaderno\n\nSesión 8 (50 min): Reto: montaje de circuitos físicos y simulados\nReto: Calcular resistencias limitadoras, montar cuatro circuitos con LED (en Tinkercad y, si hay material, en protoboard) y explicar lo que se observa.\n- Ponte a prueba (8 min). Individual, en la plantilla A1 (reto «Montaje de circuitos»): calcular la resistencia limitadora de un LED de 1,5 V y 35 mA conectado a 9 V con la fórmula, los datos y el resultado.\n- Circuito 1: LED rojo con 330 Ω + 220 Ω (10 min). Montaje del circuito 1 en Tinkercad (y en protoboard con el kit cuando haya material en el aula). Captura o foto en la plantilla y explicación de por qué se usan dos resistencias en serie (550 Ω ≥ 355 Ω).\n- Circuito 2: tres LED en serie (12 min). Calcular la resistencia para tres LED en serie (rojo 1,5 V, verde 2 V, amarillo 2 V) con 9 V e I = 15 mA: R = (9 − 5,5) / 0,015 ≈ 233 Ω, elegir el valor comercial y montarlo.\n- Circuitos 3 y 4: observar y explicar (12 min). Circuito 3: LED transparente con 330 Ω + 220 Ω; circuito 4: LED pequeño en serie con un motor. Describir qué ocurre y explicarlo con lo aprendido (polarización, corriente, ley de Ohm).\n- Revisión y entrega (8 min). Cada estudiante repasa el «Antes de entregar» de la plantilla A1, la descarga en PDF y la sube a la Tarea 3.3.\n- Moodle Centros: Tarea «3.3 · Reto: montaje de circuitos» (evaluada con rúbrica 1-3-5-7-10). Evaluar con rúbrica la práctica de montaje de circuitos físicos y simulados (plantilla A1).\n- Evidencia: Plantilla A1 con cálculos, capturas y explicaciones (Tarea 3.3)", "temporalizacion": "6 sesiónes", "recursos": "Proyector, Web de teoría, Placa de un aparato viejo, LED y resistencias del kit, Calculadora, Ficha Práctica 1, Moodle Centros, Ficha Práctica 2, Ordenadores, Tinkercad Circuits, Ficha de actividades, Kits de electrónica", "descriptores": "CD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCP2. A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nTEC.4.1.2.Aplicar con iniciativa estrategias colaborativas de gestión de proyectos y técnicas de resolución de problemas iterativas e innovadoras que den lugar a la elaboración o mejora de soluciones a problemas detectados.\nTEC.4.4.1.Diseñar, construir, controlar o simular sistemas automáticos o robots empleando los elementos físicos (hardware), así como programas de control y lenguajes de programación adecuados (software), respondiendo a una necesidad concreta.", "ejercicios": "Clasifica seis aparatos según su función sea principalmente eléctrica o electrónica.\nClasifica materiales en conductores, aislantes y semiconductores.\nDibuja el símbolo del diodo y señala ánodo, cátodo, zona P y zona N.\nIndica qué bombillas se encienden en el circuito b) según la polarización de sus diodos.\nCalcula el valor nominal, máximo y mínimo de dos resistencias del kit.\nCalcula la resistencia limitadora de un LED de 2 V y 15 mA conectado a 9 V.\nResponde las 10 preguntas de opción múltiple sobre semiconductores y diodos.\nIndica qué bombillas o LED se encienden en los circuitos a) a g).\nCalcula la resistencia limitadora de un LED de 1,5 V y 35 mA conectado a 9 V.\nCompleta la tabla de valores nominal, máximo y mínimo de tres resistencias.\nRelaciona cada símbolo con su componente y su comportamiento.\nExplica qué le pasa al motor del circuito con NTC cuando sube la temperatura.\nMonta un LED con resistencia limitadora y potenciómetro y explica qué ocurre al girar el eje.\nMonta el circuito con LDR y describe cómo influye la luz.\nMonta el circuito del transistor con pulsador y explica lo que ocurre.\nCalcula la resistencia limitadora de un LED de 1,5 V y 35 mA conectado a 9 V.\nMonta el circuito 1 con un LED rojo y dos resistencias en serie de 330 Ω y 220 Ω.\nCalcula la resistencia para tres LED en serie con 9 V e I = 15 mA y monta el circuito 2.\nMonta los circuitos 3 y 4 y explica lo que observas.", "metodologias": "Instrucción directa con práctica guiada, Evaluación formativa, Aprendizaje por descubrimiento con simuladores", "sesiones": [1, 2, 4, 5, 7, 8]}, {"titulo": "Prueba escrita de electrónica analógica", "tipo": "Estructuración", "abreviatura": "EST2", "orden": "2", "tarea": "3.4 · Prueba escrita de electrónica analógica", "descripcion": "Sesión 10 (50 min): Repaso para la prueba: entrenamos con ejercicios tipo examen\nReto: Repasar los contenidos de la prueba escrita con ejercicios graduados y detectar las dudas que quedan.\n- Quiz relámpago (10 min). Quiz de la web de clase y quiz final de la web de teoría, respondiendo a mano alzada o en el cuaderno.\n- Estaciones de repaso multinivel (30 min). Cuatro estaciones de 7 minutos con tres niveles (A recordar, B aplicar, C analizar): 1) código de colores y tolerancia; 2) ley de Ohm con uno y varios LED; 3) polarización de diodos y qué lámparas se encienden; 4) semiconductores, resistencias variables y transistor. Cada estudiante elige el nivel en cada estación y se corrige con las soluciones de la diapositiva.\n- Dudas y lista de la prueba (10 min). Se resuelven las dudas más repetidas y se proyecta qué entra en la prueba y cómo se puntúa (10 preguntas de 1 punto).\n- Evidencia: Ejercicios de las estaciones corregidos en el cuaderno\n\nSesión 11 (50 min): Prueba escrita de electrónica analógica\nReto: Demostrar en una prueba individual lo aprendido sobre componentes, análisis de circuitos y cálculo de resistencias.\n- Instrucciones (5 min). Se reparte la prueba (versión en español y, para quien la necesite, con la traducción al árabe de los enunciados). Se recuerda que los valores máximo y mínimo y los cálculos deben estar justificados con operaciones.\n- Prueba escrita (40 min). Individual: 10 preguntas de 1 punto (código de colores, polarización y P y N del diodo, verdadero o falso, resistencia limitadora, lámparas que se encienden, polarización de 8 diodos, opción múltiple, LED en serie, resistencias variables y transistor).\n- Recogida (5 min). Recogida de la prueba. Quien termine antes repasa sus operaciones. El alumnado con más tiempo concedido continúa en el recreo o en la sesión siguiente según lo acordado.\n- Moodle Centros: Tarea «3.4 · Prueba escrita de electrónica analógica» (nota directa de 0 a 10). Recoger la nota de la prueba escrita (de 0 a 10, suma de las 10 preguntas de 1 punto). No hay entrega: el docente introduce la nota, que se sincroniza con Séneca.\n- Evidencia: Prueba escrita (Tarea 3.4)", "temporalizacion": "2 sesiónes", "recursos": "Proyector, Web de teoría, Calculadora, Prueba impresa", "descriptores": "CD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCD5. Desarrolla aplicaciones informáticas sencillas y soluciones tecnológicas creativas y sostenibles para resolver problemas concretos o responder a retos propuestos, mostrando interés y curiosidad por la evolución de las tecnologías digitales y por su desarrollo sostenible y uso ético.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCP2. A partir de sus experiencias, realiza transferencias entre distintas lenguas como estrategia para comunicarse y ampliar su repertorio lingüístico individual.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nCPSAA5. Planea objetivos a medio plazo y desarrolla procesos metacognitivos de retroalimentación para aprender de sus errores en el proceso de construcción del conocimiento.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM3. Plantea y desarrolla proyectos diseñando, fabricando y evaluando diferentes prototipos o modelos para generar o utilizar productos que den solución a una necesidad o problema de forma creativa y en equipo, procurando la participación de todo el grupo, resolviendo pacíficamente los conflictos que puedan surgir, adaptándose ante la incertidumbre y valorando la importancia de la sostenibilidad.", "trazabilidad": "Prueba escrita", "vinculacion": "Trazabilidad: Prueba escrita\nTEC.4.1.2.Aplicar con iniciativa estrategias colaborativas de gestión de proyectos y técnicas de resolución de problemas iterativas e innovadoras que den lugar a la elaboración o mejora de soluciones a problemas detectados.\nTEC.4.4.1.Diseñar, construir, controlar o simular sistemas automáticos o robots empleando los elementos físicos (hardware), así como programas de control y lenguajes de programación adecuados (software), respondiendo a una necesidad concreta.", "ejercicios": "Calcula el valor nominal, máximo y mínimo de una resistencia a partir de sus colores.\nCalcula la resistencia limitadora de uno y de varios LED en serie.\nIndica la polarización de los diodos de un circuito y qué lámparas se encienden.\nPrueba escrita de 10 preguntas sobre componentes electrónicos, polarización de diodos y cálculo de resistencias.", "metodologias": "Evaluación formativa, Instrucción directa con práctica guiada", "sesiones": [10, 11]}, {"titulo": "Smart City (parte 1): diseño y construcción", "tipo": "Conclusión", "abreviatura": "CON1", "orden": "3", "tarea": "3.5 · Proyecto Smart City (parte 1): diseño y construcción", "descripcion": "Sesión 3 (50 min): Taller I: conocemos el material y aceptamos el reto Smart City\nReto: Conocer el material de electrónica y del taller con sus normas de seguridad, formar las parejas y calcular la escala de la maqueta con un coche de juguete.\n- Normas de seguridad del taller (5 min). Repaso de las normas: herramientas en su sitio, pistola termofusible y soldador solo con el docente delante y sobre su soporte, cúter con regla metálica y cortando hacia fuera, pila desconectada mientras se monta.\n- El material que vamos a usar (15 min). Demostración en la mesa del docente: protoboard (cómo se conectan sus filas y columnas), pila de 9 V con portapilas, LED, resistencias, potenciómetro, LDR, NTC, transistor BC547, pulsador, cables de conexión y polímetro. Herramientas: alicates, pelacables, segueta, cúter, regla metálica, pistola termofusible. Material de la maqueta: base de cartón pluma o contrachapado de 30 × 40 cm, cartulinas, palillos y pajitas para farolas.\n- Presentación del reto Smart City (10 min). Se lee el encargo del reto y la definición de Smart City de la ficha del reto y se proyecta el vídeo de la Fase 1 (introducción a las ciudades inteligentes) y el de un proyecto similar. Se explican los tres sistemas: parking con barrera automática, alumbrado automático y semáforos, y que en esta primera parte se diseña y construye la maqueta; la programación llega en la parte 2.\n- Parejas y escala (15 min). Formación de 9 parejas y 1 trío (heterogéneas, propuestas por el docente). Cada pareja copia su cuaderno de proyecto A2, mide el ancho de su coche de juguete y calcula su escala: escala = medida del coche de juguete / 180 cm (ejemplo de la ficha: 3 cm / 180 cm = 1:60). Con la escala comprueban cuántos metros reales caben en el panel de 30 × 40 cm.\n- Cierre y orden (5 min). Cada pareja anota su escala en el diario de taller del cuaderno A2 y recoge su puesto.\n- Evidencia: Escala de la maqueta en el cuaderno A2\n- Evidencia: Parejas formadas\n\nSesión 6 (50 min): Taller II: croquis a escala y base de la ciudad\nReto: Terminar el croquis detallado de la Smart City con medidas a escala y empezar a trazar la ciudad sobre la base de 30 × 40 cm.\n- Repaso de la escala (5 min). Cada pareja comprueba su escala con el docente. Ejemplo a 1:60: una calle de dos carriles de 7 m reales mide 700 / 60 ≈ 11,7 cm en la maqueta.\n- Tabla de medidas y croquis (20 min). En el cuaderno A2, cada pareja pasa a su escala las medidas reales orientativas (carril 3,5 m, acera 2 m, plaza de parking 2,5 × 5 m, farola 5 m, semáforo 3 m, edificio de 4 plantas 12 m) y dibuja el croquis con cotas y anotaciones: ubicación de farolas, semáforos, barrera del parking, zonas verdes y por dónde irán los cables.\n- Trazado sobre la base (20 min). Con regla y lápiz pasan el croquis a la base de 30 × 40 cm; empiezan a cortar con cúter y regla metálica las cartulinas de calles y aceras. El docente revisa que dejan agujeros previstos para farolas y semáforos.\n- Diario y orden (5 min). Anotan en el diario de taller qué han hecho, qué problema han tenido y cómo lo resolverán. Recogen el puesto.\n- Evidencia: Tabla de medidas y croquis en el cuaderno A2\n- Evidencia: Base de la maqueta trazada\n- Evidencia: Entrada del diario de taller\n\nSesión 9 (50 min): Taller III: construimos la ciudad y su alumbrado\nReto: Construir calles, edificios y parking de la maqueta y montar las farolas con LED y su resistencia.\n- Plan del día (5 min). Cada pareja mira su plan de construcción del cuaderno A2 y se reparte las tareas de la sesión (quien construye edificios y parking, quien prepara las farolas).\n- Construcción de la ciudad (22 min). Pegado de calles y aceras, pasos de peatones, plazas de parking (comprobando con el coche patrón), edificios de cartulina o cartón, zonas verdes y huecos de la barrera del parking y de los semáforos para la parte 2.\n- Farolas con LED (18 min). Las farolas se hacen con pajitas o palillos y un LED en la punta; los cables bajan por dentro y pasan bajo la base. Cada LED lleva su resistencia calculada y los LED se conectan en paralelo a la alimentación. Se prueban con la pila antes de fijarlos. El docente supervisa la pistola termofusible y, si hace falta, el soldador.\n- Diario y orden (5 min). Entrada del diario de taller (qué hemos hecho, qué falló, cómo lo hemos arreglado) y recogida.\n- Evidencia: Maqueta en construcción con farolas probadas\n- Evidencia: Entrada del diario de taller\n\nSesión 12 (50 min): Taller IV: terminamos, integramos y probamos la maqueta\nReto: Terminar la maqueta, ordenar el cableado, probar todo el alumbrado y dejar preparados el parking y los semáforos para la parte 2.\n- Lista de lo que falta (5 min). Cada pareja revisa la lista de comprobación de la maqueta del cuaderno A2 y marca lo que falta.\n- Acabados y cableado (20 min). Acabados de edificios, señales y zonas verdes; los cables del alumbrado se agrupan bajo la base y se etiquetan; se fija la barrera del parking (de palillo o cartulina) y las torretas de los semáforos con sus huecos.\n- Ampliación: alumbrado automático con LDR (15 min). Las parejas que tengan el alumbrado terminado montan en una mini protoboard bajo la base el interruptor de luz automático (LDR, transistor BC547 y resistencias) del circuito n.º 1 de la teoría, con la LDR asomando en un tejado. El resto termina y prueba sus farolas.\n- Prueba final y diario (10 min). Prueba de todas las farolas con la pila delante del docente; foto de la maqueta sin personas para el cuaderno; entrada del diario con el problema más difícil y cómo se resolvió.\n- Evidencia: Maqueta terminada con alumbrado probado\n- Evidencia: Foto de la maqueta y entrada del diario\n\nSesión 13 (50 min): Simulamos el alumbrado y entregamos el cuaderno de proyecto\nReto: Simular en Tinkercad el alumbrado de la Smart City, completar el cuaderno de proyecto y entregarlo con la foto de la maqueta.\n- La farola automática en Tinkercad (20 min). Individual o por parejas: montar en Tinkercad el alumbrado de la maqueta (LED en paralelo con su resistencia) y, como ampliación, el interruptor de luz automático (LDR, transistor BC547 y resistencias), comprobando con el control de luz que se encienden al oscurecer. Captura para el cuaderno A2: es el circuito que se programará en la parte 2.\n- Completar el cuaderno de proyecto (20 min). Por parejas, en el cuaderno A2: tabla de medidas y croquis definitivos, cálculo de la resistencia de las farolas, diario de las cuatro sesiones de taller, foto de la maqueta sin personas y el apartado «¿A quién ayuda nuestra ciudad?».\n- Revisión y entrega (10 min). Cada pareja repasa el «Antes de entregar» del cuaderno A2, lo descarga en PDF y lo sube a la Tarea 3.5. Se anuncia la parte 2: programar farolas, barrera y semáforos y presentar la Smart City.\n- Moodle Centros: Tarea «3.5 · Proyecto Smart City (parte 1): diseño y construcción» (evaluada con rúbrica 1-3-5-7-10). Evaluar con rúbrica el diseño y la construcción de la maqueta de cada pareja a partir del cuaderno A2 (PDF con la foto) y de la maqueta revisada en el taller en la sesión 12.\n- Evidencia: Simulación del alumbrado en Tinkercad\n- Evidencia: Cuaderno A2 con la foto de la maqueta (Tarea 3.5)", "temporalizacion": "5 sesiónes", "recursos": "Taller, Kits de electrónica, Coches de juguete, Regla y calculadora, Base de 30 × 40 cm, Regla, cúter y cartulinas, LED, resistencias y cables, Pistola termofusible, Cartulinas y pajitas, Mini protoboard y LDR, Ordenadores, Tinkercad Circuits, Moodle Centros", "descriptores": "CC4. Comprende las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, y adopta, de forma consciente y motivada, un estilo de vida sostenible y ecosocialmente responsable.\nCCEC4. Conoce, selecciona y utiliza con creatividad diversos medios y soportes, así como técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para la creación de productos artísticos y culturales, tanto de forma individual como colaborativa, identificando oportunidades de desarrollo personal, social y laboral, así como de emprendimiento.\nCD1. Realiza búsquedas en internet atendiendo a criterios de validez, calidad, actualidad y fiabilidad, seleccionando los resultados de manera crítica y archivándolos, para recuperarlos, referenciarlos y reutilizarlos, respetando la propiedad intelectual.\nCD2. Gestiona y utiliza su entorno personal digital de aprendizaje para construir conocimiento y crear contenidos digitales, mediante estrategias de tratamiento de la información y el uso de diferentes herramientas digitales, seleccionando y configurando la más adecuada en función de la tarea y de sus necesidades de aprendizaje permanente.\nCD3. Se comunica, participa, colabora e interactúa compartiendo contenidos, datos e información mediante herramientas o plataformas virtuales, y gestiona de manera responsable sus acciones, presencia y visibilidad en la red, para ejercer una ciudadanía digital activa, cívica y reflexiva.\nCE1. Analiza necesidades y oportunidades y afronta retos con sentido crítico, haciendo balance de su sostenibilidad, valorando el impacto que puedan suponer en el entorno, para presentar ideas y soluciones innovadoras, éticas y sostenibles, dirigidas a crear valor en el ámbito personal, social, educativo y profesional.\nCE3. Desarrolla el proceso de creación de ideas y soluciones valiosas y toma decisiones, de manera razonada, utilizando estrategias ágiles de planificación y gestión, y reflexiona sobre el proceso realizado y el resultado obtenido, para llevar a término el proceso de creación de prototipos innovadores y de valor, considerando la experiencia como una oportunidad para aprender.\nCPSAA3. Comprende proactivamente las perspectivas y las experiencias de las demás personas y las incorpora a su aprendizaje, para participar en el trabajo en grupo, distribuyendo y aceptando tareas y responsabilidades de manera equitativa y empleando estrategias cooperativas.\nCPSAA4. Realiza autoevaluaciones sobre su proceso de aprendizaje, buscando fuentes fiables para validar, sustentar y contrastar la información y para obtener conclusiones relevantes.\nSTEM1. Utiliza métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas y selecciona y emplea diferentes estrategias para resolver problemas analizando críticamente las soluciones y reformulando el procedimiento, si fuera necesario.\nSTEM2. Utiliza el pensamiento científico para entender y explicar los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, planteándose preguntas y comprobando hipótesis mediante la experimentación y la indagación, utilizando herramientas e instrumentos adecuados, apreciando la importancia de la precisión y la veracidad y mostrando una actitud crítica acerca del alcance y las limitaciones de la ciencia.\nSTEM5. Emprende acciones fundamentadas científicamente para promover la salud física, mental y social, y preservar el medio ambiente y los seres vivos; y aplica principios de ética y seguridad en la realización de proyectos para transformar su entorno próximo de forma sostenible, valorando su impacto global y practicando el consumo responsable.", "trazabilidad": "RÚBRICA", "vinculacion": "Trazabilidad: RÚBRICA\nTEC.4.1.1.Idear y planificar soluciones tecnológicas emprendedoras que generen un const S = DATA.sa, CUR = DATA.cur, IDX = DATA.idx;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const KIND = {ce:'Competencia específica', cr:'Criterio de evaluación', sb:'Saber básico', de:'Descriptor operativo del Perfil de salida'};
function chip(code, extra=''){ const it = CUR[code]; const k = it ? it.tipo : 'sb'; return `<button type="button" class="chip ${k} ${extra}" data-code="${esc(code)}" title="Ver texto oficial">${esc(code)}</button>`; }
function chips(list, extra){ return arr(list).map(c => chip(c, extra)).join(''); }
function tname(m){ return esc(m.nombre); }
function corrBadge(m){ return m.correccion==='apto'?'<span class="badge" style="background:var(--sb-bg);color:var(--sb)">Apto / No apto</span>':(m.correccion==='rubrica'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Rúbrica 1-3-5-7-10</span>':(m.correccion==='directa'?'<span class="badge" style="background:var(--cr-bg);color:var(--cr)">Nota directa 0-10</span>':'')); }
function ul(list){ return `<ul class="clean">${arr(list).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }

/* ---------- modal ---------- */
function openModal(code){
  const it = CUR[code]; if(!it) return;
  $('#m-kind').textContent = KIND[it.tipo] || '';
  $('#m-title').textContent = code;
  let h = `<p>${esc(it.texto)}</p>`;
  if(it.tipo==='cr'){
    h += `<div class="lab">Competencia específica</div>${chip(it.competencia)}`;
    const used = new Set(IDX.saberes);
    h += `<div class="lab">Saberes básicos vinculados oficialmente</div>${arr(it.saberes).map(s => chip(s, used.has(s)||IDX.saberes.some(u=>u.startsWith(s+'.'))?'':'off')).join('')}`;
    h += `<p class="note">Los saberes tachados no se movilizan en esta situación de aprendizaje.</p>`;
    const ses = IDX.sesionesPorCriterio[code] || [];
    if(ses.length) h += `<div class="lab">Sesiones donde se trabaja</div><p>${ses.map(n=>'S'+n).join(', ')}</p>`;
  }
  if(it.tipo==='ce') h += `<div class="lab">Descriptores del Perfil de salida</div>${chips(it.descriptores)}`;
  if(it.tipo==='sb' && it.hijos && it.hijos.length) h += `<div class="lab">Incluye</div>${chips(it.hijos)}`;
  if(it.tipo==='sb' && it.criterios && it.criterios.length) h += `<div class="lab">Criterios que lo vinculan</div>${chips(it.criterios)}`;
  if(it.tipo==='de' && it.competencias && it.competencias.length) h += `<div class="lab">Competencias de esta SdA conectadas</div>${chips(it.competencias)}`;
  $('#m-body').innerHTML = h; $('#modal').classList.add('on'); $('#m-close').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-code]'); if(c){ openModal(c.dataset.code); return; }
  if(e.target.id==='modal' || e.target.closest('#m-close')) closeModal();
  const cp = e.target.closest('.copy'); if(cp){ const t = cp.closest('.copybox').querySelector('pre').innerText; navigator.clipboard && navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copiado ✓'; setTimeout(()=>cp.textContent='Copiar',1500);}); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
$('#theme').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

/* ---------- 2. secuenciación ---------- */
(function(){
  const COLORS = ['#2563eb','#0891b2','#0f766e','#7c3aed','#b45309','#be123c'];
  const fases = arr(S.fases);
  const total = S.sesiones.length;
  const fcol = {}; fases.forEach((f,i)=>fcol[f.nombre]=COLORS[i%COLORS.length]);
  const count = f => S.sesiones.filter(s=>s.fase===f.nombre).length;
  let h = `<div class="card"><h2>Distribución temporal</h2><div class="timeline">${fases.map(f=>`<div style="flex:${count(f)};background:${fcol[f.nombre]}">${esc(f.nombre)} · ${count(f)} ses.</div>`).join('')}</div>
    <div class="grid g2" style="margin-top:12px">${fases.map(f=>`<div><b style="color:${fcol[f.nombre]}">${esc(f.nombre)}</b> (sesiones ${esc(f.sesiones||'')}) — ${esc(f.finalidad||'')} · ${Math.round(count(f)/total*100)} %</div>`).join('')}</div></div>`;
  const duaSet = [...new Set(S.sesiones.flatMap(s=>arr(s.dua && s.dua.principios)))];
  h += `<div class="filters" id="ff"><span class="legend">Fase:</span><button class="on" data-f="*">Todas</button>${fases.map(f=>`<button data-f="${esc(f.nombre)}">${esc(f.nombre)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">DUA:</span>${duaSet.map(d=>`<button data-d="${esc(d)}">${esc(d)}</button>`).join('')}
    <span class="legend" style="margin-left:10px">Moodle:</span><button data-m="1">Con actividad Moodle</button>
    <button data-open="1" style="margin-left:auto">Desplegar todas</button></div><div id="slist"></div>`;
  $('#p-seq').innerHTML = h;
  const state = {f:'*', d:null, m:false};
  function render(){
    const list = S.sesiones.filter(s => (state.f==='*'||s.fase===state.f) && (!state.d || arr(s.dua&&s.dua.principios).includes(state.d)) && (!state.m || arr(s.moodle).length));
    $('#slist').innerHTML = list.map(s => `<details class="ses" data-n="${s.n}"><summary><div class="num" style="background:${fcol[s.fase]}22;color:${fcol[s.fase]}">${s.n}</div>
      <div><div class="stitle">Sesión ${s.n} · ${esc(s.titulo)} <span class="badge">${esc(s.fase)}</span>${arr(s.moodle).length?'<span class="badge" style="background:var(--moodle-bg);color:var(--moodle)">Moodle</span>':''}</div><div class="sreto">${esc(s.reto)}</div></div></summary>
      <div class="sbody"><div>${arr(s.actividades).map(a=>`<div class="act"><b>${esc(a.nombre)}</b><span class="min">${a.min?esc(a.min)+' min':''}</span><p>${esc(a.desc)}</p></div>`).join('')}
        ${arr(s.moodle).length?`<div class="moodle"><div class="mh">Integración con Moodle Centros</div>${arr(s.moodle).map(m=>`<div class="mitem"><div class="mt">${esc(m.recurso)} · «${esc(m.nombre)}»${corrBadge(m)}${m.criterio?' '+chip(m.criterio):''}</div><p>${esc(m.uso)}</p>${m.correccion==='apto'?`<div class="lab">Se verifica</div>${ul(m.cotejo)}`:''}${m.correccion==='directa'&&arr(m.cotejo).length?`<div class="lab">Puntuación</div>${ul(m.cotejo)}`:''}${m.correccion==='rubrica'?`<p class="note">Se evalúa con la rúbrica de la pestaña «6. Evaluación».</p>`:''}${arr(m.config).length?`<div class="lab">Configuración</div>`+ul(m.config):''}</div>`).join('')}</div>`:''}
      </div><div class="side">
        <div class="lab">Criterios</div>${arr(s.criterios).length?chips(s.criterios):'<span class="note">Evaluación diagnóstica (no calificable)</span>'}
        <div class="lab">Saberes</div>${chips(s.saberes)}
        ${arr(s.metodologia).length?`<div class="lab">Metodología</div><p>${arr(s.metodologia).map(esc).join(' · ')}</p>`:''}
        ${arr(s.evidencias).length?`<div class="lab">Evidencias</div>${ul(s.evidencias)}`:''}
        ${arr(s.recursos).length?`<div class="lab">Recursos</div><p>${arr(s.recursos).map(esc).join(' · ')}</p>`:''}
        ${s.dua?`<div class="lab">DUA (${arr(s.dua.principios).map(esc).join(', ')})</div><p>${esc(s.dua.medidas)}</p>`:''}
      </div></div></details>`).join('') || '<p class="note">Ninguna sesión coincide con el filtro.</p>';
  }
  $('#ff').onclick = e => { const b = e.target.closest('button'); if(!b) return;

    if(b.dataset.f){ state.f=b.dataset.f; $('#ff').querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); }

  render();
})();
