<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Contenidos de clase — Informática</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="titulo-link">
      <h1>📚 Contenidos de clase</h1>
    </a>
    <p class="subtitle">Informática — organizado por curso, asignatura y unidad</p>
  </header>

  <div class="app-layout">
    <nav id="menu-container" aria-label="Menú de contenidos">
      <input
        type="search"
        id="buscador"
        placeholder="🔍 Buscar contenido…"
        aria-label="Buscar en el menú"
      >
      <div id="menu">
        <p class="loading">Cargando menú…</p>
      </div>
    </nav>

    <section id="content-area">
      <div id="content-toolbar" hidden>
        <a id="open-fullscreen" href="#" target="_blank" rel="noopener">↗ Abrir en pestaña nueva (pizarra digital)</a>
      </div>
      <iframe
        id="content-frame"
        title="Contenido"
        srcdoc="<!doctype html><html><body style='font-family:system-ui,sans-serif;color:#64748b;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:0 2rem;'><p>Selecciona un contenido del menú de la izquierda para empezar 👈</p></body></html>"
      ></iframe>
    </section>
  </div>

  <script src="js/menu.js"></script>
</body>
</html>
