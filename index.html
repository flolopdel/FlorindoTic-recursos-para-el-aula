<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Aula TIC de Florindo — Tecnología e informática</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Recursos de aula de Tecnología, Digitalización y Computación y Robótica: situaciones de aprendizaje, presentaciones, teoría y prácticas.">
  <meta name="theme-color" content="#4c1d95">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <script>
    // Aplicar el tema antes de pintar para evitar parpadeo.
    try {
      var t = localStorage.getItem('aula-tema');
      if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="saltar" href="#content-frame">Saltar al contenido</a>

  <header class="cabecera">
    <button class="icon-btn" id="btn-menu" aria-label="Mostrar u ocultar el menú" aria-controls="sidebar" aria-expanded="true">☰</button>
    <a href="./" class="marca">
      <span class="marca-icono" aria-hidden="true">📚</span>
      <span>
        <strong>Aula TIC de Florindo</strong>
        <small>Tecnología e informática</small>
      </span>
    </a>
    <div class="cabecera-acciones">
      <button class="icon-btn" id="btn-tema" aria-label="Cambiar tema claro/oscuro" title="Tema claro / oscuro">🌓</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Menú de contenidos">
      <div class="buscador">
        <input type="search" id="buscador" placeholder="Buscar en títulos y contenido…" aria-label="Buscar contenido" autocomplete="off">
        <kbd title="Pulsa / para buscar">/</kbd>
      </div>

      <section id="recientes" class="bloque" hidden>
        <h2>🕘 Vistos recientemente</h2>
        <ul></ul>
      </section>

      <section id="resultados" class="bloque" hidden aria-live="polite">
        <h2>Resultados</h2>
        <ul></ul>
      </section>

      <div class="menu-cabecera">
        <h2>📂 Contenidos</h2>
        <div>
          <button class="link-btn" id="btn-expandir" type="button">Expandir</button>
          <button class="link-btn" id="btn-plegar" type="button">Plegar</button>
        </div>
      </div>
      <nav id="menu"><p class="cargando">Cargando menú…</p></nav>

      <footer class="sidebar-pie" id="version"></footer>
    </aside>
    <div class="velo" id="velo" hidden></div>

    <main class="contenido">
      <div class="toolbar" id="toolbar" hidden>
        <nav class="migas" id="migas" aria-label="Ruta"></nav>
        <div class="toolbar-acciones">
          <button class="tool" id="btn-anterior" title="Anterior en esta carpeta" aria-label="Anterior">◀</button>
          <button class="tool" id="btn-siguiente" title="Siguiente en esta carpeta" aria-label="Siguiente">▶</button>
          <button class="tool" id="btn-copiar" title="Copiar enlace para compartir">🔗 <span>Copiar enlace</span></button>
          <button class="tool" id="btn-qr" title="Mostrar código QR para el alumnado">▦ <span>QR</span></button>
          <button class="tool" id="btn-pizarra" title="Modo pizarra (pantalla completa)">⛶ <span>Pizarra</span></button>
          <a class="tool" id="btn-pestana" href="#" target="_blank" rel="noopener" title="Abrir en pestaña nueva">↗</a>
        </div>
      </div>
      <iframe id="content-frame" title="Contenido" src="bienvenida.html"></iframe>
    </main>
  </div>

  <dialog id="dlg-qr" aria-labelledby="qr-titulo">
    <h2 id="qr-titulo">Escanea para abrir</h2>
    <p id="qr-nombre"></p>
    <div id="qr-canvas"></div>
    <p class="qr-url" id="qr-url"></p>
    <form method="dialog"><button class="boton">Cerrar</button></form>
  </dialog>

  <div class="aviso" id="aviso" role="status" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
